<title>RESCUE · 조민규영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eeebe2;
  --card:#fbfaf6;
  --card2:#f5f3ec;
  --ink:#1a1a18;
  --sub:#8c8474;
  --gold:#a8873c;
  --gold-soft:#d8c795;
  --line:#e2ddcf;
  --ok:#2e7d4f;
  --no:#b3402f;
  --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:#161614;color:#fff;display:flex;align-items:center;height:56px;padding:0 8px;border-radius:0 0 4px 4px}
.topbar .back{width:44px;height:44px;border:none;background:none;color:#fff;font-size:22px;cursor:pointer;flex:none}
.topbar .ttl{flex:1;text-align:center;font-weight:700;font-size:17px;letter-spacing:.5px}
.topbar .sp{width:44px;flex:none}
.topbar .en{font-family:var(--serif);letter-spacing:1px}

/* progress */
.progress{height:4px;background:#dcd6c6;border-radius:2px;margin:14px 16px 6px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#6f5a22,var(--gold));border-radius:2px;transition:width .25s}
.meta{color:#6f695c;text-align:center;font-size:13.5px;margin-bottom:8px}
.meta b{color:var(--ink);font-weight:600}

.wrap{padding:8px calc(16px + env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom));flex:1}

/* home */
.home-hero{padding:calc(34px + env(safe-area-inset-top)) 16px 10px;text-align:center}
.home-hero .pre{font-family:var(--sans);font-size:13px;letter-spacing:2px;color:var(--sub);font-weight:600}
.home-hero h1{font-family:var(--serif);font-size:40px;letter-spacing:4px;margin-top:2px}
.home-hero .sub{font-family:var(--sans);font-size:13.5px;color:var(--gold);font-weight:600;margin-top:6px;letter-spacing:.5px}
.home-hero p{color:var(--sub);font-size:13px;margin-top:8px}
.grp-head{display:flex;align-items:baseline;gap:10px;margin:26px 2px 10px;color:#5d5748}
.grp-head .n{font-family:var(--serif);font-size:15px;letter-spacing:1.5px;font-weight:600}
.grp-head .rule{flex:1;border-top:1px solid #cfc8b4}
.grp-head .c{font-size:12.5px;color:var(--sub)}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 10px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(60,50,20,.05);transition:transform .08s}
.day-card:active{transform:scale(.97)}
.day-card .no{font-family:var(--serif);font-size:30px;font-weight:600}
.day-card .wc{color:var(--sub);font-size:12.5px;margin-top:2px}
.sec-label{display:flex;align-items:center;gap:8px;margin:30px 2px 10px;font-weight:700;font-size:14.5px;letter-spacing:3px;color:#3f3a2e}
.sec-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold)}
.tool-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(60,50,20,.05)}
.tool-row .ic{width:40px;height:40px;flex:none;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px}
.tool-row .tx b{display:block;font-size:15.5px}
.tool-row .tx span{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.tool-row .arr{margin-left:auto;color:#c9c2b0}
.footer{text-align:center;color:#a49c8a;font-size:12.5px;padding:26px 0 34px}
.footer::before{content:"◆";display:block;color:var(--gold-soft);font-size:9px;margin-bottom:10px}

/* day menu */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mode-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 6px 16px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(60,50,20,.05);transition:transform .08s}
.mode-btn:active{transform:scale(.96)}
.mode-btn .ic{font-size:20px;margin-bottom:8px}
.mode-btn .nm{font-size:14px;font-weight:600}
.mode-btn.dis{opacity:.4;pointer-events:none}

/* word list */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(60,50,20,.05);overflow:hidden}
.wcard .head{display:flex;align-items:flex-start;gap:12px;padding:16px;cursor:pointer}
.wcard .idx{color:#b3a67f;font-size:12px;font-family:var(--serif);padding-top:6px;width:18px;flex:none;text-align:right}
.wcard .wd{flex:1}
.wcard .wd .w{font-family:var(--serif);font-size:22px;font-weight:600}
.wcard .wd .m{color:#41403c;font-size:14.5px;margin-top:2px}
.star{border:none;background:none;font-size:20px;color:#d3cbb6;cursor:pointer;padding:4px;flex:none}
.star.on{color:var(--gold)}
.wcard .body{display:none;padding:0 16px 18px 46px;border-top:1px dashed var(--line)}
.wcard.open .body{display:block}
.wcard .body .mean-hl{display:inline-block;background:#efe6cd;border-radius:4px;padding:1px 6px;font-weight:600;margin:14px 0 4px}
.wcard .defs{color:#4b4a45;font-style:italic;font-size:14.5px;margin:10px 0;font-family:Georgia,serif;line-height:1.6}
.wcard .defs div{margin-bottom:4px}
.pair{border-left:3px solid var(--gold-soft);padding:2px 0 2px 12px;margin:10px 0}
.pair .en{font-size:15px;font-weight:500}
.pair .ko{color:var(--sub);font-size:13.5px;margin-top:1px}
.tagline{margin-top:12px;font-size:13.5px;color:#5d5748}
.tagline b{color:var(--ink)}
.tagline .lbl{display:inline-block;font-size:11px;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold-soft);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:1px}

/* quiz common */
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin:14px 0 20px;box-shadow:0 1px 3px rgba(60,50,20,.06);position:relative}
.qbox::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;background:var(--gold-soft);border-radius:0 3px 3px 0}
.qword{font-family:var(--serif);font-size:40px;font-weight:600;text-align:center;letter-spacing:.5px}
.qphrase{font-size:22px;font-family:var(--serif);font-weight:500;line-height:1.5}
.qphrase u{text-decoration:none;border-bottom:2px solid var(--gold);color:#6b5417;font-weight:600}
.qphrase .blank{display:inline-block;min-width:86px;border-bottom:2px solid var(--gold);margin:0 4px}
.qko{color:#5d5748;font-size:14.5px;margin-top:10px}
.qdef{font-style:italic;color:#4b4a45;font-family:Georgia,serif;font-size:15.5px;margin-top:14px;line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
.qask{text-align:center;color:#6f695c;font-size:14.5px;margin:4px 0 16px}
.qask b{font-family:var(--serif)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;font-size:15.5px;cursor:pointer;font-family:var(--sans);box-shadow:0 1px 2px rgba(60,50,20,.04);transition:background .12s,border-color .12s}
.opt .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);color:#8c8474;font-size:12px;display:flex;align-items:center;justify-content:center}
.opt .en{font-family:var(--serif);font-size:17px;font-weight:600}
.opt .poslbl{display:block;font-size:11.5px;color:var(--gold);letter-spacing:1px;margin-bottom:3px}
.opt.correct{background:#e8f2e9;border-color:#9cc5a6}
.opt.wrong{background:#f7e6e1;border-color:#dba598}
.opt.reveal{border-color:#9cc5a6}
.opt:disabled{cursor:default}
.pairq{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0}
.pairq .pw{font-family:var(--serif);font-size:26px;font-weight:600}
.pairq .q{width:40px;height:40px;flex:none;border:2px dashed var(--gold-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.duo .opt{justify-content:center;margin:0}
.duo .opt .sym{color:var(--gold);font-weight:700;margin-right:6px}

/* flash card */
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:380px;margin:16px 0;padding:30px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(60,50,20,.07);position:relative}
.flash .fw{font-family:var(--serif);font-size:42px;font-weight:600}
.flash .fd{font-style:italic;color:#5d5c56;font-family:Georgia,serif;font-size:15.5px;margin-top:14px;line-height:1.65;max-width:480px}
.flash .hint{position:absolute;bottom:26px;color:#b3a67f;font-size:13px}
.flash .fm{font-size:22px;font-weight:700;color:#5c4a1c;margin-top:22px;display:none}
.flash .fsub{display:none;margin-top:14px;color:var(--sub);font-size:14px;line-height:1.7}
.flash.show .fm,.flash.show .fsub{display:block}
.flash.show .hint{display:none}
.flash .fstar{position:absolute;top:14px;right:14px}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav2 button{background:var(--card);border:1.5px solid #2c2b28;border-radius:10px;padding:14px;font-size:15.5px;font-family:var(--sans);cursor:pointer;font-weight:600}
.nav2 button:disabled{opacity:.35;border-color:var(--line);cursor:default}

/* result */
.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 24px;text-align:center;margin-top:24px;box-shadow:0 2px 6px rgba(60,50,20,.07)}
.result .big{font-family:var(--serif);font-size:44px;font-weight:700}
.result .sm{color:var(--sub);margin-top:6px}
.result .stat{display:flex;justify-content:center;gap:26px;margin:22px 0}
.result .stat div b{display:block;font-size:24px;font-family:var(--serif)}
.result .stat div span{font-size:13px;color:var(--sub)}
.gbtn{display:inline-block;background:#1c1b19;color:#fff;border:none;border-radius:10px;padding:14px 26px;font-size:15px;font-family:var(--sans);cursor:pointer;margin:4px}
.gbtn.line{background:var(--card);color:var(--ink);border:1.5px solid #2c2b28}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14.5px;line-height:1.8}
.empty .st{font-size:26px;color:var(--gold-soft);display:block;margin-bottom:10px}
@media (max-width:430px){
  .home-hero{padding:28px 14px 8px}
  .home-hero .pre{font-size:11.5px;letter-spacing:1.5px}
  .home-hero h1{font-size:32px;letter-spacing:3px}
  .home-hero .sub{font-size:12.5px}
  .qword{font-size:32px}
  .flash .fw{font-size:34px}
  .mode-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-btn{padding:16px 4px 12px}
  .mode-btn .nm{font-size:12.5px}
}


/* 실전 33번형 */
.rtag{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.rl{display:flex;gap:8px;font-family:var(--serif);font-size:18px;line-height:1.55;margin:8px 0}
.rl.rex{font-size:16px}
.rl .rb{color:var(--gold);flex:none}
.rl .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--gold);margin:0 4px;height:1.1em;vertical-align:baseline}
.rl .blank.filled{height:auto}
.qbox .blank.filled{color:var(--ok);font-weight:700;border-bottom-color:var(--ok);min-width:0;padding:0 2px}
.rboxes{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.rboxes i{width:20px;height:24px;border:1.5px solid #8c8474;border-radius:3px;background:#fff}
.rboxes b{font-family:var(--serif);font-size:16px;padding:0 2px}.rboxes b.sp{width:8px}
.rboxes .rlen{margin-left:8px;font-size:12.5px;color:var(--sub)}
.rin{display:flex;gap:8px;margin-bottom:8px}
.rin input{flex:1;min-width:0;font-size:20px;font-family:var(--serif);padding:12px 14px;border:1.5px solid #2c2b28;border-radius:10px;background:var(--card)}
.rin input.bad{border-color:var(--no);background:#f7e6e1}
.rin .gbtn{margin:0}
.rmsg{text-align:center;font-size:16px;margin-top:10px;min-height:24px}
/* 발음 · 듣기 */
.spk{border:none;background:none;font-size:15px;cursor:pointer;padding:2px 4px;vertical-align:middle;opacity:.75}
.spk:active{transform:scale(.9)}
.qword .spk,.flash .fw .spk{font-size:20px}
.lnow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 18px;margin:14px 0 12px;text-align:center;box-shadow:0 1px 3px rgba(60,50,20,.06)}
.lnow .lw{font-family:var(--serif);font-size:34px;font-weight:600}
.lnow .lm{color:#5c4a1c;font-size:17px;font-weight:600;margin-top:8px}
.lnow .lc{color:var(--sub);font-size:12.5px;margin-top:8px}
.lctl{display:grid;grid-template-columns:1fr 1.4fr 1fr 1.6fr;gap:8px;margin-bottom:12px}
.lctl button{background:var(--card);border:1.5px solid #2c2b28;border-radius:10px;padding:13px 6px;font-size:18px;cursor:pointer;font-family:var(--sans)}
.lctl button.main{background:#1c1b19;color:#fff}
.lctl button.known{font-size:14px;font-weight:700;color:var(--ok);border-color:#9cc5a6}
.lset{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0}
.lrow>span{width:38px;font-size:12.5px;color:var(--sub);font-weight:600}
.lopt{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.lopt.on{background:#1c1b19;color:#fff;border-color:#1c1b19}
.lhead{display:flex;align-items:center;gap:8px;margin:22px 2px 8px;font-weight:700;font-size:14.5px;color:#3f3a2e}
.lhead b{color:var(--gold)}
.lhead .btns{margin-left:auto;display:flex;gap:5px}
.lmini{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:3px 9px;font-size:12px;cursor:pointer;letter-spacing:0;font-family:var(--sans)}
.lhint{color:var(--sub);font-size:12.5px;margin:-4px 2px 8px}
.lmp3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:12.5px;color:var(--sub)}
.lmp3 button{border:1px solid var(--line);background:#fff8e6;border-radius:12px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.litem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.litem input{width:18px;height:18px;flex:none;accent-color:#1c1b19}
.litem .lw2{font-family:var(--serif);font-weight:600;font-size:16px;flex:none}
.litem .lm2{color:var(--sub);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem.cur{border-color:var(--gold);background:#f6efd9}
@media (max-width:430px){.lnow .lw{font-size:28px}.lctl button{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#cmkNo{position:fixed;inset:0;z-index:99;background:#edf2fb;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:20px}#cmkNo div{background:#fff;border-radius:16px;padding:24px 20px;max-width:360px;box-shadow:0 4px 20px #0002;line-height:1.6;color:#223}#cmkNo a{display:inline-block;margin-top:12px;background:#2457d6;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700}.cmkBack{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;background:#2457d6;color:#fff;font:700 13px system-ui,sans-serif;padding:8px 12px;border-radius:20px;text-decoration:none;box-shadow:0 2px 8px #0003;opacity:.92}
</style>

<body>
<div id="app"></div>
<script>
/* ==========================================================================
   EBS 5개년 수능영단어 RESCUE (숙명여고2) — 조민규영어 단어 학습 프로그램
   데이터 형식 (VOCAB_DATA):
   { day: 22, words: [ {
       word: "honorary",              // 표제어
       mean: "명예의, 명예직의",        // 대표 뜻 (목록/테스트용)
       defs: ["영영 정의1", ...],       // 영영 의미 (카드·영영빈칸에 사용)
       col:  [["an honorary member","명예 회원"], ...],   // 콜로케이션 [영,한]
       ex:   [["She was awarded ...","그녀는 ..."], ...], // 예문 [영,한]
       syn:  ["obligatory", ...],      // 동의어 (유·반의어 훈련)
       ant:  ["voluntary", ...],       // 반의어
       der:  [["honorable","고결한"], ...],               // 파생어 [단어,뜻]
       senses: [                       // 다의어만 작성 → 문맥 뜻 구분 출제
         {pos:"형용사", mean:"경계하는, 방심하지 않는", phrases:["stay alert in class"]},
         {pos:"명사",   mean:"경계, 경보",             phrases:["on the alert for danger"]}
       ]
   } ] }
   ※ 모든 필드는 word / mean 외 선택 사항. 자료가 없는 모드는 자동으로 비활성화됨.
   ========================================================================== */
/* 홈 화면 Day 묶음 (위에서부터 표시) */
const HO=(()=>{try{return JSON.parse(localStorage.getItem('cmk_game')||'null')}catch(e){return null}})();
const GW=(HO&&HO.items||[]).filter(it=>it&&it.w&&it.m);
if(GW.length<4){document.addEventListener('DOMContentLoaded',()=>{const d=document.createElement('div');d.id='cmkNo';d.innerHTML='<div><b>공부할 단어가 없어요</b><br>학습창에서 공부할 세트를 연 다음<br>아래쪽 <b>단어 게임</b> 버튼을 눌러 주세요.<br><a href="../" onclick="return cmkBack()">← 학습창으로</a></div>';document.body.appendChild(d)})}

/* 학습창이 넘겨준 세트 → PART(20단어씩) */
const exOf = x => { if(!x) return null; const L = String(x).split(/\n+/); const en = L[0].replace(/[{}]/g, ''); return [[en, L.slice(1).join(' ')]]; };
const PSZ = GW.length > 25 ? 20 : GW.length || 1;
const VOCAB_DATA = [];
GW.forEach((it, i) => {
  const d = Math.floor(i / PSZ) + 1;
  let g = VOCAB_DATA.find(x => x.day === d); if(!g){ g = { day:d, words:[] }; VOCAB_DATA.push(g); }
  const w = { word: it.w, mean: it.m }; const ex = exOf(it.x); if(ex && ex[0][0].length > it.w.length + 3) w.ex = ex;
  g.words.push(w);
});
const RANGES = [ { label: HO ? HO.title : '', days: VOCAB_DATA.map(d => d.day) } ];
const CONFIG = { title: HO ? (HO.book || '단어 학습') : '단어 학습', brand:"RESCUE", sub:"조민규영어 학습창",
                 footer:"RESCUE · 조민규영어" };

/* ---------------- 저장소 (localStorage → 미지원 시 메모리) ---------------- */
const SKEY = 'cmkr_' + (HO ? HO.uid + '_' + HO.key : 'x') + '_';
const store = (() => {
  let mem = {};
  const ok = (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })();
  return {
    get(k, d){ try { const v = ok ? localStorage.getItem(SKEY+k) : mem[k]; return v==null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { if(ok) localStorage.setItem(SKEY+k, JSON.stringify(v)); else mem[k]=JSON.stringify(v); } catch(e){} }
  };
})();
let stars  = new Set(store.get("stars", []));
let wrongs = new Set(store.get("wrongs", []));
const saveStars  = () => store.set("stars", [...stars]);
const saveWrongs = () => store.set("wrongs", [...wrongs]);

/* ---------------- 유틸 ---------------- */
const ALL = [];
VOCAB_DATA.forEach(d => d.words.forEach(w => { w.day = d.day; ALL.push(w); }));
const byWord = w => ALL.find(x => x.word === w);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gapBlank(text, parts){   // 숙어 사이에 끼인 말(A, B, ~ 자리)은 남기고 숙어 부분만 빈칸
  const re = new RegExp("\\b" + parts.map(x => "(" + x + ")").join("((?:\\s+\\S+){0,3}?\\s+)"), "i");
  const e = esc(text); const m = e.match(re);
  if(!m) return null;
  let out = "", k = 1;
  for(let i = 0; i < parts.length; i++){
    out += '<span class="blank"></span>';
    if(i < parts.length - 1){ const sep = m[k+1]; out += (sep.trim() ? sep.replace(/^\s+/, " ").replace(/\s+$/, " ") : " "); k += 2; }
  }
  out = out.replace(/<span class="blank"><\/span>(?: <span class="blank"><\/span>)+/g, '<span class="blank"></span>');
  return e.slice(0, m.index) + out + e.slice(m.index + m[0].length);
}
function blankOut(text, word){
  word = word.replace(/\[(\w+)\]/g, "$1");   // sneak in[to] → sneak into
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const onesRe = s => s.includes("one's")
    ? s.split("one's").map(escRe).join("(?:one's|his|her|their|my|your|our)")
    : escRe(s);
  const re = new RegExp("\\b" + onesRe(word) + "\\w*", "i");
  if(re.test(text)) return esc(text).replace(re, '<span class="blank"></span>');
  const VAR = {sizeable:"sizable", "trial-and-error":"trial and error"};
  if(VAR[word]){ const rv = new RegExp("\\b" + escRe(VAR[word]) + "\\w*", "i"); if(rv.test(text)) return esc(text).replace(rv, '<span class="blank"></span>'); }
  const IRR = {keep:"kept", get:"got|gotten", take:"took|taken", make:"made", give:"gave|given", run:"ran", lay:"laid", go:"went|gone", fall:"fell|fallen", break:"broke|broken", drive:"drove|driven", strike:"struck", stand:"stood", become:"became", have:"has|had", mistake:"mistook|mistaken", leave:"left", be:"am|is|are|was|were|been|being"};
  if(word.includes(" ")){
    const parts = word.split(/\s+/).filter(t => !/^[AB~]$/.test(t)).map(t => {
      if(t === "oneself") return "(?:oneself|myself|yourself|himself|herself|itself|ourselves|yourselves|themselves)";
      const base = /^(a|an|the|of|to|in|on|at|by|for|with|up|out|off|as|into|from|down|over|away|it|no|but|and)$/i.test(t) ? escRe(t) + "\\b" : escRe(t).replace(/e$/, "e?") + "\\w*";
      return IRR[t] ? "(?:" + base + "|" + IRR[t] + ")" : base;
    });
    const re3 = new RegExp("\\b" + parts.join("(?:\\s+\\S+){0,3}?\\s+"), "i");
    if(re3.test(text)){ const g = gapBlank(text, parts); return g || esc(text).replace(re3, '<span class="blank"></span>'); }
  }
  if(word.includes(" ")){
    // A/B 자리표시자는 아무 단어나 허용, 각 단어는 어간+굴절형(-ed, -ing 등)까지 매칭
    const part = t => t.includes("one's") ? onesRe(t) + "\\w*" : (/^(a|an|the|of|to|in|on|at|by|for|with|up|out|off|as|into|from|down|over|away|it|no|but|and)$/i.test(t) ? escRe(t) + "\\b" : escRe(t).replace(/e$/, "e?") + "\\w*");
    const toks = word.split(/\s+/).filter(t => !/^[AB~]$/.test(t));   // A, B, ~는 자리표시자이므로 제외
    const loose = new RegExp("\\b" + toks.map(part).join("(?:\\s+\\S+){0,3}?\\s+"), "i");
    if(loose.test(text)){ const g = gapBlank(text, toks.map(part)); return g || esc(text).replace(loose, '<span class="blank"></span>'); }
  }
  if(word.includes(" ")){   // 불규칙 변화(ran, laid, were 등) 대비: 핵심 단어 하나로 매칭
    const key = word.split(/\s+/).filter(t => !/^[AB~]$/.test(t) && !/^(a|an|the|of|to|in|on|with|up|out|for|at|be)$/i.test(t))
                    .sort((a,b) => b.length - a.length)[0];
    if(key){
      const kre = new RegExp("\\b" + escRe(key).replace(/e$/, "e?") + "\\w*", "i");
      if(kre.test(text)) return esc(text).replace(kre, '<span class="blank"></span>');
    }
  }
  const stem = word.slice(0, Math.max(4, word.length-2));
  const re2 = new RegExp("\\b" + escRe(stem) + "\\w*", "i");
  return re2.test(text) ? esc(text).replace(re2,'<span class="blank"></span>') : esc(text) + ' <span class="blank"></span>';
}
function markWord(text, word){
  const re = new RegExp("\\b(" + word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*)", "i");
  return re.test(text) ? esc(text).replace(re, "<u>$1</u>") : esc(text);
}

/* ---------------- 문제 생성 ---------------- */
function qTest(words){ // 테스트: 단어 → 뜻 4지선다
  return shuffle(words).map(w => {
    const others = shuffle(ALL.filter(x => x.word !== w.word)).slice(0,3).map(x => x.mean);
    return { type:"test", w, prompt:w.word, options:shuffle([w.mean, ...others]), answer:w.mean };
  });
}
function qExample(words){ // 예문: 빈칸 + 한글 해석, 단어 5지선다
  const pool = words.filter(w => (w.col && w.col.length) || (w.ex && w.ex.length));
  return shuffle(pool).map(w => {
    const src = (w.col && w.col.length) ? w.col[0] : w.ex[0];
    const others = shuffle(pool.filter(x => x.word !== w.word)).slice(0,4).map(x => x.word);
    return { type:"ex", w, en:blankOut(src[0], w.word), ko:src[1], options:shuffle([w.word, ...others]), answer:w.word };
  });
}
function qDef(words){ // 영영 빈칸: 콜로케이션 빈칸 + 영영풀이, 단어 5지선다
  const pool = words.filter(w => w.defs && w.defs.length);
  return shuffle(pool).map(w => {
    const phrase = (w.col && w.col.length) ? w.col[0][0] : (w.ex && w.ex.length ? w.ex[0][0] : w.word);
    const others = shuffle(pool.filter(x => x.word !== w.word)).slice(0,4).map(x => x.word);
    return { type:"def", w, en:blankOut(phrase, w.word), def:w.defs[0], options:shuffle([w.word, ...others]), answer:w.word };
  });
}
function qContext(words){ // 문맥 뜻 구분: 다의어 구문 → 알맞은 뜻
  const qs = [];
  words.filter(w => w.senses && w.senses.length >= 2).forEach(w => {
    w.senses.forEach((s, si) => (s.phrases||[]).forEach(p => qs.push({
      type:"ctx", w, phrase:markWord(p, w.word),
      options:w.senses.map(x => ({pos:x.pos, mean:x.mean})), answer:si
    })));
  });
  return shuffle(qs);
}
function qReal(words){ // 실전(중간 33번형): 콜로케이션 2개(해석 없음) + 기출 예문(해석) 공통 빈칸 → 단어 쓰기
  const pool = words.filter(w => (w.col && w.col.length) || (w.ex && w.ex.length));
  return shuffle(pool).map(w => ({
    type:"real", w,
    cols:(w.col||[]).slice(0,2).map(c => blankOut(c[0], w.word)),
    ex:(w.ex||[]).slice(0,1).map(e => ({en:blankOut(e[0], w.word), ko:e[1]})),
    answer:w.word
  }));
}
const normAns = t => String(t).toLowerCase().replace(/\[(\w+)\]/g,"$1").replace(/\b(a|b)\b/g," ").replace(/[^a-z]/g,"");
function qSynAnt(words, n){ // 유·반의어: 두 단어 관계 판단
  const qs = [];
  words.forEach(w => {
    (w.syn||[]).forEach(s => qs.push({ type:"rel", w, a:w.word, b:s, answer:"syn" }));
    (w.ant||[]).forEach(s => qs.push({ type:"rel", w, a:w.word, b:s, answer:"ant" }));
  });
  return shuffle(qs).slice(0, n || qs.length);
}

/* ---------------- 라우팅 ---------------- */
const app = document.getElementById("app");
let view = { name:"home" };
function go(v){ if(view && view.name==="listen" && typeof stopListen==="function") stopListen(); view = v; render(); window.scrollTo(0,0); }
function render(){
  if(view.name==="home") rHome();
  else if(view.name==="day") rDay(view.day);
  else if(view.name==="cards") rCards(view);
  else if(view.name==="quiz") rQuiz(view);
  else if(view.name==="result") rResult(view);
  else if(view.name==="starred") rStarred();
  else if(view.name==="listen") rListen(view);
}
function bar(title, backTo, serif){
  return `<div class="topbar">
    <button class="back" onclick='go(${JSON.stringify(backTo)})'>&#x2039;</button>
    <div class="ttl ${serif?"en":""}">${title}</div><div class="sp"></div>
  </div>`;
}
function starBtn(word){
  const on = stars.has(word);
  return `<button class="star ${on?"on":""}" onclick="event.stopPropagation();toggleStar('${esc(word)}',this)">${on?"★":"☆"}</button>`;
}
function toggleStar(word, el){
  if(stars.has(word)) stars.delete(word); else stars.add(word);
  saveStars();
  el.classList.toggle("on"); el.textContent = stars.has(word) ? "★" : "☆";
}

/* ---------------- 홈 ---------------- */
function rHome(){
  const cnt = day => (VOCAB_DATA.find(d=>d.day===day)||{words:[]}).words.length;
  let groups = "";
  RANGES.forEach(rg => {
   const days = rg.days.filter(d => VOCAB_DATA.some(x=>x.day===d)).map(d => ({day:d, count:cnt(d)}));
   if(!days.length) return;
   groups += `<div class="sec-label">${rg.label}</div>`;
   const pairs = [];
   for(let i=0;i<days.length;){
     if(i+1<days.length && days[i+1].day===days[i].day+1){ pairs.push(days.slice(i,i+2)); i+=2; }
     else { pairs.push([days[i]]); i+=1; }
   }
   pairs.forEach(pair => {
    const label = pair.length===2 ? `PART ${pair[0].day} – ${pair[1].day}` : `PART ${pair[0].day}`;
    const total = pair.reduce((s,d)=>s+d.count,0);
    groups += `<div class="grp-head"><span class="n">${label}</span><span class="rule"></span><span class="c">${total}단어</span></div>
      <div class="day-grid">${pair.map(d=>`
        <div class="day-card" data-day="${d.day}"><div class="no">${d.day}</div><div class="wc">${d.count}단어</div></div>`).join("")}
      </div>`;
   });
  });
  const relTotal = qSynAnt(ALL).length;
  app.innerHTML = `
    <div class="home-hero"><div class="pre">${CONFIG.title}</div><h1>${CONFIG.brand}</h1><div class="sub">${CONFIG.sub}</div><p>카드 → 테스트 → 훈련 · <a href="../" onclick="return cmkBack()" style="color:inherit">← 학습창으로</a></p></div>
    <div class="wrap">
      ${groups}
      <div class="sec-label">훈련 · 복습</div>
      <div class="tool-row" id="t-rel"><div class="ic">&#x21c4;</div>
        <div class="tx"><b>유의어·반의어 구분</b><span>두 단어의 관계를 빠르게 판단하는 20문제 훈련</span></div><span class="arr">&#x203a;</span></div>
      <div class="tool-row" id="t-star"><div class="ic" style="color:var(--gold)">★</div>
        <div class="tx"><b>저장한 단어 복습</b><span>단어 옆 ★를 누르면 여기 모여요 · ${stars.size}개</span></div><span class="arr">&#x203a;</span></div>
      <div class="tool-row" id="t-wrong"><div class="ic" style="color:var(--no)">&#x21ba;</div>
        <div class="tx"><b>틀린 단어 복습</b><span>테스트에서 틀린 단어가 자동으로 모여요 · ${wrongs.size}개</span></div><span class="arr">&#x203a;</span></div>
      <div class="tool-row" id="t-listen"><div class="ic">&#x1f3a7;</div>
        <div class="tx"><b>★·틀린 단어 듣기</b><span>저장한 단어와 틀린 단어를 영어·뜻·영어로 들려줘요</span></div><span class="arr">&#x203a;</span></div>
      <div class="footer">${CONFIG.footer}</div>
    </div>`;
  document.getElementById("t-listen").onclick = () => {
    const ws = [...new Set([...stars, ...wrongs])].map(byWord).filter(Boolean);
    if(!ws.length) return alert("★ 저장한 단어나 틀린 단어가 아직 없습니다.");
    go({name:"listen", words:ws, key:"review", title:"★·틀린 단어 듣기", backTo:{name:"home"}});
  };
  app.querySelectorAll(".day-card").forEach(el => el.onclick = () => go({name:"day", day:+el.dataset.day}));
  document.getElementById("t-rel").onclick = () => {
    if(!relTotal) return alert("유·반의어 자료가 아직 없습니다.");
    go({name:"quiz", kind:"rel", qs:qSynAnt(ALL,20), i:0, right:0, wrong:0, title:"유의어·반의어 구분", backTo:{name:"home"}});
  };
  document.getElementById("t-star").onclick = () => go({name:"starred"});
  document.getElementById("t-wrong").onclick = () => {
    const ws = [...wrongs].map(byWord).filter(Boolean);
    if(!ws.length) return alert("틀린 단어가 아직 없습니다.");
    go({name:"quiz", kind:"wrongReview", qs:qTest(ws), i:0, right:0, wrong:0, title:"틀린 단어 복습", backTo:{name:"home"}});
  };
}

/* ---------------- DAY 화면 ---------------- */
function wordCardHTML(w, idx){
  const defs = (w.defs||[]).map(d=>`<div>${esc(d)}</div>`).join("");
  const pairs = [...(w.col||[]), ...(w.ex||[])].map(p=>`<div class="pair"><div class="en">${esc(p[0])}</div><div class="ko">${esc(p[1])}</div></div>`).join("");
  const syn = (w.syn&&w.syn.length)?`<div class="tagline"><span class="lbl">유의어</span>${w.syn.map(esc).join(", ")}</div>`:"";
  const ant = (w.ant&&w.ant.length)?`<div class="tagline"><span class="lbl">반의어</span>${w.ant.map(esc).join(", ")}</div>`:"";
  const der = (w.der&&w.der.length)?`<div class="tagline"><span class="lbl">파생어</span>${w.der.map(d=>`<b>${esc(d[0])}</b> ${esc(d[1])}`).join(" · ")}</div>`:"";
  return `<div class="wcard" data-w="${esc(w.word)}">
    <div class="head"><div class="idx">${idx}</div>
      <div class="wd"><div class="w">${esc(w.word)} ${spkBtn(w.word)}</div><div class="m">${esc(w.mean)}</div></div>
      ${starBtn(w.word)}</div>
    <div class="body"><span class="mean-hl">${esc(w.mean)}</span>
      ${defs?`<div class="defs">${defs}</div>`:""}${pairs}${syn}${ant}${der}</div>
  </div>`;
}
function rDay(day){
  const words = VOCAB_DATA.find(d=>d.day===day).words;
  const hasDef = words.some(w=>w.defs&&w.defs.length);
  const hasCtx = words.some(w=>w.senses&&w.senses.length>=2);
  const hasRel = words.some(w=>(w.syn&&w.syn.length)||(w.ant&&w.ant.length));
  const hasEx  = words.some(w=>(w.col&&w.col.length)||(w.ex&&w.ex.length));
  const modes = [
    {id:"cards", ic:"&#x1f0cf;", nm:"카드 학습", ok:true},
    {id:"test",  ic:"&#x270e;",  nm:"테스트", ok:true},
    {id:"ex",    ic:"&#x201c;",  nm:"예문 학습", ok:hasEx},
    {id:"def",   ic:"Aa",        nm:"영영 빈칸", ok:hasDef},
    {id:"ctx",   ic:"&#x2696;",  nm:"문맥 뜻 구분", ok:hasCtx},
    {id:"rel",   ic:"&#x21c4;",  nm:"유·반의어", ok:hasRel},
    {id:"listen",ic:"&#x1f3a7;", nm:"듣기", ok:true},
    {id:"real",  ic:"&#x1f4dd;", nm:"실전(33번형)", ok:hasEx}
  ];
  app.innerHTML = bar("PART "+day, {name:"home"}, true) + `
    <div class="wrap">
      <div class="mode-grid">${modes.map(m=>`
        <div class="mode-btn ${m.ok?"":"dis"}" data-m="${m.id}"><div class="ic">${m.ic}</div><div class="nm">${m.nm}</div></div>`).join("")}
      </div>
      <div class="sec-label">단어 목록 · ${words.length}</div>
      ${words.map((w,i)=>wordCardHTML(w,i+1)).join("")}
      <div class="footer">${CONFIG.footer}</div>
    </div>`;
  app.querySelectorAll(".wcard .head").forEach(el => el.onclick = () => el.parentElement.classList.toggle("open"));
  const back = {name:"day", day};
  app.querySelectorAll(".mode-btn").forEach(el => el.onclick = () => {
    const m = el.dataset.m;
    if(m==="cards") return go({name:"cards", day, i:0, title:"PART "+day+" · 카드", backTo:back});
    if(m==="listen") return go({name:"listen", words, key:"d"+day, title:"PART "+day+" · 듣기", backTo:back});
    const map = {
      test:{qs:qTest(words), t:"테스트"},
      ex:{qs:qExample(words), t:"예문"},
      def:{qs:qDef(words), t:"영영 빈칸"},
      ctx:{qs:qContext(words), t:"문맥 뜻 구분"},
      rel:{qs:qSynAnt(words,20), t:"유·반의어"},
      real:{qs:qReal(words), t:"실전 33번형"}
    }[m];
    go({name:"quiz", kind:m, qs:map.qs, i:0, right:0, wrong:0, title:"PART "+day+" · "+map.t, backTo:back});
  });
}

/* ---------------- 카드 학습 ---------------- */
function rCards(v){
  const words = v.words || VOCAB_DATA.find(d=>d.day===v.day).words;
  const w = words[v.i];
  const pairs = [...(w.col||[]), ...(w.ex||[])].slice(0,2).map(p=>esc(p[0])+" — "+esc(p[1])).join("<br>");
  app.innerHTML = bar(v.title, v.backTo) + `
    <div class="wrap">
      <div class="progress"><i style="width:${(v.i+1)/words.length*100}%"></i></div>
      <div class="meta">${v.i+1} / ${words.length}</div>
      <div class="flash" id="flash">${starBtn(w.word)}
        <div class="fw">${esc(w.word)} ${spkBtn(w.word)}</div>
        ${(w.defs&&w.defs.length)?`<div class="fd">${esc(w.defs[0])}</div>`:""}
        <div class="fm">${esc(w.mean)}</div>
        ${pairs?`<div class="fsub">${pairs}</div>`:""}
        <div class="hint">탭하여 뜻 보기</div>
      </div>
      <div class="nav2">
        <button id="prev" ${v.i===0?"disabled":""}>&#x2190; 이전</button>
        <button id="next">${v.i===words.length-1?"완료":"다음 \u2192"}</button>
      </div>
    </div>`;
  document.getElementById("flash").onclick = e => { if(!e.target.classList.contains("star")) e.currentTarget.classList.toggle("show"); };
  document.getElementById("prev").onclick = () => go({...v, words, i:v.i-1});
  document.getElementById("next").onclick = () => {
    if(v.i===words.length-1) go(v.backTo); else go({...v, words, i:v.i+1});
  };
}

/* ---------------- 퀴즈 공통 화면 ---------------- */
function rQuiz(v){
  if(!v.qs.length){ app.innerHTML = bar(v.title, v.backTo) + `<div class="empty">출제할 자료가 없습니다.</div>`; return; }
  if(v.i >= v.qs.length) return go({name:"result", from:v});
  const q = v.qs[v.i];
  let box = "", ask = "", opts = "";
  if(q.type==="real"){
    const L = "ABC";
    const lines = [...q.cols.map(h => `<div class="rl"><span class="rb">•</span><span>${h}</span></div>`),
                   ...q.ex.map(e => `<div class="rl rex"><span class="rb">•</span><span>${e.en}<div class="qko">(${esc(e.ko)})</div></span></div>`)].join("");
    const len = q.answer.replace(/[^A-Za-z]/g,"").length;
    box = `<div class="rtag">세 문장의 빈칸에 공통으로 들어갈 단어</div>${lines}
      <div class="rboxes">${q.answer.split("").map(ch => /[A-Za-z]/.test(ch) ? '<i></i>' : (ch===" " ? '<b class="sp"></b>' : `<b>${esc(ch)}</b>`)).join("")}<span class="rlen">${len}글자</span></div>`;
    ask = `빈칸에 들어갈 단어를 <b>원형</b>으로 쓰세요 <span style="font-size:12px">(시제·수는 바꾸지 않음)</span>`;
    opts = `<div class="rin"><input id="rinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰기"><button class="gbtn" id="rok">확인</button></div>
      <div style="text-align:center"><button class="gbtn line" id="rhint">첫 글자 힌트</button><button class="gbtn line" id="rgive">모르겠어요</button></div>
      <div id="rmsg" class="rmsg"></div>`;
  } else if(q.type==="test"){
    box = `<div class="qword">${esc(q.prompt)} ${spkBtn(q.prompt)}</div>`;
    ask = `알맞은 뜻을 고르세요`;
    opts = q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("");
  } else if(q.type==="ex"){
    box = `<div class="qphrase">${q.en}</div><div class="qko">${esc(q.ko)}</div>`;
    ask = `빈칸에 들어갈 단어를 고르세요`;
    opts = q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span class="en">${esc(o)}</span></button>`).join("");
  } else if(q.type==="def"){
    box = `<div class="qphrase">${q.en}</div><div class="qdef">${esc(q.def)}</div>`;
    ask = `영영풀이에 해당하는 빈칸 단어를 고르세요`;
    opts = q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span class="en">${esc(o)}</span></button>`).join("");
  } else if(q.type==="ctx"){
    box = `<div class="qphrase">${q.phrase}</div>`;
    ask = `문맥상 <b>${esc(q.w.word)}</b>의 뜻으로 알맞은 것은?`;
    opts = q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span><span class="poslbl">${esc(o.pos)} 뜻</span>${esc(o.mean)}</span></button>`).join("");
  } else if(q.type==="rel"){
    box = `<div class="pairq"><span class="pw">${esc(q.a)}</span><span class="q">?</span><span class="pw">${esc(q.b)}</span></div>`;
    ask = `두 단어의 관계를 고르세요`;
    opts = `<div class="duo">
      <button class="opt" data-i="syn"><span class="sym">=</span>유의어</button>
      <button class="opt" data-i="ant"><span class="sym">&#x2194;</span>반의어</button></div>`;
  }
  app.innerHTML = bar(v.title, v.backTo) + `
    <div class="wrap">
      <div class="progress"><i style="width:${(v.i)/v.qs.length*100}%"></i></div>
      <div class="meta">${v.i+1} / ${v.qs.length} · 맞음 <b>${v.right}</b> · 틀림 <b>${v.wrong}</b></div>
      <div class="qbox">${box}</div>
      <div class="qask">${ask}</div>
      ${opts}
    </div>`;
  if(q.type==="real"){
    const inp = document.getElementById("rinput"), msg = document.getElementById("rmsg");
    let hinted = false, done = false;
    setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
    const finish = correct => {
      if(done) return; done = true;
      inp.disabled = true; ["rok","rhint","rgive"].forEach(id => document.getElementById(id).disabled = true);
      msg.innerHTML = correct ? `<span style="color:var(--ok)">정답! <b>${esc(q.answer)}</b> — ${esc(q.w.mean)}</span>`
                              : `<span style="color:var(--no)">정답: <b>${esc(q.answer)}</b> — ${esc(q.w.mean)}</span>`;
      app.querySelectorAll(".qbox .blank").forEach(b => { b.textContent = q.answer; b.classList.add("filled"); });
      if(!correct){ wrongs.add(q.w.word); saveWrongs(); } else if(v.kind === "wrongReview"){ wrongs.delete(q.w.word); saveWrongs(); }
      setTimeout(() => go({...v, i:v.i+1, right:v.right+(correct?1:0), wrong:v.wrong+(correct?0:1)}), correct ? 1300 : 2600);
    };
    const check = () => {
      if(!inp.value.trim()) return;
      if(normAns(inp.value) === normAns(q.answer)) finish(true);
      else { inp.classList.add("bad"); msg.innerHTML = `<span style="color:var(--no)">다시 생각해 보세요</span>`; setTimeout(()=>inp.classList.remove("bad"), 500);
             if(hinted) finish(false); else hinted = "tried"; }
    };
    document.getElementById("rok").onclick = check;
    inp.onkeydown = e => { if(e.key === "Enter") check(); };
    document.getElementById("rhint").onclick = () => { hinted = true; inp.value = q.answer[0]; inp.focus(); msg.innerHTML = `<span style="color:var(--sub)">첫 글자: <b>${esc(q.answer[0])}</b> · 한 번 더 틀리면 오답 처리</span>`; };
    document.getElementById("rgive").onclick = () => finish(false);
    return;
  }
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(btn => btn.onclick = () => {
    btns.forEach(b => b.disabled = true);
    let pick, correct;
    if(q.type==="rel"){ pick = btn.dataset.i; correct = pick === q.answer; }
    else if(q.type==="ctx"){ pick = +btn.dataset.i; correct = pick === q.answer; }
    else { pick = q.options[+btn.dataset.i]; correct = pick === q.answer; }
    btn.classList.add(correct ? "correct" : "wrong");
    if(!correct){
      btns.forEach(b => {
        const val = q.type==="rel" ? b.dataset.i : (q.type==="ctx" ? +b.dataset.i : q.options[+b.dataset.i]);
        if(val === q.answer) b.classList.add("reveal","correct");
      });
      wrongs.add(q.w.word); saveWrongs();
    } else if(v.kind === "wrongReview"){
      wrongs.delete(q.w.word); saveWrongs();
    }
    setTimeout(() => go({...v, i:v.i+1, right:v.right+(correct?1:0), wrong:v.wrong+(correct?0:1)}), correct ? 650 : 1500);
  });
}

/* ---------------- 결과 ---------------- */
function rResult(v){
  const f = v.from;
  const pct = Math.round(f.right / f.qs.length * 100);
  const wrongWords = [...new Set(f.qs.filter(q => wrongs.has(q.w.word)).map(q => q.w.word))];
  app.innerHTML = bar(f.title, f.backTo) + `
    <div class="wrap">
      <div class="result">
        <div class="big">${pct}<span style="font-size:22px">점</span></div>
        <div class="sm">${pct===100 ? "완벽해요!" : pct>=80 ? "잘했어요. 틀린 단어만 다시 보면 끝!" : "틀린 단어 복습으로 한 번 더 다져요."}</div>
        <div class="stat">
          <div><b>${f.qs.length}</b><span>문제</span></div>
          <div><b style="color:var(--ok)">${f.right}</b><span>맞음</span></div>
          <div><b style="color:var(--no)">${f.wrong}</b><span>틀림</span></div>
        </div>
        <button class="gbtn" id="again">다시 풀기</button>
        ${f.wrong>0 && wrongWords.length ? `<button class="gbtn line" id="retryWrong">틀린 단어만 다시</button>` : ""}
        <button class="gbtn line" id="done">돌아가기</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = () => go({...f, qs:shuffle(f.qs), i:0, right:0, wrong:0});
  document.getElementById("done").onclick = () => go(f.backTo);
  const rw = document.getElementById("retryWrong");
  if(rw) rw.onclick = () => {
    const ws = wrongWords.map(byWord).filter(Boolean);
    go({name:"quiz", kind:"wrongReview", qs:qTest(ws), i:0, right:0, wrong:0, title:"틀린 단어 복습", backTo:f.backTo});
  };
}

/* ---------------- 발음 (기기 내장 음성) ---------------- */
const TTS = (() => {
  const ok = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  let voices = [];
  const load = () => { try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } };
  if(ok){ load(); try { speechSynthesis.onvoiceschanged = load; } catch(e){} }
  const pick = lang => {
    const L = voices.filter(v => (v.lang||"").toLowerCase().replace("_","-").startsWith(lang));
    return L.find(v => /premium|enhanced|natural|siri/i.test(v.name)) || L.find(v => /samantha|yuna|google/i.test(v.name)) || L[0] || null;
  };
  function say(text, lang, rate){
    return new Promise(res => {
      if(!ok || !text) return res();
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang === "en" ? "en-US" : "ko-KR";
        const v = pick(lang === "en" ? "en" : "ko"); if(v) u.voice = v;
        u.rate = rate || 1; u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
        setTimeout(fin, 4000 + text.length * 260);   // 일부 기기에서 onend가 안 오는 경우 대비
      } catch(e){ fin(); }
    });
  }
  return { ok, say, stop(){ try { if(ok) speechSynthesis.cancel(); } catch(e){} } };
})();
const koSpeak = m => String(m).replace(/[~∼…]/g, " ").replace(/[\[\]()]/g, " ").replace(/;/g, ",").replace(/\s+/g, " ").trim();
function speakWord(word){ TTS.stop(); TTS.say(word, "en", 0.9); }
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".spk");
  if(!b) return;
  e.stopPropagation(); e.preventDefault();
  speakWord(b.dataset.w);
}, true);
function spkBtn(word){ return `<button class="spk" data-w="${esc(word)}" aria-label="발음 듣기">&#x1f50a;</button>`; }

/* ---------------- 듣기 모드 ---------------- */
const LDEF = { order:"eke", rate:0.9, rep:1, gap:0.8, shuffle:false, loop:false };
let LS = Object.assign({}, LDEF, store.get("listen", {}));
const saveLS = () => store.set("listen", LS);
let LP = null;          // 재생 토큰
let wakeLock = null;
async function keepAwake(on){
  try {
    if(on && navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
const wait = s => new Promise(r => setTimeout(r, s * 1000));
function stopListen(){ LP = null; TTS.stop(); keepAwake(false); }

function rListen(v){
  stopListen();
  const words = v.words;
  const key = v.key ? "lsel_" + v.key : null;
  let saved = key ? store.get(key, null) : null;
  const sel = new Set(saved && saved.length ? saved.filter(w => words.some(x => x.word === w)) : words.map(w => w.word));
  const saveSel = () => { if(key) store.set(key, [...sel]); };
  let queue = [], qi = 0, playing = false;

  const opt = (k, val, label) => `<button class="lopt ${LS[k]===val?"on":""}" data-k="${k}" data-v="${val}">${label}</button>`;
  app.innerHTML = bar(v.title, v.backTo) + `
    <div class="wrap">
      ${TTS.ok ? "" : `<div class="empty" style="padding:20px">이 기기·브라우저는 음성 읽기를 지원하지 않아요.<br>아이패드 사파리나 크롬에서 열어 주세요.</div>`}
      <div class="lnow" id="lnow"><div class="lw" id="lw">▶ 를 누르면 시작해요</div><div class="lm" id="lm">&nbsp;</div><div class="lc" id="lc"></div></div>
      <div class="lctl">
        <button id="lprev">&#x23ee;</button>
        <button id="lplay" class="main">&#x25b6;</button>
        <button id="lnext">&#x23ed;</button>
        <button id="lknown" class="known">외웠어요 ✓</button>
      </div>
      <div class="lset">
        <div class="lrow"><span>순서</span>${opt("order","eke","영어·뜻·영어")}${opt("order","ek","영어·뜻")}${opt("order","ke","뜻·영어")}</div>
        <div class="lrow"><span>속도</span>${opt("rate",0.7,"느리게")}${opt("rate",0.9,"보통")}${opt("rate",1.1,"빠르게")}</div>
        <div class="lrow"><span>반복</span>${opt("rep",1,"1번")}${opt("rep",2,"2번")}${opt("rep",3,"3번")}</div>
        <div class="lrow"><span>간격</span>${opt("gap",0.4,"짧게")}${opt("gap",0.8,"보통")}${opt("gap",1.6,"길게")}</div>
        <div class="lrow"><span>기타</span>${opt("shuffle",true,"섞기")}${opt("loop",true,"계속 반복")}</div>
      </div>
      <div class="lhead">들을 단어 <b id="lcnt"></b>
        <span class="btns">
          <button class="lmini" id="lall">전체</button><button class="lmini" id="lnone">해제</button>
          <button class="lmini" id="lstar">★만</button><button class="lmini" id="lwrong">틀린 것만</button></span></div>
      <div class="lhint">체크된 단어만 들려줘요. 들으면서 외운 단어는 '외웠어요 ✓'를 누르면 빠지고, 다음엔 안 외워진 단어만 남아요.</div>
      <div class="lmp3"><button id="lcopy">📋 MP3 목록 복사</button><span id="lcmsg">체크된 단어를 복사해요 → 학원 컴퓨터 'MP3 만들기' 프로그램에 붙여넣기</span></div>
      <div id="llist">${words.map((w,i) => `
        <label class="litem" data-w="${esc(w.word)}"><input type="checkbox" ${sel.has(w.word)?"checked":""}>
          <span class="lw2">${esc(w.word)}</span><span class="lm2">${esc(w.mean)}</span>${spkBtn(w.word)}</label>`).join("")}</div>
      <div class="footer">${CONFIG.footer}</div>
    </div>`;
  const $ = id => document.getElementById(id);
  const cnt = () => { $("lcnt").textContent = sel.size + " / " + words.length; };
  const syncChecks = () => app.querySelectorAll(".litem").forEach(el => { el.querySelector("input").checked = sel.has(el.dataset.w); });
  cnt();
  app.querySelectorAll(".litem input").forEach(cb => cb.onchange = () => {
    const w = cb.closest(".litem").dataset.w; cb.checked ? sel.add(w) : sel.delete(w); saveSel(); cnt();
  });
  const setAll = list => { sel.clear(); list.forEach(w => sel.add(w)); saveSel(); syncChecks(); cnt(); };
  $("lall").onclick = () => setAll(words.map(w => w.word));
  $("lnone").onclick = () => setAll([]);
  $("lstar").onclick = () => setAll(words.filter(w => stars.has(w.word)).map(w => w.word));
  $("lwrong").onclick = () => setAll(words.filter(w => wrongs.has(w.word)).map(w => w.word));
  $("lcopy").onclick = () => {
    const list = words.filter(w => sel.has(w.word));
    const msg = t => { $("lcmsg").textContent = t; };
    if(!list.length) return msg("체크된 단어가 없어요.");
    const text = list.map(w => w.word + "\t" + w.mean).join("\n");
    const done = () => msg("✓ " + list.length + "단어 복사됨 — 프로그램 '단어 목록 붙여넣기' 칸에 붙여넣으세요.");
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
      document.body.removeChild(ta); ok ? done() : msg("복사가 막혀 있어요. 단어 목록을 길게 눌러 직접 복사해 주세요.");
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  };
  app.querySelectorAll(".lopt").forEach(b => b.onclick = () => {
    const k = b.dataset.k; let val = b.dataset.v;
    val = (val === "true") ? !LS[k] : (isNaN(+val) ? val : +val);
    LS[k] = val; saveLS();
    app.querySelectorAll(`.lopt[data-k="${k}"]`).forEach(x => x.classList.toggle("on", (x.dataset.v === "true") ? LS[k] === true : String(LS[k]) === x.dataset.v));
  });

  const buildQueue = () => {
    queue = words.filter(w => sel.has(w.word));
    if(LS.shuffle) queue = shuffle(queue);
    qi = 0;
  };
  const show = w => {
    $("lw").textContent = w ? w.word : "끝!";
    $("lm").textContent = w ? w.mean : (sel.size ? "다시 들으려면 ▶" : "체크된 단어가 없어요");
    $("lc").textContent = w ? (qi + 1) + " / " + queue.length : "";
    app.querySelectorAll(".litem").forEach(el => el.classList.toggle("cur", !!w && el.dataset.w === w.word));
    const cur = w && app.querySelector(`.litem[data-w="${CSS.escape ? CSS.escape(w.word) : w.word}"]`);
    if(cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest", behavior:"smooth"});
  };
  const setPlayBtn = () => { $("lplay").innerHTML = playing ? "&#x23f8;" : "&#x25b6;"; };

  async function run(){
    const tok = {}; LP = tok; playing = true; setPlayBtn(); keepAwake(true);
    while(LP === tok){
      if(qi >= queue.length){
        if(LS.loop && sel.size){ buildQueue(); continue; }
        break;
      }
      const w = queue[qi];
      if(!sel.has(w.word)){ qi++; continue; }
      show(w);
      for(let r = 0; r < LS.rep && LP === tok; r++){
        const steps = LS.order === "eke" ? ["e","k","e"] : LS.order === "ek" ? ["e","k"] : ["k","e"];
        for(const s of steps){
          if(LP !== tok) break;
          await TTS.say(s === "e" ? w.word : koSpeak(w.mean), s === "e" ? "en" : "ko", LS.rate);
          if(LP !== tok) break;
          await wait(LS.gap * 0.6);
        }
        if(LP === tok) await wait(LS.gap);
      }
      if(LP === tok) qi++;
    }
    if(LP === tok){ LP = null; playing = false; setPlayBtn(); keepAwake(false); if(qi >= queue.length){ show(null); buildQueue(); } }
  }
  $("lplay").onclick = () => {
    if(playing){ stopListen(); playing = false; setPlayBtn(); return; }
    if(!sel.size) return alert("들을 단어를 체크해 주세요.");
    if(!queue.length || qi >= queue.length) buildQueue();
    run();
  };
  const jump = d => {
    if(!queue.length) buildQueue();
    qi = Math.max(0, Math.min(queue.length - 1, qi + d));
    if(playing){ stopListen(); run(); } else show(queue[qi]);
  };
  $("lnext").onclick = () => jump(1);
  $("lprev").onclick = () => jump(-1);
  $("lknown").onclick = () => {
    const w = queue[qi]; if(!w) return;
    sel.delete(w.word); saveSel(); syncChecks(); cnt();
    $("lknown").textContent = "빠짐: " + w.word; setTimeout(() => { const b = $("lknown"); if(b) b.textContent = "외웠어요 ✓"; }, 1200);
    if(playing){ stopListen(); qi++; run(); } else { qi++; show(queue[qi] || null); }
  };
}

window.go = go; window.toggleStar = toggleStar;
