<title>문법 · 해커스 중1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 레이아웃: 한 열 학습 화면 — 목록 → DM 개념톡 → 문제 카드. 학원 파란색 + 공책 같은 옅은 회청색 바탕 */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f7fc; --line:#d9e1ee; --fg:#17202e; --muted:#5d6a7e;
  --blue:#2457d6; --blue-soft:#e3ebfb; --blue-ink:#163d9e; --me:#2457d6; --me-fg:#ffffff;
  --good:#11845b; --good-soft:#e1f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7; --star:#e3a400;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:20px;color:var(--blue);border:0;background:none;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.vlab{font-size:13px;color:var(--muted)}
.vsel{max-width:150px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 8px;font:inherit;font-size:13px}
@media (max-width:520px){.vlab{display:none}.vsel{max-width:110px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{margin:0 0 16px;color:var(--muted)}
/* 유닛 목록 */
.units{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:left;display:grid;line-height:1.35;font-size:14px}
.tab b{color:var(--blue);font-weight:700}
.tab small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on b,.tab.on small{color:#fff}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.unit .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .no{font-family:var(--f-display);color:var(--blue);font-size:18px;min-width:34px}
.unit .nm{font-weight:700;flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;font-size:13.5px;line-height:1.3;display:grid;gap:2px}
.step b{font-weight:500}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{background:var(--good-soft);border-color:transparent}
.step.done small{color:var(--good);font-weight:700}
.step.tried small{color:var(--bad)}
.step.lock{opacity:.5}
.chset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.chset .step{padding:12px 6px;font-size:15px}
.sec{font-family:var(--f-display);font-size:18px;margin:22px 0 8px;color:var(--blue-ink)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
/* DM 개념톡 */
.dm{display:grid;gap:8px;padding-block:12px;align-content:start;min-height:calc(100dvh - 150px)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:15px}
.av.ghost{visibility:hidden}
.bub{max-width:min(560px,82%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 14px;min-width:0;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.bub.ex{background:var(--blue-soft);border-color:transparent}
.bub.ex .en{font-weight:700;color:var(--blue-ink);font-size:17px}
.bub.ex .ko{font-size:14px;color:var(--muted)}
.say{border:0;background:none;padding:0 4px;color:var(--blue);font-size:15px}
.bub strong{color:var(--blue-ink)}
.row.me .bub strong{color:inherit}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:1px 6px;font:inherit;font-weight:700;color:var(--blue-ink);text-align:center;width:6.5em}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.opt:hover{border-color:var(--blue)}
.qbub{border-color:var(--blue)}
.qbub .qq{font-weight:700}
.dmfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
/* 문제 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-top:12px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notes h3{margin:0 0 8px;font-size:15px;color:var(--blue-ink)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:500}
.tips{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.kind{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.qtext{font-size:18px;white-space:pre-line}
.qtext.en{font-size:19px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;margin:0 2px;font:inherit;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.right{background:var(--good);border-color:var(--good);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tok{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:3px 2px;font:inherit}
.tok.sel{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tok.used{opacity:.3}
.fxrow{display:flex;gap:8px;align-items:center}
.fxrow .inp{flex:1;min-width:0}
.ans{min-height:46px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--surface2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg)}
.choices{display:grid;gap:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;display:flex;gap:10px}
.choice .n{color:var(--blue);font-weight:700;min-width:20px}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m12{display:grid;gap:4px}
.m12 .choice .n{min-width:22px}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--f-display);font-size:30px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px}
.ox button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--fg);display:block;margin-top:2px}
.fb .key{display:block;font-weight:700;margin-top:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kh{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--fg)}
.dmfoot{align-items:center}
@media (hover:none){.kh{display:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 18px}
.score{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score.pass{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.wlist{display:grid;gap:6px;text-align:left;width:100%}
.wlist div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:14px;z-index:20}
@media (max-width:520px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}.bub{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v22-ui ===== */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#f5f7fb; --line:#dde4f0; --fg:#0f1b33; --muted:#5b6a84;
  --blue:#1f4fd8; --blue-soft:#e9effe; --blue-ink:#1740b0; --me:#1f4fd8; --me-fg:#fff; --navy:#0c2463;
  --good:#0e9f6e; --good-soft:#e3f6ee; --bad:#e0464c; --bad-soft:#fdebec;
  --f-display:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,serif;
  --r:16px; --sh:0 1px 2px rgba(15,35,80,.06),0 10px 28px -14px rgba(15,35,80,.22); --tbub:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}}
:root[data-theme="dark"]{--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}
body{letter-spacing:-.005em}
h1,h2{font-weight:700;letter-spacing:-.02em}
.btn{border-radius:12px;font-weight:600}
.btn.primary{box-shadow:0 6px 16px -8px rgba(31,79,216,.7)}
.brand{font-weight:700;font-size:19px;color:var(--fg)}
.top{border-bottom:0;padding-block:14px 10px}
/* chapter band */
.chband{background:var(--navy);color:#fff;border-radius:20px;padding:22px 24px 20px;margin-top:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.chband::after{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.05)}
.cb-book{font-size:13px;color:#b9c8f3;font-weight:600}
.chband h1{margin:0;color:#fff;font-size:clamp(22px,3.4vw,30px);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chband h1 em{font-style:normal;font-family:var(--f-en);font-weight:600;color:#b9c8f3;font-size:.8em}
.chband .lead{color:#d7e0fa;margin:0 0 8px;font-size:14.5px}
.chband .prog{color:#d7e0fa}
.chband .prog b{color:#fff}
.chband .bar{background:rgba(255,255,255,.14);border:0}
.chband .bar i{background:#fff}
.tabs{padding-block:4px 0}
.tab{border-radius:12px;padding:8px 14px;box-shadow:var(--sh)}
.tab.on{background:var(--navy);border-color:var(--navy)}
.sec{font-family:var(--f-body);font-weight:700;color:var(--fg);font-size:17px}
.unit{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.unit .no{font-family:var(--f-en);font-weight:600;font-size:19px}
.unit .nm{font-size:16.5px}
.step{border-radius:12px;padding:10px 6px;background:var(--surface2);transition:border-color .12s}
.step:hover{border-color:var(--blue)}
.step b{font-weight:600}
.step.done{background:var(--good-soft);border-color:transparent}
.chset .step{box-shadow:var(--sh);background:var(--surface)}
/* quiz header */
.top.q{position:sticky;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 10px;margin-top:12px}
.top.q b{font-size:15px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top.q .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.top.q .btn:hover{background:rgba(255,255,255,.18)}
.prog{margin-top:16px!important}
.bar{height:8px;background:var(--blue-soft);border:0}
.card{border-radius:20px;padding:24px 26px;gap:16px;margin-top:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:not(.result)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kind{font-size:13px;letter-spacing:0}
.qtext{font-size:20px;line-height:1.75}
.qtext.en{font-size:21px}
.chip{border-radius:10px;padding:3px 12px;font-size:inherit}
.tok{border-radius:10px;padding:4px 11px;font-size:18px}
.inp{border-radius:12px;padding:12px 14px;font-size:18px;border-width:1.5px}
.inp:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px var(--blue-soft)}
.choice{border-radius:12px;padding:12px 14px;font-size:16px;background:var(--surface)}
.choice:hover{border-color:var(--blue)}
.ox button{font-family:var(--f-body);font-weight:700;border-radius:16px;padding:14px}
.fb{border-radius:12px;padding:12px 16px}
.notes{border-radius:var(--r);box-shadow:var(--sh)}
.score{font-family:var(--f-body);font-weight:800;letter-spacing:-.03em}
/* Instagram-like DM */
.dmhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px 10px 8px;margin-top:12px;box-shadow:var(--sh)}
.dmback{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dmback:hover{background:var(--surface2)}
.dmback svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#1f4fd8,#5b8cff,#0c2463,#1f4fd8)}
.avring .av{width:40px;height:40px;border:2px solid var(--surface);font-family:var(--f-body);font-weight:700;font-size:14px;background:var(--navy)}
.dmwho{display:grid;line-height:1.3;flex:1;min-width:0}
.dmwho b{font-size:15.5px}
.dmwho span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmon{font-size:12px;color:var(--good);font-weight:600;display:flex;align-items:center;gap:6px}
.dmon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.dm{gap:6px;padding:18px 4px 12px;min-height:calc(100dvh - 160px)}
.dmday{justify-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-bottom:8px}
.av{width:30px;height:30px;font-family:var(--f-body);font-weight:700;font-size:12px;background:var(--navy)}
.bub{background:var(--tbub);border:0;border-radius:22px 22px 22px 8px;padding:10px 16px;font-size:16px;line-height:1.6}
.row.me .bub{background:linear-gradient(135deg,#2a5cf0,#1f4fd8 55%,#1a3fb8);border-radius:22px 22px 8px 22px}
.bub.ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue)}
.bub.ex .en{font-family:var(--f-en);font-weight:600;font-size:18.5px}
.qbub{background:var(--surface);border:1.5px solid var(--blue)}
.opt{border-radius:12px;padding:10px 14px;background:var(--surface)}
.dmfoot{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:0}
.dmfoot .btn.primary{border-radius:99px;padding:10px 22px}
.chband .prog{margin-top:4px!important}
</style>

<script>

: "The movie [isn't*/aren't] scary.", "e": "the movie 단수 → isn't"}, {"k": "pk", "q": "My friends [isn't/aren't*] in the classroom.", "e": "my friends 복수 → aren't"}, {"k": "bl", "q": "He is a doctor. (부정문으로) → He (isn't|is not) a doctor.", "e": "is → is not / isn't"}, {"k": "bl", "q": "We are late. (부정문으로) → We (aren't|are not) late.", "e": "are → are not / aren't"}, {"k": "bl", "q": "I am sad. (부정문으로) → I (am not) sad.", "e": "am → am not (amn't ✗)"}, {"k": "bl", "q": "She is not → (She's not|She isn't|she's not|she isn't) (줄임말)", "e": "She's not = She isn't"}, {"k": "fx", "q": "I amn't tired.", "w": "amn't", "a": ["am not", "'m not"], "e": "amn't는 쓰지 않는다 → I am not / I'm not"}, {"k": "fx", "q": "The cats isn't hungry.", "w": "isn't", "a": ["aren't"], "e": "cats 복수 → aren't"}, {"k": "fx", "q": "Tom not is in his room.", "w": "not", "a": ["is not", "isn't"], "e": "not은 be동사 뒤 → Tom is not[isn't] in his room."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? My sister ____ a student.", "o": ["am not", "aren't", "isn't", "not is", "not"], "a": 2, "e": "my sister 단수 → isn't"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I'm not angry.", "They aren't my books.", "It isn't cold today.", "We isn't in the same class.", "You're not late."], "a": 3, "e": "④ we → aren't"}, {"k": "ch", "q": "다음 문장을 부정문으로 바르게 바꾼 것은? Mina and Sora are sisters.", "o": ["Mina and Sora isn't sisters.", "Mina and Sora not are sisters.", "Mina and Sora aren't sisters.", "Mina and Sora amn't sisters.", "Mina and Sora are sisters not."], "a": 2, "e": "A and B = 복수 → aren't"}, {"k": "bl", "q": "그 가방은 비싸지 않다. → The bag (isn't|is not) expensive.", "e": "단수 → isn't"}, {"k": "bl", "q": "그들은 집에 없다. → They (aren't|are not) at home.", "e": "복수 → aren't"}, {"k": "bl", "q": "나는 졸리지 않다. → I (am not|'m not) sleepy.", "e": "I → am not"}, {"k": "pk", "q": "You [isn't/aren't*] alone.", "e": "you → aren't"}, {"k": "fx", "q": "My shoes isn't dirty.", "w": "isn't", "a": ["aren't"], "e": "shoes 복수 → aren't"}, {"k": "ox", "q": "He's not my brother. = He isn't my brother.", "a": true, "e": "두 가지 줄임 방법 모두 가능 ✔"}, {"k": "ox", "q": "I amn't a liar.", "a": false, "e": "amn't ✗ → I'm not a liar."}], "practiceB": [{"k": "wr", "q": "나의 방은 크지 않다. (room, big)", "a": ["My room isn't big.", "My room is not big."], "e": "단수 → isn't"}, {"k": "wr", "q": "그들은 나의 친구들이 아니다. (friends)", "a": ["They aren't my friends.", "They are not my friends.", "They're not my friends."], "e": "they → aren't"}, {"k": "or", "q": "나는 지금 바쁘지 않다.", "a": "I am not busy now.", "e": "I → am not"}, {"k": "or", "q": "그 아이들은 공원에 없다.", "a": "The kids aren't in the park.", "e": "복수 → aren't"}, {"k": "fx", "q": "The weather aren't good today.", "w": "aren't", "a": ["isn't"], "e": "the weather 단수 → isn't"}, {"k": "fx", "q": "We not are hungry.", "w": "not", "a": ["are not", "aren't"], "e": "not은 be동사 뒤 → We are not hungry."}, {"k": "ch", "q": "어법상 옳은 문장을 모두 고른 것은?\nⓐ It's not my pen.\nⓑ I amn't sick.\nⓒ The boys isn't tall.\nⓓ You aren't late.\nⓔ She not is a nurse.", "o": ["ⓐ, ⓑ", "ⓐ, ⓓ", "ⓑ, ⓒ", "ⓒ, ⓔ", "ⓐ, ⓓ, ⓔ"], "a": 1, "e": "ⓑ amn't ✗ / ⓒ boys → aren't / ⓔ not은 is 뒤"}, {"k": "bl", "q": "This is my bag. (부정문) → This (isn't|is not) my bag.", "e": "this 단수 → isn't"}, {"k": "bl", "q": "Jisu and I are in the gym. (부정문) → Jisu and I (aren't|are not) in the gym.", "e": "A and B = 복수 → aren't"}, {"k": "wr", "q": "그 문제는 어렵지 않다. (question, difficult)", "a": ["The question isn't difficult.", "The question is not difficult."], "e": "단수 → isn't"}]}}, {"tag": "hk1-01-1-4", "name": "be동사의 현재형: 의문문", "talk": [{"k": "m", "t": "'~이니?', '~하니?', '~에 있니?' 하고 물어볼 때는? 🙋"}, {"k": "m", "t": "be동사를 **주어 앞으로** 보내고 끝에 물음표(?)를 붙여요. You are ~ → [Are] you ~?"}, {"k": "ex", "en": "You are a student. → Are you a student?", "ko": "너는 학생이니?"}, {"k": "ex", "en": "He is at home. → Is he at home?", "ko": "그는 집에 있니?"}, {"k": "q", "q": "의문문이 바르게 된 것은?", "o": ["Is she your sister?", "She is your sister?", "Are she your sister?"], "a": 0, "ok": "맞아요! be동사(Is) + 주어(she)", " e boy writes in his diary every day."], "e": "the boy → writes"}]}}, {"tag": "hk1-02-1-2", "name": "일반동사의 현재형: 부정문", "talk": [{"k": "m", "t": "'~하지 않는다'는 [don't] 또는 [doesn't] + **동사원형**으로 써요 🙅"}, {"k": "m", "t": "I, you, we, they, 복수 주어 → do not = **don't**"}, {"k": "ex", "en": "I don't like carrots.", "ko": "나는 당근을 좋아하지 않는다."}, {"k": "m", "t": "3인칭 단수 주어 → does not = **doesn't**"}, {"k": "ex", "en": "She doesn't eat meat.", "ko": "그녀는 고기를 먹지 않는다."}, {"k": "m", "t": "⚠️ doesn't가 -s를 이미 가져갔으니까 뒤 동사는 원형이에요. He doesn't [have] a pet. (has ✗)"}, {"k": "q", "q": "My brother ____ play computer games.", "o": ["don't", "doesn't", "isn't"], "a": 1, "ok": "맞아요! my brother = 3인칭 단수 → doesn't", "no": "3인칭 단수 + 일반동사 → doesn't"}, {"k": "m", "t": "⚠️ be동사와 헷갈리지 말기! **be동사 문장** → isn't / aren't, **일반동사 문장** → don't / doesn't"}, {"k": "ex", "en": "He isn't busy. / He doesn't work on Sundays.", "ko": "그는 바쁘지 않다. / 그는 일요일에 일하지 않는다."}, {"k": "q", "q": "They ____ like spicy food.", "o": ["aren't", "don't", "doesn't"], "a": 1, "ok": "정확해요! like는 일반동사, they → don't", "no": "like가 일반동사니까 don't / doesn't 중에서! they → don't"}, {"k": "m", "t": "정리! **don't / doesn't + 동사원형**, be동사 문장은 isn't / aren't 👍"}], "notes": {"table": [["주어", "부정문", "예"], ["I / you / we / they / 복수", "don't (do not) + 동사원형", "They don't eat fish."], ["he / she / it / 단수", "doesn't (does not) + 동사원형", "She doesn't eat fish."]], "tips": ["doesn't 뒤에는 동사원형 (doesn't likes ✗)", "be동사 문장의 부정은 isn't / aren't (I'm not like ✗ → I don't like)"]}, "sets": {"workbook": [{"k": "pk", "q": "I [don't*/doesn't] know his name.", "e": "I → don't"}, {"k": "pk", "q": "Sora [don't/doesn't*] drink coffee.", "e": "Sora → doesn't"}, {"k": "pk", "q": "He doesn't [watch*/watches] TV at night.", "e": "doesn't 뒤 원형"}, {"k": "pk", "q": "My parents [don't*/aren't] eat breakfast.", "e": "eat은 일반동사 → don't"}, {"k": "bl", "q": "We like math. (부정문) → We (don't|do not) like math.", "e": "we → don't"}, {"k": "bl", "q": "She has a brother. (부정문) → She (doesn'  동사원형 → go"}, {"k": "m", "t": "⚠️ be동사 문장은 Is / Are로, 일반동사 문장은 Do / Does로 물어요!"}, {"k": "ex", "en": "Are you hungry? / Do you want some bread?", "ko": "너 배고프니? / 빵 좀 먹을래?"}, {"k": "q", "q": "Do you know Mina? 에 대한 대답으로 알맞은 것은?", "o": ["Yes, I am.", "Yes, I do.", "Yes, you do."], "a": 1, "ok": "맞아요! Do로 물으면 do로 대답", "no": "Do로 물었으니 do로! you로 물으면 I로 → Yes, I do."}, {"k": "m", "t": "정리! **Do / Does + 주어 + 동사원형 ~? → Yes, ~ do/does. / No, ~ don't/doesn't.** 👍"}], "notes": {"table": [["의문문", "긍정 대답", "부정 대답"], ["Do you(너) ~?", "Yes, I do.", "No, I don't."], ["Do you(너희) / we ~?", "Yes, we do. / Yes, you do.", "No, we don't. / No, you don't."], ["Do they / 복수 ~?", "Yes, they do.", "No, they don't."], ["Does he / she / it / 단수 ~?", "Yes, he[she, it] does.", "No, he[she, it] doesn't."]], "tips": ["Do / Does 뒤에는 동사원형", "be동사 문장 → Is / Are로 묻고 be동사로 대답"]}, "sets": {"workbook": [{"k": "pk", "q": "[Do*/Does] you play the guitar?", "e": "you → Do"}, {"k": "pk", "q": "[Do/Does*] Kate have a dog?", "e": "Kate → Does"}, {"k": "pk", "q": "Does he [speak*/speaks] Korean?", "e": "Does 뒤 원형"}, {"k": "pk", "q": "Do your parents like movies? — Yes, they [are/do*].", "e": "Do로 물으면 do로 대답"}, {"k": "bl", "q": "You like apples. (의문문) → (Do) you like apples?", "e": "you → Do"}, {"k": "bl", "q": "She walks to school. (의문문) → (Does) she (walk) to school?", "e": "Does + 원형"}, {"k": "bl", "q": "Does your sister play tennis? — No, (she) (doesn't|does not).", "e": "대명사 she + doesn't"}, {"k": "bl", "q": "Do you and Tom live near here? — Yes, (we) (do).", "e": "you and Tom → we"}, {"k": "fx", "q": "Does they eat lunch at school?", "w": "Does", "a": ["Do"], "e": "they → Do"}, {"k": "fx", "q": "Do Mike like baseball?", "w": "Do", "a": ["Does"], "e": "Mike → Does"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ the store open at ten?", "o": ["Do", "Does", "Is", "Are", "Am"], "a": 1, "e": "open(문을 열다)은 일반동사, the store → Does"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: Does your dad cook well? B: Yes, ____.", "o": ["he is", "he does", "he do", "does he", "your dad does"], "a": 1, "e": "Does로 물으면 → Yes, he does."}, {"k": "ch", "q": "대화가 어색한 것은?", "o": ["A: Do you have a pen? B: Yes, I do.", "A: Does it rain a lot here? B: No, it doesn't.", "A: Do they speak English? B: Yes, they do.", "A: Does Sam like dogs? B: Yes, he likes.", "A: Is she your sister? B: No, she isn't."], "a": 3, "e": "④ Yes, he does."}, {"k": "bl", "q": "너는 아침을 먹니? → (Do) you eat breakfast?", "e": "you → Do"}, {"k": "bl", "q": "그 버스는 시청에 가니? → (Does) the bus (go) to City Hall?", "e": "Does + 원형 go"}, {"k": "pk", "q": "[Is/Does*] your brother wear glasses?", "e": "wear는 일반동사 → Does"}, {"k": "pk", "q": "[Are*/Do] you a middle school student?", "e": "a student 앞에는 be동사 → Are"}, {"k": "fx", "q": "Does she lives in Busan?", "w": "lives", "a": ["live"], "e": "Does 뒤 원형"}, {"k": "ox", "q": "A: Does your mom work at a bank? B: Yes, she works.", "a": false, "e": "→ Yes, she does."}, {"k": "ox", "q": "A: Do Jun and Bora know each other? B: Yes, they do.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "너는 매일 운동을 하니? (exercise, every day)", "a": ["Do you exercise every day?"], "e": "Do + you + 원형"}, {"k": "wr", "q": "그는 휴대전화를 가지고 있니? (have a cell phone)", "a": ["Does he have a cell phone?"], "e": "Does + he + have"}, {"k": "or", "q": "너의 언니는 피아노를 치니?", "a": "Does your sister play the piano?", "e": "Does + 3인칭 단수 + 원형"}, {"k": "or", "q": "그들은 같은 학교에 다니니?", "a": "Do they go to the same school?", "e": "Do + they + 원형"}, {"k": "fx", "q": "Does your friends live near you?", "w": "Does", "a": ["Do"], "e": "your friends = 복수 → Do"}, {"k": "fx", "q": "Are you like K-pop?", "w": "Are", "a": ["Do"], "e": "like는 일반동사 → Do you like ~?"}, {"k": "ch", "q": "다음 중 대답이 바른 것은?", "o": ["Does Ted swim well? — Yes, Ted does.", "Do your cats sleep a lot? — Yes, it does.", "Does the class start at nine? — No, it doesn't.", "Do you play golf? — No, I'm not.", "Is he a teacher? — Yes, he does."], "a": 2, "e": "① he does ② they do ④ I don't ⑤ he is"}, {"k": "bl", "q": "A: (Does) Minji take the bus to school? B: No, she (doesn't|does not). She walks.", "e": "Does / doesn't"}, {"k": "bl", "q": "A: (Do) you need help? B: Yes, I (do).", "e": "Do / do"}, {"k": "wr", "q": "A: 너의 아버지는 수영을 하시니? B: 아니, 안 하셔. (B의 대답만 쓰시오)", "a": ["No, he doesn't."], "e": "Does your father swim? → No, he doesn't."}]}}, {"tag": "hk1-02-2-1", "name": "일반동사의 과거형: 규칙 변화", "talk": [{"k": "m", "t": "과거에 한 일 '~했다'는 동사의 **과거형**! 규칙 동사는 끝에 -[ed]를 붙여요 ⏪"}, {"k": "ex", "en": "I played soccer yesterday.", "ko": "나는 어제 축구를 했다."}, {"k": "m", "t": "✔ 과거형은 주어가 누구든 모양이 같아요! He played / They played (3인칭 단수 -s 걱정 없음)"}, {"k": "m", "t": "-e로 끝나면 → -d만: like → liked, live → [lived]"}, {"k": "m", "t": "**자음 + y** → y를 i로 바꾸고 -ed: study → [studied], cry → cried / **모음 + y** → 그냥 -ed: play → played, enjoy → enjoyed"}, {"k": "q", "q": "study의 과거형은?", "o": ["studyed", "studied", "studed"], "a": 1, "ok": "맞아요! 자음 + y → ied", "no": "study는 자음(d) + y → studied"}, {"k": "m", "t": "**단모음 + 단자음**으로 끝나는 짧은 동사 → 자음을 한 번 더 쓰고 -ed: stop → [stopped], plan → planned, drop → dropped"}, {"k": "q", "q": "과거형이 틀린 것은?", "o": ["stop → stoped", "plan → planned", "try → tried"], "a": 0, "ok": "정확해요! stop → stopped (p를 한 번 더)", "no": "stop은 단모음(o) + 단자음(p) → stopped"}, {"k": "m", "t": "과거를 알려 주는 말: **yesterday, last ~, ~ ago, then, in 2020** (Ch.1 be동사 과거와 같아요)"}, {"k": "q", "q": "We ____ the movie last night.", "o": ["enjoy", "enjoyed", "enjoys"], "a": 1, "ok": "맞아요! last night → 과거 enjoyed", "no": "last night(어젯밤) → 과거형 enjoyed"}, {"k": "m", "t": "정리! **+ed / -e는 +d / 자음+y는 ied / 단모음+단자음은 자음 한 번 더** 👍"}], "notes": {"table": [["동사 끝", "규칙", "예"], ["대부분", "+ ed", "walk → walked, want → wanted"], ["-e", "+ d", "like → liked, dance → danced"], ["자음 + y", "y → i + ed", "study → studied, cry → cried"], ["모음 + y", "+ ed", "play → played, stay → stayed"], ["단모음 + 단자음", "자음 한 번 더 + ed", "stop → stopped, plan → planned"]], "tips": ["과거형은 주어와 상관없이 모양이 같다", "yesterday, last ~, ~ ago, then → 과거형"]}, "sets": {"workbook": [{"k": "pk", "q": "I [visit/visited*] my grandma last Sunday.", "e": "last Sunday → 과거"}, {"k": "pk", "q": "She [watched*/watchs] a movie yesterday.", "e": "yesterday → watched"}, {"k": "pk", "q": "They [stoped/stopped*] at the store.", "e": "stop → stopped"}, {"k": "pk", "q": "He [studyed/studied*] science last night.", "e": "study → studied"}, {"k": "bl", "q": "과거형: walk → (walked) / dance → (danced) / cry → (cried)", "e": "+ed / +d / ied"}, {"k": "bl", "q": "과거형: play → (played) / drop → (dropped) / live → (lived)", "e": "모음+y → ed / 자음 한 번 더 / +d"}, {"k": "bl", "q": "My dad (cooked) dinner yesterday. ← cook", "e": "+ed"}, {"k": "bl", "q": "We (stayed) at a hotel last summer. ← stay", "e": "모음+y → stayed"}, {"k": "fx", "q": "Jisu plaied the piano at the concert.", "w": "plaied", "a": ["played"], "e": "모음 + y → played"}, {"k": "fx", "q": "My brother cleanned his room.", "w": "cleanned", "a": ["cleaned"], "e": "clean은 단모음이 아님 → cleaned"}], "practiceA": [{"k": "ch", "q": "동사의 과거형이 바르지 않은 것은?", "o": ["want → wanted", "carry → carried", "enjoy → enjoyed", "hope → hopeed", "plan → planned"], "a": 3, "e": "hope → hoped (-e는 d만)"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The baby ____ all night yesterday.", "o": ["cry", "crys", "cries", "cried", "cryed"], "a": 3, "e": "yesterday → cried"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Tom ____ his friend two days ago.", "o": ["call", "calls", "called", "callled", "is call"], "a": 2, "e": "two days ago → called"}, {"k": "bl", "q": "They (moved) to Seoul in 2020. ← move", "e": "-e → moved"}, {"k": "bl", "q": "I (helped) my mom last weekend. ← help", "e": "+ed"}, {"k": "pk", "q": "She [arrives/arrived*] at school late yesterday.", "e": "yesterday → 과거"}, {"k": "pk", "q": "We [jog/jogged*] in the park two hours ago.", "e": "jog → jogged"}, {"k": "fx", "q": "He droped his phone.", "w": "droped", "a": ["dropped"], "e": "drop → dropped"}, {"k": "ox", "q": "I tryed a new game yesterday.", "a": false, "e": "try → tried"}, {"k": "ox", "q": "The students listened to music after lunch.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "나는 어제 내 방을 청소했다. (clean my room, yesterday)", "a": ["I cleaned my room yesterday.", "Yesterday I cleaned my room."], "e": "clean → cleaned"}, {"k": "wr", "q": "그들은 지난 주말에 축구를 했다. (play soccer, last weekend)", "a": ["They played soccer last weekend."], "e": "play → played"}, {"k": "or", "q": "그녀는 어젯밤 시험 공부를 했다.", "a": "She studied for the test last night.", "e": "study → studied"}, {"k": "or", "q": "버스가 갑자기 멈췄다.", "a": "The bus stopped suddenly.", "e": "stop → stopped"}, {"k": "fx", "q": "Mina wash her hair last night.", "w": "wash", "a": ["washed"], "e": "last night → washed"}, {"k": "fx", "q": "We enjoied the party.", "w": "enjoied", "a": ["enjoyed"], "e": "모음 + y → enjoyed"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He liked the gift.\nⓑ I studyed hard.\nⓒ They planed a trip.\nⓓ She smiled at me.\nⓔ We stayed home yesterday.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓓⓔ 옳음 / ⓑ studied / ⓒ planned"}, {"k": "bl", "q": "I visit my uncle every month. → I (visited) my uncle last month.", "e": "last month → visited"}, {"k": "bl", "q": "She walks her dog every day. → She (walked) her dog yesterday.", "e": "yesterday → walked"}, {"k": "wr", "q": "우리는 두 시간 전에 숙제를 끝냈다. (finish our homework, two hours ago)", "a": ["We finished our homework two hours ago."], "e": "finish → finished"}]}}, {"tag": "hk1-02-2-2", "name": "일반동사의 과거형: 불규칙 변화", "talk": [{"k": "m", "t": "과거형이 -ed가 아닌 동사도 많아요. 이런 동사는 **외워야** 해요 💪"}, {"k": "m", "t": "자주 나오는 것부터! go → [went], come → came, eat → ate, have → [had], do → did, see → saw, make → made, get → got"}, {"k": "ex", "en": "I went to the zoo yesterday.", "ko": "나는 어제 동물원에 갔다."}, {"k": "q", "q": "eat의 과거형은?", "o": ["eated", "ate", "eat"], "a": 1, "ok": "맞아요! eat → ate", "no": "eat은 불규칙 → ate"}, {"k": "m", "t": "-ought / -aught 패턴: buy → bought, think → thought, bring → brought, teach → [taught], catch → caught"}, {"k": "m", "t": "현재형과 과거형이 **똑같은** 동사: put → put, cut → cut, hit → hit, read → read (발음만 '레드')"}, {"k": "ex", "en": "She read the book last night.", "ko": "그녀는 어젯밤 그 책을 읽었다. (reads가 아니니까 과거!)"}, {"k": "q", "q": "He ____ a cake for me yesterday.", "o": ["make", "maked", "made"], "a": 2, "ok": "정확해요! make → made", "no": "make는 불규칙 → made"}, {"k": "q", "q": "Yesterday I ____ my old friend at the mall.", "o": ["meet", "met", "meeted"], "a": 1, "ok": "맞아요! meet → met", "no": "meet → met (불규칙)"}, {"k": "m", "t": "정리! 불규칙 동사는 표를 보고 **소리 내어** 외우기 👍"}], "notes": {"table": [["현재 → 과거", "현재 → 과거", "현재 → 과거"], ["go → went", "come → came", "eat → ate"], ["have → had", "do → did", "see → saw"], ["make → made", "get → got", "give → gave"], ["take → took", "write → wrote", "drink → drank"], ["buy → bought", "think → thought", "bring → brought"], ["teach → taught", "catch → caught", "meet → met"], ["sleep → slept", "leave → left", "lose → lost"], ["tell → told", "send → sent", "sit → sat"], ["run → ran", "swim → swam", "ride → rode"], ["put → put", "cut → cut", "read → read"]], "tips": ["put, cut, hit, read는 현재와 과거 모양이 같다 (read 발음만 [red])", "3인칭 단수 주어인데 -s가 없으면 과거형 (She read ~ = 읽었다)"]}, "sets": {"workbook": [{"k": "pk", "q": "We [goed/went*] to Jeju last summer.", "e": "go → went"}, {"k": "pk", "q": "I [eated/ate*] pizza for lunch.", "e": "eat → ate"}, {"k": "pk", "q": "She [buyed/bought*] a new bag yesterday.", "e": "buy → bought"}, {"k": "pk", "q": "He [maked/made*] a mistake.", "e": "make → made"}, {"k": "bl", "q": "과거형: come → (came) / see → (saw) / get → (got)", "e": "불규칙"}, {"k": "bl", "q": "과거형: teach → (taught) / write → (wrote) / sleep → (slept)", "e": "불규칙"}, {"k": "bl", "q": "My mom (gave) me a present yesterday. ← give", "e": "give → gave"}, {"k": "bl", "q": "Tom (took) many pictures in Paris. ← take", "e": "take → took"}, {"k": "fx", "q": "I drinked milk this morning.", "w": "drinked", "a": ["drank"], "e": "drink → drank"}, {"k": "fx", "q": "She catched a cold last week.", "w": "catched", "a": ["caught"], "e": "catch → caught"}], "practiceA": [{"k": "ch", "q": "동사의 현재형과 과거형이 잘못 짝지어진 것은?", "o": ["run – ran", "sit – sat", "swim – swam", "think – thinked", "ride – rode"], "a": 3, "e": "think → thought"}, {"k": "ch", "q": "빈칸에 알맞은 것은? They ____ a great time at the party last night.", "o": ["have", "has", "had", "haved", "having"], "a": 2, "e": "have → had"}, {"k": "ch", "q": "밑줄 친 동사가 과거형인 것은?", "o": ["I read books every day.", "She reads a lot.", "They put the box here yesterday.", "We cut paper every morning.", "He puts his bag on the chair."], "a": 2, "e": "③ yesterday → put(과거)"}, {"k": "bl", "q": "He (lost) his wallet yesterday. ← lose", "e": "lose → lost"}, {"k": "bl", "q": "We (met) our teacher at the bus stop. ← meet", "e": "meet → met"}, {"k": "pk", "q": "Jenny [writed/wrote*] a letter to her grandma.", "e": "write → wrote"}, {"k": "pk", "q": "I [thinked/thought*] about you yesterday.", "e": "think → thought"}, {"k": "fx", "q": "My dad teached me English.", "w": "teached", "a": ["taught"], "e": "teach → taught"}, {"k": "ox", "q": "She found her key under the bed.", "a": true, "e": "find → found ✔"}, {"k": "ox", "q": "We seed a rainbow yesterday.", "a": false, "e": "see → saw"}], "practiceB": [{"k": "wr", "q": "나는 어제 도서관에 갔다. (go to the library, yesterday)", "a": ["I went to the library yesterday.", "Yesterday I went to the library."], "e": "go → went"}, {"k": "wr", "q": "그는 아침으로 빵을 먹었다. (eat bread, for breakfast)", "a": ["He ate bread for breakfast."], "e": "eat → ate"}, {"k": "or", "q": "우리는 어젯밤에 별을 봤다.", "a": "We saw stars last night.", "e": "see → saw"}, {"k": "or", "q": "그녀는 친구에게 문자를 보냈다.", "a": "She sent a message to her friend.", "e": "send → sent"}, {"k": "fx", "q": "Minho bringed his dog to the park.", "w": "bringed", "a": ["brought"], "e": "bring → brought"}, {"k": "fx", "q": "I leaved home at seven.", "w": "leaved", "a": ["left"], "e": "leave → left"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He sleeped late.\nⓑ They raw a picture.", "Mina not is drawing a picture.", "Mina don't draw a picture."], "a": 1, "e": "isn't + -ing"}, {"k": "ch", "q": "대화가 어색한 것은?", "o": ["A: Are you eating? B: Yes, I am.", "A: Is it raining? B: No, it isn't.", "A: Are they swimming? B: Yes, they are.", "A: Is Ted sleeping? B: No, he doesn't.", "A: Are we going the right way? B: Yes, we are."], "a": 3, "e": "④ No, he isn't."}, {"k": "bl", "q": "그녀는 지금 TV를 보고 있지 않다. → She (isn't|is not) watching TV now.", "e": "isn't"}, {"k": "bl", "q": "그들은 축구를 하고 있니? → (Are) they (playing) soccer?", "e": "Are + playing"}, {"k": "pk", "q": "A: Is your dog sleeping? B: No, [it isn't*/it doesn't].", "e": "Is로 물으면 isn't"}, {"k": "pk", "q": "We [aren't*/don't] using the computer.", "e": "진행형 → aren't"}, {"k": "fx", "q": "Is you listening to me?", "w": "Is", "a": ["Are"], "e": "you → Are"}, {"k": "ox", "q": "A: Are you studying? B: Yes, I do.", "a": false, "e": "→ Yes, I am."}, {"k": "ox", "q": "He isn't wearing glasses today.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "나는 지금 거짓말을 하고 있지 않다. (tell a lie, now)", "a": ["I am not telling a lie now."], "e": "am not + telling"}, {"k": "wr", "q": "그는 지금 운전을 하고 있니? (drive, now)", "a": ["Is he driving now?"], "e": "Is + 주어 + driving"}, {"k": "or", "q": "아이들은 지금 자고 있지 않다.", "a": "The kids aren't sleeping now.", "e": "aren't + sleeping"}, {"k": "or", "q": "너의 엄마는 저녁을 요리하고 계시니?", "a": "Is your mom cooking dinner?", "e": "Is + 주어 + cooking"}, {"k": "fx", "q": "Does she talking on the phone?", "w": "Does", "a": ["Is"], "e": "진행형 의문 → Is"}, {"k": "fx", "q": "They aren't play outside.", "w": "play", "a": ["playing"], "e": "aren't + -ing"}, {"k": "ch", "q": "다음 중 대답이 바른 것은?", "o": ["Are you reading? — Yes, I'm.", "Is it snowing? — No, it doesn't.", "Are the boys running? — Yes, they are.", "Is Sam eating? — No, Sam isn't.", "Are you and Amy talking? — Yes, you are."], "a": 2, "e": "① I am ② it isn't ④ he isn't ⑤ we are"}, {"k": "bl", "q": "A: (Are) you doing your homework? B: No, I (am not|'m not). I'm playing games.", "e": "Are / am not"}, {"k": "bl", "q": "A: (Is) Jake taking a shower? B: Yes, he (is).", "e": "Is / is"}, {"k": "wr", "q": "A: 그 아이들은 지금 노래를 부르고 있니? B: 아니, 그렇지 않아. (B의 대답만 쓰시오)", "a": ["No, they aren't."], "e": "Are they ~? → No, they aren't."}]}}, {"tag": "hk1-03-4-3", "name": "진행시제: 과거진행시제", "talk": [{"k": "m", "t": "'(그때) ~하고 있었다'는 **과거진행형**: [was] / [were] + -ing 🎞️"}, {"k": "ex", "en": "I was sleeping at ten last night.", "ko": "나는 어젯밤 10시에 자고 있었다."}, {"k": "ex", "en": "They were playing soccer then.", "ko": "그들은 그때 축구를 하고 있었다."}, {"k": "m", "t": "I, he, she, it, 단수 → was / you, we, they, 복수 → were (Ch.1 be동사 과거와 같아요)"}, {"k": "q", "q": "At 7 p.m. yesterday, we ____ dinner.", "o": ["are having", "were having", "was having"], "a": 1, "ok": "맞아요! 어제 7시 + we → were having", "no": "어제(과거) + we → were + -ing"}, {"k": "m", "t": "부정: wasn't / weren't + -ing / 의문: Was / Were + 주어 + -ing ~?"}, {"k": "ex", "en": "Were you sleeping? — No, I wasn't. I was studying.", "ko": "너 자고 있었니? — 아니, 공부하고 있었어."}, {"k": "q", "q": "Was she crying? — Yes, she ____.", "o": ["did", "was", "is"], "a": 1, "ok": "정확해요! Was로 물으면 was로", "no": "Was로 물었으니 → Yes, she was."}, {"k": "m", "t": "단순과거와 비교: I watched TV. (봤다 — 끝난 일) / I was watching TV at nine. (9시에 보고 있던 중)"}, {"k": "q", "q": "Tom ____ a book at that time.", "o": ["is reading", "was reading", "were reading"], "a": 1, "ok": "맞아요! at that time(그때) + Tom → was reading", "no": "그때(과거) + Tom(단수) → was reading"}, {"k": "m", "t": "정리! **과거 한 시점 + 하고 있던 중 → was / were + -ing** 👍"}], "notes": {"table": [["구분", "형태", "예"], ["긍정", "was / were + -ing", "I was reading then."], ["부정", "wasn't / weren't + -ing", "They weren't listening."], ["의문", "Was / Were + 주어 + -ing ~?", "Was he sleeping? — Yes, he was."]], "tips": ["과거 한 시점 표현: then, at that time, at 9 last night, at 3 p.m. yesterday", "I / he / she / it / 단수 → was, you / we / they / 복수 → were"]}, "sets": {"workbook": [{"k": "pk", "q": "I [was*/were] wa es, he did.", "a": false, "e": "→ Yes, he was."}, {"k": "ox", "q": "They were playing badminton at 5 p.m. yesterday.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "나는 어젯밤 10시에 숙제를 하고 있었다. (do my homework, at 10 last night)", "a": ["I was doing my homework at 10 last night.", "I was doing my homework at ten last night."], "e": "was + doing"}, {"k": "wr", "q": "그들은 그때 TV를 보고 있지 않았다. (watch TV, then)", "a": ["They weren't watching TV then."], "e": "weren't + watching"}, {"k": "or", "q": "그 개는 문 앞에서 자고 있었다.", "a": "The dog was sleeping in front of the door.", "e": "was + sleeping"}, {"k": "or", "q": "너는 그때 음악을 듣고 있었니?", "a": "Were you listening to music then?", "e": "Were + 주어 + -ing"}, {"k": "fx", "q": "She was writeing a letter.", "w": "writeing", "a": ["writing"], "e": "-e 빼고 + ing"}, {"k": "fx", "q": "Were your dad driving then?", "w": "Were", "a": ["Was"], "e": "your dad → Was"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I was taking a nap then.\nⓑ They was running.\nⓒ Was it snowing?\nⓓ We weren't eating.\nⓔ He wasn't swim.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ were / ⓔ swimming"}, {"k": "bl", "q": "I am reading a book now. → I (was) (reading) a book at that time.", "e": "was + reading"}, {"k": "bl", "q": "They are playing soccer now. → They (were) (playing) soccer then.", "e": "were + playing"}, {"k": "wr", "q": "A: 너는 그때 자고 있었니? B: 응, 그랬어. (B의 대답만 쓰시오)", "a": ["Yes, I was."], "e": "Were you ~? → Yes, I was."}]}}, {"tag": "hk1-03-5", "name": "현재완료시제", "talk": [{"k": "m", "t": "마지막! **현재완료**: [have] / [has] + 과거분사(p.p.) — 과거의 일이 **지금과 이어질 때** 써요 🔗"}, {"k": "m", "t": "과거분사(p.p.)는 규칙 동사면 과거형과 같아요 (play - played - played). 불규칙은 외우기: go - went - [gone], be - was/were - [been], see - saw - seen, eat - ate - eaten, do - did - done"}, {"k": "m", "t": "① **계속** '~해 왔다' — for(~ 동안) / since(~ 이후로)"}, {"k": "ex", "en": "I have lived in Seoul for five years.", "ko": "나는 5년 동안 서울에 살아 왔다. (지금도 산다)"}, {"k": "m", "t": "② **경험** '~해 본 적 있다' — ever, n "o": ["You had not better be late.", "You had better not be late.", "You had better not to be late.", "You had better be not late.", "You don't had better be late."], "a": 1, "e": "had better not + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She cans dance.\nⓑ We had to walk home.\nⓒ It may rain tonight.\nⓓ He doesn't can drive.\nⓔ Could you open the door?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ can / ⓓ can't"}, {"k": "ch", "q": "빈칸에 has to가 들어갈 수 있는 것은?", "o": ["They ____ study.", "I ____ go now.", "She ____ clean her room.", "You ____ be quiet.", "We ____ leave."], "a": 2, "e": "3인칭 단수 → has to"}, {"k": "ch", "q": "밑줄 친 must의 쓰임이 나머지와 다른 것은?", "o": ["You must wear a seat belt.", "We must keep the rules.", "Students must wear uniforms.", "He must be very tired.", "You must finish it today."], "a": 3, "e": "④ 추측 / 나머지는 의무"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["She can speaks English.", false], ["You should go to bed now.", true], ["May I use your phone?", true], ["He will can win.", false], ["We had to wait for an hour.", true], ["You must not run here.", true], ["Does he can drive?", false], ["I'd like to visit Rome.", true], ["It may be cold tonight.", true], ["She have to finish it.", false], ["You'd better not be late.", true], ["You had better to go.", false]], "e": "ⓐ speak ⓓ be able to win ⓖ Can he drive ⓙ has to ⓛ had better go"}, {"k": "m12", "q": "다음 12개 문장 중 어법·흐름상 어색한 것을 모두 고르시오.", "s": [["He won first prize. He must be happy.", true], ["It's Sunday. You must not go to school.", false], ["Could you pass me the salt?", true], ["She is in Japan now. She can't be here.", true], ["Would you like some tea? — Yes, I like.", false], ["You have a cold. You should rest.", true], ["I couldn't sleep last night.", true], ["Will you help me? — Sure.", true], ["He may is right.", false], ["We don't have to hurry. We have time.", true], ["You must be tired. You walked all day.", true], ["Can I go out? — Yes, I can.", false]], "e": "ⓑ 일요일이라 갈 필요 없다 → don't have to ⓔ Yes, please. ⓘ may be ⓛ Yes, you can."}, {"k": "wr", "q": "같은 뜻이 되도록 have to를 써서 바꾸시오. She must clean her room.", "a": ["She has to clean her room."], "e": "has to"}, {"k": "wr", "q": "같은 뜻이 되도록 be able to를 써서 바꾸시오. They could finish the work.", "a": ["They were able to finish the work."], "e": "were able to"}]}}, {"book": "hk1", "chapter": {"id": "05", "name": "문장의 형식", "title": "해커스 중학영문법 1학년 · Chapter 5 문장의 형식"}, "units": [{"tag": "hk1-05-1-1", "name": "1형식과 2형식", "talk": [{"k": "m", "t": "Chapter 5는 **문장의 형식**! 영어 문장은 뼈대가 다섯 가지예요 🦴 먼저 문장을 이루는 재료부터."}, {"k": "m", "t": "주어(S) '~은/는', 동사(V) '~하다', 목적어(O) '~을/를', 보어(C) '주어나 목적어를 설명하는 말'"}, {"k": "m", "t": "**1형식** = 주어 + 동사 (S + V). 동사만 있어도 뜻이 완성돼요."}, {"k": "ex", "en": "The baby cries.", "ko": "그 아기는 운다."}, {"k": "ex", "en": "Birds fly in the sky.", "ko": "새들은 하늘을 난다. (in the sky는 꾸며 주는 말, 수식어)"}, {"k": "m", "t": "⚠️ 뒤에 붙은 장소·시간 표현(in the sky, at home, every day)은 **수식어**라서 형식을 셀 때 빼요!"}, {"k": "q", "q": "She sings beautifully. 는 몇 형식?", "o": ["1형식", "2형식", "3형식"], "a": 0, "ok": "맞아요! She(S) + sings(V), beautifully는 수식어", "no": "beautifully는 꾸며 주는 말(수식어) → 주어 + 동사만 남아요 → 1형식"}, {"k": "m", "t": "**2형식** = 주어 + 동사 + [보어] (S + V + C). 보어는 주어가 '누구인지, 어떤 상태인지' 설명해요."}, {"k": "ex", "en": "He is a doctor. / He is kind.", "ko": "그는 의사다. (명사 보어) / 그는 친절하다. (형용사 보어)"}, {"k": "m", "t": "2형식 동사: be(~이다), become(~이 되다), get / turn(~해지다), stay / keep(~인 채로 있다)"}, {"k": "ex", "en": "She became a singer. / It got dark.", "ko": "그녀는 가수가 되었다. / 어두워졌다."}, {"k": "q", "q": "The leaves turned red. 는 몇 형식?", "o": ["1형식", "2형식", "3형식"], "a": 1, "ok": "정확해요! red가 주어(leaves)의 상태를 설명하는 보어", "no": "red는 '잎이 빨갛게 된' 상태를 설명하는 보어 → 2형식"}, {"k": "m", "t": "⚠️ 보어 자리에는 **명사나 형용사**! 부사(-ly)는 ✗: She looks happy. (happily ✗)"}, {"k": "m", "t": "정리! **1형식 S + V / 2형식 S + V + C(명사·형용사)** 👍"}], "notes": {"table": [["형식", "구조", "예"], ["1형식", "주어 + 동사 (+ 수식어)", "The sun rises. / He runs fast."], ["2형식", "주어 + 동사 +  [calm*/calmly].", "e": "stay + 형용사"}, {"k": "pk", "q": "The students [stood*/were stood] in line.", "e": "1형식 S + V"}, {"k": "fx", "q": "The story sounds strangely.", "w": "strangely", "a": ["strange"], "e": "sound + 형용사"}, {"k": "ox", "q": "My sister grew tall. 는 2형식이다.", "a": true, "e": "tall = 보어 ✔"}, {"k": "ox", "q": "He walks every day. 는 2형식이다.", "a": false, "e": "every day는 수식어 → 1형식"}], "practiceB": [{"k": "wr", "q": "그녀는 유명한 배우가 되었다. (become, a famous actor)", "a": ["She became a famous actor."], "e": "2형식 S + V + C"}, {"k": "wr", "q": "잎들이 노랗게 변했다. (the leaves, turn, yellow)", "a": ["The leaves turned yellow."], "e": "turn + 형용사"}, {"k": "or", "q": "그 아이들은 운동장에서 놀았다.", "a": "The children played in the playground.", "e": "1형식 + 수식어"}, {"k": "or", "q": "우리는 그 소식을 듣고 슬퍼졌다.", "a": "We got sad at the news.", "e": "get + 형용사"}, {"k": "fx", "q": "Please keep silently.", "w": "silently", "a": ["silent", "quiet"], "e": "keep + 형용사"}, {"k": "fx", "q": "He became angrily.", "w": "angrily", "a": ["angry"], "e": "보어 → 형용사"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The baby is sleeping.\nⓑ She became a nurse.\nⓒ It got warmly.\nⓓ The sun rises in the east.\nⓔ He stayed calmly.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ warm / ⓔ calm"}, {"k": "bl", "q": "The weather was nice. → The weather (became|got|turned) worse. (나빠졌다)", "e": "2형식 동사 + 형용사"}, {"k": "bl", "q": "He is a student. → He will (become|be) a teacher next year.", "e": "will + become"}, {"k": "wr", "q": "그 버스는 늦게 도착했다. (the bus, arrive, late)", "a": ["The bus arrived late."], "e": "1형식 + 수식어"}]}}, {"tag": "hk1-05-1-2", "name": "2형식: 감각동사", "talk": [{"k": "m", "t": "2형식 중에 시험에 가장 많이 나오는 **감각동사**! 👀👂👃👅✋"}, {"k": "m", "t": "look(~해 보이다), sound(~하게 들리다), smell(~한 냄새가 나다), taste(~한 맛이 나다), feel(~한 느낌이 들다)"}, {"k": "ex", "en": "You look tired.", "ko": "너는 피곤해 보인다."}, {"k": "ex", "en": "This cake tastes sweet.", "ko": "이 케이크는 단맛이 난다."}, {"k": "m", "t": "⚠️ 감각동사 뒤에는 **형용사**! 우리말이 '~하게'라도 부사(-ly) ✗ → ": "bl", "q": "Your plan is great. = Your plan (sounds) great. (들리다)", "e": "sound + 형용사"}, {"k": "bl", "q": "The bag is like new. → The bag (looks) new. (새것처럼 보인다)", "e": "look + 형용사"}, {"k": "wr", "q": "그 수프는 너무 짠 맛이 났다. (the soup, taste, too salty)", "a": ["The soup tasted too salty."], "e": "taste + 형용사"}]}}, {"tag": "hk1-05-2-1", "name": "3형식과 4형식", "talk": [{"k": "m", "t": "**3형식** = 주어 + 동사 + [목적어] (S + V + O). 목적어는 '~을/를'"}, {"k": "ex", "en": "I like music.", "ko": "나는 음악을 좋아한다."}, {"k": "q", "q": "We play soccer after school. 는 몇 형식?", "o": ["1형식", "2형식", "3형식"], "a": 2, "ok": "맞아요! soccer = 목적어(~을)", "no": "soccer '축구를' = 목적어 → 3형식 (after school은 수식어)"}, {"k": "m", "t": "⚠️ 2형식 보어 vs 3형식 목적어: He became **a teacher** (그 = 선생님 → 보어) / He met **a teacher** (그 ≠ 선생님 → 목적어)"}, {"k": "m", "t": "**4형식** = 주어 + 동사 + 간접목적어(~에게) + 직접목적어(~을) — '~에게 …을 주다' 형태!"}, {"k": "ex", "en": "My mom gave me a present.", "ko": "엄마는 나에게 선물을 주셨다."}, {"k": "m", "t": "4형식 동사(수여동사): give, send, show, tell, teach, write, bring, lend, buy, make, cook, get, ask"}, {"k": "q", "q": "He showed us his photos. 에서 '~에게'에 해당하는 말은?", "o": ["He", "us", "his photos"], "a": 1, "ok": "정확해요! us = 우리에게 (간접목적어)", "no": "us(우리에게)가 간접목적어, his photos(사진을)가 직접목적어"}, {"k": "m", "t": "순서 주의! **사람(~에게) 먼저, 물건(~을) 나중**: She sent [me] a letter. (sent a letter me ✗)"}, {"k": "q", "q": "어순이 바른 것은?", "o": ["Tom bought a bike me.", "Tom bought me a bike.", "Tom me bought a bike."], "a": 1, "ok": "맞아요! 동사 + 사람 + 물건", "no": "4형식은 동사 + ~에게 + ~을 → bought me a bike"}, {"k": "m", "t": "정리! **3형식 S + V + O / 4형식 S + V + 사람 + 물건** 👍"}], "notes": {"table": [["형식", "구조", "예"], ["3형식", "주어 + 동사 + 목적어(~을)", "She loves cats."], ["4형식", "주어 + 동사 + 간접목적어(~에게) + 직접목적어(~을)", "He gave me a book."]], "tips": ["4형식 동사: give, send, show, tell, teach, write, bring, lend, buy, make, cook, get, ask", "4형식 순서: 사람 → 물건", "주어 = 뒤의 명사 → 보어(2형식) / 주어 ≠ 뒤의 명사 → 목적어(3형식)"]}, "sets": {"workbook": [{"k": "ch", "q": "I ate an apple. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 2, "e": "an apple = 목적어"}, {"k": "ch", "q": "She told me a funny story. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 3, "e": "me(~에게) + a funny story(~을)"}, {"k": "ch", "q": "He became a soccer player. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 1, "e": "he = a soccer player → 보어"}, {"k": "ch", "q": "He met a soccer player. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 2, "e": "he ≠ a soccer player → 목적어"}, {"k": "pk", "q": "My dad cooked [us dinner*/dinner us].", "e": "사람 + 물건"}, {"k": "pk", "q": "Can you lend [me your pen*/your pen me]?", "e": "사람 + 물건"}, {"k": "bl", "q": "나는 그에게 이메일을 보냈다. → I sent (him) an email.", "e": "간접목적어 him"}, {"k": "bl", "q": "Ms. Lee teaches (us) English. (우리에게)", "e": "간접목적어 us"}, {"k": "fx", "q": "She gave I a gift.", "w": "I", "a": ["me"], "e": "간접목적어 자리 → me"}, {"k": "fx", "q": "He showed I his new phone.", "w": "I", "a": ["me"], "e": "목적어 자리 → me"}], "practiceA": [{"k": "ch", "q": "문장의 형식이 나머지와 다른 것은?", "o": ["I read the book.", "She wrote a letter.", "We visited the museum.", "He gave me a pen.", "They love animals."], "a": 3, "e": "④ 4형식 / 나머지는 3형식"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Grandma made ____.", "o": ["a cake me", "me a cake", "me to a cake", "a cake to me for", "I a cake"], "a": 1, "e": "4형식 사람 + 물건"}, {"k": "ch", "q": "밑줄 친 부분이 목적어가 아닌 것은?", "o": ["I love pizza.", "She became a nurse.", "We need water.", "He bought a hat.", "They watched a movie."], "a": 1, "e": "② a nurse = 보어"}, {"k": "bl", "q": "그는 나에게 길을 알려 주었다. → He showed (me) the way.", "e": "me = ~에게"}, {"k": "bl", "q": "Jenny는 그녀의 친구에게 카드를 썼다. → Jenny wrote (her) friend a card.", "e": "her friend = ~에게"}, {"k": "pk", "q": "Please bring [me a glass of water*/a glass of water me].", "e": "사람 + 물건"}, {"k": "pk", "q": "I [told*/said] him the truth.", "e": "tell + 사람 + 물건 (say는 4형식 ✗)"}, {"k": "fx", "q": "Mom bought I a new bag.", "w": "I", "a": ["me"], "e": "간접목적어 자리 → me"}, {"k": "ox", "q": "He sent me a text message. 는 4형식이다.", "a": true, "e": "✔"}, {"k": "ox", "q": "She became a famous writer. 는 3형식이다.", "a": false, "e": "she = writer → 2형식"}], "practiceB": [{"k": "wr", "q": "나의 아빠는 나에게 자전거를 사 주셨다. (buy, me, a bike)", "a": ["My dad bought me a bike.", "My father bought me a bike."], "e": "4형식"}, {"k": "wr", "q": "그 선생님은 우리에게 재미있는 이야기를 해 주셨다. (tell, us, a funny story)", "a": ["The teacher told us a funny story."], "e": "4형식"}, {"k": "or", "q": "나는 매일 아침 우유를 마신다.", "a": "I drink milk every morning.", "e": "3형식"}, {"k": "or", "q": "그녀는 나에게 그녀의 사진을 보여 주었다.", "a": "She showed me her pictures.", "e": "4형식"}, {"k": "fx", "q": "Please send he the file.", "w": "he", "a": ["him"], "e": "간접목적어 자리 → him"}, {"k": "fx", "q": "He taught they math.", "w": "they", "a": ["them"], "e": "목적어 자리 → them"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She sent me a postcard.\nⓑ He bought a cap me.\nⓒ I like soccer.\nⓓ Show me your ticket.\nⓔ She told he a secret.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ bought me a cap / ⓔ told him"}, {"k": "bl", "q": "Jun lent (me) his umbrella. (나에게)", "e": "간접목적어 me"}, {"k": "bl", "q": "My uncle got (us) concert tickets. (우리에게)", "e": "간접목적어 us"}, {"k": "wr", "q": "엄마는 우리에게 맛있는 점심을 요리해 주셨다. (cook, us, a delicious lunch)", "a": ["Mom cooked us a delicious lunch.", "My mom cooked us a delicious lunch."], "e": "4형식"}]}}, {"tag": "hk1-05-2-2", "name": "4형식을 3형식으로 바꾸는 법", "talk": [{"k": "m", "t": "4형식 '사람 + 물건'을 **물건 먼저, 사람 나중**으로 바꾸면 3형식! 이때 사람 앞에 **전치사**를 넣어요 🔄"}, {"k": "ex", "en": "He gave me a book. → He gave a book to me.", "ko": "그는 나에게 책을 주었다."}, {"k": "m", "t": "전치사는 동사에 따라 달라요! ① [to]: give, send, show, tell, teach, write, bring, lend (상대에게 전해 주는 동사)"}, {"k": "m", "t": "② [for]: buy, make, cook, get, find (상대를 위해 해 주는 동사)"}, {"k": "ex", "en": "Dad made me a kite. → Dad made a kite for me.", "ko": "아빠는 나에게 연을 만들어 주셨다."}, {"k": "m", "t": "③ [of]: ask"}, {"k": "ex", "en": "May I ask you a question? → May I ask a question of you?", "ko": "질문 하나 해도 될까요?"}, {"k": "q", "q": "She sent me a letter. → She sent a letter ____ me.", "o": ["to", "for", "of"], "a": 0, "ok": "맞아요! send → to", "no": "send는 전해 주는 동사 → to"}, {"k": "q", "q": "He bought her flowers. → He bought flowers ____ her.", "o": ["to", "for", "of"], "a": 1, "ok": "정확해요! buy → for", "no": "buy는 '~을 위해 사 주다' → for"}, {"k": "m", "t": "⚠️ 3형식으로 바꾸면 순서가 **물건 + 전치사 + 사람**! gave to me a book ✗"}, {"k": "m", "t": "정리! **to: give send show tell teach write bring lend / for: buy make cook get find / of: ask** 👍"}], "notes": {"table": [["전치사", "동사", "예 (4형식 → 3형식)"], ["to", "give, send, show, tell, teach, write, bring, lend", "He gave me a pen. → He gave a pen to me."], ["for", "buy, make, cook, get, find", "She made us cookies. → She made cookies for us."], ["of", "ask", "He asked me a question. → He asked a question of me."]], "tips": ["3형식 순서: 동사 + 물건 + 전치사 + 사람", "to = 상대에게 전함 / for = 상대를 위해 해 줌"]}, "sets": {"workbook": [{"k": "pk", "q": "I gave a gift [to*/for] my mom.", "e": "give → to"}, {"k": "pk", "q": "Dad cooked dinner [to/for*] us.", "e": "cook → for"}, {"k": "pk", "q": "She showed her pictures [to*/of] me.", "e": "show → to"}, {"k": "pk", "q": "He asked a favor [to/of*] me.", "e": "ask → of"}, {"k": "bl", "q": "Tom sent me a card. → Tom sent a card (to) me.", "e": "send → to"}, {"k": "bl", "q": "Mom bought me a coat. → Mom bought a coat (for) me.", "e": "buy → for"}, {"k": "bl", "q": "Mr. Kim teaches us science. → Mr. Kim teaches science (to) us.", "e": "teach → to"}, {"k": "bl", "q": "She made her son a sandwich. → She made a sandwich (for) her son.", "e": "make → for"}, {"k": "fx", "q": "I'll lend my bike for you.", "w": "for", "a": ["to"], "e": "lend → to"}, {"k": "fx", "q": "Grandma made a scarf to me.", "w": "to", "a": ["for"], "e": "make → for"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 전치사가 나머지와 다른 것은?", "o": ["He gave a ring ____ her.", "She told the story ____ us.", "I sent a message ____ him.", "Mom bought a cake ____ me.", "He showed his ID ____ the guard."], "a": 3, "e": "④ buy → for / 나머지는 to"}, {"k": "ch", "q": "4형식을 3형식으로 바르게 바꾼 것은? She cooked us spaghetti.", "o": ["She cooked spaghetti to us.", "She cooked spaghetti for us.", "She cooked for us spaghetti.", "She cooked spaghetti of us.", "She cooked us for spaghetti."], "a": 1, "e": "cook → for, 물건 + for + 사람"}, {"k": "ch", "q": "빈칸에 of가 들어가는 것은?", "o": ["He wrote a letter ____ me.", "Can I ask a question ____ you?", "She got a drink ____ me.", "I brought a gift ____ him.", "He lent money ____ her."], "a": 1, "e": "ask → of"}, {"k": "bl", "q": "Please bring the book (to) me.", "e": "bring → to"}, {"k": "bl", "q": "I found a good seat (for) my grandma.", "e": "find → for"}, {"k": "pk", "q": "He wrote a long letter [to*/for] his parents.", "e": "write → to"}, {"k": "pk", "q": "Can you get some water [to/for*] me?", "e": "get → for"}, {"k": "fx", "q": "She asked a question for the teacher.", "w": "for", "a": ["of"], "e": "ask → of"}, {"k": "ox", "q": "He gave to me a book.", "a": false, "e": "gave a book to me / gave me a book"}, {"k": "ox", "q": "My aunt made a dress for me.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "3형식으로 바꾸시오. My friend lent me his notebook.", "a": ["My friend lent his notebook to me."], "e": "lend → to"}, {"k": "wr", "q": "3형식으로 바꾸시오. Dad bought us pizza.", "a": ["Dad bought pizza for us."], "e": "buy → for"}, {"k": "or", "q": "그녀는 그 사진을 모두에게 보여 주었다. (3형식)", "a": "She showed the picture to everyone.", "e": "show → to"}, {"k": "or", "q": "엄마는 나를 위해 케이크를 만드셨다. (3형식)", "a": "Mom made a cake for me.", "e": "make → for"}, {"k": "fx", "q": "He told the news for his family.", "w": "for", "a": ["to"], "e": "tell → to"}, {"k": "fx", "q": "I will cook dinner to my parents.", "w": "to", "a": ["for"], "e": "cook → for"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She sent a package to me.\nⓑ He bought a watch to his son.\nⓒ I asked a question of him.\nⓓ Mom made pancakes for us.\nⓔ Give to me the ball.", "o" ": "____ she like spicy food?", "o": ["Is", "Does", "Can she"], "a": 1, "ok": "맞아요! like는 일반동사, she → Does", "no": "일반동사 like + she → Does"}, {"k": "q", "q": "____ you able to come?", "o": ["Do", "Are", "Can"], "a": 1, "ok": "정확해요! able 앞에는 be동사 → Are", "no": "be able to → Are you able to ~?"}, {"k": "m", "t": "**부정의문문** '~하지 않니?': Aren't you ~? / Don't you ~? / Can't you ~?"}, {"k": "ex", "en": "Don't you like it? — Yes, I do. / No, I don't.", "ko": "너 그거 안 좋아해? — 아니, 좋아해. / 응, 안 좋아해."}, {"k": "m", "t": "⚠️ 대답은 **사실**만 보고! 좋아하면 Yes, 안 좋아하면 No. 우리말 '네/아니오'와 반대처럼 느껴져요."}, {"k": "q", "q": "Aren't you hungry? (나는 배가 고프다) 의 대답은?", "o": ["Yes, I am.", "No, I'm not.", "No, I am."], "a": 0, "ok": "맞아요! 배가 고프면 Yes, I am.", "no": "사실이 '배고프다'면 → Yes, I am."}, {"k": "m", "t": "정리! **be동사 / Do·Does·Did / 조동사로 묻고, 대답은 사실 기준** 👍"}], "notes": {"table": [["종류", "의문문", "대답"], ["be동사", "Are you ~? / Was he ~?", "Yes, I am. / No, he wasn't."], ["일반동사", "Do / Does / Did + 주어 + 원형 ~?", "Yes, she does. / No, I didn't."], ["조동사", "Can / Will / Should + 주어 + 원형 ~?", "Yes, I can. / No, he won't."], ["부정의문문", "Aren't you ~? / Don't you ~?", "사실이 긍정 → Yes / 부정 → No"]], "tips": ["질문한 동사(be, do, 조동사)로 대답", "부정의문문 대답은 질문 모양이 아니라 사실 기준"]}, "sets": {"workbook": [{"k": "pk", "q": "[Is*/Does] your sister a nurse?", "e": "a nurse 앞 be동사 → Is"}, {"k": "pk", "q": "[Did*/Were] you watch the game?", "e": "watch는 일반동사 → Did"}, {"k": "pk", "q": "[Can*/Do] your dad cook?", "e": "조동사 Can + 주어 + 원형"}, {"k": "pk", "q": "Don't you know her? (나는 그녀를 안다) — [Yes, I do.*/No, I don't.]", "e": "사실 기준 → Yes"}, {"k": "bl", "q": "Was the movie good? — Yes, it (was).", "e": "be동사로 대답"}, {"k": "bl", "q": "Does Ben play tennis? — No, he (doesn't|does not).", "e": "does로 대답"}, {"k": "bl", "q": "Will you come? — Yes, I (will).", "e": "조동사로 대답"}, {"k": "bl", "q": "Isn't it cold? (춥지 않다) — (No), it isn't.", "e": "사실이 '안 춥다' → No"}, {"k": "fx", "q": "Does she can swim?", "w": "Does", "a": ["Can"], "e": "조동사 문장 → Can she swim?"} ext to the park.", "w": "When", "a": ["Where"], "e": "장소 → Where"}, {"k": "ox", "q": "A: How do you go to work? B: By subway.", "a": true, "e": "✔"}, {"k": "ox", "q": "A: Why did you call? B: Yes, I did.", "a": false, "e": "→ Because ~"}], "practiceB": [{"k": "wr", "q": "너는 그 열쇠를 어디서 찾았니? (find the key)", "a": ["Where did you find the key?"], "e": "Where + did + 주어 + 원형"}, {"k": "wr", "q": "그 수업은 언제 끝나니? (the class, end)", "a": ["When does the class end?"], "e": "When + does"}, {"k": "or", "q": "너는 왜 늦게 일어났니?", "a": "Why did you get up late?", "e": "Why + did"}, {"k": "or", "q": "너의 여행은 어땠니?", "a": "How was your trip?", "e": "How 상태"}, {"k": "fx", "q": "How are you from?", "w": "How", "a": ["Where"], "e": "출신지 → Where"}, {"k": "fx", "q": "Where did she went?", "w": "went", "a": ["go"], "e": "did + 원형"}, {"k": "ch", "q": "대답에 알맞은 의문사가 바르게 짝지어진 것을 모두 고른 것은?\nⓐ By bike. — How\nⓑ In the kitchen. — Where\nⓒ Because it's raining. — When\nⓓ Last Monday. — When\nⓔ I'm fine. — Why", "o": ["ⓐ, ⓑ, ⓓ", "ⓐ, ⓒ", "ⓑ, ⓔ", "ⓒ, ⓓ, ⓔ", "ⓐ, ⓔ"], "a": 0, "e": "ⓒ Why ⓔ How"}, {"k": "bl", "q": "A: (Where) does your uncle live? B: He lives in Busan.", "e": "Where"}, {"k": "bl", "q": "A: (How) is the weather today? B: It's sunny.", "e": "How 상태"}, {"k": "wr", "q": "너는 어떻게 그 문제를 풀었니? (solve the problem)", "a": ["How did you solve the problem?"], "e": "How + did + 주어 + 원형"}]}}, {"tag": "hk1-06-5-5", "name": "의문사: How + 형용사/부사", "talk": [{"k": "m", "t": "**How + 형용사/부사**는 '얼마나 ~한' 📏"}, {"k": "m", "t": "How old 몇 살 / How tall 키가 얼마 / How long 얼마나 오래·길이 / How far 얼마나 먼 / How often 얼마나 자주"}, {"k": "ex", "en": "How old are you? — I'm fourteen.", "ko": "몇 살이니? — 14살이야."}, {"k": "ex", "en": "How far is it from here? — It's 2 km.", "ko": "여기서 얼마나 머니? — 2킬로미터."}, {"k": "m", "t": "**How many + 복수 명사** (개수) / **How much + 셀 수 없는 명사** (양), How much ~? = 가격"}, {"k": "ex", "en": "How many books do you have? / How much water do you drink?", "ko": "책을 몇 권 가지고 있니? / 물을 얼마나 마시니?"}, {"k": "q", "q": "How ____ students are there in your class?", "o": ["much", "many", "long"], "a": 1, "ok": "맞아요! students(셀 수 있는 복수) → many", "no": "학생 수(개수) → How many"}, {"k": "q", "q": "How ____ is this T-shirt? — It's 20 dollars.", "o": ["many", "much", "old"], "a": 1, "ok": "정확해요! 가격 → How much", "no": "가격을 물을 때 → How much"}, {"k": "m", "t": "⚠️ How many 뒤에는 **복수 명사**! How many [books] (book ✗)"}, {"k": "q", "q": "How ____ do you exercise? — Three times a week.", "o": ["long", "often", "far"], "a": 1, "ok": "맞아요! 횟수(빈도) → How often", "no": "일주일에 세 번 = 빈도 → How often"}, {"k": "m", "t": "정리! **How + 형용사/부사 = 얼마나 ~ / many 개수 · much 양·가격** 👍"}], "notes": {"table": [["표현", "묻는 것", "예"], ["How old", "나이", "How old is your brother?"], ["How tall", "키·높이", "How tall are you?"], ["How long", "길이·기간", "How long does it take?"], ["How far", "거리", "How far is the station?"], ["How often", "빈도", "How often do you swim?"], ["How many + 복수 명사", "개수", "How many pens do you have?"], ["How much + 셀 수 없는 명사 / How much ~?", "양 / 가격", "How much milk is there? / How much is it?"]], "tips": ["How many 뒤 복수 명사", "가격 → How much is/are ~?"]}, "sets": {"workbook": [{"k": "pk", "q": "How [many*/much] apples do you need?", "e": "apples(복수) → many"}, {"k": "pk", "q": "How [many/much*] time do we have?", "e": "time(셀 수 없음) → much"}, {"k": "pk", "q": "How [tall*/long] is your dad? — He is 180 cm.", "e": "키 → tall"}, {"k": "pk", "q": "How [far*/often] is the beach? — It's 5 km away.", "e": "거리 → far"}, {"k": "bl", "q": "너의 할머니는 연세가 어떻게 되시니? → How (old) is your grandma?", "e": "How old"}, {"k": "bl", "q": "그것은 얼마니? → How (much) is it?", "e": "가격"}, {"k": "bl", "q": "너는 얼마나 자주 영화를 보니? → How (often) do you see movies?", "e": "빈도"}, {"k": "bl", "q": "그 영화는 얼마나 길었니? → How (long) was the movie?", "e": "길이·기간"}, {"k": "fx", "q": "How many book do you read a month?", "w": "book", "a": ["books"], "e": "How many + 복수 명사"}, {"k": "fx", "q": "How many money do you have?", "w": "many", "a": ["much"], "e": "money(셀 수 없음) → much"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? How ____ are these shoes? — They're 50 dollars.", "o": ["many", "much", "long", "old", "far"], "a": 1, "e": "가격 → How much"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: How ____ does it take to get there? B: About 30 minutes.", "o": ["far", "long", "much", "often", "many"], "a": 1, "e": "걸리는 시간 → How long"}, {"k": "ch", "q": "대화가 어색한 것은?", "o": ["A: How old is she? B: She's ten.", "A: How tall is the tower? B: It's 300 m tall.", "A: How often do you jog? B: Every day.", "A: How many cats do you have? B: Two.", "A: How far is your school? B: Twice a week."], "a": 4, "e": "⑤ 거리 → It's 1 km."}, {"k": "bl", "q": "너의 반에는 학생이 몇 명 있니? → How (many) students are in your class?", "e": "How many"}, {"k": "bl", "q": "우유가 얼마나 남았니? → How (much) milk is left?", "e": "How much"}, {"k": "pk", "q": "How [often*/long] do you visit your grandparents? — Once a month.", "e": "빈도"}, {"k": "pk", "q": "How many [brother/brothers*] do you have?", "e": "복수 명사"}, {"k": "fx", "q": "How much eggs do we need?", "w": "much", "a": ["many"], "e": "eggs(복수) → many"}, {"k": "ox", "q": "How far is it to the station? — It's about 1 km.", "a": true, "e": "✔"}, {"k": "ox", "q": "How old is this bridge? — It's 2 km long.", "a": false, "e": "나이(오래된 정도) → It's 100 years old."}], "practiceB": [{"k": "wr", "q": "너의 남동생은 몇 살이니? (how old, your brother)", "a": ["How old is your brother?", "How old is your little brother?", "How old is your younger brother?"], "e": "How old"}, {"k": "wr", "q": "너는 얼마나 자주 운동하니? (how often, exercise)", "a": ["How often do you exercise?"], "e": "How often"}, {"k": "or", "q": "이 가방은 얼마니?", "a": "How much is this bag?", "e": "가격"}, {"k": "or", "q": "너는 연필을 몇 자루 가지고 있니?", "a": "How many pencils do you have?", "e": "How many + 복수"}, {"k": "fx", "q": "How long is your sister? — She's 160 cm.", "w": "long", "a": ["tall"], "e": "키 → tall"}, {"k": "fx", "q": "How many water do you drink a day?", "w": "many", "a": ["much"], "e": "water → much"}, {"k": "ch", , "q": "너는 어디에서 그 모자를 샀니? (buy the cap)", "a": ["Where did you buy the cap?"], "e": "Where + did + 주어 + 원형"}, {"k": "wr", "q": "너는 하루에 물을 얼마나 마시니? (how much water, drink, a day)", "a": ["How much water do you drink a day?"], "e": "How much + 셀 수 없는 명사"}, {"k": "bl", "q": "A: (Who) made this cake? B: My dad (did).", "e": "Who 주어 / did"}, {"k": "bl", "q": "Your sister plays the violin, (doesn't) (she)?", "e": "부가의문문"}, {"k": "fx", "q": "How a cute baby!", "w": "How", "a": ["What"], "e": "명사 → What"}, {"k": "fx", "q": "Let's don't be late.", "w": "don't", "a": ["not"], "e": "Let's not"}, {"k": "or", "q": "너는 피자와 파스타 중 어느 것을 원하니?", "a": "Which do you want, pizza or pasta?", "e": "Which ~, A or B?"}], "test": [{"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ careful!\n____ late again.", "o": ["Be – Don't be", "Are – Don't be", "Be – Not be", "Being – Don't", "Be – Aren't"], "a": 0, "e": "Be ~ / Don't be ~"}, {"k": "ch", "q": "빈칸에 What이 들어갈 수 없는 것은?", "o": ["____ a nice car!", "____ kind people!", "____ smart she is!", "____ an old house!", "____ good weather!"], "a": 2, "e": "③ How smart she is!"}, {"k": "ch", "q": "대화가 어색한 것은?", "o": ["A: Let's go swimming. B: Sounds great.", "A: Where do you live? B: In Daegu.", "A: How often do you read? B: Every day.", "A: Who broke the cup? B: Yes, he did.", "A: How much is it? B: It's 10 dollars."], "a": 3, "e": "④ 의문사 → Jim did. 등"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Who lives next door?", "Whose bag is this?", "What does she want?", "Where you went yesterday?", "Which do you like, tea or juice?"], "a": 3, "e": "④ Where did you go yesterday?"}, {"k": "ch", "q": "빈칸에 알맞은 것은? How ____ brothers do you have?", "o": ["much", "many", "long", "often", "old"], "a": 1, "e": "복수 명사 → many"}, {"k": "ch", "q": "부가의문문이 바른 것은?", "o": ["She is kind, is she?", "You like music, aren't you?", "He can't come, can he?", "Let's go, will you?", "Tom went home, wasn't he?"], "a": 2, "e": "③"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: Didn't you see the show? B: ____ It was amazing!", "o": ["Yes, I did.", "No, I didn't.", "Yes, I didn't.", "No, I did.", "Yes, I saw."], "a": 0, "e": "봤다(사실) → Yes, I did."}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '그는 정말 빨리 달리는구나!'", "o": ["What fast he runs!", "How fast he runs!", "How fast does he run!", "What a fast he runs!", "How he runs fast!"], "a": 1, "e": "How + 부사 + 주어 + 동사"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Don't be nervous.\nⓑ Let's not argue.\nⓒ What a lovely weather!\nⓓ Who made this?\nⓔ How many money do you have?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ What lovely weather! / ⓔ much"}, {"k": "ch", "q": "대답에 알맞은 질문은? 'By subway.'", "o": ["Where do you go?", "How do you go to school?", "When do you go?", "Why do you go?", "Who goes with you?"], "a": 1, "e": "방법 → How"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 것은?", "o": ["____ is your birthday?", "____ did you arrive?", "____ does the store close?", "____ is the bank?", "____ will you leave?"], "a": 3, "e": "④ Where / 나머지는 When"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Be kind to your friends.", true], ["Don't touches the cake.", false], ["Let's not make noise.", true], ["How a beautiful flower!", false], ["What delicious cookies!", true], ["Who does know the answer?", false], ["Whose jacket is this?", true], ["Where does your dad work?", true], ["How many book do you have?", false], ["How much is this pen?", true], ["You can swim, can you?", false], ["Let's go home, shall we?", true]], "e": "ⓑ touch ⓓ What a beautiful flower ⓕ Who knows ⓘ books ⓚ can't you"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Are quiet, please.", false], ["Let's take a walk.", true], ["How tall your brother is!", true], ["What an interesting book!", true], ["Which do you like, red or blue?", true], ["What time you get up?", false], ["Why are you upset?", true], ["Who wants more cake?", true], ["How often you exercise?", false], ["He is your uncle, isn't he?", true], ["She doesn't eat fish, doesn't she?", false], ["Close the door, will you?", true]], "e": "ⓐ Be quiet ⓕ What time do you get up? ⓘ How often do you exercise? ⓚ does she"}, {"k": "wr", "q": "감탄문으로 바꾸시오. (What) It is a very big dog.", "a": ["What a big dog it is!", "What a big dog!"], "e": "What a + 형 + 명 + 주 + 동"}, {"k": "wr", "q": "부가의문문을 붙여 완성하시오. Jenny lives in Seoul, ____?", "a": ["doesn't she?", "doesn't she"], "e": "일반동사 3인칭 단수 → doesn't she"}]}}, {"book": "hk1", "chapter": {"id": "07", "name": "to부정사", "title": "해커스 중학영문법 1학년 · Chapter 7 to부정사"}, "units": [{"tag": "hk1-07-1", "name": "to부정사의 형태와 용법", "talk": [{"k": "m", "t": "Chapter 7은 **to부정사**! 동사 앞에 to를 붙여서 동사를 **명사·형용사·부사처럼** 쓰는 방법이에요 🔧"}, {"k": "m", "t": "형태: [to] + 동사원형 (to goes ✗, to went ✗)"}, {"k": "ex", "en": "I want to go home.", "ko": "나는 집에 가고 싶다."}, {"k": "q", "q": "He decided ____ abroad.", "o": ["to studies", "to study", "study to"], "a": 1, "ok": "맞아요! to + 동사원형", "no": "to 뒤에는 항상 동사원형 → to study"}, {"k": "m", "t": "부정: **not to** + 동사원형 (to not ✗) → I decided [not] to go."}, {"k": "m", "t": "용법은 세 가지! ① **명사**처럼 '~하는 것' ② **형용사**처럼 '~할' (명사 꾸미기) ③ **부사**처럼 '~하기 위해', '~해서'"}, {"k": "ex", "en": "To swim is fun. / I have homework to do. / I went out to buy milk.", "ko": "수영하는 것은 재미있다. / 나는 할 숙제가 있다. / 나는 우유를 사기 위해 나갔다."}, {"k": "q", "q": "I need a pen to write with. 의 to write는?", "o": ["명사적 용법", "형용사적 용법", "부사적 용법"], "a": 1, "ok": "맞아요! a pen을 꾸며요 '쓸 펜'", "no": "a pen(명사)을 꾸미는 '쓸' → 형용사적 용법"}, {"k": "m", "t": "⚠️ 전치사 to와 헷갈리지 말기! go **to school**(to + 명사) / want **to go**(to + 동사원형)"}, {"k": "m", "t": "정리! **to + 동사원형 / 부정 not to / 명사·형용사·부사 세 가지 용법** 👍"}], "notes": {"table": [["용법", "뜻", "예"], ["명사적 용법", "~하는 것, ~하기", "To read books is fun. / I want to read."], ["형용사적 용법", "~할, ~하는 (명사 뒤에서 꾸밈)", "I have a book to read."], ["부사적 용법", "~하기 위해(목적), ~해서(감정의 원인)", "I went to the library to read. / I'm glad to see you."]], "tips": ["to + 동사원형", "부정: not to + 동사원형", "to + 명사(장소)는 전치사 to: go to school"]}, "sets": {"workbook": [{"k": "pk", "q": "I want [to eat*/to eats] pizza.", "e": "to + 원형"}, {"k": "pk", "q": "She decided [not to*/to not] go.", "e": "부정 not to"}, {"k": "pk", "q": "He hopes [to be*/to is] a pilot.", "e": "to + be"}, {"k": "pk", "q": "We went [to*/at] the zoo yesterday.", "e": "go to + 장소"}, {"k": "ch", "q": "To learn English is fun. 의 to부정사 용법은?", "o": ["명사적 용법", "형용사적 용법", "부사적 용법"], "a": 0, "e": "'영어를 배우는 것' → 명사적"}, {"k": "ch", "q": "I have something to tell you. 의 to부정사 용법은?", "o": ["명사적 용법", "형용사적 용법", "부사적 용법"], "a": 1, "e": "something을 꾸밈 → 형용사적"}, {"k": "ch", "q": "She studied hard to pass the test. 의 to부정사 용법은?", "o": ["명사적 용법", "형용사적 용법", "부사적 용법"], "a": 2, "e": "'통과하기 위해' → 부사적(목적)"}, {"k": "bl", "q": "나는 쉬고 싶다. → I want (to) rest.", "e": "to + 원형"}, {"k": "fx", "q": "He plans to visits Jeju.", "w": "visits", "a": ["visit"], "e": "to + 원형"}, {"k": "pk", "q": "I promised [not to*/to not] be late.", "e": "부정 → not to"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? My dream is ____ a doctor.", "o": ["be", "to be", "to is", "being to", "to been"], "a": 1, "e": "to + 원형 be"}, {"k": "ch", "q": "밑줄 친 to의 쓰임이 나머지와 다른 것은?", "o": ["I want to sleep.", "She likes to dance.", "We went to the park.", "He needs to rest.", "They hope to win."], "a": 2, "e": "③ 전치사 to / 나머지는 to부정사"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I want to go out.", "She decided not to cry.", "He hopes to meets her.", "We need to hurry.", "I'd like to help you."], "a": 2, "e": "③ to meet"}, {"k": "bl", "q": "그는 아무 말도 하지 않기로 결심했다. → He decided (not) (to) say anything.", "e": "not to"}, {"k": "bl", "q": "나는 마실 물이 필요하다. → I need some water (to) drink.", "e": "형용사적"}, {"k": "pk", "q": "I'm happy [to see*/to saw] you.", "e": "to + 원형"}, {"k": "pk", "q": "Try [not to*/to not] be late.", "e": "not to"}, {"k": "fx", "q": "She wants to bought a new bag.", "w": "bought", "a": ["buy"], "e": "to + 원형"}, {"k": "ox", "q": "I went to the store to buy some bread.", "a": true, "e": "✔ (to the store 전치사 / to buy 부사적)"}, {"k": "ox", "q": "He decided to not go to the party.", "a": false, "e": "not to go"}], "practiceB": [{"k": "wr", "q": "나는 영어를 잘 말하고 싶다. (want, speak English well)", "a": ["I want to speak English well."], "e": "want + to부정사"}, {"k": "wr", "q": "그녀는 울지 않으려고 노력했다. (try, not, cry)", "a": ["She tried not to cry."], "e": "not to + 원형"}, {"k": "or", "q": "나는 오늘 할 일이 많다.", "a": "I have a lot of work to do today.", "e": "형용사적"}, {"k": "or", "q": "그는 그 버스를 타기 위해 뛰었다.", "a": "He ran to catch the bus.", "e": "부사적(목적)"}, {"k": "fx", "q": "We hope to winning the game.", "w": "winning", "a": ["win"], "e": "to + 원형"}, {"k": "fx", "q": "My plan is to traveled to Europe.", "w": "traveled", "a": ["travel"], "e": "to + 원형"}, {"k": "ch", "q": "밑줄 친 to부정사의 용법이 같은 것끼리 짝지어진 것은?\nⓐ I want to be a singer.\nⓑ I have a lot of homework to do.\nⓒ To help others is important.\nⓓ He went out to buy milk.", "o": ["ⓐ – ⓑ", "ⓐ – ⓒ", "ⓑ – ⓓ", "ⓒ – ⓓ", "ⓑ – ⓒ"], "a": 1, "e": "ⓐⓒ 명사적 / ⓑ 형용사적 / ⓓ 부사적"}, {"k": "bl", "q": "She didn't want to go. = She wanted (not) (to) go.", "e": "not to"}, {"k": "bl", "q": "나는 너를 만나서 기쁘다. → I'm glad (to) (see|meet) you.", "e": "부사적(감정의 원인)"}, {"k": "wr", "q": "우리는 함께 놀 시간이 있다. (have time, play together)", "a": ["We have time to play together."], "e": "형용사적"}]}}, {"tag": "hk1-07-2-1", "name": "명사적 용법", "talk": [{"k": "m", "t": "**명사적 용법** '~하는 것, ~하기' — 명사처럼 주어·보어·목적어 자리에 와요 📦"}, {"k": "m", "t": "① **주어**: To read books is fun. (책을 읽는 것은 재미있다) → to부정사 주어는 **단수** 취급 → [is]"}, {"k": "m", "t": "주어가 길면 가주어 **It**을 앞에 두고 진짜 주어 to부정사는 뒤로! → [It] is fun to read books."}, {"k": "ex", "en": "It is important to exercise every day.", "ko": "매일 운동하는 것은 중요하다."}, {"k": "q", "q": "____ is hard to learn Chinese.", "o": ["This", "It", "That"], "a": 1, "ok": "맞아요! 가주어 It", "no": "to부정사 진주어가 뒤에 있으면 가주어 It"}, {"k": "m", "t": "② **보어**: My dream is **to be** a chef. (내 꿈은 요리사가 되는 것이다)"}, {"k": "m", "t": "③ **목적어**: I want **to travel**. (나는 여행하는 것을 원한다)"}, {"k": "q", "q": "
