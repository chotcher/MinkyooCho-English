"}, {"k": "m", "t": "정리! **enjoy · finish · mind · keep · give up · quit · avoid · practice · stop + -ing** 👍"}], "notes": {"table": [["동명사만 목적어로 쓰는 동사", "예"], ["enjoy / finish / mind", "I enjoy singing. / He finished eating. / Do you mind waiting?"], ["keep / give up / quit / stop", "She kept talking. / Don't give up trying. / He quit smoking."], ["avoid / practice", "Avoid eating late. / I practice speaking English."]], "tips": ["to부정사를 쓰는 동사(Ch.7): want, hope, plan, decide, promise, need, learn, expect", "Would you mind -ing ~? = ~해 주시겠어요?"]}, "sets": {"workbook": [{"k": "pk", "q": "I enjoy [swimming*/to swim] in the sea.", "e": "enjoy + 동명사"}, {"k": "pk", "q": "He gave up [to smoke/smoking*].", "e": "give up + 동명사"}, {"k": "pk", "q": "Keep [trying*/to try]!", "e": "keep + 동명사"}, {"k": "pk", "q": "We want [going/to go*] to the beach.", "e": "want + to부정사"}, {"k": "bl", "q": "그녀는 방 청소를 끝냈다. → She finished (cleaning) her room.", "e": "finish + -ing"}, {"k": "bl", "q": "그는 계속 웃었다. → He kept (laughing).", "e": "keep + -ing"}, {"k": "bl", "q": "문 좀 닫아 주시겠어요? → Would you mind (closing) the door?", "e": "mind + -ing"}, {"k": "bl", "q": "나는 매일 피아노 치는 것을 연습한다. → I practice (playing) the piano every day.", "e": "practice + -ing"}, {"k": "fx", "q": "My dad quit drink coffee.", "w": "drink", "a": ["drinking"], "e": "quit + 동명사"}, {"k": "fx", "q": "Avoid eat too much sugar.", "w": "eat", "a": ["eating"], "e": "avoid + 동명사"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Would you mind ____ a little?", "o": ["wait", "to wait", "waiting", "waited", "to waiting"], "a": 2, "e": "mind + 동명사"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? I ____ playing computer games.", "o": ["enjoy", "finished", "gave up", "want", "stopped"], "a": 3, "e": "want + to부정사"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He enjoys cooking.", "She finished reading the book.", "I hope seeing you soon.", "They kept running.", "We avoided talking to him."], "a": 2, "e": "③ hope to see"}, {"k": "bl", "q": "그 아기는 우는 것을 멈췄다. → The baby stopped (crying).", "e": "stop + -ing"}, {"k": "bl", "q": "포기하지 마! → Don't give up (trying)!", "e": "give up + -ing"}, {"k": "pk", "q": "He decided [to study*/studying] abroad.", "e": "decide + to부정사"}, {"k": "pk", "q": "I finished [to do/doing*] my homework.", "e": "finish + 동명사"}, {"k": "fx", "q": "She practices speak English every day.", "w": "speak", "a": ["speaking"], "e": "practice + 동명사"}, {"k": "ox", "q": "We enjoyed talking with our teacher.", "a": true, "e": "✔"}, {"k": "ox", "q": "I don't mind to wait.", "a": false, "e": "mind waiting"}], "practiceB": [{"k": "wr", "q": "나는 친구들과 축구하는 것을 즐긴다. (enjoy, play soccer with my friends)", "a": ["I enjoy playing soccer with my friends."], "e": "enjoy + -ing"}, {"k": "wr", "q": "그녀는 너무 많이 먹는 것을 피한다. (avoid, eat too much)", "a": ["She avoids eating too much."], "e": "avoid + -ing"}, {"k": "or", "q": "그는 마침내 그 책을 쓰는 것을 끝냈다.", "a": "He finally finished writing the book.", "e": "finish + -ing"}, {"k": "or", "q": "창문 좀 열어 주시겠어요?", "a": "Would you mind opening the window?", "e": "mind + -ing"}, {"k": "fx", "q": "They kept talk during the movie.", "w": "talk", "a": ["talking"], "e": "keep + -ing"}, {"k": "fx", "q": "I enjoy listen to music.", "w": "listen", "a": ["listening"], "e": "enjoy + -ing"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She gave up dieting.\nⓑ I want to visit Paris.\nⓒ He finished to clean the car.\nⓓ We plan going camping.\nⓔ Stop making noise.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ cleaning / ⓓ plan to go"}, {"k": "bl", "q": "He stopped. He doesn't play games now. → He stopped (playing) games.", "e": "stop + -ing"}, {"k": "bl", "q": "We decided (to) (go) on a picnic, and we enjoyed (having) lunch outside.", "e": "decide + to / enjoy + -ing"}, {"k": "wr", "q": "그는 그 문제를 푸는 것을 포기하지 않았다. (give up, solve the problem)", "a": ["He didn't give up solving the problem.", "He did not give up solving the problem."], "e": "give up + -ing"}]}}, {"tag": "hk1-08-2-2", "name": "동명사와 to부정사를 모두 목적어로 쓰는 동사", "talk": [{"k": "m", "t": "어떤 동사는 동명사와 to부정사를 **둘 다** 목적어로 쓸 수 있고 **뜻도 같아요** 🤝"}, {"k": "m", "t": "like, love, hate(싫어하다), start, begin(시작하다), continue(계속하다)"}, {"k": "ex", "en": "I like swimming. = I like to swim.", "ko": "나는 수영하는 것을 좋아한다."}, {"k": "ex", "en": "It started raining. = It started to rain.", "ko": "비가 내리기 시작했다."}, {"k": "q", "q": "She began ____ the violin at seven.", "o": ["playing", "to play", "둘 다 가능"], "a": 2, "ok": "맞아요! begin은 둘 다 OK", "no": "begin은 동명사, to부정사 모두 가능"}, {"k": "m", "t": "정리하면 세 그룹! ① to부정사만: want, hope, plan, decide ② 동명사만: enjoy, finish, mind, give up ③ 둘 다: like, love, hate, start, begin, continue"}, {"k": "q", "q": "빈칸에 to cook과 cooking이 모두 들어갈 수 있는 것은? I ____ for my family.", "o": ["enjoy", "love", "want"], "a": 1, "ok": "정확해요! love는 둘 다", "no": "enjoy는 동명사만, want는 to부정사만, love는 둘 다"}, {"k": "m", "t": "⚠️ stop은 동명사만 목적어! stop to ~ 는 '~하기 위해 멈추다'(목적)라서 뜻이 달라요: He stopped **to rest**. (쉬기 위해 멈췄다)"}, {"k": "m", "t": "정리! **like · love · hate · start · begin · continue = 둘 다 OK** 👍"}], "notes": {"table": [["목적어", "동사"], ["to부정사만", "want, hope, wish, plan, decide, promise, need, learn, expect"], ["동명사만", "enjoy, finish, mind, keep, give up, quit, avoid, practice, stop"], ["둘 다 (뜻 같음)", "like, love, hate, start, begin, continue"]], "tips": ["stop + -ing: ~하는 것을 멈추다 / stop + to부정사: ~하기 위해 멈추다(부사적 용법)"]}, "sets": {"workbook": [{"k": "pk", "q": "I love [dancing*/dance].", "e": "love + 동명사 (to dance도 가능)"}, {"k": "pk", "q": "It began [to snow*/snow].", "e": "begin + to부정사 (snowing도 가능)"}, {"k": "pk", "q": "She hates [to wait*/wait] in line.", "e": "hate + to부정사 (waiting도 가능)"}, {"k": "pk", "q": "He continued [working*/work] late.", "e": "continue + 동명사 (to work도 가능)"}, {"k": "bl", "q": "I like to read. = I like (reading).", "e": "둘 다 가능"}, {"k": "bl", "q": "He started crying. = He started (to) (cry).", "e": "둘 다 가능"}, {"k": "bl", "q": "그는 계속 노래했다. → He continued (singing|to sing).", "e": "continue"}, {"k": "bl", "q": " 지 하나는 the other"}, {"k": "m", "t": "**셋** → one ~, another ~, the other ~ (하나는, 또 하나는, 나머지 하나는)"}, {"k": "m", "t": "여럿 중 막연히 → **some ~, others ~** (몇몇은 ~, 다른 사람들은 ~) / 나머지 전부 → **the others**"}, {"k": "ex", "en": "Some students like soccer, and others like baseball.", "ko": "어떤 학생들은 축구를, 다른 학생들은 야구를 좋아한다."}, {"k": "q", "q": "There are five boys. One is tall, and ____ are short.", "o": ["others", "the others", "another"], "a": 1, "ok": "정확해요! 나머지 전부 → the others", "no": "정해진 5명 중 나머지 전부 → the others"}, {"k": "m", "t": "정리! **둘: one / the other · 셋: one / another / the other · 여럿: some / others · 나머지 전부: the others** 👍"}], "notes": {"table": [["상황", "표현"], ["또 하나", "another (+ 단수 명사)"], ["둘 중", "one ~, the other ~"], ["셋 중", "one ~, another ~, the other ~"], ["여럿 중 막연히", "some ~, others ~"], ["정해진 수의 나머지 전부", "one ~, the others ~ / some ~, the others ~"]], "tips": ["another + 단수 명사 (another cup), other + 복수 명사 (other books)", "the other = 나머지 하나, the others = 나머지 전부"]}, "sets": {"workbook": [{"k": "pk", "q": "This shirt is too small. Can I try [another*/the other]?", "e": "또 하나"}, {"k": "pk", "q": "I have two pens. One is red, and [another/the other*] is blue.", "e": "둘 중 나머지"}, {"k": "pk", "q": "Some people like cats, and [others*/the other] like dogs.", "e": "some ~ others"}, {"k": "pk", "q": "Would you like [another*/other] cookie?", "e": "another + 단수"}, {"k": "bl", "q": "그는 아들이 둘 있다. 하나는 의사이고, 나머지 하나는 교사이다. → He has two sons. One is a doctor, and (the other) is a teacher.", "e": "the other"}, {"k": "bl", "q": "나는 세 나라를 방문했다. 하나는 일본, 또 하나는 중국, 나머지 하나는 태국이었다. → One was Japan, (another) was China, and the other was Thailand.", "e": "another"}, {"k": "bl", "q": "열 명 중 한 명은 남았고, 나머지는 집에 갔다. → One stayed, and (the others) went home.", "e": "the others"}, {"k": "bl", "q": "다른 질문 있나요? → Do you have any (other) questions?", "e": "other + 복수"}, {"k": "fx", "q": "I have two dogs. One is big, and another is small.", "w": "another", "a": ["the other"], "e": "둘 중 나머지 → the other"}, {"k": "fx", "q": "Some kids like math, and other like art.", "w": "other", "a": ["others"], "e": "some ~ others"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I have two bags. One is red, and ____ is black.", "o": ["another", "other", "the other", "others", "the others"], "a": 2, "e": "둘 중 나머지 하나"}, {"k": "ch", "q": "빈칸에 알맞은 것끼리 짝지어진 것은? There are three balls. One is red, ____ is blue, and ____ is yellow.", "o": ["another – other", "other – another", "another – the other", "the other – another", "others – the other"], "a": 2, "e": "셋: one / another / the other"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Give me another chance.", "Some like summer, and others like winter.", "I have two brothers. One is tall, and the other is short.", "Do you have other questions?", "Can I have another apples?"], "a": 4, "e": "⑤ another apple"}, {"k": "bl", "q": "다섯 개 중 하나는 내 것이고, 나머지는 그녀의 것이다. → One is mine, and (the others) are hers.", "e": "나머지 전부"}, {"k": "bl", "q": "커피 한 잔 더 드실래요? → Would you like (another) cup of coffee?", "e": "another"}, {"k": "pk", "q": "Some students walk to school, and [others*/another] take the bus.", "e": "some ~ others"}, {"k": "pk", "q": "I don't like this color. Show me [another*/other] one.", "e": "another + 단수"}, {"k": "fx", "q": "He has two cars. One is new, and the others is old.", "w": "others", "a": ["other"], "e": "둘 중 나머지 하나 → the other"}, {"k": "ox", "q": "I have three friends. One is from Korea, another is from Japan, and the other is from Canada.", "a": true, "e": "✔"}, {"k": "ox", "q": "Some people drink coffee, and the other drink tea.", "a": false, "e": "others"}], "practiceB": [{"k": "wr", "q": "나는 연필이 두 자루 있다. 하나는 길고, 나머지 하나는 짧다. (two pencils, one, long, the other, short)", "a": ["I have two pencils. One is long, and the other is short.", "I have two pencils. One is long and the other is short."], "e": "one ~ the other"}, {"k": "wr", "q": "어떤 사람들은 산을 좋아하고, 다른 사람들은 바다를 좋아한다. (some people, the mountains, others, the sea)", "a": ["Some people like the mountains, and others like the sea.", "Some people like the mountains and others like the sea."], "e": "some ~ others"}, {"k": "or", "q": "나에게 한 번 더 기회를 줘.", "a": "Give me another chance.", "e": "another"}, {"k": "or", "q": "나는 다른 책들도 읽고 싶다.", "a": "I want to read other books too.", "e": "other + 복수"}, {"k": "fx", "q": "I have two uncles. One lives in Seoul, and other lives in Busan.", "w": "other", "a": ["the other"], "e": "둘 중 → the other"}, {"k": "fx", "q": "Could I have other piece of cake?", "w": "other", "a": ["another"], "e": "단수 piece → another"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ One is mine, and the other is yours. (둘)\nⓑ Some like rock, and others like jazz.\nⓒ I want another one.\nⓓ He has two cats. One is white, and another is black.\nⓔ Do you have other pens?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ the other"}, {"k": "bl", "q": "There are 20 students. Some are reading, and (the others) are writing. (나머지 전부)", "e": "the others"}, {"k": "bl", "q": "This pizza is great. Can I have (another) slice?", "e": "another"}, {"k": "wr", "q": "나는 두 언어를 할 수 있다. 하나는 영어이고, 나머지 하나는 중국어이다. (two languages, one, English, the other, Chinese)", "a": ["I can speak two languages. One is English, and the other is Chinese.", "I can speak two languages. One is English and the other is Chinese."], "e": "one ~ the other"}]}}, {"tag": "hk1-10-5-3", "name": "부정대명사: each, every, all", "talk": [{"k": "m", "t": "마지막! **each, every, all** — 동사 수일치가 핵심이에요 ✅"}, {"k": "m", "t": "**each** (각각, 각각의): each + **단수 명사** + 단수 동사 / each of + 복수 명사 + **단수 동사**"}, {"k": "ex", "en": "Each student has a locker. / Each of the students has a locker.", "ko": "각 학생은 사물함이 있다."}, {"k": "m", "t": "**every** (모든): every + **단수 명사** + 단수 동사 → Every child [likes] candy."}, {"k": "q", "q": "Every student ____ a uniform.", "o": ["wear", "wears", "wearing"], "a": 1, "ok": "맞아요! every + 단수 → 단수 동사", "no": "every 뒤는 단수 명사 + 단수 동사 → wears"}, {"k": "m", "t": "**all** (모두 nd kind."], ["but", "그러나, 하지만", "It's small but heavy."], ["or", "또는, 아니면", "Is it yours or mine?"], ["so", "그래서 (결과)", "I was tired, so I went to bed."]], "tips": ["and·but·or로 이은 말은 같은 형태(병렬)", "so는 문장과 문장만 연결 (결과 쪽에 씀)"]}, "sets": {"workbook": [{"k": "pk", "q": "I have a dog [and*/or] a cat. (둘 다 있음)", "e": "and"}, {"k": "pk", "q": "The test was hard, [but*/so] I passed it.", "e": "반대"}, {"k": "pk", "q": "Which do you like, summer [or*/and] winter?", "e": "선택"}, {"k": "pk", "q": "It was cold, [but/so*] I wore a coat.", "e": "결과"}, {"k": "bl", "q": "그는 키가 크고 잘생겼다. → He is tall (and) handsome.", "e": "and"}, {"k": "bl", "q": "나는 피곤했지만 숙제를 끝냈다. → I was tired, (but) I finished my homework.", "e": "but"}, {"k": "bl", "q": "너는 버스로 가니, 아니면 걸어서 가니? → Do you go by bus (or) on foot?", "e": "or"}, {"k": "bl", "q": "늦게 일어나서 학교에 늦었다. → I got up late, (so) I was late for school.", "e": "so"}, {"k": "fx", "q": "She likes reading and swim.", "w": "swim.", "a": ["swimming"], "e": "같은 형태 (병렬)"}, {"k": "fx", "q": "He was sick, but he went to the doctor.", "w": "but", "a": ["so"], "e": "결과 → so"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I called him, ____ he didn't answer.", "o": ["and", "or", "so", "but", "because"], "a": 3, "e": "반대"}, {"k": "ch", "q": "빈칸에 or가 들어가는 것은?", "o": ["I like pizza ____ pasta. (둘 다)", "It was late, ____ I went home.", "Is he a doctor ____ a nurse?", "She is pretty ____ smart.", "I'm full, ____ I can eat more."], "a": 2, "e": "선택"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I like to sing and to dance.", "He is kind and smart.", "She plays the piano and sings.", "We went shopping and ate lunch.", "I enjoy cooking and eat."], "a": 4, "e": "⑤ eating"}, {"k": "bl", "q": "그 가방은 작지만 비싸다. → The bag is small (but) expensive.", "e": "but"}, {"k": "bl", "q": "비가 많이 와서 우리는 소풍을 취소했다. → It rained a lot, (so) we canceled the picnic.", "e": "so"}, {"k": "pk", "q": "Would you like juice [or*/so] milk?", "e": "선택"}, {"k": "pk", "q": "He studied hard, [so*/but] he got a good score.", "e": "결과"}, {"k": "fx", "q": "I like cats, so I don't like dogs.", "w": "so", "a": ["but"], "e": "반대 → but"}, {"k": "ox", "q": "She sang a song and danced.", "a": true, "e": "✔"}, {"k": "ox", "q": "He is smart, so he is lazy.", "a": false, "e": "but"}], "practiceB": [{"k": "wr", "q": "나는 사과와 오렌지를 샀다. (bought, apples and oranges)", "a": ["I bought apples and oranges."], "e": "and"}, {"k": "wr", "q": "그녀는 열심히 공부했지만 시험에 떨어졌다. (studied hard, but, failed the test)", "a": ["She studied hard, but she failed the test.", "She studied hard but she failed the test.", "She studied hard, but failed the test.", "She studied hard but failed the test."], "e": "but"}, {"k": "or", "q": "너는 개를 좋아하니 아니면 고양이를 좋아하니?", "a": "Do you like dogs or cats?", "e": "or"}, {"k": "or", "q": "나는 아파서 집에 있었다.", "a": "I was sick, so I stayed home.", "e": "so"}, {"k": "fx", "q": "He likes playing soccer and watch movies.", "w": "watch", "a": ["watching"], "e": "병렬"}, {"k": "fx", "q": "It was sunny, but we went to the beach.", "w": "but", "a": ["so"], "e": "결과"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'm hungry, so I'll eat.\nⓑ He is poor but happy.\nⓒ Is it red or blue?\nⓓ She likes singing and dance.\nⓔ I was tired, but I slept early.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ dancing / ⓔ so"}, {"k": "bl", "q": "Hurry up, (or) you will miss the bus. ※ 다음 유닛 미리보기", "e": "or"}, {"k": "bl", "q": "The movie was long (but) interesting.", "e": "but"}]}}, {"tag": "hk1-15-2", "name": "명령문 + and/or", "talk": [{"k": "m", "t": "명령문 뒤에 and / or가 오면 뜻이 정해져요 ⚡"}, {"k": "m", "t": "**명령문 + and** ~ : '…해라, **그러면** ~할 것이다'"}, {"k": "ex", "en": "Study hard, and you will pass the test.", "ko": "열심히 공부해라, 그러면 시험에 통과할 것이다."}, {"k": "m", "t": "**명령문 + or** ~ : '…해라, **그렇지 않으면** ~할 것이다'"}, {"k": "ex", "en": "Hurry up, or you will be late.", "ko": "서둘러라, 그렇지 않으면 늦을 것이다."}, {"k": "q", "q": "Wear a coat, ____ you will catch a cold.", "o": ["and", "or", "so"], "a": 1, "ok": "맞아요! 그렇지 않으면 → or", d grades.", "Because you study hard, you got good grades.", "You study hard, but you will get good grades."], "a": 0, "e": "and = If you ~"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Be kind, or nobody will like you.", "o": ["If you are kind, nobody will like you.", "If you aren't kind, nobody will like you.", "Be kind, and nobody will like you.", "Because you are kind, nobody likes you.", "You are kind, so nobody likes you."], "a": 1, "e": "or = If you don't"}, {"k": "bl", "q": "열심히 연습해라, 그러면 너는 잘하게 될 것이다. → Practice hard, (and) you will get better.", "e": "and"}, {"k": "bl", "q": "우산을 가져가라, 그렇지 않으면 젖을 것이다. → Take an umbrella, (or) you will get wet.", "e": "or"}, {"k": "pk", "q": "Listen carefully, [and*/or] you will understand.", "e": "그러면"}, {"k": "pk", "q": "Don't eat too much, [and/or*] you'll get a stomachache.", "e": "그렇지 않으면"}, {"k": "fx", "q": "Wear a helmet, and you can get hurt.", "w": "and", "a": ["or"], "e": "그렇지 않으면 → or"}, {"k": "ox", "q": "Leave now, or you will miss the bus.", "a": true, "e": "✔"}, {"k": "ox", "q": "Help me, or I will help you. (그러면)", "a": false, "e": "and"}], "practiceB": [{"k": "or", "q": "서둘러라, 그렇지 않으면 늦을 것이다.", "a": "Hurry up, or you will be late.", "e": "or"}, {"k": "or", "q": "매일 운동해라, 그러면 건강해질 것이다.", "a": "Exercise every day, and you will be healthy.", "e": "and"}, {"k": "wr", "q": "If you don't study, you will fail. → 명령문 + or로 바꾸시오.", "a": ["Study, or you will fail.", "Study or you will fail."], "e": "or"}, {"k": "wr", "q": "If you turn right, you will see the school. → 명령문 + and로 바꾸시오.", "a": ["Turn right, and you will see the school.", "Turn right and you will see the school."], "e": "and"}, {"k": "wr", "q": "조심해라, 그렇지 않으면 넘어질 것이다. (Be careful, or, you will fall)", "a": ["Be careful, or you will fall.", "Be careful or you will fall."], "e": "or"}, {"k": "fx", "q": "Turn off the light, or you can save energy.", "w": "or", "a": ["and"], "e": "그러면 → and"}, {"k": "fx", "q": "Wake up now, and you will be late.", "w": "and", "a": ["or"], "e": "그렇지 않으면 → or"}, {"k": "ch", "q": "어법상(의미상) 옳은 문장의 개수는?\nⓐ Hurry, or you'll miss it.\nⓑ Try again, and you can do it.\nⓒ Be quiet, and the baby will wake up.\nⓓ Smile, and people will like you.\nⓔ Study, or you will fail.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ or"}, {"k": "bl", "q": "Sleep well, (and) you'll feel better tomorrow.", "e": "and"}, {"k": "bl", "q": "Drink water, (or) you will be thirsty.", "e": "or"}]}}, {"tag": "hk1-15-3-1", "name": "when, before, after, while", "talk": [{"k": "m", "t": "**시간**을 나타내는 접속사! 뒤에 **주어 + 동사**가 와요 ⏰"}, {"k": "m", "t": "**when** ~할 때 / **before** ~하기 전에 / **after** ~한 후에 / **while** ~하는 동안"}, {"k": "ex", "en": "When I got home, my mom was cooking.", "ko": "내가 집에 왔을 때, 엄마는 요리 중이셨다."}, {"k": "ex", "en": "I fell asleep while I was watching TV.", "ko": "나는 TV를 보는 동안 잠이 들었다."}, {"k": "q", "q": "Wash your hands ____ you eat.", "o": ["after", "before", "while"], "a": 1, "ok": "맞아요! 먹기 전에 → before", "no": "먹기 전에 → before"}, {"k": "m", "t": "⚠️ 시간 접속사 절에서는 **미래도 현재시제**! When he **comes** home, I will tell him. (will come ✗)"}, {"k": "q", "q": "I'll call you when I ____ to Seoul.", "o": ["will arrive", "arrive", "arrived"], "a": 1, "ok": "정확해요! 시간절 → 현재시제", "no": "시간 부사절 → 미래 대신 현재 arrive"}, {"k": "m", "t": "before / after는 전치사(Ch.14)로도 써요: before dinner(명사) / before I eat dinner(주어 + 동사)"}, {"k": "m", "t": "정리! **when·before·after·while + 주어 + 동사 / 미래 → 현재시제** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["when", "~할 때", "When I was young, I lived in Busan."], ["before", "~하기 전에", "Turn off the TV before you go out."], ["after", "~한 후에", "After he finished work, he went home."], ["while", "~하는 동안", "Don't talk while you are eating."]], "tips": ["시간 부사절: 미래 의미도 현재시제 (When it rains, ~)", "부사절이 앞에 오면 쉼표(,)"]}, "sets": {"workbook": [{"k": "pk", "q": "[When*/Before] I was a child, I liked cartoons.", "e": "~할 때"}, {"k": "pk", "q": "Brush your teeth [after*/while] you eat.", "e": "~한 후에"}, {"k": "pk", "q": "Someone called [while*/before] I was taking a shower.", "e": "~하는 동안"}, {"k": "pk", "q": "I will wait here until he [comes*/will come].", "e": "시간절 → 현재"}, {"k": "bl", "q": "나는 TV를 보기 전에 숙제를 끝냈다. → I finished my homework (before) I watched TV.", "e": "before"}, {"k": "bl", "q": "그가 도착한 후에 우리는 저녁을 먹었다. → We had dinner (after) he arrived.", "e": "after"}, {"k": "bl", "q": "내가 요리하는 동안 그녀는 설거지를 했다. → She washed the dishes (while) I cooked.", "e": "while"}, {"k": "bl", "q": "그녀가 오면 나에게 말해 줘. → Tell me when she (comes).", "e": "현재시제"}, {"k": "pk", "q": "When he [comes*/will come] back, I will give him this.", "e": "시간절 → 현재"}, {"k": "pk", "q": "I met Tom while I [was walking*/am walking] to school.", "e": "과거의 진행 중인 동작"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ I was young, I lived in Jeju.", "o": ["After", "When", "Before", "While", "So"], "a": 1, "e": "~할 때"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I'll call you when the movie ____.", "o": ["ends", "will end", "ended", "ending", "to end"], "a": 0, "e": "시간절 → 현재"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Look both ways before you cross.", "After I ate, I washed the dishes.", "While I was sleeping, it snowed.", "When I will be 20, I'll travel alone.", "Call me when you get home."], "a": 3, "e": "④ When I am 20"}, {"k": "bl", "q": "그는 밥을 먹는 동안 음악을 듣는다. → He listens to music (while) he eats.", "e": "while"}, {"k": "bl", "q": "비가 그친 후에 우리는 밖에 나갔다. → (After) the rain stopped, we went out.", "e": "after"}, {"k": "pk", "q": "Let's start [after*/while] everyone arrives.", "e": "~한 후에"}, {"k": "pk", "q": "If it [rains*/will rain] tomorrow, I'll stay home. ※ 다음 유닛 미리보기", "e": "현재시제"}, {"k": "fx", "q": "Before I will go to bed, I'll read a book.", "w": "will", "a": ["(삭제)"], "e": "시간절 → 현재: Before I go to bed"}, {"k": "ox", "q": "When I opened the door, the dog ran out.", "a": true, "e": "✔"}, {"k": "ox", "q": "I'll tell him after he will come.", "a": false, "e": "comes"}], "practiceB": [{"k": "or", "q": "내가 집에 도착했을 때 비가 오고 있었다.", "a": "When I arrived home, it was raining.", "e": "when"}, {"k": "or", "q": "나가기 전에 불을 꺼라.", "a": "Turn off the lights before you go out.", "e": "before"}, {"k": "or", "q": "그녀는 저녁을 먹은 후에 산책을 한다.", "a": "She takes a walk after she eats dinner.", "e": "after"}, {"k": "wr", "q": "내가 공부하는 동안 조용히 해 줘. (Please be quiet, while I study)", "a": ["Please be quiet while I study.", "Please be quiet while I'm studying.", "Please be quiet while I am studying.", "Be quiet while I study, please."], "e": "while"}, {"k": "wr", "q": "그가 오면 출발하자. (Let's leave, when he comes)", "a": ["Let's leave when he comes.", "When he comes, let's leave."], "e": "시간절 현재"}, {"k": "pk", "q": "I will text you after I [finish*/will finish] class.", "e": "시간절 → 현재"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ When I was ten, I moved here.\nⓑ Don't text while you are driving.\nⓒ I'll wait until she will come.\nⓓ Before you leave, check the door.\nⓔ After he left, I cried.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ comes"}, {"k": "bl", "q": "(When) I saw him, he was crying.", "e": "when"}, {"k": "bl", "q": "We'll go out when the rain (stops).", "e": "현재시제"}]}}, {"tag": "hk1-15-3-2", "name": "because, if", "talk": [{"k": "m", "t": "**because**(~ 때문에, 이유)와 **if**(만약 ~하면, 조건) 💡"}, {"k": "ex", "en": "I was late because I missed the bus.", "ko": "나는 버스를 놓쳤기 때문에 늦었다."}, {"k": "m", "t": "because + **주어 + 동사** / because of + **명사** (because of the rain)"}, {"k": "q", "q": "We stayed home ____ the storm.", "o": ["because", "because of", "so"], "a": 1, "ok": "맞아요! 명사 앞 → because of", "no": "the storm(명사) → because of"}, {"k": "ex", "en": "If it is sunny tomorrow, we will go hiking.", "ko": "내일 날씨가 맑으면 우리는 하이킹을 갈 것이다."}, {"k": "m", "t": "⚠️ 조건 if 절도 **미래 대신 현재시제**! If it **rains** tomorrow, I'll stay home. (will rain ✗)"}, {"k": "q", "q": "If you ____ hard, you will pass.", "o": ["study", "will study", "studied"], "a": 0, "ok": "정확해요! 조건절 → 현재", "no": "조건 부사절 → 현재 study"}, {"k": "m", "t": "because vs so: I was tired, **so** I slept. = I slept **because** I was tired. (so 뒤 결과 / because 뒤 이유)"}, {"k": "m", "t": "정리! **because 이유 / because of + 명사 / if 조건 → 미래도 현재시제** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["because", "~ 때문에 (이유)", "I'm happy because it's Friday."], ["because of + 명사", "~ 때문에", "because of the noise"], ["if", "만약 ~하면 (조건)", "If you need help, call me."]], "tips": ["if 조건절: 미래 의미도 현재시제", "because 뒤 이유 ↔ so 뒤 결과"]}, "sets": {"workbook": [{"k": "pk", "q": "I can't go out [because*/if] I'm sick.", "e": "이유"}, {"k": "pk", "q": "[If*/Because] you are busy, I'll help you. (만약)", "e": "조건"}, {"k": "pk", "q": "The game was canceled [because/because of*] the rain.", "e": "명사 → because of"}, {"k": "pk", "q": "If it [snows*/will snow] tomorrow, we'll make a snowman.", "e": "조건절 → 현재"}, {"k": "bl", "q": "그는 피곤했기 때문에 일찍 잤다. → He went to bed early (because) he was tired.", "e": "because"}, {"k": "bl", "q": "만약 네가 원하면 내 펜을 써도 돼. → (If) you want, you can use my pen.", "e": "if"}, {"k": "bl", "q": "그 소음 때문에 나는 잠을 잘 수 없었다. → I couldn't sleep because (of) the noise.", "e": "because of"}, {"k": "bl", "q": "만약 그가 늦으면 우리는 기다릴 것이다. → If he (is) late, we will wait.", "e": "현재시제"}, {"k": "pk", "q": "If it [is*/will be] sunny, we'll go on a picnic.", "e": "조건절 → 현재"}, {"k": "fx", "q": "I stayed home because the snow.", "w": "because", "a": ["because of"], "e": "명사 → because of"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I like him ____ he is kind.", "o": ["if", "because", "so", "or", "but"], "a": 1, "e": "이유"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If you ____ this button, the door will open.", "o": ["press", "will press", "pressed", "pressing", "to press"], "a": 0, "e": "조건절 → 현재"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I was late because of the traffic.", "If you need me, call me.", "She cried because she was sad.", "If it will rain, I'll stay home.", "I'm happy because I passed."], "a": 3, "e": "④ If it rains"}, {"k": "bl", "q": "날씨가 추웠기 때문에 우리는 집에 있었다. → We stayed home (because) it was cold.", "e": "because"}, {"k": "bl", "q": "만약 네가 서두르면, 버스를 탈 수 있다. → (If) you hurry, you can catch the bus.", "e": "if"}, {"k": "pk", "q": "He was absent [because of*/because] his cold.", "e": "명사"}, {"k": "pk", "q": "If you [finish*/will finish] early, you can go home.", "e": "조건절"}, {"k": "fx", "q": "She couldn't come if she was sick. (아팠기 때문에)", "w": "if", "a": ["because"], "e": "이유 → because"}, {"k": "ox", "q": "If I have time tomorrow, I will visit you.", "a": true, "e": "✔"}, {"k": "ox", "q": "I was late because I get up late.", "a": false, "e": "got up"}], "practiceB": [{"k": "or", "q": "나는 배가 고팠기 때문에 피자를 먹었다.", "a": "I ate pizza because I was hungry.", "e": "because"}, {"k": "or", "q": "만약 내일 비가 오면 나는 집에 있을 것이다.", "a": "If it rains tomorrow, I will stay home.", "e": "if + 현재"}, {"k": "wr", "q": "그 비 때문에 경기가 취소되었다. (The game was canceled, because of the rain)", "a": ["The game was canceled because of the rain.", "The game was cancelled because of the rain."], "e": "because of"}, {"k": "wr", "q": "I was tired, so I went to bed early. → because를 써서 바꾸시오.", "a": ["I went to bed early because I was tired.", "Because I was tired, I went to bed early."], "e": "because"}, {"k": "wr", "q": "만약 네가 열심히 공부하면 시험에 통과할 것이다. (If you study hard, you will pass the test)", "a": ["If you study hard, you will pass the test.", "If you study hard you will pass the test.", "You will pass the test if you study hard."], "e": "if"}, {"k": "fx", "q": "We couldn't play outside because the rain.", "w": "because", "a": ["because of"], "e": "명사 → because of"}, {"k": "pk", "q": "If he [calls*/will call] me, I'll tell him the news.", "e": "조건절 → 현재"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If you're free, let's meet.\nⓑ I'm sad because of the news.\nⓒ If it will snow, we'll ski.\nⓓ He left because he was busy.\nⓔ I like her because she is funny.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ snows"}, {"k": "bl", "q": "If you (are) tired, take a rest.", "e": "현재"}, {"k": "bl", "q": "He was angry (because) I lied.", "e": "이유"}]}}, {"tag": "hk1-15-4", "name": "that", "talk": [{"k": "m", "t": "**that**이 '~라는 것'으로 문장을 **명사처럼** 만들어요 📦"}, {"k": "m", "t": "주로 **동사의 목적어**: think, know, believe, hope, say + that + 주어 + 동사"}, {"k": "ex", "en": "I think that he is honest.", "ko": "나는 그가 정직하다고 생각한다."}, {"k": "ex", "en": "I know that you are busy.", "ko": "나는 네가 바쁘다는 것을 안다."}, {"k": "q", "q": "I hope ____ you get well soon.", "o": ["that", "what", "because"], "a": 0, "ok": "맞아요! hope + that절", "no": "~라는 것을 바란다 → that"}, {"k": "m", "t": "목적어 that은 **생략 가능**: I think (that) she is right."}, {"k": "q", "q": "밑줄 친 that을 생략할 수 있는 것은?", "o": ["That is my bag.", "I know that he is kind.", "I like that song."], "a": 1, "ok": "정확해요! 목적어 that절의 that", "no": "'~라는 것' that(접속사)만 생략 가능"}, {"k": "m", "t": "⚠️ that 뒤에는 **완전한 문장(주어 + 동사)**! / 지시대명사 that(저것)과 구별"}, {"k": "m", "t": "정리! **think·know·hope·believe·say + (that) + 주어 + 동사** 👍"}], "notes": {"table": [["동사", "예", "뜻"], ["think", "I think (that) it's true.", "그것이 사실이라고 생각한다"], ["know", "Do you know (that) she moved?", "그녀가 이사한 걸 아니?"], ["believe", "I believe (that) you can do it.", "네가 할 수 있다고 믿는다"], ["hope", "I hope (that) it doesn't rain.", "비가 오지 않길 바란다"], ["say", "He said (that) he was tired.", "그는 피곤하다고 말했다"]], "tips": ["목적어 that은 생략 가능", "지시대명사·지시형용사 that(저것, 저)은 생략 ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "I think [that*/what] English is fun.", "e": "that"}, {"k": "pk", "q": "She knows that I [am*/being] right.", "e": "주어 + 동사"}, {"k": "pk", "q": "I believe [that*/because] he will come.", "e": "목적어 that절"}, {"k": "pk", "q": "We hope that you [enjoy*/enjoying] the trip.", "e": "주어 + 동사"}, {"k": "bl", "q": "나는 그녀가 친절하다고 생각한다. → I think (that) she is kind.", "e": "that"}, {"k": "bl", "q": "그는 피곤하다고 말했다. → He said that he (was) tired.", "e": "과거"}, {"k": "bl", "q": "나는 네가 이길 거라고 믿는다. → I believe (that) you will win.", "e": "that"}, {"k": "bl", "q": "너는 그가 아프다는 것을 아니? → Do yo const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 보카 키우기 안에서 열리면(HOST) 기록은 학생 계정(Firebase)에 저장, 아니면 이 기기에 저장 */
const HOST = (()=>{ try { return (window.parent!==window && window.parent.GRAM) ? window.parent.GRAM : null } catch(e){ return null } })();
const ikey = it => it.k+"|"+(it.q||"")+"|"+(it.s?it.s.length:"");
const IDX = {}; BOOK.chapters.forEach(c=>{ c.units.forEach(u=>Object.values(u.sets).forEach(v=>v.forEach(it=>IDX[ikey(it)]=it))); Object.values(c.chapterSets).forEach(v=>v.forEach(it=>IDX[ikey(it)]=it)) });
let ST = {}; if (HOST) { ST = HOST.load(BOOK.book) || {} } else { try { ST = JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { ST = {} } }
ST.done = ST.done || {}; ST.wrong = ST.wrong || {};
Object.keys(ST.wrong).forEach(k=>{ const w=ST.wrong[k]; if(!w.item){ if(IDX[k]) w.item=IDX[k]; else delete ST.wrong[k] } });

function bookProgress(){ let done=0,total=0; BOOK.chapters.forEach(c=>{ c.units.forEach(u=>SETS.forEach(([s])=>{ total++; const d=ST.done[u.tag+":"+s]; if(d&&d.pass) done++ })); CHSETS.forEach(([s])=>{ total++; const d=ST.done["ch"+c.chapter.id+":"+s]; if(d&&d.pass) done++ }) }); return {done,total} }

let VOICES=[];
function vscore(v){ const n=v.name; let s=0;
  if(/natural/i.test(n)) s+=100; if(/online|neural/i.test(n)) s+=60; if(/google/i.test(n)) s+=50; if(/premium/i.test(n)) s+=45; if(/enhanced/i.test(n)) s+=40;
  if(/aria|jenny|guy|ava|samantha|allison|emma|andrew|brian|michelle|susan|zira/i.test(n)) s+=20;
  if(/^en[-_]US/i.test(v.lang)) s+=10; else if(/^en[-_](GB|AU|CA)/i.test(v.lang)) s+=5;
  if(/compact|espeak|novelty|whisper|bad news|bells|bubbles|cellos|jester|organ|trinoids|zarvox|albert|fred|junior|ralph|kathy|boing|wobble/i.test(n)) s-=200;
  return s }
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a)) }catch(e){ VOICES=[] } const sel=document.getElementById("vsel"); if(sel) fillVoices(sel) }

function norm(s){
  return String(s).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim().replace(/[.!?]+$/,"").trim();
}
function expand(s){
  return norm(s).replace(/\bi'm\b/g,"i am").replace(/\b(you|we|they)'re\b/g,"$1 are").replace(/\b(he|she|it|that|this)'s\b/g,"$1 is")
    .replace(/\bwon't\b/g,"will not").replace(/\b(i|you|he|she|it|we|they)'ll\b/g,"$1 will").replace(/\b(i|you|we|they)'ve\b/g,"$1 have").replace(/\bhaven't\b/g,"have not").replace(/\bhasn't\b/g,"has not").replace(/\bdon't\b/g,"do not").replace(/\bdoesn't\b/g,"does not").replace(/\bdidn't\b/g,"did not").replace(/\bisn't\b/g,"is not").replace(/\baren't\b/g,"are not").replace(/\bwasn't\b/g,"was not").replace(/\bweren't\b/g,"were not")
    .replace(/^'m\b/,"am").replace(/\s+/g," ").trim();
}
function expand2(s){ return norm(s).replace(/\b(he|she|it|that)'s\b/g,"$1 has") }
function forms(s){ const o=new Set([expand(s)]); const t=expand(expand2(s)); o.add(t); return o }

function runCumul(n){
  const ci=BOOK.chapters.indexOf(CH), before=BOOK.chapters.slice(0,ci).flatMap(c=>c.units);
  const u=CH.units[n], prev=[...before,...CH.units.slice(0,n)], tags=[...prev,u].map(x=>x.tag);
  const pool=x=>["workbook","practiceA","practiceB"].flatMap(s=>x.sets[s]);
  const seen=new Set(), pick=[]; const add=it=>{const k=wkey(it); if(seen.has(k)||pick.length>=CUMUL_N) return; seen.add(k); pick.push(it)};
  shuffle(Object.values(ST.wrong).filter(w=>tags.includes(w.tag)).map(w=>w.item)).slice(0,5).forEach(add);
  const curN=prev.length?Math.ceil(CUMUL_N/2):CUMUL_N;
  shuffle(pool(u)).slice(0,curN).forEach(add);
  const near=shuffle(CH.units.slice(0,n).flatMap(pool)), far=shuffle(before.flatMap(pool));
  const restN=CUMUL_N-curN, nearN=far.length?Math.ceil(restN*0.6):restN;
  near.slice(0,nearN).forEach(add); far.forEach(add); near.forEach(add);
  shuffle(pool(u)).forEach(add);
  runSet(shuffle(pick),{title:u.name+" · 최종 누적학습",key:u.tag+":cumul",target:80,tag:u.tag});
}

  if(k==="fx"){ cd.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{cd.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");$("#fxin").focus()});
    $("#fxdel").onclick=()=>{ $("#fxin").value="(삭제)"; } }
  if(k==="ch"||k==="m12") cd.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{ if(k==="ch") cd.querySelectorAll(".choice").forEach(x=>x.classList.remove("on")); c.classList.toggle("on") });
  if(k==="ox") cd.querySelectorAll(".ox button").forEach(b=>b.onclick=()=>{cd.querySelectorAll(".ox button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
  if(k==="or"){ const pool=$("#orpool"),ans=$("#orans");
    pool.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{ if(t.classList.contains("used")) return; t.classList.add("used"); const b=document.createElement("button"); b.className="tok"; b.textContent=t.dataset.w; b.dataset.w=t.dataset.w; b.onclick=()=>{b.remove();t.classList.remove("used")}; ans.appendChild(b) });
    $("#orclr").onclick=()=>{ans.innerHTML="";pool.querySelectorAll(".tok").forEach(t=>t.classList.remove("used"))} }
  cd.querySelectorAll("input").forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#ck").click() } }));
}
function grade(it){
  const cd=$("#cd"), k=it.k;
  if(k==="pk"){ const gs=[...cd.querySelectorAll("[data-pk]")]; if(gs.some(g=>!g.querySelector(".on"))) return null; let ok=true;
    gs.forEach(g=>g.querySelectorAll(".chip").forEach(c=>{ if(c.dataset.r==="1") c.classList.add("right"); if(c.classList.contains("on")&&c.dataset.r!=="1"){c.classList.add("wrong");ok=false} }));
    return {ok,key:gs.map(g=>g.querySelector('[data-r="1"]').dataset.v).join(", ")} }
  if(k==="bl"){ const ins=[...cd.querySelectorAll("input.blank")]; if(ins.some(x=>!x.value.trim())) return null; let ok=true;
    ins.forEach(x=>{ const r=same(x.value,x.dataset.a.split("|")); x.classList.add(r?"ok":"no"); if(!r) ok=false });
    return {ok,key:ins.map(x=>x.dataset.a.split("|")[0]).join(", ")} }
  if(k==="fx"){ const sel=cd.querySelector(".tok.sel"), v=$("#fxin").value.trim(); if(!sel||!v) return null;
    const toks=it.q.split(" "), wi=toks.findIndex(t=>norm(t.replace(/[,.!?]+$/,""))===norm(it.w)); const okW=+sel.dataset.j===wi, DEL=/^\(?(삭제|빼기|x|-)\)?$/i, okA=it.a.includes("(삭제)")?DEL.test(v.trim()):same(v,it.a);
    cd.querySelector(`.tok[data-j="${wi}"]`).classList.add("sel");
    return {ok:okW&&okA,key:it.a[0]==="(삭제)"?`${it.w} → 빼기`:`${it.w} → ${it.a[0]}`} }
  if(k==="ch"){ const on=cd.querySelector(".choice.on"); if(!on) return null; const j=+on.dataset.j;
    cd.querySelector(`.choice[data-j="${it.a}"]`).classList.add("right"); if(j!==it.a) on.classList.add("wrong");
    return {ok:j===it.a,key:"①②③④⑤"[it.a]+" "+it.o[it.a]} }
  if(k==="ox"){ const on=cd.querySelector(".ox .on"); if(!on) return null; const v=on.dataset.v==="1"; return {ok:v===it.a,key:it.a?"O":"X"} }
  if(k==="or"){ const ws=[...$("#orans").querySelectorAll(".tok")].map(t=>t.dataset.w); if(!ws.length) return null; return {ok:ws.join(" ")===it.a,key:it.a} }
  if(k==="wr"){ const v=$("#wrin").value.trim(); if(!v) return null; return {ok:same(v,it.a),key:it.a[0]} }
  if(k==="m12"){ const on=[...cd.querySelectorAll(".choice.on")].map(c=>+c.dataset.j); const bad=it.s.map((s,j)=>s[1]?null:j).filter(x=>x!==null);
    cd.querySelectorAll(".choice").forEach(c=>{const j=+c.dataset.j; if(bad.includes(j)) c.classList.add(on.includes(j)?"right":"wrong"); else if(on.includes(j)) c.classList.add("wrong")});
    const ok=on.length===bad.length&&bad.every(j=>on.includes(j)); return {ok,key:bad.map(j=>"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛ"[j]).join(", ")} }
}
home();
</script>
