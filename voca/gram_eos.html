<title>문법 · 어법끝 START</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 레이아웃: 한 열 학습 화면 — 목록 → DM 개념톡 → 문제 카드. 학원 파란색 + 공책 같은 옅은 회청색 바탕 */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f7fc; --line:#d9e1ee; --fg:#17202e; --muted:#5d6a7e;
  --blue:#2457d6; --blue-soft:#e3ebfb; --blue-ink:#163d9e; --me:#2457d6; --me-fg:#ffffff;
  --good:#11845b; --good-soft:#e1f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7; --star:#e3a400;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:20px;color:var(--blue);border:0;background:none;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.vlab{font-size:13px;color:var(--muted)}
.vsel{max-width:150px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 8px;font:inherit;font-size:13px}
@media (max-width:520px){.vlab{display:none}.vsel{max-width:110px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{margin:0 0 16px;color:var(--muted)}
/* 유닛 목록 */
.units{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:left;display:grid;line-height:1.35;font-size:14px}
.tab b{color:var(--blue);font-weight:700}
.tab small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on b,.tab.on small{color:#fff}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.unit .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .no{font-family:var(--f-display);color:var(--blue);font-size:18px;min-width:34px}
.unit .nm{font-weight:700;flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;font-size:13.5px;line-height:1.3;display:grid;gap:2px}
.step b{font-weight:500}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{background:var(--good-soft);border-color:transparent}
.step.done small{color:var(--good);font-weight:700}
.step.tried small{color:var(--bad)}
.step.lock{opacity:.5}
.chset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.chset .step{padding:12px 6px;font-size:15px}
.sec{font-family:var(--f-display);font-size:18px;margin:22px 0 8px;color:var(--blue-ink)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
/* DM 개념톡 */
.dm{display:grid;gap:8px;padding-block:12px;align-content:start;min-height:calc(100dvh - 150px)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:15px}
.av.ghost{visibility:hidden}
.bub{max-width:min(560px,82%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 14px;min-width:0;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.bub.ex{background:var(--blue-soft);border-color:transparent}
.bub.ex .en{font-weight:700;color:var(--blue-ink);font-size:17px}
.bub.ex .ko{font-size:14px;color:var(--muted)}
.say{border:0;background:none;padding:0 4px;color:var(--blue);font-size:15px}
.bub strong{color:var(--blue-ink)}
.row.me .bub strong{color:inherit}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:1px 6px;font:inherit;font-weight:700;color:var(--blue-ink);text-align:center;width:6.5em}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.opt:hover{border-color:var(--blue)}
.qbub{border-color:var(--blue)}
.qbub .qq{font-weight:700}
.dmfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
/* 문제 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-top:12px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notes h3{margin:0 0 8px;font-size:15px;color:var(--blue-ink)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:500}
.tips{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.kind{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.qtext{font-size:18px;white-space:pre-line}
.qtext.en{font-size:19px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;margin:0 2px;font:inherit;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.right{background:var(--good);border-color:var(--good);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tok{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:3px 2px;font:inherit}
.tok.sel{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tok.used{opacity:.3}
.fxrow{display:flex;gap:8px;align-items:center}
.fxrow .inp{flex:1;min-width:0}
.ans{min-height:46px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--surface2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg)}
.choices{display:grid;gap:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;display:flex;gap:10px}
.choice .n{color:var(--blue);font-weight:700;min-width:20px}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m12{display:grid;gap:4px}
.m12 .choice .n{min-width:22px}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--f-display);font-size:30px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px}
.ox button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--fg);display:block;margin-top:2px}
.fb .key{display:block;font-weight:700;margin-top:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kh{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--fg)}
.dmfoot{align-items:center}
@media (hover:none){.kh{display:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 18px}
.score{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score.pass{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.wlist{display:grid;gap:6px;text-align:left;width:100%}
.wlist div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:14px;z-index:20}
@media (max-width:520px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}.bub{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v22-ui ===== */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#f5f7fb; --line:#dde4f0; --fg:#0f1b33; --muted:#5b6a84;
  --blue:#1f4fd8; --blue-soft:#e9effe; --blue-ink:#1740b0; --me:#1f4fd8; --me-fg:#fff; --navy:#0c2463;
  --good:#0e9f6e; --good-soft:#e3f6ee; --bad:#e0464c; --bad-soft:#fdebec;
  --f-display:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,serif;
  --r:16px; --sh:0 1px 2px rgba(15,35,80,.06),0 10px 28px -14px rgba(15,35,80,.22); --tbub:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}}
:root[data-theme="dark"]{--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}
body{letter-spacing:-.005em}
h1,h2{font-weight:700;letter-spacing:-.02em}
.btn{border-radius:12px;font-weight:600}
.btn.primary{box-shadow:0 6px 16px -8px rgba(31,79,216,.7)}
.brand{font-weight:700;font-size:19px;color:var(--fg)}
.top{border-bottom:0;padding-block:14px 10px}
/* chapter band */
.chband{background:var(--navy);color:#fff;border-radius:20px;padding:22px 24px 20px;margin-top:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.chband::after{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.05)}
.cb-book{font-size:13px;color:#b9c8f3;font-weight:600}
.chband h1{margin:0;color:#fff;font-size:clamp(22px,3.4vw,30px);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chband h1 em{font-style:normal;font-family:var(--f-en);font-weight:600;color:#b9c8f3;font-size:.8em}
.chband .lead{color:#d7e0fa;margin:0 0 8px;font-size:14.5px}
.chband .prog{color:#d7e0fa}
.chband .prog b{color:#fff}
.chband .bar{background:rgba(255,255,255,.14);border:0}
.chband .bar i{background:#fff}
.tabs{padding-block:4px 0}
.tab{border-radius:12px;padding:8px 14px;box-shadow:var(--sh)}
.tab.on{background:var(--navy);border-color:var(--navy)}
.sec{font-family:var(--f-body);font-weight:700;color:var(--fg);font-size:17px}
.unit{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.unit .no{font-family:var(--f-en);font-weight:600;font-size:19px}
.unit .nm{font-size:16.5px}
.step{border-radius:12px;padding:10px 6px;background:var(--surface2);transition:border-color .12s}
.step:hover{border-color:var(--blue)}
.step b{font-weight:600}
.step.done{background:var(--good-soft);border-color:transparent}
.chset .step{box-shadow:var(--sh);background:var(--surface)}
/* quiz header */
.top.q{position:sticky;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 10px;margin-top:12px}
.top.q b{font-size:15px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top.q .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.top.q .btn:hover{background:rgba(255,255,255,.18)}
.prog{margin-top:16px!important}
.bar{height:8px;background:var(--blue-soft);border:0}
.card{border-radius:20px;padding:24px 26px;gap:16px;margin-top:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:not(.result)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kind{font-size:13px;letter-spacing:0}
.qtext{font-size:20px;line-height:1.75}
.qtext.en{font-size:21px}
.chip{border-radius:10px;padding:3px 12px;font-size:inherit}
.tok{border-radius:10px;padding:4px 11px;font-size:18px}
.inp{border-radius:12px;padding:12px 14px;font-size:18px;border-width:1.5px}
.inp:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px var(--blue-soft)}
.choice{border-radius:12px;padding:12px 14px;font-size:16px;background:var(--surface)}
.choice:hover{border-color:var(--blue)}
.ox button{font-family:var(--f-body);font-weight:700;border-radius:16px;padding:14px}
.fb{border-radius:12px;padding:12px 16px}
.notes{border-radius:var(--r);box-shadow:var(--sh)}
.score{font-family:var(--f-body);font-weight:800;letter-spacing:-.03em}
/* Instagram-like DM */
.dmhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px 10px 8px;margin-top:12px;box-shadow:var(--sh)}
.dmback{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dmback:hover{background:var(--surface2)}
.dmback svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#1f4fd8,#5b8cff,#0c2463,#1f4fd8)}
.avring .av{width:40px;height:40px;border:2px solid var(--surface);font-family:var(--f-body);font-weight:700;font-size:14px;background:var(--navy)}
.dmwho{display:grid;line-height:1.3;flex:1;min-width:0}
.dmwho b{font-size:15.5px}
.dmwho span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmon{font-size:12px;color:var(--good);font-weight:600;display:flex;align-items:center;gap:6px}
.dmon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.dm{gap:6px;padding:18px 4px 12px;min-height:calc(100dvh - 160px)}
.dmday{justify-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-bottom:8px}
.av{width:30px;height:30px;font-family:var(--f-body);font-weight:700;font-size:12px;background:var(--navy)}
.bub{background:var(--tbub);border:0;border-radius:22px 22px 22px 8px;padding:10px 16px;font-size:16px;line-height:1.6}
.row.me .bub{background:linear-gradient(135deg,#2a5cf0,#1f4fd8 55%,#1a3fb8);border-radius:22px 22px 8px 22px}
.bub.ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue)}
.bub.ex .en{font-family:var(--f-en);font-weight:600;font-size:18.5px}
.qbub{background:var(--surface);border:1.5px solid var(--blue)}
.opt{border-radius:12px;padding:10px 14px;background:var(--surface)}
.dmfoot{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:0}
.dmfoot .btn.primary{border-radius:99px;padding:10px 22px}
.chband .prog{margin-top:4px!important}
</style>

<script>

lk left in the fridge.", "o": ["many", "much", "few"], "a": 1, "ok": "맞아요! milk(U) → much", "no": "milk는 셀 수 없는 명사 → much"}, {"k": "m", "t": "⚠️ 셀 수 없는 명사 함정: information, advice, furniture, homework, news, equipment, luggage, evidence, knowledge → **복수형 ✗, many ✗**"}, {"k": "q", "q": "She gave me ____ useful advice.", "o": ["a few", "many", "a little"], "a": 2, "ok": "정확해요! advice(U) → a little", "no": "advice는 셀 수 없는 명사 → a little"}, {"k": "m", "t": "few / little = **거의 없는**(부정) / a few / a little = **조금 있는**(긍정)"}, {"k": "ex", "en": "Few people came to the meeting, so it ended early.", "ko": "회의에 사람이 거의 오지 않아서 일찍 끝났다."}, {"k": "m", "t": "② 공통 수식어: a lot of, lots of, plenty of, some, any, most, all, no → C·U 모두 OK: a lot of [books] / a lot of water"}, {"k": "q", "q": "빈칸에 들어갈 수 없는 것은? We have ____ time.", "o": ["plenty of", "a lot of", "many"], "a": 2, "ok": "맞아요! time(U) 앞에 many ✗", "no": "time은 셀 수 없는 명사 → many ✗ (plenty of, a lot of는 공통)"}, {"k": "m", "t": "정리! **C → many·few·a number of·fewer / U → much·little·an amount of·less / 공통 → a lot of·plenty of·some·most** 👍"}, {"k": "m", "t": "🎉 Chapter 2 네모·대명사/명사 끝! **가리키는 명사 찾기 + 셀 수 있는지 확인** 두 가지 습관 완성 👏"}], "notes": {"table": [["", "셀 수 있는 명사(C)", "셀 수 없는 명사(U)"], ["많은", "many, a number of, a great many", "much, an amount of, a great deal of"], ["조금 있는", "a few", "a little"], ["거의 없는", "few", "little"], ["더 적은", "fewer", "less"], ["공통", "a lot of, lots of, plenty of, some, any, most, all, no", "a lot of, lots of, plenty of, some, any, most, all, no"]], "tips": ["셀 수 없는 명사: information, advice, furniture, homework, news, equipment, luggage, evidence, knowledge, money, time", "셀 때는 a piece of ~: two pieces of furniture / a piece of advice", "a large number of + C / a large amount of + U"]}, "sets": {"workbook": [{"k": "pk", "q": "How [much*/many] money do you need?", "e": "money(U) → much"}, {"k": "pk", "q": "I have [many*/much] friends in Busan.", "e": "friends(C) → many"}, {"k": "pk", "q": "There are [a few*/a little] eggs in the basket.", "e": "eggs(C) → a few"}, {"k": "pk", "q": "We have [a little*/a few] time before the movie starts.", "e": "time(U) → a little"}, {"k": "pk", "q": "He gave me some useful [information*/informations].", "e": "information은 복수형 ✗"}, {"k": "pk", "q": "[Few*/Little] students passed the difficult exam.", "e": "students(C) → few"}, {"k": "pk", "q": "This room needs new [furniture*/furnitures].", "e": "furniture는 복수형 ✗"}, {"k": "bl", "q": "우리 반에는 학생이 많다. → There are (many) students in my class. (한 단어)", "e": "students(C) → many"}, {"k": "fx", "q": "I don't have many homework today.", "w": "many", "a": ["much", "a lot of"], "e": "homework(U) → much"}, {"k": "fx", "q": "We need more informations about the trip.", "w": "informations", "a": ["information"], "e": "information은 복수형 ✗"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) There was [few / little] traffic on the road this morning.\n(B) I read [a number of / an amount of] books during the vacation.\n(C) He has [much / many] experience in teaching.", "o": ["few – a number of – many", "little – a number of – much", "little – an amount of – much", "few – an amount of – many", "little – a number of – many"], "a": 1, "e": "(A) traffic(U) (B) books(C) (C) experience(경험, U)"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I have a lot of homework to do.", "There is little water in the bottle.", "She has a few close friends.", "How many luggage do you have?", "Most students like music."], "a": 3, "e": "④ luggage(U) → much"}, {"k": "pk", "q": "Only [a few*/a little] people know the truth.", "e": "people(C) → a few"}, {"k": "pk", "q": "The scientist spent a great deal of [time*/hours] on the project.", "e": "a great deal of + U → time"}, {"k": "pk", "q": "We should use [less*/fewer] water and [fewer*/less] plastic bags.", "e": "water(U) → less / bags(C) → fewer"}, {"k": "bl", "q": "그는 그 주제에 대해 아는 것이 거의 없다. → He has (little) knowledge about the topic.", "e": "knowledge(U) + urniture."], "e": "furniture(U) → little"}, {"k": "wr", "q": "나는 질문이 몇 가지 있다. (a few, questions)", "a": ["I have a few questions."], "e": "questions(C) → a few"}, {"k": "or", "q": "그녀는 많은 정보를 모았다.", "a": "She collected a lot of information.", "e": "a lot of는 공통 / information은 단수형"}, {"k": "bl", "q": "어제 그 콘서트에는 사람이 거의 오지 않았다. → (Few) people came to the concert yesterday.", "e": "people(C) + 거의 없는 → Few"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "개들은 꼬리로 감정을 표현한다. (dogs, express, feelings, with, tails)", "a": ["Dogs express their feelings with their tails."], "e": "Dogs(복수) → their"}, {"k": "wr", "q": "이 차는 내 것이 아니라 그녀의 것이다. (not mine but hers)", "a": ["This car is not mine but hers.", "This car isn't mine but hers."], "e": "소유대명사"}, {"k": "wr", "q": "그는 스스로를 천재라고 부른다. (call, a genius)", "a": ["He calls himself a genius."], "e": "주어 = 목적어 → himself"}, {"k": "wr", "q": "나는 숙제가 많지 않다. (much homework)", "a": ["I don't have much homework.", "I do not have much homework."], "e": "homework(U) → much"}, {"k": "wr", "q": "도서관에는 학생이 거의 없었다. (few students, in the library)", "a": ["There were few students in the library.", "In the library there were few students."], "e": "students(C) → few"}, {"k": "bl", "q": "올해 여름은 작년 여름보다 더웠다. → The summer this year was hotter than (that) of last year.", "e": "summer(단수) → that"}, {"k": "bl", "q": "우리는 시간이 조금 있으니 커피를 마시자. → We have (a little) time, so let's have coffee.", "e": "time(U) + 조금 있는 → a little"}, {"k": "fx", "q": "All students should do its best.", "w": "its", "a": ["their"], "e": "students(복수) → their"}, {"k": "fx", "q": "She gave me many useful advice.", "w": "many", "a": ["much", "a lot of", "some"], "e": "advice(U) → much"}, {"k": "or", "q": "그는 그녀의 오랜 친구이다.", "a": "He is an old friend of hers.", "e": "a friend of + 소유대명사"}], "test": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) The tree lost all [its / their] leaves.\n(B) My phone is newer than [her / hers].\n(C) There is [few / little] hope of finding the lost dog.", "o": ["its – hers – little", "their – hers – few", "its – her – little", "their – her – few", "its – hers – few"], "a": 0, "e": "(A) The tree → its (B) 그녀의 것 → hers (C) hope(U) → little"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The streets of Seoul are wider than ____ of my hometown.", "o": ["it", "that", "those", "them", "this"], "a": 2, "e": "streets(복수) → those"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Jake, take care of ____. It's cold outside.", "o": ["you", "your", "yours", "yourself", "yourselves"], "a": 3, "e": "명령문의 주어 you(Jake 한 명) = 목적어 → yourself"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["We have plenty of time.", "Few people believed his story.", "I need a little sugar for the cake.", "She spent much hours on the essay.", "A lot of furniture was damaged."], "a": 3, "e": "④ hours(C) → many"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["The students raised its hands.", "This is my bag, and that is your.", "He made dinner for himself.", "I have many homeworks.", "There are little chairs."], "a": 2, "e": "① their ② yours ④ much homework ⑤ few"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy cousin and I went to a bakery. (A) [Her / Hers] favorite bread was sold out, so she chose a cake. I bought (B) [a few / a little] cookies. When we got home, we ate the snacks and enjoyed (C) [ourselves / us] a lot.", "o": ["Her – a few – ourselves", "Hers – a little – us", "Her – a little – ourselves", "Hers – a few – us", "Her – a few – us"], "a": 0, "e": "(A) 뒤에 명사 → Her (B) cookies(C) (C) enjoy oneself"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nHow ____ books did you read?\nHow ____ water did you drink?", "o": ["much – many", "many – much", "many – many", "much – much", "few – little"], "a": 1, "e": "books(C) → many / water(U) → much"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The company improved its service.\nⓑ The ears of a fox are bigger than that of a dog.\nⓒ Tom introduced himself to us.\nⓓ I need a few more minutes.\nⓔ We bought a lot of equipment.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓒⓓⓔ 옳음 / ⓑ those"}, {"k": "ch", "q": "빈칸에 much가 들어갈 수 없는 것은?", "o": ["I don't have ____ money.", "How ____ time is left?", "She didn't eat ____ food.", "There weren't ____ people.", "We didn't get ____ rain."], "a": 3, "e": "④ people(C) → many"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? There is ____ water in the bottle.", "o": ["a lot of", "little", "some", "plenty of", "a few"], "a": 4, "e": "water(U) → a few ✗"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) Children should learn to protect [them / themselves] online.\n(B) [Much / Many] of the information was wrong.\n(C) The houses here are cheaper than [that / those] in the city.", "o": ["them – Much – that", "themselves – Much – those", "themselves – Many – those", "them – Many – that", "themselves – Much – that"], "a": 1, "e": "(A) 의미상 주어 Children = 목적어 (B) information(U) (C) houses(복수)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The cat licked its paw.", true], ["The students did their best.", true], ["Your answer is the same as my.", false], ["She often talks to herself.", true], ["He asked me to help himself.", false], ["The roads in the city are busier than that in the country.", false], ["Is this book yours?", true], ["I have a few questions.", true], ["There is little milk left.", true], ["We need much informations.", false], ["A lot of people came.", true], ["I enjoyed myself at the party.", true]], "e": "ⓒ mine ⓔ him ⓕ those ⓙ information"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Few students were absent.", true], ["She gave me a little advices.", false], ["He didn't spend much money.", true], ["A number of cars were parked.", true], ["An amount of people waited.", false], ["I bought two pieces of furniture.", true], ["They built the house themselves.", true], ["The book is a gift from a friend of me.", false], ["The problem is too hard for them.", true], ["Each team has its own color.", true], ["The climate here is milder than those of Russia.", false], ["Plenty of water is needed.", true]], "e": "ⓑ advice ⓔ A number of ⓗ mine ⓚ that"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The kids made the cake themselves.", "Little money was left.", "His idea was better than mine.", "The museum is famous for their old paintings.", "She has a few good friends."], "a": 3, "e": "④ The museum → its"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The doctor gave me ____ advice about my diet.", "o": ["a few", "many", "several", "some", "a number of"], "a": 3, "e": "advice(U) → some"}]}}, {"book": "eos", "chapter": {"id": "03", "name": "네모·시제", "title": "어법끝 START · PART 1 네모 어법 · Unit 03 시제"}, "units": [{"tag": "eos-1-P07", "name": "단순과거와 현재완료의 구별은 부사를 찾아라!", "talk": [{"k": "m", "t": "Unit 03은 **시제**! 네모 '과거 vs 현재완료'는 문장 속 **시간 부사(구)**가 정답을 알려 줘요 ⏳"}, {"k": "m", "t": "① **명백한 과거 시점** → 단순과거: yesterday, ago, last ~, in + 과거 연도, then, just now, when ~(과거의 때) → 현재완료 ✗"}, {"k": "ex", "en": "I lost my wallet two days ago.", "ko": "나는 이틀 전에 지갑을 잃어버렸다."}, {"k": "q", "q": "She ____ to Paris in 2019.", "o": ["has gone", "went", "has been"], "a": 1, "ok": "맞아요! in 2019 → 단순과거", "no": "in + 과거 연도는 명백한 과거 → went"}, {"k": "m", "t": "② 과거부터 지금까지 **계속** → 현재완료: for + 기간, since + 과거 시점, so far, until now, over(for) the past + 기간, recently, lately"}, {"k": "q", "q": "We ____ each other since we were kids.", "o": ["knew", "have known", "know"], "a": 1, "ok": "정확해요! since ~ → 현재완료", "no": "since + 과거 시점 → 지금까지 계속 → have known"}, {"k": "m", "t": "⚠️ since 뒤에는 과거 시점·과거 동사, 주절은 현재완료: It [has] rained since last night. / I have lived here since I was born."}, {"k": "m", "t": "⚠️ **When**으로 묻는 의문문에 현재완료 ✗: When did you finish it? (When have you finished it? ✗)"}, {"k": "q", "q": "When ____ the first smartphone come out?", "o": ["did", "has", "have"], "a": 0, "ok": "맞아요! When 의문문 → 과거", "no": "When은 명백한 과거 시점을 묻는 말 → did"}, {"k": "m", "t": "⚠️ for + 기간이라도 **지금은 끝난 일**이면 과거: He lived in Busan for ten years before he moved to Seoul."}, {"k": "m", "t": "정리! **ago·yesterday·last·in 연도·When → 과거 / since·for(지금까지)·so far·over the past·recently → 현재완료** 👍"}], "notes": {"table": [["시제", "함께 쓰는 말", "예"], ["단순과거", "yesterday, ~ ago, last ~, in + 연도, then, just now, When ~?", "I met him two days ago."], ["현재완료(계속)", "for + 기간, since + 시점, so far, until now", "I have lived here for ten years."], ["현재완료(완료·경험)", "already, yet, just, ever, never, before", "Have you ever been to Jeju?"], ["현재완료", "over the past + 기간, recently, lately", "Prices have risen over the past year."]], "tips": ["역사적 사실·명백한 과거 시점 → 과거 (현재완료 ✗)", "When ~? 의문문 → 과거 / How long ~? → 현재완료", "since 절의 동사는 과거, 주절은 현재완료"]}, "sets": {"workbook": [{"k": "pk", "q": "I [finished*/have finished] my report last night.", "e": "last night → 과거"}, {"k": "pk", "q": "He [has lived*/lived] in this town since 2015.", "e": "since + 시점 → 현재완료"}, {"k": "pk", "q": "They [moved*/have moved] to Canada three years ago.", "e": "ago → 과거"}, {"k": "pk", "q": "We [have had*/had] this car for ten years, and it still runs well.", "e": "지금도 계속 → 현재완료"}, {"k": "pk", "q": "So far, the team [has won*/won] five games.", "e": "so far → 현재완료"}, {"k": "pk", "q": "When [did you meet*/have you met] your best friend?", "e": "When 의문문 → 과거"}, {"k": "bl", "q": "그녀는 어제 그 영화를 봤다. → She (saw) the movie yesterday.", "e": "yesterday → 과거"}, {"k": "bl", "q": "나는 지난달 이후로 그를 보지 못했다. → I (haven't|have not) seen him since last month.", "e": "since → 현재완료"}, {"k": "fx", "q": "I have visited the museum last Sunday.", "w": "have", "a": ["(삭제)"], "e": "last Sunday → 과거 visited"}, {"k": "fx", "q": "She works at the bank since 2020.", "w": "works", "a": ["has worked", "has been working"], "e": "since → 현재완료"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) I [lost / have lost] my umbrella yesterday.\n(B) He [was / has been] sick since last Friday.\n(C) The bridge [was built / has been built] in 1985.", "o": ["lost – was – was built", "lost – has been – was built", "have lost – has been – has been built", "have lost – was – was built", "lost – has been – has been built"], "a": 1, "e": "(A) yesterday (B) since (C) in 1985"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I have known her for years.", "We went to the beach last summer.", "He has left the office an hour ago.", "It has been cold lately.", "What time did you get up today?"], "a": 2, "e": "③ ago → left"}, {"k": "pk", "q": "Over the past ten years, the city [has changed*/changed] a lot.", "e": "over the past + 기간 → 현재완료"}, {"k": "pk", "q": "The Korean War [ended*/has ended] in 1953.", "e": "역사적 사실 + in 1953 → 과거"}, {"k": "pk", "q": "Mina [has studied*/studied] English since she was seven.", "e": "since → 현재완료"}, {"k": "bl", "q": "나는 아직 그 책을 다 읽지 못했다. → I (haven't|have not) finished the book yet.", "e": "yet → 현재완료"}, {"k": "bl", "q": "그는 10년 전에 그 회사에 입사했다. → He (joined) the company ten years ago.", "e": "ago → 과거"}, {"k": "fx", "q": "He is absent from school since Monday.", "w": "is", "a": ["has been"], "e": "since → 현재완료"}, {"k": "ox", "q": "I have seen that movie three times.", "a": true, "e": "✔ 경험 → 현재완료"}, {"k": "ox", "q": "She has graduated from college in 2018.", "a": false, "e": "in 2018 → graduated"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I lived in Jeju when I was a child.\nⓑ He has bought a new car last week.\nⓒ We have been friends since 2015.\nⓓ When have you arrived?\nⓔ It hasn't rained for a month.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ bought / ⓓ did you arrive"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy family (A) [moved / has moved] to Seoul in 2018. Since then, we (B) [lived / have lived] in the same apartment. Two years ago, my sister (C) [started / has started] college, and she now lives in a dormitory.", "o": ["moved – have lived – started", "has moved – lived – started", "moved – lived – has started", "has moved – have lived – has started", "moved – have lived – has started"], "a": 0, "e": "(A) in 2018 (B) Since then (C) Two years ago"}, {"k": "pk", "q": "The price of oil [has risen*/rose] sharply since January.", "e": "since → 현재완료"}, {"k": "pk", "q": "Just now, the teacher [called*/has called] your name.", "e": "just now → 과거"}, {"k": "fx", "q": "Jisu has met her favorite singer at the airport yesterday.", "w": "has", "a": ["(삭제)"], "e": "yesterday → 과거 met"}, {"k": "fx", "q": "Many people lost their jobs since the factory closed.", "w": "lost", "a": ["have lost"], "e": "since → 현재완료"}, {"k": "wr", "q": "나는 어렸을 때부터 그를 알아 왔다. (know, since, a child)", "a": ["I have known him since I was a child.", "I've known him since I was a child.", "I have known him since I was a kid."], "e": "since → 현재완료"}, {"k": "wr", "q": "그 박물관은 1990년에 문을 열었다. (open, in 1990)", "a": ["The museum opened in 1990.", "The museum was opened in 1990."], "e": "in 1990 → 과거"}, {"k": "or", "q": "그녀는 지난 3년 동안 피아노를 가르쳐 왔다.", "a": "She has taught piano for the past three years.", "e": "for the past + 기간 → 현재완료"}, {"k": "bl", "q": "너는 언제 그 소식을 들었니? → When (did) you hear the news?", "e": "When 의문문 → 과거"}]}}, {"tag": "eos-1-P08", "name": "현재시제가 미래를 나타내는 부사절에 주의하라!", "talk": [{"k": "m", "t": "시간·조건 **부사절**에서는 미래 일이라도 **현재시제**! 🕒 will을 쓰면 틀려요"}, {"k": "m", "t": "① 시간: when, before, after, until, as soon as, by the time, once, while → 부사절 동사는 현재"}, {"k": "ex", "en": "I will call you when I arrive at the station.", "ko": "역에 도착하면 너에게 전화할게."}, {"k": "q", "q": "We'll start the meeting as soon as everyone ____.", "o": ["comes", "will come", "came"], "a": 0, "ok": "맞아요! 시간 부사절 → 현재", "no": "as soon as 부사절 → 미래라도 현재 comes"}, {"k": "m", "t": "② 조건: if, unless, as long as, in case → 현재: If it [rains] tomorrow, we will stay home."}, {"k": "q", "q": "Unless you ____ now, you'll miss the bus.", "o": ["leave", "will leave", "left"], "a": 0, "ok": "정확해요! 조건 부사절 → 현재", "no": "unless 부사절 → leave"}, {"k": "m", "t": "⚠️ 미래완료 대신 **현재완료**: I'll lend you the book after I [have] finished it."}, {"k": "m", "t": "⚠️ **명사절** if / whether(~인지), when(언제 ~할지)은 미래면 **will 그대로**! I wonder if he [will] come tomorrow."}, {"k": "q", "q": "I don't know if it ____ tomorrow.", "o": ["rains", "will rain", "rained"], "a": 1, "ok": "맞아요! 명사절(~인지) → will", "no": "if절이 know의 목적어(명사절) → will rain"}, {"k": "m", "t": "구별법 👀 if·when절이 동사의 **목적어·주어 자리**면 명사절(will 가능), 빼도 문장이 되면 부사절(현재)"}, {"k": "m", "t": "정리! **시간·조건 부사절 → 현재(현재완료) / 명사절 if·whether·when → 미래면 will** 👍"}, {"k": "m", "t": "🎉 Chapter 3 네모·시제 끝! **시간 부사 찾기 + 부사절·명사절 구별**로 시제 네모 완성 👏"}], "notes": {"table": [["절", "접속사", "미래 일을 나타낼 때", "예"], ["시간 부사절", "when, before, after, until, as soon as, by the time, once", "현재 / 현재완료", "I'll call you when I get home."], ["조건 부사절", "if, unless, as long as, in case", "현재", "If it snows, we'll stay in."], ["명사절(목적어)", "if, whether (~인지)", "will", "I wonder if she will come."], ["명사절(목적어)", "when (언제 ~할지)", "will", "Tell me when he will arrive."]], "tips": ["부사절 안 will → 삭제하고 현재로", "after I have finished (미래완료 대신 현재완료)", "주절은 그대로 will / 명령문"]}, "sets": {"workbook": [{"k": "pk", "q": "I'll wait here until you [come*/will come] back.", "e": "until 부사절 → 현재"}, {"k": "pk", "q": "If you [study*/will study] hard, you will pass the test.", "e": "조건 부사절 → 현재"}, {"k": "pk", "q": "Please turn off the lights before you [go*/will go] to bed.", "e": "before 부사절 → 현재"}, {"k": "pk", "q": "By the time we [get*/will get] there, the show will have started.", "e": "by the time 부사절 → 현재"}, {"k": "pk", "q": "I wonder when the package [will arrive*/arrives].", "e": "wonder의 목적어(명사절) → will"}, {"k": "pk", "q": "Ask him if he [will join*/joins] us tomorrow.", "e": "ask의 목적어(명사절) → will"}, {"k": "bl", "q": "내일 날씨가 좋으면 우리는 소풍을 갈 것이다. → If the weather (is) nice tomorrow, we will go on a picnic.", "e": "조건 부사절 → 현재"}, {"k": "bl", "q": "그가 도착하자마자 우리는 출발할 것이다. → As soon as he (arrives), we will leave.", "e": "시간 부사절 → 현재"}, {"k": "fx", "q": "I'll text you after I will finish my homework.", "w": "will", "a": ["(삭제)"], "e": "after 부사절 → finish"}, {"k": "fx", "q": "I don't know whether she comes to the party tomorrow.", "w": "comes", "a": ["will come"], "e": "명사절 + 미래 → will come"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) I'll give him the message when he [comes / will come] home.\n(B) I'm not sure if it [snows / will snow] tomorrow.\n(C) Unless you [hurry / will hurry], you'll be late.", "o": ["comes – will snow – hurry", "will come – snows – hurry", "comes – snows – will hurry", "will come – will snow – will hurry", "comes – will snow – will hurry"], "a": 0, "e": "(A) 시간 부사절 (B) 명사절(~인지) (C) 조건 부사절"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I'll call you when I get home.", "Let me know if you need help.", "She will be happy if she will win.", "I wonder if he will remember me.", "We'll stay inside until the storm passes."], "a": 2, "e": "③ 조건 부사절 → wins"}, {"k": "pk", "q": "Once you [learn*/will learn] to ride a bike, you'll never forget it.", "e": "once 부사절 → 현재"}, {"k": "pk", "q": "Bring an umbrella in case it [rains*/will rain].", "e": "in case 부사절 → 현재"}, {"k": "pk", "q": "Nobody knows when the next earthquake [will happen*/happens].", "e": "knows의 목적어(명사절) → will"}, {"k": "bl", "q": "네가 그 책을 다 읽고 나면 나에게 빌려줘. → Lend me the book after you (finish|have finished) it.", "e": "after 부사절 → 현재(현재완료)"}, {"k": "bl", "q": "나는 그가 내일 올지 모르겠다. → I don't know if he (will) come tomorrow.", "e": "명사절 → will"}, {"k": "fx", "q": "Call me if you will need any help.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → need"}, {"k": "ox", "q": "As long as you keep your promise, I will trust you.", "a": true, "e": "✔ 조건 부사절 → 현재"}, {"k": "ox", "q": "I'll leave as soon as the bell will ring.", "a": false, "e": "시간 부사절 → rings"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If it will rain, the game will be canceled.\nⓑ I'll wait until he will come.\nⓒ Do you know when she will arrive?\nⓓ Before you will go out, close the window.\nⓔ I wonder if they will like my present.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 1, "e": "ⓒⓔ 옳음(명사절) / ⓐ rains / ⓑ comes / ⓓ go"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nNext week, my class is going on a field trip. If the weather (A) [is / will be] good, we will visit the zoo. Our teacher hasn't decided yet whether we (B) [go / will go] to the museum too. As soon as we (C) [arrive / will arrive] at school on Monday, we will get on the bus.", "o": ["is – will go – arrive", "will be – go – arrive", "is – go – will arrive", "will be – will go – will arrive", "is – will go – will arrive"], "a": 0, "e": "(A) 조건 부사절 (B) 명사절(~인지) (C) 시간 부사절"}, {"k": "pk", "q": "I'll lend you my notes after I [have finished*/will have finished] reviewing them.", "e": "부사절 → 미래완료 대신 현재완료"}, {"k": "pk", "q": "Nobody knows if the team [will win*/wins] the final next week.", "e": "knows의 목적어(명사절) → will"}, {"k": "fx", "q": "You can watch TV after you will clean your room.", "w": "will", "a": ["(삭제)"], "e": "after 부사절 → clean"}, {"k": "fx", "q": "I'm not sure whether he comes back next week.", "w": "comes", "a": ["will come"], "e": "명사절 + 미래 → will come"}, {"k": "wr", "q": "내가 숙제를 끝내면 너에게 전화할게. (when, finish my homework, call you)", "a": ["I will call you when I finish my homework.", "I'll call you when I finish my homework.", "When I finish my homework, I will call you.", "When I finish my homework, I'll call you.", "I will call you when I have finished my homework.", "When I have finished my homework, I will call you."], "e": "시간 부사절 → 현재"}, {"k": "wr", "q": "나는 그가 시험에 합격할지 궁금하다. (wonder, if, pass the exam)", "a": ["I wonder if he will pass the exam.", "I wonder whether he will pass the exam."], "e": "명사절 → will"}, {"k": "or", "q": "서두르지 않으면 너는 기차를 놓칠 것이다.", "a": "Unless you hurry, you will miss the train.", "e": "조건 부사절 → 현재"}, {"k": "bl", "q": "비가 그칠 때까지 여기서 기다리자. → Let's wait here until the rain (stops).", "e": "until 부사절 → 현재"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "나는 2년 전에 이 자전거를 샀다. (buy, this bike, ago)", "a": ["I bought this bike two years ago.", "I bought this bike 2 years ago."], "e": "ago → 과거"}, {"k": "wr", "q": "그녀는 작년부터 일본어를 배워 왔다. (learn Japanese, since last year)", "a": ["She has learned Japanese since last year.", "She has been learning Japanese since last year.", "She has learnt Japanese since last year."], "e": "since → 현재완료"}, {"k": "wr", "q": "너는 언제 그 편지를 받았니? (when, get the letter)", "a": ["When did you get the letter?", "When did you receive the letter?"], "e": "When → 과거"}, {"k": "wr", "q": "그가 돌아오면 나는 떠날 것이다. (when, come back, leave)", "a": ["I will leave when he comes back.", "I'll leave when he comes back.", "When he comes back, I will leave.", "When he comes back, I'll leave."], "e": "시간 부사절 → 현재"}, {"k": "wr", "q": "나는 그녀가 파티에 올지 모르겠다. (if, come to the party)", "a": ["I don't know if she will come to the party.", "I don't know whether she will come to the party.", "I am not sure if she will come to the party.", "I am not sure whether she will come to the party."], "e": "명사절 → will"}, {"k": "fx", "q": "We have moved here in 2021.", "w": "have", "a": ["(삭제)"], "e": "in 2021 → 과거 moved"}, {"k": "fx", "q": "If you will leave now, you can catch the bus.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → leave"}, {"k": "bl", "q": "지금까지 우리는 세 번 이겼다. → So far, we (have) won three times.", "e": "so far → 현재완료"}, {"k": "bl", "q": "그는 30분 전에 떠났다. → He (left) thirty minutes ago.", "e": "ago → 과거"}, {"k": "or", "q": "나는 지난주부터 아팠다.", "a": "I have been sick since last week.", "e": "since → 현재완료"}], "test": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) Dinosaurs [lived / have lived] millions of years ago.\n(B) I [didn't see / haven't seen] her since she moved.\n(C) We'll start when everyone [is / will be] ready.", "o": ["lived – haven't seen – is", "have lived – didn't see – is", "lived – didn't see – will be", "have lived – haven't seen – will be", "lived – haven't seen – will be"], "a": 0, "e": "(A) ago (B) since (C) 시간 부사절"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He ____ in this company for twenty years, and he is still working here.", "o": ["worked", "works", "has worked", "had worked", "will work"], "a": 2, "e": "지금도 계속 → 현재완료"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The plane will take off after the rain ____.", "o": ["stops", "will stop", "stopped", "has stopping", "stop"], "a": 0, "e": "시간 부사절 → 현재"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I have lost my key, so I can't get in.", "She left Korea in 2020.", "I've lived here since I was born.", "When have you visited Rome?", "It has snowed a lot lately."], "a": 3, "e": "④ When → did you visit"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["If you need me, call me.", "As soon as I will get the results, I'll tell you.", "I wonder when he will be back.", "I'll wait until you finish.", "In case you get lost, take this map."], "a": 1, "e": "② 시간 부사절 → get"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMr. Lee (A) [taught / has taught] at our school since 2010. Before that, he (B) [worked / has worked] at a bank for five years. Next year, when he (C) [retires / will retire], we will throw a party for him.", "o": ["taught – worked – retires", "has taught – worked – retires", "has taught – has worked – will retire", "taught – has worked – retires", "has taught – worked – will retire"], "a": 1, "e": "(A) since (B) 지금은 끝난 과거의 일 (C) 시간 부사절"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I met him two days ago.\nⓑ She has been sick for a week.\nⓒ I've finished it yesterday.\nⓓ Let's go out if it stops raining.\nⓔ We'll go out after the rain will stop.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ finished / ⓔ stops"}, {"k": "ch", "q": "빈칸에 will이 들어갈 수 있는 것은?", "o": ["If it ____ rain, we'll stay home.", "I don't know when he ____ come.", "Wait until I ____ call you.", "Unless you ____ hurry, you'll be late.", "Call me as soon as you ____ arrive."], "a": 1, "e": "② know의 목적어(명사절) → will"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI ____ in Seoul when I was young.\nI ____ in Seoul since I was ten.", "o": ["lived – lived", "have lived – have lived", "lived – have lived", "have lived – lived", "live – have lived"], "a": 2, "e": "when I was young → 과거 / since → 현재완료"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He has died in 2001.", "I have seen him last night.", "We've been friends for ten years.", "When has the train left?", "She works here since 2019."], "a": 2, "e": "① died ② saw ④ did the train leave ⑤ has worked"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) I'm not sure whether he [passes / will pass] the test next week.\n(B) I'll go to bed after I [take / will take] a shower.\n(C) The museum [opened / has opened] in 1999.", "o": ["passes – take – opened", "will pass – take – opened", "will pass – will take – has opened", "passes – will take – has opened", "will pass – take – has opened"], "a": 1, "e": "(A) 명사절 (B) 시간 부사절 (C) in 1999"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I lost my phone yesterday.", true], ["She has visited Japan last year.", false], ["We have known each other for years.", true], ["When did you come home?", true], ["He lives here since 2015.", false], ["It has been very hot recently.", true], ["If it snows tomorrow, we'll make a snowman.", true], ["I'll call you when I will arrive.", false], ["I wonder if he will like it.", true], ["Let's wait until the bus comes.", true], ["The war ended in 1945.", true], ["Unless you will study, you'll fail.", false]], "e": "ⓑ visited ⓔ has lived ⓗ arrive ⓛ study"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I have already eaten lunch.", true], ["He moved to Seoul two years ago.", true], ["Have you ever been to Jeju?", true], ["When have you met her?", false], ["She has been ill since last Monday.", true], ["Mina has bought a dress last week.", false], ["Before you leave, turn off the lights.", true], ["Do you know when he will return?", true], ["If you will need help, just ask.", false], ["I'll go home as soon as I finish this.", true], ["Nobody knows if it rains tomorrow.", false], ["We have lived here for five years.", true]], "e": "ⓓ did you meet ⓕ bought ⓘ need ⓚ will rain"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I haven't seen the movie yet.", "By the time you come, I will have left.", "He has worked here since he graduated.", "Columbus has discovered America in 1492.", "Once you start, don't stop."], "a": 3, "e": "④ in 1492 → discovered"}, {"k": "ch", "q": "빈칸에 들어갈 말로 알맞지 않은 것은? I have lived in this city ____.", "o": ["since 2015", "for ten years", "until now", "two years ago", "since I was born"], "a": 3, "e": "④ ago는 현재완료와 ✗"}]}}, {"book": "eos", "chapter": {"id": "04", "name": "네모·조동사/가정법", "title": "어법끝 START · PART 1 네모 어법 · Unit 04 조동사/가정법"}, "units": [{"tag": "eos-1-P09", "name": "조동사+have p.p.는 가리키는 때와 의미에 주의하라!", "talk": [{"k": "m", "t": "Unit 04! 조동사 네모는 **가리키는 때**부터 보기 🕰️ 현재·미래 → 조동사 + **동사원형** / **과거** → 조동사 + **have p.p.**"}, {"k": "ex", "en": "He must be tired now. / He must have been tired yesterday.", "ko": "그는 지금 피곤함에 틀림없다. / 그는 어제 피곤했음에 틀림없다."}, {"k": "q", "q": "She didn't answer the phone last night. She ____ asleep.", "o": ["must be", "must have been", "should be"], "a": 1, "ok": "맞아요! last night(과거) 추측 → must have been", "no": "어젯밤 일에 대한 추측 → must have p.p."}, {"k": "m", "t": "과거 단서 찾기 👀 yesterday, last ~, then, ago, 과거 동사(didn't, was, looked)가 있으면 **have p.p.**!"}, {"k": "m", "t": "추측의 세기: must have p.p.(~했음에 틀림없다) > may·might have p.p.(~했을지도 모른다) / can't [have] p.p.(~했을 리가 없다)"}, {"k": "q", "q": "Jake was with me all day yesterday. He ____ the window.", "o": ["must have broken", "can't have broken", "should have broken"], "a": 1, "ok": "정확해요! 하루 종일 나랑 있었으니 ~했을 리가 없다", "no": "알리바이가 있으니 강한 부정 추측 → can't have broken"}, {"k": "m", "t": "후회·유감: should have p.p.(~했어야 했는데 안 했다) / shouldn't have p.p.(~하지 말았어야 했는데 했다) / could have p.p.(~할 수도 있었는데 안 했다)"}, {"k": "q", "q": "I failed the test. I ____ harder.", "o": ["should have studied", "must have studied", "can't have studied"], "a": 0, "ok": "맞아요! 후회 → should have p.p.", "no": "공부를 안 해서 후회 → should have studied"}, {"k": "m", "t": "⚠️ need not have p.p. = ~할 필요가 없었는데 (했다): You [needn't] have bought a gift."}, {"k": "m", "t": "정리! **때(현재 vs 과거) → 동사원형 vs have p.p. / 의미(must·can't·may·should·could) → 문맥으로** 👍"}], "notes": {"table": [["형태", "의미", "예"], ["must have p.p.", "~했음에 틀림없다", "The road is wet. It must have rained."], ["can't(cannot) have p.p.", "~했을 리가 없다", "He can't have said that."], ["may(might) have p.p.", "~했을지도 모른다", "She may have missed the bus."], ["should have p.p.", "~했어야 했는데 (안 했다)", "I should have left earlier."], ["shouldn't have p.p.", "~하지 말았어야 했는데 (했다)", "You shouldn't have eaten so much."], ["could have p.p.", "~할 수도 있었는데 (안 했다)", "We could have won the game."], ["need not have p.p.", "~할 필요가 없었는데 (했다)", "You needn't have hurried."]], "tips": ["have 뒤에는 반드시 p.p. (should have went ✗ → gone)", "현재 추측 must be / 과거 추측 must have been", "must have p.p.의 반대는 can't have p.p. (must not have p.p. ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "The ground is wet. It [must have rained*/must rain] last night.", "e": "last night → must have p.p."}, {"k": "pk", "q": "You look pale. You [must be*/must have been] sick.", "e": "지금 상태 추측 → must be"}, {"k": "pk", "q": "He [can't have written*/must have written] this letter. He can't read or write yet.", "e": "아직 글을 모름 → can't have p.p."}, {"k": "pk", "q": "I left my bag on the bus. I [should have been*/must have been] more careful.", "e": "후회 → should have p.p."}, {"k": "pk", "q": "You [shouldn't have eaten*/must have eaten] so much. Now you have a stomachache.", "e": "하지 말았어야 했는데 → shouldn't have p.p."}, {"k": "pk", "q": "He isn't here yet. He [may have missed*/should have missed] the bus.", "e": "~했을지도 모른다 → may have p.p."}, {"k": "bl", "q": "너는 그에게 사과했어야 했다. → You (should) have apologized to him.", "e": "후회 → should have p.p."}, {"k": "bl", "q": "그녀는 그 소식을 들었음에 틀림없다. → She must have (heard) the news.", "e": "have + p.p."}, {"k": "fx", "q": "I'm sorry I'm late. I should have leave earlier.", "w": "leave", "a": ["left"], "e": "have + p.p. → left"}, {"k": "fx", "q": "Tom looked very happy yesterday. He must pass the exam.", "w": "pass", "a": ["have passed"], "e": "과거 추측 → must have passed"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) The lights were off. They [must be / must have been] out then.\n(B) I'm full. I [shouldn't eat / shouldn't have eaten] that last piece of cake.\n(C) Sue speaks Spanish perfectly. She [may live / may have lived] in Spain before.", "o": ["must be – shouldn't eat – may live", "must have been – shouldn't have eaten – may have lived", "must have been – shouldn't eat – may live", "must be – shouldn't have eaten – may have lived", "must have been – shouldn't have eaten – may live"], "a": 1, "e": "(A) then (B) 이미 먹음 → 후회 (C) before → 과거 추측"}, {"k": "ch", "q": "다음 상황에 맞는 말은? (어제 비가 왔는데 너는 우산을 가져가지 않아서 젖었다.)", "o": ["You must have taken an umbrella.", "You should have taken an umbrella.", "You can't have taken an umbrella.", "You may take an umbrella.", "You shouldn't have taken an umbrella."], "a": 1, "e": "~했어야 했는데 → should have p.p."}, {"k": "pk", "q": "Kevin got a perfect score. He [must have studied*/can't have studied] very hard.", "e": "만점 → ~했음에 틀림없다"}, {"k": "pk", "q": "The store [can't have closed*/should have closed] already; it's only 5 p.m., and it closes at 9.", "e": "~했을 리가 없다 → can't have p.p."}, {"k": "pk", "q": "We [could have won*/must have won] the game, but we made too many mistakes.", "e": "~할 수도 있었는데 → could have p.p."}, {"k": "bl", "q": "그가 그런 말을 했을 리가 없다. → He (can't|cannot|couldn't) have said such a thing.", "e": "~했을 리가 없다"}, {"k": "bl", "q": "나는 너에게 더 일찍 말했어야 했는데. → I should have (told) you earlier.", "e": "have + p.p."}, {"k": "fx", "q": "She must have be very tired after the long trip.", "w": "be", "a": ["been"], "e": "have + p.p. → been"}, {"k": "ox", "q": "You needn't have bought a gift, but thank you.", "a": true, "e": "✔ ~할 필요가 없었는데"}, {"k": "ox", "q": "My keys aren't here. I may leave them at school yesterday.", "a": false, "e": "과거 추측 → may have left"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She must have forgotten my birthday.\nⓑ You should have seen the doctor earlier.\nⓒ He can't have been at home; I saw him at the park then.\nⓓ I might have lost it on the bus yesterday.\nⓔ They must be angry yesterday.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ must have been"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nYesterday, Minji's dog didn't come home. \"It (A) [may have run / may run] after a cat,\" her dad said. Minji felt bad. \"I (B) [should have closed / must have closed] the gate,\" she said. Luckily, the dog came back at night. It (C) [must have been / must be] hungry, because it ate all its food at once.", "o": ["may run – should have closed – must be", "may have run – must have closed – must have been", "may have run – should have closed – must have been", "may run – must have closed – must be", "may have run – should have closed – must be"], "a": 2, "e": "(A) 과거 추측 (B) 후회 (C) 과거 추측"}, {"k": "pk", "q": "It's dark outside. It [must be*/must have been] late now.", "e": "now → must be"}, {"k": "pk", "q": "I don't see Amy. She [might have gone*/should have gone] home already.", "e": "~했을지도 모른다 → might have p.p."}, {"k": "fx", "q": "You should had told me the truth.", "w": "had", "a": ["have"], "e": "조동사 + have p.p."}, {"k": "fx", "q": "He can't has finished the work so quickly.", "w": "has", "a": ["have"], "e": "조동사 + have p.p."}, {"k": "wr", "q": "그녀는 길을 잃었음에 틀림없다. (must, get lost)", "a": ["She must have gotten lost.", "She must have got lost."], "e": "must have p.p."}, {"k": "wr", "q": "나는 그 돈을 쓰지 말았어야 했는데. (shouldn't, spend the money)", "a": ["I shouldn't have spent the money.", "I should not have spent the money."], "e": "shouldn't have p.p."}, {"k": "or", "q": "그는 그 소식을 들었을지도 모른다.", "a": "He may have heard the news.", "e": "may have p.p."}, {"k": "bl", "q": "그녀가 그 케이크를 만들었을 리가 없다. 그녀는 요리를 못한다. → She (can't|cannot|couldn't) have made the cake. She can't cook.", "e": "~했을 리가 없다"}]}}, {"tag": "eos-1-P10", "name": "가정법의 핵심은 시제이다!", "talk": [{"k": "m", "t": "가정법의 핵심은 **시제**! 🔮 **현재** 사실의 반대 → 가정법 **과거** / **과거** 사실의 반대 → 가정법 **과거완료**"}, {"k": "m", "t": "가정법 과거: If + 주어 + **과거동사(be → were)**, 주어 + would / could / might + **동사원형**"}, {"k": "ex", "en": "If I had more time, I would learn to play the drums.", "ko": "내가 시간이 더 있다면 드럼을 배울 텐데. (지금 시간이 없다)"}, {"k": "q", "q": "If I ____ you, I would accept the offer.", "o": ["am", "were", "had been"], "a": 1, "ok": "맞아요! 현재 사실 반대 → were", "no": "주절이 would + 동사원형 → 가정법 과거 → were"}, {"k": "m", "t": "가정법 과거완료: If + 주어 + **had p.p.**, 주어 + would / could / might + **have p.p.**"}, {"k": "q", "q": "If she had left earlier, she ____ the train.", "o": ["would catch", "would have caught", "will catch"], "a": 1, "ok": "정확해요! had p.p. → would have p.p.", "no": "if절이 had left(과거완료) → would have caught"}, {"k": "m", "t": "⚠️ 혼합 가정법: If + had p.p.(과거 일), 주어 + would + 동사원형 + **now**(현재 결과): If I had slept well last night, I wouldn't be tired [now]."}, {"k": "m", "t": "② that절의 should: **주장·요구·제안·명령** 동사(insist, demand, suggest, recommend, order, require) + that + 주어 + (should) **동사원형**"}, {"k": "q", "q": "The doctor suggested that he ____ more water.", "o": ["drink", "drinks", "drank"], "a": 0, "ok": "맞아요! suggest + that + (should) 동사원형", "no": "제안 → (should) drink, 주어가 he라도 동사원형"}, {"k": "m", "t": "⚠️ insist가 '~했다고 **사실을 주장**하다', suggest가 '~을 **암시하다**'이면 should ✗ → 시제 일치: He insisted that he [had] seen a UFO."}, {"k": "m", "t": "정리! **현재 반대 → 과거 + would 동사원형 / 과거 반대 → had p.p. + would have p.p. / 주장·요구·제안 → (should) 동사원형** 👍"}, {"k": "m", "t": "🎉 Chapter 4 네모·조동사/가정법 끝! **때를 가리키는 단서**만 찾으면 조동사·가정법 네모 완성 👏"}], "notes": {"table": [["종류", "if절", "주절", "의미"], ["가정법 과거", "If + 과거동사(were)", "would / could / might + 동사원형", "현재 사실의 반대"], ["가정법 과거완료", "If + had p.p.", "would / could / might + have p.p.", "과거 사실의 반대"], ["혼합 가정법", "If + had p.p.", "would + 동사원형 (now)", "과거 일 → 현재 결과"], ["that절 should", "insist / demand / suggest / recommend / order / require + that", "주어 + (should) 동사원형", "당위(~해야 한다)"]], "tips": ["주절의 would + 동사원형 / would have p.p.를 보고 if절 시제 맞추기", "단서: now, today → 현재 / yesterday, then, last ~ → 과거", "insist(사실 주장)·suggest(암시)는 직설법: He insisted that he was innocent."]}, "sets": {"workbook": [{"k": "pk", "q": "If I [had*/have] a car, I would drive you home.", "e": "가정법 과거 → had"}, {"k": "pk", "q": "If I [were*/am] a bird, I would fly to you.", "e": "현재 사실 반대 → were"}, {"k": "pk", "q": "If you had told me, I [would have helped*/would help] you yesterday.", "e": "과거 사실 반대 → would have p.p."}, {"k": "pk", "q": "If he [had studied*/studied] harder, he would have passed the exam.", "e": "주절 would have p.p. → had p.p."}, {"k": "pk", "q": "She insisted that he [be*/is] on time.", "e": "요구 → (should) 동사원형"}, {"k": "pk", "q": "The teacher recommended that we [read*/reading] the book.", "e": "추천 → (should) 동사원형"}, {"k": "bl", "q": "내가 부자라면 세계 여행을 할 텐데. → If I (were) rich, I would travel around the world.", "e": "가정법 과거 → were"}, {"k": "bl", "q": "그가 나를 도와줬더라면 나는 그것을 끝낼 수 있었을 텐데. → If he had helped me, I could have (finished) it.", "e": "could have p.p."}, {"k": "fx", "q": "If I knew her number, I will call her.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "fx", "q": "The manager demanded that the report is finished by Friday.", "w": "is", "a": ["be", "should be"], "e": "요구 → (should) be"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) If I [were / had been] taller, I could reach the top shelf.\n(B) If we had taken a taxi, we [wouldn't miss / wouldn't have missed] the flight.\n(C) Mom suggested that I [take / took] a break.", "o": ["were – wouldn't miss – take", "had been – wouldn't have missed – took", "were – wouldn't have missed – take", "had been – wouldn't miss – take", "were – wouldn't have missed – took"], "a": 2, "e": "(A) 주절 could reach → 가정법 과거 (B) had taken → would have p.p. (C) 제안 → 동사원형"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If I had known the truth, I would have told you.", "o": ["As I know the truth, I tell you.", "As I didn't know the truth, I didn't tell you.", "As I knew the truth, I told you.", "As I don't know the truth, I don't tell you.", "Though I knew the truth, I didn't tell you."], "a": 1, "e": "가정법 과거완료 = 과거 사실의 반대"}, {"k": "pk", "q": "If she [had*/had had] enough money now, she would buy the bag.", "e": "now → 가정법 과거 had"}, {"k": "pk", "q": "If I had taken the medicine yesterday, I [would feel*/would have felt] better now.", "e": "혼합 가정법 → now → would feel"}, {"k": "pk", "q": "The law requires that every driver [wear*/wears] a seat belt.", "e": "require + that → (should) 동사원형"}, {"k": "bl", "q": "그가 그때 열심히 일했더라면 성공했을 텐데. → If he had worked hard then, he would (have) succeeded.", "e": "would have p.p."}, {"k": "bl", "q": "의사는 그녀가 쉬어야 한다고 주장했다. → The doctor insisted that she (should) rest.", "e": "주장(당위) → should + 동사원형"}, {"k": "fx", "q": "If I have wings, I would fly over the mountains.", "w": "have", "a": ["had"], "e": "가정법 과거 → had"}, {"k": "ox", "q": "He insisted that he had never seen the man before.", "a": true, "e": "✔ 사실 주장 → 시제 일치(직설법)"}, {"k": "ox", "q": "If you had come to the party last night, you would meet my cousin there.", "a": false, "e": "과거 사실 반대 → would have met"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I were you, I wouldn't go.\nⓑ If he had asked me, I would have said yes.\nⓒ She suggested that we went home early.\nⓓ If I had a dog, I would walk it every day.\nⓔ If we left on time yesterday, we wouldn't have been late.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ (should) go / ⓔ had left"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nLast Saturday, I didn't check the weather. If I (A) [checked / had checked] it, I would have brought an umbrella. I got wet and caught a cold. If I (B) [weren't / hadn't been] sick now, I could go to the concert tonight. My mom insisted that I (C) [stay / stayed] in bed all day.", "o": ["checked – weren't – stay", "had checked – hadn't been – stayed", "had checked – weren't – stay", "checked – hadn't been – stay", "had checked – weren't – stayed"], "a": 2, "e": "(A) would have brought → had p.p. (B) now → 가정법 과거 (C) 요구 → 동사원형"}, {"k": "pk", "q": "If the bus [had arrived*/arrived] on time yesterday, I wouldn't have been late.", "e": "과거 사실 반대 → had p.p."}, {"k": "pk", "q": "The coach ordered that the players [run*/ran] ten laps.", "e": "명령 → (should) 동사원형"}, {"k": "fx", "q": "If he had been more careful, he wouldn't make that mistake last week.", "w": "make", "a": ["have made"], "e": "last week → wouldn't have made"}, {"k": "fx", "q": "She recommended that he sees a dentist.", "w": "sees", "a": ["see", "should see"], "e": "추천 → (should) see"}, {"k": "wr", "q": "내가 너라면 그 제안을 받아들일 텐데. (If I were you, accept the offer)", "a": ["If I were you, I would accept the offer.", "If I were you I would accept the offer.", "I would accept the offer if I were you."], "e": "가정법 과거"}, {"k": "wr", "q": "그녀가 일찍 출발했더라면 기차를 탔을 텐데. (leave early, catch the train)", "a": ["If she had left early, she would have caught the train.", "If she had left early, she could have caught the train.", "She would have caught the train if she had left early.", "She could have caught the train if she had left early."], "e": "가정법 과거완료"}, {"k": "or", "q": "그는 우리가 그 회의에 참석해야 한다고 제안했다.", "a": "He suggested that we attend the meeting.", "e": "제안 → (should) 동사원형"}, {"k": "bl", "q": "내가 그 답을 안다면 너에게 말해 줄 텐데. → If I (knew) the answer, I would tell you.", "e": "가정법 과거 → knew"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그는 내 메시지를 못 봤을지도
