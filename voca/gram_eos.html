d at the door with his arms folding.", "w": "folding", "a": ["folded"], "e": "팔이 접힘 → folded"}, {"k": "fx", "q": "The products making in this factory are exported to Europe.", "w": "making", "a": ["made"], "e": "제품이 만들어짐 → made"}, {"k": "or", "q": "그 소식에 충격을 받아서, 그녀는 아무 말도 할 수 없었다.", "a": "Shocked by the news, she couldn't say anything.", "e": "그녀가 충격을 느낌 → Shocked"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe volunteers ____ at the event were given free T-shirts.", "o": ["work", "working", "worked", "works", "to working"], "a": 1, "e": "자원봉사자들이 일함(자동사) → working"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe question ____ by the student surprised the teacher.\nThe student ____ the question looked nervous.", "o": ["asking – asking", "asked – asking", "asking – asked", "asked – asked", "ask – asked"], "a": 1, "e": "질문이 받아짐(by) → asked / 학생이 질문함 + 목적어 → asking"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Known for its beaches, the island attracts many tourists.", "Not wanting to be late, he ran to the station.", "She spoke with her voice shaking.", "Leaving alone, the puppy started to bark.", "Having lived abroad, she knows many cultures."], "a": 3, "e": "④ 강아지가 혼자 남겨짐 → Left"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nThe movie was so ____ that I watched it three times.", "o": ["excite", "excited", "exciting", "excites", "to exciting"], "a": 2, "e": "영화가 신나게 함 → exciting"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) [Founding / Founded] in 1950, the library has a lot of rare books. Students (B) [visiting / visited] it often feel (C) [surprising / surprised] by its huge collection.", "o": ["Founding – visiting – surprised", "Founded – visited – surprising", "Founded – visiting – surprised", "Founded – visiting – surprising", "Founding – visited – surprised"], "a": 2, "e": "(A) 도서관이 설립됨 → Founded (B) 학생들이 방문함 + 목적어 → visiting (C) 학생들이 놀람을 느낌 → surprised"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그는 다리를 꼰 채로 의자에 앉아 있었다.", "o": ["He sat on the chair with his legs crossing.", "He sat on the chair with his legs crossed.", "He sat on the chair with crossed his legs.", "He sat on the chair his legs with crossed.", "He sat on the chair with his legs cross."], "a": 1, "e": "with + 명사 + p.p. (다리가 꼬임)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The broken window was replaced yesterday.\nⓑ Having been warned, the hikers stayed on the trail.\nⓒ The team was satisfying with the result.\nⓓ People waiting for the bus looked tired.\nⓔ Painting by a famous artist, the picture is very valuable.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ satisfied / ⓔ 그림이 그려짐 → Painted"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ the door, I found a package.\n____ with care, the vase will last for years.", "o": ["Opening – Handled", "Opened – Handling", "Opening – Handling", "Opened – Handled", "Open – Handle"], "a": 0, "e": "내가 엶 → Opening / 꽃병이 다뤄짐 → Handled"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["The boy calling Minsu is my classmate. (민수라고 불리는)", "Disappointing with the score, she cried.", "The audience was moved by her touching speech.", "The stolen car finding in the river was badly damaged.", "Seeing from above, the town looks tiny."], "a": 2, "e": "③ 청중이 감동받음 → moved / 연설이 감동을 줌 → touching / ① called ② Disappointed ④ found ⑤ Seen"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nLast night I heard a (A) [frightening / frightened] sound. (B) [Waking / Woken] by it, I went downstairs and found the window (C) [breaking / broken].", "o": ["frightening – Waking – broken", "frightened – Woken – broken", "frightening – Woken – broken", "frightening – Woken – breaking", "frightened – Waking – breaking"], "a": 2, "e": "(A) 소리가 공포를 줌 → frightening (B) 내가 깨워짐 → Woken (C) 창문이 깨져 있음 → broken"}, {"k": "ch", "q": "분사의 형태가 바르지 않은 것은?", "o": ["fallen leaves on the road", "a bike stolen last night", "a surprising gift from my aunt", "the bored audience in the hall", "a confused question on the test"], "a": 4, "e": "⑤ 질문이 혼란을 줌 → a confusing question"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The girl dancing on the stage is my sister.", true], ["The letters writing by soldiers were moving.", false], ["Surprised by the noise, the cat jumped.", true], ["He was sitting with his eyes closed.", true], ["The lecture was very bored.", false], ["Having finished lunch, we went for a walk.", true], ["Most of the guests invited to the party came.", true], ["Raising in a small town, she loves nature.", false], ["I felt relaxed after the massage.", true], ["With his leg breaking, he couldn't walk.", false], ["The man repairing my car is very kind.", true], ["The results were satisfying.", true]], "e": "ⓑ written ⓔ boring ⓗ Raised ⓙ broken"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Built of stone, the bridge has lasted for centuries.", true], ["The kids playing soccer outside are noisy.", true], ["I was so embarrassing in front of everyone.", false], ["The car parked in front of my house is not mine.", true], ["Using a dictionary, you can check the meaning.", true], ["Most of the food serving at the party was delicious.", false], ["She stood there with her heart beating fast.", true], ["Interested in science, he joined the robot club.", true], ["Knowing as a quiet boy, he surprised everyone.", false], ["The amazing performance got a standing ovation.", true], ["The students were boring by the long lecture.", false], ["Located near the station, the hotel is convenient.", true]], "e": "ⓒ embarrassed ⓕ served ⓘ Known ⓚ bored"}, {"k": "wr", "q": "Because she was tired of waiting, she left. → 분사구문으로 바꾸시오.", "a": ["Tired of waiting, she left.", "Being tired of waiting, she left."], "e": "(Being) Tired"}, {"k": "wr", "q": "이 버튼을 누르면, 너는 화면을 끌 수 있다. — 분사구문 (press this button, turn off the screen)", "a": ["Pressing this button, you can turn off the screen."], "e": "네가 누름 → Pressing"}]}}, {"book": "eos", "chapter": {"id": "07", "name": "네모·동사/준동사", "title": "어법끝 START · PART 1 네모 어법 · Unit 07 동사와 준동사"}, "units": [{"tag": "eos-1-P16", "name": "동사부터 찾아라!", "talk": [{"k": "m", "t": "네모 어법 1순위 전략: 문장에 **동사가 있는지**부터 확인! 접속사·관계사 없이 한 절에 동사는 **딱 하나** 🚦"}, {"k": "m", "t": "네모 자리에 동사가 없으면 → **동사**(is, makes, made…) / 이미 동사가 있으면 → **준동사**(to-v, v-ing, p.p.)"}, {"k": "ex", "en": "The best way to learn a language is to use it every day.", "ko": "언어를 배우는 가장 좋은 방법은 그것을 매일 쓰는 것이다. (진짜 동사는 is 하나)"}, {"k": "q", "q": "Students who study abroad ____ new perspectives on life.", "o": ["gaining", "gain", "to gain"], "a": 1, "ok": "맞아요! who study abroad는 관계절, 문장의 동사가 없음 → gain", "no": "관계절을 괄호로 묶으면 주어 Students 뒤에 동사가 없어요 → gain"}, {"k": "m", "t": "전략: 긴 주어(전치사구·분사구·관계절)를 **괄호로 묶고** 남은 자리를 봐요. 공식: **접속사·관계사 수 + 1 = 동사 수**"}, {"k": "m", "t": "반대로 동사가 이미 있으면 네모는 준동사 → The man [standing] at the gate is my uncle. (동사는 is)"}, {"k": "q", "q": "____ enough sleep is important for teenagers.", "o": ["Get", "Getting", "Gets"], "a": 1, "ok": "정확해요! 동사 is가 있으니 주어 자리 → 동명사 Getting", "no": "동사는 is → 네모는 주어(명사) 자리 → Getting"}, {"k": "m", "t": "**do vs. be (대동사)**: 앞의 동사를 대신할 때 일반동사면 **do/does/did**, be동사면 **am/is/are/was/were** → She works harder than I [do]."}, {"k": "q", "q": "He was more nervous than his brother ____.", "o": ["did", "was", "does"], "a": 1, "ok": "맞아요! 앞이 be동사 was → was", "no": "nervous는 be동사(was)와 함께 → 대동사도 was"}, {"k": "m", "t": "정리! **절 하나에 동사 하나 / 동사 있으면 준동사 / 대동사는 앞 동사 종류·시제를 따라 do 또는 be** 👍"}], "notes": {"table": [["확인할 것", "네모가 동사", "네모가 준동사"], ["문장에 동사가 없음", "The girls in the photo look happy.", "—"], ["동사가 이미 있음", "—", "The girl wearing a cap is Mina."], ["주어 자리", "—", "Reading novels relaxes me."], ["대동사 (일반동사)", "He runs faster than I do.", ""], ["대동사 (be동사)", "She is taller than I am.", ""], ["so / neither + 대동사 + 주어", "I like it, and so does Tom.", "I'm not tired, and neither is Tom."]], "tips": ["접속사·관계사 개수 + 1 = 동사 개수", "대동사는 시제도 맞추기: He studied hard, and so did I.", "조동사·have가 있으면 그대로: I can't swim, and neither can he."]}, "sets": {"workbook": [{"k": "pk", "q": "The girl [sat/sitting*] next to me in class lent me her pen.", "e": "동사 lent가 있음 → 준동사 sitting"}, {"k": "pk", "q": "Many people who live in big cities [want*/wanting] to move to the countryside.", "e": "관계절 묶기 → 문장의 동사 필요 → want"}, {"k": "pk", "q": "[Exercise/Exercising*] regularly helps you stay healthy.", "e": "동사 helps가 있음 → 주어 Exercising"}, {"k": "pk", "q": "The purpose of the meeting [is*/being] to discuss the new plan.", "e": "문장의 동사 필요 → is"}, {"k": "pk", "q": "My sister speaks Chinese better than I [do*/am].", "e": "speaks(일반동사) → do"}, {"k": "pk", "q": "Jake was tired, and so [did/was*] I.", "e": "was tired → was"}, {"k": "bl", "q": "그 정원에서 일하는 남자가 이 꽃들을 심었다. → The man (working) in the garden planted these flowers.", "e": "동사 planted가 있음 → 준동사 working"}, {"k": "bl", "q": "나는 그녀만큼 빨리 달릴 수 없다. → I can't run as fast as she (can|does).", "e": "대동사"}, {"k": "ox", "q": "The students who joined the club last year enjoying the activities.", "a": false, "e": "문장의 동사가 없음 → enjoyed"}, {"k": "fx", "q": "The bus leaving the station at 8 arriving in Busan at noon.", "w": "arriving", "a": ["arrives", "arrived"], "e": "문장의 동사 필요 → arrives"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe idea that we can change the world ____ many young people.", "o": ["inspire", "inspiring", "inspires", "to inspire", "inspired by"], "a": 2, "e": "that절은 동격절, 문장의 동사 필요 → inspires"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Reading books gives us new ideas.", "The woman wearing glasses is my aunt.", "What he said at the meeting surprised everyone.", "People living in cold areas wearing thick coats.", "He doesn't like coffee, and neither do I."], "a": 3, "e": "④ 문장의 동사가 없음 → wear"}, {"k": "pk", "q": "One of the best ways to reduce stress [is*/being] to exercise.", "e": "문장의 동사 필요 → is"}, {"k": "pk", "q": "The teacher asked the students [sitting*/sat] in the back row to move forward.", "e": "동사 asked가 있음 → sitting"}, {"k": "pk", "q": "She didn't expect to win the prize, but she [was/did*].", "e": "win(일반동사)을 대신 → did"}, {"k": "pk", "q": "My brother is taller than my father [does/is*].", "e": "is tall → is"}, {"k": "bl", "q": "그가 어제 산 노트북은 아주 빠르다. → The laptop he bought yesterday (is) very fast.", "e": "he bought yesterday는 관계절 → 문장의 동사 is"}, {"k": "bl", "q": "Tom은 수영을 좋아하고, 나도 그렇다. → Tom likes swimming, and so (do) I.", "e": "so + 대동사 + 주어"}, {"k": "fx", "q": "The man lived next door is a famous chef.", "w": "lived", "a": ["living", "who lives"], "e": "동사 is가 있음 → living"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMost people (A) [believe / believing] that breakfast is important. A study (B) [conducted / conducts] last year, however, (C) [shows / showing] that skipping breakfast is not always harmful.", "o": ["believe – conducted – shows", "believing – conducted – showing", "believe – conducts – showing", "believing – conducts – shows", "believe – conducted – showing"], "a": 0, "e": "(A) 문장의 동사 → believe (B) 동사 shows가 따로 있음 → 준동사 conducted (C) 문장의 동사 → shows"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe man (A) [sat / sitting] next to me on the plane (B) [told / telling] me about his travels. He was more excited about the trip than I (C) [did / was].", "o": ["sat – told – was", "sitting – told – was", "sitting – telling – did", "sat – telling – was", "sitting – told – did"], "a": 1, "e": "(A) 동사 told가 있음 → sitting (B) 문장의 동사 → told (C) was excited → was"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Learning a new language takes time.\nⓑ The students passed the exam celebrating together.\nⓒ She cooks better than her mother does.\nⓓ The boy was hungrier than I did.\nⓔ The news that he had won the game made us happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ 동사 두 개 → The students who passed the exam celebrated together. / ⓓ was hungry → was"}, {"k": "fx", "q": "Anyone wants to take part in the event should register online.", "w": "wants", "a": ["wanting", "who wants"], "e": "동사 should register가 있음 → wanting"}, {"k": "fx", "q": "The children enjoyed the show, and so do their parents.", "w": "do", "a": ["did"], "e": "enjoyed(과거) → did"}, {"k": "pk", "q": "The number of students [taking*/take] online classes has increased.", "e": "동사 has increased가 있음 → taking"}, {"k": "pk", "q": "She hasn't finished her homework, and neither [have*/do] I.", "e": "hasn't finished(현재완료) → have"}, {"k": "wr", "q": "그녀는 나보다 일찍 일어난다. — 대동사를 써서 (get up earlier than)", "a": ["She gets up earlier than I do."], "e": "gets(일반동사) → do"}, {"k": "wr", "q": "공원에서 조깅하는 사람들은 건강해 보인다. (the people, jog in the park, look healthy)", "a": ["The people jogging in the park look healthy.", "People jogging in the park look healthy."], "e": "동사 look + 준동사 jogging"}, {"k": "or", "q": "그가 회의에서 제안한 계획은 효과가 좋았다.", "a": "The plan he suggested at the meeting worked well.", "e": "he suggested ~는 관계절 → 문장의 동사 worked"}, {"k": "ox", "q": "Tom isn't interested in sports, and neither is his brother.", "a": true, "e": "✔ isn't → neither is"}]}}, {"tag": "eos-1-P17", "name": "동사별로 취하는 목적어 형태를 알아두라!", "talk": [{"k": "m", "t": "동사 뒤 네모에 to-v / v-ing가 있으면 → **앞의 동사**가 어떤 목적어를 쓰는지가 답! 📚"}, {"k": "m", "t": "**to-v**를 쓰는 동사(앞으로 할 일·의지): want, hope, wish, plan, decide, expect, agree, refuse, promise, manage, afford, fail, pretend, choose, offer"}, {"k": "m", "t": "**v-ing**를 쓰는 동사(하고 있는·한 일, 회피): enjoy, finish, mind, avoid, give up, keep, consider, suggest, deny, practice, put off, quit, imagine, admit"}, {"k": "q", "q": "We decided ____ the trip because of the storm.", "o": ["canceling", "to cancel", "cancel"], "a": 1, "ok": "맞아요! decide + to-v", "no": "decide는 to부정사를 목적어로 → to cancel"}, {"k": "q", "q": "Would you mind ____ the window?", "o": ["opening", "to open", "open"], "a": 0, "ok": "정확해요! mind + v-ing", "no": "mind는 동명사를 목적어로 → opening"}, {"k": "m", "t": "둘 다 쓰는데 **뜻이 같은** 동사: like, love, hate, begin, start, continue, prefer / **뜻이 다른** 동사: remember·forget + to-v(할 일) / v-ing(한 일), regret + to-v(~하게 되어 유감이다) / v-ing(~한 것을 후회하다), try + to-v(애쓰다) / v-ing(시험 삼아 해 보다)"}, {"k": "ex", "en": "I remember locking the door, but I forgot to turn off the light.", "ko": "문을 잠근 것은 기억나는데, 불 끄는 것을 잊었다."}, {"k": "m", "t": "⚠️ stop + v-ing = ~하는 것을 멈추다 / stop + to-v = ~하기 **위해** 멈추다 (이때 to-v는 목적어가 아님)"}, {"k": "m", "t": "**가목적어 it**: find·make·think·consider + **it** + 형용사(명사) + to-v / that절 → I found [it] difficult to wake up early. (this, that ✗ / it 생략 ✗)"}, {"k": "m", "t": "정리! **to-v 동사(미래) / v-ing 동사(과거·회피) / 뜻이 다른 remember·forget·regret·try / 가목적어 it** 👍"}], "notes": {"table": [["목적어", "동사"], ["to-v만", "want, hope, plan, decide, expect, agree, refuse, promise, manage, afford, fail, pretend"], ["v-ing만", "enjoy, finish, mind, avoid, give up, keep, consider, suggest, deny, practice, put off, quit, imagine"], ["둘 다 (뜻 같음)", "like, love, hate, begin, start, continue, prefer"], ["remember / forget", "+ to-v: (앞으로) ~할 것 / + v-ing: (과거에) ~한 것"], ["regret", "+ to-v: ~하게 되어 유감이다 / + v-ing: ~한 것을 후회하다"], ["try", "+ to-v: ~하려고 애쓰다 / + v-ing: 시험 삼아 ~해 보다"], ["가목적어", "find / make / think / consider + it + 형용사 + to-v(that절)"]], "tips": ["부정은 준동사 앞: decide not to go / regret not studying", "stop to-v는 '~하기 위해'(부사적 용법)", "가목적어 자리에 this·that ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "She finally managed [finishing/to finish*] the project on time.", "e": "manage + to-v"}, {"k": "pk", "q": "He avoided [answering*/to answer] my question.", "e": "avoid + v-ing"}, {"k": "pk", "q": "They agreed [helping/to help*] us move.", "e": "agree + to-v"}, {"k": "pk", "q": "I'm considering [taking*/to take] a gap year.", "e": "consider + v-ing"}, {"k": "pk", "q": "Please remember [locking/to lock*] the door when you leave.", "e": "앞으로 할 일 → to lock"}, {"k": "pk", "q": "The new rule made [it*/this] easier to borrow books.", "e": "가목적어 it"}, {"k": "bl", "q": "그는 작년에 담배를 끊었다. → He gave up (smoking) last year.", "e": "give up + v-ing"}, {"k": "bl", "q": "나는 도서관에서 그녀를 만난 것을 기억한다. → I remember (meeting|seeing) her at the library.", "e": "과거에 한 일 → v-ing"}, {"k": "ox", "q": "I can't afford buying a new phone.", "a": false, "e": "afford + to-v → to buy"}, {"k": "fx", "q": "I think this important to keep a diary.", "w": "this", "a": ["it"], "e": "가목적어는 it"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nHe ____ to go abroad to study.", "o": ["hoped", "planned", "decided", "enjoyed", "wanted"], "a": 3, "e": "enjoy + v-ing → to go와 함께 쓸 수 없음"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nShe ____ watching horror movies.", "o": ["enjoys", "avoids", "hates", "refuses", "doesn't mind"], "a": 3, "e": "refuse + to-v → watching과 함께 쓸 수 없음"}, {"k": "pk", "q": "I regret [telling*/to tell] him my secret. Now everyone knows it.", "e": "과거에 한 일을 후회 → telling"}, {"k": "pk", "q": "We regret [informing/to inform*] you that the concert has been canceled.", "e": "~하게 되어 유감이다 → to inform"}, {"k": "pk", "q": "I tried [to lift*/lifting] the heavy box, but I couldn't move it at all. (들어 올리려고 애썼다)", "e": "애쓰다 → to lift"}, {"k": "pk", "q": "He pretended [not to hear*/not hearing] me.", "e": "pretend + to-v (부정은 not to)"}, {"k": "bl", "q": "의사는 커피를 줄일 것을 제안했다. → The doctor suggested (cutting) down on coffee.", "e": "suggest + v-ing"}, {"k": "bl", "q": "나는 매일 운동하는 것이 중요하다고 생각한다. → I think (it) important to exercise every day.", "e": "가목적어 it"}, {"k": "fx", "q": "Don't forget bringing your passport tomorrow.", "w": "bringing", "a": ["to bring"], "e": "앞으로 할 일 → to bring"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nWhen I was a child, I always refused (A) [eating / to eat] vegetables. My mother didn't give up (B) [trying / to try], though. Now I really enjoy (C) [cooking / to cook] with them.", "o": ["eating – trying – cooking", "to eat – trying – cooking", "to eat – to try – cooking", "eating – to try – to cook", "to eat – trying – to cook"], "a": 1, "e": "(A) refuse + to-v (B) give up + v-ing (C) enjoy + v-ing"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nI still remember (A) [visiting / to visit] my grandparents' farm when I was five. Next month, I plan (B) [going / to go] there again, and my cousins have promised (C) [joining / to join] me.", "o": ["visiting – going – joining", "to visit – to go – to join", "visiting – to go – to join", "visiting – to go – joining", "to visit – going – joining"], "a": 2, "e": "(A) 과거에 한 일 → visiting (B) plan + to-v (C) promise + to-v"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He denied breaking the window.\nⓑ She stopped to buy some water on her way home.\nⓒ I found it impossible to sleep in the noisy room.\nⓓ They put off to make a decision.\nⓔ He failed passing the driving test.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ put off + v-ing → making / ⓔ fail + to-v → to pass"}, {"k": "fx", "q": "He promised calling me back, but he never did.", "w": "calling", "a": ["to call"], "e": "promise + to-v"}, {"k": "fx", "q": "The heavy rain made that difficult to drive safely.", "w": "that", "a": ["it"], "e": "가목적어 it"}, {"k": "pk", "q": "I'll never forget [seeing*/to see] the Northern Lights for the first time.", "e": "과거에 한 일 → seeing"}, {"k": "pk", "q": "Mom told me to stop [playing*/to play] games and do my homework.", "e": "게임하는 것을 멈추다 → playing"}, {"k": "wr", "q": "나는 혼자 여행하는 것이 신난다고 생각했다. — 가목적어 it 사용 (find, exciting, travel alone)", "a": ["I found it exciting to travel alone."], "e": "find + it + 형용사 + to-v"}, {"k": "wr", "q": "그는 그 비밀을 누구에게도 말하지 않기로 결심했다. (decide, not, tell anyone the secret)", "a": ["He decided not to tell anyone the secret.", "He decided not to tell the secret to anyone."], "e": "decide not to-v"}, {"k": "or", "q": "그녀는 매일 아침 30분씩 피아노 치는 것을 연습한다.", "a": "She practices playing the piano for 30 minutes every morning.", "e": "practice + v-ing"}, {"k": "ox", "q": "I regret not studying harder when I was young.", "a": true, "e": "✔ 과거에 하지 않은 것을 후회 → not studying"}]}}, {"tag": "eos-1-P18", "name": "목적격보어는 동사와 목적어를 동시에 고려하라!", "talk": [{"k": "m", "t": "5형식 **동사 + 목적어 + 네모**! 보어를 고를 때는 **동사**(어떤 형태를 쓰는지)와 **목적어**(하는지 / 당하는지)를 **동시에** 봐요 👀"}, {"k": "m", "t": "1단계 목적어가 **하는** 동작(능동)이면 동사에 따라: want·ask·tell·allow·expect·encourage·force·enable·get → **to-v** / 사역 make·have·let → **동사원형** / 지각 see·hear·feel·watch → **동사원형·v-ing** / keep·find·leave → **v-ing**"}, {"k": "q", "q": "My parents won't let me ____ out late.", "o": ["stay", "to stay", "staying"], "a": 0, "ok": "맞아요! 사역동사 let + 동사원형", "no": "let + 목적어 + 동사원형 → stay"}, {"k": "m", "t": "2단계 목적어가 **당하는** 동작(수동)이면 동사 종류와 상관없이 **p.p.** → I had my bike [repaired]. / I heard my name called."}, {"k": "q", "q": "I got my teeth ____ at the dentist.", "o": ["check", "to check", "checked"], "a": 2, "ok": "정확해요! 이가 검사받음(수동) → checked", "no": "목적어 my teeth는 검사를 '받는' 쪽 → p.p."}, {"k": "m", "t": "⚠️ get은 능동이면 **to-v**: I got him to fix my bike. (사역 have는 원형: I had him fix my bike.)"}, {"k": "m", "t": "⚠️ let의 수동 보어는 **be p.p.** → Don't let the secret be known. / help는 **동사원형·to-v 둘 다** → She helped me (to) carry the box."}, {"k": "ex", "en": "The coach made the players run laps. / The coach had the field cleaned.", "ko": "코치는 선수들에게 트랙을 돌게 했다. / 코치는 운동장을 청소시켰다."}, {"k": "m", "t": "정리! **목적어가 하면 → 동사에 맞춰 to-v / 원형 / v-ing, 당하면 → p.p.** 👍"}], "notes": {"table": [["동사", "목적어가 함 (능동)", "목적어가 당함 (수동)"], ["want, ask, tell, allow, expect, encourage, enable, force", "to-v", "to be p.p. / (want) p.p."], ["get", "to-v", "p.p."], ["make, have", "동사원형", "p.p."], ["let", "동사원형", "be p.p."], ["see, hear, feel, watch", "동사원형 / v-ing", "p.p."], ["keep, find, leave", "v-ing", "p.p."], ["help", "동사원형 / to-v", "—"]], "tips": ["목적격보어 네모 → 목적어와 보어 사이에 '주어-동사' 관계를 넣어 보기 (my bike was repaired → p.p.)", "사역 have + 원형 vs get + to-v", "지각동사의 수동 → p.p.: I saw him taken to the hospital."]}, "sets": {"workbook": [{"k": "pk", "q": "The teacher told us [bring/to bring*] our textbooks.", "e": "tell + O + to-v"}, {"k": "pk", "q": "She had her car [washing/washed*] yesterday.", "e": "차가 세차됨 → p.p."}, {"k": "pk", "q": "I heard someone [call*/called] my name.", "e": "누군가 부름(능동) + 목적어 my name → 원형"}, {"k": "pk", "q": "Mom made me [clean*/to clean] my room.", "e": "사역 make + 원형"}, {"k": "pk", "q": "He kept me [waiting*/waited] for an hour.", "e": "내가 기다림 → v-ing"}, {"k": "pk", "q": "I found the window [breaking/broken*].", "e": "창문이 깨짐 → p.p."}, {"k": "bl", "q": "의사는 그에게 휴식을 좀 취하라고 충고했다. → The doctor advised him (to) get some rest.", "e": "advise + O + to-v"}, {"k": "bl", "q": "나는 내 시계를 수리받았다. → I had my watch (repaired|fixed).", "e": "시계가 수리됨 → p.p."}, {"k": "ox", "q": "My parents allowed me go to the concert.", "a": false, "e": "allow + O + to-v → to go"}, {"k": "fx", "q": "I want this report finish by Friday.", "w": "finish", "a": ["finished"], "e": "보고서가 끝내짐 → p.p."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nShe got her brother ____ her with her homework.", "o": ["help", "to help", "helped", "helping", "helps"], "a": 1, "e": "get + O(능동) + to-v"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nI ____ him clean the room.", "o": ["made", "had", "let", "helped", "asked"], "a": 4, "e": "ask + O + to-v → asked him to clean"}, {"k": "pk", "q": "We watched the sun [rise*/risen] over the sea.", "e": "해가 뜸(능동) → 원형"}, {"k": "pk", "q": "Have you ever heard this song [sing/sung*] in Korean?", "e": "노래가 불림 → p.p."}, {"k": "pk", "q": "The manager had the workers [finish*/finished] the job by noon.", "e": "일꾼들이 끝냄 → 원형"}, {"k": "pk", "q": "This app enables users [sharing/to share*] photos easily.", "e": "enable + O + to-v"}, {"k": "bl", "q": "나는 그가 큰 소리로 노래하는 것을 들었다. → I heard him (sing|singing) loudly.", "e": "지각동사 + 원형 / v-ing"}, {"k": "bl", "q": "그녀는 머리를 짧게 잘랐다. (미용사에게 자르게 했다) → She had her hair (cut) short.", "e": "머리가 잘림 → p.p."}, {"k": "fx", "q": "The police officer asked the driver show his license.", "w": "show", "a": ["to show"], "e": "ask + O + to-v"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy father always encourages me (A) [read / to read] books. Last week, he had a bookshelf (B) [built / build] in my room, and he made me (C) [choose / to choose] the books for it.", "o": ["read – built – choose", "to read – built – to choose", "to read – build – choose", "to read – built – choose", "read – build – to choose"], "a": 3, "e": "(A) encourage + O + to-v (B) 책장이 만들어짐 → built (C) 사역 make + 원형"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nWhen I came home, I found the door (A) [locking / locked]. I heard my dog (B) [bark / barked] inside, so I called my mom and asked her (C) [come / to come] home quickly.", "o": ["locking – bark – to come", "locked – barked – come", "locked – bark – to come", "locked – bark – come", "locking – barked – to come"], "a": 2, "e": "(A) 문이 잠김 → locked (B) 개가 짖음(지각동사) → bark (C) ask + O + to-v"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I want my room painted blue.\nⓑ She felt someone touched her shoulder.\nⓒ He got his computer fixed by a technician.\nⓓ The coach made the players to practice harder.\nⓔ Please keep the door closed.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ 누군가 만짐(능동) → touch(touching) / ⓓ 사역 make + 원형 → practice"}, {"k": "fx", "q": "I had my passport renew last month.", "w": "renew", "a": ["renewed"], "e": "여권이 갱신됨 → p.p."}, {"k": "fx", "q": "Our teacher let us to use our phones during the break.", "w": "to", "a": ["(삭제)"], "e": "let + O + 원형"}, {"k": "pk", "q": "She saw her son [score*/scored] a goal.", "e": "아들이 골을 넣음 → 원형"}, {"k": "pk", "q": "The workers had the road [repairing/repaired*] before winter.", "e": "도로가 수리됨 → p.p."}, {"k": "wr", "q": "그는 나에게 창문을 열어 달라고 부탁했다. (ask, open the window)", "a": ["He asked me to open the window."], "e": "ask + O + to-v"}, {"k": "wr", "q": "나는 내 컴퓨터를 수리받았다. — 사역동사 have 사용 (my computer, repair)", "a": ["I had my computer repaired."], "e": "have + O + p.p."}, {"k": "or", "q": "그 선생님은 우리가 일찍 집에 가게 해 주셨다.", "a": "The teacher let us go home early.", "e": "let + O + 원형"}, {"k": "ox", "q": "I heard the news announced on the radio.", "a": true, "e": "✔ 소식이 발표됨 → p.p."}]}}], "chapterSets": {"write": [{"k": "wr", "q": "공원에서 개를 산책시키고 있는 그 여자는 내 이웃이다. (the woman, walk her dog, in the park, my neighbor)", "a": ["The woman walking her dog in the park is my neighbor."], "e": "동사 is + 준동사 walking"}, {"k": "wr", "q": "Jane은 나보다 더 일찍 왔다. — 대동사를 써서 (came earlier than)", "a": ["Jane came earlier than I did."], "e": "came → did"}, {"k": "wr", "q": "그는 내 질문에 답하는 것을 피했다. (avoid, answer my question)", "a": ["He avoided answering my question."], "e": "avoid + v-ing"}, {"k": "wr", "q": "나는 매일 일기를 쓰는 것이 유용하다고 생각한다. — 가목적어 it (think, useful, keep a diary every day)", "a": ["I think it useful to keep a diary every day."], "e": "think + it + 형용사 + to-v"}, {"k": "wr", "q": "엄마는 나에게 설거지를 하게 하셨다. — make 사용 (do the dishes)", "a": ["Mom made me do the dishes.", "My mom made me do the dishes.", "My mother made me do the dishes."], "e": "make + O + 원형"}, {"k": "bl", "q": "Please remember (to) (call) your grandmother tonight. (전화할 것을 기억해)", "e": "앞으로 할 일 → to-v"}, {"k": "bl", "q": "I heard my name (called) in the hallway. (불리는 것을)", "e": "이름이 불림 → p.p."}, {"k": "fx", "q": "The girl stood at the bus stop is my classmate.", "w": "stood", "a": ["standing"], "e": "동사 is가 있음 → standing"}, {"k": "fx", "q": "He finished write the report before lunch.", "w": "write", "a": ["writing"], "e": "finish + v-ing"}, {"k": "or", "q": "그녀는 나에게 그 상자를 옮겨 달라고 부탁했다.", "a": "She asked me to carry the box.", "e": "ask + O + to-v"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe scientists ____ the experiment found surprising results.", "o": ["conduct", "conducted", "conducting", "conducts", "to conducting"], "a": 2, "e": "동사 found가 있음 → 준동사 conducting"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nShe speaks Spanish more fluently than her teacher ____.", "o": ["is", "does", "do", "are", "has"], "a": 1, "e": "speaks(일반동사, 3인칭 단수) → does"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nThey ____ to join the volunteer program.", "o": ["decided", "agreed", "refused", "avoided", "hoped"], "a": 3, "e": "avoid + v-ing"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI remember ____ him at the party last year.\nRemember ____ the lights before you leave.", "o": ["meeting – turning off", "to meet – to turn off", "meeting – to turn off", "to meet – turning off", "met – turn off"], "a": 2, "e": "과거에 한 일 → meeting / 앞으로 할 일 → to turn off"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I found it hard to believe his story.", "She had her nails done at the salon.", "He asked me to keep it a secret.", "My parents let me to sleep over at Jina's house.", "We watched the children play in the park."], "a": 3, "e": "④ let + O + 원형 → sleep"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMany experts suggest (A) [keeping / to keep] a regular sleep schedule. People who sleep at the same time every night (B) [feel / feeling] more energetic. So try not to let late-night videos (C) [keep / to keep] you awake.", "o": ["keeping – feel – keep", "to keep – feel – to keep", "keeping – feeling – keep", "to keep – feeling – keep", "keeping – feel – to keep"], "a": 0, "e": "(A) suggest + v-ing (B) 관계절 뒤 문장의 동사 → feel (C) let + O + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The man fixing the roof fell down.\nⓑ I can't imagine to live without music.\nⓒ She was as happy as I was.\nⓓ He got his car washed.\nⓔ I saw a bird built a nest.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ imagine + v-ing → living / ⓔ 새가 지음(능동) → build(building)"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI had the plumber ____ the sink.\nI had the sink ____ by the plumber.", "o": ["fix – fixed", "fixed – fix", "to fix – fixed", "fixing – fix", "fix – fixing"], "a": 0, "e": "배관공이 고침 → 원형 / 싱크대가 고쳐짐 → p.p."}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["Exercise regularly is good for your health.", "He refused accepting the offer.", "They made it clear that they disagreed.", "I heard the song singing by a choir.", "She wanted her son become a doctor."], "a": 2, "e": "③ 가목적어 it + that절 / ① Exercising ② to accept ④ sung ⑤ to become"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe students (A) [chose / chosen] for the program will travel to Japan. The school wants them (B) [learn / to learn] about Japanese culture and has asked them not to forget (C) [writing / to write] a report after the trip.", "o": ["chose – to learn – writing", "chosen – learn – to write", "chosen – to learn – writing", "chosen – to learn – to write", "chose – learn – writing"], "a": 3, "e": "(A) 동사 will travel이 있음 + 학생들이 선발됨 → chosen (B) want + O + to-v (C) 앞으로 할 일 → to write"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nThe smart speaker enables people ____ the lights by voice.", "o": ["control", "to control", "controlling", "controlled", "controls"], "a": 1, "e": "enable + O + to-v"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Swimming in the sea is fun.", true], ["The boy sat next to me was very quiet.", false], ["I enjoy listening to podcasts.", true], ["She is smarter than I am.", true], ["He promised helping me with math.", false], ["I had my phone repaired.", true], ["Mom made me wash the dishes.", true], ["I found it easy to solve the puzzle.", true], ["He was more tired than I did.", false], ["She asked me lend her my notes.", false], ["We stopped talking when the teacher came in.", true], ["I saw him cross the street.", true]], "e": "ⓑ sitting ⓔ to help ⓘ was ⓙ to lend"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The children playing outside look happy.", true], ["I don't mind waiting a little longer.", true], ["They kept the door locking all night.", false], ["He decided to study abroad.", true], ["She works harder than her sister does.", true], ["I think this necessary to save money.", false], ["Let me know if you need help.", true], ["The news surprised everyone in the room.", true], ["Don't forget to bring your umbrella.", true], ["The teacher had us to read the poem aloud.", false], ["I felt my phone vibrate in my pocket.", true], ["The man stand at the gate is a guard.", false]], "e": "ⓒ locked ⓕ it ⓙ read ⓛ standing"}, {"k": "wr", "q": "그녀는 그 일을 혼자 끝내는 것이 불가능하다는 것을 알았다. — 가목적어 it (find, impossible, finish the work alone)", "a": ["She found it impossible to finish the work alone."], "e": "find + it + 형용사 + to-v"}, {"k": "wr", "q": "나는 지난주에 머리를 잘랐다. — 사역동사 have (my hair, cut, last week)", "a": ["I had my hair cut last week.", "Last week, I had my hair cut.", "Last week I had my hair cut."], "e": "have + O + p.p."}]}}, {"book": "eos", "chapter": {"id": "08", "name": "네모·병렬/비교", "title": "어법끝 START · PART 1 네모 어법 · Unit 08 병렬구조와 비교구문"}, "units": [{"tag": "eos-1-P19", "name": "등위접속사+네모는 병렬구조를 묻는다!", "talk": [{"k": "m", "t": "and, or, but 뒤에 네모가 있으면 **병렬구조**! 접속사 앞뒤는 **같은 문법 형태**여야 해요 ⚖️"}, {"k": "m", "t": "전략: 접속사 **뒤** 네모를 보고 → **앞**에서 짝을 찾아요. 바로 앞 단어가 아니라 **문법적으로 같은 역할**을 하는 말!"}, {"k": "ex", "en": "She likes reading novels, writing poems, and drawing cartoons.", "ko": "그녀는 소설 읽기, 시 쓰기, 만화 그리기를 좋아한다. (v-ing 셋이 병렬)"}, {"k": "q", "q": "He opened the door, looked around, and ____ inside.", "o": ["walking", "walked", "to walk"], "a": 1, "ok": "맞아요! opened, looked와 병렬 → walked", "no": "앞의 동사 opened, looked(과거)와 짝 → walked"}, {"k": "m", "t": "⚠️ 함정 ①: 짝이 멀리 있어요 → The plan is to save money and [spend] it wisely. (to save와 병렬, 뒤의 to는 생략 가능)"}, {"k": "m", "t": "⚠️ 함정 ②: 동사끼리 병렬이면 **시제·수**도 맞추기 → She **gets** up early and **goes** jogging."}, {"k": "q", "q": "Learning to cook is fun and ____ you save money.", "o": ["help", "helps", "helping"], "a": 1, "ok": "정확해요! 문장의 동사 is와 병렬 → helps", "no": "주어 Learning to cook의 동사 is와 짝 → 단수 helps"}, {"k": "m", "t": "상관접속사 both A and B / either A or B / neither A nor B / not A but B / not only A but also B 도 **A와 B의 형태**를 맞춰요"}, {"k": "m", "t": "⚠️ 해석으로 짝 결정: I want to visit Paris and **see** the Eiffel Tower. (to visit와 병렬) / I visited Paris and **saw** the Eiffel Tower. (visited와 병렬)"}, {"k": "m", "t": "정리! **접속사 뒤 네모 → 앞에서 같은 역할의 짝 찾기 → 형태·시제 맞추기** 👍"}], "notes": {"table": [["병렬 대상", "예"], ["동사 + 동사", "He came home, ate dinner, and went to bed."], ["to-v + (to) v", "My goal is to learn English and (to) work abroad."], ["v-ing + v-ing", "I enjoy hiking and camping."], ["형용사 + 형용사", "The room was small but comfortable."], ["부사 + 부사", "She spoke slowly and clearly."], ["상관접속사", "not only smart but also kind / both singing and dancing"]], "tips": ["짝은 바로 앞이 아닐 수 있음 → 접속사 앞 전체 구조를 보기", "동사 병렬은 시제·수 일치까지", "to부정사 병렬에서 뒤의 to는 생략 가능"]}, "sets": {"workbook": [{"k": "pk", "q": "My hobbies are hiking, swimming, and [to read/reading*] mystery novels.", "e": "hiking, swimming과 병렬 → reading"}, {"k": "pk", "q": "She cleaned the kitchen and [washes/washed*] the dishes.", "e": "cleaned(과거)와 병렬 → washed"}, {"k": "pk", "q": "You can pay by card or [paying/pay*] in cash.", "e": "can 뒤 pay와 병렬 → pay"}, {"k": "pk", "q": "The movie was long but [interesting*/interestingly].", "e": "long(형용사 보어)과 병렬 → interesting"}, {"k": "pk", "q": "He wants to travel the world and [learn*/learning] new languages.", "e": "to travel과 병렬 → (to) learn"}, {"k": "bl", "q": "그는 매일 아침 일어나서, 샤워를 하고, 아침을 먹는다. → He gets up, takes a shower, and (eats|has) breakfast every morning.", "e": "gets, takes와 병렬"}, {"k": "bl", "q": "공부하는 것과 운동하는 것 둘 다 중요하다. → Both studying and (exercising) are important.", "e": "both A and B → v-ing 짝"}, {"k": "ox", "q": "He likes to play soccer and watching baseball.", "a": false, "e": "to play와 병렬 → (to) watch"}, {"k": "ox", "q": "The room was clean, bright, and comfortable.", "a": true, "e": "✔ 형용사 셋 병렬"}, {"k": "fx", "q": "I spent the weekend reading books and watch movies.", "w": "watch", "a": ["watching"], "e": "reading과 병렬 → watching"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe new library is quiet, spacious, and ____.", "o": ["comfort", "comfortably", "comfortable", "comforts", "to comfort"], "a": 2, "e": "형용사 quiet, spacious와 병렬 → comfortable"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He neither called nor texted me.", "I enjoy cooking and baking.", "She was tired but happy.", "They decided to rent a car and driving to the coast.", "You can stay here or go home."], "a": 3, "e": "④ to rent와 병렬 → (to) drive"}, {"k": "pk", "q": "Reading the instructions carefully and [following*/follow] them step by step will save you time.", "e": "주어 Reading과 병렬 → following"}, {"k": "pk", "q": "The teacher asked us to sit down and [open*/opened] our books.", "e": "to sit과 병렬 → (to) open"}, {"k": "pk", "q": "He was not only smart but also [kindness/kind*].", "e": "smart(형용사)와 병렬 → kind"}, {"k": "pk", "q": "The trip was exciting, but the hotel was dirty and [noise/noisy*].", "e": "dirty(형용사)와 병렬 → noisy"}, {"k": "bl", "q": "그녀는 나에게 미소 짓고 손을 흔들었다. → She smiled and (waved) at me.", "e": "smiled(과거)와 병렬"}, {"k": "bl", "q": "그 일은 어렵지만 보람 있다. → The job is difficult but (rewarding).", "e": "형용사와 병렬"}, {"k": "fx", "q": "The students were asked to arrive early and bringing their own lunch.", "w": "bringing", "a": ["bring", "to bring"], "e": "to arrive와 병렬 → (to) bring"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nOn weekends, my grandfather likes to work in his garden, (A) [grow / grows] vegetables, and share them with neighbors. He says gardening is relaxing and (B) [keeps / keeping] him healthy. He also enjoys reading and (C) [walk / walking] by the river.", "o": ["grow – keeps – walking", "grows – keeps – walk", "grow – keeping – walking", "grows – keeping – walk", "grow – keeps – walk"], "a": 0, "e": "(A) to work, share와 병렬 → (to) grow (B) is와 병렬 → keeps (C) reading과 병렬 → walking"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nTo stay healthy, you should eat well, sleep enough, and (A) [exercising / exercise] regularly. Many people know this but (B) [fail / failing] to do it. Either changing your habits slowly or (C) [set / setting] small goals can help.", "o": ["exercise – fail – setting", "exercising – fail – set", "exercise – failing – setting", "exercising – failing – set", "exercise – fail – set"], "a": 0, "e": "(A) should eat, sleep과 병렬 → exercise (B) know와 병렬 → fail (C) either A or B, changing과 병렬 → setting"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I like walking in the rain and to listen to music.\nⓑ She sings, dances, and plays the guitar.\nⓒ He came home, ate dinner, and goes to bed.\nⓓ It was not cheap but well made.\nⓔ The goal is to win the game and make the fans happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓓⓔ 옳음 / ⓐ walking과 병렬 → listening / ⓒ came, ate와 병렬 → went"}, {"k": "fx", "q": "She stopped by the store, bought some milk, and returns home.", "w": "returns", "a": ["returned"], "e": "stopped, bought(과거)와 병렬 → returned"}, {"k": "fx", "q": "The program helps students improve their writing and gaining confidence.", "w": "gaining", "a": ["gain"], "e": "improve와 병렬 → gain"}, {"k": "pk", "q": "He would rather stay home and [rest*/resting] than go out tonight.", "e": "would rather 뒤 stay와 병렬 → rest"}, {"k": "pk", "q": "Taking notes and [review/reviewing*] them later are good study habits.", "e": "Taking과 병렬 → reviewing"}, {"k": "wr", "q": "그녀는 그 책을 읽고 친구에게 빌려 주었다. — 과거시제 (read the book, lend it to her friend)", "a": ["She read the book and lent it to her friend."], "e": "read(과거)와 lent(과거) 병렬"}, {"k": "wr", "q": "나의 목표는 영어를 배우고 해외에서 일하는 것이다. (My goal, to learn English, work abroad)", "a": ["My goal is to learn English and work abroad.", "My goal is to learn English and to work abroad."], "e": "to-v 병렬"}, {"k": "or", "q": "그는 똑똑할 뿐만 아니라 정직하다.", "a": "He is not only smart but also honest.", "e": "not only A but also B → 형용사 짝"}, {"k": "ox", "q": "She asked me to stay calm and not to worry.", "a": true, "e": "✔ to stay와 not to worry 병렬"}]}}, {"tag": "eos-1-P20", "name": "비교구문의 종류별 의미와 표현에 주목하라!", "talk": [{"k": "m", "t": "비교구문 네모 ① **짝 단서**: than → **비교급** / as ~ as → **원급** / the ~ + in·of → **최상급** 📏"}, {"k": "q", "q": "This year's festival was even ____ than last year's.", "o": ["popular", "more popular", "most popular"], "a": 1, "ok": "맞아요! than → 비교급", "no": "뒤에 than이 있으니 비교급 → more popular"}, {"k": "m", "t": "비교급 강조는 **much, even, still, far, a lot** (very ✗) / **the 비교급 ~, the 비교급 …** '~할수록 더 …하다' / 비교급 than **any other + 단수명사** = 최상급 의미"}, {"k": "m", "t": "② **as ____ as**: 형용사냐 부사냐? → as ~ as를 **지우고** 문장을 봐요. be동사·감각동사의 보어 → **형용사** / 일반동사를 꾸밈 → **부사**"}, {"k": "ex", "en": "He spoke as calmly as possible. / The lake was as calm as a mirror.", "ko": "그는 가능한 한 차분하게 말했다. / 호수는 거울처럼 잔잔했다."}, {"k": "q", "q": "Please answer the questions as ____ as you can.", "o": ["honest", "honestly", "more honestly"], "a": 1, "ok": "정확해요! answer(동사)를 꾸밈 → honestly", "no": "as ~ as를 지우면 answer the questions honestly → 부사"}, {"k": "m", "t": "③ **비교 대상 병렬**: 비교하는 두 대상은 같은 종류! 앞 명사를 다시 받을 때 단수는 [that], 복수는 those → The population of Seoul is larger than that of Busan."}, {"k": "q", "q": "The ears of a rabbit are longer than ____ of a cat.", "o": ["that", "those", "it"], "a": 1, "ok": "맞아요! 복수 ears를 받음 → those", "no": "비교 대상은 '토끼의 귀(복수)' vs '고양이의 귀' → those"}, {"k": "m", "t": "⚠️ 형태도 맞추기: To give is better than [to] receive. / Walking is healthier than driving."}, {"k": "m", "t": "🎉 Unit 08 병렬·비교 끝! **짝 단서(than·as·the) / as ~ as는 지우고 판단 / 비교 대상은 that·those로 같은 종류끼리** 👍"}], "notes": {"table": [["포인트", "예"], ["than → 비교급", "This box is heavier than that one."], ["as ~ as → 원급", "She is as tall as her mother."], ["the 최상급 + in / of", "the oldest building in the city"], ["비교급 강조", "much / even / still / far / a lot + 비교급 (very ✗)"], ["the 비교급, the 비교급", "The more you read, the more you learn."], ["비교급 than any other + 단수명사", "He is taller than any other boy in his class."], ["as 형용사 as / as 부사 as", "It is as cheap as ~ / He ran as fast as ~"], ["비교 대상 병렬", "The climate of Jeju is milder than that of Seoul."]], "tips": ["as ~ as를 지우고 형용사·부사 결정", "단수 명사 → that / 복수 명사 → those", "to-v는 to-v와, v-ing는 v-ing와 비교"]}, "sets": {"workbook": [{"k": "pk", "q": "Health is more important [as/than*] wealth.", "e": "비교급 → than"}, {"k": "pk", "q": "This is the [larger/largest*] museum in the country.", "e": "the + in → 최상급"}, {"k": "pk", "q": "My new laptop is much [lighter*/lightest] than the old one.", "e": "much + 비교급 + than"}, {"k": "pk", "q": "He can't swim as [good/well*] as his sister.", "e": "swim(동사)을 꾸밈 → 부사 well"}, {"k": "pk", "q": "The weather in July is hotter than [that*/those] in May.", "e": "단수 weather → that"}, {"k": "pk", "q": "The [more*/most] you practice, the better you get.", "e": "the 비교급, the 비교급"}, {"k": "bl", "q": "그 산은 이 지역에서 가장 높다. → The mountain is the (highest|tallest) in this area.", "e": "최상급"}, {"k": "bl", "q": "그 시험은 내가 예상했던 것보다 훨씬 더 쉬웠다. → The test was (much|even|far|still|a lot) easier than I expected.", "e": "비교급 강조"}, {"k": "ox", "q": "The prices in this store are cheaper than those in the mall.", "a": true, "e": "✔ 복수 prices → those"}, {"k": "fx", "q": "She answered the question as quick as possible.", "w": "quick", "a": ["quickly"], "e": "answered(동사)를 꾸밈 → quickly"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nThis bag is ____ heavier than that one.", "o": ["much", "even", "far", "very", "still"], "a": 3, "e": "very는 비교급 강조 ✗"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The sooner you start, the earlier you'll finish.", "He is the most talented player on the team.", "My score was as high as yours.", "The climate of Jeju is milder than those of Seoul.", "This problem is far more difficult than that one."], "a": 3, "e": "④ 단수 climate → that"}, {"k": "pk", "q": "Her voice sounded as [sweet*/sweetly] as honey.", "e": "sounded의 보어 → 형용사 sweet"}, {"k": "pk", "q": "The cars made today are safer than [that/those*] made 30 years ago.", "e": "복수 cars → those"}, {"k": "pk", "q": "Of all the students, Jina studies the [harder/hardest*].", "e": "Of all ~ → 최상급"}, {"k": "pk", "q": "I think playing outside is better than [stay/staying*] indoors all day.", "e": "playing과 비교 → staying"}, {"k": "bl", "q": "그녀는 할 수 있는 한 열심히 일했다. → She worked as (hard) as she could.", "e": "worked를 꾸밈 → 부사 hard"}, {"k": "bl", "q": "날씨가 따뜻해질수록 더 많은 사람들이 밖에 나간다. → The warmer it gets, the (more) people go outside.", "e": "the 비교급, the 비교급"}, {"k": "fx", "q": "The number of cars in Seoul is larger than those in Daejeon.", "w": "those", "a": ["that"], "e": "단수 number → that"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nBicycles are becoming (A) [more / most] popular than ever. Riding a bike is cheaper than (B) [drive / driving], and it is as (C) [quick / quickly] as taking the bus in busy areas.", "o": ["more – driving – quick", "most – drive – quickly", "more – drive – quick", "more – driving – quickly", "most – driving – quick"], "a": 0, "e": "(A) than → 비교급 more (B) Riding과 비교 → driving (C) is의 보어 → 형용사 quick"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe brain of a dolphin is larger than (A) [that / those] of a human. Dolphins also learn as (B) [fast / faster] as chimpanzees. Some scientists think they are among the (C) [more / most] intelligent animals on Earth.", "o": ["those – fast – most", "that – faster – more", "that – fast – most", "those – faster – more", "that – fast – more"], "a": 2, "e": "(A) 단수 brain → that (B) as ~ as → 원급 fast (C) among the + 최상급 → most"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The more you read, the most you learn.\nⓑ This hotel is very better than the last one.\nⓒ She drives as careful as her father.\nⓓ The tail of a fox is longer than that of a dog.\nⓔ It was the worst day of my life.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 1, "e": "ⓓⓔ 옳음 / ⓐ the more / ⓑ much better / ⓒ drives를 꾸밈 → carefully"}, {"k": "fx", "q": "Learning online can be as effective as learn in a classroom.", "w": "learn", "a": ["learning"], "e": "Learning과 비교 → learning"}, {"k": "fx", "q": "Mt. Everest is higher than any other mountains in the world.", "w": "mountains", "a": ["mountain"], "e": "any other + 단수명사"}, {"k": "pk", "q": "Her explanation was [clearer*/more clearer] than the textbook's.", "e": "more + -er ✗ → clearer"}, {"k": "pk", "q": "Nothing is [as*/than] precious as time.", "e": "as ~ as"}, {"k": "wr", "q": "그 탑은 그 도시의 어떤 다른 건물보다 더 높다. (the tower, taller than, any other building in the city)", "a": ["The tower is taller than any other building in the city."], "e": "비교급 than any other + 단수명사"}, {"k": "wr", "q": "한국의 인구는 캐나다의 인구보다 더 많다. (the population of Korea, larger than, that of Canada)", "a": ["The population of Korea is larger than that of Canada.", "Korea's population is larger than that of Canada."], "e": "단수 population → that"}, {"k": "or", "q": "네가 더 많이 웃을수록, 너는 더 행복해질 것이다.", "a": "The more you smile, the happier you will be.", "e": "the 비교급, the 비교급"}, {"k": "ox", "q": "His painting is as good as that of a professional artist.", "a": true, "e": "✔ 단수 painting → that"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그녀는 그 노래를 듣고 춤추기 시작했다. — 과거시제 (listen to the song, start to dance)", "a": ["She listened to the song and started to dance.", "She listened to the song and started dancing.", "She listened to the song and began to dance.", "She listened to the song and began dancing."], "e": "listened와 started 병렬"}, {"k": "wr", "q": "나는 수영하는 것과 자전거 타는 것 둘 다 좋아한다. (both, swim, ride a bike)", "a": ["I like both swimming and riding a bike.", "I like both swimming and riding bikes.", "I love both swimming and riding a bike."], "e": "both A and B → v-ing 짝"}, {"k": "wr", "q": "이 휴대전화는 저것보다 훨씬 더 비싸다. (much, expensive, that one)", "a": ["This phone is much more expensive than that one.", "This cell phone is much more expensive than that one.", "This cellphone is much more expensive than that one."], "e": "much + 비교급"}, {"k": "wr", "q": "그는 가능한 한 빨리 달렸다. (as fast as possible)", "a": ["He ran as fast as possible.", "He ran as fast as he could."], "e": "as + 부사 + as"}, {"k": "wr", "q": "이 도시의 기후는 서울의 기후보다 더 따뜻하다. (the climate of this city, warmer, that of Seoul)", "a": ["The climate of this city is warmer than that of Seoul.", "The climate of this city is milder than that of Seoul."], "e": "단수 climate → that"}, {"k": "bl", "q": "The more you practice, the (better) you will play. (더 잘)", "e": "the 비교급, the 비교급"}, {"k": "bl", "q": "He likes to sing songs and (play) the guitar. (기타를 치는 것)", "e": "to sing과 병렬 → (to) play"}, {"k": "fx", "q": "She cleaned her room, did the laundry, and cooks dinner.", "w": "cooks", "a": ["cooked"], "e": "cleaned, did와 병렬 → cooked"}, {"k": "fx", "q": "The streets of Paris are more beautiful than that of my city.", "w": "that", "a": ["those"], "e": "복수 streets → those"}, {"k": "or", "q": "그 영화는 길었지만 재미있었다.", "a": "The movie was long but interesting.", "e": "형용사 병렬"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nOn weekends, I usually stay home and ____ books.", "o": ["reading", "read", "to reading", "reads", "have read"], "a": 1, "e": "stay와 병렬 → read"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nThe salary of a doctor is higher than ____ of a teacher.", "o": ["it", "this", "that", "those", "them"], "a": 2, "e": "단수 salary → that"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He is as taller as his father.", "I prefer walking to drive.", "The more careful you are, the fewer mistakes you make.", "This is the more expensive car in the shop.", "She came in, sat down, and opening her book."], "a": 2, "e": "③ the 비교급, the 비교급 / ① tall ② driving ④ most ⑤ opened"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy sister enjoys painting, (A) [to write / writing] stories, and playing the piano. She paints as (B) [beautiful / beautifully] as a professional, and her pictures are often more creative than (C) [that / those] of older students.", "o": ["writing – beautiful – those", "to write – beautifully – that", "writing – beautifully – that", "writing – beautifully – those", "to write – beautiful – those"], , "a": ["I came home, took a shower, and went to bed.", "I came home, took a shower and went to bed."], "e": "과거 동사 셋 병렬"}]}}, {"book": "eos", "chapter": {"id": "09", "name": "네모·형용사/부사, 전치사/접속사", "title": "어법끝 START · PART 1 네모 어법 · Unit 09 형용사/부사, 전치사/접속사"}, "units": [{"tag": "eos-1-P21", "name": "형용사와 부사 역할을 구별하라!", "talk": [{"k": "m", "t": "네모 안에 형용사 / 부사(-ly)! **어떤 자리인지, 무엇을 꾸미는지** 확인해요 🧭"}, {"k": "m", "t": "형용사 = 명사 수식 · **보어** / 부사 = 동사 · 형용사 · 다른 부사 · 문장 전체 수식"}, {"k": "q", "q": "The new system works ____.", "o": ["efficient", "efficiently", "efficiency"], "a": 1, "ok": "맞아요! works(동사)를 꾸밈 → 부사", "no": "works는 1형식 동사, 보어가 아니라 수식어 자리 → efficiently"}, {"k": "m", "t": "전략: 네모를 **빼 봐요**. 빼도 문장이 완전하면 → 수식어(**부사**) / 빼면 불완전(보어 자리) → **형용사**"}, {"k": "m", "t": "형용사를 보어로 취하는 동사: become, get, grow, turn, remain, stay, keep, seem, appear, prove + 감각동사 look, sound, feel, smell, taste → She looks [calm]."}, {"k": "q", "q": "The soup tastes ____.", "o": ["strange", "strangely", "strangeness"], "a": 0, "ok": "정확해요! 감각동사 + 형용사", "no": "taste는 감각동사 → 보어 자리 형용사 strange"}, {"k": "m", "t": "5형식 목적격보어도 형용사 → The news made her **happy**. / Keep your room **clean**."}, {"k": "m", "t": "뜻이 다른 부사 쌍: hard(열심히) – hardly(거의 ~않다) / late(늦게) – lately(최근에) / high(높이) – highly(매우) / near(가까이) – nearly(거의) / close(가까이) – closely(면밀히) / most(가장) – mostly(주로)"}, {"k": "ex", "en": "He works hard, but he hardly gets any rest.", "ko": "그는 열심히 일하지만, 거의 쉬지 못한다."}, {"k": "m", "t": "정리! **빼서 불완전하면 형용사(보어) / 완전하면 부사 / 감각동사·become·keep·find 뒤는 형용사 / -ly가 붙으면 뜻이 바뀌는 부사 주의** 👍"}], "notes": {"table": [["자리", "형용사", "부사"], ["명사 수식", "a careful driver", "—"], ["주격보어", "He seems careful.", "—"], ["목적격보어", "Keep the door open.", "—"], ["동사 수식", "—", "He drives carefully."], ["형용사·부사 수식", "—", "extremely hot / very quickly"], ["문장 수식", "—", "Luckily, no one was hurt."]], "tips": ["감각동사 look, sound, feel, smell, taste + 형용사", "become, remain, stay, keep, seem, prove + 형용사", "hard·late·high·near·close는 형용사이자 부 ile the movie.", "w": "while", "a": ["during"], "e": "뒤가 명사 → during"}, {"k": "fx", "q": "She's not used to drive on the left side of the road.", "w": "drive", "a": ["driving"], "e": "be used to + v-ing"}, {"k": "pk", "q": "The two cars look [like/alike*], but one is much faster.", "e": "보어, 뒤에 명사 없음 → alike"}, {"k": "pk", "q": "He passed the exam [despite*/although] having little time to study.", "e": "뒤가 v-ing구 → 전치사"}, {"k": "wr", "q": "나는 너를 곧 보기를 고대한다. (look forward to, see you soon)", "a": ["I look forward to seeing you soon.", "I am looking forward to seeing you soon."], "e": "look forward to + v-ing"}, {"k": "wr", "q": "그 교통 체증 때문에 우리는 늦었다. (because of, the traffic jam, be late) — 과거시제", "a": ["We were late because of the traffic jam.", "Because of the traffic jam, we were late.", "Because of the traffic jam we were late."], "e": "because of + 명사"}, {"k": "or", "q": "그녀는 아이처럼 웃었다.", "a": "She laughed like a child.", "e": "like + 명사"}, {"k": "ox", "q": "Despite being injured, he finished the race.", "a": true, "e": "✔ despite + v-ing"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그 계획은 완벽하게 들렸다. (the plan, sound, perfect)", "a": ["The plan sounded perfect."], "e": "감각동사 + 형용사"}, {"k": "wr", "q": "그녀는 그 문제를 쉽게 풀었다. (solve the problem, easy)", "a": ["She solved the problem easily.", "She easily solved the problem."], "e": "동사 수식 → 부사"}, {"k": "wr", "q": "비에도 불구하고, 그들은 축구를 했다. (despite, the rain, play soccer)", "a": ["Despite the rain, they played soccer.", "They played soccer despite the rain.", "Despite the rain they played soccer."], "e": "despite + 명사"}, {"k": "wr", "q": "그는 일찍 일어나는 것에 익숙하다. (be used to, get up early)", "a": ["He is used to getting up early.", "He's used to getting up early."], "e": "be used to + v-ing"}, {"k": "wr", "q": "그 쌍둥이는 똑같이 생겼다. (the twins, look, alike)", "a": ["The twins look alike."], "e": "보어 alike"}, {"k": "bl", "q": "I could (hardly) hear him because of the noise. (거의 ~할 수 없었다)", "e": "hardly"}, {"k": "bl", "q": "The phone rang (while) I was taking a shower. (~하는 동안)", "e": "뒤가 절 → while"}, {"k": "fx", "q": "The baby is sleeping peaceful in the crib.", "w": "peaceful", "a": ["peacefully"], "e": "동사 수식 → 부사"}, {"k": "fx", "q": "We canceled the trip because the bad weather.", "w": "because", "a": ["because of", "due to"], "e": "뒤가 명사구 → because of"}, {"k": "or", "q": "그 수프는 짠맛이 났다.", "a": "The soup tasted salty.", "e": "감각동사 + 형용사"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe cookies smell ____.", "o": ["wonderful", "wonderfully", "wonder", "wonders", "to wonder"], "a": 0, "e": "감각동사 + 형용사"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\n____ his hard work, he didn't get a promotion.", "o": ["Although", "Because", "Despite", "While", "Since"], "a": 2, "e": "뒤가 명사구 + 양보 → Despite"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["She has been working hard lately.", "The tickets were nearly sold out.", "He felt sadly after hearing the news.", "I'm looking forward to visiting Paris.", "The two sisters dress alike."], "a": 2, "e": "③ feel + 형용사 → sad"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) [During / While] my stay in Rome, I tried pasta every day. The pasta tasted (B) [amazing / amazingly], and the people were (C) [real / really] kind.", "o": ["During – amazing – real", "While – amazingly – really", "During – amazingly – real", "While – amazing – real", "During – amazing – really"], "a": 4, "e": "(A) 뒤가 명사구 → During (B) taste + 형용사 (C) 형용사 kind를 꾸밈 → really"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The teacher spoke slowly and clearly.\nⓑ We stayed home because of it was raining.\nⓒ He objected to changing the plan.\nⓓ This bag is like mine.\nⓔ The flowers look beautifully in spring.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ because / ⓔ beautiful"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe arrived ____ for the meeting.\nHave you seen any good movies ____?", "o": ["late – lately", "lately – late", "late – late", "lately – lately", "later – late"], "a": 0, "e": "늦게 → late / 최근에 → lately"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["Despite she was sick, she came to class.", "He is used to work at night.", "The question was surprisingly easy.", "The baby looked alike an angel.", "I could hard believe the news."], "a": 2, "e": "③ 형용사 easy를 꾸밈 → 부사 / ① Although ② working ④ like ⑤ hardly"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe two buildings look (A) [like / alike], but they were built for different purposes. (B) [While / During] one is a hotel, the other is a hospital. Both are (C) [high / highly] valued by the city.", "o": ["alike – While – highly", "like – During – high", "alike – During – highly", "like – While – highly", "alike – While – high"], "a": 0, "e": "(A) 보어 → alike (B) 뒤가 절 → While (C) 매우 → highly"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nWhen it comes to ____ a presentation, nobody is better than Jina.", "o": ["give", "giving", "gave", "given", "gives"], "a": 1, "e": "when it comes to + v-ing"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nShe stayed calm ____ the difficult situation.", "o": ["despite", "in spite of", "during", "though", "in"], "a": 3, "e": "though는 접속사 → 명사구 앞 ✗"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그는 그의 아버지를 닮았다.", "o": ["He looks alike his father.", "He looks like his father.", "He looks his father alike.", "He alike looks his father.", "He is like alike his father."], "a": 1, "e": "뒤에 명사 → like"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The soup smells delicious.", true], ["He drove carefully in the snow.", true], ["She looked angrily at me.", true], ["Because of the traffic, we were late.", true], ["I was nearly late for school.", true], ["Although the rain, they went out.", false], ["He hardly studies, so his grades are low.", true], ["The milk turned sourly.", false], ["I look forward to hear from you.", false], ["During I was in Paris, I met him.", false], ["The two boys think alike.", true], ["She sings like an angel.", true]], "e": "ⓕ Despite ⓗ sour ⓘ hearing ⓙ While (ⓒ look at을 꾸미는 부사 angrily는 옳음)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["He seemed nervous before the test.", true], ["She worked hardly all day.", false], ["The movie was incredibly long.", true], ["Despite being tired, he kept running.", true], ["I'm used to living in the city.", true], ["The cookies taste sweetly.", false], ["While the vacation, we went camping.", false], ["They look like each other.", true], ["Keep your hands warm.", true], ["She contributed to raise money for the school.", false], ["He stood close to the door.", true], ["Unfortunately, I missed the bus.", true]], "e": "ⓑ hard ⓕ sweet ⓖ During ⓙ raising"}, {"k": "wr", "q": "그녀는 피곤했지만 숙제를 끝냈다. (although, tired, finish her homework)", "a": ["Although she was tired, she finished her homework.", "She finished her homework although she was tired.", "Although she was tired she finished her homework."], "e": "although + 절"}, {"k": "wr", "q": "그 소식은 이상하게 들렸다. (the news, sound, strange)", "a": ["The news sounded strange."], "e": "감각동사 + 형용사"}]}}, {"book": "eos", "chapter": {"id": "10", "name": "네모·접속사/관계사", "title": "어법끝 START · PART 1 네모 어법 · Unit 10 접속사와 관계사"}, "units": [{"tag": "eos-1-P23", "name": "접속사, 관계대명사, 관계부사의 역할을 구별하라!", "talk": [{"k": "m", "t": "Unit 10은 네모 어법의 끝판왕! that / what / which / where … 를 고르는 기준은 두 가지: **앞에 선행사가 있나?** + **뒤가 완전한 절인가?** 🧩"}, {"k": "m", "t": "① **that vs. what** (명사절): 뒤가 **완전**한 절 → 접속사 [that] / 뒤가 **불완전**(주어·목적어가 빠짐) → [what] (= the thing which) → I believe that he is honest. / I believe what he said."}, {"k": "q", "q": "____ surprised me most was his calm attitude.", "o": ["That", "What", "Which"], "a": 1, "ok": "맞아요! 선행사 없음 + 뒤에 주어가 빠짐 → What", "no": "surprised의 주어가 없어요(불완전) + 앞에 선행사 없음 → What"}, {"k": "m", "t": "② 앞에 **선행사**가 있으면 관계대명사 that / which / who, 없으면 what → the book that I bought (the book what ✗) / ③ **콤마 뒤** 보충 설명(계속적 용법)엔 **that ✗** → who / which. **, which**는 앞 문장 전체도 받아요 → He passed the test, which surprised everyone."}, {"k": "q", "q": "My uncle, ____ lives in Canada, is visiting us.", "o": ["that", "who", "what"], "a": 1, "ok": "정확해요! 콤마 뒤 사람 → who", "no": "콤마(,) 뒤 계속적 용법엔 that을 못 써요 → who"}, {"k": "m", "t": "④ **격과 선행사**: 사람 → who(m), 사물 → which, 뒤에 **명사가 바로 오고 완전한 절**이면 소유격 [whose] → a girl whose father is a pilot"}, {"k": "m", "t": "⑤ **관계대명사 vs. 대명사**: 접속사 없이 절이 두 개면 대명사 ✗ → I have two sisters, both of [whom] are nurses. (both of them ✗ — 두 절을 이어 줄 말이 없음)"}, {"k": "m", "t": "⑥ **관계대명사 vs. 관계부사**: 뒤가 **불완전** → which / that / 뒤가 **완전** → where · when · why 또는 **전치사 + which** → the town where I grew up = the town in which I grew up"}, {"k": "q", "q": "This is the house ____ my grandfather built.", "o": ["which", "where", "what"], "a": 0, "ok": "맞아요! built의 목적어가 빠짐(불완전) → which", "no": "my grandfather built ___ → 목적어가 없어요 → 관계대명사 which (where ✗)"}, {"k": "m", "t": "🎉 Unit 10 끝 — PART 1 네모 어법 완주! **선행사 있나? → 없으면 what / 뒤가 완전한가? → 완전하면 that·관계부사 / 콤마 뒤 that ✗ / 접속사 없이 them ✗** 👍"}], "notes": {"table": [["선행사", "뒤 절", "정답"], ["없음", "완전", "접속사 that (명사절)"], ["없음", "불완전", "what"], ["있음", "불완전 (주어·목적어 빠짐)", "관계대명사 who / which / that"], ["있음", "명사 + 완전한 절", "소유격 whose"], ["있음 (장소·시간·이유)", "완전", "관계부사 where / when / why = 전치사 + which"], ["콤마 뒤", "불완전", "who / which (that ✗)"], ["수량 표현 + of", "접속사 없음", "both of whom / many of which (them ✗)"]], "tips": ["the fact / news / idea + that + 완전한 절 (동격)", "전치사 + that ✗ / 전치사 + what ✗ → 전치사 + which / whom", "the reason why, the day when, the place where"]}, "sets": {"workbook": [{"k": "pk", "q": "I can't believe [that*/what] she won the race.", "e": "선행사 없음 + 완전한 절 → that"}, {"k": "pk", "q": "[That/What*] I need right now is a cup of coffee.", "e": "need의 목적어가 빠짐 → What"}, {"k": "pk", "q": "This is the phone [that*/what] I bought last week.", "e": "선행사 the phone → that"}, {"k": "pk", "q": "My sister, [who*/that] works at a bank, helped me open an account.", "e": "콤마 뒤 → who"}, {"k": "pk", "q": "I met a boy [who/whose*] mother is a famous actress.", "e": "명사 mother + 완전한 절 → whose"}, {"k": "pk", "q": "This is the café [which/where*] we first met.", "e": "we first met은 완전한 절 → where"}, {"k": "bl", "q": "그가 말한 것은 사실이 아니었다. → (What) he said was not true.", "e": "선행사 없음 + 불완전 → What"}, {"k": "bl", "q": "나는 나무가 많은 마을에 산다. → I live in a town (where) there are many trees.", "e": "완전한 절 → 관계부사 where"}, {"k": "ox", "q": "I have two brothers, both of them are doctors.", "a": false, "e": "접속사 없이 절 두 개 → both of whom"}, {"k": "fx", "q": "He told me that he wanted for his birthday.", "w": "that", "a": ["what"], "e": "wanted의 목적어가 빠짐 → what"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe problem is ____ we don't have enough time.", "o": ["what", "which", "that", "who", "where"], "a": 2, "e": "보어 자리 명사절 + 완전한 절 → that"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The house that we bought is old.", "What matters most is your health.", "Jake, who is my best friend, moved to Busan.", "I know a man whose son plays for the national team.", "This is the restaurant what I told you about."], "a": 4, "e": "⑤ 선행사 the restaurant → that / which"}, {"k": "pk", "q": "She finally found the key [which*/where] she had lost.", "e": "lost의 목적어가 빠짐 → which"}, {"k": "pk", "q": "He failed the exam, [which*/that] disappointed his parents.", "e": "콤마 뒤 + 앞 문장 전체 → which"}, {"k": "pk", "q": "I remember the day [which/when*] I first went to school.", "e": "완전한 절 + 시간 → when"}, {"k": "pk", "q": "There are 30 students in my class, most of [them/whom*] like K-pop.", "e": "접속사 없음 → whom"}, {"k": "bl", "q": "이곳이 내가 태어난 도시이다. → This is the city (where) I was born.", "e": "완전한 절 → where"}, {"k": "bl", "q": "그녀는 표지가 빨간 책을 샀다. → She bought a book (whose) cover is red.", "e": "명사 cover + 완전한 절 → whose"}, {"k": "fx", "q": "The hotel which we stayed was very clean.", "w": "which", "a": ["where", "at which", "in which"], "e": "we stayed는 완전한 절 → where"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe museum (A) [that / what] I visited last week was amazing. (B) [That / What] impressed me most was a painting (C) [which / whose] colors changed with the light.", "o": ["what – That – which", "that – What – whose", "that – That – whose", "what – What – which", "that – What – which"], "a": 1, "e": "(A) 선행사 the museum → that (B) 선행사 없음 + 주어 빠짐 → What (C) 명사 colors + 완전한 절 → whose"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nVenice is a city (A) [which / where] people travel by boat. It has many old buildings, (B) [many of which / many of them] are over 500 years old. Many visitors say (C) [that / what] it is the most romantic city in the world.", "o": ["which – many of them – what", "where – many of which – what", "where – many of them – that", "where – many of which – that", "which – many of which – that"], "a": 3, "e": "(A) 완전한 절 → where (B) 접속사 없음 → many of which (C) 완전한 절 → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ This is the reason why I was late.\nⓑ I bought a bag, that was very expensive.\nⓒ The man whom I met yesterday is a writer.\nⓓ She showed me what she had made.\nⓔ The place which we had lunch was crowded.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ 콤마 뒤 → which / ⓔ 완전한 절 → where"}, {"k": "fx", "q": "I have a friend who father is a pilot.", "w": "who", "a": ["whose"], "e": "명사 father + 완전한 절 → whose"}, {"k": "fx", "q": "The village which my grandparents live is very quiet.", "w": "which", "a": ["where", "in which"], "e": "완전한 절 → where"}, {"k": "pk", "q": "The fact [that*/what] he lied to me made me angry.", "e": "the fact + 완전한 절(동격) → that"}, {"k": "pk", "q": "He has three sons, all of [whom*/them] are tall.", "e": "접속사 없음 → whom"}, {"k": "wr", "q": "그녀가 어제 산 것은 비쌌다. (what, buy, yesterday, expensive)", "a": ["What she bought yesterday was expensive."], "e": "what = the thing which"}, {"k": "wr", "q": "나는 Tom을 만났는데, 그는 나에게 길을 알려 주었다. — 계속적 용법 (who, show me the way)", "a": ["I met Tom, who showed me the way."], "e": ", who"}, {"k": "or", "q": "이곳이 그 사고가 일어난 장소이다.", "a": "This is the place where the accident happened.", "e": "완전한 절 → where"}, {"k": "ox", "q": "Tell me the reason for which you left early.", "a": true, "e": "✔ for which = why"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "나는 그가 정직하다는 것을 안다. (know, that, honest)", "a": ["I know that he is honest.", "I know he is honest."], "e": "접속사 that + 완전한 절"}, {"k": "wr", "q": "내가 원하는 것은 약간의 휴식이다. (what, want, some rest)", "a": ["What I want is some rest."], "e": "what = the thing which"}, {"k": "wr", "q": "나는 아버지가 의사인 친구가 있다. (a friend, whose, father, a doctor)", "a": ["I have a friend whose father is a doctor."], "e": "whose + 명사"}, {"k": "wr", "q": "이곳은 내가 자란 마을이다. (the village, where, grow up)", "a": ["This is the village where I grew up."], "e": "관계부사 where"}, {"k": "wr", "q": "그는 그 경기에서 이겼는데, 그것은 모두를 놀라게 했다. (win the game, which, surprise everyone)", "a": ["He won the game, which surprised everyone."], "e": ", which = 앞 문장 전체"}, {"k": "bl", "q": "I have many books, most of (which) are novels. (그중 대부분)", "e": "접속사 없음 → which"}, {"k": "bl", "q": "Tell me (what) you saw last night. (네가 본 것)", "e": "선행사 없음 + 불완전 → what"}, {"k": "fx", "q": "The girl, that is wearing a red dress, is my cousin.", "w": "that", "a": ["who"], "e": "콤마 뒤 → who"}, {"k": "fx", "q": "I remember the day which we first met.", "w": "which", "a": ["when", "on which"], "e": "완전한 절 → when"}, {"k": "or", "q": "그가 말한 것은 모두 사실이었다.", "a": "What he said was all true.", "e": "what"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은?\n____ you need is a good night's sleep.", "o": ["That", "What", "Which", "Who", "Where"], "a": 1, "e": "선행사 없음 + need의 목적어가 빠짐 → What"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nIt is clear ____ he made a mistake.", "o": ["what", "which", "that", "who", "whose"], "a": 2, "e": "진주어 명사절 + 완전한 절 → that"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nThis is the hospital ____ I was born.", "o": ["which", "what", "that", "where", "whose"], "a": 3, "e": "완전한 절 → where"},
