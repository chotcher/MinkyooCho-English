", "The man standing by the doors look tired.", "Whether he will come is still unclear."], "a": 3, "e": "④ 주어 man(단수) → looks"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe idea that robots ①will replace teachers ②seem unrealistic to many people ③who ④work in ⑤schools.", "o": ["will replace", "seem", "who", "work", "schools"], "a": 1, "e": "주어 The idea(단수) → seems / ④ 선행사 people → work ✔"}, {"k": "fx", "q": "On the top shelf was three old photo albums.", "w": "was", "a": ["were"], "e": "장소 부사구 도치 → 주어 albums(복수) → were"}, {"k": "fx", "q": "The cost of the new phones are higher than I expected.", "w": "are", "a": ["is"], "e": "주어 cost(단수) → is"}, {"k": "fx", "q": "A lot of the information on these websites are not true.", "w": "are", "a": ["is"], "e": "a lot of + information(셀 수 없음) → is"}, {"k": "pk", "q": "One of the biggest problems in this city [is*/are] traffic.", "e": "one of + 복수 → 주어 one → is"}, {"k": "pk", "q": "The volunteers, along with their leader, [were*/was] thanked by the mayor.", "e": "A along with B → A(volunteers)에 맞춤"}, {"k": "ox", "q": "Two-thirds of the students in my class walk to school.", "a": true, "e": "분수 + of + students(복수) → walk ✔"}, {"k": "ox", "q": "The book that my friends recommended to me were boring.", "a": false, "e": "주어 book(단수) → was"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nScientists say that the amount of plastic ①that ②ends up in the ocean ③are growing every year, and most of it ④comes from land, not from ships ⑤that sail the seas.", "o": ["that", "ends", "are", "comes", "that"], "a": 2, "e": "that절 주어 the amount(단수) → is growing"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The number of people who use paper maps is falling.\nⓑ Behind the curtain was hidden two small boxes.\nⓒ What you need most right now is some rest.\nⓓ Every student and teacher were invited to the party.\nⓔ The furniture in these rooms looks expensive.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ 도치 주어 boxes → were / ⓓ every A and B → 단수 was"}, {"k": "fx", "q": "The man who lives next to the two girls teach math at my school.", "w": "teach", "a": ["teaches"], "e": "주어 man(단수) → teaches"}, {"k": "fx", "q": "Taking care of three dogs require a lot of time and energy.", "w": "require", "a": ["requires"], "e": "동명사구 주어 → 단수 requires"}, {"k": "fx", "q": "The pictures on the wall of the classroom, which the students drew last year, was taken down yesterday.", "w": "was", "a": ["were"], "e": "주어 pictures(복수) → were"}, {"k": "wr", "q": "그 영화를 본 사람들의 수가 백만 명을 넘었다. (the number of, who saw the movie, has passed, one million)", "a": ["The number of people who saw the movie has passed one million.", "The number of people who saw the movie has passed 1 million.", "The number of people who saw the movie has passed 1,000,000."], "e": "the number of → 단수 has"}, {"k": "or", "q": "그 상자 안의 사과들 중 절반이 썩었다.", "a": "Half of the apples in the box are rotten.", "e": "half of + apples(복수) → are"}, {"k": "pk", "q": "Not only the students but also the teacher [was*/were] surprised by the news.", "e": "not only A but also B → B(teacher)에 맞춤"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nAmong the many things ①that ②make this town special ③is its old market, ④which ⑤have been open since 1950.", "o": ["that", "make", "is", "which", "have"], "a": 4, "e": "which의 선행사 market(단수) → has / ③ 도치 주어 market → is ✔"}, {"k": "ox", "q": "Neither my parents nor my sister knows about the surprise party.", "a": true, "e": "neither A nor B → B(sister)에 맞춤 ✔"}]}}, {"tag": "eos-2-U01-P2", "name": "시제", "talk": [{"k": "m", "t": "밑줄 동사 두 번째 체크는 **시제**! 문장 안의 **시간 단서**를 먼저 찾아요 ⏰"}, {"k": "m", "t": "① 명백한 과거 표시어(yesterday, ago, last ~, in 2010, 의문사 when)는 현재완료와 함께 못 써요 → 단순 과거: I [lost] my key two days ago."}, {"k": "q", "q": "She ____ the report three days ago.", "o": ["has finished", "finished", "had finished"], "a": 1, "ok": "맞아요! ago → 단순 과거", "no": "three days ago는 과거 표시어 → finished"}, {"k": "m", "t": "② since + 과거 시점 / for + 기간(지금까지) → **현재완료**: I have [known] her since 2018."}, {"k": "m", "t": "③ 시간·조건 부사절(when, if, before, after, until, as soon as, unless)은 미래라도 **현재**: If it [rains] tomorrow, we'll stay home."}, {"k": "q", "q": "I'll call you as soon as I ____ the results.", "o": ["will get", "get", "got"], "a": 1, "ok": "정확해요! 시간 부사절 → 현재", "no": "as soon as 부사절은 미래 대신 현재 → get"}, {"k": "m", "t": "⚠️ 단, know·wonder·ask 뒤의 **명사절** if·when은 미래면 will을 그대로 써요: I wonder if he will come."}, {"k": "m", "t": "④ 과거의 어느 때보다 **더 이전** → **had p.p.(과거완료)**: When I arrived, the bus had already left."}, {"k": "q", "q": "He realized that he ____ his wallet at home.", "o": ["has left", "had left", "leaves"], "a": 1, "ok": "맞아요! 깨달은 것보다 두고 온 게 먼저", "no": "과거(realized)보다 이전 → had left"}, {"k": "m", "t": "⑤ 주절이 과거면 that절도 과거·과거완료(시제 일치). 단, **불변의 진리·과학 사실**은 늘 현재!"}, {"k": "m", "t": "정리! **과거 표시어 → 과거 / since·for → 현재완료 / 시간·조건절 → 현재 / 더 이전 → had p.p.** 👍"}], "notes": {"table": [["시간 단서", "시제", "예"], ["yesterday, ago, last ~, in + 과거 연도, when ~?", "단순 과거 (현재완료 ✗)", "I met him two years ago."], ["since + 과거 시점, for + 기간", "현재완료", "She has lived here since 2015."], ["시간·조건 부사절 (when, if, until, as soon as)", "현재 (미래 대신)", "Wait here until I come back."], ["명사절 if·when (know, wonder, ask 뒤)", "미래면 will", "I don't know when he will arrive."], ["과거보다 더 이전", "had p.p.", "The game had started when we got there."], ["by the time + 현재 (미래)", "will have p.p.", "By the time you come, I will have left."]], "tips": ["밑줄 친 현재완료 → 문장에 ago·yesterday·last가 있는지 확인", "불변의 진리·과학 사실은 주절이 과거여도 현재", "역사적 사실은 언제나 과거"]}, "sets": {"workbook": [{"k": "pk", "q": "I [lost*/have lost] my umbrella two days ago.", "e": "ago → 단순 과거"}, {"k": "pk", "q": "She [has lived*/lived] in Busan since she was ten.", "e": "since → 현재완료"}, {"k": "pk", "q": "If it [rains*/will rain] tomorrow, the game will be canceled.", "e": "조건 부사절 → 현재"}, {"k": "pk", "q": "I'm not sure if it [will snow*/snows] tomorrow.", "e": "명사절(sure의 내용) → 미래는 will"}, {"k": "fx", "q": "We have visited the museum last Sunday.", "w": "have", "a": ["(삭제)"], "e": "last Sunday → 단순 과거 visited"}, {"k": "fx", "q": "By the time we arrived at the station, the train has already left.", "w": "has", "a": ["had"], "e": "도착(과거)보다 이전 → had left"}, {"k": "fx", "q": "I'll call you as soon as I will get home.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → 현재 get"}, {"k": "ox", "q": "The teacher said that the earth goes around the sun.", "a": true, "e": "과학 사실 → 현재 ✔"}, {"k": "ox", "q": "My grandfather has died in 2015.", "a": false, "e": "in 2015 → died"}, {"k": "bl", "q": "그는 3년 동안 기타를 쳐 왔다. → He (has played|has been playing) the guitar for three years.", "e": "for + 기간 → 현재완료"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nWhen I ①got to the theater, the movie ②has already started, so I ③missed the first scene, which ④was the most ⑤exciting part.", "o": ["got", "has", "missed", "was", "exciting"], "a": 1, "e": "도착(과거)보다 이전 → had already started"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["She has been sick since last Monday.", "I will tell him the news when he comes back.", "Columbus discovered America in 1492.", "I have met him in Paris three years ago.", "He told me that he had lost his wallet."], "a": 3, "e": "④ ago → met"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy brother ①has wanted a dog ②for years, and last month my parents finally ③have agreed ④to get one ⑤for him.", "o": ["has wanted", "for", "have agreed", "to get", "for"], "a": 2, "e": "last month → agreed"}, {"k": "fx", "q": "If you will need any help, just call me.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → 현재 need"}, {"k": "fx", "q": "The concert had already started when we arrive.", "w": "arrive", "a": ["arrived"], "e": "과거 사건 → arrived (그보다 이전이 had started)"}, {"k": "fx", "q": "I have known Jimin since we are in elementary school.", "w": "are", "a": ["were"], "e": "since + 과거 시점 → were"}, {"k": "pk", "q": "He [has been*/was] absent from school since last Friday.", "e": "since → 현재완료"}, {"k": "pk", "q": "Let's wait here until the rain [stops*/will stop].", "e": "시간 부사절 → 현재"}, {"k": "ox", "q": "By the time she graduates, she will have saved enough money.", "a": true, "e": "by the time + 현재 → 미래완료 ✔"}, {"k": "ox", "q": "I lost the key that my mom has given me the day before.", "a": false, "e": "잃어버린 것보다 이전 → had given"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nLast summer, my family ①visited Gyeongju, a city that ②has been the capital of Silla for nearly 1,000 years. We ③stayed in a traditional house, and the owner ④told us that the house ⑤had been built about 100 years earlier.", "o": ["visited", "has been", "stayed", "told", "had been built"], "a": 1, "e": "신라의 수도였던 것은 지난 역사 → was"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have been to London twice.\nⓑ When have you arrived in Seoul?\nⓒ We will go hiking unless it rains tomorrow.\nⓓ She had never seen snow before she moved to Canada.\nⓔ He has bought a new car last week.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ 의문사 when → did you arrive / ⓔ last week → bought"}, {"k": "fx", "q": "I had lived in Daegu before I move to Seoul in 2020.", "w": "move", "a": ["moved"], "e": "in 2020 → moved"}, {"k": "fx", "q": "He didn't tell me that he has quit his job a month before.", "w": "has", "a": ["had"], "e": "말한 것(과거)보다 이전 → had quit"}, {"k": "fx", "q": "My teacher told us that light traveled faster than sound.", "w": "traveled", "a": ["travels"], "e": "과학 사실 → 현재 travels"}, {"k": "wr", "q": "그녀는 어렸을 때부터 피아노를 쳐 왔다. (has played, since, was young)", "a": ["She has played the piano since she was young.", "She has been playing the piano since she was young."], "e": "since + 과거 시점 → 현재완료"}, {"k": "or", "q": "내가 집에 도착했을 때 남동생은 이미 저녁을 먹었었다.", "a": "When I got home, my brother had already eaten dinner.", "e": "과거보다 이전 → had eaten"}, {"k": "pk", "q": "Do you remember when we first [met*/have met]?", "e": "의문사 when → 단순 과거"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nIf he ①will apologize to her tomorrow, she ②will forgive him, because she ③has always ④been a kind person ⑤who rarely holds grudges.", "o": ["will apologize", "will forgive", "has", "been", "who"], "a": 0, "e": "조건 부사절 → apologizes"}, {"k": "ox", "q": "Ten years have passed since we first met.", "a": true, "e": "since + 과거 → 현재완료 ✔"}]}}, {"tag": "eos-2-U01-P3", "name": "조동사와 법", "talk": [{"k": "m", "t": "밑줄이 **조동사 뒤**나 **if절 동사**에 있으면? 조동사 형태와 가정법을 점검해요 🧩"}, {"k": "m", "t": "① 조동사 뒤는 **동사원형**. 과거 일에 대한 추측·후회는 **조동사 + have p.p.**"}, {"k": "m", "t": "must have p.p. ~했음에 틀림없다 / can't have p.p. ~했을 리 없다 / should have p.p. ~했어야 했는데 / may have p.p. ~했을지도 모른다"}, {"k": "q", "q": "I failed the test. I ____ harder.", "o": ["should study", "should have studied", "must have studied"], "a": 1, "ok": "맞아요! 과거 후회 → should have p.p.", "no": "'더 열심히 했어야 했는데' → should have studied"}, {"k": "m", "t": "② 주장·요구·제안·명령 동사(insist, suggest, demand, recommend, order) + that절이 '~해야 한다'는 뜻이면 **(should) + 동사원형**: He suggested that we [leave] early."}, {"k": "q", "q": "The coach demanded that every player ____ on time.", "o": ["arrive", "arrives", "arrived"], "a": 0, "ok": "정확해요! 요구 → (should) 원형", "no": "demand + that + (should) 원형 → arrive"}, {"k": "m", "t": "⚠️ insist·suggest가 '사실'을 주장·암시하면 시제 그대로: He insisted that he had paid the bill. (그는 돈을 냈다고 주장했다)"}, {"k": "m", "t": "③ 가정법 짝 맞추기: If + 과거, would + 원형 (현재 반대) / If + had p.p., would have p.p. (과거 반대) → If I [were] you, I would wait."}, {"k": "q", "q": "If she had left earlier, she ____ the bus.", "o": ["would catch", "would have caught", "will catch"], "a": 1, "ok": "맞아요! 과거 반대 → would have p.p.", "no": "if절이 had p.p. → 주절 would have caught"}, {"k": "m", "t": "④ I wish + 과거(현재 소망) / had p.p.(과거 소망), as if + 과거 / had p.p. / used to + 원형(~하곤 했다) vs be used to + -ing(~에 익숙하다)"}, {"k": "m", "t": "정리! **조동사 + 원형 / 과거 추측·후회 = 조동사 + have p.p. / 당위 that절 = (should) 원형 / 가정법 시제 짝** 👍"}], "notes": {"table": [["형태", "뜻", "예"], ["must have p.p.", "~했음에 틀림없다", "He must have missed the bus."], ["can't have p.p.", "~했을 리 없다", "She can't have said that."], ["should have p.p.", "~했어야 했는데 (안 했다)", "I should have called you."], ["insist·suggest·demand + that + (should) 원형", "~해야 한다고 주장·제안·요구하다", "She suggested that he rest."], ["If + 과거, would + 원형", "가정법 과거 (현재 반대)", "If I had time, I would help."], ["If + had p.p., would have p.p.", "가정법 과거완료 (과거 반대)", "If I had known, I would have told you."], ["If + had p.p., would + 원형 (now)", "혼합 가정법", "If I had slept, I wouldn't be tired now."]], "tips": ["조동사 + have p.p.의 단서: yesterday, last night 등 과거", "당위가 아닌 '사실' 주장이면 시제 일치", "had better / would rather + 원형 (to ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "You [must have left*/must leave] your phone in the taxi yesterday.", "e": "과거 일 추측 → must have p.p."}, {"k": "pk", "q": "The doctor suggested that he [stop*/stopped] eating fast food.", "e": "제안 + that + (should) 원형"}, {"k": "pk", "q": "If I [had*/have] more time, I would learn to play the drums.", "e": "가정법 과거 → had"}, {"k": "pk", "q": "I wish I [had studied*/studied] harder last year.", "e": "last year(과거) 소망 → had studied"}, {"k": "fx", "q": "You should have tell me the truth earlier.", "w": "tell", "a": ["told"], "e": "should have + p.p."}, {"k": "fx", "q": "If she had left earlier, she would catch the train.", "w": "catch", "a": ["have caught"], "e": "if절 had p.p. → would have caught"}, {"k": "fx", "q": "My dad used to playing soccer every weekend.", "w": "playing", "a": ["play"], "e": "used to + 원형 (~하곤 했다)"}, {"k": "ox", "q": "The teacher insisted that every student wear a uniform.", "a": true, "e": "당위 → (should) wear ✔"}, {"k": "ox", "q": "You had better to take an umbrella.", "a": false, "e": "had better + 원형 → take"}, {"k": "bl", "q": "그녀가 그 소식을 들었을 리가 없다. → She (can't|cannot|couldn't) have heard the news.", "e": "can't have p.p."}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nI ①should have ②listened to my mom. If I ③had taken an umbrella, I ④wouldn't ⑤get wet yesterday.", "o": ["should have", "listened", "had taken", "wouldn't", "get"], "a": 4, "e": "과거 반대(yesterday) → wouldn't have gotten"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He talks as if he knew everything.", "The coach demanded that the player apologize.", "I'd rather stay home than go out tonight.", "You must have be surprised at the news.", "She is used to getting up early."], "a": 3, "e": "④ must have been"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy friend ①insisted that she ②had returned the book, but the librarian said it ③must ④has been lost ⑤somewhere else.", "o": ["insisted", "had returned", "must", "has", "somewhere"], "a": 3, "e": "조동사 뒤 → must have been / ② 사실 주장이라 had returned ✔"}, {"k": "fx", "q": "If I were you, I will accept the offer.", "w": "will", "a": ["would"], "e": "가정법 과거 → would + 원형"}, {"k": "fx", "q": "I wish I can speak Chinese fluently.", "w": "can", "a": ["could"], "e": "I wish + 과거 → could"}, {"k": "fx", "q": "The manager recommended that she takes a few days off.", "w": "takes", "a": ["take", "should take"], "e": "추천 + that + (should) 원형"}, {"k": "pk", "q": "Without your help, I [could not have finished*/cannot finish] the project last month.", "e": "last month → 과거 반대 could not have p.p."}, {"k": "pk", "q": "There [used to be*/used to being] a big tree in front of my house.", "e": "used to + 원형"}, {"k": "ox", "q": "She might have forgotten our appointment.", "a": true, "e": "might have p.p. ✔"}, {"k": "ox", "q": "If he had studied harder, he would pass the exam last week.", "a": false, "e": "last week → would have passed"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nYesterday Mina didn't come to the meeting. She ①may have ②been sick, or she ③might have forgotten about it. Anyway, she ④should call us to say she couldn't come, but she ⑤didn't.", "o": ["may have", "been", "might have forgotten", "should call", "didn't"], "a": 3, "e": "과거에 하지 않은 일 후회·비난 → should have called"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I had wings, I could fly to you.\nⓑ The police officer ordered that the car be moved.\nⓒ I wish I had gone to the concert last night.\nⓓ He cannot have said such a rude thing.\nⓔ If it had not rained, we would have went on a picnic.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ would have gone"}, {"k": "fx", "q": "If you had told me earlier, I could have help you.", "w": "help", "a": ["helped"], "e": "could have + p.p."}, {"k": "fx", "q": "The boy insisted that he see the thief running away last night.", "w": "see", "a": ["saw", "had seen"], "e": "본 것은 사실 주장 → 시제 일치 saw"}, {"k": "fx", "q": "She is used to drive on the left side of the road.", "w": "drive", "a": ["driving"], "e": "be used to + -ing (~에 익숙하다)"}, {"k": "wr", "q": "내가 그때 너의 충고를 따랐더라면 좋을 텐데. (I wish, had followed, your advice, then)", "a": ["I wish I had followed your advice then.", "I wish that I had followed your advice then."], "e": "I wish + had p.p."}, {"k": "or", "q": "그는 마치 그 답을 아는 것처럼 말한다.", "a": "He talks as if he knew the answer.", "e": "as if + 과거"}, {"k": "pk", "q": "If she [had not missed*/did not miss] the bus this morning, she would not be late now.", "e": "혼합 가정법 → had not missed"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nIf the Earth ①had no moon, nights ②would be much darker, and some scientists believe that life ③might ④never have ⑤develop at all.", "o": ["had", "would be", "might", "never have", "develop"], "a": 4, "e": "might have + p.p. → developed"}, {"k": "ox", "q": "It is necessary that he attends the meeting.", "a": false, "e": "necessary + that + (should) 원형 → attend"}]}}, {"tag": "eos-2-U01-P4", "name": "태", "talk": [{"k": "m", "t": "밑줄 동사 세 번째 체크는 **태**! 주어가 그 동작을 **하는지(능동) 당하는지(수동)** 따져요 🔄"}, {"k": "m", "t": "요령 ① 동사 뒤에 **목적어가 있으면 능동**, 목적어 없이 by ~가 오면 수동일 가능성이 커요."}, {"k": "ex", "en": "The thief was caught by the police last night.", "ko": "그 도둑은 어젯밤 경찰에게 잡혔다."}, {"k": "q", "q": "The new bridge ____ next year.", "o": ["will complete", "will be completed", "will be completing"], "a": 1, "ok": "맞아요! 다리는 완공'되는' 것", "no": "주어 bridge는 완성되는 대상 → will be completed"}, {"k": "m", "t": "요령 ② 관계사절 동사의 태는 **선행사**와의 관계로: the car which [was] stolen yesterday"}, {"k": "m", "t": "요령 ③ **자동사**(happen, occur, appear, disappear, arrive, die, remain, consist of, belong to)는 수동태가 없어요!"}, {"k": "q", "q": "The accident ____ on a rainy night.", "o": ["happened", "was happened", "has been happened"], "a": 0, "ok": "정확해요! happen은 자동사", "no": "happen은 수동태 불가 → happened"}, {"k": "m", "t": "요령 ④ 진행·완료 수동 모양: is being p.p. / has been p.p. → The road is being repaired."}, {"k": "m", "t": "⚠️ 사역·지각동사 5형식의 수동은 **to부정사**: He was made [to] wait for an hour."}, {"k": "m", "t": "정리! **목적어 유무 → 주어와의 관계 → 자동사 수동 ✗ → 진행·완료 수동 모양** 👍"}], "notes": {"table": [["구분", "형태", "예"], ["기본 수동", "be + p.p. (by ~)", "The song was written by Jun."], ["진행 수동", "be being p.p.", "A hotel is being built."], ["완료 수동", "have(has) been p.p.", "The book has been translated."], ["조동사 수동", "조동사 + be p.p.", "It must be finished today."], ["사역·지각 수동", "be made / seen + to-v", "She was seen to enter the room."], ["수동 불가 자동사", "happen, occur, appear, disappear, arrive, die, remain, consist of, belong to", "The plane arrived late."]], "tips": ["밑줄 동사 뒤에 목적어가 있으면 능동이 정답", "관계사절 동사 → 선행사가 주어", "has been + -ing(진행) vs has been + p.p.(수동) 구별"]}, "sets": {"workbook": [{"k": "pk", "q": "The bridge [was built*/built] in 1990.", "e": "다리는 지어지는 것 → 수동"}, {"k": "pk", "q": "The accident [happened*/was happened] late at night.", "e": "happen은 자동사"}, {"k": "pk", "q": "A new hospital [is being built*/is building] near my school.", "e": "진행 수동"}, {"k": "pk", "q": "This book [was written*/wrote] by a famous scientist.", "e": "by ~ → 수동"}, {"k": "fx", "q": "The package was arrived two days late.", "w": "was", "a": ["(삭제)"], "e": "arrive는 자동사 → arrived"}, {"k": "fx", "q": "The meeting has been cancel because of the storm.", "w": "cancel", "a": ["canceled", "cancelled"], "e": "완료 수동 → has been canceled"}, {"k": "fx", "q": "English is speaking in many countries.", "w": "speaking", "a": ["spoken"], "e": "영어는 말해지는 것 → is spoken"}, {"k": "ox", "q": "The dog that was found on the street is now living with us.", "a": true, "e": "개는 발견된 것 → was found ✔"}, {"k": "ox", "q": "The museum visits by thousands of people every year.", "a": false, "e": "박물관은 방문되는 것 → is visited"}, {"k": "bl", "q": "그 노래는 많은 사람들에게 사랑받는다. → The song (is loved) by many people.", "e": "be + p.p."}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe old church, which ①was designed by a French architect, ②has visited by many tourists ③since it ④was restored ⑤in 2010.", "o": ["was designed", "has visited", "since", "was restored", "in"], "a": 1, "e": "교회는 방문되는 것 → has been visited"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["A strange thing happened on my way home.", "The tickets were sold out in ten minutes.", "He was made to clean the room by his mom.", "The rumor was disappeared quickly.", "The problem is being discussed now."], "a": 3, "e": "④ disappear는 자동사 → disappeared"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMost of the food ①that ②was served at the party ③was cooked by my aunt, who ④has been ⑤worked as a chef for 20 years.", "o": ["that", "was served", "was cooked", "has been", "worked"], "a": 4, "e": "이모가 일하는 것(능동, 자동사) → has been working"}, {"k": "fx", "q": "The window was broke by a baseball.", "w": "broke", "a": ["broken"], "e": "be + p.p. → broken"}, {"k": "fx", "q": "The thief was seen enter the bank.", "w": "enter", "a": ["to enter", "entering"], "e": "지각동사 수동 → to enter"}, {"k": "fx", "q": "This bag is belonged to my sister.", "w": "is", "a": ["(삭제)"], "e": "belong to는 수동 불가 → belonged"}, {"k": "pk", "q": "The students [were given*/gave] a lot of homework.", "e": "학생들이 숙제를 받음 → 수동"}, {"k": "pk", "q": "The team [consists*/is consisted] of eleven players.", "e": "consist of는 수동 불가"}, {"k": "ox", "q": "The new library will be opened next month.", "a": true, "e": "조동사 수동 ✔"}, {"k": "ox", "q": "Many people were died in the war.", "a": false, "e": "die는 자동사 → died"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nEvery year, millions of tons of food ①are thrown away, even though many people around the world ②are suffered from hunger. Experts say that this problem ③can be ④solved if food ⑤is shared more fairly.", "o": ["are thrown", "are suffered", "can be", "solved", "is shared"], "a": 1, "e": "사람들이 고통받다(suffer from, 능동) → suffer"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The car is being repaired at the shop.\nⓑ Her new song was appeared on TV last night.\nⓒ The children were told to wait outside.\nⓓ The house has been painting since Monday.\nⓔ The work must be finished by Friday.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ appeared / ⓓ has been painted"}, {"k": "fx", "q": "The book which was published last year has translated into ten languages.", "w": "translated", "a": ["been translated"], "e": "책은 번역되는 것 → has been translated"}, {"k": "fx", "q": "Many old houses in this area were torn down and replaced with tall buildings, which built very quickly.", "w": "built", "a": ["were built"], "e": "선행사 buildings는 지어지는 것 → were built"}, {"k": "fx", "q": "The results will announce on the school website tomorrow.", "w": "announce", "a": ["be announced"], "e": "결과는 발표되는 것 → will be announced"}, {"k": "wr", "q": "그 다리는 지금 수리되고 있다. (the bridge, repair, now)", "a": ["The bridge is being repaired now.", "The bridge is now being repaired.", "Now the bridge is being repaired.", "Now, the bridge is being repaired."], "e": "진행 수동 is being p.p."}, {"k": "or", "q": "그 소포는 어제 그녀에게 배달되었다.", "a": "The package was delivered to her yesterday.", "e": "be + p.p."}, {"k": "pk", "q": "An interesting thing [occurred*/was occurred] during the experiment.", "e": "occur는 자동사"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe paintings ①that ②were stolen or the contest ③practiced every day, and their names ④were appeared in the school newspaper after they ⑤won first prize.", "o": ["who", "were chosen", "practiced", "were appeared", "won"], "a": 3, "e": "appear는 자동사 → appeared"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '그는 그 열쇠를 잃어버렸음에 틀림없다.'", "o": ["He must have lost the key.", "He must lose the key.", "He should have lost the key.", "He can't have lost the key.", "He must have losing the key."], "a": 0, "e": "must have p.p."}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The boys playing in the yard are my nephews.", true], ["Learning new skills take time.", false], ["I have visited Jeju three times.", true], ["We went there two years ago.", true], ["She has lost her bag yesterday.", false], ["If I were rich, I would travel the world.", true], ["You should have call me earlier.", false], ["The letter was written in French.", true], ["The plane was arrived late.", false], ["He came home, ate dinner, and went to bed.", true], ["She sings and playing the piano.", false], ["Most of the students agree with the plan.", true]], "e": "ⓑ takes ⓔ lost ⓖ called ⓘ arrived ⓚ plays"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["There are two cats under the table.", true], ["The price of these shoes are too high.", false], ["Let's start when everyone arrives.", true], ["I had finished my work before he called.", true], ["The doctor insisted that he stopped smoking.", false], ["I wish I could fly like a bird.", true], ["My bike was stolen last night.", true], ["The rumor was spread by someone in my class.", true], ["Tom has been worked here since 2020.", false], ["He either walks or rides his bike to school.", true], ["She cleaned the kitchen and washes the dishes.", false], ["What he wants is a new phone.", true]], "e": "ⓑ is ⓔ (should) stop ⓘ has worked ⓚ washed"}]}}, {"book": "eos", "chapter": {"id": "12", "name": "밑줄·명사/대명사", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 02 명사/대명사 밑줄"}, "units": [{"tag": "eos-2-U02-P1", "name": "대명사의 일치", "talk": [{"k": "m", "t": "Unit 02는 **명사·대명사 밑줄**! 대명사에 밑줄이 있으면 가장 먼저 **무엇을 가리키는지** 찾아요 🎯"}, {"k": "m", "t": "① 수 일치: 가리키는 명사가 단수면 it·its, 복수면 they·their·them → The museum is famous for [its] garden."}, {"k": "q", "q": "Bees are important because ____ help plants grow.", "o": ["it", "they", "them"], "a": 1, "ok": "맞아요! Bees(복수) → they", "no": "가리키는 말 Bees가 복수 + 주어 자리 → they"}, {"k": "m", "t": "⚠️ 가까운 명사 함정! The leaves of the old tree turn red, and [they] fall in November. (가리키는 건 tree가 아니라 leaves)"}, {"k": "m", "t": "② 재귀대명사: 목적어가 **같은 절의 주어 자신**이면 -self/-selves → She looked at [herself] in the mirror."}, {"k": "q", "q": "The kids made the cake by ____.", "o": ["them", "themselves", "their"], "a": 1, "ok": "정확해요! by oneself = 혼자 힘으로", "no": "주어 kids 자신 → themselves"}, {"k": "m", "t": "⚠️ 주어가 달라지면 재귀 ✗: He asked me to help him. (help하는 사람은 me → 그를 가리키니 him)"}, {"k": "m", "t": "③ 비교 대상: 앞 명사의 반복은 단수 **that**, 복수 **those** → The population of Seoul is larger than [that] of Busan."}, {"k": "q", "q": "The rooms in this hotel are bigger than ____ in that hotel.", "o": ["that", "those", "it"], "a": 1, "ok": "맞아요! rooms(복수) → those", "no": "비교 대상 rooms가 복수 → those"}, {"k": "m", "t": "④ one vs it: 앞의 명사와 **같은 종류 아무거나** → one, **바로 그것** → it → I lost my pen, so I bought a new [one]."}, {"k": "m", "t": "정리! 대명사 밑줄 → **가리키는 명사 찾기 → 수 일치 → 재귀·that/those·one/it 확인** 👍"}], "notes": {"table": [["확인할 것", "규칙", "예"], ["수 일치", "단수 → it·its / 복수 → they·their·them", "Cats clean their fur."], ["재귀대명사", "같은 절의 주어 = 목적어 → -self", "He hurt himself."], ["재귀 ✗", "주어가 다르면 일반 목적격", "She told me to call her."], ["비교 대상", "단수 → that (of) / 복수 → those (of)", "The roads in A are wider than those in B."], ["one vs it", "같은 종류 아무거나 → one / 바로 그것 → it", "I need a pen. Can you lend me one?"], ["its vs it's", "its = 그것의 / it's = it is", "The dog wagged its tail."]], "tips": ["대명사 밑줄 → 가리키는 명사에 동그라미", "of ~ 수식어 안의 가까운 명사에 속지 않기", "help yourself / enjoy oneself / by oneself 관용 표현"]}, "sets": {"workbook": [{"k": "pk", "q": "Children should be allowed to express [their*/its] feelings.", "e": "Children(복수) → their"}, {"k": "pk", "q": "The museum is famous for [its*/their] beautiful garden.", "e": "museum(단수) → its"}, {"k": "pk", "q": "He cut [himself*/him] while cooking dinner.", "e": "주어 = 목적어 → himself"}, {"k": "pk", "q": "The climate of Korea is milder than [that*/those] of Russia.", "e": "climate(단수) → that"}, {"k": "fx", "q": "The students forgot to bring its textbooks.", "w": "its", "a": ["their"], "e": "students(복수) → their"}, {"k": "fx", "q": "I lost my umbrella, so I need to buy a new it.", "w": "it", "a": ["one"], "e": "같은 종류 아무거나 → one"}, {"k": "fx", "q": "Please help you to some cookies.", "w": "you", "a": ["yourself"], "e": "help yourself to ~ (마음껏 먹다)"}, {"k": "ox", "q": "The ears of a rabbit are longer than those of a cat.", "a": true, "e": "ears(복수) → those ✔"}, {"k": "ox", "q": "Every country has their own culture.", "a": false, "e": "country(단수) → its"}, {"k": "bl", "q": "그 나무들은 가을에 잎을 떨어뜨린다. → The trees drop (their) leaves in autumn.", "e": "trees(복수) → their"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nElephants ①are known for ②their memory. ③It can remember ④their family members ⑤for decades.", "o": ["are", "their", "It", "their", "for"], "a": 2, "e": "Elephants(복수) → They"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The boy introduced himself to the class.", "Our school is proud of its long history.", "The prices here are higher than those in my town.", "The girls enjoyed themselves at the party.", "The weather in Seoul is colder than those in Busan."], "a": 4, "e": "⑤ weather(단수) → that"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy parents ①always tell me to believe in ②me, and ③they say that hard work will help ④me achieve ⑤my dreams.", "o": ["always", "me", "they", "me", "my"], "a": 1, "e": "believe의 주체는 me → myself"}, {"k": "fx", "q": "The dog wagged it's tail happily.", "w": "it's", "a": ["its"], "e": "그것의 → its (it's = it is)"}, {"k": "fx", "q": "Tom and Jerry blamed theirselves for the mistake.", "w": "theirselves", "a": ["themselves"], "e": "재귀대명사 → themselves"}, {"k": "fx", "q": "The rules of this game are simpler than that of chess.", "w": "that", "a": ["those"], "e": "rules(복수) → those"}, {"k": "pk", "q": "If you need a pencil, I can lend you [one*/it].", "e": "같은 종류 아무거나 → one"}, {"k": "pk", "q": "I bought a jacket yesterday, but [it*/one] was too small.", "e": "바로 그 재킷 → it"}, {"k": "ox", "q": "We should take care of ourselves.", "a": true, "e": "주어 We = 목적어 → ourselves ✔"}, {"k": "ox", "q": "The tree lost most of their leaves in the storm.", "a": false, "e": "tree(단수) → its"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMany animals ①protect ②themselves by changing ③their colors. For example, the chameleon can change ④their skin color to match ⑤its surroundings.", "o": ["protect", "themselves", "their", "their", "its"], "a": 3, "e": "chameleon(단수) → its"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The streets of Paris are busier than those of Rome.\nⓑ Each student must bring his or her own lunch.\nⓒ The singer wrote all of her songs by her.\nⓓ I don't like this cap. Can you show me another one?\nⓔ The country is known for their delicious food.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ by herself / ⓔ its"}, {"k": "fx", "q": "The team members introduced ourselves to the new coach.", "w": "ourselves", "a": ["themselves"], "e": "주어 members(3인칭 복수) → themselves"}, {"k": "fx", "q": "The cars made in this factory are more expensive than that made in China.", "w": "that", "a": ["those"], "e": "cars(복수) → those"}, {"k": "fx", "q": "My brother hurt him while playing soccer.", "w": "him", "a": ["himself"], "e": "주어 = 목적어 → himself"}, {"k": "wr", "q": "이 도시의 기후는 런던의 기후보다 더 따뜻하다. (the climate, this city, warmer, that, London)", "a": ["The climate of this city is warmer than that of London.", "The climate in thi d boy / a five-minute walk"}, {"k": "m", "t": "⚠️ one of the + **복수명사** / each of the + **복수명사** (each 단독 뒤는 단수)"}, {"k": "m", "t": "🎉 Chapter 12 명사·대명사 밑줄 끝! **수식어 → 명사의 수 / 가리키는 말 → 대명사의 수** 👍"}], "notes": {"table": [["수식어", "명사", "예"], ["many, few, a few, several, both, a number of, various", "셀 수 있는 복수", "a few questions"], ["much, little, a little, a great deal of, an amount of", "셀 수 없는 명사", "much time, little water"], ["a lot of, lots of, some, any, all", "복수 / 셀 수 없음 둘 다", "a lot of books / a lot of money"], ["each, every, another, either, neither", "단수", "every day, another chance"], ["one of the, each of the, both of the", "복수", "one of the best players"], ["숫자-명사 하이픈 형용사", "단수", "a three-hour flight"]], "tips": ["셀 수 없는 명사: information, advice, furniture, equipment, homework, news, evidence, baggage", "셀 때: a piece of advice / two pieces of furniture", "a large number of + 복수 / a large amount of + 셀 수 없음"]}, "sets": {"workbook": [{"k": "pk", "q": "There were [many*/much] people at the concert.", "e": "people(복수) → many"}, {"k": "pk", "q": "I don't have [much*/many] homework today.", "e": "homework(셀 수 없음) → much"}, {"k": "pk", "q": "Each [player*/players] wears a number on the back.", "e": "each + 단수"}, {"k": "pk", "q": "We bought some new [furniture*/furnitures] for the living room.", "e": "furniture는 -s ✗"}, {"k": "fx", "q": "She is one of the most famous singer in Korea.", "w": "singer", "a": ["singers"], "e": "one of the + 복수명사"}, {"k": "fx", "q": "He gave me many good advice.", "w": "many", "a": ["much", "a lot of"], "e": "advice(셀 수 없음) → much"}, {"k": "fx", "q": "It is a three-hours flight from Seoul to Bangkok.", "w": "three-hours", "a": ["three-hour"], "e": "하이픈 형용사 → 단수"}, {"k": "ox", "q": "A number of students are waiting outside.", "a": true, "e": "a number of + 복수명사 ✔"}, {"k": "ox", "q": "Every rooms in this hotel has a view of the sea.", "a": false, "e": "every + 단수 → room"}, {"k": "bl", "q": "나는 그것에 대한 정보가 거의 없다. → I have (little) informati umber of", "birds", "each bird", "their"], "a": 4, "e": "each bird(단수) → its"}, {"k": "ch", "q": "빈칸에 one이 들어갈 수 없는 것은?", "o": ["I don't have a pen. Can you lend me ____?", "I lost my bag yesterday. Have you seen ____?", "This shirt is too big. Show me a smaller ____.", "My car is old. I want a new ____.", "There are many cups here. You can take ____."], "a": 1, "e": "② 바로 그 가방 → it"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The girls dried themselves with towels.", true], ["The cat licked it's paw.", false], ["The weather here is milder than that in Seoul.", true], ["I need a few more minutes.", true], ["He doesn't have much friends.", false], ["Each of the rooms has a desk.", true], ["We bought two new furnitures.", false], ["It's a two-hour drive.", true], ["The students raised its hands.", false], ["Several students were absent.", true], ["I lost my watch, so I bought a new one.", true], ["Little water was left in the bottle.", true]], "e": "ⓑ its ⓔ many ⓖ two new pieces of furniture ⓘ their"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["She made the dress herself.", true], ["The ears of a fox are bigger than that of a dog.", false], ["There isn't much milk in the fridge.", true], ["Every players on the team practiced hard.", false], ["He gave me some useful advice.", true], ["One of my favorite food is pizza.", false], ["A number of students joined the club.", true], ["This bag is heavy. Do you have a lighter one?", true], ["The company changed its name.", true], ["We stayed at a five-stars hotel.", false], ["I have a little time today.", true], ["Both of my parents are teachers.", true]], "e": "ⓑ those ⓓ player ⓕ foods ⓙ five-star"}]}}, {"book": "eos", "chapter": {"id": "13", "name": "밑줄·형용사/부사", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 03 형용사/부사 밑줄"}, "units": [{"tag": "eos-2-U03-P1", "name": "형용사, 부사 자리 구별", "talk": [{"k": "m", "t": "Unit 03은 **형용사·부사 밑줄**! 밑줄 친 말이 **무엇을 꾸미는지 / 어떤 자리인지** 찾으면 바로 풀려요 🧭"}, {"k": "m", "t": "**형용사 자리**: ① 명사 수식 ② 주격보어(be, look, sound, feel, smell, taste, seem, become, remain, keep 뒤) ③ 목적격보어(make·keep·find + O + 형용사)"}, {"k": "q", "q": "The soup tastes a little ____.", "o": ["salty", "saltily", "saltiness"], "a": 0, "ok": "맞아요! 감각동사 + 형용사", "no": "taste는 감각동사 → 보어 자리 형용사 salty"}, {"k": "m", "t": "**부사 자리**: 동사, 형용사, 다른 부사, 문장 전체 수식 → She answered [calmly]. / an [extremely] hard test"}, {"k": "q", "q": "The news made everyone ____.", "o": ["nervous", "nervously", "nerve"], "a": 0, "ok": "정확해요! 목적격보어 → 형용사", "no": "make + O + 형용사 → nervous"}, {"k": "m", "t": "요령: 밑줄 친 말을 **지워 보세요**. 문장이 불완전해지면 보어(형용사), 문장이 완전하면 수식어(부사)일 가능성이 커요."}, {"k": "m", "t": "⚠️ 모양 같은 형용사·부사: hard, late, fast, high, early / 뜻이 다른 -ly: hardly(거의 ~않다), lately(최근에), highly(매우), nearly(거의)"}, {"k": "q", "q": "He studied ____ for the exam, so he passed.", "o": ["hard", "hardly", "harder than"], "a": 0, "ok": "맞아요! hard = 열심히", "no": "hardly는 '거의 ~않다' → 열심히는 hard"}, {"k": "m", "t": "⚠️ -ly로 끝나는 **형용사**: friendly, lovely, lonely, costly, likely → a friendly smile (부사 아님!)"}, {"k": "m", "t": "정리! **보어·명사 수식 → 형용사 / 동사·형용사·부사 수식 → 부사 / hard·hardly 뜻 구별** 👍"}], "notes": {"table": [["자리", "품사", "예"], ["명사 수식", "형용사", "a careful driver"], ["주격보어 (be, look, sound, feel, seem, become, remain)", "형용사", "The plan sounds good."], ["목적격보어 (make, keep, find, leave + O)", "형용사", "Keep your hands clean."], ["동사 수식", "부사", "He drives carefully."], ["형용사·부사·분사 수식", "부사", "surprisingly easy / badly damaged"], ["모양 같은 형용사·부사", "hard, late, fast, high, early", "He works hard. / The bus came late."], ["뜻이 다른 -ly 부사", "hardly 거의 ~않다 / lately 최근에 / highly 매우 / nearly 거의", "I hardly know him."]], "tips": ["밑줄 친 말을 지워서 문장이 불완전하면 보어 → 형용사", "-ly 형용사: friendly, lovely, lonely, costly, likely", "look at ~ angrily처럼 동작(look at)을 꾸미면 부사"]}, "sets": {"workbook": [{"k": "pk", "q": "The soup tastes [salty*/saltily].", "e": "감각동사 + 형용사"}, {"k": "pk", "q": "She spoke [calmly*/calm] to the angry customer.", "e": "동사 spoke 수식 → 부사"}, {"k": "pk", "q": "The news made everyone [happy*/happily].", "e": "목적격보어 → 형용사"}, {"k": "pk", "q": "He worked [hard*/hardly] to pass the exam.", "e": "열심히 → hard"}, {"k": "fx", "q": "The flowers smell sweetly in spring.", "w": "sweetly", "a": ["sweet"], "e": "감각동사 + 형용사"}, {"k": "fx", "q": "This is an extreme difficult problem.", "w": "extreme", "a": ["extremely"], "e": "형용사 difficult 수식 → 부사"}, {"k": "fx", "q": "The train arrived lately because of the snow.", "w": "lately", "a": ["late"], "e": "늦게 → late (lately = 최근에)"}, {"k": "ox", "q": "She looked nervous before the speech.", "a": true, "e": "look + 형용사 ✔"}, {"k": "ox", "q": "Please keep the room cleanly.", "a": false, "e": "목적격보어 → clean"}, {"k": "bl", "q": "그 가수는 무대 위에서 아름답게 노래했다. → The singer sang (beautifully) on the stage.", "e": "동사 수식 → 부사"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe test was ①surprisingly ②easy, so most students finished it ③quick and felt ④very ⑤happy.", "o": ["surprisingly", "easy", "quick", "very", "happy"], "a": 2, "e": "동사 finished 수식 → quickly"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He seems honest.", "The movie was terribly boring.", "She remained silently during the meeting.", "I found the book interesting.", "They walked slowly along the beach."], "a": 2, "e": "③ remain + 형용사 → silent"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy grandfather is a ①friendly man who ②always greets his neighbors ③warmly, but ④recent he has ⑤rarely left his house.", "o": ["friendly", "always", "warmly", "recent", "rarely"], "a": 3, "e": "문장 수식 '최근에' → recently / ① friendly는 형용사 ✔"}, {"k": "fx", "q": "He can hard believe the news.", "w": "hard", "a": ["hardly"], "e": "거의 ~않다 → hardly"}, {"k": "fx", "q": "She is a lovely girl who always smiles brightly and speaks polite.", "w": "polite", "a": ["politely"], "e": "동사 speaks 수식 → 부사"}, {"k": "fx", "q": "The airplane flew highly above the clouds.", "w": "highly", "a": ["high"], "e": "높이 → high (highly = 매우)"}, {"k": "pk", "q": "The baby is sleeping [peacefully*/peaceful] in her bed.", "e": "동사 수식 → 부사"}, {"k": "pk", "q": "The old man lives a [lonely*/alone] life.", "e": "명사 수식 → lonely (alone은 명사 앞 ✗)"}, {"k": "ox", "q": "The problem seemed simple, but it was actually difficult.", "a": true, "e": "seem + 형용사 / actually는 문장 수식 부사 ✔"}, {"k": "ox", "q": "The singer became famously after the show.", "a": false, "e": "become + 형용사 → famous"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nRunning every morning keeps me ①healthy. At first, it was ②extremely ③hard, but now I can run ④easy for an hour and I feel ⑤great afterward.", "o": ["healthy", "extremely", "hard", "easy", "great"], "a": 3, "e": "동사 run 수식 → easily"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The cake smells wonderful.\nⓑ He drove careful in the rain.\nⓒ I nearly missed the bus.\nⓓ She keeps her desk neat.\nⓔ The plan sounds perfect.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓒⓓⓔ 옳음 / ⓑ carefully"}, {"k": "fx", "q": "Most people agree that the new rule is high effective.", "w": "high", "a": ["highly"], "e": "형용사 수식 '매우' → highly"}, {"k": "fx", "q": "She answered all the questions correct and confidently.", "w": "correct", "a": ["correctly"], "e": "confidently와 함께 동사 수식 → correctly"}, {"k": "fx", "q": "Prices have risen sharp this year.", "w": "sharp", "a": ["sharply"], "e": "동사 risen 수식 → 부사"}, {"k": "wr", "q": "그 소식은 그를 매우 슬프게 만들었다. (the news, made, very sad)", "a": ["The news made him very sad."], "e": "목적격보어 → 형용사"}, {"k": "or", "q": "그 수프는 정말 맛있는 냄새가 난다.", "a": "The soup smells really delicious.", "e": "smell + 형용사, really는 형용사 수식"}, {"k": "pk", "q": "I could [hardly*/hard] hear his voice because of the noise.", "e": "거의 ~할 수 없다 → hardly"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe museum guide explained the history of the paintings ①clearly, and the visitors listened ②careful. Some of them found the stories ③amazing, and they ④quietly took notes so that they could remember them ⑤later.", "o": ["clearly", "careful", "amazing", "quietly", "later"], "a": 1, "e": "동사 listened 수식 → carefully"}, {"k": "ox", "q": "The room was full of people, so it felt warm and comfortable.", "a": true, "e": "feel + 형용사 ✔"}]}}, {"tag": "eos-2-U03-P2", "name": "비교급 수식 부사", "talk": [{"k": "m", "t": "비교급 앞에 밑줄? **비교급을 꾸밀 수 있는 부사**인지 확인해요 💪"}, {"k": "m", "t": "비교급 강조(훨씬): **much, even, still, far, a lot** + 비교급 → This box is [much] heavier than that one."}, {"k": "q", "q": "The new phone is ____ faster than the old one.", "o": ["very", "far", "so"], "a": 1, "ok": "맞아요! far + 비교급", "no": "very·so는 비교급 ✗ → far"}, {"k": "m", "t": "⚠️ **very, so, too**는 원급만 꾸며요: very tall ✔ / very taller ✗"}, {"k": "q", "q": "Today is ____ hot. (매우)", "o": ["very", "much", "even"], "a": 0, "ok": "정확해요! 원급은 very", "no": "원급 hot 앞 '매우' → very"}, {"k": "m", "t": "최상급 강조: **by far / much + the 최상급**, **the very + 최상급** → It is by far the best movie."}, {"k": "q", "q": "This is ____ best pizza in town.", "o": ["very the", "the very", "much very"], "a": 1, "ok": "맞아요! the very + 최상급", "no": "very는 the 뒤에 → the very best"}, {"k": "m", "t": "⚠️ more + 복수명사는 **many more**: many more books ✔ / very more books ✗"}, {"k": "m", "t": "🎉 Chapter 13 형용사·부사 밑줄 끝! **꾸미는 대상으로 형용사·부사 구별 / 비교급은 much·even·still·far·a lot** 👍"}], "notes": {"table": [["꾸미는 대상", "쓸 수 있는 부사", "예"], ["원급", "very, so, too, really", "very cold"], ["비교급", "much, even, still, far, a lot", "much colder"], ["more + 복수명사", "many, far, a lot", "many more people"], ["최상급", "by far, much + the 최상급 / the very + 최상급", "by far the best / the very best"]], "tips": ["very + 비교급 ✗", "much more + 원급도 비교급 → much more useful", "the very 순서 주의 (very the ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "My brother is [much*/very] older than me.", "e": "비교급 강조"}, {"k": "pk", "q": "This question is [very*/much] easy.", "e": "원급 → very"}, {"k": "pk", "q": "It was [by far*/very] the most exciting game of the season.", "e": "최상급 강조 by far"}, {"k": "pk", "q": "Your idea is [even*/so] better than mine.", "e": "비교급 강조"}, {"k": "fx", "q": "The river is very deeper than it looks.", "w": "very", "a": ["much", "even", "still", "far", "a lot"], "e": "very + 비교급 ✗"}, {"k": "fx", "q": "This is the much best restaurant in the city.", "w": "much", "a": ["very"], "e": "the very + 최상급"}, {"k": "fx", "q": "He runs far fast than me.", "w": "fast", "a": ["faster"], "e": "far는 비교급 강조 → far faster than"}, {"k": "ox", "q": "The weather today is still colder than yesterday.", "a": true, "e": "still + 비교급 ✔"}, {"k": "ox", "q": "She is very more careful than her sister.", "a": false, "e": "much more careful"}, {"k": "bl", "q": "이 다리는 저 다리보다 훨씬 더 길다. → This bridge is (much|even|still|far|a lot) longer than that one.", "e": "비교급 강조"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe new library is ①much ②bigger than the old one, and it has ③very ④more books, so it is ⑤always crowded.", "o": ["much", "bigger", "very", "more", "always"], "a": 2, "e": "more + 복수명사 강조 → many(far·a lot) more books"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nMy test score was ____ higher than I expected.", "o": ["much", "even", "far", "very", "a lot"], "a": 3, "e": "very + 비교급 ✗"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["It's much warmer today.", "He is far taller than his father.", "She is very kind to everyone.", "This is even more interesting.", "The bag was so heavier than I thought."], "a": 4, "e": "⑤ so → much(even·far·a lot)"}, {"k": "fx", "q": "The second test was very harder than the first one.", "w": "very", "a": ["much", "even", "still", "far", "a lot"], "e": "very + 비교급 ✗"}, {"k": "fx", "q": "This sofa is too more comfortable than the old one.", "w": "too", "a": ["much", "even", "still", "far", "a lot"], "e": "too + 비교급 ✗"}, {"k": "fx", "q": "He is by far the smarter student in our class.", "w": "smarter", "a": ["smartest"], "e": "by far + the 최상급"}, {"k": "pk", "q": "The second movie was [a lot*/very] funnier than the first.", "e": "비교급 강조"}, {"k": "pk", "q": "She speaks English [much*/very] better than I do.", "e": "비교급 better 강조"}, {"k": "ox", "q": "Mount Everest is much the highest mountain in the world.", "a": true, "e": "much + the 최상급 ✔"}, {"k": "ox", "q": "This apartment is very bigger than ours.", "a": false, "e": "much(even·far·a lot) bigger"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nOnline shopping has become ①much more popular than before. It is ②far ③more convenient, and prices are often ④even lower. However, some people think that shopping in stores is ⑤very more fun.", "o": ["much", "far", "more", "even", "very"], "a": 4, "e": "very + 비교급 ✗ → much(far·even) more fun"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ My bag is a lot lighter than yours.\nⓑ This is the very best day of my life.\nⓒ He is much taller than his brother.\nⓓ The second book was very more interesting.\nⓔ It is by far the oldest building in town.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ much more interesting"}, {"k": "fx", "q": "The tickets for the concert were so more expensive than we expected.", "w": "so", "a": ["much", "even", "still", "far", "a lot"], "e": "so + 비교급 ✗"}, {"k": "fx", "q": "My new phone is still more faster than my old one.", "w": "more", "a": ["(삭제)"], "e": "still + 비교급 faster (more 중복 ✗)"}, {"k": "fx", "q": "Health is much important than money.", "w": "important", "a": ["more important"], "e": "much는 비교급 강조 → much more important"}, {"k": "wr", "q": "이 문제는 저 문제보다 훨씬 더 어렵다. (much, more difficult, that one)", "a": ["This problem is much more difficult than that one.", "This question is much more difficult than that one."], "e": "much + 비교급"}, {"k": "or", "q": "그것은 단연코 올해 최고의 영화이다.", "a": "It is by far the best movie of the year.", "e": "by far + the 최상급"}, {"k": "pk", "q": "The weather got [even*/very] worse in the afternoon.", "e": "비교급 worse 강조"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy older sister is ①very ②smarter than I am, but she says that I am ③the ④very ⑤funniest person in our family.", "o": ["very", "smarter", "the", "very", "funniest"], "a": 0, "e": "very + 비교급 ✗ → much(even·far) smarter / ④ the very + 최상급 ✔"}, {"k": "ox", "q": "The new model is a lot more efficient than the old one.", "a": true, "e": "a lot + 비교급 ✔"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그 음식은 맛이 이상했다. (the food, tasted, strange)", "a": ["The food tasted strange."], "e": "taste + 형용사"}, {"k": "wr", "q": "그는 그 문제를 쉽게 풀었다. (solved, the problem, easily)", "a": ["He solved the problem easily.", "He easily solved the problem."], "e": "동사 수식 → 부사"}, {"k": "wr", "q": "창문을 열어 두세요. (keep, the window, open)", "a": ["Keep the window open.", "Please keep the window open.", "Keep the window open, please."], "e": "keep + O + 형용사"}, {"k": "wr", "q": "오늘은 어제보다 훨씬 더 춥다. (today, much, colder, yesterday)", "a": ["Today is much colder than yesterday."], "e": "much + 비교급"}, {"k": "wr", "q": "그녀는 단연코 우리 반에서 가장 빠른 학생이다. (by far, the fastest student, in our class)", "a": ["She is by far the fastest student in our class."], "e": "by far + the 최상급"}, {"k": "fx", "q": "The music sounds beautifully.", "w": "beautifully", "a": ["beautiful"], "e": "sound + 형용사"}, {"k": "fx", "q": "I could hard sleep last night.", "w": "hard", "a": ["hardly"], "e": "거의 ~못하다 → hardly"}, {"k": "fx", "q": "This car is very faster than mine.", "w": "very", "a": ["much", "even", "still", "far", "a lot"], "e": "very + 비교급 ✗"}, {"k": "bl", "q": "그 시험은 놀라울 정도로 쉬웠다. → The test was (surprisingly) easy.", "e": "형용사 수식 → 부사"}, {"k": "or", "q": "그 소식은 우리를 행복하게 만들었다.", "a": "The news made us happy.", "e": "make + O + 형용사"}], "test": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe little girl ①happily opened the gift, but she looked ②sadly when she ③found that the toy was ④badly ⑤broken.", "o": ["happily", "sadly", "found", "badly", "broken"], "a": 1, "e": "look + 형용사 → sad"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThis smartphone is ①much ②lighter and ③even faster than the old model, but it is ④very more expensive, so not ⑤many students can buy it.", "o": ["much", "lighter", "even", "very", "many"], "a": 3, "e": "very + 비교급 ✗ → much(far·a lot) more expensive"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The cookies smell deliciously.", "He hardly ever eats breakfast.", "The movie was far better than the book.", "The room looked clean and bright.", "She is the very best singer in the class."], "a": 0, "e": "① smell + 형용사 → delicious"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He arrived lately for school.", "The plan sounds greatly.", "This bag is very cheaper.", "The kids kept quietly.", "The new road is much wider than the old one."], "a": 4, "e": "① late ② great ③ much cheaper ④ quiet"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe hikers ①finally reached the top of the mountain. The view was ②amazing, and the air felt ③freshly and cool. They ④quickly took some pictures and ⑤happily went down.", "o": ["finally", "amazing", "freshly", "quickly", "happily"], "a": 2, "e": "feel + 형용사 → fresh (cool과 병렬)"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은?\nThis year's festival was ____ more successful than last year's.", "o": ["much", "very", "far", "still", "a lot"], "a": 1, "e": "very + 비교급 ✗"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It's getting dark.\nⓑ She danced gracefully.\nⓒ He is even more popular than his brother.\nⓓ I found the test very easily.\nⓔ The music is so loud.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ 목적격보어 → easy"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe train arrived ____ because of the snow.\nShe could ____ believe her eyes.", "o": ["late – hardly", "lately – hardly", "late – hard", "lately – hard", "lateness – hardly"], "a": 0, "e": "늦게 → late / 거의 ~못하다 → hardly"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nLearning a language is ①much easier when you are young. Children ②naturally pick up new words, and they are ③less afraid of mistakes. That is why many experts say that early education is ④highly important and ⑤very more effective.", "o": ["much", "naturally", "less", "highly", "very"], "a": 4, "e": "very + 비교급 ✗ → much(far·even) more effective"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe room was ①completely ②dark, so I walked ③careful to avoid hitting anything, and I finally found the switch ④near the door. The light was ⑤surprisingly bright.", "o": ["completely", "dark", "careful", "near", "surprisingly"], "a": 2, "e": "동사 walked 수식 → carefully"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '이 커피는 저 커피보다 훨씬 더 쓰다.'", "o": ["This coffee is very more bitter than that one.", "This coffee is much more bitter than that one.", "This coffee is much bitterly than that one.", "This coffee is very bitter than that one.", "This coffee is much bitter than that one."], "a": 1, "e": "much + 비교급"}, {"k": "ch", "q": "어법상 틀린 문장의 개수는?\nⓐ The milk went badly.\nⓑ He is very taller than me.\nⓒ I near fell asleep.\nⓓ The movie was very more exciting.\nⓔ She looks lovely.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐ go + 형용사 → bad / ⓑ much taller / ⓒ nearly / ⓓ much more exciting / ⓔ lovely는 형용사 ✔"}, {"k": "ch", "q": "어법상 틀린 부분을 바르게 고친 것은?\nThe teacher spoke very soft so that the baby wouldn't wake up.", "o": ["soft → softly", "very → much", "spoke → speaks", "wouldn't → won't", "wake → waking"], "a": 0, "e": "동사 spoke 수식 → softly"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The cake tastes sweet.", true], ["He ran very fastly.", false], ["She kept the door open.", true], ["I can hardly wait for the trip.", true], ["The singer became popularly.", false], ["This is much bigger than that.", true], ["He is very smarter than me.", false], ["It was by far the best day.", true], ["The baby slept peacefully.", true], ["The plan sounds nicely.", false], ["He arrived late for class.", true], ["She is the very best player.", true]], "e": "ⓑ fast ⓔ popular ⓖ much(even·still·far·a lot) smarter ⓙ nice"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The flowers smell good.", true], ["She looked angrily at me.", true], ["The soup is extreme hot.", false], ["The movie was even scarier than I expected.", true], ["He worked hardly all day.", false], ["The air feels fresh.", true], ["I found the question difficult.", true], ["My room is so bigger than yours.", false], ["The stars shone brightly.", true], ["It's a lot warmer today.", true], ["Her voice sounded sweetly.", false], ["This is much the oldest tree in the park.", true]], "e": "ⓒ extremely ⓔ hard ⓗ much(even·still·far·a lot) bigger ⓚ sweet"}]}}, {"book": "eos", "chapter": {"id": "14", "name": "밑줄·비교", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 04 비교구문 밑줄"}, "units": [{"tag": "eos-2-U04-P1", "name": "원급, 비교급, 최상급 형태 구별", "talk": [{"k": "m", "t": "Unit 04는 **비교구문 밑줄**! 먼저 비교 신호를 찾아요: **as ~ as / than / the + 최상급** 🔎"}, {"k": "m", "t": "① as와 as 사이는 **원급**: as [tall] as / ② than 앞은 **비교급** / ③ the + 최상급 + in(장소·집단) · of(복수)"}, {"k": "q", "q": "This year's winter was as ____ as last year's.", "o": ["cold", "colder", "coldest"], "a": 0, "ok": "맞아요! as ~ as 사이는 원급", "no": "as ~ as 사이 → 원급 cold"}, {"k": "m", "t": "⚠️ 짝 맞추기 함정: as ~ **than** ✗ / 비교급 ~ **as** ✗ / more + -er ✗ / most + -est ✗"}, {"k": "q", "q": "The new bridge is longer ____ the old one.", "o": ["as", "than", "to"], "a": 1, "ok": "정확해요! 비교급 + than", "no": "longer(비교급)의 짝은 than"}, {"k": "m", "t": "④ as ~ as 안에서도 형용사·부사 판단: He spoke as [clearly] as his teacher. (동사 spoke 수식 → 부사)"}, {"k": "m", "t": "⑤ 최상급 뜻 표현: No other + **단수명사** ~ 비교급 than(as 원급 as) / 비교급 than any other + **단수명사**"}, {"k": "q", "q": "Mt. Halla is higher than any other ____ in South Korea.", "o": ["mountain", "mountains", "the mountain"], "a": 0, "ok": "맞아요! any other + 단수명사", "no": "any other 뒤는 단수명사 → mountain"}, {"k": "m", "t": "⑥ 둘 중 '더 ~한 쪽' → **the + 비교급 + of the two**: Jun is the [taller] of the two."}, {"k": "m", "t": "정리! **as 원급 as / 비교급 than / the 최상급 in·of / any other + 단수 / the 비교급 of the two** 👍"}], "notes": {"table": [["형태", "예", "주의"], ["as + 원급 + as", "as busy as / not as(so) fast as", "as ~ than ✗"], ["비교급 + than", "taller than / more useful than", "more + -er ✗"], ["the + 최상급 + in / of", "the best in Korea / the oldest of the three", "most + -est ✗"], ["the + 비교급 + of the two", "the taller of the two", "둘 비교는 최상급 ✗"], ["비교급 than any other + 단수", "taller than any other boy", "복수 ✗"], ["No other + 단수 ~ 비교급 than / as 원급 as", "No other boy is taller than Jun.", "최상급 의미"]], "tips": ["밑줄 형용사 앞뒤의 as·than·the부터 확인", "불규칙: good·well – better – best / bad – worse – worst / many·much – more – most / little – less – least", "as ~ as 사이 형용사·부사는 as를 지우고 판단"]}, "sets": {"workbook": [{"k": "pk", "q": "My sister is as [tall*/taller] as my mom.", "e": "as 원급 as"}, {"k": "pk", "q": "This problem is [more difficult*/difficulter] than the last one.", "e": "긴 단어 → more"}, {"k": "pk", "q": "It was the [worst*/baddest] day of my life.", "e": "bad – worse – worst"}, {"k": "pk", "q": "Russia is larger than any other [country*/countries] in the world.", "e": "any other + 단수명사"}, {"k": "fx", "q": "Your phone is as newer as mine.", "w": "newer", "a": ["new"], "e": "as 원급 as"}, {"k": "fx", "q": "This hotel is cheaper as that one.", "w": "as", "a": ["than"], "e": "비교급 + than"}, {"k": "fx", "q": "She is the most kindest person I know.", "w": "most", "a": ["(삭제)"], "e": "most + -est ✗ → the kindest"}, {"k": "ox", "q": "Of the two boys, Minho is the taller.", "a": true, "e": "the 비교급 of the two ✔"}, {"k": "ox", "q": "No other student in my class is as tall than Jisu.", "a": false, "e": "as tall as"}, {"k": "bl", "q": "그것은 세계에서 가장 긴 강이다. → It is the (longest) river in the world.", "e": "the + 최상급"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nJiwoo is ①the ②youngest ③of the three sisters, but she is ④more tall ⑤than the others.", "o": ["the", "youngest", "of", "more tall", "than"], "a": 3, "e": "tall의 비교급 → taller"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He sings as well as a singer.", "This is the most exciting game I've ever seen.", "Seoul is bigger than any other city in Korea.", "My score was higher than his.", "She is the more famous of all the actors."], "a": 4, "e": "⑤ of all → the most famous"}, {"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nToday is ①as ②hot ③than yesterday, but tomorrow will be ④even ⑤hotter.", "o": ["as", "hot", "than", "even", "hotter"], "a": 2, "e": "as 원급 as → as"}, {"k": "fx", "q": "He is taller than any other boys in his class.", "w": "boys", "a": ["boy"], "e": "any other + 단수명사"}, {"k": "fx", "q": "She danced as graceful as a swan.", "w": "graceful", "a": ["gracefully"], "e": "동사 danced 수식 → 부사"}, {"k": "fx", "q": "This is the more expensive car in the showroom.", "w": "more", "a": ["most"], "e": "in the showroom(범위) → the most"}, {"k": "pk", "q": "Of the two plans, I like the [better*/best] one.", "e": "둘 중 → the 비교급"}, {"k": "pk", "q": "No other city in Korea is [larger*/largest] than Seoul.", "e": "No other ~ 비교급 than"}, {"k": "ox", "q": "This road is not as wide as that one.", "a": true, "e": "not as 원급 as ✔"}, {"k": "ox", "q": "He is the most fastest runner on the team.", "a": false, "e": "the fastest"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nAmong all the planets in the solar system, Jupiter is ①the ②most large. It is ③much bigger ④than Earth, and no other planet is as ⑤heavy as Jupiter.", "o": ["the", "most large", "much bigger", "than", "heavy"], "a": 1, "e": "large의 최상급 → largest"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Health is more important than anything else.\nⓑ She is the smarter of the two girls.\nⓒ This is the most delicious cake of the bakery.\nⓓ He can't run as fast as his brother.\nⓔ The Nile is longer than any other rivers in the world.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ 장소 → in the bakery / ⓔ river"}, {"k": "fx", "q": "Nothing is more precious as time.", "w": "as", "a": ["than"], "e": "비교급 + than"}, {"k": "fx", "q": "No other planet in our solar system is as hot than Venus.", "w": "than", "a": ["as"], "e": "as 원급 as"}, {"k": "fx", "q": "The second exam was much easiest than the first.", "w": "easiest", "a": ["easier"], "e": "than 앞 → 비교급"}, {"k": "wr", "q": "그녀는 반에서 다른 어떤 학생보다 더 열심히 공부한다. (harder than, any other student, in her class)", "a": ["She studies harder than any other student in her class."], "e": "비교급 than any other + 단수"}, {"k": "or", "q": "둘 중에서 이 가방이 더 가볍다.", "a": "This bag is the lighter of the two.", "e": "the 비교급 of the two"}, {"k": "pk", "q": "This is the [most*/more] beautiful beach I have ever visited.", "e": "최상급 + I have ever p.p."}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe ①oldest tree in the park is ②more than 500 years old. It is ③taller than any other ④trees around it, and it looks ⑤as strong as ever.", "o": ["oldest", "more than", "taller", "trees", "as strong"], "a": 3, "e": "any other + 단수명사 → tree"}, {"k": "ox", "q": "This bridge is three times as long as that one.", "a": true, "e": "배수사 + as 원급 as ✔"}]}}, {"tag": "eos-2-U04-P2", "name": "비교 대상의 병렬구조", "talk": [{"k": "m", "t": "than·as **뒤**에 밑줄? **무엇과 무엇을 비교하는지** 찾아서 모양을 맞춰요 ⚖️"}, {"k": "m", "t": "① 명사 ↔ 명사: 반복되는 명사는 that(단수)·those(복수), 소유는 mine·his·Tom's → My bag is heavier than [yours]."}, {"k": "q", "q": "The roads in Seoul are wider than ____ in my town.", "o": ["that", "those", "them"], "a": 1, "ok": "맞아요! roads(복수) → those", "no": "비교 대상 roads가 복수 → those"}, {"k": "m", "t": "② 동명사 ↔ 동명사, to부정사 ↔ to부정사: Walking is healthier than [driving]."}, {"k": "q", "q": "To read books is better than ____ TV all day.", "o": ["watch", "to watch", "watched"], "a": 1, "ok": "정확해요! To read와 병렬", "no": "앞이 to부정사 주어 → to watch"}, {"k": "m", "t": "③ 동사 ↔ 동사: 뒤의 동사가 반복되면 **대동사** do·does·did / be동사 / 조동사로 받아요 → She runs faster than I [do]."}, {"k": "q", "q": "He speaks English better than his sister ____.", "o": ["is", "does", "speaks to"], "a": 1, "ok": "맞아요! 일반동사 speaks → does", "no": "speaks(일반동사, 3인칭 단수 현재) → does"}, {"k": "m", "t": "⚠️ 대동사는 **앞 동사의 종류·시제**에 맞춰요: She is taller than I am. / He worked harder than we did."}, {"k": "m", "t": "⚠️ 비교 대상 함정: The price of this car is higher than that car. ✗ → than that of that car (가격 ↔ 가격)"}, {"k": "m", "t": "정리! **than·as 뒤 = 앞의 비교 대상과 같은 모양(that/those, 소유대명사, -ing, to-v, 대동사)** 👍"}], "notes": {"table": [["비교 대상", "than·as 뒤", "예"], ["단수명사 반복", "that (of)", "The climate of A is milder than that of B."], ["복수명사 반복", "those (of)", "The streets of A are cleaner than those of B."], ["소유물", "mine, yours, his, Tom's", "Her answer is better than mine."], ["동명사 / to부정사", "같은 모양", "Reading is more fun than watching TV."], ["일반동사 반복", "do / does / did", "He eats more than I do."], ["be동사·조동사 반복", "am·is·are·was / can·will", "I was as tired as she was."]], "tips": ["'무엇의 무엇'을 비교하는지 끝까지 확인 (가격 ↔ 가격)", "대동사 시제는 비교 대상의 시제에 맞춤", "than me / than I do 모두 가능 — than I am(be동사)인지 do인지 앞 동사로 결정"]}, "sets": {"workbook": [{"k": "pk", "q": "Her hair is longer than [mine*/me].", "e": "머리카락 ↔ 내 머리카락 → mine"}, {"k": "pk", "q": "Swimming is more fun than [running*/to run].", "e": "Swimming(동명사)과 병렬"}, {"k": "pk", "q": "The weather in Jeju is warmer than [that*/those] in Seoul.", "e": "weather(단수) → that"}, {"k": "pk", "q": "My dad gets up earlier than my mom [does*/is].", "e": "gets(일반동사) → does"}, {"k": "fx", "q": "The houses in this village are older than that in the city.", "w": "that", "a": ["those"], "e": "houses(복수) → those"}, {"k": "fx", "q": "He studies harder than his brother is.", "w": "is", "a": ["does"], "e": "studies(일반동사) → does"}, {"k": "fx", "q": "Your idea is better than him.", "w": "him", "a": ["his"], "e": "네 생각 ↔ 그의 생각 → his"}, {"k": "ox", "q": "She was more tired than I was.", "a": true, "e": "was ↔ was ✔"}, {"k": "ox", "q": "The price of gold is higher than silver.", "a": false, "e": "가격 ↔ 가격 → that of silver"}, {"k": "bl", "q": "나의 컴퓨터는 네 것보다 더 빠르다. → My computer is faster than (yours).", "e": "소유대명사"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe population of Tokyo is ①larger than ②those of Seoul, and the streets of Tokyo are ③busier than ④those of ⑤most cities.", "o": ["larger", "those", "busier", "those", "most"], "a": 1, "e": "population(단수) → that"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He can swim better than I can.", "Eating out is more expensive than cooking at home.", "My room is cleaner than my brother's.", "The climate here is milder than that of Canada.", "She types faster than I am."], "a": 4, "e": "⑤ types(일반동사) → do"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nSome people think ①that ②reading a book is more relaxing than ③watch a movie, but my friends ④enjoy movies more than I ⑤do.", "o": ["that", "reading", "watch", "enjoy", "do"], "a": 2, "e": "reading과 병렬 → watching"}, {"k": "fx", "q": "My sister's voice is softer than me.", "w": "me", "a": ["mine"], "e": "목소리 ↔ 내 목소리 → mine"}, {"k": "fx", "q": "She cooks better than her mother is.", "w": "is", "a": ["does"], "e": "cooks(일반동사) → does"}, {"k": "fx", "q": "The rooms in this hotel are bigger than that in my house.", "w": "that", "a": ["those"], "e": "rooms(복수) → those"}, {"k": "pk", "q": "Riding a bike is safer than [riding*/ride] a motorcycle.", "e": "Riding과 병렬"}, {"k": "pk", "q": "My brother has more books than I [do*/am].", "e": "has(일반동사) → do"}, {"k": "ox", "q": "The cars in Germany are more expensive than those in Korea.", "a": true, "e": "cars(복수) → those ✔"}, {"k": "ox", "q": "He was more surprised than we did.", "a": false, "e": "was(be동사) → were"}], "practiceB": [{"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nIn many ways, ①living in a small town is better than ②living in a big city. The air in small towns is ③cleaner than ④those in cities, and people there seem to be friendlier than city people ⑤are.", "o": ["living", "living", "cleaner", "those", "are"], "a": 3, "e": "air(단수) → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ His voice is louder than mine.\nⓑ Playing outside is better than to play r** = not ~ any longer (더 이상 ~않다) / **no more than** = only (겨우) / **no less than** = as much as (~만큼이나)"}, {"k": "q", "q": "'He has no more than 1,000 won.'의 뜻은?", "o": ["그는 겨우 1,000원을 가지고 있다.", "그는 1,000원이나 가지고 있다.", "그는 1,000원 이상 가지고 있다."], "a": 0, "ok": "정확해요! no more than = only", "no": "no more than = 겨우(only)"}, {"k": "m", "t": "④ **as + 원급 + as possible** = as + 원급 + as + 주어 + can(과거면 could) / 배수사는 맨 앞: twice as big as"}, {"k": "m", "t": "⑤ **prefer A to B**(to 뒤 명사·-ing), **would rather A than B**(A·B 모두 원형), **superior / inferior / senior / junior + to**"}, {"k": "q", "q": "I would rather stay home than ____ out in the rain.", "o": ["go", "going", "to go"], "a": 0, "ok": "맞아요! would rather A than B → 원형", "no": "would rather 원형 than 원형 → go"}, {"k": "m", "t": "🎉 Chapter 14 비교구문 밑줄 끝! **형태 짝 → 비교 대상 병렬 → 관용 표현 모양** 순서로 체크해요 👍"}], "notes": {"table": [["표현", "뜻", "예"], ["The 비교급 ~, the 비교급 …", "~할수록 더 …하다", "The more you read, the more you learn."], ["비교급 and 비교급 / more and more 원급", "점점 더 ~한", "It's getting hotter and hotter."], ["as 원급 as possible = as 원급 as 주어 can", "가능한 한 ~하게", "He ran as fast as he could."], ["배수사 + as 원급 as", "~보다 몇 배 …한", "three times as long as"], ["no longer / no more than / no less than", "더 이상 ~않다 / 겨우 / ~만큼이나", "She no longer lives here."], ["prefer A to B / would rather A than B", "B보다 A를 더 좋아하다 / B하느니 차라리 A하다", "I prefer tea to coffee."], ["superior·inferior·senior·junior + to", "~보다 우수한·열등한·연상의·연하의", "He is senior to me."]], "tips": ["The 비교급 구문의 두 번째 the를 빠뜨리지 않기", "as ~ as 주어 can: 시제 맞추기 (과거 → could)", "-ior 비교급은 than ✗ → to"]}, "sets": {"workbook": [{"k": "pk", "q": "The more you read, the [more*/most] you learn.", "e": "the 비교급, the 비교급"}, {"k": "pk", "q": "It's getting [colder and colder*/cold and cold].", "e": "비교급 and 비교급"}, {"k": "pk", "q": "He ran as fast as he [could*/can] to catch the bus.", "e": "과거 ran → could"}, {"k": "pk", "q": "I prefer tea [to*/than] coffee.", "e": "prefer A to B"}, {"k": "fx", "q": "The harder you study, better grades you will get.", "w": "better", "a": ["the better"], "e": "the 비교급, the 비교급"}, {"k": "fx", "q": "This bag is superior than that one in quality.", "w": "than", "a": ["to"], "e": "superior to"}, {"k": "fx", "q": "She doesn't live here no longer.", "w": "no", "a": ["any"], "e": "not ~ any longer = no longer"}, {"k": "ox", "q": "My room is twice as large as yours.", "a": true, "e": "배수사 + as 원급 as ✔"}, {"k": "ox", "q": "I'd rather walk than taking a taxi.", "a": false, "e": "would rather A than B → take"}, {"k": "bl", "q": "그 노래는 점점 더 인기를 얻었다. → The song became more and (more) popular.", "e": "more and more + 원급"}], "practiceA": [{"k": "ch", "q": "다음 문장의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①The longer you wait, ②the ③hard it will be ④to make a decision, so decide ⑤as soon as possible.", "o": ["The longer", "the", "hard", "to make", "as soon as possible"], "a": 2, "e": "the 비교급 → the harder"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The sooner, better.", "He is two years senior to me.", "This room is three times as big as mine.", "I prefer swimming to running.", "She would rather read than watch TV."], "a": 0, "e": "① The sooner, the better."}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe city ①is getting ②more and more ③crowded, and the traffic is becoming ④worse and worse. ⑤More people move here, the more problems we face.", "o": ["is getting", "more and more", "crowded", "worse and worse", "More"], "a": 4, "e": "the 비교급, the 비교급 → The more"}, {"k": "fx", "q": "Please reply as quickly as possibly.", "w": "possibly", "a": ["possible"], "e": "as 원급 as possible"}, {"k": "fx", "q": "My score was inferior than his.", "w": "than", "a": ["to"], "e": "inferior to"}, {"k": "fx", "q": "The more he ate, the fat he became.", "w": "fat", "a": ["fatter"], "e": "the 비교급"}, {"k": "pk", "q": "I would rather [stay*/staying] home than go out tonight.", "e": "would rather + 원형"}, {"k": "pk", "q": "This bridge is [three times as long*/as three times long] as that one.", "e"
