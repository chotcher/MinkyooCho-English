 the bus, and it is often ③as fast. My friends who walk feel more energetic than ④that who take the bus ⑤do.", "o": ["healthier", "taking", "as fast", "that", "do"], "a": 3, "e": "비교 대상 friends(복수, 사람) → those"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The more you exercise, the stronger you become.", "Her English is better than mine.", "This is the tallest building in the city.", "I would rather walk than take a taxi.", "The air in the city is dirtier than those in the country."], "a": 4, "e": "⑤ air(단수) → that"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["No other girl in her class is as smart as Yuna.", "He is the strongest of his family.", "My bag is heavier as yours.", "The busier I am, happier I feel.", "This is more cheaper than that."], "a": 0, "e": "② in his family ③ than ④ the happier ⑤ cheaper"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe Pacific Ocean is ①the largest ocean on Earth. It is about ②twice as large as the Atlantic Ocean, and its deepest part is ③deep than ④any other place on Earth's ⑤surface.", "o": ["the largest", "twice as large", "deep", "any other place", "surface"], "a": 2, "e": "than 앞 → deeper"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe sings better than I ____.\nThe climate of Busan is milder than ____ of Seoul.", "o": ["am – those", "do – that", "do – those", "am – that", "did – those"], "a": 1, "e": "sings → do / climate(단수) → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Of the two, Jun is the faster.\nⓑ I prefer reading to watching TV.\nⓒ He tried as hard as he could.\nⓓ It's getting more and more expensive.\nⓔ She is senior than me.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ senior to"}, {"k": "ch", "q": "어법상 틀린 부분을 바르게 고친 것은?\nThe more you practice, the best you will play.", "o": ["best → better", "practice → practices", "you will → will you", "The more → More", "play → playing"], "a": 0, "e": "the 비교급 → the better"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①The more books you read, ②the wider your knowledge becomes. Reading is also ③more relaxing than ④watching videos, because it is less tiring for your eyes than videos ⑤do.", "o": ["The more", "the wider", "more relaxing", "watching", "do"], "a": 4, "e": "is(be동사) 비교 → are"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy grandfather ①no longer drives. He says that ②walking is ③more safer than driving, and he walks ④as much as ⑤possible.", "o": ["no longer", "walking", "more safer", "as much as", "possible"], "a": 2, "e": "more + -er ✗ → safer"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '이 탑은 저 건물보다 세 배 높다.'", "o": ["This tower is as three times high as that building.", "This tower is three times as high as that building.", "This tower is three times as higher as that building.", "This tower is three times higher as that building.", "This tower is higher three times than that building."], "a": 1, "e": "배수사 + as 원급 as"}, {"k": "ch", "q": "어법상 틀린 문장의 개수는?\nⓐ His room is bigger than me.\nⓑ The sooner, the better.\nⓒ This is the most hottest day.\nⓓ I'd rather stay than leaving.\nⓔ She is taller than any other students.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐ mine / ⓒ the hottest / ⓓ leave / ⓔ student"}, {"k": "ch", "q": "다음 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nSome people say that ①learn a foreign language is harder than ②learning math, but I think math is ③much more difficult than languages ④are. The more I study math, ⑤the more confused I get.", "o": ["learn", "learning", "much more difficult", "are", "the more confused"], "a": 0, "e": "주어 자리 + learning math와 병렬 → learning"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["My dog is as big as yours.", true], ["He is more taller than his dad.", false], ["This is the best movie of the year.", true], ["No other river is longer than the Nile.", true], ["She is smarter than any other girls in her class.", false], ["My hair is longer than my sister's.", true], ["The weather here is hotter than those in Seoul.", false], ["He studies harder than I do.", true], ["The more you sleep, the lazier you get.", true], ["It's getting dark and darker.", false], ["I prefer rice to bread.", true], ["He no longer smokes.", true]], "e": "ⓑ taller ⓔ girl ⓖ that ⓙ darker and darker"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Of the two, this one is the cheaper.", true], ["This road is as narrow than that one.", false], ["Playing sports is more fun than watching them.", true], ["She was more tired than I did.", false], ["The prices in this shop are lower than those in that shop.", true], ["The harder you try, the more you succeed.", true], ["This box is twice as heavy as that one.", true], ["He would rather sleep than eating.", false], ["Your idea is superior than mine.", false], ["Run as fast as you can.", true], ["It is the most beautiful place I have ever seen.", true], ["My phone is newer than his.", true]], "e": "ⓑ as narrow as ⓓ was ⓗ eat ⓘ superior to"}]}}, {"book": "eos", "chapter": {"id": "15", "name": "밑줄·v-ing/p.p.", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 05 v-ing/p.p. 밑줄"}, "units": [{"tag": "eos-2-U05-P1", "name": "능동·수동 구별", "talk": [{"k": "m", "t": "PART 2는 **밑줄 어법**! 밑줄 친 말이 맞는지 틀렸는지 판단해요. Unit 05는 밑줄이 **v-ing / p.p.**에 그어진 경우 ✏️"}, {"k": "m", "t": "첫 질문은 늘 같아요: **이 분사와 관계있는 명사가 그 동작을 하나(능동 → v-ing), 당하나(수동 → p.p.)?**"}, {"k": "m", "t": "① 명사 수식: **꾸밈받는 명사**가 기준 → the issues [discussed] at the meeting (문제들이 논의됨)"}, {"k": "q", "q": "The number of students ____ abroad has increased. (해외에서 공부하는)", "o": ["studying", "studied", "study"], "a": 0, "ok": "맞아요! 학생들이 공부함(능동) → studying", "no": "학생들이 '공부하는' 쪽 → 현재분사 studying"}, {"k": "m", "t": "② 분사구문: 생략된 **주절의 주어**가 기준 → **Seen** from space, the earth looks blue. (지구가 보임) / **Walking** home, I met Jake. (내가 걸음)"}, {"k": "q", "q": "____ in simple English, the book is easy to read.", "o": ["Writing", "Written", "Write"], "a": 1, "ok": "정확해요! 책이 쓰임 → Written", "no": "주절 주어 the book은 '쓰인' 쪽 → Written"}, {"k": "m", "t": "③ 목적격보어: **목적어**가 기준 → I heard my name [called]. (내 이름이 불림)"}, {"k": "m", "t": "④ 감정 분사: 감정을 **일으키면 v-ing**, **느끼면 p.p.** → The results were [disappointing]. / We were disappointed."}, {"k": "m", "t": "풀이 전략: 분사 뒤에 **목적어**가 있으면 v-ing, **by + 행위자**가 있거나 목적어가 없으면 p.p.를 의심 → 그래도 마지막엔 꼭 **의미**로 확인! (자동사 p.p.는 '완료': fallen leaves)"}, {"k": "m", "t": "정리! **기준 명사(꾸밈받는 명사·주절 주어·목적어)가 하면 v-ing, 당하면 p.p.** 👍"}], "notes": {"table": [["자리", "기준", "v-ing (능동)", "p.p. (수동)"], ["명사 수식", "꾸밈받는 명사", "a girl holding a cup", "a cup held by a girl"], ["분사구문", "주절의 주어", "Looking up, I saw a rainbow.", "Surrounded by fans, the singer smiled."], ["목적격보어", "목적어", "I saw him leaving.", "I had my bag checked."], ["감정 분사", "감정의 원인 / 느끼는 쪽", "a boring lecture", "bored students"]], "tips": ["분사 뒤에 목적어가 있음 → v-ing 쪽", "by + 행위자 → p.p. 쪽", "자동사 p.p.는 수동이 아니라 완료: fallen, retired, grown", "with + 명사 + 분사도 명사 기준: with his eyes closed"]}, "sets": {"workbook": [{"k": "pk", "q": "The bridge [connecting*/connected] the two islands was built in 2010.", "e": "다리가 두 섬을 연결함 + 뒤에 목적어 → connecting"}, {"k": "pk", "q": "Most of the products [selling/sold*] online are cheaper than those in stores.", "e": "제품이 팔림 → sold"}, {"k": "pk", "q": "[Leaving*/Left] the house, she realized she had forgotten her keys.", "e": "그녀가 집을 떠남 → Leaving"}, {"k": "pk", "q": "[Leaving/Left*] alone at home, the puppy began to cry.", "e": "강아지가 혼자 남겨짐 → Left"}, {"k": "pk", "q": "I found the movie [confusing*/confused].", "e": "목적어(영화)가 혼란을 줌 → confusing"}, {"k": "bl", "q": "그 회의에서 내려진 결정은 최종적이었다. → The decision (made) at the meeting was final.", "e": "결정이 내려짐 → made"}, {"k": "bl", "q": "위에서 보면, 그 섬은 하트처럼 보인다. → (Seen|Viewed) from above, the island looks like a heart.", "e": "섬이 보임 → Seen"}, {"k": "fx", "q": "There are many problems causing by climate change.", "w": "causing", "a": ["caused"], "e": "문제들이 야기됨(by) → caused"}, {"k": "fx", "q": "Exciting about the trip, the children could not sleep.", "w": "Exciting", "a": ["Excited"], "e": "아이들이 신이 남(감정을 느낌) → Excited"}, {"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe letters ①written by soldiers during the war ②were found in a box ③hidden under the floor. Some of the letters were so ④moved that the researchers felt ⑤touched.", "o": ["written", "were", "hidden", "moved", "touched"], "a": 3, "e": "④ 편지가 감동을 줌 → moving / ⑤ 연구자들이 감동을 느낌 → touched ✔"}], "practiceA": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①Located in the center of the city, the hotel is popular with tourists ②visiting Seoul. The rooms ③facing the river are more expensive, but the view is ④amazed. Guests ⑤staying for a week get a discount.", "o": ["Located", "visiting", "facing", "amazed", "staying"], "a": 3, "e": "④ 경치가 놀라움을 줌 → amazing"}, {"k": "fx", "q": "The data collecting from the survey showed a clear pattern.", "w": "collecting", "a": ["collected"], "e": "자료가 수집됨 → collected"}, {"k": "fx", "q": "Shocking by the news, she couldn't say a word.", "w": "Shocking", "a": ["Shocked"], "e": "그녀가 충격을 받음 → Shocked"}, {"k": "pk", "q": "Please keep your seat belt [fastening/fastened*] while the sign is on.", "e": "목적어(안전벨트)가 매어짐 → fastened"}, {"k": "pk", "q": "Have you ever read a novel [writing/written*] in Spanish?", "e": "소설이 쓰임 → written"}, {"k": "ox", "q": "Built over 500 years ago, the temple still attracts many visitors.", "a": true, "e": "✔ 절이 지어짐 → Built"}, {"k": "ox", "q": "I had my wallet stealing on the subway.", "a": false, "e": "지갑이 도난당함 → stolen"}, {"k": "bl", "q": "그녀는 팔짱을 낀 채로 서 있었다. → She stood with her arms (folded).", "e": "팔이 접힘 → folded"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The boy injured in the accident is recovering well.", "Feeling tired, I went to bed early.", "I heard my name called.", "The students were bored with the long speech.", "Writing in a hurry, the report had many mistakes."], "a": 4, "e": "⑤ 보고서가 쓰임 → Written"}, {"k": "wr", "q": "중국에서 만들어진 장난감들은 싸다. (toys, make, in China, cheap)", "a": ["Toys made in China are cheap.", "The toys made in China are cheap."], "e": "장난감이 만들어짐 → made"}], "practiceB": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMany people ①living in big cities suffer from stress ②caused by noise. ③Exposing to loud sounds for a long time, they may have trouble sleeping. Experts recommend keeping windows ④closed at night and listening to ⑤relaxing music.", "o": ["living", "caused", "Exposing", "closed", "relaxing"], "a": 2, "e": "③ 사람들이 소음에 노출됨 → Exposed"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The house surrounded by tall trees belongs to my aunt.\nⓑ Compared to his brother, he is very quiet.\nⓒ The rumor spreading online turned out to be false.\nⓓ I found the box opening when I came home.\nⓔ The audience was boring by the long film.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ 상자가 열림 → opened / ⓔ 관객이 지루함을 느낌 → bored"}, {"k": "fx", "q": "Frightening by the loud noise, the cat ran under the bed.", "w": "Frightening", "a": ["Frightened"], "e": "고양이가 겁을 먹음 → Frightened"}, {"k": "fx", "q": "The novel, translating into 20 languages, became a worldwide bestseller.", "w": "translating", "a": ["translated"], "e": "소설이 번역됨 → translated"}, {"k": "fx", "q": "I could hear the rain falling and the wind blown outside.", "w": "blown", "a": ["blowing"], "e": "바람이 붐(능동) → blowing"}, {"k": "pk", "q": "The man [wearing*/worn] a black suit is the CEO.", "e": "남자가 정장을 입음 + 목적어 → wearing"}, {"k": "pk", "q": "The kids were [fascinating/fascinated*] by the magic show.", "e": "아이들이 매료됨 → fascinated"}, {"k": "bl", "q": "그 소식에 실망해서 그녀는 울기 시작했다. → (Disappointed) at the news, she began to cry.", "e": "그녀가 실망을 느낌 → Disappointed"}, {"k": "or", "q": "멀리서 보면 그 바위는 사람 얼굴처럼 보인다.", "a": "Seen from a distance, the rock looks like a human face.", "e": "바위가 보임 → Seen"}, {"k": "wr", "q": "나는 그 책이 흥미롭다는 것을 알게 되었다. (find, the book, interesting)", "a": ["I found the book interesting."], "e": "목적어(책)가 흥미를 줌 → interesting"}]}}, {"tag": "eos-2-U05-P2", "name": "동사 자리 vs. 준동사 자리", "talk": [{"k": "m", "t": "밑줄이 동사 모양(v-ing / p.p. / 시제 있는 동사)에 있으면 먼저 **문장의 진짜 동사(정동사)가 몇 개인지** 세어 보세요 🔢"}, {"k": "m", "t": "규칙: 접속사·관계사가 없으면 **한 문장에 정동사는 하나**! 이미 동사가 있으면 나머지는 **준동사(v-ing, p.p., to-v)** 자리예요"}, {"k": "ex", "en": "The woman talking to my mom is our new neighbor.", "ko": "엄마와 이야기하고 있는 여자는 우리 새 이웃이다. (정동사 is 하나, talking은 준동사)"}, {"k": "q", "q": "The workers ____ the road were wearing helmets.", "o": ["repaired", "repairing", "repair"], "a": 1, "ok": "맞아요! 정동사 were가 이미 있으니 준동사 → repairing", "no": "were가 정동사예요. 남은 자리는 준동사 + 일꾼이 수리함 → repairing"}, {"k": "m", "t": "반대로 **정동사가 하나도 없으면** 그 자리엔 시제 있는 **동사**가 와야 해요 → The tall man in the photo **holding** a trophy. ✗ → holds"}, {"k": "m", "t": "괄호 치기 전략: 주어 뒤 **수식어(전치사구, 분사구, 관계절)를 괄호로 묶고**, 남은 뼈대에 동사가 있는지 확인!"}, {"k": "ex", "en": "Most students who take the course find it useful.", "ko": "그 수업을 듣는 대부분의 학생들은 그것이 유용하다고 생각한다. (관계사 1개 → 정동사 take, find 2개)"}, {"k": "m", "t": "공식: **접속사·관계사 수 + 1 = 정동사 수**. 관계사가 하나면 동사는 [two]!"}, {"k": "q", "q": "The boy who won the race ____ my cousin.", "o": ["being", "is", "to be"], "a": 1, "ok": "정확해요! 관계사 who 1개 → 정동사 won, is", "no": "who가 있으니 정동사 2개 필요 → won + is"}, {"k": "m", "t": "정리! **정동사 개수 = 접속사·관계사 + 1 / 넘치면 준동사로, 모자라면 동사로** 👍"}], "notes": {"table": [["상황", "밑줄 자리에 올 말", "예"], ["정동사가 이미 있음", "v-ing / p.p. / to-v", "The girl (dancing on the stage) is my sister."], ["정동사가 없음", "시제 있는 동사", "The girl on the stage dances well."], ["관계사·접속사 1개", "정동사 2개", "The book that I bought was boring."], ["관계사·접속사 2개", "정동사 3개", "I think that the man who lives here is kind."]], "tips": ["주어 뒤 수식어(전치사구·분사구·관계절)를 괄호로 묶기", "관계절 안 동사와 주절 동사를 따로 세기", "분사구문(콤마 앞)은 준동사, 콤마 뒤 주절에 정동사"]}, "sets": {"workbook": [{"k": "pk", "q": "The students [attended/attending*] the seminar received a certificate.", "e": "정동사 received가 있음 → attending"}, {"k": "pk", "q": "The tall building across the street [is*/being] a hospital.", "e": "정동사가 없음 → is"}, {"k": "pk", "q": "Anyone [wanted/wanting*] to join the club should fill out this form.", "e": "정동사 should fill → wanting"}, {"k": "pk", "q": "The books on the top shelf [belong*/belonging] to my grandfather.", "e": "정동사가 없음 → belong"}, {"k": "fx", "q": "The man lives next door works as a firefighter.", "w": "lives", "a": ["living"], "e": "정동사 works가 있음 → living (= who lives)"}, {"k": "fx", "q": "The cookies baked by my mom tasting great.", "w": "tasting", "a": ["taste", "tasted"], "e": "정동사가 없음 → taste(d)"}, {"k": "fx", "q": "Many people visited the festival last year left positive reviews.", "w": "visited", "a": ["visiting"], "e": "정동사 left가 있음 → visiting"}, {"k": "bl", "q": "벽에 걸린 그 그림은 비싸다. → The painting (hanging|hung) on the wall is expensive.", "e": "정동사 is → 준동사"}, {"k": "ox", "q": "The children playing in the park look happy.", "a": true, "e": "✔ playing(준동사) + look(정동사)"}, {"k": "ox", "q": "A woman carried a large box got on the bus.", "a": false, "e": "정동사 got → carrying"}], "practiceA": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe scientists ①studying the ancient city ②discovered a tunnel ③leading to an underground room. The objects ④found inside the room ⑤revealing a lot about daily life at that time.", "o": ["studying", "discovered", "leading", "found", "revealing"], "a": 4, "e": "⑤ 두 번째 문장에 정동사가 없음 → revealed"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["People who exercise regularly sleep better.", "The car parked in front of my house belongs to Mr. Kim.", "The players on the team practicing every day.", "The girl sitting next to me borrowed my pen.", "Anyone breaking the rules will be punished."], "a": 2, "e": "③ 정동사가 없음 → practice"}, {"k": "fx", "q": "The road connected the two towns was closed because of snow.", "w": "connected", "a": ["connecting"], "e": "정동사 was closed가 있음 + 길이 연결함 → connecting"}, {"k": "fx", "q": "The dishes served at this restaurant being very spicy.", "w": "being", "a": ["are", "were"], "e": "정동사가 없음 → are"}, {"k": "pk", "q": "The man who [repaired*/repairing] my car charged me too much.", "e": "관계사 who → 정동사 2개(repaired, charged)"}, {"k": "pk", "q": "Students ue], ["The teacher allowed us leave early.", false], ["I was sad to hear the news.", true], ["We decided not to go.", true]], "e": "ⓓ for children ⓔ was made to wait ⓗ have ⓙ to leave"}]}}, {"book": "eos", "chapter": {"id": "17", "name": "밑줄·전치사/접속사", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 07 전치사/접속사 밑줄"}, "units": [{"tag": "eos-2-U07-P1", "name": "전치사, 접속사 자리 구별", "talk": [{"k": "m", "t": "밑줄이 because / because of, although / despite 같은 말에 있으면 **바로 뒤에 오는 것**을 보세요 👀"}, {"k": "m", "t": "**전치사 + 명사(구)·v-ing** / **접속사 + 주어 + 동사(절)** — 뒤에 시제 있는 동사가 있으면 접속사, 없으면 전치사!"}, {"k": "ex", "en": "We stayed inside because of the rain. / We stayed inside because it was raining.", "ko": "비 때문에 우리는 안에 머물렀다. / 비가 오고 있었기 때문에 우리는 안에 머물렀다."}, {"k": "q", "q": "____ the heavy traffic, we arrived on time.", "o": ["Although", "Despite", "Because"], "a": 1, "ok": "맞아요! 뒤에 명사구 → 전치사 Despite", "no": "the heavy traffic은 명사구(동사 없음) → 전치사 Despite"}, {"k": "m", "t": "짝꿍 정리: because ↔ **because of, due to** / although, though ↔ **despite, in spite of** / while ↔ **during** — 왼쪽은 절, 오른쪽은 명사구"}, {"k": "q", "q": "I fell asleep ____ the movie.", "o": ["while", "during", "because"], "a": 1, "ok": "정확해요! the movie(명사) → during", "no": "뒤에 명사만 있으니 전치사 during"}, {"k": "m", "t": "⚠️ 함정: 명사구가 **길면** 절처럼 보여요 → despite **the fact that** + 절 ✔ / because of **what he said** ✔ (명사절도 명사!)"}, {"k": "m", "t": "⚠️ **despite of** ✗ (despite는 of 없이) / in spite [of] ✔"}, {"k": "m", "t": "풀이 전략: 밑줄 뒤에서 다음 쉼표나 문장 끝까지 **시제 있는 동사를 찾기** → 있으면 접속사, 없으면 전치사 ✔️"}, {"k": "m", "t": "정리! **절 앞은 접속사(because, although, while) / 명사구 앞은 전치사(because of, despite, during)** 👍"}], "notes": {"table": [["의미", "접속사 + 절", "전치사 + 명사(구)"], ["~ 때문에", "because, since, as", "because of, due to, owing to"], ["~에도 불구하고", "although, though, even though", "despite, in spite of"], ["~하는 동안", "while", "during"], ["~하는 경우에", "in case", "in case of"]], "tips": ["before, after, since, until은 전치사·접속사 둘 다 가능", "despite of ✗ / in spite of ✔", "the fact that + 절은 명사구 → despite the fact that ✔"]}, "sets": {"workbook": [{"k": "pk", "q": "[Because/Because of*] the noise, I couldn't sleep.", "e": "뒤에 명사구 → Because of"}, {"k": "pk", "q": "[Although*/Despite] she was sick, she went to school.", "e": "뒤에 절 → Although"}, {"k": "pk", "q": "He called me [while*/during] I was taking a shower.", "e": "뒤에 절 → while"}, {"k": "pk", "q": "The game was canceled [due to*/because] the storm.", "e": "뒤에 명사구 → due to"}, {"k": "fx", "q": "Despite he was tired, he kept working.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "뒤에 절 → Although"}, {"k": "fx", "q": "I learned a lot while my stay in London.", "w": "while", "a": ["during"], "e": "뒤에 명사구 → during"}, {"k": "fx", "q": "Despite of the cold weather, they went camping.", "w": "of", "a": ["(삭제)"], "e": "despite는 of 없이"}, {"k": "bl", "q": "그는 부상에도 불구하고 경주를 끝마쳤다. → He finished the race (despite|in spite of) his injury.", "e": "명사구 앞 → despite"}, {"k": "ox", "q": "Because of it was late, we took a taxi.", "a": false, "e": "뒤에 절 → Because"}, {"k": "ox", "q": "During the summer vacation, I visited my grandparents.", "a": true, "e": "✔ during + 명사구"}], "practiceA": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①Although the tickets were expensive, the concert hall was full. ②Because of the singer's popularity, people came from all over the country. ③During the show, the fans sang along. ④Despite the rain started, nobody left. Everyone was happy ⑤because the show was amazing.", "o": ["Although", "Because of", "During", "Despite", "because"], "a": 3, "e": "④ 뒤에 절(the rain started) → Although"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She smiled although she was sad.", "The flight was delayed because of fog.", "While I was cooking, the phone rang.", "In spite of his efforts, he failed.", "We canceled the picnic because the bad weather."], "a": 4, "e": "⑤ 뒤에 명사구 → because of"}, {"k": "fx", "q": "Although the heavy rain, the match continued.", "w": "Although", "a": ["Despite", "In spite of"], "e": "뒤에 명사구 → Despite"}, {"k": "fx", "q": "During we were on vacation, someone broke into our house.", "w": "During", "a": ["While"], "e": "뒤에 절 → While"}, {"k": "pk", "q": "[While*/During] he was in Paris, he visited many museums.", "e": "뒤에 절 → While"}, {"k": "pk", "q": "Many flights were delayed [because of*/because] the snowstorm.", "e": "뒤에 명사구 → because of"}, {"k": "bl", "q": "나는 그 수업 시간 동안 졸았다. → I dozed off (during) the class.", "e": "명사구 앞 → during"}, {"k": "bl", "q": "그는 가난했지만 행복했다. → (Although|Though|Even though) he was poor, he was happy.", "e": "절 앞 → Although"}, {"k": "ox", "q": "Despite the fact that he was injured, he played the whole game.", "a": true, "e": "✔ despite + the fact that절(명사구)"}, {"k": "wr", "q": "교통 체증 때문에 우리는 늦었다. (because of, the traffic jam, be late)", "a": ["We were late because of the traffic jam.", "Because of the traffic jam, we were late.", "Because of the traffic jam we were late."], "e": "명사구 앞 → because of"}], "practiceB": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①Because the price of food is rising, many families are spending less. ②Despite these difficulties, some people still donate money. ③While the holiday season, donations usually increase. ④Although the economy is weak, charities hope to raise more money ⑤because of the kindness of their supporters.", "o": ["Because", "Despite", "While", "Although", "because of"], "a": 2, "e": "③ 뒤에 명사구 → During"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Although his hard work, he didn't get promoted.\nⓑ The road was closed due to an accident.\nⓒ He stayed calm during the interview.\nⓓ Because she studied hard, she passed.\nⓔ In spite of it was cold, we swam in the sea.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓓ 옳음 / ⓐ Despite / ⓔ Although"}, {"k": "fx", "q": "We had to stop the game because of it started to rain.", "w": "of", "a": ["(삭제)"], "e": "뒤에 절 → because"}, {"k": "fx", "q": "Although his age, he is still very active.", "w": "Although", "a": ["Despite", "In spite of"], "e": "뒤에 명사구 → Despite"}, {"k": "fx", "q": "The store was closed during I was there.", "w": "during", "a": ["while"], "e": "뒤에 절 → while"}, {"k": "pk", "q": "[Despite*/Though] the bad reviews, the movie was a big hit.", "e": "뒤에 명사구 → Despite"}, {"k": "pk", "q": "He couldn't come to the party [because*/because of] he had a cold.", "e": "뒤에 절 → because"}, {"k": "bl", "q": "날씨가 나빴음에도 불구하고 그들은 등산을 갔다. → (Despite|In spite of) the bad weather, they went hiking.", "e": "명사구 앞 → Despite"}, {"k": "or", "q": "그녀는 휴가 동안 책을 다섯 권 읽었다.", "a": "She read five books during the vacation.", "e": "명사구 앞 → during"}, {"k": "wr", "q": "비가 오고 있었기 때문에 우리는 집에 있었다. (because, it was raining, stay home)", "a": ["We stayed home because it was raining.", "Because it was raining, we stayed home.", "Because it was raining we stayed home.", "We stayed at home because it was raining.", "Because it was raining, we stayed at home."], "e": "절 앞 → because"}]}}, {"tag": "eos-2-U07-P2", "name": "주의해야 할 전치사와 접속사", "talk": [{"k": "m", "t": "이번엔 **헷갈리는 전치사·접속사**! 모양은 비슷한데 쓰임이 다른 짝들을 정리해요 ⚖️"}, {"k": "m", "t": "① **like vs alike**: like는 **전치사**(~처럼, ~와 같은) + 명사 / alike는 **형용사·부사**(비슷한, 비슷하게) → 뒤에 목적어 ✗, 명사 앞 ✗"}, {"k": "ex", "en": "She looks like her mother. / The twins look alike.", "ko": "그녀는 엄마를 닮았다. / 그 쌍둥이는 똑같이 생겼다."}, {"k": "q", "q": "My brother and I think ____.", "o": ["like", "alike", "likely"], "a": 1, "ok": "맞아요! 뒤에 목적어 없음 → 부사 alike", "no": "뒤에 명사가 없으니 전치사 like ✗ → alike"}, {"k": "m", "t": "② **by vs until**: by는 **완료** 시점(~까지 끝내기), until은 **계속**(~까지 쭉) → Finish it [by] Friday. / Wait until Friday."}, {"k": "q", "q": "I'll stay here ____ 5 p.m.", "o": ["by", "until", "during"], "a": 1, "ok": "정확해요! 5시까지 쭉 머묾 → until", "no": "머무는 상태가 계속 → until"}, {"k": "m", "t": "③ **whether vs if**(~인지 아닌지): **주어 자리, 전치사 뒤, to-v 앞, or not 바로 앞**에는 **whether만** → It depends on whether he comes."}, {"k": "m", "t": "④ **unless** = if ~ not → 이미 부정이 들어 있으니 unless ~ not ✗ / **as**: 전치사 ~로서 (as a teacher), 접속사 ~할 때·~ 때문에·~하듯이"}, {"k": "q", "q": "____ you hurry, you'll miss the bus.", "o": ["If", "Unless", "Whether"], "a": 1, "ok": "좋아요! 서두르지 않으면 → Unless", "no": "'~하지 않으면' → Unless"}, {"k": "m", "t": "⑤ 짝 접속사: **between A and B, either A or B, neither A nor B, both A and B** → 짝을 바꿔 쓰면 ✗ (between A or B ✗)"}, {"k": "m", "t": "🎉 Chapter 17 전치사/접속사 밑줄 끝! 정리: **like + 명사 / alike는 보어·부사 / by 완료 · until 계속 / whether만 되는 자리 / 짝 접속사** 👍"}], "notes": {"table": [["짝", "구별", "예"], ["like / alike", "like 전치사 + 명사 / alike 형용사·부사", "He is like his dad. / They are alike."], ["by / until", "by 완료 / until 계속", "Return it by Monday. / Stay until Monday."], ["whether / if", "주어·전치사 뒤·to-v 앞·or not 앞은 whether만", "Whether he comes is unclear."], ["unless", "= if ~ not", "Unless you leave now, you'll be late."], ["as", "전치사 ~로서 / 접속사 ~할 때, ~ 때문에, ~하듯이", "She works as a nurse."], ["짝 접속사", "between A and B, either A or B, neither A nor B, both A and B", "Neither he nor I was there."]], "tips": ["alike는 명사 앞 ✗ (an alike house ✗ → a similar house)", "unless ~ not ✗", "if or not ✗ → whether or not", "since: ~ 이래로(전치사·접속사) / ~ 때문에(접속사)"]}, "sets": {"workbook": [{"k": "pk", "q": "The two sisters look [like/alike*].", "e": "뒤에 목적어 없음 → alike"}, {"k": "pk", "q": "You must return the book [by*/until] next Monday.", "e": "반납 완료 → by"}, {"k": "pk", "q": "I'm not sure [whether*/if] or not he will come.", "e": "or not 바로 앞 → whether"}, {"k": "pk", "q": "The choice is between staying here [and*/or] moving to Busan.", "e": "between A and B"}, {"k": "fx", "q": "She sings alike a professional singer.", "w": "alike", "a": ["like"], "e": "뒤에 명사 → 전치사 like"}, {"k": "fx", "q": "Please wait here by I come back.", "w": "by", "a": ["until", "till"], "e": "기다림이 계속 → until"}, {"k": "fx", "q": "If or not you agree, we will start the project.", "w": "If", "a": ["Whether"], "e": "or not 앞·주어 자리 → Whether"}, {"k": "bl", "q": "그는 선생님으로서 20년간 일했다. → He worked (as) a teacher for 20 years.", "e": "~로서 → as"}, {"k": "ox", "q": "Unless you don't study, you will fail the test.", "a": false, "e": "unless ~ not ✗ → Unless you study"}, {"k": "ox", "q": "Neither my sister nor I like spicy food.", "a": true, "e": "✔ neither A nor B"}], "practiceA": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nMy cousin and I are very ①alike. We both like sports, and people say she plays tennis ②like a pro. We have to decide ③whether to join the tennis club ④or the soccer club, and we have to make our choice ⑤until next Friday.", "o": ["alike", "like", "whether", "or", "until"], "a": 4, "e": "⑤ 결정 완료 시점 → by"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Whether he will come is not certain.", "The houses on this street all look like.", "I'll be home by 10 p.m.", "He talks like his father.", "She works as a tour guide."], "a": 1, "e": "② 뒤에 목적어 없음 → alike"}, {"k": "fx", "q": "The movie was boring, but I stayed awake by the end.", "w": "by", "a": ["until", "till"], "e": "깨어 있는 상태 계속 → until"}, {"k": "fx", "q": "The meeting will be held either on Monday and on Tuesday.", "w": "and", "a": ["or"], "e": "either A or B"}, {"k": "pk", "q": "It depends on [whether*/if] the weather is good.", "e": "전치사 뒤 → whether"}, {"k": "pk", "q": "[Unless*/If] it rains, we'll go on a picnic tomorrow. (비가 오지 않으면)", "e": "if ~ not → Unless"}, {"k": "bl", "q": "그 쌍둥이는 생김새는 똑같지만 성격은 다르다. → The twins look (alike), but their personalities are different.", "e": "보어 → alike"}, {"k": "bl", "q": "너는 이 보고서를 금요일까지 끝내야 한다. → You have to finish this report (by) Friday.", "e": "완료 → by"}, {"k": "ox", "q": "Both Tom and Jerry are my friends.", "a": true, "e": "✔ both A and B"}, {"k": "wr", "q": "나는 그가 진실을 말하고 있는지 모르겠다. (I don't know, whether, tell the truth)", "a": ["I don't know whether he is telling the truth.", "I don't know whether he's telling the truth.", "I don't know whether or not he is telling the truth.", "I don't know whether he is telling the truth or not."], "e": "whether + 절"}], "practiceB": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe question of ①whether robots will replace teachers is often discussed. ②Unless teachers keep learning new skills, they may fall behind. Some people say that teachers and robots will work together ③alike partners. Others argue that the difference ④between humans and machines will always matter. Either way, schools must change ⑤as technology develops.", "o": ["whether", "Unless", "alike", "between", "as"], "a": 2, "e": "③ 뒤에 명사 partners → 전치사 like"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wonder if she likes me.\nⓑ You must hand in the paper until noon.\nⓒ Whether you agree or not doesn't matter.\nⓓ He is good at sports alike his brother.\nⓔ Unless you don't hurry, you'll be late.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 1, "e": "ⓐⓒ 옳음 / ⓑ by / ⓓ like / ⓔ Unless you hurry"}, {"k": "fx", "q": "I'm not sure if to accept the offer.", "w": "if", "a": ["whether"], "e": "to-v 앞 → whether"}, {"k": "fx", "q": "The store is open by 9 p.m. every day.", "w": "by", "a": ["until", "till"], "e": "영업 상태 계속 → until"}, {"k": "fx", "q": "Children need to learn the difference between right or wrong.", "w": "or", "a": ["and"], "e": "between A and B"}, {"k": "pk", "q": "She worked [as*/like] an interpreter at the conference. (통역사로서)", "e": "~로서(자격) → as"}, {"k": "pk", "q": "Neither the teacher [nor*/or] the students knew the answer.", "e": "neither A nor B"}, {"k": "bl", "q": "너는 원하지 않으면 올 필요가 없다. → You don't have to come (unless) you want to.", "e": "if ~ not → unless"}, {"k": "or", "q": "그녀는 대학을 졸업한 이후로 여기서 일해 왔다.", "a": "She has worked here since she graduated from college.", "e": "since + 절 (~ 이래로)"}, {"k": "wr", "q": "나는 5시까지 너를 기다릴 것이다. (wait for you, until 5)", "a": ["I will wait for you until 5.", "I'll wait for you until 5.", "I will wait for you until five.", "I'll wait for you until five.", "I will wait for you till 5.", "I'll wait for you till 5."], "e": "계속 → until"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그는 다리 부상에도 불구하고 마라톤을 완주했다. (despite, his leg injury, finish the marathon)", "a": ["He finished the marathon despite his leg injury.", "Despite his leg injury, he finished the marathon.", "Despite his leg injury he finished the marathon."], "e": "명사구 앞 → despite"}, {"k": "wr", "q": "그녀는 피곤했지만 계속 공부했다. (although, tired, keep studying)", "a": ["Although she was tired, she kept studying.", "She kept studying although she was tired.", "Although she was tired she kept studying."], "e": "절 앞 → although"}, {"k": "wr", "q": "나는 방학 동안 수영을 배웠다. (during, the vacation, learn to swim)", "a": ["I learned to swim during the vacation.", "During the vacation, I learned to swim.", "During the vacation I learned to swim.", "I learned how to swim during the vacation.", "I learnt to swim during the vacation."], "e": "명사구 앞 → during"}, {"k": "wr", "q": "그 두 사람은 비슷하게 생각한다. (the two of them, think, alike)", "a": ["The two of them think alike."], "e": "부사 alike"}, {"k": "wr", "q": "너는 이 책을 금요일까지 반납해야 한다. (must, return this book, by Friday)", "a": ["You must return this book by Friday."], "e": "완료 → by"}, {"k": "bl", "q": "그가 올지 안 올지는 중요하지 않다. → (Whether) he comes or not doesn't matter.", "e": "주어 자리 → Whether"}, {"k": "fx", "q": "Because of he was sick, he stayed in bed.", "w": "of", "a": ["(삭제)"], "e": "뒤에 절 → Because"}, {"k": "fx", "q": "She sang during she was cooking dinner.", "w": "during", "a": ["while"], "e": "뒤에 절 → while"}, {"k": "fx", "q": "He looks exactly alike his father.", "w": "alike", "a": ["like"], "e": "뒤에 명사 → like"}, {"k": "or", "q": "네가 지금 떠나지 않으면 기차를 놓칠 것이다.", "a": "Unless you leave now, you will miss the train.", "e": "if ~ not → unless"}], "test": [{"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①Although the town is small, it attracts many visitors. ②During the summer, its beaches are crowded. ③Because of the town's beautiful scenery, many films are shot here. ④Despite it is popular, the town has kept its traditional charm. Visitors often stay ⑤until the festival ends.", "o": ["Although", "During", "Because of", "Despite", "until"], "a": 3, "e": "④ 뒤에 절 → Although(Though)"}, {"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe two brothers look ①like, but their personalities are very different. One acts ②like a leader, while the other is shy. They argue about ③whether to buy a dog ④or a cat. Their parents told them to decide ⑤by Sunday.", "o": ["like", "like", "whether", "or", "by"], "a": 0, "e": "① 뒤에 목적어 없음 → alike"}, {"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\nThe hiking trail was closed ①due to heavy rain. ②While the closure, park rangers repaired the bridges. ③Unless the weather gets worse, the trail will open again next week. Hikers can choose ④between the short route and the long route. ⑤Because the long route is steep, beginners should take the short one.", "o": ["due to", "While", "Unless", "between", "Because"], "a": 1, "e": "② 뒤에 명사구 → During"}, {"k": "ch", "q": "어법상 옳은 문장은?", "o": ["Despite of the rain, we played soccer.", "I'll stay here by you come back.", "Whether or not she agrees, I'll go.", "She was late because the traffic.", "Unless you don't practice, you won't improve."], "a": 2, "e": "③ / ① of 삭제 ② until ④ because of ⑤ Unless you practice"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He fell asleep during the lecture.", "I can't decide whether to go or stay.", "Despite it was late, she kept working.", "The two paintings are very alike.", "I've lived here since I was ten."], "a": 2, "e": "③ 뒤에 절 → Although"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ We stayed indoors because of the heat.\nⓑ He worked as a waiter during college.\nⓒ It depends on if you have time.\nⓓ In spite of feeling sick, she went to school.\nⓔ Neither Mina or Jisu was there.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ on whether / ⓔ nor"}, {"k": "ch", "q": "(A), (B), (C)에 들어갈 말로 바르게 짝지어진 것은?\n(A) ____ the noise, I couldn't concentrate.\nI'll keep the light on (B) ____ you get home.\nThe question is (C) ____ he will accept the job.", "o": ["Because of – until – whether", "Because – until – whether", "Because of – by – whether", "Because – by – if", "Because of – by – if"], "a": 0, "e": "(A) 명사구 → Because of (B) 계속 → until (C) 보어 자리 → whether"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '그 두 가방은 비슷해 보이지만 가격은 매우 다르다.'", "o": ["The two bags look like, but their prices are very different.", "The two bags look alike, but their prices are very different.", "The two bags look likely, but their prices are very different.", "The two alike bags look, but their prices are very different.", "The two bags look alike, despite their prices are very different."], "a": 1, "e": "look alike / 절 앞 despite ✗"}, {"k": "ch", "q": "밑줄 친 ①~⑤ 중 어법상 틀린 것은?\n①Since the new library opened, more students have been studying there. It stays open ②until midnight ③while the exam period. However, you must return borrowed books ④by the due date ⑤if you don't want to pay a fine.", "o": ["Since", "until", "while", "by", "if"], "a": 2, "e": "③ 뒤에 명사구 → during"}, {"k": "fx", "q": "The festival was postponed because the bad weather.", "w": "because", "a": ["because of", "due to"], "e": "뒤에 명사구 → because of"}, {"k": "fx", "q": "Although the difficulties, the team never gave up.", "w": "Although", "a": ["Despite", "In spite of"], "e": "뒤에 명사구 → Despite"}, {"k": "fx", "q": "You must finish the work until tomorrow morning.", "w": "until", "a": ["by"], "e": "완료 시점 → by"}, {"k": "fx", "q": "Neither the manager or the staff knew about the change.", "w": "or", "a": ["nor"], "e": "neither A nor B"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Despite the cold, we went swimming.", true], ["Although his injury, he played well.", false], ["I was bored during the movie.", true], ["Because it was snowing, school was closed.", true], ["She cried while the sad scene.", false], ["The twins look alike.", true], ["He runs alike a cheetah.", false], ["Please finish it by noon.", true], ["I don't know whether to laugh or cry.", true], ["Unless you are busy, let's have lunch.", true], ["Choose between the red one or the blue one.", false], ["She has lived here since 2015.", true]], "e": "ⓑ Despite ⓔ during ⓖ like ⓚ and"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Because of he was late, he missed the bus.", false], ["In spite of the noise, the baby slept.", true], ["I'll wait until you finish.", true], ["Whether he comes doesn't matter.", true], ["Due to the strike, the trains stopped.", true], ["He is interested in if robots can think.", false], ["We stayed home during the storm.", true], ["Though it was expensive, I bought it.", true], ["You have to submit it until Friday.", false], ["Both my mom and dad are teachers.", true], ["Despite she was tired, she smiled.", false], ["Unless you don't hurry, you'll be late.", false]], "e": "ⓐ Because ⓕ whether ⓘ by ⓚ Although ⓛ Unless you hurry"}]}}, {"book": "eos", "chapter": {"id": "18", "name": "밑줄·wh-/that", "title": "어법끝 START · PART 2 밑줄 어법 · Unit 08 wh-/that 밑줄"}, "units": [{"tag": "eos-2-U08-P1", "name": "wh-", "talk": [{"k": "m", "t": "Unit 08은 밑줄이 **wh-(who, which, what, where, when, why, how, whose)**나 **that**에 있는 경우! 핵심은 **뒤 절이 완전한가, 불완전한가** 🔎"}, {"k": "m", "t": "**불완전**: 주어나 목적어(전치사의 목적어 포함)가 빠져 있음 / **완전**: 주어·목적어·보어가 다 있음"}, {"k": "m", "t": "① 관계대명사 who / which + **불완전**한 절, 관계부사 where / when / why / how + **완전**한 절"}, {"k": "ex", "en": "This is the town where I grew up. / This is the town which I visited last year.", "ko": "이곳은 내가 자란 마을이다.(완전) / 이곳은 내가 작년에 방문한 마을이다.(visited의 목적어 빠짐)"}, {"k": "q", "q": "I remember the day ____ we first met.", "o": ["which", "when", "what"], "a": 1, "ok": "맞아요! we first met은 완전 + 시간 선행사 → when", "no": "뒤가 완전한 절이고 선행사가 시간(the day) → when"}, {"k": "m", "t": "② **what** = the thing(s) which → **앞에 선행사가 없고** 뒤는 불완전 / which는 **선행사가 있고** 뒤는 불완전"}, {"k": "q", "q": "____ he said surprised everyone.", "o": ["Which", "What", "That"], "a": 1, "ok": "정확해요! 선행사 없음 + said의 목적어 빠짐 → What", "no": "선행사가 없고 he said가 불완전 → What"}, {"k": "m", "t": "③ **whose + 명사** + 완전한 절(소유격) / **전치사 + which** + 완전한 절 → the house in which he lives = the house where he lives"}, {"k": "m", "t": "④ 간접의문문은 **의문사 + 주어 + 동사** 어순 → I wonder [what] he wants. / whatever, whoever도 뒤는 불완전"}, {"k": "m", "t": "⚠️ 함정: **the way how** ✗ (the way 또는 how 하나만) / 장소 선행사라도 뒤가 불완전하면 which!"}, {"k": "m", "t": "정리! **선행사 + 불완전 → which·who / 선행사 + 완전 → where·when·why·전치사 + which / 선행사 없음 + 불완전 → what** 👍"}], "notes": {"table": [["wh-", "앞(선행사)", "뒤 절"], ["who / which / whom", "있음", "불완전 (주어·목적어 빠짐)"], ["whose + 명사", "있음", "완전"], ["where / when / why / how", "있음 (장소·시간·이유·방법)", "완전"], ["전치사 + which", "있음", "완전"], ["what", "없음", "불완전"], ["whatever / whoever", "없음", "불완전"]], "tips": ["the way how ✗ → the way 또는 how", "선행사가 장소여도 뒤가 불완전하면 which (the city which I visited)", "간접의문문: 의문사 + 주어 + 동사 (what he wants)"]}, "sets": {"workbook": [{"k": "pk", "q": "This is the café [which/where*] I met my best friend.", "e": "I met my best friend 완전 → where"}, {"k": "pk", "q": "This is the café [which*/where] my friend recommended.", "e": "recommended의 목적어 빠짐 → which"}, {"k": "pk", "q": "[What*/Which] I need now is a long vacation.", "e": "선행사 없음 + 불완전 → What"}, {"k": "pk", "q": "He has a friend [whose*/who] father is a pilot.", "e": "friend의 아버지 → whose + 명사"}, {"k": "fx", "q": "I can't believe which he told me.", "w": "which", "a": ["what"], "e": "선행사 없음 + told의 목적어 빠짐 → what"}, {"k": "fx", "q": "The hotel where we stayed in was very clean.", "w": "where", "a": ["which", "that"], "e": "stayed in의 목적어 빠짐(불완전) → which"}, {"k": "fx", "q": "Do you know the reason which she left early?", "w": "which", "a": ["why", "that"], "e": "she left early 완전 + 이유 → why"}, {"k": "bl", "q": "이것이 내가 그 문제를 푼 방법이다. → This is (how|the way) I solved the problem.", "e": "방법 → how (the way how ✗)"}, {"k": "ox", "q": "This is the way how he became rich.", "a": false, "e": "the way 또는 how 하나만"}, {"k": "ox", "q": "Tell me what you want for your birthday.", "a": true, "e": "✔ 선행사 없음 + want의 목적어 빠짐"}], "practiceA": [{"k": "ch" function vscore(v){ const n=v.name; let s=0;

  if(/^en[-_]US/i.test(v.lang)) s+=10; else if(/^en[-_](GB|AU|CA)/i.test(v.lang)) s+=5;
  if(/compact|espeak|novelty|whisper|bad news|bells|bubbles|cellos|jester|organ|trinoids|zarvox|albert|fred|junior|ralph|kathy|boing|wobble/i.test(n)) s-=200;

function norm(s){
  return String(s).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim().replace(/[.!?]+$/,"").trim();
}
function expand(s){
  return norm(s).replace(/\bi'm\b/g,"i am").replace(/\b(you|we|they)'re\b/g,"$1 are").replace(/\b(he|she|it|that|this)'s\b/g,"$1 is")
    .replace(/\bwon't\b/g,"will not").replace(/\b(i|you|he|she|it|we|they)'ll\b/g,"$1 will").replace(/\b(i|you|we|they)'ve\b/g,"$1 have").replace(/\bhaven't\b/g,"have not").replace(/\bhasn't\b/g,"has not").replace(/\bdon't\b/g,"do not").replace(/\bdoesn't\b/g,"does not").replace(/\bdidn't\b/g,"did not").replace(/\bisn't\b/g,"is not").replace(/\baren't\b/g,"are not").replace(/\bwasn't\b/g,"was not").replace(/\bweren't\b/g,"were not")
    .replace(/^'m\b/,"am").replace(/\s+/g," ").trim();
}
function expand2(s){ return norm(s).replace(/\b(he|she|it|that)'s\b/g,"$1 has") }
function forms(s){ const o=new Set([expand(s)]); const t=expand(expand2(s)); o.add(t); return o }
const same = (a, list) => { const A=forms(a); return list.some(x => [...forms(x)].some(f=>A.has(f))) };

function runCumul(n){
  const ci=BOOK.chapters.indexOf(CH), before=BOOK.chapters.slice(0,ci).flatMap(c=>c.units);
  const u=CH.units[n], prev=[...before,...CH.units.slice(0,n)], tags=[...prev,u].map(x=>x.tag);
  const pool=x=>["workbook","practiceA","practiceB"].flatMap(s=>x.sets[s]);

  shuffle(Object.values(ST.wrong).filter(w=>tags.includes(w.tag)).map(w=>w.item)).slice(0,5).forEach(add);
  const curN=prev.length?Math.ceil(CUMUL_N/2):CUMUL_N;
  shuffle(pool(u)).slice(0,curN).forEach(add);
  const near=shuffle(CH.units.slice(0,n).flatMap(pool)), far=shuffle(before.flatMap(pool));
  const restN=CUMUL_N-curN, nearN=far.length?Math.ceil(restN*0.6):restN;
  near.slice(0,nearN).forEach(add); far.forEach(add); near.forEach(add);
  shuffle(pool(u)).forEach(add);
  runSet(shuffle(pick),{title:u.name+" · 최종 누적학습",key:u.tag+":cumul",target:80,tag:u.tag});
}

  const a=document.activeElement, inText=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
  if(inText) return;
  const b=document.querySelector("#ck")||document.querySelector("#nx:not(:disabled)")||document.querySelector("#go");
  if(!b||b.disabled) return; e.preventDefault(); b.click();
},true);
function body(it){
  const k=it.k;
  if(k==="pk"){ let n=0; return `<div class="qtext en">${esc(it.q).replace(/\[([^\]]+)\]/g,(m,a)=>`<span data-pk="${n++}">`+a.split("/").map(x=>`<button class="chip" data-v="${esc(x.replace("*",""))}" data-r="${x.includes("*")?1:0}">${esc(x.replace("*",""))}</button>`).join("")+"</span>")}</div>` }
  if(k==="bl"){ return `<div class="qtext en">${esc(it.q).replace(/\(([^)]+)\)/g,(m,a)=>isEnBlank(a)?`<input class="blank" data-a="${esc(a)}" aria-label="빈칸" autocomplete="off" autocapitalize="off" spellcheck="false">`:m)}</div>` }
  if(k==="fx"){ return `<div class="muted" style="font-size:14px">틀린 단어를 눌러 고르고, 바르게 고쳐 쓰세요.</div><div class="qtext en">${it.q.split(" ").map((w,j)=>`<button class="tok" data-j="${j}">${esc(w)}</button>`).join("")}</div><div class="fxrow"><input class="inp" id="fxin" placeholder="바르게 고친 말" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn sm" id="fxdel" type="button">이 단어 빼기</button></div>` }
  if(k==="ch"){ const parts=it.q.split("\n"); return `<div class="qtext">${esc(parts[0])}</div>${parts.length>1?`<div class="notes" style="margin:0"><div style="white-space:pre-line" class="en">${esc(parts.slice(1).join("\n"))}</div></div>`:""}<div class="choices">${it.o.map((o,j)=>`<button class="choice" data-j="${j}"><span class="n">${"①②③④⑤"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>` }
  if(k==="ox"){ return `<div class="qtext en">${esc(it.q)}</div><div class="muted" style="font-size:14px">어법과 내용이 맞으면 O, 틀리면 X</div><div class="ox"><button data-v="1" aria-label="O">O</button><button data-v="0" aria-label="X">X</button></div>` }
  if(k==="or"){ return `<div class="qtext">${esc(it.q)}</div><div class="ans" id="orans"></div><div id="orpool">${shuffle(it.a.split(" ")).map((w,j)=>`<button class="tok" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div><div class="actions" style="justify-content:flex-start"><button class="btn sm ghost" id="orclr">다시 놓기</button></div>` }
  if(k==="wr"){ return `<div class="qtext">${esc(it.q)}</div><input class="inp" id="wrin" placeholder="영어 문장을 쓰세요" autocomplete="off" autocapitalize="off" spellcheck="false">` }
  if(k==="m12"){ return `<div class="qtext">${esc(it.q)}</div><div class="m12">${it.s.map((s,j)=>`<button class="choice" data-j="${j}"><span class="n">${"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛ"[j]}</span><span class="en">${esc(s[0])}</span></button>`).join("")}</div>` }
}
function bind(it){
  const cd=$("#cd"), k=it.k;
  if(k==="pk") cd.querySelectorAll("[data-pk]").forEach(g=>g.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on")}));
  if(k==="fx"){ cd.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{cd.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");$("#fxin").focus()});
    $("#fxdel").onclick=()=>{ $("#fxin").value="(삭제)"; } }
  if(k==="ch"||k==="m12") cd.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{ if(k==="ch") cd.querySelectorAll(".choice").forEach(x=>x.classList.remove("on")); c.classList.toggle("on") });
  if(k==="ox") cd.querySelectorAll(".ox button").forEach(b=>b.onclick=()=>{cd.querySelectorAll(".ox button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
  if(k==="or"){ const pool=$("#orpool"),ans=$("#orans");
    pool.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{ if(t.classList.contains("used")) return; t.classList.add("used"); const b=document.createElement("button"); b.className="tok"; b.textContent=t.dataset.w; b.dataset.w=t.dataset.w; b.onclick=()=>{b.remove();t.classList.remove("used")}; ans.appendChild(b) });
    $("#orclr").onclick=()=>{ans.innerHTML="";pool.querySelectorAll(".tok").forEach(t=>t.classList.remove("used"))} }
  cd.querySelectorAll("input").forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#ck").click() } }));
}
function grade(it){
  const cd=$("#cd"), k=it.k;
  if(k==="pk"){ const gs=[...cd.querySelectorAll("[data-pk]")]; if(gs.some(g=>!g.querySelector(".on"))) return null; let ok=true;
    gs.forEach(g=>g.querySelectorAll(".chip").forEach(c=>{ if(c.dataset.r==="1") c.classList.add("right"); if(c.classList.contains("on")&&c.dataset.r!=="1"){c.classList.add("wrong");ok=false} }));
    return {ok,key:gs.map(g=>g.querySelector('[data-r="1"]').dataset.v).join(", ")} }
  if(k==="bl"){ const ins=[...cd.querySelectorAll("input.blank")]; if(ins.some(x=>!x.value.trim())) return null; let ok=true;
    ins.forEach(x=>{ const r=same(x.value,x.dataset.a.split("|")); x.classList.add(r?"ok":"no"); if(!r) ok=false });
    return {ok,key:ins.map(x=>x.dataset.a.split("|")[0]).join(", ")} }
  if(k==="fx"){ const sel=cd.querySelector(".tok.sel"), v=$("#fxin").value.trim(); if(!sel||!v) return null;
    const toks=it.q.split(" "), wi=toks.findIndex(t=>norm(t.replace(/[,.!?]+$/,""))===norm(it.w)); const okW=+sel.dataset.j===wi, DEL=/^\(?(삭제|빼기|x|-)\)?$/i, okA=it.a.includes("(삭제)")?DEL.test(v.trim()):same(v,it.a);
    cd.querySelector(`.tok[data-j="${wi}"]`).classList.add("sel");
    return {ok:okW&&okA,key:it.a[0]==="(삭제)"?`${it.w} → 빼기`:`${it.w} → ${it.a[0]}`} }
  if(k==="ch"){ const on=cd.querySelector(".choice.on"); if(!on) return null; const j=+on.dataset.j;
    cd.querySelector(`.choice[data-j="${it.a}"]`).classList.add("right"); if(j!==it.a) on.classList.add("wrong");
    return {ok:j===it.a,key:"①②③④⑤"[it.a]+" "+it.o[it.a]} }
  if(k==="ox"){ const on=cd.querySelector(".ox .on"); if(!on) return null; const v=on.dataset.v==="1"; return {ok:v===it.a,key:it.a?"O":"X"} }
  if(k==="or"){ const ws=[...$("#orans").querySelectorAll(".tok")].map(t=>t.dataset.w); if(!ws.length) return null; return {ok:ws.join(" ")===it.a,key:it.a} }
  if(k==="wr"){ const v=$("#wrin").value.trim(); if(!v) return null; return {ok:same(v,it.a),key:it.a[0]} }
  if(k==="m12"){ const on=[...cd.querySelectorAll(".choice.on")].map(c=>+c.dataset.j); const bad=it.s.map((s,j)=>s[1]?null:j).filter(x=>x!==null);
    cd.querySelectorAll(".choice").forEach(c=>{const j=+c.dataset.j; if(bad.includes(j)) c.classList.add(on.includes(j)?"right":"wrong"); else if(on.includes(j)) c.classList.add("wrong")});
    const ok=on.length===bad.length&&bad.every(j=>on.includes(j)); return {ok,key:bad.map(j=>"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛ"[j]).join(", ")} }
}
home();
</script>
