\n(B) If I [were / had been] you, I would say sorry.\n(C) He demanded that she [return / returned] the money.", "o": ["must rain – were – return", "must have rained – were – return", "must have rained – had been – returned", "must rain – had been – returned", "must have rained – were – returned"], "a": 1, "e": "(A) last night (B) would say → 가정법 과거 (C) 요구 → 동사원형"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I missed the bus this morning. I ____ up earlier.", "o": ["must have gotten", "should have gotten", "can't have gotten", "may get", "must get"], "a": 1, "e": "후회 → should have p.p."}, {"k": "ch", "q": "빈칸에 알맞은 것은? If she had asked me, I ____ her.", "o": ["will help", "would help", "would have helped", "helped", "have helped"], "a": 2, "e": "had p.p. → would have p.p."}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He may have left already.", "You shouldn't have said that.", "She must have been tired yesterday.", "They can't have finish it in an hour.", "I could have won the race."], "a": 3, "e": "④ have + p.p. → finished"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["If I were rich, I would buy a house.", "If it had not rained, we would have played soccer.", "If you were here yesterday, you would have seen him.", "The teacher insisted that we be quiet.", "If he had saved money, he could buy a car now."], "a": 2, "e": "③ yesterday → had been"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nJenny didn't study for the test, and she got a bad score. \"I (A) [should have studied / must have studied] more,\" she said. Her friend said, \"If you (B) [studied / had studied], you would have done better.\" Her teacher suggested that she (C) [make / made] a study plan.", "o": ["should have studied – studied – make", "must have studied – had studied – made", "should have studied – had studied – make", "must have studied – studied – make", "should have studied – had studied – made"], "a": 2, "e": "(A) 후회 (B) would have done → had p.p. (C) 제안 → 동사원형"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? As I don't have enough money, I can't buy the phone.", "o": ["If I had enough money, I could buy the phone.", "If I have enough money, I can buy the phone.", "If I had had enough money, I could have bought the phone.", "If I didn't have enough money, I couldn't buy the phone.", "If I had enough money, I could have bought the phone."], "a": 0, "e": "현재 사실 반대 → 가정법 과거"}, {"k": "ch", "q": "다음 상황에 맞는 말은? (나는 Amy가 어제 하루 종일 집에 있었다는 것을 안다. 그런데 누군가 어제 쇼핑몰에서 Amy를 봤다고 한다.)", "o": ["Amy must have gone to the mall.", "Amy can't have been at the mall.", "Amy should have been at the mall.", "Amy may have been at the mall.", "Amy must be at the mall."], "a": 1, "e": "~했을 리가 없다 → can't have p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ You needn't have hurried.\nⓑ He must have been sleeping then.\nⓒ If I were you, I will go.\nⓓ She ordered that the door be locked.\nⓔ If he had come, I would have been happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ would go"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIf I ____ the answer now, I would tell you.\nIf I ____ the answer yesterday, I would have told you.", "o": ["knew – knew", "had known – knew", "knew – had known", "know – had known", "had known – had known"], "a": 2, "e": "가정법 과거 knew / 가정법 과거완료 had known"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He should have came earlier.", "If I am you, I would wait.", "She suggested that he goes home.", "They might have missed the train.", "If we had left, we will be there."], "a": 3, "e": "① come ② were ③ (should) go ⑤ would be"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["She must have left her phone at home.", true], ["You should have tell me earlier.", false], ["He can't have seen me.", true], ["I may lose my key yesterday.", false], ["We could have won the game.", true], ["If I were you, I would rest.", true], ["If she had studied, she would pass the test last week.", false], ["If I had wings, I could fly.", true], ["He insisted that I be honest.", true], ["The doctor suggested that she takes a rest.", false], ["If it hadn't rained, we would have gone out.", true], ["You shouldn't have eaten so fast.", true]], "e": "ⓑ told ⓓ may have lost ⓖ would have passed ⓙ (should) take"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["If I knew her, I would talk to her.", true], ["If he had more time, he can travel.", false], ["They must be tired now.", true], ["It must have snowed last night.", true], ["I should studied harder.", false], ["He demanded that the money be paid.", true], ["If you had called, I would have answered.", true], ["She can't have done it alone.", true], ["If I am a bird, I would fly.", false], ["We needn't have worried.", true], ["If he had listened, he wouldn't be in trouble now.", true], ["He might have forgot the plan.", false]], "e": "ⓑ could ⓔ should have studied ⓘ were ⓛ forgotten"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I had a car, I would drive.\nⓑ She must have been angry then.\nⓒ He recommended that we visited the museum.\nⓓ If we had known, we would come yesterday.\nⓔ I shouldn't have trusted him.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ (should) visit / ⓓ would have come"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The police officer demanded that the driver ____ his license.", "o": ["shows", "showed", "show", "to show", "showing"], "a": 2, "e": "요구 → (should) 동사원형"}]}}, {"book": "eos", "chapter": {"id": "05", "name": "네모·태", "title": "어법끝 START · PART 1 네모 어법 · Unit 05 태"}, "units": [{"tag": "eos-1-P11", "name": "동사의 태는 주어와의 의미 관계를 파악하라!", "talk": [{"k": "m", "t": "Unit 05는 **태**! 네모 '능동 vs 수동' → 주어가 그 동작을 **하는지(능동)**, **당하는지(수동)** 따져요 🔁"}, {"k": "m", "t": "① 능동 vs 수동: 의미가 먼저! 보조 단서로 동사 뒤에 **목적어가 있으면 능동**, 없으면 수동일 가능성이 커요"}, {"k": "ex", "en": "The new library was built last year.", "ko": "새 도서관은 작년에 지어졌다. (도서관은 지어지는 대상)"}, {"k": "q", "q": "The letter ____ in English, so I couldn't read it.", "o": ["wrote", "was written", "was writing"], "a": 1, "ok": "맞아요! 편지는 쓰여지는 것 → 수동", "no": "주어 The letter는 쓰여지는 대상 → was written"}, {"k": "m", "t": "⚠️ 목적어가 없는 자동사(happen, occur, appear, disappear, arise, remain, consist of, take place)는 수동태 ✗: The accident [happened] at night."}, {"k": "m", "t": "② 「수동태 + 명사」: 4형식(give, send, offer, show, tell, teach)·5형식(call, name, elect, consider) 동사의 수동태는 뒤에 **명사가 남아요**. He was given a prize. / She was elected [captain]."}, {"k": "q", "q": "The baby ____ Lily by her parents.", "o": ["named", "was named", "was naming"], "a": 1, "ok": "정확해요! 5형식 수동태 + 명사", "no": "아기는 이름 지어진 대상 → was named + Lily"}, {"k": "m", "t": "③ 관계대명사절의 태: **선행사**가 그 동작을 하면 능동, 받으면 수동: the man who [teaches] us / the books which were written by her"}, {"k": "q", "q": "This is the bridge which ____ in 1950.", "o": ["built", "was built", "has built"], "a": 1, "ok": "맞아요! 선행사 bridge는 지어진 것", "no": "선행사 the bridge가 지어지는 대상 → was built"}, {"k": "m", "t": "④ **be used to-v** (~하는 데 사용되다) / **be used to v-ing** (~에 익숙하다) / **used to-v** (~하곤 했다)"}, {"k": "q", "q": "This knife is used to ____ bread.", "o": ["cut", "cutting", "cuts"], "a": 0, "ok": "맞아요! ~하는 데 사용되다 → to + 동사원형", "no": "칼이 빵을 자르는 데 사용됨 → be used to cut"}, {"k": "m", "t": "정리! **의미 관계 → 목적어 유무 → 자동사 확인 / 수동태 뒤 명사 OK / 관계절은 선행사 기준 / be used to-v vs v-ing** 👍"}], "notes": {"table": [["구별", "판단", "예"], ["능동 vs 수동", "주어가 하면 능동, 당하면 수동", "My uncle repaired the roof. / The roof was repaired."], ["수동태 불가 자동사", "목적어 없음 → 수동 ✗", "happen, occur, appear, disappear, arise, consist of, take place"], ["수동태 + 명사 (4형식)", "be given / be offered / be told + 명사", "She was offered a job."], ["수동태 + 명사 (5형식)", "be called / be named / be elected + 명사", "He was elected mayor."], ["관계대명사절", "선행사가 하는지 받는지", "the girl who won the prize / the prize which was won by her"], ["used to", "be used to-v / be used to v-ing / used to-v", "Wood is used to make paper. / I'm used to waking up early."]], "tips": ["수동태 뒤에 명사가 있다고 무조건 능동이 아님 (4·5형식 수동태)", "be used to + v-ing의 to는 전치사", "consist of, belong to, resemble도 수동태 ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "The window [was broken*/broke] by the strong wind.", "e": "by the wind → 수동"}, {"k": "pk", "q": "My grandmother [planted*/was planted] these trees thirty years ago.", "e": "할머니가 심은 것 → 능동"}, {"k": "pk", "q": "The festival [is held*/holds] every October.", "e": "축제는 열리는 것 → 수동"}, {"k": "pk", "q": "A strange thing [happened*/was happened] yesterday.", "e": "happen은 수동태 ✗"}, {"k": "pk", "q": "She [was offered*/offered] a job by a big company.", "e": "4형식 수동태 + 명사"}, {"k": "pk", "q": "The man who [was injured*/injured] in the accident is in the hospital.", "e": "선행사 the man은 다친 사람 → 수동"}, {"k": "pk", "q": "I'm used to [getting*/get] up early.", "e": "~에 익숙하다 → be used to v-ing"}, {"k": "pk", "q": "This machine is used to [make*/making] ice cream.", "e": "~하는 데 사용되다 → be used to-v"}, {"k": "fx", "q": "The museum visits by many tourists every year.", "w": "visits", "a": ["is visited"], "e": "박물관은 방문되는 것 → is visited"}, {"k": "fx", "q": "The dinosaurs were disappeared millions of years ago.", "w": "were", "a": ["(삭제)"], "e": "disappear는 수동태 ✗"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) English [speaks / is spoken] in many countries.\n(B) He [was elected / elected] class president last year.\n(C) The pictures which [took / were taken] by my dad are on the wall.", "o": ["speaks – elected – took", "is spoken – was elected – were taken", "is spoken – elected – were taken", "speaks – was elected – took", "is spoken – was elected – took"], "a": 1, "e": "(A) 영어는 말해지는 것 (B) 5형식 수동태 + 명사 (C) 선행사 pictures는 찍힌 것"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The problem was solved quickly.", "The meeting will be held tomorrow.", "This song is loved by teenagers.", "The accident was occurred at midnight.", "He was told the news by his mom."], "a": 3, "e": "④ occur는 수동태 ✗ → occurred"}, {"k": "pk", "q": "The students [were taught*/taught] English by a native speaker.", "e": "4형식 수동태 + 명사"}, {"k": "pk", "q": "Water [consists*/is consisted] of hydrogen and oxygen.", "e": "consist of는 수동태 ✗"}, {"k": "pk", "q": "I know a girl who [was born*/born] in Paris.", "e": "be born"}, {"k": "bl", "q": "그 소포는 어제 배달되었다. → The package (was) delivered yesterday.", "e": "소포는 배달되는 것 → 수동"}, {"k": "bl", "q": "그녀는 시끄러운 도시에서 사는 것에 익숙하다. → She is used to (living) in a noisy city.", "e": "be used to v-ing"}, {"k": "fx", "q": "The house was painting by my father last week.", "w": "painting", "a": ["painted"], "e": "집은 칠해지는 것 → was painted"}, {"k": "ox", "q": "Wood is used to make paper.", "a": true, "e": "✔ ~하는 데 사용되다"}, {"k": "ox", "q": "The thief caught by the police last night.", "a": false, "e": "도둑은 잡힌 것 → was caught"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The car was washed by my brother.\nⓑ The rumor was spread quickly.\nⓒ Her book translated into ten languages.\nⓓ He was called a hero.\nⓔ I'm used to driving on the left.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ was translated"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe Eiffel Tower (A) [built / was built] in 1889. At first, many people (B) [disliked / were disliked] it. Today, however, it is one of the most popular places that (C) [visit / are visited] by tourists.", "o": ["built – disliked – visit", "was built – were disliked – are visited", "was built – disliked – are visited", "built – were disliked – visit", "was built – disliked – visit"], "a": 2, "e": "(A) 탑은 지어진 것 (B) 사람들이 싫어한 것(목적어 it) (C) 선행사 places는 방문되는 것"}, {"k": "pk", "q": "The old man [was shown*/showed] the way to the station by a kind girl.", "e": "4형식 수동태 + 명사"}, {"k": "pk", "q": "New problems [arose*/were arisen] after the change.", "e": "arise는 수동태 ✗"}, {"k": "fx", "q": "The players who chose for the national team trained hard.", "w": "chose", "a": ["were chosen"], "e": "선행사 players는 뽑힌 것 → were chosen"}, {"k": "fx", "q": "This tool is used to opening cans.", "w": "opening", "a": ["open"], "e": "~하는 데 사용되다 → be used to-v"}, {"k": "wr", "q": "그 편지는 영어로 쓰였다. (the letter, write, in English)", "a": ["The letter was written in English."], "e": "수동태"}, {"k": "wr", "q": "그는 그 팀의 주장으로 뽑혔다. (elect, the captain of the team)", "a": ["He was elected the captain of the team.", "He was elected captain of the team.", "He was elected as the captain of the team.", "He was elected as captain of the team."], "e": "5형식 수동태 + 명사"}, {"k": "or", "q": "그 도시는 많은 관광객들에 의해 방문된다.", "a": "The city is visited by many tourists.", "e": "수동태"}, {"k": "bl", "q": "그 사고는 어젯밤에 일어났다. → The accident (happened|occurred) last night.", "e": "happen은 수동태 ✗"}]}}, {"tag": "eos-1-P12", "name": "to부정사/동명사의 태는 의미상 주어부터 찾아라!", "talk": [{"k": "m", "t": "to부정사·동명사에도 **태**가 있어요! 의미상 주어가 그 동작을 하면 능동(to-v, v-ing), 당하면 수동(**to be p.p.**, **being p.p.**) 🧐"}, {"k": "m", "t": "풀이 전략: ① **의미상 주어** 찾기(대개 문장의 주어나 목적어) ② 그것이 동작을 하는지 / 받는지 판단 ③ 뒤에 목적어가 있는지 확인"}, {"k": "ex", "en": "She wants to be invited to the party.", "ko": "그녀는 파티에 초대받고 싶어 한다. (초대받는 사람 = She)"}, {"k": "q", "q": "The children hate ____ like babies.", "o": ["treating", "being treated", "to treat"], "a": 1, "ok": "맞아요! 아이들이 대우'받는' 것 → being p.p.", "no": "의미상 주어 children이 대우받는 쪽 → being treated"}, {"k": "m", "t": "① to부정사: to-v vs **to be p.p.**: The report needs to [be] finished today."}, {"k": "q", "q": "This work is too important ____ by a beginner.", "o": ["to do", "to be done", "doing"], "a": 1, "ok": "정확해요! 일은 '되는' 것 → to be p.p.", "no": "의미상 주어 This work가 행해지는 대상 + by → to be done"}, {"k": "m", "t": "② 동명사: v-ing vs **being p.p.**: He avoided [being] seen by reporters."}, {"k": "q", "q": "I'm tired of ____ what to do.", "o": ["telling", "being told", "to be told"], "a": 1, "ok": "맞아요! 내가 지시를 '받는' 것 → being p.p.", "no": "의미상 주어 I가 듣는 쪽 → being told (of 뒤 동명사)"}, {"k": "m", "t": "⚠️ need / want + **v-ing** = 수동 의미: The car needs washing. (= needs to be washed) → needs being washed ✗"}, {"k": "m", "t": "⚠️ 완료형: to have been p.p. / having been p.p. = 본동사보다 **이전에** 당한 일 (He denied having been paid.)"}, {"k": "m", "t": "정리! **의미상 주어가 하면 to-v·v-ing / 당하면 to be p.p.·being p.p. / need v-ing = 수동 의미** 👍"}, {"k": "m", "t": "🎉 Chapter 5 네모·태 끝! **누가 하는가, 누가 당하는가** — 동사·to부정사·동명사의 태 완성 👏"}], "notes": {"table": [["형태", "능동", "수동", "예"], ["to부정사", "to-v", "to be p.p.", "I want to be chosen. / The room needs to be cleaned."], ["동명사", "v-ing", "being p.p.", "She hates being ignored."], ["완료 to부정사", "to have p.p.", "to have been p.p.", "He seems to have been hurt."], ["완료 동명사", "having p.p.", "having been p.p.", "He denied having been paid."], ["need / want + v-ing", "—", "수동 의미", "My bike needs repairing."]], "tips": ["의미상 주어 찾기: 문장의 주어 / 목적어 / for·of + 목적격 / 소유격", "뒤에 목적어가 있으면 능동일 가능성↑", "be proud of / be afraid of / avoid / mind / enjoy + (being p.p.) 동명사"]}, "sets": {"workbook": [{"k": "pk", "q": "Everyone likes [to be praised*/to praise] by others.", "e": "칭찬받는 것 → to be p.p."}, {"k": "pk", "q": "He is proud of [being chosen*/choosing] as the leader.", "e": "선택된 것 → being p.p."}, {"k": "pk", "q": "The plants need [to be watered*/to water] every day.", "e": "식물은 물을 받는 것 → to be p.p."}, {"k": "pk", "q": "She doesn't like [being interrupted*/interrupting] when she talks.", "e": "방해받는 것 → being p.p."}, {"k": "pk", "q": "The kids enjoyed [playing*/being played] in the snow.", "e": "아이들이 노는 것 → 능동"}, {"k": "pk", "q": "He expected [to be invited*/to invite] to the wedding.", "e": "초대받는 것 → to be p.p."}, {"k": "bl", "q": "그는 사람들에게 비웃음당하는 것을 두려워한다. → He is afraid of (being) laughed at by people.", "e": "being p.p."}, {"k": "bl", "q": "그 문은 매일 밤 잠겨야 한다. → The door needs to (be) locked every night.", "e": "to be p.p."}, {"k": "fx", "q": "Nobody likes to be laughing at.", "w": "laughing", "a": ["laughed"], "e": "비웃음당하는 것 → to be laughed at"}, {"k": "fx", "q": "She was happy about inviting to the party.", "w": "inviting", "a": ["being invited"], "e": "초대받는 것 → being invited"}], "practiceA": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) The baby started [to cry / to be cried] at midnight.\n(B) The man denied [having stolen / having been stolen] the money.\n(C) My bike needs [repairing / being repaired].", "o": ["to cry – having stolen – repairing", "to be cried – having been stolen – being repaired", "to cry – having been stolen – repairing", "to cry – having stolen – being repaired", "to be cried – having stolen – repairing"], "a": 0, "e": "(A) 아기가 우는 것 (B) 남자가 훔친 것(목적어 the money) (C) need v-ing = 수동 의미"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I don't like being told what to do.", "She hopes to be chosen for the team.", "The house needs to be cleaned.", "He avoided being seen by his teacher.", "The thief was afraid of catching by the police."], "a": 4, "e": "⑤ 잡히는 것 → being caught"}, {"k": "pk", "q": "The workers complained about [being paid*/paying] too little.", "e": "돈을 받는 것 → being paid"}, {"k": "pk", "q": "The meeting is going [to be held*/to hold] next Friday.", "e": "회의는 열리는 것 → to be p.p."}, {"k": "pk", "q": "Jenny remembers [visiting*/being visited] the museum as a child.", "e": "Jenny가 방문한 것(목적어 the museum) → 능동"}, {"k": "bl", "q": "그 보고서는 오늘 끝내져야 한다. → The report has to (be) finished today.", "e": "be p.p."}, {"k": "bl", "q": "나는 그런 식으로 대우받는 것에 익숙하지 않다. → I'm not used to (being) treated like that.", "e": "being p.p."}, {"k": "fx", "q": "Tom was excited about choosing as the class leader.", "w": "choosing", "a": ["being chosen"], "e": "뽑히는 것 → being chosen"}, {"k": "ox", "q": "These old letters need to be kept in a safe place.", "a": true, "e": "✔ 편지는 보관되는 것"}, {"k": "ox", "q": "She hates to be disturbing while she studies.", "a": false, "e": "방해받는 것 → to be disturbed"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He didn't want to be seen.\nⓑ I'm looking forward to meeting you.\nⓒ The kids love being taken to the zoo.\nⓓ The building is expected to complete next year.\nⓔ She was angry at being ignoring.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ to be completed / ⓔ being ignored"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy little brother hates (A) [being called / calling] a baby. He wants (B) [to treat / to be treated] like a grown-up. So yesterday he insisted on (C) [making / being made] his own breakfast.", "o": ["being called – to be treated – making", "calling – to treat – being made", "being called – to treat – making", "calling – to be treated – making", "being called – to be treated – being made"], "a": 0, "e": "(A) 아기라고 불리는 것 (B) 대우받는 것 (C) 직접 만드는 것(목적어 his own breakfast)"}, {"k": "pk", "q": "The song is expected [to be loved*/to love] by many people.", "e": "노래는 사랑받는 것 → to be p.p."}, {"k": "pk", "q": "After [being rescued*/rescuing] from the sea, the sailors were taken to a hospital.", "e": "선원들이 구조된 것 → being p.p."}, {"k": "fx", "q": "This medicine has to keep in the fridge.", "w": "keep", "a": ["be kept"], "e": "약은 보관되는 것 → be kept"}, {"k": "fx", "q": "I object to treat like this.", "w": "treat", "a": ["being treated"], "e": "object to + 동명사, 대우받는 것 → being treated"}, {"k": "wr", "q": "그녀는 칭찬받는 것을 좋아한다. (like, praise, 동명사)", "a": ["She likes being praised."], "e": "being p.p."}, {"k": "wr", "q": "그 방은 청소될 필요가 있다. (need, clean, to부정사)", "a": ["The room needs to be cleaned."], "e": "to be p.p."}, {"k": "or", "q": "나는 그 파티에 초대받기를 원한다.", "a": "I want to be invited to the party.", "e": "to be p.p."}, {"k": "bl", "q": "그는 경찰에게 잡히는 것을 피했다. → He avoided (being) caught by the police.", "e": "being p.p."}]}}], "chapterSets": {"write": [{"k": "wr", "q": "이 사진은 내 여동생에 의해 찍혔다. (this picture, take, by my sister)", "a": ["This picture was taken by my sister.", "This photo was taken by my sister."], "e": "수동태"}, {"k": "wr", "q": "그는 생일 선물로 시계를 받았다. (be given, a watch, for his birthday)", "a": ["He was given a watch for his birthday."], "e": "4형식 수동태 + 명사"}, {"k": "wr", "q": "나는 혼자 사는 것에 익숙하다. (be used to, live alone)", "a": ["I am used to living alone.", "I'm used to living alone."], "e": "be used to v-ing"}, {"k": "wr", "q": "그 차는 세차될 필요가 있다. (need, wash, to부정사)", "a": ["The car needs to be washed."], "e": "to be p.p."}, {"k": "wr", "q": "그녀는 무시당하는 것을 싫어한다. (hate, ignore, 동명사)", "a": ["She hates being ignored."], "e": "being p.p."}, {"k": "fx", "q": "The cake was eating by the kids.", "w": "eating", "a": ["eaten"], "e": "케이크는 먹히는 것 → was eaten"}, {"k": "fx", "q": "The earthquake was occurred in 2016.", "w": "was", "a": ["(삭제)"], "e": "occur는 수동태 ✗"}, {"k": "bl", "q": "그 다리는 1990년에 지어졌다. → The bridge (was) built in 1990.", "e": "수동태"}, {"k": "bl", "q": "그 아이는 혼자 남겨지는 것을 싫어했다. → The child hated (being) left alone.", "e": "being p.p."}, {"k": "or", "q": "이 칼은 고기를 자르는 데 사용된다.", "a": "This knife is used to cut meat.", "e": "be used to-v"}], "test": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) The temple [built / was built] about 1,000 years ago.\n(B) The girl who [helped / was helped] me was very kind.\n(C) I hope [to invite / to be invited] to her party.", "o": ["built – helped – to invite", "was built – helped – to be invited", "was built – was helped – to be invited", "built – was helped – to invite", "was built – helped – to invite"], "a": 1, "e": "(A) 절은 지어진 것 (B) 선행사 girl이 도운 것(목적어 me) (C) 초대받는 것"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The thief ____ by a police officer last night.", "o": ["caught", "was caught", "catching", "has caught", "was catching"], "a": 1, "e": "도둑은 잡힌 것 → was caught"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He doesn't like ____ in public.", "o": ["criticizing", "being criticized", "to criticize", "criticized", "be criticized"], "a": 1, "e": "비판받는 것 → being criticized"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The movie was directed by a young woman.", "My wallet was stolen on the subway.", "She was given a second chance.", "Many changes have been happened.", "The room is cleaned every day."], "a": 3, "e": "④ happen은 수동태 ✗ → have happened"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["The song was sang by a famous singer.", "The baby is used to sleep alone.", "He was elected mayor.", "The boy who was won the prize is my cousin.", "She wants to be loving by everyone."], "a": 2, "e": "① sung ② sleeping ④ won ⑤ loved"}, {"k": "ch", "q": "다음 글의 (A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nHangeul (A) [created / was created] by King Sejong. Before that, Korean people (B) [used / were used] Chinese characters. Today, Hangeul is a writing system that (C) [admires / is admired] by many language experts.", "o": ["created – used – admires", "was created – were used – is admired", "was created – used – is admired", "created – were used – admires", "was created – used – admires"], "a": 2, "e": "(A) 한글은 만들어진 것 (B) 사람들이 사용한 것(목적어) (C) 선행사 system은 존경받는 것"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThis pen is used to ____ on glass.\nShe is used to ____ in English.", "o": ["write – write", "writing – writing", "write – writing", "writing – write", "written – writing"], "a": 2, "e": "~하는 데 사용되다 write / ~에 익숙하다 writing"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The window was left open.\nⓑ The trees were planted by students.\nⓒ The meeting was taken place in Seoul.\nⓓ She avoided being asked questions.\nⓔ The bike needs to be fixed.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ took place"}, {"k": "ch", "q": "빈칸에 being이 들어갈 수 없는 것은?", "o": ["He is proud of ____ chosen as captain.", "I don't like ____ treated like a child.", "She enjoys ____ praised by teachers.", "The kids love ____ taken to the beach.", "He decided ____ invited to the party."], "a": 4, "e": "⑤ decide + to부정사 → to be invited"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) The problem needs [to solve / to be solved] soon.\n(B) Most of the food [was eaten / ate] before I arrived.\n(C) I remember [taking / being taken] to the zoo by my dad when I was little.", "o": ["to solve – ate – taking", "to be solved – was eaten – being taken", "to be solved – ate – taking", "to solve – was eaten – being taken", "to be solved – was eaten – taking"], "a": 1, "e": "(A) 문제는 해결되는 것 (B) 음식은 먹힌 것 (C) 내가 데려가진 것"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He was offered a job.", "The book is used to teach children.", "I'm used to eating spicy food.", "She was named Grace.", "The building which designed by a famous architect is new."], "a": 4, "e": "⑤ 선행사 building은 설계된 것 → was designed"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The car was repaired yesterday.", true], ["The festival holds every spring.", false], ["He was told the truth.", true], ["The dog disappeared last week.", true], ["The accident was happened at night.", false], ["This tool is used to cut wood.", true], ["I'm used to wake up early.", false], ["The man who was arrested denied everything.", true], ["She wants to be respected.", true], ["He hates being laughed at.", true], ["The window needs to clean.", false], ["The girl was elected class president.", true]], "e": "ⓑ is held ⓔ happened ⓖ waking ⓚ to be cleaned"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The letter was sent last Monday.", true], ["The house was painted by my uncle.", true], ["The book wrote by a teenager is popular.", false], ["Water consists of hydrogen and oxygen.", true], ["She was given flowers by her fans.", true], ["The students who taught by Mr. Kim did well.", false], ["He avoided being seen.", true], ["I expect to promote soon.", false], ["She is afraid of being alone.", true], ["The baby likes being held.", true], ["The concert is going to hold next week.", false], ["The kids enjoyed being taught by a robot.", true]], "e": "ⓒ written ⓕ were taught ⓗ to be promoted ⓚ to be held"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The museum is visited by many people.\nⓑ The bridge was collapsed in the storm.\nⓒ He was called a genius.\nⓓ I don't mind being asked questions.\nⓔ The report has to finish by noon.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ collapsed / ⓔ be finished"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The new rules are expected ____ next month.", "o": ["to introduce", "introducing", "to be introduced", "being introduced", "introduced"], "a": 2, "e": "규칙은 도입되는 것 → to be introduced"}]}}, {"book": "eos", "chapter": {"id": "06", "name": "네모·분사", "title": "어법끝 START · PART 1 네모 어법 · Unit 06 분사"}, "units": [{"tag": "eos-1-P13", "name": "수식받는 명사와의 의미 관계를 파악하라!", "talk": [{"k": "m", "t": "Unit 06은 **분사**! 네모 안에 v-ing / p.p.가 나란히 있으면, 먼저 그 분사가 **꾸미는 명사**를 찾아요 🔍"}, {"k": "m", "t": "그 명사가 동작을 **하면** → v-ing (능동) / 동작을 **당하면** → p.p. (수동)"}, {"k": "ex", "en": "Students taking the exam must turn off their phones.", "ko": "시험을 보는 학생들은 휴대전화를 꺼야 한다. (학생들이 시험을 봄 → 능동)"}, {"k": "q", "q": "The bridge ____ in 1990 needs major repairs.", "o": ["building", "built", "builds"], "a": 1, "ok": "맞아요! 다리가 '지어진' 것 → built", "no": "다리는 스스로 짓지 않아요. 지어짐(수동) → built"}, {"k": "m", "t": "풀이 전략 ① 분사 바로 뒤에 **목적어**가 있으면 → 거의 v-ing (the man [selling] tickets) ② 뒤에 **by + 행위자**가 있으면 → p.p. (tickets sold by the man)"}, {"k": "m", "t": "⚠️ 함정: 목적어가 없다고 무조건 p.p.가 아니에요! **자동사**(live, stand, happen, rise, remain…)는 수동이 없으니 v-ing → children [living] in the village"}, {"k": "q", "q": "Many of the animals ____ in the zoo were born there. (동물원에 살고 있는)", "o": ["living", "lived", "are living"], "a": 0, "ok": "정확해요! live는 자동사 → living", "no": "live는 수동태가 없는 자동사 → 능동 living"}, {"k": "m", "t": "명사 **앞**에서 꾸밀 때도 같은 기준 → a **developing** country (발전하고 있는 나라 = 개발도상국) / a **developed** country (발전된 나라 = 선진국)"}, {"k": "m", "t": "정리! **꾸밈받는 명사 찾기 → 하면 v-ing / 당하면 p.p. / 뒤에 목적어면 v-ing, by면 p.p. / 자동사는 v-ing** 👍"}], "notes": {"table": [["판단", "v-ing (능동)", "p.p. (수동)"], ["명사와의 관계", "명사가 동작을 함", "명사가 동작을 당함"], ["뒤에 목적어", "the girl wearing a red coat", "—"], ["뒤에 by + 행위자", "—", "a novel written by Han Kang"], ["자동사", "people living near the river", "(수동 불가)"], ["명사 앞", "a barking dog, a rising price", "a broken window, a used car"]], "tips": ["분사 앞의 전치사구·삽입구를 건너뛰고 진짜 꾸밈받는 명사를 찾기", "명사 뒤 분사 = 관계대명사 + be동사 생략: the boy (who is) holding a cup", "fallen, retired, grown처럼 자동사의 p.p.는 '완료' 의미"]}, "sets": {"workbook": [{"k": "pk", "q": "The man [wearing*/worn] a black suit is our new principal.", "e": "남자가 입고 있음 + 뒤에 목적어 → wearing"}, {"k": "pk", "q": "Most of the products [selling/sold*] in this store are made locally.", "e": "제품이 팔림 → sold"}, {"k": "pk", "q": "There are a lot of apps [designing/designed*] to help students study.", "e": "앱이 설계됨 → designed"}, {"k": "pk", "q": "Children [growing*/grown] up in big cities often lack contact with nature.", "e": "아이들이 자람(자동사 grow up) → growing"}, {"k": "pk", "q": "The letter [sending/sent*] to me last week has not arrived yet.", "e": "편지가 보내짐 → sent"}, {"k": "pk", "q": "Anyone [wanting*/wanted] to join the club should sign up by Friday.", "e": "누구든 원함 + 뒤에 목적어(to join) → wanting"}, {"k": "bl", "q": "그 회의에서 논의된 문제들은 아주 중요했다. → The issues (discussed) at the meeting were very important.", "e": "문제가 논의됨 → p.p."}, {"k": "bl", "q": "창밖을 보고 있는 소녀는 내 사촌이다. → The girl (looking) out the window is my cousin.", "e": "소녀가 봄 → v-ing"}, {"k": "ox", "q": "The money raised at the concert will be given to a children's hospital.", "a": true, "e": "✔ 돈이 모금됨 → raised"}, {"k": "fx", "q": "The pictures taking by my uncle were shown at the gallery.", "w": "taking", "a": ["taken"], "e": "사진이 찍힘(by) → taken"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe study ____ in the journal shows that sleep affects memory.", "o": ["publish", "publishing", "published", "publishes", "to publishing"], "a": 2, "e": "연구가 실림(게재됨) → published"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The boy holding the trophy smiled at the camera.", "Food served in the cafeteria is healthy.", "People living near the airport complain about the noise.", "The novel written by her became a bestseller.", "The players choosing for the national team trained hard."], "a": 4, "e": "⑤ 선수들이 선발됨 → chosen"}, {"k": "pk", "q": "Visitors [entering*/entered] the museum must leave their bags at the front desk.", "e": "방문객이 들어감 + 목적어 the museum → entering"}, {"k": "pk", "q": "The apples [picking/picked*] this morning are still fresh.", "e": "사과가 따짐 → picked"}, {"k": "pk", "q": "The scientist [leading*/led] the project explained the data [collecting/collected*] over ten years.", "e": "과학자가 이끎 → leading / 자료가 수집됨 → collected"}, {"k": "bl", "q": "중국에서 만들어진 장난감 중 다수는 값이 싸다. → Many of the toys (made) in China are cheap.", "e": "장난감이 만들어짐 → made"}, {"k": "bl", "q": "공원에서 개를 산책시키는 사람들은 뒷정리를 해야 한다. → People (walking) their dogs in the park should clean up after them.", "e": "사람들이 산책시킴 + 목적어 → walking"}, {"k": "fx", "q": "The tickets booking online are cheaper than those at the door.", "w": "booking", "a": ["booked"], "e": "표가 예매됨 → booked"}, {"k": "ox", "q": "The number of tourists visited Jeju has increased.", "a": false, "e": "관광객이 방문함 + 목적어 Jeju → visiting"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe old house (A) [standing / stood] on the hill once belonged to a famous writer. The novels (B) [writing / written] in that house are still popular, and the rooms (C) [filling / filled] with her books attract many visitors.", "o": ["standing – writing – filling", "standing – written – filled", "standing – written – filling", "stood – written – filled", "stood – writing – filled"], "a": 1, "e": "(A) 집이 서 있음(자동사) → standing (B) 소설이 쓰임 → written (C) 방이 책으로 채워짐 → filled"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nPlastic (A) [throwing / thrown] away by people often ends up in the ocean. Sea animals (B) [mistaking / mistaken] it for food can die. Scientists (C) [studying / studied] this problem say we must act now.", "o": ["throwing – mistaking – studying", "thrown – mistaken – studied", "thrown – mistaking – studying", "thrown – mistaken – studying", "throwing – mistaken – studied"], "a": 2, "e": "(A) 플라스틱이 버려짐 → thrown (B) 동물이 착각함 + 목적어 it → mistaking (C) 과학자가 연구함 + 목적어 → studying"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The road connecting the two cities was closed.\nⓑ Most of the money spending on ads was wasted.\nⓒ The man arrested by the police denied everything.\nⓓ Anyone caught cheating will fail the test.\nⓔ The houses damaging by the storm are being repaired.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ 돈이 쓰임 → spent / ⓔ 집이 피해를 입음 → damaged"}, {"k": "fx", "q": "Each of the essays submitting after the deadline will lose points.", "w": "submitting", "a": ["submitted"], "e": "에세이가 제출됨 → submitted"}, {"k": "fx", "q": "Some of the paintings displaying in the hall were painted by students.", "w": "displaying", "a": ["displayed"], "e": "그림이 전시됨 → displayed"}, {"k": "pk", "q": "The girl [named*/naming] Yuna won first prize in the contest [holding/held*] last month.", "e": "소녀가 Yuna라고 이름 붙여짐 → named / 대회가 열림 → held"}, {"k": "pk", "q": "Do you know the number of people [killing/killed*] in the accident?", "e": "사람들이 사망함(죽임을 당함) → killed"}, {"k": "wr", "q": "그 도시에서 발견된 고대 동전들은 박물관에 전시되어 있다. (ancient coins, find, in the city, are displayed in the museum)", "a": ["The ancient coins found in the city are displayed in the museum.", "Ancient coins found in the city are displayed in the museum."], "e": "동전이 발견됨 → found"}, {"k": "wr", "q": "무대 위에서 피아노를 치고 있는 남자는 나의 삼촌이다. (the man, play the piano, on the stage)", "a": ["The man playing the piano on the stage is my uncle.", "The man on the stage playing the piano is my uncle."], "e": "남자가 침 → playing"}, {"k": "or", "q": "그 질문에 답하는 학생들은 손을 들어야 한다.", "a": "Students answering the question should raise their hands.", "e": "학생들이 답함 + 목적어 → answering"}, {"k": "ox", "q": "Look at the sleeping baby in the stroller pushed by her father.", "a": true, "e": "✔ 아기가 자고 있음 → sleeping / 유모차가 밀림 → pushed"}]}}, {"tag": "eos-1-P14", "name": "분사구문의 의미상 주어를 찾아라!", "talk": [{"k": "m", "t": "분사구문 네모는 **주절의 주어**부터 찾아요! 따로 주어를 안 쓴 분사구문의 주어 = **주절의 주어** 🎯"}, {"k": "m", "t": "주절 주어가 그 동작을 **하면** v-ing / **당하면** p.p. (앞의 Being은 보통 생략)"}, {"k": "ex", "en": "Written in plain English, the guide is easy to follow.", "ko": "쉬운 영어로 쓰여 있어서, 그 안내서는 따라 하기 쉽다. (안내서가 쓰임 → p.p.)"}, {"k": "q", "q": "____ by the loud noise, the baby started to cry.", "o": ["Waking", "Woken", "Woke"], "a": 1, "ok": "맞아요! 아기가 '깨워진' 것 → Woken", "no": "주절 주어 the baby는 소음에 깨워짐(수동) → Woken"}, {"k": "m", "t": "단서: 분사 뒤에 **목적어**가 있으면 능동 v-ing → **Using** this app, you can… / 목적어 없이 **by ~**가 오면 p.p."}, {"k": "m", "t": "완료형: 주절보다 **앞선 일** → **Having p.p.**(능동) / **(Having been) p.p.**(수동)"}, {"k": "q", "q": "____ in 1885, the bridge is one of the oldest in the city.", "o": ["Building", "Having built", "Built"], "a": 2, "ok": "정확해요! 다리가 지어짐 → (Having been) Built", "no": "다리는 짓는 쪽이 아니라 지어지는 쪽 → Built"}, {"k": "m", "t": "**with + (대)명사 + 분사**: 이번엔 **with 뒤의 명사**가 기준! 명사가 하면 v-ing, 당하면 p.p. → with his eyes [closed] / with the engine running"}, {"k": "q", "q": "She stood there with her arms ____.", "o": ["folding", "folded", "fold"], "a": 1, "ok": "맞아요! 팔이 '접힌' 상태 → folded", "no": "팔은 스스로 접지 않아요 → 수동 folded"}, {"k": "m", "t": "정리! **분사구문은 주절 주어, with 구문은 with 뒤 명사 — 하면 v-ing / 당하면 p.p. / 앞선 일은 Having (been)** 👍"}], "notes": {"table": [["형태", "의미상 주어와의 관계", "예"], ["v-ing", "주절 주어가 함", "Seeing the police, the thief ran away."], ["(Being) p.p.", "주절 주어가 당함", "(Being) Surrounded by trees, the house is quiet."], ["Having p.p.", "앞선 일 + 능동", "Having finished dinner, we went out."], ["(Having been) p.p.", "앞선 일 + 수동", "(Having been) Built in 1900, the hall needs repairs."], ["with + 명사 + v-ing", "명사가 함", "with the dog following me"], ["with + 명사 + p.p.", "명사가 당함", "with his legs crossed"]], "tips": ["분사구문 네모 → 콤마 뒤 주절의 주어에 밑줄부터", "부정: Not + v-ing / Not having p.p. / Not having been p.p.", "관용: Compared with ~ (비교하면), Judging from ~ (판단하건대)"]}, "sets": {"workbook": [{"k": "pk", "q": "[Seeing*/Seen] the dark clouds, we decided to stay home.", "e": "우리가 봄 → Seeing"}, {"k": "pk", "q": "[Surrounding/Surrounded*] by mountains, the village is cool even in summer.", "e": "마을이 둘러싸임 → Surrounded"}, {"k": "pk", "q": "[Having finished*/Finished] the report, she sent it to her boss.", "e": "그녀가 끝냄(앞선 일) + 목적어 → Having finished"}, {"k": "pk", "q": "He fell asleep with the TV [turning/turned*] on.", "e": "TV가 켜짐 → turned on"}, {"k": "pk", "q": "She was jogging with her dog [following*/followed] her.", "e": "개가 따라옴 + 목적어 her → following"}, {"k": "bl", "q": "Because it was written in a hurry, the letter had many mistakes. → (Written) in a hurry, the letter had many mistakes.", "e": "편지가 쓰임 → Written"}, {"k": "bl", "q": "When I looked out the window, I saw a rainbow. → (Looking) out the window, I saw a rainbow.", "e": "내가 봄 → Looking"}, {"k": "ox", "q": "Made of glass, the vase must be handled carefully.", "a": true, "e": "✔ 꽃병이 유리로 만들어짐 → Made"}, {"k": "ox", "q": "Locating in the city center, the hotel is popular with tourists.", "a": false, "e": "호텔이 위치해 있음(be located) → Located"}, {"k": "fx", "q": "He listened to the lecture with his legs crossing.", "w": "crossing", "a": ["crossed"], "e": "다리가 꼬임 → crossed"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\n____ from space, the Earth looks like a blue marble.", "o": ["Seeing", "Seen", "Having seen", "Saw", "To seeing"], "a": 1, "e": "지구가 보임 → Seen"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Hearing the news, she burst into tears.", "Built on a hill, the castle has a great view.", "Leaving early, we avoided the traffic.", "Injuring in the accident, he couldn't play.", "Not knowing her address, I couldn't send the card."], "a": 3, "e": "④ 그가 부상을 당함 → Injured"}, {"k": "pk", "q": "[Comparing/Compared*] with last year, sales have doubled.", "e": "매출이 비교됨 → Compared with"}, {"k": "pk", "q": "[Having been told*/Having told] that he passed, he felt relieved.", "e": "그가 (합격했다는 말을) 들음 → 수동 Having been told"}, {"k": "pk", "q": "The man sat on the bench with his eyes [fixing/fixed*] on the screen.", "e": "눈이 고정됨 → fixed"}, {"k": "pk", "q": "With prices [rising*/risen] quickly, many families are cutting their spending.", "e": "가격이 오르고 있음(자동사) → rising"}, {"k": "bl", "q": "As he was injured in the game, he had to sit out the season. → (Injured) in the game, he had to sit out the season.", "e": "그가 부상당함 → Injured"}, {"k": "bl", "q": "그녀는 다리를 떨면서 의자에 앉아 있었다. → She sat in the chair with her legs (shaking).", "e": "다리가 떨림(자동사) → shaking"}, {"k": "fx", "q": "Recognizing as a hero, the firefighter received a medal.", "w": "Recognizing", "a": ["Recognized"], "e": "소방관이 영웅으로 인정받음 → Recognized"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) [Locating / Located] near the river, the café offers a beautiful view. (B) [Visiting / Visited] it on a sunny day, you can sit outside with the wind (C) [blowing / blown] gently.", "o": ["Locating – Visiting – blowing", "Located – Visited – blown", "Located – Visiting – blowing", "Located – Visiting – blown", "Locating – Visited – blowing"], "a": 2, "e": "(A) 카페가 위치함 → Located (B) 네가 방문함 + 목적어 it → Visiting (C) 바람이 붊 → blowing"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\n(A) [Facing / Faced] with a difficult choice, Jake asked his teacher for advice. (B) [Listening / Listened] carefully to him, the teacher nodded with her fingers (C) [tapping / tapped] on the desk.", "o": ["Facing – Listening – tapped", "Faced – Listening – tapping", "Faced – Listened – tapping", "Facing – Listened – tapped", "Faced – Listening – tapped"], "a": 1, "e": "(A) be faced with(~에 직면하다) → Faced (B) 선생님이 들음 → Listening (C) 손가락이 두드림 → tapping"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Written in pencil, the note was hard to read.\nⓑ Having been raised in Canada, she speaks English and French.\nⓒ Taking from a distance, the photo looked blurry.\nⓓ He answered the question with his voice trembled.\nⓔ Using this map, you will find the hidden temple.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ 사진이 찍힘 → Taken / ⓓ 목소리 ing).", "e": "결과가 만족을 줌 → v-ing"}, {"k": "bl", "q": "우리는 그 소식에 충격을 받았다. → We were (shocked) at the news.", "e": "우리가 충격을 느낌 → p.p."}, {"k": "ox", "q": "Many people find spiders frightening.", "a": true, "e": "✔ 거미가 공포를 줌"}, {"k": "ox", "q": "She is interesting in learning Chinese.", "a": false, "e": "그녀가 흥미를 느낌 → interested"}, {"k": "fx", "q": "The fans were exciting to see the singer up close.", "w": "exciting", "a": ["excited"], "e": "팬들이 신남을 느낌 → excited"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은?\nThe constant noise from the construction site is really ____.", "o": ["annoy", "annoyed", "annoying", "annoys", "to annoy"], "a": 2, "e": "소음이 짜증을 일으킴 → annoying"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The puzzle was too confusing for the children.", "I was relieved to hear that you were safe.", "The speaker's jokes kept the audience amused.", "He gave a boring speech about tax laws.", "Satisfying with the result, she smiled."], "a": 4, "e": "⑤ 그녀가 만족을 느낌 → Satisfied"}, {"k": "pk", "q": "[Frightening/Frightened*] by the thunder, the dog hid under the bed.", "e": "개가 겁을 먹음 → Frightened"}, {"k": "pk", "q": "The documentary on climate change was [depressing*/depressed], but it made me think.", "e": "다큐가 우울하게 함"}, {"k": "pk", "q": "The [embarrassing*/embarrassed] mistake left her [embarrassing/embarrassed*] for days.", "e": "실수가 당황스럽게 함 / 그녀가 당황함을 느낌"}, {"k": "bl", "q": "나는 그 다큐멘터리가 매우 흥미롭다고 생각했다. → I found the documentary very (interesting).", "e": "목적어(다큐)가 흥미를 줌"}, {"k": "bl", "q": "오랜 기다림에 지쳐서, 그는 집에 갔다. → (Tired) of the long wait, he went home.", "e": "그가 지침을 느낌 → Tired"}, {"k": "fx", "q": "The view from the top of the tower was amazed.", "w": "amazed", "a": ["amazing"], "e": "경치가 놀라움을 줌 → amazing"}, {"k": "ox", "q": "Our math teacher is an inspiring person who always encourages us.", "a": true, "e": "✔ 선생님이 영감을 줌 → inspiring"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe final match was (A) [thrilling / thrilled]. When our team scored i
