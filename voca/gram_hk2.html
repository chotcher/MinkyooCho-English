"q": "How a big house it is!", "w": "How", "a": ["What"], "e": "명사(house) → What"}, {"k": "fx", "q": "What a heavy boxes they are!", "w": "a", "a": ["(삭제)"], "e": "복수 명사 → a ✗"}], "practiceA": [{"k": "ch", "q": "빈칸에 How가 들어가는 것은?", "o": ["____ a sunny day!", "____ cute babies!", "____ fresh the air is!", "____ an old castle!", "____ great news!"], "a": 2, "e": "③ 형용사 fresh만 → How / 나머지는 명사 → What"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 것은?", "o": ["____ an honest boy he is!", "____ bright the moon is!", "____ big eyes she has!", "____ a strange dream it was!", "____ useful information it is!"], "a": 1, "e": "② How / 나머지는 What"}, {"k": "ch", "q": "다음 문장을 감탄문으로 바르게 바꾼 것은?\nThe movie was very boring.", "o": ["What boring the movie was!", "How boring the movie was!", "How boring was the movie!", "What a boring the movie was!", "How the movie was boring!"], "a": 1, "e": "How + 형용사 + 주어 + 동사"}, {"k": "pk", "q": "What [a/an*] amazing view it is!", "e": "amazing 모음 소리 → an"}, {"k": "pk", "q": "How fast [he drives*/does he drive]!", "e": "감탄문 → 주어 + 동사"}, {"k": "bl", "q": "그것은 정말 오래된 탑이구나! → (What) (an) old tower it is!", "e": "old 모음 소리 → an"}, {"k": "bl", "q": "이 수프는 정말 맛있구나! → (How) delicious this soup is!", "e": "How + 형용사"}, {"k": "fx", "q": "What an useful book it is!", "w": "an", "a": ["a"], "e": "useful은 [유] 자음 소리 → a"}, {"k": "ox", "q": "How kind your parents are!", "a": true, "e": "✔ How + 형 + 주 + 동"}, {"k": "ox", "q": "What a good weather it is!", "a": false, "e": "weather는 셀 수 없음 → What good weather"}], "practiceB": [{"k": "wr", "q": "다음 문장을 What 감탄문으로 바꾸시오. (주어 + 동사 포함) It is a very old building.", "a": ["What an old building it is!"], "e": "very 빼고 a → an"}, {"k": "wr", "q": "다음 문장을 How 감탄문으로 바꾸시오. (주어 + 동사 포함) Your sister dances very well.", "a": ["How well your sister dances!"], "e": "How + 부사 + 주어 + 동사"}, {"k": "or", "q": "그것은 정말 신나는 경기였구나!", "a": "What an exciting game it was!", "e": "What an + 형 + 명 + 주 + 동"}, {"k": "or", "q": "그 아이들은 정말 시끄럽구나!", "a": "How noisy the children are!", "e": "How + 형 + 주 + 동"}, {"k": "fx", "q": "How quickly time pass!", "w": "pass", "a": ["passes"], "e": "time은 3인칭 단수 → passes"}, {"k": "fx", "q": "What a interesting idea you had!", "w": "a", "a": ["an"], "e": "interesting 모음 소리 → an"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ What a tall tree it is!\nⓑ How a nice day!\nⓒ What smart students they are!\nⓓ How well he swim!\nⓔ What an easy question it was!", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ What a nice day / ⓓ swims"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nThey are very brave firefighters.\n= ____ brave firefighters they are!", "o": ["What a", "What", "How", "How a", "Very"], "a": 1, "e": "복수 명사 → What (a ✗)"}, {"k": "bl", "q": "A: 나 만점 받았어! B: 와! 정말 좋은 소식이다! → A: I got a perfect score! B: Wow! (What) great news!", "e": "news는 셀 수 없음 → What (a ✗)"}, {"k": "wr", "q": "정말 아름다운 꽃들이구나! (beautiful flowers — 주어 + 동사 없이)", "a": ["What beautiful flowers!"], "e": "복수 → What + 형 + 명"}]}}, {"tag": "hk2-02-2", "name": "의문사 의문문", "talk": [{"k": "m", "t": "의문사 의문문 복습 + 중2 업그레이드! 기본 어순: **의문사 + be동사 / do(does, did) / 조동사 + 주어 ~?** ❓"}, {"k": "ex", "en": "Where did you buy the shoes?", "ko": "너는 그 신발을 어디서 샀니?"}, {"k": "m", "t": "⭐ 의문사가 **주어**일 때는 do를 쓰지 않고 **의문사 + 동사**! 의문사 주어는 **3인칭 단수** 취급"}, {"k": "ex", "en": "Who broke the window? — Minsu did.", "ko": "누가 창문을 깼니? — 민수가."}, {"k": "q", "q": "____ this computer?", "o": ["Who uses", "Who does use", "Who use"], "a": 0, "ok": "맞아요! 의문사 주어 + 동사(3인칭 단수)", "no": "Who가 주어 → do ✗, 3인칭 단수 → Who uses"}, {"k": "m", "t": "누가·누구를: who(m) / 누구의: **whose + 명사** / 무엇: what / 어느 것(정해진 것 중에서): which"}, {"k": "ex", "en": "Whose umbrella is this? — It's mine.", "ko": "이건 누구의 우산이니? — 내 거야."}, {"k": "q", "q": "____ do you like better, cats or dogs?", "o": ["What", "Which", "Who"], "a": 1, "ok": "정확해요! 정해진 것 중 고르기 → Which", "no": "cats or dogs 중에서 고르기 → Which"}, {"k": "m", "t": "How + 형용사 / 부사: how [often](얼마나 자주), how long(얼마나 오래), how far(얼마나 먼), how many + 복수 명사, how much + 셀 수 없는 명사"}, {"k": "q", "q": "____ does it take to get there? — About 20 minutes.", "o": ["How often", "How long", "How far"], "a": 1, "ok": "맞아요! 걸리는 시간 → How long", "no": "20분 '걸린다' → 시간의 길이 → How long"}, {"k": "m", "t": "⚠️ 의문사 의문문에는 Yes / No로 대답하지 않아요! Where do you live? — Yes, I do. ✗"}, {"k": "m", "t": "정리! **의문사 + 동사 + 주어? / 의문사가 주어면 의문사 + 동사? / Yes·No 대답 ✗** 👍"}], "notes": {"table": [["의문사", "뜻", "예"], ["who", "누가, 누구를", "Who called you? / Who(m) did you meet?"], ["whose", "누구의 (것)", "Whose bag is this?"], ["what", "무엇, 무슨", "What do you want? / What color do you like?"], ["which", "어느 (것)", "Which is yours?"], ["when / where", "언제 / 어디서", "When does it start? / Where is he?"], ["why", "왜", "Why were you late? — Because ~"], ["how", "어떻게, 얼마나", "How did you get here? / How often do you swim?"]], "tips": ["의문사가 주어: Who + 동사(3인칭 단수)? (Who knows? ○ / Who does know? ✗)", "How many + 복수 명사 / How much + 셀 수 없는 명사·가격", "의문사 의문문은 Yes / No로 대답 ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "[Who*/Whose] lives in this house?", "e": "의문사 주어 '누가' → Who"}, {"k": "pk", "q": "Who [cleaned*/did clean] the classroom?", "e": "의문사 주어 → do ✗"}, {"k": "pk", "q": "[Where*/When] is the bus stop? — It's next to the bank.", "e": "장소 → Where"}, {"k": "pk", "q": "How [many*/much] students are in your class?", "e": "복수 명사 → many"}, {"k": "bl", "q": "너는 왜 늦었니? → (Why) were you late?", "e": "이유 → Why"}, {"k": "bl", "q": "이것은 누구의 공책이니? → (Whose) notebook is this?", "e": "whose + 명사"}, {"k": "bl", "q": "너는 얼마나 자주 운동하니? → How (often) do you exercise?", "e": "빈도 → How often"}, {"k": "bl", "q": "누가 이 그림을 그렸니? → (Who) (painted|drew) this picture?", "e": "의문사 주어 + 과거 동사"}, {"k": "fx", "q": "Who know the answer?", "w": "know", "a": ["knows"], "e": "의문사 주어는 3인칭 단수 → knows"}, {"k": "fx", "q": "How much books do you have?", "w": "much", "a": ["many"], "e": "복수 명사 → many"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? A: ____ did you go there? B: By subway.", "o": ["What", "When", "How", "Why", "Where"], "a": 2, "e": "방법 → How"}, {"k": "ch", "q": "대화가 자연스럽지 않은 것은?", "o": ["A: Who made this cake? B: My mom did.", "A: How far is the park? B: About 1 km.", "A: Why are you so happy? B: Because I won the game.", "A: Where did you meet him? B: Yes, I did.", "A: Which is your bike? B: The red one."], "a": 3, "e": "④ 의문사 의문문 → Yes/No ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["What happened to you?", "Who wants some juice?", "Where does your aunt live?", "When you will leave?", "How long did you stay there?"], "a": 3, "e": "④ When will you leave?"}, {"k": "pk", "q": "[What*/Which] does your father do? — He's a pilot.", "e": "직업 → What"}, {"k": "pk", "q": "[How*/What] did you get to school? — I walked.", "e": "방법 → How"}, {"k": "pk", "q": "Who [want/wants*] to go first?", "e": "의문사 주어 → 3인칭 단수"}, {"k": "bl", "q": "그 영화는 언제 시작하니? → (When) (does) the movie start?", "e": "When + does + 주어 + 원형"}, {"k": "bl", "q": "이 셔츠는 얼마니? → How (much) is this shirt?", "e": "가격 → How much"}, {"k": "ox", "q": "What time do you usually get up?", "a": true, "e": "✔"}, {"k": "ox", "q": "Who did call you last night?", "a": false, "e": "의문사 주어 → Who called you"}], "practiceB": [{"k": "wr", "q": "누가 너에게 그 소식을 말해 주었니? (tell, the news)", "a": ["Who told you the news?", "Who told the news to you?"], "e": "의문사 주어 + 과거 동사"}, {"k": "wr", "q": "너는 어느 계절을 가장 좋아하니? (which season, like, best)", "a": ["Which season do you like the best?", "Which season do you like best?"], "e": "Which + 명사"}, {"k": "or", "q": "너는 하루에 물을 얼마나 많이 마시니?", "a": "How much water do you drink a day?", "e": "How much + 셀 수 없는 명사"}, {"k": "or", "q": "너는 이번 주말에 무엇을 할 거니?", "a": "What are you going to do this weekend?", "e": "의문사 + be + 주어 + going to"}, {"k": "fx", "q": "Why do she look sad?", "w": "do", "a": ["does"], "e": "she → does"}, {"k": "fx", "q": "Who teach you English?", "w": "teach", "a": ["teaches", "taught"], "e": "의문사 주어 → 3인칭 단수(또는 과거)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Who wants dessert?\nⓑ What did you eat for lunch?\nⓒ How many money do you have?\nⓓ Where you bought it?\nⓔ Whose car is that?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ much / ⓓ Where did you buy it?"}, {"k": "ch", "q": "다음 문장의 twice a month를 묻는 질문으로 알맞은 것은?\nI visit my grandparents twice a month.", "o": ["How long do you visit your grandparents?", "How often do you visit your grandparents?", "When do you visit your grandparents?", "Who do you visit twice a month?", "How many do you visit your grandparents?"], "a": 1, "e": "빈도 → How often"}, {"k": "bl", "q": "A: 여기서 역까지 얼마나 머니? B: 약 2km야. → A: (How) (far) is it from here to the station? B: It's about 2 km.", "e": "거리 → How far"}, {"k": "bl", "q": "A: 쇼핑몰에서 누구를 만났니? B: 지수를 만났어. → A: (Who|Whom) (did) you meet at the mall? B: I met Jisu.", "e": "목적어 '누구를' → Who(m) + did"}]}}, {"tag": "hk2-02-3", "name": "선택의문문", "talk": [{"k": "m", "t": "'A야, 아니면 B야?' 둘 중 하나를 고르게 하는 **선택의문문**! **or**를 써요 🔀"}, {"k": "m", "t": "① 의문사 없이: **Be동사 / Do / 조동사 + 주어 ~ A or B?**"}, {"k": "ex", "en": "Do you want milk or juice? — Juice, please.", "ko": "우유 줄까, 주스 줄까? — 주스 주세요."}, {"k": "m", "t": "② 의문사와 함께: **Which / Who ~, A or B?**"}, {"k": "ex", "en": "Which do you prefer, summer or winter? — I prefer summer.", "ko": "여름과 겨울 중 어느 것을 더 좋아하니? — 여름."}, {"k": "ex", "en": "Who is taller, Jimin or Yuna? — Yuna is.", "ko": "지민이와 유나 중 누가 더 키가 크니? — 유나야."}, {"k": "m", "t": "⚠️ 선택의문문은 **Yes / No로 대답하지 않아요**! 둘 중 하나를 골라서 대답!"}, {"k": "q", "q": "Is your bag red or blue?", "o": ["Yes, it is.", "It's blue.", "No, it isn't."], "a": 1, "ok": "맞아요! 둘 중 하나를 골라 대답", "no": "선택의문문 → Yes/No ✗ → It's blue."}, {"k": "q", "q": "____ do you like more, pizza or chicken?", "o": ["Which", "Who", "Where"], "a": 0, "ok": "정확해요! 사물 중 고르기 → Which", "no": "pizza or chicken(사물) 중 고르기 → Which"}, {"k": "m", "t": "사람 중에 고를 때는 주로 [Who], 사물 중에 고를 때는 Which"}, {"k": "q", "q": "____ runs faster, Tom or Sam?", "o": ["What", "Who", "Where"], "a": 1, "ok": "맞아요! 사람 중 고르기 → Who", "no": "Tom or Sam(사람) → Who"}, {"k": "m", "t": "억양: A는 올리고(↗) B는 내려요(↘). Coffee ↗ or tea ↘?"}, {"k": "m", "t": "정리! **or로 선택 · 사물 Which / 사람 Who · Yes·No 대답 ✗** 👍"}], "notes": {"table": [["형태", "예", "대답"], ["Be동사 + 주어 ~ A or B?", "Is he a doctor or a nurse?", "He's a nurse."], ["Do / Does / Did + 주어 ~ A or B?", "Did you go by bus or by subway?", "By subway."], ["조동사 + 주어 ~ A or B?", "Will you stay or leave?", "I'll stay."], ["Which ~, A or B?", "Which do you want, this or that?", "This one."], ["Who ~, A or B?", "Who is older, you or your brother?", "My brother is."]], "tips": ["선택의문문은 Yes / No로 대답 ✗", "사람: 주로 Who / 사물: Which", "Which + 명사도 가능: Which color do you like, red or green?", "or 앞뒤는 같은 형태 (swimming or running)"]}, "sets": {"workbook": [{"k": "pk", "q": "Do you want tea [or*/and] coffee? (둘 중 하나)", "e": "선택 → or"}, {"k": "pk", "q": "[Which*/Who] do you like better, math or science?", "e": "사물 → Which"}, {"k": "pk", "q": "Is today Monday [or*/and] Tuesday?", "e": "선택 → or"}, {"k": "pk", "q": "A: Is this your pen or Jina's? B: [It's Jina's*/Yes, it is].", "e": "선택의문문 → Yes/No ✗"}, {"k": "bl", "q": "너는 버스로 가니, 아니면 걸어서 가니? → Do you go by bus (or) on foot?", "e": "or"}, {"k": "bl", "q": "너는 개와 고양이 중 어느 것을 더 좋아하니? → (Which) do you like better, dogs (or) cats?", "e": "Which ~, A or B?"}, {"k": "bl", "q": "Ann과 Ben 중 누가 더 나이가 많니? → (Who|Which) is older, Ann or Ben?", "e": "사람 → 주로 Who"}, {"k": "bl", "q": "A: 미나에게 전화했니, 아니면 지호에게 했니? B: 지호에게 했어. → A: Did you call Mina or Jiho? B: I (called) Jiho.", "e": "하나를 골라 대답"}, {"k": "fx", "q": "Which do you want, juice and water?", "w": "and", "a": ["or"], "e": "선택 → or"}, {"k": "fx", "q": "Do your brother play the piano or the violin?", "w": "Do", "a": ["Does"], "e": "your brother → Does"}], "practiceA": [{"k": "ch", "q": "대답으로 알맞은 것은? A: Which do you want, the red one or the blue one?", "o": ["Yes, I do.", "No, I don't.", "The blue one, please.", "No, I want it.", "Yes, the red one."], "a": 2, "e": "선택의문문 → 하나 골라 대답"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ is heavier, this box or that one?", "o": ["Who", "Which", "Where", "Why", "How"], "a": 1, "e": "사물 중 고르기 → Which"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Is he your uncle or your cousin?", "Which do you like, rice or bread?", "Do you like apples or bananas?", "Who sings better, Mina or Yujin?", "Which you want, coffee or tea?"], "a": 4, "e": "⑤ Which do you want ~?"}, {"k": "pk", "q": "Will you stay home [or*/so] go out?", "e": "선택 → or"}, {"k": "pk", "q": "A: Does she live in Seoul or Busan? B: [She lives in Busan*/Yes, she does].", "e": "Yes/No ✗"}, {"k": "bl", "q": "그는 의사니, 아니면 간호사니? → (Is) he a doctor (or) a nurse?", "e": "Be동사 + 주어 ~ A or B?"}, {"k": "bl", "q": "너는 수학과 영어 중 어느 과목을 더 좋아하니? → (Which) subject do you like more, math or English?", "e": "Which + 명사"}, {"k": "fx", "q": "Which do you prefer, swimming or run?", "w": "run", "a": ["running"], "e": "or 앞뒤 같은 형태 → running"}, {"k": "ox", "q": "Which is heavier, this box or that box? — Yes, this box is.", "a": false, "e": "Yes ✗ → This box is."}, {"k": "ox", "q": "Who is taller, your father or your mother?", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "너는 봄과 가을 중 어느 계절을 더 좋아하니? (which season, like better, spring, fall)", "a": ["Which season do you like better spring or fall?", "Which season do you like better, spring or autumn?", "Which season do you like better, spring or fall?"], "e": "Which + 명사 ~, A or B?"}, {"k": "wr", "q": "너는 어제 영화를 봤니, 아니면 쇼핑하러 갔니? (watch a movie, go shopping, yesterday)", "a": ["Yesterday, did you watch a movie or go shopping?", "Did you watch a movie or go shopping yesterday?"], "e": "Did + 주어 + 원형 A or 원형 B"}, {"k": "or", "q": "너와 너의 형 중 누가 더 일찍 일어나니?", "a": "Who gets up earlier, you or your brother?", "e": "Who + 동사 ~, A or B?"}, {"k": "or", "q": "이것은 네 것이니, 아니면 그의 것이니?", "a": "Is this yours or his?", "e": "Be동사 + 주어 A or B?"}, {"k": "fx", "q": "Is your sister a teacher or a nurse? — She are a nurse.", "w": "are", "a": ["is"], "e": "She → is"}, {"k": "fx", "q": "Which color do you like, red and yellow?", "w": "and", "a": ["or"], "e": "선택 → or"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: ____\nB: I prefer the mountains.", "o": ["Do you like the mountains?", "Which do you prefer, the sea or the mountains?", "Where do you live?", "Who likes the mountains, you or Tom?", "Did you go to the mountains?"], "a": 1, "e": "선호 선택 → Which do you prefer ~?"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Is it a cat or a dog?\nⓑ Which do you want, milk or juice?\nⓒ Who is smarter, Jin or Hana?\nⓓ Do he like soccer or baseball?\nⓔ Which you like, tea or coffee?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ Does he / ⓔ Which do you like"}, {"k": "bl", "q": "A: 배고프니, 아니면 목마르니? B: 목말라. → A: (Are) you hungry (or) thirsty? B: I'm thirsty.", "e": "Be동사 + 주어 A or B?"}, {"k": "bl", "q": "A: 엄마와 아빠 중 누가 요리를 더 잘하시니? B: 아빠가 더 잘하셔. → A: Who cooks better, your mom or your dad? B: My dad (does).", "e": "일반동사 → does로 대답"}]}}, {"tag": "hk2-02-4-1", "name": "의문사가 있는 간접의문문", "talk": [{"k": "m", "t": "의문문이 다른 문장 속에 쏙 들어가면 **간접의문문**! 문장의 일부(주로 목적어)가 돼요 📦"}, {"k": "ex", "en": "Where is he? → I know where he is.", "ko": "그는 어디 있니? → 나는 그가 어디 있는지 안다."}, {"k": "m", "t": "어순: **의문사 + 주어 + 동사** (평서문 순서!)"}, {"k": "m", "t": "do / does / did가 있던 의문문은 do를 **빼고**, 동사에 **시제·수**를 넣어요: Where does she live? → Tell me where she [lives]."}, {"k": "ex", "en": "What did he buy? → I wonder what he bought.", "ko": "그가 무엇을 샀니? → 나는 그가 무엇을 샀는지 궁금하다."}, {"k": "q", "q": "Do you know ____?", "o": ["where is the library", "where the library is", "where does the library is"], "a": 1, "ok": "맞아요! 의문사 + 주어 + 동사", "no": "간접의문문은 평서문 어순 → where the library is"}, {"k": "m", "t": "⭐ 의문사가 **주어**면 어순 그대로! Who broke the cup? → Do you know who broke the cup?"}, {"k": "q", "q": "I don't know ____ the window.", "o": ["who opened", "who did open", "who opens did"], "a": 0, "ok": "정확해요! 의문사 주어 + 동사", "no": "Who가 주어 → who opened 그대로"}, {"k": "m", "t": "⚠️ 앞 문장 동사가 **think, believe, guess, imagine**이면 의문사를 **문장 맨 앞**으로! Do you think? + What does he want? → [What] do you think he wants?"}, {"k": "q", "q": "'너는 그가 몇 살이라고 생각하니?'", "o": ["Do you think how old he is?", "How old do you think he is?", "How old do you think is he?"], "a": 1, "ok": "맞아요! think → 의문사(How old) 맨 앞", "no": "think류는 의문사 맨 앞 + do you think + 주어 + 동사"}, {"k": "m", "t": "정리! **의문사 + 주어 + 동사 · do는 빼고 시제·수 반영 · think류는 의문사 맨 앞** 👍"}], "notes": {"table": [["직접의문문", "간접의문문"], ["Where is the bank?", "Can you tell me where the bank is?"], ["What does she want?", "I know what she wants."], ["When did they arrive?", "I wonder when they arrived."], ["Who made this? (의문사 주어)", "Do you know who made this?"], ["What does he like? + Do you think?", "What do you think he likes?"]], "tips": ["의문사 + 주어 + 동사 (평서문 어순)", "do / does / did를 없애고 동사에 시제·수 반영", "의문사가 주어면 어순 그대로", "think, believe, guess, imagine → 의문사를 문장 맨 앞으로"]}, "sets": {"workbook": [{"k": "pk", "q": "I know [where she lives*/where does she live].", "e": "의문사 + 주어 + 동사"}, {"k": "pk", "q": "Tell me [what your name is*/what is your name].", "e": "의문사 + 주어 + 동사"}, {"k": "pk", "q": "Do you know [who made*/who did make] this cake?", "e": "의문사 주어 → 그대로"}, {"k": "pk", "q": "I wonder [why he was*/why was he] angry.", "e": "의문사 + 주어 + 동사"}, {"k": "bl", "q": "나는 그가 언제 올지 모른다. → I don't know (when) he will come.", "e": "의문사 when"}, {"k": "bl", "q": "그녀가 무엇을 원하는지 말해 줘. → Tell me what she (wants).", "e": "does 빼고 wants"}, {"k": "bl", "q": "너는 그가 어디서 그 가방을 샀는지 아니? → Do you know where he (bought) the bag?", "e": "did 빼고 과거형"}, {"k": "bl", "q": "나는 누가 그 경주에서 이겼는지 궁금하다. → I wonder (who) (won) the race.", "e": "의문사 주어 + 동사"}, {"k": "fx", "q": "Do you know where she live?", "w": "live", "a": ["lives"], "e": "does를 빼면 동사에 -s → lives"}, {"k": "fx", "q": "I want to know what time it start.", "w": "start", "a": ["starts"], "e": "it → starts"}], "practiceA": [{"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nI don't know. + Why is she crying?", "o": ["I don't know why is she crying.", "I don't know why she is crying.", "I don't know why does she cry.", "Why I don't know she is crying.", "I don't know she why is crying."], "a": 1, "e": "의문사 + 주어 + 동사"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["Can you tell me where is the station?", "I wonder what does he want.", "Do you know who wrote this book?", "Please tell me how did you solve it.", "I don't know when did he leave."], "a": 2, "e": "③ 의문사 주어 → 그대로"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ do you think she is?", "o": ["Do you know who", "Who", "Whether", "If", "That"], "a": 1, "e": "think → 의문사 맨 앞: Who do you think she is?"}, {"k": "pk", "q": "[Do you think what/What do you think*] he wants?", "e": "think → 의문사 맨 앞"}, {"k": "pk", "q": "I don't remember [where I put*/where did I put] my key.", "e": "의문사 + 주어 + 동사"}, {"k": "bl", "q": "너는 그 영화가 몇 시에 시작하는지 아니? → Do you know what time the movie (starts)?", "e": "does 빼고 starts"}, {"k": "bl", "q": "너는 누가 그 일을 할 거라고 생각하니? → (Who) do you think will do the job?", "e": "think + 의문사 주어 → Who do you think + 동사"}, {"k": "fx", "q": "Can you tell me how much these shoes costs?", "w": "costs", "a": ["cost"], "e": "these shoes(복수) → cost"}, {"k": "ox", "q": "I wonder why was he late.", "a": false, "e": "why he was late"}, {"k": "ox", "q": "Do you know who broke the vase?", "a": true, "e": "✔ 의문사 주어"}], "practiceB": [{"k": "wr", "q": "두 문장을 한 문장으로 쓰시오. Do you know? + Where does Mr. Lee live?", "a": ["Do you know where Mr. Lee lives?"], "e": "does 빼고 lives"}, {"k": "wr", "q": "두 문장을 한 문장으로 쓰시오. Do you think? + Why did she leave early?", "a": ["Why do you think she left early?"], "e": "think → 의문사 맨 앞 / did 빼고 left"}, {"k": "or", "q": "나는 그가 왜 화를 냈는지 모르겠다.", "a": "I don't know why he got angry.", "e": "의문사 + 주어 + 동사"}, {"k": "or", "q": "너는 그녀가 몇 살이라고 생각하니?", "a": "How old do you think she is?", "e": "think → How old 맨 앞"}, {"k": "fx", "q": "I wonder when the train leave.", "w": "leave", "a": ["leaves", "left", "will leave"], "e": "the train → leaves (시제에 맞게)"}, {"k": "fx", "q": "Can you tell me where the bus stop are?", "w": "are", "a": ["is"], "e": "the bus stop 단수 → is"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I know where he works.\nⓑ Tell me what is your hobby.\nⓒ Do you know who made this?\nⓓ What do you think he likes?\nⓔ Do you guess where she is?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ what your hobby is / ⓔ Where do you guess she is?"}, {"k": "ch", "q": "빈칸에 들어갈 말로 알맞은 것은? A: Do you know ____? B: Yes. It's on the 3rd floor.", "o": ["where is the restroom", "where the restroom is", "the restroom where is", "where does the restroom", "is where the restroom"], "a": 1, "e": "의문사 + 주어 + 동사"}, {"k": "bl", "q": "나는 어제 몇 명이 파티에 왔는지 궁금하다. → I wonder how many people (came) to the party yesterday.", "e": "의문사구(how many people)가 주어 → 그대로 + 과거"}, {"k": "wr", "q": "너는 내가 어디에서 그를 만났다고 생각하니? (think, meet him)", "a": ["Where do you think I met him?"], "e": "think → Where 맨 앞"}]}}, {"tag": "hk2-02-4-2", "name": "의문사가 없는 간접의문문", "talk": [{"k": "m", "t": "의문사가 **없는** 의문문(Yes/No 의문문)을 문장 안에 넣을 때는? **if / whether**(~인지 아닌지)를 써요 🤔"}, {"k": "m", "t": "어순: **if / whether + 주어 + 동사**"}, {"k": "ex", "en": "Is he at home? → I don't know if he is at home.", "ko": "그는 집에 있니? → 나는 그가 집에 있는지 모른다."}, {"k": "ex", "en": "Did she call? → I wonder whether she called.", "ko": "그녀가 전화했니? → 나는 그녀가 전화했는지 궁금하다."}, {"k": "q", "q": "Can you tell me ____ open today?", "o": ["if the store is", "is the store", "if is the store"], "a": 0, "ok": "맞아요! if + 주어 + 동사", "no": "의문사가 없으면 if + 주어 + 동사"}, {"k": "m", "t": "do / does / did는 똑같이 빼고 동사에 시제·수 반영: Does he like it? → I'm not sure if he [likes] it."}, {"k": "m", "t": "'~인지 아닌지'를 강조하는 **or not**: whether or not ~ ○ / whether ~ or not ○ / if ~ or not ○ / **if or not ✗**"}, {"k": "q", "q": "I don't know ____ she will come.", "o": ["whether or not", "if or not", "that"], "a": 0, "ok": "정확해요! whether or not ○", "no": "if or not은 붙여 쓸 수 없어요 → whether or not"}, {"k": "m", "t": "⚠️ that은 '~라는 것'(확실한 내용) → '~인지'에는 if / whether! I wonder that ~ ✗"}, {"k": "q", "q": "Ask him ____ he can help us.", "o": ["that", "if", "what"], "a": 1, "ok": "맞아요! '~인지' → if", "no": "'도와줄 수 있는지' → if / whether"}, {"k": "m", "t": "정리! **if / whether + 주어 + 동사 · if or not ✗ · '~인지'에 that ✗** 👍"}], "notes": {"table": [["직접의문문", "간접의문문"], ["Is it true?", "I wonder if it is true. / I wonder whether it is true."], ["Does she know me?", "I'm not sure if she knows me."], ["Did they win?", "Do you know whether they won?"], ["Can he swim?", "Ask him if he can swim."], ["Will it rain?", "I wonder whether it will rain or not."]], "tips": ["if / whether + 주어 + 동사", "whether or not ○ / if or not ✗ (if ~ or not은 ○)", "의문사가 있으면 의문사로, 없으면 if / whether로 연결"]}, "sets": {"workbook": [{"k": "pk", "q": "I wonder [if*/that] he likes me.", "e": "'~인지' → if"}, {"k": "pk", "q": "Do you know [if she is*/is she] a teacher?", "e": "if + 주어 + 동사"}, {"k": "pk", "q": "I'm not sure [whether*/what] it will rain tomorrow.", "e": "의문사 없는 의문문 → whether"}, {"k": "pk", "q": "Tell me [if you can*/if can you] come.", "e": "if + 주어 + 동사"}, {"k": "bl", "q": "나는 그가 진실을 말하고 있는지 궁금하다. → I wonder (if|whether) he is telling the truth.", "e": "if / whether"}, {"k": "bl", "q": "나는 그녀가 그 책을 읽었는지 모른다. → I don't know if she (read) the book.", "e": "did 빼고 과거형 read"}, {"k": "bl", "q": "그에게 우리와 함께 갈 수 있는지 물어봐. → Ask him (if|whether) he (can) go with us.", "e": "if + 주어 + can + 원형"}, {"k": "bl", "q": "나는 그것이 사실인지 아닌지 모르겠다. → I don't know whether it is true or (not).", "e": "whether ~ or not"}, {"k": "fx", "q": "I wonder that she will come.", "w": "that", "a": ["if", "whether"], "e": "'~인지' → if / whether"}, {"k": "fx", "q": "Do you know if he have a car?", "w": "have", "a": ["has"], "e": "he → has"}], "practiceA": [{"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nI wonder. + Does Tom like spicy food?", "o": ["I wonder does Tom like spicy food.", "I wonder if Tom likes spicy food.", "I wonder if does Tom like spicy food.", "I wonder that Tom likes spicy food.", "I wonder if Tom like spicy food."], "a": 1, "e": "if + 주어 + 동사(-s)"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? I wonder ____ he will join us.", "o": ["if", "whether", "what", "whether or not", "when"], "a": 2, "e": "③ what 뒤에는 빠진 말이 있어야 함"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Do you know if she is busy?", "I wonder whether he passed the test.", "I don't know if or not it is true.", "Ask her if she can drive.", "I'm not sure whether it's yours or not."], "a": 2, "e": "③ if or not ✗ → whether or not"}, {"k": "pk", "q": "I don't know [whether*/if] or not he will come.", "e": "whether or not ○ / if or not ✗"}, {"k": "pk", "q": "Ask her [if she wants*/does she want] some tea.", "e": "if + 주어 + 동사"}, {"k": "bl", "q": "나는 내일 날씨가 좋을지 궁금하다. → I wonder (if|whether) the weather (will) be nice tomorrow.", "e": "'~인지' 명사절 → 미래는 will"}, {"k": "bl", "q": "너는 그들이 경기에서 이겼는지 아니? → Do you know if they (won) the game?", "e": "did 빼고 과거형"}, {"k": "fx", "q": "I'm not sure if he are at home.", "w": "are", "a": ["is"], "e": "he → is"}, {"k": "ox", "q": "I wonder if or not she will come.", "a": false, "e": "whether or not"}, {"k": "ox", "q": "Do you know whether the museum opens on Mondays?", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "두 문장을 한 문장으로 쓰시오. (if 사용) I want to know. + Is Jisu sick?", "a": ["I want to know if Jisu is sick."], "e": "if + 주어 + 동사"}, {"k": "wr", "q": "두 문장을 한 문장으로 쓰시오. (whether 사용) Please tell me. + Did you finish your homework?", "a": ["Please tell me whether you finished your homework or not.", "Please tell me whether you finished your homework."], "e": "did 빼고 finished"}, {"k": "or", "q": "나는 그가 나를 기억하는지 궁금하다.", "a": "I wonder if he remembers me.", "e": "if + 주어 + 동사"}, {"k": "or", "q": "그녀가 올지 안 올지 나는 모르겠다.", "a": "I don't know whether or not she will come.", "e": "whether or not"}, {"k": "fx", "q": "Please ask him whether he can help us or no.", "w": "no", "a": ["not"], "e": "whether ~ or not"}, {"k": "fx", "q": "Do you know if Jisu like cats?", "w": "like", "a": ["likes"], "e": "Jisu → likes"}, {"k": "ch", "q": "빈칸에 공통으로 들어갈 말은?\n• I don't know ____ it is true or not.\n• ____ you need help, call me.", "o": ["that", "whether", "if", "what", "when"], "a": 2, "e": "~인지(if) / 만약 ~라면(if)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wonder if she knows my name.\nⓑ Do you know is he Korean?\nⓒ I'm not sure whether it will snow.\nⓓ Tell me if or not you agree.\nⓔ Ask her if she can come.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ if he is Korean / ⓓ whether or not"}, {"k": "bl", "q": "A: 박물관은 오늘 문을 여니? B: 잘 모르겠어. 문을 여는지 확인해 보자. → A: Is the museum open today? B: I'm not sure. Let's check (if|whether) it (is) open.", "e": "if / whether + 주어 + 동사"}, {"k": "wr", "q": "나는 그가 그 시험에 합격했는지 궁금하다. (wonder, pass the test)", "a": ["I wonder whether or not he passed the test.", "I wonder if he passed the test or not.", "I wonder whether he passed the test or not.", "I wonder whether he passed the test.", "I wonder if he passed the test."], "e": "if / whether + 주어 + 과거 동사"}]}}, {"tag": "hk2-02-5", "name": "부가의문문", "talk": [{"k": "m", "t": "마지막! 문장 끝에서 '그렇지?' 하고 확인하는 **부가의문문** 🏷️ 기본 규칙 복습!"}, {"k": "m", "t": "① 긍정 → 부정, 부정 → 긍정 ② be동사·조동사는 그대로, 일반동사는 do / does / did ③ 주어는 대명사로 ④ 부정은 줄임말로"}, {"k": "ex", "en": "Your brother plays soccer, doesn't he?", "ko": "너의 형은 축구를 하지, 그렇지 않니?"}, {"k": "q", "q": "Jenny and Kate were late, ____?", "o": ["weren't they", "didn't they", "wasn't she"], "a": 0, "ok": "맞아요! 복수 주어 + were → weren't they", "no": "Jenny and Kate → they, were → weren't"}, {"k": "m", "t": "중2 업그레이드 ⭐ **There is / are** → 부가의문문에도 there! There is a bank near here, [isn't] there?"}, {"k": "m", "t": "⭐ **I am ~** → aren't I? (amn't ✗) / ⭐ **never, no** 같은 부정어가 있으면 부정문 → 긍정 부가의문문: He never lies, does he?"}, {"k": "q", "q": "She never eats breakfast, ____?", "o": ["doesn't she", "does she", "is she"], "a": 1, "ok": "정확해요! never → 부정문 → 긍정 부가의문문", "no": "never가 있으면 부정문 → does she"}, {"k": "q", "q": "There aren't any eggs, ____?", "o": ["are they", "are there", "aren't there"], "a": 1, "ok": "맞아요! There 문장 → there로", "no": "There aren't ~ → are there?"}, {"k": "m", "t": "명령문 → will you? (부정 명령문도 will you) / Let's ~ → shall we?"}, {"k": "ex", "en": "Don't be late, will you? / Let's go home, shall we?", "ko": "늦지 마, 알았지? / 집에 가자, 응?"}, {"k": "m", "t": "대답은 **사실** 기준: You aren't hungry, are you? — Yes, I am. (배고파) / No, I'm not. (안 배고파)"}, {"k": "m", "t": "🎉 Chapter 2 다양한 문장의 종류 끝!"}], "notes": {"table": [["앞 문장", "부가의문문", "예"], ["There is / are", "be동사 (+ not) + there?", "There is a problem, isn't there?"], ["I am ~", "aren't I?", "I'm right, aren't I?"], ["never, no 등 부정어", "긍정 부가의문문", "She never cries, does she?"], ["have(가지다)", "do / does / did", "He has a cat, doesn't he?"], ["현재완료", "have / has (+ not)", "You have met him, haven't you?"], ["명령문", "will you?", "Be quiet, will you? / Don't run, will you?"], ["Let's ~", "shall we?", "Let's start, shall we?"]], "tips": ["주어는 대명사로 (this / that → it, these / those → they)", "대답은 사실 기준 — 그렇다면 Yes, 아니면 No", "부정 부가의문문은 줄임말 (isn't, don't, can't)"]}, "sets": {"workbook": [{"k": "pk", "q": "There is a park near here, [isn't there*/isn't it]?", "e": "There 문장 → there"}, {"k": "pk", "q": "I'm your best friend, [aren't I*/am not I]?", "e": "I am → aren't I"}, {"k": "pk", "q": "Your sister wears glasses, [doesn't she*/isn't she]?", "e": "일반동사 → doesn't"}, {"k": "pk", "q": "He never tells lies, [does he*/doesn't he]?", "e": "never → 긍정 부가의문문"}, {"k": "bl", "q": "이것은 네 신발이지, 그렇지 않니? → These are your shoes, (aren't) (they)?", "e": "these → they"}, {"k": "bl", "q": "그것을 만지지 마, 알았지? → Don't touch it, (will) you?", "e": "부정 명령문도 will you"}, {"k": "bl", "q": "사진 찍자, 그럴래? → Let's take a picture, (shall) (we)?", "e": "Let's → shall we"}, {"k": "bl", "q": "민호는 수영을 못하지, 그렇지? → Minho can't swim, (can) (he)?", "e": "부정 → 긍정, 조동사 그대로"}, {"k": "fx", "q": "There are many people here, aren't they?", "w": "they", "a": ["there"], "e": "There 문장 → aren't there"}, {"k": "fx", "q": "You never call me, don't you?", "w": "don't", "a": ["do"], "e": "never → 긍정 부가의문문"}], "practiceA": [{"k": "ch", "q": "부가의문문이 바른 것은?", "o": ["There is a cat, isn't it?", "I'm late, amn't I?", "She never smiles, doesn't she?", "Let's dance, shall we?", "Close the door, do you?"], "a": 3, "e": "④ / ① isn't there ② aren't I ③ does she ⑤ will you"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Your parents didn't go to the party, ____?", "o": ["did they", "didn't they", "were they", "do they", "did your parents"], "a": 0, "e": "부정 → 긍정, 대명사 they"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: You weren't at school yesterday, were you? B: ____ I was sick.", "o": ["Yes, I was.", "No, I wasn't.", "Yes, I wasn't.", "No, I did.", "Yes, I did."], "a": 1, "e": "학교에 없었다(사실) → No, I wasn't."}, {"k": "pk", "q": "There wasn't much time, [was there*/wasn't there]?", "e": "부정 → 긍정 + there"}, {"k": "pk", "q": "Don't forget my birthday, [will you*/do you]?", "e": "명령문 → will you"}, {"k": "pk", "q": "The boys have never been to Jeju, [have they*/haven't they]?", "e": "never → 긍정, 현재완료 → have"}, {"k": "bl", "q": "Sam과 나는 같은 반이지, 그렇지 않니? → Sam and I are in the same class, (aren't) (we)?", "e": "Sam and I → we"}, {"k": "bl", "q": "너의 개는 많이 짖지, 그렇지 않니? → Your dog barks a lot, (doesn't) (it)?", "e": "일반동사 3인칭 단수 → doesn't it"}, {"k": "ox", "q": "I am taller than you, aren't I?", "a": true, "e": "✔ I am → aren't I"}, {"k": "ox", "q": "There are some cookies left, aren't they?", "a": false, "e": "aren't there"}], "practiceB": [{"k": "wr", "q": "빈칸에 알맞은 부가의문문을 쓰시오. There is a problem with the computer, ____?", "a": ["isn't there"], "e": "There is → isn't there"}, {"k": "wr", "q": "빈칸에 알맞은 부가의문문을 쓰시오. Your mom never drinks coffee, ____?", "a": ["does she"], "e": "never → 긍정 / 일반동사 → does"}, {"k": "or", "q": "그것은 쉬운 문제였지, 그렇지 않니?", "a": "It was an easy question, wasn't it?", "e": "was → wasn't it"}, {"k": "or", "q": "창문 좀 열어 줄래?", "a": "Open the window, will you?", "e": "명령문 → will you"}, {"k": "fx", "q": "Let's go to the movies, will we?", "w": "will", "a": ["shall"], "e": "Let's → shall we"}, {"k": "fx", "q": "Your cousins live in Canada, don't you?", "w": "you", "a": ["they"], "e": "your cousins → they"}, {"k": "ch", "q": "부가의문문이 바른 것을 모두 고른 것은?\nⓐ I'm right, aren't I?\nⓑ There are two banks, aren't there?\nⓒ He never cooks, doesn't he?\nⓓ Don't be noisy, will you?\nⓔ Mina has a brother, isn't she?", "o": ["ⓐ, ⓑ, ⓓ", "ⓐ, ⓒ", "ⓑ, ⓔ", "ⓒ, ⓓ, ⓔ", "ⓐ, ⓓ"], "a": 0, "e": "ⓒ does he ⓔ doesn't she"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Tom can drive, can't he?\nⓑ There is no milk, is there?\nⓒ You've finished it, haven't you?\nⓓ Let's take a break, shall we?\nⓔ Your sister likes music, isn't she?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ doesn't she"}, {"k": "bl", "q": "A: 너는 고기를 안 먹지, 그렇지? B: 응, 안 먹어. 나는 채식주의자야. → A: You don't eat meat, do you? B: (No), I (don't). I'm a vegetarian.", "e": "안 먹는다(사실) → No, I don't."}, {"k": "wr", "q": "너는 그 소식을 들었지, 그렇지 않니? (hear the news — 과거시제)", "a": ["You heard the news, didn't you?"], "e": "일반동사 과거 → didn't you"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "정말 신나는 여행이었구나! (What, exciting trip, it was)", "a": ["What an exciting trip it was!"], "e": "What an + 형 + 명 + 주 + 동"}, {"k": "wr", "q": "그 아기는 정말 귀엽구나! (How, cute, the baby)", "a": ["How cute the baby is!"], "e": "How + 형 + 주 + 동"}, {"k": "wr", "q": "누가 이 편지를 썼니? (write this letter)", "a": ["Who wrote this letter?"], "e": "의문사 주어 + 동사"}, {"k": "wr", "q": "너는 우유와 주스 중 어느 것을 원하니? (Which, want, milk, juice)", "a": ["Which do you want milk or juice?", "Which do you want, milk or juice?"], "e": "선택의문문"}, {"k": "wr", "q": "나는 그녀가 어디에 사는지 모른다. (know, live)", "a": ["I don't know where she lives."], "e": "의문사 + 주어 + 동사"}, {"k": "wr", "q": "너는 그가 무엇을 원한다고 생각하니? (think, want)", "a": ["What do you think he wants?"], "e": "think → 의문사 맨 앞"}, {"k": "wr", "q": "나는 그가 내일 올지 궁금하다. (wonder, if, come)", "a": ["I wonder if he will come tomorrow."], "e": "if + 주어 + will (명사절)"}, {"k": "bl", "q": "이 근처에 버스 정류장이 있지, 그렇지 않니? → There is a bus stop near here, (isn't) (there)?", "e": "There 문장 → isn't there"}, {"k": "fx", "q": "I don't know if or not he is busy.", "w": "if", "a": ["whether"], "e": "if or not ✗ → whether or not"}, {"k": "or", "q": "그녀는 절대 늦지 않지, 그렇지?", "a": "She is never late, is she?", "e": "never → 긍정 부가의문문"}], "test": [{"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ an amazing story it is!\n____ well she plays the guitar!", "o": ["What – What", "What – How", "How – What", "How – How", "What a – How"], "a": 1, "e": "명사 → What / 부사 → How"}, {"k": "ch", "q": "다음 문장을 감탄문으로 바르게 바꾼 것은?\nThey are very honest boys.", "o": ["What a honest boys they are!", "What an honest boys they are!", "What honest boys they are!", "How honest boys they are!", "What honest boys are they!"], "a": 2, "e": "복수 명사 → What + 형 + 명 + 주 + 동"}, {"k": "ch", "q": "대화가 자연스럽지 않은 것은?", "o": ["A: Which do you like, tea or coffee? B: Coffee.", "A: Who is taller, you or Jun? B: Jun is.", "A: Is it yours or Mina's? B: Yes, it is.", "A: How often do you swim? B: Twice a week.", "A: Why are you tired? B: Because I slept late."], "a": 2, "e": "③ 선택의문문 → Yes/No ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Who knows the answer?", "What happened last night?", "Whose phone is ringing?", "Who did win the game?", "How many eggs do you need?"], "a": 3, "e": "④ Who won the game?"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nDo you know? + What time does the bank open?", "o": ["Do you know what time does the bank open?", "Do you know what time the bank opens?", "What time do you know the bank opens?", "Do you know what time the bank open?", "Do you know the bank opens what time?"], "a": 1, "e": "does 빼고 opens"}, {"k": "ch", "q": "빈칸에 들어갈 말로 알맞은 것은? ____ do you think will win the game?", "o": ["Do you know who", "Who", "If", "Whether", "That"], "a": 1, "e": "think → 의문사 주어 Who 맨 앞"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 것은?", "o": ["I wonder ____ he is busy.", "I don't know ____ she likes me.", "Ask him ____ he can come.", "Tell me ____ you are from.", "I'm not sure ____ it is true."], "a": 3, "e": "④ where / 나머지는 if(whether)"}, {"k": "ch", "q": "부가의문문이 바른 것은?", "o": ["There is a pen, isn't it?", "I'm late, am I?", "He never cries, does he?", "Let's go, will you?", "Mina likes it, isn't she?"], "a": 2, "e": "③ never → 긍정"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: Jake didn't come to the party, did he? B: ____ He was busy.", "o": ["Yes, he did.", "No, he didn't.", "Yes, he didn't.", "No, he did.", "Yes, he was."], "a": 1, "e": "안 왔다(사실) → No, he didn't."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wonder if she will come.\nⓑ Can you tell me where is the bank?\nⓒ How old do you think he is?\nⓓ Do you think where he is?\nⓔ I don't know whether or not it's true.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ where the bank is / ⓓ Where do you think he is?"}, {"k": "ch", "q": "대답으로 알맞은 것은? A: Do you go to school by bus or on foot?", "o": ["Yes, I do.", "No, I don't.", "I go on foot.", "Yes, by bus.", "I don't like the bus."], "a": 2, "e": "선택의문문 → 하나 골라 대답"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["What a beautiful garden you have!", true], ["How a kind girl she is!", false], ["Who sent you this gift?", true], ["Where did you buy it?", true], ["How much water do you need?", true], ["Which do you prefer, rice and noodles?", false], ["I know what he wants.", true], ["Tell me where does he live.", false], ["Who do you think is right?", true], ["I wonder that she is at home.", false], ["There is a library near here, isn't there?", true], ["He never lies, doesn't he?", false]], "e": "ⓑ What a kind girl ⓕ rice or noodles ⓗ where he lives ⓙ if(whether) she is ⓛ does he"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["What fresh air it is!", true], ["How fast the car goes!", true], ["Who want to play soccer?", false], ["Why was she so angry?", true], ["Is this your pen or Tom's?", true], ["Who is older, you or Kate?", true], ["Do you know who did make this?", false], ["What do you think she will buy?", true], ["I'm not sure if or not he will come.", false], ["Ask her whether she can swim.", true], ["I'm right, amn't I?", false], ["Let's go out, shall we?", true]], "e": "ⓒ Who wants ⓖ who made ⓘ whether or not ⓚ aren't I"}, {"k": "wr", "q": "How 감탄문으로 바꾸시오. (주어 + 동사 포함) The question is very difficult.", "a": ["How difficult the question is!"], "e": "How + 형 + 주 + 동"}, {"k": "wr", "q": "간접의문문을 써서 한 문장으로 쓰시오. I wonder. + Did she get my message?", "a": ["I wonder whether or not she got my message.", "I wonder if she got my message or not.", "I wonder whether she got my message.", "I wonder if she got my message."], "e": "if / whether + 주어 + 과거 동사"}]}}, {"book": "hk2", "chapter": {"id": "03", "name": "시제", "title": "해커스 중학영문법 2학년 · Chapter 3 시제"}, "units": [{"tag": "hk2-03-1", "name": "현재시제", "talk": [{"k": "m", "t": "Chapter 3은 **시제**! 먼저 **현재시제** — 현재의 상태, 반복되는 습관, 변하지 않는 사실에 써요 ⏰"}, {"k": "ex", "en": "My brother walks to school every day.", "ko": "내 남동생은 매일 걸어서 학교에 간다. (습관)"}, {"k": "ex", "en": "Water boils at 100°C.", "ko": "물은 100°C에서 끓는다. (과학적 사실)"}, {"k": "m", "t": "3인칭 단수 주어면 동사 + -s / -es: watch → watches, study → [studies], have → has"}, {"k": "q", "q": "The earth ____ around the sun.", "o": ["moves", "moved", "move"], "a": 0, "ok": "맞아요! 과학적 사실 → 현재시제", "no": "변하지 않는 사실은 현재시제 + 3인칭 단수 → moves"}, {"k": "m", "t": "⭐ 중2 핵심: **시간·조건의 부사절**(when, before, after, until, if)에서는 미래 일이라도 **현재시제**!"}, {"k": "ex", "en": "If it rains tomorrow, we will stay home.", "ko": "내일 비가 오면 우리는 집에 있을 것이다."}, {"k": "q", "q": "I'll call you when I ____ home.", "o": ["will get", "get", "got"], "a": 1, "ok": "정확해요! 시간 부사절 → 현재시제", "no": "when ~(시간 부사절)은 미래라도 현재 → get"}, {"k": "m", "t": "⚠️ 단, '~인지'(명사절) if는 미래면 will 그대로: I wonder if it [will] rain tomorrow."}, {"k": "q", "q": "I don't know if she ____ tomorrow.", "o": ["will co ats.", "If you will need help, call me.", "He usually goes to bed at ten.", "Time flies."], "a": 2, "e": "③ If you need help"}, {"k": "ch", "q": "빈칸에 will이 들어갈 수 있는 것은?", "o": ["If it ____ snow, we will make a snowman.", "When she ____ arrive, tell me.", "I don't know if he ____ come tomorrow.", "Wait here until I ____ come back.", "After you ____ finish, call me."], "a": 2, "e": "③ '~인지' 명사절 → will ○ / 나머지는 부사절"}, {"k": "pk", "q": "When summer [comes*/will come], I'll go to the beach.", "e": "시간 부사절 → 현재"}, {"k": "pk", "q": "I'm not sure if Tom [will join*/joins] us tomorrow.", "e": "'~인지' 명사절 → will"}, {"k": "pk", "q": "Our class [begins*/began] at 9 every day.", "e": "반복되는 일 → 현재"}, {"k": "bl", "q": "숙제를 끝내면 TV를 봐도 된다. → If you (finish) your homework, you can watch TV.", "e": "조건 부사절 → 현재"}, {"k": "bl", "q": "그 영화는 내일 저녁 7시에 시작한다. → The movie (starts|begins) at 7 tomorrow evening.", "e": "정해진 일정 → 현재"}, {"k": "fx", "q": "My sister watch TV every evening.", "w": "watch", "a": ["watches"], "e": "-ch → es"}, {"k": "ox", "q": "I'll tell her the news when she will come home.", "a": false, "e": "when she comes home"}], "practiceB": [{"k": "wr", "q": "내일 눈이 오면 우리는 눈사람을 만들 것이다. (snow, make a snowman)", "a": ["We will make a snowman if it snows tomorrow.", "If it snows tomorrow we will make a snowman.", "If it snows tomorrow, we will make a snowman."], "e": "조건 부사절 → 현재"}, {"k": "wr", "q": "그는 저녁 식사 후에 항상 산책을 한다. (always, take a walk, after dinner)", "a": ["After dinner, he always takes a walk.", "After dinner he always takes a walk.", "He always takes a walk after dinner."], "e": "습관 → 현재 + 3인칭 단수"}, {"k": "or", "q": "그녀가 돌아오기 전에 방을 청소하자.", "a": "Let's clean the room before she comes back.", "e": "시간 부사절 → 현재"}, {"k": "or", "q": "나는 그가 내일 올지 모르겠다.", "a": "I don't know if he will come tomorrow.", "e": "명사절 if → will"}, {"k": "fx", "q": "You will be late if you doesn't hurry.", "w": "doesn't", "a": ["don't"], "e": "you → don't"}, {"k": "fx", "q": "The library close at 6 p. ll, be late, again)", "a": ["I will not be late again.", "I won't be late again."], "e": "won't + be"}, {"k": "wr", "q": "그들은 다음 달에 이사할 예정이니? (be going to, move, next month)", "a": ["Are they going to move next month?"], "e": "Be동사 + 주어 + going to + 원형"}, {"k": "or", "q": "그는 오늘 밤에 너에게 전화할 것이다.", "a": "He will call you tonight.", "e": "will + 원형"}, {"k": "or", "q": "우리는 내일 소풍을 갈 예정이다.", "a": "We are going to go on a picnic tomorrow.", "e": "be going to + 원형"}, {"k": "fx", "q": "Will Tom comes to the meeting?", "w": "comes", "a": ["come"], "e": "Will + 주어 + 원형"}, {"k": "fx", "q": "I'm going to visited Paris next year.", "w": "visited", "a": ["visit"], "e": "going to + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It will be sunny tomorrow.\nⓑ Is he going to sell his car?\nⓒ They will to leave soon.\nⓓ I'm not going to give up.\nⓔ She will is busy tomorrow.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ will leave / ⓔ will be"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nI'm planning to visit Gyeongju this weekend.\n= I ____ visit Gyeongju this weekend.", "o": ["will going to", "am going to", "going to", "am going", "will be to"], "a": 1, "e": "계획 → be going to"}, {"k": "bl", "q": "A: 지하철을 탈 거니? B: 아니. 나는 걸어갈 거야. → A: (Are) you going to take the subway? B: No. I'm going to walk.", "e": "Be동사 + 주어 + going to"}, {"k": "wr", "q": "A: 너는 그 파티에 갈 거니? (be going to) B: 응, 갈 거야. — B의 대답만 쓰시오.", "a": ["Yes, I am."], "e": "Are you going to ~? → Yes, I am."}]}}, {"tag": "hk2-03-4", "name": "진행시제", "talk": [{"k": "m", "t": "**진행시제**: 어떤 순간에 **하고 있는 중**인 일 🏃 be동사 + -ing"}, {"k": "m", "t": "현재진행: am / is / are + -ing (~하고 있다) / 과거진행: was / were + -ing (~하고 있었다)"}, {"k": "ex", "en": "When you called me, I was taking a shower.", "ko": "네가 전화했을 때 나는 샤워하고 있었다."}, {"k": "m", "t": "-ing 만들기: -e 빼고 + ing (make → making) / -ie → y + ing (lie → [lying], die → dying) / 단모음 + 단자음 → 겹치고 + ing (run → [running])"}, {"k": "q", "q": "swim의 -ing형은?", "o": ["swiming", "swimming", "swimmming"], "a": 1, "ok": "맞아요! 단모음 + 단자음 → m 겹치기", "no": "swim은 i + m → swimming"}, {"k": "m", "t": "⭐ 중2 핵심: **상태·감정·소유·인지**를 나타내는 동사는 진행형 ✗ → know, like, love, want, need, have(가지다), believe, own, belong to"}, {"k": "q", "q": "I ____ the answer.", "o": ["am knowing", "know", "knowing"], "a": 1, "ok": "정확해요! know는 진행형 ✗", "no": "know(알다)는 상태 동사 → 진행형 ✗ → I know"}, {"k": "m", "t": "⚠️ 단, have가 '먹다·(시간을) 보내다'면 진행형 ○: We are having lunch now. / They're having fun."}, {"k": "q", "q": "어법상 옳은 것은?", "o": ["She is having a pet dog.", "She is having breakfast.", "She is wanting a pet."], "a": 1, "ok": "맞아요! have(먹다)는 진행형 ○", "no": "have(가지다)·want는 진행형 ✗ / have breakfast(먹다)는 ○"}, {"k": "m", "t": "부정: be동사 + not + -ing / 의문: Be동사 + 주어 + -ing? — Yes, I am. / No, he wasn't."}, {"k": "m", "t": "정리! **be + -ing · 상태 동사는 진행형 ✗ · have(먹다)는 ○** 👍"}], "notes": {"table": [["시제", "형태", "예"], ["현재진행", "am / is / are + -ing", "She is reading a book now."], ["과거진행", "was / were + -ing", "They were playing soccer at 3 p.m."], ["부정", "be동사 + not + -ing", "I wasn't sleeping."], ["의문", "Be동사 + 주어 + -ing?", "Are you listening? — Yes, I am."]], "tips": ["진행형 ✗: know, like, love, hate, want, need, have(가지다), believe, own, belong to", "have가 '먹다, 보내다'면 진행형 ○ (have dinner, have a good time)", "-ie → ying: lie → lying, die → dying, tie → tying"]}, "sets": {"workbook": [{"k": "pk", "q": "Look! The baby [is sleeping*/sleeps] now.", "e": "지금 하는 중 → 현재진행"}, {"k": "pk", "q": "I [was*/am] watching TV at 9 last night.", "e": "last night → 과거진행"}, {"k": "pk", "q": "He [has*/is having] two sisters.", "e": "have(가지다) → 진행형 ✗"}, {"k": "pk", "q": "The old man is [lying*/lieing] on the bench.", "e": "-ie → ying"}, {"k": "bl", "q": "그들은 지금 축구를 하고 있다. → They (are) (playing) soccer now.", "e": "현재진행"}, {"k": "bl", "q": "나는 그때 저녁을 먹고 있었다. → I (was) (having|eating) dinner then.", "e": "과거진행 / have(먹다) ○"}, {"k": "bl", "q": "-ing형: die → (dying) / sit → (sitting) / write → (writing)", "e": "-ie → ying / 겹치기 / -e 빼기"}, {"k": "bl", "q": "너는 내 말을 듣고 있니? → (Are) you listening to me?", "e": "Be동사 + 주어 + -ing?"}, {"k": "fx", "q": "We were swiming in the pool.", "w": "swiming", "a": ["swimming"], "e": "m 겹치기"}, {"k": "fx", "q": "They was running in the park.", "w": "was", "a": ["were"], "e": "They → were"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She is cooking now.", "They were dancing at the party.", "I am knowing his name.", "We are having a great time.", "He was lying on the grass."], "a": 2, "e": "③ I know his name."}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? Right now, he is ____.", "o": ["running", "reading a book", "having lunch", "owning a car", "taking a nap"], "a": 3, "e": "④ own은 진행형 ✗"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: What were you doing at 7 last night? B: I ____ my homework.", "o": ["do", "am doing", "was doing", "were doing", "did doing"], "a": 2, "e": "과거진행 → was doing"}, {"k": "pk", "q": "This bag [belongs*/is belonging] to Jimin.", "e": "belong to → 진행형 ✗"}, {"k": "pk", "q": "When I came in, they [were*/are] talking.", "e": "과거 → were"}, {"k": "pk", "q": "Were you sleeping? — No, I [wasn't*/didn't].", "e": "Were → wasn't"}, {"k": "bl", "q": "그녀는 지금 친구를 기다리고 있다. → She (is) (waiting) for her friend now.", "e": "현재진행"}, {"k": "bl", "q": "그 학생들은 그때 공부하고 있지 않았다. → The students (weren't|were not) studying then.", "e": "과거진행 부정"}, {"k": "fx", "q": "Tom is siting next to me.", "w": "siting", "a": ["sitting"], "e": "t 겹치기"}, {"k": "ox", "q": "She is liking chocolate.", "a": false, "e": "like는 진행형 ✗ → She likes chocolate."}], "practiceB": [{"k": "wr", "q": "그는 그때 샤워를 하고 있었다. (take a shower, then)", "a": ["Then, he was taking a shower.", "Then he was taking a shower.", "He was taking a shower then."], "e": "과거진행"}, {"k": "wr", "q": "그녀는 차를 한 대 가지고 있다. (have a car — 진행형을 쓸 수 있는지 판단하시오)", "a": ["She has a car."], "e": "have(가지다) → 진행형 ✗"}, {"k": "or", "q": "너는 지금 무엇을 하고 있니?", "a": "What are you doing now?", "e": "의문사 + be + 주어 + -ing"}, {"k": "or", "q": "내가 그를 봤을 때 그는 울고 있었다.", "a": "He was crying when I saw him.", "e": "과거진행"}, {"k": "fx", "q": "I was makeing a cake when you called.", "w": "makeing", "a": ["making"], "e": "-e 빼고 + ing"}, {"k": "fx", "q": "Mina and Jun is playing badminton now.", "w": "is", "a": ["are"], "e": "Mina and Jun → are"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He is having a big house.\nⓑ They are having dinner now.\nⓒ I was tying my shoes.\nⓓ She is knowing the truth.\nⓔ We were waiting for the bus.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ has / ⓓ knows"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• At that time, I ____ a letter.\n• Now, Tom ____ a picture.", "o": ["write – draws", "was writing – is drawing", "am writing – was drawing", "was writing – was drawing", "wrote – drawing"], "a": 1, "e": "그때 → 과거진행 / 지금 → 현재진행"}, {"k": "bl", "q": "A: 네가 떠날 때 비가 오고 있었니? B: 응, 그랬어. → A: Was it raining when you left? B: Yes, it (was).", "e": "Was → was"}, {"k": "wr", "q": "그 개는 문 앞에 누워 있다. (lie, in front of the door)", "a": ["The dog is lying in front of the door."], "e": "lie → lying"}]}}, {"tag": "hk2-03-5-1", "name": "현재완료시제", "talk": [{"k": "m", "t": "**현재완료**: have / has + 과거분사(p.p.) — 과거에 일어난 일이 **현재까지** 영향을 줄 때 🔗"}, {"k": "ex", "en": "I have lived here since 2020.", "ko": "나는 2020년부터 여기에 살아 왔다. (지금도 산다)"}, {"k": "m", "t": "주어가 3인칭 단수면 [has], 나머지는 have / 줄임말: I've, you've, he's, she's, it's, they've"}, {"k": "q", "q": "My sister ____ already finished her homework.", "o": ["have", "has", "is"], "a": 1, "ok": "맞아요! 3인칭 단수 → has + p.p.", "no": "My sister(3인칭 단수) → has"}, {"k": "m", "t": "⚠️ he's는 he is / he has 둘 다 될 수 있어요. 뒤에 **p.p.**가 오면 has! He's gone. = He has gone."}, {"k": "m", "t": "부정: have / has + **not**(never) + p.p. → haven't / hasn't"}, {"k": "ex", "en": "I haven't seen the movie yet.", "ko": "나는 아직 그 영화를 보지 않았다."}, {"k": "m", "t": "의문: **Have / Has + 주어 + p.p. ~?** — Yes, 주어 + have / has. / No, 주어 + haven't / hasn't."}, {"k": "q", "q": "Have you ever eaten Indian food? — No, I ____.", "o": ["didn't", "haven't", "don't"], "a": 1, "ok": "정확해요! Have로 물으면 have로 대답", "no": "Have you ~? → No, I haven't."}, {"k": "q", "q": "She ____ to Busan before.", "o": ["has never been", "has never be", "has been never"], "a": 0, "ok": "맞아요! has + never + p.p.", "no": "never는 has와 p.p. 사이, be의 p.p.는 been"}, {"k": "m", "t": "정리! **have / has + p.p. · 부정 haven't / hasn't · 의문 Have / Has + 주어 + p.p.?** 👍"}], "notes": {"table": [["", "형태", "예"], ["긍정", "have / has + p.p.", "They have finished the work."], ["부정", "have / has + not(never) + p.p.", "He hasn't called me yet."], ["의문", "Have / Has + 주어 + p.p. ~?", "Has she arrived? — Yes, she has. / No, she hasn't."], ["의문사 의문문", "의문사 + have / has + 주어 + p.p. ~?", "How long have you known him?"]], "tips": ["he's, she's, it's + p.p. → has의 줄임말", "never는 have와 p.p. 사이: I have never seen it.", "대답도 have / has로 (Did, Do ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "I [have*/has] lost my umbrella.", "e": "I → have"}, {"k": "pk", "q": "He [has*/have] worked here for ten years.", "e": "He → has"}, {"k": "pk", "q": "We have [knew/known*] each other since childhood.", "e": "have + p.p. → known"}, {"k": "pk", "q": "[Have*/Did] you ever been to Japan?", "e": "been(p.p.) → Have"}, {"k": "bl", "q": "그녀는 막 도착했다. → She (has) just (arrived).", "e": "has + just + p.p."}, {"k": "bl", "q": "나는 아직 그 책을 읽지 않았다. → I (haven't|have not) read the book yet.", "e": "haven't + p.p."}, {"k": "bl", "q": "너는 그를 만난 적이 있니? → (Have) you ever (met) him?", "e": "Have + 주어 + p.p.?"}, {"k": "bl", "q": "너의 아빠는 세차를 다 하셨니? — 응, 하셨어. → Has your dad cleaned the car? — Yes, he (has).", "e": "Has → has"}, {"k": "fx", "q": "They has already left.", "w": "has", "a": ["have"], "e": "They → have"}, {"k": "fx", "q": "I have finish my report.", "w": "finish", "a": ["finished"], "e": "have + p.p."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Minho ____ his homework yet.", "o": ["didn't finished", "hasn't finished", "haven't finished", "isn't finished", "not finished"], "a": 1, "e": "3인칭 단수 → hasn't + p.p."}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Have you seen my bag?", "He hasn't eaten anything.", "We have been friends for years.", "She has wrote a letter.", "They have just come back."], "a": 3, "e": "④ has written"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: Has Jisu ever ridden a horse? B: No, ____.", "o": ["she didn't", "she doesn't", "she hasn't", "she isn't", "she haven't"], "a": 2, "e": "Has → hasn't"}, {"k": "pk", "q": "She's [gone*/go] to the store.", "e": "she's = she has → p.p."}, {"k": "pk", "q": "I have [never*/ever] seen snow. (본 적 없다)", "e": "부정 → never"}, {"k": "pk", "q": "[Has*/Have] Tom finished the test?", "e": "Tom → Has"}, {"k": "bl", "q": "그들은 이미 저녁을 먹었다. → They (have) already (had|eaten) dinner.", "e": "have + already + p.p."}, {"k": "bl", "q": "그는 열쇠를 잃어버렸다. (그래서 지금 없다) → He (has) (lost) his key.", "e": "has + p.p."}, {"k": "fx", "q": "Have you ever saw a whale?", "w": "saw", "a": ["seen"], "e": "Have + 주어 + p.p."}, {"k": "ox", "q": "Have they arrived? — Yes, they did.", "a": false, "e": "Yes, they have."}], "practiceB": [{"k": "wr", "q": "나는 그 영화를 세 번 봤다. (have, see, the movie, three times)", "a": ["I've seen the movie three times.", "I have seen the movie three times."], "e": "have + p.p."}, {"k": "wr", "q": "너는 숙제를 끝냈니? (have, finish, your homework)", "a": ["Have you finished your homework yet?", "Have you finished your homework?"], "e": "Have + 주어 + p.p.?"}, {"k": "or", "q": "그는 아직 그 소식을 듣지 못했다.", "a": "He hasn't heard the news yet.", "e": "hasn't + p.p. + yet"}, {"k": "or", "q": "너는 제주도에 가 본 적이 있니?", "a": "Have you ever been to Jeju Island?", "e": "Have + 주어 + ever + p.p.?"}, {"k": "fx", "q": "My parents has been married for 20 years.", "w": "has", "a": ["have"], "e": "My parents → have"}, {"k": "fx", "q": "Has she ever eat sushi?", "w": "eat", "a": ["eaten"], "e": "Has + 주어 + p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have lived in Seoul since 2019.\nⓑ He has never seen a lion.\nⓒ Have you finish lunch?\nⓓ They haven't decided yet.\nⓔ She have just gone out.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ finished / ⓔ has"}, {"k": "ch", "q": "'s가 has의 줄임말이 아닌 것은?", "o": ["He's gone home.", "She's finished her work.", "It's been a long day.", "He's a good cook.", "She's lost her phone."], "a": 3, "e": "④ He is / 나머지는 뒤에 p.p. → has"}, {"k": "bl", "q": "A: 멕시코 음식을 먹어 본 적 있니? B: 응, 있어. 맛있었어. → A: (Have) you ever (tried|eaten|had) Mexican food? B: Yes, I have. It was delicious.", "e": "Have + 주어 + ever + p.p.?"}, {"k": "wr", "q": "그녀는 그 사실을 한 번도 잊은 적이 없다. (never, forget, the fact)", "a": ["She's never forgotten the fact.", "She has never forgotten the fact."], "e": "has + never + p.p."}]}}, {"tag": "hk2-03-5-2", "name": "현재완료시제의 용법", "talk": [{"k": "m", "t": "현재완료의 4가지 용법! **계속 · 경험 · 완료 · 결과** — 함께 쓰는 말이 힌트예요 🔑"}, {"k": "m", "t": "① **계속** '(지금까지) ~해 왔다': [for] + 기간 (for three years) / since + 시작 시점 (since 2020, since I was ten)"}, {"k": "ex", "en": "She has taught English for ten years.", "ko": "그녀는 10년 동안 영어를 가르쳐 왔다."}, {"k": "q", "q": "I have known him ____ I was five.", "o": ["for", "since", "ago"], "a": 1, "ok": "맞아요! 시작 시점 → since", "no": "I was five(시작 시점) → since"}, {"k": "m", "t": "② **경험** '~해 본 적이 있다': ever, never, before, once, twice, ~ times"}, {"k": "ex", "en": "Have you ever tried kimchi? — Yes, twice.", "ko": "김치를 먹어 본 적 있니? — 응, 두 번."}, {"k": "m", "t": "③ **완료** '막 / 이미 / 아직 ~했다': just, already, yet(부정문·의문문)"}, {"k": "ex", "en": "The bus has just left.", "ko": "버스가 막 떠났다."}, {"k": "m", "t": "④ **결과** '~해 버렸다 (그래서 지금 …하다)': lose, go, leave, break 등"}, {"k": "ex", "en": "He has lost his phone.", "ko": "그는 휴대전화를 잃어버렸다. (그래서 지금 없다)"}, {"k": "m", "t": "⭐ **have been to** ~에 가 본 적이 있다(경험) vs **have gone to** ~에 가 버렸다 → 지금 여기 없음(결과)"}, {"k": "q", "q": "Jake isn't here. He ____ to London.", "o": ["has been", "has gone", "have gone"], "a": 1, "ok": "정확해요! 가 버려서 지금 없음 → has gone", "no": "여기 없다 → 결과 → has gone"}, {"k": "q", "q": "A: How long have you lived here? B: ____", "o": ["Since three years.", "For three years.", "Three years ago."], "a": 1, "ok": "맞아요! 기간 → for", "no": "How long ~? (계속) → For + 기간"}, {"k": "m", "t": "정리! **계속(for·since) · 경험(ever·never) · 완료(just·already·yet) · 결과(lost·gone)** 👍"}], "notes": {"table": [["용법", "뜻", "함께 쓰는 말", "예"], ["계속", "~해 왔다", "for + 기간, since + 시점, How long ~?", "We have been friends since 2021."], ["경험", "~해 본 적 있다", "ever, never, before, once, twice", "I have met her twice."], ["완료", "막 / 이미 / 아직 ~했다", "just, already, yet", "Have you finished yet?"], ["결과", "~해 버렸다 (지금 그 결과)", "lose, go, leave, break 등", "She has gone to Paris. (지금 여기 없음)"]], "tips": ["have been to: 가 본 적 있다(경험) / have gone to: 가 버렸다(결과)", "since + 과거 시점 (since last Monday / since I was a child)", "yet은 부정문·의문문, already는 주로 긍정문"]}, "sets": {"workbook": [{"k": "pk", "q": "We have lived here [for*/since] five years.", "e": "기간 → for"}, {"k": "pk", "q": "She has been sick [for/since*] last Friday.", "e": "시점 → since"}, {"k": "pk", "q": "I have [already*/yet] cleaned my room.", "e": "긍정문 → already"}, {"k": "pk", "q": "I haven't finished my work [yet*/already].", "e": "부정문 → yet"}, {"k": "bl", "q": "나는 그 노래를 여러 번 들어 본 적이 있다. → I have (heard) the song many times.", "e": "경험"}, {"k": "bl", "q": "그는 미국에 가 버렸다. (지금 여기 없다) → He has (gone) to America.", "e": "결과 → gone"}, {"k": "bl", "q": "나는 독일에 두 번 가 본 적이 있다. → I have (been) to Germany twice.", "e": "경험 → been"}, {"k": "bl", "q": "너는 얼마나 오래 피아노를 쳐 왔니? → How (long) have you played the piano?", "e": "계속 → How long"}, {"k": "fx", "q": "I have known her since three years.", "w": "since", "a": ["for"], "e": "기간 → for"}, {"k": "fx", "q": "She has gone to Jeju twice.", "w": "gone", "a": ["been"], "e": "경험(twice) → been"}], "practiceA": [{"k": "ch", "q": "현재완료의 용법이 나머지와 다른 것은?", "o": ["I have visited Rome twice.", "Have you ever seen a ghost?", "She has never ridden a bike.", "He has lived here since 2015.", "We have met him before."], "a": 3, "e": "④ 계속 / 나머지는 경험"}, {"k": "ch", "q": "보기 문장과 현재완료의 용법이 같은 것은?\n보기: The train has just arrived.", "o": ["I have lost my wallet.", "She has already done the dishes.", "They have been married for ten years.", "Have you ever been to Canada?", "He has gone to Seoul."], "a": 1, "e": "완료(just, already)"}, {"k": "ch", "q": "빈칸에 since가 들어갈 수 없는 것은?", "o": ["I have been busy ____ Monday.", "She has lived here ____ 2018.", "We have known each other ____ ten years.", "He has worked there ____ he was 20.", "It has rained ____ last night."], "a": 2, "e": "③ 기간 → for"}, {"k": "pk", "q": "My uncle isn't home. He has [gone*/been] to Busan.", "e": "지금 없음 → gone"}, {"k": "pk", "q": "Have you ever [been*/gone] to Paris?", "e": "경험 → been"}, {"k": "pk", "q": "A: How long have you studied English? B: [For six years*/Six years ago].", "e": "How long → For + 기간"}, {"k": "bl", "q": "그녀는 어제부터 아무것도 먹지 않았다. → She hasn't eaten anything (since) yesterday.", "e": "시점 → since"}, {"k": "bl", "q": "그 비행기는 이미 이륙했다. → The plane has (already) taken off.", "e": "완료 → already"}, {"k": "fx", "q": "We haven't seen each other for last year.", "w": "for", "a": ["since"], "e": "시점(last year) → since"}, {"k": "ox", "q": "She has gone to London, so she is here now.", "a": false, "e": "gone → 지금 여기 없음"}], "practiceB": [{"k": "wr", "q": "나는 작년부터 이 동아리의 회원이다. (현재완료, be a member of this club, since last year)", "a": ["Since last year, I have been a member of this club.", "I've been a member of this club since last year.", "I have been a member of this club since last year."], "e": "계속 → since"}, {"k": "wr", "q": "너는 그 영화를 몇 번 봤니? (how many times, see the movie)", "a": ["How many times have you seen the movie?"], "e": "경험 → How many times have you p.p.?"}, {"k": "or", "q": "그는 그의 우산을 잃어버렸다.", "a": "He has lost his umbrella.", "e": "결과"}, {"k": "or", "q": "나는 막 점심을 먹었다.", "a": "I have just had lunch.", "e": "완료 → just"}, {"k": "fx", "q": "My brother has been to Canada, so he isn't here now.", "w": "been", "a": ["gone"], "e": "지금 없음 → gone"}, {"k": "fx", "q": "I haven't finished the book already.", "w": "already", "a": ["yet"], "e": "부정문 → yet"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have lived here for 2015.\nⓑ She has just left.\nⓒ Have you ever been to Busan?\nⓓ He has gone to Tokyo, so he is not here.\nⓔ We haven't eaten dinner yet.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓑⓒⓓⓔ 옳음 / ⓐ since 2015"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nMy sister started to learn yoga two years ago. She still learns it.", "o": ["My sister learned yoga for two years.", "My sister has learned yoga for two years.", "My sister has learned yoga since two years.", "My sister learns yoga two years ago.", "My sister has learned yoga two years ago."], "a": 1, "e": "계속 → has p.p. + for 기간"}, {"k": "bl", "q": "A: 지호를 안 지 얼마나 됐니? B: 우리가 초등학생 때부터야. → A: How long (have) you (known) Jiho? B: Since we were in elementary school.", "e": "How long have you p.p.?"}, {"k": "bl", "q": "엄마는 시장에 가셨다. 곧 돌아오실 것이다. → Mom (has) (gone) to the market. She'll be back soon.", "e": "결과 → has gone"}]}}, {"tag": "hk2-03-5-3", "name": "현재완료시제 vs. 과거시제", "talk": [{"k": "m", "t": "현재완료와 과거시제, 어떻게 다를까? ⚖️ **과거**: 과거에 끝난 일 (지금과 상관 ✗) / **현재완료**: 과거의 일이 **지금까지** 이어짐"}, {"k": "ex", "en": "I lost my key yesterday.", "ko": "나는 어제 열쇠를 잃어버렸다. (과거 사실만 — 지금은 모름)"}, {"k": "ex", "en": "I have lost my key.", "ko": "나는 열쇠를 잃어버렸다. (그래서 지금 없다)"}, {"k": "m", "t": "⭐ **분명한 과거**를 나타내는 말은 현재완료와 함께 못 써요: yesterday, last ~, ~ ago, in + 과거 연도, then, just now, When ~? → I [met] him yesterday. (have met ✗)"}, {"k": "q", "q": "I ____ him two days ago.", "o": ["have met", "met", "have meet"], "a": 1, "ok": "맞아요! ~ ago → 과거시제", "no": "two days ago(분명한 과거) → met"}, {"k": "q", "q": "When ____ the letter?", "o": ["have you written", "did you write", "you wrote"], "a": 1, "ok": "정확해요! When ~? → 과거시제", "no": "When은 분명한 과거 시점을 묻는 말 → did you write"}, {"k": "m", "t": "현재완료와 잘 쓰는 말: for, since, ever, never, just, already, yet, so far(지
