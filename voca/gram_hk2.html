rsty.", "o": ["Yes, please.", "No, thank you.", "Yes, I do.", "No, I don't like.", "Sure, I would."], "a": 1, "e": "거절 → No, thank you."}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I'd like a hamburger.", "Would you like to sit down?", "I would like to see you.", "What would you like to have?", "She would like buy a hat."], "a": 4, "e": "⑤ to buy"}, {"k": "bl", "q": "저는 제 친구를 소개하고 싶어요. → I'd like (to) introduce my friend.", "e": "would like to"}, {"k": "bl", "q": "어디에 가고 싶으세요? → Where (would) you like to go?", "e": "의문사 + would you like to"}, {"k": "pk", "q": "[Would you like*/Do you would like] some cookies?", "e": "Would you like ~?"}, {"k": "pk", "q": "I'd like my brother [to clean*/clean] his room.", "e": "목적어 + to + 원형"}, {"k": "fx", "q": "What would you like to ordering?", "w": "ordering", "a": ["order"], "e": "to + 원형"}, {"k": "ox", "q": "Would you like some water? — Yes, please.", "a": true, "e": "✔"}, {"k": "ox", "q": "I would like to visiting Jeju.", "a": false, "e": "to visit"}], "practiceB": [{"k": "wr", "q": "저는 커피 한 잔을 원해요. (would like, a cup of coffee)", "a": ["I would like a cup of coffee.", "I'd like a cup of coffee."], "e": "would like + 명사"}, {"k": "wr", "q": "저는 당신이 제 생일 파티에 오기를 원해요. (would like, you, to come to my birthday party)", "a": ["I would like you to come to my birthday party.", "I'd like you to come to my birthday party."], "e": "would like + 목적어 + to"}, {"k": "or", "q": "무엇을 마시고 싶으세요?", "a": "What would you like to drink?", "e": "의문사 + would you like to"}, {"k": "or", "q": "저는 그 경기를 보고 싶어요.", "a": "I would like to watch the game.", "e": "would like to"}, {"k": "fx", "q": "Would you like going to the movies?", "w": "going", "a": ["to go"], "e": "would like to + 원형"}, {"k": "fx", "q": "I'd like you meet my parents.", "w": "meet", "a": ["to meet"], "e": "목적어 + to + 원형"}, {"k": "ch", "q": "대화가 자연스러운 것을 모두 고른 것은?\nⓐ A: Would you like some pie? B: Yes, please.\nⓑ A: What would you like to eat? B: I'd like pasta.\nⓒ A: Would you like to dance? B: Yes, I like.\nⓓ A: Would you like some tea? B: No, thank you.\nⓔ A: Where would you like to go? B: Yes, I would.", "o": ["ⓐ, ⓑ, ⓓ", "ⓐ, ⓒ", "ⓑ, ⓒ, ⓔ", "ⓒ, ⓓ", "ⓓ, ⓔ"], "a": 0, "e": "ⓒ I'd love to. / ⓔ 장소로 대답"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'd like some rice.\nⓑ She would like to rest.\nⓒ Would you like dance?\nⓓ I'd like you to stay.\nⓔ What would you like to buy?", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ to dance"}, {"k": "bl", "q": "나는 네가 들어 주었으면 좋겠다. → I want you to listen. = I'd like you (to) listen.", "e": "목적어 + to"}, {"k": "bl", "q": "A: 우리와 함께할래? B: 그러고 싶어. → A: (Would) you like to join us? B: I'd love to.", "e": "Would you like to ~?"}]}}, {"tag": "hk2-04-5", "name": "must, have to", "talk": [{"k": "m", "t": "**must**: ① 의무 '~해야 한다' ② 강한 추측 '~임에 틀림없다' ❗"}, {"k": "ex", "en": "You must wear a helmet.", "ko": "너는 헬멧을 써야 한다. (의무)"}, {"k": "ex", "en": "She must be tired. She worked all day.", "ko": "그녀는 피곤한 게 틀림없다. 하루 종일 일했다. (추측)"}, {"k": "m", "t": "의무 must ≒ **have to** (3인칭 단수 has to). 과거는 [had] to, 미래는 will have to"}, {"k": "q", "q": "I ____ wait for an hour yesterday.", "o": ["must", "had to", "have to"], "a": 1, "ok": "맞아요! must의 과거는 없어서 had to", "no": "과거 '~해야 했다' → had to"}, {"k": "m", "t": "강한 추측의 반대 '~일 리가 없다'는 **can't** (must not ✗): He can't be hungry. He just ate."}, {"k": "q", "q": "That ____ be Tom. He is in London now.", "o": ["must", "can't", "has to"], "a": 1, "ok": "정확해요! ~일 리가 없다 → can't", "no": "런던에 있으니 Tom일 리 없다 → can't"}, {"k": "m", "t": "⚠️ 부정은 뜻이 달라요: **must not** ~하면 안 된다(금지) / **don't have to** ~할 필요 없다 (= don't need to)"}, {"k": "q", "q": "It's Sunday. You ____ get up early.", "o": ["must not", "don't have to", "can't"], "a": 1, "ok": "맞아요! 일요일 → 일찍 일어날 필요 없다", "no": "'~할 필요 없다' → don't have to"}, {"k": "m", "t": "정리! **must = have to(의무) / must be ~임에 틀림없다 ↔ can't be / must not 금지 ≠ don't have to 불필요** 👍"}], "notes": {"table": [["형태", "뜻", "예"], ["must / have to", "~해야 한다 (의무)", "You must(have to) be quiet."], ["had to / will have to", "~해야 했다 / ~해야 할 것이다", "I had to wait."], ["must be", "~임에 틀림없다 (강한 추측)", "He must be sick."], ["can't be", "~일 리가 없다", "It can't be true."], ["must not", "~하면 안 된다 (금지)", "You must not cheat."], ["don't have to", "~할 필요 없다 (= don't need to)", "You don't have to pay."]], "tips": ["have to의 의문문: Do I have to ~? / Does he have to ~?", "강한 추측의 부정은 can't (must not ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "She [has to*/have to] study for the exam.", "e": "3인칭 단수 → has to"}, {"k": "pk", "q": "We [had to*/must] leave early yesterday.", "e": "과거 → had to"}, {"k": "pk", "q": "You [must not*/don't have to] cross the street on a red light.", "e": "금지"}, {"k": "pk", "q": "He just had lunch. He [can't*/must] be hungry.", "e": "~일 리가 없다"}, {"k": "bl", "q": "그는 아픈 게 틀림없다. → He (must) be sick.", "e": "강한 추측"}, {"k": "bl", "q": "너는 오늘 숙제를 할 필요가 없다. → You (don't) have to do your homework today.", "e": "불필요"}, {"k": "bl", "q": "나는 내일 일찍 일어나야 할 것이다. → I will (have) to get up early tomorrow.", "e": "will have to"}, {"k": "bl", "q": "그 소문은 사실일 리가 없다. → The rumor (can't|cannot) be true.", "e": "can't be"}, {"k": "fx", "q": "Mina have to clean her room.", "w": "have", "a": ["has"], "e": "3인칭 단수 → has to"}, {"k": "fx", "q": "I must finish it last night.", "w": "must", "a": ["had to"], "e": "과거 → had to"}], "practiceA": [{"k": "ch", "q": "must의 뜻이 나머지와 다른 것은?", "o": ["You must be quiet.", "We must follow the rules.", "He must be rich. He has three cars.", "Students must wear uniforms.", "You must stop here."], "a": 2, "e": "③ 추측 / 나머지 의무"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The test is next week. You ____ study today. (오늘 공부할 필요는 없다)", "o": ["must not", "don't have to", "can't", "had to", "has to"], "a": 1, "e": "불필요"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She has to work late.", "They had to wait.", "You don't have to pay.", "He musts go now.", "I will have to leave."], "a": 3, "e": "④ must"}, {"k": "bl", "q": "우리는 비 때문에 집에 있어야 했다. → We (had) to stay home because of the rain.", "e": "had to"}, {"k": "bl", "q": "그녀는 영어 선생님임에 틀림없다. → She (must) be an English teacher.", "e": "강한 추측"}, {"k": "pk", "q": "Does he [have to*/has to] go now?", "e": "Does + 주어 + have to"}, {"k": "pk", "q": "You [must not*/don't have to] tell anyone. It's a secret.", "e": "금지"}, {"k": "fx", "q": "You don't must worry about it.", "w": "must", "a": ["have to", "need to"], "e": "불필요 → don't have to"}, {"k": "ox", "q": "He can't be at home. I saw him at school just now.", "a": true, "e": "✔ ~일 리가 없다"}, {"k": "ox", "q": "She doesn't has to come.", "a": false, "e": "have to"}], "practiceB": [{"k": "wr", "q": "너는 여기서 수영하면 안 된다. (must not, swim, here)", "a": ["You must not swim here.", "You mustn't swim here."], "e": "금지"}, {"k": "wr", "q": "그는 그 일을 혼자 해야 했다. (had to, do the work, alone)", "a": ["He had to do the work alone."], "e": "had to"}, {"k": "or", "q": "그녀는 매우 배고픈 게 틀림없다.", "a": "She must be very hungry.", "e": "강한 추측"}, {"k": "or", "q": "너는 서두를 필요가 없다.", "a": "You don't have to hurry.", "e": "불필요"}, {"k": "fx", "q": "He must be a liar. He never lies.", "w": "must", "a": ["can't", "cannot"], "e": "~일 리가 없다 → can't"}, {"k": "fx", "q": "Do I has to bring my lunch?", "w": "has", "a": ["have"], "e": "Do I have to ~?"}, {"k": "ch", "q": "어법상(의미상) 옳은 문장의 개수는?\nⓐ You must not be late.\nⓑ She has to go now.\nⓒ We must leave yesterday.\nⓓ He can't be sick. He is playing soccer.\nⓔ They don't have to wait.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ had to"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nYou ____ smoke here. It's not allowed.\nYou ____ bring anything. We have everything.", "o": ["must not – must not", "don't have to – must not", "must not – don't have to", "have to – don't have to", "can – must not"], "a": 2, "e": "금지 / 불필요"}, {"k": "bl", "q": "I (didn't) have to wear a uniform at my old school. (입을 필요가 없었다)", "e": "과거 불필요"}, {"k": "bl", "q": "A: 이것을 오늘 끝내야 하나요? B: 아니, 그럴 필요 없어. → A: Must I finish this today? B: No, you (don't) have to.", "e": "불필요"}]}}, {"tag": "hk2-04-6", "name": "should, had better", "talk": [{"k": "m", "t": "**should** '~해야 한다, ~하는 게 좋다' (충고·의무) 💬"}, {"k": "ex", "en": "You should drink more water.", "ko": "너는 물을 더 마시는 게 좋겠다."}, {"k": "m", "t": "부정 **should not(shouldn't)** '~하면 안 된다, ~하지 않는 게 좋다' / **ought to**도 should와 같은 뜻"}, {"k": "q", "q": "You look tired. You ____ go to bed early.", "o": ["should", "shouldn't", "must not"], "a": 0, "ok": "맞아요! 충고 → should", "no": "피곤해 보이니 일찍 자는 게 좋다 → should"}, {"k": "m", "t": "**had better** + 동사원형 '~하는 게 낫다' (should보다 강한 충고·경고). 줄여서 **'d better**"}, {"k": "ex", "en": "You'd better take an umbrella.", "ko": "우산을 가져가는 게 좋겠다."}, {"k": "m", "t": "⚠️ 부정은 had better **not** + 원형 (had not better ✗) / had지만 **현재·미래**의 뜻!"}, {"k": "q", "q": "You had better ____ late again.", "o": ["not be", "don't be", "not to be"], "a": 0, "ok": "정확해요! had better not + 원형", "no": "had better 바로 뒤에 not, 그다음 원형"}, {"k": "m", "t": "정리! **should 충고 / had better (not) + 원형 / ought to = should** 👍"}], "notes": {"table": [["형태", "뜻", "예"], ["should", "~해야 한다, ~하는 게 좋다", "You should listen to her."], ["should not", "~하면 안 된다", "You shouldn't run here."], ["ought to", "~해야 한다 (= should)", "You ought to apologize."], ["had better ('d better)", "~하는 게 낫다 (강한 충고)", "You'd better hurry."], ["had better not", "~하지 않는 게 낫다", "You'd better not go."]], "tips": ["had better not + 원형 (had not better ✗, had better don't ✗)", "had better to ✗, should to ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "You [should*/should to] wear a seat belt.", "e": "should + 원형"}, {"k": "pk", "q": "We [shouldn't*/don't should] waste food.", "e": "should not"}, {"k": "pk", "q": "You [had better*/have better] see a doctor.", "e": "had better"}, {"k": "pk", "q": "You'd better [not go*/don't go] out tonight.", "e": "had better not + 원형"}, {"k": "bl", "q": "너는 부모님 말씀을 들어야 한다. → You (should) listen to your parents.", "e": "should"}, {"k": "bl", "q": "너는 밤늦게 먹지 않는 게 좋겠다. → You (shouldn't|should not) eat late at night.", "e": "should not"}, {"k": "bl", "q": "너는 지금 떠나는 게 낫겠다. → You had (better) leave now.", "e": "had better"}, {"k": "bl", "q": "너는 사과해야 한다. → You should apologize. ≒ You (ought) to apologize.", "e": "ought to"}, {"k": "fx", "q": "You had better to hurry.", "w": "to", "a": ["(삭제)"], "e": "had better + 원형"}, {"k": "fx", "q": "He should studies harder.", "w": "studies", "a": ["study"], "e": "should + 원형"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? It's very cold. You'd better ____ a coat.", "o": ["wear", "to wear", "wearing", "wore", "wears"], "a": 0, "e": "had better + 원형"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You should be careful.", "You'd better not touch it.", "We shouldn't be noisy.", "You had not better go.", "She should eat breakfast."], "a": 3, "e": "④ had better not go"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '너는 그 영화를 보지 않는 게 좋겠다.'", "o": ["You had better don't watch the movie.", "You had better not watch the movie.", "You had not better watch the movie.", "You better had not watch the movie.", "You had better not to watch the movie."], "a": 1, "e": "had better not + 원형"}, {"k": "bl", "q": "우리는 도서관에서 조용히 해야 한다. → We (should) be quiet in the library.", "e": "should"}, {"k": "bl", "q": "너는 그에게 거짓말하지 않는 게 좋겠다. → You'd better (not) lie to him.", "e": "had better not"}, {"k": "pk", "q": "[Should*/Do] I call her now?", "e": "Should I ~?"}, {"k": "pk", "q": "You [ought to*/ought] respect your elders.", "e": "ought to"}, {"k": "fx", "q": "You'd better not to swim here.", "w": "to", "a": ["(삭제)"], "e": "had better not + 원형"}, {"k": "ox", "q": "You shouldn't play games too long.", "a": true, "e": "✔"}, {"k": "ox", "q": "She had better takes a rest.", "a": false, "e": "take"}], "practiceB": [{"k": "wr", "q": "너는 매일 운동해야 한다. (should, exercise, every day)", "a": ["You should exercise every day."], "e": "should"}, {"k": "wr", "q": "너는 오늘 밤 외출하지 않는 게 좋겠다. (had better not, go out, tonight)", "a": ["You had better not go out tonight.", "You'd better not go out tonight."], "e": "had better not"}, {"k": "or", "q": "너는 의사에게 진찰을 받는 게 낫겠다.", "a": "You had better see a doctor.", "e": "had better"}, {"k": "or", "q": "너는 수업 중에 떠들면 안 된다.", "a": "You shouldn't talk in class.", "e": "should not"}, {"k": "fx", "q": "You had better not eats too much.", "w": "eats", "a": ["eat"], "e": "had better not + 원형"}, {"k": "fx", "q": "Should we to wait here?", "w": "to", "a": ["(삭제)"], "e": "Should + 주어 + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ You'd better hurry.\nⓑ We should help them.\nⓒ You had better not to go.\nⓓ He shoulds rest.\nⓔ You ought to be kind.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ not go / ⓓ should"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: I have a bad cold. B: You ____ go to school today. Stay home and rest.", "o": ["had better", "had better not", "should", "ought to", "must"], "a": 1, "e": "가지 않는 게 낫다"}, {"k": "bl", "q": "A: 이가 아파. B: 치과에 가 봐야 해. → A: My tooth hurts. B: You (should) see a dentist.", "e": "충고"}, {"k": "bl", "q": "비가 올 것 같다. 우산을 가져가는 게 좋겠다. → It's going to rain. You'd (better) take an umbrella.", "e": "'d better"}]}}, {"tag": "hk2-04-7", "name": "used to, would", "talk": [{"k": "m", "t": "**used to** + 동사원형: ① 과거의 습관 '~하곤 했다' ② 과거의 상태 '(전에는) ~이었다' — 지금은 아님! ⏳"}, {"k": "ex", "en": "I used to play the piano.", "ko": "나는 (예전에) 피아노를 치곤 했다. (지금은 안 침)"}, {"k": "ex", "en": "There used to be a bakery here.", "ko": "여기에 (예전에) 빵집이 있었다. (상태)"}, {"k": "m", "t": "**would** + 동사원형: 과거의 **반복된 동작**만 '~하곤 했다'. **상태**(be, have, live, like 등)에는 ✗"}, {"k": "ex", "en": "On weekends, we would go fishing.", "ko": "주말마다 우리는 낚시를 가곤 했다."}, {"k": "q", "q": "My grandpa ____ have a long beard.", "o": ["would", "used to", "uses to"], "a": 1, "ok": "맞아요! 상태(have) → used to", "no": "턱수염이 있었다 = 상태 → would ✗, used to"}, {"k": "m", "t": "부정·의문: didn't [use] to / Did you use to ~? (did 뒤에는 use!)"}, {"k": "q", "q": "____ you use to live in Busan?", "o": ["Did", "Were", "Used"], "a": 0, "ok": "정확해요! Did + 주어 + use to", "no": "의문문 → Did you use to ~?"}, {"k": "m", "t": "⚠️ used to 뒤에는 **동사원형**: used to playing ✗ (be used to + -ing '~에 익숙하다'는 Ch.7 동명사에서!)"}, {"k": "m", "t": "정리! **used to 습관·상태 / would 습관(동작)만 / didn't use to · Did ~ use to** 👍"}], "notes": {"table": [["형태", "뜻", "동작", "상태"], ["used to + 원형", "~하곤 했다 / (전에는) ~이었다", "○ I used to swim.", "○ He used to be shy."], ["would + 원형", "~하곤 했다", "○ We would play outside.", "✗ (He would be shy ✗)"], ["부정", "didn't use to + 원형", "I didn't use to eat fish.", ""], ["의문", "Did + 주어 + use to ~?", "Did you use to live here?", ""]], "tips": ["상태 동사(be, have, live, like, know)는 used to만", "used to는 지금은 그렇지 않다는 느낌"]}, "sets": {"workbook": [{"k": "pk", "q": "I [used to*/use to] walk to school.", "e": "used to"}, {"k": "pk", "q": "He used to [be*/being] shy.", "e": "used to + 원형"}, {"k": "pk", "q": "There [used to*/would] be a park here.", "e": "상태 → used to"}, {"k": "pk", "q": "We [would*/were] play hide-and-seek after school.", "e": "과거 습관 would"}, {"k": "bl", "q": "나는 어렸을 때 일찍 일어나곤 했다. → I (used) to get up early when I was young.", "e": "used to"}, {"k": "bl", "q": "그녀는 (예전에) 긴 머리였다. → She used to (have) long hair.", "e": "used to + 원형"}, {"k": "bl", "q": "그는 매일 아침 조깅을 하곤 했다. → He (would|used to) jog every morning.", "e": "습관 → would / used to"}, {"k": "bl", "q": "너는 예전에 안경을 썼니? → Did you (use) to wear glasses?", "e": "Did ~ use to"}, {"k": "fx", "q": "My dad used to smoking.", "w": "smoking.", "a": ["smoke"], "e": "used to + 원형"}, {"k": "fx", "q": "This building would be a hospital.", "w": "would", "a": ["used to"], "e": "상태 → used to"}], "practiceA": [{"k": "ch", "q": "빈칸에 would가 들어갈 수 없는 것은?", "o": ["We ____ go swimming every summer.", "She ____ read before bed.", "There ____ be a big tree here.", "He ____ call me every night.", "They ____ play soccer after school."], "a": 2, "e": "③ 상태 → used to"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I ____ like vegetables, but now I love them.", "o": ["used to", "didn't use to", "would", "use to", "wouldn't"], "a": 1, "e": "예전엔 안 좋아함 → didn't use to"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I used to live in Jeju.", "Did she use to sing?", "He would visit us on Sundays.", "My hair would be very short.", "We used to be close friends."], "a": 3, "e": "④ 상태 → used to be"}, {"k": "bl", "q": "우리 가족은 (예전에) 시골에 살았다. → My family (used) to live in the country.", "e": "상태 used to"}, {"k": "bl", "q": "그는 예전에는 고기를 먹지 않았다. → He didn't (use) to eat meat.", "e": "didn't use to"}, {"k": "pk", "q": "She [used to*/would] be a nurse.", "e": "상태 → used to"}, {"k": "pk", "q": "[Did*/Was] he use to play baseball?", "e": "Did ~ use to"}, {"k": "fx", "q": "I use to go there every day when I was a kid.", "w": "use", "a": ["used"], "e": "used to"}, {"k": "ox", "q": "There used to be a theater on this street.", "a": true, "e": "✔"}, {"k": "ox", "q": "Did you used to have a dog?", "a": false, "e": "use to"}], "practiceB": [{"k": "wr", "q": "나는 (예전에) 매일 일기를 쓰곤 했다. (used to, keep a diary, every day)", "a": ["I used to keep a diary every day."], "e": "used to"}, {"k": "wr", "q": "이 근처에 (예전에) 서점이 있었다. (There used to be, a bookstore, near here)", "a": ["There used to be a bookstore near here."], "e": "상태 used to"}, {"k": "or", "q": "그는 예전에 수줍음이 많았다.", "a": "He used to be shy.", "e": "used to be"}, {"k": "or", "q": "우리는 매주 일요일 교회에 가곤 했다.", "a": "We would go to church every Sunday.", "e": "습관 would"}, {"k": "fx", "q": "She used to has a cat.", "w": "has", "a": ["have"], "e": "used to + 원형"}, {"k": "fx", "q": "Did they used to work here?", "w": "used", "a": ["use"], "e": "Did ~ use to"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He used to be a teacher.\nⓑ We would go hiking on Sundays.\nⓒ She would be thin.\nⓓ Did you use to sing?\nⓔ I used to playing tennis.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ used to be / ⓔ play"}, {"k": "ch", "q": "다음 문장과 의미가 가장 가까운 것은? I used to be afraid of dogs.", "o": ["I am afraid of dogs now.", "I was afraid of dogs before, but I'm not now.", "I will be afraid of dogs.", "I like dogs very much now and before.", "I have never been afraid of dogs."], "a": 1, "e": "과거 상태, 지금은 아님"}, {"k": "bl", "q": "우리 할머니는 매일 밤 나에게 이야기를 들려주시곤 했다. → My grandma (would|used to) tell me stories every night.", "e": "습관"}, {"k": "bl", "q": "There (used) to be a river here. (예전에 있었다)", "e": "상태"}]}}, {"tag": "hk2-04-8", "name": "do", "talk": [{"k": "m", "t": "**do**의 세 얼굴! ① 일반동사 '하다' ② 의문문·부정문을 만드는 조동사 ③ **강조**의 조동사 💥"}, {"k": "ex", "en": "I do my homework after dinner.", "ko": "나는 저녁 식사 후에 숙제를 한다. (일반동사)"}, {"k": "ex", "en": "Do you like it? / I don't know.", "ko": "그거 좋아해? / 나는 몰라. (조동사)"}, {"k": "m", "t": "강조 do: **do / does / did + 동사원형** '정말 ~하다'"}, {"k": "ex", "en": "I do love you.", "ko": "나는 너를 정말 사랑해."}, {"k": "q", "q": "He ____ like spicy food. (정말 좋아한다)", "o": ["do", "does", "did"], "a": 1, "ok": "맞아요! 3인칭 단수 현재 → does + 원형", "no": "He(3인칭 단수), 현재 → does like"}, {"k": "m", "t": "과거면 **did + 원형**: She did call you yesterday. (did called ✗)"}, {"k": "q", "q": "I did ____ the door!", "o": ["lock", "locked", "locks"], "a": 0, "ok": "정확해요! did + 원형", "no": "강조 did 뒤에는 동사원형"}, {"k": "m", "t": "대동사 do: 앞의 동사(구)를 반복하지 않고 대신 → A: Who broke the vase? B: Mike [did]. / She runs faster than I do."}, {"k": "m", "t": "명령문 강조: **Do** be quiet! (제발 조용히 해!)"}, {"k": "m", "t": "🎉 Chapter 4 조동사 끝! **강조 do/does/did + 원형** 기억하기 👍"}], "notes": {"table": [["쓰임", "예", "뜻"], ["일반동사", "I do the dishes.", "~을 하다"], ["의문·부정의 조동사", "Does she know? / I didn't go.", "—"], ["강조 (do/does/did + 원형)", "He does look happy.", "정말 ~하다"], ["대동사", "A: Who called? B: Jenny did.", "앞의 동사 대신"], ["명령문 강조", "Do sit down.", "제발 ~해라"]], "tips": ["강조 do는 주어·시제에 맞춰 do / does / did", "강조 do 뒤 동사원형 (does likes ✗, did went ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "She [does*/do] look happy today.", "e": "3인칭 단수 → does"}, {"k": "pk", "q": "I did [finish*/finished] my homework.", "e": "did + 원형"}, {"k": "pk", "q": "He [did*/does] call me last night.", "e": "과거 → did"}, {"k": "pk", "q": "A: Who made this cake? B: My mom [did*/made].", "e": "대동사 did"}, {"k": "bl", "q": "나는 정말 너를 믿는다. → I (do) believe you.", "e": "강조 do"}, {"k": "bl", "q": "그는 정말 열심히 일한다. → He (does) work hard.", "e": "강조 does"}, {"k": "bl", "q": "우리는 어제 정말 그 영화를 즐겼다. → We (did) enjoy the movie yesterday.", "e": "강조 did"}, {"k": "bl", "q": "A: 축구를 좋아하니? B: 응, 좋아해. → A: Do you like soccer? B: Yes, I (do).", "e": "대답의 do"}, {"k": "fx", "q": "She does likes you.", "w": "likes", "a": ["like"], "e": "does + 원형"}, {"k": "fx", "q": "I did sent the email.", "w": "sent", "a": ["send"], "e": "did + 원형"}], "practiceA": [{"k": "ch", "q": "do(does, did)가 '강조'로 쓰인 것은?", "o": ["I do the dishes every day.", "Do you know him?", "He doesn't eat meat.", "She does look tired.", "What did you do?"], "a": 3, "e": "④ 정말 피곤해 보인다"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I ____ want to go, but I was too busy. (정말 가고 싶었다)", "o": ["do", "does", "did", "done", "doing"], "a": 2, "e": "과거 → did"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He does love dogs.", "I did tell you.", "They do work hard.", "She did came early.", "We do need help."], "a": 3, "e": "④ did come"}, {"k": "bl", "q": "그녀는 정말 노래를 잘한다. → She (does) sing well.", "e": "강조 does"}, {"k": "bl", "q": "A: 누가 너에게 전화했니? B: Jenny가 했어. → A: Who called you? B: Jenny (did).", "e": "대동사"}, {"k": "pk", "q": "My brother [does*/do] play the guitar well.", "e": "3인칭 단수"}, {"k": "pk", "q": "They did [win*/won] the game.", "e": "did + 원형"}, {"k": "fx", "q": "He do care about you.", "w": "do", "a": ["does"], "e": "3인칭 단수 → does"}, {"k": "ox", "q": "I did see a ghost last night!", "a": true, "e": "✔"}, {"k": "ox", "q": "She does knows the answer.", "a": false, "e": "know"}], "practiceB": [{"k": "wr", "q": "나는 정말 그 시험을 위해 공부했다. (did, study for the test)", "a": ["I did study for the test."], "e": "강조 did"}, {"k": "wr", "q": "He likes music. → 동사를 강조하는 문장으로 바꾸시오.", "a": ["He does like music."], "e": "does + 원형"}, {"k": "or", "q": "나는 정말 너의 도움 y. He hasn't eaten anything all day.", "w": "can't", "a": ["must"], "e": "배고픈 게 틀림없다 → must"}, {"k": "fx", "q": "There would be a big tree here.", "w": "would", "a": ["used to"], "e": "상태 → used to"}, {"k": "or", "q": "제가 당신의 펜을 써도 될까요?", "a": "May I use your pen?", "e": "허가"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? I ____ swim last year, but now I can.", "o": ["can't", "couldn't", "won't", "don't", "mustn't"], "a": 1, "e": "과거 능력 부정"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He just ate a big lunch. He ____ be hungry.", "o": ["must", "can't", "should", "has to", "would"], "a": 1, "e": "~일 리가 없다"}, {"k": "ch", "q": "must의 뜻이 '추측'인 것은?", "o": ["You must wear a mask.", "We must keep the rules.", "She must be Tom's sister. They look alike.", "You must not run here.", "I must finish this today."], "a": 2, "e": "③ ~임에 틀림없다"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nYou ____ talk loudly in the library. (금지)\nToday is a holiday, so you ____ go to school. (불필요)", "o": ["must not – must not", "don't have to – don't have to", "must not – don't have to", "don't have to – must not", "should – must not"], "a": 2, "e": "금지 / 불필요"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You'd better take a rest.", "She would like to see you.", "He will be able to come.", "Did you use to live here?", "You had better not to go."], "a": 4, "e": "⑤ had better not go"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은? A: Would you like some more pizza? B: ____ I'm full.", "o": ["Yes, please.", "No, thank you.", "Yes, I would like.", "No, I don't.", "Sure, I do."], "a": 1, "e": "거절"}, {"k": "ch", "q": "빈칸에 would가 들어갈 수 없는 것은?", "o": ["____ you open the door?", "He said he ____ come.", "I ____ like a sandwich.", "She ____ be very shy as a child.", "We ____ go fishing every Sunday."], "a": 3, "e": "④ 상태 → used to"}, {"k": "ch", "q": "may의 쓰임이 나머지와 다른 것은?", "o": ["He may be at home.", "It may rain soon.", "She may not know it.", "You may go now.", "They may be late."], "a": 3, "e": "④ 허가 / 나머지 추측"}, {"k": "ch", "q": "어법상 ": 3, "e": "④ 형용사적 / 나머지 명사적"}, {"k": "ch", "q": "to부정사가 부사적 용법으로 쓰인 것은?", "o": ["I'd like to drink tea.", "She saved money to buy a bike.", "He has no friends to talk with.", "My hope is to win.", "We planned to meet."], "a": 1, "e": "② 사기 위해 (목적)"}, {"k": "bl", "q": "나는 그를 다시는 만나지 않기로 결심했다. → I decided (not) to meet him again.", "e": "not to"}, {"k": "bl", "q": "우리는 버스를 타기 위해 뛰었다. → We ran (to) catch the bus.", "e": "목적"}, {"k": "pk", "q": "There is nothing [to eat*/eat] in the fridge.", "e": "형용사적 용법"}, {"k": "pk", "q": "She told me [not to worry*/to worry not].", "e": "부정: not to"}, {"k": "fx", "q": "I hope to seeing you again.", "w": "seeing", "a": ["see"], "e": "to + 동사원형"}, {"k": "ox", "q": "He went to the store to buy some eggs.", "a": true, "e": "✔ 목적"}, {"k": "ox", "q": "I want to went home.", "a": false, "e": "to go"}], "practiceB": [{"k": "or", "q": "나는 오늘 밤 영화를 볼 계획이다.", "a": "I plan to watch a movie tonight.", "e": "plan + to부정사"}, {"k": "or", "q": "그녀는 다시는 늦지 않겠다고 약속했다.", "a": "She promised not to be late again.", "e": "not to"}, {"k": "wr", "q": "나는 할 숙제가 많다. (a lot of homework, do)", "a": ["I have a lot of homework to do."], "e": "형용사적 용법"}, {"k": "wr", "q": "그는 시험에 통과하기 위해 열심히 공부했다. (study hard, pass the test)", "a": ["He studied hard to pass the test.", "He studied hard in order to pass the test."], "e": "부사적 용법(목적)"}, {"k": "fx", "q": "She wants be a nurse.", "w": "be", "a": ["to be"], "e": "want + to부정사"}, {"k": "fx", "q": "I need something drink.", "w": "drink", "a": ["to drink"], "e": "something + to부정사"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I want to dance.\nⓑ She hopes to wins.\nⓒ I have a lot of things to do.\nⓓ They went out to play soccer.\nⓔ I promised not tell lies.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ to win / ⓔ not to tell"}, {"k": "pk", "q": "It's time [to go*/going] to bed.", "e": "형용사적 용법 (~할 시간)"}, {"k": "bl", "q": "새로운 언어를 배우는 것은 어렵다. → To (learn) a new language is hard.", "e": "명사적 용법(주어)"}, {"k": "bl reless, brave, smart, generous", "of + 목적격", "It is nice of her to say so."]], "tips": ["의미상 주어는 목적격 (for me, of him)", "'사람 = 형용사'가 되면 of", "부정: for + 목적격 + not to"]}, "sets": {"workbook": [{"k": "pk", "q": "It is difficult [for*/of] me to speak Chinese.", "e": "for + 목적격"}, {"k": "pk", "q": "It was nice [for/of*] him to carry my bag.", "e": "nice → of"}, {"k": "pk", "q": "It's important [for us*/for we] to save water.", "e": "목적격"}, {"k": "pk", "q": "It was foolish [for/of*] you to believe him.", "e": "foolish → of"}, {"k": "bl", "q": "그녀가 혼자 그 일을 끝내는 것은 불가능하다. → It is impossible (for) her to finish the work alone.", "e": "for + 목적격"}, {"k": "bl", "q": "길을 알려 주다니 너는 정말 친절하구나. → It is very kind (of) you to show me the way.", "e": "kind → of"}, {"k": "bl", "q": "아이들이 이 강에서 수영하는 것은 위험하다. → It is dangerous for (children) to swim in this river.", "e": "의미상 주어"}, {"k": "bl", "q": "그런 말을 하다니 그는 무례했다. → It was rude of (him) to say that.", "e": "목적격 him"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 것은?", "o": ["It is easy ____ me to ride a bike.", "It is wise ____ you to save money.", "It is hard ____ him to wake up early.", "It is necessary ____ us to rest.", "It is fun ____ them to play games."], "a": 1, "e": "② of / 나머지 for"}, {"k": "fx", "q": "It was brave for him to save the cat.", "w": "for", "a": ["of"], "e": "brave → of"}], "practiceA": [{"k": "ch", "q": "빈칸에 of가 들어갈 수 있는 것은?", "o": ["It's hard ____ me to swim.", "It's polite ____ you to say hello.", "It's easy ____ him to cook.", "It's important ____ us to study.", "It's possible ____ her to win."], "a": 1, "e": "② polite → of"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["It is kind of you to say so.", "It is easy for her to make friends.", "It was smart of him to solve it.", "It is dangerous of children to play here.", "It is necessary for you to rest."], "a": 3, "e": "④ for children"}, {"k": "ch", "q": "빈칸에 알맞은 것은? It was careless ____ to leave the door open.", "o": ["for he", "of he", "for him", "of him", "of his"], "a": 3, "e": "careless → of + 목적격"}, {"k": "bl", "q": "내가 그 문제를 푸는 것은 쉬웠다. → It was easy for (me) to solve the problem.", "e": "목적격 me"}, {"k": "bl", "q": "그를 용서하다니 너는 너그럽구나. → It is generous (of) you to forgive him.", "e": "generous → of"}, {"k": "pk", "q": "It is necessary [for*/of] students to get enough sleep.", "e": "necessary → for"}, {"k": "pk", "q": "It was wise [of her*/of she] to say no.", "e": "목적격"}, {"k": "fx", "q": "It is impossible of me to finish this today.", "w": "of", "a": ["for"], "e": "impossible → for"}, {"k": "ox", "q": "It was nice of you to invite me.", "a": true, "e": "✔"}, {"k": "ox", "q": "It's hard for they to understand the rule.", "a": false, "e": "them"}], "practiceB": [{"k": "or", "q": "우리가 매일 운동하는 것은 중요하다.", "a": "It is important for us to exercise every day.", "e": "for + 목적격"}, {"k": "or", "q": "약속을 지키다니 그는 현명했다.", "a": "It was wise of him to keep his promise.", "e": "of + 목적격"}, {"k": "wr", "q": "그녀가 그 산을 오르는 것은 어려웠다. (It, difficult, climb the mountain)", "a": ["It was difficult for her to climb the mountain."], "e": "for her"}, {"k": "wr", "q": "나에게 선물을 주다니 너는 친절하구나. (It, kind, give me a present)", "a": ["It is kind of you to give me a present.", "It is kind of you to give a present to me."], "e": "of you"}, {"k": "wr", "q": "You were foolish to make the same mistake. → It으로 시작하여 의미상 주어를 써서 바꾸시오.", "a": ["It was foolish of you to make the same mistake."], "e": "foolish → of"}, {"k": "fx", "q": "It is possible for he to win the race.", "w": "he", "a": ["him"], "e": "목적격"}, {"k": "fx", "q": "It was rude for her to ignore me.", "w": "for", "a": ["of"], "e": "rude → of"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It is hard for me to read his writing.\nⓑ It was nice of him to help us.\nⓒ It is important of you to listen.\nⓓ It was polite of her to bow.\nⓔ It is easy for she to sing.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ for you / ⓔ for her"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIt is not easy ____ me to say sorry.\nIt was silly ____ him to say that.", "o": ["for – for", "for – of", "of – for", "of – of", "to – of"], "a": 1, "e": "easy → for / silly → of"}, {"k": "bl", "q": "그가 설탕을 너무 많이 먹지 않는 것이 필요하다. → It is necessary (for) him (not) to eat too much sugar.", "e": "for + 목적격 + not to"}]}}, {"tag": "hk2-06-6", "name": "too ~ to, enough to", "talk": [{"k": "m", "t": "**too + 형용사/부사 + to부정사** = 너무 ~해서 …할 수 없다 🚫"}, {"k": "ex", "en": "I am too tired to walk.", "ko": "나는 너무 피곤해서 걸을 수 없다."}, {"k": "m", "t": "= **[so]** + 형/부 + **[that]** + 주어 + **can't**: I am so tired that I can't walk."}, {"k": "q", "q": "He was too young ____ the movie.", "o": ["watch", "to watch", "watching"], "a": 1, "ok": "맞아요! too ~ to부정사", "no": "too + 형용사 + to + 동사원형"}, {"k": "m", "t": "**형/부 + enough + to부정사** = …할 만큼 충분히 ~하다 → She is old **[enough]** to drive. (enough old ✗)"}, {"k": "ex", "en": "She is tall enough to reach the shelf. = She is so tall that she can reach the shelf.", "ko": "그녀는 선반에 닿을 만큼 충분히 키가 크다."}, {"k": "q", "q": "He is ____ to lift the box.", "o": ["enough strong", "strong enough", "strong too"], "a": 1, "ok": "정확해요! 형용사 + enough", "no": "enough는 형용사 뒤 → strong enough"}, {"k": "m", "t": "⚠️ 과거면 **couldn't / could**: It was too dark to see. = It was so dark that we couldn't see."}, {"k": "m", "t": "⚠️ 문장 주어가 to부정사의 목적어이면 that절에 **목적어를 다시 써요**: This tea is too hot for me to drink. = This tea is so hot that I can't drink **it**."}, {"k": "m", "t": "정리! **too ~ to = so ~ that can't / ~ enough to = so ~ that can** 👍"}], "notes": {"table": [["형태", "뜻", "바꿔 쓰기"], ["too + 형/부 + to부정사", "너무 ~해서 …할 수 없다", "so + 형/부 + that + 주어 + can't (couldn't)"], ["형/부 + enough + to부정사", "…할 만큼 충분히 ~하다", "so + 형/부 + that + 주어 + can (could)"]], "tips": ["enough는 형용사·부사 뒤 (old enough)", "시제 맞추기: was too ~ to → so ~ that … couldn't", "의미상 주어·목적어: too hot for me to drink = so hot that I can't drink it"]}, "sets": {"workbook": [{"k": "pk", "q": "The box is [too*/enough] heavy to carry.", "e": "too + 형용사 ig enough"}, {"k": "bl", "q": "그 문제는 너무 어려워서 내가 풀 수 없었다. → The problem was too difficult (for) me to solve.", "e": "의미상 주어 for me"}, {"k": "bl", "q": "그녀는 혼자 여행할 만큼 충분히 나이가 들었다. → She is old (enough) to travel alone.", "e": "enough to"}, {"k": "pk", "q": "The room was [too*/so] dark to see anything.", "e": "too ~ to"}, {"k": "pk", "q": "He was so sick that he [couldn't*/could] go to school.", "e": "너무 아파서 갈 수 없었다"}, {"k": "fx", "q": "My brother is too young to riding a motorcycle.", "w": "riding", "a": ["ride"], "e": "to + 동사원형"}, {"k": "ox", "q": "This coffee is too hot to drink.", "a": true, "e": "✔"}, {"k": "ox", "q": "It was so late that we can't take the bus.", "a": false, "e": "couldn't (과거)"}], "practiceB": [{"k": "or", "q": "그 상자는 너무 무거워서 들 수 없다.", "a": "The box is too heavy to lift.", "e": "too ~ to"}, {"k": "or", "q": "그는 그 질문에 답할 만큼 충분히 똑똑하다.", "a": "He is smart enough to answer the question.", "e": "enough to"}, {"k": "wr", "q": "The tea was too hot for me to drink. → so ~ that 구문으로 바꾸시오.", "a": ["The tea was so hot that I couldn't drink it.", "The tea was so hot that I could not drink it."], "e": "couldn't + 목적어 it"}, {"k": "wr", "q": "She is rich enough to buy a house. → so ~ that 구문으로 바꾸시오.", "a": ["She is so rich that she can buy a house."], "e": "so ~ that can"}, {"k": "wr", "q": "He spoke so fast that I couldn't understand him. → too ~ to 구문으로 바꾸시오.", "a": ["He spoke too fast for me to understand."], "e": "too ~ for me to (목적어 him 삭제)"}, {"k": "fx", "q": "This book is so difficult that I can't read.", "w": "read", "a": ["read it"], "e": "that절엔 목적어 it 필요"}, {"k": "fx", "q": "It was too dark for we to see.", "w": "we", "a": ["us"], "e": "의미상 주어 → 목적격"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'm too short to reach it.\nⓑ He is old enough to drive.\nⓒ The soup was too hot to eat it.\nⓓ She was so tired that she couldn't walk.\nⓔ The river is enough deep to swim in.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ it 삭제 / ⓔ deep enough"},  lights.", true], ["He finished to paint the wall.", false], ["I like to read books in bed.", true], ["Thank you for come to my party.", false], ["We went camping last summer.", true], ["I feel like having a hamburger.", true], ["I look forward to meet you.", false], ["He avoided answering the question.", true], ["It started raining an hour ago.", true]], "e": "ⓑ watching ⓔ painting ⓖ coming ⓙ meeting"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Collecting stamps are my hobby.", false], ["I remember visiting this town before.", true], ["Would you mind waiting here?", true], ["She decided studying abroad.", false], ["How about going to the beach?", true], ["He is busy preparing for the test.", true], ["I'm sorry for not calling you.", true], ["The rain kept us from playing outside.", true], ["I'd like ordering a steak.", false], ["She gave up trying to lose weight.", true], ["He is used to work at night.", false], ["On seeing me, the dog ran to me.", true]], "e": "ⓐ is ⓓ to study ⓘ to order ⓚ working"}, {"k": "wr", "q": "그 영화는 볼 가치가 있다. (worth, watch)", "a": ["The movie is worth watching.", "That movie is worth watching."], "e": "be worth + V-ing"}, {"k": "wr", "q": "내일 숙제 가져오는 것을 기억해라. (remember, bring your homework tomorrow)", "a": ["Remember to bring your homework tomorrow.", "Tomorrow, remember to bring your homework."], "e": "remember + to부정사 (미래)"}]}}, {"book": "hk2", "chapter": {"id": "08", "name": "분사", "title": "해커스 중학영문법 2학년 · Chapter 8 분사"}, "units": [{"tag": "hk2-08-1", "name": "분사의 형태와 쓰임", "talk": [{"k": "m", "t": "Chapter 8은 **분사**! 분사는 동사를 **형용사처럼** 쓰는 말이에요 🎨"}, {"k": "m", "t": "**현재분사** = 동사원형 + -ing → '~하는, ~하고 있는' (능동·진행) / **과거분사** = p.p. → '~된, ~해진' (수동·완료)"}, {"k": "ex", "en": "a crying baby / a broken cup", "ko": "울고 있는 아기 / 깨진 컵"}, {"k": "m", "t": "쓰임 ① **명사 수식**: 분사 **혼자**면 명사 **앞**, 다른 말과 **함께**면 명사 **뒤** → a running dog / the dog [running] in the park"}, {"k": "q", "q": "'벤치에 앉아 있는 소녀'는?", "o": ["the sitting on the bench girl", "the girl sitting on the bench", "the girl sat on the bench"], "a": 1, "ok": "맞아요! 분사 + 다른 말 → 명사 뒤", "no": "sitting on the bench처럼 길어지면 명사 뒤에서 꾸며요 → the girl sitting on the bench"}, {"k": "m", "t": "쓰임 ② **보어**: 주어나 목적어의 상태를 설명 → He sat **reading** a book. (주격보어) / I found the window [broken]. (목적격보어)"}, {"k": "q", "q": "She stood there ____ for the bus.", "o": ["wait", "waiting", "waited"], "a": 1, "ok": "정확해요! 주어가 기다리고 있음 → waiting", "no": "그녀가 '기다리고 있는' 상태 → 현재분사 waiting"}, {"k": "m", "t": "쓰임 ③ 시제·태 만들기: be + v-ing **진행형** / have + p.p. **완료형** / be + p.p. **수동태** — 여기 쓰인 것도 모두 분사예요!"}, {"k": "ex", "en": "The book written by him is popular.", "ko": "그가 쓴 그 책은 인기가 있다."}, {"k": "m", "t": "정리! **v-ing 능동·진행 / p.p. 수동·완료 / 혼자면 명사 앞, 길면 명사 뒤** 👍"}], "notes": {"table": [["종류", "형태", "의미", "예"], ["현재분사", "동사원형 + -ing", "~하는, ~하고 있는 (능동·진행)", "a sleeping cat, the boy playing soccer"], ["과거분사", "p.p.", "~된, ~해진 (수동·완료)", "a used car, a letter written in English"], ["명사 수식 (앞)", "분사 혼자", "", "a smiling face, fallen leaves"], ["명사 수식 (뒤)", "분사 + 목적어·부사구", "", "the man wearing a cap, a car made in Korea"], ["보어", "주격·목적격보어", "", "He sat reading. / I found the door locked."]], "tips": ["분사 뒤에 목적어나 부사구가 붙으면 명사 뒤로", "진행형(be + v-ing), 완료형(have + p.p.), 수동태(be + p.p.)도 분사를 씀"]}, "sets": {"workbook": [{"k": "pk", "q": "Look at the [smiling*/smiled] baby.", "e": "아기가 웃고 있음 → 현재분사"}, {"k": "pk", "q": "My dad bought a [using/used*] car. (중고차)", "e": "사용된 차 → 과거분사"}, {"k": "pk", "q": "The boy [played/playing*] the guitar is my brother.", "e": "소년이 연주함 → 현재분사"}, {"k": "pk", "q": "This is a letter [writing/written*] in English.", "e": "편지가 쓰임 → 과거분사"}, {"k": "bl", "q": "짖고 있는 개 → a (barking) dog", "e": "현재분사"}, {"k": "bl", "q": "잃어버린 지갑 → a (lost) wallet", "e": "과거분사"}, {"k": "bl", "q": "그는 TV를 보면서 앉아 있었다. → He sat (watching) TV.", "e": "주격보어 현재분사"}, {"k": "bl", "q": "나는 문이 잠겨 있는 것을 발견했다. → I found the door (locked).", "e": "목적격보어 과거분사"}, {"k": "fx", "q": "The girl danced on the kfast.", "e": "Not + v-ing"}]}}, {"tag": "hk2-08-5-2", "name": "분사구문의 다양한 의미", "talk": [{"k": "m", "t": "분사구문에는 **접속사가 없어서** 앞뒤 문맥으로 뜻을 판단해요 🧩"}, {"k": "m", "t": "① **시간** (when, while, after) '~할 때, ~하는 동안, ~한 후에' → Walking to school, I met Tom."}, {"k": "m", "t": "② **이유** (because, as) '~ 때문에' → Feeling sick, I went to the nurse's office."}, {"k": "q", "q": "Being tired, she went to bed early. 의 의미는?", "o": ["피곤할 때마다", "피곤해서", "피곤하면"], "a": 1, "ok": "맞아요! 이유 → 피곤해서", "no": "피곤하다 → (그래서) 일찍 잠 → 이유"}, {"k": "m", "t": "③ **동시동작** '~하면서' (as, while) → She sat on the sofa, **eating** popcorn."}, {"k": "m", "t": "④ **연속동작** '~하고 나서 (그리고)' (and) → The train left Seoul at nine, **arriving** in Busan at noon."}, {"k": "m", "t": "⑤ **조건** '~하면' (if) → Turning right, you will find the store. = [If] you turn right, you will find the store."}, {"k": "q", "q": "Taking this bus, you can get to the museum. 의 의미는?", "o": ["이 버스를 타면", "이 버스를 탔기 때문에", "이 버스를 타는 동안"], "a": 0, "ok": "정확해요! 조건 → ~하면", "no": "뒤에 can/will이 오고 '버스를 타면 갈 수 있다' → 조건"}, {"k": "m", "t": "정리! **시간 · 이유 · 동시동작 · 연속동작 · 조건 — 문맥으로 골라요** 👍"}, {"k": "m", "t": "🎉 Chapter 8 분사 끝!"}], "notes": {"table": [["의미", "바꿀 수 있는 접속사", "예"], ["시간", "when, while, after", "Arriving home, I took a shower. (= When I arrived home)"], ["이유", "because, as", "Having a cold, she stayed in bed. (= Because she had a cold)"], ["동시동작 (~하면서)", "as, while", "He walked along the beach, singing a song."], ["연속동작 (~하고 나서)", "and", "She opened the box, finding a ring inside."], ["조건 (~하면)", "if", "Turning left, you will see it. (= If you turn left)"]], "tips": ["조건 분사구문 뒤 주절에는 보통 will / can", "분사구문을 부사절로 바꿀 때 주절의 시제에 맞춰 동사를 씀"]}, "sets": {"workbook": [{"k": "pk", "q": "Feeling hungry, I made a sandwich. = [Because*/If] I felt hungry, I made a sandwich.", "e": "이유"}, {"k": "pk", "q": "Turning left, you will see the post office. = [If*/Because] you turn left, you will see the post office.", "e": "조건"}, {"k": "pk", "q": "Watching TV, he ate dinner.  → The gift is for (him).", "e": "전치사 뒤 목적격"}, {"k": "bl", "q": "이 자전거는 우리 것이다. → This bike is (ours).", "e": "소유대명사"}, {"k": "bl", "q": "Tom은 내 반 친구 중 한 명이다. → Tom is a classmate of (mine).", "e": "이중 소유격"}, {"k": "fx", "q": "This is a secret between you and I.", "w": "I", "a": ["me"], "e": "전치사 between 뒤 → me"}, {"k": "fx", "q": "Is this bag your?", "w": "your", "a": ["yours"], "e": "'너의 것' → yours"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? My phone is old, but ____ is new. (그의 것)", "o": ["he", "his", "him", "he's", "himself"], "a": 1, "e": "그의 것 → his"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Let me introduce my sister to you.", "Mina and I are best friends.", "The dog wagged its tail.", "He is an old friend of my.", "These books are theirs."], "a": 3, "e": "④ of mine"}, {"k": "ch", "q": "어법상 바른 것은?", "o": ["a my cousin", "this book of hers", "that car of him", "a friend of she", "some friends of our"], "a": 1, "e": "a/this/some + 명사 + of + 소유대명사"}, {"k": "bl", "q": "그녀의 머리카락은 길고, 내 것은 짧다. → Her hair is long, and (mine) is short.", "e": "소유대명사"}, {"k": "bl", "q": "나는 그 사진을 그들에게 보여 주었다. → I showed the picture to (them).", "e": "전치사 뒤 목적격"}, {"k": "pk", "q": "Our classroom is on the second floor, and [their/theirs*] is on the third floor.", "e": "그들의 것 → theirs"}, {"k": "pk", "q": "Jake and [I*/me] went fishing yesterday.", "e": "주어 자리 → I"}, {"k": "fx", "q": "Mom made sandwiches for my brother and I.", "w": "I", "a": ["me"], "e": "전치사 for 뒤 → me"}, {"k": "ox", "q": "These seats are ours, and those are yours.", "a": true, "e": "✔"}, {"k": "ox", "q": "I met an old friend of him at the station.", "a": false, "e": "of his"}], "practiceB": [{"k": "wr", "q": "그는 내 이웃 중 한 명이다. (a neighbor of)", "a": ["He is a neighbor of mine."], "e": "이중 소유격"}, {"k": "wr", "q": "내 신발은 하얗고, 그녀의 것은 검다. (My shoes, hers)", "a": ["My shoes are white, and hers are black.", "My shoes are white and hers are black.", "My shoes are white, but hers are black.", "My shoes are white but hers are black."], "e": "hers = her shoes → are"}, {"k": "or", "q": "그 개는 꼬리를 흔들고 있다.", "a": "The dog is wagging its tail.", "e": "its"}, {"k": "or", "q": "이 책들은 그들의 것이 아니다. 그것들은 우리의 것이다.", "a": "These books aren't theirs. They are ours.", "e": "소유대명사"}, {"k": "fx", "q": "She is a good friend of me.", "w": "me", "a": ["mine"], "e": "of + 소유대명사"}, {"k": "fx", "q": "My bag is blue, and your is red.", "w": "your", "a": ["yours"], "e": "너의 것 → yours"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The bird hurt its wing.\nⓑ He and me are on the same team.\nⓒ This is a book of mine.\nⓓ Their house is next to ours.\nⓔ Please call Jiho and I.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ He and I / ⓔ Jiho and me"}, {"k": "bl", "q": "Her eyes are brown, and (his) are blue. (그의 것은)", "e": "his = his eyes"}, {"k": "bl", "q": "The coach wants to talk to you and (me). (너와 나에게)", "e": "전치사 뒤 목적격"}, {"k": "wr", "q": "이 코트는 내 것이 아니다. 너의 것이니? (mine, yours)", "a": ["This coat isn't mine. Is it yours?", "This coat is not mine. Is it yours?"], "e": "소유대명사"}]}}, {"tag": "hk2-10-2", "name": "재귀대명사", "talk": [{"k": "m", "t": "**재귀대명사** -self / -selves 복습: myself, yourself, himself, herself, itself, ourselves, yourselves, [themselves] 🪞"}, {"k": "m", "t": "① **재귀 용법**: 동사·전치사의 목적어가 **주어 자신**일 때 → 빼면 뜻이 달라져서 **생략 ✗**"}, {"k": "ex", "en": "He cut himself while he was cooking.", "ko": "그는 요리하다가 (자기 몸을) 베였다."}, {"k": "q", "q": "Tom looked at ____ in the mirror. (자기 자신)", "o": ["him", "himself", "his"], "a": 1, "ok": "맞아요! 주어 = 목적어 → himself", "no": "Tom이 Tom 자신을 봄 → himself"}, {"k": "m", "t": "② **강조 용법**: '직접, 스스로' — 주어 바로 뒤나 문장 끝, **생략해도** 문장이 돼요"}, {"k": "ex", "en": "I painted the wall myself. = I myself painted the wall.", "ko": "내가 직접 벽을 칠했다."}, {"k": "q", "q": "다음 중 재귀대명사를 생략할 수 있는 문장은?", "o": ["She hurt herself.", "He fixed the car himself.", "They enjoyed themselves."], "a": 1, "ok": "정확해요! '직접'(강조) → 생략 가능", "no": "강조 용법('직접')만 생략할 수 있어요 → He fixed the car himself."}, {"k": "m", "t": "③ 관용 표현: by oneself(혼자서), for oneself(스스로 힘으로), enjoy oneself(즐겁게 지내다), help oneself to(마음껏 먹다), make oneself at [home](편히 쉬다), talk to oneself(혼잣말하다), between ourselves(우리끼리 얘기지만)"}, {"k": "m", "t": "⚠️ 주어와 목적어가 **다른 사람**이면 재귀대명사 ✗: She loves him. (She loves himself ✗)"}, {"k": "m", "t": "정리! **주어 = 목적어 → 재귀(생략 ✗) / '직접' 강조 → 생략 가능 / oneself 관용 표현** 👍"}], "notes": {"table": [["용법", "뜻", "생략", "예"], ["재귀 용법", "자기 자신을(에게)", "✗", "She introduced herself."], ["강조 용법", "직접, 스스로", "○", "I baked the bread myself."], ["by oneself", "혼자서", "", "He lives by himself."], ["for oneself", "스스로 힘으로", "", "Think for yourself."], ["enjoy oneself", "즐겁게 지내다", "", "We enjoyed ourselves."], ["help oneself to", "~을 마음껏 먹다", "", "Help yourself to the snacks."], ["make oneself at home", "편히 쉬다", "", "Make yourself at home."]], "tips": ["주어와 목적어가 같으면 꼭 재귀대명사 (He hurt himself.)", "복수: ourselves, yourselves, themselves (themself ✗, ourself ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "I taught [me/myself*] how to swim.", "e": "주어 = 목적어"}, {"k": "pk", "q": "We enjoyed [us/ourselves*] at the festival.", "e": "enjoy oneself"}, {"k": "pk", "q": "The kids built the sandcastle by [themselves*/theirselves].", "e": "themselves"}, {"k": "pk", "q": "Please help [yourself*/you] to the cake.", "e": "help oneself to"}, {"k": "bl", "q": "그녀는 거울 속 자신을 보았다. → She looked at (herself) in the mirror.", "e": "재귀 용법"}, {"k": "bl", "q": "그 기계는 저절로 꺼졌다. → The machine turned off by (itself).", "e": "by itself"}, {"k": "bl", "q": "편히 쉬세요. → Make (yourself|yourselves) at home.", "e": "make oneself at home"}, {"k": "bl", "q": "너희들은 스스로 그것을 해야 한다. → You have to do it for (yourselves).", "e": "너희들 → yourselves"}, {"k": "fx", "q": "He introduced him to the class. (자기 자신을)", "w": "him", "a": ["himself"], "e": "주어 = 목적어 → himself"}, {"k": "fx", "q": "My sister often talks to herselves.", "w": "herselves", "a": ["herself"], "e": "단수 → herself"}], "practiceA": [{"k": "ch", "q": "재귀대명사를 생략할 수 있는 것은?", "o": ["He hurt him best. (사람은 최선을 다해야 한다)", "e": "일반 사람 one"}]}}, {"tag": "hk2-10-5-2", "name": "부정대명사: some, any", "talk": [{"k": "m", "t": "**some / any**가 명사 없이 혼자 쓰이면 부정대명사 — '약간, 몇몇' 🤏"}, {"k": "m", "t": "**some**: 긍정문, 권유·부탁 의문문 / **any**: 부정문, 의문문"}, {"k": "ex", "en": "I made cookies. Do you want some?", "ko": "쿠키를 만들었어. 좀 먹을래?"}, {"k": "q", "q": "I need some stamps, but I don't have ____.", "o": ["some", "any", "one"], "a": 1, "ok": "맞아요! 부정문 → any", "no": "don't가 있는 부정문 → any"}, {"k": "m", "t": "중2 포인트! **some of / any of + 명사**: 동사는 **of 뒤 명사**에 맞춰요 → Some of the students [are] absent. / Some of the milk is gone."}, {"k": "q", "q": "Some of the water ____ dirty.", "o": ["is", "are", "were"], "a": 0, "ok": "정확해요! water(셀 수 없음) → 단수", "no": "of 뒤 water는 셀 수 없는 명사 → is"}, {"k": "m", "t": "⚠️ **any**가 긍정문에 오면 '**어떤 ~라도**': Any of you can join the club. (너희 중 누구라도)"}, {"k": "m", "t": "-one, -body, -thing과 결합: someone, anyone, something, anything → **단수** 취급, 쓰임은 some / any와 같아요 (Someone is calling you. / Is anyone there?)"}, {"k": "m", "t": "정리! **some 긍정·권유 / any 부정·의문·'어떤 ~라도' / some of + 명사 → 명사에 수일치** 👍"}], "notes": {"table": [["", "쓰임", "예"], ["some", "긍정문 / 권유·부탁 의문문", "I have some. / Would you like some?"], ["any", "부정문 / 의문문", "I don't have any. / Do you have any?"], ["any (긍정문)", "어떤 ~라도", "You can take any of them."], ["some of + 복수 명사", "복수 동사", "Some of the boys are tall."], ["some of + 셀 수 없는 명사", "단수 동사", "Some of the bread is moldy."]], "tips": ["someone, anything 등은 단수 취급", "권유(Would you like ~?)·부탁(Can I have ~?)은 의문문이라도 some"]}, "sets": {"workbook": [{"k": "pk", "q": "I baked a cake. Would you like [some*/any]?", "e": "권유 → some"}, {"k": "pk", "q": "There's no milk left. I didn't buy [some/any*].", "e": "부정문 → any"}, {"k": "pk", "q": "Some of the boys [is/are*] playing basketball.", "e": "boys 복수 → are"}, {"k": "pk", "q": "Some of the cake [was*/were] eaten by my brother.", "e": "cake(한 개의 일부) → was"}, {"k": "bl", "q": "나는 질문이 좀 있다. 너는 있니? → I have some question t. Would you like some?"], "e": "권유 → some"}, {"k": "wr", "q": "그 학생들 중 몇 명은 안경을 쓴다. (Some of the students, wear glasses)", "a": ["Some of the students wear glasses."], "e": "복수 → wear"}, {"k": "or", "q": "나는 사탕을 원했지만 그는 하나도 가지고 있지 않았다.", "a": "I wanted candy, but he didn't have any.", "e": "부정문 → any"}, {"k": "or", "q": "이 책들 중 어느 것이든 골라도 된다.", "a": "You can choose any of these books.", "e": "어떤 ~라도"}, {"k": "fx", "q": "Some of the rice are on the floor.", "w": "are", "a": ["is"], "e": "rice 셀 수 없음 → is"}, {"k": "fx", "q": "There aren't some chairs in the room.", "w": "some", "a": ["any"], "e": "부정문 → any"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nSome of the songs ____ really good.\nSome of the soup ____ cold.", "o": ["is – is", "is – are", "are – is", "are – are", "be – be"], "a": 2, "e": "songs → are / soup → is"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I need eggs, but there aren't any.\nⓑ Would you like some?\nⓒ Some of the boys is from Canada.\nⓓ Anyone can learn to swim.\nⓔ Some of the water were spilled.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ are / ⓔ was"}, {"k": "bl", "q": "질문 있니? — 아니, 하나도 없어. → Do you have (any) questions? — No, I don't have (any).", "e": "의문문·부정문 → any"}, {"k": "bl", "q": "우리 반 친구 중 몇 명은 그림을 잘 그린다. → Some of my classmates (are) good at drawing.", "e": "복수 → are"}]}}, {"tag": "hk2-10-5-3", "name": "부정대명사: another, other", "talk": [{"k": "m", "t": "**another / other** 복습 + 중2 확장! 개수에 따라 짝이 정해져 있어요 🧩"}, {"k": "m", "t": "**둘**: one ~, the other ~ (하나는, 나머지 하나는) / **셋**: one ~, another ~, the other ~ (하나는, 또 하나는, 나머지 하나는)"}, {"k": "ex", "en": "I have two pets. One is a dog, and the other is a cat.", "ko": "나는 애완동물이 둘 있다. 하나는 개이고, 나머지 하나는 고양이다."}, {"k": "q", "q": "There are three pens. One is red, another is blue, and ____ is black.", "o": ["other", "another", "the other"], "a": 2, "ok": "맞아요! 마지막 남은 하나 → the other", "no": "셋 중 마지막 남은 하나 → the other"}, {"k": "m", "t": "**여럿 중**: some ~, **others** ~ (몇몇은, 또 다른 몇몇은) / 나머지 **전부**: some ~, **the others** ~"}, {"k": "ex", "en": "Some people like summer, and others like winter.", "ko": "어떤 사람들은 여름을 좋아하고, 다른 사람들은 겨울을 좋아한다."}, {"k": "q", "q": "There are ten students. Five are boys, and ____ are girls.", "o": ["others", "the others", "another"], "a": 1, "ok": "정확해요! 나머지 전부 → the others", "no": "10명 중 나머지 5명 전부 → the others"}, {"k": "m", "t": "형용사로도 써요: **another + 단수 명사**(another cup) / **other + 복수 명사**(other [people])"}, {"k": "m", "t": "**each other / one another** = 서로 → They help each other."}, {"k": "m", "t": "정리! **one / the other · one / another / the other · some / others · some / the others · 서로 each other** 👍"}], "notes": {"table": [["상황", "표현"], ["둘", "one ~, the other ~"], ["셋", "one ~, another ~, the other ~"], ["여럿 (막연히)", "some ~, others ~"], ["여럿 (나머지 전부)", "some ~, the others ~"], ["형용사", "another + 단수 명사 / other + 복수 명사"], ["서로", "each other / one another"]], "tips": ["another = an + other → the another ✗, another + 복수 ✗", "남은 것이 하나 → the other / 남은 것 전부(복수) → the others"]}, "sets": {"workbook": [{"k": "pk", "q": "I don't like this hat. Show me [another*/other] one.", "e": "또 다른 하나 → another"}, {"k": "pk", "q": "She has two sisters. One is a nurse, and [another/the other*] is a teacher.", "e": "둘 중 나머지 → the other"}, {"k": "pk", "q": "Some kids like math, and [others*/another] like art.", "e": "여럿 중 다른 몇몇 → others"}, {"k": "pk", "q": "There are five apples. One is red, and [the others*/others] are green.", "e": "나머지 전부 → the others"}, {"k": "bl", "q": "이 펜은 안 써진다. 다른 것 하나 줄래? → This pen doesn't work. Can you give me (another)?", "e": "another"}, {"k": "bl", "q": "그들은 서로를 쳐다보았다. → They looked at each (other).", "e": "each other"}, {"k": "bl", "q": "다른 사람들에게 친절해라. → Be kind to (other) people.", "e": "other + 복수 명사"}, {"k": "bl", "q": "나는 가방이 두 개 있다. 하나는 크고, 나머지 하나는 작다. → I have two bags. One is big, and (the other) is small.", "e": "the other"}, {"k": "fx", "q": "I have three friends. One is from Japan, another is from China, and other is from Korea.", "w": "other", "a": ["the other"], "e": "마지막 하나 → the other"}, {"k": "fx", "q": "Would you like other cup of tea?", "w": "other", "a": ["another"], "e": "단수 명사 앞 → another"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I have two brothers. One lives in Seoul, and ____ lives in Daegu.", "o": ["other", "another", "the other", "others", "the others"], "a": 2, "e": "둘 중 나머지 → the other"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nSome people like dogs, and ____ like cats.\nThere are 20 students. Some are boys, and ____ are girls.", "o": ["others – others", "others – the others", "the others – others", "another – the others", "the other – others"], "a": 1, "e": "막연히 → others / 나머지 전부 → the others"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Let's meet another day.", "Other students are in the gym.", "The twins help each other.", "I need another pencils.", "One is mine, and the other is yours."], "a": 3, "e": "④ another pencil"}, {"k": "bl", "q": "세 개의 공이 있다. 하나는 빨갛고, 또 하나는 노랗고, 나머지 하나는 파랗다. → There are three balls. One is red, (another) is yellow, and (the other) is blue.", "e": "셋"}, {"k": "bl", "q": "어떤 사람들은 걷고, 다른 사람들은 뛴다. → Some people walk, and (others) run.", "e": "some / others"}, {"k": "pk", "q": "Do you have any [other*/another] questions?", "e": "복수 명사 앞 → other"}, {"k": "pk", "q": "I have two cousins. One is tall, and [the other*/the others] is short.", "e": "둘 중 나머지 하나 → the other"}, {"k": "fx", "q": "Some of the students went home, and the other stayed in the classroom.", "w": "other", "a": ["others"], "e": "나머지 전부(복수) → the others"}, {"k": "ox", "q": "We should respect one another.", "a": true, "e": "✔ 서로"}, {"k": "ox", "q": "This cake is delicious. Can I have other piece?", "a": false, "e": "another piece"}], "practiceB": [{"k": "wr", "q": "나는 개가 두 마리 있다. 한 마리는 하얗고, 나머지 한 마리는 검다. (One, the other)", "a": ["I have two dogs. One is white, and the other is black.", "I have two dogs. One is white and the other is black , {"k": "ch", "q": "어법상(의미상) 옳은 문장의 개수는?\nⓐ I have a few pencils.\nⓑ There is little rain this year.\nⓒ He has a few money.\nⓓ Quite a few students like it.\nⓔ I don't have few books.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ a little money / ⓔ I have few books"}, {"k": "bl", "q": "Could I have (a) (little) more water, please? (조금 더)", "e": "a little"}, {"k": "bl", "q": "Very (few) people know his real name. (거의 없는)", "e": "few"}]}}, {"tag": "hk2-11-5-3", "name": "수량형용사: some, any", "talk": [{"k": "m", "t": "마지막! 수량형용사 **some, any** — 셀 수 있는 명사·셀 수 없는 명사 모두 앞에 와요 🤏"}, {"k": "m", "t": "**some**: 긍정문 / 권유·부탁 의문문 (Would you like some ~? / Can I have some ~?)"}, {"k": "m", "t": "**any**: 부정문·의문문 / 조건 if절 (If you have any questions, ~)"}, {"k": "q", "q": "Can I have ____ water, please?", "o": ["any", "some", "a few"], "a": 1, "ok": "맞아요! 부탁 → some", "no": "부탁하는 의문문 → some (water는 셀 수 없어 a few ✗)"}, {"k": "m", "t": "중2 포인트 ① **긍정문의 any** = '어떤 ~라도' (뒤에 단수 명사도 와요): Any student can join the club."}, {"k": "ex", "en": "You can call me at any time.", "ko": "언제든지 나에게 전화해도 돼."}, {"k": "m", "t": "② **not ~ any = no**: I don't have any money. = I have [no] money."}, {"k": "q", "q": "I have no idea. = I don't have ____ idea.", "o": ["some", "any", "no"], "a": 1, "ok": "정확해요! no = not ~ any", "no": "don't가 있으니 no 대신 any"}, {"k": "m", "t": "⚠️ no 다음에 다시 not ✗: I don't have no money ✗ (→ I don't have any money. / I have no money.)"}, {"k": "m", "t": "🎉 Chapter 11 형용사 끝! **some 긍정·권유 / any 부정·의문·조건·'어떤 ~라도' / not ~ any = no**"}], "notes": {"table": [["", "쓰임", "예"], ["some", "긍정문", "I bought some eggs."], ["some", "권유·부탁 의문문", "Would you like some tea?"], ["any", "부정문·의문문·if절", "Do you have any pets? / If you need any help, ~"], ["any", "긍정문: 어떤 ~라도", "Any child can do it."], ["no", "= not ~ any", "There is no milk. = There isn't any milk."]], "tips": ["no가 있는 문장에 not을 또 쓰지 않음", "'어떤 ~라도' any + 단수 명사 가능 (any book)"]}, "sets": {"workbook": [{"k": "pk", "q": "I bou an I.", "Neither can I."], ["일반동사 현재", "So do I. / So does he.", "Neither do I."], ["일반동사 과거", "So did I.", "Neither did I."], ["현재완료", "So have I.", "Neither have I."]], "tips": ["Neither + 긍정 동사 (Neither don't ✗)", "So do I. = Me too. / Neither do I. = Me neither.", "Neither do I. = I don't, either."]}, "sets": {"workbook": [{"k": "pk", "q": "A: I'm tired. B: So [am*/do] I.", "e": "be동사 → am"}, {"k": "pk", "q": "A: I like cats. B: So [do*/am] I.", "e": "일반동사 → do"}, {"k": "pk", "q": "A: Tom can't come. B: [So/Neither*] can Jane.", "e": "부정 → Neither"}, {"k": "pk", "q": "A: I didn't sleep well. B: Neither [did*/didn't] I.", "e": "Neither + 긍정"}, {"k": "bl", "q": "A: 나는 피자를 좋아해. B: 나도. → A: I like pizza. B: So (do) I.", "e": "일반동사 현재 → do"}, {"k": "bl", "q": "A: 나는 어제 늦었어. B: 나도. → A: I was late yesterday. B: So (was) I.", "e": "be동사 과거 → was"}, {"k": "bl", "q": "A: 나는 겁 안 나. B: 나도 안 나. → A: I'm not scared. B: (Neither) am I.", "e": "부정 → Neither"}, {"k": "bl", "q": "A: 그는 파리에 가 본 적이 있어. B: 그의 누나도 그래. → A: He has been to Paris. B: So (has) his sister.", "e": "현재완료 → has"}, {"k": "fx", "q": "A: I enjoy hiking. B: So am I.", "w": "am", "a": ["do"], "e": "일반동사 → do"}, {"k": "fx", "q": "A: I won't go. B: Neither don't I.", "w": "don't", "a": ["will"], "e": "won't → Neither will I"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? A: I have finished the project. B: So ____ I.", "o": ["am", "do", "did", "have", "was"], "a": 3, "e": "현재완료 → have"}, {"k": "ch", "q": "대화가 자연스럽지 않은 것은?", "o": ["A: I'm thirsty. B: So am I.", "A: I can't sing. B: Neither can I.", "A: I liked the movie. B: So did I.", "A: I don't have a pen. B: So do I.", "A: She is kind. B: So is her sister."], "a": 3, "e": "④ Neither do I."}, {"k": "ch", "q": "A: I don't like milk. 에 대한 응답으로 알맞은 것은? (나도 안 좋아해)", "o": ["So do I.", "Neither do I.", "Neither don't I.", "So don't I.", "I do, too."], "a": 1, "e": "Neither + 긍정 동사"}, {"k": "bl", "q": "A: 나 아이스크림 먹고 싶어. B: 나도. → A: I want some ice cream. B: So (do) I.", "e": "일반동사 → do"}, {"k": "bl", "q": "A: 우리 엄마는 운전을 못 해. B: 우리 엄마도 못 해. → A: My mom can't drive. B: Neither (can) mine.", "e": "조동사 → can"}, {"k": "pk", "q": "A: Jake was absent today. B: So [was*/did] Amy.", "e": "be동사 과거 → was"}, {"k": "pk", "q": "A: I don't understand this. B: [Me too/Me neither*].", "e": "부정 → Me neither"}, {"k": "fx", "q": "A: I watched the game last night. B: So do I.", "w": "do", "a": ["did"], "e": "과거 → did"}, {"k": "ox", "q": "A: I haven't seen it. B: Neither have I.", "a": true, "e": "✔"}, {"k": "ox", "q": "A: I'm not ready. B: So am I.", "a": false, "e": "Neither am I."}], "practiceB": [{"k": "wr", "q": "A: I will go to the festival. B: 나도. (so)", "a": ["So will I."], "e": "조동사 will"}, {"k": "wr", "q": "A: I didn't do my homework. B: 나도 안 했어. (neither)", "a": ["Neither did I."], "e": "과거 → did"}, {"k": "or", "q": "A: Jisu is good at swimming. B: 그녀의 오빠도 그래.", "a": "So is her brother.", "e": "be동사 → is"}, {"k": "or", "q": "A: I can't wait. B: 나도 못 기다려.", "a": "Neither can I.", "e": "조동사 → can"}, {"k": "fx", "q": "A: My dad likes jazz. B: So do my mom.", "w": "do", "a": ["does"], "e": "my mom(3인칭 단수) → does"}, {"k": "fx", "q": "A: They aren't at home. B: So are we.", "w": "So", "a": ["Neither"], "e": "부정 → Neither"}, {"k": "ch", "q": "응답이 어법상 옳은 것의 개수는?\nⓐ A: I'm sleepy. B: So am I.\nⓑ A: I don't know. B: Neither do I.\nⓒ A: He can ski. B: So does she.\nⓓ A: I went there. B: So did I.\nⓔ A: I'm not sure. B: Neither I am.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ So can she / ⓔ Neither am I"}, {"k": "ch", "q": "Neither do I.와 의미가 같은 것은?", "o": ["I do, too.", "I don't, either.", "So do I.", "Me too.", "I do, either."], "a": 1, "e": "Neither do I. = I don't, either."}, {"k": "bl", "q": "A: 나는 제주도에 가 본 적이 없어. B: 나도 없어. → A: I've never been to Jeju. B: Neither (have) I.", "e": "현재완료 → have"}, {"k": "bl", "q": "A: 미나는 공포 영화를 좋아해. B: 그녀의 친구도 그래. → A: Mina likes horror movies. B: So (does) her friend.", "e": "3인칭 단수 → does"}]}}, {"tag": "hk2-12-5", "name": "타동사 + 부사", "talk": [{"k": "m", "t": "**타동사 + 부사**가 한 덩어리로 목적어를 가지는 표현! 🧩 turn on, put off, give up …"}, {"k": "m", "t": "목적어가 **명사**면 두 자리 다 OK: turn on the TV = turn the TV on"}, {"k": "m", "t": "목적어가 **대명사**(it, them, him …)면 꼭 **동사 + 대명사 + 부사**: turn [it] on"}, {"k": "q", "q": "My homework is due today. I have to ____ now.", "o": ["hand in it", "hand it in", "in hand it"], "a": 1, "ok": "맞아요! 대명사는 가운데", "no": "hand + it + in"}, {"k": "m", "t": "중2 표현: put off(미루다), call off(취소하다), hand in(제출하다), look up(찾아보다), write down(적다), figure out(알아내다), turn down(거절하다·소리를 줄이다), try on(입어 보다)"}, {"k": "q", "q": "I don't know this word. I'll ____ in the dictionary.", "o": ["look up it", "look it up", "look it at"], "a": 1, "ok": "정확해요! look + it + up", "no": "찾아보다 look up → 대명사는 가운데"}, {"k": "m", "t": "⚠️ **자동사 + 전치사**는 달라요! 대명사도 전치사 **뒤**: look at it, look for it, listen to it, wait for him (look it at ✗)"}, {"k": "q", "q": "Where is my key? I'm ____.", "o": ["looking it for", "looking for it", "for looking it"], "a": 1, "ok": "맞아요! 전치사 뒤에 대명사", "no": "look for(찾다)는 자동사 + 전치사 → looking for it"}, {"k": "m", "t": "정리! **타동사 + 대명사 + 부사 / 자동사 + 전치사 + 대명사** 👍"}], "notes": {"table": [["표현", "뜻", "대명사 목적어"], ["put off", "미루다", "put it off"], ["call off", "취소하다", "call it off"], ["hand in", "제출하다", "hand it in"], ["look up", "찾아보다", "look it up"], ["write down", "적다", "write it down"], ["figure out", "알아내다", "figure it out"], ["turn down", "거절하다, 줄이다", "turn it down"], ["try on", "입어 보다", "try it on"]], "tips": ["타동사 + 부사: 대명사는 가운데 (put off it ✗)", "자동사 + 전치사: 대명사는 전치사 뒤 (look at it, wait for her)"]}, "sets": {"workbook": [{"k": "pk", "q": "Is this your jacket? [Try it on*/Try on it].", "e": "대명사 → 가운데"}, {"k": "pk", "q": "The rain was heavy, so they [called off the game*/called off it].", "e": "대명사는 가운데에만"}, {"k": "pk", "q": "I can't hear you. Please [turn it up*/turn up it].", "e": "대명사 → 가운데"}, {"k": "pk", "q": "This is a nice picture. Let's [look : [["He studied hard for the exam.", true], ["Have you seen him lately?", true], ["She has yet finished it.", false], ["I usually get up at 7.", true], ["A: I didn't go. B: Neither did I.", true], ["Please pick up me at the station.", false], ["Why don't you join us?", true], ["He greeted me friendly.", false], ["I'm looking for it.", true], ["My sister can also swim.", true], ["A: He likes art. B: So is his sister.", false], ["We arrived late.", true]], "e": "ⓒ already ⓕ pick me up ⓗ in a friendly way ⓚ So does his sister."}, {"k": "wr", "q": "A: I don't like spiders. B: '나도 안 좋아해'를 neither를 써서 쓰시오.", "a": ["Neither do I."], "e": "Neither + do + I"}, {"k": "wr", "q": "Put on your gloves. → your gloves를 them으로 바꿔 다시 쓰시오.", "a": ["Put them on."], "e": "대명사 → 가운데"}]}}, {"book": "hk2", "chapter": {"id": "13", "name": "비교구문", "title": "해커스 중학영문법 2학년 · Chapter 13 비교구문"}, "units": [{"tag": "hk2-13-1-1", "name": "규칙 변화", "talk": [{"k": "m", "t": "Chapter 13은 **비교구문**! 원급 – 비교급 – 최상급 규칙부터 다시 정리해요 📈"}, {"k": "m", "t": "① + er/est (tall) ② -e + r/st (wise) ③ 자음 + y → ier/iest (busy) ④ 단모음 + 단자음 → 자음 겹침 (big → [bigger])"}, {"k": "q", "q": "thin의 비교급은?", "o": ["thiner", "thinner", "more thin"], "a": 1, "ok": "맞아요! 자음 겹침", "no": "단모음 + 단자음 → n을 겹쳐 thinner"}, {"k": "m", "t": "⑤ -ful, -less, -ous, -ive, -ing, -ed로 끝나는 2음절 / 3음절 이상 / -ly 부사 → **more / most**"}, {"k": "q", "q": "carefully의 최상급은?", "o": ["carefulliest", "most carefully", "carefullest"], "a": 1, "ok": "정확해요! -ly 부사 → most", "no": "-ly 부사 → most carefully"}, {"k": "m", "t": "⚠️ 헷갈리는 것: early(형용사·부사 모두) → **earlier** (more early ✗) / 모음 + y: gray → grayer"}, {"k": "q", "q": "early의 최상급은?", "o": ["most early", "earliest", "earlyest"], "a": 1, "ok": "맞아요! y → iest", "no": "early → earliest"}, {"k": "m", "t": "⚠️ **more + -er** 함께 ✗: more bigger ✗, most easiest ✗"}, {"k": "m", "t": "정리! **-er·-r·-ier·자음 겹침 / 긴 단어·-ly 부사 → more·most** 👍"}], "notes": {"table": [["규칙", "원급", "비교급", "최상급"], ["대부분 + er/est", "short", "shorter", "shortest"], ["-e + r/st", "brave", "braver", "bravest"], ["자음 + y → ier/iest", "lazy", "lazier", "laziest"], ["단모음 + 단자음 → 자음 겹침", "wet", "wetter", "wettest"], ["긴 단어 → more/most", "famous", "more famous", "most famous"], ["-ly 부사 → more/most", "slowly", "more slowly", "most slowly"]], "tips": ["early → earlier / earliest (more early ✗)", "모음 + y: gray → grayer", "more + -er 함께 ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "wide → [wider*/wideer]", "e": "-e + r"}, {"k": "pk", "q": "lazy → [lazyer/lazier*]", "e": "y → ier"}, {"k": "pk", "q": "fat → [fatter*/fater]", "e": "자음 겹침"}, {"k": "pk", "q": "useful → [usefuller/more useful*]", "e": "-ful → more"}, {"k": "bl", "q": "비교급: brave → (braver) / dirty → (dirtier) / hot → (hotter)", "e": "규칙"}, {"k": "bl", "q": "최상급: famous → (most) famous / early → (earliest) / sad → (saddest)", "e": "규칙"}, {"k": "bl", "q": "비교급: quickly → (more) quickly / exciting → (more) exciting", "e": "more"}, {"k": "bl", "q": "최상급: dry → (driest) / thin → (thinnest)", "e": "y → iest / 자음 겹침"}, {"k": "fx", "q": "This road is wideer than that one.", "w": "wideer", "a": ["wider"], "e": "-e + r"}, {"k": "fx", "q": "He is the most busiest man in town.", "w": "most", "a": ["(삭제)"], "e": "most + -est ✗ → the busiest"}], "practiceA": [{"k": "ch", "q": "원급-비교급-최상급이 바르지 않은 것은?", "o": ["cheap – cheaper – cheapest", "pretty – prettier – prettiest", "wet – wetter – wettest", "active – activer – activest", "large – larger – largest"], "a": 3, "e": "more active – most active"}, {"k": "ch", "q": "비교급이 바르지 않은 것은?", "o": ["more slowly", "earlier", "more boring", "grayer", "more early"], "a": 4, "e": "earlier"}, {"k": "ch", "q": "빈칸에 more가 들어갈 수 없는 것은?", "o": ["____ famous", "____ quickly", "____ carefully", "____ heavy", "____ dangerous"], "a": 3, "e": "heavier"}, {"k": "bl", "q": "그 시험은 지난번 것보다 더 쉬웠다. → The test was (easier) than the last one.", "e": "y → ier"}, {"k": "bl", "q": "이것이 그 가게에서 가장 비싼 시계이다. → This is the (most) expensive watch in the store.", "e":  "Do you have any further questions?", "ko": "더 질문이 있나요?"}, {"k": "m", "t": "② **late**: later – latest (**시간**: 더 늦은 · 최신의) / latter – last (**순서**: 후자의 · 마지막의)"}, {"k": "q", "q": "This is the ____ news. (최신의)", "o": ["latest", "last", "latter"], "a": 0, "ok": "정확해요! 시간 → latest", "no": "최신의 → latest"}, {"k": "m", "t": "③ **old**: older – oldest (나이·오래됨) / elder – eldest (가족 간 손위, **명사 앞에서만**)"}, {"k": "ex", "en": "My elder sister is two years older than me.", "ko": "우리 언니는 나보다 두 살 많다."}, {"k": "q", "q": "The ____ chapter of the book was the best. (마지막)", "o": ["latest", "last", "latter"], "a": 1, "ok": "맞아요! 순서 → last", "no": "마지막(순서) → last"}, {"k": "m", "t": "⚠️ elder는 **than과 함께 ✗**: He is elder than me ✗ → older than me"}, {"k": "m", "t": "정리! **better·worse·more·less / farther·further / later·latest, latter·last / older·elder** 👍"}], "notes": {"table": [["원급", "비교급", "최상급", "뜻"], ["good / well", "better", "best", "좋은 / 잘"], ["bad / ill", "worse", "worst", "나쁜 / 아픈"], ["many / much", "more", "most", "많은"], ["little", "less", "least", "적은"], ["far", "farther / further", "farthest / furthest", "먼 / 더 이상의"], ["late", "later / latter", "latest / last", "시간 / 순서"], ["old", "older / elder", "oldest / eldest", "나이 / 손위"]], "tips": ["further = 거리 + '추가의' (further information)", "the latest news(최신 뉴스) / the last train(마지막 기차)", "elder + 명사 (than ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "You sing [better*/gooder] than me.", "e": "well → better"}, {"k": "pk", "q": "I have [less*/littler] free time this year.", "e": "little → less"}, {"k": "pk", "q": "This is the [latest*/last] model of the phone. (최신)", "e": "시간 → latest"}, {"k": "pk", "q": "He is three years [older*/elder] than me.", "e": "than → older"}, {"k": "bl", "q": "비교급: good → (better) / bad → (worse) / little → (less)", "e": "불규칙"}, {"k": "bl", "q": "최상급: many → (most) / well → (best) / bad → (worst)", "e": "불규칙"}, {"k": "bl", "q": "나는 그것에 대해 추가 정보가 필요하다. → I need (further|more) information about it.", "e ore loud and loud", "loud and louder"], "a": 1, "e": "-er and -er"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["It's the best movie I've ever seen.", "She is the youngest of the four.", "One of my friends lives in Busan.", "He is one of the tallest boy in our school.", "It's the second biggest city in Korea."], "a": 3, "e": "④ boys"}, {"k": "ch", "q": "의미가 나머지와 다른 것은?", "o": ["Jiwoo is the smartest student in the class.", "No other student in the class is as smart as Jiwoo.", "No other student in the class is smarter than Jiwoo.", "Jiwoo is smarter than any other student in the class.", "Jiwoo is as smart as all the other students in the class."], "a": 4, "e": "⑤ 다른 학생들과 똑같이 똑똑함"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Come as early as possible.\nⓑ My bag is twice as heavy as yours.\nⓒ He is taller than any other boys.\nⓓ It's less colder today.\nⓔ More and more people like K-pop.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ boy / ⓓ less cold"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I have as many books as you.", true], ["Please call me as soon as possibly.", false], ["This box is three times as big as that one.", true], ["He is much taller than his dad.", true], ["The faster you drive, more dangerous it is.", false], ["It's getting colder and colder.", true], ["She is the kindest person I've ever met.", true], ["One of the boys are my cousin.", false], ["No other river in Korea is longer than this one.", true], ["He is smarter than any other students.", false], ["My sister is two years older than me.", true], ["I have less money than you.", true]], "e": "ⓑ possible ⓔ the more dangerous ⓗ is ⓙ student"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Your idea is better than mine.", true], ["He is elder than me.", false], ["She ran as fast as she could.", true], ["This is the latest model.", true], ["My room is as twice large as yours.", false], ["The more you smile, the happier you feel.", true], ["It's one of the most popular games.", true], ["This test is very easier than the last one.", false], ["No other girl is as tall as Yuna.", true], ["He is the most fastest runner.", false], ["Prices are getting higher and higher.", true], ["This bag is less expensive than that one.", true]], "e": "ⓑ older ⓔ twice as large as ⓗ much easier ⓙ the fastest"}, {"k": "wr", "q": "Jake is the tallest boy in his class. → 'any other'를 써서 바꾸시오.", "a": ["Jake is taller than any other boy in his class."], "e": "비교급 than any other + 단수"}, {"k": "wr", "q": "She studied as hard as possible. → 주어 + could를 써서 바꾸시오.", "a": ["She studied as hard as she could."], "e": "과거 → she could"}]}}, {"book": "hk2", "chapter": {"id": "14", "name": "전치사", "title": "해커스 중학영문법 2학년 · Chapter 14 전치사"}, "units": [{"tag": "hk2-14-1-1", "name": "시간 전치사 Ⅰ", "talk": [{"k": "m", "t": "Chapter 14는 **전치사**! 중1에서 배운 at · on · in을 한 단계 더 깊게 ⏰"}, {"k": "m", "t": "**at** + 시각·하루 중 한 시점: at 6:30, at noon, at midnight, at [sunset], at the moment"}, {"k": "m", "t": "**on** + 날짜·요일·특정한 날: on May 1st, on Friday, on my birthday, on weekdays"}, {"k": "m", "t": "**in** + 월·계절·연도·세기·연대: in March, in winter, in 2030, in the 21st century, in the 1990s"}, {"k": "q", "q": "Korea hosted the Olympics ____ 1988.", "o": ["at", "on", "in"], "a": 2, "ok": "맞아요! 연도 → in", "no": "연도는 in"}, {"k": "m", "t": "⚠️ 중2 포인트 ①: morning · afternoon · evening · night도 **특정한 날**이면 **on** → on Sunday morning, on the night of May 5th"}, {"k": "ex", "en": "He was born on the morning of April 3rd.", "ko": "그는 4월 3일 아침에 태어났다."}, {"k": "q", "q": "We met ____ a cold winter evening.", "o": ["at", "on", "in"], "a": 1, "ok": "정확해요! 특정한 날의 저녁 → on", "no": "'어느 추운 겨울 저녁' = 특정한 날의 저녁 → on"}, {"k": "m", "t": "⚠️ 중2 포인트 ②: **this · next · last · every · tomorrow · yesterday** 앞에는 전치사 ✗ → last night, next Monday, every summer"}, {"k": "m", "t": "정리! **at 시각 / on 날짜·요일·특정한 날의 아침 / in 월·계절·연도·세기 / next·last·every 앞 전치사 ✗** 👍"}], "notes": {"table": [["전치사", "쓰임", "예"], ["at", "시각, 하루 중 한 시점", "at 7:30, at noon, at night, at midnight, at dawn"], ["on", "날짜, 요일, 특정한 날, 특정한 날의 아침·저녁", "on June 1st, on Fridays, on Christmas Day, on the morning of June 1st"], ["in", "월, 계절, 연도, 세기, 연대, 오전·오후", "in May, in summer, in 2025, in the 1990s, in the afternoon"], ["전치사 ✗", "this, next, last, every, tomorrow, yesterday 앞", "next week, last night, every Sunday"]], "tips": ["in the morning(아침에) ↔ on Monday morning(월요일 아침에)", "on weekdays(평일마다), on Sundays(일요일마다)", "on a rainy day, on a cold night — 특정한 날은 on"]}, "sets": {"workbook": [{"k": "pk", "q": "The store closes [at*/on] midnight.", "e": "시각·한 시점 → at"}, {"k": "pk", "q": "We moved here [in*/on] 2019.", "e": "연도 → in"}, {"k": "pk", "q": "I was born [in/on*] the morning of May 5th.", "e": "특정한 날의 아침 → on"}, {"k": "pk", "q": "Many people travel [at/in*] the summer.", "e": "계절 → in"}, {"k": "bl", "q": "그 축제는 12월 24일에 열린다. → The festival is held (on) December 24th.", "e": "날짜 → on"}, {"k": "bl", "q": "그는 1990년대에 태어났다. → He was born (in) the 1990s.", "e": "연대 → in"}, {"k": "bl", "q": "나는 해 질 녘에 산책한다. → I take a walk (at) sunset.", "e": "하루 중 한 시점 → at"}, {"k": "bl", "q": "우리는 평일에 학교에 간다. → We go to school (on) weekdays.", "e": "on weekdays"}, {"k": "fx", "q": "I'll visit my uncle on next Saturday.", "w": "on", "a": ["(삭제)"], "e": "next 앞 전치사 ✗ → next Saturday"}, {"k": "fx", "q": "The meeting is in Monday afternoon.", "w": "in", "a": ["on"], "e": "특정한 날의 오후 → on"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 전치사가 나머지와 다른 것은?", "o": ["____ July", "____ 2030", "____ the evening", "____ New Year's Day", "____ the 21st century"], "a": 3, "e": "④ on New Year's Day / 나머지 in"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe train leaves ____ 6:30 ____ Friday.", "o": ["at – in", "on – at", "at – on", "in – on", "at – at"], "a": 2, "e": "시각 at / 요일 on"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["We have no school on Sundays.", "I'll see you this weekend.", "It was very cold in that night.", "He got up at dawn.", "Leaves fall in autumn."], "a": 2, "e": "③ that night (전치사 ✗) 또는 on that night"}, {"k": "bl", "q": "그들은 2월 14일 저녁에 만났다. → They met (on) the evening of February 14th.", "e": "특정한 날의 저녁 → on"}, {"k": "bl", "q": "그 박물관은 화요일마다 문을 닫는다. → The museum is closed (on) Tuesdays.", "e": "요일 → on"}, {"k": "pk", "q": "She called me [last night*/at last night].", "e": "last 앞 전치사 ✗"}, {"k": "pk", "q": "My grandfather was born [in*/on] 1955.", "e": "연도 → in"}, {"k": "fx", "q": "We usually eat turkey in Thanksgiving Day.", "w": "in", "a": ["on"], "e": "특정한 날 → on"}, {"k": "ox", "q": "I'll finish it tomorrow morning.", "a": true, "e": "✔ tomorrow 앞 전치사 ✗"}, {"k": "ox", "q": "The sun rises early on summer.", "a": false, "e": "계절 → in summer"}], "practiceB": [{"k": "wr", "q": "우리는 매주 토요일에 테니스를 친다. (play tennis, every Saturday)", "a": ["We play tennis every Saturday.", "Every Saturday, we play tennis.", "Every Saturday we play tennis."], "e": "every 앞 전치사 ✗"}, {"k": "wr", "q": "그 콘서트는 7월 4일 오후 7시에 시작한다. (The concert starts, at 7 p.m., on July 4th)", "a": ["The concert starts at 7 p.m. on July 4th.", "The concert starts on July 4th at 7 p.m.", "The concert starts at 7 pm on July 4th.", "The concert starts at 7 p.m. on July 4."], "e": "시각 at / 날짜 on"}, {"k": "or", "q": "그녀는 크리스마스 아침에 선물을 열었다.", "a": "She opened her presents on Christmas morning.", "e": "특정한 날의 아침 → on"}, {"k": "or", "q": "그 다리는 19세기에 지어졌다.", "a": "The bridge was built in the 19th century.", "e": "세기 → in"}, {"k": "fx", "q": "My parents got married at May 2005.", "w": "at", "a": ["in"], "e": "월·연도 → in"}, {"k": "fx", "q": "Let's meet at the afternoon.", "w": "at", "a": ["in"], "e": "in the afternoon"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I was born on a rainy night.\nⓑ We'll leave in next Monday.\nⓒ The shop opens at 10 a.m.\nⓓ She lived in Paris in the 1980s.\nⓔ He calls me every Sunday.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓒⓓⓔ 옳음 / ⓑ next Monday (전치사 ✗)"}, {"k": "bl", "q": "파티는 10월 31일 밤에 있다. → The party is (on) the night of October 31st.", "e": "특정한 날의 밤 → on"}, {"k": "bl", "q": "부엉이는 밤에 사냥한다. → Owls hunt (at) night.", "e": "at night"}, {"k": "pk", "q": "I have a piano lesson [on*/in] Wednesday afternoons.", "e": "특정한 요일의 오후 → on"}]}}, {"tag": "hk2-14-1-2", "name": "시간 전치사 Ⅱ", "talk": [{"k": "m", "t": "시간 전치사 Ⅱ: **before · after / for · during / from · since** ⏳"}, {"k": "m", "t": "**before**(~ 전에) / **after**(~ 후에) + 명사 또는 **동명사**: before dinner, after [finishing] the test"}, {"k": "q", "q": "Wash your hands before ____.", "o": ["eat", "eating", "to eat"], "a": 1, "ok": "맞아요! 전치사 뒤 → 동명사", "no": "전치사 before 뒤에 동사 → 동명사 eating"}, {"k": "m", "t": "**for** + 숫자가 있는 기간(얼마나 오래?) / **during** + 특정한 기간(언제?): for three weeks / during the vacation"}, {"k": "q", "q": "I stayed in Jeju ____ the summer vacation.", "o": ["for", "during", "since"], "a": 1, "ok": "정확해요! 특정한 기간 → during", "no": "'여름 방학'은 언제인지 나타내는 특정 기간 → during"}, {"k": "m", "t": "**from** A **to(until)** B: A부터 B까지 / **since** + 과거 시점: ~ 이후로 (지금까지) → 주로 **현재완료**와 함께"}, {"k": "ex", "en": "I have known her since 2020.", "ko": "나는 2020년부터 (지금까지) 그녀를 알아 왔다."}, {"k": "q", "q": "He has lived here ____ 2015.", "o": ["from", "for", "since"], "a": 2, "ok": "맞아요! 시작 시점 + 현재완료 → since", "no": "2015년(시작 시점)부터 지금까지 → since"}, {"k": "m", "t": "⚠️ for vs since: **for** + 기간(for ten years) / **since** + 시작 시점(since 2016) — 둘 다 현재완료와 잘 어울려요"}, {"k": "m", "t": "정리! **before·after + 명사·동명사 / for 숫자 기간 / during 특정 기간 / since 시작 시점** 👍"}], "notes": {"table": [["전치사", "뜻", "예"], ["before / after", "~ 전에 / ~ 후에", "before lunch, after school, after finishing it"], ["for", "~ 동안 (숫자 기간)", "for two hours, for a week"], ["during", "~ 동안 (특정 기간)", "during the class, during the summer"], ["from A to B", "A부터 B까지", "from 9 to 5, from Monday to Friday"], ["since", "~ 이후로 (현재완료와 함께)", "since 2020, since last Monday"]], "tips": ["'얼마나?' → for / '언제?' → during", "for + 기간 ↔ since + 시작 시점", "전치사 뒤 동사는 동명사(-ing)"]}, "sets": {"workbook": [{"k": "pk", "q": "I usually read [before*/since] going to bed.", "e": "~ 전에 + 동명사"}, {"k": "pk", "q": "She studied [for*/during] five hours.", "e": "숫자 기간 → for"}, {"k": "pk", "q": "He slept [for/during*] the class.", "e": "특정 기간 → during"}, {"k": "pk", "q": "I have been sick [for/since*] last Friday.", "e": "시작 시점 → since"}, {"k": "bl", "q": "그 가게는 아침 9시부터 저녁 6시까지 문을 연다. → The store is open (from) 9 a.m. (to|until|till) 6 p.m.", "e": "from A to B"}, {"k": "bl", "q": "나는 점심을 먹은 후에 이를 닦았다. → I brushed my teeth after (eating|having) lunch.", "e": "after + 동명사"}, {"k": "bl", "q": "우리는 2주 동안 캠핑을 했다. → We went camping (for) two weeks.", "e": "숫자 기간 → for"}, {"k": "bl", "q": "나는 3년 동안 영어를 공부해 왔다. → I have studied English (for) three years.", "e": "현재완료 + for + 기간"}, {"k": "fx", "q": "It has rained since three days.", "w": "since", "a": ["for"], "e": "기간 → for"}, {"k": "fx", "q": "I fell asleep for the lecture.", "w": "for", "a": ["during"], "e": "특정 기간(강의 중) → during"}], "practiceA": [{"k": "ch", "q": "빈칸에 for가 들어갈 수 없는 것은?", "o": ["I waited ____ an hour.", "She stayed there ____ a week.", "He was quiet ____ the meeting.", "We talked ____ two hours.", "I've had this bike ____ five years."], "a": 2, "e": "③ during the meeting"}, {"k": "ch", "q": "빈칸에 알맞은 것은? We have been friends ____ elementary school.", "o": ["for", "during", "since", "at", "in"], "a": 2, "e": "시작 시점 + 현재완료 → since"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Call me after lunch.", "I have lived here since 2018.", "He worked from Monday to Friday.", "She cried during the movie.", "Think carefully before answer the question."], "a": 4, "e": "⑤ before answering"}, {"k": "bl", "q": "방학 동안 나는 책을 많이 읽었다. → I read many books (during) the vacation.", "e": "특정 기간 → during"}, {"k": "bl", "q": "그녀는 어제부터 아무것도 먹지 않았다. → She hasn't eaten anything (since) yesterday.", "e": "시작 시점 → since"}, {"k": "pk", "q": "Turn off the lights [before*/for] leaving the room.", "e": "~ 전에"}, {"k": "pk", "q": "The rain continued [for*/since] three days.
