": "계속 → until"}, {"k": "pk", "q": "Can you come back [by*/until] 5? (늦어도 5시까지 돌아오기)", "e": "마감 → by"}, {"k": "pk", "q": "Let's wait here [by/until*] lunchtime.", "e": "계속 → until"}, {"k": "bl", "q": "그 일을 일주일 이내에 끝내라. → Finish the work (within) a week.", "e": "~ 이내에"}, {"k": "bl", "q": "기차는 30분 후에 떠난다. → The train leaves (in) 30 minutes.", "e": "~ 후에 → in"}, {"k": "bl", "q": "그는 밤새 내내 공부했다. → He studied (through|throughout) the night.", "e": "~ 내내"}, {"k": "bl", "q": "도서관 책을 월요일까지 반납해야 한다. → You should return the library books (by) Monday.", "e": "반납 마감 → by"}, {"k": "fx", "q": "I'll stay at my aunt's house by Sunday.", "w": "by", "a": ["until", "till"], "e": "계속 머묾 → until"}, {"k": "fx", "q": "You must arrive at the airport until 7 a.m.", "w": "until", "a": ["by"], "e": "도착 마감 → by"}], "practiceA": [{"k": "ch", "q": "빈칸에 by가 알맞은 것은?", "o": ["I'll be home ____ 9. (늦어도 9시까지 도착)", "Let's play ____ dinner time. (계속)", "He worked ____ midnight. (계속)", "She waited ____ evening.", "The store is open ____ 10 p.m."], "a": 0, "e": "① 마감 → by / 나머지 until"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The doctor will see you ____ ten minutes. (10분 후에)", "o": ["at", "on", "in", "for", "since"], "a": 2, "e": "~ 후에 → in"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Submit the form by Friday.", "I'll keep it until next week.", "Reply within 24 hours.", "The rain continued throughout the day.", "I have to finish my homework until 8."], "a": 4, "e": "⑤ 완료 → by 8"}, {"k": "bl", "q": "우리는 자정까지 이야기했다. → We talked (until|till) midnight.", "e": "계속 → until"}, {"k": "bl", "q": "그 소포는 3일 이내에 도착할 것이다. → The package will arrive (within) three days.", "e": "~ 이내에"}, {"k": "pk", "q": "The museum is open [until*/by] 6 p.m.", "e": "계속 열려 있음 → until"}, {"k": "pk", "q": "She'll be back [in*/at] an hour. (한 시간 후에)", "e": "~ 후에 → in"}, {"k": "fx", "q": "Please pay the money until the end of this month.", "w": "until", "a": ["by"], "e": "지불 마감 → by"}, {"k": "ox", "q": "He kept the secret until the end.", "a": true, " r not is not important.", "e": "주어 자리 whether"}, {"k": "or", "q": "너는 그가 사실을 아는지 아니?", "a": "Do you know if he knows the truth?", "e": "~인지"}, {"k": "fx", "q": "If he passed the test is not known yet.", "w": "If", "a": ["Whether"], "e": "주어 자리 → Whether"}, {"k": "fx", "q": "I wonder whether it rains tomorrow.", "w": "rains", "a": ["will rain"], "e": "명사절 → will 그대로"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wonder if it is true.\nⓑ If he likes me is a secret.\nⓒ Ask him whether or not he agrees.\nⓓ I don't know if she will come.\nⓔ The problem is whether we have enough money.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓒⓓⓔ 옳음 / ⓑ Whether"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI'm not sure ____ he is at home. (~인지)\nI know ____ he is at home. (~라는 것)", "o": ["if – that", "that – if", "that – that", "if – if", "whether – if"], "a": 0, "e": "~인지 if / ~라는 것 that"}, {"k": "bl", "q": "그것은 우리가 시간이 있는지 없는지에 달려 있다. → It depends on (whether) we have time or not.", "e": "전치사 뒤 → whether"}, {"k": "bl", "q": "이 버스가 서울역에 가는지 알려 주시겠어요? → Can you tell me (if|whether) this bus goes to Seoul Station?", "e": "~인지"}]}}, {"tag": "hk2-15-4-1", "name": "부사절을 이끄는 접속사: 시간", "talk": [{"k": "m", "t": "부사절 접속사 ① **시간** ⏰"}, {"k": "m", "t": "**when** ~할 때 / **while** ~하는 동안 / **before** ~하기 전에 / **after** ~한 후에"}, {"k": "m", "t": "**until(till)** ~할 때까지 / **since** ~한 이후로 (주절은 보통 현재완료) / **as soon as** ~하자마자"}, {"k": "ex", "en": "I have lived here since I was five.", "ko": "나는 다섯 살 때부터 여기에 살아 왔다."}, {"k": "q", "q": "Call me ____ you arrive. (도착하자마자)", "o": ["as soon as", "until", "while"], "a": 0, "ok": "맞아요! ~하자마자 → as soon as", "no": "'~하자마자'는 as soon as"}, {"k": "m", "t": "⚠️ 시간 부사절은 미래 일도 **현재시제**: I'll wait until he **comes**. (will come ✗)"}, {"k": "q", "q": "Let's start after everyone ____.", "o": ["arrives", "will arrive", "arrived"], "a": 0, "ok": "정확해요! 시간절 → 현재시제", "no": "시간 부사절은 미래 대신 현재 → arrives"}, {"k": "m", "t": "전치사 vs 접속사: during the movie(전치사 + 명사) / [whi  명사 / because + 주어 + 동사", "As(Because) ~, so ~ ✗ — 둘 중 하나만", "since·as: 이유 / 시간 둘 다 가능 → 문맥으로"]}, "sets": {"workbook": [{"k": "pk", "q": "I like her [because*/because of] she is funny.", "e": "주어 + 동사 → because"}, {"k": "pk", "q": "We were late [because/because of*] the traffic.", "e": "명사 → because of"}, {"k": "pk", "q": "[Since*/Until] it's raining, let's stay inside.", "e": "이유 → since"}, {"k": "pk", "q": "As I was hungry, I [ate*/eat] two sandwiches.", "e": "과거 일 → ate"}, {"k": "bl", "q": "그는 아팠기 때문에 결석했다. → He was absent (because|since|as) he was sick.", "e": "이유"}, {"k": "bl", "q": "그 소음 때문에 나는 잠을 잘 수 없었다. → I couldn't sleep because (of) the noise.", "e": "명사 → because of"}, {"k": "bl", "q": "날씨가 좋아서 우리는 소풍을 갔다. → The weather was nice, (so) we went on a picnic.", "e": "결과 → so"}, {"k": "bl", "q": "너는 여기 있으니까 나를 좀 도와줘. → (Since|As|Because) you are here, please help me.", "e": "이유"}, {"k": "fx", "q": "We canceled the trip because the storm.", "w": "because", "a": ["because of"], "e": "명사 → because of"}, {"k": "fx", "q": "Because of he was tired, he went to bed early.", "w": "of", "a": ["(삭제)"], "e": "주어 + 동사 → Because"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? ____ it was cold, I wore a thick coat.", "o": ["Because", "Since", "As", "Because of", "When"], "a": 3, "e": "④ 주어 + 동사 앞 → because of ✗"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Because he studied hard, he passed the exam.", "o": ["He studied hard, so he passed the exam.", "He passed the exam, so he studied hard.", "He studied hard, but he passed the exam.", "He studied hard, or he passed the exam.", "If he studies hard, he passes the exam."], "a": 0, "e": "이유 because = 결과 so"}, {"k": "ch", "q": "다음 중 since의 의미가 나머지와 다른 것은?", "o": ["Since it's late, let's go home.", "Since you're busy, I'll do it.", "I've lived here since 2015.", "Since he was sick, he stayed in bed.", "Since I have no money, I can't buy it."], "a": 2, "e": "③ ~ 이후로(시간) / 나머지 ~ 때문에"}, {"k": "bl", "q": "나는 길을 잃어서 늦었다. → I was late (because|as|since) I got lost.", "e": "이유"}, {"k": "bl", "q": "감기 때문에 나는 수영할 수 없다. → I can't swim because (of) my cold.", "e": "명사 → because of"}, {"k": "pk", "q": "[As*/Though] it was dark, I turned on the light.", "e": "이유 → as"}, {"k": "pk", "q": "She was upset [because*/because of] I forgot her birthday.", "e": "주어 + 동사 → because"}, {"k": "fx", "q": "It was snowing, because we built a snowman.", "w": "because", "a": ["so"], "e": "결과 → so"}, {"k": "ox", "q": "As he was busy, he couldn't come.", "a": true, "e": "✔ 이유 as"}, {"k": "ox", "q": "I stayed home because of I was sick.", "a": false, "e": "주어 + 동사 → because"}], "practiceB": [{"k": "wr", "q": "It was very hot, so we went swimming. → because를 써서 바꾸시오.", "a": ["Because it was very hot, we went swimming.", "Because it was very hot we went swimming.", "We went swimming because it was very hot."], "e": "because + 이유"}, {"k": "wr", "q": "그 사고 때문에 길이 막혔다. (The road was blocked, because of, the accident)", "a": ["The road was blocked because of the accident."], "e": "because of + 명사"}, {"k": "or", "q": "그는 친절하기 때문에 모두가 그를 좋아한다.", "a": "Everyone likes him because he is kind.", "e": "because"}, {"k": "or", "q": "늦었으니까 택시를 타자.", "a": "Since it is late, let's take a taxi.", "e": "since(이유)"}, {"k": "fx", "q": "Because the snow, we couldn't drive.", "w": "Because", "a": ["Because of"], "e": "명사 → Because of"}, {"k": "fx", "q": "As I had a headache, so I took some medicine.", "w": "so", "a": ["(삭제)"], "e": "As ~, so ~ ✗"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'm tired because I didn't sleep.\nⓑ Because of the rain, we stayed in.\nⓒ Since it was Sunday, the bank was closed.\nⓓ As she is kind, everyone likes her.\nⓔ He cried because of he was sad.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ because"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nWe stayed inside ____ the heat.\nWe stayed inside ____ it was too hot.", "o": ["because of – because", "because – because of", "because of – because of", "so – because", "because – so"], "a": 0, "e": "명사 앞 because of / 주어 + 동사 앞 because"}, {"k": "bl", "q": "버스를 놓쳐서 나는 학교에 지각했다. → (Because|Since|As) I missed the bus, I was late for school.", "e": "이유"}, {"k": "bl", "q": "너무 추워서 나는 밖에 나가지 않았다. → I didn't go out (because|since|as) it was too cold.", "e": "이유"}]}}, {"tag": "hk2-15-4-3", "name": "부사절을 이끄는 접속사: 조건", "talk": [{"k": "m", "t": "부사절 접속사 ③ **조건**: if(만약 ~하면) · unless(만약 ~하지 않으면) 🔀"}, {"k": "ex", "en": "If you need help, call me.", "ko": "도움이 필요하면 나에게 전화해."}, {"k": "m", "t": "⚠️ 조건 부사절도 미래 일은 **현재시제**: If it **rains** tomorrow, we'll stay home."}, {"k": "q", "q": "If you ____ early, you can catch the bus.", "o": ["leave", "will leave", "left"], "a": 0, "ok": "맞아요! 조건절 → 현재시제", "no": "조건 부사절은 미래 대신 현재 → leave"}, {"k": "m", "t": "**unless = if ~ not** → Unless you hurry, you'll be late. = If you don't hurry, you'll be late."}, {"k": "q", "q": "____ you study, you will fail.", "o": ["If", "Unless", "Because"], "a": 1, "ok": "정확해요! 공부하지 않으면 → Unless", "no": "'~하지 않으면' → Unless"}, {"k": "m", "t": "⚠️ unless 안에 이미 not의 뜻! → Unless you **don't** hurry ✗ / Unless you [hurry] ✔"}, {"k": "m", "t": "비교: 명사절 if(~인지)는 **will 그대로** / 부사절 if(~하면)는 **현재** → I don't know if he will come. / If he comes, I'll be glad."}, {"k": "m", "t": "정리! **if ~하면 / unless = if ~ not (not 또 쓰기 ✗) / 조건절 미래 → 현재시제** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["if", "만약 ~하면", "If it is sunny, we'll go out."], ["unless", "만약 ~하지 않으면 (= if ~ not)", "Unless you hurry, you'll miss it."], ["명사절 if", "~인지 (will 유지)", "I wonder if it will snow."]], "tips": ["조건 부사절: 미래 의미도 현재시제", "unless + 긍정문 (unless ~ not ✗)", "명령문, or = If you don't ~ = Unless you ~"]}, "sets": {"workbook": [{"k": "pk", "q": "If it [snows*/will snow] tomorrow, we'll go skiing.", "e": "조건절 → 현재"}, {"k": "pk", "q": "[Unless*/If] you leave now, you will miss the train. (지금 떠나지 않으면)", "e": "~하지 않으면 → Unless"}, {"k": "pk", "q": "Unless you [hurry*/don't hurry], you'll be late.", "e": "unless + 긍정"}, {"k": "pk", "q": "I'll help you if you [need*/will need] it.", "e": "조건절 → 현재"}, {"k": "bl", "q": "만약 네가 바쁘면 내가 대신 갈게. → (If) you are busy, I'll go instead.", "e": "조건"}, {"k": "bl", "q": "열심히 연습하지 않으면 이길 수 없다. → (Unless) you practice hard, you can't win.", "e": "~하지 않으면"}, {"k": "bl", "q": "코트를 입지 않으면 감기에 걸릴 것이다. → If you don't wear a coat, you'll catch a cold. = (Unless) you wear a coat, you'll catch a cold.", "e": "if ~ not = unless"}, {"k": "bl", "q": "만약 그가 내일 오면, 나는 그에게 그 책을 줄 것이다. → If he (comes) tomorrow, I'll give him the book.", "e": "조건절 → 현재"}, {"k": "fx", "q": "Unless you don't hurry, you will be late.", "w": "don't", "a": ["(삭제)"], "e": "unless + 긍정"}, {"k": "fx", "q": "If you will finish early, you can go home.", "w": "will", "a": ["(삭제)"], "e": "조건절 → If you finish"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? If it ____ tomorrow, the picnic will be canceled.", "o": ["rains", "will rain", "rained", "rain", "raining"], "a": 0, "e": "조건절 → 현재"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Unless you take this medicine, you won't get better.", "o": ["If you take this medicine, you won't get better.", "If you don't take this medicine, you won't get better.", "Unless you don't take this medicine, you'll get better.", "Because you take this medicine, you won't get better.", "If you take this medicine, you will get worse."], "a": 1, "e": "unless = if ~ not"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["If you need money, I'll lend you some.", "Unless it rains, we'll play outside.", "I'll go if you go.", "If he will call me, I'll tell him.", "You can't go out unless you finish your homework."], "a": 3, "e": "④ If he calls me"}, {"k": "bl", "q": "만약 길을 잃으면 나에게 전화해. → (If) you get lost, call me.", "e": "조건"}, {"k": "bl", "q": "네가 사과하지 않으면 그녀는 너를 용서하지 않을 것이다. → She won't forgive you (unless) you say sorry.", "e": "~하지 않으면"}, {"k": "pk", "q": "I don't know if he [will come*/comes] tomorrow. (~인지)", "e": "명사절 → will 그대로"}, {"k": "pk", "q": "If he [comes*/will come] tomorrow, I'll be happy. (~하면)", "e": "조건절 → 현재"}, {"k": "fx", "q": "Unless you are not careful, you will make a mistake.", "w": "not", "a": ["(삭제)"], "e": "unless + 긍정"}, {"k": "ox", "q": "Unless you wear a helmet, you can't ride the bike.", "a": true, "e": "✔"}, {"k": "ox", "q": "If you will practice every day, you'll get better.", "a": false, "e": "조건절 → If you practice"}], "practiceB": [{"k": "wr", "q": "If you don't hurry, you'll miss the bus. → unless를 써서 바꾸시오.", "a": ["Unless you hurry, you'll miss the bus.", "Unless you hurry you will miss the bus.", "You will miss the bus unless you hurry.", "You'll miss the bus unless you hurry.", "Unless you hurry, you will miss the bus."], "e": "if ~ not = unless"}, {"k": "wr", "q": "만약 내일 날씨가 좋으면 우리는 해변에 갈 것이다. (If, the weather, nice, go to the beach)", "a": ["If the weather is nice tomorrow, we'll go to the beach.", "If the weather is nice tomorrow we will go to the beach.", "We will go to the beach if the weather is nice tomorrow.", "We'll go to the beach if the weather is nice tomorrow.", "If the weather is nice tomorrow, we will go to the beach."], "e": "조건절 → 현재"}, {"k": "or", "q": "네가 원하지 않으면 가지 않아도 된다.", "a": "You don't have to go unless you want to.", "e": "unless"}, {"k": "or", "q": "만약 네가 그를 보면 나에게 알려 줘.", "a": "If you see him, please let me know.", "e": "조건절 → 현재"}, {"k": "fx", "q": "If you won't leave now, you'll be late.", "w": "won't", "a": ["don't"], "e": "조건절 → 현재: If you don't leave"}, {"k": "fx", "q": "Unless it snow, we'll go out.", "w": "snow", "a": ["snows"], "e": "3인칭 단수 현재"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If it is cold, wear a jacket.\nⓑ Unless you hurry, you'll be late.\nⓒ If he will come, I'll leave.\nⓓ I wonder if she will like it.\nⓔ Unless you don't study, you'll fail.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ If he comes / ⓔ Unless you study"}, {"k": "ch", "q": "빈칸에 공통으로 들어갈 말은? ____ you leave now, you'll miss the bus. / You can't enter ____ you have a ticket.", "o": ["Unless(unless)", "If(if)", "Because(because)", "When(when)", "Although(although)"], "a": 0, "e": "~하지 않으면 → unless"}, {"k": "bl", "q": "회원이 아니면 체육관을 이용할 수 없다. → (Unless) you are a member, you can't use the gym.", "e": "~하지 않으면"}, {"k": "bl", "q": "내일 몸이 아프면 집에 있어라. → If you (feel) sick tomorrow, stay home.", "e": "조건절 → 현재"}]}}, {"tag": "hk2-15-4-4", "name": "부사절을 이끄는 접속사: 양보", "talk": [{"k": "m", "t": "부사절 접속사 ④ **양보**: '비록 ~이지만, ~에도 불구하고' 🤝"}, {"k": "m", "t": "**though / although / even though** + 주어 + 동사"}, {"k": "ex", "en": "Although it was raining, we played soccer.", "ko": "비가 오고 있었지만 우리는 축구를 했다."}, {"k": "q", "q": "____ he is young, he is very wise.", "o": ["Because", "Although", "If"], "a": 1, "ok": "맞아요! 어리지만 → Although", "no": "어린데도 현명하다(반대 흐름) → Although"}, {"k": "m", "t": "**even if**: (설령) ~일지라도 — 아직 일어나지 않은 일·가정 / **even though**: (실제로) ~이지만"}, {"k": "ex", "en": "Even if it rains tomorrow, I'll go.", "ko": "설령 내일 비가 오더라도 나는 갈 것이다."}, {"k": "m", "t": "⚠️ 전치사 **despite / in spite of + 명사(구)** vs 접속사 **although + 주어 + 동사** (Ch.14 복습)"}, {"k": "q", "q": "____ the cold weather, they went swimming.", "o": ["Although", "Despite", "Even though"], "a": 1, "ok": "정확해요! 명사구 앞 → Despite", "no": "the cold weather(명사구) → Despite"}, {"k": "m", "t": "⚠️ although와 but은 함께 쓰지 않아요: Although he was tired, **but** he worked. (✗)"}, {"k": "m", "t": "정리! **though·although·even though + 주어 + 동사 / even if 가정 / despite·in spite of + 명사 / although ~, but ✗** 👍"}], "notes": {"table": [["표현", "뒤에 오는 말", "예"], ["though / although", "주어 + 동사", "Although he is rich, he isn't happy."], ["even though", "주어 + 동사 (실제 사실)", "Even though I was sick, I went to school."], ["even if", "주어 + 동사 (가정)", "Even if you fail, try again."], ["despite / in spite of", "명사(구)·동명사", "Despite the rain, we went out."]], "tips": ["although ~, but ~ ✗", "despite of ✗", "He was poor, but he was happy. = Although he was poor, he was happy."]}, "sets": {"workbook": [{"k": "pk", "q": "[Although*/Because] I was tired, I finished the work.", "e": "양보"}, {"k": "pk", "q": "[Despite*/Though] the noise, I fell asleep.", "e": "명사 앞 → Despite"}, {"k": "pk", "q": "She went to school [though*/in spite of] she was sick.", "e": "주어 + 동사 → though"}, {"k": "pk", "q": "[Even if*/Because] it snows, the game will go on.", "e": "설령 ~일지라도"}, {"k": "bl", "q": "그는 부자이지만 행복하지 않다. → (Although|Though|Even though) he is rich, he isn't happy.", "e": "양보"}, {"k": "bl", "q": "비에도 불구하고 그들은 하이킹을 갔다. → (Despite|In spite of) the rain, they went hiking.", "e": "명사 → despite"}, {"k": "bl", "q": "비록 네가 늦더라도 나는 기다릴 것이다. → Even (if) you are late, I'll wait.", "e": "가정 → even if"}, {"k": "bl", "q": "그녀는 열심히 공부했지만 시험에 떨어졌다. → (Though|Although|Even though) she studied hard, she failed the test.", "e": "양보"}, {"k": "fx", "q": "Although it was cold, but we went out.", "w": "but", "a": ["(삭제)"], "e": "although ~, but ✗"}, {"k": "fx", "q": "Despite he was sick, he went to work.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "주어 + 동사 → Although"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ she was very hungry, she didn't eat anything.", "o": ["Because", "Although", "Since", "As", "If"], "a": 1, "e": "양보"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ the bad weather, we enjoyed the trip.", "o": ["Although", "Though", "Even though", "Despite", "Even if"], "a": 3, "e": "명사구 앞 → Despite"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Though he is short, he plays basketball well.", "Even if you fail, try again.", "In spite of his age, he runs fast.", "Although she was busy, she helped me.", "Despite of the rain, we played outside."], "a": 4, "e": "⑤ Despite (of ✗)"}, {"k": "bl", "q": "그 가방은 비싸지만, 나는 그것을 살 것이다. → (Although|Though|Even though) the bag is expensive, I'll buy it.", "e": "양보"}, {"k": "bl", "q": "그의 노력에도 불구하고 그는 졌다. → (Despite|In spite of) his efforts, he lost.", "e": "명사 → despite"}, {"k": "pk", "q": "[Even though*/Despite] I studied a lot, the test was hard.", "e": "주어 + 동사 → Even though"}, {"k": "pk", "q": "He kept running [although*/despite] his legs hurt.", "e": "주어 + 동사 → although"}, {"k": "fx", "q": "Though the heavy traffic, we arrived on time.", "w": "Though", "a": ["Despite", "In spite of"], "e": "명사구 → Despite"}, {"k": "ox", "q": "Although it was late, but he kept studying.", "a": false, "e": "although ~, but ✗"}, {"k": "ox", "q": "Even if you don't like it, you should try it.", "a": true, "e": "✔"}], "practiceB": [{"k": "wr", "q": "Although it was raining, we played soccer. → Despite를 써서 바꾸시오. (the rain)", "a": ["Despite the rain we played soccer.", "We played soccer despite the rain.", "Despite the rain, we played soccer."], "e": "despite + 명사"}, {"k": "wr", "q": "그는 피곤했지만 숙제를 끝냈다. (Although, tired, finished his homework)", "a": ["Although he was tired he finished his homework.", "He finished his homework although he was tired.", "Although he was tired, he finished his homework."], "e": "although + 주어 + 동사"}, {"k": "or", "q": "비록 그녀는 어리지만 매우 용감하다.", "a": "Although she is young, she is very brave.", "e": "although"}, {"k": "or", "q": "설령 내일 비가 오더라도 우리는 떠날 것이다.", "a": "Even if it rains tomorrow, we will leave.", "e": "even if"}, {"k": "fx", "q": "Although the cold weather, he wore shorts.", "w": "Although", "a": ["Despite", "In spite of"], "e": "명사구 → Despite"}, {"k": "fx", "q": "Even though he practiced hard, so he lost the game.", "w": "so", "a": ["(삭제)"], "e": "even though ~, so ✗"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Though it was expensive, I bought it.\nⓑ Despite being sick, she came.\nⓒ Although he was tired, but he helped me.\nⓓ Even if it snows, I will go.\nⓔ In spite of the noise, I slept well.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ but 삭제"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? He was poor, but he was happy.", "o": ["Because he was poor, he was happy.", "Although he was poor, he was happy.", "If he was poor, he was happy.", "Despite he was poor, he was happy.", "Unless he was poor, he was happy."], "a": 1, "e": "but = although"}, {"k": "bl", "q": "나는 그녀에게 여러 번 전화했지만, 그녀는 받지 않았다. → (Although|Though|Even though) I called her many times, she didn't answer.", "e": "양보"}, {"k": "bl", "q": "우리는 폭풍우에도 불구하고 밖에 나갔다. → We went out (despite|in spite of) the storm.", "e": "명사 → despite"}]}}, {"tag": "hk2-15-4-5", "name": "부사절을 이끄는 접속사: as의 다양한 의미", "talk": [{"k": "m", "t": "부사절 접속사 ⑤ **as** — 뜻이 여러 개! 문맥으로 해석해요 🔍"}, {"k": "m", "t": "① **시간**: ~할 때, ~하면서 → As I entered the room, everyone clapped."}, {"k": "m", "t": "② **이유**: ~ 때문에 → As it was late, we went home."}, {"k": "m", "t": "③ **방식**: ~처럼, ~대로, ~듯이 → Do as I say. (내가 말하는 대로 해라) / As you know, … (너도 알듯이)"}, {"k": "q", "q": "Do it ____ I showed you. (내가 보여 준 대로)", "o": ["as", "because", "though"], "a": 0, "ok": "맞아요! ~대로 → as", "no": "'~대로'는 방식의 as"}, {"k": "m", "t": "④ **비례**: ~함에 따라, ~할수록 → As you grow older, you become [wiser]."}, {"k": "q", "q": "'As it got dark, it became colder.'에서 as의 뜻은?", "o": ["~ 때문에", "~함에 따라", "~처럼"], "a": 1, "ok": "정확해요! 어두워짐에 따라 → 비례", "no": "어두워질수록 더 추워짐 → ~함에 따라"}, {"k": "m", "t": "⚠️ 전치사 as(~로서) + 명사 vs 접속사 as + 주어 + 동사: He works **as a chef**. / He cooks **as his mom does**."}, {"k": "m", "t": "정리! **as = ① ~할 때·~하면서 ② ~ 때문에 ③ ~처럼·~대로 ④ ~함에 따라 / 전치사 as ~로서** 👍"}], "notes": {"table": [["의미", "예", "해석"], ["시간 (~할 때, ~하면서)", "As I was leaving, he arrived.", "내가 떠날 때 그가 도착했다"], ["이유 (~ 때문에)", "As I was sick, I stayed home.", "아파서 집에 있었다"], ["방식 (~처럼, ~대로)", "Do as I told you.", "내가 말한 대로 해라"], ["비례 (~함에 따라)", "As time went by, he got better.", "시간이 지남에 따라 그는 나아졌다"], ["전치사 (~로서)", "She works as a nurse.", "그녀는 간호사로 일한다"]], "tips": ["비례의 as는 주로 비교급·변화 동사(grow, get, become)와 함께", "as + 명사 = 전치사(~로서) / as + 주어 + 동사 = 접속사"]}, "sets": {"workbook": [{"k": "pk", "q": "As I was tired, I went to bed early. → as의 뜻: [~ 때문에*/~처럼]", "e": "이유"}, {"k": "pk", "q": "Do [as*/though] the teacher says.", "e": "~대로 → as"}, {"k": "pk", "q": "As she grew older, she became [wiser*/wise].", "e": "비례 + 비교급"}, {"k": "pk", "q": "He works [as*/like] a doctor. (의사로서)", "e": "전치사 as(~로서)"}, {"k": "bl", "q": "내가 말한 대로 해라. → Do it (as) I told you.", "e": "방식"}, {"k": "bl", "q": "그녀는 노래를 부르면서 설거지를 했다. → She washed the dishes (as|while) she sang.", "e": "~하면서"}, {"k": "bl", "q": "늦었기 때문에 우리는 택시를 탔다. → (As|Since|Because) it was late, we took a taxi.", "e": "이유"}, {"k": "bl", "q": "시간이 지남에 따라 그는 더 강해졌다. → (As) time went by, he became stronger.", "e": "비례"}, {"k": "fx", "q": "Do because I say.", "w": "because", "a": ["as"], "e": "~대로 → as"}, {"k": "fx", "q": "Like it was raining, we stayed inside.", "w": "Like", "a": ["As", "Because", "Since"], "e": "이유 → As"}], "practiceA": [{"k": "ch", "q": "다음 문장에서 as의 의미로 알맞은 것은? As he was leaving, the phone rang.", "o": ["~ 때문에", "~할 때", "~처럼", "~함에 따라", "~로서"], "a": 1, "e": "시간"}, {"k": "ch", "q": "다음 중 as의 의미가 나머지와 다른 것은?", "o": ["As it was cold, I wore gloves.", "As I was busy, I couldn't call.", "As he was sick, he stayed home.", "Leave it as it is.", "As she was kind, everyone liked her."], "a": 3, "e": "④ 방식(있는 그대로) / 나머지 이유"}, {"k": "ch", "q": "다음 중 as가 전치사(~로서)로 쓰인 것은?", "o": ["As I said, it's easy.", "She works as a nurse.", "As we got closer, it got louder.", "As it was hot, I opened the window.", "Do as you like."], "a": 1, "e": "② as + 명사 = ~로서"}, {"k": "bl", "q": "물가가 오름에 따라 사람들은 돈을 덜 쓴다. → (As) prices go up, people spend less money.", "e": "비례"}, {"k": "bl", "q": "모두가 알고 있듯이 그는 거짓말을 하지 않는다. → (As) everyone knows, he doesn't lie.", "e": "방식(~듯이)"}, {"k": "pk", "q": "[As*/Because of] I had no money, I couldn't buy it.", "e": "주어 + 동사 → As"}, {"k": "pk", "q": "Leave the door [as*/if] it is. (있는 그대로)", "e": "방식"}, {"k": "fx", "q": "He works like a cook at a hotel. (요리사로서)", "w": "like", "a": ["as"], "e": "자격 → as"}, {"k": "ox", "q": "As I opened the window, a bird flew in.", "a": true, "e": "✔ 시간"}, {"k": "ox", "q": "As it was very cold, but I went out.", "a": false, "e": "but 삭제 또는 의미에 맞게 Although"}], "practiceB": [{"k": "wr", "q": "내가 하는 대로 해 봐. (Do, as, I do)", "a": ["Try to do as I do.", "Do as I do."], "e": "방식"}, {"k": "wr", "q": "그는 나이가 들수록 더 현명해졌다. (As, grew older, wiser)", "a": ["As he grew older, he got wiser.", "As he grew older he became wiser.", "He became wiser as he grew older.", "As he grew older, he became wiser."], "e": "비례"}, {"k": "or", "q": "그가 방에 들어왔을 때 모두가 일어섰다.", "a": "As he came into the room, everyone stood up.", "e": "시간"}, {"k": "or", "q": "비가 와서 경기가 취소되었다.", "a": "As it rained, the game was canceled.", "e": "이유"}, {"k": "fx", "q": "Because I said before, you need to practice more. (내가 전에 말했듯이)", "w": "Because", "a": ["As"], "e": "방식(~듯이) → As"}, {"k": "fx", "q": "She used the cup like a vase. (꽃병으로)", "w": "like", "a": ["as"], "e": "용도 → as"}, {"k": "ch", "q": "다음 중 as의 의미가 같은 것끼리 짝지어진 것은?\nⓐ As I was hungry, I ate a lot.\nⓑ As you know, he is honest.\nⓒ As it was late, we went home.\nⓓ As we went up, the air got thinner.", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓓ", "ⓒ, ⓓ", "ⓑ, ⓒ"], "a": 1, "e": "ⓐⓒ 이유 / ⓑ 방식 / ⓓ 비례"}, {"k": "ch", "q": "다음 문장에서 as의 의미로 알맞은 것은? As the population grows, cities get bigger.", "o": ["~ 때문에", "~할 때", "~처럼", "~함에 따라", "~로서"], "a": 3, "e": "비례"}, {"k": "bl", "q": "(As|While|When) she was walking home, she saw a rainbow. (~하고 있을 때)", "e": "시간"}, {"k": "bl", "q": "내가 설명한 대로 양식을 작성해 주세요. → Please fill out the form (as) I explained.", "e": "방식(~대로)"}]}}, {"tag": "hk2-15-5", "name": "so that / so ~ that …", "talk": [{"k": "m", "t": "모양은 비슷하지만 뜻은 다른 두 표현! 🎯"}, {"k": "m", "t": "**so that** + 주어 + can/will ~: **~하기 위해서, ~하도록** (목적) = in order to / to부정사"}, {"k": "ex", "en": "I got up early so that I could catch the first bus.", "ko": "나는 첫 버스를 타기 위해 일찍 일어났다."}, {"k": "q", "q": "Speak louder ____ everyone can hear you.", "o": ["so that", "because", "although"], "a": 0, "ok": "맞아요! 목적 → so that", "no": "모두가 들을 수 있도록(목적) → so that"}, {"k": "m", "t": "**so + 형용사/부사 + that** ~: **너무 …해서 ~하다** (결과)"}, {"k": "ex", "en": "It was so hot that we went swimming.", "ko": "너무 더워서 우리는 수영하러 갔다."}, {"k": "q", "q": "The box was ____ heavy that I couldn't lift it.", "o": ["so", "such", "too"], "a": 0, "ok": "정확해요! so + 형용사 + that", "no": "형용사 heavy 앞 → so"}, {"k": "m", "t": "**such + a(n) + 형용사 + 명사 + that** ~: 너무 …한 (명사)라서 ~ → It was such a nice day that we went out."}, {"k": "m", "t": "바꿔 쓰기 (Ch.6 복습): so ~ that + 주어 + can't = **too ~ to** / so ~ that + 주어 + can = **~ enough to**"}, {"k": "ex", "en": "He is so tall that he can touch the ceiling. = He is tall enough to touch the ceiling.", "ko": "그는 키가 아주 커서 천장에 닿을 수 있다."}, {"k": "m", "t": "정리! **so that 목적 / so + 형·부 + that 결과 / such + a + 형 + 명 + that / so ~ that can't = too ~ to** 👍"}], "notes": {"table": [["표현", "뜻", "예"], ["so that + 주어 + can", "~하기 위해서 (목적)", "I saved money so that I could buy a bike."], ["so + 형/부 + that", "너무 …해서 ~하다 (결과)", "It was so cold that the lake froze."], ["such + a(n) + 형 + 명 + that", "너무 …한 ~라서", "She is such a kind girl that everyone likes her."], ["so ~ that + 주어 + can't", "= too ~ to", "He is so young that he can't drive. = He is too young to drive."], ["so ~ that + 주어 + can", "= ~ enough to", "She is so smart that she can solve it. = She is smart enough to solve it."]], "tips": ["과거 문장이면 so that ~ could", "so + 형용사 / such + a + 형용사 + 명사", "so that = in order to (목적)"]}, "sets": {"workbook": [{"k": "pk", "q": "I saved money [so that*/even though] I could buy a bike.", "e": "목적 → so that"}, {"k": "pk", "q": "The movie was [so*/such] boring that I fell asleep.", "e": "형용사 앞 → so"}, {"k": "pk", "q": "It was [so/such*] a cold day that we stayed home.", "e": "a + 형 + 명 앞 → such"}, {"k": "pk", "q": "She ran fast so that she [could*/couldn't] catch the bus.", "e": "목적: 잡을 수 있도록 → could"}, {"k": "bl", "q": "나는 너무 피곤해서 걸을 수 없었다. → I was (so) tired (that) I couldn't walk.", "e": "so ~ that"}, {"k": "bl", "q": "그는 건강해지기 위해 매일 운동한다. → He exercises every day so (that) he can be healthy.", "e": "목적 → so that"}, {"k": "bl", "q": "그것은 너무 재미있는 책이라서 나는 밤새 읽었다. → It was (such) an interesting book that I read it all night.", "e": "such + an + 형 + 명"}, {"k": "bl", "q": "수프가 너무 뜨거워서 먹을 수 없었다. → The soup was too hot to eat. = The soup was so hot that I couldn't (eat) it.", "e": "too ~ to = so ~ that can't"}, {"k": "fx", "q": "It was such hot that I turned on the fan.", "w": "such", "a": ["so"], "e": "형용사 앞 → so"}, {"k": "fx", "q": "She is so a kind girl that everyone likes her.", "w": "so", "a": ["such"], "e": "a + 형 + 명 앞 → such"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The question was ____ difficult that nobody could answer it.", "o": ["so", "such", "very", "too", "much"], "a": 0, "e": "so + 형용사 + that"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? He is too young to drive a car.", "o": ["He is so young that he can drive a car.", "He is so young that he can't drive a car.", "He is young enough to drive a car.", "He is such young that he can't drive.", "He is so young that drive a car."], "a": 1, "e": "too ~ to = so ~ that can't"}, {"k": "ch", "q": "다음 중 so that이 '목적(~하기 위해서)'으로 쓰인 것은?", "o": ["It was so cold that the lake froze.", "I left early so that I wouldn't be late.", "She was so happy that she cried.", "It was so dark that I couldn't see.", "He spoke so fast that I missed it."], "a": 1, "e": "② so that = ~하도록 / 나머지 so ~ that(결과)"}, {"k": "bl", "q": "나는 공부하기 위해 도서관에 갔다. → I went to the library (so) that I could study.", "e": "목적 → so that"}, {"k": "bl", "q": "그날은 너무 좋은 날이어서 우리는 공원에 갔다. → It was (such) a nice day that we went to the park.", "e": "such + a + 형 + 명"}, {"k": "pk", "q": "He is so strong [that*/what] he can lift the car.", "e": "so ~ that"}, {"k": "pk", "q": "Turn off the TV so that the baby [can*/can't] sleep.", "e": "목적: 잘 수 있도록"}, {"k": "fx", "q": "The bag was so heavy that I could carry it.", "w": "could", "a": ["couldn't", "could not"], "e": "너무 무거워서 들 수 없었다 → couldn't"}, {"k": "ox", "q": "It was such a boring movie that I left early.", "a": true, "e": "✔"}, {"k": "ox", "q": "She was such tired that she went to bed early.", "a": false, "e": "형용사 앞 → so tired"}], "practiceB": [{"k": "wr", "q": "The water was so cold that we couldn't swim in it. → too ~ to를 써서 바꾸시오.", "a": ["The water was too cold to swim in.", "The water was too cold for us to swim in."], "e": "too ~ to"}, {"k": "wr", "q": "He is so rich that he can buy the house. → enough to를 써서 바꾸시오.", "a": ["He is rich enough to buy the house."], "e": "~ enough to"}, {"k": "or", "q": "나는 시험에 통과하기 위해 열심히 공부했다.", "a": "I studied hard so that I could pass the test.", "e": "목적 → so that ~ could"}, {"k": "or", "q": "그 음식은 너무 매워서 나는 그것을 먹을 수 없었다.", "a": "The food was so spicy that I couldn't eat it.", "e": "so ~ that"}, {"k": "fx", "q": "She talked such loudly that everyone looked at her.", "w": "such", "a": ["so"], "e": "부사 앞 → so"}, {"k": "fx", "q": "Close the window so that the bugs can come in.", "w": "can", "a": ["can't", "cannot", "won't"], "e": "벌레가 들어오지 못하도록 → can't"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It was so hot that I couldn't sleep.\nⓑ He was such a nice man that everyone loved him.\nⓒ I hurried so that I could catch the train.\nⓓ It was such cold that the river froze.\nⓔ She is so smart that she can solve it.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ so cold"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I woke up early so that I could see the sunrise.", "o": ["I woke up early in order to see the sunrise.", "I woke up so early that I couldn't see the sunrise.", "I woke up early, but I couldn't see the sunrise.", "I was too early to see the sunrise.", "I woke up early because I saw the sunrise."], "a": 0, "e": "so that = in order to"}, {"k": "bl", "q": "햇볕에 타지 않도록 모자를 써라. → Wear a hat so (that) you won't get sunburned.", "e": "목적 → so that"}, {"k": "bl", "q": "그 이야기는 너무 슬퍼서 나는 울었다. → The story was (so) sad that I cried.", "e": "so + 형용사 + that"}]}}, {"tag": "hk2-15-6", "name": "접속부사", "talk": [{"k": "m", "t": "마지막! 앞뒤 문장의 **논리 관계**를 보여 주는 **접속부사** 🧭"}, {"k": "m", "t": "반대: **however** 그러나 / **on the other hand** 반면에"}, {"k": "m", "t": "결과: **therefore** 그러므로 / **as a result** 그 결과"}, {"k": "m", "t": "추가: **in addition / besides / moreover** 게다가 / 예시: **for example** 예를 들어"}, {"k": "q", "q": "He studied hard. ____, he got a perfect score.", "o": ["However", "As a result", "For example"], "a": 1, "ok": "맞아요! 결과 → As a result", "no": "열심히 공부 → 그 결과 만점 → As a result"}, {"k": "m", "t": "기타: **instead** 대신에 / **in fact** 사실은 / **otherwise** 그렇지 않으면"}, {"k": "ex", "en": "Wear your seatbelt. Otherwise, you could get hurt.", "ko": "안전벨트를 매라. 그렇지 않으면 다칠 수 있다."}, {"k": "q", "q": "I wanted to buy it. ____, it was too expensive.", "o": ["However", "Therefore", "Moreover"], "a": 0, "ok": "정확해요! 반대 → However", "no": "사고 싶었다 ↔ 너무 비쌌다 → However"}, {"k": "m", "t": "⚠️ 접속부사는 **부사** → 혼자 두 문장을 잇지 못해요: ~. [However], ~ ✔ / ~, however ~ ✗ (쉼표만으로 잇기)"}, {"k": "m", "t": "🎉 Chapter 15 접속사 끝! 다음은 Chapter 16 **관계사** 🚀"}], "notes": {"table": [["관계", "접속부사", "뜻"], ["반대", "however / on the other hand", "그러나 / 반면에"], ["결과", "therefore / as a result", "그러므로 / 그 결과"], ["추가", "in addition / besides / moreover", "게다가"], ["예시", "for example / for instance", "예를 들어"], ["기타", "instead / in fact / otherwise", "대신에 / 사실은 / 그렇지 않으면"]], "tips": ["접속부사 + 쉼표(,): However, ~", "but·so는 접속사(한 문장 안), however·therefore는 부사(새 문장)", "otherwise = 그렇지 않으면 (명령문, or와 비슷)"]}, "sets": {"workbook": [{"k": "pk", "q": "It was raining. [However*/Therefore], we went hiking.", "e": "반대"}, {"k": "pk", "q": "I missed the bus. [As a result*/For example], I was late.", "e": "결과"}, {"k": "pk", "q": "This phone is cheap. [In addition*/Instead], it's very light.", "e": "추가"}, {"k": "pk", "q": "Hurry up. [Otherwise*/In fact], you'll miss the train.", "e": "그렇지 않으면"}, {"k": "bl", "q": "나는 고기를 먹지 않는다. 대신에 생선을 먹는다. → I don't eat meat. (Instead), I eat fish.", "e": "대신에"}, {"k": "bl", "q": "그는 수줍어 보인다. 사실 그는 매우 활발하다. → He looks shy. In (fact), he is very active.", "e": "사실은"}, {"k": "bl", "q": "어떤 사람들은 여름을 좋아한다. 반면에 다른 사람들은 겨울을 좋아한다. → Some people like summer. On the other (hand), others like winter.", "e": "반면에"}, {"k": "bl", "q": "많은 동물이 위험에 처해 있다. 예를 들어 호랑이가 그렇다. → Many animals are in danger. For (example), tigers are.", "e": "예를 들어"}, {"k": "fx", "q": "He was sick. However, he stayed in bed all day.", "w": "However", "a": ["Therefore", "As a result", "So"], "e": "결과 → Therefore"}, {"k": "fx", "q": "The hotel was clean. Instead, the staff were kind. (게다가)", "w": "Instead", "a": ["In addition", "Besides", "Moreover"], "e": "추가 → In addition"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Take an umbrella. ____, you'll get wet.", "o": ["Otherwise", "Therefore", "For example", "In addition", "In fact"], "a": 0, "e": "그렇지 않으면"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Tom is good at sports. ____, his brother is not.", "o": ["Therefore", "On the other hand", "For example", "Besides", "As a result"], "a": 1, "e": "반면에"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI was very tired. ____, I couldn't sleep.\nIt snowed a lot. ____, the roads were closed.", "o": ["However – As a result", "Therefore – However", "However – For example", "Instead – However", "Moreover – Therefore"], "a": 0, "e": "반대 However / 결과 As a result"}, {"k": "bl", "q": "그 식당은 음식이 맛있다. 게다가 가격도 싸다. → The restaurant has great food. (Moreover|Besides|In addition), the prices are low.", "e": "추가"}, {"k": "bl", "q": "그녀는 매일 연습했다. 그 결과, 그녀는 대회에서 우승했다. → She practiced every day. (As a result|Therefore), she won the contest.", "e": "결과"}, {"k": "pk", "q": "I didn't go to the party. [Instead*/Moreover], I stayed home and read.", "e": "대신에"}, {"k": "pk", "q": "Some fruits have a lot of vitamin C. [For example*/However], oranges do.", "e": "예시"}, {"k": "fx", "q": "Study hard. Therefore, you might fail.", "w": "Therefore", "a": ["Otherwise"], "e": "그렇지 않으면 → Otherwise"}, {"k": "ox", "q": "I like dogs. On the other hand, my sister likes cats.", "a": true, "e": "✔ 반면에"}, {"k": "ox", "q": "It was late, however we kept talking.", "a": false, "e": "It was late. However, we ~ (또는 but)"}], "practiceB": [{"k": "wr", "q": "It was cold, but we went swimming. → however를 써서 두 문장으로 쓰시오.", "a": ["It was cold. However we went swimming.", "It was cold. However, we went swimming."], "e": "however"}, {"k": "wr", "q": "I studied hard, so I passed the test. → as a result를 써서 두 문장으로 쓰시오.", "a": ["I studied hard. As a result I passed the test.", "I studied hard. As a result, I passed the test."], "e": "as a result"}, {"k": "or", "q": "서둘러라. 그렇지 않으면 늦을 것이다.", "a": "Hurry up. Otherwise, you will be late.", "e": "otherwise"}, {"k": "or", "q": "그는 부자처럼 보인다. 사실, 그는 돈이 많지 않다.", "a": "He looks rich. In fact, he doesn't have much money.", "e": "in fact"}, {"k": "fx", "q": "She was hungry. Otherwise, she ate a big lunch.", "w": "Otherwise", "a": ["Therefore", "As a result", "So"], "e": "결과 → Therefore"}, {"k": "fx", "q": "The test was easy. Moreover, many students failed.", "w": "Moreover", "a": ["However"], "e": "반대 → However"}, {"k": "ch", "q": "어법상·의미상 옳은 것의 개수는?\nⓐ I was sick. Therefore, I stayed home.\nⓑ Leave now. Otherwise, you'll be late.\nⓒ He is smart. Moreover, he is kind.\nⓓ It rained. However, the game was canceled.\nⓔ I didn't take a taxi. Instead, I walked.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ As a result"}, {"k": "ch", "q": "빈칸에 알맞은 것은? My town has many good places. ____, there is a big park and a library.", "o": ["For example", "However", "Otherwise", "Instead", "On the other hand"], "a": 0, "e": "예시"}, {"k": "bl", "q": "너에게 전화하고 싶었어. 하지만 휴대폰을 잃어버렸어. → I wanted to call you. (However), I lost my phone.", "e": "반대"}, {"k": "bl", "q": "선크림을 발라라. 그렇지 않으면 햇볕에 탈 것이다. → Put on sunscreen. (Otherwise), you'll get sunburned.", "e": "그렇지 않으면"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그도 나도 그 사실을 알지 못했다. (Neither, nor, knew the fact)", "a": ["Neither he nor I knew the fact."], "e": "neither A nor B"}, {"k": "wr", "q": "나는 그녀가 파티에 올지 궁금하다. (wonder, if, will come)", "a": ["I wonder whether she will come to the party.", "I wonder if she will come to the party."], "e": "명사절 if → will 그대로"}, {"k": "wr", "q": "그가 그 경기에서 이겼다는 것은 놀랍다. (It, surprising, that, won the game)", "a": ["It's surprising that he won the game.", "It is surprising that he won the game."], "e": "가주어 It + that절"}, {"k": "wr", "q": "비록 피곤했지만 나는 숙제를 끝냈다. (Although, finished my homework)", "a": ["Although I was tired I finished my homework.", "I finished my homework although I was tired.", "Although I was tired, I finished my homework."], "e": "although"}, {"k": "wr", "q": "그 상자는 너무 무거워서 나는 그것을 들 수 없었다. (so, that, lift)", "a": ["The box was so heavy that I could not lift it.", "The box was so heavy that I couldn't lift it."], "e": "so ~ that"}, {"k": "bl", "q": "(Unless) you leave now, you'll miss the train. (지금 떠나지 않으면)", "e": "unless = if ~ not"}, {"k": "bl", "q": "너뿐만 아니라 그도 틀렸다. → Not only you but also he (is) wrong.", "e": "B(he)에 일치"}, {"k": "fx", "q": "Despite it was raining, we played soccer.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "주어 + 동사 → Although"}, {"k": "fx", "q": "I'll call you as soon as I will arrive.", "w": "will", "a": ["(삭제)"], "e": "시간절 → as soon as I arrive"}, {"k": "or", "q": "그는 버스를 타기 위해 뛰었다.", "a": "He ran so that he could catch the bus.", "e": "목적 → so that"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? Both Mina and her sister ____ good at singing.", "o": ["is", "are", "was", "has", "be"], "a": 1, "e": "both A and B → 복수"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I don't know ____ he will come or not.", "o": ["that", "whether", "because", "unless", "so"], "a": 1, "e": "~인지 아닌지 → whether"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If you don't exercise, you will gain weight.", "o": ["Unless you exercise, you will gain weight.", "Unless you don't exercise, you will gain weight.", "If you exercise, you will gain weight.", "Exercise, and you will gain weight.", "Because you exercise, you gain weight."], "a": 0, "e": "if ~ not = unless"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ the heavy rain, the festival was held.", "o": ["Although", "Though", "Despite", "Because", "Unless"], "a": 2, "e": "명사구 앞 → Despite"}, {"k": "ch", "q": "다음 중 as의 의미가 나머지와 다른 것은?", "o": ["As it was cold, I wore a coat.", "As I had no time, I took a taxi.", "As she was sick, she stayed home.", "As we climbed higher, it got colder.", "As he was hungry, he ate quickly."], "a": 3, "e": "④ 비례(~함에 따라) / 나머지 이유"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? He was so weak that he couldn't walk.", "o": ["He was too weak to walk.", "He was weak enough to walk.", "He was so weak to walk.", "He was too weak that he couldn't walk.", "He was such weak that he couldn't walk."], "a": 0, "e": "so ~ that can't = too ~ to"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI was late ____ the traffic jam.\nI was late ____ I missed the bus.", "o": ["because of – because", "because – because of", "despite – although", "although – despite", "because of – despite"], "a": 0, "e": "명사 앞 because of / 주어 + 동사 앞 because"}, {"k": "ch", "q": "다음 중 that의 쓰임이 나머지와 다른 것은?", "o": ["I think that you are right.", "It is true that he moved.", "She said that she was busy.", "The problem is that we're lost.", "That is my favorite song."], "a": 4, "e": "⑤ 지시대명사 / 나머지 접속사"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I'll wait here until you come back.", "When he arrives, call me.", "I wonder if she will like it.", "If it will snow tomorrow, we'll make a snowman.", "Unless you hurry, you'll be late."], "a": 3, "e": "④ If it snows"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The test was very hard. ____, everyone passed it.", "o": ["Therefore", "However", "For example", "As a result", "Moreover"], "a": 1, "e": "반대 → However"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Neither you nor he is wrong.\nⓑ Whether he comes or not doesn't matter.\nⓒ Although it was hot, but we played outside.\nⓓ It was such a hot day that we went swimming.\nⓔ She as well as her friends are happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ but 삭제 / ⓔ is"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Both he and she are from Busan.", true], ["Either you or Tom have to go.", false], ["I think that he is honest.", true], ["If he is at home is not clear.", false], ["I'll call you when I get there.", true], ["She has lived here since she was a child.", true], ["Because of it was cold, I stayed home.", false], ["Unless you hurry, you'll miss it.", true], ["Although it rained, but we went out.", false], ["Do as I told you.", true], ["It was so hot that I couldn't sleep.", true], ["I was tired. However, I finished it.", true]], "e": "ⓑ has ⓓ Whether ⓖ Because ⓘ but 삭제"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["He is not only smart but also kind.", true], ["Neither she nor I am hungry.", true], ["It is clear that he lied.", true], ["I wonder whether it will rain tomorrow.", true], ["Wait here until I will come back.", false], ["As soon as he saw me, he ran away.", true], ["Despite the rain, the game went on.", true], ["Unless you don't hurry, you'll be late.", false], ["It was such a nice day that we went out.", true], ["The bag was such heavy that I couldn't carry it.", false], ["Study hard. Otherwise, you'll fail.", true], ["The students as well as the teacher was excited.", false]], "e": "ⓔ until I come ⓗ Unless you hurry ⓙ so heavy ⓛ were"}, {"k": "wr", "q": "If you don't study hard, you'll fail the test. → unless를 써서 바꾸시오.", "a": ["Unless you study hard, you'll fail the test.", "Unless you study hard you will fail the test.", "You will fail the test unless you study hard.", "Unless you study hard, you will fail the test."], "e": "if ~ not = unless"}, {"k": "wr", "q": "그녀는 의사가 아니라 간호사이다. (not A but B)", "a": ["She is not a doctor but a nurse."], "e": "not A but B"}]}}, {"book": "hk2", "chapter": {"id": "16", "name": "관계사", "title": "해커스 중학영문법 2학년 · Chapter 16 관계사"}, "units": [{"tag": "hk2-16-1", "name": "관계대명사의 역할과 종류", "talk": [{"k": "m", "t": "Chapter 16은 **관계사**! 두 문장을 하나로 묶어 주는 말이에요 🔗"}, {"k": "m", "t": "I have a friend. + **She** lives in Busan. → I have a friend **who** lives in Busan."}, {"k": "m", "t": "관계대명사 = **접속사 + 대명사** 역할! 앞에 있는 명사(**선행사**)를 뒤에서 꾸며 줘요"}, {"k": "ex", "en": "I have a friend who lives in Busan.", "ko": "나는 부산에 사는 친구가 한 명 있다."}, {"k": "m", "t": "선행사가 **사람** → who / **사물·동물** → [which] / 둘 다 → that"}, {"k": "q", "q": "This is the bag ____ my mom bought.", "o": ["who", "which", "whose"], "a": 1, "ok": "맞아요! 사물(bag) → which", "no": "선행사 bag은 사물 → which"}, {"k": "m", "t": "격에 따라: 주격 who·which / 목적격 whom·which / 소유격 [whose]"}, {"k": "q", "q": "다음 문장의 선행사는? The man who is talking to Mina is my uncle.", "o": ["The man", "Mina", "my uncle"], "a": 0, "ok": "정확해요! who가 꾸미는 명사 = The man", "no": "who 바로 앞의 명사 The man이 선행사"}, {"k": "m", "t": "⚠️ 관계대명사가 대명사 역할을 하므로 뒤에 he·it을 **또 쓰지 않아요**: a friend who she lives … ✗"}, {"k": "m", "t": "정리! **관계대명사 = 접속사 + 대명사 / 사람 who · 사물 which · 둘 다 that** 👍"}], "notes": {"table": [["선행사", "주격", "목적격", "소유격"], ["사람", "who", "whom (who)", "whose"], ["사물·동물", "which", "which", "whose"], ["사람·사물·동물", "that", "that", "—"]], "tips": ["관계사절은 선행사(명사)를 뒤에서 꾸미는 형용사절", "관계대명사가 대명사 역할 → 절 안에 he·it 등을 다시 쓰지 않음"]}, "sets": {"workbook": [{"k": "pk", "q": "I have a friend [who*/which] lives in Busan.", "e": "사람 → who"}, {"k": "pk", "q": "This is the book [who/which*] I bought yesterday.", "e": "사물 → which"}, {"k": "pk", "q": "Look at the dog [which*/who] is running.", "e": "동물 → which"}, {"k": "pk", "q": "She is the teacher [who*/which] teaches us music.", "e": "사람 → who"}, {"k": "bl", "q": "나는 영어를 잘하는 소녀를 안다. → I know a girl (who|that) speaks English well.", "e": "사람 → who / that"}, {"k": "bl", "q": "이것은 내가 좋아하는 노래이다. → This is the song (which|that) I like.", "e": "사물 → which / that"}, {"k": "ch", "q": "다음 문장에서 who의 선행사는?\nThe man who is talking to Mina is my uncle.", "o": ["The man", "Mina", "my uncle", "talking", "is"], "a": 0, "e": "who 바로 앞 명사 The man"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 연결한 것은?\nI have a cat. + It has blue eyes.", "o": ["I have a cat which has blue eyes.", "I have a cat which it has blue eyes.", "I have a cat it has blue eyes.", "I have a cat and which has blue eyes.", "I have a cat whose has blue eyes."], "a": 0, "e": "It → which (it을 또 쓰지 않음)"}, {"k": "fx", "q": "The boy which won the race is my brother.", "w": "which", "a": ["who", "that"], "e": "사람 → who / that"}, {"k": "fx", "q": "This is the bag who my mom bought for me.", "w": "who", "a": ["which", "that"], "e": "사물 → which / that"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 관계대명사가 나머지와 다른 것은? (that 제외)", "o": ["I met a woman ____ is a doctor.", "The house ____ has a red roof is mine.", "He is the singer ____ sang this song.", "Do you know the boy ____ is standing there?", "I have an aunt ____ lives in Canada."], "a": 1, "e": "② house(사물) → which / 나머지 사람 → who"}, {"k": "ch", "q": "관계대명사의 쓰임이 바르지 않은 것은?", "o": ["the girl who sings", "the car which is red", "the people who live here", "the movie who I saw", "the tree that is tall"], "a": 3, "e": "④ movie(사물) → which"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nThe woman is my aunt. + She is wearing a hat.", "o": ["The woman who is wearing a hat is my aunt.", "The woman is wearing a hat who is my aunt.", "The woman who she is wearing a hat is my aunt.", "The woman which is wearing a hat is my aunt.", "The woman is my aunt who she is wearing a hat."], "a": 0, "e": "선행사 The woman 바로 뒤에 who절"}, {"k": "bl", "q": "나는 프랑스에서 온 친구가 있다. → I have a friend (who|that) comes from France.", "e": "사람"}, {"k": "bl", "q": "그는 바퀴가 세 개인 자전거를 샀다. → He bought a bike (which|that) has three wheels.", "e": "사물"}, {"k": "pk", "q": "The students [who*/which] passed the test were happy.", "e": "사람"}, {"k": "pk", "q": "I like stories [which*/who] have happy endings.", "e": "사물"}, {"k": "fx", "q": "I know a man who he can speak five languages.", "w": "he", "a": ["(삭제)"], "e": "who가 대명사 역할 → he 빼기"}, {"k": "ox", "q": "The cake which my sister made was delicious.", "a": true, "e": "✔ 사물 → which"}, {"k": "ox", "q": "Do you know the girl which is singing on the stage?", "a": false, "e": "girl(사람) → who"}], "practiceB": [{"k": "or", "q": "나는 피아노를 잘 치는 소년을 안다.", "a": "I know a boy who plays the piano well.", "e": "who"}, {"k": "or", "q": "이것은 나를 행복하게 만드는 노래이다.", "a": "This is a song which makes me happy.", "e": "which"}, {"k": "wr", "q": "The girl is my sister. + She is reading a book. → 관계대명사를 써서 한 문장으로", "a": ["The girl who is reading a book is my sister.", "The girl that is reading a book is my sister."], "e": "She → who"}, {"k": "wr", "q": "I bought a phone. + It was very cheap. → 관계대명사를 써서 한 문장으로", "a": ["I bought a phone which was very cheap.", "I bought a phone that was very cheap."], "e": "It → which"}, {"k": "wr", "q": "나는 중국어를 가르치는 선생님을 만났다. (met, a teacher, teaches Chinese)", "a": ["I met a teacher who teaches Chinese.", "I met a teacher that teaches Chinese."], "e": "who"}, {"k": "fx", "q": "The movie who we watched last night was boring.", "w": "who", "a": ["which", "that"], "e": "사물 → which / that"}, {"k": "fx", "q": "The man which lives next door is a firefighter.", "w": "which", "a": ["who", "that"], "e": "사람 → who / that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have a dog which is very smart.\nⓑ The boy who is tall is Jun.\nⓒ This is the pen who I lost.\nⓓ She is a singer who sings very well.\nⓔ The book which it is on the desk is mine.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ which / ⓔ it 빼기"}, {"k": "bl", "q": "의자 위에 있는 가방은 내 것이다. → The bag (which|that) is on the chair is mine.", "e": "사물"}, {"k": "bl", "q": "이 마을에 사는 사람들은 친절하다. → People (who|that) live in this town are kind.", "e": "사람"}]}}, {"tag": "hk2-16-2-1", "name": "주격 관계대명사", "talk": [{"k": "m", "t": "**주격 관계대명사**는 관계사절에서 **주어** 역할! 바로 뒤에 **동사**가 와요 🏃"}, {"k": "m", "t": "사람 → **who** / 사물·동물 → **which** / 둘 다 → **that**"}, {"k": "ex", "en": "I have a cousin who works at a hospital.", "ko": "나는 병원에서 일하는 사촌이 있다."}, {"k": "ex", "e the girl and her dog ____ are running.", "o": ["who", "which", "that", "what", "whose"], "a": 2, "e": "최상급 / 사람 + 동물 → that"}, {"k": "ch", "q": "빈칸에 what이 들어갈 수 있는 것은?", "o": ["This is the bag ____ I want.", "____ I want is a bag.", "I know a boy ____ likes bags.", "The bag ____ is red is mine.", "He is the man ____ bag is big."], "a": 1, "e": "② 선행사 없음"}, {"k": "ch", "q": "관계대명사를 생략할 수 없는 것은?", "o": ["The cap which I lost was new.", "The man whom I called is Ken.", "The girl who lives here is Ana.", "The song that I sang was old.", "The boy whom you met is Leo."], "a": 2, "e": "③ 주격 혼자 생략 ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The man with whom I work is kind.", "The house in which I live is small.", "The girl to who I gave a gift is Mia.", "The pen which I write with is blue.", "The topic about which we talked was fun."], "a": 2, "e": "③ to whom"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThis is the hospital ____ I was born.\nI remember the day ____ I was born.", "o": ["when – where", "where – when", "which – when", "where – which", "why – when"], "a": 1, "e": "장소 where / 시간 when"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? This is the school in which my mom works.", "o": ["This is the school which my mom works.", "This is the school where my mom works.", "This is the school when my mom works.", "This is the school what my mom works.", "This is the school in that my mom works."], "a": 1, "e": "in which = where"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The boy who is singing is Max.\nⓑ This is the cake what I made.\nⓒ I have a friend whose dad is a cook.\nⓓ The pictures which he took is nice.\nⓔ This is how I solved it.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ that / ⓓ are"}, {"k": "ch", "q": "that의 쓰임이 나머지와 다른 것은? (문장마다 that은 하나)", "o": ["The cat that I have is gray.", "I know that she is right.", "The man that called me is Jay.", "This is the best book that I've read.", "The boy that I like is shy."], "a": 1, "e": "② 접속사 that"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은?\nI met a woman. + Her son is a famous actor.", "o": ["I met a woman who son is a famous actor.", "I met a woman whose son is a famous actor.", "I met a woman whose her son is a famous actor.", "I met a woman which son is a famous actor.", "I met a woman that son is a famous actor."], "a": 1, "e": "Her → whose"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The girl who lives next door is Hana.", true], ["This is the book which I bought it.", false], ["I have a dog whose ears are long.", true], ["What I need is a long rest.", true], ["The boys who is playing soccer are my friends.", false], ["This is the house where I was born.", true], ["The man to whom I spoke was polite.", true], ["Tell me the reason when you left.", false], ["The pen I lost was a gift.", true], ["He is the first man that walked on the moon.", true], ["This is the way how I cook rice.", false], ["Look at the boy dancing on the stage.", true]], "e": "ⓑ it 빼기 ⓔ are ⓗ why ⓚ how 또는 the way 하나만"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The cake which my mom made was sweet.", true], ["The man lives upstairs is a doctor.", false], ["I saw a man and his dog that were walking.", true], ["This is the room in that I study.", false], ["Do you know the girl whose hat is red?", true], ["That I want is a new bike.", false], ["This is the café where we met.", true], ["This is the museum where we visited last year.", false], ["The letter written in English is from Tom.", true], ["She is the girl whom I met in Paris.", true], ["I don't know the reason why he is upset.", true], ["The students who studies hard will pass.", false]], "e": "ⓑ who lives ⓓ in which ⓕ What ⓗ which / that ⓛ study"}, {"k": "wr", "q": "This is the café. + We first met at the café. → 관계부사를 써서", "a": ["This is the café where we first met.", "This is the cafe where we first met."], "e": "at the café → where"}, {"k": "wr", "q": "'그가 나에게 말한 것은 사실이었다.'를 영어로 쓰시오. (what, told me, true)", "a": ["What he told me was true."], "e": "what"}]}}, {"book": "hk2", "chapter": {"id": "17", "name": "가정법", "title": "해커스 중학영문법 2학년 · Chapter 17 가정법"}, "units": [{"tag": "hk2-17-1-1", "name": "가정법 과거", "talk": [{"k": "m", "t": "Chapter 17은 **가정법**! 사실과 **반대**되는 상상을 말할 때 써요 💭"}, {"k": "m", "t": "**가정법 과거**: 지금(현재) 사실의 반대 → 'If + 주어 + **동사 과거형**, 주어 + **would/could/might + 동사원형**'"}, {"k": "ex", "en": "If I had money, I would buy a new bike.", "ko": "내가 돈이 있다면 새 자전거를 살 텐데. (지금 돈이 없음)"}, {"k": "m", "t": "형태는 **과거**지만 뜻은 **현재**! be동사는 주어와 상관없이 [were]"}, {"k": "ex", "en": "If I were a bird, I could fly to you.", "ko": "내가 새라면 너에게 날아갈 수 있을 텐데."}, {"k": "q", "q": "If I ____ you, I would tell the truth.", "o": ["am", "were", "will be"], "a": 1, "ok": "맞아요! 가정법 과거 be동사 → were", "no": "현재 사실의 반대 → If I were"}, {"k": "m", "t": "⚠️ 단순 조건(실제로 일어날 수 있는 일)은 그대로: If it **rains** tomorrow, I **will** stay home."}, {"k": "q", "q": "If he studied harder, he ____ pass the test.", "o": ["will", "would", "can"], "a": 1, "ok": "정확해요! 가정법 과거 → would + 동사원형", "no": "If절이 과거형(studied) → 주절 would"}, {"k": "m", "t": "직설법으로 바꾸면 **긍정 ↔ 부정, 시제는 현재**: If I were rich, I could buy it. = As I **am not** rich, I **can't** buy it."}, {"k": "m", "t": "정리! **If + 과거형(were), would/could + 동사원형 = 현재 사실 반대** 👍"}], "notes": {"table": [["종류", "형태", "뜻"], ["단순 조건", "If + 현재, will + 동사원형", "~하면 …할 것이다 (일어날 수 있음)"], ["가정법 과거", "If + 과거형(were), would/could/might + 동사원형", "~라면 …할 텐데 (현재 사실 반대)"], ["직설법 전환", "As + 주어 + 현재(부정), 주어 + can't/won't …", "As I am not rich, I can't buy it."]], "tips": ["가정법 과거의 be동사는 인칭과 상관없이 were", "직설법 ↔ 가정법: 긍정 ↔ 부정을 바꾸고, 시제를 한 단계 옮김"]}, "sets": {"workbook": [{"k": "pk", "q": "If I [were*/am] a bird, I could fly to you.", "e": "현재 반대 → were"}, {"k": "pk", "q": "If I had money, I [would*/will] buy a new bike.", "e": "가정법 과거 → would"}, {"k": "pk", "q": "If she [knew*/knows] the answer, she would tell us.", "e": "과거형 knew"}, {"k": "pk", "q": "If it [rains*/rained] tomorrow, I will stay home.", "e": "단순 조건 → 현재형"}, {"k": "bl", "q": "내가 너라면, 그것을 하지 않을 텐데. → If I (were) you, I (would) not do that.", "e": "were / would"}, {"k": "bl", "q": "그가 여기 있다면 우리를 도울 수 있을 텐데. → If he (were) here, he (could) help us.", "e": "were / could"}, {"k": "bl", "q": "내가 시간이 있다면, 너와 영화를 보러 갈 텐데. → If I (had) time, I would go to the movies with you.", "e": "과거형 had"}, {"k": "bl", "q": "내가 키가 크다면 선반에 손이 닿을 텐데. → As I am not tall, I can't reach the shelf. = If I (were) tall, I (could) reach the shelf.", "e": "부정 → 긍정"}, {"k": "fx", "q": "If I have wings, I would fly in the sky.", "w": "have", "a": ["had"], "e": "가정법 과거 → had"}, {"k": "fx", "q": "If he studied harder, he will pass the test.", "w": "will", "a": ["would", "could"], "e": "가정법 과거 → would"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? If I ____ rich, I would travel around the world.", "o": ["am", "be", "were", "will be", "have been"], "a": 2, "e": "were"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If you lived near here, we ____ meet more often.", "o": ["will", "can", "could", "may", "are"], "a": 2, "e": "가정법 과거 → could"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If I knew her number, I could call her.", "o": ["As I know her number, I can call her.", "As I don't know her number, I can't call her.", "As I didn't know her number, I couldn't call her.", "If I know her number, I can call her.", "Though I know her number, I can't call her."], "a": 1, "e": "현재 사실의 반대 → 현재 부정"}, {"k": "bl", "q": "내가 차가 있다면 너를 태워 줄 텐데. → If I (had) a car, I (would|could) give you a ride.", "e": "had / would"}, {"k": "bl", "q": "비가 오지 않는다면 우리는 밖에서 놀 수 있을 텐데. → As it is raining, we can't play outside. = If it (were not|weren't) raining, we (could) play outside.", "e": "긍정 → 부정"}, {"k": "pk", "q": "If I [were*/am] you, I would tell the truth.", "e": "were"}, {"k": "pk", "q": "If she had more time, she [could*/can] learn to swim.", "e": "could"}, {"k": "fx", "q": "If I am a superhero, I would save the world.", "w": "am", "a": ["were"], "e": "가정법 과거 → were"}, {"k": "ox", "q": "If I were a cat, I would sleep all day.", "a": true, "e": "✔"}, {"k": "ox", "q": "If he has a lot of money, he would buy a house.", "a": false, "e": "had"}], "practiceB": [{"k": "or", "q": "내가 너라면 그에게 사과할 텐데.", "a": "If I were you, I would apologize to him.", "e": "가정법 과거"}, {"k": "or", "q": "날씨가 좋다면 우리는 소풍을 갈 텐데.", "a": "If the weather were nice, we would go on a picnic.", "e": "가정법 과거"}, {"k": "wr", "q": "As I don't have a pet, I feel lonely. → 가정법 과거로", "a": ["If I had a pet, I would not feel lonely.", "If I had a pet, I wouldn't feel lonely.", "If I had a pet I would not feel lonely.", "If I had a pet I wouldn't feel lonely."], "e": "긍정 ↔ 부정"}, {"k": "wr", "q": "As he is busy, he can't come to the party. → 가정법 과거로", "a": ["If he were not busy, he could come to the party.", "If he weren't busy, he could come to the party.", "If he were not busy he could come to the party.", "If he weren't busy he could come to the party."], "e": "긍정 ↔ 부정"}, {"k": "wr", "q": "내가 새라면 너에게 날아갈 텐데. (a bird, fly to you)", "a": ["If I were a bird, I would fly to you.", "If I were a bird, I could fly to you.", "If I were a bird I would fly to you.", "If I were a bird I could fly to you."], "e": "were"}, {"k": "fx", "q": "If I knew the answer, I will tell you.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "fx", "q": "If she lives in Seoul, she could visit us often.", "w": "lives", "a": ["lived"], "e": "가정법 과거 → lived"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I were you, I would wait.\nⓑ If he had a car, he will drive.\nⓒ If it snows tomorrow, we will ski.\nⓓ If I am rich, I would buy a boat.\nⓔ If she knew it, she could help.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ would / ⓓ were"}, {"k": "ch", "q": "다음 문장을 가정법으로 바르게 바꾼 것은? As I am sick, I can't go to school.", "o": ["If I were sick, I could go to school.", "If I were not sick, I could go to school.", "If I am not sick, I can go to school.", "If I had not been sick, I could have gone to school.", "If I were not sick, I can go to school."], "a": 1, "e": "긍정 ↔ 부정, 현재 → 과거형"}, {"k": "bl", "q": "내가 키가 더 크다면 농구를 더 잘할 수 있을 텐데. → If I (were) taller, I could play basketball better.", "e": "were"}]}}, {"tag": "hk2-17-1-2", "name": "가정법 과거완료", "talk": [{"k": "m", "t": "**가정법 과거완료**: **과거** 사실의 반대! '~했더라면 …했을 텐데' ⏪"}, {"k": "m", "t": "형태: If + 주어 + **had p.p.**, 주어 + **would/could/might + have p.p.**"}, {"k": "ex", "en": "If I had known the truth, I would have told you.", "ko": "내가 사실을 알았더라면 너에게 말했을 텐데. (그때 몰랐음)"}, {"k": "q", "q": "If she ____ harder, she would have passed the exam.", "o": ["studied", "had studied", "has studied"], "a": 1, "ok": "맞아요! 과거 반대 → had studied", "no": "주절이 would have passed → If절 had p.p."}, {"k": "m", "t": "주절도 꼭 **have p.p.**: would [have] told / could have caught"}, {"k": "q", "q": "If you had left earlier, you ____ the bus.", "o": ["could catch", "could have caught", "can catch"], "a": 1, "ok": "정확해요! could + have p.p.", "no": "가정법 과거완료 주절 → could have caught"}, {"k": "m", "t": "직설법으로 바꾸면 **긍정 ↔ 부정, 시제는 과거**: If I had studied, I would have passed. = As I **didn't study**, I **didn't pass**."}, {"k": "m", "t": "⚠️ 가정법 과거(지금 반대, 과거형) vs 가정법 과거완료(그때 반대, had p.p.) — **now / then, yesterday**를 보고 고르기!"}, {"k": "m", "t": "정리! **If + had p.p., would/could + have p.p. = 과거 사실 반대** 👍"}], "notes": {"table": [["종류", "If절", "주절", "뜻"], ["가정법 과거", "과거형 (were)", "would / could + 동사원형", "현재 사실 반대"], ["가정법 과거완료", "had p.p.", "would / could + have p.p.", "과거 사실 반대"]], "tips": ["직설법 전환: As + 과거(긍정 ↔ 부정), 주어 + 과거 …", "have 뒤는 반드시 과거분사 (would have make ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "If I had known the truth, I [would have told*/will tell] you.", "e": "would have p.p."}, {"k": "pk", "q": "If she [had studied*/has studied] harder, she would have passed the exam.", "e": "had p.p."}, {"k": "pk", "q": "If you had left earlier, you [could have caught*/can catch] the bus.", "e": "could have p.p."}, {"k": "pk", "q": "If it [had 치 ~인 것처럼'"}, {"k": "ex", "en": "He talks as if he were rich.", "ko": "그는 마치 부자인 것처럼 말한다. (사실은 부자가 아님)"}, {"k": "m", "t": "**as if + had p.p.**: 주절보다 **앞선 때**의 사실 반대 '마치 ~였던 것처럼'"}, {"k": "ex", "en": "She talks as if she had seen a UFO.", "ko": "그녀는 마치 UFO를 봤던 것처럼 말한다. (사실은 보지 않았음)"}, {"k": "q", "q": "He acts as if he ____ the boss. (사실은 사장이 아님)", "o": ["is", "were", "had"], "a": 1, "ok": "맞아요! 같은 때 반대 → were", "no": "지금 사실의 반대 → as if + were"}, {"k": "m", "t": "직설법: He talks as if he were rich. = In fact, he **is not** rich. / He talks as if he had been rich. = In fact, he **was not** rich."}, {"k": "q", "q": "She talks as if she had won the game. 의 뜻은?", "o": ["In fact, she won the game.", "In fact, she didn't win the game.", "In fact, she doesn't win the game."], "a": 1, "ok": "정확해요! had p.p. → 과거 사실 반대", "no": "as if + had p.p. → 과거 부정: didn't win"}, {"k": "m", "t": "🎉 Chapter 17 가정법 끝! **If / I wish / as if + 과거형(지금 반대) · had p.p.(과거 반대)** 👍"}], "notes": {"table": [["형태", "뜻", "직설법 (In fact, …)"], ["as if + 과거형 (were)", "마치 ~인 것처럼 (같은 때 반대)", "He talks as if he were rich. → he is not rich."], ["as if + had p.p.", "마치 ~였던 것처럼 (앞선 때 반대)", "He talks as if he had been rich. → he was not rich."]], "tips": ["as though도 같은 뜻", "In fact로 바꿀 때 긍정 ↔ 부정, 과거형 → 현재 / had p.p. → 과거"]}, "sets": {"workbook": [{"k": "pk", "q": "He talks as if he [were*/is] a king. (사실은 왕이 아님)", "e": "같은 때 반대 → were"}, {"k": "pk", "q": "She acts as if she [knew*/knows] everything. (사실은 모름)", "e": "knew"}, {"k": "pk", "q": "He talks as if he [had seen*/sees] the accident. (사실은 보지 않았음)", "e": "과거 반대 → had seen"}, {"k": "pk", "q": "Mina talks as if she [had been*/were] to Paris before. (사실은 가 본 적 없음)", "e": "had been to"}, {"k": "bl", "q": "그는 마치 부자인 것처럼 말한다. → He talks as (if) he (were) rich.", "e": "as if + were"}, {"k": "bl", "q": "그녀는 마치 나를 모르는 것처럼 행동한다. → She acts as if she (didn't|did not) know me.", "e": "과거형 부정"}, {"k": "bl", "q": "In fact, he is not a doctor. → He acts as if he (were) a doctor.", "e": "현재 부정 → were"}, {"k": "bl", "q": "In fact, she didn't win the game. → She talks as if she (had) (won) the game.", "e": "과거 부정 → had won"}, {"k": "fx", "q": "He speaks as if he is an expert, but he isn't.", "w": "is", "a": ["were"], "e": "사실 반대 → were"}, {"k": "fx", "q": "She talks as if she has met the president. (사실은 만난 적 없음)", "w": "has", "a": ["had"], "e": "had met"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? He talks as if he ____ my father. (사실은 아빠가 아님)", "o": ["is", "be", "were", "has been", "will be"], "a": 2, "e": "were"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? She talks as if she were a movie star.", "o": ["In fact, she is a movie star.", "In fact, she is not a movie star.", "In fact, she was not a movie star.", "In fact, she was a movie star.", "In fact, she will be a movie star."], "a": 1, "e": "were → 현재 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? He talks as if he had lived in London.", "o": ["In fact, he lives in London.", "In fact, he doesn't live in London.", "In fact, he didn't live in London.", "In fact, he lived in London.", "In fact, he will live in London."], "a": 2, "e": "had p.p. → 과거 부정"}, {"k": "bl", "q": "그는 마치 모든 것을 아는 것처럼 말한다. → He talks as if he (knew) everything.", "e": "knew"}, {"k": "bl", "q": "In fact, I am not a child. → My mom treats me as if I (were) a child.", "e": "were"}, {"k": "pk", "q": "He looks as if he [hadn't slept*/doesn't sleep] at all last night.", "e": "last night → had p.p."}, {"k": "pk", "q": "She talks as if she [were*/had been] my teacher now.", "e": "now → were"}, {"k": "fx", "q": "He acts as if he owns the house. (사실은 소유하지 않음)", "w": "owns", "a": ["owned"], "e": "사실 반대 → 과거형"}, {"k": "ox", "q": "He talks as if he were a genius. = In fact, he is not a genius.", "a": true, "e": "✔"}, {"k": "ox", "q": "She acts as if she had seen me. = In fact, she doesn't see me.", "a": false, "e": "didn't see"}], "practiceB": [{"k": "or", "q": "그는 마치 그가 왕인 것처럼 행동한다.", "a": "He acts as if he were a king.", "e": "as if + were"}, {"k": "or", "q": "그녀는 마치 그 영화를 봤던 것처럼 말한다.", "a": "She talks as if she had seen the movie.", "e": "as if + had p.p."}, {"k": "wr", "q": "In fact, he is not my boss. → as if를 써서 'He acts …'로", "a": ["He acts as if he were my boss.", "He acts as though he were my boss."], "e": "were"}, {"k": "wr", "q": "In fact, she didn't know the answer. → as if를 써서 'She talks …'로", "a": ["She talks as if she had known the answer.", "She talks as though she had known the answer."], "e": "had known"}, {"k": "wr", "q": "그는 마치 아픈 것처럼 보인다. (사실은 아프지 않음) (looks, as if, sick)", "a": ["He looks as if he were sick.", "He looks as though he were sick."], "e": "were"}, {"k": "fx", "q": "She talks as if she lives in New York last year.", "w": "lives", "a": ["had lived"], "e": "last year → had lived"}, {"k": "fx", "q": "He acts as if he has a lot of money. (사실은 돈이 없음)", "w": "has", "a": ["had"], "e": "사실 반대 → had"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He talks as if he were a teacher.\nⓑ She acts as if she knows me. (사실은 모름)\nⓒ He looks as if he had been sick last week.\nⓓ I wish I were a bird.\nⓔ She talks as if she has seen a UFO. (사실은 못 봤음)", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ knew / ⓔ had seen"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIn fact, he isn't rich. → He talks as if he ____ rich.\nIn fact, he wasn't rich. → He talks as if he ____ rich.", "o": ["were – were", "had been – were", "were – had been", "is – was", "is – had been"], "a": 2, "e": "현재 → were / 과거 → had been"}, {"k": "bl", "q": "그녀는 마치 밤새 울었던 것처럼 보였다. → She looked as if she (had) (cried) all night.", "e": "주절보다 앞선 일 → had cried"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "내가 너라면 그 일을 하지 않을 텐데. (If I were you, wouldn't do it)", "a": ["If I were you, I wouldn't do it.", "If I were you, I would not do it.", "If I were you I would not do it.", "If I were you I wouldn't do it.", "I wouldn't do it if I were you.", "I would not do it if I were you."], "e": "가정법 과거"}, {"k": "wr", "q": "As I don't have time, I can't help you. → 가정법 과거로", "a": ["If I had time, I could help you.", "If I had time I could help you."], "e": "긍정 ↔ 부정"}, {"k": "wr", "q": "As I didn't know the answer, I didn't raise my hand. → 가정법 과거완료로", "a": ["If I had known the answer, I would have raised my hand.", "If I had known the answer I would have raised my hand."], "e": "had p.p. / would have p.p."}, {"k": "wr", "q": "I'm sorry that I can't play the piano. → I wish로", "a": ["I wish I could play the piano."], "e": "could"}, {"k": "wr", "q": "그는 마치 모든 것을 아는 것처럼 말한다. (talks, as if, everything)", "a": ["He talks as if he knew everything.", "He talks as though he knew everything."], "e": "as if + 과거형"}, {"k": "bl", "q": "네가 아픈 걸 알았더라면 병문안을 갔을 텐데. → If I (had) (known) you were sick, I would have visited you.", "e": "had known"}, {"k": "bl", "q": "내가 형만큼 키가 크다면 좋을 텐데. → I wish I (were) as tall as my brother.", "e": "were"}, {"k": "fx", "q": "If it were sunny, we will go to the beach.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "fx", "q": "I wish I had came to the party last night.", "w": "came", "a": ["come"], "e": "had + p.p."}, {"k": "or", "q": "그녀는 마치 유령을 본 것처럼 보였다.", "a": "She looked as if she had seen a ghost.", "e": "as if + had p.p."}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? If I ____ a millionaire, I would help poor people.", "o": ["am", "were", "had been", "will be", "be"], "a": 1, "e": "가정법 과거 → were"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If you had called me, I ____ you up.", "o": ["will pick", "picked", "would have picked", "can pick", "have picked"], "a": 2, "e": "가정법 과거완료"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If he were honest, I would trust him.", "o": ["As he is honest, I trust him.", "As he isn't honest, I don't trust him.", "As he wasn't honest, I didn't trust him.", "As he was honest, I trusted him.", "If he is honest, I will trust him."], "a": 1, "e": "현재 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If I had taken the subway, I wouldn't have been late.", "o": ["As I took the subway, I was late.", "As I didn't take the subway, I was late.", "As I don't take the subway, I am late.", "As I didn't take the subway, I wasn't late.", "If I take the subway, I won't be late."], "a": 1, "e": "과거, 긍정 ↔ 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I wish I could speak English fluently.", "o": ["I'm sorry I can speak English fluently.", "I'm sorry I can't speak English fluently.", "I'm sorry I couldn't speak English fluently.", "I'm glad I can speak English fluently.", "I hope I can't speak English fluently."], "a": 1, "e": "현재 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I wish I had not lost my bag.", "o": ["I'm sorry I lost my bag.", "I'm sorry I didn't lose my bag.", "I'm sorry I lose my bag.", "I'm glad I lost my bag.", "I'm sorry I don't lose my bag."], "a": 0, "e": "과거 긍정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? She talks as if she had been a famous singer.", "o": ["In fact, she is a famous singer.", "In fact, she isn't a famous singer.", "In fact, she was a famous singer.", "In fact, she wasn't a famous singer.", "In fact, she won't be a famous singer."], "a": 3, "e": "had p.p. → 과거 부정"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["If I were you, I would go.", "If it rains tomorrow, I will stay home.", "I wish I had a sister.", "He talks as if he were rich.", "If she had come, she will have met him."], "a": 4, "e": "⑤ would have met"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIf I ____ his number, I could call him now.\nIf I ____ his number, I could have called him yesterday.", "o": ["knew – knew", "had known – knew", "knew – had known", "know – had known", "knew – have known"], "a": 2, "e": "now → knew / yesterday → had known"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wish I can drive.\nⓑ If I had wings, I could fly.\nⓒ He acts as if he were the boss.\nⓓ If I had studied, I would pass the test yesterday.\nⓔ I wish I had listened to you.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ could / ⓓ would have passed"}, {"k": "ch", "q": "다음 우리말을 영어로 옮긴 것으로 알맞은 것은?\n그가 거기 있었더라면, 그녀를 도울 수 있었을 텐데.", "o": ["If he were there, he could help her.", "If he had been there, he could have helped her.", "If he had been there, he can help her.", "If he is there, he could have helped her.", "If he has been there, he could help her."], "a": 1, "e": "과거 반대 → 가정법 과거완료"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["If I were a fish, I could live in the sea.", true], ["If he has time, he would join us.", false], ["If it snows tomorrow, we will make a snowman.", true], ["If you had told me, I would have helped you.", true], ["I wish I am good at sports.", false], ["I wish I had known the truth then.", true], ["She talks as if she were my mom.", true], ["If I had left early, I would catch the train yesterday.", false], ["I wish I could fly like a bird.", true], ["He acts as if he had seen the ghost last night.", true], ["If she had had money, she will have bought it.", false], ["If I knew her address, I would send her a card.", true]], "e": "ⓑ had ⓔ were ⓗ would have caught ⓚ would have bought"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["If I were taller, I would be a model.", true], ["I wish I have a big dog.", false], ["If he had studied, he could have passed.", true], ["He talks as if he knows everything. (사실은 모름)", false], ["If it were not raining, we could play outside.", true], ["I wish I hadn't eaten so much yesterday.", true], ["If you had come, you would have enjoyed it.", true], ["If I were you, I will say sorry.", false], ["She looks as if she were tired.", true], ["I wish I had went there.", false], ["If she knew it, she would be surprised.", true], ["I wish it were summer now.", true]], "e": "ⓑ had ⓓ knew ⓗ would ⓙ had gone"}, {"k": "wr", "q": "I'm sorry that I didn't study hard. → I wish로", "a": ["I wish I had studied hard."], "e": "had p.p."}, {"k": "wr", "q": "In fact, he is not a doctor. → as if를 써서 'He talks …'로", "a": ["He talks as if he were a doctor.", "He talks as though he were a doctor."], "e": "as if + were"}]}}, {"book": "hk2", "chapter": {"id": "18", "name": "일치·화법·도치", "title": "해커스 중학영문법 2학년 · Chapter 18 일치·화법·도치"}, "units": [{"tag": "hk2-18-1-1", "name": "시제 일치", "talk": [{"k": "m", "t": "마지막 Chapter 18! 먼저 **시제 일치** — 주절과 종속절의 시제를 맞추는 규칙이에요 ⏰"}, {"k": "m", "t": "주절이 **현재** → 종속절은 **모든 시제** 가능: I think that he **is / was / will be** busy."}, {"k": "m", "t": "주절이 **과거** → 종속절은 **과거** 또는 **과거완료**"}, {"k": "ex", "en": "I thought that he was sick.", "ko": "나는 그가 아프다고 생각했다."}, {"k": "q", "q": "I think that he will win. → I thought that he ____ win.", "o": ["will", "would", "can"], "a": 1, "ok": "맞아요! 주절 과거 → will은 would", "no": "주절이 과거(thought) → will → would"}, {"k": "m", "t": "조동사도 과거로: will → **would** / can → [could] / may → might"}, {"k": "m", "t": "종속절이 주절보다 **더 앞선 일**이면 과거완료: I knew that she **had lost** her key."}, {"k": "q", "q": "She said that she ____ her wallet the day before.", "o": ["has lost", "had lost", "loses"], "a": 1, "ok": "정확해요! 말한 때보다 앞선 일 → had lost", "no": "said(과거)보다 더 앞(the day before) → had p.p."}, {"k": "m", "t": "정리! **주절 현재 → 자유 / 주절 과거 → 과거·과거완료 (will → would, can → could)** 👍"}], "notes": {"table": [["주절", "종속절", "예"], ["현재", "모든 시제", "I know that he is / was / will be busy."], ["과거", "과거 (같은 때)", "I knew that he was busy."], ["과거", "과거완료 (더 앞선 때)", "I knew that he had been busy."], ["과거", "would / could / might", "I thought that it would rain."]], "tips": ["주절 과거 → 종속절 현재·will 그대로 쓰지 않기", "더 앞선 일은 had p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "I thought that he [was*/is] sick.", "e": "주절 과거 → was"}, {"k": "pk", "q": "She said that she [would*/will] call me the next day.", "e": "주절 과거 → would"}, {"k": "pk", "q": "I know that she [is*/were] a nurse.", "e": "주절 현재 → is"}, {"k": "pk", "q": "He told me that he [had lost*/has lost] his wallet the day before.", "e": "더 앞선 일 → had lost"}, {"k": "bl", "q": "나는 그가 정직하다고 생각했다. → I thought that he (was) honest.", "e": "was"}, {"k": "bl", "q": "그녀는 그 시험에 통과할 수 있다고 믿었다. → She believed that she (could) pass the test.", "e": "can → could"}, {"k": "bl", "q": "I think that he will win. → I thought that he (would) win.", "e": "will → would"}, {"k": "bl", "q": "I know that she lost her key. → I knew that she (had) lost her key.", "e": "과거 → 과거완료"}, {"k": "fx", "q": "I thought he will come, but he didn't.", "w": "will", "a": ["would"], "e": "주절 과거 → would"}, {"k": "fx", "q": "She said that she can't sleep the night before.", "w": "can't", "a": ["couldn't", "could not"], "e": "주절 과거 → couldn't"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I believed that he ____ the truth then.", "o": ["tells", "is telling", "was telling", "will tell", "has told"], "a": 2, "e": "주절 과거 → 과거"}, {"k": "ch", "q": "빈칸에 알맞지 않은 것은? I know that she ____ hard.", "o": ["works", "worked", "will work", "has worked", "work"], "a": 4, "e": "주절 현재 → 시제는 자유, 단 she → work ✗"}, {"k": "ch", "q": "주절을 과거로 바꿀 때 바르게 바꾼 것은? I think that it will rain.", "o": ["I thought that it will rain.", "I thought that it would rain.", "I thought that it rains.", "I think that it would rain.", "I thought that it has rained."], "a": 1, "e": "will → would"}, {"k": "bl", "q": "나는 그녀가 피아노를 칠 수 있다는 것을 몰랐다. → I didn't know that she (could) play the piano.", "e": "could"}, {"k": "bl", "q": "그는 그 책을 이미 읽었다고 말했다. → He said that he (had) already (read) the book.", "e": "had read"}, {"k": "pk", "q": "I hoped that you [would*/will] like my gift.", "e": "주절 과거 → would"}, {"k": "pk", "q": "We knew that the store [was*/is] closed that day.", "e": "주절 과거 → was"}, {"k": "fx", "q": "I thought that she is at home then.", "w": "is", "a": ["was"], "e": "주절 과거 → was"}, {"k": "ox", "q": "He says that he was sick yesterday.", "a": true, "e": "✔ 주절 현재 → 과거도 가능"}, {"k": "ox", "q": "I knew that he will be late.", "a": false, "e": "would be"}], "practiceB": [{"k": "or", "q": "나는 그가 올 거라고 생각했다.", "a": "I thought that he would come.", "e": "would"}, {"k": "or", "q": "그녀는 자
