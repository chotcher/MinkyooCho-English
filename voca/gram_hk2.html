<title>문법 · 해커스 중2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 레이아웃: 한 열 학습 화면 — 목록 → DM 개념톡 → 문제 카드. 학원 파란색 + 공책 같은 옅은 회청색 바탕 */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f7fc; --line:#d9e1ee; --fg:#17202e; --muted:#5d6a7e;
  --blue:#2457d6; --blue-soft:#e3ebfb; --blue-ink:#163d9e; --me:#2457d6; --me-fg:#ffffff;
  --good:#11845b; --good-soft:#e1f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7; --star:#e3a400;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:20px;color:var(--blue);border:0;background:none;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.vlab{font-size:13px;color:var(--muted)}
.vsel{max-width:150px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 8px;font:inherit;font-size:13px}
@media (max-width:520px){.vlab{display:none}.vsel{max-width:110px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{margin:0 0 16px;color:var(--muted)}
/* 유닛 목록 */
.units{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:left;display:grid;line-height:1.35;font-size:14px}
.tab b{color:var(--blue);font-weight:700}
.tab small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on b,.tab.on small{color:#fff}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.unit .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .no{font-family:var(--f-display);color:var(--blue);font-size:18px;min-width:34px}
.unit .nm{font-weight:700;flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;font-size:13.5px;line-height:1.3;display:grid;gap:2px}
.step b{font-weight:500}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{background:var(--good-soft);border-color:transparent}
.step.done small{color:var(--good);font-weight:700}
.step.tried small{color:var(--bad)}
.step.lock{opacity:.5}
.chset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.chset .step{padding:12px 6px;font-size:15px}
.sec{font-family:var(--f-display);font-size:18px;margin:22px 0 8px;color:var(--blue-ink)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
/* DM 개념톡 */
.dm{display:grid;gap:8px;padding-block:12px;align-content:start;min-height:calc(100dvh - 150px)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:15px}
.av.ghost{visibility:hidden}
.bub{max-width:min(560px,82%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 14px;min-width:0;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.bub.ex{background:var(--blue-soft);border-color:transparent}
.bub.ex .en{font-weight:700;color:var(--blue-ink);font-size:17px}
.bub.ex .ko{font-size:14px;color:var(--muted)}
.say{border:0;background:none;padding:0 4px;color:var(--blue);font-size:15px}
.bub strong{color:var(--blue-ink)}
.row.me .bub strong{color:inherit}
.wbank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line,#dde)}.wbank>span{font-size:12.5px;color:#6b7280;margin-right:4px}.wbank .chip{font-family:inherit}
.qko{font-size:15px;color:#4b5563;margin-bottom:8px;line-height:1.5}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:1px 6px;font:inherit;font-weight:700;color:var(--blue-ink);text-align:center;width:6.5em}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.opt:hover{border-color:var(--blue)}
.qbub{border-color:var(--blue)}
.qbub .qq{font-weight:700}
.dmfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
/* 문제 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-top:12px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notes h3{margin:0 0 8px;font-size:15px;color:var(--blue-ink)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:500}
.tips{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.kind{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.qtext{font-size:18px;white-space:pre-line}
.qtext.en{font-size:19px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;margin:0 2px;font:inherit;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.right{background:var(--good);border-color:var(--good);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tok{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:3px 2px;font:inherit}
.tok.sel{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tok.used{opacity:.3}
.fxrow{display:flex;gap:8px;align-items:center}
.fxrow .inp{flex:1;min-width:0}
.ans{min-height:46px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--surface2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg)}
.choices{display:grid;gap:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;display:flex;gap:10px}
.choice .n{color:var(--blue);font-weight:700;min-width:20px}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m12{display:grid;gap:4px}
.m12 .choice .n{min-width:22px}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--f-display);font-size:30px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px}
.ox button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--fg);display:block;margin-top:2px}
.fb .key{display:block;font-weight:700;margin-top:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kh{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--fg)}
.dmfoot{align-items:center}
@media (hover:none){.kh{display:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 18px}
.score{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score.pass{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.wlist{display:grid;gap:6px;text-align:left;width:100%}
.wlist div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:14px;z-index:20}
@media (max-width:520px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}.bub{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v22-ui ===== */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#f5f7fb; --line:#dde4f0; --fg:#0f1b33; --muted:#5b6a84;
  --blue:#1f4fd8; --blue-soft:#e9effe; --blue-ink:#1740b0; --me:#1f4fd8; --me-fg:#fff; --navy:#0c2463;
  --good:#0e9f6e; --good-soft:#e3f6ee; --bad:#e0464c; --bad-soft:#fdebec;
  --f-display:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,serif;
  --r:16px; --sh:0 1px 2px rgba(15,35,80,.06),0 10px 28px -14px rgba(15,35,80,.22); --tbub:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}}
:root[data-theme="dark"]{--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}
body{letter-spacing:-.005em}
h1,h2{font-weight:700;letter-spacing:-.02em}
.btn{border-radius:12px;font-weight:600}
.btn.primary{box-shadow:0 6px 16px -8px rgba(31,79,216,.7)}
.brand{font-weight:700;font-size:19px;color:var(--fg)}
.top{border-bottom:0;padding-block:14px 10px}
/* chapter band */
.chband{background:var(--navy);color:#fff;border-radius:20px;padding:22px 24px 20px;margin-top:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.chband::after{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.05)}
.cb-book{font-size:13px;color:#b9c8f3;font-weight:600}
.chband h1{margin:0;color:#fff;font-size:clamp(22px,3.4vw,30px);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chband h1 em{font-style:normal;font-family:var(--f-en);font-weight:600;color:#b9c8f3;font-size:.8em}
.chband .lead{color:#d7e0fa;margin:0 0 8px;font-size:14.5px}
.chband .prog{color:#d7e0fa}
.chband .prog b{color:#fff}
.chband .bar{background:rgba(255,255,255,.14);border:0}
.chband .bar i{background:#fff}
.tabs{padding-block:4px 0}
.tab{border-radius:12px;padding:8px 14px;box-shadow:var(--sh)}
.tab.on{background:var(--navy);border-color:var(--navy)}
.sec{font-family:var(--f-body);font-weight:700;color:var(--fg);font-size:17px}
.unit{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.unit .no{font-family:var(--f-en);font-weight:600;font-size:19px}
.unit .nm{font-size:16.5px}
.step{border-radius:12px;padding:10px 6px;background:var(--surface2);transition:border-color .12s}
.step:hover{border-color:var(--blue)}
.step b{font-weight:600}
.step.done{background:var(--good-soft);border-color:transparent}
.chset .step{box-shadow:var(--sh);background:var(--surface)}
/* quiz header */
.top.q{position:sticky;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 10px;margin-top:12px}
.top.q b{font-size:15px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top.q .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.top.q .btn:hover{background:rgba(255,255,255,.18)}
.prog{margin-top:16px!important}
.bar{height:8px;background:var(--blue-soft);border:0}
.card{border-radius:20px;padding:24px 26px;gap:16px;margin-top:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:not(.result)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kind{font-size:13px;letter-spacing:0}
.qtext{font-size:20px;line-height:1.75}
.qtext.en{font-size:21px}
.chip{border-radius:10px;padding:3px 12px;font-size:inherit}
.tok{border-radius:10px;padding:4px 11px;font-size:18px}
.inp{border-radius:12px;padding:12px 14px;font-size:18px;border-width:1.5px}
.inp:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px var(--blue-soft)}
.choice{border-radius:12px;padding:12px 14px;font-size:16px;background:var(--surface)}
.choice:hover{border-color:var(--blue)}
.ox button{font-family:var(--f-body);font-weight:700;border-radius:16px;padding:14px}
.fb{border-radius:12px;padding:12px 16px}
.notes{border-radius:var(--r);box-shadow:var(--sh)}
.score{font-family:var(--f-body);font-weight:800;letter-spacing:-.03em}
/* Instagram-like DM */
.dmhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px 10px 8px;margin-top:12px;box-shadow:var(--sh)}
.dmback{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dmback:hover{background:var(--surface2)}
.dmback svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#1f4fd8,#5b8cff,#0c2463,#1f4fd8)}
.avring .av{width:40px;height:40px;border:2px solid var(--surface);font-family:var(--f-body);font-weight:700;font-size:14px;background:var(--navy)}
.dmwho{display:grid;line-height:1.3;flex:1;min-width:0}
.dmwho b{font-size:15.5px}
.dmwho span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmon{font-size:12px;color:var(--good);font-weight:600;display:flex;align-items:center;gap:6px}
.dmon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.dm{gap:6px;padding:18px 4px 12px;min-height:calc(100dvh - 160px)}
.dmday{justify-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-bottom:8px}
.av{width:30px;height:30px;font-family:var(--f-body);font-weight:700;font-size:12px;background:var(--navy)}
.bub{background:var(--tbub);border:0;border-radius:22px 22px 22px 8px;padding:10px 16px;font-size:16px;line-height:1.6}
.row.me .bub{background:linear-gradient(135deg,#2a5cf0,#1f4fd8 55%,#1a3fb8);border-radius:22px 22px 8px 22px}
.bub.ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue)}
.bub.ex .en{font-family:var(--f-en);font-weight:600;font-size:18.5px}
.qbub{background:var(--surface);border:1.5px solid var(--blue)}
.opt{border-radius:12px;padding:10px 14px;background:var(--surface)}
.dmfoot{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:0}
.dmfoot .btn.primary{border-radius:99px;padding:10px 22px}
.chband .prog{margin-top:4px!important}
</style>

<script>
const BOOK = {"book": "hk2", "title": "해커스 중학영문법 2학년", "chapters": [{"book": "hk2", "chapter": {"id": "00", "name": "기초 문법", "title": "해커스 중학영문법 2학년 · 기초 문법"}, "units": [{"tag": "hk2-00-1", "name": "문장 성분", "talk": [{"k": "m", "t": "중2 문법을 시작하기 전에 **기초 문법**부터! 문장을 이루는 부품, **문장 성분**을 알아봐요 🧩"}, {"k": "m", "t": "주요 성분은 4가지: **주어**(~은/는/이/가), **동사**(~이다/~하다), **목적어**(~을/를), **보어**(주어·목적어를 보충 설명)"}, {"k": "ex", "en": "My brother plays the guitar.", "ko": "내 남동생은 기타를 연주한다. (주어 My brother / 동사 plays / 목적어 the guitar)"}, {"k": "q", "q": "Tom reads books every night. 에서 주어는?", "o": ["Tom", "reads", "books"], "a": 0, "ok": "맞아요! '~은/는'에 해당하는 Tom", "no": "'누가' 읽나요? → Tom이 주어"}, {"k": "m", "t": "목적어는 동사의 대상 '~을/를': I love [music]."}, {"k": "m", "t": "**보어**는 '누구인지, 어떤 상태인지' 설명해요. 주어를 설명하면 주격 보어, 목적어를 설명하면 목적격 보어!"}, {"k": "ex", "en": "She is a nurse. / The song made me happy.", "ko": "그녀는 간호사이다. (주격 보어 a nurse) / 그 노래는 나를 행복하게 했다. (목적격 보어 happy)"}, {"k": "q", "q": "He became a famous chef. 에서 'a famous chef'의 문장 성분은?", "o": ["목적어", "보어", "수식어"], "a": 1, "ok": "정확해요! 그 = 유명한 요리사 → 주격 보어", "no": "He와 a famous chef는 같은 사람 → 보어"}, {"k": "m", "t": "**수식어**는 다른 말을 꾸며 주는 말 — 빼도 문장이 성립해요. 시간·장소·방법 표현이 대표적!"}, {"k": "ex", "en": "We played soccer in the park yesterday.", "ko": "우리는 어제 공원에서 축구를 했다. (in the park, yesterday = 수식어)"}, {"k": "q", "q": "She sings beautifully. 에서 'beautifully'는?", "o": ["보어", "목적어", "수식어"], "a": 2, "ok": "맞아요! 동사 sings를 꾸미는 수식어", "no": "beautifully는 '어떻게' 부르는지 꾸며 줌 → 수식어"}, {"k": "m", "t": "⚠️ 목적어 vs 보어: He met **a doctor**. (그 ≠ 의사 → 목적어) / He is **a doctor**. (그 = 의사 → 보어)"}, {"k": "m", "t": "정리! **주어·동사·목적어·보어 = 주요 성분 / 수식어 = 꾸미는 말** 👍"}], "notes": {"table": [["문장 성분", "하는 일", "예 (→ 해당 부분)"], ["주어", "동작·상태의 주인 (~은/는/이/가)", "Mina likes cats. → Mina"], ["동사", "동작·상태 (~하다/~이다)", "Mina likes cats. → likes"], ["목적어", "동사의 대상 (~을/를, ~에게)", "Mina likes cats. → cats"], ["주격 보어", "주어를 설명", "He is tall. → tall"], ["목적격 보어", "목적어를 설명", "We call him Ace. → Ace"], ["수식어", "꾸며 주는 말 (빼도 문장 성립)", "I run fast every day. → fast, every day"]], "tips": ["주어 자리 → 주격(I, he, she), 목적어 자리 → 목적격(me, him, her)", "보어 자리 → 명사·형용사 (부사 -ly ✗)", "형용사가 명사 앞에서 꾸미면 수식어, be동사 뒤에서 설명하면 보어"]}, "sets": {"workbook": [{"k": "ch", "q": "My dog sleeps on the sofa. 에서 'My dog'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 0, "e": "'~은/는' → 주어"}, {"k": "ch", "q": "I drink milk every morning. 에서 'milk'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 2, "e": "'우유를' → 목적어"}, {"k": "ch", "q": "The soup tastes salty. 에서 'salty'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 3, "e": "수프의 상태 설명 → 보어"}, {"k": "ch", "q": "They arrived at the station. 에서 'at the station'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 4, "e": "장소 표현 → 수식어"}, {"k": "ch", "q": "Jiho cleaned his room. 에서 'cleaned'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 1, "e": "'청소했다' → 동사"}, {"k": "ox", "q": "She is my aunt. 에서 'my aunt'는 목적어이다.", "a": false, "e": "she = my aunt → 보어"}, {"k": "ox", "q": "We call him Captain. 에서 'Captain'은 목적격 보어이다.", "a": true, "e": "him = Captain → 목적격 보어 ✔"}, {"k": "pk", "q": "She looks [happy*/happily].", "e": "보어 자리 → 형용사"}, {"k": "pk", "q": "The news made [we/us*] sad.", "e": "목적어 자리 → 목적격"}, {"k": "fx", "q": "Him is my best friend.", "w": "Him", "a": ["He"], "e": "주어 자리 → 주격 He"}], "practiceA": [{"k": "ch", "q": "문장에서 'a cake'의 문장 성분은?\nMom made me a cake.", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 2, "e": "'케이크를' → 목적어(직접목적어)"}, {"k": "ch", "q": "보어가 있는 문장은?", "o": ["I like pizza.", "He runs fast.", "She became a pilot.", "We met him yesterday.", "The baby is sleeping in bed."], "a": 2, "e": "③ she = a pilot → 보어"}, {"k": "ch", "q": "다음 문장에서 수식어를 모두 고른 것은?\nYesterday I met Sumi at the library.\nⓐ Yesterday ⓑ I ⓒ met ⓓ Sumi ⓔ at the library", "o": ["ⓐ", "ⓔ", "ⓐ, ⓔ", "ⓓ, ⓔ", "ⓐ, ⓓ, ⓔ"], "a": 2, "e": "시간(Yesterday)·장소(at the library) → 수식어 / Sumi는 목적어"}, {"k": "ch", "q": "'Kevin'이 목적어인 문장은?", "o": ["Kevin is my cousin.", "Kevin plays tennis.", "I visited Kevin.", "This is Kevin.", "Kevin smiled."], "a": 2, "e": "③ 'Kevin을' 방문했다 → 목적어 / ④ This = Kevin → 보어"}, {"k": "ch", "q": "'warm'의 문장 성분이 나머지와 다른 것은?", "o": ["It got warm.", "Keep your feet warm.", "The room is warm.", "I want a warm coat.", "The water felt warm."], "a": 3, "e": "④ 명사 coat를 꾸미는 수식어 / 나머지는 보어"}, {"k": "ox", "q": "They named the puppy Coco. 에서 'the puppy'는 목적어이다.", "a": true, "e": "'강아지를' 이름 지었다 → 목적어 ✔ (Coco는 목적격 보어)"}, {"k": "ox", "q": "He lives in Busan. 에서 'in Busan'은 보어이다.", "a": false, "e": "장소 표현 → 수식어"}, {"k": "pk", "q": "The classroom was [quiet*/quietly].", "e": "보어 자리 → 형용사"}, {"k": "pk", "q": "I saw [she/her*] at the bus stop.", "e": "목적어 자리 → 목적격"}, {"k": "fx", "q": "Your idea sounds greatly.", "w": "greatly.", "a": ["great"], "e": "보어 자리 → 형용사"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She looks lovely.\nⓑ Them are my friends.\nⓒ The song made me sadly.\nⓓ He became a doctor.\nⓔ I met her at the mall.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓓⓔ 옳음 (lovely는 형용사) / ⓑ They / ⓒ sad"}, {"k": "ch", "q": "문장 성분이 바르게 짝지어진 것은?", "o": ["I like you. → you: 보어", "She is tall. → tall: 목적어", "He came home late. → late: 수식어", "We call her Jenny. → Jenny: 목적어", "The cake smells good. → good: 수식어"], "a": 2, "e": "③ 시간 표현 → 수식어 / ① 목적어 ② 보어 ④ 목적격 보어 ⑤ 보어"}, {"k": "ch", "q": "보어가 없는 문장은?", "o": ["She is a singer.", "They became friends.", "I found the movie boring.", "He gave me a pen.", "The leaves turned yellow."], "a": 3, "e": "④ me·a pen 모두 목적어 (4형식)"}, {"k": "ch", "q": "'a teacher'의 문장 성분이 나머지와 다른 것은?", "o": ["My mom is a teacher.", "He became a teacher.", "Ms. Lee was a teacher.", "I met a teacher at the store.", "Mr. Kim is a teacher."], "a": 3, "e": "④ 목적어 (I ≠ teacher) / 나머지는 보어"}, {"k": "or", "q": "우리는 그 개를 Max라고 부른다.", "a": "We call the dog Max.", "e": "주어 + 동사 + 목적어 + 목적격 보어"}, {"k": "or", "q": "그 소식은 그를 슬프게 만들었다.", "a": "The news made him sad.", "e": "목적격 보어 → 형용사 sad"}, {"k": "wr", "q": "다음 문장에서 목적어를 찾아 쓰시오. Every Sunday, my dad washes his car in the garage.", "a": ["his car"], "e": "'차를' 닦는다 → his car"}, {"k": "wr", "q": "다음 문장에서 보어를 찾아 쓰시오. The weather became very cold in the evening.", "a": ["very cold", "cold"], "e": "날씨의 상태 → (very) cold"}, {"k": "fx", "q": "We elected he class president.", "w": "he", "a": ["him"], "e": "목적어 자리 → 목적격 him"}, {"k": "fx", "q": "This blanket feels softly.", "w": "softly.", "a": ["soft"], "e": "보어 자리 → 형용사"}]}}, {"tag": "hk2-00-2", "name": "8품사", "talk": [{"k": "m", "t": "단어는 하는 일에 따라 **8품사**로 나눠요: 명사·대명사·동사·형용사·부사·전치사·접속사·감탄사 🗂️"}, {"k": "m", "t": "**명사** 이름(book, Seoul, water) / **대명사** 명사 대신(he, it, this) / **동사** 동작·상태(run, is, have)"}, {"k": "ex", "en": "Jisu has a cat. She loves it.", "ko": "지수는 고양이가 있다. 그녀는 그것을 사랑한다. (Jisu·cat 명사 / She·it 대명사 / has·loves 동사)"}, {"k": "q", "q": "'happiness'의 품사는?", "o": ["명사", "형용사", "부사"], "a": 0, "ok": "맞아요! -ness로 끝나는 '행복'이라는 이름", "no": "happy(형용사) + ness → 명사 happiness"}, {"k": "m", "t": "**형용사** 명사를 꾸미거나 보어로 (a [tall] boy / He is tall.) / **부사** 동사·형용사·다른 부사·문장 전체를 꾸밈 (run fast, very tall)"}, {"k": "q", "q": "He drives carefully. 에서 'carefully'의 품사는?", "o": ["형용사", "부사", "동사"], "a": 1, "ok": "정확해요! 동사 drives를 꾸미는 부사", "no": "동사를 꾸미는 말 → 부사"}, {"k": "m", "t": "**전치사** 명사 앞에서 시간·장소 등(in, on, at, with) / **접속사** 말과 말을 연결(and, but, because) / **감탄사** 감정(Oh, Wow, Oops)"}, {"k": "ex", "en": "Wow, the cat is on the table, and it is sleeping.", "ko": "와, 고양이가 탁자 위에 있고, 자고 있다. (Wow 감탄사 / on 전치사 / and 접속사)"}, {"k": "m", "t": "⚠️ 품사는 **문장 속 쓰임**으로 정해요! I **like** apples. (동사) / He runs **like** a horse. (전치사)"}, {"k": "q", "q": "She works hard. 에서 'hard'의 품사는?", "o": ["형용사", "부사", "명사"], "a": 1, "ok": "맞아요! 동사 works를 꾸미는 부사", "no": "'열심히' 일한다 → 동사를 꾸미는 부사 (a hard test의 hard는 형용사)"}, {"k": "m", "t": "정리! **명·대·동·형·부·전·접·감 — 쓰임을 보고 판단** 👍"}], "notes": {"table": [["품사", "하는 일", "예"], ["명사", "사람·사물·개념의 이름", "Tom, water, love"], ["대명사", "명사 대신", "I, she, it, this, mine"], ["동사", "동작·상태", "go, eat, be, have"], ["형용사", "명사 수식, 보어", "happy, tall, lovely"], ["부사", "동사·형용사·부사·문장 수식", "fast, very, slowly, always"], ["전치사", "명사·대명사 앞 (시간·장소·방법)", "in, on, at, with, during"], ["접속사", "단어·구·절 연결", "and, but, or, so, because, when"], ["감탄사", "놀람·기쁨 등 감정", "Oh, Wow, Oops, Hooray"]], "tips": ["-ly는 대부분 부사, 하지만 friendly·lovely·lonely·lively·ugly는 형용사", "같은 단어라도 쓰임에 따라 품사가 달라짐: fast, hard, early, like", "well은 '잘'(부사), good은 '좋은'(형용사)"]}, "sets": {"workbook": [{"k": "ch", "q": "'beautiful'의 품사는?", "o": ["명사", "동사", "형용사", "부사", "전치사"], "a": 2, "e": "형용사"}, {"k": "ch", "q": "'under'의 품사는?", "o": ["명사", "동사", "형용사", "부사", "전치사"], "a": 4, "e": "under the desk → 전치사"}, {"k": "ch", "q": "'because'의 품사는?", "o": ["명사", "대명사", "부사", "전치사", "접속사"], "a": 4, "e": "절과 절을 연결 → 접속사"}, {"k": "ch", "q": "'they'의 품사는?", "o": ["명사", "대명사", "동사", "형용사", "감탄사"], "a": 1, "e": "명사 대신 → 대명사"}, {"k": "ch", "q": "'Oops'의 품사는?", "o": ["명사", "동사", "부사", "접속사", "감탄사"], "a": 4, "e": "감정 표현 → 감탄사"}, {"k": "ox", "q": "'slowly'는 부사이다.", "a": true, "e": "✔"}, {"k": "ox", "q": "'friendly'는 부사이다.", "a": false, "e": "명사 + ly → 형용사 (a friendly dog)"}, {"k": "pk", "q": "He is a [careful*/carefully] driver.", "e": "명사 driver를 꾸밈 → 형용사"}, {"k": "pk", "q": "He speaks English [good/well*].", "e": "동사를 꾸밈 → 부사 well"}, {"k": "fx", "q": "She smiled happy at me.", "w": "happy", "a": ["happily"], "e": "동사 smiled를 꾸밈 → 부사"}], "practiceA": [{"k": "ch", "q": "품사가 나머지와 다른 것은?", "o": ["quickly", "slowly", "friendly", "easily", "carefully"], "a": 2, "e": "③ 형용사 / 나머지는 부사"}, {"k": "ch", "q": "품사가 나머지와 다른 것은?", "o": ["water", "teacher", "Seoul", "run", "happiness"], "a": 3, "e": "④ 동사 / 나머지는 명사"}, {"k": "ch", "q": "'fast'의 품사가 나머지와 다른 것은?", "o": ["He runs fast.", "She swims fast.", "It's a fast car.", "Don't drive so fast.", "Time goes fast."], "a": 2, "e": "③ 명사 car를 꾸미는 형용사 / 나머지는 부사"}, {"k": "ch", "q": "문장에서 'like'의 품사는?\nShe sings like a bird.", "o": ["명사", "동사", "형용사", "전치사", "접속사"], "a": 3, "e": "'새처럼' → 명사 앞 전치사"}, {"k": "ch", "q": "다음 문장에서 형용사를 모두 고른 것은?\nKids love sweet cookies and cold milk.", "o": ["sweet / cold", "Kids / love", "love / cold", "cookies / milk", "and / sweet"], "a": 0, "e": "명사 cookies, milk를 꾸미는 sweet, cold"}, {"k": "bl", "q": "그는 매우 빨리 달린다. → He runs very (fast|quickly).", "e": "동사를 꾸밈 → 부사"}, {"k": "pk", "q": "This math problem is [easy*/easily].", "e": "보어 자리 → 형용사"}, {"k": "pk", "q": "We went to the park [and*/with] played soccer.", "e": "동사와 동사 연결 → 접속사"}, {"k": "ox", "q": "Wow, it's huge! 에서 'Wow'는 감탄사이다.", "a": true, "e": "✔"}, {"k": "fx", "q": "He is a very carefully driver.", "w": "carefully", "a": ["careful"], "e": "명사 앞 → 형용사"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She is a lovely girl.\nⓑ He drives careful.\nⓒ The test was easy.\nⓓ I can swim good.\nⓔ They arrived early.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ carefully / ⓓ well"}, {"k": "ch", "q": "'hard'의 품사가 같은 것끼리 묶은 것은?\nⓐ This bread is hard.\nⓑ He studies hard.\nⓒ It was a hard question.\nⓓ Don't push so hard.", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓒ", "ⓒ, ⓓ", "ⓐ, ⓓ"], "a": 1, "e": "ⓐⓒ 형용사(딱딱한, 어려운) / ⓑⓓ 부사(열심히, 세게)"}, {"k": "ch", "q": "품사가 바르게 짝지어진 것은?", "o": ["slowly – 형용사", "under – 접속사", "lovely – 부사", "they – 대명사", "but – 전치사"], "a": 3, "e": "① 부사 ② 전치사 ③ 형용사 ⑤ 접속사"}, {"k": "ch", "q": "다음 문장에 쓰이지 않은 품사는?\nOh, she quickly ran to the bus.", "o": ["감탄사", "대명사", "부사", "전치사", "접속사"], "a": 4, "e": "Oh 감탄사 / she 대명사 / quickly 부사 / to 전치사 → 접속사 없음"}, {"k": "bl", "q": "그녀는 친절하게 웃었다. → She smiled (kindly).", "e": "동사를 꾸밈 → 부사"}, {"k": "bl", "q": "그것은 쉬운 질문이었다. → It was an (easy) question.", "e": "명사를 꾸밈 → 형용사"}, {"k": "wr", "q": "다음 문장에서 부사를 모두 찾아 순서대로 쉼표로 이어 쓰시오. He always speaks very slowly.", "a": ["always, very, slowly", "always,very,slowly", "always very slowly"], "e": "always(빈도) / very(slowly 수식) / slowly(speaks 수식)"}, {"k": "or", "q": "나의 할머니는 매우 천천히 걸으신다.", "a": "My grandmother walks very slowly.", "e": "very → slowly 수식, slowly → walks 수식"}, {"k": "fx", "q": "The flowers smell sweetly.", "w": "sweetly.", "a": ["sweet"], "e": "감각동사 뒤 보어 → 형용사"}, {"k": "fx", "q": "He answered the question easy.", "w": "easy.", "a": ["easily"], "e": "동사를 꾸밈 → 부사"}]}}, {"tag": "hk2-00-3", "name": "구와 절", "talk": [{"k": "m", "t": "단어가 모여 덩어리가 되면 **구** 또는 **절**! 차이는 '주어 + 동사'가 있느냐예요 🧱"}, {"k": "m", "t": "**구** = 두 단어 이상, 주어 + 동사 ✗: in the morning, a very tall boy, to play soccer"}, {"k": "m", "t": "**절** = 주어 + 동사 ○: when I [was] young, that he is honest, because it rained"}, {"k": "q", "q": "'after school'은?", "o": ["구", "절", "한 단어"], "a": 0, "ok": "맞아요! 주어 + 동사가 없는 덩어리 → 구", "no": "after school에는 주어 + 동사가 없어요 → 구"}, {"k": "q", "q": "'because she was sick'은?", "o": ["구", "절", "한 단어"], "a": 1, "ok": "정확해요! she + was → 절", "no": "she(주어) + was(동사)가 있으면 절"}, {"k": "m", "t": "구와 절은 문장에서 **명사·형용사·부사** 역할을 해요. 명사 역할 = 주어·목적어·보어 / 형용사 역할 = 명사 수식 / 부사 역할 = 동사·문장 수식"}, {"k": "ex", "en": "To learn English is fun.", "ko": "영어를 배우는 것은 재미있다. (To learn English → 주어 역할 명사구)"}, {"k": "ex", "en": "The book on the desk is mine.", "ko": "책상 위의 책은 내 것이다. (on the desk → 명사 book을 꾸미는 형용사구)"}, {"k": "ex", "en": "I read books in the morning.", "ko": "나는 아침에 책을 읽는다. (in the morning → 동사를 꾸미는 부사구)"}, {"k": "m", "t": "절도 마찬가지: I think **that he is kind**. (목적어 → 명사절) / I was happy **when I saw you**. (시간 → 부사절)"}, {"k": "q", "q": "I know that she likes you. 에서 'that she likes you'는?", "o": ["명사절", "부사절", "부사구"], "a": 0, "ok": "맞아요! know의 목적어 → 명사절", "no": "'그녀가 너를 좋아한다는 것을' 안다 → 목적어 → 명사절"}, {"k": "m", "t": "⚠️ 구 앞에는 **전치사**, 절 앞에는 **접속사**! because of the rain (구) / because it rained (절), during the movie (구) / while we watched (절)"}, {"k": "m", "t": "정리! **구 = 주어 + 동사 ✗ / 절 = 주어 + 동사 ○ / 역할은 명사·형용사·부사** 👍"}], "notes": {"table": [["종류", "역할", "예 (→ 해당 부분)"], ["명사구", "주어·목적어·보어", "I like to swim. → to swim"], ["형용사구", "명사 수식", "the girl with long hair → with long hair"], ["부사구", "동사·문장 수식 (시간·장소·목적 등)", "We met at the park. → at the park"], ["명사절", "주어·목적어·보어", "I think that it's true. → that it's true"], ["부사절", "시간·이유·조건 등", "Call me if you are free. → if you are free"]], "tips": ["because of / during + 구(명사) ↔ because / while + 절(주어 + 동사)", "and·but·or·so로 이은 절은 대등한 절(등위절), when·because·if·that 절은 다른 절에 딸린 절(종속절)", "형용사절(관계사절)은 Chapter 16에서 배워요"]}, "sets": {"workbook": [{"k": "pk", "q": "'in the park' → [구*/절]", "e": "주어 + 동사 없음 → 구"}, {"k": "pk", "q": "'when I was ten' → [구/절*]", "e": "I + was → 절"}, {"k": "pk", "q": "'to watch movies' → [구*/절]", "e": "주어 없음 → 구"}, {"k": "pk", "q": "'if it rains tomorrow' → [구/절*]", "e": "it + rains → 절"}, {"k": "pk", "q": "'a very tall tree' → [구*/절]", "e": "동사 없음 → 구"}, {"k": "ch", "q": "문장에서 'on the wall'의 역할은?\nThe picture on the wall is beautiful.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 1, "e": "명사 picture를 꾸밈 → 형용사구"}, {"k": "ch", "q": "문장에서 'at seven'의 역할은?\nI get up at seven.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 2, "e": "시간 → 동사를 꾸미는 부사구"}, {"k": "ch", "q": "문장에서 'that he is honest'의 역할은?\nI believe that he is honest.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 3, "e": "believe의 목적어 → 명사절"}, {"k": "ox", "q": "'because I was tired'는 절이다.", "a": true, "e": "I + was ✔"}, {"k": "ox", "q": "'with my friends'는 절이다.", "a": false, "e": "주어 + 동사 없음 → 구"}], "practiceA": [{"k": "ch", "q": "절이 아닌 것은?", "o": ["when she came home", "that it is true", "because he was late", "in front of the school", "if you are free"], "a": 3, "e": "④ 주어 + 동사 없음 → 구"}, {"k": "ch", "q": "구가 아닌 것은?", "o": ["after lunch", "to read books", "my new bike", "before I go to bed", "under the table"], "a": 3, "e": "④ I + go → 절"}, {"k": "ch", "q": "문장에서 'To swim in the sea'의 역할은?\nTo swim in the sea is exciting.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 0, "e": "주어 역할 → 명사구"}, {"k": "ch", "q": "문장에서 'when I was young'의 역할은?\nI lived in Jeju when I was young.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 4, "e": "시간 → 부사절"}, {"k": "ch", "q": "문장에서 'to drink'의 역할은?\nI want something to drink.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 1, "e": "something을 꾸밈 → 형용사구"}, {"k": "ox", "q": "I think that you are right. 에서 'that you are right'는 think의 목적어인 명사절이다.", "a": true, "e": "✔"}, {"k": "ox", "q": "The girl with long hair is my sister. 에서 'with long hair'는 부사구이다.", "a": false, "e": "명사 girl을 꾸밈 → 형용사구"}, {"k": "pk", "q": "I stayed home [because*/because of] it was raining.", "e": "뒤에 절(it + was) → because"}, {"k": "pk", "q": "We canceled the game [because/because of*] the rain.", "e": "뒤에 구(명사) → because of"}, {"k": "fx", "q": "I was late because of I missed the bus.", "w": "of", "a": ["(삭제)"], "e": "뒤에 절 → because"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I fell asleep during the movie.\nⓑ He called me while I was eating.\nⓒ She was absent because of she was sick.\nⓓ We stayed inside because of the heat.\nⓔ Don't use your phone while class.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ because / ⓔ during"}, {"k": "ch", "q": "짝지은 역할이 바르지 않은 것은?", "o": ["To keep a diary is hard. → To keep a diary: 명사구", "The cat under the bed is mine. → under the bed: 형용사구", "I read books before bed. → before bed: 부사구", "I hope that you get well soon. → that you get well soon: 부사절", "Call me if you need help. → if you need help: 부사절"], "a": 3, "e": "④ hope의 목적어 → 명사절"}, {"k": "ch", "q": "다음 문장에서 절은 모두 몇 개인가?\nWhen I got home, my mom was cooking, and my dad was reading.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "I got / my mom was cooking / my dad was reading → 3개"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe smiled ____ she heard the news.\nI met him ____ the summer vacation.", "o": ["when – during", "during – when", "while – when", "during – while", "when – while"], "a": 0, "e": "절 앞 → when / 구 앞 → during"}, {"k": "bl", "q": "비가 와서 우리는 집에 있었다. → We stayed home (because) it rained.", "e": "절 앞 → because"}, {"k": "bl", "q": "비 때문에 우리는 집에 있었다. → We stayed home because (of) the rain.", "e": "구 앞 → because of"}, {"k": "wr", "q": "다음 문장에서 부사절을 찾아 쓰시오. If you are tired, you can go to bed early.", "a": ["If you are tired"], "e": "조건 → 부사절"}, {"k": "wr", "q": "다음 문장에서 명사절을 찾아 쓰시오. Everyone knows that the earth is round.", "a": ["that the earth is round"], "e": "knows의 목적어 → 명사절"}, {"k": "or", "q": "나는 그가 정직하다고 생각한다.", "a": "I think that he is honest.", "e": "that절 → think의 목적어(명사절)"}, {"k": "fx", "q": "He fell asleep while the movie.", "w": "while", "a": ["during"], "e": "뒤에 구(명사) → during"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "다음 문장의 목적어를 쓰시오. My uncle bought a new car last month.", "a": ["a new car"], "e": "'새 차를' → 목적어"}, {"k": "wr", "q": "다음 문장의 보어를 쓰시오. Her voice sounds sweet.", "a": ["sweet"], "e": "목소리의 상태 → 보어"}, {"k": "wr", "q": "다음 문장에서 형용사를 찾아 쓰시오. Mina has long hair.", "a": ["long"], "e": "명사 hair를 꾸밈"}, {"k": "wr", "q": "다음 문장에서 부사구를 찾아 쓰시오. We had lunch at the cafeteria.", "a": ["at the cafeteria"], "e": "장소 → 부사구"}, {"k": "wr", "q": "다음 문장에서 부사절을 찾아 쓰시오. I was very happy when I got your letter.", "a": ["when I got your letter"], "e": "시간 → 부사절"}, {"k": "bl", "q": "그는 빨리 달린다. 그는 빠른 주자이다. → He runs (fast). He is a (fast) runner.", "e": "같은 fast — 부사 / 형용사"}, {"k": "bl", "q": "나는 피곤해서 일찍 잤다. → I went to bed early (because) I was tired.", "e": "절 앞 → because"}, {"k": "fx", "q": "Her looks happy today.", "w": "Her", "a": ["She"], "e": "주어 자리 → 주격"}, {"k": "fx", "q": "Please speak quiet in the library.", "w": "quiet", "a": ["quietly"], "e": "동사를 꾸밈 → 부사"}, {"k": "or", "q": "그 소식은 우리를 행복하게 했다.", "a": "The news made us happy.", "e": "목적어 us + 목적격 보어 happy"}], "test": [{"k": "ch", "q": "문장에서 'his homework'의 문장 성분은?\nHe finished his homework after dinner.", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 2, "e": "'숙제를' → 목적어"}, {"k": "ch", "q": "보어가 있는 문장은?", "o": ["I watched TV.", "She sings well.", "The milk smells bad.", "He gave me a book.", "We left early."], "a": 2, "e": "③ 우유의 상태 bad → 보어"}, {"k": "ch", "q": "품사가 나머지와 다른 것은?", "o": ["lonely", "lovely", "friendly", "slowly", "ugly"], "a": 3, "e": "④ 부사 / 나머지는 형용사"}, {"k": "ch", "q": "문장에서 'early'의 품사는?\nShe came to school early.", "o": ["명사", "동사", "형용사", "부사", "전치사"], "a": 3, "e": "동사 came을 꾸밈 → 부사"}, {"k": "ch", "q": "절이 아닌 것은?", "o": ["after he left", "that she is kind", "during the class", "if it snows", "because I lost my key"], "a": 2, "e": "③ 주어 + 동사 없음 → 구"}, {"k": "ch", "q": "문장에서 'that she won the prize'의 역할은?\nI heard that she won the prize.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 3, "e": "heard의 목적어 → 명사절"}, {"k": "ch", "q": "문장에서 'in the box'의 역할은?\nThe toys in the box are old.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 1, "e": "명사 toys를 꾸밈 → 형용사구"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He speaks Chinese well.\nⓑ The flower smells nicely.\nⓒ I saw him at the station.\nⓓ We stayed inside because of it was cold.\nⓔ She is a lovely girl.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ nice / ⓓ because"}, {"k": "ch", "q": "'a pilot'의 문장 성분이 나머지와 다른 것은?", "o": ["Her dad is a pilot.", "He became a pilot.", "I met a pilot at the airport.", "My uncle was a pilot.", "Junho will be a pilot."], "a": 2, "e": "③ 목적어 / 나머지는 보어"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I fell asleep ____ the movie.", "o": ["while", "during", "when", "because", "if"], "a": 1, "e": "뒤에 구(명사) → during"}, {"k": "ch", "q": "다음 문장에서 주요 성분(주어·동사·목적어·보어)의 핵심 단어만 바르게 남긴 것은?\nMy little sister drank warm milk slowly in the kitchen.", "o": ["sister drank milk", "My little sister drank", "drank warm milk slowly", "sister drank in the kitchen", "milk slowly in the kitchen"], "a": 0, "e": "주어 sister / 동사 drank / 목적어 milk — 나머지는 수식어"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["She looks happy.", true], ["Him is my teacher.", false], ["He drives very carefully.", true], ["This is an easily question.", false], ["I met her at the library.", true], ["We were late because of the traffic.", true], ["The soup tastes salty.", true], ["He speaks English good.", false], ["I slept during the flight.", true], ["She left while the meeting.", false], ["They call me Junie.", true], ["The news made we sad.", false]], "e": "ⓑ He ⓓ easy ⓗ well ⓙ during ⓛ us"}, {"k": "m12", "q": "다음 12개 중 절이 아닌 것(구)을 모두 고르시오.", "s": [["when I was a child", true], ["in the morning", false], ["because it was cold", true], ["to play the piano", false], ["that he is right", true], ["during the vacation", false], ["if you have time", true], ["my best friend", false], ["after she left", true], ["before dinner", false], ["while we were talking", true], ["I know", true]], "e": "구: ⓑ ⓓ ⓕ ⓗ ⓙ (주어 + 동사 없음)"}, {"k": "wr", "q": "다음 문장에서 부사절을 찾아 쓰시오. Because it was very hot, we went swimming.", "a": ["Because it was very hot"], "e": "이유 → 부사절"}, {"k": "wr", "q": "빈칸에 because와 because of 중 알맞은 것을 쓰시오. He couldn't sleep ____ the noise.", "a": ["because of"], "e": "뒤에 구(명사) → because of"}]}}, {"book": "hk2", "chapter": {"id": "01", "name": "문장의 형식", "title": "해커스 중학영문법 2학년 · Chapter 1 문장의 형식"}, "units": [{"tag": "hk2-01-1-1", "name": "1형식과 2형식", "talk": [{"k": "m", "t": "Chapter 1은 **문장의 형식**! 중1에서 배운 다섯 가지 뼈대를 중2 수준으로 더 깊게 가요 🦴"}, {"k": "m", "t": "**1형식** S + V: 동사만으로 뜻이 완성. 뒤의 장소·시간 표현은 수식어. **There + be동사 + 주어**도 1형식!"}, {"k": "ex", "en": "There are three cats on the roof.", "ko": "지붕 위에 고양이 세 마리가 있다. (주어 = three cats)"}, {"k": "q", "q": "There ____ a lot of people in the park.", "o": ["is", "are", "be"], "a": 1, "ok": "맞아요! 주어 a lot of people이 복수 → are", "no": "There 뒤의 명사가 주어 → people(복수) → are"}, {"k": "m", "t": "**2형식** S + V + C: be·become 말고도 상태·변화를 나타내는 동사가 많아요."}, {"k": "m", "t": "상태 유지: keep, stay, remain(~인 채로 있다) / 변화: get, grow, turn, go, come, fall(~하게 되다)"}, {"k": "ex", "en": "The milk went bad. / Her dream came true.", "ko": "우유가 상했다. / 그녀의 꿈이 이루어졌다."}, {"k": "ex", "en": "He fell asleep. / She remained silent.", "ko": "그는 잠이 들었다. / 그녀는 침묵을 지켰다."}, {"k": "m", "t": "seem·appear '~인 것 같다, ~처럼 보이다'도 2형식: He seems [tired]."}, {"k": "q", "q": "The leaves turn ____ in fall.", "o": ["red", "redly", "to red"], "a": 0, "ok": "정확해요! turn + 형용사", "no": "2형식 보어 자리 → 형용사 red"}, {"k": "m", "t": "⚠️ 보어 자리는 **형용사**(부사 ✗): stay calmly ✗ → stay calm"}, {"k": "m", "t": "정리! **1형식 S + V(+ 수식어), There + be / 2형식 S + V + C(명사·형용사)** 👍"}], "notes": {"table": [["형식", "구조", "동사 예"], ["1형식", "S + V (+ 수식어)", "go, come, arrive, happen, live, There + be"], ["2형식 (상태)", "S + V + C", "be, keep, stay, remain"], ["2형식 (변화)", "S + V + C", "become, get, grow, turn, go, come, fall"], ["2형식 (판단)", "S + V + C", "seem, appear"]], "tips": ["go bad(상하다), go wrong(잘못되다), come true(실현되다), fall asleep(잠들다), get dark(어두워지다)", "There + be 뒤의 명사가 주어 → 수 일치", "보어 자리에 부사(-ly) ✗"]}, "sets": {"workbook": [{"k": "ch", "q": "The accident happened last night. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 0, "e": "accident(S) + happened(V), last night는 수식어"}, {"k": "ch", "q": "Her face turned pale. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 1, "e": "pale = 주격 보어"}, {"k": "ch", "q": "There is a bank near my house. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 0, "e": "There + be + 주어 → 1형식"}, {"k": "ch", "q": "He remained calm during the test. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 1, "e": "calm = 주격 보어"}, {"k": "pk", "q": "The food went [bad*/badly].", "e": "go + 형용사 (상하다)"}, {"k": "pk", "q": "Please stay [quiet*/quietly].", "e": "stay + 형용사"}, {"k": "pk", "q": "There [is/are*] two pens in my bag.", "e": "주어 two pens → are"}, {"k": "bl", "q": "그녀의 꿈이 이루어졌다. → Her dream (came) true.", "e": "come true"}, {"k": "bl", "q": "그 아기는 곧 잠들었다. → The baby soon (fell) asleep.", "e": "fall asleep"}, {"k": "fx", "q": "He seems happily today.", "w": "happily", "a": ["happy"], "e": "seem + 형용사"}], "practiceA": [{"k": "ch", "q": "문장의 형식이 나머지 넷과 다른 것은?", "o": ["The bus arrived on time.", "Something strange happened.", "There is a cat under the car.", "The soup got cold.", "My family lives in Incheon."], "a": 3, "e": "④ 2형식 / 나머지  in the evening.", "e": "turn + 형용사"}, {"k": "or", "q": "그녀는 시험 내내 침착함을 유지했다.", "a": "She stayed calm during the test.", "e": "stay + 형용사"}, {"k": "wr", "q": "그 우유는 상했다. (the milk, go, bad)", "a": ["The milk went bad.", "The milk has gone bad."], "e": "go bad"}, {"k": "wr", "q": "그의 꿈이 마침내 이루어졌다. (his dream, finally, come true)", "a": ["His dream finally came true.", "Finally his dream came true.", "Finally, his dream came true.", "His dream came true finally."], "e": "come true"}, {"k": "fx", "q": "There is three bottles of water in the fridge.", "w": "is", "a": ["are"], "e": "주어 three bottles → are"}, {"k": "fx", "q": "The room got warmly after an hour.", "w": "warmly", "a": ["warm"], "e": "get + 형용사"}]}}, {"tag": "hk2-01-1-2", "name": "2형식: 감각동사", "talk": [{"k": "m", "t": "2형식의 대표 선수 **감각동사**! look · sound · smell · taste · feel 👀👂👃👅✋"}, {"k": "m", "t": "감각동사 + **형용사**: You look [tired]. / That sounds great."}, {"k": "q", "q": "The pie smells ____.", "o": ["wonderful", "wonderfully", "wonder"], "a": 0, "ok": "맞아요! smell + 형용사", "no": "감각동사 뒤 보어 → 형용사 wonderful"}, {"k": "m", "t": "⚠️ 함정 1: -ly로 끝나는 **형용사** friendly · lovely · lonely · lively는 감각동사 뒤에 쓸 수 있어요! He looks friendly. ✔"}, {"k": "q", "q": "She looks ____ in that dress.", "o": ["lovely", "beautifully", "prettily"], "a": 0, "ok": "정확해요! lovely는 형용사", "no": "lovely는 -ly지만 형용사 → look lovely ✔ / beautifully·prettily는 부사"}, {"k": "m", "t": "⚠️ 함정 2: 뒤에 **명사**가 오면 감각동사 + **like** + 명사: It sounds like a good idea."}, {"k": "ex", "en": "This candy tastes like strawberries.", "ko": "이 사탕은 딸기 같은 맛이 난다."}, {"k": "m", "t": "⚠️ 함정 3: 감각동사가 **목적어**를 가지면 3형식! 이때는 뒤에 부사도 올 수 있어요: He tasted the soup carefully."}, {"k": "ex", "en": "I felt the wind on my face.", "ko": "나는 얼굴에 바람을 느꼈다. (3형식)"}, {"k": "q", "q": "2형식인 문장은?", "o": ["She tasted the cake.", "The cake tasted sweet.", "He smelled the roses."], "a": 1, "ok": "맞아요! sweet = 케이크의 상태(보어)", "no": "the cake·the roses는 목적어(3형식) / sweet는 보어(2형식)"}, {"k": "m", "t": "정리! **감각동사 + 형용사 / + like + 명사 / 목적어가 오면 3형식** 👍"}], "notes": {"table": [["형태", "예", "형식"], ["감각동사 + 형용사", "It smells good.", "2형식"], ["감각동사 + like + 명사", "He looks like a model.", "2형식"], ["감각동사 + 목적어", "I smelled smoke.", "3형식"]], "tips": ["-ly 형용사: friendly, lovely, lonely, lively, ugly → 감각동사 뒤 OK", "look like + 명사 / look + 형용사 (look like happy ✗)", "우리말이 '~하게'여도 감각동사 뒤는 형용사"]}, "sets": {"workbook": [{"k": "pk", "q": "Your voice sounds [strange*/strangely] today.", "e": "sound + 형용사"}, {"k": "pk", "q": "This scarf feels [soft*/softly].", "e": "feel + 형용사"}, {"k": "pk", "q": "The new teacher looks [friendly*/nicely].", "e": "friendly는 형용사"}, {"k": "pk", "q": "This tea tastes [like*/×] lemon.", "e": "명사 앞 → taste like"}, {"k": "bl", "q": "그 노래는 아름답게 들린다. → The song (sounds) beautiful.", "e": "sound + 형용사"}, {"k": "bl", "q": "그는 그의 아버지처럼 보인다. → He (looks) (like) his father.", "e": "look like + 명사"}, {"k": "bl", "q": "이 수프는 이상한 맛이 난다. → This soup (tastes) strange.", "e": "taste + 형용사"}, {"k": "ox", "q": "The boy looked happily.", "a": false, "e": "look + 형용사 → happy"}, {"k": "ox", "q": "She smelled the milk carefully.", "a": true, "e": "smell + 목적어 → 3형식, 부사 OK ✔"}, {"k": "fx", "q": "The bread smells deliciously.", "w": "deliciously.", "a": ["delicious"], "e": "smell + 형용사"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? The girl looks ____.", "o": ["lovely", "friendly", "sadly", "pretty", "lonely"], "a": 2, "e": "③ 부사 ✗ / 나머지는 형용사"}, {"k": "ch", "q": "빈칸에 like가 필요한 것은?", "o": ["It sounds ____ great.", "She looks ____ an angel.", "I feel ____ sleepy.", "It smells ____ bad.", "This tastes ____ sour."], "a": 1, "e": "② 명사 an angel 앞 → look like"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The music sounds loud.", "He looks like a famous actor.", "She felt the cold wind.", "This fabric feels smoothly.", "The fruit smells fresh."], "a": 3, "e": "④ feels smooth"}, {"k": "ch", "q": "문장의 형식이 나머지와 다른 것은?", "o": ["The bread smells good.", "I smelled the coffee.", "You look great." nd + 형용사"}, {"k": "or", "q": "이 장미들은 달콤한 향기가 난다.", "a": "These roses smell sweet.", "e": "smell + 형용사"}, {"k": "or", "q": "그 가수는 영화배우처럼 보인다.", "a": "The singer looks like a movie star.", "e": "look like + 명사"}, {"k": "fx", "q": "The music sounded sadly to me.", "w": "sadly", "a": ["sad"], "e": "sound + 형용사"}, {"k": "fx", "q": "That rock looks a bear.", "w": "looks", "a": ["looks like"], "e": "명사 앞 → looks like"}]}}, {"tag": "hk2-01-2", "name": "3형식과 4형식", "talk": [{"k": "m", "t": "**3형식** S + V + O / **4형식** S + V + 간접목적어(~에게) + 직접목적어(~을) — 4형식 동사는 '주다' 계열 **수여동사** 🎁"}, {"k": "ex", "en": "She gave me a book.", "ko": "그녀는 나에게 책을 주었다."}, {"k": "m", "t": "4형식 → 3형식: 직접목적어(물건)를 앞으로, 간접목적어(사람) 앞에 **전치사**"}, {"k": "m", "t": "**to**: give, send, show, tell, teach, lend, bring, write, sell / **for**: make, buy, cook, get, find, build / **of**: ask"}, {"k": "ex", "en": "He bought me a cap. → He bought a cap for me.", "ko": "그는 나에게 모자를 사 주었다."}, {"k": "q", "q": "She showed her photos ____ us.", "o": ["to", "for", "of"], "a": 0, "ok": "맞아요! show → to", "no": "show는 to를 쓰는 동사"}, {"k": "q", "q": "Can I ask a favor ____ you?", "o": ["to", "for", "of"], "a": 2, "ok": "정확해요! ask → of", "no": "ask는 of를 쓰는 동사"}, {"k": "m", "t": "⚠️ 중2 포인트! **3형식으로만** 쓰는 동사: explain, say, suggest, introduce, describe → explain me the rule ✗ / explain the rule [to] me ✔"}, {"k": "q", "q": "어법상 옳은 것은?", "o": ["He explained me the problem.", "He explained the problem to me.", "He explained the problem for me."], "a": 1, "ok": "맞아요! explain + 물건 + to + 사람", "no": "explain은 4형식 ✗ → explain the problem to me"}, {"k": "m", "t": "⚠️ 직접목적어가 **대명사**(it, them)면 3형식으로: Give it to me. (Give me it ✗)"}, {"k": "m", "t": "정리! **to / for / of 구별 + explain·say·suggest·introduce·describe는 3형식만** 👍"}], "notes": {"table": [["전치사", "동사", "예"], ["to", "give, send, show, tell, teach, lend, bring, write, sell", "I sent a card to her."], ["for", "make, buy, cook, get, find, build", "Mom cooked dinner for us."], ["of", "ask", " essage.", "a": ["He sent a text message to me."], "e": "send → to"}, {"k": "wr", "q": "3형식을 4형식으로 바꾸시오. She asked a question of the teacher.", "a": ["She asked the teacher a question."], "e": "ask + 사람 + 물건"}, {"k": "wr", "q": "그는 우리에게 그 규칙을 설명했다. (explain, the rule, us)", "a": ["He explained the rule to us."], "e": "explain은 3형식만"}, {"k": "or", "q": "할머니는 우리에게 맛있는 쿠키를 구워 주셨다.", "a": "Grandma baked delicious cookies for us.", "e": "bake → for"}, {"k": "fx", "q": "Jenny introduced her parents me.", "w": "me.", "a": ["to me"], "e": "introduce + 사람 → to me"}, {"k": "fx", "q": "Can you lend some money for me?", "w": "for", "a": ["to"], "e": "lend → to"}]}}, {"tag": "hk2-01-3-1", "name": "5형식: 명사나 형용사를 목적격 보어로 쓰는 동사", "talk": [{"k": "m", "t": "**5형식** S + V + O + OC — 목적격 보어(OC)가 목적어를 설명해요 🎯 (목적어 = 보어, 또는 목적어가 보어한 상태)"}, {"k": "m", "t": "명사 보어: call, name, make, elect, choose — We elected Jisu [captain]."}, {"k": "ex", "en": "They named the robot Robi.", "ko": "그들은 그 로봇을 Robi라고 이름 지었다. (the robot = Robi)"}, {"k": "m", "t": "형용사 보어: make, keep, find, leave — The news made me [sad]."}, {"k": "ex", "en": "Don't leave the door open.", "ko": "문을 열어 둔 채로 두지 마라."}, {"k": "q", "q": "Exercise keeps you ____.", "o": ["healthy", "healthily", "health"], "a": 0, "ok": "맞아요! 목적격 보어 → 형용사", "no": "keep + 목적어 + 형용사 → healthy"}, {"k": "m", "t": "⚠️ find 함정! I found the book **easy**. (5형식: 책이 쉽다는 것을 알았다) / I found the book **easily**. (3형식: 책을 쉽게 찾았다)"}, {"k": "q", "q": "I found the movie ____. (영화가 지루하다는 것을 알았다)", "o": ["boring", "boringly", "bore"], "a": 0, "ok": "정확해요! 영화의 상태 → 형용사", "no": "'영화가 지루하다' → 목적격 보어 형용사 boring"}, {"k": "m", "t": "⚠️ make 함정! Mom made me a doll. (4형식: me ≠ doll) / The song made her a star. (5형식: her = star)"}, {"k": "q", "q": "He made his son a kite. 는 몇 형식?", "o": ["3형식", "4형식", "5형식"], "a": 1, "ok": "맞아요! son ≠ kite → 4형식", "no": "아들 ≠ 연 → '아들에게 연을 만들어 주었다' 4형식"}, {"k": "m", "t": "정리! **목적격 보어 = 명사·형용사 (부사 ✗) / find·make 형식 구별** 👍"}], "notes": {"table": [[
