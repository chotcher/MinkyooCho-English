"a": ["has"], "e": "has finished(완료) → has"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["Cats sleep much longer than dogs do.", "The weather today is warmer than it was yesterday.", "She speaks Chinese as fluently as her mother does.", "He didn't call me, and neither does his sister.", "I will join the club if my best friend does."], "a": 3, "e": "④ didn't call → neither did"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• My father drinks less coffee now than he ____ ten years ago.\n• The tickets were more expensive than we ____ expected.", "o": ["does – have", "did – had", "did – have", "was – had", "does – had"], "a": 1, "e": "ten years ago → did / 기대했던 것은 그 전 → had (expected)"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: I'm really worried about the final exam.\nB: So ____ I. Let's study together.", "o": ["am", "do", "have", "was", "will"], "a": 0, "e": "I'm worried(be동사 현재) → So am I"}, {"k": "pk", "q": "People in big cities walk faster than people in small towns [do*/are].", "e": "walk(일반동사) → do"}, {"k": "pk", "q": "My sister wasn't at the party, and neither [was*/did] I.", "e": "wasn't(be동사) → was"}, {"k": "pk", "q": "He had prepared for the interview more carefully than anyone else [had*/was].", "e": "had prepared(과거완료) → had"}, {"k": "bl", "q": "우리 팀은 지난 시즌보다 이번 시즌에 더 많은 경기를 이겼다. → Our team won more games this season than it (did) last season.", "e": "won(과거 일반동사) → did"}, {"k": "bl", "q": "Tom은 수영을 잘 못하고, 나도 그렇다. → Tom can't swim well, and (neither|nor) (can) I.", "e": "can't → neither can I"}, {"k": "fx", "q": "Jisoo didn't know the answer to the question, and neither knew I.", "w": "knew", "a": ["did"], "e": "neither + 대동사 did + 주어"}, {"k": "ox", "q": "The population of this city is growing faster than that of the capital does.", "a": false, "e": "is growing(be동사 진행) → is"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She dances better than her teacher does.\nⓑ I have seen the movie twice, and so has my brother.\nⓒ He was late for school, and so did his friend.\nⓓ Prices are higher now than they were five years ago.\nⓔ My parents don't eat meat, and neither does my sister.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ was late → so was"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• Elephants live longer than most other animals (A)[are / do].\n• My grades this semester are better than they (B)[were / did] last semester.\n• Jake wasn't invited, and neither (C)[was / did] Sarah.", "o": ["are – were – was", "do – were – was", "do – did – did", "are – did – was", "do – were – did"], "a": 1, "e": "(A) live → do (B) are(be동사) + last semester → were (C) wasn't → was"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The plants in the garden need more water than they did last summer.", "Few people read newspapers as carefully as my grandfather does.", "She has always worked harder than her classmates have.", "If anyone can solve this puzzle, Minho can.", "My phone battery lasts longer than yours is."], "a": 4, "e": "⑤ lasts(일반동사) → does"}, {"k": "pk", "q": "The students in Class 2 scored higher on the test than those in Class 1 [did*/were].", "e": "scored(과거 일반동사) → did"}, {"k": "fx", "q": "Children today spend less time outdoors than children in the past are.", "w": "are", "a": ["did"], "e": "spend(일반동사) + in the past → did"}, {"k": "fx", "q": "I haven't finished reading the novel, and neither did my friend Yuna.", "w": "did", "a": ["has"], "e": "haven't finished(완료) → neither has"}, {"k": "or", "q": "그는 예전보다 지금 더 많이 운동한다.", "a": "He exercises more now than he did before.", "e": "exercises → 과거 비교 → did"}, {"k": "or", "q": "그녀는 그 결과에 실망했고, 나도 그랬다.", "a": "She was disappointed with the result, and so was I.", "e": "was → so was I"}, {"k": "wr", "q": "내 남동생은 나보다 더 많이 먹는다. (eat more, than, 대동사를 쓸 것)", "a": ["My brother eats more than I do.", "My younger brother eats more than I do.", "My little brother eats more than I do."], "e": "eats(일반동사) → I do"}, {"k": "bl", "q": "A: 나는 그 강의를 전혀 이해하지 못했어. B: 나도 못 했어. 너무 어려웠어. → A: I didn't understand the lecture at all. B: (Neither|Nor) (did) I. It was too difficult.", "e": "didn't understand → Neither did I"}]}}, {"tag": "hof-04-P4", "name": "일반동사의 의미를 강조하는 do동사", "talk": [{"k": "m", "t": "일반동사의 뜻을 **강조**할 때 동사 앞에 **do / does / did**를 붙여요 — '정말(꼭) ~하다' 💪"}, {"k": "ex", "en": "I do remember your name, but I can't remember your face.", "ko": "네 이름은 정말 기억나는데, 얼굴이 기억이 안 나."}, {"k": "m", "t": "⭐ 핵심: 강조의 do 뒤는 **동사원형**! 시제와 수는 do / does / did가 대신 표시해요 → He [did] call me yesterday. (did called ✗)"}, {"k": "q", "q": "She did ____ the report on time, so don't blame her.", "o": ["send", "sent", "sends"], "a": 0, "ok": "맞아요! 강조 did + 원형", "no": "did가 과거를 표시 → 뒤는 원형 send"}, {"k": "q", "q": "He really ____ love his job, although he complains a lot.", "o": ["do", "does", "did"], "a": 1, "ok": "정확해요! 주어 he + 현재 → does", "no": "complains(현재) + 3인칭 단수 → does love"}, {"k": "m", "t": "⚠️ do 세 가지 구별: **강조 do**(뒤에 동사원형) / **대동사 do**(뒤에 동사 없음, 앞 동사 대신) / **일반동사 do**(~을 하다)"}, {"k": "q", "q": "강조의 do가 쓰인 문장은?", "o": ["I did my homework.", "I did finish my homework.", "She studies harder than I do."], "a": 1, "ok": "맞아요! did + 원형 finish", "no": "did 뒤에 동사원형이 있어야 강조 → did finish"}, {"k": "m", "t": "명령문도 강조 가능: **Do** be careful! / **Do** come in and sit down."}, {"k": "m", "t": "정리! **do / does / did + 동사원형 = 정말 ~하다 · 시제·수는 do가 표시** 👍 🎉 Chapter 4 조동사 끝!"}], "notes": {"table": [["형태", "의미", "예"], ["do + 원형", "정말 ~하다 (현재)", "I do believe you."], ["does + 원형", "정말 ~하다 (3인칭 단수 현재)", "She does look tired."], ["did + 원형", "정말 ~했다 (과거)", "He did tell me the truth."], ["Do + 원형 ~!", "꼭 ~해라 (명령 강조)", "Do be quiet!"]], "tips": ["강조 do 뒤는 원형: did called ✗, does likes ✗", "주어·시제에 맞춰 do / does / did 고르기", "대동사 do는 뒤에 동사가 없음 (than I do)"]}, "sets": {"workbook": [{"k": "pk", "q": "I [did lock*/did locked] the door before I left, but it was open when I came back.", "e": "did + 원형"}, {"k": "pk", "q": "My grandmother [does*/do] enjoy watching old movies on weekends.", "e": "3인칭 단수 현재 → does"}, {"k": "pk", "q": "Although he rarely says so, he really [does care*/does cares] about his students.", "e": "does + 원형"}, {"k": "pk", "q": "We [did*/do] try our best in last year's final, but we lost.", "e": "last year → did"}, {"k": "bl", "q": "나는 정말로 그 편지를 보냈어! → I (did) send the letter!", "e": "과거 강조 → did"}, {"k": "bl", "q": "그 식물은 정말 햇빛을 많이 필요로 한다. → The plant (does) need a lot of sunlight.", "e": "3인칭 단수 현재 → does"}, {"k": "bl", "q": "제발 조심해! → (Do) be careful!", "e": "명령문 강조"}, {"k": "bl", "q": "그들은 정말로 그 문제를 해결했다. → They did (solve) the problem.", "e": "did + 원형"}, {"k": "fx", "q": "Jiwoo does speaks French, but she is too shy to use it in class.", "w": "speaks", "a": ["speak"], "e": "does + 원형"}, {"k": "fx", "q": "The old bridge did looked dangerous, so we took another road.", "w": "looked", "a": ["look"], "e": "did + 원형"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["I do believe that you will pass the exam.", "Minsu did win the contest, though nobody expected it.", "She does want to join us, but she has to work tonight.", "They did enjoyed the trip to the mountains last summer.", "Do take a seat and make yourself at home."], "a": 3, "e": "④ did enjoy"}, {"k": "ch", "q": "did의 쓰임이 나머지 넷과 다른 것은?", "o": ["He did call me last night.", "I did finish the work on time.", "She did look tired after the trip.", "They did their best in the game.", "We did see a shooting star yesterday."], "a": 3, "e": "④ 일반동사 do(~을 하다) / 나머지는 강조"}, {"k": "ch", "q": "빈칸에 알맞은 것은? My little brother hates vegetables, but he ____ like carrots.", "o": ["do", "does", "did", "is", "has"], "a": 1, "e": "현재 + 3인칭 단수 → does + 원형"}, {"k": "pk", "q": "Although the plan sounded strange, it [did work*/did worked] in the end.", "e": "did + 원형"}, {"k": "pk", "q": "My dad [does*/do] cook dinner on Sundays, even though he is very busy.", "e": "3인칭 단수 → does"}, {"k": "pk", "q": "The medicine [did help*/did helped] me sleep better last night.", "e": "did + 원형"}, {"k": "bl", "q": "나는 정말로 네가 그 시험에 합격하기를 바란다. → I (do) hope that you pass the exam.", "e": "현재 강조 → do"}, {"k": "bl", "q": "그녀는 어제 정말로 숙제를 끝냈다. → She (did) finish her homework yesterday.", "e": "과거 강조 → did"}, {"k": "fx", "q": "Ms. Han does remembers every student's name, even after many years.", "w": "remembers", "a": ["remember"], "e": "does + 원형"}, {"k": "ox", "q": "The movie was long, but we did enjoy every minute of it.", "a": true, "e": "✔ did + 원형"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He does looks like his father.\nⓑ I did see her at the station this morning.\nⓒ Do be quiet in the library.\nⓓ My cat do sleep a lot during the day.\nⓔ The students did understand the lesson.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ does look / ⓓ does sleep"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• I (A)[do / did] tell you about the meeting yesterday!\n• The new teacher (B)[does / do] seem kind and patient.\n• We did (C)[warn / warned] him, but he didn't listen.", "o": ["do – does – warn", "did – does – warn", "did – do – warned", "did – does – warned", "do – do – warn"], "a": 1, "e": "(A) yesterday → did (B) 3인칭 단수 → does (C) did + 원형"}, {"k": "ch", "q": "do의 쓰임이 나머지 넷과 다른 것은?", "o": ["I do love this song.", "She does know the answer.", "He runs faster than I do.", "They do want to help you.", "We did leave early."], "a": 2, "e": "③ 대동사(= run) / 나머지는 강조"}, {"k": "pk", "q": "She says she didn't see me, but she [did*/does] see me at the mall last Saturday.", "e": "last Saturday → did"}, {"k": "fx", "q": "Even though he failed the first time, Junho did passed the driving test on his second try.", "w": "passed", "a": ["pass"], "e": "did + 원형"}, {"k": "fx", "q": "The children do loves the new playground next to the school.", "w": "loves", "a": ["love"], "e": "do + 원형"}, {"k": "or", "q": "나는 정말로 그 영화를 즐겼다.", "a": "I did enjoy the movie.", "e": "did + 원형"}, {"k": "or", "q": "그는 정말로 너를 걱정한다.", "a": "He does worry about you.", "e": "does + 원형"}, {"k": "wr", "q": "그녀는 어젯밤 정말로 나에게 전화했다. (did를 쓸 것, call me, last night)", "a": ["She did call me last night.", "Last night she did call me.", "Last night, she did call me."], "e": "did + 원형"}, {"k": "bl", "q": "A: 너 방 청소 안 했지, 그렇지? B: 정말 청소했어! 얼마나 깔끔한지 봐. → A: You didn't clean your room, did you? B: I (did) (clean) it! Look how neat it is.", "e": "did + 원형"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그는 어젯밤 늦게까지 깨어 있었음에 틀림없다. (must, stay up late, last night)", "a": ["He must have stayed up late last night.", "Last night he must have stayed up late.", "Last night, he must have stayed up late."], "e": "must have p.p."}, {"k": "wr", "q": "너는 그에게 사과했어야 했다. (should, apologize to him)", "a": ["You should have apologized to him.", "You should have apologised to him."], "e": "should have p.p."}, {"k": "wr", "q": "그 의사는 그가 매일 물을 더 마셔야 한다고 권했다. (recommend, drink more water, every day)", "a": ["The doctor recommended that he drink more water every day.", "The doctor recommended that he should drink more water every day.", "The doctor recommended he drink more water every day.", "The doctor recommended he should drink more water every day."], "e": "권고 → (should) 원형"}, {"k": "wr", "q": "그녀는 나보다 더 빨리 달린다. (run faster, 대동사를 쓸 것)", "a": ["She runs faster than I do."], "e": "runs → I do"}, {"k": "wr", "q": "나는 정말로 그 문을 잠갔다. (did, lock the door)", "a": ["I did lock the door."], "e": "did + 원형"}, {"k": "bl", "q": "지수가 나를 봤을 리가 없어. 나는 커튼 뒤에 숨어 있었어. → Jisu can't have (seen) me. I was hiding behind the curtain.", "e": "can't have p.p."}, {"k": "bl", "q": "The witness insisted that the man (had) stolen the bag. (사실 주장)", "e": "사실 주장 → had p.p."}, {"k": "fx", "q": "The teacher demanded that every student hands in the essay by Friday.", "w": "hands", "a": ["hand", "should hand"], "e": "요구 → (should) hand"}, {"k": "fx", "q": "I wasn't tired after the long walk, and neither did my brother.", "w": "did", "a": ["was"], "e": "wasn't → neither was"}, {"k": "or", "q": "그가 그 창문을 깼을 리가 없다.", "a": "He can't have broken the window.", "e": "can't have p.p."}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? The floor is wet. Someone ____ water on it a few minutes ago.", "o": ["must spill", "must have spilled", "should spill", "can't have spilled", "should have spilled"], "a": 1, "e": "몇 분 전 일 확신 → must have p.p."}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["You should have taken the subway instead of the bus.", "She might have forgotten our appointment.", "The hikers must have lost their way in the fog last night.", "He cannot have wrote such a long novel in a month.", "It may snow heavily this weekend."], "a": 3, "e": "④ cannot have written"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• The coach insisted that the players ____ more water during practice.\n• The boy's red eyes suggested that he ____ crying.", "o": ["drink – had been", "drink – be", "drank – be", "drinks – had been", "drank – had been"], "a": 0, "e": "당위 주장 → drink / 암시(사실) → had been"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? The teacher ____ that we bring our own lunch tomorrow.", "o": ["suggested", "demanded", "recommended", "requested", "believed"], "a": 4, "e": "believe는 당위 동사가 아님"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["It is required that every student wears a uniform.", "She advised that he goes to the hospital.", "They proposed that the meeting be delayed.", "The evidence suggested that he be guilty.", "He demanded that she returned the book at once."], "a": 2, "e": "③ / ① wear ② go ④ was ⑤ return"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I didn't like the soup, and neither ____ my sister.", "o": ["was", "did", "does", "had", "is"], "a": 1, "e": "didn't like → neither did"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He travels abroad more often than his wife does.", "The room was cleaner than it had been before.", "I can't drive, and neither can my brother.", "You look happier today than you did yesterday.", "She has read more books than I am."], "a": 4, "e": "⑤ has read(완료) → have"}, {"k": "ch", "q": "do의 쓰임이 <보기>와 같은 것은?\n<보기> I do want to see you again.", "o": ["Do you know her?", "I did my homework.", "She does look tired.", "He sings better than I do.", "What did you do last night?"], "a": 2, "e": "강조의 do + 원형"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• You (A)[should have / should] called me before you came yesterday.\n• The rule requires that each member (B)[pay / pays] a fee.\n• He swims faster than his brother (C)[is / does].", "o": ["should have – pay – does", "should – pay – does", "should have – pays – does", "should have – pay – is", "should – pays – is"], "a": 0, "e": "(A) 과거 후회 → should have (B) 요구 → pay (C) swims → does"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He must have been sick yesterday.\nⓑ I did told you the truth.\nⓒ She suggested that we take a break.\nⓓ Tom likes pizza, and so do I.\nⓔ You shouldn't have spend all your money.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ did tell / ⓔ shouldn't have spent"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n그녀는 그 사실을 알았을지도 모른다.", "o": ["She may know the truth.", "She may have known the truth.", "She must have known the truth.", "She should have known the truth.", "She can't have known the truth."], "a": 1, "e": "~했을지도 모른다 → may have p.p."}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The ground is wet, so it must have rained last night.", true], ["You should have listen to your teacher.", false], ["She might have left her bag in the classroom.", true], ["The manager insisted that the report be finished by noon.", true], ["The doctor recommended that she takes a rest.", false], ["His smile suggested that he was satisfied.", true], ["I enjoy hiking more than my sister does.", true], ["He hasn't eaten lunch, and neither did I.", false], ["I do remember the day we first met.", true], ["She did worked hard on the project.", false], ["They can't have finished the job so quickly.", true], ["We were tired, and so were our parents.", true]], "e": "ⓑ should have listened ⓔ (should) take ⓗ neither have I ⓙ did work"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["He may has forgotten the password.", false], ["You needn't have hurried; the train was late.", true], ["The committee demanded that he resign.", true], ["The officer ordered that the car moved at once.", false], ["The data suggested that the plan had failed.", true], ["My mom cooks better than I do.", true], ["She was nervous, and so did I.", false], ["He does like spicy food.", true], ["Do be careful when you cross the road.", true], ["The baby must be hungry now; she's crying.", true], ["I should have go to bed earlier last night.", false], ["Elephants live longer than horses do.", true]], "e": "ⓐ may have forgotten ⓓ (should) be moved ⓖ so was I ⓚ should have gone"}, {"k": "wr", "q": "같은 뜻이 되도록 조동사 + have p.p.를 써서 쓰시오. It is possible that he missed the train.", "a": ["He may have missed the train.", "He might have missed the train."], "e": "~했을지도 모른다 → may(might) have p.p."}, {"k": "wr", "q": "그 규칙은 모든 학생이 9시까지 등교해야 한다고 요구한다. (require, every student, come to school by nine)", "a": ["The rule requires that every student come to school by nine.", "The rule requires that every student should come to school by nine.", "The rules require that every student come to school by nine.", "The rules require that every student should come to school by nine.", "The rule requires that every student come to school by 9.", "The rule requires that every student should come to school by 9.", "The rules require that every student come to school by 9.", "The rules require that every student should come to school by 9."], "e": "요구 → (should) 원형"}]}}, {"book": "hof", "chapter": {"id": "05", "name": "가정법", "title": "해커스 어법 제대로 · Chapter 5 가정법"}, "units": [{"tag": "hof-05-P1", "name": "가정법 과거 vs. 가정법 과거완료", "talk": [{"k": "m", "t": "Chapter 5는 **가정법**! 사실과 반대를 상상할 때는 동사를 한 시제 **뒤로** 밀어요 ⏪"}, {"k": "m", "t": "**가정법 과거**(현재 사실 반대): If + 주어 + **과거동사**(be → were), 주어 + would / could / might + **동사원형**"}, {"k": "ex", "en": "If I had more time, I would learn to play the guitar.", "ko": "내가 시간이 더 있다면 기타를 배울 텐데. (실제로는 시간이 없다)"}, {"k": "q", "q": "If I ____ you, I would accept the offer.", "o": ["am", "were", "had been"], "a": 1, "ok": "맞아요! 가정법 과거 be → were", "no": "지금 내가 너일 수 없음 → 가정법 과거 were"}, {"k": "m", "t": "**가정법 과거완료**(과거 사실 반대): If + 주어 + **had p.p.**, 주어 + would / could / might + **have p.p.**"}, {"k": "ex", "en": "If she had left earlier, she would have caught the train.", "ko": "그녀가 더 일찍 출발했더라면 그 기차를 탔을 텐데. (실제로는 늦게 출발해서 못 탔다)"}, {"k": "q", "q": "If he ____ harder, he would have passed the exam last year.", "o": ["studied", "had studied", "has studied"], "a": 1, "ok": "정확해요! 과거 사실 반대 → had p.p.", "no": "주절이 would have passed → if절은 had studied"}, {"k": "m", "t": "풀이 전략: if절과 주절을 **짝**으로 확인! 과거 ↔ would + 원형 / had p.p. ↔ would + have p.p. · 시간 단서(now, yesterday, last year)도 체크"}, {"k": "m", "t": "⚠️ **혼합가정법**: If + had p.p.(과거 반대), 주어 + would + **원형** + now(현재 반대) — 과거의 일이 **지금**에 영향을 줄 때"}, {"k": "q", "q": "If I had taken the medicine, I would ____ better now.", "o": ["feel", "have felt", "felt"], "a": 0, "ok": "맞아요! now → 혼합가정법 would + 원형", "no": "주절에 now → 현재 반대 → would feel"}, {"k": "m", "t": "if 생략 도치: If I were ~ = **Were I** ~ / If I had known ~ = **Had I known** ~"}, {"k": "m", "t": "정리! **과거 ↔ would 원형 / had p.p. ↔ would have p.p. / had p.p. + now → would 원형** 👍"}], "notes": {"table": [["종류", "if절", "주절", "의미"], ["가정법 과거", "If + 주어 + 과거동사(were)", "would / could / might + 원형", "현재 사실 반대"], ["가정법 과거완료", "If + 주어 + had p.p.", "would / could / might + have p.p.", "과거 사실 반대"], ["혼합가정법", "If + 주어 + had p.p.", "would / could + 원형 (now)", "과거 일 → 현재 결과"], ["if 생략 도치", "Were + 주어 ~ / Had + 주어 + p.p. ~", "(위와 같음)", "If I were ~ / If I had p.p. ~"]], "tips": ["가정법 과거의 be동사는 주어와 관계없이 were", "If it were not for ~ = ~이 없다면 / If it had not been for ~ = ~이 없었다면", "주절에 now, today → 혼합가정법 의심"]}, "sets": {"workbook": [{"k": "pk", "q": "If I [had*/have] a car, I could drive you to the airport. (실제로는 차가 없다)", "e": "현재 사실 반대 → 과거동사"}, {"k": "pk", "q": "If it [had not rained*/did not rain] yesterday, we would have gone hiking.", "e": "yesterday + would have gone → had p.p."}, {"k": "pk", "q": "If she were here now, she [would know*/would have known] what to do.", "e": "가정법 과거 → would + 원형"}, {"k": "pk", "q": "If you had asked me, I [would have helped*/would help] you with the move last weekend.", "e": "had p.p. + last weekend → would have p.p."}, {"k": "bl", "q": "내가 새라면 하늘을 날 수 있을 텐데. → If I (were) a bird, I could fly in the sky.", "e": "가정법 과거 be → were"}, {"k": "bl", "q": "그가 진실을 말했더라면 그녀는 화를 내지 않았을 텐데. → If he had told the truth, she (wouldn't|would not) have been angry.", "e": "가정법 과거완료"}, {"k": "bl", "q": "우리가 지도를 가져왔더라면 길을 잃지 않았을 텐데. → If we (had) (brought) a map, we wouldn't have gotten lost.", "e": "had p.p. / bring – brought – brought"}, {"k": "bl", "q": "내가 그 답을 안다면 너에게 말해 줄 텐데. → If I (knew) the answer, I would tell you.", "e": "가정법 과거 → 과거동사"}, {"k": "fx", "q": "If I had known about the party, I would have go with you.", "w": "go", "a": ["gone"], "e": "would have + p.p."}, {"k": "fx", "q": "If he has more money, he would buy a new laptop.", "w": "has", "a": ["had"], "e": "would + 원형 ↔ if절 과거동사"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["If I were taller, I could reach the top shelf.", "If they had left on time, they wouldn't have missed the flight.", "If she studied harder, she would get better grades.", "If we had known the truth, we would tell you then.", "If it were not for water, nothing could live on Earth."], "a": 3, "e": "④ then(과거) → would have told"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• If I (A)[am / were] rich, I would travel around the world.\n• If you had called me, I (B)[would pick / would have picked] you up at the station yesterday.\n• If I hadn't stayed up late last night, I (C)[wouldn't be / wouldn't have been] so tired now.", "o": ["am – would pick – wouldn't be", "were – would have picked – wouldn't be", "were – would pick – wouldn't have been", "were – would have picked – wouldn't have been", "am – would have picked – wouldn't be"], "a": 1, "e": "(A) were (B) yesterday → would have picked (C) now → 혼합가정법 wouldn't be"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은?\nIf he had been careful, he wouldn't have broken the vase.", "o": ["As he is careful, he doesn't break the vase.", "As he was careful, he didn't break the vase.", "As he wasn't careful, he broke the vase.", "As he isn't careful, he breaks the vase.", "As he wasn't careful, he didn't break the vase."], "a": 2, "e": "가정법 과거완료 → 과거 사실 반대: 조심하지 않아서 깼다"}, {"k": "pk", "q": "[Had I known*/Did I know] that you were sick, I would have visited you.", "e": "if 생략 도치 → Had I known"}, {"k": "pk", "q": "If the bridge [had been*/were] built stronger, it wouldn't have collapsed during the storm last year.", "e": "would have p.p. → had p.p."}, {"k": "pk", "q": "If I [lived*/had lived] near the school, I could sleep a little longer every morning. (지금 학교 근처에 살지 않음)", "e": "현재 사실 반대 → 과거동사"}, {"k": "bl", "q": "그녀가 지금 여기 있다면 우리를 도울 수 있을 텐데. → If she (were) here now, she could help us.", "e": "가정법 과거 be → were"}, {"k": "bl", "q": "그 버스를 탔더라면 나는 지금 집에 있을 텐데. → If I had taken the bus, I (would) be at home now.", "e": "혼합가정법 → would + 원형"}, {"k": "fx", "q": "If the weather had been nice, we would have went to the beach.", "w": "went", "a": ["gone"], "e": "would have + p.p."}, {"k": "ox", "q": "If I had more free time, I would have learned Spanish now.", "a": false, "e": "had(과거) + now → would learn"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I were you, I would apologize first.\nⓑ If he had come earlier, he could have met her.\nⓒ If she knows his number, she would call him.\nⓓ Had we left earlier, we would have arrived on time.\nⓔ If I had eaten breakfast, I wouldn't be hungry now.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ knew"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["If the movie had been shorter, more people would have enjoyed it.", "If I had a brother, I would play soccer with him every day.", "If you had followed the instructions, the machine would have worked.", "If it had not been for your help, I would have failed.", "If we have enough money, we would have bought the house last year."], "a": 4, "e": "⑤ had had"}, {"k": "ch", "q": "다음 문장을 가정법으로 바르게 바꾼 것은?\nAs I don't have a key, I can't open the door.", "o": ["If I have a key, I can open the door.", "If I had a key, I could open the door.", "If I had had a key, I could have opened the door.", "If I didn't have a key, I couldn't open the door.", "If I had a key, I could have opened the door."], "a": 1, "e": "현재 사실 반대 → 가정법 과거"}, {"k": "pk", "q": "If the doctor had arrived sooner, the patient [might have survived*/might survive].", "e": "had p.p. → might have p.p."}, {"k": "fx", "q": "If Junho had checked the address, he wouldn't go to the wrong building yesterday.", "w": "go", "a": ["have gone"], "e": "yesterday → wouldn't have gone"}, {"k": "fx", "q": "My grandfather passed away. If he were alive, he will be ninety years old this year.", "w": "will", "a": ["would"], "e": "가정법 과거 → would + 원형"}, {"k": "or", "q": "내가 너라면 그 제안을 받아들일 텐데.", "a": "If I were you, I would accept the offer.", "e": "가정법 과거"}, {"k": "or", "q": "그가 서둘렀더라면 그 기차를 탔을 텐데.", "a": "If he had hurried, he would have caught the train.", "e": "가정법 과거완료"}, {"k": "wr", "q": "내가 그녀의 주소를 안다면 그녀에게 편지를 쓸 텐데. (know her address, write to her)", "a": ["If I knew her address, I would write to her.", "I would write to her if I knew her address."], "e": "가정법 과거"}, {"k": "bl", "q": "A: 왜 콘서트에 오지 않았니? B: 아팠어. 몸이 괜찮았더라면 갔을 거야. → A: Why didn't you come to the concert? B: I was sick. If I (had) (been) well, I would have come.", "e": "가정법 과거완료 → had been"}]}}, {"tag": "hof-05-P2", "name": "가정법 vs. 조건 부사절", "talk": [{"k": "m", "t": "if가 있다고 다 가정법은 아니에요! **실제로 일어날 수 있는 일**이면 **조건 부사절**, **사실과 반대**인 상상이면 **가정법** 🤔"}, {"k": "m", "t": "**조건 부사절**: If + 주어 + **현재시제**, 주어 + will / can + 원형 — 미래의 일이라도 if절에는 will ✗"}, {"k": "ex", "en": "If it rains tomorrow, we will cancel the picnic.", "ko": "내일 비가 오면 우리는 소풍을 취소할 것이다. (If it will rain ✗)"}, {"k": "q", "q": "If she ____ the next bus, she will be here in ten minutes.", "o": ["catches", "will catch", "caught"], "a": 0, "ok": "맞아요! 조건 부사절 → 현재시제", "no": "주절 will be → 조건 → if절은 현재 catches"}, {"k": "m", "t": "**가정법**: If + 과거 → would + 원형 / If + had p.p. → would have p.p. — 실제로는 불가능하거나 사실과 반대"}, {"k": "q", "q": "If I ____ a millionaire, I would buy an island.", "o": ["am", "were", "will be"], "a": 1, "ok": "정확해요! 주절 would → 가정법 과거", "no": "would buy → 가정법 → were"}, {"k": "m", "t": "풀이 전략: ① 주절 동사 보기 — **will / can**이면 조건(if절 현재), **would / could**면 가정(if절 과거) ② 문맥 — 일어날 수 있는 일인가, 사실과 반대인가?"}, {"k": "q", "q": "If you ____ me tomorrow morning, I will lend you the book.", "o": ["remind", "reminded", "had reminded"], "a": 0, "ok": "맞아요! 조건 부사절 → 현재", "no": "will lend → 조건 → remind"}, {"k": "m", "t": "**unless** = if ~ not (조건): Unless you hurry, you'll miss the bus. — unless 뒤에 not을 또 쓰지 않기, 미래라도 [unless] + 현재시제"}, {"k": "m", "t": "정리! **조건: If + 현재, will 원형 / 가정: If + 과거, would 원형 · If + had p.p., would have p.p.** 👍"}], "notes": {"table": [["구분", "if절", "주절", "예"], ["조건 부사절", "If + 현재시제", "will / can / may + 원형, 명령문", "If it snows, the school will close."], ["unless", "Unless + 현재시제 (= If ~ not)", "will / can + 원형", "Unless you leave now, you'll be late."], ["가정법 과거", "If + 과거동사", "would / could + 원형", "If I were taller, I could join the team."], ["가정법 과거완료", "If + had p.p.", "would / could + have p.p.", "If I had known, I would have come."]], "tips": ["조건 부사절의 if절에는 미래라도 will ✗", "주절 will ↔ if절 현재 / 주절 would ↔ if절 과거", "unless + not ✗ (이중 부정)", "일반적 사실: If you heat ice, it melts."]}, "sets": {"workbook": [{"k": "pk", "q": "If you [heat*/will heat] ice, it melts.", "e": "일반적 사실 → 현재"}, {"k": "pk", "q": "If it [snows*/will snow] tomorrow morning, the school will open two hours late.", "e": "조건 부사절 → 현재"}, {"k": "pk", "q": "If I were the principal, I [would*/will] let students choose their own seats.", "e": "가정법 과거 → would"}, {"k": "pk", "q": "If you leave now, you [will*/would] arrive before the meeting starts.", "e": "조건(현재) → will"}, {"k": "bl", "q": "네가 지금 출발하면 거기에 제시간에 도착할 것이다. → If you (leave|start|go) now, you will get there on time.", "e": "조건 → 현재"}, {"k": "bl", "q": "내가 날개가 있다면 너에게 날아갈 텐데. → If I (had) wings, I would fly to you.", "e": "가정법 과거"}, {"k": "bl", "q": "그가 오늘 밤 전화하면 내가 그에게 말할게. → If he (calls) tonight, I will tell him.", "e": "조건 → 현재 (3인칭 단수)"}, {"k": "bl", "q": "네가 서두르지 않으면 버스를 놓칠 것이다. → (Unless) you hurry, you will miss the bus.", "e": "unless = if ~ not"}, {"k": "fx", "q": "If the package will arrive by Friday, I can give it to her at the party.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → 현재: If the package arrives"}, {"k": "fx", "q": "If I knew how to swim, I will jump into the lake with you.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["If you mix red and blue, you get purple.", "If he were here, he would know the answer.", "If it is sunny this weekend, we will go camping.", "If I had a time machine, I will visit the past.", "Unless you study, you won't pass the test."], "a": 3, "e": "④ 가정법 과거 → would visit"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• If the train ____ on time, we will meet you at noon.\n• If I ____ in your position, I would talk to the teacher.", "o": ["arrives – were", "will arrive – were", "arrived – am", "arrives – am", "arrived – were"], "a": 0, "e": "조건 → arrives / 가정 → were"}, {"k": "ch", "q": "다음 중 사실과 반대되는 상황을 상상하는 문장은?", "o": ["If you need help, call me.", "If it rains, the game will be canceled.", "If I were a doctor, I could help sick people.", "If you press this button, the door opens.", "If she comes, I will be happy."], "a": 2, "e": "③ 가정법 과거 / 나머지는 조건"}, {"k": "pk", "q": "Unless you [return*/don't return] the book by Monday, you will have to pay a fine.", "e": "unless + 현재 (not ✗)"}, {"k": "pk", "q": "If I [were*/am] an astronaut, I would see the Earth from space. (사실과 반대)", "e": "가정법 과거 → were"}, {"k": "pk", "q": "If you [are*/were] free this Saturday, will you come to my birthday party?", "e": "주절 will → 조건 → 현재"}, {"k": "bl", "q": "그 셔츠가 너무 크면 내가 바꿔 줄게. → If the shirt (is) too big, I will exchange it for you.", "e": "조건 → 현재"}, {"k": "bl", "q": "내가 그의 이름을 기억한다면 너에게 말해 줄 텐데. (실제로는 기억 못 함) → If I (remembered) his name, I would tell you.", "e": "가정법 과거"}, {"k": "fx", "q": "If you will finish your homework early, we can watch a movie together.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → If you finish"}, {"k": "ox", "q": "If I see Minji at school tomorrow, I will give her your message.", "a": true, "e": "✔ 조건 부사절 → 현재"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If you heat water to 100°C, it boils.\nⓑ If I were you, I will take the job.\nⓒ If she will come tomorrow, we can start.\nⓓ If he had more courage, he would ask her out.\nⓔ Unless it rains, we will play soccer.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓓⓔ 옳음 / ⓑ would take / ⓒ comes"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• If you (A)[finish / will finish] the report today, you can take tomorrow off.\n• If I (B)[have / had] a million dollars, I would build a school for poor children.\n• If the store (C)[is / were] open tomorrow, I will buy some bread there.", "o": ["finish – had – is", "will finish – had – is", "finish – have – were", "finish – had – were", "will finish – have – is"], "a": 0, "e": "(A) 조건 → finish (B) would → had (C) will buy → is"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["If you don't hurry, you will be late for class.", "If I knew her better, I would invite her to dinner.", "If my parents agree, I will study abroad next year.", "If he were not so busy, he could join the club.", "If the price goes down next month, I would buy the phone."], "a": 4, "e": "⑤ 조건(현재) → will buy"}, {"k": "pk", "q": "If it [is*/were] cloudy tomorrow, we will not be able to see the eclipse.", "e": "주절 will → 조건 → 현재"}, {"k": "fx", "q": "My brother is short. If he were taller, he can join the basketball team.", "w": "can", "a": ["could"], "e": "가정법 과거 → could"}, {"k": "fx", "q": "If you will need a ride to the station tomorrow, just let me know.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → If you need"}, {"k": "or", "q": "내일 비가 오면 우리는 집에 머물 것이다.", "a": "If it rains tomorrow, we will stay home.", "e": "조건 → 현재"}, {"k": "or", "q": "내가 그의 전화번호를 안다면 그에게 전화할 텐데.", "a": "If I knew his phone number, I would call him.", "e": "가정법 과거"}, {"k": "wr", "q": "네가 그 버튼을 누르면 문이 열릴 것이다. (press the button, will, open)", "a": ["If you press the button, the door will open.", "The door will open if you press the button."], "e": "조건 → 현재"}, {"k": "bl", "q": "A: 이번 주말에 축제에 갈 거니? B: 숙제를 끝내면 갈 거야. → A: Are you going to the festival this weekend? B: If I (finish) my homework, I will go.", "e": "조건 → 현재"}]}}, {"tag": "hof-05-P3", "name": "as if 가정법", "talk": [{"k": "m", "t": "**as if(as though)** + 가정법: '마치 ~인 것처럼' 🎭 — 실제로는 그렇지 않은 일을 말해요"}, {"k": "m", "t": "as if + **과거**(be → were): 주절과 **같은 때**의 사실 반대 / as if + **had p.p.**: 주절보다 **이전**의 사실 반대"}, {"k": "ex", "en": "He talks as if he knew everything.", "ko": "그는 마치 모든 것을 아는 것처럼 말한다. (실제로는 모른다)"}, {"k": "q", "q": "She acts as if she ____ the boss, but she isn't.", "o": ["is", "were", "had been"], "a": 1, "ok": "맞아요! 지금 사실 반대 → were", "no": "지금 사장이 아님 → as if + were"}, {"k": "ex", "en": "He talks as if he had been to Paris.", "ko": "그는 마치 파리에 가 본 적이 있는 것처럼 말한다. (실제로는 가 본 적 없다)"}, {"k": "q", "q": "He talks about the accident as if he ____ it with his own eyes, but he wasn't there.", "o": ["sees", "saw", "had seen"], "a": 2, "ok": "정확해요! 더 이전 일 → had p.p.", "no": "사고는 말하는 것보다 이전 일 → had seen"}, {"k": "m", "t": "풀이 전략: 주절 시제와 상관없이 **시점 비교**! 주절과 같은 때 → 과거 / 주절보다 앞 → had p.p. — He talked as if he [knew] me. (그때 아는 것처럼)"}, {"k": "q", "q": "Mom treats me as if I ____ still a little child.", "o": ["am", "were", "had been"], "a": 1, "ok": "맞아요! 지금 사실 반대 → were", "no": "지금 어린아이가 아님 → were"}, {"k": "m", "t": "⚠️ '실제로는 아니다'라는 단서(but he isn't, but he never did)가 있으면 반드시 가정법! **I wish**도 같은 원리: I wish I [knew] the answer. (지금 모름)"}, {"k": "m", "t": "정리! **as if + 과거 = 같은 때 반대 / as if + had p.p. = 이전 일 반대 · I wish도 동일** 👍 🎉 Chapter 5 가정법 끝!"}], "notes": {"table": [["형태", "시점", "예"], ["as if + 과거(were)", "주절과 같은 때의 사실 반대", "She talks as if she were a teacher. (지금 선생님 아님)"], ["as if + had p.p.", "주절보다 이전의 사실 반대", "He looks as if he had seen a ghost."], ["I wish + 과거", "현재 이루기 힘든 소망", "I wish I had a sister."], ["I wish + had p.p.", "과거에 대한 아쉬움", "I wish I had studied harder."]], "tips": ["as though = as if", "주절이 과거여도 같은 때면 as if + 과거: He acted as if he knew me.", "I wish I can ✗ → I wish I could", "'실제로는 아니다' 단서 → 가정법"]}, "sets": {"workbook": [{"k": "pk", "q": "He speaks English as if he [were*/is] a native speaker, but he has never lived abroad.", "e": "지금 사실 반대 → were"}, {"k": "pk", "q": "She talks as if she [had met*/meets] the singer before, but she never has.", "e": "이전 일 반대 → had p.p."}, {"k": "pk", "q": "My uncle spends money as if he [were*/had been] a millionaire, but he is not rich at all.", "e": "지금 사실 반대 → were"}, {"k": "pk", "q": "I wish I [had*/have] a younger sister to play with.", "e": "I wish + 과거"}, {"k": "bl", "q": "그는 마치 그 영화를 본 것처럼 말한다. (실제로 안 봤다) → He talks as if he (had) (seen|watched) the movie.", "e": "이전 일 반대 → had p.p."}, {"k": "bl", "q": "그녀는 마치 부자인 것처럼 돈을 쓴다. → She spends money as if she (were) rich.", "e": "같은 때 반대 → were"}, {"k": "bl", "q": "내가 그 시험을 더 잘 준비했더라면 좋을 텐데. → I wish I (had) prepared better for the exam.", "e": "I wish + had p.p."}, {"k": "bl", "q": "그 아이는 마치 아무 일도 없었던 것처럼 행동했다. → The child acted as if nothing (had) happened.", "e": "이전 일 반대 → had p.p."}, {"k": "fx", "q": "Jake behaves as if he is the leader of our team, but he isn't.", "w": "is", "a": ["were"], "e": "지금 사실 반대 → were"}, {"k": "fx", "q": "She described the castle as though she has visited it, but she had only seen pictures.", "w": "has", "a": ["had"], "e": "이전 일 반대 → had visited"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["He acts as if he were a famous actor.", "She looked as if she had seen a ghost.", "I wish I could speak Chinese fluently.", "My uncle talks as if he has climbed Everest, but he has never left Korea.", "They treated me as though I were their own son."], "a": 3, "e": "④ had climbed"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• Minho talks as if he (A)[knows / knew] everything about cars, but he actually knows little.\n• She looks as if she (B)[had cried / cries] all night, but she says she slept well.\n• I wish I (C)[had listened / listened] to your advice yesterday.", "o": ["knows – had cried – had listened", "knew – had cried – had listened", "knew – cries – listened", "knew – had cried – listened", "knows – cries – had listened"], "a": 1, "e": "(A) 지금 반대 → knew (B) 이전(밤새) 반대 → had cried (C) yesterday → had listened"}, {"k": "ch", "q": "다음 문장이 뜻하는 사실로 알맞은 것은?\nHe talks as if he were a doctor.", "o": ["In fact, he is a doctor.", "In fact, he isn't a doctor.", "In fact, he wasn't a doctor.", "In fact, he was a doctor.", "In fact, he wants to be a doctor."], "a": 1, "e": "as if + 과거 → 현재 사실 반대"}, {"k": "pk", "q": "Grandpa remembers that day as if it [had happened*/happens] only yesterday.", "e": "이전 일 → had p.p."}, {"k": "pk", "q": "She smiled at me as if she [knew*/knows] my secret, but she didn't.", "e": "주절(과거)과 같은 때 → 과거"}, {"k": "pk", "q": "I wish my house [were*/is] closer to the subway station.", "e": "I wish + 과거"}, {"k": "bl", "q": "그는 마치 그 사고를 목격했던 것처럼 이야기했다. → He talked as if he (had) (witnessed|seen) the accident.", "e": "이전 일 반대 → had p.p."}, {"k": "bl", "q": "그녀는 마치 나를 모르는 것처럼 지나갔다. → She walked past as if she (didn't|did not) know me.", "e": "같은 때 → 과거"}, {"k": "fx", "q": "The puppy follows my sister everywhere as if she is its mother.", "w": "is", "a": ["were"], "e": "사실 반대 → were"}, {"k": "ox", "q": "He looked at the painting as if he had never seen anything so beautiful.", "a": true, "e": "✔ 이전 경험 → had p.p."}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She talks as if she were my teacher.\nⓑ He acted as if he has never met me.\nⓒ I wish I had bought that jacket on sale last week.\nⓓ They looked as if they had run a marathon.\nⓔ I wish I can fly like a bird.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ had never met / ⓔ could fly"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["He spends money as though he were a millionaire.", "She sounded as if she had been crying.", "Mina explained the rules as if we were little kids.", "I wish I had more friends at my new school.", "He talked about Rome as if he lives there for years."], "a": 4, "e": "⑤ had lived"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n그는 마치 그 대회에서 우승했던 것처럼 웃는다. (실제로는 우승하지 못했다)", "o": ["He smiles as if he wins the contest.", "He smiles as if he won the contest.", "He smiles as if he had won the contest.", "He smiled as if he wins the contest.", "He smiles as if he has won the contest."], "a": 2, "e": "웃는 것보다 이전 일 반대 → had won"}, {"k": "pk", "q": "My little brother acts as if he [were*/is] a superhero, but he's only five.", "e": "사실 반대 → were"}, {"k": "fx", "q": "When I visited my old school, I felt as if I have become a student again.", "w": "have", "a": ["had"], "e": "주절 과거 + 사실 반대 → had become"}, {"k": "fx", "q": "I wish I know the answer to this question right now.", "w": "know", "a": ["knew"], "e": "I wish + 과거"}, {"k": "or", "q": "그는 마치 왕인 것처럼 행동한다.", "a": "He acts as if he were a king.", "e": "as if + were"}, {"k": "or", "q": "그녀는 마치 유령을 본 것처럼 보였다.", "a": "She looked as if she had seen a ghost.", "e": "as if + had p.p."}, {"k": "wr", "q": "그는 마치 그 책을 읽은 것처럼 말한다. (as if, read the book, 실제로는 안 읽었다)", "a": ["He talks as if he had read the book.", "He speaks as if he had read the book.", "He talks as though he had read the book.", "He speaks as though he had read the book."], "e": "이전 일 반대 → had p.p."}, {"k": "bl", "q": "A: 준호가 정말 지난여름에 일본에 갔었니? B: 아니. 그는 마치 거기 갔었던 것처럼 말할 뿐이야. → A: Did Junho really go to Japan last summer? B: No. He just talks as if he (had) (been|gone) there.", "e": "이전 일 반대 → had p.p."}]}}], "chapterSets": {"write": [{"k": "wr", "q": "내가 너라면 그 기회를 놓치지 않을 텐데. (If I were you, miss the chance)", "a": ["If I were you, I wouldn't miss the chance.", "If I were you, I would not miss the chance.", "I wouldn't miss the chance if I were you.", "I would not miss the chance if I were you."], "e": "가정법 과거"}, {"k": "wr", "q": "그가 일찍 일어났더라면 그 버스를 놓치지 않았을 텐데. (get up early, miss the bus)", "a": ["If he had gotten up early, he wouldn't have missed the bus.", "If he had got up early, he wouldn't have missed the bus.", "If he had gotten up early, he would not have missed the bus.", "If he had got up early, he would not have missed the bus.", "He wouldn't have missed the bus if he had gotten up early.", "He wouldn't have missed the bus if he had got up early.", "He would not have missed the bus if he had gotten up early.", "He would not have missed the bus if he had got up early."], "e": "가정법 과거완료"}, {"k": "wr", "q": "내일 날씨가 좋으면 우리는 소풍을 갈 것이다. (If the weather is nice, go on a picnic)", "a": ["If the weather is nice tomorrow, we will go on a picnic.", "We will go on a picnic if the weather is nice tomorrow.", "If the weather is nice, we will go on a picnic tomorrow.", "Tomorrow, if the weather is nice, we will go on a picnic."], "e": "조건 → 현재"}, {"k": "wr", "q": "그녀는 마치 나의 엄마인 것처럼 말한다. (as if, my mother)", "a": ["She talks as if she were my mother.", "She speaks as if she were my mother.", "She talks as though she were my mother.", "She speaks as though she were my mother."], "e": "as if + were"}, {"k": "wr", "q": "내가 피아노를 칠 수 있다면 좋을 텐데. (I wish, play the piano)", "a": ["I wish I could play the piano."], "e": "I wish + could"}, {"k": "bl", "q": "If I had saved more money, I could (buy) a new bike now. (지금 살 수 있을 텐데)", "e": "혼합가정법 → could + 원형"}, {"k": "bl", "q": "내일 비가 오면 경기는 연기될 것이다. → If it (rains) tomorrow, the game will be postponed.", "e": "조건 → 현재"}, {"k": "fx", "q": "If I had known his address, I would have send him a card.", "w": "send", "a": ["sent"], "e": "would have + p.p."}, {"k": "fx", "q": "I'm not rich, but if I were rich, I will buy a big house for my parents.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "or", "q": "그녀는 마치 그 소식을 이미 들었던 것처럼 행동했다.", "a": "She acted as if she had already heard the news.", "e": "as if + had p.p."}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? If I ____ his phone number, I would call him right now.", "o": ["know", "knew", "had known", "will know", "have known"], "a": 1, "e": "가정법 과거"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If we had left earlier, we ____ the opening ceremony yesterday.", "o": ["wouldn't miss", "won't miss", "wouldn't have missed", "didn't miss", "hadn't missed"], "a": 2, "e": "가정법 과거완료"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은?\nAs she didn't know the truth, she didn't tell me.", "o": ["If she knew the truth, she would tell me.", "If she had known the truth, she would have told me.", "If she knows the truth, she will tell me.", "If she had known the truth, she would tell me.", "If she didn't know the truth, she wouldn't have told me."], "a": 1, "e": "과거 사실 반대 → 가정법 과거완료"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["If it snows tonight, the roads will be slippery.", "If I were a bird, I would fly to you.", "If you had told me, I would have helped you.", "Unless you leave now, you will be late.", "If he will come to the party, I will be happy."], "a": 4, "e": "⑤ 조건 부사절 → comes"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• If I (A)[am / were] in your shoes, I would tell the truth.\n• If it (B)[rains / will rain] this afternoon, take an umbrella with you.\n• He talks as if he (C)[saw / had seen] the accident yesterday, but he didn't.", "o": ["were – rains – had seen", "am – rains – had seen", "were – will rain – saw", "were – rains – saw", "am – will rain – had seen"], "a": 0, "e": "(A) 가정 → were (B) 조건 → rains (C) 이전 일 반대 → had seen"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If I had followed the doctor's advice, I ____ healthier now.", "o": ["am", "would be", "would have been", "will be", "had been"], "a": 1, "e": "혼합가정법 (now) → would + 원형"}, {"k": "ch", "q": "다음 중 사실과 반대되는 상황을 상상하는 문장은?", "o": ["If you are tired, take a rest.", "If she calls, I'll tell her.", "If I had wings, I could fly.", "If it rains, we stay inside.", "Unless you hurry, you will miss it."], "a": 2, "e": "③ 가정법 과거"}, {"k": "ch", "q": "다음 문장이 뜻하는 사실로 알맞은 것은?\nShe talks as if she had lived in London.", "o": ["In fact, she lives in London.", "In fact, she didn't live in London.", "In fact, she lived in London.", "In fact, she wants to live in London.", "In fact, she will live in London."], "a": 1, "e": "as if + had p.p. → 과거 사실 반대"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["I wish I can drive a car.", "If I had more time, I will read more books.", "He acts as if he is the owner of the store, but he is just a clerk.", "Had I known about the test, I would have studied.", "If it will be sunny, we will go out."], "a": 3, "e": "④ / ① could ② would ③ were ⑤ is"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I were you, I would wait.\nⓑ If he had run faster, he would have won the race.\nⓒ If you mix yellow and blue, you get green.\nⓓ She looks as if she had been sick for a long time.\nⓔ I wish I have a dog.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓓ 옳음 / ⓔ had"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: I missed the last bus and had to walk home.\nB: Oh no! If you ____ me, I would have picked you up.", "o": ["call", "called", "had called", "will call", "have called"], "a": 2, "e": "would have p.p. → had called"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["If I had a car, I would drive you home.", true], ["If she had studied, she would pass the test last week.", false], ["If it rains tomorrow, I will stay home.", true], ["If I knew the answer, I will tell you.", false], ["He talks as if he were a genius.", true], ["Had they listened, they would have understood.", true], ["If you heat ice, it melts.", true], ["I wish I were taller.", true], ["She acted as if she has seen nothing.", false], ["Unless you hurry, you will be late.", true], ["If he will arrive early, we can start the meeting.", false], ["If I had slept well, I wouldn't be tired now.", true]], "e": "ⓑ would have passed ⓓ would tell ⓘ had seen ⓚ arrives"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["If I am a cat, I would sleep all day.", false], ["If you had come, you would have enjoyed the show.", true], ["If the bus is late, we will take a taxi.", true], ["He looks as if he had lost something important.", true], ["I wish I could go back in time.", true], ["If she had known, she would told me.", false], ["If it were not for music, life would be boring.", true], ["If I find your wallet, I will call you.", true], ["She talks as if she knows everything, but she knows little.", false], ["If we had more money, we could travel abroad.", true], ["If you will press this button, the machine starts.", false], ["Were I you, I would accept the offer.", true]], "e": "ⓐ were ⓕ would have told ⓘ knew ⓚ press"}, {"k": "wr", "q": "같은 뜻이 되도록 가정법으로 쓰시오. As I didn't have enough money, I couldn't buy the ticket.", "a": ["If I had had enough money, I could have bought the ticket.", "I could have bought the ticket if I had had enough money.", "Had I had enough money, I could have bought the ticket."], "e": "과거 사실 반대 → 가정법 과거완료"}, {"k": "wr", "q": "그는 마치 그곳에 가 본 적이 있는 것처럼 말한다. (as if, be there)", "a": ["He talks as if he had been there.", "He speaks as if he had been there.", "He talks as though he had been there.", "He speaks as though he had been there."], "e": "as if + had p.p."}]}}, {"book": "hof", "chapter": {"id": "06", "name": "동명사와 to부정사", "title": "해커스 어법 제대로 · Chapter 6 동명사와 to부정사"}, "units": [{"tag": "hof-06-P1", "name": "동사 vs. 동명사/to부정사", "talk": [{"k": "m", "t": "Chapter 6은 **동명사와 to부정사**! 첫 포인트: 이 자리에 **동사**가 올까, **동명사·to부정사**가 올까? 🧐"}, {"k": "m", "t": "전략: 문장의 **진짜 동사**를 먼저 찾기! 한 절(주어 + 동사)에 동사는 **하나** → 이미 동사가 있으면 나머지 자리는 -ing나 to부정사"}, {"k": "ex", "en": "Learning a new language takes a lot of time.", "ko": "새로운 언어를 배우는 것은 많은 시간이 걸린다. (진짜 동사 = takes)"}, {"k": "q", "q": "____ enough water every day is important for your health.", "o": ["Drink", "Drinking", "Drinks"], "a": 1, "ok": "맞아요! 주어 자리 → 동명사", "no": "진짜 동사는 is → 주어 자리는 Drinking"}, {"k": "m", "t": "**주어 자리**: 동명사 / to부정사(보통 가주어 it ~ to부정사) — 동사원형·3인칭 단수형은 주어가 될 수 없어요"}, {"k": "m", "t": "**보어 자리**(be동사 뒤): My goal is [to] win the game. / Her hobby is collecting stamps."}, {"k": "q", "q": "My dream is ____ a doctor who helps poor people.", "o": ["become", "to become", "becomes"], "a": 1, "ok": "정확해요! 보어 자리 → to부정사", "no": "is 뒤 보어 자리 → to become"}, {"k": "m", "t": "⚠️ 접속사·관계사가 있으면 동사가 하나 더! **동사 개수 = 접속사(관계사) 개수 + 1** — 이때는 오히려 동사가 와야 해요"}, {"k": "q", "q": "The man who ____ next door is a famous chef.", "o": ["lives", "living", "to live"], "a": 0, "ok": "맞아요! 관계사절의 동사 자리", "no": "who가 이끄는 절에도 동사가 필요 → lives"}, {"k": "m", "t": "정리! **진짜 동사 찾기 → 나머지 주어·보어 자리는 -ing / to부정사 · 접속사가 있으면 동사 하나 더** 👍"}], "notes": {"table": [["자리", "올 수 있는 것", "예"], ["주어", "동명사 / to부정사 (가주어 it)", "Reading novels is fun. / It is fun to read novels."], ["보어", "동명사 / to부정사", "My plan is to save money. / His job is teaching kids."], ["진짜 동사", "시제·수가 있는 동사", "Walking in the park makes me calm."], ["접속사·관계사절", "동사 하나 더", "The girl who sits next to me is kind."]], "tips": ["동명사·to부정사 주어는 단수 취급 → 동사도 단수", "동사원형으로 시작하는 문장은 명령문 — 뒤에 동사가 또 있으면 ✗", "동사 개수 = 접속사 개수 + 1"]}, "sets": {"workbook": [{"k": "pk", "q": "[Reading*/Read] books before bed helps me relax.", "e": "진짜 동사 helps → 주어는 동명사"}, {"k": "pk", "q": "The best way to improve your writing [is*/being] to write every day.", "e": "주어 The best way의 진짜 동사 → is"}, {"k": "pk", "q": "Her job is [to take*/takes] care of the animals at the zoo.", "e": "보어 자리 → to부정사"}, {"k": "pk", "q": "[To exercise*/Exercise] regularly is good for both body and mind.", "e": "주어 자리 → to부정사"}, {"k": "bl", "q": "다른 사람들의 말을 듣는 것은 쉽지 않다. → (Listening|To listen) to others is not easy.", "e": "주어 자리 → 동명사 / to부정사"}, {"k": "bl", "q": "그의 목표는 매일 영어 단어 50개를 외우는 것이다. → His goal is (to) memorize fifty English words a day.", "e": "보어 자리 → to부정사"}, {"k": "bl", "q": "운동장에서 노는 아이들이 매우 시끄럽다. → The children playing on the playground (are) very noisy.", "e": "진짜 동사 자리 → are"}, {"k": "bl", "q": "새로운 친구를 사귀는 것은 시간이 걸린다. → (Making|To make) new friends takes time.", "e": "주어 자리 → 동명사 / to부정사"}, {"k": "fx", "q": "Keep a diary in English is a good way to practice writing.", "w": "Keep", "a": ["Keeping", "To keep"], "e": "진짜 동사 is → 주어는 동명사 / to부정사"}, {"k": "fx", "q": "The purpose of the meeting is discuss the new school rules.", "w": "discuss", "a": ["to discuss"], "e": "보어 자리 → to부정사"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["Taking photos is not allowed in the museum.", "To travel alone can be a great experience.", "Her plan is to open a small bakery next year.", "Spend too much time on social media can make you feel lonely.", "Wearing a helmet protects your head."], "a": 3, "e": "④ Spending (진짜 동사 can make)"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• (A)[Recycle / Recycling] plastic bottles helps the environment.\n• One of the easiest ways to save money (B)[is / to be] to cook at home.\n• My hobby is (C)[make / making] model airplanes.", "o": ["Recycle – is – make", "Recycling – is – making", "Recycling – to be – making", "Recycle – to be – making", "Recycling – is – make"], "a": 1, "e": "(A) 주어 → Recycling (B) 진짜 동사 → is (C) 보어 → making"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? ____ a foreign language is fun.", "o": ["Learning", "To learn", "Studying", "Learn", "To study"], "a": 3, "e": "동사원형은 주어 ✗"}, {"k": "pk", "q": "It is dangerous [to swim*/swim] in this river after heavy rain.", "e": "가주어 it ~ 진주어 to부정사"}, {"k": "pk", "q": "The students [practiced*/practicing] the play for weeks before the school festival.", "e": "문장에 동사가 없음 → practiced"}, {"k": "pk", "q": "[Solving*/Solve] difficult math problems requires patience.", "e": "진짜 동사 requires → 주어는 동명사"}, {"k": "bl", "q": "가장 중요한 것은 포기하지 않는 것이다. → The most important thing is (not) (to) give up.", "e": "보어 자리 → not to부정사"}, {"k": "bl", "q": "이 앱을 사용하는 것은 매우 간단하다. → (Using|To use) this app is very simple.", "e": "주어 자리"}, {"k": "fx", "q": "Protect endangered animals is everyone's responsibility.", "w": "Protect", "a": ["Protecting", "To protect"], "e": "주어 자리 → 동명사 / to부정사"}, {"k": "ox", "q": "Eating breakfast every morning gives you energy for the day.", "a": true, "e": "✔ 주어 Eating, 진짜 동사 gives"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Watch movies in English improves your listening skills.\nⓑ To be honest with everyone is not always easy.\nⓒ His job is to deliver packages to customers.\nⓓ The girl sitting next to me lending me her pen yesterday.\nⓔ Getting enough sleep is important for students.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ Watching / ⓓ 동사 없음 → lent"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Walking along the beach at sunset makes me happy.", "The key to success is to keep trying.", "People who exercise regularly live longer.", "It is not easy to understand his accent.", "Make mistakes is a natural part of learning."], "a": 4, "e": "⑤ Making / To make"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• ____ with friends is more fun than studying alone.\n• The best thing about summer is ____ to the beach.", "o": ["Study – go", "Studying – going", "Studies – going", "Studying – go", "Study – to going"], "a": 1, "e": "주어 → Studying / 보어 → going"}, {"k": "pk", "q": "The volunteers [cleaned*/cleaning] the park last Saturday and planted some trees.", "e": "문장의 동사 자리 → cleaned"}, {"k": "fx", "q": "Learn about other cultures helps us understand the world better.", "w": "Learn", "a": ["Learning", "To learn"], "e": "진짜 동사 helps → 주어는 동명사 / to부정사"}, {"k": "fx", "q": "The aim of this project is improve students' reading skills.", "w": "improve", "a": ["to improve", "improving"], "e": "보어 자리 → to부정사 / 동명사"}, {"k": "or", "q": "규칙적으로 운동하는 것은 건강에 좋다.", "a": "Exercising regularly is good for your health.", "e": "주어 → 동명사"}, {"k": "or", "q": "내 꿈은 세계를 여행하는 것이다.", "a": "My dream is to travel around the world.", "e": "보어 → to부정사"}, {"k": "wr", "q": "충분한 물을 마시는 것은 중요하다. (drink enough water, 동명사 주어)", "a": ["Drinking enough water is important."], "e": "주어 → 동명사"}, {"k": "bl", "q": "A: 주말 계획이 뭐니? B: 내 계획은 조부모님 댁을 방문하는 거야. → A: What is your plan for the weekend? B: My plan is (to) visit my grandparents.", "e": "보어 → to부정사"}]}}, {"tag": "hof-06-P2", "name": "동명사와 to부정사 중 하나만 목적어로 취하는 동사", "talk": [{"k": "m", "t": "동사에 따라 목적어로 **동명사만**, 또는 **to부정사만** 오는 경우! 어법 문제 단골이에요 🎯"}, {"k": "m", "t": "**동명사만**: enjoy, finish, avoid, mind, give up, quit, keep, practice, consider, deny, admit, postpone, put off, delay, suggest, imagine, risk"}, {"k": "q", "q": "Would you mind ____ the window?", "o": ["to close", "closing", "close"], "a": 1, "ok": "맞아요! mind + -ing", "no": "mind는 동명사만 → closing"}, {"k": "m", "t": "**to부정사만**: want, hope, wish, plan, decide, expect, agree, refuse, promise, manage, afford, pretend, fail, choose, learn, offer, seem"}, {"k": "q", "q": "He refused ____ the reporter's question.", "o": ["answering", "to answer", "answer"], "a": 1, "ok": "정확해요! refuse + to부정사", "no": "refuse는 to부정사만 → to answer"}, {"k": "m", "t": "암기 팁: to부정사 동사는 **앞으로 할 일**(계획·결정·약속) 느낌 / 동명사 동사는 **하고 있거나 한 일**(즐김·끝냄·피함·그만둠) 느낌"}, {"k": "ex", "en": "She finally decided to quit eating fast food.", "ko": "그녀는 마침내 패스트푸드를 먹는 것을 그만두기로 결정했다. (decide + to / quit + -ing)"}, {"k": "q", "q": "We postponed ____ the trip because of the typhoon.", "o": ["to take", "taking", "take"], "a": 1, "ok": "맞아요! postpone + -ing", "no": "postpone(미루다)은 동명사만 → taking"}, {"k": "m", "t": "⚠️ 부정은 to부정사·동명사 **바로 앞**에 not: He promised [not] to be late again. / I regret not studying harder."}, {"k": "m", "t": "정리! **enjoy·finish·avoid·mind·give up·keep + -ing / want·hope·decide·plan·refuse·promise + to** 👍"}], "notes": {"table": [["목적어", "동사", "예"], ["동명사만", "enjoy, finish, avoid, mind, give up, quit, keep, practice, consider, deny, admit, postpone, put off, delay, suggest, imagine, risk", "He avoided answering the question."], ["to부정사만", "want, hope, wish, plan, decide, expect, agree, refuse, promise, manage, afford, pretend, fail, choose, learn, offer, seem", "She managed to finish on time."]], "tips": ["동명사 = 이미 하고 있는·한 일 / to부정사 = 앞으로 할 일", "부정: not + -ing / not + to부정사", "can't afford to + 원형 (affording ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "My father gave up [smoking*/to smoke] last year for his health.", "e": "give up + -ing"}, {"k": "pk", "q": "The company plans [to open*/opening] a new branch in Busan.", "e": "plan + to부정사"}, {"k": "pk", "q": "I can't afford [to buy*/buying] a new laptop right now.", "e": "afford + to부정사"}, {"k": "pk", "q": "Have you finished [writing*/to write] your report for science class?", "e": "finish + -ing"}, {"k": "bl", "q": "그는 그 창문을 깼다는 것을 부인했다. → He denied (breaking|having broken) the window.", "e": "deny + -ing"}, {"k": "bl", "q": "우리는 다음 달에 캠핑을 가기로 결정했다. → We decided (to) go camping next month.", "e": "decide + to부정사"}, {"k": "bl", "q": "그녀는 나를 못 본 척했다. → She pretended (not) to see me.", "e": "pretend + not to부정사"}, {"k": "bl", "q": "그들은 혼잡한 시간에 운전하는 것을 피한다. → They avoid (driving) during rush hour.", "e": "avoid + -ing"}, {"k": "fx", "q": "Minji hopes visiting her aunt in Canada during the winter vacation.", "w": "visiting", "a": ["to visit"], "e": "hope + to부정사"}, {"k": "fx", "q": "The students kept chat loudly even after the teacher  "q", "q": "Don't forget ____ the door when you leave.", "o": ["locking", "to lock", "lock"], "a": 1, "ok": "맞아요! 앞으로 할 일 → to부정사", "no": "나갈 때 잠가야 할 일 → forget to lock"}, {"k": "q", "q": "I remember ____ him at the party last year.", "o": ["meeting", "to meet", "meet"], "a": 0, "ok": "정확해요! 과거에 한 일 → -ing", "no": "last year(과거에 한 일) → remember meeting"}, {"k": "m", "t": "**try** + -ing: 시험 삼아 ~해 보다 / + to부정사: ~하려고 노력하다 · **regret** + -ing: ~한 것을 후회하다 / + to부정사: ~하게 되어 유감이다"}, {"k": "m", "t": "⚠️ **stop** + -ing: ~하는 것을 멈추다 / stop + to부정사: ~하기 **위해** 멈추다 (이 to부정사는 목적어가 아니라 '목적')"}, {"k": "q", "q": "He stopped ____ a photo of the sunset. (사진을 찍기 위해 멈췄다)", "o": ["taking", "to take", "take"], "a": 1, "ok": "맞아요! ~하기 위해 멈추다 → stop to", "no": "찍기 위해 멈춤 → stopped to take"}, {"k": "m", "t": "풀이 전략: **시점**을 따져요 — 이미 **한** 일 → -ing / 앞으로 **할** 일 → to부정사"}, {"k": "m", "t": "정리! **remember·forget·regret: -ing 과거 / to 미래 · try -ing 시험 삼아 / to 노력 · stop -ing 멈춤 / to 하려고** 👍"}], "notes": {"table": [["동사", "+ 동명사", "+ to부정사"], ["remember", "(과거에) ~한 것을 기억하다", "(앞으로) ~할 것을 기억하다"], ["forget", "(과거에) ~한 것을 잊다", "(앞으로) ~할 것을 잊다"], ["regret", "~한 것을 후회하다", "~하게 되어 유감이다"], ["try", "시험 삼아 ~해 보다", "~하려고 노력하다"], ["stop", "~하는 것을 멈추다", "~하기 위해 멈추다 (목적)"], ["like / love / hate / begin / start / continue", "의미 차이 거의 없음", "의미 차이 거의 없음"]], "tips": ["과거 단서(last year, when I was ~, before) → -ing", "Remember / Don't forget + to (명령문, 할 일)", "regret to say / inform / tell: ~하게 되어 유감이다"]}, "sets": {"workbook": [{"k": "pk", "q": "I'll never forget [visiting*/to visit] Paris with my family when I was ten.", "e": "과거에 한 일 → -ing"}, {"k": "pk", "q": "Remember [to bring*/bringing] your passport to the airport tomorrow.", "e": "앞으로 할 일 → to부정사"}, {"k": "pk", "q": "We regret [to inform*/informing] you that the event has been canceled. (유감이다)", "e": "regret to inform"}, {"k": "pk", "q": "The driver stopped [to buy*/buying] some coffee at the rest area. (사기 위해 멈췄다)", "e": "stop to = ~하기 위해 멈추다"}, {"k": "bl", "q": "그는 어렸을 때 그 책을 읽었던 것을 기억한다. → He remembers (reading) the book as a child.", "e": "과거에 한 일 → -ing"}, {"k": "bl", "q": "나는 그 문제를 혼자 풀려고 노력했다. → I tried (to) solve the problem by myself.", "e": "try to = 노력하다"}, {"k": "bl", "q": "그녀는 친구에게 화를 낸 것을 후회한다. → She regrets (getting|being) angry at her friend.", "e": "regret + -ing"}, {"k": "bl", "q": "아기가 마침내 우는 것을 멈췄다. → The baby finally stopped (crying).", "e": "stop + -ing"}, {"k": "fx", "q": "Please don't forget turning off the lights before you go to bed tonight.", "w": "turning", "a": ["to turn"], "e": "앞으로 할 일 → to부정사"}, {"k": "fx", "q": "The doctor told him to stop eat sugary snacks for his health.", "w": "eat", "a": ["eating"], "e": "먹는 것을 멈추다 → stop eating"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["It started raining just after we left the house.", "I remember locking the door, so don't worry.", "She stopped to talk with her friend on the street.", "Don't forget calling your grandmother tomorrow.", "He continued to work even after he got sick."], "a": 3, "e": "④ 내일 할 일 → to call"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• I remember (A)[to put / putting] my keys on the table, but they're not there now.\n• Try (B)[to be / being] more patient with your little brother. (노력하다)\n• He stopped (C)[to smoke / smoking] because of his health.", "o": ["putting – to be – smoking", "to put – to be – smoking", "putting – being – smoking", "putting – to be – to smoke", "to put – being – to smoke"], "a": 0, "e": "(A) 과거에 한 일 → putting (B) 노력 → to be (C) 끊음 → smoking"}, {"k": "ch", "q": "다음 문장의 의미로 알맞은 것은?\nI forgot to send the email.", "o": ["나는 그 이메일을 보낸 것을 잊었다.", "나는 그 이메일을 보내야 하는 것을 잊었다. (보내지 않았다)", "나는 그 이메일을 보내려고 노력했다.", "나는 그 이메일을 보낸 것을 후회했다.", "나는 그 이메일을 보내는 것을 멈췄다."], "a": 1, "e": "forget to = 할 일을 잊다"}, {"k": "pk", "q": "I tried [pressing*/to press] the button, but nothing happened. (시험 삼아 눌러 봤다)", "e": "try + -ing = 시험 삼아 해 보다"}, {"k": "pk", "q": "She regrets [not studying*/not to study] harder in high school.", "e": "과거 일 후회 → regret not -ing"}, {"k": "pk", "q": "Remember [to water*/watering] the plants while I'm away next week.", "e": "앞으로 할 일 → to부정사"}, {"k": "bl", "q": "나는 작년에 그 선생님을 만났던 것을 잊을 수 없다. → I can't forget (meeting) the teacher last year.", "e": "과거에 한 일 → -ing"}, {"k": "bl", "q": "우리는 지도를 보기 위해 멈췄다. → We stopped (to) look at the map.", "e": "stop to = ~하기 위해 멈추다"}, {"k": "fx", "q": "The hikers stopped rest under a tree because they were tired.", "w": "rest", "a": ["to rest"], "e": "쉬기 위해 멈추다 → stopped to rest"}, {"k": "ox", "q": "I'll never forget seeing the sunrise from the top of the mountain.", "a": true, "e": "✔ 과거에 한 일 → -ing"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Please remember to call me when you arrive.\nⓑ I regret telling him the secret.\nⓒ He forgot to meet her before, so he introduced himself again.\nⓓ She tried to lift the box, but it was too heavy.\nⓔ The phone stopped to ring after a minute.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ forgot meeting / ⓔ stopped ringing"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["We regret to say that the flight has been delayed.", "I tried adding more salt, but the soup still tasted bland.", "He stopped to check his phone while walking.", "Remember to take your medicine after dinner.", "I remember to visit this museum when I was a child."], "a": 4, "e": "⑤ 과거에 한 일 → visiting"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• Don't forget ____ the milk on your way home.\n• I'll never forget ____ my first prize.", "o": ["buying – winning", "to buy – winning", "to buy – to win", "buying – to win", "buy – win"], "a": 1, "e": "할 일 → to buy / 한 일 → winning"}, {"k": "pk", "q": "He stopped [eating*/to eat] fast food after he saw the documentary.", "e": "먹는 것을 그만둠 → -ing"}, {"k": "fx", "q": "Do you remember borrow my umbrella last month?", "w": "borrow", "a": ["borrowing"], "e": "과거에 한 일 → -ing"}, {"k": "fx", "q": "The singer stopped sing when the power suddenly went out.", "w": "sing", "a": ["singing"], "e": "노래하는 것을 멈추다 → -ing"}, {"k": "or", "q": "나는 그를 처음 만났던 것을 기억한다.", "a": "I remember meeting him for the first time.", "e": "과거에 한 일 → -ing"}, {"k": "or", "q": "잊지 말고 문을 잠가라.", "a": "Don't forget to lock the door.", "e": "할 일 → to부정사"}, {"k": "wr", "q": "나는 그 시계를 산 것을 후회한다. (regret, buy the watch)", "a": ["I regret buying the watch.", "I regret having bought the watch."], "e": "regret + -ing"}, {"k": "bl", "q": "A: I can't open this file. B: Try (restarting|rebooting) your computer. (시험 삼아 ~해 보다)", "e": "try + -ing"}]}}, {"tag": "hof-06-P4", "name": "전치사 to vs. to부정사의 to", "talk": [{"k": "m", "t": "to라고 다 to부정사가 아니에요! **전치사 to** 뒤에는 명사·**동명사(-ing)** 🚦"}, {"k": "m", "t": "전치사 to 표현: look forward to, be used(accustomed) to, object to, be opposed to, contribute to, be devoted(dedicated, committed) to, when it comes to, in addition to, What do you say to"}, {"k": "ex", "en": "I'm looking forward to seeing you soon.", "ko": "곧 너를 만나기를 고대하고 있어. (to see ✗)"}, {"k": "q", "q": "She is used to ____ alone.", "o": ["live", "living", "lived"], "a": 1, "ok": "맞아요! be used to + -ing", "no": "~에 익숙하다 → 전치사 to + living"}, {"k": "m", "t": "풀이 전략: to 뒤에 **명사를 넣어 보세요** — 말이 되면 전치사(look forward to the trip ○), 안 되면 to부정사(want to the trip ✗)"}, {"k": "q", "q": "When it comes to ____ English, practice is everything.", "o": ["learn", "learning", "learned"], "a": 1, "ok": "정확해요! when it comes to + -ing", "no": "when it comes to의 to는 전치사 → learning"}, {"k": "m", "t": "⚠️ 비교: **be used to + -ing** ~에 익숙하다 / **be used to + 원형** ~하는 데 사용되다 / **used to + 원형** ~하곤 했다"}, {"k": "q", "q": "This tool is used to ____ small screws.", "o": ["tighten", "tightening", "tightened"], "a": 0, "ok": "맞아요! ~하는 데 사용되다 → 원형", "no": "도구가 사용됨(수동) + 목적 → to tighten"}, {"k": "m", "t": "정리! **look forward to · be used to · object to · when it comes to · be devoted to + -ing** 👍"}], "notes": {"table": [["표현", "의미", "예"], ["look forward to -ing", "~을 고대하다", "I look forward to hearing from you."], ["be used(accustomed) to -ing", "~에 익숙하다", "He is used to working late."], ["object to / be opposed to -ing", "~에 반대하다", "They object to raising taxes."], ["contribute to -ing", "~에 기여하다", "Exercise contributes to staying healthy."], ["be devoted(dedicated, committed) to -ing", "~에 헌신하다", "She is devoted to helping others."], ["when it comes to -ing", "~에 관해서라면", "When it comes to cooking, he is the best."], ["in addition to -ing", "~ 외에도", "In addition to singing, she dances."], ["What do you say to -ing?", "~하는 게 어때?", "What do you say to eating out?"]], "tips": ["to 뒤에 명사를 넣어 말이 되면 전치사 → -ing", "be used to + 원형: ~하는 데 사용되다", "used to + 원형: ~하곤 했다"]}, "sets": {"workbook": [{"k": "pk", "q": "I'm looking forward to [meeting*/meet] your parents this weekend.", "e": "look forward to + -ing"}, {"k": "pk", "q": "Many residents objected to [building*/build] a factory near the school.", "e": "object to + -ing"}, {"k": "pk", "q": "She has decided to [study*/studying] medicine at university.", "e": "decide + to부정사 → 원형"}, {"k": "pk", "q": "My grandmother is not used to [using*/use] a smartphone yet.", "e": "be used to + -ing"}, {"k": "bl", "q": "그는 가난한 아이들을 돕는 데 일생을 바쳤다. → He devoted his life to (helping) poor children.", "e": "devote A to + -ing"}, {"k": "bl", "q": "요리에 관해서라면 우리 아빠가 최고다. → When it comes to (cooking), my dad is the best.", "e": "when it comes to + -ing"}, {"k": "bl", "q": "이 칼은 고기를 자르는 데 사용된다. → This knife is used to (cut) meat.", "e": "be used to + 원형 = 사용되다"}, {"k": "bl", "q": "산책하러 가는 게 어때? → What do you say to (going) for a walk?", "e": "What do you say to + -ing"}, {"k": "fx", "q": "We are all looking forward to see the new superhero movie next month.", "w": "see", "a": ["seeing"], "e": "look forward to + -ing"}, {"k": "fx", "q": "The coach is committed to improve the team's performance this season.", "w": "improve", "a": ["improving"], "e": "be committed to + -ing"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["I'm used to getting up early for school.", "She objected to being treated like a child.", "In addition to teaching, he writes novels.", "They are opposed to raise the bus fare.", "This machine is used to make ice."], "a": 3, "e": "④ be opposed to raising"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• I look forward to ____ from you soon.\n• He hopes to ____ the exam next month.", "o": ["hear – pass", "hearing – pass", "hearing – passing", "hear – passing", "heard – passed"], "a": 1, "e": "전치사 to + hearing / to부정사 + pass"}, {"k": "ch", "q": "다음 중 빈칸에 동명사가 와야 하는 것은?", "o": ["I want to ____ a new bike.", "She is accustomed to ____ in a big city.", "We decided to ____ home early.", "He went to the store to ____ some milk.", "They agreed to ____ the meeting."], "a": 1, "e": "be accustomed to + -ing"}, {"k": "pk", "q": "Wood is used to [make*/making] paper and furniture.", "e": "be used to + 원형 = 사용되다"}, {"k": "pk", "q": "Her research contributed to [developing*/develop] a new vaccine.", "e": "contribute to + -ing"}, {"k": "pk", "q": "He used to [play*/playing] soccer every day when he was young.", "e": "used to + 원형 = ~하곤 했다"}, {"k": "bl", "q": "나는 사람들 앞에서 말하는 것에 익숙하지 않다. → I'm not used to (speaking|talking) in front of people.", "e": "be used to + -ing"}, {"k": "bl", "q": "여행 외에도, 그녀는 사진 찍는 것을 좋아한다. → In addition to (traveling|travelling), she likes taking photos.", "e": "in addition to + -ing"}, {"k": "fx", "q": "Most students are accustomed to use computers in class.", "w": "use", "a": ["using"], "e": "be accustomed to + -ing"}, {"k": "ox", "q": "My father is opposed to my going abroad alone.", "a": true, "e": "✔ be opposed to + (의미상 주어) + -ing"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I look forward to working with you.\nⓑ She is used to wear glasses.\nⓒ When it comes to swimming, nobody beats him.\nⓓ Salt is used to preserve food.\nⓔ He devoted himself to protect the forest.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ wearing / ⓔ protecting"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• We're looking forward to (A)[visit / visiting] Jeju Island.\n• Solar energy is used to (B)[produce / producing] electricity.\n• The volunteers are dedicated to (C)[clean / cleaning] the beach every weekend.", "o": ["visiting – produce – cleaning", "visit – produce – clean", "visiting – producing – cleaning", "visiting – produce – clean", "visit – producing – cleaning"], "a": 0, "e": "(A) look forward to + -ing (B) 사용되다 → 원형 (C) be dedicated to + -ing"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["What do you say to ordering pizza tonight?", "He is not accustomed to eating spicy food.", "She agreed to lend me her notes.", "Many people object to working on weekends.", "Regular exercise contributes to stay healthy."], "a": 4, "e": "⑤ contribute to staying"}, {"k": "pk", "q": "After living in Korea for five years, Tom is used to [eating*/eat] kimchi with every meal.", "e": "be used to + -ing"}, {"k": "fx", "q": "I'm really looking forward to go on a trip with my friends.", "w": "go", "a": ["going"], "e": "look forward to + -ing"}, {"k": "fx", "q": "When it comes to choose a career, you should think carefully.", "w": "choose", "a": ["choosing"], "e": "when it comes to + -ing"}, {"k": "or", "q": "나는 너에게서 곧 소식을 듣기를 고대한다.", "a": "I look forward to hearing from you soon.", "e": "look forward to + -ing"}, {"k": "or", "q": "그녀는 혼자 여행하는 데 익숙하다.", "a": "She is used to traveling alone.", "e": "be used to + -ing"}, {"k": "wr", "q": "그들은 그 공장을 짓는 것에 반대한다. (object to, build the factory)", "a": ["They object to building the factory."], "e": "object to + -ing"}, {"k": "bl", "q": "A: 캐나다에서 첫 주는 어땠니? B: 힘들었지만 여기 사는 것에 익숙해지고 있어. → A: How was your first week in Canada? B: It was hard, but I'm getting used to (living) here.", "e": "get used to + -ing"}]}}, {"tag": "hof-06-P5", "name": "동명사/to부정사의 능동형 vs. 수동형", "talk": [{"k": "m", "t": "동명사·to부정사에도 **수동형**이 있어요! 의미상 주어가 그 동작을 **하면** 능동, **당하면** 수동 🔄"}, {"k": "m", "t": "형태: 동명사 능동 **-ing** / 수동 **being p.p.** · to부정사 능동 **to + 원형** / 수동 **to be p.p.**"}, {"k": "ex", "en": "Nobody likes being ignored.", "ko": "아무도 무시당하는 것을 좋아하지 않는다. (ignoring ✗)"}, {"k": "q", "q": "The children wanted ____ to the zoo.", "o": ["taking", "to take", "to be taken"], "a": 2, "ok": "맞아요! 아이들이 데려가지는 것 → 수동", "no": "아이들은 동물원에 '데려가지는' 쪽 → to be taken"}, {"k": "m", "t": "풀이 전략: ① 의미상 주어 찾기(대개 문장의 주어) ② '~하다'인지 '~되다·당하다'인지 해석 ③ 뒤에 목적어가 있으면 능동, 없으면 수동일 가능성 ↑"}, {"k": "q", "q": "She hates ____ what to do by others.", "o": ["telling", "being told", "to tell"], "a": 1, "ok": "정확해요! 그녀가 듣는(지시받는) 쪽 → being told", "no": "by others(행위자) → 수동 being told"}, {"k": "m", "t": "⚠️ **need / want + -ing** = need to be p.p. (능동형이 수동의 뜻): The car needs [washing]. = The car needs to be washed."}, {"k": "q", "q": "My bike needs ____. The tires are flat.", "o": ["repairing", "to repair", "repaired"], "a": 0, "ok": "맞아요! need + -ing = 수리될 필요가 있다", "no": "need + -ing가 수동 의미 → repairing (= to be repaired)"}, {"k": "m", "t": "정리! **하면 -ing / to + 원형, 당하면 being p.p. / to be p.p. · need -ing = need to be p.p.** 👍"}], "notes": {"table": [["구분", "능동", "수동"], ["동명사", "-ing (~하는 것)", "being p.p. (~되는 것)"], ["to부정사", "to + 원형 (~하는 것)", "to be p.p. (~되는 것)"], ["need / want", "need to + 원형 (주어가 ~해야 함)", "need -ing = need to be p.p. (주어가 ~되어야 함)"]], "tips": ["by + 행위자가 있으면 수동 가능성 ↑", "뒤에 목적어가 없으면 수동 의심", "The car needs to repair ✗ → to be repaired / repairing"]}, "sets": {"workbook": [{"k": "pk", "q": "I don't like [being treated*/treating] like a little kid.", "e": "내가 대우받는 쪽 → being p.p."}, {"k": "pk", "q": "The report needs [to be finished*/to finish] by Friday.", "e": "보고서가 끝내지는 쪽 → to be p.p."}, {"k": "pk", "q": "She was proud of [being chosen*/choosing] as the class president.", "e": "그녀가 선출된 쪽 → being p.p."}, {"k": "pk", "q": "The old house is waiting [to be repaired*/to repair] by the new owner.", "e": "집이 수리되는 쪽 → to be p.p."}, {"k": "bl", "q": "그는 그 파티에 초대받기를 원했다. → He wanted (to) (be) invited to the party.", "e": "to be p.p."}, {"k": "bl", "q": "그녀는 사람들 앞에서 칭찬받는 것을 좋아한다. → She likes (being) praised in front of people.", "e": "being p.p."}, {"k": "bl", "q": "그 셔츠는 다림질이 필요하다. → The shirt needs (ironing).", "e": "need + -ing = 수동 의미"}, {"k": "bl", "q": "그 아이는 혼자 남겨지는 것을 무서워했다. → The child was afraid of (being) left alone.", "e": "being p.p."}, {"k": "fx", "q": "Nobody enjoys laughing at by others in public.", "w": "laughing", "a": ["being laughed"], "e": "비웃음을 당하는 쪽 → being laughed at"}, {"k": "fx", "q": "The new school rules are expected to announce next week.", "w": "announce", "a": ["be announced"], "e": "규칙이 발표되는 쪽 → to be announced"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["He avoided being seen by his classmates.", "The issue needs to be discussed carefully.", "She hopes to be accepted by a good university.", "The patient needs to examine by a doctor right away.", "My computer needs fixing."], "a": 3, "e": "④ to be examined"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• The thief tried to avoid (A)[catching / being caught] by the police.\n• This book deserves (B)[to read / to be read] by every teenager.\n• The garden needs (C)[watering / to water] every morning.", "o": ["catching – to read – watering", "being caught – to be read – watering", "being caught – to read – to water", "being caught – to be read – to water", "catching – to be read – watering"], "a": 1, "e": "(A) 잡히는 쪽 (B) 읽히는 쪽 (C) need + -ing = 수동 의미"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The singer doesn't like ____ by reporters.", "o": ["following", "being followed", "to follow", "follow", "followed"], "a": 1, "e": "가수가 따라다님을 당함 → being followed"}, {"k": "pk", "q": "Students should be careful about [being tricked*/tricking] by fake news online.", "e": "속는 쪽 → being p.p."}, {"k": "pk", "q": "This letter needs [to be sent*/to send] today.", "e": "편지가 보내지는 쪽 → to be p.p."}, {"k": "pk", "q": "I'm tired of [being asked*/asking] the same questions over and over.", "e": "질문받는 쪽 → being p.p."}, {"k": "bl", "q": "그 건물은 내년에 철거될 예정이다. → The building is scheduled (to) (be) torn down next year.", "e": "to be p.p."}, {"k": "bl", "q": "그는 팀에서 제외되는 것을 두려워했다. → He feared (being) left out of the team.", "e": "being p.p."}, {"k": "fx", "q": "The children love telling bedtime stories by their grandmother.", "w": "telling", "a": ["being told"], "e": "아이들이 이야기를 듣는 쪽 → being told"}, {"k": "ox", "q": "The broken window needs to be replaced as soon as possible.", "a": true, "e": "✔ 창문이 교체되는 쪽 → to be p.p."}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ No one likes being lied to.\nⓑ The car needs to wash before the trip.\nⓒ She was happy to be invited to the wedding.\nⓓ My shoes need cleaning.\nⓔ He hates to be interrupted while working.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓒⓓⓔ 옳음 / ⓑ to be washed (= washing)"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The project is expected to be completed by June.", "I remember being told the story as a child.", "She insisted on being treated fairly.", "These documents need to sign by the manager.", "He was afraid of being punished."], "a": 3, "e": "④ to be signed"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n그 소년은 그의 친구들에게 놀림받는 것을 싫어했다.", "o": ["The boy hated teasing by his friends.", "The boy hated being teased by his friends.", "The boy hated to tease by his friends.", "The boy hated been teased by his friends.", "The boy hated be teased by his friends."], "a": 1, "e": "놀림을 당함 → being teased"}, {"k": "pk", "q": "Every student deserves [to be treated*/to treat] with respect.", "e": "학생이 대우받는 쪽 → to be p.p."}, {"k": "fx", "q": "The old bridge needs to repair before the rainy season.", "w": "repair", "a": ["be repaired"], "e": "다리가 수리되는 쪽 → to be repaired"}, {"k": "fx", "q": "She was upset about leaving out of the group photo.", "w": "leaving", "a": ["being left"], "e": "그녀가 빠진 쪽 → being left out"}, {"k": "or", "q": "그는 그 대회에 선발되기를 원한다.", "a": "He wants to be selected for the contest.", "e": "to be p.p
