per than I expected.\nI bought a new phone, and ____ was cheaper than I expected.", "o": ["which – it", "it – which", "which – which", "it – it", "that – it"], "a": 0, "e": "접속사 없음 → which / and가 있음 → it"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The boy who sits next to me is funny.", true], ["I know a man whose wife is a pilot.", true], ["The book which I borrowed was interesting.", true], ["She has two cats, both of them are black.", false], ["This is the town where I grew up.", true], ["The house which he lives is very big.", false], ["What he said was true.", true], ["My mom, that is a teacher, is kind.", false], ["The news that she was sick worried us.", true], ["All what I need is time.", false], ["The person to whom I spoke was polite.", true], ["I remember the day when we met.", true]], "e": "ⓓ both of which ⓕ where(in which) ⓗ who ⓙ that"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The girl whom I met was friendly.", true], ["I have a dog who name is Max.", false], ["He passed the test, which made his parents happy.", true], ["This is the hotel which we stayed at.", true], ["Do you know the reason which he left?", false], ["That's what I wanted to say.", true], ["I know that he is honest.", true], ["The fact which he cheated is shocking.", false], ["He is the first student that solved it.", true], ["Seoul, which is the capital, is crowded.", true], ["I met the boy and his dog that live next door.", true], ["The pen with that I wrote was red.", false]], "e": "ⓑ whose ⓔ why ⓗ that ⓛ which"}, {"k": "wr", "q": "나는 그녀가 말한 것을 이해하지 못했다. (understand, what, say)", "a": ["I didn't understand what she said.", "I did not understand what she said."], "e": "선행사 없음 → what"}, {"k": "wr", "q": "그는 많은 친구가 있는데, 그들 대부분은 운동선수이다. (many friends, most of whom, athletes)", "a": ["He has many friends, most of whom are athletes."], "e": "수량 + of whom"}]}}, {"book": "hof", "chapter": {"id": "11", "name": "명사와 대명사", "title": "해커스 어법 제대로 · Chapter 11 명사와 대명사"}, "units": [{"tag": "hof-11-P1", "name": "명사-대명사 수 일치", "talk": [{"k": "m", "t": "Chapter 11은 **명사와 대명사**! 어법 문제의 대명사는 **'무엇을 가리키는지'** 찾는 싸움이에요 🔍"}, {"k": "m", "t": "풀이 전략: 대명사가 보이면 ① 가리키는 명사를 찾고 ② 그 명사가 단수면 **it / its**, 복수면 [they] / **their / them**"}, {"k": "ex", "en": "The students who joined the club said their schedules were too busy.", "ko": "그 동아리에 가입한 학생들은 그들의 일정이 너무 바쁘다고 말했다."}, {"k": "q", "q": "The museum, which opened in 1990, changed ____ opening hours last year.", "o": ["its", "their", "his"], "a": 0, "ok": "맞아요! museum(단수) → its", "no": "가리키는 건 The museum(단수) → its"}, {"k": "m", "t": "⚠️ 함정: 대명사 **바로 앞 명사**가 정답이 아닐 수 있어요. 사이의 수식어(전치사구·관계절)는 괄호로 묶고 **진짜 가리키는 명사**를 찾으세요"}, {"k": "ex", "en": "The leaves of the old tree lose their color in autumn.", "ko": "그 오래된 나무의 잎들은 가을에 색을 잃는다. (tree가 아니라 leaves → their)"}, {"k": "q", "q": "Dolphins use sounds to communicate, and scientists study how ____ talk to each other.", "o": ["it", "they", "them"], "a": 1, "ok": "정확해요! Dolphins(복수) + 주어 자리 → they", "no": "talk의 주어 = 돌고래들(복수) → they"}, {"k": "m", "t": "소유격 **its**(그것의) ↔ **it's**(= it is) 헷갈리지 않기! The company lost [its] best workers."}, {"k": "m", "t": "정리! **대명사 → 가리키는 명사 찾기(수식어 괄호) → 단수 it·its / 복수 they·their·them** 👍"}], "notes": {"table": [["가리키는 명사", "주격", "소유격", "목적격"], ["단수 (사물·동물·집단)", "it", "its", "it"], ["복수", "they", "their", "them"], ["단수 사람", "he / she", "his / her", "him / her"]], "tips": ["수식어(전치사구·관계절)를 괄호로 묶고 가리키는 명사 찾기", "its(그것의) vs it's(= it is)", "each / every + 단수명사 → 사물이면 its로 받기"]}, "sets": {"workbook": [{"k": "pk", "q": "The new smartphone is popular because of [its*/their] long battery life.", "e": "smartphone(단수) → its"}, {"k": "pk", "q": "Many birds fly south because [it/they*] cannot find food in winter.", "e": "birds(복수) → they"}, {"k": "pk", "q": "The children in the village walk an hour to get to [its/their*] school.", "e": "children(복수) → their"}, {"k": "pk", "q": "The city built a new park for [its*/their] citizens.", "e": "city(단수) → its"}, {"k": "bl", "q": "그 회사는 작년에 그것의 로고를 바꿨다. → The company changed (its) logo last year.", "e": "company(단수) → its"}, {"k": "bl", "q": "그 책들을 다 읽으면 그것들을 도서관에 반납해라. → When you finish the books, return (them) to the library.", "e": "books(복수) → them"}, {"k": "bl", "q": "벌들은 그들의 꿀을 벌집에 저장한다. → Bees store (their) honey in the hive.", "e": "Bees(복수) → their"}, {"k": "bl", "q": "그 다리는 너무 오래되어서 시가 그것을 수리해야 한다. → The bridge is so old that the city must repair (it).", "e": "bridge(단수) → it"}, {"k": "fx", "q": "The plants on the balcony need water because its soil is dry.", "w": "its", "a": ["their"], "e": "plants(복수) → their"}, {"k": "fx", "q": "My brother bought a new laptop, but he hasn't used them yet.", "w": "them", "a": ["it"], "e": "laptop(단수) → it"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The team celebrated its victory with the fans.", "Elephants use their trunks to drink water.", "The students handed in their reports on time.", "The library extended its hours during exams.", "The cookies smelled great, so I ate it all."], "a": 4, "e": "⑤ cookies(복수) → them"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The scientists who studied the ice found that ____ thickness had decreased.", "o": ["it", "its", "their", "they", "them"], "a": 1, "e": "두께의 주인 = the ice(단수) → its"}, {"k": "ch", "q": "(A), (B)에서 어법에 맞는 것끼리 짝지은 것은?\nThe old houses in this area have lost (A)[its / their] charm, and the city plans to rebuild (B)[it / them].", "o": ["its – it", "its – them", "their – it", "their – them", "it – them"], "a": 3, "e": "(A) houses(복수) → their / (B) houses → them"}, {"k": "bl", "q": "그 식당은 그것의 손님들에게 무료 음료를 준다. → The restaurant gives free drinks to (its) customers.", "e": "restaurant(단수) → its"}, {"k": "bl", "q": "고양이들은 혀로 털을 청소한다. → Cats clean their fur with (their) tongues.", "e": "Cats(복수) → their"}, {"k": "pk", "q": "Every country has [its*/their] own traditions.", "e": "every + 단수명사 country → its"}, {"k": "pk", "q": "The workers at the factory asked for a raise, but the owner refused to pay [it/them*] more.", "e": "더 받을 사람 = workers(복수) → them"}, {"k": "fx", "q": "The museum is famous for their collection of ancient coins.", "w": "their", "a": ["its"], "e": "museum(단수) → its"}, {"k": "ox", "q": "Teenagers often care a lot about what their friends think.", "a": true, "e": "✔ Teenagers(복수) → their"}, {"k": "ox", "q": "The tree in our yard drops their leaves every fall.", "a": false, "e": "tree(단수) → its"}], "practiceB": [{"k": "wr", "q": "그 회사는 그것의 직원들에게 보너스를 주었다. (the company, gave, bonuses, employees)", "a": ["The company gave its employees bonuses.", "The company gave bonuses to its employees."], "e": "company(단수) → its"}, {"k": "wr", "q": "새들은 지붕 위에 그들의 둥지를 지었다. (the birds, built, nest, on the roof)", "a": ["The birds built their nest on the roof.", "The birds built their nests on the roof."], "e": "birds(복수) → their"}, {"k": "or", "q": "그 도시는 그것의 깨끗한 거리로 유명하다.", "a": "The city is famous for its clean streets.", "e": "city(단수) → its"}, {"k": "or", "q": "그 아이들은 그들의 부모님께 편지를 썼다.", "a": "The children wrote letters to their parents.", "e": "children(복수) → their"}, {"k": "fx", "q": "These shoes are expensive, but I really want to buy it.", "w": "it", "a": ["them"], "e": "shoes(복수) → them"}, {"k": "fx", "q": "Each of the rooms in the hotel has their own balcony.", "w": "their", "a": ["its"], "e": "Each(단수) of the rooms → its"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The bank changed its name last year.\nⓑ The rules of the game are simple, but children often forget it.\nⓒ Penguins cannot fly, but they swim very well.\nⓓ The shop, which sells used books, lowered their prices.\nⓔ My parents told me about their first trip abroad.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ rules(복수) → them / ⓓ shop(단수) → its"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The volunteers who cleaned the beach shared their photos online.", "The novel became popular soon after its release.", "Wolves usually hunt in groups, and they share the food.", "The windows of the old school were broken, so the workers replaced it.", "The country is proud of its long history."], "a": 3, "e": "④ 바꾼 것 = windows(복수) → them"}, {"k": "bl", "q": "그 동아리 회원들은 매달 회비를 낸다. → The members of the club pay (their) fees every month.", "e": "members(복수) → their"}, {"k": "bl", "q": "독자가 많은 그 신문은 디자인을 바꾸었다. → The newspaper, which has many readers, changed (its) design.", "e": "newspaper(단수) → its"}]}}, {"tag": "hof-11-P2", "name": "목적격 대명사 vs. 재귀대명사", "talk": [{"k": "m", "t": "주어와 목적어가 **같은 사람·사물**이면 목적어는 **재귀대명사(-self / -selves)**! 🪞"}, {"k": "ex", "en": "She looked at herself in the mirror for a long time.", "ko": "그녀는 거울 속 자신을 오랫동안 바라보았다."}, {"k": "m", "t": "풀이 전략: 목적어 자리 대명사를 보면 **'이 동작을 하는 사람(주어)이 누구?'** → 같으면 재귀대명사, 다르면 목적격"}, {"k": "q", "q": "My grandfather taught ____ to play the piano at 60. (스스로)", "o": ["him", "himself", "his"], "a": 1, "ok": "맞아요! 가르친 사람 = 배운 사람 → himself", "no": "주어 grandfather = 목적어 → himself"}, {"k": "m", "t": "⚠️ 함정: **to부정사의 의미상 주어** 기준! He asked me to help **him**. (돕는 사람 = me, 도움 받는 사람 = he → 다르니까 him)"}, {"k": "ex", "en": "The coach told the players to believe in themselves.", "ko": "코치는 선수들에게 자기 자신을 믿으라고 말했다. (믿는 사람 = players → themselves)"}, {"k": "q", "q": "Mom told me to take care of ____.", "o": ["me", "myself", "herself"], "a": 1, "ok": "맞아요! 돌보는 사람 = me → myself", "no": "take care의 주체 = 나(me) → myself"}, {"k": "m", "t": "⚠️ 복수 주어는 -selves: we → [ourselves], they → themselves, you(복수) → yourselves"}, {"k": "m", "t": "강조 용법은 빼도 문장이 완전해요: I fixed the car **myself**. (목적어 자리가 아님)"}, {"k": "m", "t": "정리! **목적어 = 그 동작의 주어 → 재귀대명사 / 다르면 목적격 / to부정사는 의미상 주어 기준** 👍"}], "notes": {"table": [["상황", "대명사", "예"], ["목적어 = 주어", "재귀대명사", "He blamed himself for the mistake."], ["목적어 ≠ 주어", "목적격", "He blamed me for the mistake."], ["to부정사의 목적어 = 의미상 주어", "재귀대명사", "She asked me to introduce myself."], ["to부정사의 목적어 ≠ 의미상 주어", "목적격", "She asked me to introduce her."]], "tips": ["전치사 뒤도 같은 원리: He talked to himself. / He talked to me.", "관용: by oneself(혼자), for oneself(스스로), enjoy oneself(즐기다), help oneself to(마음껏 먹다)", "명령문의 주어는 you → yourself / yourselves"]}, "sets": {"workbook": [{"k": "pk", "q": "I hurt [me/myself*] while I was moving the desk.", "e": "주어 I = 목적어 → myself"}, {"k": "pk", "q": "The teacher praised [us*/ourselves] for our hard work.", "e": "칭찬한 사람(teacher) ≠ 받은 사람(we) → us"}, {"k": "pk", "q": "They introduced [them/themselves*] to the new neighbors.", "e": "주어 They = 목적어 → themselves"}, {"k": "pk", "q": "Jake asked me to wait for [him*/himself] at the station.", "e": "기다리는 사람 = me, 기다림 받는 사람 = Jake → him"}, {"k": "bl", "q": "그녀는 혼자 힘으로 그 문제를 풀었다. → She solved the problem by (herself).", "e": "by oneself = 혼자 힘으로"}, {"k": "bl", "q": "너 자신을 다른 사람과 비교하지 마. → Don't compare (yourself) with others.", "e": "명령문 주어 you → yourself"}, {"k": "bl", "q": "그는 나에게 그를 믿어 달라고 말했다. → He asked me to trust (him).", "e": "믿는 사람 = me ≠ he → him"}, {"k": "bl", "q": "우리는 파티에서 즐거운 시간을 보냈다. → We enjoyed (ourselves) at the party.", "e": "enjoy oneself"}, {"k": "fx", "q": "I cut me while I was cooking dinner.", "w": "me", "a": ["myself"], "e": "주어 I = 목적어 → myself"}, {"k": "fx", "q": "We should protect us from the sun in summer.", "w": "us", "a": ["ourselves"], "e": "주어 We = 목적어 → ourselves"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Tom hurt himself while playing soccer.", "The doctor told me to take care of myself.", "We prepared ourselves for the final exam.", "I introduced me to the new classmates.", "The manager asked us to help him with the boxes."], "a": 3, "e": "④ 주어 I = 목적어 → myself"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe children enjoyed ____ at the camp.\nTheir parents told ____ to be careful.", "o": ["them – them", "them – themselves", "themselves – them", "themselves – themselves", "theirs – them"], "a": 2, "e": "enjoy oneself → themselves / 말한 사람(parents) ≠ 들은 사람(children) → them"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nAmy asked her brother to drive (A)[her / herself] to the airport. On the way, she reminded (B)[her / herself] to check her passport. Her brother promised to take good care of (C)[him / himself] while she was away.", "o": ["her – her – him", "her – herself – himself", "herself – her – him", "herself – herself – himself", "her – herself – him"], "a": 1, "e": "(A) 운전하는 사람 = 오빠 ≠ Amy → her / (B) 주어 she = 목적어 → herself / (C) promise는 약속한 사람(brother)이 동작의 주체 → himself"}, {"k": "bl", "q": "그는 거울 속의 자신을 보고 웃었다. → He laughed when he saw (himself) in the mirror.", "e": "주어 he = 목적어 → himself"}, {"k": "bl", "q": "선생님은 우리에게 자기소개를 하라고 하셨다. → The teacher asked us to introduce (ourselves).", "e": "소개하는 사람 = us → ourselves"}, {"k": "pk", "q": "I was so nervous that I had to calm [me/myself*] down before the speech.", "e": "주어 I = 목적어 → myself"}, {"k": "pk", "q": "The students thanked the volunteers for helping [them*/themselves] with homework.", "e": "돕는 사람 = volunteers ≠ 도움 받은 students → them"}, {"k": "fx", "q": "Let's not blame us for things we cannot control.", "w": "us", "a": ["ourselves"], "e": "탓하는 사람 = we = 탓 받는 사람 → ourselves"}, {"k": "ox", "q": "My parents told me to believe in myself.", "a": true, "e": "✔ 믿는 사람 = me → myself"}, {"k": "ox", "q": "He asked me to help himself with the project.", "a": false, "e": "돕는 사람 = me ≠ he → him"}], "practiceB": [{"k": "wr", "q": "그녀는 그 사고에 대해 자신을 탓했다. (blamed, for the accident)", "a": ["She blamed herself for the accident."], "e": "주어 = 목적어 → herself"}, {"k": "wr", "q": "그는 나에게 그를 기다려 달라고 부탁했다. (asked, to wait for)", "a": ["He asked me to wait for him."], "e": "기다리는 사람 = me ≠ he → him"}, {"k": "or", "q": "아이들은 해변에서 즐거운 시간을 보냈다.", "a": "The children enjoyed themselves at the beach.", "e": "enjoy oneself"}, {"k": "or", "q": "엄마는 나에게 나 자신을 돌보라고 말씀하셨다.", "a": "My mom told me to take care of myself.", "e": "돌보는 사람 = me → myself"}, {"k": "fx", "q": "Before the interview, I practiced introducing me in English many times.", "w": "me", "a": ["myself"], "e": "소개하는 사람 = I → myself"}, {"k": "fx", "q": "The coach encouraged the players to push himself harder.", "w": "himself", "a": ["themselves"], "e": "push하는 사람 = players(복수) → themselves"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ We taught ourselves how to swim.\nⓑ She asked me to call herself later.\nⓒ The boys hurt themselves while climbing.\nⓓ I told him to be proud of himself.\nⓔ You should love you more.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ 전화하는 사람 = me → her / ⓔ yourself"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The cat cleaned itself after eating.", "They asked me to join them for dinner.", "He reminded himself to stay calm during the test.", "Students should express themselves freely in class.", "My aunt bought me a gift and wrapped it by myself."], "a": 4, "e": "⑤ 포장한 사람 = aunt → by herself"}, {"k": "bl", "q": "Help (yourself|yourselves) to the snacks on the table. (마음껏 드세요)", "e": "help oneself to"}, {"k": "bl", "q": "The guide told us to stay close to (him|her). (가이드 곁에)", "e": "머무는 사람 = us ≠ 가이드 → him / her"}]}}, {"tag": "hof-11-P3", "name": "it/them vs. that/those", "talk": [{"k": "m", "t": "**it / them** vs **that / those** — 둘 다 앞의 명사를 대신하지만 쓰임이 달라요 ⚖️"}, {"k": "m", "t": "① **it / them**: 앞에 나온 **바로 그것**을 가리킴 (뒤에 of ~ 같은 수식어 ✗)"}, {"k": "ex", "en": "I borrowed a novel from Jisu and returned it yesterday.", "ko": "나는 지수에게서 소설을 빌렸고 어제 그것을 돌려주었다."}, {"k": "m", "t": "② **that / those**: 같은 종류의 **다른 것**. 주로 비교구문에서 뒤에 **of ~ / in ~** 수식어가 붙어요. 단수 [that], 복수 [those]"}, {"k": "ex", "en": "The population of Seoul is larger than that of Busan.", "ko": "서울의 인구는 부산의 인구보다 많다."}, {"k": "q", "q": "The ears of a rabbit are longer than ____ of a cat.", "o": ["it", "that", "those"], "a": 2, "ok": "맞아요! ears(복수) + of → those", "no": "of가 붙음 + ears(복수) → those"}, {"k": "m", "t": "풀이 전략: 대명사 뒤에 **of / in + 명사**가 붙어 있으면 it·them ✗ → 비교 대상 명사의 수를 보고 that / those"}, {"k": "q", "q": "The climate here is milder than ____ of my hometown.", "o": ["it", "that", "those"], "a": 1, "ok": "정확해요! climate(단수) → that", "no": "of가 붙음 + climate(단수) → that"}, {"k": "m", "t": "보너스: **those who** = ~하는 사람들 (they who ✗) → Those who exercise regularly sleep better."}, {"k": "m", "t": "정리! **바로 그것 → it·them / 같은 종류 + 수식어 → that(단수)·those(복수) / those who** 👍"}], "notes": {"table": [["구분", "가리키는 것", "예"], ["it / them", "앞에 나온 바로 그것", "I lost my keys and can't find them."], ["that (of)", "같은 종류의 다른 것 (단수)", "The price of gold is higher than that of silver."], ["those (of)", "같은 종류의 다른 것 (복수)", "Her grades are better than those of her brother."], ["those who", "~하는 사람들", "Those who read a lot write well."]], "tips": ["it of / them of ✗ — 수식어가 붙으면 that / those", "비교 대상의 수: 앞 명사가 단수 → that, 복수 → those", "they who ✗ → those who"]}, "sets": {"workbook": [{"k": "pk", "q": "The weather in Jeju is warmer than [it/that*] in Seoul.", "e": "in ~ 수식어 + weather(단수) → that"}, {"k": "pk", "q": "The prices of fruit at the market are lower than [those*/that] at the supermarket.", "e": "prices(복수) → those"}, {"k": "pk", "q": "I bought a jacket online, but [it*/that] was too small.", "e": "바로 그 재킷 → it"}, {"k": "pk", "q": "[Those*/They] who arrive late must wait outside.", "e": "those who = ~하는 사람들"}, {"k": "bl", "q": "이 차의 엔진은 저 차의 엔진보다 조용하다. → The engine of this car is quieter than (that) of that car.", "e": "engine(단수) → that"}, {"k": "bl", "q": "그녀의 그림들은 그녀 선생님의 그림들만큼 아름답다. → Her paintings are as beautiful as (those) of her teacher.", "e": "paintings(복수) → those"}, {"k": "bl", "q": "나는 우산을 샀지만 버스에 그것을 두고 내렸다. → I bought an umbrella, but I left (it) on the bus.", "e": "바로 그 우산 → it"}, {"k": "bl", "q": "포기하지 않는 사람들은 결국 성공한다. → (Those) who never give up succeed in the end.", "e": "those who"}, {"k": "fx", "q": "The taste of this soup is better than it of the soup I made.", "w": "it", "a": ["that"], "e": "of 수식어 + taste(단수) → that"}, {"k": "fx", "q": "The roads in the city are wider than that in the countryside.", "w": "that", "a": ["those"], "e": "roads(복수) → those"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The skin of a baby is softer than ____ of an adult.", "o": ["it", "its", "that", "those", "them"], "a": 2, "e": "skin(단수) → that"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The income of doctors is higher than that of teachers.", "The rules of this game are easier than those of chess.", "I found my old diary and read it again.", "The eyes of an owl are bigger than that of a hawk.", "Those who help others feel happier."], "a": 3, "e": "④ eyes(복수) → those"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe population of India is now larger than (A)[that / those] of China. The cities of India are growing fast, and many people move to (B)[it / them] for jobs. (C)[Those / They] who live in big cities often pay high rents.", "o": ["that – it – Those", "that – them – Those", "those – them – They", "those – it – Those", "that – them – They"], "a": 1, "e": "(A) population(단수) → that / (B) 바로 그 cities → them / (C) those who"}, {"k": "bl", "q": "이 호텔의 방들은 저 호텔의 방들보다 깨끗하다. → The rooms in this hotel are cleaner than (those) in that hotel.", "e": "rooms(복수) → those"}, {"k": "bl", "q": "나는 열쇠들을 잃어버렸지만 소파 밑에서 그것들을 찾았다. → I lost my keys, but I found (them) under the sofa.", "e": "바로 그 열쇠들 → them"}, {"k": "pk", "q": "The voice of the new singer is similar to [that*/those] of a famous star.", "e": "voice(단수) → that"}, {"k": "pk", "q": "The color of the sky today is different from [it/that*] of yesterday.", "e": "of 수식어 → that"}, {"k": "fx", "q": "The teeth of a shark are sharper than that of a dolphin.", "w": "that", "a": ["those"], "e": "teeth(복수) → those"}, {"k": "ox", "q": "The quality of these shoes is better than that of the cheap ones.", "a": true, "e": "✔ quality(단수) → that"}, {"k": "ox", "q": "They who study every day do well on tests.", "a": false, "e": "they who ✗ → Those who"}], "practiceB": [{"k": "wr", "q": "한국의 여름은 영국의 여름보다 덥다. (the summer in Korea, hotter, in England)", "a": ["The summer in Korea is hotter than that in England.", "Summer in Korea is hotter than that in England."], "e": "summer(단수) → that"}, {"k": "wr", "q": "다른 사람들을 돕는 사람들은 더 오래 산다. (help others, live longer)", "a": ["Those who help others live longer."], "e": "those who"}, {"k": "or", "q": "산의 공기는 도시의 공기보다 깨끗하다.", "a": "The air in the mountains is cleaner than that in the city.", "e": "air(단수) → that"}, {"k": "or", "q": "그 소녀의 눈은 그녀 엄마의 눈과 닮았다.", "a": "The eyes of the girl look like those of her mother.", "e": "eyes(복수) → those"}, {"k": "fx", "q": "The cost of living in Seoul is higher than those in many other cities.", "w": "those", "a": ["that"], "e": "cost(단수) → that"}, {"k": "fx", "q": "The number of cars in Seoul is larger than it in Busan.", "w": "it", "a": ["that"], "e": "in 수식어 + number(단수) → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The salary of a pilot is higher than that of a driver.\nⓑ The leaves of this plant are bigger than that of that plant.\nⓒ Those who wear helmets are safer on bikes.\nⓓ The sound of the piano is softer than it of the drum.\nⓔ I made a cake and gave it to my neighbor.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ leaves(복수) → those / ⓓ it of ✗ → that"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe meals at this school are healthier than ____ at my old school.\n____ who skip breakfast often feel tired in class.", "o": ["that – They", "those – Those", "that – Those", "those – They", "them – Those"], "a": 1, "e": "meals(복수) → those / those who"}, {"k": "bl", "q": "박쥐의 날개는 새의 날개보다 얇다. → The wings of a bat are thinner than (those) of a bird.", "e": "wings(복수) → those"}, {"k": "bl", "q": "한국의 역사는 미국의 역사보다 길다. → The history of Korea is longer than (that) of the United States.", "e": "history(단수) → that"}]}}, {"tag": "hof-11-P4", "name": "it/them vs. one/ones", "talk": [{"k": "m", "t": "이번엔 **it / them** vs **one / ones** 🔁"}, {"k": "m", "t": "① **it / them**: **바로 그 물건** (= the + 명사) / ② **one / ones**: 같은 종류의 **아무거나** (= a + 명사)"}, {"k": "ex", "en": "I lost my umbrella, so I need to buy a new one.", "ko": "나는 우산을 잃어버려서 새 것을 하나 사야 한다. (새 우산 = 다른 우산 → one)"}, {"k": "ex", "en": "I lost my umbrella, but I found it in the classroom.", "ko": "우산을 잃어버렸지만 교실에서 그것을 찾았다. (바로 그 우산 → it)"}, {"k": "q", "q": "My laptop is too slow. I want a faster ____.", "o": ["it", "one", "ones"], "a": 1, "ok": "맞아요! 다른 노트북 하나 → one", "no": "바로 그 노트북이 아니라 '더 빠른 다른 것' → one"}, {"k": "m", "t": "풀이 전략: **a + 형용사 / the + 형용사** 뒤 명사 자리 → one·ones (a new it ✗)"}, {"k": "m", "t": "복수 명사는 [ones]: These shoes are too tight. Do you have bigger ones?"}, {"k": "q", "q": "These apples are sour. Give me the sweet ____.", "o": ["one", "ones", "them"], "a": 1, "ok": "정확해요! apples(복수) + 형용사 뒤 → ones", "no": "형용사 sweet 뒤 + 복수 → ones"}, {"k": "m", "t": "⚠️ 셀 수 없는 명사는 one으로 못 받아요: I prefer hot tea to cold one ✗ → cold tea"}, {"k": "m", "t": "정리! **바로 그것 → it·them / 같은 종류 아무거나 → one·ones / 형용사 뒤 → one·ones** 👍"}], "notes": {"table": [["구분", "뜻", "예"], ["it", "바로 그것 (단수)", "I bought a hat and wore it."], ["them", "바로 그것들 (복수)", "I bought socks and wore them."], ["one", "같은 종류의 하나 (= a + 명사)", "I need a pen. Can you lend me one?"], ["ones", "같은 종류의 여러 개", "I like the blue cups more than the white ones."]], "tips": ["a / 형용사 + it ✗ → one", "셀 수 없는 명사(water, coffee, money)는 one ✗", "this one / that one / which one"]}, "sets": {"workbook": [{"k": "pk", "q": "I don't have a pencil. Can you lend me [it/one*]?", "e": "아무 연필 하나 → one"}, {"k": "pk", "q": "I wrote a letter and sent [it*/one] to my grandmother.", "e": "바로 그 편지 → it"}, {"k": "pk", "q": "These jeans are too long. I'll try the shorter [one/ones*].", "e": "jeans(복수) → ones"}, {"k": "pk", "q": "My bike was stolen, so my dad bought me a new [one*/it].", "e": "a new + 같은 종류 → one"}, {"k": "bl", "q": "나는 휴대폰을 떨어뜨려서 그것을 망가뜨렸다. → I dropped my phone and broke (it).", "e": "바로 그 휴대폰 → it"}, {"k": "bl", "q": "이 셔츠는 너무 커요. 더 작은 것 있나요? → This shirt is too big. Do you have a smaller (one)?", "e": "a + 형용사 + one"}, {"k": "bl", "q": "빨간 장미가 하얀 것들보다 더 비싸다. → Red roses are more expensive than white (ones).", "e": "roses(복수) → ones"}, {"k": "bl", "q": "그는 새 신발을 샀고 매일 그것을 신는다. → He bought new shoes and wears (them) every day.", "e": "바로 그 신발 → them"}, {"k": "fx", "q": "I lost my watch yesterday, and I have to buy a new it.", "w": "it", "a": ["one"], "e": "a new + 같은 종류 → one"}, {"k": "fx", "q": "The old chairs were broken, so we replaced them with new one.", "w": "one", "a": ["ones"], "e": "chairs(복수) → ones"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 하나는?", "o": ["I need an eraser. Do you have ____?", "My cap is old. I want a new ____.", "This box is heavy. Can you carry ____ for me?", "Which ____ do you like better, the blue or the green?", "There's a bus stop near here. Is there ____ near your house too?"], "a": 2, "e": "③ 바로 그 상자 → it / 나머지는 one"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I bought a cake and shared it with my friends.", "These boots are cheaper than the leather ones.", "If you need a charger, I can lend you one.", "My computer is slow, so I want a faster it.", "I found my glasses and put them on."], "a": 3, "e": "④ a faster one"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nMy old backpack was torn, so I bought a new (A)[it / one] last week. I really like (B)[it / one] because it has many pockets. The small pockets are more useful than the big (C)[one / ones].", "o": ["it – it – one", "one – it – ones", "one – one – ones", "it – one – ones", "one – it – one"], "a": 1, "e": "(A) a new one / (B) 바로 그 가방 → it / (C) pockets(복수) → ones"}, {"k": "bl", "q": "이 컵들은 더러워. 깨끗한 것들을 줄래? → These cups are dirty. Can you give me clean (ones)?", "e": "cups(복수) → ones"}, {"k": "bl", "q": "나는 그 책을 빌렸고 어제 그것을 다 읽었다. → I borrowed the book and finished (it) yesterday.", "e": "바로 그 책 → it"}, {"k": "pk", "q": "I've lost my pen. I think I left [it*/one] in the library.", "e": "바로 그 펜 → it"}, {"k": "pk", "q": "Small cars use less gas than large [one/ones*].", "e": "cars(복수) → ones"}, {"k": "fx", "q": "If you don't have a dictionary, you can borrow it from the library.", "w": "it", "a": ["one"], "e": "가진 사전이 없음 → 아무거나 하나 → one"}, {"k": "ox", "q": "My sneakers are worn out, so I need new ones.", "a": true, "e": "✔ sneakers(복수) → ones"}, {"k": "ox", "q": "I liked the movie so much that I watched one again.", "a": false, "e": "바로 그 영화 → it"}], "practiceB": [{"k": "wr", "q": "내 우산이 망가져서 나는 새 것을 하나 샀다. (my umbrella, broke, bought, a new one)", "a": ["My umbrella broke, so I bought a new one.", "My umbrella broke so I bought a new one.", "I bought a new one because my umbrella broke."], "e": "a new one"}, {"k": "wr", "q": "나는 그 사진들을 찍어서 엄마에게 그것들을 보냈다. (took the pictures, sent, to my mom)", "a": ["I took the pictures and sent them to my mom."], "e": "바로 그 사진들 → them"}, {"k": "or", "q": "이 바지는 너무 짧아요. 더 긴 것이 있나요?", "a": "These pants are too short. Do you have longer ones?", "e": "pants(복수) → ones"}, {"k": "or", "q": "나는 모자를 잃어버렸지만 공원에서 그것을 찾았다.", "a": "I lost my hat, but I found it in the park.", "e": "바로 그 모자 → it"}, {"k": "fx", "q": "The new phones are lighter than the old one.", "w": "one", "a": ["ones"], "e": "phones(복수) → ones"}, {"k": "fx", "q": "Jisu wanted a puppy, and her parents finally got her it.", "w": "it", "a": ["one"], "e": "아무 강아지 한 마리 → one"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I need a ruler. Do you have one?\nⓑ These grapes are sweeter than the green ones.\nⓒ I made a sandwich and ate one.\nⓓ My shoes are dirty, so I washed them.\nⓔ If you want a cookie, take it from the jar.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ 바로 그 샌드위치 → it / ⓔ 아무거나 하나 → one"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The hotel room was nice, but the one next door was noisy.", "I don't like these gloves. Show me the black ones.", "She has two brothers, and one of them is a doctor.", "We moved to a bigger house because the old one was too small.", "I prefer cold water to warm one."], "a": 4, "e": "⑤ water(셀 수 없음) → warm water"}, {"k": "bl", "q": "이 토마토는 내가 지난주에 산 것들보다 더 신선하다. → These tomatoes are fresher than the (ones) I bought last week.", "e": "tomatoes(복수) → ones"}, {"k": "bl", "q": "내 공책을 못 찾겠어. 그것을 봤니? → I can't find my notebook. Have you seen (it)?", "e": "바로 그 공책 → it"}]}}, {"tag": "hof-11-P5", "name": "수량 표현-명사 수 일치", "talk": [{"k": "m", "t": "수량 표현마다 **짝꿍 명사**가 정해져 있어요 🔢"}, {"k": "m", "t": "① 셀 수 있는 복수명사와: **many, few, a few, a number of, several, both** → many [students], a few days"}, {"k": "m", "t": "② 셀 수 없는 명사와: **much, little, a little, a great deal of, an amount of** → much money, little time"}, {"k": "q", "q": "We have ____ information about the new rule.", "o": ["few", "little", "many"], "a": 1, "ok": "맞아요! information(셀 수 없음) → little", "no": "information은 셀 수 없는 명사 → little"}, {"k": "m", "t": "③ 단수명사와: **each, every, another, either, neither** → every student, each country"}, {"k": "q", "q": "Every ____ in this class has a laptop.", "o": ["student", "students", "student's"], "a": 0, "ok": "정확해요! every + 단수명사", "no": "every 뒤는 단수명사 → student"}, {"k": "m", "t": "④ 둘 다 OK: **a lot of, lots of, plenty of, some, any, most, all** + 복수명사 / 셀 수 없는 명사"}, {"k": "m", "t": "⚠️ 함정: **a number of** + 복수명사 '많은' / **the number of** + 복수명사 '~의 수' → 명사는 둘 다 복수!"}, {"k": "m", "t": "⚠️ one of / each of + **the + 복수명사**: one of the student ✗ → one of the [students]"}, {"k": "m", "t": "🎉 Chapter 11 명사와 대명사 끝! **수량 표현 → 짝꿍 명사(복수 / 셀 수 없는 / 단수) 확인** 👍"}], "notes": {"table": [["수량 표현", "+ 명사", "예"], ["many / few / a few / several / a number of / both", "셀 수 있는 복수명사", "a few minutes, several ideas"], ["much / little / a little / a great deal of / an amount of", "셀 수 없는 명사", "little hope, a great deal of effort"], ["each / every / another / either / neither", "단수명사", "each player, every morning"], ["a lot of / lots of / plenty of / some / any / most / all", "복수명사 · 셀 수 없는 명사 모두", "a lot of books, a lot of water"]], "tips": ["셀 수 없는 명사: information, advice, furniture, equipment, homework, news, evidence", "one of / each of + the 복수명사", "few·little = 거의 없는(부정) / a few·a little = 약간 있는(긍정)"]}, "sets": {"workbook": [{"k": "pk", "q": "She gave me [many/much*] advice about the interview.", "e": "advice(셀 수 없음) → much"}, {"k": "pk", "q": "There are [a few*/a little] cookies left in the jar.", "e": "cookies(복수) → a few"}, {"k": "pk", "q": "Each [team*/teams] has five players.", "e": "each + 단수명사"}, {"k": "pk", "q": "I need [a little*/a few] time to think about it.", "e": "time(셀 수 없음) → a little"}, {"k": "bl", "q": "그 박물관을 매년 많은 관광객들이 방문한다. → (Many|A lot of|Lots of) tourists visit the museum every year.", "e": "tourists(복수) → many"}, {"k": "bl", "q": "냉장고에 우유가 거의 없다. → There is (little) milk in the fridge.", "e": "milk(셀 수 없음) + 거의 없는 → little"}, {"k": "bl", "q": "그 집의 모든 방에는 창문이 있다. → Every (room) in the house has a window.", "e": "every + 단수명사"}, {"k": "bl", "q": "그녀는 몇 개의 언어를 말할 수 있다. → She can speak (several|a few) languages.", "e": "languages(복수) → several / a few"}, {"k": "fx", "q": "We bought a lot of new furnitures for the living room.", "w": "furnitures", "a": ["furniture"], "e": "furniture는 셀 수 없는 명사 → -s ✗"}, {"k": "fx", "q": "Every students must wear a uniform.", "w": "students", "a": ["student"], "e": "every + 단수명사"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? There are ____ books on the shelf.", "o": ["many", "a few", "several", "a number of", "much"], "a": 4, "e": "books(복수) → much ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Few people came to the meeting because of the rain.", "He spent a great deal of money on the trip.", "Each of the students has a locker.", "She asked me a few questions about my plan.", "There isn't many information on the website."], "a": 4, "e": "⑤ information(셀 수 없음) → much"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe teacher gave us (A)[a few / a little] homework for the weekend. (B)[Each / All] student had to read three articles, but (C)[few / little] students finished them.", "o": ["a few – Each – few", "a little – Each – few", "a little – All – little", "a few – All – little", "a little – Each – little"], "a": 1, "e": "(A) homework(셀 수 없음) → a little / (B) 단수 student → Each / (C) students(복수) → few"}, {"k": "bl", "q": "그 배우는 많은 팬들을 가지고 있다. → The actor has a large (number) of fans.", "e": "a large number of + 복수명사"}, {"k": "bl", "q": "나는 그 일에 대해 약간의 경험이 있다. → I have (a little|some) experience with the job.", "e": "experience(경험, 셀 수 없음) → a little"}, {"k": "pk", "q": "Neither [answer*/answers] was correct.", "e": "neither + 단수명사"}, {"k": "pk", "q": "We had [little*/few] rain this summer, so the rivers were low.", "e": "rain(셀 수 없음) → little"}, {"k": "fx", "q": "The scientist collected many evidence to support her theory.", "w": "many", "a": ["much", "a lot of", "lots of", "plenty of"], "e": "evidence(셀 수 없음) → much"}, {"k": "ox", "q": "A number of students were absent because of the flu.", "a": true, "e": "✔ a number of + 복수명사"}, {"k": "ox", "q": "She has visited much countries in Europe.", "a": false, "e": "countries(복수) → many"}], "practiceB": [{"k": "wr", "q": "그는 나에게 몇 가지 유용한 조언을 해 주었다. (gave, some useful advice)", "a": ["He gave me some useful advice.", "He gave some useful advice to me."], "e": "advice는 셀 수 없음 → -s ✗"}, {"k": "wr", "q": "그 반의 각 학생은 발표를 해야 한다. (each student, in the class, has to, give a presentation)", "a": ["Each student in the class has to give a presentation."], "e": "each + 단수명사"}, {"k": "or", "q": "많은 사람들이 그 대회에 참가했다.", "a": "A number of people took part in the contest.", "e": "a number of + 복수명사"}, {"k": "or", "q": "우리에게는 남은 시간이 거의 없다.", "a": "We have little time left.", "e": "time(셀 수 없음) → little"}, {"k": "fx", "q": "One of the player on the team broke his leg.", "w": "player", "a": ["players"], "e": "one of the + 복수명사"}, {"k": "fx", "q": "There are a little chairs in the waiting room.", "w": "little", "a": ["few"], "e": "chairs(복수) → a few"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Every child needs love and care.\nⓑ He drank too much coffees last night.\nⓒ Several members of the club were late.\nⓓ We need more informations about it.\nⓔ A few of my friends live abroad.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ coffee / ⓓ information"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The number of cars in the city is increasing.", "Both of my parents enjoy hiking.", "She didn't have much money, but she was happy.", "Another students joined our team yesterday.", "Plenty of water is necessary in hot weather."], "a": 3, "e": "④ another + 단수명사 → Another student"}, {"k": "bl", "q": "Neither (option|choice|plan) is perfect, but we have to choose one. (선택지)", "e": "neither + 단수명사"}, {"k": "bl", "q": "There were (few) people on the street late at night. (거의 없는)", "e": "people(복수) + 거의 없는 → few"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그 회사는 다음 달에 그것의 새 제품을 출시할 것이다. (the company, will launch, new product, next month)", "a": ["The company will launch its new product next month."], "e": "company(단수) → its"}, {"k": "wr", "q": "선생님은 우리에게 우리 자신을 믿으라고 말씀하셨다. (the teacher, told, to believe in)", "a": ["The teacher told us to believe in ourselves."], "e": "믿는 사람 = us → ourselves"}, {"k": "wr", "q": "토끼의 귀는 고양이의 귀보다 길다. (the ears of a rabbit, longer, of a cat)", "a": ["The ears of a rabbit are longer than those of a cat."], "e": "ears(복수) → those"}, {"k": "wr", "q": "내 자전거는 너무 낡아서 나는 새 것을 원한다. (so old that, want, a new one)", "a": ["My bike is so old that I want a new one.", "My bicycle is so old that I want a new one."], "e": "a new one"}, {"k": "wr", "q": "그 상자 안에는 사과가 몇 개 있다. (there are, a few apples, in the box)", "a": ["There are a few apples in the box."], "e": "a few + 복수명사"}, {"k": "bl", "q": "축구의 규칙은 럭비의 규칙보다 간단하다. → The rules of soccer are simpler than (those) of rugby.", "e": "rules(복수) → those"}, {"k": "bl", "q": "I enjoyed (myself) at the festival. (즐거운 시간을 보냈다)", "e": "enjoy oneself"}, {"k": "fx", "q": "The bakery is famous for their fresh bread.", "w": "their", "a": ["its"], "e": "bakery(단수) → its"}, {"k": "fx", "q": "I bought new sneakers because the old one had holes.", "w": "one", "a": ["ones"], "e": "sneakers(복수) → ones"}, {"k": "or", "q": "다른 사람들을 존중하는 사람들은 존중받는다.", "a": "Those who respect others are respected.", "e": "those who"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? The city is planning to expand ____ subway system.", "o": ["it", "its", "their", "they", "it's"], "a": 1, "e": "city(단수) → its"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Ms. Kim told her students to be proud of ____.", "o": ["them", "themselves", "herself", "her", "their"], "a": 1, "e": "자랑스러워하는 사람 = students → themselves"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The temperature in July is higher than ____ in May.", "o": ["it", "its", "that", "those", "them"], "a": 2, "e": "temperature(단수) + in ~ → that"}, {"k": "ch", "q": "빈칸에 알맞은 것은? This printer is broken. We need to buy a new ____.", "o": ["it", "one", "ones", "them", "that"], "a": 1, "e": "a new + 같은 종류 → one"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? We don't have ____ time before the train leaves.", "o": ["much", "a lot of", "enough", "many", "any"], "a": 3, "e": "time(셀 수 없음) → many ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The bird spread its wings and flew away.", "He asked me to drive him home.", "The streets of Rome are narrower than those of Paris.", "I lost my earphones, so I bought new ones.", "Every visitors must show a ticket."], "a": 4, "e": "⑤ every + 단수명사 → visitor"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nWhen my sister got her first paycheck, she bought (A)[her / herself] a nice watch. She also bought our parents a gift and gave (B)[it / one] to them at dinner. The price of her watch was higher than (C)[that / those] of my watch.", "o": ["her – it – that", "herself – one – those", "herself – it – that", "her – one – those", "herself – it – those"], "a": 2, "e": "(A) 주어 she = 받는 사람 → herself / (B) 바로 그 선물 → it / (C) price(단수) → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The shop closed its doors at 9.\nⓑ We should take care of us.\nⓒ The color of this dress is brighter than that of my old dress.\nⓓ I have few friends, so I feel lonely sometimes.\nⓔ I need some advices.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ ourselves / ⓔ advice"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Those who wait patiently will be rewarded.", "These cookies are softer than the ones from the bakery.", "The children asked their teacher to read them a story.", "She was angry at herself for forgetting the date.", "The company lost much customers last year."], "a": 4, "e": "⑤ customers(복수) → many"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI dropped my glasses and broke ____.\nThere is ____ milk in the bottle, so let's buy some.", "o": ["it – few", "them – little", "them – few", "it – little", "one – little"], "a": 1, "e": "glasses(복수) → them / milk(셀 수 없음) → little"}, {"k": "ch", "q": "어법상 옳은 문장은?", "o": ["He hurt him while skiing.", "The ears of an elephant are bigger than that of a mouse.", "I like hot coffee more than cold one.", "Each of the rooms has its own bathroom.", "A number of student joined the club."], "a": 3, "e": "④ 옳음 / ① himself ② those ③ cold coffee ⑤ students"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The team won its first game of the season.", true], ["She told me to calm myself down.", true], ["The rivers in Korea are shorter than that in China.", false], ["I lost my wallet, so I bought a new one.", true], ["Many information is on the Internet.", false], ["The kids enjoyed themselves at the zoo.", true], ["These bags are lighter than the old ones.", true], ["He asked me to give himself a ride.", false], ["Each country has its own flag.", true], ["I read the book and returned one.", false], ["Few people know the secret.", true], ["A little students came late.", false]], "e": "ⓒ those ⓔ Much information ⓗ him ⓙ it ⓛ A few students"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Elephants never forget their friends.", true], ["The country changed their flag in 1990.", false], ["Help yourself to the pizza.", true], ["The price of this bag is higher than those of that bag.", false], ["I need a pencil. Do you have one?", true], ["We have little money left.", true], ["The boys looked at themselves in the mirror.", true], ["My dad bought me a bike, and I ride one every day.", false], ["Those who exercise feel more energetic.", true], ["Every rooms has a TV.", false], ["The skin of a baby is softer than that of an adult.", true], ["She cut herself while cooking.", true]], "e": "ⓑ its ⓓ that ⓗ it ⓙ Every room"}, {"k": "wr", "q": "그 학생들은 그들 자신에 대해 이야기했다. (the students, talked about)", "a": ["The students talked about themselves."], "e": "주어 = 목적어 → themselves"}, {"k": "wr", "q": "부산의 날씨는 서울의 날씨보다 따뜻하다. (the weather in Busan, warmer, in Seoul)", "a": ["The weather in Busan is warmer than that in Seoul."], "e": "weather(단수) → that"}]}}, {"book": "hof", "chapter": {"id": "12", "name": "형용사와 부사", "title": "해커스 어법 제대로 · Chapter 12 형용사와 부사"}, "units": [{"tag": "hof-12-P1", "name": "형용사 vs. 부사 (1): 다른 단어 수식", "talk": [{"k": "m", "t": "Chapter 12는 **형용사와 부사**! 어법 문제는 '이 자리에 형용사냐 부사냐'를 묻는 게 핵심 🎯"}, {"k": "m", "t": "① 형용사 = **명사**를 꾸밈 / ② 부사 = **동사·형용사·다른 부사·문장 전체**를 꾸밈"}, {"k": "ex", "en": "The scientist made a surprisingly simple discovery.", "ko": "그 과학자는 놀라울 만큼 단순한 발견을 했다. (형용사 simple을 꾸밈 → 부사)"}, {"k": "q", "q": "The team worked ____ to finish the project on time.", "o": ["efficient", "efficiently", "efficiency"], "a": 1, "ok": "맞아요! 동사 worked 수식 → 부사", "no": "동사를 꾸미는 자리 → efficiently"}, {"k": "m", "t": "풀이 전략: 그 단어를 **빼 봐요**. 빼도 문장이 완전하면 수식어 → **무엇을 꾸미는지** 확인! 명사면 형용사, 나머지는 부사"}, {"k": "m", "t": "형용사 + 명사 앞에 또 하나가 오면? an [extremely] difficult question → difficult(형용사)를 꾸미니까 부사"}, {"k": "q", "q": "She gave a ____ clear explanation.", "o": ["remarkable", "remarkably", "remark"], "a": 1, "ok": "정확해요! 형용사 clear 수식 → 부사", "no": "clear(형용사)를 꾸밈 → remarkably"}, {"k": "m", "t": "⚠️ -thing / -one / -body는 **형용사가 뒤에서** 꾸며요: something [new], anyone special"}, {"k": "m", "t": "정리! **명사 수식 → 형용사 / 동사·형용사·부사·문장 수식 → 부사 / 빼고 꾸밈 대상 확인** 👍"}], "notes": {"table": [["꾸미는 대상", "품사", "예"], ["명사", "형용사", "a careful driver"], ["동사", "부사", "He drives carefully."], ["형용사", "부사", "an incredibly hot day"], ["부사", "부사", "She speaks very quickly."], ["문장 전체", "부사", "Fortunately, nobody was hurt."]], "tips": ["빼도 문장이 완전 → 수식어 → 꾸미는 대상 확인", "-thing / -one / -body + 형용사 (something cold)", "형용사처럼 쓰인 분사도 부사가 꾸밈: a highly respected doctor"]}, "sets": {"workbook": [{"k": "pk", "q": "She speaks English [fluent/fluently*].", "e": "동사 speaks 수식 → 부사"}, {"k": "pk", "q": "It was a [terrible*/terribly] mistake.", "e": "명사 mistake 수식 → 형용사"}, {"k": "pk", "q": "The test was [surprising/surprisingly*] easy.", "e": "형용사 easy 수식 → 부사"}, {"k": "pk", "q": "[Lucky/Luckily*], we found a taxi right away.", "e": "문장 전체 수식 → 부사"}, {"k": "bl", "q": "그는 조용히 방을 나갔다. → He left the room (quietly).", "e": "동사 수식 → 부사"}, {"k": "bl", "q": "그녀는 매우 재능 있는 화가이다. → She is a (very|really|extremely) talented painter.", "e": "형용사 talented 수식 → 부사"}, {"k": "bl", "q": "나는 마실 차가운 것을 원한다. → I want something (cold) to drink.", "e": "-thing + 형용사"}, {"k": "bl", "q": "그 아이는 문제를 정확하게 풀었다. → The child solved the problem (correctly|accurately).", "e": "동사 solved 수식 → 부사"}, {"k": "fx", "q": "The driver handled the car careful on the icy road.", "w": "careful", "a": ["carefully"], "e": "동사 handled 수식 → 부사"}, {"k": "fx", "q": "This is a real interesting book about space.", "w": "real", "a": ["really"], "e": "형용사 interesting 수식 → 부사"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["The baby is sleeping peacefully.", "He gave a remarkably honest answer.", "Unfortunately, the store was closed.", "She solved the puzzle easy.", "They need a highly skilled worker."], "a": 3, "e": "④ 동사 solved 수식 → easily"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe volunteers worked (A)[tireless / tirelessly] for weeks. Thanks to their (B)[generous / generously] help, the village recovered (C)[quick / quickly] from the flood.", "o": ["tireless – generous – quick", "tirelessly – generous – quickly", "tirelessly – generously – quickly", "tireless – generously – quick", "tirelessly – generous – quick"], "a": 1, "e": "(A) 동사 수식 → 부사 / (B) 명사 help 수식 → 형용사 / (C) 동사 recovered 수식 → 부사"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The new rule was ____ accepted by the students.", "o": ["wide", "widely", "widen", "width", "wider"], "a": 1, "e": "과거분사 accepted 수식 → 부사 widely"}, {"k": "bl", "q": "그 영화는 믿을 수 없을 정도로 지루했다. → The movie was (incredibly|unbelievably) boring.", "e": "형용사 boring 수식 → 부사"}, {"k": "bl", "q": "그는 친절한 미소로 우리를 맞이했다. → He greeted us with a (kind|friendly) smile.", "e": "명사 smile 수식 → 형용사"}, {"k": "pk", "q": "The children waited [patient/patiently*] for the show to begin.", "e": "동사 waited 수식 → 부사"}, {"k": "pk", "q": "I need someone [reliable*/reliably] for this job.", "e": "-one + 형용사"}, {"k": "fx", "q": "The students listened attentive to the speaker.", "w": "attentive", "a": ["attentively"], "e": "동사 listened 수식 → 부사"}, {"k": "ox", "q": "The plan was extremely successful.", "a": true, "e": "✔ 형용사 successful 수식 → 부사"}, {"k": "ox", "q": "He answered the question honest.", "a": false, "e": "동사 answered 수식 → honestly"}], "practiceB": [{"k": "wr", "q": "그녀는 그 문제를 침착하게 설명했다. (explained, the problem, calm)", "a": ["She explained the problem calmly.", "She calmly explained the problem."], "e": "동사 수식 → calmly"}, {"k": "wr", "q": "나는 오늘 특별한 무언가를 하고 싶다. (want to do, special, today)", "a": ["I want to do something special today.", "Today I want to do something special.", "Today, I want to do something special."], "e": "-thing + 형용사"}, {"k": "or", "q": "다행히도, 그 화재로 다친 사람은 아무도 없었다.", "a": "Fortunately, nobody was hurt in the fire.", "e": "문장 전체 수식 → 부사"}, {"k": "or", "q": "그는 매우 존경받는 의사이다.", "a": "He is a highly respected doctor.", "e": "과거분사 respected 수식 → 부사"}, {"k": "fx", "q t"}, {"k": "m", "t": "⚠️ almost students ✗ / most of students ✗ → most students / most of the students / almost all (of) the students"}, {"k": "m", "t": "③ **such + (a/an) + 형용사 + 명사** / **so + 형용사·부사** (so + 형용사 + a + 명사 어순도 가능)"}, {"k": "ex", "en": "It was such a beautiful day that we went on a picnic.", "ko": "정말 아름다운 날이어서 우리는 소풍을 갔다."}, {"k": "q", "q": "The movie was ____ boring that I fell asleep.", "o": ["such", "so", "such a"], "a": 1, "ok": "맞아요! 뒤에 형용사만 → so", "no": "명사 없이 형용사 boring만 → so"}, {"k": "m", "t": "⚠️ so a nice day ✗ → [such] a nice day = so nice a day / 단, many·much·few·little 앞은 so: so many people"}, {"k": "m", "t": "정리! **most + 명사 / almost + all·every·형용사 / such (a) 형용사 + 명사 / so + 형용사·부사** 👍"}], "notes": {"table": [["표현", "뒤에 오는 말", "예"], ["most", "명사 / of the + 명사", "most children, most of the money"], ["almost", "all·every·no·always·형용사·동사", "almost all children, almost finished"], ["such", "(a/an) + 형용사 + 명사", "such a kind person, such good friends"], ["so", "형용사 / 부사 (so + 형용사 + a + 명사)", "so kind, so quickly, so kind a person"]], "tips": ["almost + 명사 ✗", "most of + the/소유격 + 명사 (most of students ✗)", "mostly = 주로, 대개 (부사)", "so many / so much / so few / so little + 명사 (such many ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "[Most*/Almost] teenagers have a smartphone.", "e": "명사 앞 → Most"}, {"k": "pk", "q": "I [most/almost*] forgot my homework.", "e": "동사 수식 '거의' → almost"}, {"k": "pk", "q": "It was [such*/so] a long trip.", "e": "a + 형용사 + 명사 → such"}, {"k": "pk", "q": "She speaks [such/so*] quickly that I can't understand her.", "e": "부사 앞 → so"}, {"k": "bl", "q": "그 반의 거의 모든 학생이 그 시험에 합격했다. → (Almost|Nearly) all the students in the class passed the test.", "e": "almost all"}, {"k": "bl", "q": "그 돈의 대부분은 음식에 쓰였다. → (Most) of the money was spent on food.", "e": "most of the + 명사"}, {"k": "bl", "q": "그는 정말 좋은 사람이어서 모두가 그를 좋아한다. → He is (such) a nice person that everyone likes him.", "e": "such a + 형용사 + 명사"}, {"k": "bl", "q": "날씨가 너무 더워서 우리는 집에 머물렀다. → It was (so) hot that we stayed home.", "e": "so + 형용사"}, {"k": "fx", "q": "Almost people in this town know each other.", "w": "Almost", "a": ["Most"], "e": "almost + 명사 ✗ → Most"}, {"k": "fx", "q": "They are so good friends that they never fight.", "w": "so", "a": ["such"], "e": "형용사 + 복수명사 → such"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ of the players were tired after the game.", "o": ["Almost", "Most", "Mostly", "Such", "So"], "a": 1, "e": "most of the + 명사"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Most children like ice cream.", "Almost every seat was taken.", "It was such an exciting game.", "He was so a funny man that we laughed a lot.", "She almost always walks to school."], "a": 3, "e": "④ such a funny man (또는 so funny a man)"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n(A)[Most / Almost] all the tickets were sold out within an hour. It was (B)[such / so] a popular concert that (C)[most / almost] fans couldn't get tickets.", "o": ["Most – such – most", "Almost – so – almost", "Almost – such – most", "Most – so – almost", "Almost – such – almost"], "a": 2, "e": "(A) almost all / (B) such a + 형용사 + 명사 / (C) most + 명사"}, {"k": "bl", "q": "나는 그런 이상한 이야기는 들어 본 적이 없다. → I have never heard (such) a strange story.", "e": "such a + 형용사 + 명사"}, {"k": "bl", "q": "그 일은 거의 끝났다. → The work is (almost|nearly) finished.", "e": "형용사(과거분사) 수식 → almost"}, {"k": "pk", "q": "There were [so*/such] many people at the festival.", "e": "many 앞 → so"}, {"k": "pk", "q": "[Most*/Almost] of my classmates live near the school.", "e": "most of + 소유격 + 명사"}, {"k": "fx", "q": "Most every student in our school takes the bus.", "w": "Most", "a": ["Almost", "Nearly"], "e": "every 수식 → Almost"}, {"k": "ox", "q": "It was so cold a night that the lake froze.", "a": true, "e": "✔ so + 형용사 + a + 명사"}, {"k": "ox", "q": "Almost students agreed with the plan.", "a": false, "e": "Most students / Almost all (the) students"}], "practiceB": [{"k": "wr", "q": "우리 반  to drive, but she doesn't have enough money to buy a car.", "ko": "그녀는 운전할 만큼 나이가 들었지만 차를 살 만큼 충분한 돈은 없다."}, {"k": "q", "q": "This box isn't ____ to hold all the books.", "o": ["enough big", "big enough", "too big"], "a": 1, "ok": "맞아요! 형용사 + enough", "no": "형용사 뒤에 enough → big enough"}, {"k": "m", "t": "⚠️ enough + 형용사 ✗ (enough tall ✗) → tall enough"}, {"k": "m", "t": "② **too + 형용사·부사 (+ to부정사)** = 너무 ~해서 …할 수 없다: too [young] to vote"}, {"k": "ex", "en": "The coffee was too hot to drink.", "ko": "그 커피는 너무 뜨거워서 마실 수 없었다."}, {"k": "q", "q": "The bag was ____ to carry, so I asked for help.", "o": ["heavy enough", "too heavy", "enough heavy"], "a": 1, "ok": "정확해요! 들 수 없음 → too", "no": "도움을 청함 = 들 수 없었음 → too heavy"}, {"k": "m", "t": "풀이 전략: 문맥이 **할 수 있다** → enough / **할 수 없다** → too. 위치는 **형용사 뒤 enough, 형용사 앞 too**"}, {"k": "m", "t": "⚠️ to부정사의 목적어가 문장 주어와 같으면 다시 쓰지 않아요: The coffee was too hot to drink it ✗"}, {"k": "m", "t": "🎉 Chapter 12 형용사와 부사 끝! **형용사 + enough / enough + 명사 / too + 형용사 + to** 👍"}], "notes": {"table": [["표현", "위치", "예"], ["형용사·부사 + enough (to)", "enough는 뒤에", "tall enough to reach, fast enough to win"], ["enough + 명사 (to)", "enough는 앞에", "enough time to finish"], ["too + 형용사·부사 (to)", "too는 앞에", "too tired to walk"]], "tips": ["enough + 형용사 ✗", "too ~ to = so ~ that 주어 can't / couldn't", "to부정사의 목적어가 문장 주어와 같으면 생략 (too hot to drink it ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "He is [enough old/old enough*] to travel alone.", "e": "형용사 + enough"}, {"k": "pk", "q": "There isn't [enough*/too] milk for everyone.", "e": "enough + 명사"}, {"k": "pk", "q": "The water is [too*/enough] cold to swim in.", "e": "수영할 수 없음 → too"}, {"k": "pk", "q": "She ran [fast enough*/enough fast] to catch the bus.", "e": "부사 + enough"}, {"k": "bl", "q": "그는 너무 어려서 그 영화를 볼 수 없다. → He is (too) young to watch the movie.", "e": "too + 형용사 + to"}, {"k": "bl", "q": "그 방은 우리 모두가 들어갈 만큼 충분히 크다. → The room is big (enough) for all of us.", "e": "형용사 + enough"}, {"k": "bl", "q": "나는 새 휴대폰을 살 만큼 충분한 돈이 있다. → I have (enough) money to buy a new phone.", "e": "enough + 명사"}, {"k": "bl", "q": "그 문제는 너무 어려워서 나는 풀 수 없었다. → The problem was too difficult for me (to) solve.", "e": "too ~ to"}, {"k": "fx", "q": "The soup was too hot to eat it.", "w": "it", "a": ["(삭제)"], "e": "to부정사의 목적어 = 주어(soup) → 생략"}, {"k": "fx", "q": "I was so tired to walk any further.", "w": "so", "a": ["too"], "e": "~해서 …할 수 없다 → too ~ to"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The room is not ____ for twenty people.", "o": ["enough large", "large enough", "too large", "so large", "large too"], "a": 1, "e": "형용사 + enough"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She is smart enough to solve the puzzle.", "There is enough food for everyone.", "The shoes were too small to wear.", "He is enough strong to lift the box.", "It's too late to change the plan."], "a": 3, "e": "④ strong enough"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? The river was too dirty to swim in.", "o": ["The river was so dirty that we could swim in it.", "The river was clean enough to swim in.", "The river was so dirty that we couldn't swim in it.", "The river was dirty enough to swim in.", "The river was not dirty enough to swim in."], "a": 2, "e": "too ~ to = so ~ that 주어 couldn't"}, {"k": "bl", "q": "그 아이는 혼자 옷을 입을 만큼 충분히 컸다. → The child is old (enough) to dress himself.", "e": "형용사 + enough"}, {"k": "bl", "q": "이 차는 너무 비싸서 우리가 살 수 없다. → This car is (too) expensive for us to buy.", "e": "too + 형용사 + to"}, {"k": "pk", "q": "The answer was [clear enough*/enough clear] for everyone to understand.", "e": "형용사 + enough"}, {"k": "pk", "q": "It was [too*/enough] dark to see anything.", "e": "볼 수 없음 → too"}, {"k": "fx", "q": "This question is too easy for him to answer it.", "w": "it", "a": ["(삭제)"], "e": "answer의 목적어 = 주어(question) → 생략"}, {"k": "ox", "q": "He didn't study hard enough to pass the test.", "a": true, "e": "✔ 부사 + enough"}, {"k": "ox", "q": "The tea is enough warm to drink.", "a": false, "e": "warm enough"}], "practiceB": [{"k": "wr", "q": "그는 너무 피곤해서 숙제를 할 수 없었다. (too tired, to do his homework)", "a": ["He was too tired to do his homework."], "e": "too ~ to"}, {"k": "wr", "q": "그녀는 그 경주에서 이길 만큼 충분히 빨리 달렸다. (fast enough, to win the race)", "a": ["She ran fast enough to win the race."], "e": "부사 + enough"}, {"k": "or", "q": "그 상자는 내가 들기에 너무 무거웠다.", "a": "The box was too heavy for me to lift.", "e": "too ~ for 의미상 주어 to"}, {"k": "or", "q": "우리는 모두를 위한 충분한 의자가 있다.", "a": "We have enough chairs for everyone.", "e": "enough + 명사"}, {"k": "fx", "q": "The water was so cold to drink.", "w": "so", "a": ["too"], "e": "~해서 …할 수 없다 → too ~ to"}, {"k": "fx", "q": "The ice was thick enough to walk on it.", "w": "it", "a": ["(삭제)"], "e": "on의 목적어 = 주어(ice) → 생략"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She is too shy to speak in public.\nⓑ He isn't enough tall to play basketball.\nⓒ We have enough time to visit the museum.\nⓓ The book was too boring to read it.\nⓔ The rope was strong enough to hold the boat.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ tall enough / ⓓ to read"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nThe bridge is so old that cars can't cross it.\n= The bridge is ____ for cars to cross.", "o": ["old enough", "enough old", "too old", "so old", "very old"], "a": 2, "e": "so ~ that can't = too ~ to"}, {"k": "bl", "q": "Is the water warm (enough) to swim in? (충분히)", "e": "형용사 + enough"}, {"k": "bl", "q": "He spoke (too) quickly for me to understand. (너무)", "e": "too + 부사 + to"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그녀는 그 질문에 정직하게 대답했다. (answered, the question, honest)", "a": ["She answered the question honestly.", "She honestly answered the question."], "e": "동사 수식 → honestly"}, {"k": "wr", "q": "이 꽃들은 달콤한 향기가 난다. (these flowers, smell, sweet)", "a": ["These flowers smell sweet."], "e": "감각동사 + 형용사"}, {"k": "wr", "q": "나는 최근에 너무 바빴다. (have been, too busy, lately)", "a": ["I have been too busy lately.", "Lately, I have be st one.", "w": "more", "a": ["(삭제)"], "e": "이중 비교 ✗ → easier"}, {"k": "fx", "q": "Our new house is three times as larger as the old one.", "w": "larger", "a": ["large"], "e": "as ~ as → 원급"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The new phone is much ____ than the old model.", "o": ["light", "lighter", "lightest", "as light", "more lighter"], "a": 1, "e": "than → 비교급"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She runs as fast as her coach.", "This book is more useful than that one.", "He doesn't eat as much as his brother.", "The tower is four times as tall as the church.", "Your plan is more better than mine."], "a": 4, "e": "⑤ 이중 비교 ✗ → better"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe population of the city is now three times (A)[as large / larger] as it was in 1980. Houses are much (B)[expensive / more expensive] than before, and people have (C)[less / fewer] free space than they used to.", "o": ["as large – expensive – less", "larger – more expensive – fewer", "as large – more expensive – less", "larger – expensive – less", "as large – more expensive – fewer"], "a": 2, "e": "(A) 뒤에 as → 원급 / (B) 뒤에 than → 비교급 / (C) space(셀 수 없음) → less"}, {"k": "bl", "q": "이 상자는 저 상자만큼 무겁지 않다. → This box is not as (heavy) as that one.", "e": "not as 원급 as"}, {"k": "bl", "q": "그는 형보다 더 조심스럽게 운전한다. → He drives (more) carefully than his brother.", "e": "more + 원급 + than"}, {"k": "pk", "q": "Her score was [higher*/high] than mine.", "e": "than → 비교급"}, {"k": "pk", "q": "The lake is half as [deep*/deeper] as the river.", "e": "as ~ as → 원급"}, {"k": "fx", "q": "This summer is hot than last summer.", "w": "hot", "a": ["hotter"], "e": "than → 비교급"}, {"k": "ox", "q": "I have as many books as my teacher.", "a": true, "e": "✔ as many + 복수명사 as"}, {"k": "ox", "q": "The red car is expensiver than the white one.", "a": false, "e": "긴 단어 → more expensive"}], "practiceB": [{"k": "wr", "q": "이 방은 내 방보다 세 배 크다. (three times, as big as, mine)", "a": ["This room is three t r and darker"}, {"k": "wr", "q": "두 문장의 뜻이 같도록 빈칸에 들어갈 한 단어를 쓰시오. Mina is the smartest student in her class. → Mina is smarter than any other ____ in her class.", "a": ["student"], "e": "any other + 단수명사"}, {"k": "wr", "q": "그 노래는 점점 더 인기를 얻었다. (became, more and more popular)", "a": ["The song became more and more popular."], "e": "more and more + 원급"}]}}, {"book": "hof", "chapter": {"id": "14", "name": "도치와 어순", "title": "해커스 어법 제대로 · Chapter 14 도치와 어순"}, "units": [{"tag": "hof-14-P1", "name": "동사 도치", "talk": [{"k": "m", "t": "Chapter 14는 **도치와 어순**! 도치 = 주어와 동사의 순서가 뒤바뀐 것 🔄"}, {"k": "m", "t": "① **장소·방향 부사구**가 문장 앞에 오면: 부사구 + **동사 + 주어**"}, {"k": "ex", "en": "On the hill stands an old castle.", "ko": "언덕 위에 오래된 성이 서 있다."}, {"k": "m", "t": "풀이 전략: 도치 문장에선 **동사 뒤에 있는 명사가 진짜 주어** → 그 명사에 동사의 수를 맞춰요!"}, {"k": "q", "q": "Under the tree ____ two little rabbits.", "o": ["sits", "sit", "sitting"], "a": 1, "ok": "맞아요! 주어 = two little rabbits(복수)", "no": "동사 뒤 진짜 주어 two rabbits(복수) → sit"}, {"k": "m", "t": "② **보어**(형용사·분사)가 앞에 오면: 보어 + **be동사 + 주어**"}, {"k": "ex", "en": "Included in the price are breakfast and dinner.", "ko": "가격에는 아침과 저녁 식사가 포함되어 있다. (주어 = breakfast and dinner → are)"}, {"k": "q", "q": "Attached to this email ____ the documents you asked for.", "o": ["is", "are", "be"], "a": 1, "ok": "정확해요! 주어 = the documents(복수)", "no": "be 뒤 진짜 주어 the documents(복수) → are"}, {"k": "m", "t": "③ **Here / There** + 동사 + 명사 주어: Here [comes] the bus! — 단, 주어가 **대명사**면 도치 ✗ → Here it comes."}, {"k": "m", "t": "정리! **장소 부사구·보어·Here/There 앞 → 동사 + 주어 / 동사 뒤 명사에 수 일치 / 대명사 주어는 도치 ✗** 👍"}], "notes": {"table": [["앞으로 나온 말", "어순", "예"], ["장소·방향 부사구", "부사구 + 동사 + 주어", "In the box were some old letters."], ["형용사·분사 보어", "보어 + be동사 + 주어", "Happy are those who help others."], ["Here / There", "Here/There + 동사 + 명사 주어", "There goes the last train."], ["대명사 주어", "도치 ✗", "Here she comes. (Here comes she ✗)"]], "tips": ["도치 문장의 주어 = 동사 뒤의 명사 → 수 일치", "장소 부사구 도치는 주로 be, stand, lie, sit, live, come 같은 1형식 동사", "분사 보어 도치: Included / Attached / Hidden … + be + 주어"]}, "sets": {"workbook": [{"k": "pk", "q": "In the middle of the lake [is*/are] a small island.", "e": "주어 = a small island(단수)"}, {"k": "pk", "q": "On the wall [hang/hangs*] a picture of my grandparents.", "e": "주어 = a picture(단수)"}, {"k": "pk", "q": "Here [comes the bus*/the bus comes]!", "e": "Here + 동사 + 명사 주어"}, {"k": "pk", "q": "Here [comes he/he comes*].", "e": "대명사 주어 → 도치 ✗"}, {"k": "bl", "q": "그 상자 안에는 오래된 동전 몇 개가 있었다. → In the box (were) some old coins.", "e": "주어 = some old coins(복수)"}, {"k": "bl", "q": "문 옆에 키가 큰 남자가 서 있었다. → By the door (stood|was standing) a tall man.", "e": "주어 = a tall man(단수)"}, {"k": "bl", "q": "그 소포에는 감사 편지가 동봉되어 있었다. → Enclosed in the package (was) a thank-you letter.", "e": "주어 = a thank-you letter(단수)"}, {"k": "bl", "q": "저기 마지막 기차가 간다. → There (goes) the last train.", "e": "There + 동사 + 명사 주어"}, {"k": "fx", "q": "Behind the old house was several tall trees.", "w": "was", "a": ["were"], "e": "주어 = several tall trees(복수)"}, {"k": "fx", "q": "Among the visitors were a famous writer from France.", "w": "were", "a": ["was"], "e": "주어 = a famous writer(단수)"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Next to the bank ____ a coffee shop and a bookstore.", "o": ["is", "are", "be", "being", "to be"], "a": 1, "e": "주어 = a coffee shop and a bookstore(복수)"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["On the desk lies a pile of books.", "Here comes the teacher.", "At the top of the hill stand two old trees.", "Here comes she with her dog.", "Hidden under the bed was a box of letters."], "a": 3, "e": "④ 대명사 주어 → Here she comes"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nAt the end of the street (A)[is / are] two restaurants. Inside the first one (B)[hang / hangs] many colorful lamps. Included in the lunch menu (C)[is / are] a free drink.", "o": ["is – hangs – are", "are – hang – is", "are – hangs – is", "is – hang – are", "are – hang – are"], "a": 1, "e": "(A) two restaurants / (B) many lamps / (C) a free drink"}, {"k": "bl", "q": "언덕 아래에 작은 마을이 있다. → Below the hill (lies|is) a small village.", "e": "주어 = a small village(단수)"}, {"k": "bl", "q": "그 그림 속에는 두 마리의 고양이가 숨어 있다. → Hidden in the picture (are) two cats.", "e": "주어 = two cats(복수)"}, {"k": "pk", "q": "There [goes my bus*/my bus goes]! I'll have to wait for the next one.", "e": "There + 동사 + 명사 주어"}, {"k": "pk", "q": "Happy [are*/is] those who enjoy their work.", "e": "주어 = those(복수)"}, {"k": "fx", "q": "Into the room walks three students in uniforms.", "w": "walks", "a": ["walk", "walked"], "e": "주어 = three students(복수)"}, {"k": "ox", "q": "Along the river runs a narrow path.", "a": true, "e": "✔ 주어 = a narrow path(단수)"}, {"k": "ox", "q": "On the shelf was many dusty books.", "a": false, "e": "주어 = many dusty books → were"}], "practiceB": [{"k": "wr", "q": "책상 위에 컴퓨터 한 대가 있었다. (on the desk, was, a computer) — 부사구로 시작", "a": ["On the desk was a computer."], "e": "부사구 + 동사 + 주어"}, {"k": "wr", "q": "여기 네 커피가 나왔어. (here, comes, your coffee)", "a": ["Here comes your coffee."], "e": "Here + 동사 + 명사 주어"}, {"k": "or", "q": "그 공원 한가운데에 큰 분수가 있다.", "a": "In the middle of the park is a big fountain.", "e": "주어 = a big fountain(단수)"}, {"k": "or", "q": "그 상자 안에는 오래된 사진 몇 장이 들어 있었다.", "a": "In the box were some old photos.", "e": "주어 = some old photos(복수)"}, {"k": "fx", "q": "Next to my house live a kind old woman.", "w": "live", "a": ["lives"], "e": "주어 = a kind old woman(단수)"}, {"k": "fx", "q": "Attached to the letter was two photos of the baby.", "w": "was", "a": ["were"], "e": "주어 = two photos(복수)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ On the corner stands a tall building.\nⓑ In the garden grows many beautiful flowers.\nⓒ Here they come.\nⓓ Among the winners was my best friend.\nⓔ Here comes it.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ grow / ⓔ Here it comes"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Beside the road were rows of tall trees that looked like soldiers.", "Hidden behind the clouds was the full moon.", "Under the bridge lives a family of ducks.", "Through the window come the sound of children playing.", "In front of the station is a statue of a famous poet."], "a": 3, "e": "④ 주어 = the sound(단수) → comes"}, {"k": "bl", "q": "On the island (live) many rare birds. (산다)", "e": "주어 = many rare birds(복수)"}, {"k": "bl", "q": "Included in the ticket price (is) a guided tour. (포함되어 있다)", "e": "주어 = a guided tour(단수)"}]}}, {"tag": "hof-14-P2", "name": "조동사 도치", "talk": [{"k": "m", "t": "**부정어**나 **Only + 부사(구)**가 문장 앞에 오면 → **조동사 + 주어 + 동사** 순서로 도치 🔁"}, {"k": "m", "t": "① 부정어: never, little, hardly, rarely, seldom, not only, not until, no sooner, nowhere"}, {"k": "ex", "en": "Never have I seen such a beautiful sunset.", "ko": "나는 그렇게 아름다운 일몰을 결코 본 적이 없다."}, {"k": "m", "t": "② 일반동사 문장은 **do / does / did**가 앞으로 나가고, 뒤 동사는 **원형**!"}, {"k": "ex", "en": "Little did she know that her life would change forever.", "ko": "그녀는 자신의 삶이 영원히 바뀔 줄은 전혀 몰랐다."}, {"k": "q", "q": "Not only ____ well, but she also writes her own songs.", "o": ["she sings", "does she sing", "does she sings"], "a": 1, "ok": "맞아요! does + 주어 + 동사원형", "no": "Not only + 조동사 + 주어 + 원형 → does she sing"}, {"k": "m", "t": "③ **Only + 부사(구·절)**: Only then did I realize my mistake. / Only after the test did he [start] studying."}, {"k": "q", "q": "Only after the rain stopped ____ outside.", "o": ["the children went", "did the children go", "did the children went"], "a": 1, "ok": "정확해요! did + 주어 + 동사원형", "no": "Only 부사절 + did + 주어 + 원형 → did the children go"}, {"k": "m", "t": "④ **so / neither + 조동사 + 주어** = ~도 그렇다 / ~도 그렇지 않다 → 앞 문장의 동사·시제에 맞춰요: I like jazz. — So **do** I."}, {"k": "m", "t": "풀이 전략: 도치 문장 → ① 조동사(do·have·can…)의 **수·시제** 확인 ② 뒤 동사가 **원형 / p.p.**인지 확인"}, {"k": "m", "t": "정리! **부정어·Only 부사구 + 조동사 + 주어 + 동사원형(p.p.) / so·neither + 조동사 + 주어** 👍"}], "notes": {"table": [["앞으로 나온 말", "어순", "예"], ["부정어 (never, little, rarely, seldom…)", "부정어 + 조동사 + 주어
