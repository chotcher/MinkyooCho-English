"fx", "q": "This car needs to fix before we drive to Busan.", "w": "fix", "a": ["be fixed"], "e": "차가 수리되는 쪽 → to be fixed"}, {"k": "or", "q": "규칙적으로 운동하는 것은 너를 더 건강하게 만든다.", "a": "Exercising regularly makes you healthier.", "e": "주어 → 동명사"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ too much sugar is bad for your teeth.", "o": ["Eat", "Eating", "Eats", "Ate", "Eaten"], "a": 1, "e": "주어 자리 → 동명사"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? He ____ to go to the concert.", "o": ["wanted", "decided", "refused", "planned", "enjoyed"], "a": 4, "e": "enjoy + -ing"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? She ____ watching horror movies.", "o": ["enjoys", "avoids", "hopes", "gave up", "doesn't mind"], "a": 2, "e": "hope + to부정사"}, {"k": "ch", "q": "다음 문장의 의미로 알맞은 것은?\nHe stopped to talk to his teacher.", "o": ["그는 선생님과 이야기하는 것을 멈췄다.", "그는 선생님과 이야기하기 위해 멈춰 섰다.", "그는 선생님과 이야기한 것을 기억했다.", "그는 선생님과 이야기한 것을 후회했다.", "그는 선생님과 이야기하려고 노력했다."], "a": 1, "e": "stop to = ~하기 위해 멈추다"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• I'm looking forward to (A)[meet / meeting] my new classmates.\n• Don't forget (B)[to bring / bringing] your textbook tomorrow.\n• This old bike needs (C)[repairing / to repair].", "o": ["meeting – to bring – repairing", "meet – to bring – repairing", "meeting – bringing – repairing", "meeting – to bring – to repair", "meet – bringing – to repair"], "a": 0, "e": "(A) 전치사 to + -ing (B) 할 일 → to (C) need + -ing"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["It is important for us to protect nature.", "It was wise of him to take the job.", "She was happy to be chosen as the leader.", "I regret telling her the bad news.", "Keep healthy habits is not easy."], "a": 4, "e": "⑤ Keeping"}, {"k": "ch", "q": "다음 중 빈칸에 동사원형이 와야 하는 것은?", "o": ["I'm used to ____ up early.", "She objected to ____ late.", "He used to ____ here.", "We look forward to ____ you.", "When it comes to ____, she is the best."], "a": 2, "e": "used to + 원형 = ~하곤 했다"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지 넷과 다른 것은?", "o": ["It is easy ____ me to ride a bike.", "It is necessary ____ you to rest.", "It was polite ____ him to say thank you.", "It is hard ____ us to agree.", "It is dangerous ____ kids to swim here."], "a": 2, "e": "③ polite → of / 나머지는 for"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["She avoided to answer the question.", "I remember to see him at the station last week.", "The work needs to be done by tomorrow.", "He is used to drive on the left.", "It was rude for you to ignore her."], "a": 2, "e": "③ / ① answering ② seeing ④ driving ⑤ of"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Learning to swim is fun.\nⓑ He promised not to be late again.\nⓒ I tried to open the jar, but I couldn't.\nⓓ She is committed to help the poor.\nⓔ They hate being told what to do.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓒⓔ 옳음 / ⓓ helping"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n나는 그녀에게 사실을 말한 것을 후회한다.", "o": ["I regret to tell her the truth.", "I regret telling her the truth.", "I regret tell her the truth.", "I regret told her the truth.", "I regret to be told her the truth."], "a": 1, "e": "~한 것을 후회 → regret -ing"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Reading comic books is my hobby.", true], ["Make friends is not always easy.", false], ["She decided to study abroad.", true], ["He finished to write the essay.", false], ["Remember to turn off the gas.", true], ["I'll never forget meeting the president.", true], ["I look forward to hear from you.", false], ["Paper is used to wrap gifts.", true], ["The children enjoy being read to.", true], ["This shirt needs to wash.", false], ["It was kind of her to help me.", true], ["I don't mind his coming late.", true]], "e": "ⓑ Making(To make) ⓓ writing ⓖ hearing ⓙ to be washed(washing)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["To exercise every day is a good habit.", true], ["He gave up to learn the violin.", false], ["We hope to see you soon.", true], ["Don't forget locking the door tonight.", false], ["She stopped crying when her mom came.", true], ["I'm used to living in the city.", true], ["They objected to change the rules.", false], ["Nobody likes being laughed at.", true], ["The plan needs to be checked again.", true], ["It is impossible of me to finish it today.", false], ["Mom was upset about my coming home late.", true], ["It was silly of him to believe that.", true]], "e": "ⓑ learning ⓓ to lock ⓖ changing ⓙ for me"}, {"k": "wr", "q": "같은 뜻이 되도록 한 단어로 쓰시오. My phone needs to be repaired. → My phone needs ____.", "a": ["repairing"], "e": "need + -ing = need to be p.p."}, {"k": "wr", "q": "그녀가 그렇게 말한 것은 현명했다. (It was wise, say so)", "a": ["It was wise of her to say so."], "e": "wise → of"}]}}, {"book": "hof", "chapter": {"id": "07", "name": "분사", "title": "해커스 어법 제대로 · Chapter 7 분사"}, "units": [{"tag": "hof-07-P1", "name": "동사 vs. 분사", "talk": [{"k": "m", "t": "Chapter 7은 **분사**! 수능 어법 단골: 이 자리에 **동사**가 와야 할까, **분사**가 와야 할까? 🔎"}, {"k": "m", "t": "공식 하나만 기억! **동사의 개수 = 접속사(관계사)의 개수 + 1**. 접속사 없이 동사가 두 개면 하나는 분사(또는 to부정사)여야 해요"}, {"k": "ex", "en": "The man standing next to the door is my uncle.", "ko": "문 옆에 서 있는 남자는 나의 삼촌이다. (동사는 is 하나)"}, {"k": "m", "t": "풀이 전략 ① 주어를 찾고 ② 주어 뒤 수식어(전치사구·분사구·관계절)를 괄호로 묶고 ③ **진짜 동사**가 이미 있는지 확인!"}, {"k": "q", "q": "The letters ____ by soldiers during the war are now kept in a museum.", "o": ["written", "were written", "wrote"], "a": 0, "ok": "맞아요! 진짜 동사 are가 있으니 분사 written", "no": "뒤에 진짜 동사 are가 있어요 → 이 자리는 분사 written"}, {"k": "m", "t": "반대로 진짜 동사가 **없으면** 그 자리는 반드시 동사! 수식어가 길수록 동사가 없는 걸 놓치기 쉬워요"}, {"k": "q", "q": "Most of the people invited to the party ____ from abroad.", "o": ["coming", "came", "to come"], "a": 1, "ok": "정확해요! 문장에 동사가 없으니 came", "no": "invited는 분사(수식어) → 진짜 동사가 필요 → came"}, {"k": "m", "t": "⚠️ 관계사절은 접속사 1개 → 동사 2개 OK: The bag that I bought yesterday [was] too expensive."}, {"k": "m", "t": "⚠️ 콤마 뒤에 접속사 없이 또 동사가 오면 ✗ → 분사구문으로! She left the room, [slamming] the door behind her."}, {"k": "m", "t": "정리! **동사 개수 = 접속사 + 1 / 수식어 괄호 → 진짜 동사 확인 / 이미 있으면 분사, 없으면 동사** 👍"}], "notes": {"table": [["상황", "이 자리에 올 것", "예"], ["진짜 동사가 이미 있음", "분사 (v-ing / p.p.)", "The boy (wearing a cap) is Jun."], ["진짜 동사가 없음", "동사", "The boy (in the photo) wears a cap."], ["콤마 뒤, 접속사 없음", "분사구문", "He came in, carrying a box."], ["관계사절 안", "동사", "the boy who wears a cap"], ["목적격 관계대명사 생략절 안", "동사", "the cake (that) my mom baked"]], "tips": ["동사 개수 = 접속사·관계사 개수 + 1", "주어와 동사 사이 수식어를 괄호로 묶기", "명사 + 주어 + 동사(관계사 생략)에서는 그 동사가 맞는 것"]}, "sets": {"workbook": [{"k": "pk", "q": "The woman [sat/sitting*] next to me on the bus was reading a novel.", "e": "진짜 동사 was reading → 분사"}, {"k": "pk", "q": "The old books on the top shelf [belong*/belonging] to my grandfather.", "e": "on the top shelf는 수식어, 동사가 없음 → belong"}, {"k": "pk", "q": "Anyone [wanting*/wants] to take the class should sign up by Friday.", "e": "진짜 동사 should sign → 분사"}, {"k": "pk", "q": "The cookies my mother [baked*/baking] yesterday were delicious.", "e": "관계사 생략절(my mother baked) 안의 동사 → baked"}, {"k": "bl", "q": "버스를 기다리는 사람들이 추위에 떨고 있었다. → People (waiting) for the bus were shivering in the cold.", "e": "진짜 동사 were shivering → 분사"}, {"k": "bl", "q": "그 회사에서 만든 장난감들은 아이들에게 인기가 많다. → The toys (made) by the company are popular with children.", "e": "진짜 동사 are → 분사(장난감이 만들어짐)"}, {"k": "bl", "q": "그녀는 문을 쾅 닫으며 방을 나갔다. → She left the room, (slamming) the door.", "e": "접속사 없음 → 분사구문"}, {"k": "ox", "q": "The man repairing the roof fell and hurt his leg.", "a": true, "e": "✔ repairing은 분사, 동사 fell and hurt"}, {"k": "ox", "q": "The tourists visited the palace took a lot of pictures.", "a": false, "e": "동사 took가 있음 → visiting"}, {"k": "fx", "q": "A girl carried a heavy backpack walked into the classroom.", "w": "carried", "a": ["carrying"], "e": "진짜 동사 walked → 분사 carrying"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The documents ____ on the table need to be signed by tomorrow.", "o": ["leave", "left", "are left", "leaves", "was left"], "a": 1, "e": "진짜 동사 need → 분사 left(서류가 놓여 있음)"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The players chosen for the national team trained hard.", "Most people living in the city use public transportation.", "The money raised at the event will be donated to charity.", "A woman holds a baby got on the train.", "The houses built along the river were damaged by the flood."], "a": 3, "e": "④ 동사 got이 있음 → holding"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["The man fixes my car works at the garage.", "Children played in the playground were laughing.", "The photos taken by her father won a prize.", "The students attend this school wear uniforms.", "The bridge connects the two towns opened last year."], "a": 2, "e": "③ 옳음 / ① fixing ② playing ④ attending ⑤ connecting"}, {"k": "pk", "q": "Volunteers [collect/collecting*] trash on the beach every Sunday are mostly students.", "e": "진짜 동사 are → 분사"}, {"k": "pk", "q": "The workers at the factory [demand*/demanding] higher wages and better conditions.", "e": "at the factory는 수식어, 동사 없음 → demand"}, {"k": "bl", "q": "그 사고로 다친 사람들은 근처 병원으로 옮겨졌다. → The people (injured|hurt) in the accident were taken to a nearby hospital.", "e": "진짜 동사 were taken → 분사"}, {"k": "bl", "q": "그녀는 창가에 앉아 차를 마시며 비를 바라보았다. → She sat by the window, (drinking) tea and watching the rain.", "e": "접속사 없음 → 분사구문"}, {"k": "fx", "q": "The jacket hanging in the closet belonging to my brother.", "w": "belonging", "a": ["belongs", "belonged"], "e": "hanging은 분사, 진짜 동사가 없음 → belongs"}, {"k": "ox", "q": "The man who lives next door working as a firefighter.", "a": false, "e": "관계사 1개 → 동사 2개 필요 → works"}, {"k": "ox", "q": "Anyone caught cheating on the exam will receive a zero.", "a": true, "e": "✔ caught는 분사, 동사 will receive"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe scientists (A)[studied / studying] the effects of sleep found that teenagers (B)[need / needing] at least eight hours a night. Those (C)[get / getting] less sleep tend to have trouble focusing.", "o": ["studied – need – get", "studying – need – getting", "studying – needing – get", "studied – needing – getting", "studying – need – get"], "a": 1, "e": "(A) 동사 found가 있음 → studying (B) that절 안 동사 필요 → need (C) 동사 tend가 있음 → getting"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The keys found under the sofa were mine.\nⓑ Most students take the bus get to school early.\nⓒ The old woman feeding the pigeons comes here every day.\nⓓ Some of the paintings displayed in the hall were stolen.\nⓔ The girl stands at the gate is waiting for you.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ taking ⓔ standing"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nIn the past, people ①‘living’ in the village ②‘depended’ on fishing. Today, however, many of the young people ③‘born’ there ④‘moving’ to big cities, ⑤‘leaving’ only the elderly behind.", "o": ["", "", "", "", ""], "a": 3, "e": "④ 두 번째 문장에 동사가 없음 → move(have moved) / ⑤ 콤마 뒤 분사구문 ✔"}, {"k": "fx", "q": "The number of people using smartphones to read the news increasing every year.", "w": "increasing", "a": ["increases", "is increasing"], "e": "using은 분사, 진짜 동사가 없음 → increases"}, {"k": "fx", "q": "Passengers traveled with small children may board the plane first.", "w": "traveled", "a": ["traveling", "travelling"], "e": "동사 may board가 있음 → 분사 traveling"}, {"k": "wr", "q": "그 대회에 참가하는 학생들은 이번 주 금요일까지 등록해야 한다. (students, participate in the contest, must register, by this Friday)", "a": ["Students participating in the contest must register by this Friday.", "The students participating in the contest must register by this Friday."], "e": "동사 must register → 분사 participating"}, {"k": "or", "q": "오늘 밤 공연하는 그 밴드는 런던 출신이다.", "a": "The band performing tonight comes from London.", "e": "performing은 분사, 동사 comes"}, {"k": "pk", "q": "The museum, located in the center of the old town, [attracts*/attracting] millions of visitors.", "e": "located ~는 삽입된 수식어, 동사 필요 → attracts"}, {"k": "ox", "q": "Thousands of fans gathered outside the stadium, hoping to see the players.", "a": true, "e": "✔ gathered가 동사, hoping은 분사구문"}, {"k": "ox", "q": "The data collected from the survey showing that most students prefer online classes.", "a": false, "e": "collected는 분사, 동사가 없음 → show(showed)"}]}}, {"tag": "hof-07-P2", "name": "목적격보어 자리: to부정사 vs. 동사원형 vs. 분사", "talk": [{"k": "m", "t": "목적격보어 자리는 **문장의 동사가 결정**해요! 먼저 동사를 보고, 다음으로 **목적어와 보어의 관계**(능동/수동)를 따져요 🧭"}, {"k": "m", "t": "① want, ask, tell, allow, expect, enable, encourage, force, cause, advise, persuade + O + **to-v**"}, {"k": "q", "q": "The teacher encouraged us ____ our opinions freely.", "o": ["express", "to express", "expressed"], "a": 1, "ok": "맞아요! encourage + O + to-v", "no": "encourage는 to부정사를 보어로 → to express"}, {"k": "m", "t": "② 사역동사 **make, have, let** + O + **동사원형** / **help** + O + **(to) v** (둘 다 OK)"}, {"k": "ex", "en": "My parents let me stay up late on weekends.", "ko": "부모님은 주말에 내가 늦게까지 깨어 있게 해 주신다."}, {"k": "m", "t": "⚠️ **get**은 '시키다'라는 뜻이어도 **to-v**: I got my brother [to] help me with the boxes."}, {"k": "m", "t": "③ 지각동사 **see, watch, hear, feel, notice** + O + **동사원형 / v-ing**(진행 중인 동작 강조)"}, {"k": "m", "t": "④ 목적어가 **당하는** 관계면 **p.p.**: I had my phone [repaired]. / I heard my name called. (let은 let + O + be p.p.)"}, {"k": "q", "q": "She had her essay ____ by her teacher.", "o": ["check", "to check", "checked"], "a": 2, "ok": "정확해요! 에세이가 검토됨(수동) → checked", "no": "목적어 her essay는 '검토되는' 쪽 → p.p."}, {"k": "m", "t": "⑤ keep, find, leave + O + **v-ing**(능동) / **p.p.**(수동) → He kept me waiting. / I found the door locked."}, {"k": "m", "t": "정리! **to-v 동사 / 사역 원형 / 지각 원형·v-ing / 수동이면 p.p. / get은 to-v** 👍"}], "notes": {"table": [["동사", "능동 관계", "수동 관계"], ["want, ask, tell, allow, expect, enable, encourage, force, cause", "O + to-v", "O + to be p.p."], ["make, have", "O + 동사원형", "O + p.p."], ["let", "O + 동사원형", "O + be p.p."], ["help", "O + (to) v", "—"], ["get", "O + to-v", "O + p.p."], ["see, watch, hear, feel, notice", "O + 동사원형 / v-ing", "O + p.p."], ["keep, find, leave", "O + v-ing", "O + p.p."]], "tips": ["1단계: 동사 종류 확인 → 2단계: 목적어가 하면 능동, 당하면 p.p.", "get + O + to-v (사역 뜻이어도 원형 ✗)", "have + 사람 + 원형 / have + 사물 + p.p.가 대표 패턴"]}, "sets": {"workbook": [{"k": "pk", "q": "My doctor advised me [to get*/get] more exercise.", "e": "advise + O + to-v"}, {"k": "pk", "q": "The coach made the players [run*/to run] ten laps around the field.", "e": "사역 make + O + 원형"}, {"k": "pk", "q": "I heard someone [knock*/to knock] on the door late at night.", "e": "지각동사 + O + 원형"}, {"k": "pk", "q": "We had the old roof [replace/replaced*] last summer.", "e": "지붕이 교체됨 → p.p."}, {"k": "bl", "q": "엄마는 내가 친구들과 캠핑 가는 것을 허락해 주셨다. → My mom allowed me (to) go camping with my friends.", "e": "allow + O + to-v"}, {"k": "bl", "q": "나는 그가 무대 위에서 노래하는 것을 보았다. → I watched him (sing|singing) on the stage.", "e": "지각동사 + O + 원형/v-ing"}, {"k": "bl", "q": "그녀는 그 파일이 삭제된 것을 발견했다. → She found the file (deleted).", "e": "파일이 삭제됨 → p.p."}, {"k": "bl", "q": "그는 남동생에게 방 청소를 시켰다. → He got his brother (to) clean the room.", "e": "get + O + to-v"}, {"k": "ox", "q": "The teacher let us to use dictionaries during the test.", "a": false, "e": "let + O + 원형 → use"}, {"k": "fx", "q": "Regular exercise helps you staying healthy.", "w": "staying", "a": ["stay", "to stay"], "e": "help + O + (to) v"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? My parents ____ me to study abroad.", "o": ["wanted", "encouraged", "allowed", "made", "expected"], "a": 3, "e": "④ make는 O + 원형 (to ✗)"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe manager had the staff ____ the boxes.\nThe manager had the boxes ____ to the warehouse.", "o": ["move – moved", "moved – move", "to move – moved", "moving – to move", "move – move"], "a": 0, "e": "직원이 옮김 → 원형 move / 상자가 옮겨짐 → moved"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I saw a stranger enter the building.", "The heavy rain caused the river to overflow.", "She made her son wash the dishes.", "He got his car fix at the garage.", "We felt the ground shaking."], "a": 3, "e": "④ 차가 수리됨 → fixed"}, {"k": "pk", "q": "The new system will enable users [access/to access*] their files from anywhere.", "e": "enable + O + to-v"}, {"k": "pk", "q": "I noticed a man [following*/followed] me down the street.", "e": "남자가 따라옴(능동) → following"}, {"k": "bl", "q": "선생님은 우리에게 휴대폰을 끄라고 말씀하셨다. → The teacher told us (to) turn off our phones.", "e": "tell + O + to-v"}, {"k": "bl", "q": "그녀는 자신의 그림들이 미술관에 전시되게 했다. → She had her paintings (displayed|exhibited) in the gallery.", "e": "그림이 전시됨 → p.p."}, {"k": "fx", "q": "The police officer ordered the driver get out of the car.", "w": "get", "a": ["to get"], "e": "order + O + to-v"}, {"k": "ox", "q": "I'll have the delivery man bring the package to your office.", "a": true, "e": "✔ have + 사람 + 원형"}, {"k": "ox", "q": "Don't let the children to play near the pool.", "a": false, "e": "let + O + 원형 → play"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nLast week, my parents had our living room (A)[paint / painted]. They also asked my brother and me (B)[help / to help] move the furniture. While we worked, I could hear my dad (C)[sing / to sing] his favorite songs.", "o": ["paint – help – sing", "painted – to help – sing", "painted – help – to sing", "paint – to help – to sing", "painted – to help – to sing"], "a": 1, "e": "(A) 거실이 칠해짐 → painted (B) ask + O + to-v (C) 지각동사 + O + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The coach made us practice until dark.\nⓑ I'd like to have this shirt cleaned by Friday.\nⓒ The scholarship allowed her continue her studies.\nⓓ I watched the sun rising over the sea.\nⓔ He couldn't make himself understand in French.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ to continue ⓔ 자신이 이해됨 → understood"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nMy grandmother never lets anyone ①‘touch’ her garden. Every morning, she has me ②‘water’ the plants, and she expects me ③‘to remove’ the weeds, too. Last week, I saw her ④‘talk’ to her tomatoes! She even got a fence ⑤‘build’ to keep rabbits out.", "o": ["", "", "", "", ""], "a": 4, "e": "⑤ 울타리가 세워짐 → built"}, {"k": "fx", "q": "Her kind words made me felt much better.", "w": "felt", "a": ["feel"], "e": "사역 make + O + 원형"}, {"k": "fx", "q": "I had my wisdom tooth pull out yesterday.", "w": "pull", "a": ["pulled"], "e": "이가 뽑힘 → p.p."}, {"k": "wr", "q": "그 선생님은 학생들이 매일 일기를 쓰게 하신다. (have, the students, keep a diary, every day)", "a": ["The teacher has the students keep a diary every day.", "The teacher has his students keep a diary every day.", "The teacher has her students keep a diary every day."], "e": "사역 have + O + 원형"}, {"k": "wr", "q": "나는 복도에서 내 이름이 불리는 것을 들었다. (hear, my name, call, in the hallway)", "a": ["I heard my name called in the hallway.", "In the hallway, I heard my name called."], "e": "이름이 불림 → p.p."}, {"k": "or", "q": "그 프로그램은 학생들이 스스로 공부할 수 있게 해 준다.", "a": "The program enables students to study on their own.", "e": "enable + O + to-v"}, {"k": "pk", "q": "The music was too loud, so I asked my neighbor [turn/to turn*] it down.", "e": "ask + O + to-v"}, {"k": "ox", "q": "We got the computer repaired before the deadline.", "a": true, "e": "✔ 컴퓨터가 수리됨 → get + O + p.p."}]}}, {"tag": "hof-07-P3", "name": "명사 수식: 현재분사 vs. 과거분사", "talk": [{"k": "m", "t": "명사를 꾸미는 분사: 꾸밈받는 **명사가 직접 하면 v-ing**, **당하면 p.p.** 🔁"}, {"k": "ex", "en": "a dog barking at strangers / a window broken by the storm", "ko": "낯선 사람에게 짖는 개 / 폭풍에 깨진 창문"}, {"k": "m", "t": "풀이 전략: 명사를 분사의 **주어**로 놓고 말을 만들어 봐요 → The window broke the storm? ✗ / The window was broken by the storm ✓ → broken"}, {"k": "q", "q": "There are many problems ____ by climate change.", "o": ["causing", "caused", "cause"], "a": 1, "ok": "맞아요! 문제가 '야기됨' + by → caused", "no": "problems는 기후 변화에 의해 '일으켜지는' 쪽 → caused"}, {"k": "m", "t": "단서 ① 분사 뒤에 **목적어**가 있으면 대부분 v-ing → students [taking] the exam"}, {"k": "m", "t": "단서 ② **by + 행위자**가 있으면 p.p. → a song sung by children"}, {"k": "m", "t": "⚠️ 함정: **named, called** 뒤의 이름은 목적어가 아니라 보어! → a boy [named] Tom (Tom이라고 이름 지어진 소년)"}, {"k": "q", "q": "I met a girl ____ Jiwoo at the library.", "o": ["naming", "named", "names"], "a": 1, "ok": "정확해요! 이름이 지어짐 → named", "no": "소녀가 이름을 짓는 게 아니라 '지어진' 것 → named"}, {"k": "m", "t": "⚠️ 자동사(happen, rise, remain, exist, disappear)는 수동이 없어요 → rising prices, the remaining seats / 자동사 p.p.는 '완료'일 때만 → fallen leaves, a retired teacher"}, {"k": "m", "t": "정리! **명사가 하면 v-ing / 당하면 p.p. / named·called는 p.p. / 자동사는 보통 v-ing** 👍"}], "notes": {"table": [["단서", "정답", "예"], ["명사가 동작을 함", "v-ing", "the girl playing the violin"], ["명사가 동작을 당함", "p.p.", "a car made in Germany"], ["분사 뒤 목적어", "대개 v-ing", "a law protecting wild animals"], ["by + 행위자", "p.p.", "a novel written by Han Kang"], ["named / called + 이름", "p.p.", "a city called the Big Apple"], ["자동사", "v-ing (완료면 p.p.)", "rising sea levels / fallen leaves"]], "tips": ["명사 + 분사 = 명사 + 관계대명사 + be + 분사 → 'be + 분사'로 문장이 되는지 확인", "known for(~로 유명한), located in(~에 위치한), based on(~에 기반한)은 p.p.", "remaining, existing, rising, increasing은 자동사라 v-ing"]}, "sets": {"workbook": [{"k": "pk", "q": "The man [selling*/sold] vegetables at the market is very friendly.", "e": "남자가 채소를 팜, 뒤에 목적어"}, {"k": "pk", "q": "This is a bridge [designing/designed*] by a famous architect.", "e": "다리가 설계됨, by"}, {"k": "pk", "q": "We stayed at a small hotel [surrounding/surrounded*] by mountains.", "e": "호텔이 둘러싸임, by"}, {"k": "pk", "q": "Look at the sun [rising*/risen] above the horizon.", "e": "자동사 rise → 떠오르고 있는"}, {"k": "bl", "q": "영어로 쓰인 책들 → books (written) in English", "e": "책이 쓰임"}, {"k": "bl", "q": "길을 건너고 있는 아이들 → the children (crossing) the street", "e": "아이들이 건넘, 뒤에 목적어"}, {"k": "bl", "q": "Max라는 이름의 강아지 → a puppy (named|called) Max", "e": "named + 이름"}, {"k": "bl", "q": "그 사고에서 다친 승객들 → the passengers (injured|hurt) in the accident", "e": "승객이 다침(다치게 됨)"}, {"k": "ox", "q": "The number of tickets selling online h f their phones.", "e": "학생이 시험을 침 → taking"}, {"k": "pk", "q": "Tickets [purchasing/purchased*] online cannot be refunded.", "e": "표가 구매됨 → purchased"}, {"k": "bl", "q": "There are many endangered animals (living) in this national park. (살고 있는)", "e": "동물이 삶 → living"}, {"k": "ox", "q": "The man injured in the car accident is recovering in the hospital.", "a": true, "e": "✔ 남자가 부상당함 → injured"}]}}, {"tag": "hof-07-P4", "name": "감정동사의 현재분사 vs. 과거분사", "talk": [{"k": "m", "t": "excite, bore, surprise, disappoint… 감정동사는 원래 '**~하게 만들다**'라는 뜻! 그래서 분사도 방향이 정해져요 😮"}, {"k": "m", "t": "감정을 **일으키는** 쪽(원인) → **v-ing** / 감정을 **느끼는** 쪽 → **p.p.**"}, {"k": "ex", "en": "The results were disappointing. / The players were disappointed with the results.", "ko": "결과는 실망스러웠다. / 선수들은 결과에 실망했다."}, {"k": "q", "q": "Many viewers found the ending of the drama ____.", "o": ["confusing", "confused", "confuse"], "a": 0, "ok": "맞아요! 결말이 혼란을 줌 → confusing", "no": "목적어 the ending은 혼란을 '일으키는' 쪽 → confusing"}, {"k": "m", "t": "풀이 전략: 분사가 설명하는 명사를 찾고 → 그 명사가 감정을 **주는지, 받는지** 판단! 보어 자리면 **주어**(주격보어)나 **목적어**(목적격보어)를 봐요"}, {"k": "m", "t": "⚠️ 사람이라고 늘 p.p.는 아니에요 → a [boring] teacher (남을 지루하게 하는 선생님) / 사물이라도 p.p.일 수 있어요 → a surprised look (놀란 사람의 표정)"}, {"k": "q", "q": "She gave me a ____ look when I told her the news.", "o": ["surprising", "surprised", "surprise"], "a": 1, "ok": "정확해요! 놀란 사람의 표정 → surprised", "no": "표정은 '놀람을 느낀' 그녀의 것 → surprised"}, {"k": "m", "t": "자주 나오는 짝: amazing–amazed, annoying–annoyed, depressing–depressed, embarrassing–embarrassed, exhausting–exhausted, frustrating–frustrated, overwhelming–overwhelmed, satisfying–satisfied, terrifying–terrified, thrilling–thrilled"}, {"k": "m", "t": "정리! **원인은 v-ing / 느끼는 쪽은 p.p. / 보어 자리면 주어·목적어 기준** 👍"}], "notes": {"table": [["자리", "판단 기준", "예"], ["명사 앞", "꾸미는 명사", "a thrilling game / thrilled fans"], ["주격보어", "주어", "The trip was exhausting. / We were exhausted."], ["목적격보어", "목적어", "I found the book boring. / The book made me bored."], ["분사구문", "주절의 주어", "Frustrated by the delay, he left."]], "tips": ["사람이 남에게 감정을 일으키면 v-ing (an annoying classmate)", "a surprised look, a worried face, a satisfied smile → 느끼는 사람의 표정이라 p.p.", "be interested in / be satisfied with / be frightened of / be pleased with"]}, "sets": {"workbook": [{"k": "pk", "q": "The final scene of the movie was truly [moving*/moved].", "e": "장면이 감동을 줌"}, {"k": "pk", "q": "The students were [frustrating/frustrated*] by the difficult questions.", "e": "학생들이 좌절감을 느낌"}, {"k": "pk", "q": "I found his explanation [convincing*/convinced].", "e": "목적어(설명)가 확신을 줌"}, {"k": "pk", "q": "The kids looked [boring/bored*] during the long speech.", "e": "아이들이 지루함을 느낌"}, {"k": "bl", "q": "그 마라톤은 매우 지치게 하는 경험이었다. → The marathon was an (exhausting) experience.", "e": "경험이 지치게 함"}, {"k": "bl", "q": "우리는 그 경치에 감탄했다. → We were (amazed) by the view.", "e": "우리가 놀라움을 느낌"}, {"k": "bl", "q": "그 소식은 그녀를 우울하게 만들었다. → The news made her (depressed).", "e": "목적어(그녀)가 느낌"}, {"k": "bl", "q": "그의 무례한 행동은 정말 짜증 났다. → His rude behavior was really (annoying).", "e": "행동이 짜증을 일으킴"}, {"k": "ox", "q": "I was so embarrassed when I called my teacher 'Mom' in class.", "a": true, "e": "✔ 내가 당황함을 느낌"}, {"k": "fx", "q": "The fans were thrilling to see their favorite singer up close.", "w": "thrilling", "a": ["thrilled"], "e": "팬들이 짜릿함을 느낌"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe test results were ____.\nThe parents were ____ with the test results.", "o": ["satisfying – satisfied", "satisfied – satisfying", "satisfying – satisfying", "satisfied – satisfied", "satisfy – satisfied"], "a": 0, "e": "결과가 만족을 줌 / 부모가 만족을 느낌"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I was shocked to hear the news.", "The long wait was frustrating.", "She felt overwhelmed by all the work.", "The haunted house was terrified.", "We were amazed at his talent."], "a": 3, "e": "④ 유령의 집이 공포를 줌 → terrifying"}, {"k": "ch", "q": "따옴표 친 부분의 쓰임이 옳은 것은?", "o": ["The audience was ‘exciting’ about the show.", "The lecture was so ‘bored’ that I fell asleep.", "She found the novel ‘fascinating’.", "I'm ‘interesting’ in science.", "The noise left me ‘annoying’."], "a": 2, "e": "③ 소설이 매혹함 / ① excited ② boring ④ interested ⑤ annoyed"}, {"k": "pk", "q": "He is an [amusing*/amused] storyteller who always makes people laugh.", "e": "남을 즐겁게 하는 이야기꾼"}, {"k": "pk", "q": "After the ten-hour flight, everyone felt [exhausting/exhausted*].", "e": "모두가 지침을 느낌"}, {"k": "bl", "q": "그의 갑작스러운 사임은 모두에게 놀라운 일이었다. → His sudden resignation was (surprising|shocking) to everyone.", "e": "사임이 놀라움을 줌"}, {"k": "bl", "q": "나는 시험 결과에 실망했다. → I was (disappointed) with my test results.", "e": "내가 실망을 느낌"}, {"k": "fx", "q": "Losing the final game was a depressed experience for the whole team.", "w": "depressed", "a": ["depressing"], "e": "경험이 우울하게 만듦"}, {"k": "ox", "q": "The children were fascinated by the magician's tricks.", "a": true, "e": "✔ 아이들이 매료됨"}, {"k": "ox", "q": "It is a confused situation, so let me explain it again.", "a": false, "e": "상황이 혼란을 줌 → confusing"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nWhen I started learning the violin, I was (A)[frustrating / frustrated] because I couldn't play a single song. But my teacher's (B)[encouraging / encouraged] words kept me going. Now, playing the violin is the most (C)[satisfying / satisfied] part of my day.", "o": ["frustrating – encouraging – satisfying", "frustrated – encouraged – satisfied", "frustrated – encouraging – satisfying", "frustrating – encouraged – satisfied", "frustrated – encouraging – satisfied"], "a": 2, "e": "(A) 내가 좌절함 → frustrated (B) 말이 용기를 줌 → encouraging (C) 바이올린 연주가 만족을 줌 → satisfying"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The documentary was very touching.\nⓑ I felt embarrassing when I fell on the stage.\nⓒ The crowd was thrilled by the fireworks.\nⓓ His boring speech made the audience bored.\nⓔ The puzzle was so confused that no one solved it.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ embarrassed ⓔ confusing"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nI went to see a horror movie with my friends last night. Everyone said it was ①‘terrifying’, but I wasn't ②‘scared’ at all. In fact, I found it rather ③‘boring’. My friends, however, were so ④‘frightening’ that they screamed the whole time. I was ⑤‘amused’ by their reactions.", "o": ["", "", "", "", ""], "a": 3, "e": "④ 친구들이 겁을 먹음 → frightened"}, {"k": "fx", "q": "Her performance left the judges deeply impressing.", "w": "impressing", "a": ["impressed"], "e": "목적어(심사위원)가 감명을 받음"}, {"k": "fx", "q": "The amazed thing is that the old man still runs marathons.", "w": "amazed", "a": ["amazing"], "e": "그 일이 놀라움을 줌"}, {"k": "wr", "q": "나는 그 다큐멘터리가 매우 흥미롭다는 것을 알았다. (find, the documentary, very interesting)", "a": ["I found the documentary very interesting."], "e": "목적어가 흥미를 줌 → interesting"}, {"k": "wr", "q": "그 긴 회의는 모두를 지치게 만들었다. (the long meeting, make, everyone, exhaust)", "a": ["The long meeting made everyone exhausted."], "e": "목적어(모두)가 지침을 느낌 → exhausted"}, {"k": "or", "q": "그는 자신의 실수에 당황한 것처럼 보였다.", "a": "He looked embarrassed by his mistake.", "e": "그가 당황함을 느낌 → embarrassed"}, {"k": "pk", "q": "Don't look so [worrying/worried*]. Everything will be fine.", "e": "네가 걱정을 느낌"}, {"k": "ox", "q": "Interested in history, she decided to major in it.", "a": true, "e": "✔ 그녀가 흥미를 느낌 → Interested"}]}}, {"tag": "hof-07-P5", "name": "분사구문에서 현재분사 vs. 과거분사", "talk": [{"k": "m", "t": "분사구문 어법의 핵심: 분사구문의 **숨은 주어 = 주절의 주어**! 그 주어가 **하면 v-ing**, **당하면 p.p.** ✂️"}, {"k": "ex", "en": "Seen from space, the Earth looks like a blue marble.", "ko": "우주에서 보면 지구는 파란 구슬처럼 보인다. (지구가 보여짐 → Seen)"}, {"k": "m", "t": "풀이 전략: 콤마 뒤 **주절의 주어**를 먼저 찾고 → '주어가 ~하다 / ~되다'로 말을 만들어 봐요"}, {"k": "q", "q": "____ in simple language, the book is easy for children to read.", "o": ["Writing", "Written", "Having written"], "a": 1, "ok": "맞아요! 책이 '쓰인' 것 → Written", "no": "주절의 주어 the book은 쓰여지는 쪽 → Written"}, {"k": "m", "t": "분사 뒤에 **목적어**가 있으면 대부분 능동 v-ing → [Hearing] the news, she burst into tears."}, {"k": "m", "t": "접속사가 남은 분사구문도 같아요 → **When asked** about the plan, he said nothing. / **While** [walking] home, I met Sam."}, {"k": "q", "q": "If ____ properly, this plant can live for decades.", "o": ["caring for", "cared for", "care for"], "a": 1, "ok": "정확해요! 식물이 돌봐짐 → cared for", "no": "주어 this plant는 '돌봐지는' 쪽 → If cared for"}, {"k": "m", "t": "완료형: **Having p.p.**(능동, 먼저 일어남) / **(Having been) p.p.**(수동, 먼저 일어남) → Having [finished] his work, he went home."}, {"k": "m", "t": "**with + 명사 + 분사**: 그 명사가 하면 v-ing, 당하면 p.p. → with his eyes [closed] / with the engine running"}, {"k": "m", "t": "🎉 Chapter 7 분사 끝! **진짜 동사 확인 → 목적격보어는 동사·관계 → 명사·주절 주어가 하면 v-ing, 당하면 p.p.** 👍"}], "notes": {"table": [["형태", "의미", "예"], ["v-ing", "주절 주어가 함 (동시)", "Walking home, I met Sam."], ["(Being) p.p.", "주절 주어가 당함 (동시)", "Shocked by the news, she cried."], ["Having p.p.", "주어가 함 (먼저)", "Having lost my key, I can't get in."], ["(Having been) p.p.", "주어가 당함 (먼저)", "Built in 1900, the house is old."], ["접속사 + 분사", "접속사 남긴 분사구문", "When asked, he smiled. / Once opened, keep it cold."], ["with + 명사 + 분사", "명사 기준 능동/수동", "with his arms folded / with the TV running"]], "tips": ["숨은 주어 = 주절의 주어 (주절 주어부터 찾기)", "분사 뒤 목적어 → 대개 v-ing / by + 행위자 → p.p.", "Having p.p. 뒤에 목적어가 없고 '당한' 의미면 Having been p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "[Looking*/Looked] out the window, I saw a rainbow.", "e": "내가 내다봄 → Looking"}, {"k": "pk", "q": "[Surrounding/Surrounded*] by fans, the singer couldn't move.", "e": "가수가 둘러싸임 → Surrounded"}, {"k": "pk", "q": "[Having finished*/Finished] the report, she handed it in early.", "e": "그녀가 보고서를 끝냄(목적어) → Having finished"}, {"k": "pk", "q": "He sat on the couch with his arms [folding/folded*].", "e": "팔이 접힘 → folded"}, {"k": "bl", "q": "When I was asked about my plans, I didn't know what to say. → When (asked) about my plans, I didn't know what to say.", "e": "내가 질문받음 → asked"}, {"k": "bl", "q": "Because the vase was made of glass, it broke easily. → (Made) of glass, the vase broke easily.", "e": "꽃병이 만들어짐 → Made"}, {"k": "bl", "q": "After she had graduated from college, she moved to New York. → (Having) graduated from college, she moved to New York.", "e": "먼저 일어난 능동 → Having p.p."}, {"k": "bl", "q": "그녀는 엔진을 켜 둔 채로 차에서 내렸다. → She got out of the car with the engine (running).", "e": "엔진이 돌아감 → running"}, {"k": "ox", "q": "Exhausted from the long hike, we went straight to bed.", "a": true, "e": "✔ 우리가 지침 → Exhausted"}, {"k": "fx", "q": "Locating near the station, the hotel is popular with tourists.", "w": "Locating", "a": ["Located"], "e": "호텔이 위치해 있음 → Located"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ by the loud noise, the baby started to cry.", "o": ["Waking", "Woken", "Having woken", "Wake", "To wake"], "a": 1, "e": "아기가 깨워짐(by) → Woken"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Walking along the beach, we collected shells.", "Built in 1890, the church is a historic landmark.", "Compared with last year, sales have increased.", "Leaving alone, the puppy barked all day.", "Having lost his wallet, he had to borrow money."], "a": 3, "e": "④ 강아지가 홀로 남겨짐 → Left"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ the letter, she began to cry.\n____ in a hurry, the letter was full of mistakes.", "o": ["Reading – Writing", "Read – Written", "Reading – Written", "Read – Writing", "Having read – Writing"], "a": 2, "e": "그녀가 편지를 읽음 → Reading / 편지가 쓰임 → Written"}, {"k": "pk", "q": "[Given*/Giving] another chance, he would do much better.", "e": "그가 기회를 받음 → Given"}, {"k": "pk", "q": "While [driving*/driven] to work, he listens to podcasts.", "e": "그가 운전함 → driving"}, {"k": "bl", "q": "(Located) on the coast, the city has a mild climate. (해안에 위치해 있어서)", "e": "도시가 위치함 → Located"}, {"k": "bl", "q": "그녀는 다리를 꼰 채로 앉아 있었다. → She was sitting with her legs (crossed).", "e": "다리가 꼬임 → crossed"}, {"k": "fx", "q": "Shocking by the news, she couldn't say a word.", "w": "Shocking", "a": ["Shocked"], "e": "그녀가 충격받음(by) → Shocked"}, {"k": "ox", "q": "Having been written in a hurry, the essay had many errors.", "a": true, "e": "✔ 에세이가 (먼저) 쓰임 → Having been written"}, {"k": "ox", "q": "Once opening, the bottle should be kept in the refrigerator.", "a": false, "e": "병이 열림 → Once opened"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n(A)[Founding / Founded] in 1636, Harvard is the oldest university in the United States. (B)[Attracting / Attracted] students from all over the world, it has produced many famous leaders. (C)[Walking / Walked] around the campus, visitors can feel its long history.", "o": ["Founding – Attracting – Walking", "Founded – Attracted – Walking", "Founded – Attracting – Walked", "Founded – Attracting – Walking", "Founding – Attracted – Walked"], "a": 3, "e": "(A) 대학이 설립됨 → Founded (B) 대학이 학생을 끌어들임(목적어) → Attracting (C) 방문객이 걸음 → Walking"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Seen from a distance, the island looks like a turtle.\nⓑ Not having been invited, he didn't go to the party.\nⓒ Tiring after work, she fell asleep on the sofa.\nⓓ He listened to music with his eyes closing.\nⓔ When finished, put the tools back in the box.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ 그녀가 지침 → Tired ⓓ 눈이 감김 → closed"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\n①‘Born’ in a small village, Marie dreamed of becoming a scientist. ②‘Encouraged’ by her father, she studied hard. ③‘Having moved’ to Paris, she entered a university there. ④‘Worked’ day and night, she made important discoveries. ⑤‘Awarded’ the Nobel Prize twice, she became world-famous.", "o": ["", "", "", "", ""], "a": 3, "e": "④ 그녀가 일함 → Working / ⑤ 상을 받음(수동) → Awarded ✔"}, {"k": "fx", "q": "Disappointing with the result, the team decided to practice harder.", "w": "Disappointing", "a": ["Disappointed"], "e": "팀이 실망함 → Disappointed"}, {"k": "fx", "q": "Having stolen from the museum, the painting was never found.", "w": "Having", "a": ["Having been"], "e": "그림이 (먼저) 도난당함 → Having been stolen"}, {"k": "wr", "q": "Because the book is written in easy English, it sells well. → 분사구문으로 바꾸시오.", "a": ["Written in easy English, the book sells well.", "Written in easy English, it sells well.", "Being written in easy English, the book sells well.", "Being written in easy English, it sells well."], "e": "책이 쓰임 → (Being) Written"}, {"k": "wr", "q": "그는 TV를 켜 둔 채로 잠이 들었다. (fall asleep, with, the TV, turn on)", "a": ["He fell asleep with the TV turned on.", "He fell asleep with the TV on."], "e": "TV가 켜짐 → turned on"}, {"k": "or", "q": "질문을 받았을 때, 그녀는 미소만 지었다. (When asked)", "a": "When asked, she just smiled.", "e": "그녀가 질문받음 → asked"}, {"k": "pk", "q": "[Having been damaged*/Having damaged] by the earthquake, the building had to be torn down.", "e": "건물이 (먼저) 손상됨 → Having been damaged"}, {"k": "bl", "q": "(Compared) with other cities, Seoul has a lot of green spaces. (다른 도시들과 비교하면)", "e": "서울이 비교됨 → Compared"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그 회의에 초대받은 사람들 대부분은 전문가였다. (most of the people, invite to the meeting, be experts)", "a": ["Most of the people invited to the meeting were experts."], "e": "분사 invited + 동사 were"}, {"k": "wr", "q": "엄마는 내가 친구 집에서 자고 오게 허락해 주셨다. (let, me, stay over, at my friend's house)", "a": ["My mom let me stay over at my friend's house.", "Mom let me stay over at my friend's house.", "My mother let me stay over at my friend's house."], "e": "let + O + 원형"}, {"k": "wr", "q": "나는 어제 컴퓨터를 수리받았다. (have, my computer, repair, yesterday)", "a": ["I had my computer repaired yesterday.", "Yesterday I had my computer repaired.", "Yesterday, I had my computer repaired."], "e": "컴퓨터가 수리됨 → p.p."}, {"k": "wr", "q": "그 결과는 우리를 실망하게 만들었다. (the result, make, us, disappoint)", "a": ["The result made us disappointed.", "The results made us disappointed."], "e": "목적어(우리)가 실망을 느낌"}, {"k": "wr", "q": "As the house was built 100 years ago, it needs many repairs. → 분사구문으로 바꾸시오.", "a": ["Built 100 years ago, the house needs many repairs.", "Built 100 years ago, it needs many repairs.", "Having been built 100 years ago, the house needs many repairs.", "Having been built 100 years ago, it needs many repairs."], "e": "집이 (먼저) 지어짐 → (Having been) Built"}, {"k": "bl", "q": "The boy (wearing) a red cap is my brother. (빨간 모자를 쓴)", "e": "소년이 씀 → wearing"}, {"k": "bl", "q": "I heard my name (called) in the crowd. (불리는 것)", "e": "이름이 불림 → called"}, {"k": "fx", "q": "The novel was so bored that I couldn't finish it.", "w": "bored", "a": ["boring"], "e": "소설이 지루함을 줌"}, {"k": "fx", "q": "The boxes delivered this morning containing old books.", "w": "containing", "a": ["contain", "contained"], "e": "delivered는 분사, 동사가 없음 → contain"}, {"k": "or", "q": "멀리서 보면, 그 바위는 사람 얼굴처럼 보인다.", "a": "Seen from a distance, the rock looks like a human face.", "e": "바위가 보여짐 → Seen"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? The scientists ____ the new vaccine received an award.", "o": ["develop", "developed", "developing", "were developing", "develops"], "a": 2, "e": "동사 received가 있음 + 과학자가 개발함(목적어) → developing"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? She ____ her little brother clean his room.", "o": ["made", "had", "let", "helped", "told"], "a": 4, "e": "⑤ tell + O + to-v"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["There is a house painted white on the hill.", "I know a man called Jack.", "Let's finish the remaining tasks first.", "The tourists visited Seoul for the first time were excited.", "The trees planted last year are growing well."], "a": 3, "e": "④ 동사 were가 있음 → visiting"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe long trip was ____, so all of us were ____.", "o": ["tiring – tired", "tired – tiring", "tiring – tiring", "tired – tired", "tire – tired"], "a": 0, "e": "여행이 지치게 함 / 우리가 지침"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nI had my hair (A)[cut / cutting] yesterday. The hairdresser asked me (B)[sit / to sit] still, and I watched her (C)[work / to work] carefully.", "o": ["cut – sit – work", "cutting – to sit – to work", "cut – to sit – work", "cut – to sit – to work", "cutting – sit – work"], "a": 2, "e": "(A) 머리가 잘림 → cut(p.p.) (B) ask + O + to-v (C) 지각동사 + O + 원형"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ from the top of the tower, the city looks beautiful at night.", "o": ["Seeing", "Seen", "Having seen", "To seeing", "Saw"], "a": 1, "e": "도시가 보여짐 → Seen"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["The man drives the bus is my uncle.", "I found the movie excited.", "She got her brother carry the bags.", "Having been warned of the storm, we stayed home.", "He kept me waited for an hour."], "a": 3, "e": "④ 옳음 / ① driving ② exciting ③ to carry ⑤ waiting"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nLast summer, I visited a village ①‘known’ for its colorful houses. The houses, ②‘painted’ in bright colors, ③‘looking’ like candy. A woman ④‘selling’ fruit told me that the paint ⑤‘used’ on the walls was made from natural materials.", "o": ["", "", "", "", ""], "a": 2, "e": "③ 두 번째 문장에 동사가 없음 → look(looked)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The boy hit by the ball was taken to the nurse.\nⓑ We were surprising at the news.\nⓒ I saw him crossing the road.\nⓓ Leaving alone at home, the dog felt lonely.\nⓔ The man sat next to me snored loudly.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 1, "e": "ⓐⓒ 옳음 / ⓑ surprised ⓓ Left ⓔ sitting"}, {"k": "ch", "q": "다음 문장을 분사구문으로 바르게 바꾼 것은?\nAfter he had been injured in the game, he couldn't play for a month.", "o": ["Injuring in the game, he couldn't play for a month.", "Having injured in the game, he couldn't play for a month.", "Having been injured in the game, he couldn't play for a month.", "Being injuring in the game, he couldn't play for a month.", "Injure in the game, he couldn't play for a month."], "a": 2, "e": "먼저 + 수동 → Having been injured"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그는 다리를 꼰 채로 의자에 앉아 있었다.", "o": ["He was sitting on the chair with his legs crossing.", "He was sitting on the chair with his legs crossed.", "He was sitting on the chair with crossed his legs.", "He was sitting on the chair his legs with crossed.", "He was sitting on the chair with his legs cross."], "a": 1, "e": "with + 명사 + p.p.(다리가 꼬임)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The students waiting for the bus looked cold.", true], ["The letter sent yesterday arrived this morning.", true], ["My parents allowed me go to the concert.", false], ["I heard the dog barking all night.", true], ["The festival holding every May attracts many tourists.", false], ["We found the lecture boring.", true], ["The audience was moving by her speech.", false], ["Having finished dinner, we went for a walk.", true], ["The woman lives upstairs is a doctor.", false], ["Asked to give a speech, he felt nervous.", true], ["I had my bike fixed.", true], ["The boy named Leo is my cousin.", true]], "e": "ⓒ to go ⓔ held ⓖ moved ⓘ living"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The man repairing the roof is my dad.", true], ["Surrounded by trees, the house is very quiet.", true], ["I got my sister help me with my homework.", false], ["The results were very satisfying.", true], ["Most of the products made in this factory are exported.", true], ["She sat with her eyes closing.", false], ["The heavy rain caused the game to be canceled.", true], ["Not knowing what to do, I called my mom.", true], ["The children played in the park were noisy.", false], ["We watched the sun set over the sea.", true], ["Writing in a hurry, the email had many typos.", false], ["The fans were excited about the new album.", true]], "e": "ⓒ to help ⓕ closed ⓘ playing ⓚ Written"}, {"k": "wr", "q": "그 소식을 듣고, 그녀는 울음을 터뜨렸다. — 분사구문으로 (hear the news, burst into tears)", "a": ["Hearing the news, she burst into tears.", "Having heard the news, she burst into tears."], "e": "그녀가 들음(목적어 the news) → Hearing"}, {"k": "wr", "q": "나는 그 영화가 매우 감동적이라는 것을 알았다. (find, the movie, very moving)", "a": ["I found the movie very moving."], "e": "목적어(영화)가 감동을 줌 → moving"}]}}, {"book": "hof", "chapter": {"id": "08", "name": "등위·상관접속사와 병렬구조", "title": "해커스 어법 제대로 · Chapter 8 등위·상관접속사와 병렬구조"}, "units": [{"tag": "hof-08-P1", "name": "동사 병렬", "talk": [{"k": "m", "t": "Chapter 8은 **병렬구조**! and, but, or 같은 접속사로 연결되는 말은 **같은 형태**여야 해요 ⚖️"}, {"k": "m", "t": "등위접속사: **and, but, or** / 상관접속사: **both A and B, either A or B, neither A nor B, not A but B, not only A but (also) B, B as well as A**"}, {"k": "m", "t": "**동사 병렬**: 접속사 앞뒤 동사는 **시제·수·형태**를 맞춰요"}, {"k": "ex", "en": "Every morning, my dad makes coffee, reads the newspaper, and walks the dog.", "ko": "매일 아침 아빠는 커피를 만들고, 신문을 읽고, 개를 산책시킨다."}, {"k": "q", "q": "She finished her homework and ____ to bed early.", "o": ["go", "went", "going"], "a": 1, "ok": "맞아요! finished와 병렬 → went", "no": "앞의 동사 finished(과거)와 짝 → went"}, {"k": "m", "t": "풀이 전략: 접속사 **뒤**를 보고 → 짝이 되는 **앞**의 동사를 찾아요. 사이에 긴 목적어·수식어가 끼어 있어도 건너뛰기!"}, {"k": "m", "t": "⚠️ 조동사 뒤 병렬은 둘 다 **동사원형** → You should eat less and [exercise] more."}, {"k": "q", "q": "Students must either submit the form online or ____ it in person.", "o": ["bring", "brought", "bringing"], "a": 0, "ok": "정확해요! must 뒤 원형끼리 병렬", "no": "must submit ~ or (must) bring → 원형"}, {"k": "m", "t": "⚠️ 동사냐 분사냐 헷갈리면: 접속사 앞이 문장의 **동사**면 뒤도 동사! He opened the box and [found] a letter. (finding ✗)"}, {"k": "m", "t": "정리! **접속사 앞뒤 확인 → 동사끼리는 시제·수·형태 일치 / 조동사 뒤는 둘 다 원형** 👍"}], "notes": {"table": [["접속사", "병렬 예"], ["A, B, and C", "She washed, dried, and folded the clothes."], ["either A or B", "You can either call me or text me."], ["neither A nor B", "He neither smokes nor drinks."], ["not only A but (also) B", "She not only sings but also dances."], ["not A but B", "He didn't walk but ran to school."], ["조동사 + A and B", "You must stop and think. (둘 다 원형)"]], "tips": ["접속사 뒤 동사 → 앞에서 같은 주어의 동사 찾기", "A, B, and C처럼 셋 이상이면 마지막 앞에만 and", "접속사가 없는 콤마 뒤는 동사 ✗ → 분사구문"]}, "sets": {"workbook": [{"k": "pk", "q": "He picked up the phone and [dial/dialed*] his mother's number.", "e": "picked와 병렬 → dialed"}, {"k": "pk", "q": "In music class, the children laugh, sing, and [dance*/dancing] together.", "e": "laugh, sing과 병렬 → dance"}, {"k": "pk", "q": "You can either call me or [send*/sent] me a text message.", "e": "can call ~ or send → 원형"}, {"k": "pk", "q": "She not only teaches math but also [coaches*/coaching] the soccer team.", "e": "teaches와 병렬 → coaches"}, {"k": "bl", "q": "그는 지갑을 집어 들고 서둘러 문밖으로 나갔다. → He grabbed his wallet and (rushed|hurried) out the door.", "e": "grabbed와 병렬 → 과거"}, {"k": "bl", "q": "너는 좀 쉬고 물을 많이 마셔야 한다. → You should rest and (drink) a lot of water.", "e": "should 뒤 원형끼리"}, {"k": "bl", "q": "그녀는 매일 아침 일찍 일어나서 공원에서 조깅한다. → She gets up early and (jogs) in the park every morning.", "e": "gets와 병렬 → jogs"}, {"k": "bl", "q": "우리는 그 박물관을 방문했지만 사진은 한 장도 찍지 않았다. → We visited the museum but (took) no pictures.", "e": "visited와 병렬 → took"}, {"k": "ox", "q": "Yesterday, my brother cleaned his room and washes the dishes.", "a": false, "e": "cleaned와 병렬 → washed"}, {"k": "fx", "q": "The cat jumped onto the table and knocking over a glass of milk.", "w": "knocking", "a": ["knocked"], "e": "jumped와 병렬 → knocked"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The researchers collected data from 500 students and ____ the results carefully.", "o": ["analyze", "analyzed", "analyzing", "to analyze", "analyzes"], "a": 1, "e": "collected와 병렬 → analyzed"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The baby cried and kicking her legs.", "He either walks or rides his bike to school.", "She neither called nor wrote to me.", "We ate dinner and watched a movie.", "Please sit down and wait here."], "a": 0, "e": "① cried와 병렬 → kicked"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He fixed the car and paints the fence last weekend.", "You must wear a helmet and following the rules.", "She smiled, waved, and walked away.", "The team practiced hard but losing the game.", "I will call you and telling you the news."], "a": 2, "e": "③ 옳음 / ① painted ② follow ④ lost ⑤ tell"}, {"k": "pk", "q": "The manager not only listened to our complaints but also [promised*/promising] to fix the problem.", "e": "listened와 병렬 → promised"}, {"k": "pk", "q": "In the summer, many people go to the beach, swim in the sea, and [relax*/relaxing] in the sun.", "e": "go, swim과 병렬 → relax"}, {"k": "bl", "q": "그 학생은 수업에 늦었을 뿐만 아니라 숙제도 잊어버렸다. → The student not only came late to class but also (forgot) his homework.", "e": "came과 병렬 → forgot"}, {"k": "bl", "q": "할머니는 매일 정원에 물을 주고 채소를 돌보신다. → My grandmother waters the garden and (takes) care of the vegetables every day.", "e": "waters와 병렬 → takes"}, {"k": "fx", "q": "She studied hard for months and finally passes the exam.", "w": "passes", "a": ["passed"], "e": "studied와 병렬 → passed"}, {"k": "ox", "q": "We can take the subway or catch a taxi to the airport.", "a": true, "e": "✔ can take ~ or catch"}, {"k": "ox", "q": "The volunteers cleaned the beach and collecting over 100 kilograms of trash.", "a": false, "e": "cleaned와 병렬 → collected"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nLast weekend, my family drove to the countryside, (A)[stayed / staying] in a small cabin. We hiked up a mountain and (B)[enjoyed / enjoying] the view. In the evening, my dad built a fire, and we (C)[roasted / roasting] marshmallows.", "o": ["stayed – enjoyed – roasted", "staying – enjoyed – roasted", "staying – enjoying – roasting", "stayed – enjoying – roasted", "staying – enjoying – roasted"], "a": 1, "e": "(A) 접속사 없는 콤마 뒤 → 분사구문 staying (B) hiked와 병렬 → enjoyed (C) and 뒤 새 절 we + 동사 → roasted"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He opened the window and let in some fresh air.\nⓑ She neither eats meat nor drinking milk.\nⓒ You should turn off the lights and lock the door.\nⓓ The dog ran to the gate and barks at the mailman.\nⓔ I will either buy a new laptop or fix my old one.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ drinks ⓓ barked"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nEvery year, thousands of volunteers ①‘travel’ to the coast, ②‘pick’ up plastic waste, and ③‘sort’ it for recycling. Last year, they not only cleaned 50 beaches but also ④‘planting’ trees along the shore. They hope that people will reduce plastic use and ⑤‘protect’ the ocean.", "o": ["", "", "", "", ""], "a": 3, "e": "④ cleaned와 병렬 → planted / ⑤ will reduce ~ and (will) protect ✔"}, {"k": "fx", "q": "The scientist carefully mixed the chemicals, heated the mixture, and records the results.", "w": "records", "a": ["recorded"], "e": "mixed, heated와 병렬 → recorded"}, {"k": "fx", "q": "You can either pay by card or paying in cash at the counter.", "w": "paying", "a": ["pay"], "e": "can pay ~ or pay → 원형"}, {"k": "wr", "q": "그녀는 노래를 부를 뿐만 아니라 직접 곡도 쓴다. (not only, sing, but also, write her own songs)", "a": ["She not only sings but also writes her own songs.", "She not only sings but writes her own songs."], "e": "sings – writes 병렬"}, {"k": "wr", "q": "우리는 집에 머물거나 영화를 보러 갈 수 있다. (either, stay home, or, go to the movies)", "a": ["We can either stay home or go to the movies.", "We can either stay at home or go to the movies."], "e": "can 뒤 원형끼리"}, {"k": "or", "q": "그는 문을 열고, 안을 들여다보고, 미소를 지었다.", "a": "He opened the door, looked inside, and smiled.", "e": "과거 동사 셋 병렬"}, {"k": "pk", "q": "The tour guide showed us around the palace and [explained*/explaining] its long history.", "e": "showed와 병렬 → explained"}, {"k": "ox", "q": "She didn't complain but quietly finished her work.", "a": true, "e": "✔ not A but B: didn't complain ~ but finished"}]}}, {"tag": "hof-08-P2", "name": "동명사와 to부정사 병렬", "talk": [{"k": "m", "t": "동명사(v-ing)는 동명사끼리, to부정사는 to부정사끼리! 📏"}, {"k": "ex", "en": "My hobbies are hiking in the mountains and taking photos of wildflowers.", "ko": "나의 취미는 산에서 하이킹하기와 들꽃 사진 찍기이다."}, {"k": "q", "q": "I enjoy cooking for my friends and ____ new recipes.", "o": ["try", "to try", "trying"], "a": 2, "ok": "맞아요! cooking과 병렬 → trying", "no": "enjoy의 목적어 cooking과 짝 → trying"}, {"k": "m", "t": "to부정사 병렬에서 뒤의 **to는 생략 가능** → She decided to quit her job and (to) [travel] around the world."}, {"k": "m", "t": "⚠️ 그래서 to를 생략하면 뒤 동사는 **원형**! to read and writing ✗ / to read and write ✓"}, {"k": "q", "q": "The goal of the program is to teach basic skills and ____ students' confidence.", "o": ["build", "building", "built"], "a": 0, "ok": "정확해요! to teach ~ and (to) build", "no": "to부정사 병렬, to 생략 → 원형 build"}, {"k": "m", "t": "전치사 뒤 병렬은 둘 다 **동명사** → She is good at [drawing] and painting. / by saving money and investing it"}, {"k": "m", "t": "풀이 전략: 접속사 뒤 동사 모양을 보고 → 앞쪽에서 **짝**(to-v인지 v-ing인지)을 찾아요. 앞이 to-v면 뒤는 to-v 또는 원형"}, {"k": "m", "t": "정리! **v-ing ↔ v-ing / to-v ↔ (to) 원형 / 전치사 뒤는 v-ing끼리** 👍"}], "notes": {"table": [["짝", "병렬", "예"], ["동명사", "v-ing and v-ing", "Reading and writing are important skills."], ["to부정사", "to-v and (to) v", "I want to rest and (to) relax."], ["전치사 + 동명사", "전치사 + v-ing and v-ing", "Thank you for helping me and listening to me."], ["동명사 목적어 동사", "enjoy / avoid / finish + v-ing and v-ing", "He avoids eating late and drinking soda."]], "tips": ["to read and writing ✗ / reading and to write ✗", "뒤에 to가 없는 원형이 오면 앞의 to-v와 짝인지 확인", "전치사 뒤 → 무조건 동명사끼리"]}, "sets": {"workbook": [{"k": "pk", "q": "She likes reading novels and [watch/watching*] documentaries.", "e": "reading과 병렬"}, {"k": "pk", "q": "My plan is to save money and [buy*/buying] a car next year.", "e": "to save ~ and (to) buy"}, {"k": "pk", "q": "He is interested in learning languages and [traveling*/travel] abroad.", "e": "전치사 in 뒤 동명사끼리"}, {"k": "pk", "q": "Remember to lock the door and [turn*/turning] off the lights.", "e": "to lock ~ and (to) turn"}, {"k": "bl", "q": "운동하는 것과 잘 먹는 것이 건강에 중요하다. → Exercising and (eating) well are important for your health.", "e": "Exercising과 병렬"}, {"k": "bl", "q": "그녀는 의사가 되어 아픈 아이들을 돕기를 원한다. → She wants to become a doctor and (help) sick children.", "e": "to become ~ and (to) help"}, {"k": "bl", "q": "그는 매일 걸어서 출근하고 계단을 이용함으로써 체중을 줄였다. → He lost weight by walking to work and (using) the stairs every day.", "e": "전치사 by 뒤 동명사끼리"}, {"k": "bl", "q": "나는 일찍 일어나는 것도 아침을 먹는 것도 좋아하지 않는다. → I don't like getting up early or (eating) breakfast.", "e": "getting과 병렬"}, {"k": "ox", "q": "Her job involves answering phone calls and to schedule meetings.", "a": false, "e": "answering과 병렬 → scheduling"}, {"k": "fx", "q": "The best way to learn English is to read a lot and speaking often.", "w": "speaking", "a": ["speak", "to speak"], "e": "to read ~ and (to) speak"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The purpose of this camp is to teach children survival skills and ____ them to love nature.", "o": ["encourage", "encouraging", "encouraged", "encourages", "to encouraging"], "a": 0, "e": "to teach ~ and (to) encourage"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I prefer staying home and reading books.", "He promised to call me and explain everything.", "She avoided eating junk food and drinking soda.", "We talked about moving to a new city and starting over.", "My dream is to travel the world and meeting new people."], "a": 4, "e": "⑤ to travel ~ and (to) meet"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He gave up smoking and to drink.", "Swimming and to jog are good exercises.", "Thank you for helping me and to listen to me.", "She hopes to study hard and get into a good university.", "I'm tired of cleaning and cook every day."], "a": 3, "e": "④ 옳음 / ① drinking ② jogging ③ listening ⑤ cooking"}, {"k": "pk", "q": "Instead of complaining about the problem and [doing*/do] nothing, we should find a solution.", "e": "전치사 of 뒤 동명사끼리"}, {"k": "pk", "q": "Doctors advise people to sleep at least seven hours and [avoid*/avoiding] caffeine at night.", "e": "to sleep ~ and (to) avoid"}, {"k": "bl", "q": "그녀는 아이들을 가르치는 것과 그들이 자라는 것을 지켜보는 것을 즐긴다. → She enjoys teaching children and (watching) them grow.", "e": "teaching과 병렬"}, {"k": "bl", "q": "우리의 목표는 쓰레기를 줄이고 환경을 보호하는 것이다. → Our goal is to reduce waste and (protect) the environment.", "e": "to reduce ~ and (to) protect"}, {"k": "fx", "q": "Taking notes in class and review them later will help you remember more.", "w": "review", "a": ["reviewing"], "e": "Taking과 병렬 → reviewing"}, {"k": "ox", "q": "She decided to quit her job and open a small bakery.", "a": true, "e": "✔ to quit ~ and (to) open"}, {"k": "ox", "q": "He is good at fixing computers and design websites.", "a": false, "e": "전치사 at 뒤 → designing"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nMany experts believe that the key to happiness is not making a lot of money but (A)[spend / spending] time with loved ones. They also recommend exercising regularly and (B)[get / getting] enough sleep. In short, try to be grateful and (C)[enjoy / enjoying] every moment.", "o": ["spend – get – enjoy", "spending – getting – enjoy", "spending – get – enjoying", "spend – getting – enjoying", "spending – getting – enjoying"], "a": 1, "e": "(A) not making ~ but spending (B) exercising과 병렬 → getting (C) to be ~ and (to) enjoy"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'm looking forward to meeting you and hearing your stories.\nⓑ He wants to learn Spanish and moving to Spain.\nⓒ Walking and cycling are eco-friendly ways to travel.\nⓓ She spent the weekend painting the fence and plant flowers.\nⓔ It is important to listen carefully and ask questions.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ move ⓓ planting"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nLiving a healthy life isn't difficult. It just requires ①‘eating’ balanced meals, ②‘exercising’ regularly, and ③‘managing’ stress. Experts recommend that you try to walk 10,000 steps a day and ④‘drinking’ plenty of water. By ⑤‘making’ small changes, you can improve your health.", "o": ["", "", "", "", ""], "a": 3, "e": "④ to walk ~ and (to) drink → drink"}, {"k": "fx", "q": "Her responsibilities include managing the budget and train new employees.", "w": "train", "a": ["training"], "e": "managing과 병렬 → training"}, {"k": "fx", "q": "The teacher asked us to read the article and writing a short summary.", "w": "writing", "a": ["write", "to write"], "e": "to read ~ and (to) write"}, {"k": "wr", "q": "내 취미는 음악을 듣는 것과 기타를 치는 것이다. — 동명사로 (my hobbies, listen to music, play the guitar)", "a": ["My hobbies are listening to music and playing the guitar."], "e": "동명사끼리 병렬"}, {"k": "wr", "q": "그는 체중을 줄이고 더 건강해지기로 결심했다. (decide, lose weight, become healthier)", "a": ["He decided to lose weight and become healthier.", "He decided to lose weight and to become healthier."], "e": "to lose ~ and (to) become"}, {"k": "or", "q": "그녀는 아이들을 돌보는 것과 집안일을 하는 것에 지쳤다.", "a": "She is tired of taking care of the kids and doing housework.", "e": "전치사 of 뒤 동명사끼리"}, {"k": "pk", "q": "Would you mind closing the window and [turning*/turn] on the heater?", "e": "mind closing ~ and turning"}, {"k": "bl", "q": "Instead of taking a taxi or (driving) a car, why don't you ride a bike? (차를 운전하다)", "e": "전치사 of 뒤 동명사끼리"}]}}, {"tag": "hof-08-P3", "name": "분사 병렬", "talk": [{"k": "m", "t": "분사도 병렬! 접속사 앞이 **분사**면 뒤도 **분사**(동사 ✗) 🔗"}, {"k": "ex", "en": "The festival, held every October and attended by thousands, is famous for its food.", "ko": "매년 10월에 열리고 수천 명이 참석하는 그 축제는 음식으로 유명하다."}, {"k": "q", "q": "The man sitting on the bench and ____ the newspaper is my grandfather.", "o": ["read", "reads", "reading"], "a": 2, "ok": "맞아요! sitting과 병렬 → reading", "no": "진짜 동사는 is → and 뒤도 분사 reading"}, {"k": "m", "t": "⚠️ 병렬이라고 무조건 같은 모양은 아니에요! v-ing냐 p.p.냐는 각각 **꾸미는 명사와의 관계**로 판단 → a girl **wearing** a red coat and **followed** by a dog"}, {"k": "q", "q": "This is a toy made in China and ____ all over the world.", "o": ["selling", "sold", "sells"], "a": 1, "ok": "정확해요! 장난감이 팔림 → sold", "no": "made와 병렬인 분사 + 장난감은 '팔리는' 쪽 → sold"}, {"k": "m", "t": "분사구문 병렬도 같아요 → [Feeling] sick and wanting to rest, she went home early."}, {"k": "m", "t": "목적격보어 병렬: I saw him **open** the door and **walk** in. / I found the window **broken** and the curtain **torn**."}, {"k": "m", "t": "풀이 전략: 접속사 뒤가 동사인지 분사인지 → 앞의 짝이 문장의 **진짜 동사**인지 **분사**인지 확인! (Ch.7 동사 vs 분사와 같은 원리)"}, {"k": "m", "t": "🎉 Chapter 8 병렬구조 끝! **접속사 뒤를 보고 앞의 짝 찾기 → 동사는 동사끼리, 준동사는 준동사끼리, 분사는 각자 능동·수동 판단** 👍"}], "notes": {"table": [["구조", "병렬", "예"], ["명사 수식", "분사 and 분사", "a woman living alone and loved by everyone"], ["분사구문", "분사 and 분사", "Tired and hungry, we stopped at a café."], ["주어 뒤 삽입", ", 분사 and 분사,", "The church, built in 1890 and restored in 2010, ~"], ["목적격보어", "원형 and 원형 / p.p. and p.p.", "I heard her laugh and sing."], ["콤마 뒤 연속", "v-ing and v-ing", "She walked in, smiling and waving."]], "tips": ["분사 병렬에서도 v-ing / p.p.는 각자 능동·수동으로 판단", "and 뒤가 동사가 되면 문장의 동사가 둘 → 진짜 동사 개수 확인", "형용사와 분사도 병렬 가능: tired and hungry"]}, "sets": {"workbook": [{"k": "pk", "q": "I met a woman living next door and [working*/works] at the hospital.", "e": "living과 병렬 → working"}, {"k": "pk", "q": "The museum has many paintings drawn by children and [donated*/donating] by local families.", "e": "drawn과 병렬 + 그림이 기증됨"}, {"k": "pk", "q": "[Feeling*/Felt] tired and wanting to sleep, he went to bed early.", "e": "wanting과 병렬 + 그가 느낌"}, {"k": "pk", "q": "I heard the baby crying and [calling*/called] for her mom.", "e": "crying과 병렬 + 아기가 부름"}, {"k": "bl", "q": "그 소포는 포장되고 라벨이 붙은 채로 배송 준비가 되었다. → The package, wrapped and (labeled|labelled), was ready for delivery.", "e": "wrapped와 병렬 + 소포가 라벨 붙여짐"}, {"k": "bl", "q": "그녀는 웃으면서 손을 흔들며 우리 쪽으로 걸어왔다. → She walked toward us, smiling and (waving).", "e": "smiling과 병렬"}, {"k": "bl", "q": "프랑스어로 쓰이고 1850년에 출판된 그 소설 → the novel written in French and (published) in 1850", "e": "written과 병렬 + 소설이 출판됨"}, {"k": "bl", "q": "나는 그가 방에 들어와 앉는 것을 보았다. → I saw him come into the room and (sit) down.", "e": "목적격보어 원형끼리"}, {"k": "ox", "q": "The students, excited and nervous, waited for their names to be called.", "a": true, "e": "✔ excited and nervous"}, {"k": "fx", "q": "The boy holding a balloon and laughs loudly is my nephew.", "w": "laughs", "a": ["laughing"], "e": "진짜 동사는 is → holding과 병렬 → laughing"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The athletes, ____ by their fans and determined to win, arrived at the stadium.", "o": ["cheer", "cheered", "cheering", "cheers", "to cheer"], "a": 1, "e": "선수들이 응원받음(by) + determined와 병렬 → cheered"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The church, built in 1890 and restored in 2010, is popular with tourists.", "Walking slowly and humming a song, she entered the park.", "I found my bike stolen and my bag gone.", "We saw the kids run and jump into the pool.", "The man wearing glasses and carries a bag is my teacher."], "a": 4, "e": "⑤ 진짜 동사 is → carrying"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe letter, ____ in a hurry and ____ without a stamp, never arrived.", "o": ["writing – sending", "written – sent", "written – sending", "writing – sent", "wrote – sent"], "a": 1, "e": "편지가 쓰이고 보내짐 → written – sent"}, {"k": "pk", "q": "Exhausted and [soaking/soaked*] with sweat, the runners crossed the finish line.", "e": "주자들이 땀에 젖음 → soaked"}, {"k": "pk", "q": "We could hear the birds singing and [chirping*/chirped] in the trees.", "e": "singing과 병렬"}, {"k": "bl", "q": "그 개는 꼬리를 흔들고 짖으면서 문으로 달려갔다. → The dog ran to the door, wagging its tail and (barking).", "e": "wagging과 병렬"}, {"k": "bl", "q": "많은 사람들에게 사랑받고 존경받는 그 지도자 → the leader loved and (respected) by many people", "e": "loved와 병렬 + 존경받음"}, {"k": "fx", "q": "Raised in Canada and educating in France, she speaks both English and French.", "w": "educating", "a": ["educated"], "e": "Raised와 병렬 + 그녀가 교육받음 → educated"}, {"k": "ox", "q": "The car, parked illegally and blocking the road, was towed away.", "a": true, "e": "✔ 차가 주차됨(p.p.) / 차가 길을 막음(v-ing) — 각자 판단"}, {"k": "ox", "q": "Holding the map and look around, the tourist seemed lost.", "a": false, "e": "Holding과 병렬 → looking"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe Eiffel Tower, (A)[designing / designed] by Gustave Eiffel and (B)[completing / completed] in 1889, was at first criticized by many artists. Today, however, it stands proudly in Paris, (C)[attracting / attracted] about seven million visitors a year.", "o": ["designing – completing – attracting", "designed – completed – attracted", "designed – completing – attracting", "designed – completed – attracting", "designing – completed – attracted"], "a": 3, "e": "(A) 탑이 설계됨 → designed (B) 탑이 완공됨 → completed (C) 탑이 방문객을 끌어들임(목적어) → attracting"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The cookies, baked this morning and wrapped in paper, smell great.\nⓑ She stood at the door, smiling and waves at us.\nⓒ I saw a boy climbing the tree and picking apples.\nⓓ The novel, translated into 20 languages and selling millions of copies, made her famous.\nⓔ Confused and frustrating, he gave up on the puzzle.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ waving ⓔ 그가 좌절감을 느낌 → frustrated"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nI visited an old castle ①‘located’ on a hill and ②‘surrounded’ by a river. Inside, I saw armor ③‘worn’ by knights and swords ④‘using’ in battles. A guide ⑤‘wearing’ a costume told us stories about the castle.", "o": ["", "", "", "", ""], "a": 3, "e": "④ 칼이 사용됨 → used"}, {"k": "fx", "q": "Singing loudly and danced to the music, the kids had a great time.", "w": "danced", "a": ["dancing"], "e": "Singing과 병렬 + 아이들이 춤춤 → dancing"}, {"k": "fx", "q": "This is a product designed in Korea and manufacturing in Vietnam.", "w": "manufacturing", "a": ["manufactured"], "e": "designed와 병렬 + 제품이 제조됨"}, {"k": "wr", "q": "그녀는 노래를 흥얼거리며 저녁을 만들면서 부엌에 서 있었다. (stand in the kitchen, hum a song, cook dinner)", "a": ["She stood in the kitchen, humming a song and cooking dinner.", "She was standing in the kitchen, humming a song and cooking dinner.", "She stood in the kitchen humming a song and cooking dinner.", "She was standing in the kitchen humming a song and cooking dinner."], "e": "humming and cooking 병렬"}, {"k": "wr", "q": "지치고 배가 고파서, 우리는 근처 식당에 들어갔다. (Tired and hungry, go into, a nearby restaurant)", "a": ["Tired and hungry, we went into a nearby restaurant."], "e": "Tired and hungry"}, {"k": "or", "q": "나는 창문이 깨져 있고 커튼이 찢어져 있는 것을 발견했다.", "a": "I found the window broken and the curtain torn.", "e": "목적격보어 p.p. 병렬"}, {"k": "pk", "q": "The old man, [living*/lived] alone and rarely seen in public, was a mystery to his neighbors.", "e": "노인이 혼자 삶 → living (seen은 수동)"}, {"k": "bl", "q": "Built in 1900 and (renovated) in 2020, the hotel combines old and new styles. (2020년에 개조된)", "e": "Built와 병렬 + 호텔이 개조됨"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그는 집에 와서 샤워를 하고 잠자리에 들었다. (come home, take a shower, go to bed)", "a": ["He came home, took a shower, and went to bed.", "He came home, took a shower and went to bed."], "e": "과거 동사 병렬"}, {"k": "wr", "q": "너는 지금 떠나거나 여기서 기다릴 수 있다. (either, leave now, or, wait here)", "a": ["You can either leave now or wait here."], "e": "can 뒤 원형끼리"}, {"k": "wr", "q": "그녀의 꿈은 세계를 여행하고 책을 쓰는 것이다. (her dream, travel the world, write a book)", "a": ["Her dream is to travel the world and write a book.", "Her dream is to travel the world and to write a book."], "e": "to-v and (to) v"}, {"k": "wr", "q": "나는 피아노를 치는 것과 그림 그리는 것을 즐긴다. (enjoy, play the piano, draw pictures)", "a": ["I enjoy playing the piano and drawing pictures."], "e": "동명사끼리"}, {"k": "wr", "q": "1990년에 지어지고 2015년에 개조된 그 건물은 시청이다. (the building, build in 1990, renovate in 2015, the city hall)", "a": ["The building built in 1990 and renovated in 2015 is the city hall.", "The building, built in 1990 and renovated in 2015, is the city hall."], "e": "p.p. and p.p."}, {"k": "bl", "q": "He not only plays the guitar but also (sings) in a band. (노래도 한다)", "e": "plays와 병렬"}, {"k": "bl", "q": "Learning a new language and (making) new friends are the best parts of studying abroad. (새 친구를 사귀는 것)", "e": "Learning과 병렬"}, {"k": "fx", "q": "She opened the letter, read it quickly, and starts to cry.", "w": "starts", "a": ["started", "began"], "e": "opened, read와 병렬 → started"}, {"k": "fx", "q": "Raised by his grandparents and lived in the countryside, he loves nature.", "w": "lived", "a": ["living"], "e": "Raised와 병렬 분사구문 + 그가 삶 → living"}, {"k": "or", "q": "그 학생은 손을 들고 질문을 했다.", "a": "The student raised his hand and asked a question.", "e": "과거 동사 병렬"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? The chef chopped the vegetables, added some spices, and ____ the soup slowly.", "o": ["stir", "stirred", "stirring", "stirs", "to stir"], "a": 1, "e": "chopped, added와 병렬 → stirred"}, {"k": "ch", "q": "빈칸에 알맞은 것은? She decided to save money and ____ a new laptop.", "o": ["buy", "buying", "bought", "buys", "to buying"], "a": 0, "e": "to save ~ and (to) buy"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I like hiking and camping.", "He neither smokes nor drinks.", "We stayed home and watching TV.", "She wants to read and to write well.", "The man sitting there and reading a book is Tom."], "a": 2, "e": "③ stayed와 병렬 → watched"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nMy hobbies are drawing cartoons and ____ games.\nI hope to visit Paris and ____ the Eiffel Tower.", "o": ["play – see", "playing – see", "playing – seeing", "play – seeing", "to play – saw"], "a": 1, "e": "drawing과 병렬 → playing / to visit ~ and (to) see"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe students not only cleaned the classroom but also (A)[decorate / decorated] it. Their teacher, (B)[surprising / surprised] and pleased, thanked them. She promised to buy pizza and (C)[have / having] a party.", "o": ["decorate – surprising – have", "decorated – surprised – have", "decorated – surprising – having", "decorate – surprised – having", "decorated – surprised – having"], "a": 1, "e": "(A) cleaned와 병렬 (B) pleased와 병렬, 선생님이 놀람 (C) to buy ~ and (to) have"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["She either takes the bus or walks to school.", "He came in and sitting down.", "Reading books and to watch movies are fun.", "The vase, made in China and selling in Korea, is expensive.", "I enjoy swimming and ride a bike."], "a": 0, "e": "① 옳음 / ② sat ③ watching ④ sold ⑤ riding"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nMy grandfather wakes up at five, ①‘goes’ for a walk, and ②‘reads’ the newspaper. He enjoys ③‘gardening’ and ④‘cook’ for the family. He says the secret to a long life is to stay active and ⑤‘keep’ learning.", "o": ["", "", "", "", ""], "a": 3, "e": "④ gardening과 병렬 → cooking"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She smiled and waved at me.\nⓑ My plan is to study hard and passing the exam.\nⓒ Shocked and confused, he left the room.\nⓓ I saw her open the door and walk out.\nⓔ He likes playing soccer and watch baseball.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ pass ⓔ watching"}, {"k": "ch", "q": "빈칸에 들어갈 말로 알맞지 않은 것은? He likes reading comics and ____.", "o": ["playing games", "watching movies", "to swim", "drawing pictures", "listening to music"], "a": 2, "e": "③ reading과 병렬 → swimming"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그녀는 노래하고 춤추면서 무대 위를 걸었다.", "o": ["She walked on the stage, singing and dance.", "She walked on the stage, sang and dancing.", "She walked on the stage, singing and dancing.", "She walked on the stage, to sing and dancing.", "She walked on the stage, sung and danced."], "a": 2, "e": "singing and dancing 병렬"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["You should eat well and sleep enough.", "He not only speaks English but also speaking Chinese.", "The house, painted white and surrounded by trees, looks peaceful.", "Thank you for inviting me and showing me around.", "She wants to become a nurse and help people."], "a": 1, "e": "② speaks와 병렬 → speaks"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["He got up, washed his face, and ate breakfast.", true], ["I like singing and to dance.", false], ["The book, written in 1900 and translated into many languages, is still popular.", true], ["She neither called me nor sends a message.", false], ["Walking and talking, they arrived at school.", true], ["My goal is to save money and travel abroad.", true], ["The girl singing and play the piano is my sister.", false], ["You can either stay or leave.", true], ["He enjoys reading and writing poems.", true], ["Tired and hungry, we stopped at a café.", true], ["The dog jumped up and licking my face.", false], ["I saw him enter the shop and buy some milk.", true]], "e": "ⓑ dancing ⓓ sent ⓖ playing ⓚ licked"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Please turn off the TV and go to bed.", true], ["The movie was long and boring.", true], ["She enjoys painting and to listen to music.", false], ["The team trained hard and won the cup.", true], ["The letter, written by hand and sent by mail, moved me.", true], ["He wants to buy a car and driving to Busan.", false], ["He not only won but also broke the record.", true], ["The woman holding a baby and carried a bag looked tired.", false], ["Instead of complaining and doing nothing, act now.", true], ["Yesterday, she cleaned the room and washes the dishes.", false], ["Excited and nervous, I waited for the results.", true], ["I heard the kids laughing and shouting.", true]], "e": "ⓒ listening ⓕ drive ⓗ carrying ⓙ washed"}, {"k": "wr", "q": "그는 손을 씻고 저녁을 먹었다. (wash his hands, eat dinner)", "a": ["He washed his hands and ate dinner.", "He washed his hands and had dinner."], "e": "과거 동사 병렬"}, {"k": "wr", "q": "그녀는 책을 읽는 것과 음악을 듣는 것을 좋아한다. — 동명사로 (like, read books, listen to music)", "a": ["She likes reading books and listening to music."], "e": "동명사끼리"}]}}, {"book": "hof", "chapter": {"id": "09", "name": "부사절 접속사와 명사절 접속사", "title": "해커스 어법 제대로 · Chapter 9 부사절 접속사와 명사절 접속사"}, "units": [{"tag": "hof-09-P1", "name": "부사절 접속사 vs. 전치사", "talk": [{"k": "m", "t": "Chapter 9는 **접속사**! 첫 번째 포인트: 이 자리는 **접속사**일까 **전치사**일까? 🔀"}, {"k": "m", "t": "접속사 뒤에는 **절(주어 + 동사)**, 전치사 뒤에는 **명사(구)·동명사**"}, {"k": "ex", "en": "Because it rained heavily, the game was canceled. / Because of the heavy rain, the game was canceled.", "ko": "비가 많이 와서 / 폭우 때문에 경기가 취소되었다."}, {"k": "q", "q": "____ the traffic jam, we arrived on time.", "o": ["Although", "Despite", "Because"], "a": 1, "ok": "맞아요! 뒤에 동사 없음 + 반대 내용 → Despite", "no": "the traffic jam은 명사구 → 전치사 Despite"}, {"k": "m", "t": "짝 외우기: **because** ↔ **because of, due to** / **although, though, even though** ↔ **despite, in spite of** / **while** ↔ **during**"}, {"k": "m", "t": "풀이 전략: 빈칸 뒤에서 **동사**를 찾기! 동사가 있으면 접속사, 없으면 전치사"}, {"k": "q", "q": "He fell asleep ____ the movie.", "o": ["while", "during", "although"], "a": 1, "ok": "정확해요! the movie는 명사 → during", "no": "뒤에 동사가 없음 → 전치사 during"}, {"k": "m", "t": "⚠️ 뒤가 길어도 동사가 없으면 전치사 → **despite** the long and difficult training / **although** the training **was** long"}, {"k": "m", "t": "⚠️ 동명사도 명사! despite **being** tired ✓ / during sleeping ✗ → **while** sleeping (접속사를 남긴 분사구문) / despite **of** ✗"}, {"k": "m", "t": "정리! **뒤에 동사 → 접속사 / 명사·동명사 → 전치사 / despite of ✗** 👍"}], "notes": {"table": [["의미", "접속사 + 절", "전치사 + 명사(구)"], ["~ 때문에", "because, as, since", "because of, due to"], ["~에도 불구하고", "although, though, even though", "despite, in spite of"], ["~ 동안", "while", "during"]], "tips": ["despite of ✗ / in spite of ✓", "while + v-ing ✓ (분사구문) / during + v-ing ✗", "the fact that + 절 → despite the fact that ~ 처럼 명사로 만들면 전치사 가능"]}, "sets": {"workbook": [{"k": "pk", "q": "[Because*/Because of] the bus was late, I missed the first class.", "e": "뒤에 동사 was → 접속사"}, {"k": "pk", "q": "We canceled the picnic [because/because of*] the heavy rain.", "e": "명사구 → 전치사"}, {"k": "pk", "q": "[Although*/Despite] she was tired, she kept working.", "e": "뒤에 동사 was → 접속사"}, {"k": "pk", "q": "Please don't use your phone [while/during*] the exam.", "e": "명사 → 전치사"}, {"k": "bl", "q": "그는 부상에도 불구하고 경기를 끝까지 뛰었다. → He played until the end (despite) his injury.", "e": "명사 → despite"}, {"k": "bl", "q": "내가 저녁을 요리하는 동안 남동생은 숙제를 했다. → (While) I was cooking dinner, my brother did his homework.", "e": "절 → while"}, {"k": "bl", "q": "그 비행기는 짙은 안개 때문에 지연되었다. → The flight was delayed (because) of the thick fog.", "e": "because of + 명사"}, {"k": "bl", "q": "여름 방학 동안 나는 수영을 배웠다. → (During) the summer vacation, I learned to swim.", "e": "명사 → during"}, {"k": "ox", "q": "Despite it was cold, the children played outside.", "a": false, "e": "뒤에 동사 was → Although"}, {"k": "fx", "q": "Because of he was sick, he stayed home from school.", "w": "of", "a": ["(삭제)"], "e": "뒤에 절 → Because"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ the high price, the new phone sold out in a day.", "o": ["Although", "Though", "Despite", "Even though", "Because"], "a": 2, "e": "명사구 + 반대 내용 → Despite"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Though he is rich, he lives simply.", "We stayed inside because of the storm.", "During I was in Paris, I visited the Louvre.", "In spite of the noise, she fell asleep.", "The event was postponed due to the rain."], "a": 2, "e": "③ 뒤에 절 → While"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ his efforts, he failed the test.\n____ he tried hard, he failed the test.", "o": ["Despite – Although", "Although – Despite", "Despite – Despite", "Because of – Because", "Although – Although"], "a": 0, "e": "명사구 → Despite / 절 → Although"}, {"k": "pk", "q": "Many people moved to the city [because*/because of] there were more jobs.", "e": "뒤에 동사 were → 접속사"}, {"k": "pk", "q": "She stayed calm [although/in spite of*] the danger.", "e": "명사 → 전치사"}, {"k": "bl", "q": "비록 그 식당은 작지만, 항상 손님으로 가득하다. → (Although|Though) the restaurant is small, it is always full of customers.", "e": "절 → 접속사"}, {"k": "bl", "q": "그는 회의 중에 한마디도 하지 않았다. → He didn't say a word (during) the meeting.", "e": "명사 → during"}, {"k": "fx", "q": "Despite of the bad weather, the concert was held outdoors.", "w": "of", "a": ["(삭제)"], "e": "despite of ✗ → Despite"}, {"k": "ox", "q": "While staying in London, I visited many museums.", "a": true, "e": "✔ 접속사 + 분사구문"}, {"k": "ox", "q": "Because the traffic, we were late for the movie.", "a": false, "e": "명사 → Because of"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n(A)[Although / Despite] the weather forecast said it would rain, we went hiking. (B)[Because / Because of] the slippery trail, we walked very carefully. (C)[While / During] we were having lunch at the top, the sun came out.", "o": ["Although – Because – While", "Despite – Because of – During", "Although – Because of – While", "Despite – Because – While", "Although – Because of – During"], "a": 2, "e": "(A) 절(동사 said) → Although (B) 명사구 → Because of (C) 절 → While"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Despite being tired, he finished the report.\nⓑ Although his poor health, he worked hard.\nⓒ The game was delayed because of the rain.\nⓓ I met an old friend while I was shopping.\nⓔ During he was sleeping, someone called him.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ Despite ⓔ While"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\n①‘Although’ Thomas Edison is famous for many inventions, he failed thousands of times. ②‘Despite’ these failures, he never gave up. ③‘During’ he worked on the light bulb, he tested more than 1,000 materials. ④‘Because of’ his patience, he finally succeeded. ⑤‘While’ others saw failure, he saw lessons.", "o": ["", "", "", "", ""], "a": 2, "e": "③ 뒤에 절 → While"}, {"k": "fx", "q": "Although the long delay, the passengers remained patient.", "w": "Although", "a": ["Despite", "In spite of"], "e": "명사구 → Despite"}, {"k": "fx", "q": "She couldn't sleep well during her neighbors were having a party.", "w": "during", "a": ["while"], "e": "뒤에 절 → while"}, {"k": "wr", "q": "그 비싼 가격에도 불구하고, 많은 사람들이 그 차를 샀다. (despite, the high price, buy the car)", "a": ["Despite the high price, many people bought the car.", "In spite of the high price, many peopl
