e bought the car.", "Many people bought the car despite the high price.", "Many people bought the car in spite of the high price."], "e": "명사구 → despite"}, {"k": "wr", "q": "그는 아팠기 때문에 학교에 가지 않았다. (because, be sick, go to school)", "a": ["Because he was sick, he didn't go to school.", "He didn't go to school because he was sick."], "e": "절 → because"}, {"k": "or", "q": "비록 그녀는 어리지만, 매우 현명하다.", "a": "Although she is young, she is very wise.", "e": "절 → although"}, {"k": "pk", "q": "[In spite of*/Although] her nervousness, she gave a great speech.", "e": "명사 → 전치사"}, {"k": "ox", "q": "Due to the heavy snow, all flights were canceled.", "a": true, "e": "✔ due to + 명사"}]}}, {"tag": "hof-09-P2", "name": "부사절 접속사와 전치사 둘 다로 쓰이는 단어", "talk": [{"k": "m", "t": "**before, after, since, until(till), as**는 **접속사도 되고 전치사도 되는** 단어! 뒤에 절도, 명사도 올 수 있어요 🔁"}, {"k": "ex", "en": "Brush your teeth before you go to bed. / Brush your teeth before going to bed.", "ko": "자기 전에 이를 닦아라. (접속사 / 전치사)"}, {"k": "m", "t": "전치사로 쓰면 뒤에 **명사·동명사** → after [finishing] the work (after finish ✗)"}, {"k": "q", "q": "Turn off the lights before ____ the room.", "o": ["leave", "leaving", "left"], "a": 1, "ok": "맞아요! 전치사 before + 동명사", "no": "주어가 없으니 전치사 → 동명사 leaving"}, {"k": "m", "t": "접속사로 쓰면 뒤에 **주어 + 동사**, 시간의 부사절은 **미래 대신 현재** → I'll wait until he [comes]. (will come ✗)"}, {"k": "q", "q": "We'll start the meeting after everyone ____.", "o": ["arrives", "will arrive", "arriving"], "a": 0, "ok": "정확해요! 시간 부사절 → 현재시제", "no": "after + 주어 + 동사, 미래 대신 현재 → arrives"}, {"k": "m", "t": "**since**: '~ 이후로'(시간, 주절은 보통 현재완료) / '~ 때문에'(이유, 접속사만) → I have lived here since 2020. / Since it was late, we took a taxi."}, {"k": "m", "t": "**as**: 접속사 '~할 때, ~ 때문에, ~하듯이' / 전치사 '**~로서**' → [As] a doctor, she works long hours."}, {"k": "m", "t": "⚠️ 하나로만 쓰이는 단어와 구별! 접속사만: **while, because, although** / 전치사만: **during, because of, despite**"}, {"k": "m", "t": "정리! **before·after·since·until·as는 둘 다 OK → 전치사 뒤 동명사 / 접속사 뒤 주어 + 동사(시간절은 현재)** 👍"}], "notes": {"table": [["단어", "접속사 + 절", "전치사 + 명사·동명사"], ["before", "before you leave", "before leaving / before lunch"], ["after", "after he finished", "after finishing / after school"], ["since", "since I was ten (시간) / since it was late (이유)", "since 2020 / since moving here"], ["until(till)", "until the rain stops", "until midnight"], ["as", "as I was leaving (때) / as it was cold (이유)", "as a teacher (~로서)"]], "tips": ["전치사로 쓰면 동사원형 ✗ → 동명사 (before leave ✗)", "시간 부사절에서는 will ✗ → 현재시제", "since + 과거시점 → 주절은 현재완료", "주어가 다르면 동명사 대신 절: Before it gets dark, ~ (Before getting dark ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "Wash your hands before [eat/eating*] dinner.", "e": "전치사 before + 동명사"}, {"k": "pk", "q": "After [finish/finishing*] his homework, he played games.", "e": "전치사 after + 동명사"}, {"k": "pk", "q": "I have known her since we [were*/have been] in elementary school.", "e": "since + 과거의 때 → were"}, {"k": "pk", "q": "Please wait here until your name [is*/will be] called.", "e": "시간 부사절 → 현재"}, {"k": "bl", "q": "그는 대학 졸업 후 은행에서 일했다. → He worked at a bank after (graduating) from college.", "e": "전치사 after + 동명사"}, {"k": "bl", "q": "그녀는 교사로서 학생들을 존중한다. → (As) a teacher, she respects her students.", "e": "전치사 as(~로서)"}, {"k": "bl", "q": "나는 2019년 이후로 이 동네에 살아 왔다. → I have lived in this neighborhood (since) 2019.", "e": "since + 과거 시점"}, {"k": "bl", "q": "비가 그칠 때까지 여기서 기다리자. → Let's wait here (until|till) the rain stops.", "e": "접속사 until + 절"}, {"k": "ox", "q": "Since moving to Seoul, she has made many new friends.", "a": true, "e": "✔ 전치사 since + 동명사"}, {"k": "fx", "q": "Think carefully before make a decision.", "w": "make", "a": ["making"], "e": "전치사 before + 동명사"}], "practiceA": [{"k": "ch", "q": "따옴표 친 before의 쓰임이 나머지와 다른 것은?", "o": ["Call me ‘before’ you leave.", "I finished it ‘before’ the deadline.", "Read the instructions ‘before’ you start.", "She left ‘before’ I arrived.", "Lock the door ‘before’ you go out."], "a": 1, "e": "② 뒤에 명사 → 전치사 / 나머지 접속사"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Don't leave until the teacher will tell you.", "After the movie, we had dinner.", "I'll call you after I get home.", "He has been busy since he started the new job.", "As a child, I loved drawing."], "a": 0, "e": "① 시간 부사절 → tells"}, {"k": "ch", "q": "as의 쓰임이 <보기>와 같은 것은?\n<보기> She works as a nurse at the hospital.", "o": ["As I was tired, I went to bed early.", "As he grew older, he became wiser.", "He is famous as a singer.", "Do as I tell you.", "As it was raining, we stayed home."], "a": 2, "e": "<보기>는 전치사 '~로서' → ③"}, {"k": "pk", "q": "Since [move/moving*] here, I have never been sick.", "e": "전치사 since + 동명사"}, {"k": "pk", "q": "He studied hard until he [passes/passed*] the exam.", "e": "과거 이야기 → passed"}, {"k": "bl", "q": "점심을 먹은 후에 우리는 산책을 했다. → After (having|eating) lunch, we took a walk.", "e": "전치사 after + 동명사"}, {"k": "bl", "q": "그녀는 어렸을 때부터 피아노를 쳐 왔다. → She has played the piano (since) she was young.", "e": "접속사 since + 절"}, {"k": "fx", "q": "He checked his email right after wake up.", "w": "wake", "a": ["waking"], "e": "전치사 after + 동명사"}, {"k": "ox", "q": "I will lend you the book after I will finish reading it.", "a": false, "e": "시간 부사절 → finish"}, {"k": "ox", "q": "As a student, you should follow the school rules.", "a": true, "e": "✔ 전치사 as(~로서)"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nSince (A)[join / joining] the club, Mina has made many friends. (B)[As / Despite] a member, she helps plan events. Before each event (C)[begins / will begin], she checks everything carefully.", "o": ["join – As – begins", "joining – Despite – will begin", "joining – As – begins", "join – Despite – begins", "joining – As – will begin"], "a": 2, "e": "(A) 전치사 since + 동명사 (B) ~로서 → As (C) 시간 부사절 → 현재"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ After graduating, he moved to Busan.\nⓑ Wait until the light will turn green.\nⓒ Since it was Sunday, the bank was closed.\nⓓ Before go to bed, she reads a book.\nⓔ I have lived here since I was ten.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ turns ⓓ going"}, {"k": "ch", "q": "따옴표 친 since의 의미가 나머지와 다른 것은?", "o": ["I haven't seen him ‘since’ last summer.", "She has been happy ‘since’ she met him.", "‘Since’ you are here, let's start.", "It has rained ‘since’ this morning.", "He has worked here ‘since’ 2015."], "a": 2, "e": "③ 이유(~이므로) / 나머지 시간(~ 이후로)"}, {"k": "fx", "q": "I'll text you after I arrived at the station.", "w": "arrived", "a": ["arrive"], "e": "미래 일 + 시간 부사절 → 현재 arrive"}, {"k": "fx", "q": "He has played soccer since he is seven years old.", "w": "is", "a": ["was"], "e": "since + 과거의 때 → was"}, {"k": "wr", "q": "그는 뉴스를 본 후에 잠자리에 들었다. — after + 동명사로 (watch the news, go to bed)", "a": ["After watching the news, he went to bed.", "He went to bed after watching the news.", "After having watched the news, he went to bed."], "e": "전치사 after + 동명사"}, {"k": "wr", "q": "나는 그 일을 끝낼 때까지 집에 가지 않을 것이다. (until, finish the work, go home)", "a": ["I won't go home until I finish the work.", "Until I finish the work, I won't go home.", "I won't go home until I have finished the work."], "e": "시간 부사절 → 현재"}, {"k": "or", "q": "학생으로서 나는 매일 공부해야 한다.", "a": "As a student, I have to study every day.", "e": "전치사 as(~로서)"}, {"k": "pk", "q": "Before [it gets*/getting] dark, we should go back to the hotel.", "e": "어두워지는 주체는 it(≠ we) → 절로"}, {"k": "bl", "q": "Since (leaving) school, he has worked as a chef. (학교를 떠난 이후로)", "e": "전치사 since + 동명사"}]}}, {"tag": "hof-09-P3", "name": "명사절 접속사: 완전한 절 앞 vs. 불완전한 절 앞", "talk": [{"k": "m", "t": "명사절 접속사 고르기 = 뒤 절이 **완전한지 불완전한지**! 🧩"}, {"k": "m", "t": "**that / whether / if** + **완전한 절**(주어·목적어 다 있음) / **what** + **불완전한 절**(주어나 목적어가 빠짐)"}, {"k": "ex", "en": "I believe that she told the truth. / I believe what she told me.", "ko": "나는 그녀가 진실을 말했다고 믿는다. / 나는 그녀가 내게 말한 것을 믿는다."}, {"k": "q", "q": "____ surprised me most was his calm attitude.", "o": ["That", "What", "Whether"], "a": 1, "ok": "맞아요! surprised의 주어가 빠짐 → What", "no": "뒤 절에 주어가 없어요(불완전) → What"}, {"k": "m", "t": "풀이 전략: 접속사 뒤 절에서 **동사**를 찾고 → 그 동사의 **주어·목적어**가 다 있는지 확인! 전치사의 목적어가 빠진 것도 불완전 → what she is interested in"}, {"k": "m", "t": "**whether / if** '~인지 아닌지'(불확실) — 뒤는 완전한 절 → I wonder [whether] he will come."}, {"k": "q", "q": "Nobody knows ____ the plan will work.", "o": ["what", "whether", "which"], "a": 1, "ok": "정확해요! 완전한 절 + '~인지' → whether", "no": "the plan will work는 완전한 절 → whether"}, {"k": "m", "t": "⚠️ **if**는 **주어 자리, 전치사 뒤, or not 바로 앞**에 못 써요 → Whether he comes or not doesn't matter. ✓ / If he comes or not doesn't matter. ✗"}, {"k": "m", "t": "의문사 who, what, which + 불완전한 절 / 의문부사 when, where, why, how + 완전한 절 → I don't know [why] she left."}, {"k": "m", "t": "🎉 Chapter 9 접속사 끝! **뒤에 동사 → 접속사 / 둘 다 되는 단어는 뒤 모양 확인 / 완전 → that·whether, 불완전 → what** 👍"}], "notes": {"table": [["접속사", "뒤의 절", "예"], ["that", "완전 (~라는 것)", "I know that he is honest."], ["whether / if", "완전 (~인지 아닌지)", "I wonder whether it will rain."], ["what", "불완전 (~하는 것)", "What he said is true."], ["who / which (의문사)", "불완전", "I don't know who broke it."], ["when / where / why / how", "완전", "Tell me how you solved it."]], "tips": ["동격 that: the fact / news / idea + that + 완전한 절", "가주어 It ~ that + 완전한 절", "if ✗: 주어 자리, 전치사 뒤, 바로 뒤 or not", "what = the thing(s) which"]}, "sets": {"workbook": [{"k": "pk", "q": "[What*/That] he said at the meeting surprised everyone.", "e": "said의 목적어가 빠짐 → What"}, {"k": "pk", "q": "I think [that*/what] she is the best player on the team.", "e": "완전한 절 → that"}, {"k": "pk", "q": "Please tell me [what*/that] you want for your birthday.", "e": "want의 목적어가 빠짐 → what"}, {"k": "pk", "q": "I'm not sure [whether*/what] he will accept the offer.", "e": "완전한 절 + 불확실 → whether"}, {"k": "bl", "q": "중요한 것은 네가 최선을 다했다는 것이다. → (What) matters is that you did your best.", "e": "matters의 주어가 빠짐 → What"}, {"k": "bl", "q": "그가 거짓말을 했다는 것은 분명하다. → It is clear (that) he lied.", "e": "가주어 It ~ that + 완전한 절"}, {"k": "bl", "q": "나는 그녀가 파티에 올지 모르겠다. → I don't know (whether|if) she will come to the party.", "e": "완전한 절 + '~인지'"}, {"k": "bl", "q": "이것이 내가 찾고 있던 것이다. → This is (what) I was looking for.", "e": "for의 목적어가 빠짐 → what"}, {"k": "ox", "q": "That he was innocent became clear later.", "a": true, "e": "✔ 완전한 절 + 주어 자리 → That"}, {"k": "fx", "q": "The problem is what we don't have enough time.", "w": "what", "a": ["that"], "e": "완전한 절 → that"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ you need most right now is a good rest.", "o": ["That", "What", "Whether", "If", "Which"], "a": 1, "e": "need의 목적어가 빠짐 → What"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I believe that honesty is important.", "What she cooked was delicious.", "I wonder whether it will snow tomorrow.", "He asked me if I could help him.", "The fact what he lied made me angry."], "a": 4, "e": "⑤ 동격 + 완전한 절 → that"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ he will come or not doesn't matter.\n____ he wants is a new bike.", "o": ["Whether – What", "That – What", "What – That", "If – What", "Whether – That"], "a": 0, "e": "주어 자리 + or not → Whether / wants의 목적어가 빠짐 → What"}, {"k": "pk", "q": "She showed me [what*/that] she had bought at the mall.", "e": "bought의 목적어가 빠짐 → what"}, {"k": "pk", "q": "The news [that*/what] the team won the championship spread quickly.", "e": "동격 + 완전한 절 → that"}, {"k": "bl", "q": "그가 진실을 말하고 있는지 아닌지는 중요하지 않다. → (Whether) he is telling the truth or not doesn't matter.", "e": "주어 자리 → Whether (if ✗)"}, {"k": "bl", "q": "나는 그녀가 무엇에 관심이 있는지 안다. → I know (what) she is interested in.", "e": "in의 목적어가 빠짐 → what"}, {"k": "fx", "q": "Nobody knows that happened to the missing ship.", "w": "that", "a": ["what"], "e": "happened의 주어가 빠짐 → what"}, {"k": "ox", "q": "It is surprising what she finished the marathon at the age of 80.", "a": false, "e": "완전한 절 → that"}, {"k": "ox", "q": "Whether we go or not depends on the weather.", "a": true, "e": "✔ 주어 자리 → Whether"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nScientists have found (A)[that / what] people who sleep less tend to eat more. (B)[That / What] causes this is a change in hormones. However, it is still unclear (C)[whether / what] the same is true for children.", "o": ["that – That – whether", "what – What – what", "that – What – whether", "what – That – whether", "that – What – what"], "a": 2, "e": "(A) 완전한 절 → that (B) causes의 주어가 빠짐 → What (C) 완전한 절 + 불확실 → whether"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ What I want is a quiet place to study.\nⓑ I think what he is right.\nⓒ The question is whether we can finish on time.\nⓓ That she won the prize was amazing.\nⓔ I'll do that you ask me to do.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ that ⓔ what"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nMany people believe ①‘that’ success comes from talent. However, research shows ②‘that’ hard work matters more. ③‘What’ successful people have in common is persistence. They don't worry about ④‘whether’ they will fail. They focus on ⑤‘that’ they can learn from each experience.", "o": ["", "", "", "", ""], "a": 4, "e": "⑤ learn의 목적어가 빠짐 + 전치사 뒤 → what / ④ 전치사 뒤 whether ✔"}, {"k": "fx", "q": "I can't remember that I did with my car keys.", "w": "that", "a": ["what"], "e": "did의 목적어가 빠짐 → what"}, {"k": "fx", "q": "What the earth is round is a well-known fact.", "w": "What", "a": ["That"], "e": "완전한 절 → That"}, {"k": "wr", "q": "그가 말한 것은 사실이 아니었다. (what, say, true)", "a": ["What he said was not true.", "What he said wasn't true."], "e": "said의 목적어가 빠짐 → What"}, {"k": "wr", "q": "나는 그가 시험에 합격할지 궁금하다. (wonder, whether, pass the exam)", "a": ["I wonder whether he will pass the exam.", "I wonder if he will pass the exam.", "I wonder whether or not he will pass the exam."], "e": "완전한 절 + '~인지'"}, {"k": "or", "q": "문제는 우리에게 돈이 충분하지 않다는 것이다.", "a": "The problem is that we don't have enough money.", "e": "보어 자리 + 완전한 절 → that"}, {"k": "pk", "q": "The teacher asked us [whether*/what] we had finished the assignment.", "e": "완전한 절 + '~인지' → whether"}, {"k": "bl", "q": "(What) I need now is a cup of hot coffee. (내가 지금 필요한 것)", "e": "need의 목적어가 빠짐 → What"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "비가 많이 왔지만, 우리는 축구를 했다. (although, rain heavily, play soccer)", "a": ["Although it rained heavily, we played soccer.", "We played soccer although it rained heavily."], "e": "절 → although"}, {"k": "wr", "q": "폭우에도 불구하고, 우리는 축구를 했다. (despite, the heavy rain, play soccer)", "a": ["Despite the heavy rain, we played soccer.", "We played soccer despite the heavy rain.", "In spite of the heavy rain, we played soccer.", "We played soccer in spite of the heavy rain."], "e": "명사구 → despite"}, {"k": "wr", "q": "나는 방학 동안 책을 다섯 권 읽었다. (during, the vacation, read five books)", "a": ["I read five books during the vacation.", "During the vacation, I read five books.", "During the vacation I read five books."], "e": "명사 → during"}, {"k": "wr", "q": "그녀는 결정을 내리기 전에 신중하게 생각한다. — before + 동명사로 (think carefully, make a decision)", "a": ["She thinks carefully before making a decision.", "Before making a decision, she thinks carefully."], "e": "전치사 before + 동명사"}, {"k": "wr", "q": "네가 지금 필요한 것은 휴식이다. (what, need, now, a rest)", "a": ["What you need now is a rest.", "What you need now is rest."], "e": "불완전한 절 → What"}, {"k": "bl", "q": "(Because) of the strike, the trains stopped running. (파업 때문에)", "e": "because of + 명사"}, {"k": "bl", "q": "I'm not sure (whether|if) the store is open today. (열었는지)", "e": "완전한 절 + '~인지'"}, {"k": "fx", "q": "During I was waiting for the bus, I read the news.", "w": "During", "a": ["While"], "e": "뒤에 절 → While"}, {"k": "fx", "q": "She couldn't believe that she saw in the mirror.", "w": "that", "a": ["what"], "e": "saw의 목적어가 빠짐 → what"}, {"k": "or", "q": "그가 그 대회에서 우승했다는 것은 놀랍다. (It ~ that)", "a": "It is surprising that he won the contest.", "e": "가주어 It ~ that + 완전한 절"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ the bad weather, the flight left on time.", "o": ["Although", "Despite", "Because", "While", "Since"], "a": 1, "e": "명사구 + 반대 내용 → Despite"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ she said hurt my feelings.", "o": ["That", "What", "Whether", "If", "Which"], "a": 1, "e": "said의 목적어가 빠짐 → What"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI fell asleep ____ the lecture.\nI fell asleep ____ the teacher was talking.", "o": ["while – during", "during – while", "during – during", "while – while", "for – during"], "a": 1, "e": "명사 → during / 절 → while"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["Because of the noise, I couldn't sleep.", "I'll wait until you finish.", "What matters is your effort.", "I wonder if she likes me.", "Despite he was hungry, he didn't eat."], "a": 4, "e": "⑤ 뒤에 절 → Although"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n(A)[Although / Despite] Jimin is only fifteen, she has already written two novels. (B)[What / That] makes her stories special is her imagination. Many readers wonder (C)[whether / what] she will become a famous writer.", "o": ["Although – What – whether", "Despite – What – whether", "Although – That – what", "Despite – That – whether", "Although – What – what"], "a": 0, "e": "(A) 절 → Although (B) makes의 주어가 빠짐 → What (C) 완전한 절 → whether"}, {"k": "ch", "q": "따옴표 친 after의 쓰임이 나머지와 다른 것은?", "o": ["‘After’ dinner, we went for a walk.", "She felt better ‘after’ a good sleep.", "‘After’ the rain, the sky cleared.", "He left ‘after’ the meeting ended.", "We rested ‘after’ the long hike."], "a": 3, "e": "④ 뒤에 절(the meeting ended) → 접속사 / 나머지 전치사"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["I think what he is honest.", "Although the cold, we went out.", "Since moving here, I have been happy.", "If he comes or not is not important.", "She left during I was asleep."], "a": 2, "e": "③ 옳음 / ① that ② Despite ④ Whether ⑤ while"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\n①‘Because’ the museum was closed on Monday, we visited it on Tuesday. ②‘During’ our visit, we learned ③‘that’ the building was once a palace. ④‘What’ impressed me most was the garden. ⑤‘Despite’ it was crowded, we enjoyed it.", "o": ["", "", "", "", ""], "a": 4, "e": "⑤ 뒤에 절 → Although"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Despite being sick, she went to work.\nⓑ What he told me was a secret.\nⓒ I'll stay here until he will come back.\nⓓ Because of it was late, we left.\nⓔ The truth is that I forgot.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ comes ⓓ Because"}, {"k": "ch", "q": "빈칸에 공통으로 알맞은 것은?\n____ a teacher, I care about my students.\n____ it was getting dark, we hurried home.", "o": ["Since", "As", "While", "Because", "Although"], "a": 1, "e": "전치사 '~로서' / 접속사 '~ 때문에' → As"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그가 그 일을 할 수 있을지 없을지는 중요하지 않다.", "o": ["That he can do the job or not is not important.", "What he can do the job or not is not important.", "Whether he can do the job or not is not important.", "If he can do the job or not is not important.", "Which he can do the job or not is not important."], "a": 2, "e": "주어 자리 + or not → Whether (if ✗)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Although it was late, he kept working.", true], ["Because of the accident, the road was closed.", true], ["During he was in Japan, he learned Japanese.", false], ["What I need is your help.", true], ["I believe that he will succeed.", true], ["Wash your hands before eat.", false], ["Despite of the rain, we went out.", false], ["I wonder whether she got my message.", true], ["Since it was raining, we took a taxi.", true], ["That you need is more practice.", false], ["As a leader, he made a wise choice.", true], ["We waited until the store opened.", true]], "e": "ⓒ While ⓕ eating ⓖ Despite ⓙ What"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["In spite of the pain, he smiled.", true], ["The fact that she won surprised us.", true], ["I'll call you after I will arrive.", false], ["While walking home, I met Jun.", true], ["Whether you like it or not, you must go.", true], ["Although his hard work, he failed.", false], ["What he said made me happy.", true], ["I have known him since we were kids.", true], ["She asked me that I liked the gift.", false], ["Because the heavy snow, school was closed.", false], ["After finishing lunch, we played soccer.", true], ["It is true that he moved to Canada.", true]], "e": "ⓒ arrive ⓕ Despite ⓘ if(whether) ⓙ Because of"}, {"k": "wr", "q": "그는 아침을 먹은 후에 학교에 갔다. — after + 동명사로 (eat breakfast, go to school)", "a": ["After eating breakfast, he went to school.", "He went to school after eating breakfast.", "After having breakfast, he went to school.", "He went to school after having breakfast."], "e": "전치사 after + 동명사"}, {"k": "wr", "q": "나는 그녀가 내 이름을 기억할지 궁금하다. (wonder, if, remember my name)", "a": ["I wonder if she will remember my name.", "I wonder whether she will remember my name.", "I wonder if she remembers my name.", "I wonder whether she remembers my name."], "e": "완전한 절 + '~인지'"}]}}, {"book": "hof", "chapter": {"id": "10", "name": "관계사", "title": "해커스 어법 제대로 · Chapter 10 관계사"}, "units": [{"tag": "hof-10-P1", "name": "관계대명사 선택", "talk": [{"k": "m", "t": "Chapter 10은 **관계사**! 첫 포인트: 어떤 관계대명사를 쓸까? 🔗"}, {"k": "m", "t": "① **선행사**가 사람이면 who/whom, 사물·동물이면 which (that은 둘 다) ② 뒤 절에서 **빠진 격** 확인"}, {"k": "m", "t": "**주격**: 뒤에 바로 **동사** → the girl who lives next door / **목적격**: 뒤에 **주어 + 동사**(목적어 빠짐) → the man whom I met / **소유격**: 뒤에 **관사 없는 명사 + 완전한 절** → a boy whose dream is to fly"}, {"k": "q", "q": "I have a friend ____ father is a pilot.", "o": ["who", "whose", "which"], "a": 1, "ok": "맞아요! 명사 father + 완전한 절 → whose", "no": "뒤에 father is a pilot은 빠진 게 없어요 → 소유격 whose"}, {"k": "ex", "en": "The novel which I borrowed from the library was really exciting.", "ko": "내가 도서관에서 빌린 소설은 정말 흥미진진했다. (borrowed의 목적어가 빠짐)"}, {"k": "m", "t": "풀이 전략: 관계사 뒤를 보고 **무엇이 빠졌는지** 찾기! 주어가 빠지면 주격, 목적어가 빠지면 목적격, 빠진 게 없고 명사가 바로 붙어 있으면 소유격"}, {"k": "q", "q": "The singer ____ we saw at the concert is very famous.", "o": ["which", "whom", "whose"], "a": 1, "ok": "정확해요! 사람 + saw의 목적어가 빠짐 → whom", "no": "선행사가 사람(singer) + 목적어가 빠짐 → whom"}, {"k": "m", "t": "⚠️ 삽입절 함정: the man who (I think) is honest → I think를 빼면 who is → **주격** [who] (whom ✗)"}, {"k": "m", "t": "⚠️ 전치사 바로 뒤에는 **whom / which**만 (who ✗, that ✗) → the person to [whom] I spoke"}, {"k": "m", "t": "정리! **선행사(사람/사물) + 빠진 격(주격/목적격/소유격) / 삽입절은 빼고 보기 / 전치사 뒤 whom·which** 👍"}], "notes": {"table": [["선행사", "주격 (+ 동사)", "목적격 (+ 주어 + 동사)", "소유격 (+ 명사 + 완전한 절)"], ["사람", "who / that", "whom / who / that", "whose"], ["사물·동물", "which / that", "which / that", "whose / of which"], ["전치사 뒤", "—", "whom / which (that ✗)", "—"]], "tips": ["who / whom 구별: 뒤에 동사가 바로 오면 who", "I think, they say, people believe 같은 삽입절은 괄호로 묶고 판단", "whose 뒤 명사에는 a / the ✗ (whose the car ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "The woman [who*/which] lives upstairs is a famous pianist.", "e": "사람 + 주격 → who"}, {"k": "pk", "q": "This is the laptop [who/which*] my uncle gave me.", "e": "사물 + 목적격 → which"}, {"k": "pk", "q": "I know a girl [who/whose*] brother plays for the national team.", "e": "명사 brother + 완전한 절 → whose"}, {"k": "pk", "q": "The man [whom*/whose] you met yesterday is my coach.", "e": "met의 목적어가 빠짐 → whom"}, {"k": "bl", "q": "나는 지붕이 빨간 집에 산다. → I live in a house (whose) roof is red.", "e": "명사 roof + 완전한 절 → whose"}, {"k": "bl", "q": "그녀는 모두가 존경하는 선생님이다. → She is a teacher (whom|who|that) everyone respects.", "e": "사람 + 목적격"}, {"k": "bl", "q": "이것은 많은 상을 받은 영화이다. → This is the movie (which|that) won many awards.", "e": "사물 + 주격"}, {"k": "bl", "q": "그는 내가 이야기를 나눈 사람이다. → He is the person to (whom) I talked.", "e": "전치사 뒤 사람 → whom"}, {"k": "ox", "q": "The students which passed the test will get a certificate.", "a": false, "e": "사람 → who(that)"}, {"k": "fx", "q": "I met a man who car was stolen last night.", "w": "who", "a": ["whose"], "e": "명사 car + 완전한 절 → whose"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The scientist ____ research changed modern medicine won the Nobel Prize.", "o": ["who", "whom", "whose", "which", "that"], "a": 2, "e": "명사 research + 완전한 절 → whose"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The dog which is barking outside is mine.", "The man which lives next door is very kind.", "The girl whom I invited didn't come.", "A writer whose books sell well can be rich.", "The book that I bought was boring."], "a": 1, "e": "② 사람 → who(that)"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe boy ____ won the race is my cousin.\nThe boy ____ bike was stolen is my cousin.", "o": ["who – whose", "whose – who", "who – who", "whom – whose", "which – whose"], "a": 0, "e": "주격 who / 명사 bike + 완전한 절 → whose"}, {"k": "pk", "q": "Students [whose*/who] grades are below 60 must take the test again.", "e": "명사 grades + 완전한 절 → whose"}, {"k": "pk", "q": "The man [who*/whom] I believe is the best doctor in town will treat you.", "e": "I believe를 빼면 who is → 주격"}, {"k": "bl", "q": "그것은 내가 오랫동안 원해 왔던 자전거이다. → It is the bike (which|that) I have wanted for a long time.", "e": "사물 + 목적격"}, {"k": "bl", "q": "엄마가 작가인 그 소녀는 글을 잘 쓴다. → The girl (whose) mother is a writer writes well.", "e": "소유격"}, {"k": "fx", "q": "The company for that he works is in Seoul.", "w": "that", "a": ["which"], "e": "전치사 뒤 that ✗ → which"}, {"k": "ox", "q": "The house whose windows are broken has been empty for years.", "a": true, "e": "✔ 명사 windows + 완전한 절 → whose"}, {"k": "ox", "q": "Do you know the woman whom is standing by the door?", "a": false, "e": "뒤에 동사 is → 주격 who"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nMy aunt, (A)[who / which] lives in Paris, is a designer. The clothes (B)[whom / which] she designs are sold all over the world. She has a cat (C)[who / whose] name is Coco.", "o": ["who – which – whose", "which – which – whose", "who – whom – who", "who – which – who", "which – whom – whose"], "a": 0, "e": "(A) 사람 + 주격 → who (B) 사물 + 목적격 → which (C) 명사 name + 완전한 절 → whose"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The man who called you left a message.\nⓑ I have a friend whose hobby is surfing.\nⓒ The bag who I bought was expensive.\nⓓ The teacher whom I respect most is Ms. Kim.\nⓔ This is the girl about who I told you.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ which(that) ⓔ 전치사 뒤 → whom"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nMarie Curie was a scientist ①‘who’ made great discoveries. One element ②‘which’ she discovered was named after her home country. Her husband, ③‘whom’ she worked with, was also a scientist. Their daughter, ④‘who’ also became a scientist, won a Nobel Prize too. Curie is a person ⑤‘who’ name almost everyone knows.", "o": ["", "", "", "", ""], "a": 4, "e": "⑤ 명사 name + 완전한 절 → whose"}, {"k": "fx", "q": "The patients which were treated at this hospital recovered quickly.", "w": "which", "a": ["who", "that"], "e": "사람 → who"}, {"k": "fx", "q": "She is the author who novel became a bestseller.", "w": "who", "a": ["whose"], "e": "명사 novel + 완전한 절 → whose"}, {"k": "wr", "q": "나는 아버지가 경찰관인 친구가 있다. (a friend, whose, father, a police officer)", "a": ["I have a friend whose father is a police officer.", "I have a friend whose father is a policeman."], "e": "소유격 whose"}, {"k": "wr", "q": "네가 어제 만난 그 남자는 나의 삼촌이다. (the man, whom, meet, yesterday, my uncle)", "a": ["The man whom you met yesterday is my uncle.", "The man who you met yesterday is my uncle.", "The man that you met yesterday is my uncle.", "The man you met yesterday is my uncle."], "e": "목적격 whom"}, {"k": "or", "q": "나는 꼬리가 아주 긴 고양이를 키운다.", "a": "I have a cat whose tail is very long.", "e": "소유격 whose"}, {"k": "pk", "q": "The candidate [who*/whom] people think will win the election is very young.", "e": "people think를 빼면 who will win → 주격"}, {"k": "bl", "q": "The person with (whom) I shared a room was from Brazil. (나와 방을 같이 쓴 사람)", "e": "전치사 뒤 사람 → whom"}]}}, {"tag": "hof-10-P2", "name": "대명사 vs. 관계대명사", "talk": [{"k": "m", "t": "두 절을 이으려면 **접속사나 관계사**가 꼭 필요해요! 대명사(he, it, them)는 절을 잇지 못해요 🔌"}, {"k": "ex", "en": "I have a cousin, and she lives in Canada. = I have a cousin, who lives in Canada.", "ko": "나는 사촌이 있는데, 그녀는 캐나다에 산다."}, {"k": "m", "t": "풀이 전략: **동사의 개수**를 세기! 동사가 2개인데 접속사가 없으면 → 대명사 자리를 **관계대명사**로"}, {"k": "q", "q": "I bought a new phone, ____ broke the next day.", "o": ["it", "which", "them"], "a": 1, "ok": "맞아요! 접속사가 없으니 관계대명사 which", "no": "동사 bought, broke 2개 + 접속사 없음 → which"}, {"k": "m", "t": "반대로 **and, but** 같은 접속사가 이미 있으면 → **대명사**! (접속사 + 관계대명사 함께 ✗)"}, {"k": "q", "q": "She has three sons, and all of ____ are doctors.", "o": ["them", "whom", "which"], "a": 0, "ok": "정확해요! and가 있으니 대명사 them", "no": "접속사 and가 이미 두 절을 이어요 → them"}, {"k": "m", "t": "**수량 표현 + of + 관계대명사**: some / most / all / both / none / one of **whom**(사람) / **which**(사물) → I have two brothers, both of [whom] are tall."}, {"k": "m", "t": "⚠️ , which는 **앞 문장 전체**도 받을 수 있어요 → He passed the exam, [which] surprised everyone. (, it ✗)"}, {"k": "m", "t": "정리! **동사 2개 + 접속사 없음 → 관계대명사 / 접속사 있음 → 대명사 / 수량 + of whom·which** 👍"}], "notes": {"table": [["구조", "형태", "예"], ["접속사 없음", ", 관계대명사", "I have a sister, who is a nurse."], ["접속사 있음", ", and + 대명사", "I have a sister, and she is a nurse."], ["수량 표현 (사람)", "most / all / both of whom", "30 students, most of whom are girls"], ["수량 표현 (사물)", "some / none of which", "five books, none of which I've read"], ["앞 문장 전체", ", which", "He lied, which made me angry."]], "tips": ["콤마만으로는 두 절을 이을 수 없음 (, it ✗ / , them ✗)", "and + 관계대명사 ✗ (and most of which ✗)", "계속적 용법에서는 that ✗"]}, "sets": {"workbook": [{"k": "pk", "q": "I have two cats, [which*/they] sleep all day.", "e": "접속사 없음 → which"}, {"k": "pk", "q": "She wrote a letter, and [it*/which] made her mom cry.", "e": "and가 있음 → it"}, {"k": "pk", "q": "There are 30 students in the class, most of [whom*/them] are girls.", "e": "접속사 없음 + 사람 → whom"}, {"k": "pk", "q": "He has many books, and some of [them*/which] are very old.", "e": "and가 있음 → them"}, {"k": "bl", "q": "나는 친구가 많은데, 그중 몇 명은 외국인이다. → I have many friends, some of (whom) are foreigners.", "e": "접속사 없음 + 사람 → whom"}, {"k": "bl", "q": "그는 시험에 떨어졌는데, 그것이 그의 부모님을 실망시켰다. → He failed the test, (which) disappointed his parents.", "e": "앞 문장 전체 → which"}, {"k": "bl", "q": "그녀에게는 딸이 둘 있는데, 둘 다 교사이다. → She has two daughters, both of (whom) are teachers.", "e": "사람 → whom"}, {"k": "bl", "q": "나는 사과를 몇 개 샀지만, 그중 하나는 썩어 있었다. → I bought some apples, but one of (them) was rotten.", "e": "but이 있음 → them"}, {"k": "ox", "q": "We visited the museum, it was full of tourists.", "a": false, "e": "접속사 없음 → which"}, {"k": "fx", "q": "The team has 20 players, most of them are from Spain.", "w": "them", "a": ["whom"], "e": "접속사 없음 + 사람 → whom"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The company hired five new workers, all of ____ have experience.", "o": ["them", "they", "whom", "which", "who"], "a": 2, "e": "접속사 없음 + 사람 → whom"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I lost my umbrella, which I had just bought.", "She has two dogs, and both of them are white.", "He told a joke, which made everyone laugh.", "There were many guests, most of them came from abroad.", "I have three brothers, one of whom is a pilot."], "a": 3, "e": "④ 접속사 없음 → most of whom"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI bought ten eggs, two of ____ were broken.\nI bought ten eggs, but two of ____ were broken.", "o": ["which – them", "them – which", "which – which", "them – them", "whom – them"], "a": 0, "e": "접속사 없음 → which / but이 있음 → them"}, {"k": "pk", "q": "She gave me some advice, [which*/it] was very helpful.", "e": "접속사 없음 → which"}, {"k": "pk", "q": "We have two cars, but neither of [them*/which] works well.", "e": "but이 있음 → them"}, {"k": "bl", "q": "그 박물관은 매주 월요일에 문을 닫는데, 이는 불편하다. → The museum is closed every Monday, (which) is inconvenient.", "e": "앞 문장 전체 → which"}, {"k": "bl", "q": "나에게는 이모가 두 분 계시는데, 그중 한 분은 의사이다. → I have two aunts, one of (whom) is a doctor.", "e": "사람 → whom"}, {"k": "fx", "q": "I tried on three jackets, none of them fit me.", "w": "them", "a": ["which"], "e": "접속사 없음 + 사물 → which"}, {"k": "ox", "q": "My brother got a perfect score, which made my parents proud.", "a": true, "e": "✔ 앞 문장 전체 → which"}, {"k": "ox", "q": "The museum has many paintings, and most of which are by Picasso.", "a": false, "e": "and가 있음 → them"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nOur school has 500 students, most of (A)[them / whom] walk to school. Last year, the school built a new library, (B)[it / which] has over 10,000 books. Students love the library, and many of (C)[them / whom] visit it every day.", "o": ["them – it – them", "whom – which – them", "whom – which – whom", "them – which – whom", "whom – it – them"], "a": 1, "e": "(A) 접속사 없음 → whom (B) 접속사 없음 → which (C) and가 있음 → them"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have two sisters, both of whom are married.\nⓑ He bought a car, it was very expensive.\nⓒ She sang a song, which moved the audience.\nⓓ There are many lakes here, and some of which are deep.\nⓔ I read three books, none of which were interesting.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ which ⓓ them"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nJake has three hobbies, all of ①‘which’ he enjoys on weekends. He plays soccer with his friends, most of ②‘whom’ live nearby. He also paints pictures, and some of ③‘them’ have won prizes. Last month, he started learning the guitar, ④‘which’ has been harder than he expected. He practices every day, ⑤‘it’ shows how serious he is.", "o": ["", "", "", "", ""], "a": 4, "e": "⑤ 접속사 없음 + 앞 문장 전체 → which"}, {"k": "fx", "q": "The club has 40 members, half of them are high school students.", "w": "them", "a": ["whom"], "e": "접속사 없음 + 사람 → whom"}, {"k": "fx", "q": "We stayed at a hotel near the beach, it had a great view.", "w": "it", "a": ["which"], "e": "접속사 없음 → which"}, {"k": "wr", "q": "나는 사촌이 다섯 명 있는데, 그중 두 명은 미국에 산다. (five cousins, two of whom, live in America)", "a": ["I have five cousins, two of whom live in America.", "I have five cousins, two of whom live in the US.", "I have five cousins, two of whom live in the United States."], "e": "수량 + of whom"}, {"k": "wr", "q": "그는 늦게 도착했는데, 그것이 선생님을 화나게 했다. (arrive late, which, make the teacher angry)", "a": ["He arrived late, which made the teacher angry."], "e": "앞 문장 전체 → which"}, {"k": "or", "q": "그녀는 책을 많이 가지고 있는데, 그중 대부분은 소설이다.", "a": "She has many books, most of which are novels.", "e": "수량 + of which"}, {"k": "pk", "q": "The store sells many kinds of bread, and all of [them*/which] are baked fresh every morning.", "e": "and가 있음 → them"}, {"k": "bl", "q": "There were ten people in the room, none of (whom) spoke English. (그중 아무도)", "e": "접속사 없음 + 사람 → whom"}]}}, {"tag": "hof-10-P3", "name": "관계대명사 vs. 관계부사/「전치사 + which」", "talk": [{"k": "m", "t": "which냐 where냐? 기준은 뒤 절이 **완전한지 불완전한지**! 🏠"}, {"k": "m", "t": "**관계대명사**(which, that) + **불완전한 절**(주어·목적어 빠짐) / **관계부사**(where, when, why, how) = **전치사 + which** + **완전한 절**"}, {"k": "ex", "en": "This is the house which my grandfather built. / This is the house where my grandfather was born.", "ko": "이것은 할아버지가 지으신 집이다. (built의 목적어가 빠짐) / 이것은 할아버지가 태어나신 집이다. (완전한 절)"}, {"k": "q", "q": "I still remember the day ____ we first met.", "o": ["which", "when", "what"], "a": 1, "ok": "맞아요! 완전한 절 + 때 → when", "no": "we first met은 빠진 게 없어요 → 관계부사 when"}, {"k": "m", "t": "⚠️ 선행사가 장소라고 무조건 where가 아니에요! visit, build, like 같은 **타동사의 목적어**가 빠지면 which → the city [which] I visited last year"}, {"k": "q", "q": "Seoul is the city ____ I want to visit again.", "o": ["where", "which", "in which"], "a": 1, "ok": "정확해요! visit의 목적어가 빠짐 → which", "no": "visit은 타동사, 목적어가 빠졌어요 → which"}, {"k": "m", "t": "**전치사 + which** = 관계부사 → the room in which(= where) I sleep / the day on which(= when) he left / the reason for which(= why) she cried"}, {"k": "m", "t": "⚠️ 전치사가 뒤에 남아 있으면 which → the hotel which we stayed at (where ✗) / **the way how** ✗ → the way 또는 how 하나만!"}, {"k": "m", "t": "정리! **불완전 → which·that / 완전 → where·when·why·how = 전치사 + which / the way how ✗** 👍"}], "notes": {"table": [["선행사", "관계부사 (+ 완전한 절)", "= 전치사 + which", "관계대명사 (+ 불완전한 절)"], ["장소 the place", "where", "in / at / on which", "the place which I visited"], ["때 the day", "when", "on / in / at which", "the day which I'll never forget"], ["이유 the reason", "why", "for which", "the reason which he gave"], ["방법 the way", "how (the way와 함께 ✗)", "in which", "—"]], "tips": ["뒤 절에서 동사가 타동사인데 목적어가 없으면 which", "stay at, live in처럼 전치사가 뒤에 남아 있으면 which (where ✗)", "the way how ✗ → the way / how / the way in which"]}, "sets": {"workbook": [{"k": "pk", "q": "This is the park [where*/which] I often walk my dog.", "e": "I often walk my dog은 완전 → where"}, {"k": "pk", "q": "This is the park [where/which*] the city built last year.", "e": "built의 목적어가 빠짐 → which"}, {"k": "pk", "q": "Do you know the reason [why*/which] she quit her job?", "e": "완전한 절 + 이유 → why"}, {"k": "pk", "q": "Summer is the season [when*/which] many people go to the beach.", "e": "완전한 절 + 때 → when"}, {"k": "bl", "q": "이곳은 내가 태어난 병원이다. → This is the hospital (where) I was born.", "e": "완전한 절 + 장소"}, {"k": "bl", "q": "나는 우리가 처음 만난 날을 잊을 수 없다. → I can't forget the day (when) we first met.", "e": "완전한 절 + 때"}, {"k": "bl", "q": "그것이 그가 성공한 방법이다. → That is (how) he succeeded.", "e": "방법 → how"}, {"k": "bl", "q": "그녀가 사는 집은 매우 오래되었다. → The house in (which) she lives is very old.", "e": "전치사 + which"}, {"k": "ox", "q": "I'll show you the way how I solved the problem.", "a": false, "e": "the way how ✗ → the way 또는 how"}, {"k": "fx", "q": "The village which I grew up is very small.", "w": "which", "a": ["where", "in which"], "e": "I grew up은 완전 → where"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The hotel ____ we stayed at was near the beach.", "o": ["where", "which", "when", "why", "how"], "a": 1, "e": "at의 목적어가 빠짐 → which"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["This is the town where I grew up.", "I remember the year when he was born.", "This is the museum which we visited last week.", "Tell me the reason why you were late.", "That's the office which my mom works."], "a": 4, "e": "⑤ my mom works는 완전 → where(in which)"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThis is the café ____ I met my best friend.\nThis is the café ____ my best friend runs.", "o": ["where – which", "which – where", "where – where", "which – which", "when – which"], "a": 0, "e": "완전한 절 → where / runs의 목적어가 빠짐 → which"}, {"k": "pk", "q": "Monday is the day [on which*/which] the store is closed.", "e": "완전한 절 → 전치사 + which"}, {"k": "pk", "q": "I visited the village [which*/where] my father had described to me.", "e": "described의 목적어가 빠짐 → which"}, {"k": "bl", "q": "그것이 내가 너에게 전화한 이유이다. → That's the reason (why) I called you.", "e": "완전한 절 + 이유"}, {"k": "bl", "q": "이곳은 그 영화가 촬영된 장소이다. → This is the place (where) the movie was filmed.", "e": "완전한 절 + 장소"}, {"k": "fx", "q": "Spring is the season which flowers bloom everywhere.", "w": "which", "a": ["when", "in which"], "e": "완전한 절 + 때 → when"}, {"k": "ox", "q": "This is the room in which I studied for the exam.", "a": true, "e": "✔ 전치사 + which = where"}, {"k": "ox", "q": "I'll never forget the moment which I won the race.", "a": false, "e": "완전한 절 → when"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nJeonju is a city (A)[which / where] many tourists love. It is the place (B)[which / where] bibimbap became famous. Many people visit the Hanok Village, (C)[which / where] they can experience traditional Korean life.", "o": ["which – which – which", "which – where – where", "where – where – which", "which – where – which", "where – which – where"], "a": 1, "e": "(A) love의 목적어가 빠짐 → which (B)(C) 완전한 절 → where"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I know a place where we can eat cheap pizza.\nⓑ This is the house where he built himself.\nⓒ The day when I left Korea was rainy.\nⓓ That's the way how she makes kimchi.\nⓔ The box in which I keep my letters is old.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ built의 목적어가 빠짐 → which ⓓ the way 또는 how"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nI recently went back to the town ①‘where’ I spent my childhood. I visited the school ②‘which’ I attended for six years. I also saw the park ③‘where’ I used to play with my friends. Then I went to the bakery ④‘where’ my grandmother loved. I still remember the days ⑤‘when’ we ate bread there together.", "o": ["", "", "", "", ""], "a": 3, "e": "④ loved의 목적어가 빠짐 → which"}, {"k": "fx", "q": "This is the island where my family visited last summer.", "w": "where", "a": ["which", "that"], "e": "visited의 목적어가 빠짐 → which"}, {"k": "fx", "q": "I don't understand the reason which she left so suddenly.", "w": "which", "a": ["why", "for which"], "e": "완전한 절 + 이유 → why"}, {"k": "wr", "q": "이곳은 내가 지난 주말에 머물렀던 호텔이다. (the hotel, where, stay, last weekend)", "a": ["This is the hotel where I stayed last weekend.", "This is the hotel at which I stayed last weekend.", "This is the hotel which I stayed at last weekend.", "This is the hotel that I stayed at last weekend."], "e": "완전한 절 → where"}, {"k": "wr", "q": "나는 그가 그 문제를 푼 방법을 모르겠다. (how, solve the problem)", "a": ["I don't know how he solved the problem.", "I don't know the way he solved the problem."], "e": "how 또는 the way (the way how ✗)"}, {"k": "or", "q": "그녀는 우리가 처음 만났던 카페를 기억한다.", "a": "She remembers the café where we first met.", "e": "완전한 절 → where"}, {"k": "pk", "q": "The town [in which*/which] I was born has changed a lot.", "e": "I was born은 완전 → in which"}, {"k": "bl", "q": "I'll never forget the summer (when) we traveled to Jeju together. (우리가 함께 여행한 여름)", "e": "완전한 절 + 때"}]}}, {"tag": "hof-10-P4", "name": "that vs. which vs. what", "talk": [{"k": "m", "t": "that, which, what 셋 다 '~한 것'처럼 보여서 헷갈려요! **선행사**와 **뒤 절**로 구별 🔍"}, {"k": "m", "t": "**what** = 선행사 포함(the thing which) → 앞에 **선행사 없음** + 뒤 **불완전** → What I want is rest."}, {"k": "m", "t": "**which / that**(관계대명사) → 앞에 **선행사 있음** + 뒤 **불완전** → the thing which(that) I want"}, {"k": "q", "q": "This is exactly the bag ____ I wanted.", "o": ["what", "which", "whose"], "a": 1, "ok": "맞아요! 선행사 the bag이 있음 → which", "no": "앞에 선행사(the bag)가 있으면 what ✗ → which"}, {"k": "m", "t": "**that**(접속사) → 뒤 **완전한 절** → I know that he is honest. (which, what ✗)"}, {"k": "q", "q": "She told me ____ she had lost her phone.", "o": ["what", "which", "that"], "a": 2, "ok": "정확해요! 완전한 절 → 접속사 that", "no": "she had lost her phone은 빠진 게 없어요 → that"}, {"k": "m", "t": "⚠️ **that**은 콤마 뒤(계속적 용법)와 **전치사 뒤**에 못 써요 → My car, [which] is old, still runs well. / the house in which I live"}, {"k": "m", "t": "풀이 전략: ① 앞에 선행사가 있나? ② 뒤 절이 완전한가? ③ 콤마·전치사 뒤인가? → 이 3단계로!"}, {"k": "m", "t": "정리! **선행사 ✗ + 불완전 → what / 선행사 ○ + 불완전 → which·that / 완전 → that / 콤마·전치사 뒤 → which** 👍"}], "notes": {"table": [["", "앞에 선행사", "뒤의 절", "예"], ["what", "없음", "불완전", "What he said is true."], ["which", "있음", "불완전", "the song which I like"], ["that (관계대명사)", "있음", "불완전", "the song that I like"], ["that (접속사)", "—", "완전", "I think that he is right."], ["콤마·전치사 뒤", "있음", "불완전", ", which ~ / in which ~ (that ✗)"]], "tips": ["the thing what ✗ (선행사 + what ✗)", "콤마 뒤 that ✗, 전치사 뒤 that ✗", "what = the thing(s) which"]}, "sets": {"workbook": [{"k": "pk", "q": "I can't believe [what*/which] he just said.", "e": "선행사 없음 + 불완전 → what"}, {"k": "pk", "q": "The movie [what/which*] we watched last night was scary.", "e": "선행사 movie → which"}, {"k": "pk", "q": "My phone, [which*/that] I bought last year, is already broken.", "e": "콤마 뒤 → which"}, {"k": "pk", "q": "I heard [that*/what] she moved to Busan.", "e": "완전한 절 → that"}, {"k": "bl", "q": "그는 내가 필요한 것을 정확히 알고 있었다. → He knew exactly (what) I needed.", "e": "선행사 없음 + 불완전"}, {"k": "bl", "q": "이것은 우리 할머니가 만드신 케이크이다. → This is the cake (which|tha ), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\nThe library, (A)[that / which] opened last year, is very popular. (B)[What / That] students like most about it is the quiet study room. Many students say (C)[that / what] they study better there.", "o": ["that – What – that", "which – That – what", "which – What – that", "that – That – what", "which – What – what"], "a": 2, "e": "(A) 콤마 뒤 → which (B) 선행사 없음 + like의 목적어가 빠짐 → What (C) 완전한 절 → that"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ This is what I've been looking for.\nⓑ I bought a book which was written by my teacher.\nⓒ The town in that I live is quiet.\nⓓ He said what he would help me.\nⓔ Paris, which I visited last year, was beautiful.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓔ 옳음 / ⓒ in which ⓓ that"}, {"k": "ch", "q": "다음 글의 ①~⑤ 중 어법상 틀린 것은?\nLast year, I read a book ①‘which’ changed my life. ②‘What’ I learned from it was the importance of kindness. The book, ③‘that’ has sold millions of copies, tells the stories of people ④‘who’ helped strangers. I realized ⑤‘that’ small acts of kindness can make a big difference.", "o": ["", "", "", "", ""], "a": 2, "e": "③ 콤마 뒤 that ✗ → which"}, {"k": "fx", "q": "The teacher explained which we had to do for the project.", "w": "which", "a": ["what"], "e": "선행사 없음 + do의 목적어가 빠짐 → what"}, {"k": "fx", "q": "Seoul, that is the capital of Korea, has a population of about 10 million.", "w": "that", "a": ["which"], "e": "콤마 뒤 that ✗ → which"}, {"k": "wr", "q": "그가 나에게 준 것은 오래된 사진이었다. (what, give me, an old photo)", "a": ["What he gave me was an old photo.", "What he gave me was an old picture.", "What he gave me was an old photograph."], "e": "선행사 없음 → What"}, {"k": "wr", "q": "나는 그가 정직하다는 것을 안다. (know, that, honest)", "a": ["I know that he is honest.", "I know he is honest."], "e": "완전한 절 → that"}, {"k": "or", "q": "이것이 내가 어제 산 책이다.", "a": "This is the book which I bought yesterday.", "e": "선행사 book → which"}, {"k": "pk", "q": "Everyone was surprised by [what*/which] happened at
