<title>문법 · 어법 제대로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 레이아웃: 한 열 학습 화면 — 목록 → DM 개념톡 → 문제 카드. 학원 파란색 + 공책 같은 옅은 회청색 바탕 */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f7fc; --line:#d9e1ee; --fg:#17202e; --muted:#5d6a7e;
  --blue:#2457d6; --blue-soft:#e3ebfb; --blue-ink:#163d9e; --me:#2457d6; --me-fg:#ffffff;
  --good:#11845b; --good-soft:#e1f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7; --star:#e3a400;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:20px;color:var(--blue);border:0;background:none;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.vlab{font-size:13px;color:var(--muted)}
.vsel{max-width:150px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 8px;font:inherit;font-size:13px}
@media (max-width:520px){.vlab{display:none}.vsel{max-width:110px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{margin:0 0 16px;color:var(--muted)}
/* 유닛 목록 */
.units{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:left;display:grid;line-height:1.35;font-size:14px}
.tab b{color:var(--blue);font-weight:700}
.tab small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on b,.tab.on small{color:#fff}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.unit .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .no{font-family:var(--f-display);color:var(--blue);font-size:18px;min-width:34px}
.unit .nm{font-weight:700;flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;font-size:13.5px;line-height:1.3;display:grid;gap:2px}
.step b{font-weight:500}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{background:var(--good-soft);border-color:transparent}
.step.done small{color:var(--good);font-weight:700}
.step.tried small{color:var(--bad)}
.step.lock{opacity:.5}
.chset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.chset .step{padding:12px 6px;font-size:15px}
.sec{font-family:var(--f-display);font-size:18px;margin:22px 0 8px;color:var(--blue-ink)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
/* DM 개념톡 */
.dm{display:grid;gap:8px;padding-block:12px;align-content:start;min-height:calc(100dvh - 150px)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:15px}
.av.ghost{visibility:hidden}
.bub{max-width:min(560px,82%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 14px;min-width:0;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.bub.ex{background:var(--blue-soft);border-color:transparent}
.bub.ex .en{font-weight:700;color:var(--blue-ink);font-size:17px}
.bub.ex .ko{font-size:14px;color:var(--muted)}
.say{border:0;background:none;padding:0 4px;color:var(--blue);font-size:15px}
.bub strong{color:var(--blue-ink)}
.row.me .bub strong{color:inherit}
.wbank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line,#dde)}.wbank>span{font-size:12.5px;color:#6b7280;margin-right:4px}.wbank .chip{font-family:inherit}
.qko{font-size:15px;color:#4b5563;margin-bottom:8px;line-height:1.5}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:1px 6px;font:inherit;font-weight:700;color:var(--blue-ink);text-align:center;width:6.5em}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.opt:hover{border-color:var(--blue)}
.qbub{border-color:var(--blue)}
.qbub .qq{font-weight:700}
.dmfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
/* 문제 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-top:12px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notes h3{margin:0 0 8px;font-size:15px;color:var(--blue-ink)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:500}
.tips{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.kind{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.qtext{font-size:18px;white-space:pre-line}
.qtext.en{font-size:19px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;margin:0 2px;font:inherit;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.right{background:var(--good);border-color:var(--good);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tok{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:3px 2px;font:inherit}
.tok.sel{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tok.used{opacity:.3}
.fxrow{display:flex;gap:8px;align-items:center}
.fxrow .inp{flex:1;min-width:0}
.ans{min-height:46px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--surface2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg)}
.choices{display:grid;gap:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;display:flex;gap:10px}
.choice .n{color:var(--blue);font-weight:700;min-width:20px}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m12{display:grid;gap:4px}
.m12 .choice .n{min-width:22px}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--f-display);font-size:30px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px}
.ox button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--fg);display:block;margin-top:2px}
.fb .key{display:block;font-weight:700;margin-top:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kh{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--fg)}
.dmfoot{align-items:center}
@media (hover:none){.kh{display:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 18px}
.score{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score.pass{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.wlist{display:grid;gap:6px;text-align:left;width:100%}
.wlist div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:14px;z-index:20}
@media (max-width:520px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}.bub{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v22-ui ===== */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#f5f7fb; --line:#dde4f0; --fg:#0f1b33; --muted:#5b6a84;
  --blue:#1f4fd8; --blue-soft:#e9effe; --blue-ink:#1740b0; --me:#1f4fd8; --me-fg:#fff; --navy:#0c2463;
  --good:#0e9f6e; --good-soft:#e3f6ee; --bad:#e0464c; --bad-soft:#fdebec;
  --f-display:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,serif;
  --r:16px; --sh:0 1px 2px rgba(15,35,80,.06),0 10px 28px -14px rgba(15,35,80,.22); --tbub:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}}
:root[data-theme="dark"]{--bg:#0b1222;--surface:#131d33;--surface2:#18243d;--line:#26334f;--fg:#e8eefb;--muted:#97a6c2;--blue:#6b95ff;--blue-soft:#1b2a4c;--blue-ink:#b9ccff;--me:#3a6cf0;--navy:#0f2a6e;--sh:none;--tbub:#1d2944}
body{letter-spacing:-.005em}
h1,h2{font-weight:700;letter-spacing:-.02em}
.btn{border-radius:12px;font-weight:600}
.btn.primary{box-shadow:0 6px 16px -8px rgba(31,79,216,.7)}
.brand{font-weight:700;font-size:19px;color:var(--fg)}
.top{border-bottom:0;padding-block:14px 10px}
/* chapter band */
.chband{background:var(--navy);color:#fff;border-radius:20px;padding:22px 24px 20px;margin-top:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.chband::after{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.05)}
.cb-book{font-size:13px;color:#b9c8f3;font-weight:600}
.chband h1{margin:0;color:#fff;font-size:clamp(22px,3.4vw,30px);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chband h1 em{font-style:normal;font-family:var(--f-en);font-weight:600;color:#b9c8f3;font-size:.8em}
.chband .lead{color:#d7e0fa;margin:0 0 8px;font-size:14.5px}
.chband .prog{color:#d7e0fa}
.chband .prog b{color:#fff}
.chband .bar{background:rgba(255,255,255,.14);border:0}
.chband .bar i{background:#fff}
.tabs{padding-block:4px 0}
.tab{border-radius:12px;padding:8px 14px;box-shadow:var(--sh)}
.tab.on{background:var(--navy);border-color:var(--navy)}
.sec{font-family:var(--f-body);font-weight:700;color:var(--fg);font-size:17px}
.unit{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.unit .no{font-family:var(--f-en);font-weight:600;font-size:19px}
.unit .nm{font-size:16.5px}
.step{border-radius:12px;padding:10px 6px;background:var(--surface2);transition:border-color .12s}
.step:hover{border-color:var(--blue)}
.step b{font-weight:600}
.step.done{background:var(--good-soft);border-color:transparent}
.chset .step{box-shadow:var(--sh);background:var(--surface)}
/* quiz header */
.top.q{position:sticky;background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 10px;margin-top:12px}
.top.q b{font-size:15px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top.q .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.top.q .btn:hover{background:rgba(255,255,255,.18)}
.prog{margin-top:16px!important}
.bar{height:8px;background:var(--blue-soft);border:0}
.card{border-radius:20px;padding:24px 26px;gap:16px;margin-top:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:not(.result)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kind{font-size:13px;letter-spacing:0}
.qtext{font-size:20px;line-height:1.75}
.qtext.en{font-size:21px}
.chip{border-radius:10px;padding:3px 12px;font-size:inherit}
.tok{border-radius:10px;padding:4px 11px;font-size:18px}
.inp{border-radius:12px;padding:12px 14px;font-size:18px;border-width:1.5px}
.inp:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px var(--blue-soft)}
.choice{border-radius:12px;padding:12px 14px;font-size:16px;background:var(--surface)}
.choice:hover{border-color:var(--blue)}
.ox button{font-family:var(--f-body);font-weight:700;border-radius:16px;padding:14px}
.fb{border-radius:12px;padding:12px 16px}
.notes{border-radius:var(--r);box-shadow:var(--sh)}
.score{font-family:var(--f-body);font-weight:800;letter-spacing:-.03em}
/* Instagram-like DM */
.dmhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px 10px 8px;margin-top:12px;box-shadow:var(--sh)}
.dmback{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dmback:hover{background:var(--surface2)}
.dmback svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#1f4fd8,#5b8cff,#0c2463,#1f4fd8)}
.avring .av{width:40px;height:40px;border:2px solid var(--surface);font-family:var(--f-body);font-weight:700;font-size:14px;background:var(--navy)}
.dmwho{display:grid;line-height:1.3;flex:1;min-width:0}
.dmwho b{font-size:15.5px}
.dmwho span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmon{font-size:12px;color:var(--good);font-weight:600;display:flex;align-items:center;gap:6px}
.dmon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.dm{gap:6px;padding:18px 4px 12px;min-height:calc(100dvh - 160px)}
.dmday{justify-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-bottom:8px}
.av{width:30px;height:30px;font-family:var(--f-body);font-weight:700;font-size:12px;background:var(--navy)}
.bub{background:var(--tbub);border:0;border-radius:22px 22px 22px 8px;padding:10px 16px;font-size:16px;line-height:1.6}
.row.me .bub{background:linear-gradient(135deg,#2a5cf0,#1f4fd8 55%,#1a3fb8);border-radius:22px 22px 8px 22px}
.bub.ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue)}
.bub.ex .en{font-family:var(--f-en);font-weight:600;font-size:18.5px}
.qbub{background:var(--surface);border:1.5px solid var(--blue)}
.opt{border-radius:12px;padding:10px 14px;background:var(--surface)}
.dmfoot{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:0}
.dmfoot .btn.primary{border-radius:99px;padding:10px 22px}
.chband .prog{margin-top:4px!important}
</style>

<script>

/ yet"}, {"k": "q", "q": "She ____ in Seoul since 2018.", "o": ["lived", "has lived", "lives"], "a": 1, "ok": "맞아요! since + 과거 시점 → 현재완료", "no": "since 2018(그때부터 지금까지) → has lived"}, {"k": "ex", "en": "He has worked here for five years. / He worked there for five years.", "ko": "그는 5년째 여기서 일하고 있다. / 그는 (과거에) 그곳에서 5년간 일했다."}, {"k": "q", "q": "I ____ my homework an hour ago.", "o": ["finished", "have finished", "has finished"], "a": 0, "ok": "정확해요! ~ ago → 단순과거", "no": "an hour ago는 명백한 과거 표현 → finished"}, {"k": "m", "t": "⚠️ 함정 ① **명백한 과거 표현 + 현재완료 ✗**: I have met him yesterday ✗ → I met him yesterday. ② 의문사 **When**으로 묻는 질문도 현재완료 ✗: When [did] you arrive?"}, {"k": "q", "q": "When ____ you start learning the violin?", "o": ["have", "did", "has"], "a": 1, "ok": "맞아요! When 의문문 → 과거", "no": "When은 특정 시점을 묻는 말 → 현재완료 ✗ → did"}, {"k": "m", "t": "⚠️ **since + 과거 시점 / since + 주어 + 과거동사** → 주절은 현재완료: It has rained a lot since we [arrived]."}, {"k": "m", "t": "정리! **명백한 과거 표현·When → 단순과거 / since·so far·until now·over the past → 현재완료** 👍"}], "notes": {"table": [["시제", "의미", "함께 쓰는 표현"], ["단순과거", "과거에 끝난 일", "yesterday, last ~, ~ ago, in 2010, then, just now, When ~?"], ["현재완료", "과거 → 지금까지 (계속·경험·완료·결과)", "since ~, for ~, so far, until now, recently, over the past ~"], ["현재완료 ✗", "명백한 과거 표현과 함께", "I have seen him yesterday. ✗"], ["since 구문", "since + 과거 시점 / 과거절", "I have known her since I was ten."]], "tips": ["for는 둘 다 가능: 지금도 계속이면 현재완료, 과거에 끝났으면 과거", "When ~? 의문문에는 현재완료를 쓰지 않음", "역사적 사실(in 1492 등)은 항상 단순과거"]}, "sets": {"workbook": [{"k": "pk", "q": "I [visited*/have visited] Jeju Island last summer.", "e": "last summer → 과거"}, {"k": "pk", "q": "We [have known*/knew] each other since we were children.", "e": "since ~ → 현재완료"}, {"k": "pk", "q": "He [has lived*/lived] in this town for ten years, and he still loves it.", "e": "지금도 계속 → 현재완료"}, {"k": "pk", "q": "My grandfather [died*/has died] in 2015.", "e": "in 2015 → 과거"}, {"k": "pk", "q": "When [did you buy*/have you bought] that jacket?", "e": "When 의문문 → 과거"}, {"k": "bl", "q": "나는 아직 그 책을 다 읽지 못했다. → I (haven't|have not) finished the book yet.", "e": "yet → 현재완료"}, {"k": "bl", "q": "그녀는 3일 전에 런던으로 떠났다. → She (left) for London three days ago.", "e": "~ ago → 과거"}, {"k": "bl", "q": "지난 몇 년 동안 그 도시는 많이 변해 왔다. → The city (has) changed a lot over the past few years.", "e": "over the past ~ → 현재완료"}, {"k": "fx", "q": "She has lost her wallet on the bus yesterday.", "w": "has", "a": ["(삭제)"], "e": "yesterday → 현재완료 ✗ → She lost"}, {"k": "fx", "q": "I know him since I was in elementary school.", "w": "know", "a": ["have known"], "e": "since ~ → 현재완료"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Ms. Kim ____ at this school since she graduated from college.", "o": ["teaches", "taught", "has taught", "is teaching", "teach"], "a": 2, "e": "since + 과거절 → 현재완료"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I have never been to Japan.", "He moved to Busan in 2019.", "We have just finished dinner.", "They have built this bridge ten years ago.", "It has snowed a lot so far this winter."], "a": 3, "e": "④ ten years ago → built"}, {"k": "pk", "q": "Two years ago, my family [moved*/has moved] to a new apartment.", "e": "~ ago → 과거"}, {"k": "pk", "q": "So far, more than 500 people [have signed*/signed] the petition.", "e": "so far → 현재완료"}, {"k": "pk", "q": "My sister [has been*/was] sick since last Friday.", "e": "since ~ → 현재완료"}, {"k": "bl", "q": "너는 지금까지 몇 개 나라를 방문해 봤니? → How many countries (have) you visited so far?", "e": "so far → 현재완료"}, {"k": "bl", "q": "그 회사는 1995년에 설립되었다. → The company (was) founded in 1995.", "e": "in 1995 → 과거"}, {"k": "fx", "q": "We were friends since we met in middle school.", "w": "were", "a": ["have been"], "e": "since ~ → 현재완료"}, {"k": "ox", "q": "I have finished the report just now.", "a": false, "e": "just now → 과거 finished"}, {"k": "ox", "q": "He has played the guitar since he was ten.", "a": true, "e": "✔ since + 과거절 → 현재완료"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nMy family (A) [lived / has lived] in Daejeon until 2020. Then we moved to Seoul, and we (B) [lived / have lived] here since then. I (C) [made / have made] many new friends so far.", "o": ["lived – lived – made", "has lived – have lived – have made", "lived – have lived – have made", "lived – have lived – made", "has lived – lived – made"], "a": 2, "e": "(A) until 2020(끝난 과거) → lived (B) since then → have lived (C) so far → have made"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I have lost my key last night.\nⓑ She has been to Paris twice.\nⓒ When did you hear the news?\nⓓ He has worked at the bank since 2018.\nⓔ They didn't see each other since last year.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓓ 옳음 / ⓐ lost / ⓔ haven't seen"}, {"k": "fx", "q": "The price of gas went up a lot since last month.", "w": "went", "a": ["has gone"], "e": "since ~ → 현재완료"}, {"k": "fx", "q": "Columbus has reached America in 1492.", "w": "has", "a": ["(삭제)"], "e": "역사적 사실·in 1492 → reached"}, {"k": "fx", "q": "Over the past ten years, the number of tourists increased greatly.", "w": "increased", "a": ["has increased"], "e": "over the past ~ → 현재완료"}, {"k": "ch", "q": "대화의 빈칸에 들어갈 말로 알맞은 것은?\nA: How long ____ you known Jenny?\nB: Since we were in the same class in 2022.", "o": ["do", "did", "has", "have", "had"], "a": 3, "e": "How long ~ known → 현재완료 have"}, {"k": "or", "q": "그는 지난주부터 (지금까지) 아팠다.", "a": "He has been sick since last week.", "e": "since ~ → 현재완료"}, {"k": "wr", "q": "나는 그 영화를 세 번 본 적이 있다. (see, three times)", "a": ["I have seen the movie three times.", "I've seen the movie three times."], "e": "경험 → 현재완료"}, {"k": "wr", "q": "그들은 2년 전에 결혼했다. (get married, ago)", "a": ["They got married two years ago.", "They got married 2 years ago."], "e": "~ ago → 과거"}, {"k": "ox", "q": "Since I was born, I lived in this house.", "a": false, "e": "since ~ → have lived"}]}}, {"tag": "hof-02-P2", "name": "과거완료 vs. 현재완료", "talk": [{"k": "m", "t": "**현재완료**는 **지금**을 기준으로 그 전부터 지금까지 / **과거완료(had p.p.)**는 **과거의 어느 시점**을 기준으로 그 전부터 그때까지 ⏪"}, {"k": "ex", "en": "When I arrived at the station, the train had already left.", "ko": "내가 역에 도착했을 때 기차는 이미 떠나고 없었다."}, {"k": "m", "t": "단서: 문장 안에 **과거 기준 시점**(when + 과거, by the time + 과거, before + 과거, until + 과거, by + 과거 시점)이 있으면 → [had] p.p."}, {"k": "q", "q": "By the time we got to the theater, the movie ____.", "o": ["has started", "had started", "starts"], "a": 1, "ok": "맞아요! 과거 기준(got) 이전 → had p.p.", "no": "by the time + 과거 → 그 전에 이미 → had started"}, {"k": "m", "t": "기준이 **현재**(now, so far, until now, since ~ 지금까지)면 → have p.p."}, {"k": "q", "q": "Until now, no one ____ the answer to the riddle.", "o": ["has found", "had found", "find"], "a": 0, "ok": "정확해요! until now → 현재완료", "no": "until now는 현재가 기준 → has found"}, {"k": "m", "t": "**대과거**: 과거의 두 일 중 **먼저** 일어난 일 → had p.p.: She lost the bag that her mother [had] given her."}, {"k": "q", "q": "I realized that I ____ my passport at home.", "o": ["have left", "had left", "leave"], "a": 1, "ok": "맞아요! 깨달은 것(과거)보다 먼저 → had left", "no": "realized(과거)보다 먼저 일어난 일 → had left"}, {"k": "m", "t": "⚠️ 함정: **과거 기준 시점 + have p.p. ✗** → When I met him, he has lived ✗ → he had lived"}, {"k": "m", "t": "정리! **기준이 현재 → have p.p. / 기준이 과거 → had p.p. / 기준 시점을 먼저 찾기** 👍"}], "notes": {"table": [["시제", "기준 시점", "예"], ["현재완료 have p.p.", "현재 (now, so far, until now)", "I have lived here for ten years."], ["과거완료 had p.p.", "과거 (when·by the time·before + 과거)", "When I came, he had left."], ["대과거 had p.p.", "과거의 두 일 중 먼저", "I lost the pen that she had given me."], ["✗", "과거 기준 + have p.p.", "When I called, she has gone out. ✗"]], "tips": ["기준 시점 찾기: 주절·부사절의 과거동사(arrived, got, met)나 last year, then", "by the time + 과거 → 주절은 대개 had p.p.", "since가 있어도 문장 전체가 과거 이야기면 had p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "When I got home, my brother [had already eaten*/has already eaten] dinner.", "e": "과거 기준(got) → had p.p."}, {"k": "pk", "q": "I [have lived*/had lived] in this city since I was five.", "e": "지금까지 → have p.p."}, {"k": "pk", "q": "She told me that she [had seen*/has seen] the movie before.", "e": "told(과거)보다 먼저 → had p.p."}, {"k": "pk", "q": "By the end of last year, he [had saved*/has saved] enough money to buy a car.", "e": "과거 기준(last year) → had p.p."}, {"k": "pk", "q": "So far this year, we [have had*/had had] three tests.", "e": "so far → have p.p."}, {"k": "bl", "q": "내가 그를 만났을 때, 그는 3년 동안 영어를 공부해 온 상태였다. → When I met him, he (had) studied English for three years.", "e": "과거 기준 → had p.p."}, {"k": "bl", "q": "나는 지금까지 그런 이상한 꿈을 꾼 적이 없다. → I (have) never had such a strange dream until now.", "e": "until now → have p.p."}, {"k": "bl", "q": "그 기차는 우리가 역에 도착하기 전에 떠났다. → The train (had) left before we arrived at the station.", "e": "before + 과거 → had p.p."}, {"k": "fx", "q": "When the firefighters arrived, the fire has already spread to the next building.", "w": "has", "a": ["had"], "e": "과거 기준(arrived) → had"}, {"k": "fx", "q": "I had known her since 2020, and we are still good friends.", "w": "had", "a": ["have"], "e": "지금도 친구 → have known"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The concert ____ already begun when we entered the hall.", "o": ["has", "have", "had", "was", "is"], "a": 2, "e": "과거 기준(entered) → had begun"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I have never seen snow until now.", "He had worked there for ten years before he retired.", "By the time I woke up, my mom had gone to work.", "When I called her, she has already left home.", "We have known each other for a long time."], "a": 3, "e": "④ 과거 기준(called) → had left"}, {"k": "pk", "q": "Before he became a writer, he [had worked*/has worked] as a teacher for years.", "e": "before + 과거 → had p.p."}, {"k": "pk", "q": "Since last month, the price of apples [has risen*/had risen] sharply.", "e": "지금까지 → have p.p."}, {"k": "pk", "q": "I found the wallet that I [had lost*/have lost] a week before.", "e": "found보다 먼저 → had lost"}, {"k": "bl", "q": "그녀는 그 전에는 해외여행을 해 본 적이 없었다. → She (had) never traveled abroad before then.", "e": "과거 기준(then) → had p.p."}, {"k": "bl", "q": "최근에 많은 학생들이 그 동아리에 가입했다. → Recently, many students (have) joined the club.", "e": "recently → have p.p."}, {"k": "fx", "q": "He said that he has met the singer the year before.", "w": "has", "a": ["had"], "e": "said보다 먼저 → had met"}, {"k": "ox", "q": "By the time the police arrived, the thief had run away.", "a": true, "e": "✔ by the time + 과거 → had p.p."}, {"k": "ox", "q": "My father has worked at the company for 20 years when he quit.", "a": false, "e": "과거 기준(quit) → had worked"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nWhen I visited my hometown last month, I found that the old school (A) [has / had] been torn down. Many things (B) [have / had] changed since I left. Now I (C) [have / had] lived in Seoul for fifteen years.", "o": ["has – have – have", "had – had – have", "had – have – had", "has – had – have", "had – had – had"], "a": 1, "e": "(A)(B) 과거 기준(visited, found) → had (C) Now → have"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ When I got to the bus stop, the bus had already left.\nⓑ I have lived here since I had been born.\nⓒ She had never seen the ocean until she visited Busan last year.\nⓓ He has finished his homework before dinner yesterday.\nⓔ So far, I have read five books this month.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ was born / ⓓ finished(또는 had finished)"}, {"k": "fx", "q": "I recognized him at once because I have seen his photo many times before.", "w": "have", "a": ["had"], "e": "recognized(과거)보다 먼저 → had seen"}, {"k": "fx", "q": "Until last year, she has never ridden a bike.", "w": "has", "a": ["had"], "e": "과거 기준(last year) → had"}, {"k": "fx", "q": "The two countries had been friends since the war ended in 1953, and they still are.", "w": "had", "a": ["have"], "e": "지금도 친구 → have been"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nWhen I arrived, everyone ____ left.\nI ____ never met a famous person so far.", "o": ["has – have", "had – have", "had – had", "has – had", "have – had"], "a": 1, "e": "과거 기준 → had / so far → have"}, {"k": "or", "q": "내가 일어났을 때, 비는 이미 그쳐 있었다.", "a": "When I woke up, the rain had already stopped.", "e": "과거 기준 → had p.p."}, {"k": "wr", "q": "나는 그녀가 전에 그 책을 읽었다는 것을 알았다. (knew, before)", "a": ["I knew that she had read the book before.", "I knew she had read the book before."], "e": "knew보다 먼저 → had read"}, {"k": "wr", "q": "우리는 지금까지 그 문제를 해결하지 못했다. (solve, the problem, so far)", "a": ["We have not solved the problem so far.", "We haven't solved the problem so far.", "So far, we have not solved the problem.", "So far we have not solved the problem.", "So far, we haven't solved the problem."], "e": "so far → have p.p."}, {"k": "ox", "q": "He lost the watch his father had given him.", "a": true, "e": "✔ 대과거 had given"}]}}, {"tag": "hof-02-P3", "name": "미래시제를 대신하는 현재시제", "talk": [{"k": "m", "t": "내일 일인데 현재시제? ⏳ **시간·조건 부사절**에서는 미래 일도 **현재시제**로 써요!"}, {"k": "m", "t": "시간: when, before, after, until, as soon as, by the time, once / 조건: if, unless"}, {"k": "ex", "en": "I'll call you when I get home.", "ko": "집에 도착하면 너에게 전화할게. (when I will get ✗)"}, {"k": "q", "q": "If it ____ tomorrow, we will cancel the picnic.", "o": ["rains", "will rain", "rained"], "a": 0, "ok": "맞아요! 조건 부사절 → 현재", "no": "if 부사절은 미래 일이라도 현재 → rains"}, {"k": "m", "t": "주절은 미래(will) 그대로! 부사절만 현재. 미래완료 대신 **현재완료**도 써요: I'll lend you the book after I [have] finished it."}, {"k": "q", "q": "We will wait here until the rain ____.", "o": ["stops", "will stop", "stopped"], "a": 0, "ok": "정확해요! until 부사절 → 현재", "no": "시간 부사절 → stops"}, {"k": "m", "t": "⚠️ 함정: **명사절**(know / ask / wonder / be sure + if·whether·when '~인지 / 언제 ~할지') → 미래면 **will** 그대로!"}, {"k": "ex", "en": "I don't know if he will come tomorrow. / If he comes tomorrow, I'll tell him.", "ko": "그가 내일 올지 모르겠다. (명사절) / 그가 내일 오면 말할게. (부사절)"}, {"k": "q", "q": "I wonder if she ____ to my party next week.", "o": ["comes", "will come", "came"], "a": 1, "ok": "맞아요! wonder의 목적어(명사절) → will", "no": "'올지 궁금하다' = 명사절 → will come"}, {"k": "m", "t": "구별법: if / when절이 동사의 **목적어**(~인지 / 언제 ~할지) → 명사절(will ○) / 빼도 문장이 되는 **부사**(~하면 / ~할 때) → 현재. 정리! 🎉 Chapter 2 동사의 시제 끝!"}], "notes": {"table": [["절의 종류", "미래 일", "예"], ["시간 부사절 (when, before, after, until, as soon as, by the time, once)", "현재시제", "I'll call you as soon as I arrive."], ["조건 부사절 (if, unless)", "현재시제", "If it rains, we'll stay home."], ["부사절 속 미래완료", "현재완료", "I'll return it after I have read it."], ["명사절 (know·wonder·be sure + if / whether / when)", "will 그대로", "I wonder if he will come."]], "tips": ["주절은 will 그대로, 부사절만 현재", "if = ~하면(부사절) / ~인지(명사절)", "when = ~할 때(부사절) / 언제 ~할지(명사절)"]}, "sets": {"workbook": [{"k": "pk", "q": "I will call you as soon as I [arrive*/will arrive] at the airport.", "e": "시간 부사절 → 현재"}, {"k": "pk", "q": "If you [study*/will study] hard, you will pass the test.", "e": "조건 부사절 → 현재"}, {"k": "pk", "q": "Please wait here until I [come*/will come] back.", "e": "시간 부사절 → 현재"}, {"k": "pk", "q": "I don't know whether he [will join*/joins] us tomorrow.", "e": "명사절 → will"}, {"k": "pk", "q": "Before you [leave*/will leave], turn off the lights.", "e": "시간 부사절 → 현재"}, {"k": "bl", "q": "내일 날씨가 좋으면 우리는 소풍을 갈 것이다. → If the weather (is) nice tomorrow, we will go on a picnic.", "e": "조건 부사절 → 현재"}, {"k": "bl", "q": "그가 도착하면 내가 너에게 알려 줄게. → I'll let you know when he (arrives).", "e": "시간 부사절 → 현재"}, {"k": "bl", "q": "나는 그녀가 언제 돌아올지 궁금하다. → I wonder when she (will) come back.", "e": "명사절(언제 ~할지) → will"}, {"k": "fx", "q": "We'll start the meeting when all the members will arrive.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → when all the members arrive"}, {"k": "fx", "q": "I'll text you after I will finish my homework.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → after I finish"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The game will be canceled if it ____ heavily this afternoon.", "o": ["rain", "rains", "will rain", "rained", "raining"], "a": 1, "e": "조건 부사절 → 현재 rains"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I'll stay home until my mom comes back.", "Once you start, you'll find it easy.", "I'm not sure if he will like the gift.", "Call me when you will finish the work.", "We'll go out after the rain stops."], "a": 3, "e": "④ 시간 부사절 → when you finish"}, {"k": "pk", "q": "By the time you [get*/will get] there, the store will be closed.", "e": "시간 부사절 → 현재"}, {"k": "pk", "q": "Unless you [hurry*/will hurry], you'll be late.", "e": "조건 부사절 → 현재"}, {"k": "pk", "q": "I'm not sure if it [will rain*/rains] this weekend.", "e": "명사절(~인지) → will"}, {"k": "bl", "q": "영화가 끝나면 저녁 먹으러 가자. → Let's go out for dinner after the movie (ends).", "e": "시간 부사절 → 현재"}, {"k": "bl", "q": "나는 그가 다음 주에 그 회의에 참석할지 모르겠다. → I don't know if he (will) attend the meeting next week.", "e": "명사절 → will"}, {"k": "fx", "q": "As soon as the guests will arrive, I'll serve dinner.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → As soon as the guests arrive"}, {"k": "ox", "q": "If you will need any help, just let me know.", "a": false, "e": "조건 부사절 → If you need"}, {"k": "ox", "q": "I wonder when the package will arrive.", "a": true, "e": "✔ 명사절(언제 ~할지) → will"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nI'm not sure whether my parents (A) [let / will let] me go camping. But if they (B) [say / will say] yes, I'll go with my friends. We will leave as soon as school (C) [finishes / will finish] on Friday.", "o": ["let – say – finishes", "will let – say – finishes", "will let – will say – finishes", "let – will say – will finish", "will let – say – will finish"], "a": 1, "e": "(A) 명사절 → will let (B) 조건 부사절 → say (C) 시간 부사절 → finishes"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'll wait until you finish your meal.\nⓑ If it will be sunny tomorrow, we'll play tennis.\nⓒ Nobody knows when the war will end.\nⓓ She'll be happy when she hears the news.\nⓔ Before you will go to bed, brush your teeth.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ If it is / ⓔ Before you go"}, {"k": "fx", "q": "You won't lose weight unless you will exercise regularly.", "w": "will", "a": ["(삭제)"], "e": "조건 부사절 → unless you exercise"}, {"k": "fx", "q": "I'm not sure if Tom passes the exam next week.", "w": "passes", "a": ["will pass"], "e": "명사절(~인지) → will pass"}, {"k": "fx", "q": "Let's wait until the guests will come.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → until the guests come"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["I'll call you when I will get home.", "If you will hurry, you can catch the train.", "Do you know if it will snow tomorrow?", "We'll stay inside until the storm will pass.", "After he will graduate, he'll travel to Europe."], "a": 2, "e": "③ 명사절 → will ○ / 나머지는 부사절 → 현재"}, {"k": "or", "q": "그가 오면 우리는 출발할 것이다.", "a": "We will leave when he comes.", "e": "시간 부사절 → 현재"}, {"k": "wr", "q": "네가 돌아올 때까지 내가 여기서 기다릴게. (until, come back)", "a": ["I will wait here until you come back.", "I'll wait here until you come back.", "I will wait here till you come back.", "I'll wait here till you come back."], "e": "시간 부사절 → come"}, {"k": "wr", "q": "나는 그녀가 그 제안을 받아들일지 궁금하다. (wonder, if, accept, the offer)", "a": ["I wonder if she will accept the offer.", "I wonder whether she will accept the offer."], "e": "명사절 → will"}, {"k": "ox", "q": "When the semester ends, I'll visit my grandparents.", "a": true, "e": "✔ 시간 부사절 → 현재"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "나는 5년 동안 이 동네에 살아 왔다. (have, for, this neighborhood)", "a": ["I have lived in this neighborhood for five years.", "I've lived in this neighborhood for five years.", "I have lived in this neighborhood for 5 years.", "I have been living in this neighborhood for five years."], "e": "지금까지 계속 → 현재완료"}, {"k": "wr", "q": "그는 어제 그 소식을 들었다. (hear, the news)", "a": ["He heard the news yesterday.", "Yesterday he heard the news.", "Yesterday, he heard the news."], "e": "yesterday → 과거"}, {"k": "wr", "q": "내가 도착했을 때, 그 회의는 이미 끝나 있었다. (When, arrive, the meeting, already, end)", "a": ["When I arrived, the meeting had already ended.", "The meeting had already ended when I arrived."], "e": "과거 기준 → had p.p."}, {"k": "wr", "q": "내일 비가 오면, 우리는 집에 있을 것이다. (If, rain, stay home)", "a": ["If it rains tomorrow, we will stay home.", "If it rains tomorrow, we'll stay home.", "We will stay home if it rains tomorrow.", "We'll stay home if it rains tomorrow.", "If it rains tomorrow we will stay home."], "e": "조건 부사절 → 현재"}, {"k": "wr", "q": "나는 그가 내일 올지 모르겠다. (know, if)", "a": ["I don't know if he will come tomorrow.", "I do not know if he will come tomorrow."], "e": "명사절 → will"}, {"k": "wr", "q": "너는 언제 그 책을 샀니? (When, buy)", "a": ["When did you buy the book?", "When did you buy that book?"], "e": "When 의문문 → 과거"}, {"k": "fx", "q": "I have bought this laptop three years ago.", "w": "have", "a": ["(삭제)"], "e": "three years ago → bought"}, {"k": "fx", "q": "When I opened the box, I found that someone has taken the money.", "w": "has", "a": ["had"], "e": "found보다 먼저 → had taken"}, {"k": "fx", "q": "I'll give you a call as soon as I will get the results.", "w": "will", "a": ["(삭제)"], "e": "시간 부사절 → as soon as I get"}, {"k": "or", "q": "그녀는 2020년부터 그 회사에서 일해 왔다.", "a": "She has worked at the company since 2020.", "e": "since ~ → 현재완료"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? I ____ to Canada twice so far.", "o": ["go", "went", "have been", "had been", "was"], "a": 2, "e": "so far(경험) → have been"}, {"k": "ch", "q": "빈칸에 알맞은 것은? By the time I reached the top of the mountain, the sun ____.", "o": ["has set", "had set", "sets", "will set", "is setting"], "a": 1, "e": "by the time + 과거 → had set"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Please don't leave until the teacher ____.", "o": ["comes", "will come", "came", "coming", "to come"], "a": 0, "e": "시간 부사절 → 현재 comes"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["I lost my bag last week.", "She has studied French since 2021.", "When he came home, his wife had cooked dinner.", "I'll tell him when he will come back.", "I don't know if she will agree."], "a": 3, "e": "④ 시간 부사절 → when he comes"}, {"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nI (A) [met / have met] Sora at a party two years ago. Since then, we (B) [were / have been] best friends. Before I met her, I (C) [have / had] never had a close friend.", "o": ["met – were – have", "met – have been – had", "have met – have been – had", "met – have been – have", "have met – were – had"], "a": 1, "e": "(A) ago → met (B) since then → have been (C) before + 과거 → had"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["He has gone to Japan last year.", "When have you finished the report?", "I had lived here since 2015, and I still live here.", "If you will need help, call me.", "The bus had left when I got to the stop."], "a": 4, "e": "⑤ 과거 기준(got) → had left"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI ____ my homework yesterday.\nI ____ my homework yet.", "o": ["finished – didn't finish", "finished – haven't finished", "have finished – haven't finished", "had finished – didn't finish", "have finished – didn't finish"], "a": 1, "e": "yesterday → 과거 / yet → 현재완료"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It has rained since last night.\nⓑ I saw him just now.\nⓒ She said she had never been to Busan before.\nⓓ I will leave after I will eat lunch.\nⓔ We have visited the museum in 2023.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ after I eat / ⓔ visited"}, {"k": "ch", "q": "대화의 빈칸에 들어갈 말로 알맞은 것은?\nA: Have you ever eaten Indian food?\nB: Yes. I ____ it for the first time last month.", "o": ["have eaten", "had eaten", "ate", "eat", "will eat"], "a": 2, "e": "last month → 과거 ate"}, {"k": "fx", "q": "Since she moved to Seoul, she made a lot of friends.", "w": "made", "a": ["has made"], "e": "since ~ → 현재완료"}, {"k": "fx", "q": "We lived in Incheon until 2020, and then we have moved to Seoul.", "w": "have", "a": ["(삭제)"], "e": "then(과거) → moved"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I have known her for ten years.", true], ["He has visited London in 2019.", false], ["When did you arrive?", true], ["She had already gone out when I called.", true], ["I have never seen a ghost until now.", true], ["By the time we arrived, the show has started.", false], ["I'll call you when I get there.", true], ["If it will rain, we'll stay inside.", false], ["I wonder if he will remember me.", true], ["We have lived here since 2010.", true], ["They have finished the work two hours ago.", false], ["He said he had lost his key.", true]], "e": "ⓑ visited ⓕ had started ⓗ If it rains ⓚ finished"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["She left for Paris yesterday.", true], ["How long have you studied English?", true], ["I didn't see him since last summer.", false], ["When I woke up, my dad had already left.", true], ["Until last year, I have never flown on a plane.", false], ["Wait until the light turns green.", true], ["Before you will leave, lock the door.", false], ["I'm not sure when she will be back.", true], ["Over the last decade, prices have doubled.", true], ["When have you met him?", false], ["Once you learn it, you'll never forget it.", true], ["I found the book I had lost.", true]], "e": "ⓒ haven't seen ⓔ had never flown ⓖ Before you leave ⓙ When did you meet"}, {"k": "wr", "q": "그가 전화하면, 나에게 알려 줘. (When, call, let me know)", "a": ["When he calls, let me know.", "Let me know when he calls.", "When he calls let me know."], "e": "시간 부사절 → 현재"}, {"k": "wr", "q": "나는 기차가 이미 떠났다는 것을 깨달았다. (realize, the train, already, leave)", "a": ["I realized that the train had already left.", "I realized the train had already left."], "e": "realized보다 먼저 → had left"}]}}, {"book": "hof", "chapter": {"id": "03", "name": "동사의 능동태·수동태", "title": "해커스 어법 제대로 · Chapter 3 동사의 능동태·수동태"}, "units": [{"tag": "hof-03-P1", "name": "능동태 vs. 수동태", "talk": [{"k": "m", "t": "Chapter 3! 동사 자리에 **능동(동사)** vs **수동(be + p.p.)** 고르기 🎭 기준은 딱 하나: 주어가 그 동작을 **하는지 / 당하는지**."}, {"k": "m", "t": "풀이 전략 ① **주어와 동사의 관계**를 해석(주어가 ~하다 → 능동 / ~되다·당하다 → 수동) ② 동사 뒤 **목적어 유무** 확인: 타동사 뒤에 목적어가 있으면 능동, 없으면 수동일 가능성 ↑"}, {"k": "ex", "en": "They built the bridge in 1990. / The bridge was built in 1990.", "ko": "그들은 1990년에 그 다리를 지었다. / 그 다리는 1990년에 지어졌다."}, {"k": "q", "q": "The letter ____ by my grandmother many years ago.", "o": ["wrote", "was written", "has written"], "a": 1, "ok": "맞아요! 편지는 쓰여지는 것 → 수동", "no": "주어 The letter는 '쓰여진' 것 + 뒤에 목적어 없음 → was written"}, {"k": "q", "q": "Many people ____ the new movie last weekend.", "o": ["watched", "were watched", "was watched"], "a": 0, "ok": "정확해요! 사람들이 영화를 보는 것 → 능동", "no": "주어 people이 직접 보고, 뒤에 목적어 the new movie → watched"}, {"k": "m", "t": "⚠️ 함정: **4형식·5형식 수동태**는 be p.p. 뒤에 명사가 남아요! 목적어처럼 보이는 명사가 있다고 무조건 능동 ✗ → She [was] given a prize. / He was elected class president."}, {"k": "q", "q": "The baby ____ Lily by her parents.", "o": ["named", "was named", "naming"], "a": 1, "ok": "맞아요! 5형식 수동태 → 뒤에 Lily가 남음", "no": "아기는 이름이 '지어진' 것 → was named Lily"}, {"k": "m", "t": "시제·조동사와 합칠 때: 진행 **be being p.p.** / 완료 **have been p.p.** / 조동사 **+ be p.p.** → The road is [being] repaired."}, {"k": "m", "t": "정리! **주어가 하면 능동, 당하면 수동 / 목적어 없으면 수동 의심 / 4·5형식 수동태는 뒤에 명사가 남음** 👍"}], "notes": {"table": [["형태", "능동", "수동"], ["현재·과거", "They clean the room.", "The room is cleaned."], ["진행", "They are fixing the car.", "The car is being fixed."], ["완료", "They have sold the house.", "The house has been sold."], ["조동사", "We must finish the work.", "The work must be finished."], ["4형식", "They gave her a prize.", "She was given a prize."], ["5형식", "People call him a genius.", "He is called a genius."]], "tips": ["타동사 뒤에 목적어가 없으면 수동태 의심", "be p.p. 뒤 명사가 있어도 4·5형식 수동태일 수 있음 (be given, be called, be elected, be named)", "진행 수동 being p.p. / 완료 수동 been p.p. 구별"]}, "sets": {"workbook": [{"k": "pk", "q": "This song [was sung*/sang] by a famous singer in the 1980s.", "e": "노래는 불려지는 것 → 수동"}, {"k": "pk", "q": "My father [repaired*/was repaired] the roof last week.", "e": "아빠가 고친 것 + 목적어 the roof → 능동"}, {"k": "pk", "q": "English [is spoken*/speaks] in many countries.", "e": "영어는 말해지는 것 → 수동"}, {"k": "pk", "q": "The museum [attracts*/is attracted] thousands of visitors every year.", "e": "박물관이 끌어들임 + 목적어 → 능동"}, {"k": "pk", "q": "The new library [will be built*/will build] next year.", "e": "도서관은 지어지는 것 → 조동사 + be p.p."}, {"k": "bl", "q": "그 창문은 어젯밤에 깨졌다. → The window (was) broken last night.", "e": "수동 → was broken"}, {"k": "bl", "q": "그 다리는 지금 수리되고 있다. → The bridge is (being) repaired now.", "e": "진행 수동 → being p.p."}, {"k": "bl", "q": "이 방은 일주일 동안 청소되지 않았다. → This room has not (been) cleaned for a week.", "e": "완료 수동 → been p.p."}, {"k": "fx", "q": "The test results will announce next Monday.", "w": "announce", "a": ["be announced"], "e": "결과는 발표되는 것 → will be announced"}, {"k": "fx", "q": "The students were planted a lot of trees in the park.", "w": "were", "a": ["(삭제)"], "e": "학생들이 심음 + 목적어 → planted"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The Mona Lisa ____ by Leonardo da Vinci.", "o": ["painted", "was painted", "is painting", "has painted", "paints"], "a": 1, "e": "그림은 그려지는 것 → was painted"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The car was washed by my brother.", "Her new book will be published soon.", "The plan is discussing at the meeting now.", "I was given a second chance.", "The players were trained by a famous coach."], "a": 2, "e": "③ 계획은 논의되는 것 → is being discussed"}, {"k": "pk", "q": "The documents [must be signed*/must sign] by the manager.", "e": "서류는 서명되는 것 → must be signed"}, {"k": "pk", "q": "The house [has been painted*/has painted] twice since we moved in.", "e": "집은 칠해지는 것 → has been painted"}, {"k": "pk", "q": "The children [were told*/told] to wait outside.", "e": "아이들은 말을 듣는 쪽 → were told"}, {"k": "bl", "q": "그는 팀의 주장으로 선출되었다. → He (was) elected captain of the team.", "e": "5형식 수동 → was elected + 명사"}, {"k": "bl", "q": "그 회의는 다음 주로 연기될 것이다. → The meeting will (be) postponed until next week.", "e": "조동사 + be p.p."}, {"k": "fx", "q": "Our classroom cleans every day by the students.", "w": "cleans", "a": ["is cleaned"], "e": "교실은 청소되는 것 → is cleaned"}, {"k": "ox", "q": "The package was delivered to the wrong address.", "a": true, "e": "✔ 소포는 배달되는 것"}, {"k": "ox", "q": "The new shopping mall is building near my school.", "a": false, "e": "쇼핑몰은 지어지는 것 → is being built"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nThe old palace (A) [visits / is visited] by many tourists every year. It (B) [built / was built] in the 15th century. Recently, the government (C) [has restored / has been restored] some of its buildings.", "o": ["visits – built – has restored", "is visited – was built – has restored", "is visited – built – has been restored", "visits – was built – has been restored", "is visited – was built – has been restored"], "a": 1, "e": "(A)(B) 궁전은 방문되고 지어진 것 → 수동 (C) 정부가 복원 + 목적어 → has restored"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The thief was caught by the police.\nⓑ The email sent to all the members yesterday.\nⓒ I was made to clean my room by my mom.\nⓓ Many houses have destroyed by the earthquake.\nⓔ She was called a genius by her teachers.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ was sent / ⓓ have been destroyed"}, {"k": "fx", "q": "The results of the survey have not announced yet.", "w": "announced", "a": ["been announced"], "e": "결과는 발표되는 것 → have not been announced"}, {"k": "fx", "q": "These pictures took by a famous photographer.", "w": "took", "a": ["were taken"], "e": "사진은 찍히는 것 → were taken"}, {"k": "fx", "q": "The patient is examining by the doctor right now.", "w": "examining", "a": ["being examined"], "e": "환자는 진찰받는 것 → is being examined"}, {"k": "ch", "q": "다음 문장을 수동태로 바르게 바꾼 것은? They gave her a medal.", "o": ["She gave a medal by them.", "She was given a medal by them.", "A medal was gave to her by them.", "A medal is given to her by them.", "She was giving a medal by them."], "a": 1, "e": "4형식 수동 → She was given a medal"}, {"k": "or", "q": "그 소식은 내일 발표될 것이다.", "a": "The news will be announced tomorrow.", "e": "조동사 + be p.p."}, {"k": "wr", "q": "이 집은 100년 전에 지어졌다. (build, ago)", "a": ["This house was built 100 years ago.", "This house was built a hundred years ago.", "This house was built one hundred years ago."], "e": "집은 지어지는 것 → was built"}, {"k": "wr", "q": "그 문제는 지금 논의되고 있다. (the problem, discuss, 진행 수동태)", "a": ["The problem is being discussed now.", "The problem is being discussed right now."], "e": "진행 수동 → is being discussed"}, {"k": "ox", "q": "The singer is loved by people of all ages.", "a": true, "e": "✔ 가수는 사랑받는 것"}]}}, {"tag": "hof-03-P2", "name": "수동태로 쓸 수 없는 자동사", "talk": [{"k": "m", "t": "목적어가 없는 **자동사**는 수동태가 될 수 없어요 🚫 '일어나다·나타나다·사라지다·존재하다·남아 있다' 같은 동사가 단골 함정!"}, {"k": "m", "t": "대표 자동사: **happen, occur, take place**(일어나다) / **appear, disappear, emerge**(나타나다·사라지다) / **exist, remain, arise, rise, die, arrive**"}, {"k": "q", "q": "The accident ____ at midnight.", "o": ["happened", "was happened", "is happened"], "a": 0, "ok": "맞아요! happen은 자동사 → 수동 ✗", "no": "happen(일어나다)은 목적어가 없는 자동사 → happened"}, {"k": "m", "t": "⚠️ 우리말로 '~되다'로 해석돼도 자동사! '문제가 발생되었다' → A problem [occurred]. (was occurred ✗)"}, {"k": "ex", "en": "The dinosaurs disappeared about 66 million years ago.", "ko": "공룡은 약 6천6백만 년 전에 사라졌다. (were disappeared ✗)"}, {"k": "q", "q": "Water ____ of hydrogen and oxygen.", "o": ["consists", "is consisted", "consisting"], "a": 0, "ok": "정확해요! consist of는 수동 ✗", "no": "consist of(~로 이루어지다)는 자동사 + 전치사 → consists of"}, {"k": "m", "t": "자동사 + 전치사 덩어리도 수동 ✗: **consist of, belong to, result in / result from**. 또 **resemble, cost** 같은 **상태동사**도 수동태로 쓰지 않아요."}, {"k": "q", "q": "This bag ____ to my sister.", "o": ["belongs", "is belonged", "belonging"], "a": 0, "ok" use the driver fell asleep.", "w": "was", "a": ["(삭제)"], "e": "happen → 수동 ✗ → happened"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Many species of animals ____ from the Earth every year.", "o": ["disappear", "are disappeared", "disappears", "is disappeared", "to disappear"], "a": 0, "e": "disappear → 수동 ✗, 주어 species(복수) → disappear"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The meeting took place in the main hall.", "A rainbow appeared after the rain.", "This book is belonged to the library.", "His success resulted from hard work.", "The price of oil rose sharply."], "a": 2, "e": "③ belong to → belongs"}, {"k": "pk", "q": "Dinosaurs [existed*/were existed] millions of years ago.", "e": "exist → 수동 ✗"}, {"k": "pk", "q": "The government [raised*/rose] taxes last year.", "e": "목적어 taxes → 타동사 raise"}, {"k": "pk", "q": "My little brother [resembles*/is resembled] my father.", "e": "resemble → 수동 ✗"}, {"k": "bl", "q": "그 회의는 다음 주에 열릴 것이다. → The conference will (take) place next week.", "e": "take place → 능동"}, {"k": "bl", "q": "많은 사람들이 그 전쟁에서 죽었다. → Many people (died) in the war.", "e": "die → 능동"}, {"k": "fx", "q": "The new phones are cost 1,000 dollars each.", "w": "are", "a": ["(삭제)"], "e": "cost → 수동 ✗ → The new phones cost"}, {"k": "ox", "q": "Most of the snow was disappeared by noon.", "a": false, "e": "disappear → 수동 ✗ → disappeared"}, {"k": "ox", "q": "Unemployment has risen over the past two years.", "a": true, "e": "✔ rise → has risen"}], "practiceB": [{"k": "ch", "q": "(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?\nA big fire (A) [broke out / was broken out] in the factory last night. Fortunately, no one (B) [died / was died]. The cause of the fire (C) [remains / is remained] unknown.", "o": ["broke out – died – remains", "was broken out – died – remains", "broke out – was died – remains", "broke out – died – is remained", "was broken out – was died – is remained"], "a": 0, "e": "break out·die·remain 모두 자동사 → 능동"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The d by many people is old.", "The house has been sold to a young couple.", "The bridge is building now."], "a": 3, "e": "④ 완료 수동 ✔ / ① was arrested ② belongs ③ which is loved ⑤ is being built"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe window ____ by the boy.\nThe boy ____ the window.", "o": ["broke – broke", "was broken – broke", "was broken – was broken", "broke – was broken", "breaks – was broken"], "a": 1, "e": "창문은 깨진 것 → 수동 / 소년이 깸 → 능동"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The meeting was taken place yesterday.\nⓑ The letters were delivered this morning.\nⓒ The girl who was given a gift smiled.\nⓓ His plan resulted in failure.\nⓔ The book which wrote by her is a bestseller.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓓ 옳음 / ⓐ took place / ⓔ which was written"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은? '그 문제는 그의 부주의에서 비롯되었다.'", "o": ["The problem was resulted from his carelessness.", "The problem resulted from his carelessness.", "The problem was resulting by his carelessness.", "The problem resulted by his carelessness.", "The problem has resulted his carelessness."], "a": 1, "e": "result from → 수동 ✗"}, {"k": "fx", "q": "The new rules will announce at the meeting tomorrow.", "w": "announce", "a": ["be announced"], "e": "규칙은 발표되는 것 → will be announced"}, {"k": "fx", "q": "The boy who was found the lost dog got a reward.", "w": "was", "a": ["(삭제)"], "e": "소년이 찾음 + 목적어 → who found"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The car was washed yesterday.", true], ["The accident was happened at night.", false], ["She was given a second chance.", true], ["The book is belonged to me.", false], ["The road is being repaired.", true], ["The letter wrote by my aunt.", false], ["The movie was directed by a young woman.", true], ["Prices have risen a lot.", true], ["The man who stole the bike was caught.", true], ["The gift which was sent by Tom arrived.", true], ["The house which built in 1950 is still strong.", false], ["The concert took place in the park.", true]], "e": "ⓑ happened ⓓ belongs ⓕ was written ⓚ which was built"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["English is taught in all schools.", true], ["The meeting will hold tomorrow.", false], ["A strange thing occurred yesterday.", true], ["The team consists of five members.", true], ["The window has been broken.", true], ["The girl who was won the race is my sister.", false], ["My bike was stolen last night.", true], ["The singer appeared on TV last night.", true], ["The flowers which were planted in spring are blooming.", true], ["The dog was disappeared yesterday.", false], ["He was elected class president.", true], ["The project is finishing by next week.", false]], "e": "ⓑ will be held ⓕ who won ⓙ disappeared ⓛ will be finished"}, {"k": "wr", "q": "그 시험 결과는 다음 주에 발표될 것이다. (The test results, announce, next week)", "a": ["The test results will be announced next week."], "e": "조동사 + be p.p."}, {"k": "wr", "q": "그 공룡들은 수백만 년 전에 사라졌다. (disappear, millions of years ago)", "a": ["The dinosaurs disappeared millions of years ago.", "Dinosaurs disappeared millions of years ago."], "e": "disappear → 수동 ✗"}]}}, {"book": "hof", "chapter": {"id": "04", "name": "조동사", "title": "해커스 어법 제대로 · Chapter 4 조동사"}, "units": [{"tag": "hof-04-P1", "name": "조동사 뒤 동사원형 vs. have p.p.", "talk": [{"k": "m", "t": "Chapter 4는 **조동사**! 어법 문제에서 조동사 뒤에 올 수 있는 건 딱 두 가지 — **동사원형**(현재·미래 이야기) vs **have p.p.**(과거 이야기) 🔍"}, {"k": "m", "t": "전략 ① 조동사 바로 뒤에 -s, -ed, -ing, to가 붙어 있으면 바로 ✗ → The bus should [arrive] soon. (arrives ✗ / arrived ✗)"}, {"k": "q", "q": "The museum may ____ early on national holidays.", "o": ["closes", "close", "closed"], "a": 1, "ok": "맞아요! 조동사 뒤는 동사원형", "no": "주어가 3인칭 단수여도 조동사 뒤는 원형 → close"}, {"k": "m", "t": "전략 ② **시간 단서**를 찾아요. yesterday, last night, then, ago, this morning(지난 일) → 과거에 대한 추측·후회 → 조동사 + **have p.p.**"}, {"k": "ex", "en": "The streets are wet. It must have rained during the night.", "ko": "길이 젖어 있다. 밤사이 비가 왔음에 틀림없다."}, {"k": "q", "q": "Jiho looks so happy. He ____ the audition yesterday.", "o": ["must pass", "must have passed", "must passes"], "a": 1, "ok": "정확해요! 어제 일에 대한 확신 → must have p.p.", "no": "yesterday = 과거 → must have passed"}, {"k": "m", "t": "뜻도 함께 확인! **must have p.p.** ~했음에 틀림없다 / **can't(couldn't) have p.p.** ~했을 리가 없다 / **may(might) have p.p.** ~했을지도 모른다"}, {"k": "m", "t": "**should have p.p.** ~했어야 했는데(안 했다) / **shouldn't have p.p.** ~하지 말았어야 했는데(했다) / **could have p.p.** ~할 수도 있었는데 / **need not have p.p.** ~할 필요가 없었는데(했다)"}, {"k": "q", "q": "I failed the test. I ____ harder.", "o": ["should have studied", "must have studied", "can't have studied"], "a": 0, "ok": "맞아요! 안 해서 후회 → should have p.p.", "no": "시험에 떨어져 후회 → 더 공부했어야 했는데 → should have studied"}, {"k": "m", "t": "정리! **현재·미래 → 조동사 + 원형 / 과거 → 조동사 + have p.p.** · 형태는 have(has ✗) + p.p.(원형 ✗) 👍"}], "notes": {"table": [["형태", "의미", "예"], ["must have p.p.", "~했음에 틀림없다", "He must have left already."], ["can't / couldn't have p.p.", "~했을 리가 없다", "She can't have said that."], ["may / might have p.p.", "~했을지도 모른다", "I may have dropped it on the bus."], ["should have p.p.", "~했어야 했는데 (안 함)", "You should have told me."], ["shouldn't have p.p.", "~하지 말았어야 했는데 (함)", "I shouldn't have eaten so much."], ["could have p.p.", "~할 수도 있었는데 (안 함)", "We could have won."], ["need not have p.p.", "~할 필요가 없었는데 (함)", "You needn't have waited."]], "tips": ["조동사 뒤는 원형: may closes ✗, should arrived ✗", "과거 단서(yesterday, last night, then, ago) → 조동사 + have p.p.", "현재 단서(now, these days, right now) → 조동사 + 원형", "주어가 3인칭 단수여도 have (must has ✗)"]}, "sets": {"workbook": [{"k": "pk", "q": "Look at his muddy shoes. He [must have walked*/must walk] through the wet field this morning.", "e": "오늘 아침(지난 일) 추측 → must have p.p."}, {"k": "pk", "q": "Students who arrive after nine [should report*/should reported] to the main office first.", "e": "조동사 + 원형"}, {"k": "pk", "q": "Jenny [can't have written*/can't write] that email yesterday; she was in the hospital without her phone all day.", "e": "어제 일 + 불가능 → can't have p.p."}, {"k": "pk", "q": "The lights in the apartment upstairs are on, so the neighbors [may be*/may have been] home right now.", "e": "right now → 조동사 + 원형"}, {"k": "bl", "q": "그는 그 회의를 잊어버렸음에 틀림없다. 어제 오지 않았으니까. → He must (have) (forgotten) about the meeting, because he didn't show up yesterday.", "e": "must have p.p. / forget – forgot – forgotten"}, {"k": "bl", "q": "너는 그 경고 표지판을 무시하지 말았어야 했다. → You (shouldn't|should not) have ignored the warning sign.", "e": "shouldn't have p.p."}, {"k": "bl", "q": "택시를 탔더라면 우리는 그 기차를 탈 수도 있었는데. → We could have (caught) the train if we had taken a taxi.", "e": "could have p.p. / catch – caught – caught"}, {"k": "bl", "q": "그 시험은 다음 주로 연기될지도 모른다. → The exam (may|might) be postponed until next week.", "e": "미래 추측 → may + 원형"}, {"k": "fx", "q": "The package that I ordered last week should arrived by tomorrow, according to the website.", "w": "arrived", "a": ["arrive"], "e": "by tomorrow(미래) → should + 원형"}, {"k": "fx", "q": "Mina might has left her umbrella on the bus she took this morning.", "w": "has", "a": ["have"], "e": "조동사 + have p.p. (has ✗)"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["The road is completely wet, so it must have rained during the night.", "You should have told me about the change in the schedule earlier.", "He can't have finished the whole report in just ten minutes.", "The museum may closes early on holidays, so check the hours first.", "Someone who knows the area well could help us find the way now."], "a": 3, "e": "④ may close (조동사 + 원형)"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• Look! The baby is smiling. She (A)[must like / must liked] the music.\n• The window was broken when I came home last night. A ball (B)[may hit / may have hit] it.\n• I failed the test last week. I (C)[should study / should have studied] harder.", "o": ["must like – may hit – should study", "must like – may have hit – should have studied", "must liked – may hit – should have studied", "must liked – may have hit – should study", "must like – may have hit – should study"], "a": 1, "e": "(A) 조동사 + 원형 (B) 어젯밤 일 추측 → may have hit (C) 지난주 일 후회 → should have studied"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: I can't find my wallet anywhere.\nB: You ____ it at the café. We were there an hour ago.", "o": ["may leave", "may have left", "should have left", "can't have left", "must leave"], "a": 1, "e": "한 시간 전 일에 대한 추측 → may have left"}, {"k": "pk", "q": "The meeting room was empty when I got there, so everyone [must have gone*/must go] home already.", "e": "이미 지난 일 확신 → must have p.p."}, {"k": "pk", "q": "If you feel dizzy, you [should sit*/should have sat] down and rest for a while.", "e": "지금 해야 할 일 → should + 원형"}, {"k": "pk", "q": "I [shouldn't have eaten*/shouldn't eat] so much pizza last night; my stomach still hurts.", "e": "어젯밤 일 후회 → shouldn't have p.p."}, {"k": "bl", "q": "그 화가가 그 그림을 혼자 그렸을 리가 없다. → The artist (can't|cannot|couldn't) have painted the picture by himself.", "e": "can't have p.p."}, {"k": "bl", "q": "우리는 버스를 기다릴 필요가 없었는데. 걸어서 10분밖에 안 걸렸다. → We (needn't|need not) have waited for the bus; it took only ten minutes on foot.", "e": "need not have p.p. = ~할 필요가 없었는데(했다)"}, {"k": "fx", "q": "The scientist must have make a mistake in the calculation that she did last month.", "w": "make", "a": ["made"], "e": "have + p.p."}, {"k": "ox", "q": "Judging from the long line at the door, the new bakery must be very popular these days.", "a": true, "e": "✔ these days(현재) → must + 원형"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He must have been tired after the long flight yesterday.\nⓑ You should have came to the party last night.\nⓒ The keys might be in the drawer, but I'm not sure.\nⓓ She can't have know the answer because she missed the class.\nⓔ We could have won the game if we had practiced more.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ should have come / ⓓ can't have known"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["The lights went out suddenly, so the storm must have damaged the power lines.", "Nobody answered the phone; the family may have gone on vacation.", "The boy who broke the vase should apologize to his grandmother now.", "You shouldn't have shouted at him in front of all the other students.", "Tom couldn't have fixes the computer, because he knows nothing about it."], "a": 4, "e": "⑤ couldn't have fixed"}, {"k": "ch", "q": "다음 상황을 한 문장으로 나타낼 때 가장 알맞은 것은?\nI'm sure that Jiho didn't see the email. He was hiking in the mountains all day without a signal.", "o": ["Jiho must have seen the email.", "Jiho can't have seen the email.", "Jiho should have seen the email.", "Jiho may see the email.", "Jiho can't see the email."], "a": 1, "e": "과거에 ~했을 리 없다 → can't have p.p."}, {"k": "pk", "q": "The ancient people who built this temple [must have used*/must use] simple tools to move the huge stones.", "e": "고대(과거) 일 확신 → must have p.p."}, {"k": "fx", "q": "The ancient Egyptians must have use ropes and ramps to build the pyramids.", "w": "use", "a": ["used"], "e": "have + p.p."}, {"k": "fx", "q": "Ms. Kim may have announce the results already, so let's check the school website.", "w": "announce", "a": ["announced"], "e": "have + p.p."}, {"k": "or", "q": "너는 그에게 그 비밀을 말하지 말았어야 했다.", "a": "You shouldn't have told him the secret.", "e": "shouldn't have p.p."}, {"k": "or", "q": "그 도둑은 뒷문으로 들어왔음에 틀림없다.", "a": "The thief must have come in through the back door.", "e": "must have p.p."}, {"k": "wr", "q": "그가 그 소식을 벌써 들었을 리가 없다. (can't, hear the news, already)", "a": ["He can't have heard the news already.", "He cannot have heard the news already.", "He can not have heard the news already.", "He couldn't have heard the news already.", "He could not have heard the news already.", "He can't have already heard the news.", "He cannot have already heard the news.", "He can not have already heard the news.", "He couldn't have already heard the news.", "He could not have already heard the news."], "e": "can't have p.p."}, {"k": "bl", "q": "A: 콘서트장이 거의 비어 있었어. B: 표가 너무 비쌌던 게 틀림없어. → A: The concert hall was almost empty. B: The tickets (must) (have) (been) too expensive.", "e": "과거 일 확신 → must have been"}]}}, {"tag": "hof-04-P2", "name": "주장/제안/요구/명령 동사 뒤 that절의 should 생략", "talk": [{"k": "m", "t": "**주장·제안·요구·명령** 동사 뒤 that절이 '~해야 한다(당위)'를 말하면 → that + 주어 + **(should) + 동사원형** 📢"}, {"k": "m", "t": "주장 insist / 제안 suggest, propose, recommend / 요구 demand, require, request, ask, urge / 명령 order, command / 충고 advise"}, {"k": "ex", "en": "The committee recommended that the school start classes later.", "ko": "위원회는 학교가 수업을 더 늦게 시작해야 한다고 권고했다. (starts ✗)"}, {"k": "q", "q": "The coach demanded that every player ____ on time.", "o": ["be", "is", "was"], "a": 0, "ok": "맞아요! 요구 동사 → (should) + 원형", "no": "demand + that절(당위) → (should) be"}, {"k": "m", "t": "함정 ①: should가 빠지면 주어가 3인칭 단수여도, 주절이 과거여도 **원형** 그대로! She insisted that he [stay] home. (stays ✗ / stayed ✗)"}, {"k": "m", "t": "함정 ②: **insist**가 '(사실이라고) 주장하다', **suggest**가 '암시하다·보여 주다'이면 that절은 당위가 아니라 **사실** → 시제를 맞춰 써요"}, {"k": "ex", "en": "The man insisted that he had never seen the stolen car.", "ko": "그 남자는 그 도난 차량을 본 적이 없다고 주장했다. (사실 주장)"}, {"k": "q", "q": "Her pale face suggested that she ____ sick.", "o": ["be", "was", "should be"], "a": 1, "ok": "정확해요! '암시하다' → 시제대로", "no": "창백한 얼굴이 아팠다는 사실을 보여 줌 → was"}, {"k": "m", "t": "풀이 전략: 동사 확인 → that절이 '해야 할 일'인지, '이미 있는 사실'인지 해석하기! 수동이면 (should) **be p.p.**, 부정이면 (should) **not** + 원형"}, {"k": "q", "q": "It was proposed that the meeting ____ until Friday.", "o": ["be delayed", "is delayed", "delays"], "a": 0, "ok": "맞아요! (should) be p.p.", "no": "회의가 연기되어야 한다(당위·수동) → be delayed"}, {"k": "m", "t": "정리! **주장·제안·요구·명령 + that + 주어 + (should) 원형 · 사실 주장·암시면 시제대로** 👍"}], "notes": {"table": [["구분", "형태", "예"], ["주장·제안·요구·명령 (당위)", "insist / suggest / propose / recommend / demand / require / request / ask / urge / order / advise + that + 주어 + (should) 동사원형", "They demanded that he (should) pay the money back."], ["수동 / 부정", "(should) be p.p. / (should) not + 원형", "She asked that the door be locked. / He urged that we not go."], ["명사형도 같음", "suggestion / demand / recommendation / proposal that + 주어 + (should) 원형", "His suggestion that we leave early was accepted."], ["예외: 사실 주장", "insist that + 주어 + 시제 맞춘 동사", "She insisted that she had locked the door."], ["예외: 암시하다", "suggest that + 주어 + 시제 맞춘 동사", "The data suggest that the plan works."]], "tips": ["should를 빼도 원형: 3인칭 단수 -s ✗, 과거형 ✗", "이성적 판단 형용사(important, necessary, essential) + that절도 (should) 원형", "'사실'이면 should ✗ → 시제대로"]}, "sets": {"workbook": [{"k": "pk", "q": "The doctor recommended that my grandfather [walk*/walks] for thirty minutes every day.", "e": "제안·권고 → (should) 원형"}, {"k": "pk", "q": "The teacher insisted that every student [turn*/turned] off their phones during the test. (~해야 한다고)", "e": "당위 주장 → (should) 원형"}, {"k": "pk", "q": "Our coach demanded that we [be*/were] on the field by seven every morning.", "e": "요구 → (should) be"}, {"k": "pk", "q": "The witness insisted that the driver [had run*/run] the red light before the crash. (사실 주장)", "e": "사실 주장 → 시제대로"}, {"k": "bl", "q": "그 매니저는 모든 직원이 회의에 참석해야 한다고 요구했다. → The manager required that every employee (attend|should attend) the meeting.", "e": "요구 → (should) 원형"}, {"k": "bl", "q": "그녀는 우리가 공원에서 소풍을 해야 한다고 제안했다. → She proposed that we (have|should have) a picnic in the park.", "e": "제안 → (should) 원형"}, {"k": "bl", "q": "그 경찰관은 그 남자가 즉시 차에서 내려야 한다고 명령했다. → The police officer ordered that the man (get|should get) out of the car immediately.", "e": "명령 → (should) 원형"}, {"k": "bl", "q": "그의 떨리는 목소리는 그가 긴장하고 있다는 것을 보여 주었다. → His shaking voice suggested that he (was) nervous.", "e": "암시(사실) → 시제대로"}, {"k": "fx", "q": "The safety rules require that every visitor wears a helmet inside the factory.", "w": "wears", "a": ["wear", "should wear"], "e": "요구 → (should) wear"}, {"k": "fx", "q": "My mother suggested that my sister took a short break from studying.", "w": "took", "a": ["take", "should take"], "e": "제안 → (should) take"}], "practiceA": [{"k": "ch", "q": "어법상 틀린 것은?", "o": ["The lawyer advised that her client remain silent.", "They requested that the meeting be held online.", "The fans demanded that the singer comes back on stage.", "He insisted that he had never met the woman before.", "The data suggest that the new medicine works well."], "a": 2, "e": "③ (should) come"}, {"k": "ch", "q": "(A), (B)에 들어갈 말로 바르게 짝지어진 것은?\n• The principal urged that every class (A) ____ a fire drill this month.\n• The fingerprints on the glass suggested that the suspect (B) ____ in the room.", "o": ["hold – be", "hold – had been", "holds – had been", "held – had been", "held – be"], "a": 1, "e": "(A) urge(요구) → (should) hold (B) 지문이 보여 주는 사실 → had been"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? The doctor ____ that he stop eating sweets.", "o": ["suggested", "recommended", "insisted", "advised", "knew"], "a": 4, "e": "know는 당위 동사가 아님 → that절에 원형 ✗"}, {"k": "pk", "q": "It was suggested that the festival [be postponed*/was postponed] because of the heavy rain. (연기되어야 한다고)", "e": "제안(당위) + 수동 → (should) be p.p."}, {"k": "pk", "q": "My parents insisted that I [not stay*/didn't stay] out after midnight. (~하지 말아야 한다고)", "e": "당위 부정 → (should) not + 원형"}, {"k": "pk", "q": "The study suggests that people who sleep less [are*/be] more likely to gain weight. (연구가 보여 준다)", "e": "암시(사실) → 시제대로"}, {"k": "bl", "q": "그 회사는 고객들이 영수증을 보관해야 한다고 권한다. → The company recommends that customers (keep|should keep) their receipts.", "e": "권고 → (should) 원형"}, {"k": "bl", "q": "그는 자신이 그 돈을 이미 돌려주었다고 주장했다. → He insisted that he (had) already returned the money.", "e": "사실 주장 → had p.p."}, {"k": "fx", "q": "The judge ordered that the company pays the workers all the money it owed them.", "w": "pays", "a": ["pay", "should pay"], "e": "명령 → (should) pay"}, {"k": "ox", "q": "The coach's proposal that the team practice twice a day was accepted by everyone.", "a": true, "e": "✔ 명사 proposal + that + (should) 원형"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She insisted that her son go to bed before ten.\nⓑ The rule demands that every member pays a fee each month.\nⓒ The doctor's advice that he quit smoking saved his life.\nⓓ His silence suggested that he agree with the plan.\nⓔ They asked that the music be turned down after 10 p.m.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ (should) pay / ⓓ 암시(사실) → agreed"}, {"k": "ch", "q": "(A), (B), (C)에서 어법에 맞는 것끼리 짝지은 것은?\n• The teacher recommended that Junho (A)[read / reads] more English novels.\n• The man insisted that he (B)[be / was] innocent, but no one believed him.\n• The council proposed that a new library (C)[build / be built] near the station.", "o": ["read – be – build", "read – was – be built", "reads – was – be built", "reads – be – build", "read – was – build"], "a": 1, "e": "(A) 권고 → read (B) 결백하다는 사실 주장 → was (C) 도서관이 지어져야 → be built"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n그 의사는 그녀가 일주일 동안 쉬어야 한다고 권했다.", "o": ["The doctor recommended that she rests for a week.", "The doctor recommended that she rest for a week.", "The doctor recommended that she rested for a week.", "The doctor recommended that she resting for a week.", "The doctor recommended that she to rest for a week."], "a": 1, "e": "권고 → (should) rest"}, {"k": "pk", "q": "The evidence suggested that the fire [had started*/start] in the kitchen.", "e": "증거가 보여 주는 사실 → 시제대로"}, {"k": "fx", "q": "The members of the club demanded that the president resigns after the scandal.", "w": "resigns", "a": ["resign", "should resign"], "e": "요구 → (should) resign"}, {"k": "fx", "q": "The broken lock suggested that someone break into the house during the night.", "w": "break", "a": ["broke", "had broken"], "e": "암시(사실) → 과거 시제"}, {"k": "or", "q": "선생님은 우리가 매일 영어로 일기를 써야 한다고 제안하셨다.", "a": "The teacher suggested that we keep a diary in English every day.", "e": "제안 → (should) 원형"}, {"k": "or", "q": "그녀는 자신이 그 문을 잠갔다고 주장했다.", "a": "She insisted that she had locked the door.", "e": "사실 주장 → 시제대로"}, {"k": "wr", "q": "그 규칙은 모든 승객이 안전벨트를 매야 한다고 요구한다. (require, every passenger, wear a seat belt)", "a": ["The rule requires that every passenger wear a seat belt.", "The rule requires that every passenger should wear a seat belt.", "The rules require that every passenger wear a seat belt.", "The rules require that every passenger should wear a seat belt.", "The rule requires every passenger to wear a seat belt.", "The rules require every passenger to wear a seat belt."], "e": "요구 → (should) 원형"}, {"k": "bl", "q": "A: 치과 의사 선생님이 뭐라고 하셨니? B: 자기 전에 단것을 먹지 말라고 조언하셨어. → A: What did the dentist say? B: She advised that I (not|should not) eat sweets before bed.", "e": "당위 부정 → (should) not + 원형"}]}}, {"tag": "hof-04-P3", "name": "반복되는 동사 대신 쓰는 do/be/have동사", "talk": [{"k": "m", "t": "앞에 나온 동사를 반복하지 않으려고 쓰는 **대동사**! 앞 동사의 **종류**와 **시제·수**에 맞춰야 해요 🔁"}, {"k": "m", "t": "be동사 → **be** / 일반동사 → **do·does·did** / 완료형(have p.p.) → **have·has·had** / 조동사 → **그 조동사**"}, {"k": "ex", "en": "My dog eats much more than my cat does.", "ko": "우리 개는 우리 고양이보다 훨씬 더 많이 먹는다. (does = eats)"}, {"k": "q", "q": "He works harder than his sister ____.", "o": ["is", "does", "has"], "a": 1, "ok": "맞아요! works(일반동사) → does", "no": "앞 동사 works는 일반동사 → does"}, {"k": "m", "t": "풀이 전략: 대동사가 대신하는 동사를 찾아 **화살표로 연결** → ① 동사 종류 ② 시제 ③ 주어의 수 확인"}, {"k": "q", "q": "She has visited Rome more times than I ____.", "o": ["do", "have", "am"], "a": 1, "ok": "정확해요! has visited(완료) → have", "no": "완료형 has visited → 주어 I에 맞춰 have"}, {"k": "m", "t": "so / neither + 대동사 + 주어: '~도 그렇다 / ~도 그렇지 않다' — 순서는 **대동사 + 주어**: I like jazz. — So [do] I."}, {"k": "q", "q": "Tom didn't pass the test, and neither ____ Jake.", "o": ["did", "was", "does"], "a": 0, "ok": "맞아요! didn't pass(과거 일반동사) → did", "no": "didn't pass → neither did Jake"}, {"k": "m", "t": "⚠️ than·as 뒤 비교 대상, so·neither 뒤에서 가장 많이 출제! 시제가 바뀌면 대동사도 바뀌어요: He spends more money now than he [did] last year."}, {"k": "m", "t": "정리! **be → be · 일반동사 → do · 완료 → have · 조동사 → 그대로 · 시제·수까지 맞추기** 👍"}], "notes": {"table": [["앞 동사", "대동사", "예"], ["be동사", "am / is / are / was / were", "The weather is warmer today than it was yesterday."], ["일반동사", "do / does / did", "She sings better than I do."], ["완료형", "have / has / had", "I have finished, and so has Mina."], ["조동사", "can / will / should …", "Jane can swim, and so can her sister."], ["so / neither + V + S", "~도 그렇다 / ~도 그렇지 않다", "I wasn't hungry, and neither was he."]], "tips": ["대동사는 앞 동사의 종류 → 시제 → 수 순서로 확인", "so / neither 뒤는 대동사 + 주어 어순", "neither = nor, 뒤에 not을 또 쓰지 않기"]}, "sets": {"workbook": [{"k": "pk", "q": "My brother spends more time on his phone than I [do*/am].", "e": "spends(일반동사) → do"}, {"k": "pk", "q": "The new model is much lighter than the old one [is*/does].", "e": "is(be동사) → is"}, {"k": "pk", "q": "She has lived in Seoul longer than her cousins [have*/do].", "e": "has lived(완료) → have"}, {"k": "pk", "q": "I didn't enjoy the movie, and neither [did*/were] my friends.", "e": "didn't enjoy → did"}, {"k": "bl", "q": "그 학생들은 작년보다 올해 책을 더 많이 읽었다. → The students read more books this year than they (did) last year.", "e": "read(과거 일반동사) → did"}, {"k": "bl", "q": "Jane은 피아노를 칠 수 있고, 그녀의 여동생도 그렇다. → Jane can play the piano, and so (can) her sister.", "e": "조동사 can → can"}, {"k": "bl", "q": "나는 그 소식에 놀랐고, 내 부모님도 그랬다. → I was surprised at the news, and so (were) my parents.", "e": "be동사 + 복수 주어 → were"}, {"k": "bl", "q": "A: 나는 제주도에 가 본 적이 없어. B: 나도 없어. → A: I've never been to Jeju Island. B: (Neither|Nor) (have) I.", "e": "have been(완료) → have"}, {"k": "fx", "q": "Today's students use computers much more often than their parents were.", "w": "were", "a": ["did"], "e": "use(일반동사) → did"}, {"k": "fx", "q": "Kevin has finished his homework, and so does his twin brother.", "w": "does",
