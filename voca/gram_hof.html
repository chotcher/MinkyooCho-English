      const low=seenBefore.toLowerCase(); const unseen=blanks.some(a=>a.split("|").every(w=>!new RegExp("(^|[^a-z])"+w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z])").test(low)));
      if(unseen){ let opts=blanks.map(a=>a.split("|")[0]);
        if(opts.length<3){ const pool=[...new Set(T.filter(x=>x.k==="m"&&x!==t).flatMap(x=>(x.t.match(/\[([^\]]+)\]/g)||[]).map(y=>y.slice(1,-1).split("|")[0])))].filter(w=>!opts.some(o=>o.toLowerCase()===w.toLowerCase())); opts=opts.concat(shuffle(pool).slice(0,3-opts.length)) }
        const bank=document.createElement("div"); bank.className="wbank"; bank.innerHTML=`<span>보기에서 골라도 돼요</span>`+shuffle(opts).map(o=>`<button type="button" class="chip">${esc(o)}</button>`).join("");
        r.querySelector(".bub").appendChild(bank); let cur=ins[0]; ins.forEach(x=>x.addEventListener("focus",()=>cur=x));
        bank.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const tgt=(!cur.readOnly&&!cur.value.trim())?cur:(ins.find(x=>!x.readOnly&&!x.value.trim())||cur); if(tgt.readOnly) return; tgt.value=c.textContent; const nxt=ins.find(x=>!x.readOnly&&!x.value.trim()); (nxt||nx).focus() }) }
      ins.forEach((x,k)=>x.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); (ins[k+1]||nx).focus?.(); if(!ins[k+1]) nx.click() } });
      const orig=ins.map(x=>x.dataset.a), got=ins.map(()=>null);
      nx.onclick=()=>{ let all=true; tries++;
        const avail=k=>{ const g=grp[k]; const pool=orig.filter((_,j)=>grp[j]===g); got.forEach((v,j)=>{ if(v!==null&&grp[j]===g){ const p=pool.indexOf(v); if(p>=0) pool.splice(p,1) } }); return pool };
        ins.forEach((x,k)=>{ if(got[k]!==null) return; const cand=avail(k);
          const hit=x.value.trim()?cand.find(a=>same(x.value,a.split("|"))):undefined;
          if(hit!==undefined){ got[k]=hit; x.classList.add("ok"); x.readOnly=true }
          else{ all=false; x.classList.remove("no"); void x.offsetWidth; x.classList.add("no");
            if(tries>=2){ const rest=cand[0]!==undefined?cand[0]:orig[k]; got[k]=rest; x.value=rest.split("|")[0]; x.classList.add("ok"); x.readOnly=true } } });
        if(all||tries>=2){ if(!all) row("괜찮아요, 정답을 채워 뒀어요. 한 번 더 읽어 보세요 📖",false); nx.textContent="다음"; nx.onclick=step; }
      };
      return }
    if(t.k==="q"){
      nx.disabled=true; nx.textContent="답을 골라요";
      const r=row(`<div class="qq">Q. ${esc(t.q)}</div><div class="opts">${t.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`,false,"qbub");
      r.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ r.querySelectorAll(".opt").forEach(x=>x.disabled=true); const k=+b.dataset.k;
        row(esc(t.o[k]),true); const ok=k===t.a; row((ok?"⭕ ":"❌ ")+esc(ok?t.ok:t.no)+(ok?"":`<br><strong>정답: ${esc(t.o[t.a])}</strong>`),false);
        nx.disabled=false; nx.textContent="다음"; nx.onclick=step });
      return }
  }
  nx.onclick=step; step();
}
/* ---------- 최종 누적학습: 이 유닛 + 앞 유닛들 섞기, 틀렸던 문제 먼저 ---------- */
function runCumul(n){
  const ci=BOOK.chapters.indexOf(CH), before=BOOK.chapters.slice(0,ci).flatMap(c=>c.units);
  const u=CH.units[n], prev=[...before,...CH.units.slice(0,n)], tags=[...prev,u].map(x=>x.tag);
  const pool=x=>["workbook","practiceA","practiceB"].flatMap(s=>x.sets[s]);
  const seen=new Set(), pick=[]; const add=it=>{const k=wkey(it); if(seen.has(k)||pick.length>=CUMUL_N) return; seen.add(k); pick.push(it)};
  shuffle(Object.values(ST.wrong).filter(w=>tags.includes(w.tag)).map(w=>w.item)).slice(0,5).forEach(add);
  const curN=prev.length?Math.ceil(CUMUL_N/2):CUMUL_N;
  shuffle(pool(u)).slice(0,curN).forEach(add);
  const near=shuffle(CH.units.slice(0,n).flatMap(pool)), far=shuffle(before.flatMap(pool));
  const restN=CUMUL_N-curN, nearN=far.length?Math.ceil(restN*0.6):restN;
  near.slice(0,nearN).forEach(add); far.forEach(add); near.forEach(add);
  shuffle(pool(u)).forEach(add);
  runSet(shuffle(pick),{title:u.name+" · 최종 누적학습",key:u.tag+":cumul",target:80,tag:u.tag});
}
/* ---------- 문제 세트 ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function runSet(items,opt){
  let i=0, right=0; const wrongs=[];
  function view(){
    if(i>=items.length) return result();
    const it=items[i];
    $("#app").innerHTML = `<div class="top q"><button class="btn sm" id="bk">← 목록</button><span class="sp"></span><b>${esc(opt.title)}</b></div>
      <div class="prog" style="margin-top:12px"><div class="bar"><i style="width:${i/items.length*100}%"></i></div><span>${i+1} / ${items.length}</span></div>
      ${opt.notes&&i===0?notesHTML(opt.notes):""}
      <div class="card" id="cd"><div class="kind">${KIND[it.k]}</div>${body(it)}<div id="fb"></div><div class="actions"><span class="kh" id="kh"><kbd>Enter</kbd> 키로도 확인</span><button class="btn primary" id="ck">확인</button></div></div>`;
    $("#bk").onclick=home; bind(it);
    $("#ck").onclick=()=>{ const r=grade(it); if(r===null) return toast("답을 먼저 골라 주세요");
      if(r.ok) right++; else wrongs.push(it);
      if(opt.wrongMode){ if(r.ok) delete ST.wrong[wkey(it)]; save() }
      else if(!r.ok){ ST.wrong[wkey(it)]={item:it,tag:opt.tag}; save() }
      $("#fb").innerHTML=`<div class="fb ${r.ok?"good":"bad"}">${r.ok?"⭕ 정답이에요!":"❌ 아쉬워요"}${r.ok?"":`<span class="key">정답: ${esc(r.key)}</span>`}<span class="why">${esc(it.e)}</span></div>`;
      $("#cd").querySelectorAll("button:not(#ck),input").forEach(x=>{ if(x.tagName==="INPUT") x.readOnly=true; else x.disabled=true });
      const ck=$("#ck"); ck.textContent=i+1<items.length?"다음 문제":"결과 보기"; $("#kh").innerHTML="<kbd>Enter</kbd> 키로 다음"; ck.onclick=()=>{i++;view()}; ck.focus() };
    const first=$("#cd input"); if(first) first.focus();
  }
  function result(){
    const sc=Math.round(right/items.length*100), pass=sc>=opt.target;
    if(opt.key){ const old=ST.done[opt.key]; ST.done[opt.key]={pass:(old&&old.pass)||pass?1:0,best:Math.max(sc,old?old.best:0)}; save(); if(pass&&!(old&&old.pass)) award(opt.key, opt.title.split(" · ").pop()) }
    $("#app").innerHTML = `<div class="top q"><button class="btn sm" id="bk">← 목록</button><span class="sp"></span><b>${esc(opt.title)}</b></div>
      <div class="card result"><div class="score ${pass?"pass":""}">${sc}<span style="font-size:24px">점</span></div>
      <div>${right} / ${items.length} 정답 · 목표 ${opt.target}점 <span class="pill ${pass?"pass":"fail"}">${pass?"통과":"다시 도전"}</span></div>
      ${wrongs.length?`<div class="wlist"><b>틀린 문제 (누적 오답에 담겼어요)</b>${wrongs.map(w=>`<div>${esc(plain(w))}</div>`).join("")}</div>`:""}
      <div class="actions" style="justify-content:center;flex-wrap:wrap">${wrongs.length?'<button class="btn" id="rw">틀린 문제만 다시</button>':""}<button class="btn" id="ra">처음부터 다시</button><button class="btn primary" id="go">목록으로</button></div><span class="kh"><kbd>Enter</kbd> 키로 목록으로</span></div>`;
    $("#bk").onclick=home; $("#go").onclick=home; $("#ra").onclick=()=>runSet(items,opt);
    if(wrongs.length) $("#rw").onclick=()=>runSet(wrongs,{...opt,key:null,title:opt.title+" · 틀린 문제"});
  }
  view();
}
const wkey = it => it.k+"|"+(it.q||"")+"|"+(it.s?it.s.length:"");
function plain(it){ return it.k==="m12"?it.q:it.q.replace(/\[([^\]]+)\]/g,(m,a)=>"["+a.replace(/\*/g,"")+"]").replace(/\(([^)]+)\)/g,(m,a)=>/[a-z]/i.test(a)&&!/[가-힣]/.test(a)?"(  )":m) }
function notesHTML(n){ return `<div class="notes"><h3>핵심 정리</h3><div class="tblw"><table>${n.table.map((r,k)=>"<tr>"+r.map(c=>k?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")+"</tr>").join("")}</table></div>${n.tips?`<ul class="tips">${n.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div>` }
function isEnBlank(a){ return !/[가-힣]/.test(a) }
const typing = it => it.k==="bl"||it.k==="fx"||it.k==="wr";
/* Enter = 확인 / 다음 (글자 칸 안의 Enter는 각 칸이 처리) */
document.addEventListener("keydown",e=>{
  if(e.isComposing||e.repeat||e.key!=="Enter") return;
  const a=document.activeElement, inText=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
  if(inText) return;
  const b=document.querySelector("#ck")||document.querySelector("#nx:not(:disabled)")||document.querySelector("#go");
  if(!b||b.disabled) return; e.preventDefault(); b.click();
},true);
function body(it){
  const k=it.k;
  if(k==="pk"){ let n=0; return `<div class="qtext en">${esc(it.q).replace(/\[([^\]]+)\]/g,(m,a)=>`<span data-pk="${n++}">`+a.split("/").map(x=>`<button class="chip" data-v="${esc(x.replace("*",""))}" data-r="${x.includes("*")?1:0}">${esc(x.replace("*",""))}</button>`).join("")+"</span>")}</div>` }
  if(k==="bl"){ const mk=it.q.match(/^([^()]*[가-힣][^()]*?)\s*→\s*(.+)$/); if(mk) return `<div class="qko">${esc(mk[1])}</div>`+body({...it,q:mk[2]});
    return `<div class="qtext en">${esc(it.q).replace(/\(([^)]+)\)/g,(m,a)=>isEnBlank(a)?`<input class="blank" data-a="${esc(a)}" aria-label="빈칸" autocomplete="off" autocapitalize="off" spellcheck="false">`:m)}</div>` }
  if(k==="fx"){ return `<div class="muted" style="font-size:14px">틀린 단어를 눌러 고르고, 바르게 고쳐 쓰세요.</div><div class="qtext en">${it.q.split(" ").map((w,j)=>`<button class="tok" data-j="${j}">${esc(w)}</button>`).join("")}</div><div class="fxrow"><input class="inp" id="fxin" placeholder="바르게 고친 말" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn sm" id="fxdel" type="button">이 단어 빼기</button></div>` }
  if(k==="ch"){ const parts=it.q.split("\n"); return `<div class="qtext">${esc(parts[0])}</div>${parts.length>1?`<div class="notes" style="margin:0"><div style="white-space:pre-line" class="en">${esc(parts.slice(1).join("\n"))}</div></div>`:""}<div class="choices">${it.o.map((o,j)=>`<button class="choice" data-j="${j}"><span class="n">${"①②③④⑤"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>` }
  if(k==="ox"){ return `<div class="qtext en">${esc(it.q)}</div><div class="muted" style="font-size:14px">어법과 내용이 맞으면 O, 틀리면 X</div><div class="ox"><button data-v="1" aria-label="O">O</button><button data-v="0" aria-label="X">X</button></div>` }
  if(k==="or"){ return `<div class="qtext">${esc(it.q)}</div><div class="ans" id="orans"></div><div id="orpool">${shuffle(it.a.split(" ")).map((w,j)=>`<button class="tok" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div><div class="actions" style="justify-content:flex-start"><button class="btn sm ghost" id="orclr">다시 놓기</button></div>` }
  if(k==="wr"){ return `<div class="qtext">${esc(it.q)}</div><input class="inp" id="wrin" placeholder="영어 문장을 쓰세요" autocomplete="off" autocapitalize="off" spellcheck="false">` }
  if(k==="m12"){ return `<div class="qtext">${esc(it.q)}</div><div class="m12">${it.s.map((s,j)=>`<button class="choice" data-j="${j}"><span class="n">${"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛ"[j]}</span><span class="en">${esc(s[0])}</span></button>`).join("")}</div>` }
}
function bind(it){
  const cd=$("#cd"), k=it.k;
  if(k==="pk") cd.querySelectorAll("[data-pk]").forEach(g=>g.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on")}));
  if(k==="fx"){ cd.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{cd.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");$("#fxin").focus()});
    $("#fxdel").onclick=()=>{ $("#fxin").value="(삭제)"; } }
  if(k==="ch"||k==="m12") cd.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{ if(k==="ch") cd.querySelectorAll(".choice").forEach(x=>x.classList.remove("on")); c.classList.toggle("on") });
  if(k==="ox") cd.querySelectorAll(".ox button").forEach(b=>b.onclick=()=>{cd.querySelectorAll(".ox button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
  if(k==="or"){ const pool=$("#orpool"),ans=$("#orans");
    pool.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{ if(t.classList.contains("used")) return; t.classList.add("used"); const b=document.createElement("button"); b.className="tok"; b.textContent=t.dataset.w; b.dataset.w=t.dataset.w; b.onclick=()=>{b.remove();t.classList.remove("used")}; ans.appendChild(b) });
    $("#orclr").onclick=()=>{ans.innerHTML="";pool.querySelectorAll(".tok").forEach(t=>t.classList.remove("used"))} }
  cd.querySelectorAll("input").forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#ck").click() } }));
}
function grade(it){
  const cd=$("#cd"), k=it.k;
  if(k==="pk"){ const gs=[...cd.querySelectorAll("[data-pk]")]; if(gs.some(g=>!g.querySelector(".on"))) return null; let ok=true;
    gs.forEach(g=>g.querySelectorAll(".chip").forEach(c=>{ if(c.dataset.r==="1") c.classList.add("right"); if(c.classList.contains("on")&&c.dataset.r!=="1"){c.classList.add("wrong");ok=false} }));
    return {ok,key:gs.map(g=>g.querySelector('[data-r="1"]').dataset.v).join(", ")} }
  if(k==="bl"){ const ins=[...cd.querySelectorAll("input.blank")]; if(ins.some(x=>!x.value.trim())) return null; let ok=true;
    ins.forEach(x=>{ const r=same(x.value,x.dataset.a.split("|")); x.classList.add(r?"ok":"no"); if(!r) ok=false });
    return {ok,key:ins.map(x=>x.dataset.a.split("|")[0]).join(", ")} }
  if(k==="fx"){ const sel=cd.querySelector(".tok.sel"), v=$("#fxin").value.trim(); if(!sel||!v) return null;
    const toks=it.q.split(" "), wi=toks.findIndex(t=>norm(t.replace(/[,.!?]+$/,""))===norm(it.w)); const okW=+sel.dataset.j===wi, DEL=/^\(?(삭제|빼기|x|-)\)?$/i, okA=it.a.includes("(삭제)")?DEL.test(v.trim()):same(v,it.a);
    cd.querySelector(`.tok[data-j="${wi}"]`).classList.add("sel");
    return {ok:okW&&okA,key:it.a[0]==="(삭제)"?`${it.w} → 빼기`:`${it.w} → ${it.a[0]}`} }
  if(k==="ch"){ const on=cd.querySelector(".choice.on"); if(!on) return null; const j=+on.dataset.j;
    cd.querySelector(`.choice[data-j="${it.a}"]`).classList.add("right"); if(j!==it.a) on.classList.add("wrong");
    return {ok:j===it.a,key:"①②③④⑤"[it.a]+" "+it.o[it.a]} }
  if(k==="ox"){ const on=cd.querySelector(".ox .on"); if(!on) return null; const v=on.dataset.v==="1"; return {ok:v===it.a,key:it.a?"O":"X"} }
  if(k==="or"){ const ws=[...$("#orans").querySelectorAll(".tok")].map(t=>t.dataset.w); if(!ws.length) return null; return {ok:ws.join(" ")===it.a,key:it.a} }
  if(k==="wr"){ const v=$("#wrin").value.trim(); if(!v) return null; return {ok:same(v,it.a),key:it.a[0]} }
  if(k==="m12"){ const on=[...cd.querySelectorAll(".choice.on")].map(c=>+c.dataset.j); const bad=it.s.map((s,j)=>s[1]?null:j).filter(x=>x!==null);
    cd.querySelectorAll(".choice").forEach(c=>{const j=+c.dataset.j; if(bad.includes(j)) c.classList.add(on.includes(j)?"right":"wrong"); else if(on.includes(j)) c.classList.add("wrong")});
    const ok=on.length===bad.length&&bad.every(j=>on.includes(j)); return {ok,key:bad.map(j=>"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛ"[j]).join(", ")} }
}
