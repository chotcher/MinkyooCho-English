ome, my sister has already eaten dinner.", false], ["He was tired because he had been working all day.", true]], "e": "ⓐ If it snows ⓔ has been ⓗ have known ⓚ had already eaten"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The museum opens at 9 every day.", true], ["I'll tell you as soon as I will hear the news.", false], ["He has lived here for ten years.", true], ["I don't know if she will come tomorrow.", true], ["She has been reading since 2 p.m.", true], ["They had been owning the farm for years.", false], ["I had never seen snow before I went to Canada.", true], ["Have you finished your homework yet?", true], ["He has broken his leg last week.", false], ["When I met her, she had been living in Seoul for a year.", true], ["We are going to have a party tonight.", true], ["Columbus has reached America in 1492.", false]], "e": "ⓑ as soon as I hear ⓕ had owned ⓘ broke ⓛ reached"}, {"k": "wr", "q": "현재완료진행으로 한 문장으로 쓰시오. He started to play the guitar two hours ago. He is still playing it.", "a": ["He has been playing the guitar for two hours.", "He's been playing the guitar for two hours.", "He has been playing the guitar for 2 hours."], "e": "지금도 계속 → has been -ing + for"}, {"k": "wr", "q": "내가 그를 만나기 전에 그는 이미 그 책을 읽었었다. (before, meet, already, read the book)", "a": ["Before I met him, he had already read the book.", "Before I met him he had already read the book.", "He had already read the book before I met him."], "e": "대과거 → had already p.p."}]}}, {"book": "hk3", "chapter": {"id": "03", "name": "조동사", "title": "해커스 중학영문법 3학년 · Chapter 3 조동사"}, "units": [{"tag": "hk3-03-1", "name": "can, may, will", "talk": [{"k": "m", "t": "Chapter 3은 **조동사**! 조동사 + **동사원형**, 3인칭 단수라도 -s ✗, 조동사 두 개 연달아 ✗ 🧩"}, {"k": "m", "t": "can: ① 능력 = be able to ② 허가 ③ 요청 Can(Could) you ~? ④ can't ~일 리 없다 / could: can의 과거, 정중한 요청, 약한 추측"}, {"k": "q", "q": "I ____ swim when I was five.", "o": ["can", "could", "may"], "a": 1, "ok": "맞아요! 과거의 능력 → could", "no": "when I was five(과거) → could"}, {"k": "m", "t": "⭐ 조동사 두 개 ✗ → will can ✗ → will be able to / must can ✗ → must [be] able to"}, {"k": "q", "q": "You will ____ speak English fluently soon.", "o": ["can", "be able to", "able to"], "a": 1, "ok": "정확해요! will 뒤 → be able to", "no": "will can ✗ → will be able to"}, {"k": "m", "t": "may: ① 허가 '~해도 된다' ② 추측 '~일지도 모른다' (might는 더 약한 추측) / will: 미래·의지, Will(Would) you ~? 요청"}, {"k": "ex", "en": "Take an umbrella. It may rain this afternoon.", "ko": "우산 가져가. 오후에 비가 올지도 몰라."}, {"k": "q", "q": "He ____ be at home. I'm not sure.", "o": ["might", "must", "can't"], "a": 0, "ok": "맞아요! 확실하지 않음 → might", "no": "I'm not sure → 약한 추측 might"}, {"k": "m", "t": "⚠️ would like + 명사 / would like **to + 동사원형** (~하고 싶다): I'd like [to] order now."}, {"k": "m", "t": "정리! **can = be able to · may/might 추측 · Could/Would you ~? 정중한 요청 · 조동사 두 개 ✗** 👍"}], "notes": {"table": [["조동사", "의미", "예"], ["can / could", "능력, 허가, 요청, 가능성", "She can play the drums. / Could you help me?"], ["be able to", "능력 (다른 조동사 뒤, 과거·미래)", "I will be able to come. / He was able to escape."], ["may / might", "허가, 약한 추측", "May I come in? / It might be true."], ["will / would", "미래, 의지, 요청", "Will you join us? / Would you pass me the salt?"], ["would like (to)", "~을 원하다, ~하고 싶다", "I'd like a glass of water. / I'd like to rest."]], "tips": ["조동사 + 동사원형 (She can sings ✗)", "조동사 두 개 연달아 ✗ → will be able to", "can't be ~일 리 없다 ↔ must be ~임에 틀림없다", "Could / Would you ~?는 Can / Will you ~?보다 공손"]}, "sets": {"workbook": [{"k": "pk", "q": "She can [play*/plays] the violin very well.", "e": "조동사 + 원형"}, {"k": "pk", "q": "He will [be able to*/can] drive next year.", "e": "will can ✗ → will be able to"}, {"k": "pk", "q": "[May*/Must] I use your phone? (허락)", "e": "허가 → May I ~?"}, {"k": "pk", "q": "I'd like [to visit*/visiting] the museum.", "e": "would like to + 원형"}, {"k": "bl", "q": "나는 어젯밤 잠을 잘 수 없었다. → I (couldn't|could not) sleep last night.", "e": "can의 과거 부정"}, {"k": "bl", "q": "그것은 사실일지도 모른다. → It (may|might) be true.", "e": "추측 → may / might"}, {"k": "bl", "q": "나에게 물 좀 가져다주시겠어요? → (Would|Could|Will|Can) you bring me some water?", "e": "요청"}, {"k": "bl", "q": "그는 그 문제를 풀 수 있었다. → He was (able) to solve the problem.", "e": "was able to"}, {"k": "fx", "q": "My sister cans speak three languages.", "w": "cans", "a": ["can"], "e": "조동사는 -s ✗"}, {"k": "fx", "q": "You will can see the stars tonight.", "w": "can", "a": ["be able to"], "e": "will be able to"}], "practiceA": [{"k": "ch", "q": "can의 의미가 나머지와 다른 것은?", "o": ["Can you ride a bike?", "She can speak Japanese.", "I can run fast.", "Can I use the bathroom?", "He can play chess."], "a": 3, "e": "④ 허가 / 나머지는 능력"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Could you turn down the music?", "He might be in his room.", "I'd like to go home.", "She will can join the team.", "May I ask you a question?"], "a": 3, "e": "④ will be able to join"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I'm not sure, but Jisu ____ be sick today.", "o": ["must", "might", "has to", "can", "would like"], "a": 1, "e": "확실하지 않은 추측 → might"}, {"k": "pk", "q": "[Would*/Do] you like some more cake?", "e": "Would you like ~?"}, {"k": "pk", "q": "We [were able to*/could able to] catch the last train.", "e": "were able to"}, {"k": "pk", "q": "He [can't*/must] be hungry. He just had a big lunch.", "e": "~일 리 없다 → can't"}, {"k": "bl", "q": "너는 다음 주에 그 책을 읽을 수 있을 것이다. → You will (be) (able) to read the book next week.", "e": "will be able to"}, {"k": "bl", "q": "저는 커피 한 잔을 원해요. → I (would) like a cup of coffee.", "e": "would like + 명사"}, {"k": "fx", "q": "May I borrowing your pen?", "w": "borrowing", "a": ["borrow"], "e": "조동사 + 원형"}, {"k": "ox", "q": "I would like to going to the beach.", "a": false, "e": "would like to go"}], "practiceB": [{"k": "wr", "q": "너는 내일 나를 도울 수 있을 거니? (will, be able to, help me tomorrow)", "a": ["Will you be able to help me tomorrow?"], "e": "Will + 주어 + be able to"}, {"k": "wr", "q": "그 이야기는 사실이 아닐지도 모른다. (may, true)", "a": ["The story may not be true.", "The story might not be true."], "e": "may not + 원형"}, {"k": "or", "q": "그는 곧 걸을 수 있을 것이다.", "a": "He will be able to walk soon.", "e": "will be able to"}, {"k": "or", "q": "창문을 좀 닫아 주시겠어요?", "a": "Would you close the window, please?", "e": "정중한 요청"}, {"k": "fx", "q": "She might comes to the party tonight.", "w": "comes", "a": ["come"], "e": "조동사 + 원형"}, {"k": "fx", "q": "I must can finish this by tomorrow.", "w": "can", "a": ["be able to"], "e": "must be able to"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Can you hear me?\nⓑ He will can win the race.\nⓒ It might snow tonight.\nⓓ I'd like to talking with you.\nⓔ She was able to pass the test.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ will be able to win / ⓓ to talk"}, {"k": "ch", "q": "다음 문장의 may와 같은 의미로 쓰인 것은?\nShe may be busy now.", "o": ["You may go home now.", "May I sit here?", "He may know the answer.", "You may use my computer.", "May I come in?"], "a": 2, "e": "추측 / 나머지는 허가"}, {"k": "bl", "q": "A: (Can|Could|May) I try this on? B: Sure. The fitting room is over there.", "e": "허가"}, {"k": "bl", "q": "어렸을 때 나는 수영을 할 수 없었다. → When I was young, I (couldn't|could not) swim.", "e": "과거 능력 부정"}]}}, {"tag": "hk3-03-2", "name": "must, should", "talk": [{"k": "m", "t": "**must**: ① 의무 '~해야 한다' (= have to) ② 강한 추측 '~임에 틀림없다' ❗"}, {"k": "ex", "en": "She must be tired. She worked all night.", "ko": "그녀는 피곤한 게 틀림없다. 밤새 일했다."}, {"k": "m", "t": "must는 과거·미래형이 없어요 → 과거 [had] to, 미래 will have to"}, {"k": "q", "q": "We ____ wait in line for two hours yesterday.", "o": ["must", "had to", "have to"], "a": 1, "ok": "맞아요! 과거의 의무 → had to", "no": "yesterday → had to"}, {"k": "m", "t": "⚠️ must not ~하면 안 된다(금지) / don't have to ~할 필요 없다(= don't need to, need not) · 강한 추측의 반대는 can't(~일 리 없다)"}, {"k": "q", "q": "You ____ bring lunch. We'll provide it.", "o": ["must not", "don't have to", "can't"], "a": 1, "ok": "정확해요! 준비해 준다 → 가져올 필요 없음", "no": "'~할 필요 없다' → don't have to"}, {"k": "m", "t": "**should** = **ought to** '~해야 한다(충고·의무)' / 부정: should not, ought [not] to"}, {"k": "m", "t": "**had better** + 원형 '~하는 게 낫다(강한 충고)' / 부정은 **had better not** + 원형"}, {"k": "q", "q": "You'd better ____ late again.", "o": ["not be", "don't be", "not to be"], "a": 0, "ok": "맞아요! had better not + 원형", "no": "had better not + 동사원형 → not be"}, {"k": "m", "t": "정리! **must = have to / must not 금지 ≠ don't have to 불필요 / ought not to · had better not** 👍"}], "notes": {"table": [["표현", "의미", "부정"], ["must / have to", "~해야 한다", "must not 금지 / don't have to 불필요"], ["must", "~임에 틀림없다", "can't ~일 리 없다"], ["should / ought to", "~해야 한다(충고)", "should not / ought not to"], ["had better", "~하는 게 낫다", "had better not"]], "tips": ["had to(과거), will have to(미래)", "ought to의 부정: ought not to (ought to not ✗)", "had better not + 원형 (had not better ✗, had better not to ✗)", "don't have to = don't need to = need not"]}, "sets": {"workbook": [{"k": "pk", "q": "You [must not*/don't have to] cross the street on a red light.", "e": "금지 → must not"}, {"k": "pk", "q": "He [had to*/must] finish the report last night.", "e": "과거 → had to"}, {"k": "pk", "q": "You ought [not to*/to not] eat too much sugar.", "e": "ought not to"}, {"k": "pk", "q": "You'd better [not go*/don't go] out tonight.", "e": "had better not + 원형"}, {"k": "bl", "q": "그녀는 아픈 게 틀림없다. → She (must) be sick.", "e": "강한 추측"}, {"k": "bl", "q": "그것은 사실일 리가 없다. → It (can't|cannot) be true.", "e": "~일 리 없다"}, {"k": "bl", "q": "너는 내일 일찍 일어날 필요가 없다. → You (don't) (have) to get up early tomorrow.", "e": "불필요"}, {"k": "bl", "q": "너는 선생님께 사과해야 한다. → You (ought) to apologize to your teacher.", "e": "ought to"}, {"k": "fx", "q": "She has to wears a uniform at school.", "w": "wears", "a": ["wear"], "e": "has to + 원형"}, {"k": "fx", "q": "You had better not to be late.", "w": "to", "a": ["(삭제)"], "e": "had better not + 원형"}], "practiceA": [{"k": "ch", "q": "must의 의미가 나머지와 다른 것은?", "o": ["You must wear a seat belt.", "We must save energy.", "He must be a doctor.", "Students must be quiet in the library.", "I must finish this today."], "a": 2, "e": "③ 강한 추측 / 나머지는 의무"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He just ate a big pizza. He ____ be hungry.", "o": ["must", "can't", "has to", "should", "had better"], "a": 1, "e": "~일 리 없다 → can't"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You ought not to tell lies.", "She had to stay home yesterday.", "You had better take a rest.", "We will must leave early.", "He doesn't have to work on Sundays."], "a": 3, "e": "④ will have to leave"}, {"k": "pk", "q": "It's a holiday. You [don't have to*/must not] go to school.", "e": "불필요 → don't have to"}, {"k": "pk", "q": "Someone is knocking. It [must*/can't] be Tom. He said he would come at 5.", "e": "강한 추측 → must"}, {"k": "pk", "q": "You [will have to*/will must] study harder next year.", "e": "미래 → will have to"}, {"k": "bl", "q": "그는 어제 그의 숙제를 끝내야 했다. → He (had) to finish his homework yesterday.", "e": "과거 → had to"}, {"k": "bl", "q": "너는 그 개에게 먹이를 주지 않는 게 좋겠다. → You had better (not) feed the dog.", "e": "had better not"}, {"k": "fx", "q": "You don't have to touching the screen.", "w": "touching", "a": ["touch"], "e": "have to + 원형"}, {"k": "ox", "q": "You ought to not waste water.", "a": false, "e": "ought not to waste"}], "practiceB": [{"k": "wr", "q": "너는 오늘 밤에 외출하지 않는 게 좋겠다. (had better, go out, tonight)", "a": ["You had better not go out tonight.", "You'd better not go out tonight."], "e": "had better not + 원형"}, {"k": "wr", "q": "그가 그 사고에 대해 알 리가 없다. (can't, know about the accident)", "a": ["He can't know about the accident.", "He cannot know about the accident."], "e": "can't + 원형"}, {"k": "or", "q": "너는 그 질문에 대답할 필요가 없다.", "a": "You don't have to answer the question.", "e": "불필요"}, {"k": "or", "q": "우리는 다른 사람들을 비웃어서는 안 된다.", "a": "We must not laugh at others.", "e": "금지"}, {"k": "fx", "q": "We will must clean the classroom tomorrow.", "w": "must", "a": ["have to"], "e": "will have to"}, {"k": "fx", "q": "He must is a famous singer.", "w": "is", "a": ["be"], "e": "must + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ You must not tell anyone.\nⓑ She has to goes to bed early.\nⓒ We ought not to waste time.\nⓓ You'd better not to buy it.\nⓔ I had to wait for an hour.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ has to go / ⓓ had better not buy"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nYou don't need to bring your laptop.\n= You ____ bring your laptop.", "o": ["must not", "don't have to", "can't", "ought not to", "had better not"], "a": 1, "e": "don't need to = don't have to"}, {"k": "bl", "q": "A: Do I have to pay now? B: No, you (don't). You can pay later.", "e": "Do I have to ~? → No, you don't."}, {"k": "bl", "q": "A: Is that Mr. Lee over there? B: It (can't|cannot) be him. He is in Busan now.", "e": "~일 리 없다"}]}}, {"tag": "hk3-03-3", "name": "should의 생략", "talk": [{"k": "m", "t": "⭐ 중3 새 포인트! **주장·요구·명령·제안** 동사(insist, demand, require, order, suggest, recommend, propose, request) 뒤 that절에서는 **(should) + 동사원형** 💡"}, {"k": "ex", "en": "The doctor suggested that he get more sleep.", "ko": "의사는 그가 잠을 더 자야 한다고 제안했다. (= that he should get)"}, {"k": "m", "t": "should를 생략해도 동사는 **원형**! 주어가 3인칭 단수여도, 주절이 과거여도 그대로: She insisted that he [stay] home."}, {"k": "q", "q": "The teacher demanded that every student ____ the rules.", "o": ["follow", "follows", "followed"], "a": 0, "ok": "맞아요! (should) + 원형", "no": "요구 동사 demand → (should) follow"}, {"k": "m", "t": "**이성적 판단 형용사**도 마찬가지: It is important / necessary / essential that + 주어 + (should) 원형"}, {"k": "q", "q": "It is necessary that he ____ the form today.", "o": ["submit", "submits", "submitted"], "a": 0, "ok": "정확해요! necessary that → (should) 원형", "no": "이성적 판단 → (should) submit"}, {"k": "m", "t": "⚠️ insist가 '(사실이라고) 주장하다', suggest가 '암시하다·보여 주다'일 때는 해야 할 일이 아니라 **사실**이라서 시제를 맞춰 써요: He insisted that he [had] seen a UFO."}, {"k": "q", "q": "His red face suggested that he ____ angry.", "o": ["be", "was", "should be"], "a": 1, "ok": "맞아요! '암시하다' → 시제대로 was", "no": "얼굴이 화난 상태를 보여 줌(사실) → was"}, {"k": "m", "t": "정리! **주장·요구·명령·제안 + that + 주어 + (should) 원형 · 단, 사실 주장·암시면 시제대로** 👍"}], "notes": {"table": [["구분", "형태", "예"], ["주장·요구·명령·제안 동사", "insist / demand / order / suggest / recommend / require + that + 주어 + (should) 동사원형", "They demanded that he (should) pay the money back."], ["이성적 판단 형용사", "It is important / necessary / essential that + 주어 + (should) 동사원형", "It is important that she (should) arrive on time."], ["예외: 사실 주장", "insist that + 주어 + 시제 맞춘 동사", "She insisted that she had locked the door."], ["예외: 암시하다", "suggest that + 주어 + 시제 맞춘 동사", "The results suggest that the plan works."]], "tips": ["should를 빼도 동사는 원형 (3인칭 단수 -s ✗, 과거형 ✗)", "부정은 (should) not + 원형: He suggested that we not go.", "insist가 '사실'을 주장, suggest가 '암시'면 should ✗ → 시제대로"]}, "sets": {"workbook": [{"k": "pk", "q": "She suggested that we [go*/went] to the beach.", "e": "제안 → (should) 원형"}, {"k": "pk", "q": "The coach insisted that every player [arrive*/arrives] by 8 a.m.", "e": "주장(당위) → (should) 원형"}, {"k": "pk", "q": "It is important that he [take*/takes] the medicine every day.", "e": "이성적 판단 → (should) 원형"}, {"k": "pk", "q": "My parents demanded that I [should come*/came] home by ten.", "e": "요구 → should + 원형"}, {"k": "bl", "q": "선생님은 우리가 매일 책을 읽어야 한다고 제안하셨다. → The teacher suggested that we (should) read books every day.", "e": "should + 원형"}, {"k": "bl", "q": "의사는 그가 담배를 끊어야 한다고 권했다. → The doctor recommended that he (stop|quit|should stop|should quit) smoking.", "e": "(should) + 원형"}, {"k": "bl", "q": "그녀는 그가 즉시 떠나야 한다고 요구했다. → She demanded that he (leave|should leave) at once.", "e": "(should) + 원형"}, {"k": "bl", "q": "모든 학생이 그 수업에 참석하는 것이 필요하다. → It is necessary that every student (attend|should attend) the class.", "e": "(should) + 원형"}, {"k": "fx", "q": "He insisted that his son studies harder.", "w": "studies", "a": ["study", "should study"], "e": "주장(당위) → (should) study"}, {"k": "fx", "q": "The manager ordered that the workers wore helmets.", "w": "wore", "a": ["wear", "should wear"], "e": "명령 → (should) wear"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The police officer ordered that the driver ____ his car.", "o": ["stop", "stops", "stopped", "stopping", "to stop"], "a": 0, "e": "명령 → (should) stop"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I suggested that she see a doctor.", "It is essential that he be on time.", "My friend suggested that I joined the club.", "Mom recommended that I wear a coat.", "The rules require that you show your ID."], "a": 2, "e": "③ (should) join"}, {"k": "ch", "q": "빈칸에 should가 들어갈 수 없는 것은?", "o": ["She suggested that we ____ take a taxi.", "It is important that you ____ get enough sleep.", "He demanded that I ____ return the money.", "He insisted that he ____ seen the man before.", "The teacher insisted that we ____ do our best."], "a": 3, "e": "④ 사실 주장 → had seen"}, {"k": "pk", "q": "His smile suggested that he [was*/be] happy with the result.", "e": "암시하다 → 시제대로"}, {"k": "pk", "q": "She insisted that she [had paid*/pay] the bill already.", "e": "사실 주장 → 시제대로"}, {"k": "pk", "q": "It is necessary that everyone [wear*/wears] a mask here.", "e": "이성적 판단 → (should) 원형"}, {"k": "bl", "q": "그는 우리가 그 계획에 대해 다시 생각해야 한다고 제안했다. → He proposed that we (think|should think) about the plan again.", "e": "(should) + 원형"}, {"k": "bl", "q": "그녀는 자신이 그 창문을 깨지 않았다고 주장했다. → She insisted that she (hadn't|had not) broken the window.", "e": "사실 주장 → had p.p."}, {"k": "fx", "q": "The doctor advised that she eats less salt.", "w": "eats", "a": ["eat", "should eat"], "e": "충고 → (should) eat"}, {"k": "ox", "q": "It is essential that she knows the truth.", "a": false, "e": "(should) know"}], "practiceB": [{"k": "wr", "q": "선생님은 우리가 큰 소리로 읽어야 한다고 주장하셨다. (insist, read aloud)", "a": ["The teacher insisted that we should read aloud.", "The teacher insisted that we read aloud.", "The teacher insisted we read aloud.", "The teacher insisted we should read aloud."], "e": "(should) + 원형"}, {"k": "wr", "q": "그가 그 회의에 참석하는 것이 중요하다. (It is important that, attend the meeting)", "a": ["It is important that he attend the meeting.", "It is important that he should attend the meeting."], "e": "(should) + 원형"}, {"k": "or", "q": "엄마는 내가 일찍 자야 한다고 요구하셨다.", "a": "Mom demanded that I go to bed early.", "e": "요구 → 원형"}, {"k": "or", "q": "그 결과는 그 계획이 효과가 있었다는 것을 보여 주었다.", "a": "The result suggested that the plan worked.", "e": "암시 → 시제대로"}, {"k": "fx", "q": "My father suggested that my brother takes the bus.", "w": "takes", "a": ["take", "should take"], "e": "제안 → (should) take"}, {"k": "fx", "q": "He insisted that he see the thief last night.", "w": "see", "a": ["saw", "had seen"], "e": "사실 주장 + last night → saw"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She suggested that we leave early.\nⓑ It is necessary that he finishes it today.\nⓒ They demanded that he apologize.\nⓓ He insisted that he had done nothing wrong.\nⓔ The judge ordered that the man paid a fine.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ (should) finish / ⓔ (should) pay"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• The coach suggested that Mina ____ more.\n• Her pale face suggested that she ____ sick.", "o": ["practice – be", "practice – was", "practiced – was", "practices – be", "practiced – be"], "a": 1, "e": "제안 → 원형 / 암시 → 시제대로"}, {"k": "bl", "q": "A: What did the doctor say? B: He recommended that I (rest|should rest) for a few days.", "e": "(should) + 원형"}, {"k": "bl", "q": "그 규칙은 모든 방문객이 신분증을 보여 줄 것을 요구한다. → The rule requires that every visitor (show|should show) an ID card.", "e": "(should) + 원형"}]}}, {"tag": "hk3-03-4", "name": "used to, would", "talk": [{"k": "m", "t": "**used to** + 동사원형: (과거에) ~하곤 했다 / (예전에) ~이었다 — **지금은 아님** 🕰️"}, {"k": "ex", "en": "There used to be a big tree here.", "ko": "예전에 여기에 큰 나무가 있었다. (지금은 없음)"}, {"k": "m", "t": "**would** + 동사원형: ~하곤 했다 → **동작**(반복 행동)만 ○, **상태**(be, have, live, like 등)는 ✗"}, {"k": "q", "q": "I ____ have long hair when I was a child.", "o": ["used to", "would", "use to"], "a": 0, "ok": "맞아요! 상태(have) → used to", "no": "have(가지다)는 상태 → would ✗ → used to"}, {"k": "m", "t": "부정: didn't use to / 의문: Did + 주어 + use to ~? — did 뒤에는 [use]"}, {"k": "q", "q": "____ you use to live in Daegu?", "o": ["Did", "Were", "Used"], "a": 0, "ok": "정확해요! Did + 주어 + use to", "no": "의문문 → Did you use to ~?"}, {"k": "m", "t": "⚠️ 헷갈리는 짝! **be used to + -ing(명사)** ~에 익숙하다 / **be used to + 동사원형** ~하는 데 사용되다"}, {"k": "ex", "en": "I'm used to getting up early.", "ko": "나는 일찍 일어나는 데 익숙하다."}, {"k": "q", "q": "This knife is used to ____ bread.", "o": ["cut", "cutting", "cuts"], "a": 0, "ok": "맞아요! ~하는 데 사용되다 → 원형", "no": "칼이 빵을 자르는 데 사용됨 → be used to + 원형 cut"}, {"k": "m", "t": "정리! **used to 동작·상태 / would 동작만 / be used to -ing 익숙 / be used to 원형 사용됨** 👍"}], "notes": {"table": [["표현", "의미", "예"], ["used to + 원형", "~하곤 했다(동작) / ~이었다(상태)", "He used to be shy."], ["would + 원형", "~하곤 했다(동작만)", "We would play in the river every summer."], ["be used to + -ing(명사)", "~에 익숙하다", "She is used to living alone."], ["be used to + 원형", "~하는 데 사용되다", "Wood is used to make paper."], ["부정 / 의문", "didn't use to / Did ~ use to?", "I didn't use to like fish."]], "tips": ["would는 상태 동사(be, have, live, like, know)와 ✗", "Did ~ use to (Did ~ used to ✗)", "get used to -ing: ~에 익숙해지다"]}, "sets": {"workbook": [{"k": "pk", "q": "My dad [used to*/would] be a soccer player.", "e": "상태(be) → used to"}, {"k": "pk", "q": "I'm used to [eating*/eat] spicy food.", "e": "익숙하다 → -ing"}, {"k": "pk", "q": "Did you [use*/used] to play the piano?", "e": "Did + use to"}, {"k": "pk", "q": "This machine is used to [make*/making] ice cream.", "e": "사용되다 → 원형"}, {"k": "bl", "q": "예전에 이 근처에 극장이 있었다. → There (used) to be a theater near here.", "e": "used to be"}, {"k": "bl", "q": "우리는 주말마다 할머니 댁을 방문하곤 했다. (조동사 하나) → We (would) visit our grandma every weekend.", "e": "동작 반복 → would"}, {"k": "bl", "q": "그녀는 혼자 사는 데 익숙하다. → She is used to (living) alone.", "e": "be used to + -ing"}, {"k": "bl", "q": "나는 예전에 고기를 좋아하지 않았다. → I (didn't|did not) use to like meat.", "e": "didn't use to"}, {"k": "fx", "q": "He would be very thin when he was young.", "w": "would", "a": ["used to"], "e": "상태(be) → used to"}, {"k": "fx", "q": "I am used to drive on the left.", "w": "drive", "a": ["driving"], "e": "익숙하다 → -ing"}], "practiceA": [{"k": "ch", "q": "빈칸에 would가 들어갈 수 없는 것은?", "o": ["When I was young, I ____ go fishing with my dad.", "He ____ read comics every night.", "We ____ take a walk after dinner.", "My grandma ____ have a cat named Nabi.", "They ____ play hide-and-seek."], "a": 3, "e": "④ have(소유)는 상태 → used to"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She used to wear glasses.", "Did he use to live here?", "I'm used to sleeping late.", "This tool is used to fix bikes.", "There would be a bakery on the corner."], "a": 4, "e": "⑤ There used to be"}, {"k": "ch", "q": "다음 문장과 의미가 가장 가까운 것은?\nI used to go jogging every morning, but I don't anymore.", "o": ["I go jogging every morning.", "I went jogging every morning, and I still do.", "I would go jogging every morning.", "I am used to jogging every morning.", "I get used to jogging every morning."], "a": 2, "e": "과거의 반복 동작 → would go"}, {"k": "pk", "q": "He [used to*/is used to] live in Canada, but now he lives in Seoul.", "e": "과거 상태 → used to + 원형"}, {"k": "pk", "q": "Junho [is used to*/used to] working with computers.", "e": "-ing → be used to"}, {"k": "pk", "q": "My mom [would*/used] tell me stories at bedtime.", "e": "would + 원형"}, {"k": "bl", "q": "나는 어렸을 때 키가 작았다. → I (used) to be short when I was little.", "e": "과거 상태 → used to"}, {"k": "bl", "q": "그는 아직 새 학교에 익숙하지 않다. → He isn't (used) to his new school yet.", "e": "be used to + 명사"}, {"k": "fx", "q": "Did your father used to smoke?", "w": "used", "a": ["use"], "e": "Did + use to"}, {"k": "ox", "q": "Salt is used to keep food fresh.", "a": true, "e": "✔ ~하는 데 사용되다 → 원형"}], "practiceB": [{"k": "wr", "q": "그녀는 예전에 긴 머리였다. (used to, have long hair)", "a": ["She used to have long hair."], "e": "상태 → used to"}, {"k": "wr", "q": "나는 많은 사람들 앞에서 말하는 데 익숙하다. (be used to, speak, in front of many people)", "a": ["I am used to speaking in front of many people.", "I'm used to speaking in front of many people."], "e": "be used to + -ing"}, {"k": "or", "q": "이 상자는 오래된 책들을 보관하는 데 사용된다.", "a": "This box is used to keep old books.", "e": "be used to + 원형"}, {"k": "or", "q": "우리는 여름마다 그 강에서 수영하곤 했다.", "a": "We would swim in the river every summer.", "e": "동작 반복 → would"}, {"k": "fx", "q": "There would be a park in front of my house.", "w": "would", "a": ["used to"], "e": "상태 → used to"}, {"k": "fx", "q": "I'm not used to wake up so early.", "w": "wake", "a": ["waking"], "e": "be used to + -ing"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He used to be a teacher.\nⓑ I would have a dog when I was young.\nⓒ She is used to cooking for herself.\nⓓ Did you used to play baseball?\nⓔ This app is used to learn words.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ used to have / ⓓ use to"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• I ____ to live in Busan, but I moved to Seoul.\n• Now I am used to ____ in Seoul.", "o": ["use – live", "used – living", "used – live", "use – living", "am used – living"], "a": 1, "e": "used to + 원형 / be used to + -ing"}, {"k": "bl", "q": "A: Do you like coffee? B: Not really. I (used) to like it, but I don't anymore.", "e": "과거 상태 → used to"}, {"k": "bl", "q": "A: Isn't it hard to get up at 6? B: No. I'm (used) to (getting|waking) up early.", "e": "be used to + -ing"}]}}, {"tag": "hk3-03-5", "name": "조동사 + have + p.p.", "talk": [{"k": "m", "t": "⭐ 중3 핵심! **조동사 + have + p.p.** = **과거**에 대한 추측·후회 🔙"}, {"k": "m", "t": "**must have p.p.** ~했음에 틀림없다 / **can't have p.p.** ~했을 리가 없다 / **may(might) have p.p.** ~했을지도 모른다"}, {"k": "ex", "en": "The ground is wet. It must have rained last night.", "ko": "땅이 젖어 있다. 어젯밤에 비가 왔음에 틀림없다."}, {"k": "q", "q": "He looks so happy. He ____ the test.", "o": ["must have passed", "can't have passed", "should have passed"], "a": 0, "ok": "맞아요! 틀림없이 합격했다 → must have p.p.", "no": "행복해 보임 → 합격했음에 틀림없다 → must have passed"}, {"k": "q", "q": "She ____ the cake. She was in Paris at that time.", "o": ["must have made", "can't have made", "should have made"], "a": 1, "ok": "정확해요! 파리에 있었으니 ~했을 리 없다", "no": "그때 파리에 있었음 → can't have made"}, {"k": "m", "t": "**should have p.p.** ~했어야 했는데 (안 했다 → 후회·유감) / **shouldn't have p.p.** ~하지 말았어야 했는데 (했다)"}, {"k": "ex", "en": "I should have listened to my mom.", "ko": "엄마 말씀을 들었어야 했는데. (안 들었다)"}, {"k": "q", "q": "I'm so full. I ____ so much.", "o": ["should have eaten", "shouldn't have eaten", "must have eaten"], "a": 1, "ok": "맞아요! 너무 많이 먹은 것을 후회", "no": "배불러서 후회 → 먹지 말았어야 했는데 → shouldn't have eaten"}, {"k": "m", "t": "⚠️ 형태 주의: 조동사 + **have**(has ✗) + p.p. → She must [have] left. / could have p.p. ~할 수도 있었는데 (안 했다)"}, {"k": "m", "t": "정리! **must have p.p. 틀림없이 ~했다 · can't have p.p. ~했을 리 없다 · may have p.p. ~했을지도 · should have p.p. ~했어야 했는데** 👍"}], "notes": {"table": [["형태", "의미", "예"], ["must have p.p.", "~했음에 틀림없다 (강한 확신)", "He must have been tired."], ["can't have p.p.", "~했을 리가 없다", "She can't have said that."], ["may / might have p.p.", "~했을지도 모른다", "I may have left it at home."], ["should have p.p.", "~했어야 했는데 (안 함)", "You should have called me."], ["shouldn't have p.p.", "~하지 말았어야 했는데 (함)", "I shouldn't have said that."], ["could have p.p.", "~할 수도 있었는데 (안 함)", "We could have won the game."]], "tips": ["주어가 3인칭 단수여도 have (has ✗)", "현재 추측 must be ↔ 과거 추측 must have been", "can't have p.p. = couldn't have p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "She didn't answer. She [must have been*/must be] asleep then.", "e": "과거 추측 → must have been"}, {"k": "pk", "q": "He [can't have*/must have] seen me. I was hiding behind the door.", "e": "숨어 있었음 → can't have p.p."}, {"k": "pk", "q": "You [should have*/must have] told me earlier. Now it's too late.", "e": "후회 → should have p.p."}, {"k": "pk", "q": "Tom must have [left*/leave] already. His bag is gone.", "e": "have + p.p."}, {"k": "bl", "q": "그는 그 소식을 들었을지도 모른다. → He (may|might) (have) heard the news.", "e": "may have p.p."}, {"k": "bl", "q": "나는 더 열심히 공부했어야 했는데. → I (should) (have) studied harder.", "e": "should have p.p."}, {"k": "bl", "q": "그녀가 그 창문을 깼을 리가 없다. → She (can't|cannot|couldn't) have broken the window.", "e": "can't have p.p."}, {"k": "bl", "q": "너는 그에게 거짓말하지 말았어야 했다. → You (shouldn't|should not) have lied to him.", "e": "shouldn't have p.p."}, {"k": "fx", "q": "He must has forgotten my birthday.", "w": "has", "a": ["have"], "e": "조동사 + have"}, {"k": "fx", "q": "I should have bring an umbrella.", "w": "bring", "a": ["brought"], "e": "have + p.p."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The streets are all white. It ____ a lot last night.", "o": ["must snow", "must have snowed", "can't have snowed", "should have snowed", "should snow"], "a": 1, "e": "과거에 대한 강한 확신 → must have p.p."}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You should have gone to bed earlier.", "She might have missed the bus.", "He can't have done it alone.", "They must have been very busy.", "I shouldn't have eat so fast."], "a": 4, "e": "⑤ shouldn't have eaten"}, {"k": "ch", "q": "다음 문장의 의미로 알맞은 것은?\nYou should have worn a coat.", "o": ["너는 코트를 입어야 한다.", "너는 코트를 입었음에 틀림없다.", "너는 코트를 입었어야 했는데 (안 입었다).", "너는 코트를 입었을지도 모른다.", "너는 코트를 입지 말았어야 했다."], "a": 2, "e": "should have p.p. → ~했어야 했는데"}, {"k": "pk", "q": "I can't find my key. I [may have dropped*/should have dropped] it on the bus.", "e": "과거 추측 → may have p.p."}, {"k": "pk", "q": "Jake got a perfect score. He [must have studied*/can't have studied] hard.", "e": "강한 확신 → must have p.p."}, {"k": "pk", "q": "She [can't have*/must have] gone shopping. The mall was closed yesterday.", "e": "문을 닫음 → can't have p.p."}, {"k": "bl", "q": "그들은 길을 잃었음에 틀림없다. → They (must) (have) gotten lost.", "e": "must have p.p."}, {"k": "bl", "q": "우리가 그 경기를 이길 수도 있었는데. → We (could) have won the game.", "e": "could have p.p."}, {"k": "fx", "q": "You shouldn't have tell her the secret.", "w": "tell", "a": ["told"], "e": "have + p.p."}, {"k": "ox", "q": "He must be sick yesterday.", "a": false, "e": "과거 추측 → must have been"}], "practiceB": [{"k": "wr", "q": "그녀가 그 영화를 봤을 리가 없다. (can't, see the movie)", "a": ["She can't have seen the movie.", "She cannot have seen the movie.", "She couldn't have seen the movie."], "e": "can't have p.p."}, {"k": "wr", "q": "나는 그 신발을 사지 말았어야 했는데. (shouldn't, buy the shoes)", "a": ["I shouldn't have bought the shoes.", "I should not have bought the shoes."], "e": "shouldn't have p.p."}, {"k": "or", "q": "그는 버스를 놓쳤을지도 모른다.", "a": "He may have missed the bus.", "e": "may have p.p."}, {"k": "or", "q": "너는 더 일찍 출발했어야 했다.", "a": "You should have left earlier.", "e": "should have p.p."}, {"k": "fx", "q": "Mina looks sleepy. She must have stay up late.", "w": "stay", "a": ["stayed"], "e": "have + p.p."}, {"k": "fx", "q": "I might have leave my phone in the classroom.", "w": "leave", "a": ["left"], "e": "have + p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He must have been tired.\nⓑ She should have came earlier.\nⓒ They can't have finished it already.\nⓓ You shouldn't have shouted at him.\nⓔ I may has made a mistake.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ should have come / ⓔ may have made"}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: Minho didn't come to school today.\nB: He ____ sick. He was coughing a lot yesterday.", "o": ["must have gotten", "can't have gotten", "should have gotten", "shouldn't have gotten", "must get"], "a": 0, "e": "어제 기침 → 아팠음에 틀림없다"}, {"k": "bl", "q": "A: I failed the test. B: You (should) (have) studied harder.", "e": "should have p.p."}, {"k": "bl", "q": "A: Where's my wallet? B: You (may|might) have left it in the car.", "e": "may have p.p."}]}}, {"tag": "hk3-03-6", "name": "조동사 관용 표현", "talk": [{"k": "m", "t": "자주 나오는 **조동사 관용 표현**은 덩어리로 외워요 📦"}, {"k": "m", "t": "**would rather** + 원형 (than + 원형): (…하느니) 차라리 ~하겠다 / 부정은 **would rather not** + 원형"}, {"k": "ex", "en": "I would rather stay home than go out in the rain.", "ko": "빗속에 나가느니 차라리 집에 있겠다."}, {"k": "q", "q": "I'd rather ____ a taxi than walk.", "o": ["take", "to take", "taking"], "a": 0, "ok": "맞아요! would rather + 원형", "no": "would rather 뒤에는 동사원형 → take"}, {"k": "m", "t": "**may well** + 원형: ~하는 것도 당연하다 / **may as well** + 원형: ~하는 편이 낫다"}, {"k": "ex", "en": "She may well be angry. You broke her phone.", "ko": "그녀가 화를 내는 것도 당연하다. 네가 그녀의 휴대전화를 고장 냈잖아."}, {"k": "q", "q": "The bus won't come for an hour. We ____ walk.", "o": ["may well", "may as well", "would rather not"], "a": 1, "ok": "정확해요! ~하는 편이 낫다 → may as well", "no": "버스가 한 시간 뒤에 옴 → 걷는 편이 낫다 → may as well"}, {"k": "m", "t": "**cannot help -ing** = **cannot (help) but** + 원형: ~하지 않을 수 없다 / **cannot ~ too** …: 아무리 ~해도 지나치지 않다"}, {"k": "q", "q": "I couldn't help ____ when I saw his face.", "o": ["laugh", "laughing", "to laugh"], "a": 1, "ok": "맞아요! cannot help + -ing", "no": "cannot help 뒤에는 -ing → laughing"}, {"k": "m", "t": "정리! **would rather A than B · may well 당연 · may as well 편이 낫다 · cannot help -ing · cannot ~ too** 👍 🎉 Chapter 3 조동사 끝!"}], "notes": {"table": [["표현", "의미", "예"], ["would rather + 원형 (than + 원형)", "(…하느니) 차라리 ~하겠다", "I'd rather walk than wait."], ["would rather not + 원형", "차라리 ~하지 않겠다", "I'd rather not talk about it."], ["may well + 원형", "~하는 것도 당연하다", "He may well be proud of his son."], ["may as well + 원형", "~하는 편이 낫다", "You may as well go now."], ["cannot help -ing / cannot but + 원형", "~하지 않을 수 없다", "I can't help worrying. = I can't but worry."], ["cannot ~ too …", "아무리 ~해도 지나치지 않다", "You cannot be too careful."]], "tips": ["would rather 뒤는 원형 (to ✗) · than 뒤도 원형", "would rather not (wouldn't rather ✗)", "cannot help + -ing / cannot but + 원형"]}, "sets": {"workbook": [{"k": "pk", "q": "I would rather [stay*/to stay] here.", "e": "would rather + 원형"}, {"k": "pk", "q": "She couldn't help [crying*/cry] at the sad ending.", "e": "cannot help + -ing"}, {"k": "pk", "q": "The class is over. You may [as well*/rather] go home now.", "e": "~하는 편이 낫다 → may as well"}, {"k": "pk", "q": "I'd rather [not go*/don't go] to the party.", "e": "would rather not + 원형"}, {"k": "bl", "q": "그가 화가 나는 것도 당연하다. → He may (well) be upset.", "e": "may well"}, {"k": "bl", "q": "나는 그 노래를 따라 부르지 않을 수 없었다. → I couldn't help (singing) along to the song.", "e": "cannot help + -ing"}, {"k": "bl", "q": "운전할 때는 아무리 조심해도 지나치지 않다. → You cannot be (too) careful when you drive.", "e": "cannot ~ too"}, {"k": "bl", "q": "나는 패스트푸드를 먹느니 차라리 한 끼를 거르겠다. → I would rather skip a meal (than) eat fast food.", "e": "would rather A than B"}, {"k": "fx", "q": "I would rather to walk than take the bus.", "w": "to", "a": ["(삭제)"], "e": "would rather + 원형"}, {"k": "fx", "q": "We couldn't help laugh at his joke.", "w": "laugh", "a": ["laughing"], "e": "cannot help + -ing"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? It's raining hard. I'd rather ____ at home.", "o": ["stay", "to stay", "staying", "stayed", "stays"], "a": 0, "e": "would rather + 원형"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You may as well take a rest.", "She may well be tired after the long trip.", "I couldn't help smiling.", "I'd rather not eat now.", "He cannot but to accept the offer."], "a": 4, "e": "⑤ cannot but accept"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nI couldn't help falling asleep.\n= I couldn't but ____ asleep.", "o": ["fall", "falling", "to fall", "fell", "fallen"], "a": 0, "e": "cannot but + 원형"}, {"k": "pk", "q": "He worked really hard. You cannot praise him [too*/so] much.", "e": "cannot ~ too"}, {"k": "pk", "q": "I'd rather read a book [than*/to] watch TV.", "e": "would rather A than B"}, {"k": "pk", "q": "Since you're already here, you [may as well*/may well] stay for dinner.", "e": "~하는 편이 낫다 → may as well"}, {"k": "bl", "q": "그녀가 그 소식에 놀라는 것도 당연하다. → She (may) (well) be surprised at the news.", "e": "may well"}, {"k": "bl", "q": "나는 차라리 그것에 대해 말하지 않겠다. → I would rather (not) talk about it.", "e": "would rather not"}, {"k": "fx", "q": "I can't help worry about my exam.", "w": "worry", "a": ["worrying"], "e": "cannot help + -ing"}, {"k": "ox", "q": "You can't be too careful when you cross the street.", "a": true, "e": "✔ 아무리 조심해도 지나치지 않다"}], "practiceB": [{"k": "wr", "q": "나는 혼자 가느니 차라리 집에 있겠다. (would rather, stay home, than, go alone)", "a": ["I would rather stay home than go alone.", "I'd rather stay home than go alone.", "I would rather stay at home than go alone.", "I'd rather stay at home than go alone."], "e": "would rather A than B"}, {"k": "wr", "q": "나는 그를 믿지 않을 수 없었다. (can't help, believe)", "a": ["I couldn't help believing him.", "I could not help believing him."], "e": "cannot help + -ing (과거 → couldn't)"}, {"k": "or", "q": "건강에는 아무리 조심해도 지나치지 않다.", "a": "You cannot be too careful about your health.", "e": "cannot ~ too"}, {"k": "or", "q": "너는 지금 떠나는 편이 낫겠다.", "a": "You may as well leave now.", "e": "may as well"}, {"k": "fx", "q": "He would rather plays games than study.", "w": "plays", "a": ["play"], "e": "would rather + 원형"}, {"k": "fx", "q": "She may well is proud of her daughter.", "w": "is", "a": ["be"], "e": "may well + 원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'd rather not answer that question.\nⓑ She couldn't help to laugh.\nⓒ You may as well ask him.\nⓓ He cannot but admire her.\nⓔ I would rather to sleep than eat.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ laughing / ⓔ rather sleep"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• He won the prize. He may ____ be happy.\n• There's nothing to do. We may ____ go home.", "o": ["well – well", "well – as well", "as well – well", "as well – as well", "rather – well"], "a": 1, "e": "당연하다 may well / 편이 낫다 may as well"}, {"k": "bl", "q": "A: Do you want to go out? B: No, I'd (rather) stay in. I'm tired.", "e": "would rather + 원형"}, {"k": "bl", "q": "A: Why did you cry? B: The movie was so sad that I couldn't (help) crying.", "e": "cannot help + -ing"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "너는 다음 주에 그 결과를 알 수 있을 것이다. (will, be able to, know the result)", "a": ["You will be able to know the result next week.", "Next week, you will be able to know the result.", "Next week you will be able to know the result."], "e": "will be able to"}, {"k": "wr", "q": "너는 오늘 일찍 일어날 필요가 없다. (have to)", "a": ["You don't have to get up early today.", "Today, you don't have to get up early.", "Today you don't have to get up early."], "e": "불필요 → don't have to"}, {"k": "wr", "q": "의사는 그가 매일 운동해야 한다고 제안했다. (suggest, exercise every day)", "a": ["The doctor suggested that he exercise every day.", "The doctor suggested that he should exercise every day.", "The doctor suggested he exercise every day.", "The doctor suggested he should exercise every day."], "e": "제안 → (should) 원형"}, {"k": "wr", "q": "예전에 이 마을에는 작은 학교가 있었다. (used to, there, a small school, in this town)", "a": ["There used to be a small school in this town."], "e": "used to be"}, {"k": "wr", "q": "그는 그 사실을 알았음에 틀림없다. (must, know the truth)", "a": ["He must have known the truth."], "e": "must have p.p."}, {"k": "bl", "q": "I (should) (have) taken your advice. I'm sorry.", "e": "should have p.p."}, {"k": "bl", "q": "You had better (not) touch that. It's hot.", "e": "had better not"}, {"k": "fx", "q": "She would be shy when she was little.", "w": "would", "a": ["used to"], "e": "상태(be) → used to"}, {"k": "fx", "q": "It is important that he arrives on time.", "w": "arrives", "a": ["arrive", "should arrive"], "e": "이성적 판단 → (should) 원형"}, {"k": "or", "q": "나는 그 소식에 놀라지 않을 수 없었다.", "a": "I couldn't help being surprised at the news.", "e": "cannot help + -ing"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? I ____ ride a bike when I was six.", "o": ["can", "could", "may", "must", "would rather"], "a": 1, "e": "과거 능력 → could"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["You will be able to fix it.", "He must be very hungry.", "She ought not to go there.", "You had better not to stay up late.", "We don't have to hurry."], "a": 3, "e": "④ had better not stay"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• You ____ park here. It's not allowed.\n• You ____ come early. The show starts at 8.", "o": ["must not – don't have to", "don't have to – must not", "must not – must not", "can't – must", "should – don't have to"], "a": 0, "e": "금지 must not / 불필요 don't have to"}, {"k": "ch", "q": "다음 문장의 must와 의미가 같은 것은?\nHe must be a famous actor. Everyone knows him.", "o": ["You must wear a helmet.", "We must keep the rules.", "She must be tired after the trip.", "You must finish it by noon.", "I must go now."], "a": 2, "e": "강한 추측"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The teacher insisted that every student ____ a report.", "o": ["write", "writes", "wrote", "writing", "to write"], "a": 0, "e": "주장(당위) → (should) write"}, {"k": "ch", "q": "어법상 옳은 문장은?", "o": ["She suggested that he goes home.", "I would have long hair when I was young.", "He is used to drive at night.", "Did you use to live in Busan?", "It is necessary that she takes the test."], "a": 3, "e": "④ / ① go ② used to have ③ driving ⑤ take"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n• There ____ be a pond here, but it's gone.\n• This tool is used to ____ wood.", "o": ["would – cutting", "used to – cut", "used to – cutting", "would – cut", "is used to – cut"], "a": 1, "e": "상태 → used to / 사용되다 → 원형"}, {"k": "ch", "q": "다음 우리말을 영어로 바르게 옮긴 것은?\n그가 그 일을 혼자 했을 리가 없다.", "o": ["He must have done the work alone.", "He can't have done the work alone.", "He should have done the work alone.", "He may have done the work alone.", "He can't do the work alone."], "a": 1, "e": "~했을 리 없다 → can't have p.p."}, {"k": "ch", "q": "대화의 빈칸에 알맞은 것은?\nA: I'm late again. My boss is angry.\nB: You ____ earlier.", "o": ["should leave", "should have left", "must have left", "can't have left", "may have left"], "a": 1, "e": "~했어야 했는데 → should have p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'd rather not go out tonight.\nⓑ She couldn't help to cry.\nⓒ You may as well take a taxi.\nⓓ He must has lost his way.\nⓔ You cannot be too careful.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ crying / ⓓ must have lost"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? She ____ be at home now. The lights are on.", "o": ["must", "may", "might", "could", "would rather"], "a": 4, "e": "⑤ would rather는 추측 ✗"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["He will be able to come tomorrow.", true], ["She will can help us.", false], ["You don't have to bring anything.", true], ["You'd better not to eat that.", false], ["They ought not to waste food.", true], ["The coach insisted that we be on time.", true], ["My mom suggested that I took a rest.", false], ["He used to be a pilot.", true], ["I would live in Jeju when I was a kid.", false], ["I'm used to walking to school.", true], ["She must have been sick yesterday.", true], ["You should have told me the truth.", true]], "e": "ⓑ will be able to help ⓓ had better not eat ⓖ (should) take ⓘ used to live"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["May I borrowing your pen?", false], ["He must be tired. He worked all day.", true], ["It is important that he finishes it today.", false], ["She insisted that she had locked the door.", true], ["Did you use to play the violin?", true], ["This app is used to learn new words.", true], ["He can't have seen me. I was in my room.", true], ["I shouldn't have eat so much.", false], ["She may well be proud of her son.", true], ["I would rather walk than take the bus.", true], ["I couldn't help laugh at the joke.", false], ["We may as well start now.", true]], "e": "ⓐ borrow ⓒ (should) finish ⓗ shouldn't have eaten ⓚ laughing"}, {"k": "wr", "q": "같은 뜻이 되도록 조동사 + have + p.p.를 써서 쓰시오. I'm sure that he lost his wallet.", "a": ["He must have lost his wallet."], "e": "과거에 대한 확신 → must have p.p."}, {"k": "wr", "q": "나는 영화를 보느니 차라리 책을 읽겠다. (would rather, read a book, than, watch a movie)", "a": ["I would rather read a book than watch a movie.", "I'd rather read a book than watch a movie."], "e": "would rather A than B"}]}}, {"book": "hk3", "chapter": {"id": "04", "name": "수동태", "title": "해커스 중학영문법 3학년 · Chapter 4 수동태"}, "units": [{"tag": "hk3-04-1", "name": "수동태 문장 만드는 법", "talk": [{"k": "m", "t": "Chapter 4는 **수동태**! 주어가 동작을 '하는' 쪽이 아니라 '**받는**' 쪽이면 → **be동사 + p.p.** 🔄"}, {"k": "ex", "en": "Someone stole my wallet. → My wallet was stolen.", "ko": "누군가 내 지갑을 훔쳤다. → 내 지갑이 도난당했다."}, {"k": "m", "t": "만드는 법: ① 능동태의 목적어 → 주어 ② 동사 → **be + p.p.** (수·시제는 be동사가 맞춤) ③ 주어 → **by + 목적격** (막연한 사람이면 생략)"}, {"k": "q", "q": "The Mona Lisa ____ by Leonardo da Vinci.", "o": ["painted", "was painted", "was painting"], "a": 1, "ok": "맞아요! 그림은 '그려진' 것 → was painted", "no": "모나리자는 그려지는 대상 → be + p.p. → was painted"}, {"k": "m", "t": "중3 포인트 ① **능동이냐 수동이냐**는 주어와 동사의 관계로 판단! 주어가 직접 하면 능동, 당하면 수동"}, {"k": "q", "q": "My grandfather ____ this house in 1980.", "o": ["built", "was built", "is built"], "a": 0, "ok": "정확해요! 할아버지가 직접 '지은' 것 → 능동", "no": "할아버지가 집을 지었으니 능동태 → built"}, {"k": "m", "t": "② 부정문: be + **[not]** + p.p. / 의문문: **Be동사 + 주어 + p.p. ~?** / 의문사 + be동사 + 주어 + p.p.?"}, {"k": "ex", "en": "When was this temple built? — It was built in the 8th century.", "ko": "이 절은 언제 지어졌니? — 8세기에 지어졌어."}, {"k": "m", "t": "③ Who 의문문: Who invented it? → **By [whom]** was it invented? ⚠️ 부정·의문에 do, does, did ✗ / by 뒤는 목적격 (by she ✗)"}, {"k": "m", "t": "정리! **관계 판단 → be + p.p. → by + 목적격**, 부정·의문은 **be동사**로 👍"}], "notes": {"table": [["", "형태", "예"], ["긍정", "be동사 + p.p. (+ by 목적격)", "The song was written by Jun."], ["부정", "be동사 + not + p.p.", "The song wasn't written by Jun."], ["의문", "Be동사 + 주어 + p.p. ~?", "Was the song written by Jun?"], ["의문사", "의문사 + be동사 + 주어 + p.p.?", "When was the song written?"], ["Who 의문문", "By whom + be동사 + 주어 + p.p.?", "By whom was the song written?"]], "tips": ["주어가 동작을 하면 능동, 받으면 수동", "부정·의문에 do / does / did 쓰지 않음", "by people, by them, by someone은 보통 생략"]}, "sets": {"workbook": [{"k": "pk", "q": "The novel [was written*/wrote] by a teenager.", "e": "소설은 쓰여진 것 → 수동태"}, {"k": "pk", "q": "My uncle [repaired*/was repaired] the roof last week.", "e": "삼촌이 직접 고친 것 → 능동태"}, {"k": "pk", "q": "The thief was caught by [they/them*].", "e": "by + 목적격"}, {"k": "pk", "q": "[Was*/Did] the window broken by the storm?", "e": "수동태 의문문 → Be동사로 시작"}, {"k": "bl", "q": "그 노래는 전 세계에서 사랑받는다. → The song (is) loved all over the world.", "e": "단수 현재 → is"}, {"k": "bl", "q": "이 사진들은 내 삼촌이 찍었다. → These photos were (taken) by my uncle.", "e": "take – took – taken"}, {"k": "bl", "q": "그 회의는 취소되지 않았다. → The meeting (wasn't|was not) canceled.", "e": "be + not + p.p."}, {"k": "bl", "q": "Is English spoken in that country? — Yes, it (is).", "e": "be동사로 대답"}, {"k": "fx", "q": "The cookies were bake by my sister.", "w": "bake", "a": ["baked"], "e": "be + p.p. → baked"}, {"k": "fx", "q": "The song was sang by a famous singer.", "w": "sang", "a": ["sung"], "e": "sing – sang – sung"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The windows ____ every Friday.", "o": ["clean", "cleans", "are cleaned", "is cleaned", "are cleaning"], "a": 2, "e": "창문은 닦이는 것 + 복수 → are cleaned"}, {"k": "ch", "q": "Who wrote this poem?을 수동태로 바르게 바꾼 것은?", "o": ["By who was this poem written?", "By whom was this poem written?", "Who was written this poem?", "By whom this poem was written?", "Who this poem was written by?"], "a": 1, "e": "By whom + was + 주어 + p.p.?"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The museum was opened in 2010.", "My phone was stolen on the bus.", "Was the cake made by your mom?", "The players were trained by the coach.", "The bag didn't found."], "a": 4, "e": "⑤ The bag wasn't found."}, {"k": "bl", "q": "이 다리는 언제 지어졌니? → When (was) this bridge built?", "e": "의문사 + was + 주어 + p.p."}, {"k": "bl", "q": "그 문은 잠기지 않았다. → The door (wasn't|was not) locked.", "e": "be + not + p.p."}, {"k": "pk", "q": "Many trees [were planted*/planted] by the students last spring.", "e": "나무는 심어진 것"}, {"k": "pk", "q": "Where [was the car*/did the car] found?", "e": "의문사 + be + 주어 + p.p."}, {"k": "fx", "q": "Were the letter sent yesterday?", "w": "Were", "a": ["Was"], "e": "단수 주어 → Was"}, {"k": "ox", "q": "The accident was seen by many people.", "a": true, "e": "✔"}, {"k": "ox", "q": "My bag was stole yesterday.", "a": false, "e": "steal – stole – stolen → was stolen"}], "practiceB": [{"k": "wr", "q": "Did your brother break the vase? → 수동태로 바꾸시오.", "a": ["Was the vase broken by your brother?"], "e": "Was + 주어 + p.p. + by ~?"}, {"k": "wr", "q": "They don't sell stamps here. → 수동태로 바꾸시오. (by them 생략)", "a": ["Stamps aren't sold here.", "Stamps are not sold here."], "e": "be + not + p.p."}, {"k": "or", "q": "그 편지는 누구에 의해 쓰였니?", "a": "By whom was the letter written?", "e": "By whom + was + 주어 + p.p.?"}, {"k": "or", "q": "그 건물은 유명한 건축가에 의해 설계되었다.", "a": "The building was designed by a famous architect.", "e": "be + p.p. + by"}, {"k": "fx", "q": "The book was publish in 2020.", "w": "publish", "a": ["published"], "e": "be + p.p."}, {"k": "fx", "q": "Where did the phone found?", "w": "did", "a": ["was"], "e": "의문사 + was + 주어 + p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The car was washed by him.\nⓑ Was the room cleaned yesterday?\nⓒ My dad was fixed the light.\nⓓ The cookies were eaten by the kids.\nⓔ The letter didn't sent.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ My dad fixed the light.(능동) / ⓔ wasn't sent"}, {"k": "ch", "q": "능동태와 수동태의 연결이 바르지 않은 것은?", "o": ["She sang the song. → The song was sung by her.", "They speak French in Canada. → French is spoken in Canada.", "Did he write it? → Was it written by him?", "Who made this? → By whom was this made?", "We don't use this room. → This room isn't used by we."], "a": 4, "e": "⑤ by us"}, {"k": "bl", "q": "The pyramids (were) built thousands of years ago.", "e": "복수 과거 → were"}, {"k": "bl", "q": "A: Was the bike repaired? B: No, it (wasn't|was not).", "e": "be동사로 대답"}]}}, {"tag": "hk3-04-2", "name": "수동태로 쓸 수 없는 동사", "talk": [{"k": "m", "t": "수동태는 **목적어가 있는 동사**만 가능해요. 그런데 목적어가 있어도 수동태가 안 되는 동사도 있어요 🙅"}, {"k": "m", "t": "① **목적어가 없는 동사**(자동사): happen, occur, appear, disappear, arrive, exist, die, rise, **take place**(일어나다, 열리다)"}, {"k": "ex", "en": "The accident happened at midnight. (was happened ✗)", "ko": "그 사고는 자정에 일어났다."}, {"k": "q", "q": "The sun ____ in the east.", "o": ["rises", "is risen", "is raised"], "a": 0, "ok": "맞아요! rise는 자동사 → 수동태 ✗", "no": "rise(뜨다, 오르다)는 목적어가 없는 동사 → rises"}, {"k": "m", "t": "② **상태**를 나타내는 동사: have(가지다), resemble(닮다), lack(부족하다), fit(크기가 맞다), suit(어울리다), cost(비용이 들다)"}, {"k": "ex", "en": "She resembles her mother. (Her mother is resembled by her ✗)", "ko": "그녀는 엄마를 닮았다."}, {"k": "q", "q": "This dress ____ you well.", "o": ["suits", "is suited", "was suited"], "a": 0, "ok": "정확해요! suit(어울리다)는 상태동사 → 능동", "no": "'너에게 잘 어울린다' → 상태동사 suit는 수동태 ✗ → suits"}, {"k": "m", "t": "③ **자동사 + 전치사** 덩어리: **consist of**(~로 구성되다), **belong to**(~의 것이다) → The team consists of 11 players. (is consisted of ✗)"}, {"k": "m", "t": "⚠️ 짝 주의: **rise**(자동사, 오르다) ↔ **raise**(타동사, 올리다) → The flag was raised. ✔ / The price was risen. ✗"}, {"k": "m", "t": "정리! **자동사·상태동사·consist of·belong to·take place는 수동태 ✗** 👍"}], "notes": {"table": [["종류", "동사", "예"], ["목적어가 없는 동사", "happen, occur, appear, disappear, arrive, exist, die, rise, take place", "A fire occurred last night."], ["상태동사", "have, resemble, lack, fit, suit, cost", "This bag cost 50 dollars."], ["자동사 + 전치사", "consist of, belong to", "The book belongs to Amy."]], "tips": ["우리말 '~되다'에 속지 말기 (일어났다 → happened)", "rise(오르다) ↔ raise(올리다: 수동태 가능)", "be composed of(구성되다)는 수동태 표현 → consist of와 구별"]}, "sets": {"workbook": [{"k": "pk", "q": "The earthquake [occurred*/was occurred] last year.", "e": "occur는 자동사"}, {"k": "pk", "q": "Dinosaurs [existed*/were existed] millions of years ago.",  to went to the concert.", "w": "went", "a": ["go"], "e": "to + 동사원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He went out to buy milk.\nⓑ I'm glad to see you.\nⓒ This chair is comfortable to sit.\nⓓ She grew up to be a singer.\nⓔ I left early in order not being late.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ to sit on / ⓔ in order not to be"}, {"k": "ch", "q": "to부정사의 쓰임이 같은 것끼리 짝지어진 것은?\nⓐ I'm pleased to meet you.\nⓑ He went to Busan to see his aunt.\nⓒ She was surprised to see me.\nⓓ This song is easy to sing.\nⓔ I have no time to waste.", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓓ", "ⓒ, ⓔ", "ⓓ, ⓔ"], "a": 1, "e": "ⓐⓒ 감정의 원인"}, {"k": "bl", "q": "He must be brave (to) say no to his boss.", "e": "판단의 근거"}, {"k": "bl", "q": "She hurried to the station, (only) to find the train had left.", "e": "결과 only to"}]}}, {"tag": "hk3-05-5", "name": "too ~ to, enough to", "talk": [{"k": "m", "t": "**too + 형/부 + to부정사** = 너무 ~해서 …할 수 없다 🚫"}, {"k": "ex", "en": "The soup is too hot to eat.", "ko": "그 수프는 너무 뜨거워서 먹을 수 없다."}, {"k": "m", "t": "= **so + 형/부 + that + 주어 + can't(couldn't)** → The soup is so hot that I can't eat **it**."}, {"k": "q", "q": "He was too tired ____ his homework.", "o": ["to finish", "finishing", "finish"], "a": 0, "ok": "맞아요! too ~ to부정사", "no": "too + 형용사 + to + 동사원형"}, {"k": "m", "t": "**형/부 + enough + to부정사** = …할 만큼 충분히 ~하다 = so ~ that + 주어 + can(could)"}, {"k": "q", "q": "She is ____ to join the club.", "o": ["enough old", "old enough", "too old enough"], "a": 1, "ok": "정확해요! 형용사 + enough", "no": "enough는 형용사 뒤 → old enough"}, {"k": "m", "t": "의미상 주어는 **for + 목적격**: The box was too heavy **for me** to lift."}, {"k": "m", "t": "⚠️ so ~ that으로 바꿀 때 ① **시제** 맞추기(was → couldn't) ② 문장 주어가 to부정사의 목적어면 that절에 **it / them** 다시 쓰기"}, {"k": "ex", "en": "The questions were too hard for us to answer. = The questions were so hard that we couldn't answer them.", "ko": "그 질문들은 너무 어려워서 우리가 답할 수 없었다."}, {"k": "m", "t": "정리! **too ~ to = so ~ that can't / enough to  "a": ["We were surprised at the team's reaching the final.", "We were surprised at the team reaching the final."], "e": "명사 's + V-ing"}, {"k": "fx", "q": "My mom doesn't like I staying up late.", "w": "I", "a": ["my", "me"], "e": "소유격(목적격) + V-ing"}, {"k": "pk", "q": "He was upset about [his son's not*/not his son's] telling the truth.", "e": "소유격 + not + V-ing"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Do you mind my asking a question?\nⓑ I'm sure of she passing the test.\nⓒ Thank you for coming to my party.\nⓓ He is proud of his son's being a doctor.\nⓔ I was angry about not his calling me.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ her / ⓔ his not calling"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nI'm sure that he will succeed.\n= I'm sure of ____ succeeding.", "o": ["he", "his", "he's", "himself", "to him"], "a": 1, "e": "that절의 주어 he → 소유격 his"}, {"k": "bl", "q": "Do you mind if I turn on the fan? = Do you mind (my|me) (turning) on the fan?", "e": "의미상의 주어 + V-ing"}]}}, {"tag": "hk3-06-3", "name": "동명사의 시제와 태", "talk": [{"k": "m", "t": "동명사도 **시제**와 **태**가 있어요! 중3 핵심 포인트 ⏳"}, {"k": "m", "t": "① **단순형 V-ing**: 문장의 동사와 **같은 때**(또는 그 이후) / ② **완료형 having + p.p.**: 문장의 동사보다 **앞선 때**"}, {"k": "ex", "en": "He is proud of being a doctor. / He is proud of having been a doctor.", "ko": "그는 의사인 것을 자랑스러워한다.(지금) / 그는 의사였던 것을 자랑스러워한다.(예전에)"}, {"k": "q", "q": "She is ashamed of ____ to her friend yesterday.", "o": ["lying", "having lied", "lie"], "a": 1, "ok": "맞아요! 어제 한 일(앞선 때) → having lied", "no": "부끄러운 건 지금, 거짓말은 어제 → 완료형 having lied"}, {"k": "m", "t": "③ **수동형 being + p.p.**: '~되는 것, ~당하는 것' → I hate [being] treated like a child."}, {"k": "q", "q": "Nobody likes ____ at by others.", "o": ["laughing", "being laughed", "having laughed"], "a": 1, "ok": "정확해요! 비웃음을 '당하는' 것 → being laughed at", "no": "남에게 비웃음을 당함 → 수동 being + p.p."}, {"k": "m", "t": "④ **완료 수동형 having been + p.p.**: 앞선 때에 '~되었던 것' → He was angry about **having been ignored**. (무시당했던 것)"}, {"k": "m", "t": "that절로 바꾸기: He is proud that he **won** the prize. → He is proud of **having won** the prize. (won이 is보다 앞섬) / She is sure that she **will pass**. → She is sure of [passing]."}, {"k": "m", "t": "부정: **not having p.p.** / **not being p.p.** → I regret not having studied harder."}, {"k": "m", "t": "정리! **V-ing 같은 때 / having p.p. 앞선 때 / being p.p. 수동 / having been p.p. 앞선 때 + 수동** 👍"}], "notes": {"table": [["형태", "능동", "수동"], ["단순형 (같은 때)", "V-ing", "being + p.p."], ["완료형 (앞선 때)", "having + p.p.", "having been + p.p."], ["예 (단순)", "I'm proud of winning.", "I hate being lied to."], ["예 (완료)", "He denies having stolen it.", "She complains of having been cheated."]], "tips": ["that절의 동사가 주절보다 앞선 시제 → having p.p.", "remember·forget·regret + V-ing는 단순형만으로도 과거 일을 나타낼 수 있음 (I remember meeting him.)", "부정: not having p.p. / not being p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "I don't like [being*/having] called by my nickname.", "e": "불리는 것(수동) → being p.p."}, {"k": "pk", "q": "He is proud of [having won*/having been won] the prize last year.", "e": "상을 '탄' 것(능동) + 앞선 때"}, {"k": "pk", "q": "She was afraid of [being*/having] left alone in the dark.", "e": "혼자 남겨지는 것 → being left"}, {"k": "pk", "q": "I'm sorry for [having broken*/being broken] your umbrella yesterday.", "e": "어제 내가 깬 것(능동·앞선 때)"}, {"k": "bl", "q": "그는 시험에서 부정행위를 했던 것을 부인했다. → He denied (having) (cheated) on the test.", "e": "앞선 때 → having p.p."}, {"k": "bl", "q": "그 아이는 낯선 사람들에게 안기는 것을 싫어한다. → The child hates (being) (held) by strangers.", "e": "수동 → being p.p."}, {"k": "bl", "q": "He is ashamed that he made a big mistake. = He is ashamed of (having) (made) a big mistake.", "e": "made가 is보다 앞섬"}, {"k": "bl", "q": "그녀는 그 대회에 초대받았던 것을 자랑스러워한다. → She is proud of (having) (been) invited to the contest.", "e": "앞선 때 + 수동"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The singer is used to ____ by fans everywhere.", "o": ["recognizing", "recognize", "being recognized", "be recognized", "having recognized"], "a": 2, "e": "be used to + V-ing / 알아봄을 당함 → being recognized"}, {"k": "fx", "q": "My dog enjoys being walk in the park.", "w": "walk", "a": ["walked"], "e": "being + p.p."}], "practiceA": [{"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nShe is proud that she was a member of the team.\n= She is proud of ____ a member of the team.", "o": ["being", "be", "having been", "been", "having being"], "a": 2, "e": "was가 is보다 앞섬 → having been"}, {"k": "ch", "q": "두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?\nI'm sure that he is honest.\n= I'm sure of his ____ honest.", "o": ["be", "being", "having been", "been", "to be"], "a": 1, "e": "is = 주절과 같은 때 → being"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I hate being told what to do.", "He admitted having taken the money.", "She is afraid of being bitten by the dog.", "I'm angry about having been lied to.", "Nobody likes being make fun of."], "a": 4, "e": "⑤ being made fun of"}, {"k": "bl", "q": "나는 어렸을 때 그런 말을 들었던 것을 기억한다. → I remember (being) told that when I was young.", "e": "remember + 동명사(수동)"}, {"k": "bl", "q": "그는 숙제를 끝내지 못한 것을 사과했다. → He apologized for not (having) (finished) his homework.", "e": "not having p.p."}, {"k": "pk", "q": "She complained about [being*/having] treated unfairly.", "e": "대우받는 것(수동)"}, {"k": "pk", "q": "I regret not [having studied*/being studied] harder last year.", "e": "능동 + 앞선 때"}, {"k": "fx", "q": "He is proud of having be a famous actor when he was young.", "w": "be", "a": ["been"], "e": "having been"}, {"k": "ox", "q": "She hates being interrupted while she is talking.", "a": true, "e": "✔ 수동 being p.p."}, {"k": "ox", "q": "The boy denied having broke the window.", "a": false, "e": "having broken"}], "practiceB": [{"k": "or", "q": "그는 그 경기에서 졌던 것을 부끄러워한다.", "a": "He is ashamed of having lost the game.", "e": "having p.p."}, {"k": "or", "q": "아무도 기다리게 되는 것을 좋아하지 않는다.", "a": "Nobody likes being kept waiting.", "e": "being p.p."}, {"k": "wr", "q": "He denied that he had stolen the bike. → 동명사를 써서 한 문장으로 (deny)", "a": ["He denied having stolen the bike.", "He denied stealing the bike."], "e": "had stolen이 denied보다 앞섬 → having stolen (단순형도 가능)"}, {"k": "wr", "q": "She is proud that her son is a pilot. → 동명사를 써서 바꾸시오. (proud of)", "a": ["She is proud of her son's being a pilot.", "She is proud of her son being a pilot."], "e": "같은 때 → being / 의미상 주어 her son's"}, {"k": "wr", "q": "I am sure that I will be chosen. → 동명사를 써서 바꾸시오. (sure of)", "a": ["I am sure of being chosen."], "e": "미래 + 수동 → being chosen"}, {"k": "fx", "q": "I'm sorry for not having call you last night.", "w": "call", "a": ["called"], "e": "not having p.p."}, {"k": "fx", "q": "He was angry about having been ignore by his classmates.", "w": "ignore", "a": ["ignored"], "e": "having been p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'm tired of being treated like a baby.\nⓑ He regrets having wasted his time.\nⓒ She is proud of having been chose as captain.\nⓓ They were afraid of being caught.\nⓔ I don't remember having seen her before.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ chosen"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은?\nHe is ashamed of having been rude to his teacher.", "o": ["He is ashamed that he is rude to his teacher.", "He is ashamed that he was rude to his teacher.", "He was ashamed that he is rude to his teacher.", "He is ashamed that he will be rude to his teacher.", "He was ashamed that he had been rude to his teacher."], "a": 1, "e": "주절 is(현재)보다 앞선 때 → was"}, {"k": "bl", "q": "She was surprised at (being) (given) a prize. (상을 받게 된 것에)", "e": "수동 → being given"}]}}, {"tag": "hk3-06-4", "name": "동명사를 목적어로 쓰는 동사", "talk": [{"k": "m", "t": "**동명사만** 목적어로 쓰는 동사! 중2 목록에 중3 단골 동사를 더해요 ✋"}, {"k": "m", "t": "중2 복습: **enjoy, finish, mind, avoid, give up, keep, practice, quit, stop, suggest, put off, deny**"}, {"k": "m", "t": "중3 추가: **consider**(고려하다), **imagine**(상상하다), **admit**(인정하다), **recommend**(추천하다), **postpone·delay**(미루다), **risk**(무릅쓰다), **dislike**(싫어하다)"}, {"k": "ex", "en": "We are considering moving to Busan. / He admitted making a mistake.", "ko": "우리는 부산으로 이사하는 것을 고려 중이다. / 그는 실수한 것을 인정했다."}, {"k": "q", "q": "I can't imagine ____ without my phone.", "o": ["live", "to live", "living"], "a": 2, "ok": "맞아요! imagine + 동명사", "no": "imagine은 동명사만 → living"}, {"k": "m", "t": "⚠️ **to부정사만** 쓰는 동사와 구별: want, hope, wish, expect, plan, decide, agree, refuse, promise, **afford, manage, pretend, fail**, choose, learn"}, {"k": "q", "q": "She refused ____ the question.", "o": ["answering", "to answer", "answer"], "a": 1, "ok": "정확해요! refuse + to부정사", "no": "refuse는 to부정사만 → to answer"}, {"k": "m", "t": "수동이면 being p.p.: She avoided [being] seen by her fans. / 의미상 주어도 OK: Do you mind my asking?"}, {"k": "m", "t": "suggest는 두 가지 모양: suggest **going** (동명사) / suggest **that** we (should) go (Ch.3 should 생략) — suggest to go ✗"}, {"k": "m", "t": "정리! **consider·imagine·admit·recommend·postpone·risk + V-ing / agree·refuse·afford·manage·pretend + to부정사** 👍"}], "notes": {"table": [["동명사만", "뜻", "to부정사만", "뜻"], ["enjoy / finish / mind", "즐기다 / 끝내다 / 꺼리다", "want / hope / wish", "원하다 / 바라다"], ["avoid / give up / quit", "피하다 / 포기하다 / 그만두다", "plan / decide / choose", "계획하다 / 결정하다"], ["keep / practice / stop", "계속하다 / 연습하다 / 멈추다", "agree / refuse / promise", "동의하다 / 거절하다 / 약속하다"], ["consider / imagine / admit", "고려하다 / 상상하다 / 인정하다", "afford / manage", "~할 여유가 있다 / 간신히 해내다"], ["deny / recommend / suggest", "부인하다 / 추천하다 / 제안하다", "pretend / fail / expect", "~인 척하다 / ~하지 못하다 / 기대하다"], ["put off / postpone / delay / risk", "미루다 / 연기하다 / 무릅쓰다", "learn / offer", "배우다 / 제안하다"]], "tips": ["suggest + V-ing / suggest that S (should) 동사원형 (suggest to ✗)", "수동: avoid being p.p. / 완료: admit having p.p.", "Would you mind -ing? → 괜찮다는 대답: No, not at all. / Of course not."]}, "sets": {"workbook": [{"k": "pk", "q": "We are considering [buying*/to buy] a new car.", "e": "consider + 동명사"}, {"k": "pk", "q": "He admitted [breaking*/to break] the vase.", "e": "admit + 동명사"}, {"k": "pk", "q": "I can't afford [to buy*/buying] that expensive bag.", "e": "afford + to부정사"}, {"k": "pk", "q": "She pretended [to be*/being] asleep.", "e": "pretend + to부정사"}, {"k": "bl", "q": "의사는 단 음식을 피하라고 추천했다. → The doctor recommended (avoiding) sweets.", "e": "recommend + 동명사"}, {"k": "bl", "q": "그들은 비 때문에 소풍을 미뤘다. → They postponed (having|holding) the picnic because of the rain.", "e": "postpone + 동명사"}, {"k": "bl", "q": "그는 마침내 그 문제를 간신히 풀어냈다. → He finally managed (to) solve the problem.", "e": "manage + to부정사"}, {"k": "bl", "q": "그녀는 그를 다시 믿는 것을 상상할 수 없다. → She can't imagine (trusting) him again.", "e": "imagine + 동명사"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? He ____ to join the club.", "o": ["decided", "agreed", "refused", "considered", "hoped"], "a": 3, "e": "consider + 동명사"}, {"k": "ox", "q": "Would you mind to wait for a few minutes?", "a": false, "e": "mind + 동명사 → waiting"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The boy denied ____ the cookies.", "o": ["eat", "to eat", "eating", "ate", "to eating"], "a": 2, "e": "deny + 동명사"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe agreed ____ me.\nShe avoided ____ me.", "o": ["helping – meeting", "to help – meeting", "to help – to meet", "helping – to meet", "help – meet"], "a": 1, "e": "agree + to / avoid + -ing"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He risked losing everything.", "I expect to hear from you soon.", "She suggested to take a taxi.", "They delayed starting the game.", "We failed to catch the bus."], "a": 2, "e": "③ suggested taking"}, {"k": "bl", "q": "그는 그 사고에 대해 거짓말한 것을 인정했다. → He admitted (lying) about the accident.", "e": "admit + 동명사"}, {"k": "bl", "q": "나는 그 경기를 놓치는 위험을 무릅쓸 수 없다. → I can't risk (missing) the game.", "e": "risk + 동명사"}, {"k": "pk", "q": "He failed [to keep*/keeping] his promise.", "e": "fail + to부정사"}, {"k": "pk", "q": "She dislikes [being*/to be] told what to do.", "e": "dislike + 동명사(수동)"}, {"k": "fx", "q": "We are considering change our plans.", "w": "change", "a": ["changing"], "e": "consider + V-ing"}, {"k": "ox", "q": "I suggest that he see a doctor.", "a": true, "e": "✔ suggest that S (should) 동사원형"}, {"k": "ox", "q": "He refused accepting the money.", "a": false, "e": "refuse + to accept"}], "practiceB": [{"k": "or", "q": "우리는 해외에서 공부하는 것을 고려하고 있다.", "a": "We are considering studying abroad.", "e": "consider + 동명사"}, {"k": "or", "q": "그는 그 메시지를 받지 못한 척했다.", "a": "He pretended not to get the message.", "e": "pretend + not + to부정사"}, {"k": "wr", "q": "그녀는 그 영화를 보라고 추천했다. (recommend, watch the movie)", "a": ["She recommended watching the movie.", "She recommended watching that movie."], "e": "recommend + 동명사"}, {"k": "wr", "q": "그 도둑은 그 돈을 훔친 것을 부인했다. (deny, steal the money)", "a": ["The thief denied stealing the money.", "The thief denied having stolen the money."], "e": "deny + 동명사(완료형도 가능)"}, {"k": "wr", "q": "나는 새 휴대전화를 살 여유가 없다. (afford, buy a new phone)", "a": ["I can't afford to buy a new phone.", "I cannot afford to buy a new phone.", "I can't afford a new phone."], "e": "afford + to부정사"}, {"k": "fx", "q": "She finally decided quitting fast food.", "w": "quitting", "a": ["to quit"], "e": "decide + to부정사"}, {"k": "fx", "q": "He avoided being punish by his teacher.", "w": "punish", "a": ["punished"], "e": "avoid + being p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I can't imagine living alone.\nⓑ He managed finishing the work.\nⓒ She suggested going to the museum.\nⓓ They put off making a decision.\nⓔ We expect winning the game.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ to finish / ⓔ to win"}, {"k": "ch", "q": "빈칸에 들어갈 말을 모두 고른 것은?\nHe ____ telling her the secret.\nⓐ avoided ⓑ promised ⓒ admitted ⓓ refused ⓔ considered", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ, ⓔ", "ⓑ, ⓓ", "ⓒ, ⓓ, ⓔ", "ⓐ, ⓑ, ⓒ, ⓓ"], "a": 1, "e": "avoid·admit·consider + -ing / promise·refuse + to"}, {"k": "pk", "q": "The manager suggested [that we*/us to] take a short break.", "e": "suggest that S (should) 동사원형 (suggest us to ✗)"}]}}, {"tag": "hk3-06-5", "name": "동명사와 to부정사를 모두 목적어로 쓰는 동사", "talk": [{"k": "m", "t": "동명사·to부정사 **둘 다** 쓰는 동사는 두 종류! ① 뜻이 **같은** 것 ② 뜻이 **달라지는** 것 ⚖️"}, {"k": "m", "t": "① 뜻 차이 거의 없음: **like, love, hate, prefer, begin, start, continue** → It started raining. = It started to rain."}, {"k": "m", "t": "② 뜻이 달라짐: **remember / forget** + V-ing (과거에) ~한 것 / + to부정사 (앞으로) ~할 것"}, {"k": "ex", "en": "I remember locking the door. / Remember to lock the door.", "ko": "나는 문을 잠근 것을 기억한다. / 문 잠그는 것을 기억해라."}, {"k": "q", "q": "I'll never forget ____ the Eiffel Tower for the first time.", "o": ["to see", "seeing", "see"], "a": 1, "ok": "맞아요! 과거의 경험 → 동명사", "no": "처음 '봤던' 것(과거) → forget seeing"}, {"k": "m", "t": "중3 추가: **regret + V-ing** (과거에) ~한 것을 후회하다 / **regret + to부정사** ~하게 되어 유감이다 (to say, to tell, to inform)"}, {"k": "ex", "en": "I regret telling him the secret. / We regret to inform you that the flight is canceled.", "ko": "나는 그에게 비밀을 말한 것을 후회한다. / 항공편이 취소되었음을 알려 드리게 되어 유감입니다."}, {"k": "q", "q": "We regret ____ you that the event has been canceled.", "o": ["telling", "to tell", "tell"], "a": 1, "ok": "정확해요! 유감스러운 소식 전달 → regret to tell", "no": "'~하게 되어 유감이다' → regret + to부정사"}, {"k": "m", "t": "**try + V-ing** 시험 삼아 ~해 보다 / **try + to부정사** ~하려고 노력하다 · **stop + V-ing** ~하는 것을 멈추다 / **stop + to부정사** ~하기 위해 멈추다(부사적 용법 — 목적어 아님!)"}, {"k": "m", "t": "정리! **V-ing = 과거·이미 한 일 / to부정사 = 앞으로 할 일** (regret to = 유감이다, try = 해 보다 vs 애쓰다) 👍"}], "notes": {"table": [["동사", "+ 동명사", "+ to부정사"], ["remember", "(과거에) ~한 것을 기억하다", "(앞으로) ~할 것을 기억하다"], ["forget", "(과거에) ~한 것을 잊다", "(앞으로) ~할 것을 잊다"], ["regret", "(과거에) ~한 것을 후회하다", "~하게 되어 유감이다"], ["try", "시험 삼아 ~해 보다", "~하려고 노력하다(애쓰다)"], ["stop", "~하는 것을 멈추다 (목적어)", "~하기 위해 멈추다 (부사적 용법)"], ["like / love / hate / begin / start / continue / prefer", "뜻 차이 거의 없음", "뜻 차이 거의 없음"]], "tips": ["would like / would love + to부정사만", "Don't forget / Remember + to부정사 → '꼭 ~해라'", "regret to say / tell / inform: 공식적인 나쁜 소식"]}, "sets": {"workbook": [{"k": "pk", "q": "I remember [meeting*/to meet] her at the party last year.", "e": "과거 → 동명사"}, {"k": "pk", "q": "Please remember [to return*/returning] the book by Friday.", "e": "앞으로 할 일 → to부정사"}, {"k": "pk", "q": "I regret [spending*/to spend] all my money on games.", "e": "과거에 한 일 후회 → 동명사"}, {"k": "pk", "q": "I regret [to say*/saying] that you didn't pass the test. (말하게 되어 유감이다)", "e": "regret + to부정사 = 유감이다"}, {"k": "bl", "q": "그는 그 상자를 열려고 애썼지만 열 수 없었다. → He tried (to) open the box, but he couldn't.", "e": "try + to부정사"}, {"k": "bl", "q": "이 소스를 한번 넣어 봐. 더 맛있을 거야. → Try (adding) this sauce. It'll taste better.", "e": "try + 동명사"}, {"k": "bl", "q": "나는 그녀에게 무례하게 굴었던 것을 후회한다. → I regret (being) rude to her.", "e": "regret + 동명사"}, {"k": "bl", "q": "가스 잠그는 것을 잊지 마. → Don't forget (to) turn off the gas.", "e": "forget + to부정사"}, {"k": "ch", "q": "두 문장의 의미가 거의 같은 것은?", "o": ["I remember to call him. / I remember calling him.", "He stopped to smoke. / He stopped smoking.", "She prefers to walk. / She prefers walking.", "I regret to tell you. / I regret telling you.", "Try to open it. / Try opening it."], "a": 2, "e": "③ prefer는 뜻 차이 없음"}, {"k": "fx", "q": "Don't forget bringing your passport tomorrow.", "w": "bringing", "a": ["to bring"], "e": "앞으로 할 일 → to부정사"}], "practiceA": [{"k": "ch", "q": "우리말과 일치하는 것은?\n나는 그 사실을 너에게 말해 주지 않은 것을 후회한다.", "o": ["I regret not to tell you the fact.", "I regret not telling you the fact.", "I regret to not tell you the fact.", "I regret telling not you the fact.", "I regret to tell you the fact."], "a": 1, "e": "과거에 하지 않은 일 후회 → regret not + V-ing"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI forgot ____ my homework, so I had to go back home. (가져갈 것)\nI'll never forget ____ my first concert. (봤던 것)", "o": ["bringing – seeing", "to bring – to see", "to bring – seeing", "bringing – to see", "bring – see"], "a": 2, "e": "앞으로 할 일 → to / 과거 경험 → -ing"}, {"k": "ch", "q": "따옴표 친 부분의 쓰임이 나머지와 다른 것은?", "o": ["He stopped ‘to buy’ some water.", "I want ‘to buy’ a new bike.", "She decided ‘to buy’ a gift.", "They planned ‘to buy’ a house.", "We hope ‘to buy’ the tickets."], "a": 0, "e": "① 부사적 용법(목적) / 나머지 명사적 용법(목적어)"}, {"k": "bl", "q": "나는 어렸을 때 이 공원에 왔던 것을 기억한다. → I remember (coming) to this park when I was little.", "e": "remember + 동명사"}, {"k": "bl", "q": "그녀는 친구에게 전화하기 위해 걷는 것을 멈췄다. → She stopped (walking) (to) call her friend.", "e": "stop + V-ing / to부정사(목적)"}, {"k": "pk", "q": "I tried [to lift*/lifting] the box, but it was too heavy.", "e": "애썼지만 못 함 → try + to부정사"}, {"k": "pk", "q": "The baby continued [crying*/cry] all night.", "e": "continue + 동명사 / to부정사"}, {"k": "pk", "q": "I regret [buying*/to buy] those shoes. They hurt my feet.", "e": "과거에 산 것을 후회 → buying"}, {"k": "ox", "q": "We regret to inform you that the store will close.", "a": true, "e": "✔ 유감이다 → regret + to"}, {"k": "ox", "q": "I remember to visit Gyeongju when I was in elementary school.", "a": false, "e": "과거 → visiting"}], "practiceB": [{"k": "or", "q": "나는 학교에서 더 열심히 공부하지 않은 것을 후회한다.", "a": "I regret not studying harder at school.", "e": "regret not + V-ing"}, {"k": "or", "q": "자기 전에 알람 맞추는 것을 기억해라.", "a": "Remember to set the alarm before you go to bed.", "e": "remember + to부정사"}, {"k": "wr", "q": "나는 작년에 그를 도왔던 것을 기억한다. (remember, help him, last year)", "a": ["I remember helping him last year.", "I remember having helped him last year."], "e": "remember + 동명사"}, {"k": "wr", "q": "그는 공부하기 위해 TV 보는 것을 멈췄다. (stop, watch TV, study)", "a": ["He stopped watching TV to study.", "He stopped watching TV in order to study."], "e": "stop + V-ing / to부정사(목적)"}, {"k": "wr", "q": "그 창문을 한번 열어 봐. (try, open the window)", "a": ["Try opening the window."], "e": "try + 동명사 = 시험 삼아 해 보다"}, {"k": "fx", "q": "He tried to wearing a hat, but it was too small.", "w": "wearing", "a": ["wear"], "e": "to + 동사원형"}, {"k": "fx", "q": "I'd like hearing your opinion.", "w": "hearing", "a": ["to hear"], "e": "would like + to부정사"}, {"k": "ch", "q": "어법상(의미상) 옳은 문장의 개수는?\nⓐ I regret not taking his advice.\nⓑ Don't forget to send me a postcard.\nⓒ I remember to go to Japan when I was ten.\nⓓ She stopped to tie her shoes.\nⓔ We regret telling you that your order is delayed. (알려 드리게 되어 유감입니다)", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ going / ⓔ to tell"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI tried ____ the password, but I couldn't remember it. (떠올리려고 애썼다)\nTry ____ the computer. It might work. (시험 삼아 다시 켜 봐)", "o": ["remembering – restarting", "to remember – to restart", "to remember – restarting", "remembering – to restart", "remember – restart"], "a": 2, "e": "애쓰다 → to / 해 보다 → -ing"}, {"k": "bl", "q": "그녀는 그 영화를 봤던 것을 잊어버리고 또 봤다. → She forgot (watching|seeing) the movie and watched it again.", "e": "forget + 동명사(과거)"}]}}, {"tag": "hk3-06-6", "name": "동명사 관용 표현", "talk": [{"k": "m", "t": "동명사 **관용 표현**! 중2 표현 복습 + 중3 새 표현까지 통째로 외워요 📚"}, {"k": "m", "t": "중2 복습: go -ing / be busy -ing / spend 시간·돈 -ing / feel like -ing / be worth -ing / cannot help -ing / have trouble(difficulty) -ing / on -ing / keep(prevent) A from -ing"}, {"k": "m", "t": "중3 ① **It is no use -ing** ~해도 소용없다 / **There is no -ing** ~하는 것은 불가능하다"}, {"k": "ex", "en": "It is no use crying over spilt milk. / There is no telling what will happen.", "ko": "엎질러진 우유를 두고 울어 봐야 소용없다. / 무슨 일이 일어날지 알 수 없다."}, {"k": "q", "q": "It is no use ____ him. He never listens.", "o": ["advise", "to advise", "advising"], "a": 2, "ok": "맞아요! It is no use + V-ing", "no": "It is no use 뒤에는 동명사 → advising"}, {"k": "m", "t": "중3 ② **cannot help -ing = cannot but + 동사원형** ~하지 않을 수 없다 → I couldn't help laughing. = I couldn't but [laugh]."}, {"k": "m", "t": "중3 ③ **to가 전치사**인 표현: look forward to / be used(accustomed) to / **object to** (반대하다) / **when it comes to** (~에 관해서라면) / **What do you say to** (~하는 게 어때?) + V-ing"}, {"k": "q", "q": "When it comes to ____, she is the best in our class.", "o": ["cook", "cooking", "cooked"], "a": 1, "ok": "정확해요! when it comes to + V-ing", "no": "이 to는 전치사 → cooking"}, {"k": "m", "t": "⚠️ **used to + 동사원형** ~하곤 했다 / **be used to + V-ing** ~에 익숙하다 / **be used to + 동사원형** ~하는 데 사용되다 (Ch.4 수동태 + to부정사)"}, {"k": "m", "t": "중3 ④ **never ... without -ing** ~하면 반드시 …한다 / **in -ing** ~할 때 / **be on the point of -ing** 막 ~하려던 참이다"}, {"k": "m", "t": "정리! **It is no use·There is no·cannot help·object to·when it comes to·look forward to + V-ing** 👍 🎉 Chapter 6 동명사 끝! 다음은 Chapter 7 분사예요 🎊"}], "notes": {"table": [["표현", "뜻", "예"], ["It is no use -ing", "~해도 소용없다", "It is no use complaining."], ["There is no -ing", "~하는 것은 불가능하다", "There is no knowing the future."], ["cannot help -ing", "~하지 않을 수 없다 (= cannot but + 동사원형)", "I couldn't help smiling."], ["look forward to -ing", "~하기를 고대하다", "I look forward to working with you."], ["be used(accustomed) to -ing", "~하는 데 익숙하다", "He is used to living alone."], ["object to -ing", "~하는 것에 반대하다", "They objected to building the road."], ["when it comes to -ing", "~에 관해서라면", "When it comes to singing, he is the best."], ["What do you say to -ing?", "~하는 게 어때?", "What do you say to eating out?"], ["never ... without -ing", "~하면 반드시 …한다", "She never sees me without smiling."], ["on -ing / in -ing", "~하자마자 / ~할 때", "On arriving, he called me."], ["be worth -ing / feel like -ing", "~할 가치가 있다 / ~하고 싶다", "The book is worth reading."], ["spend 시간·돈 (in) -ing / have trouble (in) -ing", "~하는 데 시간·돈을 쓰다 / ~하는 데 어려움을 겪다", "I had trouble finding it."]], "tips": ["to가 전치사인 표현: look forward to, be used to, object to, when it comes to, What do you say to, contribute to", "used to + 동사원형(~하곤 했다) vs be used to + V-ing(익숙하다) vs be used to + 동사원형(사용되다)", "cannot help -ing = cannot but + 동사원형"]}, "sets": {"workbook": [{"k": "pk", "q": "It is no use [arguing*/to argue] with him.", "e": "It is no use + V-ing"}, {"k": "pk", "q": "There is no [knowing*/know] what she is thinking.", "e": "There is no + V-ing"}, {"k": "pk", "q": "I couldn't but [smile*/smiling] at the baby.", "e": "can
