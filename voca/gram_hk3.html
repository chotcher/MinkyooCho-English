her passing the exam.", "o": ["I'm sure that I will pass the exam.", "I'm sure that she will pass the exam.", "I'm sure that she passed the exam.", "She is sure that I will pass the exam.", "She is sure that she will pass the exam."], "a": 1, "e": "의미상 주어 her + 같은 때 이후 → she will pass"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI tried ____ the jacket on, but it didn't fit. (시험 삼아 입어 봤다)\nHe stopped ____ a picture of the sunset. (사진을 찍기 위해 멈췄다)", "o": ["putting – taking", "to put – to take", "putting – to take", "to put – taking", "put – take"], "a": 2, "e": "try + -ing = 해 보다 / stop + to = ~하기 위해"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Exercising every morning makes me feel good.", true], ["Would you mind my turning off the light?", true], ["He is proud of having been chosen as captain.", true], ["She can't imagine to live without music.", false], ["I regret not listening to my parents.", true], ["Learning new skills are always useful.", false], ["There is no knowing what he will do next.", true], ["They are considering moving to Jeju.", true], ["I'm used to get up at six.", false], ["He pretended not to hear me.", true], ["I can't stand he complaining all the time.", false], ["When it comes to cooking, Dad is the best.", true]], "e": "ⓓ living ⓕ is ⓘ getting ⓚ his(him)"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I hate being told what to do.", true], ["He denied having broken the window.", true], ["It is no use to cry over spilt milk.", false], ["Don't forget to call your grandma.", true], ["We managed finishing the project on time.", false], ["She objected to being treated unfairly.", true], ["I couldn't help laughing at his face.", true], ["I remember to visit this museum as a child.", false], ["Thank you for waiting for me.", true], ["The boy admitted to tell a lie.", false], ["I look forward to hearing from you.", true], ["This song is worth listening to.", true]], "e": "ⓒ crying ⓔ to finish ⓗ visiting ⓙ telling"}, {"k": "wr", "q": "그는 시험에 떨어졌던 것을 부끄러워한다. (ashamed of, fail the test, 완료형 동명사)", "a": ["He is ashamed of having failed the test."], "e": "having p.p."}, {"k": "wr", "q": "우리는 다음 주에 당신을 만나기를 고대합니다. (look forward to, see you next week)", "a": ["We look forward to seeing you next week.", "We are looking forward to seeing you next week."], "e": "look forward to + V-ing"}]}}, {"book": "hk3", "chapter": {"id": "07", "name": "분사", "title": "해커스 중학영문법 3학년 · Chapter 7 분사"}, "units": [{"tag": "hk3-07-1", "name": "분사의 형태와 쓰임", "talk": [{"k": "m", "t": "Chapter 7은 **분사**! 동사를 **형용사처럼** 쓰는 말이에요. 중2 복습 + 중3에서는 **보어 자리**와 **분사구문**을 깊게 봐요 🎨"}, {"k": "m", "t": "**현재분사 v-ing** '~하는, ~하고 있는'(능동·진행) / **과거분사 p.p.** '~된, ~해진'(수동·완료)"}, {"k": "m", "t": "쓰임 ① **명사 수식**: 분사 **혼자**면 명사 **앞**, 목적어·부사구와 **함께**면 명사 **뒤** → a barking dog / the dog [barking] at the mailman"}, {"k": "q", "q": "'영어로 쓰인 편지'는?", "o": ["a written in English letter", "a letter written in English", "a letter writing in English"], "a": 1, "ok": "맞아요! 분사 + 다른 말 → 명사 뒤", "no": "written in English처럼 길면 명사 뒤 + 편지가 쓰임 → written"}, {"k": "m", "t": "명사 뒤 분사 = **관계대명사 + be동사**가 생략된 것과 같아요 → the boy (who is) wearing a cap / a car (that was) made in Korea"}, {"k": "m", "t": "쓰임 ② **주격보어**: sit, stand, lie, keep, remain, come + 분사 → She sat **reading** a magazine. / He remained **seated**."}, {"k": "m", "t": "쓰임 ③ **목적격보어** (Ch.1 5형식): keep·find·leave·지각동사 + 목적어 + v-ing / p.p. → I found the window [broken]."}, {"k": "q", "q": "Don't leave the water ____. (물을 틀어 놓은 채로 두지 마)", "o": ["run", "running", "ran"], "a": 1, "ok": "정확해요! 물이 흐르는 중(능동) → running", "no": "물이 '흐르고 있는' 상태 → 현재분사 running"}, {"k": "ex", "en": "I heard someone calling my name. / I heard my name called.", "ko": "나는 누군가 내 이름을 부르는 것을 들었다. / 나는 내 이름이 불리는 것을 들었다."}, {"k": "m", "t": "정리! **v-ing 능동·진행 / p.p. 수동·완료 / 혼자면 앞, 길면 뒤 / 주격·목적격보어로도 쓰임** 👍"}], "notes": {"table": [["쓰임", "현재분사 v-ing", "과거분사 p.p."], ["명사 앞 (혼자)", "a sleeping baby", "a broken chair"], ["명사 뒤 (+ 다른 말)", "the girl singing on the stage", "a song sung by BTS"], ["주격보어", "He stood waiting for her.", "She looked surprised."], ["목적격보어", "I kept him waiting.", "I found my bike stolen."], ["지각동사 / 사역 have", "I saw him crossing the street.", "I had my hair cut."]], "tips": ["명사 뒤 분사 = 관계대명사 + be 생략", "목적어와 분사의 관계가 능동 → v-ing, 수동 → p.p.", "sit / stand / lie / keep / remain + 분사 (주격보어)"]}, "sets": {"workbook": [{"k": "pk", "q": "Who is the man [standing*/stood] next to Ms. Lee?", "e": "남자가 서 있음 → 현재분사"}, {"k": "pk", "q": "I bought a phone [making/made*] in Vietnam.", "e": "전화기가 만들어짐 → 과거분사"}, {"k": "pk", "q": "He sat on the bench [reading*/read] a newspaper.", "e": "주격보어 → 그가 읽음"}, {"k": "pk", "q": "I found the door [locking/locked*].", "e": "문이 잠김 → 과거분사"}, {"k": "bl", "q": "땅 위의 떨어진 잎들 → (fallen) leaves on the ground", "e": "완료 → 과거분사"}, {"k": "bl", "q": "강에서 수영하고 있는 소년들 → the boys (swimming) in the river", "e": "능동·진행"}, {"k": "bl", "q": "그는 나를 한 시간 동안 기다리게 했다. → He kept me (waiting) for an hour.", "e": "목적어(나)가 기다림 → v-ing"}, {"k": "bl", "q": "나는 지난주에 머리를 잘랐다. → I had my hair (cut) last week.", "e": "머리가 잘림 → p.p."}, {"k": "ch", "q": "따옴표 친 분사가 명사를 뒤에서 꾸미는 것은?", "o": ["She has a ‘smiling’ face.", "The kids ‘playing’ outside are noisy.", "He looked ‘tired’.", "I heard the baby ‘crying’.", "Look at the ‘shining’ stars."], "a": 1, "e": "② playing outside가 kids를 뒤에서 수식"}, {"k": "fx", "q": "The boy sang on the stage is my cousin.", "w": "sang", "a": ["singing"], "e": "동사 두 개 ✗ → 분사 singing"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? There were many people ____ for the bus.", "o": ["wait", "waits", "waiting", "waited", "to waiting"], "a": 2, "e": "사람들이 기다림 → waiting"}, {"k": "ch", "q": "어법상 틀린 것은?", "o": ["a crying child", "a car parked outside", "the girl wearing glasses", "a broken heart", "a picture painting by Van Gogh"], "a": 4, "e": "⑤ 그림이 그려짐 → painted"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI saw a thief ____ into the house.\nI saw the thief ____ by the police.", "o": ["breaking – arresting", "broken – arrested", "breaking – arrested", "broken – arresting", "break – arrest"], "a": 2, "e": "도둑이 침입함 → breaking / 도둑이 체포됨 → arrested"}, {"k": "bl", "q": "그 소식을 듣고 그녀는 놀란 것처럼 보였다. → She looked (surprised) at the news.", "e": "주격보어 p.p."}, {"k": "bl", "q": "나는 내 자전거가 도난당한 것을 알았다. → I found my bike (stolen).", "e": "목적격보어 p.p."}, {"k": "pk", "q": "The festival [holding/held*] every spring attracts many tourists.", "e": "축제가 열림 → held"}, {"k": "pk", "q": "I could feel my heart [beating*/beaten] fast.", "e": "심장이 뜀 → beating"}, {"k": "fx", "q": "Most of the people invite to the party were my classmates.", "w": "invite", "a": ["invited"], "e": "사람들이 초대됨 → invited"}, {"k": "ox", "q": "He remained seated during the speech.", "a": true, "e": "✔ remain + p.p. (앉은 채로)"}, {"k": "ox", "q": "I heard my name calling in the hall.", "a": false, "e": "이름이 불림 → called"}], "practiceB": [{"k": "wr", "q": "나는 누군가 문을 두드리는 소리를 들었다. (hear, someone, knock on the door)", "a": ["I heard someone knocking on the door.", "I heard someone knock on the door."], "e": "지각동사 + O + v-ing(동사원형)"}, {"k": "wr", "q": "그는 자기 차를 수리받았다. (사역동사 have, his car, repair)", "a": ["He had his car repaired."], "e": "have + O + p.p."}, {"k": "or", "q": "무대 위에서 춤추고 있는 소녀는 나의 여동생이다.", "a": "The girl dancing on the stage is my sister.", "e": "명사 뒤 현재분사"}, {"k": "or", "q": "그 박물관은 백 년 전에 지어진 건물이다.", "a": "The museum is a building built 100 years ago.", "e": "명사 뒤 과거분사"}, {"k": "fx", "q": "The man drives the truck is my uncle.", "w": "drives", "a": ["driving"], "e": "동사 두 개 ✗ → driving"}, {"k": "fx", "q": "Please keep the door closing.", "w": "closing.", "a": ["closed"], "e": "문이 닫힘 → closed"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I saw a woman carrying a heavy bag.\nⓑ The language speaking in Mexico is Spanish.\nⓒ She stood there smiling at me.\nⓓ I had my phone fixed yesterday.\nⓔ He left the TV turning on.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ spoken / ⓔ turned on"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은?\nThe boy who is talking to Ms. Kim is my brother.", "o": ["The boy talked to Ms. Kim is my brother.", "The boy talking to Ms. Kim is my brother.", "The talking boy to Ms. Kim is my brother.", "The boy is talking to Ms. Kim is my brother.", "The boy to talk to Ms. Kim is my brother."], "a": 1, "e": "who is 생략 → talking"}, {"k": "bl", "q": "These are photos (taken) by my father. (아버지가 찍은)", "e": "사진이 찍힘 → taken"}, {"k": "bl", "q": "I saw a cat (lying) under the car. (누워 있는)", "e": "lie → lying"}]}}, {"tag": "hk3-07-2", "name": "현재분사 vs. 과거분사", "talk": [{"k": "m", "t": "v-ing냐 p.p.냐는 **분사와 관계있는 명사**가 그 동작을 **하는지(능동)**, **당하는지(수동)**로 정해요 🔍"}, {"k": "m", "t": "명사 수식: 꾸밈받는 명사 기준 → a **rolling** stone (돌이 구름) / a **stolen** car (차가 도난당함)"}, {"k": "m", "t": "목적격보어: **목적어** 기준! I kept the engine [running]. (엔진이 돌아감) / I got my watch [repaired]. (시계가 수리됨)"}, {"k": "q", "q": "She had her tooth ____ yesterday. (이를 뽑았다)", "o": ["pulling", "pulled", "pull"], "a": 1, "ok": "맞아요! 이가 뽑힘(수동) → pulled", "no": "목적어 her tooth는 '뽑히는' 쪽 → p.p."}, {"k": "m", "t": "자동사(fall, retire, fade, grow 등)의 p.p.는 수동이 아니라 **완료** '이미 ~한' → fallen leaves, a retired teacher, a grown man"}, {"k": "q", "q": "The ____ leaves covered the road. (이미 떨어진)", "o": ["falling", "fallen", "fell"], "a": 1, "ok": "정확해요! 이미 떨어짐(완료) → fallen", "no": "'이미 떨어진' 잎 → 완료 의미 p.p. fallen"}, {"k": "m", "t": "Tip: 분사 바로 뒤에 **목적어**가 있으면 대부분 v-ing, **by + 행위자**가 있으면 p.p. → the man [selling] tickets / tickets sold by the man"}, {"k": "ex", "en": "I watched the house being painted. / I watched him painting the house.", "ko": "나는 그 집이 칠해지고 있는 것을 지켜보았다. / 나는 그가 그 집을 칠하고 있는 것을 지켜보았다."}, {"k": "m", "t": "정리! **(꾸밈받는 명사·목적어가) 하면 v-ing / 당하면 p.p. / 자동사 p.p.는 완료** 👍"}], "notes": {"table": [["판단 기준", "현재분사 v-ing", "과거분사 p.p."], ["명사 수식", "명사가 동작을 함: a running horse", "명사가 동작을 당함: a used book"], ["목적격보어", "목적어가 함: I saw him running.", "목적어가 당함: I saw him arrested."], ["사역 have / get" 지어진 것은?\nⓐ They are playing chess.\nⓑ Playing chess is fun.\nⓒ The boy playing chess is Tim.\nⓓ He gave up playing chess.\nⓔ I watched them playing chess.", "o": ["ⓐⓑⓒ", "ⓐⓒⓔ", "ⓑⓒⓓ", "ⓑⓓⓔ", "ⓒⓓⓔ"], "a": 1, "e": "ⓐ 진행형 ⓒ 명사 수식 ⓔ 목적격보어 → 현재분사 / ⓑ 주어 ⓓ 목적어 → 동명사"}, {"k": "ch", "q": "v-ing가 '~하기 위한'의 뜻으로 쓰인 것은?", "o": ["a crying baby", "a walking stick", "a flying kite", "a singing bird", "a falling rock"], "a": 1, "e": "② 지팡이 = 걷기 위한 막대"}, {"k": "pk", "q": "a smoking area (흡연 구역) → [현재분사/동명사*]", "e": "용도"}, {"k": "pk", "q": "a smoking chimney (연기가 나고 있는 굴뚝) → [현재분사*/동명사]", "e": "굴뚝이 연기를 냄"}, {"k": "bl", "q": "그의 계획은 해외에서 공부하는 것이다. → His plan is (studying|to study) abroad.", "e": "동명사(to부정사) 보어"}, {"k": "bl", "q": "그는 지금 도서관에서 공부하고 있다. → He is (studying) in the library now.", "e": "현재분사 진행형"}, {"k": "ox", "q": "Seeing is believing. 의 Seeing과 believing은 모두 동명사이다.", "a": true, "e": "✔ 주어·보어 → 동명사"}, {"k": "ox", "q": "We are swimming in the swimming pool. — 두 swimming은 모두 현재분사이다.", "a": false, "e": "앞: 현재분사(진행) / 뒤: 동명사(용도)"}], "practiceB": [{"k": "ch", "q": "v-ing가 동명사인 것의 개수는?\nⓐ The baby sleeping in the crib is cute.\nⓑ Sleeping well is important.\nⓒ She bought a new sleeping bag.\nⓓ I found him sleeping on the sofa.\nⓔ He is afraid of sleeping alone.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑ 주어 ⓒ 용도 ⓔ 전치사의 목적어 → 동명사 / ⓐⓓ 현재분사"}, {"k": "ch", "q": "v-ing의 쓰임이 <보기>와 같은 것은?\n<보기> I watched the children building a sandcastle.", "o": ["Building a house takes time.", "His job is building bridges.", "I saw workers building a wall.", "He is interested in building robots.", "They finished building the shed."], "a": 2, "e": "<보기>는 목적격보어 현재분사 → ③"}, {"k": "ch", "q": "v-ing의 쓰임이 <보기>와 같은 것은?\n<보기> We need a new washing machine.", "o": ["The woman washing the car is my mom.", "He is washing his hands.", "I bought some drinking water.", "Look at the boy washing the dog.", "She kept washing the dishes."], "a": 2, "e": "<보기>는 용도의 동명사 → ③ drinking water"}, {"k": "wr", "q": "'탈의실'을 영어로 쓰시오. (fit, room)", "a": ["a fitting room", "fitting room", "the fitting room"], "e": "동명사 + 명사"}, {"k": "wr", "q": "그녀의 직업은 아이들에게 수학을 가르치는 것이다. (job, teach math to children)", "a": ["Her job is teaching math to children.", "Her job is to teach math to children.", "Her job is teaching children math.", "Her job is to teach children math."], "e": "동명사(to부정사) 보어"}, {"k": "or", "q": "탑승권을 보여 주세요.", "a": "Please show me your boarding pass.", "e": "동명사 + 명사"}, {"k": "or", "q": "나는 그녀가 노래 연습하는 것을 들었다.", "a": "I heard her practicing singing.", "e": "practicing: 현재분사(목적격보어) / singing: 동명사(목적어)"}, {"k": "ox", "q": "Being honest is important. 의 Being은 현재분사이다.", "a": false, "e": "주어 → 동명사"}, {"k": "ox", "q": "The rising price of food is a big problem. 의 rising은 현재분사이다.", "a": true, "e": "✔ 가격이 오르고 있음"}, {"k": "bl", "q": "My favorite pastime is (watching) old movies. (보는 것)", "e": "동명사 보어"}]}}, {"tag": "hk3-07-5-1", "name": "분사구문 만드는 법", "talk": [{"k": "m", "t": "**분사구문**: '접속사 + 주어 + 동사'의 부사절을 분사로 짧게 줄인 것 ✂️"}, {"k": "m", "t": "만드는 법 ① **접속사** 생략 ② 주절과 주어가 **같으면** 주어 생략 ③ 동사를 **v-ing**로 (두 절의 시제가 같을 때)"}, {"k": "ex", "en": "While I was cleaning my room, I found an old photo. → Cleaning my room, I found an old photo.", "ko": "방을 청소하다가 나는 오래된 사진을 발견했다."}, {"k": "q", "q": "As she was nervous, she couldn't speak. → ____ nervous, she couldn't speak.", "o": ["Was", "Being", "Been"], "a": 1, "ok": "맞아요! be동사 → Being", "no": "was를 v-ing로 → Being"}, {"k": "m", "t": "부정: 분사 **앞에 not / never** → As I didn't know her, I didn't say hi. → [Not] knowing her, I didn't say hi."}, {"k": "m", "t": "뜻을 분명히 하려고 **접속사를 남기기도** 해요 → **While** walking home, I met Sam. / **After** finishing dinner, we went out."}, {"k": "m", "t": "중3 핵심 ⭐ **독립분사구문**: 두 절의 주어가 **다르면** 부사절 주어를 **남겨요** → As it was rainy, we stayed home. → **It being** rainy, we stayed home."}, {"k": "q", "q": "As the weather was fine, we went hiking. → ____, we went hiking.", "o": ["Being fine", "The weather being fine", "The weather was fine"], "a": 1, "ok": "정확해요! 주어가 달라서 남김 → The weather being fine", "no": "the weather ≠ we → 주어를 남긴 독립분사구문"}, {"k": "m", "t": "⚠️ 주어가 다른데 지워 버리면 틀린 문장! Arriving at the station, the train had left. ✗ (기차가 도착한 것처럼 됨)"}, {"k": "m", "t": "정리! **접속사 ✗ → 같은 주어 ✗ → v-ing / Not + v-ing / 주어가 다르면 남김(독립분사구문)** 👍"}], "notes": {"table": [["경우", "부사절", "분사구문"], ["기본", "When I opened the box, I ~", "Opening the box, I ~"], ["be동사", "Because he was sick, he ~", "Being sick, he ~"], ["부정", "As I didn't feel well, I ~", "Not feeling well, I ~"], ["접속사 남김", "While I was walking, I ~", "While walking, I ~"], ["독립분사구문", "As it was late, we ~", "It being late, we ~"], ["독립분사구문", "After the sun set, we ~", "The sun having set, we ~ (Ch.7 5-3)"]], "tips": ["주어가 같을 때만 주어 생략 — 다르면 남김", "부정어 not / never는 분사 앞 (Knowing not ✗)", "There being ~ : As there was no bus, ~ → There being no bus, ~"]}, "sets": {"workbook": [{"k": "pk", "q": "When he heard the news, he jumped for joy. → [Hearing*/Heard] the news, he jumped for joy.", "e": "동사 → v-ing"}, {"k": "pk", "q": "Because I was hungry, I ate a whole pizza. → [Be/Being*] hungry, I ate a whole pizza.", "e": "was → Being"}, {"k": "pk", "q": "As she didn't have a key, she waited outside. → [Not having*/Having not] a key, she waited outside.", "e": "Not + v-ing"}, {"k": "pk", "q": "As it was cold, we stayed inside. → [Being/It being*] cold, we stayed inside.", "e": "주어 it ≠ we → It being"}, {"k": "bl", "q": "When I entered the room, I smelled smoke. → (Entering) the room, I smelled smoke.", "e": "entered → Entering"}, {"k": "bl", "q": "As I didn't want to wake her, I walked quietly. → (Not) (wanting) to wake her, I walked quietly.", "e": "Not + v-ing"}, {"k": "bl", "q": "As there was no bus, we took a taxi. → (There) (being) no bus, we took a taxi.", "e": "독립분사구문 There being"}, {"k": "bl", "q": "While I was waiting for her, I read a book. → While (waiting) for her, I read a book.", "e": "접속사를 남긴 분사구문"}, {"k": "ch", "q": "다음 문장을 분사구문으로 바르게 바꾼 것은?\nAs the movie was boring, I fell asleep.", "o": ["Being boring, I fell asleep.", "The movie being boring, I fell asleep.", "Was boring, I fell asleep.", "The movie was boring, I fell asleep.", "Boring the movie, I fell asleep."], "a": 1, "e": "주어가 달라 남김 → The movie being boring"}, {"k": "fx", "q": "Feel tired, she went to bed early.", "w": "Feel", "a": ["Feeling"], "e": "분사구문 → Feeling"}], "practiceA": [{"k": "ch", "q": "다음 문장을 분사구문으로 바르게 바꾼 것은?\nBecause he didn't know the answer, he stayed silent.", "o": ["Knowing not the answer, he stayed silent.", "Not knowing the answer, he stayed silent.", "Not knew the answer, he stayed silent.", "Didn't knowing the answer, he stayed silent.", "He not knowing the answer, he stayed silent."], "a": 1, "e": "Not + v-ing"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["It being Sunday, the shops were closed.", "Walking along the beach, I found a shell.", "Not having money, he couldn't buy it.", "Being late, the teacher scolded me.", "While doing homework, she listened to music."], "a": 3, "e": "④ 늦은 건 '나'인데 주어가 teacher → As I was late, ~"}, {"k": "ch", "q": "빈칸에 알맞은 것은?\nAs it was dark, we turned on the lights.\n= ____ dark, we turned on the lights.", "o": ["Being", "It being", "It was", "Been", "It is"], "a": 1, "e": "주어 it ≠ we → It being"}, {"k": "bl", "q": "After she finished her work, she went home. → After (finishing) her work, she went home.", "e": "접속사 남김 + v-ing"}, {"k": "bl", "q": "As the road was icy, the driver drove slowly. → The road (being) icy, the driver drove slowly.", "e": "독립분사구문"}, {"k": "pk", "q": "[Seeing*/Saw] the police officer, the thief ran away.", "e": "주어 thief가 봄 → Seeing"}, {"k": "pk", "q": "[Being/It being*] a holiday, the streets were empty.", "e": "주어 it ≠ streets → It being"}, {"k": "fx", "q": "Not know what to say, I just smiled.", "w": "know", "a": ["knowing"], "e": "Not + v-ing"}, {"k": "ox", "q": "There being nothing to eat, we went to a restaurant.", "a": true, "e": "✔ There being"}, {"k": "ox", "q": "Being rainy, we canceled the picnic.", "a": false, "e": "주어가 다름 → It being rainy"}], "practiceB": [{"k": "wr", "q": "As the weather was nice, we went on a picnic. → 분사구문으로 바꾸시오.", "a": ["The weather being nice, we went on a picnic."], "e": "독립분사구문"}, {"k": "wr", "q": "Because I didn't have an umbrella, I got wet. → 분사구문으로 바꾸시오.", "a": ["Not having an umbrella, I got wet."], "e": "Not + v-ing"}, {"k": "wr", "q": "When he saw me, he waved. → 분사구문으로 바꾸시오.", "a": ["Seeing me, he waved."], "e": "saw → Seeing"}, {"k": "or", "q": "버스가 없어서, 우리는 집까지 걸어갔다. (분사구문)", "a": "There being no bus, we walked home.", "e": "There being"}, {"k": "fx", "q": "Opened the window, I felt a cool breeze.", "w": "Opened", "a": ["Opening"], "e": "주어 I가 엶 → Opening"}, {"k": "fx", "q": "It was Saturday, we didn't have to go to school.", "w": "was", "a": ["being"], "e": "독립분사구문 It being"}, {"k": "ch", "q": "어법상 옳은 분사구문의 개수는?\nⓐ Feeling sick, he left early.\nⓑ It being late, we took a taxi.\nⓒ Knowing not his number, I couldn't call him.\nⓓ The bus being full, we waited for the next one.\nⓔ Being windy, I wore a jacket.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ Not knowing / ⓔ It being windy"}, {"k": "ch", "q": "분사구문을 부사절로 바꾼 것이 바른 것은?\nIt being very hot, we went swimming.", "o": ["Because we were very hot, we went swimming.", "Because it was very hot, we went swimming.", "Because it is very hot, we went swimming.", "Because being very hot, we went swimming.", "Because it was very hot, it went swimming."], "a": 1, "e": "주어 it + 주절 시제(과거)"}, {"k": "bl", "q": "As my mom was busy, I made dinner. → My mom (being) busy, I made dinner.", "e": "독립분사구문"}, {"k": "bl", "q": "Because I didn't hear the alarm, I overslept. → (Not) (hearing) the alarm, I overslept.", "e": "Not + v-ing"}]}}, {"tag": "hk3-07-5-2", "name": "분사구문의 다양한 의미", "talk": [{"k": "m", "t": "분사구문엔 **접속사가 없어서** 문맥으로 뜻을 판단해요 🧩"}, {"k": "m", "t": "① **시간** (when, while, after, before) → **Arriving** at the airport, I called my mom."}, {"k": "m", "t": "② **이유** (because, as, since) → **Having** no time, I skipped lunch."}, {"k": "m", "t": "③ **조건** (if) → **Turning** left, you will see the bank. — 주절에 보통 will / can"}, {"k": "q", "q": "Pressing this button, you can turn off the machine. 의 의미는?", "o": ["이 버튼을 누르면", "이 버튼을 눌렀기 때문에", "이 버튼을 누르는 동안"], "a": 0, "ok": "맞아요! 조건 → ~하면", "no": "뒤에 can이 오고 '누르면 끌 수 있다' → 조건"}, {"k": "m", "t": "④ **양보** (though, although) '~이지만' — 접속사를 **남기는** 경우가 많아요 → **Though** living next door, he rarely visits us."}, {"k": "q", "q": "Though knowing the truth, she said nothing. 의 의미는?", "o": ["진실을 알았기 때문에", "진실을 알았지만", "진실을 알면"], "a": 1, "ok": "정확해요! 양보 → ~이지만", "no": "Though = ~이지만 → 양보"}, {"k": "m", "t": "⑤ **동시동작** '~하면서' (as, while) → She listened to me, **nodding** her head. / ⑥ **연속동작** '~하고 (그리고)' (and) → The bus left at 8, **arriving** in Daegu at 11."}, {"k": "m", "t": "부사절로 바꿀 때: 알맞은 **접속사** + **주어** + 주절 **시제**에 맞춘 동사 → Feeling tired, she went to bed. = **Because she felt** tired, she went to bed."}, {"k": "m", "t": "정리! **시간 · 이유 · 조건 · 양보 · 동시동작 · 연속동작 — 문맥으로!** 👍"}], "notes": {"table": [["의미", "접속사", "예"], ["시간", "when, while, after, before", "Walking home, I met Jun. (= When I was walking home)"], ["이유", "because, as, since", "Being sick, she stayed home. (= Because she was sick)"], ["조건", "if", "Taking this road, you'll get there faster. (= If you take this road)"], ["양보", "though, although", "Though being rich, he lives simply. (= Though he is rich)"], ["동시동작", "as, while", "He walked in, carrying a box."], ["연속동작", "and", "The plane left Seoul, landing in Paris 12 hours later."]], "tips": ["조건 분사구문 → 주절에 will / can", "양보 분사구문은 Though / Although를 남기는 경우가 많음", "부사절로 바꿀 때 주절의 시제에 맞춰 동사를 씀"]}, "sets": {"workbook": [{"k": "pk", "q": "Being tired, I took a nap. = [Because*/Though] I was tired, I took a nap.", "e": "이유"}, {"k": "pk", "q": "Turning right, you will find the museum. = [If*/Though] you turn right, you will find the museum.", "e": "조건"}, {"k": "pk", "q": "Though living near the sea, she can't swim. = [Though*/Because] she lives near the sea, she can't swim.", "e": "양보"}, {"k": "pk", "q": "Walking in the park, I saw a squirrel. = [While*/If] I was walking in the park, I saw a squirrel.", "e": "시간"}, {"k": "bl", "q": "If you take this medicine, you will feel better. → (Taking) this medicine, you will feel better.", "e": "조건"}, {"k": "bl", "q": "그는 노래를 흥얼거리면서 설거지를 했다. → He did the dishes, (humming) a song.", "e": "동시동작"}, {"k": "bl", "q": "Because she had a fever, she went to see a doctor. → (Having) a fever, she went to see a doctor.", "e": "이유"}, {"k": "bl", "q": "Though he was injured, he kept playing. → Though (being) injured, he kept playing.", "e": "양보 (접속사 남김)"}, {"k": "ch", "q": "분사구문의 의미가 '양보'인 것은?", "o": ["Opening the door, she saw a cat.", "Although trying hard, he failed.", "Feeling cold, I closed the window.", "Going straight, you'll see it.", "She sat there, reading a book."], "a": 1, "e": "② 열심히 노력했지만"}, {"k": "ch", "q": "분사구문의 의미가 '조건'인 것은?", "o": ["Hearing the bell, the students stood up.", "Being busy, I couldn't help you.", "Leaving now, you can catch the last train.", "He waved, smiling at me.", "Not knowing the way, I got lost."], "a": 2, "e": "③ 지금 떠나면"}], "practiceA": [{"k": "ch", "q": "다음 문장과 의미가 같은 것은?\nNot having a car, he takes the bus to work.", "o": ["Though he doesn't have a car, he takes the bus to work.", "Because he doesn't have a car, he takes the bus to work.", "If he has a car, he takes the bus to work.", "Because he didn't have a car, he takes the bus to work.", "When he has a car, he takes the bus to work."], "a": 1, "e": "이유 + 현재시제(주절 takes)"}, {"k": "ch", "q": "분사구문의 의미가 나머지와 다른 것은?", "o": ["Being hungry, I ate a sandwich.", "Having a headache, she left early.", "Not feeling well, he stayed home.", "Arriving home, I took a shower.", "Being tired, we stopped walking."], "a": 3, "e": "④ 시간 / 나머지 이유"}, {"k": "ch", "q": "빈칸에 알맞은 접속사는?\nThough knowing the answer, he didn't raise his hand.\n= ____ he knew the answer, he didn't raise his hand.", "o": ["Because", "If", "Although", "When", "Since"], "a": 2, "e": "양보"}, {"k": "bl", "q": "Because I live far from school, I get up early. → (Living) far from school, I get up early.", "e": "이유"}, {"k": "bl", "q": "그 기차는 9시에 서울을 떠나서 12시에 부산에 도착했다. → The train left Seoul at nine, (arriving) in Busan at noon.", "e": "연속동작"}, {"k": "pk", "q": "[Studying*/Studied] harder, you will get better grades.", "e": "조건 + 주어 you가 공부함"}, {"k": "pk", "q": "Though [being*/been] young, she is very wise.", "e": "양보 (접속사 남김)"}, {"k": "fx", "q": "Smile at me, she said hello.", "w": "Smile", "a": ["Smiling"], "e": "동시동작 분사구문"}, {"k": "ox", "q": "Taking a taxi, you will arrive in ten minutes. = If you take a taxi, you will arrive in ten minutes.", "a": true, "e": "✔ 조건"}, {"k": "ox", "q": "Though being sick, she went to school. = Because she was sick, she went to school.", "a": false, "e": "양보 → Though she was sick"}], "practiceB": [{"k": "wr", "q": "If you turn left at the corner, you will see the bakery. → 분사구문으로 바꾸시오.", "a": ["Turning left at the corner, you will see the bakery.", "Turning left at the corner, you'll see the bakery."], "e": "조건"}, {"k": "wr", "q": "Though he was tired, he finished the report. → 접속사를 남긴 분사구문으로 바꾸시오.", "a": ["Though being tired, he finished the report.", "Though tired, he finished the report."], "e": "양보 (Being 생략 가능)"}, {"k": "wr", "q": "Feeling cold, she put on a sweater. → because를 써서 부사절로 바꾸시오.", "a": ["Because she felt cold, she put on a sweater.", "She put on a sweater because she felt cold."], "e": "이유 / 과거시제"}, {"k": "or", "q": "음악을 들으면서, 그녀는 방을 청소했다. (분사구문)", "a": "Listening to music, she cleaned her room.", "e": "동시동작"}, {"k": "or", "q": "열심히 연습했지만, 그는 경기에서 졌다. (Although 남김)", "a": "Although practicing hard, he lost the game.", "e": "양보"}, {"k": "fx", "q": "Arrived at the hotel, we checked in.", "w": "Arrived", "a": ["Arriving"], "e": "시간 분사구문 → Arriving"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Pushing this button, the door will open. (네가 누르면)\nⓑ Though living in Korea for years, he can't speak Korean.\nⓒ Having a cold, she stayed in bed.\nⓓ He came in, carrying a big box.\nⓔ Not knowing what to do, I asked my teacher.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓑⓒⓓⓔ 옳음 / ⓐ 주절 주어 door가 누르는 것이 됨 → If you push this button, ~"}, {"k": "ch", "q": "분사구문의 의미가 <보기>와 같은 것은?\n<보기> Being short, he couldn't reach the shelf.", "o": ["Turning off the light, I went to bed.", "Having no money, I couldn't buy lunch.", "Taking the subway, you'll save time.", "She walked away, crying.", "Though being rich, he isn't happy."], "a": 1, "e": "이유 → ② 돈이 없어서"}, {"k": "bl", "q": "(If) you follow this path, you will reach the lake. = Following this path, you will reach the lake.", "e": "조건"}, {"k": "bl", "q": "(Though|Although) she was nervous, she gave a great speech. = Though being nervous, she gave a great speech.", "e": "양보"}]}}, {"tag": "hk3-07-5-3", "name": "분사구문의 시제와 태", "talk": [{"k": "m", "t": "분사구문도 **시제**와 **태**가 있어요! (Ch.6 동명사의 시제와 태랑 같은 원리) ⏳"}, {"k": "m", "t": "① **단순형 v-ing**: 부사절 시제 = 주절 시제 / ② **완료형 Having + p.p.**: 부사절이 주절보다 **앞선 때**"}, {"k": "ex", "en": "After I had finished my homework, I watched TV. → Having finished my homework, I watched TV.", "ko": "숙제를 끝낸 후, 나는 TV를 보았다."}, {"k": "q", "q": "Because I lost my key, I can't open the door. → ____ my key, I can't open the door.", "o": ["Losing", "Having lost", "Lost"], "a": 1, "ok": "맞아요! 잃어버린 건 과거, 못 여는 건 지금 → Having lost", "no": "부사절(과거)이 주절(현재)보다 앞섬 → Having p.p."}, {"k": "m", "t": "③ **수동형 (Being) + p.p.**: 주어가 '당하는' 경우, **Being은 보통 생략** → (Being) Written in easy English, the book sells well."}, {"k": "q", "q": "____ from a distance, the rock looks like a face.", "o": ["Seeing", "Seen", "Having seen"], "a": 1, "ok": "정확해요! 바위가 '보이는' 것 → (Being) Seen", "no": "주어 the rock은 보여지는 쪽 → 수동 Seen"}, {"k": "m", "t": "④ **완료 수동형 (Having been) + p.p.**: 앞선 때 + 수동, Having been도 생략 가능 → (Having been) Built in 1900, the house needs repairs."}, {"k": "m", "t": "부정: **Not having p.p.** / **Not + p.p.** → Not having eaten breakfast, I was hungry."}, {"k": "m", "t": "⚠️ p.p.로 시작하는 분사구문은 **주절 주어**가 그 동작을 '당하는지' 꼭 확인! [Surrounded] by fans, the singer smiled."}, {"k": "m", "t": "정리! **v-ing 같은 때 / Having p.p. 앞선 때 / (Being) p.p. 수동 / (Having been) p.p. 앞선 때 + 수동** 👍"}], "notes": {"table": [["형태", "의미", "예"], ["v-ing", "같은 때, 능동", "Feeling sick, I stayed home."], ["Having + p.p.", "앞선 때, 능동", "Having seen the movie, I know the story."], ["(Being) + p.p.", "같은 때, 수동", "(Being) Made of glass, it breaks easily."], ["(Having been) + p.p.", "앞선 때, 수동", "(Having been) Written long ago, the letter was hard to read."], ["Not having + p.p.", "앞선 때 + 부정", "Not having slept, he was exhausted."]], "tips": ["Being / Having been은 생략 가능 → p.p.로 시작하는 분사구문", "독립분사구문 + 완료: The sun having set, we went home.", "부사절 동사가 주절보다 한 시제 앞서면 Having p.p."]}, "sets": {"workbook": [{"k": "pk", "q": "[Having finished*/Finishing] the race yesterday, he feels tired today.", "e": "어제 끝냄(앞선 때) → Having p.p."}, {"k": "pk", "q": "[Writing/Written*] in Chinese, the sign was hard to read.", "e": "표지판이 쓰임 → 수동"}, {"k": "pk", "q": "[Seeing/Seen*] from space, Earth looks blue.", "e": "지구가 보임 → 수동"}, {"k": "pk", "q": "[Not having slept*/Having not slept] well, I was sleepy all day.", "e": "Not + having p.p."}, {"k": "bl", "q": "As I have lived here for years, I know the area well. → (Having) (lived) here for years, I know the area well.", "e": "앞선 때 → Having p.p."}, {"k": "bl", "q": "Because it was made of paper, the box tore easily. → (Made) of paper, the box tore easily.", "e": "수동 → Being 생략"}, {"k": "bl", "q": "As the book was written for kids, it is easy to read. → (Written) for kids, the book is easy to read.", "e": "수동"}, {"k": "bl", "q": "As she had been invited to the party, she bought a dress. → (Having) (been) invited to the party, she bought a dress.", "e": "앞선 때 + 수동"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ by the noise, the baby started to cry.", "o": ["Waking", "Woken", "Having woken", "Wake", "To wake"], "a": 1, "e": "아기가 깨워짐 → (Being) Woken"}, {"k": "fx", "q": "Having eat lunch, we went for a walk.", "w": "eat", "a": ["eaten"], "e": "Having + p.p."}], "practiceA": [{"k": "ch", "q": "다음 문장을 분사구문으로 바르게 바꾼 것은?\nBecause he had spent all his money, he couldn't buy the ticket.", "o": ["Spending all his money, he couldn't buy the ticket.", "Having spent all his money, he couldn't buy the ticket.", "Having spending all his money, he couldn't buy the ticket.", "Spent all his money, he couldn't buy the ticket.", "Being spent all his money, he couldn't buy the ticket."], "a": 1, "e": "앞선 때 → Having spent"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Built in 1890, the tower is very old.", "Having read the book, I know the ending.", "Shocking by the news, she couldn't speak.", "Not having studied, he failed the test.", "Seen from above, the city is beautiful."], "a": 2, "e": "③ 그녀가 충격을 받음 → Shocked"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ by many people, the song became a hit.\n____ the song many times, I know all the words.", "o": ["Loving – Hearing", "Loved – Having heard", "Loved – Heard", "Loving – Having heard", "Having loved – Hearing"], "a": 1, "e": "노래가 사랑받음 → Loved / 내가 들어 옴(앞선 때) → Having heard"}, {"k": "bl", "q": "As the letter had been sent to the wrong address, it never arrived. → (Sent) to the wrong address, the letter never arrived.", "e": "수동 (Having been 생략)"}, {"k": "bl", "q": "Because I had not checked the weather, I didn't bring an umbrella. → (Not) (having) checked the weather, I didn't bring an umbrella.", "e": "Not having p.p."}, {"k": "pk", "q": "[Surrounding/Surrounded*] by mountains, the village is very quiet.", "e": "마을이 둘러싸임 → 수동"}, {"k": "pk", "q": "[Having lost*/Losing] his wallet the day before, he had no money.", "e": "전날 잃어버림 → Having p.p."}, {"k": "fx", "q": "Painting in bright colors, the house stands out.", "w": "Painting", "a": ["Painted"], "e": "집이 칠해짐 → 수동"}, {"k": "ox", "q": "Having been born in Canada, she speaks English and French.", "a": true, "e": "✔ 앞선 때 + 수동"}, {"k": "ox", "q": "Having seen the movie before, it was boring to me.", "a": false, "e": "주어 it ≠ 본 사람 → I found it boring"}], "practiceB": [{"k": "wr", "q": "After he had finished his work, he went home. → 완료형 분사구문으로 바꾸시오.", "a": ["Having finished his work, he went home."], "e": "Having p.p."}, {"k": "wr", "q": "Because the cake was baked too long, it was dry. → 분사구문으로 바꾸시오.", "a": ["Baked too long, the cake was dry.", "Being baked too long, the cake was dry."], "e": "수동 (Being 생략 가능)"}, {"k": "wr", "q": "Since I had not eaten breakfast, I was very hungry. → 분사구문으로 바꾸시오.", "a": ["Not having eaten breakfast, I was very hungry."], "e": "Not having p.p."}, {"k": "or", "q": "영어로 쓰여 있어서, 그 책은 읽기 어려웠다. (분사구문)", "a": "Written in English, the book was difficult to read.", "e": "수동 (Being 생략)"}, {"k": "fx", "q": "Having been injure in the game, he couldn't play.", "w": "injure", "a": ["injured"], "e": "Having been + p.p."}, {"k": "fx", "q": "Exciting by the news, the kids jumped up and down.", "w": "Exciting", "a": ["Excited"], "e": "아이들이 흥분함(by) → Excited"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Having lived in Japan, he speaks Japanese well.\nⓑ Made in Italy, these shoes are expensive.\nⓒ Having breaking his leg, he can't walk.\nⓓ Seen from here, the island looks small.\nⓔ Disappointing with the result, she cried.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ Having broken / ⓔ Disappointed"}, {"k": "ch", "q": "분사구문을 부사절로 바꾼 것이 바른 것은?\nHaving been told the news, he called his mother.", "o": ["When he told the news, he called his mother.", "After he had been told the news, he called his mother.", "After he has been told the news, he called his mother.", "Because he had told the news, he called his mother.", "When he was telling the news, he called his mother."], "a": 1, "e": "앞선 때(had) + 수동(been told)"}, {"k": "bl", "q": "The sun (having) set, we went back to the hotel. (해가 진 후)", "e": "독립분사구문 + 완료형"}, {"k": "bl", "q": "(Left) alone in the house, the dog barked all day. (홀로 남겨져서)", "e": "수동 → p.p."}]}}, {"tag": "hk3-07-6", "name": "with + 명사 + 분사", "talk": [{"k": "m", "t": "**with + 명사 + 분사**: '(명사)가 ~한 채로, ~하면서' — 동시에 일어나는 상황을 그려요 🎬"}, {"k": "m", "t": "판단은 **명사 기준**! 명사가 **하면** v-ing, **당하면** p.p."}, {"k": "ex", "en": "He sat on the sofa with his dog sleeping next to him.", "ko": "그는 개가 옆에서 자고 있는 채로 소파에 앉아 있었다. (개가 잠 → v-ing)"}, {"k": "ex", "en": "She listened to music with her eyes closed.", "ko": "그녀는 눈을 감은 채로 음악을 들었다. (눈이 감김 → p.p.)"}, {"k": "q", "q": "He stood there with his arms ____. (팔짱을 낀 채로)", "o": ["folding", "folded", "fold"], "a": 1, "ok": "맞아요! 팔이 접힘(수동) → folded", "no": "팔은 스스로 접지 않아요 → 접힌 상태 → folded"}, {"k": "m", "t": "자주 쓰는 표현: with one's eyes **closed** / arms **folded** / legs **crossed** / mouth **full** (형용사) / with the engine **running** / with the water **running** / with tears **running** down one's cheeks"}, {"k": "q", "q": "Don't sleep with the TV ____ on. (TV를 켜 놓은 채로)", "o": ["turning", "turned", "turn"], "a": 1, "ok": "정확해요! TV가 켜짐 → turned on", "no": "TV는 '켜지는' 쪽 → turned on"}, {"k": "m", "t": "⚠️ with 뒤 순서: **with + 명사 + 분사** → with closed his eyes ✗ / with his eyes [closed] ✓"}, {"k": "m", "t": "분사 대신 **형용사·부사(구)**도 와요 → with the window **open** / with the lights **on** / with a hat **on his head**"}, {"k": "m", "t": "정리! **with + 명사 + v-ing(명사가 함) / p.p.(명사가 당함) = ~한 채로, ~하면서** 👍"}], "notes": {"table": [["형태", "명사와의 관계", "예"], ["with + 명사 + v-ing", "능동 (명사가 ~함)", "with the dog following him / with the wind blowing"], ["with + 명사 + p.p.", "수동 (명사가 ~당함)", "with his eyes closed / with her legs crossed"], ["with + 명사 + 형용사", "상태", "with the door open / with his mouth full"], ["with + 명사 + 부사(구)", "상태", "with the lights on / with a bag in her hand"]], "tips": ["fold one's arms(팔짱을 끼다) → with one's arms folded", "cross one's legs(다리를 꼬다) → with one's legs crossed", "어순: with + 명사 + 분사 (명사가 먼저!)"]}, "sets": {"workbook": [{"k": "pk", "q": "She was reading with her legs [crossing/crossed*].", "e": "다리가 꼬임 → p.p."}, {"k": "pk", "q": "He left the car with the engine [running*/run].", "e": "엔진이 돌아감 → v-ing"}, {"k": "pk", "q": "The girl ran to her mom with tears [running*/run] down her face.", "e": "눈물이 흘러내림 → v-ing"}, {"k": "pk", "q": "Don't talk with your mouth [full*/filling].", "e": "with + 명사 + 형용사"}, {"k": "bl", "q": "그는 눈을 감은 채로 노래를 불렀다. → He sang with his eyes (closed).", "e": "눈이 감김"}, {"k": "bl", "q": "그녀는 개가 뒤따라오는 채로 걸었다. → She walked with her dog (following) her.", "e": "개가 따라옴"}, {"k": "bl", "q": "나는 창문을 열어 둔 채로 잤다. → I slept with the window (open|opened).", "e": "형용사 open / 분사 opened"}, {"k": "bl", "q": "그 노인은 팔짱을 낀 채로 앉아 있었다. → The old man sat with his arms (folded).", "e": "팔이 접힘"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그는 불을 켜 둔 채로 잠이 들었다.", "o": ["He fell asleep with the light turning on.", "He fell asleep with the light turned on.", "He fell asleep with turned on the light.", "He fell asleep with the light turn on.", "He fell asleep the light turned on."], "a": 1, "e": "불이 켜짐 → turned on"}, {"k": "fx", "q": "She stood at the door with her hands hiding behind her back.", "w": "hiding", "a": ["hidden"], "e": "손이 숨겨짐 → hidden"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? He was watching TV with his cat ____ on his lap.", "o": ["sleep", "slept", "sleeping", "sleeps", "to sleep"], "a": 2, "e": "고양이가 잠 → sleeping"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe was jogging with music ____.\nShe was jogging with her hair ____ back.", "o": ["playing – tying", "played – tied", "playing – tied", "played – tying", "play – tie"], "a": 2, "e": "음악이 흘러나옴 → playing / 머리가 묶임 → tied"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He listened with his eyes closed.", "She sat with her legs crossed.", "I studied with the radio playing.", "He waited with his arms folding.", "We talked with the door open."], "a": 3, "e": "④ folded"}, {"k": "bl", "q": "그는 물을 틀어 놓은 채로 이를 닦았다. → He brushed his teeth with the water (running).", "e": "물이 흐름"}, {"k": "bl", "q": "그녀는 바람에 머리가 날리는 채로 해변을 걸었다. → She walked on the beach with her hair (blowing) in the wind.", "e": "머리가 날림"}, {"k": "pk", "q": "The boy came in with his shoes [covering/covered*] in mud.", "e": "신발이 진흙으로 덮임"}, {"k": "pk", "q": "He looked at me with his eyes [shining*/shone].", "e": "눈이 빛남 → v-ing"}, {"k": "fx", "q": "Don't drive with your seat belt unfastening.", "w": "unfastening.", "a": ["unfastened"], "e": "안전벨트가 풀림 → unfastened"}, {"k": "ox", "q": "She fell asleep with the lights on.", "a": true, "e": "✔ with + 명사 + 부사"}, {"k": "ox", "q": "He spoke with shaking his voice.", "a": false, "e": "with his voice shaking (명사 + 분사 순서)"}], "practiceB": [{"k": "wr", "q": "그는 다리를 꼰 채로 앉아 있었다. (sit, with, his legs, cross)", "a": ["He sat with his legs crossed.", "He was sitting with his legs crossed."], "e": "다리가 꼬임 → crossed"}, {"k": "wr", "q": "그녀는 눈물이 볼을 타고 흘러내리는 채로 그 편지를 읽었다. (read the letter, with, tears, run down her cheeks)", "a": ["She read the letter with tears running down her cheeks."], "e": "눈물이 흐름 → running"}, {"k": "or", "q": "그는 엔진을 켜 둔 채로 차 안에서 기다렸다.", "a": "He waited in the car with the engine running.", "e": "엔진이 돌아감"}, {"k": "or", "q": "그 소녀는 팔짱을 낀 채로 서 있었다.", "a": "The girl stood with her arms folded.", "e": "팔이 접힘"}, {"k": "fx", "q": "He was running with his dog chased him.", "w": "chased", "a": ["chasing"], "e": "개가 쫓아옴 → chasing"}, {"k": "fx", "q": "I can't sleep with the TV turning on.", "w": "turning", "a": ["turned"], "e": "TV가 켜짐 → turned"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ She sang with her eyes closing.\nⓑ He ran with his heart beating fast.\nⓒ They sat with their arms folded.\nⓓ He talked with his mouth full.\nⓔ I left with the door locking.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓓ 옳음 / ⓐ closed / ⓔ locked"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe baby slept with her thumb ____ in her mouth. (엄지가 입에 넣어진 채)\nThe man walked with his dog ____ behind him. (개가 따라오는 채)", "o": ["putting – following", "put – followed", "put – following", "putting – followed", "puts – follows"], "a": 2, "e": "엄지가 넣어짐 → put / 개가 따라옴 → following"}, {"k": "bl", "q": "He sat on the bench with a book (open) on his lap. (펼친 채로, 형용사)", "e": "with + 명사 + 형용사"}, {"k": "bl", "q": "She answered the phone with her hands (shaking). (손이 떨리는 채로)", "e": "손이 떨림 → v-ing"}]}}, {"tag": "hk3-07-7", "name": "분사구문 관용 표현", "talk": [{"k": "m", "t": "주절과 주어가 달라도 **주어 없이** 굳어진 분사구문! 의미상 주어가 '일반 사람(we, you)'이라 생략돼요 📌"}, {"k": "m", "t": "**Generally speaking** 일반적으로 말하면 / **Frankly speaking** 솔직히 말하면 / **Strictly speaking** 엄밀히 말하면 / **Roughly speaking** 대략 말하면"}, {"k": "ex", "en": "Frankly speaking, I don't like his idea.", "ko": "솔직히 말하면, 나는 그의 생각이 마음에 들지 않는다."}, {"k": "q", "q": "'엄밀히 말하면'은?", "o": ["Strictly speaking", "Strict speaking", "Strictly spoken"], "a": 0, "ok": "맞아요! 부사 + speaking", "no": "부사 Strictly + speaking → Strictly speaking"}, {"k": "m", "t": "**Judging from** ~로 판단하건대 / **Considering** ~을 고려하면 / **Speaking(Talking) of** ~ 이야기가 나와서 말인데 / **Compared with(to)** ~와 비교하면"}, {"k": "ex", "en": "Judging from his accent, he must be from Busan.", "ko": "그의 말투로 판단하건대, 그는 부산 출신임이 틀림없다."}, {"k": "q", "q": "____ his age, he is very tall.", "o": ["Considering", "Considered", "Consider"], "a": 0, "ok": "정확해요! Considering = ~을 고려하면", "no": "관용 표현은 Considering (~을 고려하면)"}, {"k": "m", "t": "⚠️ Compared with는 **p.p.** (비교되는 것) → [Compared] with last year, prices are much higher. (Comparing ✗)"}, {"k": "m", "t": "정리! **Generally·Frankly·Strictly speaking / Judging from / Considering / Speaking of / Compared with** 👍"}, {"k": "m", "t": "🎉 Chapter 7 분사 끝! 다음은 Chapter 8 명사와 대명사예요 🎊"}], "notes": {"table": [["표현", "뜻", "예"], ["Generally speaking", "일반적으로 말하면", "Generally speaking, girls mature faster than boys."], ["Frankly speaking", "솔직히 말하면", "Frankly speaking, the food was terrible."], ["Strictly speaking", "엄밀히 말하면", "Strictly speaking, a tomato is a fruit."], ["Roughly speaking", "대략 말하면", "Roughly speaking, 100 people came."], ["Judging from(by)", "~로 판단하건대", "Judging from the sky, it will rain."], ["Considering", "~을 고려하면", "Considering his age, he did well."], ["Speaking(Talking) of", "~ 이야기가 나와서 말인데", "Speaking of food, are you hungry?"], ["Compared with(to)", "~와 비교하면", "Compared with Seoul, this town is quiet."]], "tips": ["의미상 주어가 일반인이라 주절 주어와 달라도 생략 (비인칭 독립분사구문)", "speaking 앞은 부사 (Frank speaking ✗)", "Compared with / to는 과거분사"]}, "sets": {"workbook": [{"k": "pk", "q": "[Frankly*/Frank] speaking, I didn't enjoy the movie.", "e": "부사 + speaking"}, {"k": "pk", "q": "[Judging*/Judged] from her face, she is upset.", "e": "Judging from"}, {"k": "pk", "q": "[Compared*/Comparing] with my old phone, this one is much faster.", "e": "Compared with"}, {"k": "pk", "q": "[Speaking*/Spoken] of travel, where did you go last summer?", "e": "Speaking of"}, {"k": "bl", "q": "일반적으로 말하면, 개는 충성스럽다. → (Generally) speaking, dogs are loyal.", "e": "Generally speaking"}, {"k": "bl", "q": "그의 경험을 고려하면, 그는 그 일에 적합하다. → (Considering) his experience, he is right for the job.", "e": "Considering"}, {"k": "bl", "q": "엄밀히 말하면, 박쥐는 새가 아니다. → Strictly (speaking), bats are not birds.", "e": "Strictly speaking"}, {"k": "bl", "q": "하늘로 판단하건대, 곧 눈이 올 것이다. → (Judging) from the sky, it will snow soon.", "e": "Judging from"}, {"k": "ch", "q": "우리말과 일치하도록 할 때 빈칸에 알맞은 것은?\n대략 말하면, 그 일은 일주일이 걸릴 것이다.\n= ____ speaking, the work will take a week.", "o": ["Rough", "Roughly", "Roughing", "Roughed", "To rough"], "a": 1, "e": "부사 Roughly + speaking"}, {"k": "fx", "q": "Frank speaking, your plan won't work.", "w": "Frank", "a": ["Frankly"], "e": "부사 + speaking"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ of movies, have you seen the new Marvel film?", "o": ["Speak", "Spoken", "Speaking", "To speak", "Speaks"], "a": 2, "e": "Speaking of ~ (~ 이야기가 나와서 말인데)"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Generally speaking, cats are independent.", "Considering the weather, the event went well.", "Comparing with his brother, he is shy.", "Judging from his clothes, he is rich.", "Strictly speaking, that's not true."], "a": 2, "e": "③ Compared with"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그녀의 나이를 고려하면, 그녀는 매우 성숙하다.", "o": ["Considered her age, she is very mature.", "Considering her age, she is very mature.", "Consider her age, she is very mature.", "To considering her age, she is very mature.", "Considering of her age, she is very mature."], "a": 1, "e": "Considering + 명사"}, {"k": "bl", "q": "작년과 비교하면, 올해 여름은 더 덥다. → (Compared) with last year, this summer is hotter.", "e": "Compared with"}, {"k": "bl", "q": "솔직히 말하면, 나는 그 시험을 준비하지 않았다. → Frankly (speaking), I didn't prepare for the test.", "e": "Frankly speaking"}, {"k": "pk", "q": "[Generally*/General] speaking, people want to be happy.", "e": "부사 + speaking"}, {"k": "pk", "q": "[Talking*/Talked] of Jisu, I saw her yesterday.", "e": "Talking of = Speaking of"}, {"k": "fx", "q": "Judged from the noise, the party is still going on.", "w": "Judged", "a": ["Judging"], "e": "Judging from"}, {"k": "ox", "q": "Compared to New York, Seoul is safer at night.", "a": true, "e": "✔ Compared to"}, {"k": "ox", "q": "Strict speaking, a spider is not an insect.", "a": false, "e": "Strictly speaking"}], "practiceB": [{"k": "wr", "q": "일반적으로 말하면, 아이들은 단것을 좋아한다. (Generally speaking, children, like sweets)", "a": ["Generally speaking, children like sweets.", "Generally speaking children like sweets."], "e": "Generally speaking"}, {"k": "wr", "q": "그의 목소리로 판단하건대, 그는 감기에 걸렸다. (Judging from, his voice, have a cold)", "a": ["Judging from his voice, he has a cold.", "Judging from his voice, he has caught a cold."], "e": "Judging from"}, {"k": "wr", "q": "축구 이야기가 나와서 말인데, 어젯밤 경기 봤니? (Speaking of soccer, watch, last night's game)", "a": ["Speaking of soccer, did you watch last night's game?", "Talking of soccer, did you watch last night's game?", "Speaking of soccer, did you see last night's game?"], "e": "Speaking of"}, {"k": "or", "q": "그의 키를 고려하면, 그는 농구를 잘한다.", "a": "Considering his height, he plays basketball well.", "e": "Considering"}, {"k": "or", "q": "엄밀히 말하면, 토마토는 과일이다.", "a": "Strictly speaking, a tomato is a fruit.", "e": "Strictly speaking"}, {"k": "fx", "q": "Comparing with other students, she studies much harder.", "w": "Comparing", "a": ["Compared"], "e": "Compared with"}, {"k": "fx", "q": "Rough speaking, about fifty people came to the party.", "w": "Rough", "a": ["Roughly"], "e": "Roughly speaking"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Frankly speaking, I'm tired of this game.\nⓑ Judging by his smile, he passed the test.\nⓒ Considered the price, the hotel was great.\nⓓ Compared with Busan, Seoul is bigger.\nⓔ Generally speak, boys like sports.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ Considering / ⓔ speaking"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ from her expression, she didn't like the gift.\n____ with last month, sales have doubled.", "o": ["Judging – Comparing", "Judged – Compared", "Judging – Compared", "Judged – Comparing", "Judge – Compare"], "a": 2, "e": "Judging from / Compared with"}, {"k": "bl", "q": "(Speaking|Talking) of homework, did you finish yours? (숙제 이야기가 나와서 말인데)", "e": "Speaking(Talking) of"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "나는 내 이름이 불리는 것을 들었다. (hear, my name, call)", "a": ["I heard my name called."], "e": "목적어가 불림 → p.p."}, {"k": "wr", "q": "나는 그 다큐멘터리가 흥미롭다고 생각했다. (find, the documentary, fascinating)", "a": ["I found the documentary fascinating."], "e": "목적어가 매혹함 → v-ing"}, {"k": "wr", "q": "As it was very cold, we stayed home. → 분사구문으로 바꾸시오.", "a": ["It being very cold, we stayed home."], "e": "독립분사구문"}, {"k": "wr", "q": "After she had finished her homework, she went to bed. → 완료형 분사구문으로 바꾸시오.", "a": ["Having finished her homework, she went to bed."], "e": "Having p.p."}, {"k": "w ": "There being (독립분사구문)"}, {"k": "ch", "q": "분사구문의 의미가 '양보'인 것은?", "o": ["Walking to school, I met Jun.", "Being tired, she went to bed early.", "Though knowing the rule, he broke it.", "Taking this bus, you'll get there.", "He came in, holding a cake."], "a": 2, "e": "③ 규칙을 알면서도"}, {"k": "ch", "q": "다음 문장을 분사구문으로 바르게 바꾼 것은?\nBecause he had lost his phone, he couldn't call me.", "o": ["Losing his phone, he couldn't call me.", "Lost his phone, he couldn't call me.", "Having lost his phone, he couldn't call me.", "Having losing his phone, he couldn't call me.", "Being lost his phone, he couldn't call me."], "a": 2, "e": "앞선 때 → Having lost"}, {"k": "ch", "q": "빈칸에 알맞은 것은? ____ from the top of the hill, the town looks like a toy village.", "o": ["Seeing", "Seen", "Having seen", "Saw", "To see"], "a": 1, "e": "마을이 보임 → (Being) Seen"}, {"k": "ch", "q": "우리말과 일치하는 것은?\n그녀는 팔짱을 낀 채로 나를 쳐다보았다.", "o": ["She looked at me with her arms folding.", "She looked at me with her arms folded.", "She looked at me with folded her arms.", "She looked at me her arms folded with.", "She looked at me with her arms fold."], "a": 1, "e": "with + 명사 + p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Generally speaking, Koreans work hard.\nⓑ It being Sunday, the bank was closed.\nⓒ Comparing with yesterday, it's warmer today.\nⓓ He sat with his eyes closed.\nⓔ Having been built long ago, the bridge is weak.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ Compared with"}, {"k": "ch", "q": "분사구문을 부사절로 바꾼 것이 바른 것은?\nNot having slept well, I was tired all day.", "o": ["Because I don't sleep well, I was tired all day.", "Because I hadn't slept well, I was tired all day.", "Though I had slept well, I was tired all day.", "If I didn't sleep well, I was tired all day.", "Because I haven't slept well, I was tired all day."], "a": 1, "e": "앞선 때(had p.p.) + 부정 + 이유"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The man selling hot dogs is my uncle.", true], ["I heard my name lf"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The light turned off by itself.\nⓑ She told me to look after myself.\nⓒ They enjoyed theirselves.\nⓓ He wrote the letter himself.\nⓔ My friend asked me to help herself.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ themselves / ⓔ her"}, {"k": "ch", "q": "빈칸에 공통으로 들어갈 말은?\nShe lives by ____.\nShe was beside ____ with worry.", "o": ["her", "hers", "herself", "itself", "she"], "a": 2, "e": "by herself / beside herself"}, {"k": "bl", "q": "Help (yourself|yourselves) to the snacks. (마음껏 드세요)", "e": "help oneself to"}, {"k": "bl", "q": "The plan in (itself) was not bad. (그 자체로)", "e": "in itself"}]}}, {"tag": "hk3-08-5-1", "name": "it의 다양한 쓰임 Ⅰ", "talk": [{"k": "m", "t": "it의 다양한 쓰임 Ⅰ: ① **대명사** ② **비인칭 주어** ③ **가주어** 🔍"}, {"k": "m", "t": "① 대명사 it: 앞에 나온 **바로 그것** → I lost my key. I can't find [it]. / 구·절도 받아요: He said he was sick, but I didn't believe it."}, {"k": "m", "t": "② 비인칭 it: 시간·날씨·날짜·요일·거리·명암 — 해석 ✗ → It is getting dark. / It is 3 km to the beach."}, {"k": "q", "q": "It의 쓰임이 다른 것은?", "o": ["It is windy today.", "It is my new phone.", "It is Monday."], "a": 1, "ok": "맞아요! ②는 대명사 '그것'", "no": "날씨·요일은 비인칭 / my new phone은 '그것' → 대명사"}, {"k": "m", "t": "③ 가주어 it: 진주어(**to부정사·that절**)를 뒤로 보내고 주어 자리에 it → It is surprising **that** he won first prize."}, {"k": "m", "t": "의미상 주어: 보통 **for** + 목적격 / 사람의 성격·태도 형용사(kind, nice, wise, foolish, careless, polite, rude)는 **of** + 목적격"}, {"k": "q", "q": "It was careless ____ him to leave the door open.", "o": ["for", "of", "to"], "a": 1, "ok": "정확해요! careless(성격) → of", "no": "사람의 성격·태도 형용사 → of + 목적격"}, {"k": "m", "t": "**It takes** (사람) + 시간 + **to부정사** = ~하는 데 시간이 걸리다 → It takes 20 minutes to get there."}, {"k": "q", "q": "____ took me two hours to finish the report.", "o": ["It", "That", "This"], "a": 0, "ok": "맞아요! It takes ~ to-v", "no": "'~하는 데 시간이 걸리다' → It takes"}, {"k": "m", "t": "정리! **대명사 it · 비인칭 it · 가주어 It ~ to-v / that절 · for / of + 목적격 · It takes + 시간 용사 + to-v·that절 · it 생략 ✗ · make it a rule to-v · take it for granted that** 👍"}], "notes": {"table": [["형태", "예", "해석"], ["동사 + it + 형용사 + to-v", "I found it hard to sleep.", "나는 잠드는 것이 어렵다는 것을 알았다."], ["동사 + it + 형용사 + that절", "He made it clear that he was angry.", "그는 화가 났다는 것을 분명히 했다."], ["동사 + it + 형용사 + for + 목적격 + to-v", "The map made it easy for us to find the way.", "지도 덕분에 우리가 길을 찾기 쉬웠다."], ["make it a rule to-v", "I make it a rule to read every night.", "~하는 것을 규칙으로 하다"], ["take it for granted that", "We take it for granted that we have water.", "~을 당연하게 여기다"]], "tips": ["가목적어를 쓰는 동사: find, make, think, consider, believe", "가목적어 it은 생략 ✗ (made possible to ✗)", "진목적어 to부정사의 to 빠뜨리지 않기"]}, "sets": {"workbook": [{"k": "pk", "q": "I found [it*/that] hard to sleep last night.", "e": "가목적어 it"}, {"k": "pk", "q": "He thinks it important [to*/that] keep a diary.", "e": "진목적어 to부정사"}, {"k": "pk", "q": "She made it clear [that*/what] she didn't agree.", "e": "진목적어 that절"}, {"k": "pk", "q": "We consider it our duty [to*/for] help others.", "e": "진목적어 to부정사"}, {"k": "bl", "q": "나는 매일 아침 산책하는 것을 규칙으로 한다. → I make (it) a rule to take a walk every morning.", "e": "make it a rule to-v"}, {"k": "bl", "q": "우리는 깨끗한 물이 있는 것을 당연하게 여긴다. → We take it for (granted) that we have clean water.", "e": "take it for granted"}, {"k": "bl", "q": "그 지도는 우리가 길을 찾는 것을 쉽게 만들었다. → The map made it easy (for) us to find the way.", "e": "의미상 주어 for"}, {"k": "bl", "q": "나는 그가 늦은 것이 이상하다고 생각했다. → I thought (it) strange that he was late.", "e": "가목적어 it"}, {"k": "fx", "q": "I found that difficult to understand his words.", "w": "that", "a": ["it"], "e": "가목적어 → it"}, {"k": "fx", "q": "They believe it wrong break the rules.", "w": "break", "a": ["to break"], "e": "진목적어 → to부정사"}], "practiceA": [{"k": "ch", "q": "it의 쓰임이 나머지와 다른 것은?", "o": ["I find it easy to cook pasta.", "He made it clear that he was angry.", "I bought a new pen, but I lost it.", "She thinks it rude to be late.", "We found it hard to climb the hill."], "a": 2, "e": "③ 대명사 / 나머지 가목적어"}, {"k": "ch", "q": "빈칸에 알맞은 것은? The heavy rain made ____ impossible to play outside.", "o": ["this", "that", "it", "what", "them"], "a": 2, "e": "가목적어 it"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I think it wise to save money.", "She found it strange that he left early.", "He makes it a rule to read every day.", "We considered dangerous to go there.", "They take it for granted that their parents help them."], "a": 3, "e": "④ considered it dangerous"}, {"k": "bl", "q": "나는 영어로 말하는 것이 재미있다는 것을 알게 되었다. → I found (it) fun (to) speak in English.", "e": "가목적어 + 진목적어"}, {"k": "bl", "q": "그녀는 일찍 일어나는 것을 규칙으로 한다. → She makes it a (rule) to get up early.", "e": "make it a rule to-v"}, {"k": "pk", "q": "Smartphones make [it*/them] possible to talk with anyone.", "e": "가목적어 it"}, {"k": "pk", "q": "I think it necessary [for*/of] you to see a doctor.", "e": "necessary → for"}, {"k": "fx", "q": "He found it boring watch the movie again.", "w": "watch", "a": ["to watch"], "e": "진목적어 → to부정사"}, {"k": "ox", "q": "Many people take it for granted that the Internet is always on.", "a": true, "e": "✔ take it for granted that"}, {"k": "ox", "q": "My teacher made clear that we should be on time.", "a": false, "e": "made it clear"}], "practiceB": [{"k": "wr", "q": "나는 그 질문에 답하는 것이 어렵다는 것을 알았다. (found, it, difficult, answer the question)", "a": ["I found it difficult to answer the question."], "e": "가목적어 it"}, {"k": "wr", "q": "그는 매일 운동하는 것을 규칙으로 한다. (makes it a rule, exercise every day)", "a": ["He makes it a rule to exercise every day."], "e": "make it a rule to-v"}, {"k": "or", "q": "우리는 그녀가 거짓말을 한 것이 이상하다고 생각했다.", "a": "We thought it strange that she lied.", "e": "가목적어 + that절"}, {"k": "or", "q": "인터넷은 우리가 정보를 찾는 것을 가능하게 한다.", "a": "The Internet makes it possible for us to find information.", "e": "가목적어 + 의미상 주어"}, {"k": "fx", "q": "I consider this important to keep my promises.", "w": "this", "a": ["it"], "e": "가목적어 → it"}, {"k": "fx", "q": "She took it for grant that I would help her.", "w": "grant", "a": ["granted"], "e": "take it for granted"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I found it exciting to learn magic.\nⓑ He made it clear that he would quit.\nⓒ We thought impossible to finish it in a day.\nⓓ She makes it a rule to eat breakfast.\nⓔ I believe that wrong to lie.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ thought it impossible / ⓔ believe it wrong"}, {"k": "ch", "q": "it이 가목적어로 쓰인 것은?", "o": ["It is hard to say goodbye.", "I lost my key and couldn't find it.", "It was sunny all day.", "He thought it fun to ride a horse.", "It is surprising that she came."], "a": 3, "e": "④ 진목적어 to ride a horse"}, {"k": "bl", "q": "Do you think (it) possible to finish the work by Friday?", "e": "가목적어 it"}, {"k": "bl", "q": "We take it for granted (that) we can use electricity.", "e": "take it for granted that"}]}}, {"tag": "hk3-08-6-1", "name": "부정대명사: one", "talk": [{"k": "m", "t": "부정대명사 **one** 복습: 같은 종류의 **아무거나 하나** = one / 앞에 나온 **바로 그것** = it 1️⃣"}, {"k": "ex", "en": "I don't have a ruler. Can you lend me one?", "ko": "나는 자가 없어. 하나 빌려줄 수 있니? (아무 자나)"}, {"k": "q", "q": "I lost my umbrella yesterday. I have to find ____.", "o": ["one", "it", "ones"], "a": 1, "ok": "맞아요! 잃어버린 바로 그 우산 → it", "no": "새 우산이 아니라 잃어버린 그 우산을 찾음 → it"}, {"k": "m", "t": "복수는 **ones**, 수식어가 붙으면 a / the + 형용사 + one(s): a cheaper one, the one on the desk, the red [ones]"}, {"k": "m", "t": "⚠️ 셀 수 없는 명사(water, coffee, bread 등)는 one으로 받지 않아요 → Do you want some water? — Yes, I want some."}, {"k": "m", "t": "⚠️ 소유격 바로 뒤 one ✗ → 소유대명사: This is not my bag. It's [hers]. (her one ✗) — 형용사가 끼면 가능: my old one"}, {"k": "q", "q": "My phone is old. I want a new ____ like ____.", "o": ["one – yours", "it – yours", "one – your one"], "a": 0, "ok": "정확해요! a new one / 너의 것 yours", "no": "새것 하나 → one, 너의 것 → yours (your one ✗)"}, {"k": "m", "t": "one은 **일반 사람**도 뜻해요: One should take care of one's health. (사람은 자기 건강을 돌봐 진 것은?\nA: Where's my phone? B: I saw ____ on the sofa.\nA: I don't have an eraser. B: I'll lend you ____.", "o": ["one – it", "it – one", "it – it", "one – one", "ones – it"], "a": 1, "e": "바로 그 폰 → it / 아무 지우개 → one"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I don't like this hat. Do you have a cheaper one?", "These are old socks. I'll buy new ones.", "This is not my notebook. It's her one.", "The one in the box is a gift.", "One must do one's duty."], "a": 2, "e": "③ hers"}, {"k": "bl", "q": "그 빨간 차들은 비싸지만, 파란 것들은 싸다. → The red cars are expensive, but the blue (ones) are cheap.", "e": "복수 → ones"}, {"k": "bl", "q": "나는 그 책을 빌려서 이틀 만에 그것을 읽었다. → I borrowed the book and read (it) in two days.", "e": "바로 그 책 → it"}, {"k": "pk", "q": "Do you want some water? — Yes, I want [some*/one].", "e": "셀 수 없는 명사 → some"}, {"k": "pk", "q": "This apple is rotten. Give me a fresh [one*/it].", "e": "같은 종류 하나 → one"}, {"k": "fx", "q": "My sneakers are dirty. I need clean one.", "w": "one", "a": ["ones"], "e": "복수 → ones"}, {"k": "ox", "q": "I lost my wallet. I think someone took one. (바로 그 지갑)", "a": false, "e": "바로 그것 → it"}, {"k": "ox", "q": "Which jacket is yours? — The one with the hood.", "a": true, "e": "✔ the one + 수식어"}], "practiceB": [{"k": "wr", "q": "내 휴대전화가 고장 나서 나는 새것을 하나 사야 한다. (My phone is broken, have to, a new one)", "a": ["My phone is broken, so I have to buy a new one.", "My phone is broken. I have to buy a new one.", "My phone is broken, so I have to get a new one.", "My phone is broken. I have to get a new one.", "My phone is broken so I have to buy a new one."], "e": "a new one"}, {"k": "wr", "q": "창가에 있는 것들이 내 것이다. (The ones, by the window, mine)", "a": ["The ones by the window are mine."], "e": "the ones + 수식어"}, {"k": "or", "q": "나는 이 컵이 마음에 들지 않는다. 다른 것을 보여 주세요.", "a": "I don't like this cup. Show me another one.", "e": "another one"}, {"k": "or", "q": "사람은 자신의 가족을 돌봐야 한다.", "a": "One should take care of one's family.", "e": "일반 사람 one"}, {"k": "fx", "q": "I bought a scarf and gave one to my mom. (바로 그 스카프)", "w": "one", "a": ["it"], "e": "바로 그것 → it"}, {"k": "fx", "q": "These glasses are too strong. I need weaker one.", "w": "one", "a": ["ones"], "e": "glasses 복수 → ones"}, {"k": "ch", "q": "어법상(의미상) 옳은 문장의 개수는?\nⓐ I need a bag. I'll buy one tomorrow.\nⓑ This isn't my seat. It's his one.\nⓒ The one on the left is my brother.\nⓓ I made a cake and ate it with my family.\nⓔ These boots are too small. I need bigger one.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ his / ⓔ ones"}, {"k": "ch", "q": "빈칸에 들어갈 말이 나머지와 다른 것은?", "o": ["I need a towel. Can you give me ____?", "I like this dress, but I'll try on the long ____ too.", "He has a car, but he wants a faster ____.", "I lost my ring. I can't find ____ anywhere.", "Is there a bank near here? — Yes, there's ____ on Main Street."], "a": 3, "e": "④ it / 나머지 one"}, {"k": "bl", "q": "(One) should not judge others by their looks. (사람은)", "e": "일반 사람 one"}, {"k": "bl", "q": "My old bike was stolen, so I'm riding a new (one). (새것)", "e": "a new one"}]}}, {"tag": "hk3-08-6-2", "name": "부정대명사: some, any", "talk": [{"k": "m", "t": "**some / any** 복습: some은 긍정문·권유(부탁) 의문문 / any는 부정문·의문문 🤏"}, {"k": "m", "t": "중3 포인트 ① **any + 긍정문** = '어떤 ~라도' → Any child can join. (any + 단수 명사 가능)"}, {"k": "q", "q": "You can ask me ____ question. (어떤 질문이라도)", "o": ["some", "any", "few"], "a": 1, "ok": "맞아요! 긍정문의 any = 어떤 ~라도", "no": "'어떤 ~라도' → any"}, {"k": "m", "t": "② **not ~ any = no**: I don't have any money. = I have [no] money."}, {"k": "q", "q": "There isn't any milk. 와 뜻이 같은 것은?", "o": ["There is no milk.", "There is some milk.", "There isn't no milk."], "a": 0, "ok": "정확해요! not ~ any = no", "no": "not ~ any = no (isn't no는 이중 부정 ✗)"}, {"k": "m", "t": "③ **some of / any of + 명사** → of 뒤 명사에 수일치: Some of the money [was] stolen. / Some of the bikes were stolen."}, {"k": "m", "t": "④ someone, anything 등 + **형용사는 뒤에**: something cold, anything new → 단수 취급"}, {"k": "q", "q": "Is there ____ in the news?", "o": ["new anything", "anything new", "new something"], "a": 1, "ok": "맞아요! -thing + 형용사", "no": "형용사는 -thing 뒤 → anything new"}, {"k": "m", "t": "⚠️ any를 주어로 쓰고 뒤에 not ✗: Anyone can't do this. ✗ → **No one** can do this."}, {"k": "m", "t": "정리! **some 긍정·권유 / any 부정·의문·'어떤 ~라도' / not ~ any = no / some of + 명사 → 명사에 수일치 / -thing + 형용사** 👍"}], "notes": {"table": [["", "쓰임", "예"], ["some", "긍정문 / 권유·부탁 의문문", "I have some. / Would you like some?"], ["any", "부정문 / 의문문", "I don't have any. / Do you have any?"], ["any (긍정문)", "어떤 ~라도", "Any student can use the room."], ["not ~ any", "= no", "I don't have any time. = I have no time."], ["some of + 복수 명사", "복수 동사", "Some of the boys are tall."], ["some of + 셀 수 없는 명사", "단수 동사", "Some of the bread is moldy."]], "tips": ["someone, anything 등은 단수 취급 + 형용사는 뒤에 (something special)", "Anyone can't ~ ✗ → No one can ~", "not ~ no ✗ (이중 부정)"]}, "sets": {"workbook": [{"k": "pk", "q": "Would you like [some*/any] more tea?", "e": "권유 → some"}, {"k": "pk", "q": "I looked for my key, but I couldn't find [some/any*].", "e": "부정문 → any"}, {"k": "pk", "q": "Some of the furniture [was*/were] old.", "e": "furniture 셀 수 없음 → was"}, {"k": "pk", "q": "I want to drink [cold something/something cold*].", "e": "-thing + 형용사"}, {"k": "bl", "q": "그 일은 어떤 학생이라도 할 수 있다. → (Any) student can do the job.", "e": "긍정문의 any"}, {"k": "bl", "q": "나는 돈이 하나도 없다. → I have (no) money.", "e": "= I don't have any money."}, {"k": "bl", "q": "나는 특별한 무언가를 원한다. → I want (something) special.", "e": "something + 형용사"}, {"k": "bl", "q": "그 사과들 중 일부는 썩었다. → Some of the apples (are|were) rotten.", "e": "apples 복수"}, {"k": "fx", "q": "I don't have no plans for the weekend.", "w": "no", "a": ["any"], "e": "not ~ any (이중 부정 ✗)"}, {"k": "fx", "q": "Some of the cookies was burned.", "w": "was", "a": ["were"], "e": "cookies 복수 → were"}], "practiceA": [{"k": "ch", "q": "빈칸에 any가 들어갈 수 없는 것은?", "o": ["I don't have ____ brothers.", "Do you have ____ questions o": "나머지 여럿 전부 → the others"}, {"k": "m", "t": "정리! **one / the other · one / another / the other · some / others · some / the others · another + 숫자 + 복수 · one after another** 👍"}], "notes": {"table": [["상황", "표현"], ["둘", "one ~, the other ~"], ["셋", "one ~, another ~, the other ~"], ["여럿 (막연히)", "some ~, others ~"], ["여럿 (나머지 전부)", "some ~, the others ~"], ["형용사", "another + 단수 명사 / other + 복수 명사"], ["~ 더", "another + 숫자 + 복수 명사 (another two hours)"], ["서로 / 차례로", "each other, one another / one after another"], ["별개", "A is one thing, and B is another."]], "tips": ["the another ✗ / another + 복수 명사 ✗ (단, another + 숫자 + 복수 명사는 ○)", "남은 것이 하나 → the other / 남은 것 전부(여럿) → the others"]}, "sets": {"workbook": [{"k": "pk", "q": "I have two coats. One is black, and [another/the other*] is gray.", "e": "둘 중 나머지 → the other"}, {"k": "pk", "q": "Can I have [another*/other] piece of cake?", "e": "단수 명사 앞 → another"}, {"k": "pk", "q": "Some people like tea, and [others*/the other] like coffee.", "e": "여럿 중 막연히 → others"}, {"k": "pk", "q": "We need [another*/other] two chairs.", "e": "another + 숫자 + 복수 명사"}, {"k": "bl", "q": "그는 한 달 더 머물 것이다. → He will stay for (another) month.", "e": "another + 단수 명사"}, {"k": "bl", "q": "아이들이 차례로 들어왔다. → The children came in one after (another).", "e": "one after another"}, {"k": "bl", "q": "다섯 명 중 두 명은 남자이고, 나머지는 모두 여자이다. → Of the five, two are boys, and (the others) are girls.", "e": "나머지 전부 → the others"}, {"k": "bl", "q": "아는 것과 가르치는 것은 별개이다. → To know is one thing, and to teach is (another).", "e": "A is one thing, B is another"}, {"k": "fx", "q": "I have three pens. One is red, another is blue, and other is green.", "w": "other", "a": ["the other"], "e": "마지막 하나 → the other"}, {"k": "fx", "q": "Would you like other cookie?", "w": "other", "a": ["another"], "e": "단수 명사 앞 → another"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? This towel is wet. Please bring me ____.", "o": ["other", "another", "the others", "others", "each other"], "a": 1  지우면 She danced gracefully → 부사"}, {"k": "m", "t": "중3 포인트 ① **비교 대상 맞추기**: 앞의 명사를 반복하지 않으려면 단수는 **that (of)**, 복수는 **those (of)**"}, {"k": "ex", "en": "The climate of Jeju is not as cold as that of Seoul.", "ko": "제주의 기후는 서울의 기후만큼 춥지 않다."}, {"k": "q", "q": "The streets of this town are as clean as ____ of Paris.", "o": ["that", "those", "it"], "a": 1, "ok": "맞아요! streets(복수) → those", "no": "비교 대상이 복수명사 streets → those"}, {"k": "m", "t": "중3 포인트 ② as 뒤에 동사까지 쓰면 **주격**: as tall as [he] is / as fast as I can"}, {"k": "m", "t": "정리! **as 원급 as / not as(so) ~ as = less ~ than / 단수 that·복수 those / 형용사 vs 부사** 👍"}], "notes": {"table": [["형태", "예", "뜻"], ["as + 원급 + as", "He is as tall as his dad.", "~만큼 …한"], ["not as(so) + 원급 + as", "It isn't so cold as yesterday.", "~만큼 …하지 않은 (= less ~ than)"], ["as many / much + 명사 + as", "as many books as / as much time as", "~만큼 많은 (수 / 양)"], ["비교 대상: that of (단수)", "The price of A is as high as that of B.", "B의 가격"], ["비교 대상: those of (복수)", "The eyes of A are as big as those of B.", "B의 눈"]], "tips": ["A not as ~ as B = A less ~ than B = B가 더 ~하다", "as ~ as를 지우고 형용사·부사 판단", "소유대명사로도 맞춤: as mine / as Tom's"]}, "sets": {"workbook": [{"k": "pk", "q": "This bridge is as [long*/longer] as that one.", "e": "원급"}, {"k": "pk", "q": "I don't have as [much*/many] money as my brother.", "e": "셀 수 없는 명사 → much"}, {"k": "pk", "q": "The weather in July is as hot as [that*/those] in August.", "e": "weather(단수) → that"}, {"k": "pk", "q": "The streets of Busan are as busy as [those*/that] of Seoul.", "e": "streets(복수) → those"}, {"k": "bl", "q": "이 문제는 저 문제만큼 어렵다. → This question is as (difficult|hard) as that one.", "e": "as 원급 as"}, {"k": "bl", "q": "그는 나만큼 많은 우표를 모았다. → He collected as (many) stamps as me.", "e": "복수명사 → many"}, {"k": "bl", "q": "올해 겨울은 작년 겨울만큼 춥지 않다. → This winter is not (as|so) cold as last winter.", "e": "not as/so"}, {"k": "bl", "q": "이 도시의 인구는 저 도시의 인구만큼 많다. → The population of this city is as large as (that) of that city ge as ⓔ senior to ⓗ higher and higher ⓚ the hottest"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["I don't have as much time as you.", true], ["He ran as fast as he can yesterday.", false], ["He is not so much a coach as a friend.", true], ["The legs of a horse are longer than that of a dog.", false], ["I prefer swimming to running.", true], ["The test was very easier than I expected.", false], ["The sooner, the better.", true], ["More and more people are learning Korean.", true], ["Nothing is more important than family.", true], ["She is taller than any other girls in her class.", false], ["It's by far the best idea.", true], ["This is the most exciting game I have ever played.", true]], "e": "ⓑ could ⓓ those ⓕ much(even·still·far·a lot) easier ⓙ girl"}, {"k": "wr", "q": "Nothing is more precious than time. → 'as ~ as'를 써서 바꾸시오.", "a": ["Nothing is as precious as time.", "Nothing is so precious as time."], "e": "Nothing ~ as 원급 as"}, {"k": "wr", "q": "She doesn't work here any longer. → 'no longer'를 써서 바꾸시오.", "a": ["She no longer works here."], "e": "no longer"}]}}, {"book": "hk3", "chapter": {"id": "11", "name": "전치사", "title": "해커스 중학영문법 3학년 · Chapter 11 전치사"}, "units": [{"tag": "hk3-11-1-1", "name": "시간을 나타내는 전치사 Ⅰ", "talk": [{"k": "m", "t": "Chapter 11은 **전치사**! 시간 전치사 at · on · in부터 중3 버전으로 ⏰"}, {"k": "m", "t": "**at** + 시각·하루의 한 시점 (at 7:30, at noon, at [midnight]) / **on** + 날짜·요일·특정한 날 / **in** + 월·계절·연도·세기·오전·오후"}, {"k": "q", "q": "The Korean War broke out ____ 1950.", "o": ["at", "on", "in"], "a": 2, "ok": "맞아요! 연도 → in", "no": "연도는 in"}, {"k": "m", "t": "⚠️ 복습: 특정한 날의 아침·저녁 → **on** (on the morning of May 1st) / this·next·last·every 앞에는 전치사 ✗"}, {"k": "q", "q": "We arrived ____ the evening of June 3rd.", "o": ["in", "on", "at"], "a": 1, "ok": "정확해요! 특정한 날의 저녁 → on", "no": "6월 3일 '그날'의 저녁 → on"}, {"k": "m", "t": "중3 포인트 ① **at the beginning of / at the end of** + 기간 : ~ 초에 / ~ 말에 → at the end of the year"}, {"k": "m", "t": "중3 포인트 ② **on + 동명사"}]}}, {"book": "hk3", "chapter": {"id": "12", "name": "접속사", "title": "해커스 중학영문법 3학년 · Chapter 12 접속사"}, "units": [{"tag": "hk3-12-1", "name": "등위접속사: and, but, or, so", "talk": [{"k": "m", "t": "Chapter 12는 **접속사**! 먼저 대등하게 이어 주는 **등위접속사** and · but · or · so 🔗"}, {"k": "m", "t": "**and** 그리고 / **but** 그러나 / **or** 또는 / **so** 그래서(결과) — so는 **절과 절**을 이어요"}, {"k": "m", "t": "⭐ 중3 핵심 ① **병렬 구조**: 접속사 앞뒤는 **같은 문법 형태** — 명사·형용사·부사·동명사·to부정사·분사·동사 시제까지!"}, {"k": "ex", "en": "The room was clean, bright, and comfortable.", "ko": "그 방은 깨끗하고, 밝고, 편안했다."}, {"k": "q", "q": "He explained the rule slowly and ____.", "o": ["clear", "clearly", "clearness"], "a": 1, "ok": "맞아요! 부사(slowly) + 부사(clearly)", "no": "slowly가 부사 → 짝도 부사 clearly"}, {"k": "m", "t": "⭐ 중3 핵심 ② 긴 문장에서는 접속사 **뒤의 형태**를 보고 **앞에서 짝**을 찾아요: She decided to quit her job and [travel] around the world. (to quit ↔ (to) travel)"}, {"k": "m", "t": "분사도 병렬: a girl **wearing** a cap and [holding] a ball / 동사는 시제까지: He came home, **washed**, and [went] to bed."}, {"k": "m", "t": "**명령문, and** ~ = If you ~ (그러면) / **명령문, or** ~ = If you don't ~ = Unless you ~ (그렇지 않으면)"}, {"k": "q", "q": "Turn off the lights, ____ you'll waste energy.", "o": ["and", "or", "so"], "a": 1, "ok": "정확해요! 그렇지 않으면 → or", "no": "끄지 않으면 낭비 → 명령문, or"}, {"k": "m", "t": "정리! **병렬 = 같은 형태(품사·준동사·시제) / 명령문, and = If ~ / 명령문, or = If ~ not = Unless ~** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["and", "그리고", "She is smart and hardworking."], ["but", "그러나", "The road is narrow but safe."], ["or", "또는", "Do you want to eat out or cook at home?"], ["so", "그래서 (결과)", "I was hungry, so I made some noodles."], ["명령문, and", "그러면 (= If ~)", "Practice hard, and you'll win."], ["명령문, or", "그렇지 않으면 (= If ~ not / Unless)", "Hurry, or you'll be late."]], "tips": ["병렬: 형용사↔형용사, 부사↔부사, 동명사↔동명사, to부정사↔(to)동사원형, 분사↔분사", "동사끼리 이을 때 시제 통일", "멀리 떨어진 짝 찾기: 접속사 뒤 형태 → 앞에서 같은 형태 찾기"]}, "sets": {"workbook": [{"k": "pk", "q": "She is smart [and*/but] hardworking. (둘 다 장 ": "fx", "q": "The teacher told us to read the text and answering the questions.", "w": "answering", "a": ["answer", "to answer"], "e": "to read ↔ (to) answer"}, {"k": "ox", "q": "Be honest, and people will trust you.", "a": true, "e": "✔ 명령문, and(그러면)"}, {"k": "ox", "q": "She likes to paint, to sing, and dancing.", "a": false, "e": "병렬: to paint, to sing, and (to) dance"}], "practiceB": [{"k": "wr", "q": "If you leave now, you can catch the last train. → 명령문 + and로 바꾸시오.", "a": ["Leave now and you can catch the last train.", "Leave now, and you can catch the last train."], "e": "If you ~ = 명령문, and"}, {"k": "wr", "q": "그는 회의에 늦게 도착해서 사과했다. (arrived late for the meeting, so, apologized)", "a": ["He arrived late for the meeting so he apologized.", "He arrived late for the meeting, so he apologized."], "e": "결과 → so"}, {"k": "or", "q": "그녀는 창문을 열고 신선한 공기를 들였다.", "a": "She opened the window and let in some fresh air.", "e": "과거 시제 병렬"}, {"k": "or", "q": "조심해라, 그렇지 않으면 넘어질 것이다.", "a": "Be careful, or you will fall down.", "e": "명령문, or"}, {"k": "fx", "q": "The singer, smiling and wave to the fans, walked onto the stage.", "w": "wave", "a": ["waving"], "e": "병렬: 현재분사끼리"}, {"k": "fx", "q": "My goal is to save money and buying a new laptop.", "w": "buying", "a": ["buy", "to buy"], "e": "to save ↔ (to) buy"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He sang loudly and happily.\nⓑ I want to rest and watching TV.\nⓒ Hurry up, or you'll be late.\nⓓ She cleaned her room and does her homework.\nⓔ It was cold, so I wore gloves.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ (to) watch / ⓓ did"}, {"k": "ch", "q": "다음 문장에서 buy와 병렬을 이루는 말은? She decided to sell her old car and buy a bike.", "o": ["decided", "sell", "old", "car", "bike"], "a": 1, "e": "to sell ↔ (to) buy"}, {"k": "bl", "q": "Leave right now, (or) you'll miss the concert. (그렇지 않으면)", "e": "명령문, or"}, {"k": "bl", "q": "Exercising regularly and (eating) healthy food are important.", "e": "병렬: 동명사 주어끼리"}]}}, B"}, {"k": "bl", "q": "Not only I but also my friends (are|were) fans of the band.", "e": "B(my friends)에 일치 → 복수"}]}}, {"tag": "hk3-12-3-1", "name": "명사절을 이끄는 접속사: that", "talk": [{"k": "m", "t": "**that** + 완전한 문장 = '~라는 것' → 명사절로 **주어·목적어·보어** 자리에 📦 (중2 복습)"}, {"k": "m", "t": "주어 that절은 보통 **가주어 it**을 쓰고 뒤로: That he quit is surprising. → It is surprising that he quit."}, {"k": "q", "q": "____ is certain that the price will go up.", "o": ["It", "That", "What"], "a": 0, "ok": "맞아요! 가주어 It", "no": "뒤의 that절이 진주어 → 가주어 It"}, {"k": "m", "t": "**목적어** that은 생략 가능 / 문장 맨 앞 **주어** 자리 that은 생략 ✗"}, {"k": "m", "t": "⭐ 중3 새 포인트: **동격의 that** → 명사 + that절 = '~라는 (명사)' → the fact / news / idea / rumor / belief / hope + that"}, {"k": "ex", "en": "The news that he won the prize surprised everyone.", "ko": "그가 상을 탔다는 소식은 모두를 놀라게 했다."}, {"k": "q", "q": "I heard the rumor ____ she is moving to Busan.", "o": ["that", "what", "which"], "a": 0, "ok": "정확해요! the rumor = 그녀가 이사 간다는 것 → 동격 that", "no": "뒤가 완전한 문장 + 앞 명사의 내용 → 동격 that"}, {"k": "m", "t": "⚠️ 동격 that vs 관계대명사 that: the fact **that he lied**(완전한 문장 → 동격) / the book **that I bought**(목적어 빠짐 → 관계대명사)"}, {"k": "m", "t": "⚠️ **that vs what**: that 뒤 = 완전한 문장 / what(~하는 것) 뒤 = 불완전한 문장 → I believe [that] he is honest. / I believe what he said."}, {"k": "m", "t": "정리! **that절 = 주어(가주어 it)·목적어(생략 OK)·보어·동격 / that + 완전한 문장 · what + 불완전한 문장** 👍"}], "notes": {"table": [["역할", "예", "뜻"], ["주어 (가주어 it)", "It is clear that he lied.", "그가 거짓말한 것은 분명하다"], ["목적어 (생략 가능)", "I think (that) the plan will work.", "나는 그 계획이 효과가 있을 거라고 생각한다"], ["보어", "The problem is that we have no time.", "문제는 우리가 시간이 없다는 것이다"], ["동격", "the fact / news / idea / rumor + that ~", "~라는 사실 / 소식 / 생각 / 소문"]], "tips": ["동격 that은 생략 ✗", "that + 완전한 문장 / what + 불완전한 문장", "명사 + that + 완전 → 동격 / 명사 + that + 불완전 → 관계대명사"]}, "sets": {"workbook": [{"k": "pk", "q": "[It*/That] is true that she won first prize.", "e": "가주어 It"}, {"k": "pk", "q": "I think [that*/what] the plan
