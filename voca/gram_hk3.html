ry friendly.", "a": true, "e": "✔ 목적격 생략 + 전치사 맨 뒤"}, {"k": "ox", "q": "This is the room in which I sleep in.", "a": false, "e": "전치사는 한 번만"}], "practiceB": [{"k": "wr", "q": "This is the hotel. + We stayed at the hotel. → 전치사 + 관계대명사를 써서 한 문장으로", "a": ["This is the hotel at which we stayed."], "e": "at the hotel → at which"}, {"k": "wr", "q": "He is the man. + I spoke to him. → 전치사를 맨 뒤에 두어 한 문장으로", "a": ["He is the man whom I spoke to.", "He is the man who I spoke to.", "He is the man that I spoke to.", "He is the man I spoke to."], "e": "전치사 맨 뒤"}, {"k": "wr", "q": "그녀는 내가 의지할 수 있는 친구이다. (a friend, on whom, can depend)", "a": ["She is a friend on whom I can depend."], "e": "depend on → on whom"}, {"k": "wr", "q": "이것이 내가 관심 있는 주제이다. (the topic, in which, am interested)", "a": ["This is the topic in which I am interested.", "This is the topic in which I'm interested."], "e": "be interested in → in which"}, {"k": "fx", "q": "The woman to who I sent the letter replied.", "w": "who", "a": ["whom"], "e": "전치사 뒤 → whom"}, {"k": "fx", "q": "The pen with that she signed the paper was gold.", "w": "that", "a": ["which"], "e": "전치사 뒤 → which"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe friend ____ I went shopping was Ann.\nThe friend ____ I went shopping with was Ann.", "o": ["with whom – whom", "whom – with whom", "with that – that", "with who – who", "whose – with whom"], "a": 0, "e": "with whom / 맨 뒤 with → whom"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The girl with whom I talked is Ivy.\nⓑ This is the bed on that I sleep.\nⓒ The music I listened to was calm.\nⓓ The boy about who we talked is here.\nⓔ This is the pen with which I draw with.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 1, "e": "ⓐⓒ 옳음 / ⓑ on which / ⓓ about whom / ⓔ 끝의 with 빼기"}, {"k": "ch", "q": "관계대명사를 생략할 수 있는 것은?", "o": ["The house in which I live is big.", "The man to whom I sent it is kind.", "The song which I listened to was nice.", "The friend with whom I play is Leo.", "The box in which I keep toys is old."], "a": 2, "e": "③ 전치사가 맨 뒤일 때만 생략 가능"}, {"k": "bl", "q": "우리가 기다리던 버스가 마침내 왔다. → The bus for (which) we were waiting finally came.", "e": "wait for → for which"}]}}, {"tag": "hk3-13-6", "name": "관계부사의 역할과 종류", "talk": [{"k": "m", "t": "**관계부사** = 접속사 + 부사! 시간 **when** / 장소 **where** / 이유 **why** / 방법 **how** 🗺️"}, {"k": "ex", "en": "I still remember the day when I first met you.", "ko": "나는 너를 처음 만난 날을 아직도 기억한다."}, {"k": "m", "t": "관계부사 = **전치사 + which**: the city where I live = the city [in] which I live"}, {"k": "q", "q": "This is the café ____ we first met.", "o": ["when", "where", "which"], "a": 1, "ok": "맞아요! 장소 + 완전한 문장 → where", "no": "café(장소) + 뒤 문장 완전 → where"}, {"k": "m", "t": "⚠️ 관계부사 뒤 = **완전한 문장** / 관계대명사 뒤 = 목적어 등이 빠진 **불완전한 문장**"}, {"k": "q", "q": "This is the café ____ we visited last week.", "o": ["where", "which", "why"], "a": 1, "ok": "정확해요! visited의 목적어가 빠짐 → which", "no": "visit는 목적어가 필요 → 불완전 → which"}, {"k": "m", "t": "중3 포인트! 선행사가 the place, the time, the reason처럼 **일반적이면** 선행사나 관계부사 중 하나를 생략할 수 있어요"}, {"k": "ex", "en": "This is where I live. / That is why I was late.", "ko": "이곳이 내가 사는 곳이다. / 그것이 내가 늦은 이유이다. (the place, the reason 생략)"}, {"k": "m", "t": "⚠️ the way how ✗ → **the way** 또는 **how** 하나만"}, {"k": "m", "t": "정리! **when·where·why·how = 전치사 + which / 뒤 완전 / the way how ✗ / 일반 선행사 생략 가능** 👍"}], "notes": {"table": [["선행사", "관계부사", "= 전치사 + which"], ["시간 (the day, the year)", "when", "on / in / at which"], ["장소 (the place, the city)", "where", "in / at which"], ["이유 (the reason)", "why", "for which"], ["방법 (the way)", "how", "in which (the way how ✗)"]], "tips": ["관계부사 뒤 완전한 문장 ↔ which 뒤 불완전한 문장", "the time / the place / the reason은 선행사 또는 관계부사 생략 가능: That's why … / This is where …", "the way how ✗ → the way / how 중 하나"]}, "sets": {"workbook": [{"k": "pk", "q": "This is the hospital [where*/when] I was born.", "e": "장소 → where"}, {"k": "pk", "q": "Do you remember the year [when*/where] we moved here?", "e": "시간 → when"}, {"k": "pk", "q": "That's the reason [why*/which] I called you.", "e": "이유 + 완전 → why"}, {"k": "pk", "q": "This is [how*/the way how] I made this pizza.", "e": "the way how ✗"}, {"k": "bl", "q": "여기가 우리가 캠핑했던 곳이다. → This is the place (where) we camped.", "e": "장소"}, {"k": "bl", "q": "그는 자신이 화난 이유를 말하지 않았다. → He didn't tell me the reason (why) he was angry.", "e": "이유"}, {"k": "bl", "q": "This is the house where I grew up. = This is the house (in) (which) I grew up.", "e": "where = in which"}, {"k": "bl", "q": "그것이 내가 영어를 공부하는 방법이다. → That is (how) I study English.", "e": "방법 → how"}, {"k": "fx", "q": "This is the park when we had a picnic.", "w": "when", "a": ["where", "in which"], "e": "장소 → where"}, {"k": "fx", "q": "Tell me the reason where you left early.", "w": "where", "a": ["why", "for which"], "e": "이유 → why"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Summer is the season ____ many people go to the beach.", "o": ["where", "why", "when", "how", "which"], "a": 2, "e": "시간 → when"}, {"k": "ch", "q": "빈칸에 where가 들어갈 수 없는 것은?", "o": ["This is the shop ____ I bought my shoes.", "Jeju is the island ____ my aunt lives.", "This is the town ____ I visited last summer.", "I found a place ____ we can rest.", "That's the gym ____ I work out."], "a": 2, "e": "③ visited의 목적어 빠짐 → which / that"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["This is where I keep my diary.", "That's why I like her.", "This is the way how I solved it.", "Do you know the time when the movie starts?", "This is the library where I study."], "a": 2, "e": "③ the way how ✗"}, {"k": "bl", "q": "그곳이 내가 휴대폰을 잃어버린 곳이다. → That's (where) I lost my phone.", "e": "the place 생략 → where"}, {"k": "bl", "q": "그것이 그가 시험에 떨어진 이유이다. → That's (why) he failed the test.", "e": "the reason 생략 → why"}, {"k": "pk", "q": "This is the restaurant [where*/which] we had dinner.", "e": "뒤 완전 → where"}, {"k": "pk", "q": "This is the restaurant [where/which*] my uncle runs.", "e": "runs의 목적어 빠짐 → which"}, {"k": "fx", "q": "Winter is the season where it snows a lot.", "w": "where", "a": ["when"], "e": "시간 → when"}, {"k": "ox", "q": "I'll never forget the moment when I heard the news.", "a": true, "e": "✔"}, {"k": "ox", "q": "This is the museum where we visited yesterday.", "a": false, "e": "visited의 목적어 빠짐 → which / that"}], "practiceB": [{"k": "or", "q": "이곳이 그 사고가 일어난 곳이다.", "a": "This is the place where the accident happened.", "e": "where"}, {"k": "or", "q": "나는 그녀가 슬퍼하는 이유를 모른다.", "a": "I don't know the reason why she is sad.", "e": "why"}, {"k": "wr", "q": "This is the hall. + The concert was held in the hall. → 관계부사를 써서 한 문장으로", "a": ["This is the hall where the concert was held."], "e": "in the hall → where"}, {"k": "wr", "q": "I remember the day. + I won the race on that day. → 관계부사를 써서 한 문장으로", "a": ["I remember the day when I won the race."], "e": "on that day → when"}, {"k": "wr", "q": "이것이 그가 그 문제를 푼 방법이다. (this, how, solved the problem)", "a": ["This is how he solved the problem.", "This is the way he solved the problem.", "This is the way in which he solved the problem."], "e": "how / the way"}, {"k": "fx", "q": "This is the village which my grandparents live.", "w": "which", "a": ["where", "in which"], "e": "뒤 문장 완전 → where"}, {"k": "pk", "q": "Show me [how*/the way how] this machine works.", "e": "the way how ✗"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThis is the city ____ I was born.\nThis is the city ____ I love most.", "o": ["where – where", "which – where", "where – which", "when – which", "why – where"], "a": 2, "e": "완전 → where / love의 목적어 빠짐 → which"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ This is the room where I sleep.\nⓑ That's why I was late.\nⓒ This is the way how he works.\nⓓ I remember the day when we met.\nⓔ This is the park which we played.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ how 또는 the way 하나만 / ⓔ where"}, {"k": "bl", "q": "내가 도착한 날은 비가 왔다. → The day on (which) I arrived was rainy.", "e": "on which = when"}]}}, {"tag": "hk3-13-7", "name": "관계사의 계속적 용법", "talk": [{"k": "m", "t": "중3 새 포인트! 관계사 앞에 **쉼표(,)** 가 있으면 **계속적 용법** — 선행사에 대해 **덧붙여 설명**해요 ✍️"}, {"k": "ex", "en": "I have a brother, who lives in Canada.", "ko": "나는 형이 한 명 있는데, 그는 캐나다에 산다. (쉼표가 없으면 '캐나다에 사는 형' — 다른 형이 더 있을 수도)"}, {"k": "m", "t": "계속적 용법 = **접속사(and, but) + 대명사**: , who = and he / , which = and it"}, {"k": "q", "q": "I met Jake, ____ told me the news.", "o": ["that", "who", "what"], "a": 1, "ok": "맞아요! 계속적 용법 → , who", "no": "쉼표 뒤에는 that·what ✗ → who"}, {"k": "m", "t": "⚠️ 계속적 용법에는 **that ✗, what ✗**, 관계대명사 **생략 ✗**"}, {"k": "m", "t": ", which는 **앞 문장 전체**를 받을 수도 있어요: He passed the exam, **which** surprised everyone. (= and it)"}, {"k": "m", "t": "관계부사도 계속적 용법: **, when** = and then / **, where** = and there (why·how는 ✗)"}, {"k": "q", "q": "We went to Busan, ____ we visited a fish market.", "o": ["where", "which", "that"], "a": 0, "ok": "정확해요! and there → , where", "no": "뒤 문장이 완전 + 장소 Busan → , where"}, {"k": "m", "t": "수량 표현 + of whom / of which: I have two sisters, **both of whom** are tall. (both of them → both of [whom])"}, {"k": "m", "t": "정리! **, who / , which(앞 문장 전체 OK) / , when / , where / that·what·생략 ✗** 👍"}], "notes": {"table": [["계속적 용법", "=", "예"], [", who", "and / but + he·she·they", "I called Mina, who didn't answer."], [", which", "and / but + it (앞 문장 전체도 가능)", "He was late, which made me angry."], [", when", "and then", "in 2020, when I was 12"], [", where", "and there", "to Paris, where I met Tom"], ["수량 + of whom / which", "some of them → some of whom", "two sons, both of whom are doctors"]], "tips": ["계속적 용법 ✗: that, what, why, how, 관계대명사 생략", "해석은 앞에서부터: '~인데, 그는(그것은) …'", ", who / , which 뒤 동사도 선행사에 수일치"]}, "sets": {"workbook": [{"k": "pk", "q": "I have an aunt, [who*/that] is a nurse.", "e": "쉼표 뒤 that ✗"}, {"k": "pk", "q": "He gave me a book, [which*/what] was very interesting.", "e": "쉼표 뒤 what ✗"}, {"k": "pk", "q": "She lost her phone, [which*/that] made her upset.", "e": "앞 문장 전체 → , which"}, {"k": "pk", "q": "We visited Gyeongju, [where*/which] we saw many old temples.", "e": "and there → , where"}, {"k": "bl", "q": "나는 Tom을 만났는데, 그는 나에게 그 소식을 말해 주었다. → I met Tom, (who) told me the news.", "e": ", who = and he"}, {"k": "bl", "q": "그는 그 시합에서 이겼는데, 그것은 우리를 기쁘게 했다. → He won the match, (which) made us happy.", "e": "앞 문장 전체 → , which"}, {"k": "bl", "q": "I have two dogs, and both of them are white. = I have two dogs, both of (which) are white.", "e": "동물 → of which"}, {"k": "bl", "q": "I went to Rome, and there I met an old friend. = I went to Rome, (where) I met an old friend.", "e": "and there → , where"}, {"k": "fx", "q": "My uncle, that lives in Jeju, grows oranges.", "w": "that", "a": ["who"], "e": "계속적 용법 that ✗ → who"}, {"k": "fx", "q": "I bought a new laptop, who works very fast.", "w": "who", "a": ["which"], "e": "사물 → which"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I called Minji, ____ didn't answer the phone.", "o": ["that", "which", "who", "what", "whose"], "a": 2, "e": "사람 + 계속적 → , who"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I have a sister, who is a teacher.", "o": ["I have a sister, and she is a teacher.", "I have a sister, but she is a teacher.", "I have a sister, and it is a teacher.", "I have a sister who is a teacher, and I have more sisters.", "I have a sister, because she is a teacher."], "a": 0, "e": ", who = and she"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["She has a son, who is a pilot.", "He broke the vase, which made his mom angry.", "We met in 2019, when I was in Seoul.", "I visited Paris, that is a beautiful city.", "He has three cars, two of which are red."], "a": 3, "e": "④ , which (계속적 용법 that ✗)"}, {"k": "bl", "q": "그는 아들이 둘 있는데, 둘 다 의사이다. → He has two sons, both of (whom) are doctors.", "e": "사람 → of whom"}, {"k": "bl", "q": "우리는 호텔에 도착했는데, 거기서 저녁을 먹었다. → We arrived at the hotel, (where) we had dinner.", "e": "and there → , where"}, {"k": "pk", "q": "She said nothing, [which*/what] made me nervous.", "e": "앞 문장 전체 → , which"}, {"k": "pk", "q": "I moved here in 2020, [when*/where] I was eleven.", "e": "and then → , when"}, {"k": "fx", "q": "He told me a funny story, what made me laugh.", "w": "what", "a": ["which"], "e": "계속적 용법 what ✗ → which"}, {"k": "ox", "q": "I like Mr. Lee, who teaches us science.", "a": true, "e": "✔"}, {"k": "ox", "q": "This is my best friend, that always helps me.", "a": false, "e": "계속적 용법 that ✗ → who"}], "practiceB": [{"k": "or", "q": "나는 그 책을 읽었는데, 그것은 매우 감동적이었다.", "a": "I read the book, which was very touching.", "e": ", which"}, {"k": "or", "q": "그는 일찍 일어났는데, 그것은 드문 일이었다.", "a": "He got up early, which was unusual.", "e": "앞 문장 전체 → , which"}, {"k": "wr", "q": "I met Ms. Kang, and she is my old teacher. → 계속적 용법의 관계대명사를 써서", "a": ["I met Ms. Kang, who is my old teacher."], "e": "and she → , who"}, {"k": "wr", "q": "He failed the test, and it made him sad. → 계속적 용법의 관계대명사를 써서", "a": ["He failed the test, which made him sad."], "e": "and it → , which"}, {"k": "wr", "q": "I have many friends, and most of them like soccer. → 'most of + 관계대명사'를 써서", "a": ["I have many friends, most of whom like soccer."], "e": "most of them → most of whom"}, {"k": "fx", "q": "We went to the beach, which we swam all day.", "w": "which", "a": ["where"], "e": "뒤 문장 완전 → , where"}, {"k": "fx", "q": "I have three cousins, all of them live in Busan.", "w": "them", "a": ["whom"], "e": "접속사가 없으므로 them → whom"}, {"k": "ch", "q": "관계사를 that으로 바꿀 수 있는 것은? (문장마다 관계사는 하나)", "o": ["I met Sam, who is my neighbor.", "He lost his key, which upset him.", "The boy who is singing is Jay.", "I have a cat, which is black.", "She went to Busan, where she was born."], "a": 2, "e": "③ 쉼표 없는 한정적 용법만 that 가능"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I met Emma, who is from Canada.\nⓑ He came late, which made me angry.\nⓒ I bought a bag, that was cheap.\nⓓ I have two pens, both of which are blue.\nⓔ We went to the zoo, which we saw pandas.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ which / ⓔ where"}, {"k": "bl", "q": "그녀는 영어를 잘 말하는데, 그것이 나를 놀라게 했다. → She speaks English well, (which) surprised me.", "e": "앞 문장 전체 → , which"}]}}, {"tag": "hk3-13-8", "name": "복합관계사", "talk": [{"k": "m", "t": "마지막! **복합관계사** = 관계사 + **-ever**. 선행사를 품고 있어서 앞에 선행사가 없어요 ✨"}, {"k": "m", "t": "**복합관계대명사**: whoever(~하는 누구든지), whatever(~하는 무엇이든지), whichever(~하는 어느 것이든지)"}, {"k": "ex", "en": "Whoever comes first will get a prize.", "ko": "먼저 오는 사람은 누구든지 상을 받을 것이다. (= Anyone who)"}, {"k": "ex", "en": "You can eat whatever you want.", "ko": "너는 원하는 것은 무엇이든지 먹어도 된다. (= anything that)"}, {"k": "m", "t": "양보의 뜻 '무엇을 ~하더라도'도 있어요: Whatever you say, I won't change my mind. = **No matter what** you say, …"}, {"k": "q", "q": "____ wants to join the club can sign up here.", "o": ["Whoever", "Whatever", "Whenever"], "a": 0, "ok": "맞아요! ~하는 누구든지 → Whoever", "no": "가입하고 싶은 '사람 누구든지' → Whoever"}, {"k": "m", "t": "**복합관계부사**: whenever(~할 때마다 / 언제 ~하더라도), wherever(~하는 곳은 어디든지 / 어디에 ~하더라도), however(아무리 ~하더라도)"}, {"k": "m", "t": "⚠️ however는 **However + 형용사·부사 + 주어 + 동사**: However tired you are, … = No matter how tired you are, …"}, {"k": "q", "q": "____ hard it is, I won't give up.", "o": ["Whatever", "However", "Whenever"], "a": 1, "ok": "정확해요! However + 형용사 + 주어 + 동사", "no": "hard(형용사)가 바로 뒤에 → However"}, {"k": "m", "t": "🎉 Chapter 13 관계사 끝! **who·which·whose·that·what·전치사 + which·관계부사·계속적 용법·-ever** 전부 정복 👍"}], "notes": {"table": [["복합관계사", "명사절 / 부사절 뜻", "바꿔 쓰기"], ["whoever", "~하는 누구든지 / 누가 ~하더라도", "anyone who / no matter who"], ["whatever", "~하는 무엇이든지 / 무엇을 ~하더라도", "anything that / no matter what"], ["whichever", "~하는 어느 것이든지 / 어느 것을 ~하더라도", "any one that / no matter which"], ["whenever", "~할 때마다 / 언제 ~하더라도", "at any time when / no matter when"], ["wherever", "~하는 곳은 어디든지 / 어디에 ~하더라도", "at any place where / no matter where"], ["however", "아무리 ~하더라도", "no matter how"]], "tips": ["However + 형용사·부사 + 주어 + 동사 (However you are tired ✗)", "복합관계사 앞에는 선행사가 없음 (anyone whoever ✗)", "Whoever가 이끄는 절이 주어면 동사는 단수: Whoever wins gets a medal."]}, "sets": {"workbook": [{"k": "pk", "q": "[Whoever*/Whatever] comes first will get a free drink.", "e": "사람 누구든지 → Whoever"}, {"k": "pk", "q": "You can order [whatever*/whoever] you like from the menu.", "e": "무엇이든지 → whatever"}, {"k": "pk", "q": "[Whenever*/Wherever] I hear this song, I think of you.", "e": "~할 때마다 → Whenever"}, {"k": "pk", "q": "[However*/Whatever] tired you are, you should finish your homework.", "e": "However + 형용사"}, {"k": "bl", "q": "네가 원하는 사람은 누구든지 초대해도 된다. → You can invite (whoever|whomever) you want.", "e": "~하는 누구든지"}, {"k": "bl", "q": "네가 어디를 가더라도 나는 너를 따라갈 것이다. → (Wherever) you go, I will follow you.", "e": "어디에 ~하더라도"}, {"k": "bl", "q": "Whatever happens, don't give up. = (No) (matter) (what) happens, don't give up.", "e": "Whatever = No matter what"}, {"k": "bl", "q": "However hard you try, you can't finish it in a day. = No matter (how) hard you try, you can't finish it in a day.", "e": "However = No matter how"}, {"k": "fx", "q": "Whatever wants to join the team must practice every day.", "w": "Whatever", "a": ["Whoever"], "e": "사람 → Whoever"}, {"k": "fx", "q": "You can sit whoever you like.", "w": "whoever", "a": ["wherever"], "e": "장소 → wherever"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ you do, do your best.", "o": ["Whoever", "Whatever", "However", "Whenever", "Wherever"], "a": 1, "e": "무엇을 하더라도 → Whatever"}, {"k": "ch", "q": "다음 문장의 Anyone who와 바꿔 쓸 수 있는 것은?\nAnyone who needs help can call this number.", "o": ["Whatever", "Whoever", "Whichever", "However", "Whenever"], "a": 1, "e": "anyone who = whoever"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Whoever calls, tell them I'm out.", "Take whichever you want.", "However fast you run, you can't catch him.", "Wherever you go, I'll be with you.", "However you are rich, you can't buy happiness."], "a": 4, "e": "⑤ However rich you are"}, {"k": "bl", "q": "그녀는 외출할 때마다 우산을 가지고 간다. → (Whenever) she goes out, she takes an umbrella.", "e": "~할 때마다"}, {"k": "bl", "q": "No matter what he says, I won't believe him. = (Whatever) he says, I won't believe him.", "e": "No matter what = Whatever"}, {"k": "pk", "q": "Sit [wherever*/whatever] you want.", "e": "장소 → wherever"}, {"k": "pk", "q": "[Whichever*/Whoever] you choose, you will like it. (두 케이크 중)", "e": "어느 것 → Whichever"}, {"k": "fx", "q": "Whoever say that is lying.", "w": "say", "a": ["says"], "e": "Whoever절 동사 → 단수 says"}, {"k": "ox", "q": "However hard it rains, the game will go on.", "a": true, "e": "✔ However + 부사 + 주어 + 동사"}, {"k": "ox", "q": "Whenever you are, I will find you.", "a": false, "e": "장소 → Wherever"}], "practiceB": [{"k": "or", "q": "네가 무엇을 하더라도 나는 너를 믿을 것이다.", "a": "Whatever you do, I will trust you.", "e": "Whatever"}, {"k": "or", "q": "아무리 피곤하더라도 그는 매일 운동한다.", "a": "However tired he is, he exercises every day.", "e": "However + 형용사 + 주어 + 동사"}, {"k": "wr", "q": "Anything that you say will be kept secret. → 복합관계대명사로 시작하여", "a": ["Whatever you say will be kept secret."], "e": "anything that = whatever"}, {"k": "wr", "q": "No matter how hard the test is, I will pass it. → however를 써서", "a": ["However hard the test is, I will pass it.", "However hard the test is I will pass it."], "e": "However + 형용사 + 주어 + 동사"}, {"k": "wr", "q": "나는 시간이 날 때마다 책을 읽는다. (whenever, have time, read books)", "a": ["Whenever I have time, I read books.", "Whenever I have time I read books.", "I read books whenever I have time."], "e": "whenever"}, {"k": "fx", "q": "Whoever you go, you will find kind people.", "w": "Whoever", "a": ["Wherever"], "e": "어디에 가더라도 → Wherever"}, {"k": "pk", "q": "[However cold it is*/However it is cold], he wears shorts.", "e": "However + 형용사 + 주어 + 동사"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ wins the game will get a medal.\n____ he goes, his dog follows him.\n____ busy she is, she calls her mom every day.", "o": ["Whoever – Wherever – However", "Whatever – Wherever – However", "Whoever – Whenever – Whatever", "Whoever – However – Wherever", "Whatever – Whoever – However"], "a": 0, "e": "누구든지 / 어디에 가든지 / 아무리 ~해도"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Whoever comes late will clean the room.\nⓑ You can take whatever you need.\nⓒ However you are tired, finish it.\nⓓ Whenever I see him, he is smiling.\nⓔ Whoever want this book can take it.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ However tired you are / ⓔ wants"}, {"k": "bl", "q": "No matter who calls, don't open the door. = (Whoever) calls, don't open the door.", "e": "No matter who = Whoever"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "나는 이모가 한 명 있는데, 그녀는 런던에 산다. (an aunt, who, lives in London / 계속적 용법)", "a": ["I have an aunt, who lives in London."], "e": ", who"}, {"k": "wr", "q": "The boy is my cousin. + His dream is to be a chef. → whose를 써서 한 문장으로", "a": ["The boy whose dream is to be a chef is my cousin."], "e": "His → whose"}, {"k": "wr", "q": "그녀가 나에게 말한 것은 거짓말이었다. (what, told me, a lie)", "a": ["What she told me was a lie."], "e": "what"}, {"k": "wr", "q": "This is the house. + I was born in the house. → 관계부사를 써서 한 문장으로", "a": ["This is the house where I was born."], "e": "in the house → where"}, {"k": "wr", "q": "No matter what you say, I won't change my mind. → whatever를 써서", "a": ["Whatever you say, I won't change my mind.", "Whatever you say, I will not change my mind.", "Whatever you say I won't change my mind.", "Whatever you say I will not change my mind."], "e": "No matter what = Whatever"}, {"k": "bl", "q": "그는 정답을 맞혔는데, 그것이 선생님을 놀라게 했다. → He got the right answer, (which) surprised the teacher.", "e": "앞 문장 전체 → , which"}, {"k": "bl", "q": "이분들이 내가 함께 일하는 동료들이다. → These are the coworkers with (whom) I work.", "e": "전치사 + whom"}, {"k": "fx", "q": "The man which car was stolen called the police.", "w": "which", "a": ["whose"], "e": "그의 차 → whose"}, {"k": "fx", "q": "The people who lives next door are noisy.", "w": "lives", "a": ["live"], "e": "선행사 people → live"}, {"k": "or", "q": "아무리 바쁘더라도 그녀는 아침을 먹는다.", "a": "However busy she is, she eats breakfast.", "e": "However + 형용사 + 주어 + 동사"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? I know a woman ____ son plays for a soccer team.", "o": ["who", "whom", "whose", "which", "that"], "a": 2, "e": "그녀의 아들 → whose"}, {"k": "ch", "q": "빈칸에 공통으로 알맞은 것은?\nHe is the fastest runner ____ I have ever seen.\nLook at the boy and his dog ____ are running.", "o": ["who", "which", "that", "what", "whose"], "a": 2, "e": "최상급 / 사람 + 동물 → that"}, {"k": "ch", "q": "빈칸에 what이 들어갈 수 있는 것은?", "o": ["This is the cap ____ I lost.", "____ I lost was a cap.", "I met a man ____ lost his cap.", "He is the boy ____ cap is red.", "The cap ____ is on the desk is mine."], "a": 1, "e": "② 선행사 없음"}, {"k": "ch", "q": "관계대명사를 생략할 수 있는 것은?", "o": ["The man who lives here is a baker.", "I have a friend, who lives in Busan.", "The book which I borrowed was fun.", "The girl whose bag is red is Ami.", "The house in which I live is small."], "a": 2, "e": "③ 목적격 (계속적 용법·전치사 뒤는 생략 ✗)"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The man with whom I work is kind.", "He passed the test, which surprised us.", "The girl to who I gave a card is Mia.", "This is where I study.", "Whoever comes first will win."], "a": 2, "e": "③ to whom"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThis is the museum ____ I visited last year.\nThis is the museum ____ I saw the famous painting.", "o": ["where – which", "which – where", "which – which", "where – where", "when – where"], "a": 1, "e": "목적어 빠짐 → which / 완전 → where"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I have two sisters, both of whom are nurses.", "o": ["I have two sisters, and both of them are nurses.", "I have two sisters who are nurses, and I have more sisters.", "I have two sisters, but neither of them is a nurse.", "I have two sisters, and one of them is a nurse.", "I have two sisters, and both of it are nurses."], "a": 0, "e": "both of whom = and both of them"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? However hard you try, you can't move the rock.", "o": ["Whenever you try hard, you can move the rock.", "No matter how hard you try, you can't move the rock.", "If you try hard, you can move the rock.", "Whatever you try, you can move the rock.", "Because you try hard, you can't move the rock."], "a": 1, "e": "However = No matter how"}, {"k": "ch", "q": "빈칸에 that을 쓸 수 없는 것은?", "o": ["The bike ____ I want is expensive.", "She is the only friend ____ I have.", "I met Jake, ____ is my neighbor.", "There is nothing ____ I can do.", "The boy ____ is singing is Dan."], "a": 2, "e": "③ 계속적 용법 → who"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The man who I think is honest is Mr. Han.\nⓑ This is the bag what I bought.\nⓒ I visited Jeju, where I rode a horse.\nⓓ The students who studies hard will pass.\nⓔ The house the roof of which is red is mine.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ that·which / ⓓ study"}, {"k": "ch", "q": "다음 우리말을 영어로 옮긴 것으로 알맞은 것은?\n그는 시험에 떨어졌는데, 그것이 그의 부모님을 실망시켰다.", "o": ["He failed the test, that disappointed his parents.", "He failed the test, what disappointed his parents.", "He failed the test, which disappointed his parents.", "He failed the test, who disappointed his parents.", "He failed the test which it disappointed his parents."], "a": 2, "e": "앞 문장 전체 → , which"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The girl who lives upstairs plays the flute.", true], ["This is the phone which I bought it last week.", false], ["I have a friend whose father is a pilot.", true], ["What I need is a long vacation.", true], ["The boys who is playing soccer are my friends.", false], ["This is the café where we first met.", true], ["The man to whom I spoke was very polite.", true], ["Tell me the reason when you were late.", false], ["I met Ms. Yoon, who is my old teacher.", true], ["He is the first person that came here.", true], ["This is the way how I cook rice.", false], ["Wherever you go, I will go with you.", true]], "e": "ⓑ it 빼기 ⓔ are ⓗ why ⓚ how 또는 the way 하나만"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The cake which my mom made was sweet.", true], ["The man lives next door is a doctor.", false], ["He broke his leg, which made him sad.", true], ["This is the room in that I study.", false], ["I have two cats, both of which are white.", true], ["That I want is a new bike.", false], ["This is the town where I grew up.", true], ["I bought a hat, that was very cheap.", false], ["The letter written in English is from Tom.", true], ["Whoever wins the race will get a prize.", true], ["However tired you are, you should not skip class.", true], ["The students who studies hard will pass.", false]], "e": "ⓑ who lives ⓓ in which ⓕ What ⓗ which ⓛ study"}, {"k": "wr", "q": "I went to Paris, and there I met my cousin. → 계속적 용법의 관계부사를 써서", "a": ["I went to Paris, where I met my cousin."], "e": "and there → , where"}, {"k": "wr", "q": "'네가 어디에 가더라도 나는 너를 기억할 것이다.'를 영어로 쓰시오. (wherever, go, remember)", "a": ["Wherever you go, I will remember you.", "Wherever you go I will remember you.", "I will remember you wherever you go.", "Wherever you go, I'll remember you."], "e": "Wherever"}]}}, {"book": "hk3", "chapter": {"id": "14", "name": "가정법", "title": "해커스 중학영문법 3학년 · Chapter 14 가정법"}, "units": [{"tag": "hk3-14-1", "name": "가정법 과거와 가정법 과거완료", "talk": [{"k": "m", "t": "Chapter 14는 **가정법**! 사실과 **반대**되는 상황을 상상해요 💭 중2 복습부터!"}, {"k": "m", "t": "**가정법 과거** (현재 사실 반대): If + 주어 + **과거형(were)**, 주어 + **would/could/might + 동사원형**"}, {"k": "ex", "en": "If I had a car, I would drive you home.", "ko": "내가 차가 있다면 너를 집에 태워다 줄 텐데. (지금 차가 없음)"}, {"k": "m", "t": "**가정법 과거완료** (과거 사실 반대): If + 주어 + **had p.p.**, 주어 + would/could/might + [have] p.p."}, {"k": "ex", "en": "If I had left earlier, I could have caught the train.", "ko": "내가 더 일찍 출발했더라면 기차를 탈 수 있었을 텐데. (일찍 출발하지 않았음)"}, {"k": "q", "q": "If she ____ the news yesterday, she would have called me.", "o": ["heard", "had heard", "has heard"], "a": 1, "ok": "맞아요! 과거 사실 반대 → had heard", "no": "yesterday + 주절 would have called → If절 had p.p."}, {"k": "m", "t": "⚠️ 단순 조건문(일어날 수 있는 일)은 If + **현재**, will: If it **is** sunny tomorrow, we **will** go out."}, {"k": "q", "q": "If you ____ me, I would lend you the money. (사실은 부탁하지 않음)", "o": ["ask", "asked", "had asked"], "a": 1, "ok": "정확해요! 가정법 과거 → asked", "no": "주절 would lend(동사원형) → If절 과거형 asked"}, {"k": "m", "t": "⚠️ 시간 단서로 구별: **now, today** → 가정법 과거 / **yesterday, then, last ~** → 가정법 과거완료"}, {"k": "m", "t": "정리! **과거형 + would 동사원형 = 지금 반대 / had p.p. + would have p.p. = 그때 반대** 👍"}], "notes": {"table": [["종류", "If절", "주절", "뜻"], ["단순 조건", "현재형", "will + 동사원형", "일어날 수 있는 일"], ["가정법 과거", "과거형 (were)", "would / could / might + 동사원형", "현재 사실 반대"], ["가정법 과거완료", "had p.p.", "would / could / might + have p.p.", "과거 사실 반대"]], "tips": ["주절이 앞에 와도 같음: I would buy it if I had money.", "가정법 과거의 be동사는 인칭과 상관없이 were", "might = ~할지도 모를 텐데"]}, "sets": {"workbook": [{"k": "pk", "q": "If I [had*/have] wings, I would fly to the moon.", "e": "가정법 과거 → had"}, {"k": "pk", "q": "If he had studied harder, he [would have passed*/would pass] the exam last week.", "e": "last week → would have p.p."}, {"k": "pk", "q": "If it [rains*/rained] tomorrow, we will cancel the picnic.", "e": "단순 조건 → 현재형"}, {"k": "pk", "q": "If I [were*/am] you, I would talk to her.", "e": "가정법 과거 → were"}, {"k": "bl", "q": "내가 그녀의 주소를 안다면, 그녀에게 편지를 쓸 텐데. → If I (knew) her address, I (would) write to her.", "e": "과거형 / would"}, {"k": "bl", "q": "네가 나에게 말했더라면, 내가 도왔을 텐데. → If you (had) (told) me, I would have helped you.", "e": "had told"}, {"k": "bl", "q": "그가 여기 있다면, 우리는 더 즐거울 텐데. → If he (were) here, we would have more fun.", "e": "were"}, {"k": "bl", "q": "우리가 택시를 탔더라면 늦지 않았을 텐데. → If we had taken a taxi, we (wouldn't|would not) (have) been late.", "e": "would not have p.p."}, {"k": "fx", "q": "If I have more time, I would learn to play the guitar.", "w": "have", "a": ["had"], "e": "가정법 과거 → had"}, {"k": "fx", "q": "If she had come to the party last night, she would enjoy it.", "w": "enjoy", "a": ["have enjoyed"], "e": "last night → would have enjoyed"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? If I ____ a millionaire, I would build a hospital.", "o": ["am", "be", "were", "will be", "had been"], "a": 2, "e": "가정법 과거 → were"}, {"k": "ch", "q": "빈칸에 알맞은 것은? If they had practiced more, they ____ the game yesterday.", "o": ["will win", "would win", "won", "could have won", "can win"], "a": 3, "e": "가정법 과거완료 → could have won"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["If I were taller, I could reach the shelf.", "If it snows tonight, we will make a snowman.", "If he had known it, he would have told us.", "If she has a car, she would drive to work.", "If you had asked, I might have said yes."], "a": 3, "e": "④ had"}, {"k": "bl", "q": "내가 너라면, 그 제안을 받아들일 텐데. → If I (were) you, I (would) accept the offer.", "e": "were / would"}, {"k": "bl", "q": "내가 그 버스를 놓치지 않았더라면, 제시간에 도착했을 텐데. → If I (had) not missed the bus, I would have arrived on time.", "e": "had not p.p."}, {"k": "pk", "q": "I would buy that bag if I [had*/have] enough money now.", "e": "주절이 앞에 와도 가정법 과거 → had"}, {"k": "pk", "q": "If we [had left*/left] home earlier yesterday, we could have seen the sunrise.", "e": "yesterday → had left"}, {"k": "fx", "q": "If you had listened to me, you would not have make that mistake.", "w": "make", "a": ["made"], "e": "have + p.p."}, {"k": "ox", "q": "If I knew the answer, I would tell you.", "a": true, "e": "✔ 가정법 과거"}, {"k": "ox", "q": "If he had been there, he will have helped us.", "a": false, "e": "would have helped"}], "practiceB": [{"k": "or", "q": "내가 날 수 있다면, 너에게 날아갈 텐데.", "a": "If I could fly, I would fly to you.", "e": "가정법 과거"}, {"k": "or", "q": "그녀가 열심히 공부했더라면, 그 시험에 합격했을 텐데.", "a": "If she had studied hard, she would have passed the exam.", "e": "가정법 과거완료"}, {"k": "wr", "q": "내가 돈이 충분히 있다면, 그 컴퓨터를 살 텐데. (enough money, would buy the computer)", "a": ["If I had enough money, I would buy the computer.", "If I had enough money I would buy the computer.", "I would buy the computer if I had enough money."], "e": "가정법 과거"}, {"k": "wr", "q": "그가 우리에게 전화했더라면, 우리는 그를 데리러 갔을 텐데. (had called us, would have picked him up)", "a": ["If he had called us, we would have picked him up.", "If he had called us we would have picked him up.", "We would have picked him up if he had called us."], "e": "가정법 과거완료"}, {"k": "wr", "q": "내가 그때 그 사실을 알았더라면, 너에게 말했을 텐데. (known the truth then, would have told you)", "a": ["If I had known the truth then, I would have told you.", "If I had known the truth then I would have told you.", "I would have told you if I had known the truth then."], "e": "가정법 과거완료"}, {"k": "fx", "q": "If I were you, I will apologize to her.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "fx", "q": "If it had not rained, we would go camping last weekend.", "w": "go", "a": ["have gone"], "e": "last weekend → would have gone"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I were a bird, I would fly.\nⓑ If he had a car, he will drive us.\nⓒ If it is warm tomorrow, we will swim.\nⓓ If she had called, I would have answered.\nⓔ If you had come, you would enjoy the show yesterday.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ would / ⓔ would have enjoyed"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIf I ____ time now, I would help you.\nIf I ____ time yesterday, I would have helped you.", "o": ["had – had", "had had – had", "had – had had", "have – had had", "had – have had"], "a": 2, "e": "now → had / yesterday → had had"}, {"k": "bl", "q": "내가 키가 더 크다면, 그 선반에 닿을 수 있을 텐데. → If I (were) taller, I (could) reach the shelf.", "e": "were / could"}]}}, {"tag": "hk3-14-2", "name": "혼합 가정법", "talk": [{"k": "m", "t": "중3 새 포인트! **혼합 가정법** — **과거**에 ~했더라면, **지금** …할 텐데 🔀"}, {"k": "m", "t": "형태: If + 주어 + **had p.p.** (과거 사실 반대), 주어 + **would/could + 동사원형** (현재 사실 반대)"}, {"k": "ex", "en": "If I had eaten breakfast, I wouldn't be hungry now.", "ko": "내가 아침을 먹었더라면, 지금 배고프지 않을 텐데. (아침을 안 먹어서 지금 배고픔)"}, {"k": "m", "t": "핵심 단서: 주절에 **now, today, still** 같은 **현재** 표현!"}, {"k": "q", "q": "If he had taken the medicine, he ____ better now.", "o": ["would feel", "would have felt", "will feel"], "a": 0, "ok": "맞아요! now → would + 동사원형", "no": "주절에 now → 지금 결과 → would feel"}, {"k": "m", "t": "직설법으로: As I **didn't eat** breakfast, I **am** hungry now. (If절 → 과거, 주절 → 현재)"}, {"k": "q", "q": "If I had saved money, I could buy the phone now. 과 같은 뜻은?", "o": ["As I didn't save money, I can't buy the phone now.", "As I saved money, I can buy the phone now.", "As I don't save money, I couldn't buy the phone."], "a": 0, "ok": "정확해요! 과거(didn't save) + 현재(can't buy)", "no": "If절 had p.p. → 과거 부정 / 주절 could + 동사원형 → 현재 부정"}, {"k": "m", "t": "⚠️ 주절 시간 확인! 주절도 과거 → would **have** p.p. (가정법 과거완료) / 주절이 지금 → would + **동사원형** (혼합)"}, {"k": "m", "t": "정리! **If + had p.p., would + 동사원형 (+ now) = 과거 반대 → 현재 결과** 👍"}], "notes": {"table": [["종류", "If절 (때)", "주절 (때)", "예"], ["가정법 과거완료", "had p.p. (과거)", "would have p.p. (과거)", "If I had studied, I would have passed."], ["혼합 가정법", "had p.p. (과거)", "would + 동사원형 (현재)", "If I had studied, I would be a doctor now."]], "tips": ["주절의 now / today / still이 혼합 가정법의 단서", "직설법: As + 과거(긍정 ↔ 부정), 주어 + 현재(긍정 ↔ 부정)"]}, "sets": {"workbook": [{"k": "pk", "q": "If I had gone to bed early, I [wouldn't be*/wouldn't have been] tired now.", "e": "now → would + 동사원형"}, {"k": "pk", "q": "If she had taken the job, she [would live*/will live] in New York now.", "e": "혼합 가정법 → would live"}, {"k": "pk", "q": "If you [had listened*/listened] to me then, you wouldn't be in trouble now.", "e": "then → had p.p."}, {"k": "pk", "q": "If he had brought a map, we [wouldn't have gotten*/wouldn't get] lost yesterday.", "e": "yesterday → 가정법 과거완료"}, {"k": "bl", "q": "내가 그 책을 읽었더라면, 지금 그 답을 알 텐데. → If I (had) (read) the book, I would know the answer now.", "e": "had read"}, {"k": "bl", "q": "그가 사고를 당하지 않았더라면, 지금 병원에 있지 않을 텐데. → If he had not had an accident, he (wouldn't|would not) (be) in the hospital now.", "e": "now → would not be"}, {"k": "bl", "q": "As I didn't bring my umbrella, I am wet now. = If I (had) (brought) my umbrella, I wouldn't be wet now.", "e": "과거 부정 → had p.p."}, {"k": "bl", "q": "As she missed the plane, she isn't here now. = If she (hadn't|had not) missed the plane, she (would) be here now.", "e": "긍정 ↔ 부정"}, {"k": "fx", "q": "If you had saved money, you can buy a new bike now.", "w": "can", "a": ["could"], "e": "혼합 가정법 → could"}, {"k": "fx", "q": "If I have eaten lunch, I wouldn't be so hungry now.", "w": "have", "a": ["had"], "e": "과거 사실 반대 → had eaten"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? If I had won the lottery, I ____ rich now.", "o": ["will be", "would be", "would have been", "am", "had been"], "a": 1, "e": "now → would be"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If he had followed the doctor's advice, he would be healthy now.", "o": ["As he followed the doctor's advice, he is healthy now.", "As he didn't follow the doctor's advice, he isn't healthy now.", "As he doesn't follow the doctor's advice, he isn't healthy now.", "As he didn't follow the doctor's advice, he wasn't healthy.", "If he follows the doctor's advice, he will be healthy."], "a": 1, "e": "과거 부정 + 현재 부정"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["If I had slept well, I wouldn't be tired now.", "If she had left early, she would be here now.", "If we had bought the tickets, we could see the show tonight.", "If he had studied, he would have passed the test last week.", "If I had fixed the car, I can drive it now."], "a": 4, "e": "⑤ could drive"}, {"k": "bl", "q": "내가 어젯밤 늦게까지 TV를 보지 않았더라면, 지금 졸리지 않을 텐데. → If I (hadn't|had not) watched TV late last night, I wouldn't be sleepy now.", "e": "had not p.p."}, {"k": "bl", "q": "그녀가 그 학교에 입학했더라면, 지금 내 반 친구일 텐데. → If she had entered the school, she (would) (be) my classmate now.", "e": "now → would be"}, {"k": "pk", "q": "If I had learned Spanish as a child, I [could speak*/could have spoken] it well now.", "e": "now → could + 동사원형"}, {"k": "pk", "q": "If it [had not snowed*/did not snow] last night, the roads would not be icy now.", "e": "last night → had not p.p."}, {"k": "fx", "q": "If you had worn a coat, you will not have a cold now.", "w": "will", "a": ["would"], "e": "혼합 가정법 → would"}, {"k": "ox", "q": "If I had taken the subway, I would be at school now.", "a": true, "e": "✔ 혼합 가정법"}, {"k": "ox", "q": "If she had not hurt her leg, she would have joined us now.", "a": false, "e": "now → would join"}], "practiceB": [{"k": "or", "q": "내가 그때 그 기회를 잡았더라면, 지금 더 행복할 텐데.", "a": "If I had taken the chance then, I would be happier now.", "e": "혼합 가정법"}, {"k": "or", "q": "그가 일찍 출발했더라면, 지금 여기 있을 텐데.", "a": "If he had left early, he would be here now.", "e": "혼합 가정법"}, {"k": "wr", "q": "As I didn't eat breakfast, I am hungry now. → 혼합 가정법으로", "a": ["If I had eaten breakfast, I would not be hungry now.", "If I had eaten breakfast, I wouldn't be hungry now.", "If I had eaten breakfast I would not be hungry now.", "If I had eaten breakfast I wouldn't be hungry now."], "e": "과거 부정 → had p.p. / 현재 긍정 → would not"}, {"k": "wr", "q": "As he didn't save money, he can't buy a car now. → 혼합 가정법으로", "a": ["If he had saved money, he could buy a car now.", "If he had saved money he could buy a car now."], "e": "had saved / could buy"}, {"k": "wr", "q": "As she lost her passport, she is not on the plane now. → 혼합 가정법으로", "a": ["If she had not lost her passport, she would be on the plane now.", "If she hadn't lost her passport, she would be on the plane now.", "If she had not lost her passport she would be on the plane now.", "If she hadn't lost her passport she would be on the plane now."], "e": "긍정 ↔ 부정"}, {"k": "fx", "q": "If I had practiced harder, I would being on the team now.", "w": "being", "a": ["be"], "e": "would + 동사원형"}, {"k": "fx", "q": "If he has taken my advice, he would not be in trouble now.", "w": "has", "a": ["had"], "e": "과거 사실 반대 → had taken"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIf I had studied harder, I ____ the exam last week.\nIf I had studied harder, I ____ in a good school now.", "o": ["would pass – would be", "would have passed – would be", "would have passed – would have been", "would pass – would have been", "will pass – will be"], "a": 1, "e": "last week → would have passed / now → would be"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If I had taken a nap, I wouldn't be tired now.\nⓑ If she had called me, I would have answered.\nⓒ If he had studied law, he would have been a lawyer now.\nⓓ If we had left early, we would be there now.\nⓔ If you have saved money, you could travel now.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ would be / ⓔ had saved"}, {"k": "bl", "q": "As I didn't learn to swim, I can't swim now. = If I (had) (learned|learnt) to swim, I could swim now.", "e": "혼합 가정법"}]}}, {"tag": "hk3-14-3", "name": "가정법을 직설법으로 바꾸는 법", "talk": [{"k": "m", "t": "가정법 ↔ 직설법 바꾸기! 규칙 두 개만 기억해요: **① 긍정 ↔ 부정 ② 시제 한 단계** 🔄"}, {"k": "m", "t": "가정법 과거 → 직설법 **현재**: If I were rich, I could buy it. → **As** I **am not** rich, I **can't** buy it."}, {"k": "m", "t": "가정법 과거완료 → 직설법 **과거**: If I had known, I would have come. → As I **didn't know**, I **didn't come**."}, {"k": "q", "q": "If it were not cold, we could go out. → As it ____ cold, we ____ go out.", "o": ["is – can't", "isn't – can", "was – couldn't"], "a": 0, "ok": "맞아요! 현재 + 긍정 ↔ 부정", "no": "가정법 과거 → 직설법 현재: is cold, can't go out"}, {"k": "m", "t": "혼합 가정법 → If절은 **과거**, 주절은 **현재**: If I had slept, I wouldn't be tired now. → As I **didn't sleep**, I **am** tired now."}, {"k": "m", "t": "As 대신 **Because**나 **so**로도 써요: I am not rich, **so** I can't buy it."}, {"k": "ex", "en": "If he had not been sick, he would have come. = He was sick, so he didn't come.", "ko": "그가 아프지 않았더라면 왔을 텐데. = 그는 아파서 오지 않았다."}, {"k": "q", "q": "As I don't have a map, I can't find the way. → 가정법으로", "o": ["If I had a map, I could find the way.", "If I had had a map, I could have found the way.", "If I don't have a map, I can't find the way."], "a": 0, "ok": "정확해요! 현재 → 가정법 과거", "no": "직설법 현재 → 가정법 과거(과거형 + could)"}, {"k": "m", "t": "⚠️ 조동사도 함께: could + 동사원형 ↔ can't / could have p.p. ↔ couldn't"}, {"k": "m", "t": "정리! **긍정 ↔ 부정 + 과거형 → 현재 / had p.p. → 과거 / 혼합 → 과거 + 현재** 👍"}], "notes": {"table": [["가정법", "직설법"], ["If + 과거형, would / could + 동사원형", "As + 현재 (긍정 ↔ 부정), 현재 (긍정 ↔ 부정)"], ["If + had p.p., would / could + have p.p.", "As + 과거 (긍정 ↔ 부정), 과거 (긍정 ↔ 부정)"], ["If + had p.p., would / could + 동사원형 (혼합)", "As + 과거, 현재"]], "tips": ["As 대신 Because, 또는 '…, so …'로도 바꿀 수 있음", "조동사도 바꾸기: could ↔ can't, could have p.p. ↔ couldn't"]}, "sets": {"workbook": [{"k": "pk", "q": "If I were tall, I could be a model. = As I [am not*/was not] tall, I can't be a model.", "e": "가정법 과거 → 현재"}, {"k": "pk", "q": "If he had come, we would have been happy. = As he [didn't come*/doesn't come], we weren't happy.", "e": "가정법 과거완료 → 과거"}, {"k": "pk", "q": "If I knew her, I could introduce you. = As I don't know her, I [can't*/couldn't] introduce you.", "e": "현재 → can't"}, {"k": "pk", "q": "If she had not been late, she would be here now. = As she [was*/is] late, she isn't here now.", "e": "혼합 → If절은 과거"}, {"k": "bl", "q": "If I had a bike, I could ride to school. = As I (don't|do not) have a bike, I (can't|cannot) ride to school.", "e": "현재, 긍정 ↔ 부정"}, {"k": "bl", "q": "If it had not rained, we could have gone out. = As it (rained), we (couldn't|could not) go out.", "e": "과거, 부정 ↔ 긍정"}, {"k": "bl", "q": "As he is busy, he can't help me. = If he (weren't|were not) busy, he (could) help me.", "e": "현재 → 가정법 과거"}, {"k": "bl", "q": "As I didn't study, I failed the test. = If I (had) (studied), I would not have failed the test.", "e": "과거 → 가정법 과거완료"}, {"k": "fx", "q": "If I had a key, I could open the door. = As I don't have a key, I can open the door.", "w": "can", "a": ["can't", "cannot"], "e": "긍정 ↔ 부정"}, {"k": "fx", "q": "If she had known the truth, she would have told me. = As she didn't know the truth, she doesn't tell me.", "w": "doesn't", "a": ["didn't"], "e": "가정법 과거완료 → 과거"}], "practiceA": [{"k": "ch", "q": "다음 문장과 의미가 같은 것은? If I had a smartphone, I could take pictures.", "o": ["As I have a smartphone, I can take pictures.", "As I don't have a smartphone, I can't take pictures.", "As I didn't have a smartphone, I couldn't take pictures.", "As I don't have a smartphone, I can take pictures.", "If I have a smartphone, I can take pictures."], "a": 1, "e": "현재 + 긍정 ↔ 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? If we had not missed the train, we would have arrived on time.", "o": ["As we missed the train, we didn't arrive on time.", "As we didn't miss the train, we arrived on time.", "As we miss the train, we don't arrive on time.", "As we missed the train, we arrived on time.", "As we missed the train, we don't arrive on time."], "a": 0, "e": "과거 + 긍정 ↔ 부정"}, {"k": "ch", "q": "다음 문장을 가정법으로 바르게 바꾼 것은? As he didn't wear a helmet, he is in the hospital now.", "o": ["If he wore a helmet, he wouldn't be in the hospital now.", "If he had worn a helmet, he wouldn't be in the hospital now.", "If he had worn a helmet, he wouldn't have been in the hospital now.", "If he wears a helmet, he won't be in the hospital now.", "If he had not worn a helmet, he would be in the hospital now."], "a": 1, "e": "과거 + 현재 → 혼합 가정법"}, {"k": "bl", "q": "If she were not sick, she could go to school. = As she (is) sick, she (can't|cannot) go to school.", "e": "현재, 부정 ↔ 긍정"}, {"k": "bl", "q": "If I had had time, I would have called you. = As I (didn't|did not) (have) time, I didn't call you.", "e": "과거, 긍정 ↔ 부정"}, {"k": "pk", "q": "I don't know his number, so I can't call him. = If I [knew*/had known] his number, I could call him.", "e": "현재 → 가정법 과거"}, {"k": "pk", "q": "It rained a lot, so the game was canceled. = If it [had not rained*/did not rain] a lot, the game would not have been canceled.", "e": "과거 → had not p.p."}, {"k": "fx", "q": "As I am not hungry, I won't eat. = If I were hungry, I will eat.", "w": "will", "a": ["would"], "e": "가정법 과거 → would"}, {"k": "ox", "q": "If I had been there, I could have helped her. = As I wasn't there, I couldn't help her.", "a": true, "e": "✔ 과거, 긍정 ↔ 부정"}, {"k": "ox", "q": "If he were rich, he could buy a house. = As he was not rich, he couldn't buy a house.", "a": false, "e": "가정법 과거 → 현재: is not / can't"}], "practiceB": [{"k": "wr", "q": "If I knew the answer, I could tell you. → As로 시작하는 직설법으로", "a": ["As I don't know the answer, I can't tell you.", "As I do not know the answer, I cannot tell you.", "As I don't know the answer, I cannot tell you.", "As I do not know the answer, I can't tell you.", "As I don't know the answer I can't tell you."], "e": "현재, 긍정 ↔ 부정"}, {"k": "wr", "q": "If she had not lied, I would have trusted her. → As로 시작하는 직설법으로", "a": ["As she lied, I didn't trust her.", "As she lied, I did not trust her.", "As she lied I didn't trust her."], "e": "과거, 부정 ↔ 긍정"}, {"k": "wr", "q": "As I am not good at math, I can't solve this problem. → 가정법으로", "a": ["If I were good at math, I could solve this problem.", "If I were good at math I could solve this problem."], "e": "현재 → 가정법 과거"}, {"k": "wr", "q": "He didn't take the bus, so he is late now. → 혼합 가정법으로 (If he …)", "a": ["If he had taken the bus, he would not be late now.", "If he had taken the bus, he wouldn't be late now.", "If he had taken the bus he would not be late now.", "If he had taken the bus he wouldn't be late now."], "e": "과거 + 현재 → 혼합"}, {"k": "or", "q": "그가 정직하다면 우리는 그를 믿을 텐데.", "a": "If he were honest, we would trust him.", "e": "가정법 과거"}, {"k": "fx", "q": "If I had been careful, I wouldn't have broken it. = As I wasn't careful, I break it.", "w": "break", "a": ["broke"], "e": "가정법 과거완료 → 과거"}, {"k": "fx", "q": "As it is snowing, we can't go hiking. = If it were snowing, we could go hiking.", "w": "were", "a": ["were not", "weren't"], "e": "긍정 ↔ 부정"}, {"k": "ch", "q": "의미가 나머지와 다른 것은?", "o": ["If I had a dog, I wouldn't be lonely.", "As I don't have a dog, I am lonely.", "I don't have a dog, so I am lonely.", "Because I don't have a dog, I am lonely.", "As I have a dog, I am not lonely."], "a": 4, "e": "⑤만 개가 있음 / 나머지는 개가 없어서 외로움"}, {"k": "ch", "q": "가정법과 직설법이 바르게 짝지어진 것의 개수는?\nⓐ If I had time, I could help. = As I don't have time, I can't help.\nⓑ If he had come, I would have been glad. = As he didn't come, I wasn't glad.\nⓒ If it were sunny, we could swim. = As it was not sunny, we couldn't swim.\nⓓ If she had slept, she wouldn't be tired now. = As she didn't sleep, she is tired now.\nⓔ If I knew him, I would say hi. = As I knew him, I say hi.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ is not, can't / ⓔ don't know, don't say"}, {"k": "bl", "q": "As I didn't bring my wallet, I can't pay now. = If I (had) (brought) my wallet, I could pay now.", "e": "과거 + 현재 → 혼합"}]}}, {"tag": "hk3-14-4", "name": "if를 생략한 가정법", "talk": [{"k": "m", "t": "중3 새 포인트! 가정법에서 **if를 생략**하면 **주어와 동사의 순서가 바뀌어요** (도치) 🔃"}, {"k": "m", "t": "① 가정법 과거의 be동사: If I were → **Were I** …"}, {"k": "ex", "en": "Were I rich, I would travel the world.", "ko": "내가 부자라면 세계를 여행할 텐데. (= If I were rich, …)"}, {"k": "m", "t": "② 가정법 과거완료: If I had p.p. → **Had I** p.p. …"}, {"k": "ex", "en": "Had I known the truth, I would have told you.", "ko": "내가 사실을 알았더라면 너에게 말했을 텐데. (= If I had known …)"}, {"k": "q", "q": "____ I known about the party, I would have gone.", "o": ["Had", "Have", "Did"], "a": 0, "ok": "맞아요! If I had known → Had I known", "no": "If I had known에서 if 생략 → Had I known"}, {"k": "m", "t": "⚠️ 일반동사 과거형은 이렇게 도치 ✗: If I knew → Knew I ✗ (if를 그대로 써요)"}, {"k": "m", "t": "⚠️ 부정은 **Had I not** p.p. / **Were I not** … (Hadn't I ✗)"}, {"k": "q", "q": "If she had not helped me, I would have failed. = ____ she not helped me, I would have failed.", "o": ["Had", "Hadn't", "Did"], "a": 0, "ok": "정확해요! Had + 주어 + not + p.p.", "no": "부정은 Had she not helped (Hadn't she ✗)"}, {"k": "m", "t": "정리! **if 생략 → Were + 주어 / Had + 주어 + p.p. / 부정은 Had I not p.p.** 👍"}], "notes": {"table": [["원래 문장", "if 생략 (도치)"], ["If I were …", "Were I …"], ["If it were not for …", "Were it not for … (14-5)"], ["If I had p.p. …", "Had I p.p. …"], ["If I had not p.p. …", "Had I not p.p. … (Hadn't I ✗)"]], "tips": ["일반동사 과거형 가정법(If I knew …)은 if 생략 도치를 하지 않음", "도치된 뒤 주절은 그대로: Had I known, I would have …"]}, "sets": {"workbook": [{"k": "pk", "q": "[Were I*/I were] a bird, I would fly to you.", "e": "if 생략 → Were I"}, {"k": "pk", "q": "[Had I*/I had] known it, I would have helped you.", "e": "if 생략 → Had I"}, {"k": "pk", "q": "[Had*/Have] she studied harder, she would have passed.", "e": "If she had studied → Had she studied"}, {"k": "pk", "q": "Had he [not told*/told not] me, I wouldn't have known.", "e": "Had + 주어 + not + p.p."}, {"k": "bl", "q": "If I were you, I would not go there. = (Were) I you, I would not go there.", "e": "Were I"}, {"k": "bl", "q": "If he had left earlier, he could have caught the bus. = (Had) he (left) earlier, he could have caught the bus.", "e": "Had he left"}, {"k": "bl", "q": "If it had not rained, we would have played soccer. = Had it (not) rained, we would have played soccer.", "e": "Had it not rained"}, {"k": "bl", "q": "If she were here, she would help us. = (Were) she here, she would help us.", "e": "Were she"}, {"k": "fx", "q": "Have I known your number, I could call you now.", "w": "Have", "a": ["Had"], "e": "If I had known → Had I known"}, {"k": "fx", "q": "Had I knew the answer, I would have raised my hand.", "w": "knew", "a": ["known"], "e": "Had + 주어 + p.p."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ I in your shoes, I would say sorry.", "o": ["Am", "Were", "Had", "Did", "If"], "a": 1, "e": "If I were → Were I"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Had I seen you, I would have said hello.", "o": ["If I saw you, I would say hello.", "If I had seen you, I would have said hello.", "As I saw you, I said hello.", "If I have seen you, I will say hello.", "When I saw you, I said hello."], "a": 1, "e": "Had I seen = If I had seen"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Were I you, I would accept it.", "Had she known, she would have come.", "Had we not hurried, we would have missed it.", "Knew I her name, I would call her.", "Were he here, he would agree."], "a": 3, "e": "④ If I knew her name (일반동사 과거는 도치 ✗)"}, {"k": "bl", "q": "If I had had enough money, I would have bought it. = (Had) I (had) enough money, I would have bought it.", "e": "Had I had"}, {"k": "bl", "q": "만약 내가 그 팀의 주장이라면, 나는 규칙을 바꿀 텐데. → (Were) I the captain of the team, I would change the rules.", "e": "Were I"}, {"k": "pk", "q": "[Had*/If] you not called me, I would have overslept.", "e": "Had you not called"}, {"k": "pk", "q": "Had he taken the medicine, he [would have felt*/would feel] better yesterday.", "e": "yesterday → would have felt"}, {"k": "fx", "q": "Had they not lose the game, they would have been champions.", "w": "lose", "a": ["lost"], "e": "Had + 주어 + not + p.p."}, {"k": "ox", "q": "Were I taller, I could play basketball better.", "a": true, "e": "✔ Were I = If I were"}, {"k": "ox", "q": "Hadn't I missed the bus, I would have arrived on time.", "a": false, "e": "Had I not missed"}], "practiceB": [{"k": "wr", "q": "If I had known you were sick, I would have visited you. → if를 생략하여", "a": ["Had I known you were sick, I would have visited you.", "Had I known you were sick I would have visited you."], "e": "Had I known"}, {"k": "wr", "q": "If I were a doctor, I could help sick people. → if를 생략하여", "a": ["Were I a doctor, I could help sick people.", "Were I a doctor I could help sick people."], "e": "Were I"}, {"k": "wr", "q": "If she had not helped me, I would have failed. → if를 생략하여", "a": ["Had she not helped me, I would have failed.", "Had she not helped me I would have failed."], "e": "Had she not helped"}, {"k": "or", "q": "내가 너라면 그 기회를 놓치지 않을 텐데. (if 생략)", "a": "Were I you, I would not miss the chance.", "e": "Were I"}, {"k": "or", "q": "그가 더 조심했더라면 다치지 않았을 텐데. (if 생략)", "a": "Had he been more careful, he would not have gotten hurt.", "e": "Had he been"}, {"k": "fx", "q": "Had she has more time, she would have finished it.", "w": "has", "a": ["had"], "e": "Had she had"}, {"k": "fx", "q": "Were I you, I will take a rest.", "w": "will", "a": ["would"], "e": "Were I = If I were → would"}, {"k": "ch", "q": "if를 생략하여 바르게 바꾼 것은?\nIf he had not been late, he could have seen the start.", "o": ["Had not he been late, he could have seen the start.", "Had he not been late, he could have seen the start.", "Did he not be late, he could have seen the start.", "He had not been late, he could have seen the start.", "Were he not late, he could have seen the start."], "a": 1, "e": "Had + 주어 + not + p.p."}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Were I you, I would go.\nⓑ Had I known it, I would have told you.\nⓒ Knew I the truth, I would tell you.\nⓓ Had she not helped, I would have failed.\nⓔ Have I studied, I would have passed.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ If I knew / ⓔ Had I studied"}, {"k": "bl", "q": "If we had not taken a taxi, we would have been late. = (Had) we (not) taken a taxi, we would have been late.", "e": "Had we not taken"}]}}, {"tag": "hk3-14-5", "name": "Without 가정법", "talk": [{"k": "m", "t": "**Without / But for** '~이 없다면 / ~이 없었다면' 🚫"}, {"k": "m", "t": "현재 반대: Without ~ = **If it were not for** ~ = **Were it not for** ~ (주절 would + 동사원형)"}, {"k": "ex", "en": "Without water, we could not live.", "ko": "물이 없다면 우리는 살 수 없을 텐데. (= If it were not for water, …)"}, {"k": "m", "t": "과거 반대: Without ~ = **If it had not been for** ~ = **Had it not been for** ~ (주절 would have p.p.)"}, {"k": "ex", "en": "Without your help, I would have failed.", "ko": "네 도움이 없었더라면 나는 실패했을 텐데. (= If it had not been for your help, …)"}, {"k": "q", "q": "If it ____ not for the sun, nothing could grow.", "o": ["is", "were", "had been"], "a": 1, "ok": "맞아요! 현재 반대 → If it were not for", "no": "주절 could grow(동사원형) → 현재 반대 → were"}, {"k": "m", "t": "⚠️ Without 자체에는 시제가 없어요 → **주절**을 보고 현재(would + 동사원형)인지 과거(would have p.p.)인지 판단!"}, {"k": "q", "q": "Without his advice, I ____ the wrong choice last year.", "o": ["would make", "would have made", "will make"], "a": 1, "ok": "정확해요! last year → would have made", "no": "과거(last year) 반대 → would have p.p."}, {"k": "m", "t": "But for = Without / if를 생략하면 **Were it not for / Had it not been for**"}, {"k": "m", "t": "정리! **Without = But for = If it were not for(현재) / If it had not been for(과거)** 👍"}], "notes": {"table": [["뜻", "Without / But for", "if절", "if 생략"], ["~이 없다면 (현재)", "Without ~, would + 동사원형", "If it were not for ~", "Were it not for ~"], ["~이 없었다면 (과거)", "Without ~, would have p.p.", "If it had not been for ~", "Had it not been for ~"]], "tips": ["Without의 시제는 주절로 판단", "If it were not for의 it은 항상 it (주어를 바꾸지 않음), for도 꼭 쓰기"]}, "sets": {"workbook": [{"k": "pk", "q": "If it [were*/is] not for music, life would be boring.", "e": "현재 반대 → were"}, {"k": "pk", "q": "If it had not been for the map, we [would have gotten*/would get] lost yesterday.", "e": "과거 반대 → would have p.p."}, {"k": "pk", "q": "Without air, nothing [could live*/could have lived] on Earth today.", "e": "today → could + 동사원형"}, {"k": "pk", "q": "[Had*/Were] it not been for her advice, I would have made a mistake.", "e": "Had it not been for"}, {"k": "bl", "q": "Without water, we could not survive. = If it (were) not for water, we could not survive.", "e": "현재 반대"}, {"k": "bl", "q": "Without his support, she would have given up. = If it (had) not (been) for his support, she would have given up.", "e": "과거 반대"}, {"k": "bl", "q": "But for the rain, we would go hiking. = (Without) the rain, we would go hiking.", "e": "But for = Without"}, {"k": "bl", "q": "If it were not for smartphones, our lives would be different. = (Were) it not for smartphones, our lives would be different.", "e": "if 생략 → Were it not for"}, {"k": "fx", "q": "If it had not been for the seat belt, he would be badly hurt in the accident last week.", "w": "be", "a": ["have been"], "e": "last week → would have been"}, {"k": "fx", "q": "If it were not to the internet, we couldn't get information so fast.", "w": "to", "a": ["for"], "e": "If it were not for"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ your advice, I would have made a big mistake.", "o": ["With", "Without", "If", "Unless", "Because"], "a": 1, "e": "~이 없었다면 → Without"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Without the sun, no plants could grow.", "o": ["If it is not for the sun, no plants could grow.", "If it were not for the sun, no plants could grow.", "If it had not been for the sun, no plants could grow.", "If the sun were, no plants could grow.", "Unless the sun grows, no plants could grow."], "a": 1, "e": "could grow → 현재 반대"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? But for his help, I would have lost my way.", "o": ["If it were not for his help, I would lose my way.", "If it had not been for his help, I would have lost my way.", "Because of his help, I lost my way.", "If he helps me, I will lose my way.", "Were it not for his help, I would have lost my way."], "a": 1, "e": "would have lost → 과거 반대"}, {"k": "bl", "q": "부모님이 안 계신다면, 나는 아무것도 할 수 없을 텐데. → If it (were) (not) for my parents, I could do nothing.", "e": "현재 반대"}, {"k": "bl", "q": "그 지도가 없었더라면, 우리는 길을 잃었을 텐데. → Without the map, we (would) (have) gotten lost.", "e": "과거 반대"}, {"k": "pk", "q": "[Without*/With] friends, life would be lonely.", "e": "~이 없다면 → Without"}, {"k": "pk", "q": "Had it not been for the alarm, I [would have overslept*/would oversleep] this morning.", "e": "this morning(과거) → would have p.p."}, {"k": "fx", "q": "Had it not been for the doctor, she would not survive last year.", "w": "survive", "a": ["have survived"], "e": "last year → would not have survived"}, {"k": "ox", "q": "If it were not for books, we would learn less.", "a": true, "e": "✔ 현재 반대"}, {"k": "ox", "q": "But for your call, I would have forget the meeting.", "a": false, "e": "have + p.p. → forgotten"}], "practiceB": [{"k": "wr", "q": "If it were not for air, we could not live. → Without으로 시작하여", "a": ["Without air, we could not live.", "Without air, we couldn't live.", "Without air we could not live.", "Without air we couldn't live."], "e": "Without"}, {"k": "wr", "q": "Without your help, I would have failed the test. → If it ~ for를 써서", "a": ["If it had not been for your help, I would have failed the test.", "If it hadn't been for your help, I would have failed the test.", "If it had not been for your help I would have failed the test."], "e": "과거 반대"}, {"k": "wr", "q": "If it had not been for the rescue team, they would have died. → if를 생략하여", "a": ["Had it not been for the rescue team, they would have died.", "Had it not been for the rescue team they would have died."], "e": "Had it not been for"}, {"k": "or", "q": "전기가 없다면 우리의 생활은 매우 불편할 텐데.", "a": "Without electricity, our lives would be very uncomfortable.", "e": "Without + 현재 반대"}, {"k": "or", "q": "그의 충고가 없었더라면 나는 포기했을 텐데.", "a": "If it had not been for his advice, I would have given up.", "e": "과거 반대"}, {"k": "fx", "q": "If it had not been for the rain, we would go to the beach yesterday.", "w": "go", "a": ["have gone"], "e": "yesterday → would have gone"}, {"k": "fx", "q": "Had it not be for her, I would have failed.", "w": "be", "a": ["been"], "e": "Had it not been for"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nIf it ____ not for water, we couldn't live.\nIf it ____ not been for the life jacket, he would have drowned.", "o": ["were – had", "had – were", "were – were", "had – had", "is – had"], "a": 0, "e": "현재 반대 were / 과거 반대 had"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Without music, life would be boring.\nⓑ If it were not for his help, I would fail.\nⓒ Had it not been for you, I would have quit.\nⓓ If it had not been for the map, we would get lost yesterday.\nⓔ Were not it for the sun, nothing could live.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ would have gotten / ⓔ Were it not for"}, {"k": "bl", "q": "But for the seat belt, he would have been hurt. = Had it (not) (been) for the seat belt, he would have been hurt.", "e": "Had it not been for"}]}}, {"tag": "hk3-14-6", "name": "I wish 가정법", "talk": [{"k": "m", "t": "**I wish 가정법**: 이룰 수 없는 소망! 중2 복습 + 중3 포인트 🌠"}, {"k": "m", "t": "I wish + **과거형(were)**: 지금 ~라면 좋을 텐데 = I'm sorry (that) + **현재** (긍정 ↔ 부정)"}, {"k": "ex", "en": "I wish I were good at singing.", "ko": "내가 노래를 잘한다면 좋을 텐데. (= I'm sorry I'm not good at singing.)"}, {"k": "m", "t": "I wish + **had p.p.**: 그때 ~했더라면 좋을 텐데 = I'm sorry (that) + **과거** (긍정 ↔ 부정)"}, {"k": "ex", "en": "I wish I had brought my camera.", "ko": "내가 카메라를 가져왔더라면 좋을 텐데. (= I'm sorry I didn't bring my camera.)"}, {"k": "q", "q": "I wish I ____ more careful yesterday.", "o": ["were", "had been", "have been"], "a": 1, "ok": "맞아요! yesterday → had been", "no": "과거(yesterday)에 대한 아쉬움 → had p.p."}, {"k": "m", "t": "중3 포인트! **I wished**(과거)이면 직설법도 과거로: I wished I **were** taller. = I **was** sorry I **wasn't** taller. (그때와 같은 때)"}, {"k": "q", "q": "I wished I had a bike. 와 같은 뜻은?", "o": ["I was sorry I didn't have a bike.", "I'm sorry I don't have a bike.", "I was sorry I hadn't had a bike."], "a": 0, "ok": "정확해요! 주절 과거 + 같은 때 → 과거 부정", "no": "wished(과거) + had(같은 때) → I was sorry I didn't have"}, {"k": "m", "t": "**If only** ~! = I wish ~ (더 강한 소망): If only I [were] taller!"}, {"k": "m", "t": "정리! **I wish + 과거형 = 같은 때 반대 / had p.p. = 앞선 때 반대 / I wished면 직설법도 과거** 👍"}], "notes": {"table": [["가정법", "직설법", "뜻"], ["I wish I were …", "I'm sorry I am not …", "지금 ~라면 좋을 텐데"], ["I wish I had p.p.", "I'm sorry I didn't …", "그때 ~했더라면 좋을 텐데"], ["I wished I were …", "I was sorry I was not …", "그때 ~라면 좋았을 텐데"], ["I wished I had p.p.", "I was sorry I had not p.p.", "그 전에 ~했더라면 좋았을 텐데"]], "tips": ["I wish + could + 동사원형 / could have p.p.도 가능", "I hope는 실현 가능한 바람 (I hope you get well.)", "If only + 가정법 = I wish + 가정법"]}, "sets": {"workbook": [{"k": "pk", "q": "I wish I [had*/have] a twin sister.", "e": "현재 소망 → had"}, {"k": "pk", "q": "I wish I [had gone*/went] to the concert last night.", "e": "last night → had gone"}, {"k": "pk", "q": "I wish I [could*/can] speak Chinese fluently.", "e": "could"}, {"k": "pk", "q": "I wished I [were*/am] older at that time.", "e": "were"}, {"k": "bl", "q": "I'm sorry I don't live near the beach. = I wish I (lived) near the beach.", "e": "현재 → 과거형"}, {"k": "bl", "q": "I'm sorry I didn't study harder. = I wish I (had) (studied) harder.", "e": "과거 → had p.p."}, {"k": "bl", "q": "I'm sorry that I can't drive. = I wish I (could) drive.", "e": "can't → could"}, {"k": "bl", "q": "If only I (had) (listened) to my mom! (엄마 말을 들었더라면!)", "e": "If only + had p.p."}, {"k": "fx", "q": "I wish I know the answer to this question.", "w": "know", "a": ["knew"], "e": "과거형 knew"}, {"k": "fx", "q": "I wish I had took the subway this morning.", "w": "took", "a": ["taken"], "e": "had + p.p."}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I wish I ____ my wallet at home yesterday.", "o": ["didn't leave", "hadn't left", "don't leave", "haven't left", "won't leave"], "a": 1, "e": "yesterday → had not p.p."}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I wish I could play the drums.", "o": ["I'm sorry I can play the drums.", "I'm sorry I can't play the drums.", "I was sorry I couldn't play the drums.", "I'm glad I can play the drums.", "I hope I can't play the drums."], "a": 1, "e": "현재 + 부정"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I wished I were taller.", "o": ["I'm sorry I'm not taller.", "I was sorry I wasn't taller.", "I was sorry I hadn't been taller.", "I'm sorry I wasn't taller.", "I was glad I was taller."], "a": 1, "e": "wished(과거) + were(같은 때) → I was sorry I wasn't"}, {"k": "bl", "q": "I'm sorry I don't hav ve – missed", "didn't have – missed", "don't have – didn't miss", "have – missed", "don't have – had missed"], "a": 0, "e": "현재 부정 / 과거 긍정"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wish I were a famous singer.\nⓑ I wish I had seen the movie yesterday.\nⓒ I wish I am taller.\nⓓ I wished I could go with them.\nⓔ I wish I had went there.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ were / ⓔ had gone"}, {"k": "bl", "q": "I was sorry I didn't know the answer. = I wished I (knew) the answer.", "e": "주절 과거 + 같은 때 → 과거형"}]}}, {"tag": "hk3-14-7", "name": "as if[though] 가정법", "talk": [{"k": "m", "t": "마지막! **as if / as though** '마치 ~인 것처럼' 🎭"}, {"k": "m", "t": "as if + **과거형(were)**: 주절과 **같은 때** 사실 반대 / as if + **had p.p.**: 주절보다 **앞선 때** 사실 반대"}, {"k": "ex", "en": "She talks as if she were a movie star.", "ko": "그녀는 마치 영화배우인 것처럼 말한다. (In fact, she isn't.)"}, {"k": "ex", "en": "He talks as if he had met the president.", "ko": "그는 마치 대통령을 만났던 것처럼 말한다. (In fact, he didn't.)"}, {"k": "q", "q": "He acts as if he ____ everything. (사실은 모름)", "o": ["knows", "knew", "had known"], "a": 1, "ok": "맞아요! 같은 때 반대 → knew", "no": "지금 모르는데 아는 척 → as if + 과거형 knew"}, {"k": "m", "t": "중3 포인트! 주절이 **과거**여도 규칙은 같아요: He talked as if he **were** rich. = In fact, he **wasn't** rich. (같은 때)"}, {"k": "m", "t": "He talked as if he **had been** rich. = In fact, he **hadn't been** rich. (그보다 앞선 때)"}, {"k": "q", "q": "He talked as if he had been to Paris. 의 뜻은?", "o": ["In fact, he had been to Paris.", "In fact, he had not been to Paris.", "In fact, he is not in Paris."], "a": 1, "ok": "정확해요! 앞선 때의 사실 반대", "no": "주절 talked보다 앞선 때 → In fact, he had not been …"}, {"k": "m", "t": "**as though** = as if (같은 뜻)"}, {"k": "m", "t": "🎉 Chapter 14 가정법 끝! **과거형 = 같은 때 반대 / had p.p. = 앞선 때 반대** — If, I wish, as if 모두 같은 원리 👍"}], "notes": {"table": [["가정법", "직설법 (In fact, …)", "때"], ["He talks as if he were rich.", "he is not rich", "같은 때"], ["He talks as if he had been rich.", "he was not rich", 이 바르지 않은 것은?\nShe said to me, \"I will meet you here tomorrow.\"", "o": ["said to → told", "I → she", "will → would", "here → there", "tomorrow → the day before"], "a": 4, "e": "⑤ tomorrow → the next day"}, {"k": "bl", "q": "He said to me, \"I have been waiting for you since this morning.\" → He told me that he (had) been waiting for me since (that) morning.", "e": "had been / this → that"}]}}, {"tag": "hk3-15-3-2", "name": "화법 전환: 의문사가 있는 의문문", "talk": [{"k": "m", "t": "의문문을 전할 때는 **ask**! say (to) → **asked (+ 사람)** ❓"}, {"k": "m", "t": "형태: asked (+ 사람) + **의문사 + 주어 + 동사** (평서문 어순 = 간접의문문)"}, {"k": "ex", "en": "She said to me, \"Why are you late?\" → She asked me why I was late.", "ko": "그녀는 나에게 내가 왜 늦었는지 물었다."}, {"k": "q", "q": "He said to me, \"Where is the station?\" → He asked me where ____.", "o": ["was the station", "the station was", "the station is"], "a": 1, "ok": "맞아요! 의문사 + 주어 + 동사 + 시제 과거", "no": "평서문 어순 + 시제 한 단계 과거 → the station was"}, {"k": "m", "t": "do / does / did는 **없애고** 시제는 동사에: \"What do you need?\" → what I [needed]"}, {"k": "q", "q": "She said to him, \"When did you arrive?\" → She asked him when he ____.", "o": ["did arrive", "had arrived", "arrives"], "a": 1, "ok": "정확해요! did 빼고 과거 → 과거완료", "no": "did는 없애고, 과거 → had arrived"}, {"k": "m", "t": "⚠️ 의문사가 **주어**면 의문사 + 동사 그대로: \"Who made this cake?\" → who had made that cake"}, {"k": "m", "t": "⚠️ 의문사 + 명사 / 의문사 + 형용사는 **한 덩어리**: \"How many books do you have?\" → how many books I had"}, {"k": "q", "q": "He said to me, \"What kind of music do you like?\" → He asked me what kind of music ____.", "o": ["I liked", "did I like", "I like"], "a": 0, "ok": "맞아요! 덩어리 뒤 주어 + 동사(과거)", "no": "what kind of music 뒤 → I liked"}, {"k": "m", "t": "정리! **asked + 의문사(덩어리) + 주어 + 동사 / do·did 빼기 / 의문사 주어는 그대로** 👍"}], "notes": {"table": [["직접화법", "간접화법"], ["He said to me, \"Where do you live?\"", "He asked me where I lived."], ["She said to me, \"Why are you sad?\"", "She asked me why I was sad."], ["He said to m  your favorite food?\" → He asked me what ____.", "o": ["is my favorite food", "my favorite food is", "was my favorite food", "my favorite food was", "your favorite food was"], "a": 3, "e": "평서문 어순 + my + 과거"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["He asked me where I was from.", "She asked me who had broken the vase.", "I asked him how old his sister was.", "Mom asked me what time did I come home.", "He asked me why I looked so happy."], "a": 3, "e": "④ what time I had come home"}, {"k": "bl", "q": "He said to me, \"Where are you going now?\" → He asked me where I (was) going (then).", "e": "was / then"}, {"k": "bl", "q": "She said to him, \"What will you do tomorrow?\" → She asked him what he (would) do the (next|following) day.", "e": "would / the next day"}, {"k": "pk", "q": "I said to her, \"Which bus goes to the museum?\" → I asked her which bus [went*/did go] to the museum.", "e": "의문사 주어(which bus) + 동사"}, {"k": "pk", "q": "He said to me, \"How much is this bag?\" → He asked me how much [that bag was*/was that bag].", "e": "평서문 어순 + this → that"}, {"k": "fx", "q": "The officer asked me what my name is.", "w": "is", "a": ["was"], "e": "현재 → 과거"}, {"k": "ox", "q": "She said to me, \"Who is your teacher?\" → She asked me who my teacher was.", "a": true, "e": "✔"}, {"k": "ox", "q": "He said to me, \"Where do you live?\" → He asked me where did I live.", "a": false, "e": "where I lived"}], "practiceB": [{"k": "or", "q": "그녀는 나에게 내가 무엇을 찾고 있는지 물었다.", "a": "She asked me what I was looking for.", "e": "what + 주어 + 동사"}, {"k": "or", "q": "그는 나에게 누가 그 창문을 깼는지 물었다.", "a": "He asked me who had broken the window.", "e": "의문사 주어 + 동사"}, {"k": "wr", "q": "He said to me, \"When did you start learning English?\" → 간접화법으로", "a": ["He asked me when I had started learning English."], "e": "did 빼고 had started"}, {"k": "wr", "q": "She said to me, \"How many hours do you sleep?\" → 간접화법으로", "a": ["She asked me how many hours I slept."], "e": "덩어리 + I slept"}, {"k": "wr", "q": "I ew it.", "Never he has lied.", "So I am. (나도 그래)"], "a": 1, "e": "② 부정어 + 조동사 + 주어"}, {"k": "bl", "q": "If I had known it, I would have told you. → (Had) I known it, I would have told you.", "e": "if 생략 → Had + 주어 + p.p."}]}}, {"tag": "hk3-16-4", "name": "생략", "talk": [{"k": "m", "t": "**생략**: 반복되거나 없어도 뜻이 통하는 말은 빼요 ✂️ ① 반복되는 어구 생략: I can swim, but my brother can't (swim)."}, {"k": "m", "t": "② **대부정사**: to부정사 뒤 반복되는 동사구를 빼고 **to**만: A: Do you want to come? B: I'd love [to]."}, {"k": "q", "q": "A: Will you join us? B: I'd love ____. (= I'd love to join you.)", "o": ["to", "it", "so"], "a": 0, "ok": "맞아요! 대부정사 to", "no": "반복되는 join you를 빼고 to만 → I'd love to."}, {"k": "m", "t": "③ 부사절의 **주어 + be동사** 생략 (주절과 주어가 같을 때)"}, {"k": "ex", "en": "While (I was) walking home, I met Tom.", "ko": "집에 걸어가는 동안 나는 Tom을 만났다."}, {"k": "q", "q": "'Though he was tired, he kept working.'에서 생략할 수 있는 것은?", "o": ["Though", "he was", "kept"], "a": 1, "ok": "정확해요! 주어 + be동사 생략 → Though tired", "no": "부사절의 주어 + be동사 → he was"}, {"k": "m", "t": "④ 목적격 관계대명사, **주격 관계대명사 + be동사**, 목적어절을 이끄는 접속사 **that**도 생략 가능"}, {"k": "m", "t": "⚠️ 주격 관계대명사만 **혼자** 생략 ✗: The man who lives here … (who 생략 ✗)"}, {"k": "q", "q": "생략할 수 있는 that은?", "o": ["I think that he is right.", "That is my bag.", "I like that song."], "a": 0, "ok": "맞아요! 목적어절 접속사 that", "no": "think 뒤 목적어절을 이끄는 접속사 that → 생략 가능"}, {"k": "m", "t": "정리! **반복 어구 · 대부정사 to · 부사절 주어 + be동사 · 목적격 관계대명사 · 주격 관계대명사 + be동사 · 접속사 that** 👍"}], "notes": {"table": [["생략", "예"], ["반복 어구", "She likes cats, and I (like) dogs."], ["대부정사", "A: Can you come? B: I'd like to (come)."], ["부사절 주어 + be동사", "When (I was) young, I lived in Jeju."], ["목적격 관계대명사", "The book (which) I read was fun."], ["주격 관계대명사 + be동사", "The boy (who is) running is Tom."], ["접속사 that", "I hope (that) you like it."]], "tips": ["부사절 생략은 주절 주어와 같을 때만", "주격 관계대명사 단독 생략 ✗ (be동사와 함께만)"]}, "sets": {"workbook": [{"k": "pk", "q": "A: Do you want to come with us? B: I'd love [to*/to it].", "e": "대부정
