<title>문법 키우기 중3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 열 학습 화면 — 목록 → DM 개념톡 → 문제 카드. 학원 파란색 + 공책 같은 옅은 회청색 바탕 */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f7fc; --line:#d9e1ee; --fg:#17202e; --muted:#5d6a7e;
  --blue:#2457d6; --blue-soft:#e3ebfb; --blue-ink:#163d9e; --me:#2457d6; --me-fg:#ffffff;
  --good:#11845b; --good-soft:#e1f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7; --star:#e3a400;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface2:#1e2839; --line:#2c3850; --fg:#e8edf6; --muted:#9aa6bb;
  --blue:#6f9bff; --blue-soft:#20305a; --blue-ink:#b9ccff; --me:#3c6ee8; --me-fg:#ffffff;
  --good:#4fd09b; --good-soft:#163a2d; --bad:#ff7d7d; --bad-soft:#41202a; --star:#ffc93d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:20px;color:var(--blue);border:0;background:none;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.vlab{font-size:13px;color:var(--muted)}
.vsel{max-width:150px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 8px;font:inherit;font-size:13px}
@media (max-width:520px){.vlab{display:none}.vsel{max-width:110px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:14px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3;margin:20px 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.lead{margin:0 0 16px;color:var(--muted)}
/* 유닛 목록 */
.units{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:left;display:grid;line-height:1.35;font-size:14px}
.tab b{color:var(--blue);font-weight:700}
.tab small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on b,.tab.on small{color:#fff}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.unit .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .no{font-family:var(--f-display);color:var(--blue);font-size:18px;min-width:34px}
.unit .nm{font-weight:700;flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 6px;text-align:center;font-size:13.5px;line-height:1.3;display:grid;gap:2px}
.step b{font-weight:500}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done{background:var(--good-soft);border-color:transparent}
.step.done small{color:var(--good);font-weight:700}
.step.tried small{color:var(--bad)}
.step.lock{opacity:.5}
.chset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.chset .step{padding:12px 6px;font-size:15px}
.sec{font-family:var(--f-display);font-size:18px;margin:22px 0 8px;color:var(--blue-ink)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
/* DM 개념톡 */
.dm{display:grid;gap:8px;padding-block:12px;align-content:start;min-height:calc(100dvh - 150px)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:15px}
.av.ghost{visibility:hidden}
.bub{max-width:min(560px,82%);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 14px;min-width:0;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:18px 18px 6px 18px}
.bub.ex{background:var(--blue-soft);border-color:transparent}
.bub.ex .en{font-weight:700;color:var(--blue-ink);font-size:17px}
.bub.ex .ko{font-size:14px;color:var(--muted)}
.say{border:0;background:none;padding:0 4px;color:var(--blue);font-size:15px}
.bub strong{color:var(--blue-ink)}
.row.me .bub strong{color:inherit}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:1px 6px;font:inherit;font-weight:700;color:var(--blue-ink);text-align:center;width:6.5em}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.opt:hover{border-color:var(--blue)}
.qbub{border-color:var(--blue)}
.qbub .qq{font-weight:700}
.dmfoot{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
/* 문제 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-top:12px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notes h3{margin:0 0 8px;font-size:15px;color:var(--blue-ink)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:500}
.tips{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.kind{font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.qtext{font-size:18px;white-space:pre-line}
.qtext.en{font-size:19px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;margin:0 2px;font:inherit;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.right{background:var(--good);border-color:var(--good);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tok{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:3px 2px;font:inherit}
.tok.sel{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tok.used{opacity:.3}
.fxrow{display:flex;gap:8px;align-items:center}
.fxrow .inp{flex:1;min-width:0}
.ans{min-height:46px;border:1px dashed var(--line);border-radius:10px;padding:6px;background:var(--surface2)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg)}
.choices{display:grid;gap:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;display:flex;gap:10px}
.choice .n{color:var(--blue);font-weight:700;min-width:20px}
.choice.on{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.m12{display:grid;gap:4px}
.m12 .choice .n{min-width:22px}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--f-display);font-size:30px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:8px}
.ox button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .why{color:var(--fg);display:block;margin-top:2px}
.fb .key{display:block;font-weight:700;margin-top:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kh{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--fg)}
.dmfoot{align-items:center}
@media (hover:none){.kh{display:none}}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px 18px}
.score{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score.pass{color:var(--good)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.wlist{display:grid;gap:6px;text-align:left;width:100%}
.wlist div{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:14px;z-index:20}
@media (max-width:520px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:24px}.bub{max-width:88%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const BOOK = {"book": "hk3", "title": "해커스 중학영문법 3학년", "chapters": [{"book": "hk3", "chapter": {"id": "00", "name": "기초 문법", "title": "해커스 중학영문법 3학년 · 기초 문법"}, "units": [{"tag": "hk3-00-1", "name": "문장 성분", "talk": [{"k": "m", "t": "중3 문법 시작! 먼저 **문장 성분**을 복습하고 한 단계 더 가요. 중3에서는 단어뿐 아니라 **구·절 덩어리**도 하나의 성분이 돼요 🧩"}, {"k": "m", "t": "주요 성분 4가지: **주어**(~은/는) · **동사**(~하다/~이다) · **목적어**(~을/를, ~에게) · **보어**(주어·목적어 설명) + 꾸미는 말 **수식어**"}, {"k": "ex", "en": "My little brother broke the window yesterday.", "ko": "내 남동생이 어제 창문을 깼다. (주어 My little brother / 동사 broke / 목적어 the window / 수식어 yesterday)"}, {"k": "q", "q": "The man in the black coat is my uncle. 에서 주어 덩어리는?", "o": ["The man", "The man in the black coat", "my uncle"], "a": 1, "ok": "맞아요! in the black coat가 man을 꾸며서 함께 주어 덩어리", "no": "in the black coat는 man을 꾸미는 말 → 주어 덩어리는 The man in the black coat"}, {"k": "m", "t": "목적어는 두 개일 수도 있어요: 간접목적어(~에게) + 직접목적어(~을). She gave [me] a gift."}, {"k": "m", "t": "**보어**: 주어를 설명하면 주격 보어(The test was **difficult**.), 목적어를 설명하면 목적격 보어(The test made us **nervous**.)"}, {"k": "q", "q": "We found the room empty. 에서 'empty'의 문장 성분은?", "o": ["목적어", "보어", "수식어"], "a": 1, "ok": "정확해요! 방이 비어 있다 → 목적격 보어", "no": "the room = empty인 상태 → 목적어를 설명하는 목적격 보어"}, {"k": "m", "t": "⭐ 중3 포인트! **구·절**도 주어·목적어·보어 자리에 와요: **To keep a diary** is hard. (주어) / I hope **that you like it**. (목적어) / My plan is **to travel alone**. (보어)"}, {"k": "q", "q": "My dream is to become a vet. 에서 'to become a vet'의 문장 성분은?", "o": ["주어", "목적어", "보어"], "a": 2, "ok": "맞아요! dream = to become a vet → 주격 보어", "no": "be동사 뒤에서 주어 My dream을 설명 → 보어"}, {"k": "m", "t": "⚠️ 주어가 길어도 동사는 **핵심 주어**에 맞춰요: The **books** on the desk **are** mine. (desk ✗ → books)"}, {"k": "q", "q": "The key to these doors ____ on the table.", "o": ["is", "are", "be"], "a": 0, "ok": "맞아요! 핵심 주어 The key → is", "no": "doors는 꾸미는 말 속 명사 → 핵심 주어 key(단수) → is"}, {"k": "m", "t": "정리! **주요 성분 = 주어·동사·목적어·보어 / 구·절 덩어리도 성분 / 긴 주어는 핵심 명사에 수 일치** 👍"}], "notes": {"table": [["문장 성분", "단어로 쓸 때", "구·절로 쓸 때"], ["주어", "Mina likes cats.", "To learn English is fun. / What he said was true."], ["목적어", "I love music.", "I want to sleep. / I know that he is kind."], ["주격 보어", "He is tall.", "My job is teaching kids. / The truth is that I forgot."], ["목적격 보어", "We call him Ace.", "Mom told me to wait."], ["수식어", "I run fast.", "We met at the park. / I left when it rained."]], "tips": ["주어 자리 → 주격(I, he, they), 목적어 자리 → 목적격(me, him, them)", "보어 자리 → 명사·형용사 (부사 -ly ✗)", "긴 주어(명사 + 수식어)는 핵심 명사에 동사를 맞춤", "to부정사구·동명사구·명사절이 주어면 단수 취급"]}, "sets": {"workbook": [{"k": "ch", "q": "The baby smiled at me. 에서 'The baby'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 0, "e": "'아기가' → 주어"}, {"k": "ch", "q": "My aunt sent me a postcard. 에서 'me'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 2, "e": "'나에게' → 간접목적어"}, {"k": "ch", "q": "His voice sounds strange. 에서 'strange'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 3, "e": "목소리의 상태 → 주격 보어"}, {"k": "ch", "q": "We stayed at the hotel for three days. 에서 'for three days'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 4, "e": "기간 표현 → 수식어"}, {"k": "ch", "q": "The children laughed loudly. 에서 'laughed'의 문장 성분은?", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 1, "e": "'웃었다' → 동사"}, {"k": "ox", "q": "They made him leader. 에서 'leader'는 목적격 보어이다.", "a": true, "e": "him = leader → 목적격 보어 ✔"}, {"k": "ox", "q": "To play the violin is my hobby. 에서 'To play the violin'은 목적어이다.", "a": false, "e": "'바이올린을 연주하는 것은' → 주어"}, {"k": "pk", "q": "The water feels [cold*/coldly].", "e": "보어 자리 → 형용사"}, {"k": "pk", "q": "Ms. Park teaches [we/us*] science.", "e": "간접목적어 자리 → 목적격"}, {"k": "fx", "q": "Them are my classmates.", "w": "Them", "a": ["They"], "e": "주어 자리 → 주격 They"}], "practiceA": [{"k": "ch", "q": "문장에서 'that he was right'의 문장 성분은?\nI thought that he was right.", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 2, "e": "'그가 옳다는 것을' 생각했다 → 목적어"}, {"k": "ch", "q": "보어가 있는 문장은?", "o": ["I lost my wallet.", "He sent her flowers.", "The plan sounds perfect.", "We ran to the station.", "She speaks French well."], "a": 2, "e": "③ 계획의 상태 perfect → 보어"}, {"k": "ch", "q": "다음 문장의 주어 전체로 알맞은 것은?\nThe girls in my class like K-pop.", "o": ["The girls", "The girls in my class", "my class", "in my class", "K-pop"], "a": 1, "e": "in my class가 girls를 꾸밈 → 주어 덩어리"}, {"k": "ch", "q": "'happy'의 문장 성분이 나머지와 다른 것은?", "o": ["She looks happy.", "They seem happy.", "The music made us happy.", "He was a happy boy.", "I feel happy."], "a": 3, "e": "④ 명사 boy를 꾸미는 수식어 / 나머지는 보어"}, {"k": "ch", "q": "다음 문장에서 수식어를 모두 고른 것은?\nLast week my cousin visited us with her dog.\nⓐ Last week ⓑ my cousin ⓒ visited ⓓ us ⓔ with her dog", "o": ["ⓐ", "ⓔ", "ⓐ, ⓔ", "ⓓ, ⓔ", "ⓐ, ⓓ, ⓔ"], "a": 2, "e": "시간(Last week)·동반(with her dog) → 수식어 / us는 목적어"}, {"k": "ox", "q": "My hobby is collecting coins. 에서 'collecting coins'는 보어이다.", "a": true, "e": "hobby = collecting coins → 주격 보어 ✔"}, {"k": "ox", "q": "He gave his sister a doll. 에서 'his sister'는 보어이다.", "a": false, "e": "'여동생에게' → 간접목적어 (sister ≠ doll)"}, {"k": "pk", "q": "The books on the shelf [is/are*] old.", "e": "핵심 주어 books → are"}, {"k": "pk", "q": "The movie made me [sleepy*/sleepily].", "e": "목적격 보어 → 형용사"}, {"k": "fx", "q": "The cookies smell sweetly.", "w": "sweetly", "a": ["sweet"], "e": "보어 자리 → 형용사"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Keep your room tidy.\nⓑ The students in the gym is noisy.\nⓒ To learn languages is useful.\nⓓ The news made her sadly.\nⓔ He told us a funny story.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ are (핵심 주어 students) / ⓓ sad"}, {"k": "ch", "q": "문장 성분이 바르게 짝지어진 것은?", "o": ["I believe that she is honest. → that she is honest: 보어", "My goal is to win. → to win: 목적어", "They named their dog Toto. → Toto: 목적격 보어", "He studied hard for the test. → hard: 보어", "She bought me a hat. → me: 수식어"], "a": 2, "e": "③ dog = Toto / ① 목적어 ② 보어 ④ 수식어 ⑤ 간접목적어"}, {"k": "ch", "q": "보어가 없는 문장은?", "o": ["The leaves turned red.", "Her job is to teach kids.", "We elected him captain.", "He showed me his new phone.", "I found the test easy."], "a": 3, "e": "④ me·his new phone 모두 목적어 (4형식)"}, {"k": "ch", "q": "다음 문장의 주어로 알맞은 것은?\nWhat he said at the meeting surprised everyone.", "o": ["What", "What he said", "What he said at the meeting", "he", "everyone"], "a": 2, "e": "'그가 회의에서 말한 것이' → 절 덩어리 전체가 주어, 동사는 surprised"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The pictures on the wall are beautiful.", "Playing games is fun.", "The color of her eyes is blue.", "The boy with two dogs live here.", "My plan is to read ten books."], "a": 3, "e": "④ 핵심 주어 boy → lives"}, {"k": "or", "q": "영어로 일기를 쓰는 것은 쉽지 않다.", "a": "To keep a diary in English is not easy.", "e": "to부정사구가 주어"}, {"k": "wr", "q": "다음 문장에서 목적어를 찾아 쓰시오. I hope that you will get better soon.", "a": ["that you will get better soon"], "e": "'네가 곧 나아지기를' → that절 목적어"}, {"k": "wr", "q": "다음 문장에서 주격 보어를 찾아 쓰시오. My plan for this summer is to learn swimming.", "a": ["to learn swimming"], "e": "plan = to learn swimming → 보어"}, {"k": "fx", "q": "The flowers in the vase is beautiful.", "w": "is", "a": ["are"], "e": "핵심 주어 flowers → are"}, {"k": "fx", "q": "The teacher made we write an essay.", "w": "we", "a": ["us"], "e": "목적어 자리 → 목적격 us"}]}}, {"tag": "hk3-00-2", "name": "8품사", "talk": [{"k": "m", "t": "단어는 하는 일에 따라 **8품사**: 명사·대명사·동사·형용사·부사·전치사·접속사·감탄사 🗂️ (명·대·동·형·부·전·접·감)"}, {"k": "m", "t": "**명사** 이름 / **대명사** 명사 대신 / **동사** 동작·상태 / **형용사** 명사 수식·보어 / **부사** 동사·형용사·부사·문장 수식"}, {"k": "ex", "en": "Her kindness really moved me.", "ko": "그녀의 친절함이 정말로 나를 감동시켰다. (kindness 명사 / really 부사 / moved 동사 / me 대명사)"}, {"k": "q", "q": "'kindness'의 품사는?", "o": ["명사", "형용사", "부사"], "a": 0, "ok": "맞아요! kind(형용사) + ness → 명사", "no": "-ness는 명사를 만드는 꼬리 → 명사"}, {"k": "m", "t": "**전치사** + 명사(구) / **접속사** + 절(주어 + 동사) / **감탄사** Oh, Wow, Oops"}, {"k": "q", "q": "I have lived here since 2020. 에서 'since'의 품사는?", "o": ["전치사", "접속사", "부사"], "a": 0, "ok": "정확해요! 뒤에 명사(2020)만 → 전치사", "no": "뒤에 주어 + 동사가 없고 명사만 → 전치사"}, {"k": "m", "t": "⭐ 중3 포인트! 같은 단어도 **쓰임**에 따라 품사가 바뀌어요. before: I met him before lunch. (전치사) / Call me before you leave. (접속사) / I've seen it before. (부사)"}, {"k": "ex", "en": "That is my bag. / That bag is mine. / I know that he is kind.", "ko": "저것은 내 가방이다. (대명사) / 저 가방은 내 것이다. (형용사) / 나는 그가 친절하다는 것을 안다. (접속사)"}, {"k": "q", "q": "I think that this plan will work. 에서 'that'의 품사는?", "o": ["대명사", "형용사", "접속사"], "a": 2, "ok": "맞아요! 뒤에 절(this plan will work) → 접속사", "no": "that 뒤에 주어 + 동사가 이어지는 절 → 접속사"}, {"k": "m", "t": "⚠️ well: He sings **well**. (부사, 잘) / I'm not **well** today. (형용사, 건강한) — friendly·lovely·lonely는 -ly여도 **형용사**!"}, {"k": "m", "t": "정리! **품사는 단어 모양이 아니라 문장 속 쓰임으로 판단** 👍"}], "notes": {"table": [["단어", "품사 ①", "품사 ②", "품사 ③"], ["before / after", "전치사: before lunch", "접속사: before you leave", "부사: I've been there before."], ["since", "전치사: since 2020", "접속사: since we met (~이래로) / Since it was late, ... (~ 때문에)", "-"], ["that", "대명사: That is mine.", "형용사: that bag", "접속사: I know that ..."], ["like", "동사: I like it.", "전치사: She looks like her mom.", "-"], ["well", "부사: sing well", "형용사: I'm not well. (건강한)", "감탄사: Well, let me see."]], "tips": ["-ly 형용사: friendly, lovely, lonely, lively, ugly, costly", "fast, hard, late, early, high는 형용사·부사 같은 모양", "뒤에 명사만 → 전치사 / 뒤에 주어 + 동사 → 접속사"]}, "sets": {"workbook": [{"k": "ch", "q": "'quickly'의 품사는?", "o": ["명사", "동사", "형용사", "부사", "전치사"], "a": 3, "e": "동사를 꾸미는 부사"}, {"k": "ch", "q": "'between'의 품사는?", "o": ["명사", "동사", "형용사", "부사", "전치사"], "a": 4, "e": "between A and B → 전치사"}, {"k": "ch", "q": "'although'의 품사는?", "o": ["명사", "대명사", "부사", "전치사", "접속사"], "a": 4, "e": "절과 절을 연결 → 접속사"}, {"k": "ch", "q": "'themselves'의 품사는?", "o": ["명사", "대명사", "동사", "형용사", "부사"], "a": 1, "e": "재귀대명사 → 대명사"}, {"k": "ch", "q": "'decide'의 품사는?", "o": ["명사", "동사", "형용사", "부사", "감탄사"], "a": 1, "e": "'결정하다' → 동사 (명사는 decision)"}, {"k": "ox", "q": "'lovely'는 형용사이다.", "a": true, "e": "명사 love + ly → 형용사 ✔"}, {"k": "ox", "q": "'happiness'는 형용사이다.", "a": false, "e": "-ness → 명사"}, {"k": "pk", "q": "It was a [terrible*/terribly] mistake.", "e": "명사 mistake를 꾸밈 → 형용사"}, {"k": "pk", "q": "She dances [beautiful/beautifully*].", "e": "동사를 꾸밈 → 부사"}, {"k": "fx", "q": "He answered the question correct.", "w": "correct", "a": ["correctly"], "e": "동사 answered를 꾸밈 → 부사"}], "practiceA": [{"k": "ch", "q": "품사가 나머지와 다른 것은?", "o": ["friendly", "lonely", "lively", "ugly", "safely"], "a": 4, "e": "⑤ 부사 / 나머지는 형용사"}, {"k": "ch", "q": "'before'의 품사가 나머지와 다른 것은?", "o": ["Wash your hands before dinner.", "I got up before sunrise.", "Finish it before the deadline.", "Call me before you leave.", "He arrived before noon."], "a": 3, "e": "④ 뒤에 절(you leave) → 접속사 / 나머지는 전치사"}, {"k": "ch", "q": "문장에서 'That'의 품사는?\nThat house on the hill is very old.", "o": ["명사", "대명사", "형용사", "부사", "접속사"], "a": 2, "e": "명사 house를 꾸밈 → 형용사(지시형용사)"}, {"k": "ch", "q": "다음 문장에서 부사를 모두 고른 것은?\nShe always speaks very softly.", "o": ["always", "always / softly", "very / softly", "always / very / softly", "speaks / softly"], "a": 3, "e": "always(빈도) / very(softly 수식) / softly(speaks 수식)"}, {"k": "ch", "q": "'like'의 품사가 나머지와 다른 것은?", "o": ["I like spicy food.", "Do you like jazz?", "She looks like her mom.", "They like playing chess.", "We like this song."], "a": 2, "e": "③ '~처럼' → 전치사 / 나머지는 동사"}, {"k": "bl", "q": "그는 매우 열심히 공부한다. → He studies very (hard).", "e": "동사를 꾸미는 부사 hard (hardly는 '거의 ~않다')"}, {"k": "pk", "q": "The bus was [late*/lately] again.", "e": "보어 자리 → 형용사 late (lately는 '최근에')"}, {"k": "pk", "q": "I stayed home [because*/because of] I was sick.", "e": "뒤에 절 → 접속사 because"}, {"k": "ox", "q": "I'm not well today. 에서 'well'은 형용사이다.", "a": true, "e": "'건강한' → 형용사 ✔"}, {"k": "fx", "q": "She looked at me angry.", "w": "angry", "a": ["angrily"], "e": "동사(looked at)를 꾸밈 → 부사"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ He is a careful driver.\nⓑ She solved the problem ]", "e": "주어 + 동사 없음 → 구"}, {"k": "pk", "q": "'what he wants' → [구/절*]", "e": "he + wants → 절"}, {"k": "pk", "q": "'to be honest with you' → [구*/절]", "e": "주어 없음 → 구"}, {"k": "pk", "q": "'who helped me' → [구/절*]", "e": "관계대명사 who(주어 역할) + helped → 절"}, {"k": "pk", "q": "'despite the heavy rain' → [구*/절]", "e": "전치사 + 명사 → 구"}, {"k": "ch", "q": "문장에서 'with blue eyes'의 역할은?\nThe cat with blue eyes is Luna.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 1, "e": "명사 cat을 꾸밈 → 형용사구"}, {"k": "ch", "q": "문장에서 'that the store was closed'의 역할은?\nI didn't know that the store was closed.", "o": ["명사절", "형용사절", "부사절", "명사구", "부사구"], "a": 0, "e": "know의 목적어 → 명사절"}, {"k": "ch", "q": "문장에서 'who sat next to me'의 역할은?\nThe boy who sat next to me was kind.", "o": ["명사절", "형용사절", "부사절", "명사구", "부사구"], "a": 1, "e": "명사 boy를 꾸밈 → 형용사절"}, {"k": "ox", "q": "'while I was sleeping'은 부사절이다.", "a": true, "e": "시간을 나타내는 부사절 ✔"}, {"k": "ox", "q": "Reading comic books is fun. 에서 'Reading comic books'는 부사구이다.", "a": false, "e": "주어 역할 → 명사구"}], "practiceA": [{"k": "ch", "q": "절이 아닌 것은?", "o": ["if it snows tomorrow", "what I bought yesterday", "during the summer vacation", "whether he is at home", "which I read last week"], "a": 2, "e": "③ 전치사 + 명사 → 구"}, {"k": "ch", "q": "문장에서 'To get up early'의 역할은?\nTo get up early is hard for me.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 0, "e": "주어 역할 → 명사구"}, {"k": "ch", "q": "문장에서 'If you need help'의 역할은?\nIf you need help, call me.", "o": ["명사절", "형용사절", "부사절", "명사구", "부사구"], "a": 2, "e": "조건 → 부사절"}, {"k": "ch", "q": "문장에서 'whether it is true'의 역할은?\nNobody knows whether it is true.", "o": ["명사절", "형용사절", "부사절", "명사구", "부사구"], "a": 0, "e": "knows의 목적어 → 명사절"}, {"k": "ch", "q": "문장에서 'to read on the train'의 역할은?\nI need a book to read on the train.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 1, "e": "명사 book을 꾸밈 → 형용사구"}, {"k": "ox", "q": "I like the song which you sang. 에서 'which you sang'은 명사절이다.", "a": false, "e": "명사 song을 꾸밈 → 형용사절"}, {"k": "ox", "q": "The park is quiet, and the air is fresh. 는 두 절이 등위접속사로 연결된 문장이다.", "a": true, "e": "and로 대등하게 연결 → 등위절 ✔"}, {"k": "pk", "q": "We had fun [during*/while] the trip.", "e": "뒤에 명사 → 전치사 during"}, {"k": "pk", "q": "[Although*/Despite] she was tired, she finished her homework.", "e": "뒤에 절 → 접속사 Although"}, {"k": "fx", "q": "He went out while the storm.", "w": "while", "a": ["during"], "e": "뒤에 명사 → during"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I was late because of the traffic.\nⓑ Despite it was raining, we played soccer.\nⓒ She called me while I was taking a shower.\nⓓ He fell asleep during the class.\nⓔ Although the noise, I slept well.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ Although / ⓔ Despite"}, {"k": "ch", "q": "짝지은 역할이 바르지 않은 것은?", "o": ["Learning a language takes time. → Learning a language: 명사구", "The girl with long hair is Mina. → with long hair: 형용사구", "I believe that he is innocent. → that he is innocent: 명사절", "The bag that I lost was new. → that I lost: 명사절", "When I got home, it was dark. → When I got home: 부사절"], "a": 3, "e": "④ 명사 bag을 꾸밈 → 형용사절"}, {"k": "ch", "q": "다음 문장에서 절은 모두 몇 개인가?\nI know that the woman who lives upstairs is a pilot.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "I know / (that) the woman is a pilot / who lives upstairs → 3개"}, {"k": "ch", "q": "'that'이 이끄는 절의 역할이 나머지와 다른 것은?", "o": ["I think that he is right.", "She said that she was busy.", "The movie that we watched was sad.", "I hope that you like it.", "We know that the earth is round."], "a": 2, "e": "③ 명사 movie를 꾸밈 → 형용사절 / 나머지는 목적어 → 명사절"}, {"k": "bl", "q": "날씨가 나빴기 때문에 경기가 취소되었다. → The game was canceled (because|since|as) the weather was bad.", "e": "뒤에 절 → 접속사"}, {"k": "bl", "q": "나쁜 날씨 때문에 경기가 취소되었다. → The game was canceled because (of) the bad weather.", "e": "뒤에 명사 → because of"}, {"k": "wr", "q": "다음 문장에서 형용사절을 찾아 쓰시오. The pizza that we ordered was cold.", "a": ["that we ordered"], "e": "명사 pizza를 꾸밈 → 형용사절"}, {"k": "wr", "q": "다음 문장에서 명사절을 찾아 쓰시오. Can you tell me where the bus stop is?", "a": ["where the bus stop is"], "e": "tell의 직접목적어 → 명사절(간접의문문)"}, {"k": "or", "q": "나는 그가 올지 안 올지 모른다.", "a": "I don't know if he will come.", "e": "if절 → know의 목적어(명사절)"}, {"k": "fx", "q": "Despite he was sick, he went to school.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "뒤에 절 → 접속사"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "다음 문장의 목적어를 쓰시오. Everyone knows that he tells the truth.", "a": ["that he tells the truth"], "e": "knows의 목적어 → that절"}, {"k": "wr", "q": "다음 문장의 주격 보어를 쓰시오. The problem is that we have no time.", "a": ["that we have no time"], "e": "problem = that절 → 보어"}, {"k": "wr", "q": "다음 문장에서 부사를 모두 찾아 순서대로 쉼표로 이어 쓰시오. He usually gets up very early.", "a": ["usually, very, early", "usually,very,early", "usually very early"], "e": "usually(빈도) / very(early 수식) / early(gets up 수식)"}, {"k": "wr", "q": "다음 문장에서 형용사절을 찾아 쓰시오. I have a friend who can speak three languages.", "a": ["who can speak three languages"], "e": "명사 friend를 꾸밈"}, {"k": "wr", "q": "다음 문장에서 부사절을 찾아 쓰시오. Although he is young, he is very wise.", "a": ["Although he is young"], "e": "양보 → 부사절"}, {"k": "bl", "q": "나는 영화를 보는 동안 잠이 들었다. → I fell asleep (while) I was watching the movie.", "e": "뒤에 절 → while"}, {"k": "bl", "q": "그녀는 아팠음에도 불구하고 학교에 갔다. → (Although|Though|Even though) she was sick, she went to school.", "e": "뒤에 절 → 접속사"}, {"k": "fx", "q": "The boys in the band is from Busan.", "w": "is", "a": ["are"], "e": "핵심 주어 boys → are"}, {"k": "fx", "q": "She speaks English very good.", "w": "good", "a": ["well"], "e": "동사를 꾸밈 → 부사 well"}, {"k": "or", "q": "운동은 우리를 건강하게 유지해 준다.", "a": "Exercise keeps us healthy.", "e": "목적어 us + 목적격 보어 healthy"}], "test": [{"k": "ch", "q": "문장에서 'nervous'의 문장 성분은?\nThe interview made him nervous.", "o": ["주어", "동사", "목적어", "보어", "수식어"], "a": 3, "e": "him = nervous인 상태 → 목적격 보어"}, {"k": "ch", "q": "보어가 있는 문장은?", "o": ["She bought a new bike.", "He lent me his pen.", "The baby fell asleep.", "We went to the beach.", "They talked loudly."], "a": 2, "e": "③ asleep → 주격 보어"}, {"k": "ch", "q": "품사가 나머지와 다른 것은?", "o": ["slowly", "kindly", "friendly", "quietly", "happily"], "a": 2, "e": "③ 형용사 / 나머지는 부사"}, {"k": "ch", "q": "문장에서 'after'의 품사는?\nI'll call you after I finish my homework.", "o": ["명사", "부사", "형용사", "전치사", "접속사"], "a": 4, "e": "뒤에 절(I finish ...) → 접속사"}, {"k": "ch", "q": "구가 아닌 것은?", "o": ["in front of the bank", "to win the game", "because of the noise", "when the bell rang", "a lot of money"], "a": 3, "e": "④ the bell + rang → 절"}, {"k": "ch", "q": "문장에서 'who teaches us math'의 역할은?\nThe woman who teaches us math is kind.", "o": ["명사절", "형용사절", "부사절", "명사구", "부사구"], "a": 1, "e": "명사 woman을 꾸밈 → 형용사절"}, {"k": "ch", "q": "문장에서 'To travel around the world'의 역할은?\nTo travel around the world is my dream.", "o": ["명사구", "형용사구", "부사구", "명사절", "부사절"], "a": 0, "e": "주어 역할 → 명사구"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ The students in the library are quiet.\nⓑ She sang the song beautiful.\nⓒ I fell asleep during the lecture.\nⓓ Despite he was tired, he kept working.\nⓔ The news made me happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓔ 옳음 / ⓑ beautifully / ⓓ Although"}, {"k": "ch", "q": "'well'의 품사가 나머지와 다른 것은?", "o": ["He plays the piano well.", "She speaks Chinese well.", "I didn't sleep well.", "My grandma is not well these days.", "You did well on the test."], "a": 3, "e": "④ '건강한' → 형용사 / 나머지는 부사"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nWe stayed inside ____ the storm.\nHe called me ____ I was out.", "o": ["during – while", "while – during", "during – during", "while – while", "because – during"], "a": 0, "e": "명사 앞 during / 절 앞 while"}, {"k": "ch", "q": "다음 문장에서 주요 성분의 핵심 단어만 바르게 남긴 것은?\nThe tall man in the blue shirt bought his son a new bike yesterday.", "o": ["man bought son bike", "The tall man bought", "man bought bike yesterday", "bought his son a new bike", "man in the blue shirt"], "a": 0, "e": "주어 man / 동사 bought / 간접목적어 son / 직접목적어 bike"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["The soup smells good.", true], ["The cars in the parking lot is mine.", false], ["To learn new things is exciting.", true], ["She answered the question quick.", false], ["I met him at the station.", true], ["Although the rain, we went hiking.", false], ["He is a lovely boy.", true], ["We stayed home while the holiday.", false], ["The teacher gave us a quiz.", true], ["Keep your hands warm.", true], ["He speaks English very well.", true], ["The movie made me sadly.", false]], "e": "ⓑ are ⓓ quickly ⓕ Despite / In spite of ⓗ during ⓛ sad"}, {"k": "m12", "q": "다음 12개 중 절이 아닌 것(구)을 모두 고르시오.", "s": [["when the movie ended", true], ["on the top of the hill", false], ["that she likes cats", true], ["to solve the problem", false], ["who called me", true], ["during the meeting", false], ["if it is true", true], ["my old friends", false], ["although he tried hard", true], ["despite the cold weather", false], ["what you need", true], ["where she lives", true]], "e": "구: ⓑ ⓓ ⓕ ⓗ ⓙ (주어 + 동사 없음)"}, {"k": "wr", "q": "다음 문장에서 명사절을 찾아 쓰시오. I wonder if she remembers me.", "a": ["if she remembers me"], "e": "wonder의 목적어 → 명사절"}, {"k": "wr", "q": "빈칸에 although와 despite 중 알맞은 것을 쓰시오. ____ the heavy traffic, we arrived on time.", "a": ["Despite"], "e": "뒤에 명사 → 전치사 despite"}]}}, {"book": "hk3", "chapter": {"id": "01", "name": "문장의 형식", "title": "해커스 중학영문법 3학년 · Chapter 1 문장의 형식"}, "units": [{"tag": "hk3-01-1-1", "name": "1형식과 2형식", "talk": [{"k": "m", "t": "Chapter 1은 **문장의 형식**! 중1·중2에서 배운 다섯 가지 뼈대를 중3(고등 대비) 수준으로 다시 다져요 🦴"}, {"k": "m", "t": "**1형식** S + V (+ 수식어): arrive, happen, live, rise … **There + be동사 + 주어**도 1형식이고, 수 일치는 be동사 뒤의 주어에 맞춰요."}, {"k": "ex", "en": "There were a lot of people at the festival.", "ko": "축제에 사람들이 많이 있었다. (주어 = a lot of people)"}, {"k": "q", "q": "There ____ some milk in the bottle.", "o": ["is", "are", "be"], "a": 0, "ok": "맞아요! milk는 셀 수 없는 명사 → is", "no": "주어 some milk(셀 수 없는 명사) → 단수 취급 is"}, {"k": "m", "t": "⭐ 중3 포인트! **뜻에 주의할 1형식 동사**: matter(중요하다) · work(효과가 있다) · do(충분하다) · last(지속되다) · pay(이익이 되다) — 목적어 없이 문장이 끝나요."}, {"k": "ex", "en": "It doesn't matter. / This medicine works well. / The rain lasted for a week.", "ko": "그것은 중요하지 않다. / 이 약은 효과가 좋다. / 비가 일주일 동안 계속되었다."}, {"k": "q", "q": "This medicine really works. 에서 'works'의 뜻은?", "o": ["일하다", "효과가 있다", "작동시키다"], "a": 1, "ok": "정확해요! work = 효과가 있다 (1형식)", "no": "약이 '일한다'는 어색 → '효과가 있다'"}, {"k": "m", "t": "**2형식** S + V + C: 상태 be · keep · stay · remain / 변화 become · get · grow · turn · go · come · fall · run / 판단 seem · appear"}, {"k": "ex", "en": "The milk went sour. / The river ran dry. / She fell ill.", "ko": "우유가 시큼해졌다(상했다). / 강이 말라 버렸다. / 그녀는 병이 났다."}, {"k": "q", "q": "He remained ____ during the meeting.", "o": ["silent", "silently", "silence"], "a": 0, "ok": "맞아요! remain + 형용사", "no": "2형식 보어 자리 → 형용사 silent"}, {"k": "m", "t": "⚠️ 보어 자리에 부사(-ly) ✗ — stay calmly ✗ → stay [calm]"}, {"k": "m", "t": "정리! **1형식 S + V(+ 수식어), matter·work·do·last·pay / 2형식 S + V + C(명사·형용사)** 👍"}], "notes": {"table": [["형식", "구조", "동사 예"], ["1형식", "S + V (+ 수식어)", "go, come, arrive, happen, rise, There + be"], ["1형식 (뜻 주의)", "S + V", "matter 중요하다, work 효과가 있다, do 충분하다, last 지속되다, pay 이익이 되다"], ["2형식 (상태)", "S + V + C", "be, keep, stay, remain"], ["2형식 (변화)", "S + V + C", "become, get, grow, turn, go, come, fall, run"], ["2형식 (판단)", "S + V + C", "seem, appear"]], "tips": ["go bad(상하다), go wrong(잘못되다), come true(실현되다), fall asleep(잠들다), fall ill(병이 나다), run dry(마르다)", "The movie lasted two hours. → two hours는 목적어가 아니라 수식어(기간) → 1형식", "There + be 뒤의 명사가 주어 → 수 일치"]}, "sets": {"workbook": [{"k": "ch", "q": "The accident happened on a rainy night. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 0, "e": "accident(S) + happened(V), 나머지는 수식어"}, {"k": "ch", "q": "The leaves turned brown. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 1, "e": "brown = 주격 보어"}, {"k": "ch", "q": "It doesn't matter. 의 형식은?", "o": ["1형식", "2형식", "3형식", "4형식", "5형식"], "a": 0, "e": "matter(중요하다)는 1형식"}, {"k": "pk", "q": "The fish went [bad*/badly].", "e": "go + 형용사 (상하다)"}, {"k": "pk", "q": "There [is/are*] a lot of cars on the road.", "e": "주어 a lot of cars → are"}, {"k": "pk", "q": "Please keep [calm*/calmly].", "e": "keep + 형용사"}, {"k": "bl", "q": "그녀의 소원이 이루어졌다. → Her wish (came) true.", "e": "come true"}, {"k": "bl", "q": "그 축제는 일주일 동안 계속되었다. → The festival (lasted) for a week.", "e": "last = 지속되다 (1형식)"}, {"k": "ox", "q": "This plan will work. 는 1형식이다.", "a": true, "e": "work = 효과가 있다, 목적어 없음 ✔"}, {"k": "fx", "q": "The weather became warmly.", "w": "warmly", "a": ["warm"], "e": "become + 형용사"}], "practiceA": [{"k": "ch", "q": "문장의 형식이 나머지 넷과 다른 것은?", "o": ["Small things matter.", "The pills worked quickly.", "There is a problem.", "The singer grew famous.", "The movie lasted two hours."], "a": 3, "e": "④ 2형식 / 나머지는 1형식 (two hours는 수식어)"}, {"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? She ____ quiet.", "o": ["kept", "stayed", "remained", "became", "made"], "a": 4, "e": "made는 목적어가 필요 → ✗"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The river ran dry.", "He fell asleep in class.", "Her face turned pale.", "The bread went badly.", "The kids stayed quiet."], "a": 3, "e": "④ went bad"}, {"k": "ch", "q": "'work'의 의미가 나머지와 다른 것은?", "o": ["My dad works at a bank.", "She works hard every day.", "This plan won't work.", "They work on weekends.", "He works for a big company."], "a": 2, "e": "③ '효과가 있다, 잘 되다' / 나머지는 '일하다'"}, {"k": "bl", "q": "날이 추워지고 있다. → It is (getting|growing) cold.", "e": "get + 형용사"}, {"k": "bl", "q": "다리 위에 사람들이 많이 있었다. → There (were) many people on the bridge.", "e": "주어 many people → were"}, {"k": "pk", "q": "Five dollars will [do*/make]. (충분하다)", "e": "do = 충분하다 (1형식)"}, {"k": "ox", "q": "There is many students in the hall.", "a": false, "e": "주어 many students → are"}, {"k": "ox", "q": "His dream finally came true.", "a": true, "e": "come true ✔"}, {"k": "fx", "q": "Everyone remained silently.", "w": "silently", "a": ["silent"], "e": "remain + 형용사"}], "practiceB": [{"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ There are a lot of water in the tank.\nⓑ The milk went sour.\nⓒ Your opinion matters to us.\nⓓ She became nervously.\nⓔ The concert lasted three hours.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ is (water는 셀 수 없음) / ⓓ nervous"}, {"k": "ch", "q": "문장의 형식이 같은 것끼리 묶은 것은?\nⓐ The sun rises in the east.\nⓑ The baby fell asleep.\nⓒ It doesn't matter much.\nⓓ The fruit turned brown.", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓒ", "ⓒ, ⓓ", "ⓐ, ⓓ"], "a": 1, "e": "ⓐⓒ 1형식 / ⓑⓓ 2형식"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe meat went ____. (상한)\nHonesty always ____. (이익이 되다)", "o": ["bad – pays", "badly – pays", "bad – does", "bad – makes", "badly – matters"], "a": 0, "e": "go + 형용사 / pay = 이익이 되다 (1형식)"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '그 아이는 갑자기 병이 났다.'", "o": ["The child suddenly fell illness.", "The child suddenly fell ill.", "The child suddenly fell to ill.", "The child suddenly falled ill.", "The child suddenly was fall ill."], "a": 1, "e": "fall ill (fall – fell – fallen)"}, {"k": "or", "q": "그 연못은 여름에 말라 버렸다.", "a": "The pond ran dry in summer.", "e": "run + 형용사 (run dry)"}, {"k": "or", "q": "그 회의는 두 시간 동안 계속되었다.", "a": "The meeting lasted for two hours.", "e": "last = 지속되다 (1형식)"}, {"k": "wr", "q": "네가 무엇을 입는지는 중요하지 않다. (it, matter, what you wear)", "a": ["It doesn't matter what you wear.", "It does not matter what you wear."], "e": "matter = 중요하다"}, {"k": "wr", "q": "그 아기는 곧 잠이 들었다. (the baby, soon, fall asleep)", "a": ["The baby soon fell asleep.", "The baby fell asleep soon.", "Soon the baby fell asleep.", "Soon, the baby fell asleep."], "e": "fall asleep"}, {"k": "fx", "q": "There was many children in the playground.", "w": "was", "a": ["were"], "e": "주어 many children → were"}, {"k": "fx", "q": "The sky grew darkly.", "w": "darkly", "a": ["dark"], "e": "grow + 형용사"}]}}, {"tag": "hk3-01-1-2", "name": "2형식: 감각동사", "talk": [{"k": "m", "t": "2형식의 대표 선수 **감각동사** look · sound · smell · taste · feel + **형용사** 👀👂👃👅✋"}, {"k": "q", "q": "This blanket feels ____.", "o": ["soft", "softly", "softness"], "a": 0, "ok": "맞아요! feel + 형용사", "no": "감각동사 뒤 보어 → 형용사 soft"}, {"k": "m", "t": "⚠️ 함정 1: -ly로 끝나는 **형용사** friendly · lovely · lonely · lively · costly는 OK! -ly **부사**(sadly, happily)는 ✗"}, {"k": "q", "q": "The old woman looked ____.", "o": ["lonely", "sadly", "happily"], "a": 0, "ok": "정확해요! lonely는 형용사", "no": "lonely는 -ly지만 형용사 / sadly·happily는 부사 → ✗"}, {"k": "m", "t": "⚠️ 함정 2: 뒤에 **명사**가 오면 감각동사 + **like** + 명사: It looks like rain. / That sounds like fun."}, {"k": "ex", "en": "This tastes like chicken.", "ko": "이것은 닭고기 같은 맛이 난다."}, {"k": "m", "t": "⚠️ 함정 3: 감각동사가 **목적어**를 가지면 3형식 → 이때는 부사도 OK: She tasted the sauce carefully."}, {"k": "m", "t": "⭐ 중3 포인트! 같은 동사, 다른 형식: The rose smells sweet. (2형식) / I smelled smoke. (3형식) / I smelled something burning. (5형식 — 지각동사에서!)"}, {"k": "q", "q": "2형식인 문장은?", "o": ["He felt the cat's fur.", "The cat's fur felt smooth.", "I tasted the soup."], "a": 1, "ok": "맞아요! smooth = 털의 상태(보어)", "no": "fur·soup가 목적어면 3형식 / smooth는 보어 → 2형식"}, {"k": "m", "t": "덤: **feel like + -ing** = ~하고 싶다: I feel like eating pizza."}, {"k": "m", "t": "정리! **감각동사 + 형용사 / + like + 명사 / 목적어가 오면 3형식** 👍"}], "notes": {"table": [["형태", "예", "형식"], ["감각동사 + 형용사", "It smells good. / You look lovely.", "2형식"], ["감각동사 + like + 명사", "He looks like a model.", "2형식"], ["감각동사 + 목적어", "I smelled smoke. / She felt the wall.", "3형식"], ["feel like + -ing", "I feel like crying.", "~하고 싶다"]], "tips": ["-ly 형용사: friendly, lovely, lonely, lively, costly, ugly → 감각동사 뒤 OK", "look like + 명사 / look + 형용사 (look like happy ✗)", "우리말이 '~하게'여도 감각동사 뒤는 형용사"]}, "sets": {"workbook": [{"k": "pk", "q": "Your idea sounds [great*/greatly].", "e": "sound + 형용사"}, {"k": "pk", "q": "This cake tastes [sweet*/sweetly].", "e": "taste + 형용사"}, {"k": ouraged) us to ask questions.", "e": "encourage + O + to부정사"}, {"k": "bl", "q": "엄마는 내가 늦게까지 밖에 있는 것을 허락하지 않으셨다. → Mom didn't (allow) me to stay out late.", "e": "allow + O + to부정사"}, {"k": "bl", "q": "의사는 그에게 짠 음식을 먹지 말라고 충고했다. → The doctor advised him (not) (to) eat salty food.", "e": "not to"}, {"k": "ch", "q": "빈칸에 알맞은 것은? This map will enable you ____ the way.", "o": ["find", "to find", "finding", "found", "finds"], "a": 1, "e": "enable + O + to부정사"}, {"k": "ox", "q": "He asked me help him.", "a": false, "e": "ask + O + to부정사 → to help"}, {"k": "fx", "q": "They expected him winning the race.", "w": "winning", "a": ["to win"], "e": "expect + O + to부정사"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 수 없는 것은? She ____ me to join the club.", "o": ["asked", "persuaded", "encouraged", "let", "wanted"], "a": 3, "e": "④ let + O + 동사원형"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["The noise caused me to wake up.", "He ordered them to leave.", "I'd like you to meet my friend.", "The rule requires us wear a helmet.", "She advised me to rest."], "a": 3, "e": "④ to wear"}, {"k": "ch", "q": "우리말을 영어로 바르게 옮긴 것은? '그 경찰관은 그 남자에게 멈추라고 명령했다.'", "o": ["The officer ordered the man stop.", "The officer ordered the man to stop.", "The officer ordered to the man stop.", "The officer ordered the man stopping.", "The officer ordered the man to stopping."], "a": 1, "e": "order + O + to부정사"}, {"k": "ch", "q": "괄호 안의 동사를 알맞은 형태로 바꿀 때, 형태가 나머지와 다른 것은?", "o": ["I want you ____ me. (help)", "He told us ____. (wait)", "They allowed me ____ out. (go)", "She made me ____. (laugh)", "We expect them ____ soon. (arrive)"], "a": 3, "e": "④ 사역 make → 동사원형 laugh / 나머지는 to부정사"}, {"k": "bl", "q": "그 사고로 그는 일자리를 잃었다. → The accident caused him (to) lose his job.", "e": "cause + O + to부정사"}, {"k": "bl", "q": "나는 그녀가 정직하다고 믿는다. → I believe her (to) be honest.", "e": "believe + O + to be"}, {"k": "pk", "q": "He got his friend [to help*/help] him.", "e": "get + O + to부정사"}, {"k": "pk", "q": "The coach warned the play  옳은 문장의 개수는?\nⓐ I have been knowing her since childhood.\nⓑ It has been raining for three days.\nⓒ She has been working here since 2021.\nⓓ He have been sleeping all morning.\nⓔ They have had the dog for a year.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓑⓒⓔ 옳음 / ⓐ have known / ⓓ has been"}, {"k": "ch", "q": "다음 상황을 한 문장으로 바르게 나타낸 것은?\nI began to learn taekwondo two years ago. I still learn it.", "o": ["I learned taekwondo two years ago.", "I have been learning taekwondo since two years.", "I have been learning taekwondo for two years.", "I am learning taekwondo for two years.", "I had been learning taekwondo for two years."], "a": 2, "e": "지금도 계속 → have been -ing + for 기간"}, {"k": "bl", "q": "A: You look tired. B: I (have) (been) working all night.", "e": "현재완료진행"}, {"k": "bl", "q": "A: How long has it been raining? B: It (has) (been) raining since noon.", "e": "has been + -ing"}]}}, {"tag": "hk3-02-5", "name": "과거완료시제", "talk": [{"k": "m", "t": "⭐ 중3 새 시제! **과거완료** had + p.p.: **과거의 한 시점보다 더 이전**에 일어난 일, 또는 그 시점까지 이어진 일 ⏪⏪"}, {"k": "ex", "en": "When I got to the station, the train had already left.", "ko": "내가 역에 도착했을 때 기차는 이미 떠나 버렸다."}, {"k": "m", "t": "기준은 **과거**! 더 먼저 일어난 일 → had p.p.(대과거) / 나중에 일어난 일 → 과거"}, {"k": "q", "q": "I lost the pen that my dad ____ me.", "o": ["has given", "had given", "gives"], "a": 1, "ok": "맞아요! 잃어버린 것보다 먼저 받음 → had given", "no": "준 일이 잃어버린 일(과거)보다 먼저 → had given"}, {"k": "m", "t": "과거완료도 4가지 용법: 계속(had lived for ~) · 경험(had never seen ~ before) · 완료(had already ~) · 결과(had lost ~)"}, {"k": "ex", "en": "I had never seen snow before I visited Canada.", "ko": "나는 캐나다를 방문하기 전에 눈을 본 적이 없었다. (경험)"}, {"k": "q", "q": "She ____ in Busan for ten years before she moved to Seoul.", "o": ["has lived", "had lived", "lives"], "a": 1, "ok": "정확해요! 이사한 과거 시점까지 계속 → had lived", "no": "기준이 과거(moved) → had lived"}, {"k": "m", "t": "⚠️ 기준 시점이 현재면 현재완료(have p.p.), 과거면 과거완료(had p.p.). 주어가 무엇이든 [had]!"}, {"k": "q", "q": "By the time we arrived,
