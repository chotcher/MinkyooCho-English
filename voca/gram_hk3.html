hat*/what] he passed the exam.", "e": "뒤가 완전한 문장 → that"}, {"k": "pk", "q": "The trouble is that [nobody knows*/does nobody know] the answer.", "e": "that + 주어 + 동사"}, {"k": "fx", "q": "This is a pity that you missed the concert.", "w": "This", "a": ["It"], "e": "가주어 It"}, {"k": "ox", "q": "The rumor that the singer will retire is not true.", "a": true, "e": "✔ 동격 that"}, {"k": "ox", "q": "What she is a genius is true.", "a": false, "e": "뒤가 완전한 문장 → That she is a genius"}], "practiceB": [{"k": "wr", "q": "That he broke the window is certain. → 가주어 It을 써서 바꾸시오.", "a": ["It's certain that he broke the window.", "It is certain that he broke the window."], "e": "가주어 It"}, {"k": "wr", "q": "그가 그 시험에 떨어졌다는 소식은 나를 슬프게 했다. (The news, that, failed the exam, made me sad)", "a": ["The news that he failed the exam made me sad."], "e": "동격 that"}, {"k": "or", "q": "그녀가 우리를 도와줄 거라는 것은 확실하다.", "a": "It is certain that she will help us.", "e": "가주어 It"}, {"k": "or", "q": "나는 그가 정직하다는 사실을 안다.", "a": "I know the fact that he is honest.", "e": "동격 that"}, {"k": "fx", "q": "The fact what she is only twelve surprised us.", "w": "what", "a": ["that"], "e": "동격 that"}, {"k": "fx", "q": "It is surprising what nobody noticed the mistake.", "w": "what", "a": ["that"], "e": "진주어 that절 (완전한 문장)"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It is true that he quit his job.\nⓑ I know what you are right.\nⓒ The idea that we can live on Mars is exciting.\nⓓ That she won the race surprised us.\nⓔ This is strange that he didn't call.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ that / ⓔ It"}, {"k": "ch", "q": "다음 중 that이 동격의 접속사로 쓰인 것은?", "o": ["I think that he is kind.", "The news that she got married surprised me.", "The bag that I bought is red.", "It is true that he left.", "Look at that bird."], "a": 1, "e": "② the news = 그녀가 결혼했다는 것 (동격)"}, {"k": "bl", "q": "Many people share the belief (that) hard work pays off.", "e": "동격 that"}, {"k": "bl", "q": "(It) is a shame that we can't go together.", "e": "가주어 It"}]}}, {"tag": "hk3-12-3-2", "name": "명사절을 이끄는 접속사: if/whether", "talk": [{"k": "m", "t": "**if / whether** + 주어 + 동사 = '**~인지 (아닌지)**' 명사절 ❓ (중2 복습)"}, {"k": "m", "t": "⚠️ 명사절 if·whether는 미래면 **will 그대로**: I wonder if he will come. (부사절 if '~하면'은 현재시제!)"}, {"k": "q", "q": "I'm not sure whether it ____ tomorrow.", "o": ["snows", "will snow", "snowed"], "a": 1, "ok": "맞아요! '~인지' 명사절 → will 그대로", "no": "명사절(~인지) + 내일 → will snow"}, {"k": "m", "t": "**whether만** 쓰는 자리: ① 문장 맨 앞 **주어** ② **보어** ③ **전치사 뒤** ④ 바로 뒤 **or not** ⑤ **whether + to부정사**"}, {"k": "q", "q": "We are talking about ____ we should cancel the trip.", "o": ["if", "whether", "that"], "a": 1, "ok": "정확해요! 전치사(about) 뒤 → whether", "no": "전치사 뒤에는 if ✗ → whether"}, {"k": "m", "t": "⭐ 중3 포인트: **whether + to부정사** = '~할지 (말지)' → I can't decide [whether] to go or stay."}, {"k": "ex", "en": "She hasn't decided whether to accept the offer.", "ko": "그녀는 그 제안을 받아들일지 결정하지 않았다."}, {"k": "m", "t": "⚠️ if + to부정사 ✗ / if or not ✗ (문장 끝의 '~ or not'은 if도 OK: I don't know if he'll come or not.)"}, {"k": "m", "t": "정리! **if·whether = ~인지 / 주어·보어·전치사 뒤·or not 바로 앞·to부정사 앞 → whether만 / 명사절은 will 유지** 👍"}], "notes": {"table": [["자리", "if", "whether"], ["목적어", "I wonder if he is busy. ✔", "I wonder whether he is busy. ✔"], ["주어", "✗", "Whether he comes is important. ✔"], ["보어", "✗", "The question is whether we can win. ✔"], ["전치사 뒤", "✗", "It depends on whether it rains. ✔"], ["바로 뒤 or not", "if or not ✗", "whether or not ✔"], ["+ to부정사", "✗", "I can't decide whether to go. ✔"]], "tips": ["명사절 if(~인지): 미래 → will 그대로", "whether to-v (or not) = ~할지 (말지)", "if/whether + 주어 + 동사 어순"]}, "sets": {"workbook": [{"k": "pk", "q": "I wonder [if*/that] she remembers me. (~인지)", "e": "~인지 → if"}, {"k": "pk", "q": "[Whether*/If] the plan works is still unknown.", "e": "주어 자리 → Whether"}, {"k": "pk", "q": "I don't know whether [to call*/calling] him or not.", "e": "whether + to부정사"}, {"k": "pk", "q": "Ask him if he [will join*/joins] us next week. (~인지)", "e": "명사절 → will 그대로"}, {"k": "bl", "q": "나는 그 식당이 오늘 문을 여는지 모르겠다. → I don't know (if|whether) the restaurant is open today.", "e": "~인지"}, {"k": "bl", "q": "그가 이길지 질지는 중요하지 않다. → (Whether) he wins or loses doesn't matter.", "e": "주어 자리 → Whether"}, {"k": "bl", "q": "나는 웃어야 할지 울어야 할지 몰랐다. → I didn't know (whether) to laugh or cry.", "e": "whether + to부정사"}, {"k": "bl", "q": "그녀가 다음 달에 돌아올지 궁금하다. → I wonder if she (will) come back next month.", "e": "명사절 → will 그대로"}, {"k": "fx", "q": "Let me know that you can come to the party.", "w": "that", "a": ["if", "whether"], "e": "~인지 → if / whether"}, {"k": "fx", "q": "I can't decide if to buy the red one or the blue one.", "w": "if", "a": ["whether"], "e": "to부정사 앞 → whether"}], "practiceA": [{"k": "ch", "q": "빈칸에 if가 들어갈 수 없는 것은?", "o": ["I wonder ____ he is busy.", "Ask her ____ she has a pen.", "It depends on ____ we have enough money.", "Do you know ____ it will rain?", "I'm not sure ____ he likes it."], "a": 2, "e": "③ 전치사 뒤 → whether"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I'm not sure whether he ____ the news tomorrow.", "o": ["will hear", "hears", "heard", "hearing", "to hear"], "a": 0, "e": "명사절 + 미래 → will hear"}, {"k": "ch", "q": "어법상 옳은 것은?", "o": ["If he is honest is not clear.", "I don't know if or not she'll come.", "She asked me whether I liked the gift.", "We argued about if we should stay.", "I can't decide if to go."], "a": 2, "e": "③ ✔ / ① Whether ② whether or not ④ whether ⑤ whether to go"}, {"k": "bl", "q": "그가 그 소식을 들었는지 확실하지 않다. → It is not clear (whether|if) he has heard the news.", "e": "~인지"}, {"k": "bl", "q": "우리는 버스를 탈지 택시를 탈지 결정해야 한다. → We have to decide (whether) to take the bus or a taxi.", "e": "whether + to부정사"}, {"k": "pk", "q": "My question is [whether*/that] the store is open on Sundays. (~인지)", "e": "보어 자리 ~인지 → whether"}, {"k": "pk", "q": "I wonder whether the package [will arrive*/arrives] tomorrow.", "e": "명사절 → will 그대로"}, {"k": "fx", "q": "I'm worried about if I can finish it on time.", "w": "if", "a": ["whether"], "e": "전치사 뒤 → whether"}, {"k": "ox", "q": "I asked him whether or not he was ready.", "a": true, "e": "✔ whether or not"}, {"k": "ox", "q": "She couldn't decide if to stay or leave.", "a": false, "e": "to부정사 앞 → whether"}], "practiceB": [{"k": "wr", "q": "Will he accept my apology? → I wonder로 시작하여 한 문장으로 쓰시오.", "a": ["I wonder whether he will accept my apology.", "I wonder if he will accept my apology."], "e": "if + 주어 + will"}, {"k": "wr", "q": "나는 그 제안을 받아들일지 말지 모르겠다. (I don't know, whether, accept the offer, or not)", "a": ["I don't know whether or not to accept the offer.", "I don't know whether to accept the offer or not."], "e": "whether + to부정사 (or not)"}, {"k": "or", "q": "그 계획이 성공할지는 우리에게 달려 있다.", "a": "Whether the plan will succeed depends on us.", "e": "주어 자리 → Whether"}, {"k": "or", "q": "그녀는 내가 그 영화를 좋아했는지 물었다.", "a": "She asked me if I liked the movie.", "e": "~인지"}, {"k": "fx", "q": "If you will come or not doesn't matter to me.", "w": "If", "a": ["Whether"], "e": "주어 자리 → Whether"}, {"k": "fx", "q": "Nobody knows whether the team wins the game tomorrow.", "w": "wins", "a": ["will win"], "e": "명사절 → will 그대로"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I wonder if it will be sunny tomorrow.\nⓑ Whether he will come is uncertain.\nⓒ It depends on if we have time.\nⓓ I don't know whether to laugh or cry.\nⓔ Tell me if or not you can come.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ whether / ⓔ whether or not"}, {"k": "ch", "q": "빈칸에 공통으로 들어갈 말은? (대·소문자 무시)\n____ to stay or leave is your choice.\nI'm thinking about ____ I should change schools.", "o": ["If", "Whether", "That", "What", "Because"], "a": 1, "e": "to부정사 앞·전치사 뒤 → whether"}, {"k": "bl", "q": "The real question is (whether) we can finish it in time.", "e": "보어 자리 → whether"}, {"k": "bl", "q": "I'm not sure (if|whether) she will like my present.", "e": "~인지"}]}}, {"tag": "hk3-12-3-3", "name": "명사절을 이끄는 접속사: 의문사", "talk": [{"k": "m", "t": "**의문사**(who, what, when, where, why, how)도 명사절을 이끌어요 = **간접의문문** 📦 (중2 복습 + 심화)"}, {"k": "m", "t": "어순: **의문사 + 주어 + 동사** (평서문 어순!) → Where is he? → I know where [he] is."}, {"k": "q", "q": "Can you tell me ____?", "o": ["what time it is", "what time is it", "what time does it be"], "a": 0, "ok": "맞아요! 의문사 + 주어 + 동사", "no": "간접의문문은 평서문 어순 → what time it is"}, {"k": "m", "t": "do / does / did는 빼고 동사에 **시제·수** 넣기: What did she buy? → I wonder what she **bought**."}, {"k": "q", "q": "Do you know when the movie ____?", "o": ["starts", "does it start", "start"], "a": 0, "ok": "정확해요! does를 빼고 starts", "no": "When does the movie start? → when the movie starts"}, {"k": "m", "t": "⚠️ 의문사가 **주어**면 어순 그대로: Who broke the vase? → I don't know **who broke** the vase."}, {"k": "m", "t": "⚠️ 주절 동사가 **think · believe · guess · imagine · suppose**면 의문사가 **문장 맨 앞**! → Who is he? + Do you think? → **Who do you think he is?**"}, {"k": "ex", "en": "What do you think she wants for her birthday?", "ko": "너는 그녀가 생일에 무엇을 원한다고 생각하니?"}, {"k": "m", "t": "⭐ 한 덩어리 의문사: **how + 형용사/부사**, **what + 명사** → I wonder how old she is. / 명사절이니까 **주어·전치사 뒤**에도: How she did it is a mystery. / I'm curious about **where** he lives."}, {"k": "m", "t": "정리! **의문사 + 주어 + 동사 / do 빼고 시제·수 반영 / 의문사 주어 → 그대로 / think류 → 의문사 맨 앞** 👍"}], "notes": {"table": [["직접의문문", "간접의문문"], ["Where does she live?", "I don't know where she lives."], ["What did he say?", "I wonder what he said."], ["Who called me? (의문사 주어)", "Do you know who called me?"], ["How far is it?", "Tell me how far it is."], ["What does he want? + Do you think?", "What do you think he wants?"]], "tips": ["의문사 + 주어 + 동사", "do/does/did 삭제 → 동사에 시제·수", "think·believe·guess·imagine·suppose → 의문사 맨 앞 (Do you know는 그대로)", "how old·how much·what time 등은 한 덩어리로 앞에"]}, "sets": {"workbook": [{"k": "pk", "q": "I don't know where [she lives*/does she live].", "e": "의문사 + 주어 + 동사"}, {"k": "pk", "q": "Can you tell me how [I can*/can I] get to the station?", "e": "의문사 + 주어 + 동사"}, {"k": "pk", "q": "Do you know who [made*/did made] this cake?", "e": "의문사 주어 → 그대로"}, {"k": "pk", "q": "[What do you think*/Do you think what] he wants?", "e": "think류 → 의문사 맨 앞"}, {"k": "bl", "q": "나는 그가 왜 화가 났는지 모르겠다. → I don't know (why) he is angry.", "e": "의문사 why"}, {"k": "bl", "q": "너는 그녀가 몇 살인지 아니? → Do you know how (old) she is?", "e": "how old 한 덩어리"}, {"k": "bl", "q": "누가 그 창문을 깼는지 말해 줘. → Tell me (who) broke the window.", "e": "의문사 주어"}, {"k": "bl", "q": "너는 그가 어디에 갔다고 생각하니? → (Where) do you think he went?", "e": "think류 → 의문사 맨 앞"}, {"k": "fx", "q": "I want to know why old the building is.", "w": "why", "a": ["how"], "e": "몇 년 된 → how old"}, {"k": "fx", "q": "I asked him how much did the ticket cost.", "w": "did", "a": ["(삭제)"], "e": "did 삭제 → how much the ticket cost"}], "practiceA": [{"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은? I wonder. + What did he say to you?", "o": ["I wonder what did he say to you.", "I wonder what he said to you.", "I wonder what he say to you.", "I wonder did he say what to you.", "I wonder if what he said to you."], "a": 1, "e": "did 삭제 + 과거형 said"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Do you know who lives next door?", "I can't remember where I parked my car.", "Do you think what the answer is?", "Tell me how you solved the problem.", "I wonder why she left so early."], "a": 2, "e": "③ What do you think the answer is?"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Do you know ____?", "o": ["how far is the museum", "how far the museum is", "the museum is how far", "how the museum is far", "how far does the museum is"], "a": 1, "e": "how far + 주어 + 동사"}, {"k": "bl", "q": "나는 그녀가 무엇을 좋아하는지 안다. → I know what she (likes).", "e": "does 빼고 likes"}, {"k": "bl", "q": "너는 누가 이길 거라고 생각하니? → (Who) do you think will win?", "e": "think류 + 의문사 주어"}, {"k": "pk", "q": "Nobody knows [why he quit*/why did he quit] the team.", "e": "의문사 + 주어 + 동사"}, {"k": "pk", "q": "[Do you know*/Do you think] where the post office is? (위치를 아는지 물어볼 때)", "e": "know류 → 어순 그대로"}, {"k": "fx", "q": "Do you know when the library is? (어디에)", "w": "when", "a": ["where"], "e": "장소 → where"}, {"k": "ox", "q": "What do you think he is doing now?", "a": true, "e": "✔ think류 → 의문사 맨 앞"}, {"k": "ox", "q": "I wonder how much does this bag cost.", "a": false, "e": "how much this bag costs"}], "practiceB": [{"k": "wr", "q": "Where did you buy the jacket? → Can you tell me로 시작하여 한 문장으로 쓰시오.", "a": ["Can you tell me where you bought the jacket?"], "e": "did 삭제 + bought"}, {"k": "wr", "q": "Who is the man? → Do you think와 결합하여 한 문장으로 쓰시오.", "a": ["Who do you think the man is?"], "e": "think류 → 의문사 맨 앞"}, {"k": "or", "q": "너는 그가 왜 회의에 늦었다고 생각하니?", "a": "Why do you think he was late for the meeting?", "e": "think류 → 의문사 맨 앞"}, {"k": "or", "q": "그녀가 어떻게 그 문제를 풀었는지는 수수께끼다.", "a": "How she solved the problem is a mystery.", "e": "주어 자리 간접의문문"}, {"k": "fx", "q": "I wonder who did invented the telephone.", "w": "did", "a": ["(삭제)"], "e": "의문사 주어 → who invented"}, {"k": "fx", "q": "Tell me what you got such a good score. (어떻게)", "w": "what", "a": ["how"], "e": "방법 → how"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I don't know where she lives.\nⓑ Who do you think broke the vase?\nⓒ Do you guess what she wants?\nⓓ Tell me what time the train leaves.\nⓔ I wonder why did he call me.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ What do you guess she wants? / ⓔ why he called me"}, {"k": "ch", "q": "다음 우리말을 영어로 옮길 때 다섯 번째로 오는 단어는? 너는 그녀가 몇 살이라고 생각하니?", "o": ["old", "do", "you", "think", "she"], "a": 3, "e": "How old do you think she is? → 5번째 think"}, {"k": "bl", "q": "I'm curious about (how) you learned to speak Chinese so well. (어떻게)", "e": "전치사 뒤 간접의문문"}, {"k": "bl", "q": "Do you remember (where) we first met? (어디서)", "e": "의문사 where"}]}}, {"tag": "hk3-12-4-1", "name": "부사절을 이끄는 접속사: 시간", "talk": [{"k": "m", "t": "부사절 접속사 ① **시간** ⏰ when · while · before · after · until · since · as soon as (중2 복습)"}, {"k": "m", "t": "⚠️ 시간 부사절은 미래 일도 **현재시제**, 미래에 끝날 일은 **현재완료**: I'll call you when I **have finished** my work."}, {"k": "q", "q": "I'll lend you the book after I ____ it.", "o": ["will read", "have read", "had read"], "a": 1, "ok": "맞아요! 시간절 → 미래완료 대신 현재완료", "no": "시간절에서는 will ✗ → have read"}, {"k": "m", "t": "**since** ~한 이후로 → 주절은 **현재완료**, since절은 **과거**: She has changed a lot since she [moved] to Seoul."}, {"k": "m", "t": "⭐ 중3 추가: **by the time** ~할 때쯤(에는) / **every time(each time)** ~할 때마다 / **as soon as** ~하자마자"}, {"k": "ex", "en": "By the time we arrived, the movie had already started.", "ko": "우리가 도착했을 때쯤에는 영화가 이미 시작했었다."}, {"k": "q", "q": "____ I hear this song, I think of my grandma.", "o": ["Every time", "Until", "Since"], "a": 0, "ok": "정확해요! ~할 때마다 → Every time", "no": "들을 때마다 생각난다 → Every time"}, {"k": "m", "t": "⚠️ **until** = 그때까지 **계속** / **by the time** = 그때쯤엔 **이미 완료**"}, {"k": "m", "t": "⚠️ 전치사 during + 명사 vs 접속사 **while** + 주어 + 동사"}, {"k": "m", "t": "정리! **시간절 미래 → 현재(완료) / since + 과거, 주절 현재완료 / by the time·every time·as soon as / during + 명사 vs while + 절** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["when / while", "~할 때 / ~하는 동안", "Don't talk while the teacher is speaking."], ["before / after", "~하기 전에 / ~한 후에", "I'll go out after I finish my homework."], ["until(till)", "~할 때까지 (계속)", "Let's stay here until the rain stops."], ["since", "~한 이후로", "I have known her since I was ten."], ["as soon as", "~하자마자", "As soon as I got home, I took a shower."], ["by the time", "~할 때쯤(에는)", "By the time you come back, the room will be clean."], ["every time", "~할 때마다", "Every time I visit her, she bakes cookies."]], "tips": ["시간 부사절: 미래 → 현재 / 미래완료 → 현재완료", "since절은 과거, 주절은 현재완료", "during + 명사 / while + 주어 + 동사"]}, "sets": {"workbook": [{"k": "pk", "q": "Please wait here until the doctor [calls*/will call] you.", "e": "시간절 → 현재"}, {"k": "pk", "q": "He has worked here [since*/until] he graduated.", "e": "현재완료 + since"}, {"k": "pk", "q": "I fell asleep [while*/during] I was watching the movie.", "e": "주어 + 동사 → while"}, {"k": "pk", "q": "[Every time*/Until] I visit her, she bakes cookies for me.", "e": "~할 때마다"}, {"k": "bl", "q": "나는 집에 도착하자마자 샤워를 했다. → (As soon as) I got home, I took a shower.", "e": "~하자마자"}, {"k": "bl", "q": "네가 돌아올 때쯤이면 방은 깨끗할 거야. → By the (time) you come back, the room will be clean.", "e": "by the time"}, {"k": "bl", "q": "비가 그칠 때까지 여기 있자. → Let's stay here (until|till) the rain stops.", "e": "~할 때까지"}, {"k": "bl", "q": "나는 숙제를 끝낸 후에 밖에 나갈 거야. → I'll go out after I (finish) my homework.", "e": "시간절 → 현재"}, {"k": "fx", "q": "I'll text you as soon as I will land.", "w": "will", "a": ["(삭제)"], "e": "시간절 → as soon as I land"}, {"k": "fx", "q": "She has been sick since she eats the seafood.", "w": "eats", "a": ["ate"], "e": "since절은 과거"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I have known Jenny ____ we were in elementary school.", "o": ["while", "since", "until", "by the time", "before"], "a": 1, "e": "현재완료 + since"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Turn off the light before you leave.", "I'll tell him when he comes back.", "Every time I call her, she is busy.", "We'll start the meeting after everyone will arrive.", "I've lived here since I was born."], "a": 3, "e": "④ after everyone arrives"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI waited for him ____ he came. (올 때까지 계속)\nI'll finish it ____ you come back. (돌아올 때쯤엔)", "o": ["until – by the time", "by the time – until", "since – until", "while – since", "until – since"], "a": 0, "e": "계속 until / 완료 by the time"}, {"k": "bl", "q": "그는 나를 보자마자 손을 흔들었다. → He waved his hand (as soon as) he saw me.", "e": "~하자마자"}, {"k": "bl", "q": "나는 이 사진을 볼 때마다 행복해진다. → (Every|Each) time I see this photo, I feel happy.", "e": "~할 때마다"}, {"k": "pk", "q": "Don't talk [while*/during] the teacher is speaking.", "e": "주어 + 동사 → while"}, {"k": "pk", "q": "Let me know when you [have finished*/will finish] the report.", "e": "시간절 → 현재완료"}, {"k": "fx", "q": "During we were waiting for the bus, it started to rain.", "w": "During", "a": ["While", "When", "As"], "e": "주어 + 동사 → While"}, {"k": "ox", "q": "By the time she got to the station, the train had left.", "a": true, "e": "✔ by the time"}, {"k": "ox", "q": "I'll wait until you will be ready.", "a": false, "e": "시간절 → until you are ready"}], "practiceB": [{"k": "wr", "q": "나는 그 소식을 듣자마자 엄마께 전화했다. (As soon as, heard the news, called my mom)", "a": ["As soon as I heard the news I called my mom.", "I called my mom as soon as I heard the news.", "As soon as I heard the news, I called my mom."], "e": "~하자마자"}, {"k": "wr", "q": "그는 다섯 살 이후로 수영을 해 왔다. (has swum, since, five)", "a": ["He has swum since he was 5.", "He has swum since he was five."], "e": "현재완료 + since + 과거"}, {"k": "or", "q": "내가 준비될 때까지 기다려 줄래?", "a": "Will you wait until I am ready?", "e": "시간절 → 현재"}, {"k": "or", "q": "그가 깨어날 때쯤이면 아침 식사가 준비되어 있을 것이다.", "a": "Breakfast will be ready by the time he wakes up.", "e": "by the time + 현재"}, {"k": "fx", "q": "I have been to Jeju twice since I move here.", "w": "move", "a": ["moved"], "e": "since절은 과거"}, {"k": "fx", "q": "Call me the moment you will get the result.", "w": "will", "a": ["(삭제)"], "e": "시간절 → the moment you get"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I'll wait until the store opens.\nⓑ She has lived here since 2020.\nⓒ While the summer vacation, I visited Japan.\nⓓ Every time he sings, people cheer.\nⓔ I'll call you after I will finish dinner.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ During / ⓔ after I finish"}, {"k": "ch", "q": "우리말과 의미가 같도록 할 때 빈칸에 알맞은 것은? 우리가 극장에 도착했을 때쯤에는 영화가 이미 시작했었다. → ____ we got to the theater, the movie had already started.", "o": ["Until", "Since", "By the time", "While", "Every time"], "a": 2, "e": "~할 때쯤 → By the time"}, {"k": "bl", "q": "I'll stay with you (until|till) your mom comes back.", "e": "~할 때까지"}, {"k": "bl", "q": "When the concert (ends), we'll take a taxi home.", "e": "시간절 → 현재"}]}}, {"tag": "hk3-12-4-2", "name": "부사절을 이끄는 접속사: 이유", "talk": [{"k": "m", "t": "부사절 접속사 ② **이유**: because · since · as + 주어 + 동사 = '~ 때문에' 🧐 (중2 복습)"}, {"k": "ex", "en": "Since you're tired, you should take a break.", "ko": "너는 피곤하니까 좀 쉬어야 한다."}, {"k": "m", "t": "⚠️ 전치사 **because of · due to** + 명사(구) vs 접속사 **because** + 주어 + 동사"}, {"k": "q", "q": "The flight was delayed ____ the fog.", "o": ["because", "because of", "since"], "a": 1, "ok": "맞아요! 명사(the fog) 앞 → because of", "no": "the fog는 명사 → because of"}, {"k": "m", "t": "⭐ 중3 추가: **now that** + 주어 + 동사 = '(이제) ~이니까' → [Now] that you're here, let's begin."}, {"k": "q", "q": "____ that summer is over, I need to study harder.", "o": ["Now", "Because", "Since"], "a": 0, "ok": "정확해요! now that = 이제 ~이니까", "no": "뒤에 that이 붙는 이유 접속사 → Now that"}, {"k": "m", "t": "⚠️ since · as는 **시간**의 뜻도 있으니 문맥 확인! (since 2020 = ~ 이후로)"}, {"k": "m", "t": "⚠️ because(As)와 so는 한 문장에 함께 ✗: As it was hot, so we swam. (✗)"}, {"k": "m", "t": "정리! **because·since·as·now that + 절 / because of·due to + 명사 / because ~, so ✗** 👍"}], "notes": {"table": [["표현", "뒤에 오는 말", "예"], ["because / since / as", "주어 + 동사", "I was late because I missed the bus."], ["now that", "주어 + 동사 (이제 ~이니까)", "Now that the exam is over, let's relax."], ["because of / due to", "명사(구)", "The game was canceled due to the storm."], ["so (결과)", "주어 + 동사", "It was cold, so I wore a coat."]], "tips": ["because of / due to + 명사, because + 주어 + 동사", "now that 뒤에는 완전한 문장", "As(Because) ~, so ~ ✗ — 둘 중 하나만"]}, "sets": {"workbook": [{"k": "pk", "q": "I couldn't sleep [because*/because of] it was too noisy.", "e": "주어 + 동사 → because"}, {"k": "pk", "q": "The game was canceled [due to*/because] the storm.", "e": "명사 → due to"}, {"k": "pk", "q": "[Now*/So] that you're sixteen, you can get a part-time job.", "e": "이제 ~이니까 → Now that"}, {"k": "pk", "q": "[As*/Although] I was hungry, I ate a whole pizza.", "e": "이유 → As"}, {"k": "bl", "q": "그는 감기에 걸려서 학교에 결석했다. → He was absent from school (because|  "so", "a": ["(삭제)"], "e": "As ~, so ~ ✗"}, {"k": "ox", "q": "Due to the strong wind, the ferry didn't run.", "a": true, "e": "✔ due to + 명사"}, {"k": "ox", "q": "Now that he has left, but the room is quiet.", "a": false, "e": "now that ~, but ✗ → but 삭제"}], "practiceB": [{"k": "wr", "q": "It rained a lot, so the river overflowed. → because를 써서 바꾸시오.", "a": ["Because it rained a lot the river overflowed.", "The river overflowed because it rained a lot.", "Because it rained a lot, the river overflowed."], "e": "because + 이유"}, {"k": "wr", "q": "그의 부상 때문에 그는 경기에 뛸 수 없었다. (Because of, his injury, couldn't play)", "a": ["Because of his injury he couldn't play.", "He couldn't play because of his injury.", "Because of his injury, he couldn't play."], "e": "because of + 명사"}, {"k": "or", "q": "이제 겨울이 왔으니 우리는 따뜻한 옷이 필요하다.", "a": "Now that winter has come, we need warm clothes.", "e": "now that"}, {"k": "or", "q": "그녀는 친절해서 모두가 그녀를 좋아한다.", "a": "Everyone likes her because she is kind.", "e": "because"}, {"k": "fx", "q": "Now what the semester is over, I have more free time.", "w": "what", "a": ["that"], "e": "now that"}, {"k": "fx", "q": "We couldn't go hiking because of it was raining.", "w": "of", "a": ["(삭제)"], "e": "주어 + 동사 → because"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Because of the noise, I couldn't focus.\nⓑ Since it's your birthday, I'll buy lunch.\nⓒ Due to it was dark, we turned on the lights.\nⓓ Now that you're an adult, you should be responsible.\nⓔ As he was tired, so he went to bed.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ Because / ⓔ so 삭제"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nThe event was canceled ____ the rain.\nThe event was canceled ____ it rained.\n____ the rain has stopped, let's go out.", "o": ["due to – because – Now that", "because – due to – Now that", "due to – because of – Now that", "because of – due to – Since", "because – because of – Now that"], "a": 0, "e": "명사 앞 due to / 절 앞 because / 이제 ~이니까 Now that"}, {"k": "bl", "q": "(Because|Since|As|Now that) it's getting dark, we should go home.", "e": "이유"}, {"k": "bl", "q": "Many flights were canceled (because of|due to) the typhoon.", "e": "명사 → because of / due to"}]}}, {"tag": "hk3-12-4-3", "name": "부사절을 이끄는 접속사: 조건", "talk": [{"k": "m", "t": "부사절 접속사 ③ **조건**: **if** 만약 ~하면 / **unless** 만약 ~하지 않으면 (= if ~ not) 🔀"}, {"k": "m", "t": "⚠️ 조건 부사절도 미래 일은 **현재시제**: If it **snows** tomorrow, we'll go skiing."}, {"k": "q", "q": "Unless you ____ now, you'll miss the train.", "o": ["leave", "don't leave", "will leave"], "a": 0, "ok": "맞아요! unless + 긍정 + 현재시제", "no": "unless 안에 이미 not → leave"}, {"k": "m", "t": "⭐ 중3 추가: **as long as** ~하는 한, ~하기만 하면 / **in case** ~할 경우에 대비해서"}, {"k": "ex", "en": "You can borrow my bike as long as you return it by Friday.", "ko": "금요일까지 돌려주기만 하면 내 자전거를 빌려 가도 돼."}, {"k": "q", "q": "Take an umbrella ____ it rains.", "o": ["in case", "unless", "as long as"], "a": 0, "ok": "정확해요! 비가 올 경우에 대비해서 → in case", "no": "대비 → in case"}, {"k": "m", "t": "⚠️ **in case** + 주어 + 동사 / **in case of** + 명사: in case of fire (화재 시에는)"}, {"k": "m", "t": "구별! 명사절 if(~인지) → will 그대로 / 부사절 if·unless·as long as·in case → **현재시제**"}, {"k": "m", "t": "정리! **if / unless = if ~ not (not 중복 ✗) / as long as ~하는 한 / in case ~에 대비해 / 조건절 미래 → 현재** 👍"}], "notes": {"table": [["접속사", "뜻", "예"], ["if", "만약 ~하면", "If you need help, just call me."], ["unless", "만약 ~하지 않으면 (= if ~ not)", "Unless you hurry, you'll be late."], ["as long as", "~하는 한, ~하기만 하면", "You can stay as long as you keep quiet."], ["in case", "~할 경우에 대비해서", "Take a map in case you get lost."], ["in case of + 명사", "~의 경우에는", "In case of fire, use the stairs."]], "tips": ["조건 부사절: 미래 → 현재시제", "unless + 긍정 (unless ~ not ✗)", "in case + 절 / in case of + 명사"]}, "sets": {"workbook": [{"k": "pk", "q": "If you [need*/will need] help, just call me.", "e": "조건절 → 현재"}, {"k": "pk", "q": "[Unless*/If] you hurry, you will be late. (서두르지 않으면)", "e": "~하지 않으면 → Unless"}, {"k": "pk", "q": "Bring a jacket [in case*/unless] it gets cold.", "e": "대비 → in case"}, {"k": "pk", "q": "You can stay [as long as*/unless] you keep quiet. (조용히 하기만 하면)", "e": "~하는 한 → as long as"}, {"k": "bl", "q": "만약 내일 날씨가 좋으면 우리는 소풍을 갈 거야. → If the weather (is) nice tomorrow, we'll go on a picnic.", "e": "조건절 → 현재"}, {"k": "bl", "q": "네가 최선을 다하는 한 나는 행복하다. → I'm happy as (long) as you do your best.", "e": "as long as"}, {"k": "bl", "q": "연습하지 않으면 실력이 늘지 않을 것이다. → (Unless) you practice, you won't improve.", "e": "~하지 않으면"}, {"k": "bl", "q": "길을 잃을 경우에 대비해 지도를 가져가라. → Take a map in (case) you get lost.", "e": "in case"}, {"k": "fx", "q": "Unless you don't wear a coat, you'll catch a cold.", "w": "don't", "a": ["(삭제)"], "e": "unless + 긍정"}, {"k": "fx", "q": "If you won't hurry, you'll miss the bus.", "w": "won't", "a": ["don't"], "e": "조건절 → 현재: If you don't hurry"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? If you ____ this medicine, you'll feel better.", "o": ["take", "will take", "took", "taking", "to take"], "a": 0, "e": "조건절 → 현재"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Unless you have a ticket, you can't enter.", "o": ["If you have a ticket, you can't enter.", "If you don't have a ticket, you can't enter.", "Unless you don't have a ticket, you can't enter.", "Because you have a ticket, you can't enter.", "Although you have a ticket, you can't enter."], "a": 1, "e": "unless = if ~ not"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I'll lend you my laptop ____ you're careful with it. (조심하기만 하면)", "o": ["as long as", "in case", "unless", "even if", "so that"], "a": 0, "e": "~하기만 하면 → as long as"}, {"k": "bl", "q": "비상시에는 이 버튼을 누르세요. → In case (of) an emergency, press this button.", "e": "in case of + 명사"}, {"k": "bl", "q": "그가 집에 오지 않으면 나에게 전화해 줘. → Call me (if) he doesn't come home.", "e": "if ~ not"}, {"k": "pk", "q": "I'll keep a copy [in case*/as long as] I lose the original.", "e": "대비 → in case"}, {"k": "pk", "q": "I don't know if she [will accept*/accepts] our offer tomorrow. (~인지)", "e": "명사절 → will 그대로"}, {"k": "fx", "q": "You can use my phone as long as you will give it back soon.", "w": "will", "a": ["(삭제)"], "e": "조건절 → 현재"}, {"k": "ox", "q": "In case you forget, I'll send you a reminder.", "a": true, "e": "✔ in case + 절"}, {"k": "ox", "q": "Unless you don't study, you will fail.", "a": false, "e": "unless + 긍정 → Unless you study"}], "practiceB": [{"k": "wr", "q": "If you don't apologize, she won't talk to you. → unless를 써서 바꾸시오.", "a": ["Unless you apologize she won't talk to you.", "She won't talk to you unless you apologize.", "Unless you apologize, she won't talk to you."], "e": "if ~ not = unless"}, {"k": "wr", "q": "비가 올 경우에 대비해서 우산을 가져가라. (Take, an umbrella, in case, rains)", "a": ["Take an umbrella in case it rains."], "e": "in case + 현재시제"}, {"k": "or", "q": "네가 약속을 지키는 한 나는 너를 믿을 것이다.", "a": "I will trust you as long as you keep your promise.", "e": "as long as"}, {"k": "or", "q": "만약 그녀가 늦게 오면 우리는 그녀 없이 출발할 것이다.", "a": "If she comes late, we will leave without her.", "e": "조건절 → 현재"}, {"k": "fx", "q": "In case of you need anything, call me.", "w": "of", "a": ["(삭제)"], "e": "주어 + 동사 → in case"}, {"k": "fx", "q": "Unless the buses will come soon, we'll walk.", "w": "will", "a": ["(삭제)"], "e": "조건절 → 현재: Unless the buses come"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ If it snows tomorrow, we'll build a snowman.\nⓑ Unless you hurry, you'll miss it.\nⓒ Take some money in case of you need it.\nⓓ I wonder if he will come tomorrow.\nⓔ As long as you will try, you'll succeed.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ in case you need / ⓔ as long as you try"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nI'll tell him ____ he comes. (오면)\nI don't know ____ he will come. (올지)", "o": ["if – if", "if – that", "unless – if", "in case – that", "as long as – that"], "a": 0, "e": "조건 if / 명사절 if(~인지)"}, {"k": "bl", "q": "You won't pass the exam (unless) you study harder.", "e": "~하지 않으면"}, {"k": "bl", "q": "Write down the address (in case) you forget it.", "e": "대비 → in case"}]}}, {"tag": "hk3-12-4-4", "name": "부사절을 이끄는 접속사: 양보", "talk": [{"k": "m", "t": "부사절 접속사 ④ **양보**: **though · although · even though** '비록 ~이지만' / **even if** '(설령) ~일지라도' 🤝"}, {"k": "ex", "en": "Even though he practiced hard, he didn't win.", "ko": "그는 열심히 연습했지만 이기지 못했다."}, {"k": "q", "q": "____ it was freezing, the kids played outside.", "o": ["Because", "Although", "Unless"], "a": 1, "ok": "맞아요! 몹시 추웠지만 → Although", "no": "추운데도 밖에서 놀았다(반대 흐름) → Although"}, {"k": "m", "t": "even though = **실제 사실** / even if = **가정**(아직 모르는 일)"}, {"k": "m", "t": "⚠️ 전치사 **despite · in spite of** + 명사·동명사 vs 접속사 although + 주어 + 동사 (Ch.11 복습)"}, {"k": "q", "q": "____ being tired, she kept working.", "o": ["Although", "Despite", "Even if"], "a": 1, "ok": "정확해요! 동명사 앞 → Despite", "no": "being(동명사) 앞 → 전치사 Despite"}, {"k": "m", "t": "⭐ 전환: Although he was sick, ~ → Despite **his sickness**, ~ / Despite **being** sick, ~ (주어가 같을 때 동명사)"}, {"k": "m", "t": "⚠️ although ~, but ✗ / despite of ✗"}, {"k": "m", "t": "정리! **though·although·even though + 절 / even if 가정 / despite·in spite of + 명사·동명사 / although ~, but ✗** 👍"}], "notes": {"table": [["표현", "뒤에 오는 말", "예"], ["though / although", "주어 + 동사", "Although she was nervous, she gave a great speech."], ["even though", "주어 + 동사 (실제 사실)", "Even though I set an alarm, I overslept."], ["even if", "주어 + 동사 (가정)", "Even if everyone disagrees, I will do it."], ["despite / in spite of", "명사(구)·동명사", "Despite being busy, he always calls his mom."]], "tips": ["although ~, but ~ ✗", "despite of ✗ / in spite of ✔", "Although + 절 → Despite + 명사 / 동명사(being ~)"]}, "sets": {"workbook": [{"k": "pk", "q": "[Although*/Because] she was nervous, she gave a great speech.", "e": "양보"}, {"k": "pk", "q": "[In spite of*/Even though] the noise, the baby slept well.", "e": "명사 앞 → In spite of"}, {"k": "pk", "q": "He went jogging [though*/despite] it was raining.", "e": "주어 + 동사 → though"}, {"k": "pk", "q": "[Even if*/Because] you don't like it, you should try it once.", "e": "설령 ~일지라도"}, {"k": "bl", "q": "비록 그는 부자이지만 검소하게 산다. → (Although|Though|Even though) he is rich, he lives simply.", "e": "양보"}, {"k": "bl", "q": "늦은 시간에도 불구하고 그녀는 공부를 계속했다. → (Despite|In spite of) the late hour, she kept studying.", "e": "명사 → despite"}, {"k": "bl", "q": "설령 모두가 반대하더라도 나는 그것을 할 것이다. → Even (if) everyone disagrees, I will do it.", "e": "가정 → even if"}, {"k": "bl", "q": "그는 다리를 다쳤음에도 불구하고 경주를 끝냈다. → Despite (hurting) his leg, he finished the race.", "e": "despite + 동명사"}, {"k": "fx", "q": "Although it was expensive, but I bought it.", "w": "but", "a": ["(삭제)"], "e": "although ~, but ✗"}, {"k": "fx", "q": "Despite of the cold, we went swimming.", "w": "of", "a": ["(삭제)"], "e": "despite of ✗"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? ____ his poor eyesight, he reads a lot.", "o": ["Although", "Even though", "Despite", "Even if", "Though"], "a": 2, "e": "명사구 앞 → Despite"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["Though he is young, he is wise.", "In spite of the rain, we went out.", "Even if it snows, I'll go.", "Despite he was tired, he helped me.", "Although I studied, I failed."], "a": 3, "e": "④ Although he was tired / Despite being tired"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? Although she was sick, she went to work.", "o": ["Despite her sickness, she went to work.", "Because of her sickness, she went to work.", "Despite she was sick, she went to work.", "Unless she was sick, she went to work.", "If she was sick, she went to work."], "a": 0, "e": "although + 절 = despite + 명사"}, {"k": "bl", "q": "그녀는 키가 작지만 농구를 잘한다. → (Although|Though|Even though) she is short, she plays basketball well.", "e": "양보"}, {"k": "bl", "q": "그 실수에도 불구하고 그는 이겼다. → In spite (of) the mistake, he won.", "e": "in spite of"}, {"k": "pk", "q": "[Even though*/Despite] I set an alarm, I overslept.", "e": "주어 + 동사 → Even though"}, {"k": "pk", "q": "She smiled [in spite of*/although] her pain.", "e": "명사 → in spite of"}, {"k": "fx", "q": "Though the heavy snow, the train arrived on time.", "w": "Though", "a": ["Despite", "In spite of"], "e": "명사구 → Despite"}, {"k": "ox", "q": "Despite being busy, he always calls his mom.", "a": true, "e": "✔ despite + 동명사"}, {"k": "ox", "q": "Even though it was late, but we kept talking.", "a": false, "e": "even though ~, but ✗"}], "practiceB": [{"k": "wr", "q": "Although it was very cold, we went hiking. → Despite를 써서 바꾸시오. (the cold weather)", "a": ["Despite the cold weather we went hiking.", "We went hiking despite the cold weather.", "Despite the cold weather, we went hiking."], "e": "despite + 명사"}, {"k": "wr", "q": "비록 그는 열심히 노력했지만 시험에 떨어졌다. (Even though, tried hard, failed the test)", "a": ["Even though he tried hard he failed the test.", "He failed the test even though he tried hard.", "Even though he tried hard, he failed the test."], "e": "even though + 절"}, {"k": "or", "q": "설령 비가 오더라도 경기는 열릴 것이다.", "a": "Even if it rains, the game will be held.", "e": "even if (가정)"}, {"k": "or", "q": "그의 나이에도 불구하고 그는 매우 활동적이다.", "a": "In spite of his age, he is very active.", "e": "in spite of + 명사"}, {"k": "fx", "q": "Although his effort, he couldn't solve the problem.", "w": "Although", "a": ["Despite", "In spite of"], "e": "명사구 → Despite"}, {"k": "fx", "q": "Despite she felt tired, she cooked dinner.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "주어 + 동사 → Although"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Although it was dark, he didn't turn on the light.\nⓑ Despite of the danger, they continued.\nⓒ Even though she apologized, I was still angry.\nⓓ In spite of feeling sick, he came to school.\nⓔ Though he is rich, but he isn't happy.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓒⓓ 옳음 / ⓑ of 삭제 / ⓔ but 삭제"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ the traffic, we arrived on time.\n____ there was a lot of traffic, we arrived on time.", "o": ["Despite – Although", "Although – Despite", "Because of – Because", "Although – Although", "Despite – Despite"], "a": 0, "e": "명사 앞 Despite / 절 앞 Although"}, {"k": "bl", "q": "(Although|Though|Even though) the hotel was small, it was very comfortable.", "e": "양보"}, {"k": "bl", "q": "She kept smiling (despite|in spite of) her sadness.", "e": "명사 → despite"}]}}, {"tag": "hk3-12-4-5", "name": "부사절을 이끄는 접속사: so that ~", "talk": [{"k": "m", "t": "부사절 접속사 ⑤ **so that** + 주어 + can / will / may ~ = '**~하기 위해서, ~하도록**' (목적) 🎯"}, {"k": "ex", "en": "She spoke slowly so that everyone could understand her.", "ko": "그녀는 모두가 이해할 수 있도록 천천히 말했다."}, {"k": "q", "q": "Turn down the music so that the baby ____ sleep.", "o": ["can", "can't", "is"], "a": 0, "ok": "맞아요! 잘 수 있도록 → can", "no": "목적: 아기가 잘 수 있도록 → can"}, {"k": "m", "t": "⚠️ 과거 문장이면 so that ~ **could / would**: I saved money so that I [could] buy a bike."}, {"k": "m", "t": "바꿔 쓰기 (Ch.5 부정사 복습): so that ~ can = **in order to** + 동사원형 = **so as to** + 동사원형 (두 주어가 같을 때)"}, {"k": "ex", "en": "I turned off my phone so that I could focus. = I turned off my phone in order to focus.", "ko": "나는 집중하기 위해 휴대폰을 껐다."}, {"k": "m", "t": "⭐ 부정 목적: so that ~ won't / wouldn't = **so as not to · in order not to** + 동사원형 (not은 to 앞!)"}, {"k": "q", "q": "He left early ____ miss the bus.", "o": ["so as not to", "so that not", "in order not"], "a": 0, "ok": "정확해요! not은 to 앞 → so as not to", "no": "~하지 않기 위해 → so as not to + 동사원형"}, {"k": "m", "t": "⭐ **in order that** + 주어 + 동사 = so that (격식체)"}, {"k": "m", "t": "정리! **so that 목적(과거 → could) = in order to = so as to / 부정 so as not to · in order not to / in order that = so that** 👍"}], "notes": {"table": [["표현", "뒤에 오는 말", "예"], ["so that", "주어 + can/will/may", "Speak louder so that everyone can hear you."], ["in order that", "주어 + can/will/may", "We left early in order that we could avoid traffic."], ["in order to / so as to", "동사원형", "She studied hard in order to pass the exam."], ["so as not to / in order not to", "동사원형 (부정 목적)", "He ran so as not to be late."]], "tips": ["과거 문장 → so that ~ could / would", "not 위치: so as not to / in order not to", "so that(목적) ≠ so ~ that(결과) — 다음 유닛!"]}, "sets": {"workbook": [{"k": "pk", "q": "I took notes [so that*/even though] I wouldn't forget.", "e": "목적 → so that"}, {"k": "pk", "q": "We whispered so that we [wouldn't*/would] wake the baby.", "e": "깨우지 않도록 → wouldn't"}, {"k": "pk", "q": "She studied hard in order [to pass*/passing] the exam.", "e": "in order to + 동사원형"}, {"k": "pk", "q": "He ran [so as not to*/so not as to] be late.", "e": "not은 to 앞"}, {"k": "bl", "q": "나는 첫 기차를 타기 위해서 일찍 일어났다. → I got up early so (that) I could catch the first train.", "e": "목적 → so that"}, {"k": "bl", "q": "선생님은 모두가 볼 수 있도록 크게 썼다. → The teacher wrote in big letters so that everyone (could) see.", "e": "과거 → could"}, {"k": "bl", "q": "그는 감기에 걸리지 않으려고 따뜻한 옷을 입었다. → He wore warm clothes so as (not) to catch a cold.", "e": "so as not to"}, {"k": "bl", "q": "우리는 좋은 자리를 얻기 위해 일찍 갔다. → We went early in (order) to get good seats.", "e": "in order to"}, {"k": "fx", "q": "Speak louder so that everyone can't hear you.", "w": "can't", "a": ["can"], "e": "들을 수 있도록 → can"}, {"k": "fx", "q": "Last year, she saved money so that she can buy a bike.", "w": "can", "a": ["could"], "e": "과거 → could"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? Close the door ____ the cat doesn't get out.", "o": ["so that", "because", "although", "unless", "until"], "a": 0, "e": "나가지 않도록(목적) → so that"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? He exercises every day so that he can stay healthy.", "o": ["He exercises every day in order to stay healthy.", "He exercises every day so healthy that he can stay.", "He exercises every day because he stays healthy.", "He exercises every day, but he can't stay healthy.", "He is too healthy to exercise every day."], "a": 0, "e": "so that ~ can = in order to"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? I wrote it down so that I wouldn't forget it.", "o": ["I wrote it down so as not to forget it.", "I wrote it down not so as to forget it.", "I wrote it down in order to forget it.", "I wrote it down so that I would forget it.", "I wrote it down because I forgot it."], "a": 0, "e": "so that ~ wouldn't = so as not to"}, {"k": "bl", "q": "그녀는 선생님이 되기 위해서 열심히 공부한다. → She studies hard so (that) she can become a teacher.", "e": "목적 → so that"}, {"k": "bl", "q": "버스를 놓치지 않으려고 그는 뛰었다. → He ran in order (not) to miss the bus.", "e": "in order not to"}, {"k": "pk", "q": "I lowered my voice so that others [wouldn't*/would] hear me.", "e": "듣지 못하도록 → wouldn't"}, {"k": "pk", "q": "We left early in order [that*/to] we could avoid traffic.", "e": "주어 + 동사 앞 → in order that"}, {"k": "fx", "q": "Put the milk in the fridge so that it goes bad.", "w": "goes", "a": ["doesn't go", "won't go"], "e": "상하지 않도록 → doesn't go"}, {"k": "ox", "q": "She whispered so as not to wake her sister.", "a": true, "e": "✔ so as not to"}, {"k": "ox", "q": "Turn on the light so as to you can see.", "a": false, "e": "so that you can see / so as to see"}], "practiceB": [{"k": "wr", "q": "I turned off my phone so that I could focus on studying. → in order to를 써서 바꾸시오.", "a": ["I turned off my phone in order to focus on studying."], "e": "so that ~ could = in order to"}, {"k": "wr", "q": "She took a taxi so that she wouldn't be late. → so as not to를 써서 바꾸시오.", "a": ["She took a taxi so as not to be late."], "e": "so as not to"}, {"k": "or", "q": "모두가 들을 수 있도록 마이크를 사용해 주세요.", "a": "Please use the microphone so that everyone can hear you.", "e": "so that ~ can"}, {"k": "or", "q": "그는 살을 빼기 위해서 단 음식을 끊었다.", "a": "He stopped eating sweets so that he could lose weight.", "e": "과거 → so that ~ could"}, {"k": "fx", "q": "We wore masks in order that not to get sick.", "w": "that", "a": ["(삭제)"], "e": "in order not to + 동사원형"}, {"k": "fx", "q": "I'll write it down so as to remembering it.", "w": "remembering", "a": ["remember"], "e": "so as to + 동사원형"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ I left early so that I could catch the bus.\nⓑ She spoke softly so as not to wake the baby.\nⓒ We hurried in order not being late.\nⓓ He saved money in order that he could travel.\nⓔ Study hard so that you can pass the exam.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 옳음 / ⓒ in order not to be late"}, {"k": "ch", "q": "다음 중 '목적(~하기 위해서)'의 의미가 아닌 것은?", "o": ["I ran so that I could catch the bus.", "She whispered so that nobody would hear.", "He studied hard so that he could pass.", "It was so dark that I couldn't see anything.", "Open the window so that we can get some air."], "a": 3, "e": "④ so ~ that(너무 …해서 ~하다, 결과)"}, {"k": "bl", "q": "Bring a flashlight so (that) you can see in the dark.", "e": "목적 → so that"}, {"k": "bl", "q": "I'll set an alarm so as (not) to oversleep.", "e": "so as not to"}]}}, {"tag": "hk3-12-4-6", "name": "부사절을 이끄는 접속사: so ~ that …", "talk": [{"k": "m", "t": "부사절 접속사 ⑥ **so + 형용사/부사 + that** ~ = '**너무 …해서 ~하다**' (결과) 💥"}, {"k": "ex", "en": "The test was so difficult that only a few students passed.", "ko": "그 시험은 너무 어려워서 몇 명의 학생만 통과했다."}, {"k": "q", "q": "He ran ____ fast that nobody could catch him.", "o": ["so", "such", "too"], "a": 0, "ok": "맞아요! 부사(fast) 앞 → so", "no": "형용사·부사 앞 → so ~ that"}, {"k": "m", "t": "**such + (a/an) + 형용사 + 명사 + that** ~ → It was such a nice day that ~ / They are such kind people that ~"}, {"k": "q", "q": "It was ____ an exciting game that we shouted all night.", "o": ["so", "such", "too"], "a": 1, "ok": "정확해요! an + 형 + 명 앞 → such", "no": "a(n) + 형용사 + 명사 앞 → such"}, {"k": "m", "t": "⭐ 중3: **so + 형용사 + a + 명사** 어순도 OK = such + a + 형용사 + 명사 → It was so nice a day that ~"}, {"k": "m", "t": "⭐ **so many / much / few / little** + 명사 + that ~ → There were so many people that we couldn't move. (such many ✗)"}, {"k": "m", "t": "전환: so ~ that 주어 can't = **too ~ to** / so ~ that 주어 can = **~ enough to**"}, {"k": "m", "t": "⚠️ to부정사로 바꿀 때 문장 주어와 같은 목적어는 **빼기**: The box was so heavy that I couldn't lift it. = The box was too heavy for me to lift. (lift it ✗)"}, {"k": "m", "t": "정리! **so + 형·부 + that / such + a + 형 + 명 + that / so many·much·few·little / too ~ to · enough to (목적어 생략)** 👍"}], "notes": {"table": [["표현", "예", "뜻"], ["so + 형/부 + that", "He spoke so quickly that I couldn't understand him.", "너무 빨리 말해서 이해할 수 없었다"], ["such + a(n) + 형 + 명 + that", "She is such a good singer that everyone loves her.", "너무 훌륭한 가수라서 모두가 좋아한다"], ["so + 형 + a + 명 + that", "It was so nice a day that we went out.", "= such a nice day"], ["so many/much/few/little + 명", "I had so little time that I skipped breakfast.", "시간이 너무 없어서 아침을 걸렀다"], ["too ~ (for 사람) to", "The tea was too hot for me to drink.", "= so hot that I couldn't drink it"], ["~ enough to", "He is tall enough to reach the shelf.", "= so tall that he can reach it"]], "tips": ["so + 형용사 / such + a + 형용사 + 명사", "such many ✗ → so many", "too ~ to / enough to로 바꿀 때 주어와 같은 목적어(it, them) 삭제"]}, "sets": {"workbook": [{"k": "pk", "q": "The movie was [so*/such] funny that we laughed a lot.", "e": "형용사 앞 → so"}, {"k": "pk", "q": "She is [such*/so] a good singer that everyone loves her.", "e": "a + 형 + 명 앞 → such"}, {"k": "pk", "q": "There were so [many*/much] people that we couldn't find a seat.", "e": "셀 수 있는 명사 → many"}, {"k": "pk", "q": "He spoke so quickly that I [couldn't*/could] understand him.", "e": "너무 빨라서 이해 못함"}, {"k": "bl", "q": "나는 너무 졸려서 눈을 뜨고 있을 수 없었다. → I was (so) sleepy that I couldn't keep my eyes open.", "e": "so ~ that"}, {"k": "bl", "q": "그것은 너무 어려운 질문이어서 아무도 대답하지 못했다. → It was (such) a difficult question that nobody could answer it.", "e": "such + a + 형 + 명"}, {"k": "bl", "q": "그 물은 너무 차가워서 마실 수 없었다. → The water was too cold (to) drink.", "e": "too ~ to"}, {"k": "bl", "q": "그는 키가 충분히 커서 선반에 닿을 수 있다. → He is tall (enough) to reach the shelf.", "e": "~ enough to"}, {"k": "fx", "q": "It was such cold that the lake froze.", "w": "such", "a": ["so"], "e": "형용사 앞 → so"}, {"k": "fx", "q": "They are so nice people that everyone likes them.", "w": "so", "a": ["such"], "e": "형 + 복수명사 앞 → such"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? I had ____ little time that I skipped breakfast.", "o": ["so", "such", "too", "very", "enough"], "a": 0, "e": "so little + 명사 + that"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? The box was so heavy that I couldn't lift it.", "o": ["The box was too heavy for me to lift.", "The box was too heavy for me to lift it.", "The box was heavy enough for me to lift.", "The box was so heavy for me to lift.", "The box was such heavy that I couldn't lift it."], "a": 0, "e": "too ~ to (주어와 같은 목적어 it 삭제)"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["It was such a hot day that we went swimming.", "She was so tired that she fell asleep.", "He has so much homework that he can't go out.", "It was so a boring movie that I left early.", "They are such smart students that they won."], "a": 3, "e": "④ such a boring movie (또는 so boring a movie)"}, {"k": "bl", "q": "그 영화는 너무 슬퍼서 나는 울었다. → The movie was (so) sad that I cried.", "e": "so ~ that"}, {"k": "bl", "q": "그녀는 너무 친절한 사람이라서 모두가 그녀를 좋아한다. → She is (such) a kind person that everyone likes her.", "e": "such + a + 형 + 명"}, {"k": "pk", "q": "He is smart [enough*/so] to solve the puzzle.", "e": "~ enough to"}, {"k": "pk", "q": "The coffee was too hot for me [to drink*/to drink it].", "e": "주어와 같은 목적어 삭제"}, {"k": "fx", "q": "There were so much people that I couldn't breathe.", "w": "much", "a": ["many"], "e": "people(셀 수 있음) → many"}, {"k": "ox", "q": "It was such an interesting book that I read it twice.", "a": true, "e": "✔ such + an + 형 + 명"}, {"k": "ox", "q": "The question was too difficult for us to answer it.", "a": false, "e": "목적어 it 삭제 → to answer"}], "practiceB": [{"k": "wr", "q": "He is so young that he can't watch the movie. → too ~ to를 써서 바꾸시오.", "a": ["He is too young to watch the movie."], "e": "so ~ that can't = too ~ to"}, {"k": "wr", "q": "She is so strong that she can lift the box. → enough to를 써서 바꾸시오.", "a": ["She is strong enough to lift the box."], "e": "so ~ that can = enough to"}, {"k": "or", "q": "날씨가 너무 좋아서 우리는 공원에 갔다.", "a": "The weather was so nice that we went to the park.", "e": "so ~ that"}, {"k": "or", "q": "그것은 너무 멋진 공연이어서 우리는 계속 박수를 쳤다.", "a": "It was such a great show that we kept clapping.", "e": "such + a + 형 + 명"}, {"k": "fx", "q": "The soup was so salty that I could eat it.", "w": "could", "a": ["couldn't", "could not"], "e": "너무 짜서 먹을 수 없었다"}, {"k": "fx", "q": "It was so an amazing view that I took many photos.", "w": "so", "a": ["such"], "e": "an + 형 + 명 앞 → such"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ It was so windy that we stayed inside.\nⓑ She has such a big dog that kids are scared.\nⓒ There were so few people that the shop closed early.\nⓓ The bag was too heavy for me to carry it.\nⓔ He was such tired that he went to bed early.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓒ 옳음 / ⓓ it 삭제 / ⓔ so tired"}, {"k": "ch", "q": "다음 중 두 문장의 의미가 같지 않은 것은?", "o": ["He is so rich that he can buy the car. = He is rich enough to buy the car.", "The tea was so hot that I couldn't drink it. = The tea was too hot for me to drink.", "It was such a nice day that we went out. = It was so nice a day that we went out.", "She is so wise that she can give good advice. = She is too wise to give good advice.", "The river was so deep that we couldn't cross it. = The river was too deep for us to cross."], "a": 3, "e": "④ so ~ that can = wise enough to give"}, {"k": "bl", "q": "There was (so) little milk that I couldn't make pancakes.", "e": "so little + 명사"}, {"k": "bl", "q": "The shoes were so small that I couldn't wear them. = The shoes were too small for me (to) wear.", "e": "too ~ to (them 삭제)"}]}}, {"tag": "hk3-12-5", "name": "다양한 의미의 부사절을 이끄는 접속사", "talk": [{"k": "m", "t": "뜻이 여러 개인 접속사! **문맥**으로 해석해요 🔍 — **as · since · while**"}, {"k": "m", "t": "**as** ① ~할 때, ~하면서 ② ~ 때문에 ③ ~처럼, ~대로, ~듯이 ④ ~함에 따라"}, {"k": "ex", "en": "As we climbed higher, the air got thinner.", "ko": "더 높이 올라감에 따라 공기가 희박해졌다."}, {"k": "q", "q": "'Do as I tell you.'에서 as의 뜻은?", "o": ["~ 때문에", "~대로", "~함에 따라"], "a": 1, "ok": "맞아요! 내가 말하는 대로 → 방식", "no": "'내가 말하는 대로 해라' → ~대로"}, {"k": "m", "t": "**since** ① ~한 이후로 (주절 현재완료) ② ~ 때문에"}, {"k": "m", "t": "**while** ① ~하는 동안 ② ⭐ **~인 반면에**(대조) ③ ~이긴 하지만 → I like coffee, [while] my sister likes tea."}, {"k": "q", "q": "'While Tom is outgoing, his brother is shy.'에서 while의 뜻은?", "o": ["~하는 동안", "~인 반면에", "~ 때문에"], "a": 1, "ok": "정확해요! 대조 → ~인 반면에", "no": "외향적 ↔ 수줍음 (대조) → ~인 반면에"}, {"k": "m", "t": "⚠️ 전치사 **as**(~로서) + 명사 vs 접속사 as + 주어 + 동사: He works **as a nurse**. / He works **as his father did**."}, {"k": "m", "t": "⭐ 비례의 as는 주로 **비교급·변화 동사**(grow, get, become)와 함께: As she got older, she became [wiser]."}, {"k": "m", "t": "정리! **as 시간·이유·방식·비례 / since 시간·이유 / while 동안·반면에 / as + 명사 = ~로서** 👍"}], "notes": {"table": [["접속사", "의미", "예"], ["as", "~할 때 / ~ 때문에 / ~대로 / ~함에 따라", "As time passed, the pain went away."], ["since", "~한 이후로 / ~ 때문에", "Since it's raining, let's stay home."], ["while", "~하는 동안 / ~인 반면에", "My dad likes action movies, while my mom prefers dramas."], ["as (전치사)", "~로서", "She works as a nurse."]], "tips": ["since + 과거 & 주절 현재완료 → 시간 / 그 외 → 이유인지 확인", "while: 두 대상을 비교하면 '반면에'", "비례의 as + 비교급·get·grow·become"]}, "sets": {"workbook": [{"k": "pk", "q": "As I was leaving the house, the phone rang. → as의 뜻: [~할 때*/~ 때문에]", "e": "시간"}, {"k": "pk", "q": "Since it's raining, let's stay home. → since의 뜻: [~ 때문에*/~한 이후로]", "e": "이유"}, {"k": "pk", "q": "My dad likes action movies, [while*/since] my mom prefers dramas.", "e": "대조 → while"}, {"k": "pk", "q": "Leave everything [as*/while] it is. (있는 그대로)", "e": "방식 → as"}, {"k": "bl", "q": "그녀는 나이가 들수록 더 현명해졌다. → (As) she got older, she became wiser.", "e": "비례"}, {"k": "bl", "q": "나는 어렸을 때부터 그를 알아 왔다. → I have known him (since) I was little.", "e": "~한 이후로"}, {"k": "bl", "q": "내가 TV를 보는 동안 엄마는 요리를 하셨다. → (While|As|When) I was watching TV, my mom was cooking.", "e": "~하는 동안"}, {"k": "bl", "q": "그는 선생님으로서 존경받는다. → He is respected (as) a teacher.", "e": "전치사 as(~로서)"}, {"k": "fx", "q": "Do it because I showed you. (내가 보여 준 대로)", "w": "because", "a": ["as"], "e": "~대로 → as"}, {"k": "fx", "q": "Some people love winter, since others hate it. (반면에)", "w": "since", "a": ["while"], "e": "대조 → while"}], "practiceA": [{"k": "ch", "q": "다음 문장에서 while의 의미로 알맞은 것은? While my sister is tall, I am short.", "o": ["~하는 동안", "~인 반면에", "~ 때문에", "~한 이후로", "~하자마자"], "a": 1, "e": "대조"}, {"k": "ch", "q": "다음 중 as의 의미가 나머지와 다른 것은?", "o": ["As I was tired, I went to bed early.", "As it was a holiday, the bank was closed.", "As he was busy, he couldn't come.", "As the sun rose, the sky turned red.", "As she had a fever, she stayed home."], "a": 3, "e": "④ 시간(~할 때) / 나머지 이유"}, {"k": "ch", "q": "다음 중 since의 의미가 같은 것끼리 짝지어진 것은?\nⓐ Since you're here, help me.\nⓑ I've been happy since I met you.\nⓒ Since it was late, we went home.\nⓓ He has lived here since he was ten.", "o": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓒ", "ⓐ, ⓓ", "ⓒ, ⓓ"], "a": 1, "e": "ⓐⓒ 이유 / ⓑⓓ 시간"}, {"k": "bl", "q": "모두 알고 있듯이 그 시험은 다음 주이다. → (As) you all know, the exam is next week.", "e": "방식(~듯이)"}, {"k": "bl", "q": "그녀는 음악을 들으면서 공부했다. → She studied (while|as) she listened to music.", "e": "~하면서"}, {"k": "pk", "q": "[While*/Since] I respect your opinion, I can't agree with it. (~이긴 하지만)", "e": "while = ~이긴 하지만"}, {"k": "pk", "q": "She works [as*/like] a nurse at the hospital. (간호사로서)", "e": "전치사 as(~로서)"}, {"k": "fx", "q": "Since I was walking home, I saw a shooting star. (~하는 동안)", "w": "Since", "a": ["While", "As", "When"], "e": "~하는 동안 → While"}, {"k": "ox", "q": "As time passed, the pain went away.", "a": true, "e": "✔ 비례·시간의 as"}, {"k": "ox", "q": "Since he was a child, he lived in Busan.", "a": false, "e": "since(~ 이후로) → 주절 현재완료 has lived"}], "practiceB": [{"k": "wr", "q": "나는 들은 대로 했다. (did, as, was told)", "a": ["I did as I was told."], "e": "방식의 as"}, {"k": "wr", "q": "어떤 학생들은 수학을 좋아하는 반면에 다른 학생들은 과학을 좋아한다. (while)", "a": ["Some students like math while others like science.", "While some students like math, others like science.", "While some students like math others like science.", "Some students like math, while others like science."], "e": "대조 → while"}, {"k": "or", "q": "그는 나이가 들어감에 따라 더 조용해졌다.", "a": "As he grew older, he became quieter.", "e": "비례"}, {"k": "or", "q": "그녀가 떠난 이후로 3년이 지났다.", "a": "Three years have passed since she left.", "e": "since + 과거, 주절 현재완료"}, {"k": "fx", "q": "While it was too hot, we turned on the fan. (~ 때문에)", "w": "While", "a": ["As", "Since", "Because"], "e": "이유 → As"}, {"k": "fx", "q": "He has worked here since he graduate from college.", "w": "graduate", "a": ["graduated"], "e": "since절은 과거"}, {"k": "ch", "q": "다음 중 as의 쓰임이 <보기>와 같은 것은?\n<보기> As you can see, the room is very clean.", "o": ["As it was dark, I turned on the light.", "As I told you, he is very kind.", "As she grew up, she became shy.", "He works as a chef.", "As I was cooking, the doorbell rang."], "a": 1, "e": "<보기>·② 방식(~듯이)"}, {"k": "ch", "q": "다음 중 while의 의미가 나머지와 다른 것은?", "o": ["I fell asleep while I was reading.", "Someone called while you were out.", "While I was jogging, I met Jina.", "Tom likes pizza, while Jane likes pasta.", "Be quiet while the baby is sleeping."], "a": 3, "e": "④ 반면에 / 나머지 ~하는 동안"}, {"k": "bl", "q": "(As) the population grows, the city needs more schools. (~함에 따라)", "e": "비례"}, {"k": "bl", "q": "I prefer staying home, (while) my friends love going out. (반면에)", "e": "대조"}]}}, {"tag": "hk3-12-6", "name": "접속부사", "talk": [{"k": "m", "t": "마지막! 문장과 문장의 **논리 관계**를 보여 주는 **접속부사** 🧭 (중2 복습 + 중3 추가)"}, {"k": "m", "t": "대조: **however** 그러나 / ⭐ **nevertheless** 그럼에도 불구하고 / **on the other hand** 반면에"}, {"k": "m", "t": "결과: **therefore** · ⭐ **thus** 그러므로 / **as a result** 그 결과"}, {"k": "m", "t": "추가: **in addition · moreover · besides** 게다가 / 예시: **for example · for instance** 예를 들어"}, {"k": "q", "q": "The task was hard. ____, we finished it on time.", "o": ["Nevertheless", "Therefore", "For example"], "a": 0, "ok": "맞아요! 어려웠지만 그럼에도 → Nevertheless", "no": "어려움 ↔ 제때 끝냄 (대조) → Nevertheless"}, {"k": "m", "t": "기타: ⭐ **in other words** 다시 말해서 / **instead** 대신에 / **in fact** 사실은 / **otherwise** 그렇지 않으면"}, {"k": "ex", "en": "He speaks Korean and English. In other words, he is bilingual.", "ko": "그는 한국어와 영어를 한다. 다시 말해 그는 2개 국어를 한다."}, {"k": "q", "q": "Write it down. ____, you'll forget it.", "o": ["Otherwise", "Moreover", "In fact"], "a": 0, "ok": "정확해요! 그렇지 않으면 → Otherwise", "no": "적어 둬, 안 그러면 잊어 → Otherwise"}, {"k": "m", "t": "⚠️ 접속부사는 **부사** → 쉼표만으로 두 문장을 잇지 못해요: ~. However, ~ ✔ / ~, however ~ ✗ (but·so는 접속사라 한 문장 안 OK)"}, {"k": "m", "t": "🎉 Chapter 12 접속사 끝! 다음은 Chapter 13 **관계사** 🚀"}], "notes": {"table": [["관계", "접속부사", "뜻"], ["대조", "however / nevertheless / on the other hand", "그러나 / 그럼에도 불구하고 / 반면에"], ["결과", "therefore / thus / as a result", "그러므로 / 그 결과"], ["추가", "in addition / moreover / besides", "게다가"], ["예시", "for example / for instance", "예를 들어"], ["환언", "in other words", "다시 말해서"], ["기타", "instead / in fact / otherwise", "대신에 / 사실은 / 그렇지 않으면"]], "tips": ["접속부사 + 쉼표(,): Nevertheless, ~", "but·so = 접속사 / however·therefore = 부사(새 문장)", "otherwise = 그렇지 않으면 (명령문, or와 비슷)"]}, "sets": {"workbook": [{"k": "pk", "q": "I was very tired. [However*/Therefore], I couldn't fall asleep.", "e": "대조"}, {"k": "pk", "q": "It snowed all night. [As a result*/For example], the school was closed.", "e": "결과"}, {"k": "pk", "q": "This phone is light. [Moreover*/Instead], its battery lasts long.", "e": "추가"}, {"k": "pk", "q": "He is bilingual. [In other words*/Otherwise], he speaks two languages fluently.", "e": "다시 말해서"}, {"k": "bl", "q": "그는 아팠다. 그럼에도 불구하고 그는 출근했다. → He was sick. (Nevertheless|However), he went to work.", "e": "대조"}, {"k": "bl", "q": "우리는 택시를 타지 않았다. 대신에 걸었다. → We didn't take a taxi. (Instead), we walked.", "e": "대신에"}, {"k": "bl", "q": "많은 과일에 비타민이 들어 있다. 예를 들어 오렌지가 그렇다. → Many fruits have vitamins. For (example|instance), oranges do.", "e": "예시"}, {"k": "bl", "q": "코트를 입어라. 그렇지 않으면 감기에 걸릴 것이다. → Wear a coat. (Otherwise), you'll catch a cold.", "e": "그렇지 않으면"}, {"k": "fx", "q": "He didn't study at all. However, he failed the test.", "w": "However", "a": ["Therefore", "As a result", "Thus"], "e": "결과 → Therefore"}, {"k": "fx", "q": "The hotel was cheap. Instead, it was close to the beach. (게다가)", "w": "Instead", "a": ["In addition", "Moreover", "Besides"], "e": "추가 → In addition"}], "practiceA": [{"k": "ch", "q": "빈칸에 알맞은 것은? The rent is high. ____, the room is very small.", "o": ["In addition", "Instead", "For example", "Otherwise", "Therefore"], "a": 0, "e": "단점 추가 → In addition"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He practiced every day. ____, he became the best player on the team.", "o": ["However", "As a result", "On the other hand", "For instance", "Instead"], "a": 1, "e": "결과"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\nShe is shy. ____, her sister is very outgoing.\nHe is a night owl. ____, he stays up late every night.", "o": ["On the other hand – In other words", "Therefore – However", "In other words – On the other hand", "For example – Therefore", "Moreover – Instead"], "a": 0, "e": "대조 On the other hand / 환언 In other words"}, {"k": "bl", "q": "그 영화는 길었다. 그럼에도 불구하고 지루하지 않았다. → The movie was long. (Nevertheless|However), it wasn't boring.", "e": "대조"}, {"k": "bl", "q": "그는 매우 검소하다. 다시 말해, 돈을 거의 쓰지 않는다. → He is very thrifty. In other (words), he hardly spends money.", "e": "다시 말해서"}, {"k": "pk", "q": "Hurry up. [Otherwise*/Therefore], we'll miss the opening.", "e": "그렇지 않으면"}, {"k": "pk", "q": "He looks young. [In fact*/Otherwise], he is over fifty.", "e": "사실은"}, {"k": "fx", "q": "She trained hard. Therefore, she lost the race.", "w": "Therefore", "a": ["However", "Nevertheless"], "e": "대조 → However"}, {"k": "ox", "q": "It was raining, however we went out.", "a": false, "e": "It was raining. However, we went out. (또는 but)"}, {"k": "ox", "q": "I don't like horror movies. Instead, I watch comedies.", "a": true, "e": "✔ 대신에"}], "practiceB": [{"k": "wr", "q": "The test was difficult, but everyone passed. → nevertheless를 써서 두 문장으로 쓰시오.", "a": ["The test was difficult. Nevertheless everyone passed.", "The test was difficult. Nevertheless, everyone passed."], "e": "nevertheless"}, {"k": "wr", "q": "He missed the bus, so he was late. → as a result를 써서 두 문장으로 쓰시오.", "a": ["He missed the bus. As a result he was late.", "He missed the bus. As a result, he was late."], "e": "as a result"}, {"k": "or", "q": "열심히 일해라. 그렇지 않으면 해고될 것이다.", "a": "Work hard. Otherwise, you will be fired.", "e": "otherwise"}, {"k": "or", "q": "그녀는 고양이를 무서워한다. 반면에 그녀의 오빠는 고양이를 좋아한다.", "a": "She is afraid of cats. On the other hand, her brother loves them.", "e": "on the other hand"}, {"k": "fx", "q": "The food was delicious. Otherwise, the service was terrible.", "w": "Otherwise", "a": ["However", "Nevertheless"], "e": "대조 → However"}, {"k": "fx", "q": "Take your umbrella. Moreover, you'll get wet.", "w": "Moreover", "a": ["Otherwise"], "e": "그렇지 않으면 → Otherwise"}, {"k": "ch", "q": "의미상 자연스러운 것의 개수는?\nⓐ I was full. Therefore, I didn't eat dessert.\nⓑ He is rich. Nevertheless, he isn't happy.\nⓒ Leave now. In addition, you'll be late.\nⓓ She loves animals. For example, she has three cats.\nⓔ The road was icy. As a result, there were many accidents.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 3, "e": "ⓐⓑⓓⓔ 자연스러움 / ⓒ Otherwise"}, {"k": "ch", "q": "빈칸에 공통으로 들어갈 말은? (대·소문자 무시)\nI didn't go to the gym. ____, I went for a walk.\nWe had no sugar, so we used honey ____.", "o": ["Instead", "However", "Otherwise", "Therefore", "Moreover"], "a": 0, "e": "대신에 → instead"}, {"k": "bl", "q": "I wanted to go out. (However|Nevertheless), it started to rain.", "e": "대조"}, {"k": "bl", "q": "She is very generous. (For example|For instance), she donates money every month.", "e": "예시"}]}}], "chapterSets": {"write": [{"k": "wr", "q": "그도 그의 형도 그 경기에 참가하지 않았다. (Neither, nor, took part in the game)", "a": ["Neither he nor his brother took part in the game."], "e": "neither A nor B + 긍정 동사"}, {"k": "wr", "q": "나는 그녀가 그 제안을 받아들일지 궁금하다. (wonder, whether, accept the offer)", "a": ["I wonder whether she will accept the offer."], "e": "명사절 whether → will 그대로"}, {"k": "wr", "q": "너는 그가 무엇을 원한다고 생각하니? (think, want)", "a": ["What do you think he wants?"], "e": "think류 → 의문사 맨 앞"}, {"k": "wr", "q": "그가 거짓말을 했다는 사실이 나를 화나게 했다. (The fact, that, lied, made me angry)", "a": ["The fact that he lied made me angry."], "e": "동격 that"}, {"k": "wr", "q": "그 방은 너무 어두워서 우리는 아무것도 볼 수 없었다. (so, that, couldn't see anything)", "a": ["The room was so dark that we could not see anything.", "The room was so dark that we couldn't see anything."], "e": "so ~ that"}, {"k": "bl", "q": "(Now) that you're a middle school student, you should be more responsible.", "e": "now that = 이제 ~이니까"}, {"k": "bl", "q": "Not only the kids but also their father (was|is) excited about the trip.", "e": "B(their father)에 일치"}, {"k": "fx", "q": "Despite he was injured, he finished the marathon.", "w": "Despite", "a": ["Although", "Though", "Even though"], "e": "주어 + 동사 → Although"}, {"k": "fx", "q": "I don't know whether to call him or texting him.", "w": "texting", "a": ["text", "to text"], "e": "병렬: (to) call ↔ (to) text"}, {"k": "or", "q": "그는 시험에 통과하기 위해서 열심히 공부했다.", "a": "He studied hard so that he could pass the exam.", "e": "목적 → so that ~ could"}], "test": [{"k": "ch", "q": "빈칸에 알맞은 것은? Either the students or the teacher ____ to clean the room.", "o": ["has", "have", "are", "were", "be"], "a": 0, "e": "B(the teacher)에 일치 → has"}, {"k": "ch", "q": "빈칸에 알맞은 것은? I can't decide ____ to go to the party or not.", "o": ["if", "whether", "that", "what", "because"], "a": 1, "e": "to부정사 앞 → whether"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 바꾼 것은? Do you think? + Where did she go?", "o": ["Do you think where she went?", "Where do you think she went?", "Where do you think did she go?", "Do you think where did she go?", "Where did you think she go?"], "a": 1, "e": "think류 → 의문사 맨 앞 + 주어 + 동사"}, {"k": "ch", "q": "다음 중 that의 쓰임이 나머지와 다른 것은?", "o": ["It is clear that he is guilty.", "I heard the news that she got a job.", "The problem is that we have no time.", "The movie that we saw was scary.", "I believe that you can do it."], "a": 3, "e": "④ 관계대명사 / 나머지 명사절 접속사"}, {"k": "ch", "q": "빈칸에 알맞은 것은? Take a sweater ____ it gets cold at night.", "o": ["in case", "unless", "although", "so that", "as soon as"], "a": 0, "e": "~할 경우에 대비해 → in case"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? The question was so hard that we couldn't answer it.", "o": ["The question was too hard for us to answer.", "The question was too hard for us to answer it.", "The question was hard enough for us to answer.", "The question was such hard that we couldn't answer it.", "The question was so hard for us to answer."], "a": 0, "e": "too ~ to (주어와 같은 목적어 삭제)"}, {"k": "ch", "q": "다음 문장과 의미가 같은 것은? She got up early in order not to miss the bus.", "o": ["She got up early so that she wouldn't miss the bus.", "She got up so early that she missed the bus.", "She got up early, so she missed the bus.", "She got up early because she missed the bus.", "She got up early so as to miss the bus."], "a": 0, "e": "in order not to = so that ~ wouldn't"}, {"k": "ch", "q": "빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?\n____ the heavy rain, the concert continued.\n____ it rained heavily, the concert continued.", "o": ["Despite – Although", "Although – Despite", "Because of – Because", "Despite – Despite", "Because – Despite"], "a": 0, "e": "명사 앞 Despite / 절 앞 Although"}, {"k": "ch", "q": "다음 중 as의 의미가 <보기>와 같은 것은?\n<보기> As it got darker, it became colder.", "o": ["As I was sick, I stayed home.", "As you know, he is from Canada.", "As we went up, the air got cooler.", "She works as a pilot.", "Do as I say."], "a": 2, "e": "<보기>·③ 비례(~함에 따라)"}, {"k": "ch", "q": "어법상 틀린 문장은?", "o": ["I'll wait here until you finish.", "Now that you're here, we can start.", "I wonder what time the store opens.", "Unless you don't hurry, you'll be late.", "Every time I see him, he smiles."], "a": 3, "e": "④ Unless you hurry"}, {"k": "ch", "q": "빈칸에 알맞은 것은? He spent all his money. ____, he couldn't buy lunch.", "o": ["However", "As a result", "For example", "Otherwise", "Instead"], "a": 1, "e": "결과 → As a result"}, {"k": "ch", "q": "어법상 옳은 문장의 개수는?\nⓐ Neither my parents nor my sister likes spicy food.\nⓑ Whether he will come is not certain.\nⓒ Do you know how old is she?\nⓓ It was such a long trip that we were exhausted.\nⓔ Because of it was late, we took a taxi.", "o": ["1개", "2개", "3개", "4개", "5개"], "a": 2, "e": "ⓐⓑⓓ 옳음 / ⓒ how old she is / ⓔ Because"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Both the coach and the players are ready.", true], ["Not only Tom but also his sisters likes music.", false], ["I'm not sure whether to stay or leave.", true], ["Do you think who will win?", false], ["It is surprising that she quit her job.", true], ["I'll call you as soon as I get home.", true], ["Now that the exam is over, I can relax.", true], ["The game was canceled because the rain.", false], ["Bring a map in case you get lost.", true], ["Although he was tired, but he kept working.", false], ["She spoke slowly so that we could understand.", true], ["He is honest. Moreover, he is hardworking.", true]], "e": "ⓑ like ⓓ Who do you think will win? ⓗ because of ⓙ but 삭제"}, {"k": "m12", "q": "다음 12개 문장 중 어법상 틀린 것을 모두 고르시오.", "s": [["Neither you nor I am to blame.", true], ["The news that he won the prize is true.", true], ["If he will come or not is unclear.", false], ["Tell me where you bought this bag.", true], ["I wonder what did she say.", false], ["He has lived here since he was born.", true], ["We'll start when everyone will arrive.", false], ["Despite being sick, he went to school.", true], ["There were so many people that we couldn't move.", true], ["It was so an exciting game that we cheered.", false], ["My mom likes tea, while my dad likes coffee.", true], ["The box was too heavy for me to lift it.", false]], "e": "ⓒ Whether ⓔ what she said ⓖ arrives ⓙ such an exciting game ⓛ it 삭제"}, {"k": "wr", "q": "Although he was very nervous, he gave a great speech. → Despite를 써서 바꾸시오. (being)", "a": ["Despite being very nervous he gave a great speech.", "He gave a great speech despite being very nervous.", "Despite being very nervous, he gave a great speech."], "e": "despite + 동명사"}]}}, {"book": "hk3", "chapter": {"id": "13", "name": "관계사", "title": "해커스 중학영문법 3학년 · Chapter 13 관계사"}, "units": [{"tag": "hk3-13-1", "name": "관계대명사의 역할과 종류", "talk": [{"k": "m", "t": "Chapter 13은 **관계사**! 중2 내용을 복습하고, 중3에서는 **계속적 용법**과 **복합관계사**까지 가요 🔗"}, {"k": "m", "t": "관계대명사 = **접속사 + 대명사**. 앞의 명사(**선행사**)를 뒤에서 꾸미는 **형용사절**을 이끌어요"}, {"k": "ex", "en": "The woman who lives next door is a pilot.", "ko": "옆집에 사는 여자는 조종사이다."}, {"k": "m", "t": "선행사가 사람 → who / 사물·동물 → [which] / 둘 다 → that"}, {"k": "m", "t": "격에 따라: 주격 who·which / 목적격 whom·which / 소유격 [whose]"}, {"k": "q", "q": "The books which my uncle sent me ____ very old.", "o": ["is", "are", "be"], "a": 1, "ok": "맞아요! 주어는 The books → are", "no": "관계사절(which … me)을 묶어 두면 주어는 The books → are"}, {"k": "m", "t": "⚠️ 관계사절이 주어를 꾸미면 **관계사절을 괄호로 묶고** 주절 동사를 찾으세요: The girl (who sings) **is** …"}, {"k": "m", "t": "⚠️ 의문사 who '누구'와 구별! I know **who** broke it. (선행사 없음 — 누가 깼는지) / I know the boy **who** broke it. (선행사 the boy)"}, {"k": "q", "q": "관계대명사 who가 쓰인 문장은?", "o": ["Who is that man?", "I wonder who called me.", "I met a man who knows you."], "a": 2, "ok": "정확해요! 선행사 a man을 꾸미는 who", "no": "앞에 선행사(명사)가 있어야 관계대명사 → a man who …"}, {"k": "m", "t": "정리! **관계대명사 = 접속사 + 대명사 / 선행사 찾기 / 관계사절 묶고 주절 동사 수일치** 👍"}], "notes": {"table": [["선행사", "주격", "목적격", "소유격"], ["사람", "who", "whom (who)", "whose"], ["사물·동물", "which", "which", "whose / of which"], ["사람·사물·동물", "that", "that", "—"]], "tips": ["관계사절 안에 선행사를 가리키는 대명사(he, it)를 다시 쓰지 않기", "주절 동사는 주어(선행사)에 수일치 — 관계사절 속 명사에 속지 않기", "의문사 who / which는 선행사 없이 '누가 / 어느 것'"]}, "sets": {"workbook": [{"k": "pk", "q": "I have an uncle [who*/which] works at a bank.", "e": "사람 → who"}, {"k": "pk", "q": "This is the bridge [which*/who] was built in 1990.", "e": "사물 → which"}, {"k": "pk", "q": "The man who fixed our computers [was*/were] very kind.", "e": "주어 The man → was"}, {"k": "pk", "q": "The cookies which my aunt baked [taste*/tastes] great.", "e": "주어 cookies → taste"}, {"k": "bl", "q": "나는 그림을 잘 그리는 친구가 있다. → I have a friend (who|that) draws well.", "e": "사람 → who / that"}, {"k": "bl", "q": "그가 고친 의자는 튼튼하다. → The chair (which|that) he fixed is strong.", "e": "사물 → which / that"}, {"k": "ch", "q": "which의 선행사는?\nThe pictures of the city which my brother took are on the wall.", "o": ["The pictures", "the city", "my brother", "the wall", "took"], "a": 0, "e": "형이 찍은 것 = 사진들(The pictures)"}, {"k": "ch", "q": "두 문장을 한 문장으로 바르게 연결한 것은?\nThe bag is mine. + It is on the sofa.", "o": ["The bag which is on the sofa is mine.", "The bag which it is on the sofa is mine.", "The bag is on the sofa which is mine.", "The bag who is on the sofa is mine.", "The bag which is on the sofa are mine."], "a": 0, "e": "It → which, 주절 동사 is"}, {"k": "fx", "q": "The boy which broke the window said sorry.", "w": "which", "a": ["who", "that"], "e": "사람 → who / that"}, {"k": "fx", "q": "The movie that we watched it yesterday was scary.", "w": "it", "a": ["(삭제)"], "e": "that이 목적어 → it 빼기"}], "practiceA": [{"k": "ch", "q": "빈칸에 들어갈 관계대명사가 나머지와 다른 것은? (that 제외)", "o": ["I know a girl ____ plays the cello.", "The man ____ lives here is a chef.", "Look at the tower ____ stands on the hill.", "She is a nurse ____ works at night.", "We need someone ____ speaks Japanese."], "a": 2, "e": "③ tower(사물) → which / 나머지 사람 → who"}, {"k": "ch", "q": "who가 관계대명사로 쓰인 것은?", "o": ["Who made this cake?", "I don't know who she is.", "Tell me who called you.", "The girl who called you is Jimin.", "Who do you like best?"], "a": 3, "e": "④ 선
